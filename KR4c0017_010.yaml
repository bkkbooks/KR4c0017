body:
  text: 補注杜詩卷十宋黃希原本黃鶴補注别唐十五誡因寄禮部賈侍郎廣德二年作鮑曰賈至本傳寶應初轉禮部侍郎補注鶴曰按史廣德二年轉禮部侍郎永泰元年加集賢院待制當是廣德二年作九載一相逢百年能幾何洙曰古詩百年能幾何會少别離多蘇曰隂隲百年相逢花朝月夕高歌酣飲流官南北能得幾何補注鶴曰公以天寶十五載丙申避亂與唐相别至廣德二年乙未雖閲十甲而實九年故云子復為萬里别送子山之阿白鶴久同林潛魚本同河未知棲集期蒼舒曰右按文選謝靈運擬鄴中詩末塗幸休明棲集建薄質蘇曰劉據送蕭欵曰與君衰老又作别未知後會棲集何地衰老强高歌歌罷兩悽惻洙曰燕丹送荆軻入秦别于易水之上高漸離擊筑軻歌髮上衝冠士皆淚埀六龍忽蹉跎洙曰羲和以六龍御日蹉跎言遲暮也師曰謂衰老也相視髮皓白况難駐羲和師曰謂日月逝矣嵗不我與胡星墜燕地燕胡前切師曰旄頭星主胡云云謂祿山亂漢將仍橫戈師曰漢將即唐將唐承漢因謂之漢猶今承唐亦謂之唐朝補注鶴曰胡星指史朝義廣德元年已縊死李懷仙取其首至京師非為祿山與思明之死漢者謂中國如前詩云漢虜是也仍橫戈者以吐蕃未息蕭條四海內人少豺虎多趙曰胡星墜言今嵗上元元年史朝義殺其父思明也仍橫戈言史朝義襲僞位復為亂戰國䇿衛行人燭過免胄橫戈而進少人慎莫投多虎信所過饑有易子食洙曰宋華元夜登子反牀而告病曰易子而食析骸而爨獸猶畏虞羅洙曰虞羅可避之物而獸曰畏之至於父子之親而不能相保則可知矣子負經濟才蘇曰戴逵送王卞曰子負經濟之才幸遇明時胡為把犂鉏老于巖谷乎天門鬱嵯峩趙曰晉石苞傳天門泰山之稱記云太山盤道屈曲而上凡五十餘盤經小天門大天門又漢官儀曰太山東上七十里至天門所以稱嵯峩也飄颻適東周洙曰周平王東遷于洛故謂之東周來往若崩波南宮吾故人洙曰南宮禮部也定功曰按天官書南宮朱鳥權衡太微三光之庭藩臣將相執法郎位衆星咸在漢建尚書百官府名曰南宮蓋取象也蓋南宮猶南省非止稱禮部而已趙曰南宮蓋指言賈侍郎也故此篇末云云舊注以南宮為禮部非也補注鶴曰唐職林云舊說禮部郎中掌省中文翰謂之南宮舍人然則定功謂南宮猶南省為是白馬金盤陀雄筆映千古蘇曰羲獻筆畫雄徑映絶千古非羊欣輩比也見賢心靡他洙曰詩之死矢靡他言見賢之心出于誠一也念子善師事嵗寒守舊柯洙曰嵗寒然後知松柏之後凋以其不易柯葉也蘇曰班及嵗寒雪苦松柏不易舊柯雖艱險萬端君子不易節行矣師曰欲唐公無變節于賈公為吾謝賈公病肺卧江沱師曰甫有肺疾不及與賈公會集徒緬想而已託唐生以謝罪柟木為風雨所拔歎永泰元年五月作補注鶴曰柟木在成都草堂之前而師以虎倒龍顛喻嚴武之死則是詩作於永泰元年五月蓋武以其年四月死按史永泰元年三月大風拔木而此詩云五月髣佛聞寒蟬東南飄風動地至又非三月為風所拔師古之說或是梁權道編在廣德二年若在其年則公方自閬州回成都再依嚴武不應詩語乃云爾倚江柟樹草堂前故老一云古老相傳二百年誅茅卜居總為此趙曰屈原問漁父云誅鋤草茅以力耕乎五月髣佛聞寒蟬東南飄風動地至洙曰老子曰飄風不終朝江翻石走流雲氣洙曰莊子雲氣不待族而雨蘇曰漢四年大風起東南江浪翻吼沙驚石走林木多折幹排雷雨猶力爭根斷泉源豈天意滄波老樹性所愛浦上童童一青蓋洙曰蜀先主舍東南有一木遙望之童童若車蓋野客頻留懼雪霜行人不過聽竽籟洙曰莊子言地籟風作則萬竅怒號前者唱于而隨者唱喁泠風則小和飄則大和趙曰言其聲之鼓動如之宋玉高唐賦云纎條悲鳴聲似竽籟舊注止引莊子地籟似之而非矣虎倒龍顛委榛棘淚痕血㸃埀胸臆趙曰乃下和淚盡繼之以血也我有新詩何處吟草堂自此無顔色師曰楩柟祀梓天下之良材柟樹為風雨所拔喻嚴武死于蜀甫無所依故歎惜之上元二年嚴武鎮成都甫自閬州挈家往依之武歸朝廷甫浮游左蜀諸郡往來非一武再鎮兩川奏為節度參謀檢校工部員外郎永泰元年夏武卒郭英乂代之甫失所依乃泛江移䕫州大厯三年春下峽至荆南詳味此詩殆為嚴武而發歎焉甫築草堂于成都浣花里甫為得此樹以為遊息覆庇其下猶賴武以庇焉今也如虎倒龍顛是使草堂之人而無所棲託故云草堂自此無顔色茅屋為秋風所破歌永泰元年作蘇曰古之封諸侯分之以茅土所謂茅屋者制節之方州也風號令也所以鼓舞萬民和四方之義也天寶十四載祿山起漁陽之師詭言奉詔誅楊國忠是謂義兵號令天下陷河北郡縣是謂茅屋破也趙曰十二詩皆上元二年之作師曰甫以嚴武鎮成都遂往依之不幸武死郭英乂代武為節度甫由是見知英乂託以為庇兼與楊子琳柏正節相約結崔旰殺英乂併攻楊子琳柏正節是卷三重茅之義也補注鶴曰唐自天寶之亂民不得其居處者甚多公因茅屋為秋風所破遂思廣厦千萬間之庇其為憂國憂民之念至矣師古謂此詩託以諭崔旰之亂要之自不必專指旰而作蓋安史為禍于關內山東河北者已為極盛吐蕃又復入寇于是隴蜀多為踐擾廣內且有太一之變江浙且有袁鼂之禍二川復有段子璋徐知道崔旰相繼而反詩所謂牀牀屋漏無乾處是也永泰元年夏公去成都下忠渝草堂已不得而居秋晚在雲安縣有雲安九日詩則是年秋公已不在成都豈見茅屋為秋風所破其作此詩者以郭英乂好殺如秋風公在成都值嚴武之死欲再依英乂而英乂驕縱不可托故舍之而去所以託言茅屋為秋風所破蓋深有所感傷也八月秋高風怒號修可曰莊子大塊噫氣其名為風唯是無作作則萬竅怒號也卷我屋上三重茅蘇曰八月隂中也隂以肅殺為事秋高風怒號者秋于五性為義天寶十四載十一月九日范陽節度使安祿山率藩漢兵十餘萬自幽州南向指闕詭言起義以誅楊國忠為名其怒號之甚也卷我屋上三重茅者是時方陷三郡謂先殺太原尹楊光翽于博陵郡十二月六日陷陳留郡殺張介然九日陷滎陽郡殺太守崔無詖故云卷三重茅也茅飛度江灑一作滿江郊高者挂罥長林梢鄭曰罥古犬切下者飄轉沉塘坳蘇曰分茅之臣悉皆奔逃濱于患難之側而不顧者若范陽副使封常清三與戰皆不勝西奔陜高仙芝鎮陜棄城西保渭關故曰灑江郊也高者以義為高也林君也肅宗即位靈武𤣥宗在蜀長林也高義之臣扈從左右如韋見素陳𤣥禮故曰挂罥長林稍也塘坳泥塗也下者卑汙喪節處于泥塗是時河北二十四郡俱為所陷如譙守陽萬石令狐潮楊希文劉貴哲皆附賊其後潮亦說張巡曰盍相從以茍富貴可謂飄轉而不能自守也南村羣童欺我老無力忍能對面為盜賊公然抱茅入竹去脣焦口燥呼不得蘇曰南明也村鄙也童無知也明明鄙野無知之輩以我國家師老而莫能為之敵所以盜吾土疆賊吾善良故令狐潮說張巡曰本朝危蹙兵不能出關天下事去矣豈非欺我老無力也平原太守顔真卿以食盡援絶棄郡渡河于是河北郡縣盡陷賊豈非對靣為盜賊也竹制節也公然抱茅入竹者祿山反顔杲卿袁履謙緋袍令與假子守土門所謂抱茅制節者也杲卿謂祿山曰汝營州牧羊羯奴竊荷恩寵天子負汝何事而乃反乎祿山怒縛之節解而罵不絶賊鈎斷其舌杲卿含胡而絶不得者是張巡保睢陽使南霽雲詣賀蘭進明告急賀蘭無意出援兵且張樂以大享霽雲言城中食盡力屈賀蘭不聽遂截指示信竟不食而去豈非呼不得也趙曰韓詩外傳曰乾喉焦唇仰天而嘆曹子建善哉行曰來日大難口燥唇乾蓋公參用之也歸來倚杖自歎息俄頃風定雲墨色蘇曰甫嘗與韋宙同陷賊遁歸行在所此所以欷歔嘆息也方是時張巡許逺搗其腹心而賊勢遂衰四方掎角而祿山詭言之號令無所施猶風之定也雲墨色者雲喻禮樂法度墨色不明也天子蒙塵西幸忠臣繼踵而陷賊禮樂法度無自而明秋天漠漠向昏黑布衾多年冷似鐵嬌兒惡卧踏裏裂蘇曰秋義也望天子以義理天下今也宦堅蔽其明女謁侈其心漠漠而無所察治向昏者埀老之晚年也黑不明也明皇晚年高力士導其欲太真妃迷其情豈非向昏而黑也布者女工之本儉之所尚也衾者所以衣被也以布為衾蓋以恭儉而衣被天下且置之而不用所以冷而似鐵鐵黑金也而以斬殺為事斬殺則少恩明皇末年非惟不知崇儉以衣被天下又且少恩以徇太真妃之欲也嬌兒太真妃也卧安寢也太真妃搖其安謂嘗以祿山為養子出入宮掖不禁穢醜稔聞而明皇不悟祿山出范陽與太真妃為內外援且令進竒禽異物以蠱帝心宰相太子多言其反太真妃力保之故帝不信及漁陽難作且約太真妃為之內應朝廷機謀祿山靡所不知豈非踏裏裂也牀牀屋漏無乾處雨腳如麻未斷絶蘇曰牀人所即以為安也牀牀四方之所安居者屋漏無乾處者謂今皆陷于泥塗是時滄趙見拔博平陷虜潼關失守南破宛洛張介然崔無詖死其城郭李憕盧奕蔣青死其官所謂如麻未斷絶者蓋天下浸淫于塗泥未有已也揚雄嘗曰震風凌雨然後知厦屋之為帡幪故甫以雨腳未斷言其亂之滋也自經喪亂少睡眠長夜沾濕何由徹蘇曰祿山父子僭竊於三年之間四方騷然不遑安枕豈非少睡眠也蜀道尚艱難靈武未還內故謂之沾濕何由徹也安得廣厦千萬間趙曰白樂天詩我願布裘千萬丈與君同蓋洛陽城然近乎戲語豈有萬丈之裘乎若公言千萬問之廣厦二公之言自有深㫖大庇天下寒士俱歡顔風雨不動安如山蘇曰亂而願治憂而思樂忠臣義士之常心甫于是時官卑位下身親罹之力無所施不免傷今思古而欲得庇覆天下之蒼生謂其歡然懷歸尚未忍棄去高祖太宗之遺烈故欲復安之使無震風凌雨之虞故曰不動安如山也嗚呼何時眼前突兀見此屋吾廬獨破受凍死亦足蘇曰嗟歎之不足故永歌之甫遇亂而願治其所以嗟嘆永歌者蓋寫其憂憤之心兾欲有興衰撥亂之主而康濟王室以成巍巍突兀之功謂之何時者所望之誠至也吾廬獨破受凍死亦足者祿山之亂天子入蜀甫走鳯翔謁肅宗授拾遺與房琯少為布衣交至德元年七月二十一日琯敗于陳陶斜罷相甫上疏言琯罪細不宜免肅宗怒詔吏推問後意解出為華州司功曹然不甚省録時寇亂甫家鄜彌年孺弱至餓死繼而棄官去客秦州負薪採橡栗自給故其斷章所以言死亦足也左傳楚申叔展問還無社曰有麥麴乎有山鞠藭乎注二物可以禦濕欲使無社逃泥水中時子美方為嚴武所不容詩之作其近于此乎趙曰按舊注引楚申叔展言為嚴武所不容然所引事迹與意大不相同十二詩皆上元元年之作嚴武鎮蜀初則廣德元年公在梓州再則廣德二年公在幕中故定為上元元年之秋也假使舊注不引左氏又不誤指嚴武直論詩意豈有府尹不相容者乎入奏行寶應元年作彥輔曰贈西山檢察使竇侍御補注鶴曰考新舊史會要諸書無檢察使唯有巡察觀察按察之名而已然歐陽詹集乃有送韋檢察詩又似史失書梁權道編在廣德二年成都詩內詩云繡衣春當霄漢立若是二年春則在梓閬送其入奏却不在成都詩又云天子亦念西南隅則是西山諸州未沒吐蕃前作故詩又云八州刺史思一戰三城守邊却可圖此行入奏計未小密奉聖旨恩宜殊詳觀詩語乃是寶應元年春在成都作蓋廣德元年二年春公俱不在成都今此詩末云江花未落還成都肯訪浣花老翁無以為二年春在梓州閬州作是詩公知嚴武再鎮成都期于必歸浣花故有此語然八州又已沒于吐蕃故定為寶應元年更俟博考竇侍御驥之子鳯之雛修可曰桓談新論曰善相馬者曰薛公得馬惡貌而正走其名驥子又易林曰鳯生五雛補注希曰梁元帝啓云價匹龍媒聲有驥子又龎統者德公之從子德公謂為鳯雛晉陸雲幼時吳尚書閔鴻見而竒之曰此兒若非龍駒當是鳯雛北齊裴景鸞景鴻河東聞喜人並有逸才河東人呼景鸞為驥子年未三十忠義俱骨鯁絶代無洙曰唐李吉甫傳君有骨鯁之忠臣趙曰骨鯁者剛正之謂如肉之有骨而魚之有鯁炯如一段清冰出萬壑鄭曰炯户頂反光也置在迎風寒露之玉壺洙曰漢有迎風寒露之館古詩瑩若玉壺冰言清徹也蔗漿歸㕑金碗凍洙曰晉張協蔗賦曰挫斯蔗以療渴若漸醪而含蜜右按前漢書禮樂志秦尊拓漿取甘柘汁以為飲也蔗與柘同趙曰宋玉招魂云燸鱉炮羔有蔗漿定功曰前漢禮樂志景星歌秦尊拓漿析朝酲注取甘柘汁以為飲可解酲也柘音蔗舊注所引似之而非洗滌煩熱足以寧君軀政一作整用疏通合典則戚聯豪貴耽文儒兵革未息人未蘇天子亦念西南隅吐蕃慿陵氣頗粗洙曰時吐蕃欲取成都為東府竇氏檢察應時須運糧繩橋壯士喜洙曰繩橋以竹繩為橋也斬木火井窮猿呼洙曰火井地名鄭曰在蜀修可曰博物志曰臨卭有火井縱廣五尺深十餘丈諸葛丞相往觀後火井益盛以盆著井煮鹽得熟補注鶴曰繩橋在成都即笮橋寰宇記云水涸時以火投井中即熖出移時方滅今在蓬州公即指蓬州火井而言八州刺史思一戰三城守邊却可圖趙曰西山三城也補注鶴曰按唐志劍南節度使西抗吐蕃南撫蠻獠統團結營及松維蓬恭雅黎姚悉等八州兵馬三城當是青海三城此行入奏計未小密奉聖㫖恩宜殊繡衣春當霄漢立漢繡衣御史綵服日向庭闈趨洙曰老萊綵服以娛親修可曰束晢補亡詩眷戀庭闈省郎京尹必俯拾蘇曰薛光戲友人曰古人云青紫可俯拾吾令尹亦可俯拾江花未落還成都肯訪浣花老翁無洙曰一云公來肯訪浣花老為君酤酒滿眼酤與奴白飯馬青芻洙曰又云携酒肯訪浣花老為君著衫捋髭鬚師曰吐蕃分三道入寇欲取成都為東府竇氏以御史出檢察諸州軍儲器械得以便宜入奏甫作是詩以贈之驥子鳯雛皆不凡也逆耳之言比之骨鯁漢武帝置迎風寒露之館玉壺貯冰言其瑩徹也蔗漿可以除煩天子方憂吐蕃不無內熱今竇生入奏忠言上沃帝心如蔗漿然疏通其施為無所蔽也髙祖皇后竇氏侍御正其族也故云戚聯豪貴雖云外戚尤好儒學西南隅謂蜀也須乃軍興所須也蜀人以竹索為橋謂之繩橋地理志卭州有火井縣在州西六十二里斬木將以為栅猿依于木今既盡斬之則猿窮而失所是以號呼八州謂彭加黎簡嚴陵雅卭三城謂姚維松皆當吐蕃之衝兵有攻有守八州可攻三城可守奏其事于朝廷以取天子之命甫謂必蒙殊恩省郎京尹如俯拾地芥行色當春秋間可還成都故云江花未落也漢暴勝之衣繡衣持斧出使故云繡衣春當霄漢立立謂立對于天陛甫築草堂居成都浣花里自稱浣花翁滿眼酤謂滿前士卒皆有勞也甫約竇歸來不遺寒賤儻賜光訪當酤酒宴集下至車從僕𨽻皆待以殊禮蓋所以尊重于竇故也大雨寶應元年作補注鶴曰按公寶應元年建卯月成都春旱說云蜀自十月不雨抵建卯非雩之時奈久旱何意此詩是寶應元年在浣花作故詩云西蜀冬不雪春農尚嗷嗷上天回哀眷朱夏雲鬱陶乃夏方雨至而梁權道編在廣德二年若在其年夏則公自閬州歸在嚴公幕中豈有敢辭茅葦漏等句西蜀冬不雪春農尚嗷嗷洙曰搜神記曰萬物樵枯百姓嗷嗷言旱甚也蘇曰呂尚曰方今亢陽百卉俱槁東作不入民嗷嗷而怨嗟望修仁德厭此武王從之上天回哀眷蘇曰漢文帝上天昭明曲回哀眷憫此黎民朱一作清夏雲鬱陶洙曰謝靈運詩幽居猶鬱陶孟子載象謂舜鬱陶思君耳蓋鬱結于陶窑之義故可使於朱夏之雲也執熱乃沸鼎纎絺成緼袍洙曰詩誰能執熱劉陶養魚沸鼎秋興賦釋纎絺語有衣敝緼袍風雷颯萬里霈澤施蓬蒿敢辭茅葦漏已喜黍豆高三日無行人二洙曰一作大江聲怒號洙曰蜀都賦帶二江之雙流莊子萬竅怒號禹稱曰二江涪江巴江也補注希曰寰宇記云秦李冰穿二江于成都城中皆可行舟今謂內江外江是也蜀都賦云帶二江之雙流故有雙流縣又按風俗通云秦昭王遣李冰為蜀太守開成都兩江溉田萬頃又唐志成都府有二江府流惡邑里清矧兹逺江臯趙曰左傳有汾澮流其惡今言大雨所蕩亦流出穢惡也荒庭步鸛鶴洙曰蓋鶴鳴則雨應也隱几望波濤沉疴聚藥餌頓忘所進勞趙曰言以沉疴之故而聚藥餌今得大雨清涼于是頓忘供進藥餌之勞也則知潤物功可以貸不毛洙曰諸葛亮傳五月渡瀘深入不毛言不生物也趙曰因雨之潤雖不毛之地亦假貸而生補注鶴曰漢西南夷傳不毛之地師古注不毛言草木不生也隂色靜壠畝勸耕自官曹四鄰出耒耜何必吾家操蘇曰王褒喜見四鄰耒耜之具揚旗廣德二年作彥輔曰三年夏六月成都尹鄭公置酒公堂觀騎士試新旗幟俯曰代宗大厯三年甫離峽中之荆南夏六月鄭公置酒公堂觀騎士旗幟將平吐蕃之難而作此詩補注鶴曰詩云三州陷犬戎蓋指廣德元年十二月吐蕃陷松維保三州則詩作于廣德二年詩又云江雨颯長夏府中有餘清蓋公是時在嚴武幕府故云江洙曰一作風雨颯長夏石曰夏日長故云長夏颯動也府中有餘清蘇曰張敞新秋雨過民事簡府中景物有餘清我公會賓客肅肅有異聲君平曰鄭公持軍嚴肅有殊異聲名初筵閲軍裝羅列照廣庭庭空六洙曰一作四馬入蘇曰任安等六馬騎直入安西都護府駊騀揚旗旌鄭曰上布可切下五可切馬搖頭也洙曰甘泉賦崇邱陵之駊騀兮駊騀山阜之高貌也回回偃飛蓋洙曰劉公幹詩回回自昏亂曹子建詩飛蓋相追隨倪曰回回勢回旋也熠熠迸流星洙曰河東賦掉奔星之流旌又校獵賦曳彗星之飛旗來纒洙曰一作衝風飇急去擘山嶽傾彭曰言揚旗去來之狀其疾速若此材歸俯身盡洙曰鮑昭詩俯身散馬蹄妙取略地平虹霓就掌握舒卷隨人輕洙曰高唐賦霓為旌王沉賦曳招搖之修旗婉若虹之埀天選虹旗攝麾而就卷三州陷犬戎趙曰言去年十一月吐蕃陷松維保三州但見西嶺青公來練猛士欲奪天邊城蘇曰班超謂將佐曰與君等仗天子之威靈搗氐羌奪天邊之城斷其左臂與月氐首亦不易也補注鶴曰按史廣德元年十二月丙申吐蕃陷松維二州唐志松維保三州皆云廣德元年沒吐蕃通鑑云吐蕃陷松維保三州及雲山松築二城西川節度使高適不能救于是劍南山西諸州亦入于吐蕃今詩云三州陷犬戎但見西嶺青正謂此如王彥輔徐俯之說皆非且嚴武以永泰元年四月卒安得更在大厯三年若以為在永泰元年武未卒之前作此詩中必言拔當狗城克鹽川城何為却無一語及之今詩又云公來練猛士欲奪天邊城謂欲攻吐蕃是年九月果敗之此堂不易升洙曰言食人之祿當懷人之憂也蘇曰王戎見陸達議論久之退回視達居堂曰吾終日不易升此堂庸蜀日已寧吾徒且加餐休適蠻與荆洙曰見近聞犬戎逺遁逃注書庸蜀微盧古詩上言加餐飯王仲宣七哀詩復棄中國去逺身適荆蠻趙曰相勸加餐飯而不必捨去以嚴公之故也師曰甫終去蜀之荆蠻且為是辭以美鄭公云溪漲寶應元年作補注鶴曰以前篇大雨詩論之當是寶應二年夏作二江之聲且至于怒號浣花豈容不泛溢梁權道編在廣德二年恐非且舊次在戲贈友之前戲贈友云元年建已月則此作于寶應元年亦無疑如梁所編則是年秋客嚴公幕中不應詩却云當時浣花橋溪水才尺餘秋夏忽泛溢豈惟入吾廬又可知是寶應元年在浣花作是年秋公送嚴公至縣當時浣花橋溪水才尺餘白石一作月明可把洙曰艷歌行水清石自見趙曰水之清淺而石可見也詩白石鑿鑿水中有行車洙曰華陽風俗録浣花亭在州之西南當江流至清之所也其淺可涉故中有行車甫有宅在焉秋夏忽泛溢豈惟入吾廬洙曰莊子秋水時至百川灌河陶潛詩吾亦愛吾廬蛟龍亦狼狽况是鱉與魚洙曰七發說濤云其旁作而奔起也六駕蛟龍附從太白又云橫暴之極魚鱉失勢趙曰狼與狽本二獸各半其體相附而行茍失其一則無據矣故倉皇失據者謂之狼狽師曰蛟龍喻君子魚鱉喻小人兹晨已半落歸路跬步踈馬嘶未敢動趙曰跬音邱弭切舉一足也與蹞同荀子云不積跬步無以致千里逢原曰半步曰跬前有深填淤衣虛切田曰前漢溝洫志填淤反壤之害顔師古曰填淤謂壅泥也師曰君子遇險而止此處亂世之道也補注希曰溝洫志淤音於庶反而公作平聲東坡亦云楚麥滿河淤後山亦云乞我黃淤千里秋青青屋東麻散亂牀上書蘇曰陳璋亂後歸中條與兄琳書曰屋牖網蜘蛛几案䝉塵牀書散亂鄰星零替憫然不聊生意不意逺山雨夜來復何如我遊都市間晚憩必村墟趙曰言晝日遊成都市晚必憩息於村墟村墟指言草堂也乃知久行客終日思其居戲贈二友寶應年作補注鶴曰詩云元年建已月其年公在成都是月𤣥宗升遐焦校書王司直當是居于成都公故與之友善詩作於其年元年建已月洙曰肅宗去上元三年年號止稱元年月以斗建辰為名也師曰肅宗止稱元年復以月建之辰稱月蓋法上古之制也年號自漢武帝方有之甫特於此年以元年建已月為稱記肅宗之立尚古制不然何以謂之詩史乎郎有焦校書補注鶴曰焦校書意在焦遂與李白號為酒八仙者唐史拾遺云遂口吃對客不出一言醉後酬答如注射今詩云自誇足膂力又云欲得東擒胡豈醉後語耶自誇足膂力能騎生馬駒一朝被馬踏唇烈板齒無壯心不肯已欲得東擒胡趙曰公使魏武帝樂府云老驥伏櫪志在千里烈士暮年壯心不已師曰胸腸之間曰膂生馬駒其馬未調習者板大齒也仲尼嘗譏子路暴虎馮河死而無悔為其好勇故也此詩雖云諧戲亦為好勇者之戒元年建已月官有王司直補注鶴曰即公作短歌行見王郎司直者短歌行云青眼高歌望吾子則與之友厚有素王嘗得西諸侯舟經錦水乃有此作與馬驚折左臂骨折靣如墨洙曰國語望之如墨駑駘漫染泥何不避雨色師曰觀此詩有何不避雨色之句蓋為躁進者之戒云勸君休歎恨未必不為福洙曰此詩所諷近白居易新豐折臂翁趙曰淮南子云塞上翁馬亡入胡人皆弔之曰何知非福居數月其馬引胡駿馬而歸人皆賀之曰何知非禍及家富馬良其子好騎墮而折體人又弔之曰何知非福居一年胡人大入丁壯戰死者十九其子獨以跛故父子得獲相保舊注引居易折臂翁穿鑿矣觀打魚歌寶應元年作補注鶴曰公以寶應元年秋送嚴武至綿州此詩乃其時作故詩云綿州江水之東津綿州江水之東津魴魚鱍鱍色勝銀洙曰詩魴魚赬尾鱍鱍跳躍貌修可曰爾雅曰魴魾也今之鯿魚是陸璣疏曰魴魚廣而薄肥甜而少肉細鱗魚之美者補注鶴曰唐子西將家逰治平院詩注蓋老杜所謂東津者也詩正義云衛人埀一魴之餌以釣鰥鰥過而不視則魴為中魚陸云伊洛濟潁魴魚廣而薄肥甜而少肉細鱗魚之美者遼東梁水魴特肥而厚尤美於中國漁人漾舟沉大網截江一擁數百鱗衆魚常才盡却棄赤鯉騰出如有神洙曰陶𢎞景本草曰鯉最為魚中之主形可愛又能神變乃至飛越山湖所以琴高乘之也潛龍無聲老蛟怒回風颯颯吹沙塵饔子左右揮霜刀鱠飛金盤白雪高洙曰西征賦饔人縷切鑾刀若飛應刃落俎靃靃霏霏徐州禿尾不足憶漢隂槎頭逺遁逃洙曰禿尾查頭皆魚名補注希曰張景陽七命曰乃命支離飛雙鍔紅肌綺散素膚雪落漢中鯿魚肥美襄陽禁捕遂以槎斷水因謂之槎頭縮項鯿張敬兒為刺史齊高帝取此魚敬兒作書進曰奉槎頭縮項鯿一千八百頭故峴潭云試埀竹竿釣果得槎頭玉魴魚肥美知第一既飽歡娛亦蕭瑟趙曰廣州記曰魴魚廣而肥甜魚之美者也君不見朝來割素鬐咫尺波濤永相失師曰綿州屬西川道魚善變化乃龍之類老蛟怒惡傷其類也秃尾槎頭縮項皆魚之名既飽歡娛亦蕭瑟謂樂極則哀繼之春秋隱公矢魚于棠聖筆書之以為譏甫此詩初敘得魚之樂而未則有咫尺波濤永相失之句豈非得聖人危亡之戒耶又觀打魚寶應元年作補注鶴曰詩云東津觀魚已再來當是同上年作雖廣德元年公再至綿乃春晚詩云干戈兵革鬪未止蓋指吐蕃與史朝義之亂未息而言也蒼江漁子清晨集設網提綱萬洙曰一作取魚急能者操舟疾若風撑突波濤挺義入洙曰顔回濟于觸深之泉見操舟者若神西征賦徒觀其鼓柂回輪灑鈎投網埀餌出入挺義來往也定功曰莊子云津人之操舟若神潘安仁西征賦埀餌出入挺義來往小魚脫漏不可紀半死半生猶戢戢大魚傷損皆埀頭屈强泥沙有時立鄭曰屈强正作倔渠勿切梗戾也洙曰蜀志曰武陽小魚大如針一斤千頭蜀人以為醬七發云其根半死半生東津觀魚已再來主人罷鱠還傾杯日暮蛟龍改窟穴趙曰以言打魚之故而驚動神物也山根鱣鮪隨雲雷修可曰郭璞注爾雅曰鱣大魚似鱏而鼻短口在頷下體有斜行甲無鱗肉黃江東人呼為黃魚補注鶴曰詩注云鱣大鯉鮪說文云鮥也詩正義云似獻鱣而青黑周禮漁人春獻王鮪鮪春時始出故特之干戈兵革鬪未已一云干戈革鬪尚未已鳯凰麒麟安在哉吾徒胡為縱此樂暴殄天物聖所哀洙曰春秋繁露曰恩及蟲魚則麒麟至孝經援神契曰德至鳥獸則鳯凰翔師曰自祿山之亂干戈日尋蛟龍改窟穴鱣鮪隨雲雷喻賢人君子遇亂而遁迹也聖人仁及草木昆蟲今於戰鬪之際復暴殄天物若此仁人君子忍為之乎補注希曰書武成云暴殄天物害虐蒸民借此以喻取魚之虐也越王樓歌寶應元年作補注鶴曰寶應廣德公皆至綿而此詩當是寶應元年初至時作詩云綿州州府何磊落蓋創見之辭也綿州州府何磊落顯慶年中越王作洙曰太宗子越王貞也顯慶中為綿州刺史創此樓顯慶中宗年號趙曰作者言其作綿州也補注鶴曰按新舊史越王貞太宗第八子未嘗為綿州第始封漢王漢與綿為鄰耳前乎貞有衛王泰以貞觀二年封越王後乎貞有趙王係以乾元二年封越王然亦皆未嘗刺綿州且顯慶非中宗年號乃高宗年號凡五年在龍朔之前王注為非此詩云顯慶年中越王作又云君王舊迹今人賞意是中睿宗曾受此封及刺此州故曰君王蓋史失書孤城西北起高樓洙曰古詩西北有高樓上與浮雲齊碧瓦朱甍照城郭趙曰神仙傳蔡少霞夢人請書新宮銘有云碧瓦鱗差沈佺期詩紅日照朱甍樓下長江百丈清山頭落日半輪明君王舊跡今人賞轉見千秋萬古情海棕行寶應元年作鄭曰棕字以意逆之當作子冬切趙曰海棠記載李贊皇公云花木以海為名者悉從海上來補注鶴曰詩云左綿公館清江濆海棕一株高入雲則棕在綿州乃云寶應元年至綿州作唐子西將家逰治平院詩云江邊勝事略尋遍不見海棕高入雲注云即老杜所謂東津者則館與棕皆在涪江之東津也左綿公館清江濆師曰綿州涪水所經涪居其右綿居其左故曰左綿海棕一株高入雲修可曰古樂府高城上入雲龍鱗犀甲相錯落蒼稜白皮十抱文自是衆木亂紛紛趙曰王長元吉古意云况復飛營夜木葉亂紛紛海棕焉知身出羣移栽北辰不可得時有西域胡僧識師曰北辰喻君也夫大材生非其地人無識者其與衆木紛亂何以異乎中國無人識而胡僧識之正仲尼欲居九夷之意補注鶴曰北辰以喻京師帝居言欲移其種於京師而不可得也此木在當時已不識其自何得名宜趙鄭亦不得而知也漢武帝穿昆明池底得黑灰問東方朔朔曰不經可問西域胡法蘭法蘭蓋博物者也公以當時不識其為何木故及之姜楚公畫角鷹歌寶應元年作補注鶴曰姜皎以誅竇懷貞等有功進殿中監楚國公其子慶初亦襲封楚國公此未詳為誰畫詩云此鷹寫真在左綿則是公寶應元年送嚴武至綿州之時作楚公畫鷹鷹戴角殺氣森森洙曰一云如到幽朔觀者貪愁掣臂飛趙曰如在幽朔見此鷹之殺氣蓋名鷹出於此地也畫師不是無心學此鷹寫真在左綿却嗟真骨遂虛傳梁間燕雀休驚怕亦未摶空上九天師曰書曰宅朔方曰幽都幽隂也朔北也幽朔肅殺之方此鷹殺氣窮極幽朔掣臂謂掣臂鞲而欲飛物有異質而世所未嘗覩人見之必駭而不信畫師不是無心學蓋恐人未之信也末章譏朝廷之士稱才角出者率有虛名而無實效嚴氏溪放歌寶應元年作彥輔曰時郭英乂代嚴武鎮蜀粗暴不能容甫故有公卿獨驕之作補注鶴曰永泰元年四月庚寅嚴武薨五月癸丑詔郭英乂節度劍南今詩云秋宿霜溪素月高詩與事不合詳考詩云劒南嵗月不可度邊頭公卿仍獨驕當是寶應元年避徐知道亂入梓州時所作詩云東逰西還力實倦從此將身更何許知子松根長茯苓遲暮有意來同煮意嚴二即嚴氏别駕梓州人故云東遊西還後篇相從歌亦同時之所作也天下甲馬未盡銷豈免溝壑常漂漂劍南嵗月不可度洙曰成都在劍嶺之南邊頭公卿仍獨驕趙曰此謂居邊之守臣也謂之獨蓋有跋扈不遵王命之意舊注謂時郭英乂代嚴武鎮蜀粗暴則固然矣然英乂乃成都尹豈得謂之邊頭公卿乎非公詩本意費心姑息是一役肥肉大酒徒相要洙曰此詩譏邊臣顧望不為朝廷憂也趙曰禮記謂小人之愛人也以姑息呂氏春秋曰肥肉厚酒以自强嗚呼古人已糞土獨覺志士甘漁樵况我飄轉無定所洙曰時甫方避地流徙無所依止終日戚戚忍羇旅秋宿霜溪素月高喜得與子長夜語東遊西還力實倦從此將身更何許知子松根長茯苓遲暮有意來同煮趙曰楚辭傷美人之遲暮此未句傷歲晚矣欲服餌長生之藥也師曰甫意欲暮年與嚴氏同隱溪故云補注希曰淮南子說山訓千年之松下有茯苓上有兔絲注云茯苓千嵗松脂也又陶隱居注本草兔絲條舊言下有茯苓上有兔絲史記龜策傳云下有茯苓上有兔絲又云茯苓千嵗之松脂也相從歌寶應元年作魯曰贈嚴二别駕時方經崔旰之亂師曰崔旰殺郭英乂成都亂適東川與嚴别駕相遊從一見如舊故作此補注鶴曰魯師二注及梁權道編皆以為永泰元年梓州避亂時作然崔旰之亂在是年閏十月公已次雲安矣當是寶應元年避徐知道反入梓州時作此詩乃寶應元年故詩云成都亂罷氣蕭索浣花草堂亦何有若在永泰元年作則是時决意下忠渝矣豈復更十步一回首於草堂也我行入東川十步一回首梅曰憶舊隱也成都亂罷氣蕭瑟浣花草堂亦何有師曰草堂為賊焚故云云梓州豪俊大者誰本州從事知名久趙曰指豪俊者謂嚴二也師曰梓州屬東川嚴二為梓州别駕如今之通判乃梓州人為本州從事補注鶴曰于定國條州大小為設吏員治中别駕諸郡從事秩六百石又續通典云唐以堂吏朱儉為華州别駕給事郎蕭倣駁曰别駕古為治中從事與刺史别乘則别駕稱從事其來尚矣把臂開樽飲我酒酒酣擊劍蛟龍吼烏帽拂塵青螺粟紫衣將炙緋衣走趙曰指言從人也青螺粟則帽之紋也銅盤燒蠟光洙曰一作炎吐日安石曰銅盤燭臺盤承淚者夜如何其初促膝洙曰言將以紫綬易緋衣促膝言膝相近也入則促膝密語黃昏始扣主人門師曰新相知也誰謂俄頃膠在漆洙曰古詩以膠投漆中師曰古云自謂膠漆堅不如雷與陳甫一見嚴二便如膠漆之固萬事盡付形骸外趙曰莊子曰索我於形骸之外百年未見歡娛畢神傾意豁真佳士久客多憂今愈疾高視乾坤又可愁一體交態同悠悠逢原曰翟公云一貧一富乃知交態悠悠泛交也甫視乾坤之內雖大相知者皆泛泛爾埀老遇君未恨晚似君須向古人求洙曰魏志張邈傳後陳登字元龍劉備曰若元龍文武膽志當求之于古人耳晉王戎從弟衍字夷甫帝聞其名問戎曰夷甫當是誰比戎對曰未見其比當從古人中求耳短歌行寶應元年作洙曰贈王郎司直補注鶴曰王郎司直即前所賦戲友云官有王司直者梁權道編在永泰元年成都詩內然不應與前作相去三年意同是寶應元年作王郎酒酣拔劍斫地歌莫哀修可曰史記武帝時齊人有東方生名朔時坐席中酒酣據地歌曰云云我能拔爾抑塞磊落之竒才豫樟翻風白日動洙曰吳都賦木則楓柟豫樟言材之美者鯨魚跋浪滄溟開洙曰鯨魚之大者吳都賦長鯨吞航趙曰以大魚比之崔豹古今注鯨海魚也大者數千里小者千丈鼓浪成雷噴沫如雨且脫劍佩休徘徊蘇曰張華遇魯銍于滻水華曰且脫劍佩于此徘徊何命為之匆速如是西得諸侯棹錦水洙曰錦水蜀江也欲向何門趿珠履洙曰孟嘗君養客三千皆躡珠履趙曰鄒陽云何王之門不可曳長裾乎仲宣樓頭春已深洙曰仲宣王粲也有樓在荆州青眼高歌望吾子洙曰阮籍能為青白眼以重輕人眼中之人吾老矣師曰錦水蜀中有濯錦江王司直得蜀中刺史刺史古之諸侯甫欲依之為門下客如仲宣之依劉表望其青顧故云青眼高歌望吾子吾子指王司直眼中之人謂甫素善司直司直必念其衰老而眷遇之也補注希曰儀禮望吾子之教也注吾子相親之辭文選陸士衡答張士然云感君桑梓義髣佛眼中人短歌行廣德元年作魯曰送祁録事歸合州因寄蘇使君補注鶴曰詩云君今起柂春江流又云余亦沙邊具小舟意是廣德元年梓州作公在梓州有詩云應須理舟楫長嘯下荆門正是時也故此詩舊次在草堂四松之前而梁權道編在永泰元年亂後還成都作考是年四月嚴武死公五月下忠渝秋已至雲安而今詩云君今起柂春江流則非永泰元年所作甚明况崔旰之亂至大厯元年方粗定前者途中一相見人事經年記君靣洙曰古者有半靣之交趙曰經年之中徒記君靣而已不得再相見也後生相動洙曰一作勸何寂寥君有長才不貧賤洙曰陳平傳張負曰人固有美好如陳平而長貧賤者乎君今起柂春江流趙曰柂所以行大舟也余亦沙邊具小舟幸為達書賢府主趙曰指言合州蘇使君也江花未盡會江樓草堂廣德二年作洙曰草堂在成都浣花里楊子琳之亂甫去草堂亂後復歸也補注鶴曰當是廣德二年自梓閬歸成都依嚴武時作故有賤子且奔走三年望東吳不忍竟舍此復來剃榛蕪之句若是避崔旰之亂何至涉三年而始歸梁權道信王注而編在永泰元年非也詳見注昔我去草堂蠻夷塞成都今我歸草堂成都適無虞請陳初亂時反覆乃須臾蘇曰曹參曰事反覆于須臾之間大將赴朝廷羣小起異圖洙曰時崔寧入朝留其弟寬守成都楊子琳等乘間來襲子琳與邛州柏正節同叛中宵斬白馬盟㰱氣已粗洙曰榖梁傳齊桓衣裳之會十有一未嘗有㰱血之盟蘇秦說趙令會天下之將通質刳白馬而盟漢高祖刑白馬盟孟子五霸桓公為盛葵邱之會諸侯束牲載書而不㰱血西取邛南兵北斷劍閣隅補注鶴曰公以寶應元年秋避成都之亂去草堂入梓州殆是草堂方畢工而遂去也是年七月徐知道反大將赴朝廷謂嚴武以召去為京兆尹廣德二年武再鎮蜀公復往依之于是始歸草堂王洙以為是崔寧入朝楊子琳為亂然崔旰楊子琳之亂乃是永泰元年冬是時公在雲安矣洙苐以西取邛南兵之句信其為柏正節同亂然寶應元年方于邛州置鎮南軍羌渾奴刺西寇梁州梁即興元府在成都之北或者取邛南之兵以斷劍閣之路爾况謂之蠻夷塞成都始聞蕃漢殊是專指羌胡而言羣小賊臣因之為亂者也大厯三年崔寬攻敗子琳始復成都若果候子琳之亂平而復歸則其春公已發白帝城下峽泊江陵矣布衣數十人亦擁專城居洙曰楊子琳為瀘州刺史柏正節為邛州刺史其勢不兩大洙曰兩大不相事始聞蕃漢殊洙曰子琳本賊帥也杜鴻漸表以為刺史西卒却倒戈賊臣互相誅洙曰子琳為寧妾任氏所敗走為王守仙所誅焉知肘腋禍自及梟獍徒洙曰前漢郊祀志梟鳥名食母破獍獸名食父黃帝欲絶其類使百吏祠皆用之破獍如貙而虎眼漢五月五日作梟羹賜百官義士皆痛憤紀綱亂相踰一國實三公洙曰僖五年左氏狐裘尨茸一國三公吾誰適從萬人欲為魚趙曰左傳昭公元年劉定公歎禹之功曰微禹吾其魚乎光武紀百萬之衆可使為魚唱和作威福孰肯辨無辜眼前列杻械背後吹笙竽談笑行殺戮濺血滿長衢到今用鉞地洙曰左傳至于用鉞風雨聞號呼鬼一作人妾與鬼馬趙曰已殺其主矣則妾謂之鬼妾馬可謂之鬼馬如胸奴以亡者之妻為鬼妻也色悲充爾娛國家法令在此又足驚吁賤子且奔走三年望東吳弧矢暗江海難為逰五湖不忍竟舍此復來剃榛蕪鄭曰剃他計切除草蘇曰安謂隋文帝召為博士性便山水復來舊隱剃草徘徊而去後辭官不起入門四松在步堞洙曰一云步屧鄭曰徒協切城上垣萬竹疏趙曰宋書袁粲為丹陽尹常步屧白楊郊野間舊犬喜我歸低徊入衣裾鄰舍喜我歸沽酒携胡蘆洙曰一云提榼壺大官喜我來遣騎問所須補注希曰大官謂嚴武魏文帝書云今遣騎詣鄴城郭喜我來賓客隘村墟天下尚未寧健兒勝腐儒洙曰黥布傳上對衆折隨何為天下安用腐儒哉補注鶴曰健兒兵士也舊史至德二載蜀都健兒賈秀等五千人謀逆上皇御蜀郡樓討平之是也又京師召募十萬衆號天武健兒飄颻風塵際何地置老夫于時見疣贅鄭曰上羽求切結痛也下之鋭切趙曰莊子云附贅掛疣此公自以傷見剩其身在天地間如之骨髓幸未枯飲啄愧殘生食薇不敢餘洙曰莊子駢拇疣贅又養生澤雉十步一啄百步一飲嵇康採薇山阿趙曰倣古詩食蕨不願餘師曰嚴武鎮成都卒于永泰元年夏間朝廷有詔崔光逺代甫年未老而不見用故云骨髓幸未枯食薇不敢餘謂其貧也薇菜之薄者四松廣德二年作補注鶴曰詩云别來忽三嵗按公以寶應元年去成都遊綿梓閬廣德二年春再歸恰三年故又云避賊今始歸春草滿空谷而草堂詩亦有入門四松在之句四松初移時大抵三尺强别來忽三嵗離立如人長趙曰禮記離坐離立師曰甫詩云賤子且奔走三年望東吳則知甫去草堂及歸時凡涉三嵗矣會看根不拔莫計枝凋傷幽色幸秀發趙曰王褒曄曄而秀發疏柯亦昻藏所插小藩籬本亦有隄防終然掁撥損鄭曰上直庚切下比末切洙曰謂有所觸動也師曰道曰掁撥觸撼貌補注希曰掁觸也韻作除庚切撥正如蕩詩所謂本實先撥也韻釋云理也絶也除也此當是以除絶言得愧千葉黃補注希曰愧一本作吝敢為故林主師曰甫傷兵亂民尚不保其故居况吾敢為故林之主而欲保四松之無損乎黎庶猶未康避賊今始歸春草滿空堂蘇曰嵇紹一日復一日篇云去日畫樓歌管沸歸來春草滿空堂詩語困即借句今杜工部往往全用古人語斯亦無害詩人之工也覽物歎衰謝及兹慰凄凉洙曰前詩有入門四松在清風為我起灑面若微霜趙曰張茂言穆如灑清風陸機連珠云秋風夕灑靣足以送老姿洙曰一云足為送老姿聊待偃蓋張趙曰抱朴子云天陵偃蓋之松我生無根蒂配爾亦茫茫有情且賦詩事迹兩可忘勿矜千載後慘淡蟠穹蒼水檻廣德二年作補注鶴曰詩云逰子久在外門户無人持當是廣德二年自梓閬回草堂時作梁權道編在永泰元年作非蒼江多風飇雲雨晝夜飛茅軒駕巨浪洙曰郭景純詩高浪駕蓬萊焉得不低埀逰子久在外門户無人持高岸尚為谷洙曰高岸為谷深谷為陵何傷浮柱欹趙曰張平子西京賦跱逰極于浮柱結重欒以相承注三輔名梁為極作逰梁置浮柱上也扶顛有勸誡恐貽識者嗤洙曰危而不持顛而不扶則將焉用彼相矣既殊大厦傾可以一木支洙曰大厦將傾非一木可支臨川視萬里何必欄檻為人生感故物慷慨有餘悲趙曰韓詩外傳載孔子出逰少源之野有婦人哭甚哀問之婦人曰向刈蓍薪亡吾簪是以哀非傷亡簪不忘故也師曰持守也詩云高岸為谷深谷為陵萬物皆有變易於水檻何恨乎水檻駕于巨浪之上為水所蕩動浮柱欹側此亦常理但顛危必用扶持譬若大厦非一木所能支危而不持則將焉用彼相此甫含蓄意思諷朝廷乏材當顛危之際莫有扶持者矣臨川視萬里何必欄檻為蓋言王者以天下為度當一視同仁恩及無外不可有此疆爾界之辨諷肅宗示人不廣耳破船廣德二年作補注鶴曰詩云緬邈懷舊邱鄰人亦已非當是廣德二年再歸草堂後作末句云所悲數奔竄白屋難久留明是年果下忠渝平生江海心宿昔具扁舟豈惟清溪上日傍柴門遊趙曰此言志在江海豈局促于清溪上旁柴門而逰為事乎蒼皇避亂兵緬邈懷舊邱鄰人亦已非野竹獨修修船舷不重扣舷胡田切洙曰江賦詠採菱以扣舷埋沒已經秋仰看西飛翼下愧東逝流故者或可掘新者亦易求所悲數奔竄白屋難久留蘇曰賈復見耿弇曰子非久留白屋之士風雲會合子當平步天衢耳後果如其言師曰亂兵謂崔旰之亂甫往梓州舊邱故林也指草堂鄰人亦已非謂流離也甫去成都凡三載向者所泛扁舟埋沒于泥沙故船舷不堪重扣舷船旁也扣之以節歌甫在東川未及西歸故云仰看西飛翼下愧東逝流故者或可掘謂破船營屋永泰元年作補注鶴曰愛惜已六載兹辰去千竿當是永泰元年作蓋公上元元年營草堂時已植竹堂成詩所謂籠竹和煙滴露梢草堂詩所謂步堞萬竹疏是也意公正月歸溪上時營屋故作我有隂江竹師曰甫植萬竹於草堂故云能令朱夏寒夢符曰右按梁元帝纂要曰夏曰朱夏又爾雅夏為朱明隂通積水內高入浮雲端趙曰枚乘詩曰美人在雲端甚疑鬼物慿蘇曰王肅行大白見山林秀茂曰疑有神物所慿不顧翦伐殘東偏若面勢師曰謂植竹以䕃東射之日隨其所向之勢户牖永可安愛惜已六載兹晨去千竿蕭蕭見白日洶洶開奔湍度堂匪華麗養拙異考槃趙曰詩考槃在阿考槃在澗考成也槃樂也今公言養拙而已非若碩人之在澗在阿而後成其樂也草茅雖剃葺衰病方少寬趙曰除草曰剃言雖有剃葺之勞而吾之衰病可寬也洗然順所適此足代加餐寂無斤斧響師曰甫築草堂茅茨不翦椽柱不斫削蓋順其所適也故云寂無斤斧響庶遂憩息歡青溪驛奉懷張員外十五兄之緒永泰元年作補注鶴曰青溪驛在嘉州犍為縣此詩當是永泰元年去成都經嘉州下忠渝時所作故詩有佳期付荆楚之句漾舟千山內日入泊荒渚蘇曰荒作枉曲渚也謝靈運詩弭棹歸枉渚趙曰謝靈運西陵遇風詩漾舟陶嘉月莊子日入而息文選通波激枉渚我生本飄飄今復在何許洙曰言未有所定止也石根青楓林猿鳥聚儔侶洙曰言猿鳥猶能聚其儔侶而人不能致于安適則甫之羈困可見矣月明遊子靜畏虎不得語中夜懷友朋乾坤此深阻浩蕩前後間佳期付荆楚趙曰浩蕩流放之貌楚辭志浩蕩而傷懷非此言水也師曰甫離蜀中移居䕫州今又自䕫下峽欲之荆南夜宿青溪驛而有此作故末章云佳期付荆楚今復在何許言此行不知駐足于何所也猿與鳥尚得以類相聚甫今别張員外中夜懷之曾猿鳥之不若乎虎喻盜賊也不得語恐奸人窺伺之亂世匿迹若此屏跡永泰元年作補注鶴曰詩云年荒酒價乏當是永泰元年作是年正月公歸溪上雖廣德二年永泰元年皆可謂之年荒然詩又云衰年甘屏跡幽事供高卧可見公在幕府而歸溪上矣又云龜開萍葉過則是夏作若在廣德二年則公方入幕不應更云日并園蔬課梁權道編在寶應元年殊不知是年五月公已去成都入綿梓又史不書饑詳見詩注衰年洙曰一作顔甘屏跡幽事供高卧鳥下竹根行龜開萍葉過年荒酒價乏日并園蔬課趙曰蓋以乏酒價之故則并課園蔬賣之以充估直也補注鶴曰唐食貨志云唐初無酒禁乾元元年京師酒貴肅宗以廪食方屈乃禁京城沽酒期以麥熟如初二年復禁酤廣德二年定天下酤户以月收稅五行志廣德二年秋關輔飢米每斗千錢永泰元年饑京師米斗千錢此云年荒當是永泰元年蓋廣德二年秋關輔方饑而此詩乃夏初作若在其年不應先事而言故知為永泰元年夏初作無疑肅宗于干戈未定之時猶能以年饑禁酤酒而代宗米斗千錢之嵗方且定天下酤户以收稅此公所以因詩以傷世變也猶酌甘泉歌洙曰一云獨酌酣且歌歌長擊樽破修可曰世說王大將軍每酒後輒詠魏武樂府曰老驥伏櫪志在千里烈士暮年壯心不已以如意擊唾壺壺盡缺子美長歌而擊樽破有類于此贈别賀蘭銛廣德元年作鄭曰銛思亷切補注鶴曰詩云國步初返正當是廣德元年公在梓閬州作賀蘭銛欲下東故詩又云逺赴東吳春梁權道編在永泰元年而師古入以逺赴湘吳春為公移居䕫府既而下峽適荆吳蓋失之不考也詳見詩注黃雀飽野粟羣飛動荆榛趙曰此比時人之蹇淺也今君抱何恨寂寞向時人趙曰此傷賀蘭而問之老驥倦驤首洙曰騏驥逢伯樂之知驤首長鳴趙曰暗使戰國䇿汗明見春申君曰夫驥之齒至矣服鹽車而上太行瀌汁灑地白汗交流而不能上伯樂遭之下車攀而哭之解紵衣以幕之驥于是俯而噴仰而鳴聲達于天仰見伯樂之知已也今云倦則以無伯樂而倦也蒼鷹愁易馴高賢世未識固合嬰飢貧國步初返正洙曰時初復京師乾坤尚風塵洙曰史思明猶鴟張河朔補注鶴曰唐蔣乂云中宗即位春秋已壯而母后篡奪以移神器賴張柬之等國祚再復蓋曰反正不得為中興凡非我失之自我復之為中興漢光武晉元是也自我失之因人復之晉孝惠孝安是也以人所言則肅宗可為中興不可為反正當是謂代宗自陜回而吐蕃之亂未息若如王師注則詩乃乾元問作安得又以赴湘吳春為遷䕫下峽適荆無乃自異其說公所謂反正者雖不本蔣乂之說苐用高帝紀撥亂世反之正之語然詩云我戀岷下芋則公作詩時在蜀無疑代宗以廣德元年復京師而史思明又以其年縊死則所謂風塵者特指吐蕃之亂甚明悲歌鬢髮白逺赴湘吳春我戀岷下芋君思千里蓴洙曰岷山之下沃野下有蹲鴟至死不飢師古曰蹲鴟芋也千里蓴羮未下鹽豉師曰岷山蜀中之山地産芋魁可以充糧凶年不能飢甫既去蜀故戀岷山之芋吳地出蓴菜鱸魚昔張翰吳人也在洛守官忽思蓴菜遂去官而歸賀蘭在蜀故思吳中之蓴舉其物則思其人相思故也補注希曰漢翟方進傳童謡云飯我豆食羮芋魁華陽國志汶山郡有大芋如蹲鴟賀蘭銛在蜀欲赴湘吳而自以尚戀岷下之芋未能去蜀故云生離與死别自古鼻酸辛洙曰楚詞云悲莫悲于生别離髙唐賦孤子寡婦寒心酸鼻補注杜詩卷十
