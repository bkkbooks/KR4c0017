body:
  text: 補注杜詩卷十五宋黃希原本黃鶴補注憶昔行大厯三年後作補注鶴曰詩云更討衡陽董鍊師南逰早鼓瀟湘柂當是大厯三年出峽後作權道編在荆南詩內憶昔北尋小有洞洪河怒濤過輕舸加我切洙曰茅君內傳大天之內有玄中之洞三十六所第一王屋山之洞圍萬里名曰小有清虛之天至于廣雅南楚江湘凡船之大者謂之舸辛勤不見華蓋君艮岑青輝慘么麼亡果切劉良曰小也洙曰葛仙翁傳崑崙山一曰玄圃臺一曰華蓋仙人所居趙曰公昔逰云昔逰華蓋君深小同宫腳玉棺已上天白日亦寂寞暮升艮岑頂巾几猶未却詳考洞詩之意公逰王屋本欲謁華蓋君適值君死也千崖無人萬壑靜三步回頭五步坐修可曰曹公祭橋玄文有曰車過三步李陵别蘇武詩曰轅馬顧悲鳴五步一倣徨秋山眼冷魂未歸仙賞心違淚交墮洙曰謝靈運曰賞心樂事四者難并陸機中心若有違趙曰上句言望華蓋君招之而不來也下言欲為仙賞之遊而事與願違所以悲泣也宋玉招魂有魂今歸來弟子誰依白茅洙曰一作石室盧老獨啓青銅鎖鄭曰盧遨見淮南子巾拂香餘搗藥塵階洙曰一作前除灰死燒丹火玄圃滄洲莽空闊洙曰十洲記曰崑崙山三角一角正于北辰星輝名曰閬風嶺其一角正西曰玄圃臺其一角正西曰崑崙宫修可曰葛仙傳云崑崙一曰玄圃也滄洲十洲之一洲也金節羽衣飄婀娜鄭曰婀於可切娜奴可切美也落日初霞閃餘映洙曰以黃金為節鳥羽為衣漢武帝拜欒大為五利將軍使衣羽衣立白茅上受印注以鳥羽為衣取其神仙飛翔之意趙曰王仲宣詩山岡有餘映倐忽東西無不可洙曰言其飛翔無所往而不可松風澗水聲合時澗居晏切青兕黃熊啼向我洙曰兕如野牛青皮堅厚可以為鎧嶓冢之山其數多補注希曰兕似牛青色徒然咨嗟撫遺迹至今夢想仍猶左趙曰公在山中愁寂不堪撫華蓋君之遺迹而夢想猶見之也袐訣隱文須內教晚嵗何功使洙曰一云收願果更討洙曰一云覔衡陽董鍊師洙曰董鍊師神仙也隱於衡陽趙曰以為求仙須得有功行而傳袐訣不見華蓋君矣却思南逰而訪董鍊師也南遊早鼓瀟湘柂洙曰晉庾闡楊都賦青雀飛艫余皇鼓柂師曰神仙有三十六洞天第一王屋山之洞名曰小有清虛天仙人所居艮岑崑崙東北之岑甫昔遊小有洞不憚辛勤冀遇仙賞時盧道人結茅山下居焉甫謁之訪其仙術昔淮陽王有鴻寶枕中袐訣其文字隱之不以示人故曰袐訣隱文須內教董鍊師隱于衡陽即董京威也補注鶴曰道經中有大梵隱語即隱文之類也董鍊師乃昔遊詩所謂董先生者方公逰王屋山時董在東蒙今在衡嶽故云南逰一作南浮如司馬子長浮湘泛沅之浮魏將軍歌大厯二年作補注鶴曰夔川嘗號臨江軍而此詩云臨江節士安足數徐師川亦云甫自稱臨江節士當是大厯二年作而梁權道編在三年荆南作將軍昔著從事衫鄭曰著陟略切洙曰别駕亦曰治中從事孔恂為别駕從事蘇曰吳起暫卸戰裘學著從事衣衫趙曰初為幕官於元帥府耳鐵馬馳突重兩銜洙曰銜銜勒也蘇曰漢靈帝飛黃良駿重銜交轡趙曰馬勒重銜則戰馬之謹也被堅執鋭略西極洙曰前漢髙祖紀朕親被堅執鋭師古曰被堅謂甲胄也執鋭謂利兵也爾雅西至於邠國謂之西極崑崙月窟東嶄巖鄭曰嶄仕咸切石髙峻貌洙曰相如賦嶄岩參差揚雄長揚賦西壓月窟東震日城君門羽林萬猛士惡若哮虎子所監洙曰監領也君門羽林禁旅也漢有羽林軍詩噉如虓虎言其勇也五年起家列霜戟彥輔曰門列棨戟也蘇曰楊素起家五年門列棨戟韓休語子曰爾輩豈不見楊將軍乎不數年門列畫戟况爾輩堂堂然獨守蠧簡學組繡對偶比楊將軍逺矣趙曰言將軍驟貴如此一日過海收風帆趙曰言將軍逺征而利於速戰平生流輩徒蠢蠢長安少年氣欲盡趙曰觀將軍富貴功名而然矣魏侯骨聳精爽緊華嶽風尖見秋隼趙曰清秋之隼鳥也凡鷙鳥以秋而健所以比之俯曰謝承後漢書竇武上疏曰奉承詔命精爽隕越補注希曰左傳昭元年是以有精爽至于神明星纒寶校金盤陀時可曰星纒寶校金盤陀馬裝也顔延年赭白馬賦云具服金組兼飾丹艧寶校星纒縷章霞布注以金組丹雘飾其裝具如星霞之布蒼舒曰按文選張平子東京賦龍輈華轙金鑁鏤錫方釳左纛鈎膺玉鑲注蔡雍曰金鑁者馬冠也髙廣各五寸上加三華形在馬髦前鑁切鏤雕飾也當顱刻金為之詩曰鈎膺鏤錫所謂寶校此其具也第尊卑之制殊耳又古樂府白馬金具裝橫行遼水旁夜騎天駟超天河洙曰天官書漢中四星曰天駟房一星曰天良旁八星絶漢曰天漢彥輔曰天官書漢中四星曰天駟使此者以言御廄耳欃槍熒惑不敢動鄭曰欃初銜切槍楚耕切災星洙曰欃槍妖星熒惑火星不敢動言畏其威也蘇曰司馬仲達曰星拱帝座熒惑欃槍焉敢動補注希曰大人賦攬攙搶以為旌兮張揖曰彗星為攙搶師古曰初咸初耕反翠㽔雲旓相蕩摩鄭曰旓所交切旌旗旒也洙曰翠蕤雲旓皆旗也相蕩摩舒間也夢符曰右按文選啓翠華之葳蕤又張平子西都賦棲鳴鳶曳雲旓又子虛賦錯翡翠之葳蕤注徐廣曰錯音措或作錯紛翠蕤吾為子起歌都護洙曰漢遣王吉護胸奴南北兩道故曰都護趙曰古樂府有丁督護歌酒闌插劍肝膽露鈎陳蒼蒼玄武暮洙曰一本云玄武暮隋天文志鈎陳六星在紫宫中故天子殿前亦有鈎陳所以法天也蒼蒼言其明也玄武亦明星也趙曰鈎陳星名玄武闕名安石曰三輔舊事曰未央宫北有玄武闕舊本誤以武字為韻云風玄武極無義理徒誤學者以鈎陳則蒼蒼以玄武則暮言當酒闌插劍之時萬嵗千秋奉明主趙曰申言將軍監軍於殿前矣臨江節士安足數彥輔曰夔州號臨江趙曰言將軍乃天子之節士非特臨江王節士而已修可曰臨江節士史失其名唯古樂府載宋陸厥臨江王節士歌曰節士慷慨髮上衝冠彎弓挂石水長劍竦雲端是也俯曰夔州號臨江軍甫欲將軍效漢王吉都護蕃漢而臨江節士又安足數甫自稱臨江節士北風大厯元年作補注鶴曰詩云十年殺氣盛當是大厯元年而云洞庭秋欲雪則公大厯三年冬至嶽陽詩也梁權道亦編在是年詩內北風破南極洙曰北陰也南陽也北風破南極喻小人道長而見君子道消也朱鳯日威洙曰一作低垂洙曰喻君子不得志洞庭秋欲雪鴻雁將安歸蘇曰諸葛瑾曰方今南北鼎沸東西兵革不止𡨕𡨕之鴻雁吾與汝將安歸趙曰南極所以言楚地北風破南極而朱鳯威垂洞庭秋欲雪而鴻鴈安歸此言值時如此于是乎失所也威垂無氣象之貌十年殺氣盛六合人煙稀蘇曰劉述曰強秦既衰鹿走中原劉項並起兵戈沸海人煙稀少補注希曰相如傳六合之內師古曰天地四方謂之六合吾慕漢初老時清猶茹芝蘇曰漢初老四皓之徒也龎德公云時清物阜吾亦茹芝术趙曰自天寶十四年至此十三年矣而云殺氣盛則舉其大數耳商山四皓避秦之亂方漢之初可以出矣而猶茹芝焉則以畏禍之心未能巳也客從大厯四年作補注鶴曰詳觀詩當是大厯四年作梁權道以為大厯三年客從南溟來遺我泉客珠珠中有隱字欲辨不成書趙曰任昉述異記南海鮫人室水居如魚不廢機織其眼泣則出珠鮫人即泉仙也又名泉客緘之篋笥久以俟公家須開視化為血哀今徴斂無趙曰必用泉客珠言其珠從眼泣所出也至於化為血矣猶慮公家之徴斂而無以供之師曰此詩寓意公家徴斂而索其所無有之物詩云俾出童羖是也補注鶴曰按史大厯四年三月遣御史稅商錢此詩故託珠以諷徴斂之及于商賈也白馬大厯三年作補注鶴曰詩云近時主將戮中夜商於戰當是大厯三年荆南作白馬東北來空鞍雙貫箭可憐馬上郎意氣今誰見近時主將戮中夜商於戰洙曰商或作傷蘇曰張儀欺楚王以商于之地鮑曰商州也舊屬楚楚世家注在今順陽郡南鄉丹水二縣有商城在於水中乃知商于為商州即張儀欺楚王之地也蔡伯世曰乃潭州詩主將謂崔瓘也東溪先生誤以主將之戮為祿山之亂而又以白非戰馬昔侯景之亂舉軍皆白馬青袍而謂非戰馬可乎趙曰商于當作傷於按商於山名在虢州與此潭州之亂無相干斷不可取師曰商于楚地此詩殆為永王璘叛於楚而作故有中夜傷于戰之句補注鶴曰帝王世紀云卨始封于商則今上洛縣亦秦相商君之邑張儀詐以商於之地六百里賂楚即此地唐為商州上洛郡治上洛縣大厯三年二月商州兵馬使劉洽殺其刺史殷仲卿此詩為仲卿作也詩云白馬東北來空鞍雙貫箭可憐馬上郎意氣今誰見馬上郎指仲卿謂仲卿巳死而徒有馬負空鞍也舊注何不考而徒為紛紛之論喪亂死多門嗚呼涕如霰趙曰屈原九歌哀郢篇云涕淫淫其如霰師曰梁簡文帝述霸賦孟夏守節雄風吹甸晚解纜於鄉津涕淫淫其若霰白鳬行大厯二年作補注鶴曰李巡曰野曰鳬家曰騖又爾雅釋曰水鳥也公以自喻詩云終日忍飢西復東如公在夔自瀼西而遷東屯師注亦云化為白鳬似老翁傷遲暮也當是大厯二年作君不見黃鵠髙於五尺童化為白鳬似老翁洙曰似一作象故畦遺穗巳蕩盡天寒嵗暮波濤中洙曰嵗一作日此杜公自喻也鱗介腥膻素不食終日忍飢西復東魯門鶢鶋亦蹭蹬聞道於今猶避風洙曰見八哀詩鄭虔詩注師曰鶢鶋海鳥止於魯東門為避風也喻甫亂依夔州補注希曰爾雅爰居釋曰爰居海鳥也大如馬駒一名雜縣漢釋曰時琅琊有之蠶穀行大厯三年作補注鶴曰詩云天下郡國向萬城無有一城無甲兵當是大厯三年荆南作去年與其年周智光反吐蕃冦邠靈州京師戒嚴桂州山獠反商州幽州兵馬使並反楊子琳又陷成都亦可謂天下皆用兵也天下郡國向萬城無有一城無甲兵洙曰時盜賊充斥天下皆用兵也焉得鑄甲作農器修可曰家語載回曰回願得明王聖主輔相之使鑄戟以為農器一寸荒田牛得耕牛盡耕田蠶亦成不勞烈士淚滂沱男穀女絲行復歌趙曰烈士見平日牛不得耕又蠶無所成則涕淚滂沱今也見牛耕而男榖蠶成而女絲則喜而行歌焉師曰時冦盜滿天下男廢耕女廢織故傷今而思古也折檻行大厯三年作補注鶴曰詩云白馬將軍若雷電當是指崔旰作亂尋為西川節度使大厯三年四月入朝五月又加檢校左散騎常侍未幾又加檢校工部尚書皆杜鴻漸不能除惡從而引之要路當時在廷無一人敢言故有感於朱雲折檻而賦此朱雲傳注云檻軒前欄也賦此詩在荆南嗚呼房魏不復見秦王學士時難羡洙曰房玄齡魏徴也初太宗為秦王既平天下開文學館以待四方之士於是以杜如晦房玄齡並以本官兼𢎞文館學士圖其形狀且顯爵土命褚遂良為像贊藏之書府號十八學士給五品珍膳分為三畨更直宿于閣下預入閣者時人謂之曰登瀛洲青襟胄子困泥塗白馬將軍若雷電洙曰時方貴武而賤文也定功曰魏寵德每戰每陷陳與關羽交戰射羽中額時德常乘白馬羽軍時謂白馬將軍若雷電則言馬之駿驟大意言武人之寵幸故其威勢如此補注鶴曰青襟胄子謂國子生胄子二字本出於書而潘嶽間居賦亦云兩學如一右延國胄時方尚武故困泥塗千載少似朱雲人至今折檻空嶙峋洙曰朱雲請尚方斬馬劍以斬佞臣張禹帝怒將雲下欲斬之雲攀檻檻折後欲理檻帝曰勿理故以旌直臣也修可曰左太沖魏都賦榱題黮􅀈階􅀈嶙峋注嶙峋髙也鄭曰嶙離珍切峋思遵切深崖貌婁公不語宋公語尚憶先皇容直臣洙曰婁師德宋璟也言互以正救為心張嘉貞代璟為相閲堂按見其危言讜議未嘗不大聲歎息也朱鳯行大厯五年作補注鶴曰此詩為衡州刺史陽中丞濟作也大厯五年臧玠殺崔瓘濟攝連帥之職以討賊故託衡山朱鳯以喻之則身長顧求其羣謂率澧州刺史楊子琳道州刺史裴虬廣州刺史李勉同討玠也當是大厯五年師云鳯以喻君子時甫困于荆衡不得其志欲引其類以進澤及下民而為小人之所疾併存之以俟明辨君不見瀟湘之山衡山髙山巔朱鳯聲嗷嗷趙曰此篇是託興君子小人甚明朱鳯乃衡山上之物也因其物而有作乃以為興矣韻書云嗷嗷衆口愁也詩哀鳴嗷嗷側身長顧求其羣翅垂口噤心甚勞下愍百鳥在羅網黃雀最小猶難逃願分竹實及螻蟻盡使鴟梟相怒號洙曰時亂離日久賢者思引其類有為而不可得者也惜别行送向卿進奉端午御衣之上都補注鶴曰詩云尚書勳業超千古雄鎮荆州繼吾祖裁縫雲霧成御衣拜跪題封賀端午當是大厯三年荆南作肅宗昔在靈武城洙曰祿山之亂肅宗即位靈武指揮猛將收咸京趙曰天寶十五年九月裴冕奉皇太子即皇帝位是為肅宗明年九月復京師向公泣血灑行殿洙曰天子在外故曰行殿佐佑卿相乾坤平趙曰平乾坤非獨卿相之伍乃向公佐佑之也向卿無所考其名補注鶴曰孔光傳領宿衛供養行內師古曰行在所之內中此云行殿乃其義也逆胡𡨕寞隨煙燼洙曰消滅如隨煙爐也卿家兄弟功名震麒麟閣畫鴻鴈行洙曰言兄弟俱畫像於麒麟閣也紫極出入黃金印補注鶴曰禮記兄弟之齒雁行也以向卿兄弟有功期之畫像麒麟閣出入紫極棄謂巳俱畫也紫極謂北極紫微垣有上相金印謂漢丞相金印紫綬尚書勳業超千古雄鎮荆州繼吾祖洙曰祖謂杜預也趙曰尚書鎮荆州言李之芳也繼吾祖則公自言杜預也預在晉為鎮南大將軍都督荆州諸軍事師曰尚書指向卿之父珣鎮荆南昔向秀繼杜預節鎮於此故云繼吾祖補注鶴曰公以大厯三年至荆南是時衛伯玉為節度尹荆南大厯初加撿校工部尚書故云詳見前注裁縫雲霧成御衣拜跪題封賀端午向卿將命寸心赤青山落日江潮白趙曰言向卿行厯之景物也卿到朝廷説老翁漂零巳是滄浪客師曰時珣遣子向卿奉端午御衣之上都故有此作滄浪客乃屈原也甫自喻醉歌行大厯三年作洙曰贈公安少府請顧八題壁補注鶴曰詩云是日霜風凍七澤烏蠻落照銜赤壁當是大厯三年公至公安時作而梁權道編在天寶十三年詩內若以為在天寶末作則公未嘗至其地無容寫時景如此又公有戲簡顔干少府詩正與此合顧八即顧八分文學名況神仙中人不易得趙曰世説王恭美姿儀嘗披鶴氅裘涉雪而行孟昶見之嘆曰真神仙中人也顔氏之子才孤標洙曰顔氏公安少府也補注鶴曰神仙中人正以顔氏為尉用之梅福為南昌尉謂之神仙尉又李白贈瑕丘王少府詩亦云飄飄神仙氣公有官亭夕坐戲簡顔十少府詩則顔氏之子盎顔十也天馬長鳴待駕馭秋鷹整翮當雲霄洙曰言負駿逸之才以待用也趙曰漢禮樂志天馬來龍之媒君不見東吳顧文學洙曰顧况吳人君不見西漢杜陵老洙曰前漢都長安後漢都雒陽長安在雒陽之西故前漢謂之西漢杜公長安杜陵人也詩家筆勢君不嫌辭翰升堂為君掃蘇曰王子敬過戴安道草堂飲酣安道求子敬文子敬攘臂大言曰我辭翰雖不如古人與君一掃素壁今山陰草堂碑是也辭翰俱美趙曰公自言詩家之辭與顧君筆勢之翰升顔少府之堂各為之一掃也是日霜風凍七澤洙曰子虛賦楚有七澤蘇曰王子威寒賦霜風沍凍合七澤烏蠻落照銜赤壁洙曰施黔烏蠻之域也赤壁地名周瑜破曹公于赤壁酒酣耳熱忘頭白洙曰楊憚曰酒後耳熱仰天撫缶而呼嗚嗚修可曰魏文帝與吳質書曰昔日遊處每至觴酌流行絲竹並奏酒酣耳熱仰面賦詩忽然不自知其樂感君意氣無所惜蘇曰鄭球感意氣倜儻醉何所惜一為歌行歌主客洙曰為一本云醉趙曰主則顔少府客則公與顧也師曰歌主客發揚主客之德也嵗晏行大厯三年作補注鶴曰詩云去年米貴闕軍食今年米賤大傷農當是大厯三年次嶽州作按舊史大厯二年七月甲申減京官職田三分之一充軍糧又十一月乙丑率百官京城士庶出錢以助軍嵗云暮矣多北風瀟湘洞庭白雲中漁父天寒網罟凍莫徭射雁鳴桑弓定功曰隋地理志長沙郡雜有夷蛋名曰莫徭自言其先祖有功常免徭役故以為名補注鶴曰漢五行志女童謡曰檿弧箕服師古曰山桑之有點文者木弓曰弧兹云桑弓蓋以檿為之去年米貴闕軍食今年米賤太傷農洙曰穀貴則傷民穀賤則傷農髙馬達官厭酒肉此輩杼軸茅茨空洙曰言在位者不知為政但厭酒肉而已詩大東小東國困於役而曰杼軸其空補注鶴曰舊史大厯二年二月郭子儀自河東來朝元載裴冕第五琦黎幹各出錢三十萬置晏于子儀之第三月魚朝恩晏子儀宰相節度度支使京兆尹于私第子儀亦置晏于其第田神功晏于其第時以子儀元臣冦難漸平乃置酒連晏公卿大臣列坐于席者百人子儀朝恩神功一晏費至十萬貫鳴呼一晏之費至于如此曾不知民間杼柚之空方且以為蹈舞王化酣酒為樂朝恩神功固不足責而子儀亦復為之惜哉此杜公所以形之詩也楚人重魚不重鳥洙曰一作肉蘇曰風俗通云吳楚之人嗜魚鹽不重禽獸之肉汝休枉殺南飛鴻補注希曰管子桓公曰夫鴻雁春北而秋南不失其時又楚辭雁雍雍而南飛此詩之意亦似王符傳所謂有以貨得雁門太守而皇甫規問卿在郡食雁乎况聞處處鬻男女割慈忍愛還租庸洙曰唐制授人以口分世業田凡授田者丁嵗納栗稻謂之租用人之力嵗不過二十日不役者日為絹三尺謂之庸時民力困故于是有鬻男賣女以還租庸調者往日用錢捉私鑄今許洙曰一云來鉛錫和青銅洙曰唐制盜鑄者死沒其家屬至天寶間盜鑄盆甚雜以鐵錫無復錢形號公鑄者為官爐錢補注希曰唐志德宗時江淮多鉛錫錢以銅蕩外不盈斤兩銷千錢為銅六斤大抵江淮多惡錢其來巳久不獨德宗時為然如天寶初富商姦人已潛往江淮以良錢一易惡錢五入長安市矣志云德宗時者殆指其甚者而言耳此詩可補史之闕刻泥為之最易得好惡不合長相蒙師曰長相蒙謂上下相蒙蔽無復糾察也萬國城頭吹畫角此曲哀怨何時終夜聞􅓋篥大厯三年作鄭曰􅓋必吉切篥力質切補注鶴曰詩云夜聞􅓋篥滄江上當是大厯二年夔州作蓋公夔州詩屢云滄江也梁權道編在二年離公安次嶽州詩內徒惑于不見江湖行路難之句詩又云天地干戈滿以是年周智光反吐蕃兩入冦京師戒嚴桂州山獠又反故云夜聞􅓋篥滄江上衰年側耳情所嚮鄰舟一聽多感傷塞曲三更歘悲壯趙曰胡笳有出塞曲入塞曲也積雪飛霜此夜寒孤燈急管復風湍君知天地干戈滿洙曰地一作下不見江湖行路難洙曰湖一作湘師曰樂部曰􅓋篥者笳管也卷蘆葉為頭截竹為管出于胡地制法角音九孔漏聲五音咸備唐編入鹵部名為笳管通典日􅓋篥本名悲栗出于胡中其聲悲東夷有卷桃皮為之者亦出南蠻雜録云􅓋篥者龜兹國樂風湍謂風雜湍水之聲行路難白居易之所作也發劉郎浦大厯三年作鮑曰先主納吳女處也吕溫詩云吳蜀成婚此水潯真珠步障幄黃金誰將一女輕天下欲換劉郎鼎峙心鄭曰在荆州宋曰浦屬峽州甫擬下峽過衡陽有此作補注鶴曰按十道志劉郎浦在荆州當是大厯三年往公安時作挂帆早發劉郎浦疾風颯颯昏亭午夢符曰右按江陵圖經劉郎浦在石首縣浦或作伏趙曰自公安縣欲往嶽州所經行之處孫曰亭髙貌謂日正髙也舟中無日不沙塵岸上空村盡豺虎洙曰言多盜賊也趙曰張孟陽云盜賊如豺虎十日北風風未回客行嵗晚尤相催白頭厭伴漁人宿黃帽青鞋歸去來趙曰雖在江湖厭與漁人為伴乃欲深藏髙隱矣沈曰黃帽乃籜冠青鞋乃芒鞋也暮秋枉裴道州手札率爾遣興寄近呈蘇渙侍御大厯四年作補注鶴曰裴虬為道州刺史即大厯五年平臧玠者此詩當是大厯四年在潭州作時蘇侍御在潭久客多枉友朋書素書一月凡一束蘇曰王玠避居逺郊一月之中得親知書僅成一束但虛詞寒溫而巳空煩眼力使人厭接又倦回答趙曰古詩云客從南方來中有尺素書虛名但蒙寒暄問泛愛不救溝壑辱趙曰晉王獻之嘗與兄徽之操之詣謝安三兄多言俗事獻之寒暄而巳孟子云志士不忘在溝壑齒落未是無心人舌存恥作窮途哭洙曰張儀從楚相飲相忘璧門下意張儀盜璧共笞掠之妻曰子每讀書遊説安得此辱儀曰視吾舌在不妻笑曰舌在儀曰足矣阮籍遇窮途則哭道州手札適復至紙長要自三過讀盈把那須滄海珠夢符曰右按唐書閻立本謂狄人傑曰君可謂滄海遺珠矣趙曰王筠于書三遇五抄入懷本倚崑山玉洙曰言得裴書勝珠之盈把倚裴如崑山玉也蘇曰世説毛曽與夏侯玄共坐時人謂蒹葭倚玉樹也撥棄潭州百斛酒洙曰步兵厨中貯酒數百斛蕪沒瀟岸千株菊使我晝立煩兒孫令我夜坐費燈燭洙曰言得書而有所思也趙曰煩兒孫者煩其侍立也憶子初尉永嘉去鄭曰永嘉溫州縣補注鶴曰公有送裴二尉永嘉詩紅顔白面花映肉軍符侯印取豈遲趙曰軍符則為節度使侯印則封侯矣補注希曰文帝紀注應劭曰銅虎符第一至第五國家當發兵遣使者至郡合符符合乃聽受之張晏曰符以代古之圭璋從簡易也師古曰謂郡守為符者謂各分其半右留京師左以與之又按百官表諸侯王金璽凡吏秩比二干石以上皆銀印師古曰古者印璽通言今則尊卑有别又漢儀六百石四百石至二百石以上皆銅印此皆為裴作郡也紫燕騄耳行甚速趙曰言初為尉之少年而材之俊逸紫燕文帝良馬列子周穆王駕八駿之馬而左騄耳洙曰言負超逸之才也師曰道州負超逸之才其視軍符侯印取之若其甚速豈困于永嘉一尉乎聖朝尚飛戰鬬塵濟世宜引英俊人黎元愁痛會蘇息夷狄跋扈徒逡巡授鉞築壇聞意旨洙曰晉禮志漢魏故事遣將出征符節即授節鉞於朝堂漢髙祖築壇拜韓信聞意首言當與此事也頽綱漏網期彌綸洙曰勉興滯補廢也郭欽上書見大計洙曰干寶著論思郭欽之謨而悮戎狄之有釁御史大夫郭欽言戎狄強獷厯世為患今西北方戎狄許雜居恐百代之後為患宜及平吳之功以復上郡帝不劉毅答詔驚羣臣洙曰晉武帝嘗顧謂劉毅曰朕方漢之何如主對曰桓靈也帝曰朕克已為理方之桓靈不亦甚乎對曰桓靈賣官錢入公府陛下賣官錢入私門以此言則知也他日更僕語不淺洙曰儒行孔子對魯哀公曰遽數之不能終其物悉數之乃留更僕未可終也注僕太僕也君燕朝則正位掌擯相更之者為久將倦故使之相代也明公論兵氣益振鄭曰振之人切傾壺簫管黑白髮洙曰黑一作理言得書而愁去白髮再黑儛劍霜雪吹青春洙曰項莊舞劍儛與舞同宴筵曾語蘇季子後來傑出雲孫比趙曰蘇季子蘇秦也徐稚傳角立傑出爾雅七世孫曰雲孫故自季子至侍御取其最逺者言之茅齋定王城郭門藥物楚老漁商市趙曰定王城乃潭州漁商市亦潭州之地市北肩輿每聨袂補注鶴曰茅齋謂蘇侍御所居與公同在長沙故每肩輿來聫袂公有為蘇大侍御渙作記異詩序云旅于江側凡是不交州府之客肩輿忽訪老夫舟楫而巳郭南抱甕亦隱几洙曰抱甕見汲井嵗榾榾注莊子齊物論南郭子綦隱几而卧無數將軍西第成洙曰衛青傳上為青治第令視之曰胸奴未滅無以家為趙曰後漢馬融為大將軍西第頌頗為正直所羞舊注引衛青治第事非是補注鶴曰北借以喻諸將平安史之亂各矜其功于京師置大第也漢有東第北第西第皆因其地云如相如傳所謂東第師古曰居帝城之東賜夏侯嬰北第以近北闕也早作丞相東山起洙曰謝安起于東山也趙曰班固曰山東出相舊注引謝安事非是公亦何拘于西對東邪鳥雀苦肥秋粟菽蛟龍欲蟄寒沙水洙曰鳥雀方得時而蛟龍退藏甫自喻也蘇曰漢末兵戈蝟起鹿門隱公歎曰秋稔菽粟鳥雀甚肥而鸞鳯何悴焉又鮑宰云鸞鳯棲荆艾蛟龍蟄寒水言小人升騰君子淹滯不見用也天下鼓角何時休陳前部曲終日死趙曰傷時干戈之未息以引下句激昻二公之致功名也附書與裴因示蘇此生已愧須人扶致君堯舜付公等早據要路思捐軀補注希曰平原君傳公等録録奉贈李八丈判官大厯四年作補注鶴曰詩云秋枯洞庭石風颯長沙栁當是大厯四年在潭州作舊注李八丈名曛我丈時英特宗枝神堯後洙曰神堯唐髙祖也珊瑚市則無洙曰珊瑚至珍也非市中所有之物騄驥人得有趙曰騄耳與騏驥穆天子八駿中有之故曰人得有早年見標格秀氣衝星斗洙曰劍埋于豐城而氣衝星斗之間言不可掩也事業富清機蘇曰曹顔逺思友詩精義測神奧清機發妙理官曹正獨守頃來樹嘉政皆已傳衆口艱難體貴安冗長吾敢取洙曰言于艱難之際能脫略細務也蘇曰漢文帝冗長中似人者亦可采取趙曰凡物之剩者為冗長長去聲陸機文賦今言為政本分之外其如物之冗長者吾不取之區區猶厯試炯炯更持久討論實解頤操割紛應手洙曰前漢匡衡曰匡説詩解人頤注使人笑不能止也趙曰莊子得之於心應之于手篋書積諷諫宫闕限奔走趙曰雖有諫書之多積滿朝篋而身則限不能造宫闕也又詩曰駿奔走入幕未展材洙曰材一作懷夢符曰右按晉史郤超在桓溫幕下謝安在外望見超曰郤生可謂是入幕之賓也秉鈞孰為偶洙曰鈞鈞衡也詩秉國之鈞言作相所親問淹泊泛愛惜衰朽趙曰論語泛愛衆如殷仲文云廣筵散泛愛遂以為朋友之呼矣垂白辭南翁委身希北叟洙曰馬融傳論得北叟之後福淮南子北叟失馬人皆弔之北叟曰此何詎不為福居數月其馬將駿馬而歸人皆賀之對曰此何詎不為禍家富馬良其子好騎墮而折髀人皆弔之對曰此何詎不為福居數年胡夷大入丁壯者皆控弦而戰塞上之人死者十九此獨以跛之故父子相保也趙曰前漢項籍使范增説項梁云南公稱曰楚雖三户亡秦必楚注云南公南方之老人也北叟出班固幽通賦云北叟頗識其倚伏則指塞上之翁為北叟也舊注引淮南子遂輒塞上之翁為北叟不知事則用淮南子而塞翁失馬字則班固也真成窮轍鮒洙曰轍中之鮒呼莊周求斗水之活或似喪家狗洙曰孔子世家纍纍如喪家狗秋枯洞庭石風颯長沙栁髙興激荆衡知音為回首趙曰水落石出所以為枯也洞庭長沙荆與衡皆相連之地師曰治聞記拂林國出珊瑚生水底大船載鐵網下水取之騏驥騄耳天下之良馬二物不可多得喻李公人所希有曹顔逺思友詩清機發妙理公有機謀故能建立事業又能守官忠正所親言李與杜同出陶唐氏南翁甫自稱言寓居荆南也北叟塞翁也甫委身之窮達希慕乎北叟洞庭長沙皆荆南之地知音為回首言有所思于李也别董頲大厯三年作補注鶴曰詩云窮冬急風水逆浪開船難蓋云董自嶽陽泝漢水而之鄧也當在大厯三年作詩又云老夫纜亦解公是時亦有適潭之期矣窮冬急風水逆浪開帆難士子甘旨闕不知道里寒洙曰急于養父母故不知道里寒有求彼樂土洙曰詩適彼樂土南適小長安趙曰光武紀注曰小長安故城在今鄧州公今詩言逆浪開帆若在潭州言之逆浪則往衡州而南矣補注鶴曰小長安當是指鄧後云漢陽峴首乃適鄧之所經行也别我舟楫去覺君衣裳單素聞趙公節兼盡賓主歡巳結門閭望無令霜雪殘趙曰趙公必知鄧州也董以甘旨之闕離母而往鄧故用母主事齊王孫賈之母謂賈曰汝朝出而晚來則吾倚門而望無令霜雪殘則屬其早歸也老夫纜亦解蘇曰山濤帖曰子幾日挂席東下老夫得風亦解纜矣人别宜慎重脫粟朝未餐夢符曰右按前漢公孫𢎞傳𢎞食一肉脫粟飯師古曰才脫粟而巳不精鑿也飄蕩兵甲際幾時懷抱寬蘇曰王逸少曰懷祖不來寒食俯至天氣晴明不見容貌使吾幾時寬此懷抱漢陽頗寧靜洙曰漢陽軍也在嶽陽峴首試考槃鄭曰峴胡典切山名在襄陽縣東十里洙曰詩考槃在澗趙曰峴首在襄州與鄧州相近公因董君之往鄧故語及之當念著白帽采薇青雲端洙曰管寧不應州郡之辟嘗著白帽趙曰公嘗有云白帽應須似管寧考之本傳云嘗著皂帽而杜佑通典作白帽豈今國志誤邪采薇則四皓之事也師曰孝子薦其甘旨董以甘旨有闕急於奉親故不知道里之寒小長安乃武都也明皇幸蜀後改為西京故云小長安或曰胤陽縣有小長安故城在今鄧州南陽郡西漢陽軍在嶽陽甫以此地寧靜欲寄居之故云試考槃考槃成其樂也補注希曰管寧傳雖云著皂帽而南史和帝紀百姓皆著下屋白紗帽故云又見寄峽州劉使君詩奉送魏六丈佑少府之交廣大厯三年作鄭曰海南郡補注鶴曰詩云遇我蒼梧陰按蒼梧山在道州今云隂當在潭嶽公大厯四年自嶽之潭而今詩又云解帆嵗云暮戎馬暗天宇則是三年在嶽州作是年八月九月吐蕃冦邠州虛州京師戒嚴故云若四年則無外夷之變賢豪贊經綸功成空名垂子孫不振耀洙曰一云子孫沒不振歷代皆有之鄭公四葉孫洙曰鄭公徴也長大常苦飢蘇曰安諒長大常苦飢寒負薪拾黍未嘗不帶書暇即誦習後以三傳馳名衆中見毛骨猶是麒麟兒趙曰嵇紹謂其友曰琅邪王毛骨非常殆非人臣之相寶志見徐陵謂曰此兒天上石麒麟也磊落正觀事致君朴直詞洙曰鄭公在正觀時多所獻替新史言犯顔正諫議者謂雖賁育不能遇家聲蓋六合行色何其微洙曰謂佑行色不稱家聲也莊子孔子説盜跖歸遇栁下季曰今者車馬有行色遇我蒼梧陰鄭曰舜葬處忽驚會面稀議論有餘地公侯來未遲趙曰蒼梧桂州之地古詩主稱會面難莊子曰刃有餘地虛思黃金貴洙曰一作遺自笑青雲期趙曰貴當作遺方在貧困之中故思以黃金饋之青雲期言貴達如在青雲之上自笑其期之逺也長卿久病渴武帝元同時洙曰蜀人楊得意為狗監侍上上讀子虛賦而善之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言為此賦上驚乃召問相如趙曰此魏佑病而能文不如相如之遇也師曰虛思黃金貴言黃金不足羡也自笑青雲期以卑宦為可哂也甫有渴疾故自比相如相如雖遇武帝官亦不甚顯也季子黑貂敝得無妻嫂欺洙曰蘇季子未用黑貂裘敝又出遊數嵗大困而歸兄弟嫂妹妻妾皆竊笑之尚為諸侯客獨屈州縣卑南遊炎海甸趙曰言其為少府也浩蕩從此辭洙曰之交廣也師曰炎海即南海甸謂郊甸浩蕩逺貌窮途仗神道洙曰正也世亂輕土宜師曰言避亂而輕去鄉土也解帆嵗云暮可與春風歸出入朱門家華屋刻蛟螭玉食亞王者洙曰洪範惟辟玉食樂張遊子悲趙曰以其為客也侍婢豔傾城綃綺輕洙曰一作煙霧霏掌中琥珀鍾行酒雙逶迤新歡繼明燭梁棟星辰飛兩情顧盼合珠碧贈于斯夢符曰右按博雅碧瓐玉也司馬相如子虛賦錫碧金銀趙曰言珠碧則交廣之所有也上貴見肝膽下貴不相洙曰一作見疑心事披寫間氣酣達洙曰一云逺所為錯揮鐵如意莫避珊瑚枝洙曰石崇傳崇與王愷爭豪武帝每助愷嘗以珊瑚樹賜之髙二尺許枝柯扶疏世所罕比愷以示崇崇便以鐵如意擊之應手而碎愷既惋惜崇曰不足恨乃命左右悉取珊瑚樹髙三四尺者六七株始兼洙曰一作無逸邁興終慎賓主儀趙曰雖氣之豪邁而賓主之儀不可不慎也師曰負此逸興要在慎賓主之儀斯能全其交如甫之于嚴武不慎其儀幾為武所殺故甫以是戒之戎馬暗天宇嗚呼生别離别張十三建封大厯四年作補注鶴曰詩云相逢長沙亭當是潭州大厯四年作建封嘗為徐州節度朝覲京師賦朝天獻夀詩嘗讀唐實録師曰實録國史也國家草昧初洙曰未治之初也補注鶴曰唐藝文志今上實録二十卷敬播顔胤撰房玄齡監修貞觀實録四十卷許敬宗撰又有皇帝實録三十卷公所讀者其此故知草昧時事劉裴建首議龍見尚躊躇師曰初髙祖鎮太原劉文靜裴寂首建議勸帝舉大事帝猶未允賴秦王贊之遂起兵故曰龍見尚躊躇秦王撥亂姿一劒總兵符洙曰撥亂謂撥開其亂也漢書撥亂反正漢髙祖持三尺劒取天下汾晉為豐沛洙曰汾晉唐公故鄉喻若漢祖之豐沛也暴隋竟滌除宗臣則廟食洙曰漢以蕭曹為宗臣子美以裴劉比蕭曹故曰宗臣廟食配享于廟也後祀何疏蕪趙曰以子孫之不顯達也彭城英雄種宜膺將相圖爾惟外曾孫倜儻汗血駒洙曰建封劉文靜外孫也汗血駒天馬種倜儻言其不羇之才眼中萬少年用意盡崎嶇洙曰少年雖衆用意無若建封者相逢長沙亭洙曰長沙潭州乍問緒業餘洙曰緒業世緒所業也乃吾故人子童丱聨居諸揮手灑衰淚仰看八尺軀內外名家流風神蕩江湖范雲堪結交洙曰梁書范雲初與髙祖遇于齊竟陵王子良邸又嘗接里閈髙祖受禪雲嘗侍宴髙祖謂臨川王宏等曰我與范尚書少親善申四海之敬今為天下主此禮既革汝宜代我呼范為兄二王下席拜與雲同車還尚書省時人榮之雲好節尚竒專趣人之急少時與領軍長史王咳善畡亡于官舍貧無宅居雲乃迎喪還家躬營唅斂嵇紹自不孤洙曰嵇康與山濤結神交康臨誅謂其子紹曰山公在汝不孤矣師曰甫得建封可以囑託其子故曰嵇紹自不孤擇材征南幕洙曰杜預為征南將軍潮落回鯨魚載感賈生慟洙曰賈誼弔屈原文彼尋常之汗瀆兮豈能容吞舟之魚橫江湖之鱣鯨兮固將制于螻蟻復聞樂毅書洙曰樂毅為燕伐齊燕惠王疑之使騎劫代毅毅畏誅遂降趙惠王遺毅書且謝之毅亦報書焉夏侯玄見其書以為知機合道以禮潮終始趙曰既為幕客而主人不禮之故如鯨魚之去落矣得無激昂慟哭欲有陳於朝廷而又有與主人絶之書乎主憂急盜賊師老荒京都洙曰人君方以盜賊為急憂師久無功故曰老舊丘復稅駕趙曰言主憂臣辱之時勉建封之必往無止息於舊丘也大厦傾宜扶君臣各有分管葛本時須趙曰管仲於齊諸葛亮于先主君臣相契皆定分也又勉建封之行矣雖當霰雪嚴未覺栝柏枯洙曰言不以嵗寒變易也禹貢杶幹栝柏髙議在雲臺洙曰見圖畫在雲臺注嘶鳴望天衢趙曰以駿馬比之可以致逺也羽人掃碧海功業竟何如洙曰十洲記言蓬萊山在碧海之中水皆碧色故曰碧海言當此之際建功業者如羽人掃碧海難為功爾趙曰羽人神仙也以其飛騰如有羽毛焉楚辭仰羽人于丹􅉌掃碧海以言其無一塵一芥之汚也蓋澄清天下之譬乎以建封為羽人其所望之深矣人日寄杜二拾遺上元二年蜀州刺史髙適作趙曰適於肅宗時為李輔國毁短下除太子詹事未幾蜀亂出為彭州刺史又遷蜀州補注鶴曰公大厯五年追酬詩序云往居成都時髙任蜀州刺史人日見寄詩自枉詩已十餘年則此合在上元元年作然上元元年人日公未有草堂殆是二年人日作而寄之人日題詩寄草堂洙曰草堂在浣花溪上遙憐故人思故鄉洙曰故人謂甫也故鄉謂長安也栁條弄色不忍見梅花蒲枝空斷腸洙曰空一作堪身在南蕃無所預洙曰南一作逺趙曰南蕃指甫寄居荆楚之地無所預言不預朝政也心懷百憂復千慮今年人日空相憶明年此日知何處洙曰此一作人一卧東山三十春豈知書劔與風塵洙曰與一作老風塵言盜賊起也龍鍾還忝二千石趙曰龍鍾行不進貌二千石謂其為蜀州刺史也愧爾東西南北人洙曰孔子曰􅉌也東西南北之人也則以孔子厯聘比杜公矣趙曰按集甫有詩曰甫也東西南北人故也追酬故髙蜀州人日見寄并序年大厯五作補注鶴曰大厯五年正月二十一日臧玠未亂公在潭州此詩當在潭州作故詩云瀟湘水國旁黿鼉開文書帙中檢所遺忘因得故髙常侍適往居在成都時髙任蜀州刺史人日相憶見寄詩淚灑行間讀終篇末自枉詩已十餘年莫記存沒又六七年矣老病懷舊生意可知今海內忘形故人獨漢中王瑀與昭州敬使君超先在愛而不見情見乎辭大厯五年正月二十一日却追酬髙公此作因寄王及敬弟自蒙蜀州人日作不意清詩久零落今晨散帙眼忽開迸淚幽吟事如昨洙曰迸淚言不可制也昨言近如昨日也嗚呼壯士多慷慨合沓髙名動寥廓歎我悽悽求友篇感君鬱鬱匡時略洙曰鬱鬱不伸貌言有匡君之略不得伸也錦里春光空爛熳瑶墀侍臣已𡨕寞趙曰適為刑部侍郎散騎常侍乃天子玉墀之從臣今追言其死而𡨕寞也補注希曰任豫益州記錦里在州南華陽國志成都萬里橋南岸道西有城故錦宫也命曰錦里瑶墀亦如禮樂志所謂瑶堂師古曰以瑶為飾瀟湘水國傍黿鼉趙曰公今和此詩乃在潭州故言潭州景也鄠杜秋天失雕鶚蘇曰劉向亡父老歎曰鄠邑杜陵何期風霜失于雕鶚也補注希曰楚人嘗獻黿于鄭靈公蓋水國所常有也嘗食之似鱉而大至百斤體具衆肉詩正義云鼉似蜥蜴四尺長丈餘甲如鎧皮堅可以冒鼓上林賦云擊鴻鼉之鼓爾雅王鳩郭云雕屬江東呼為鶚鄒陽傳鷙鳥纍百不如一鶚孟康曰大雕也師古曰鶚自大鳥而鷙者耳非雕也又李廣傳射雕師古曰大鷙鳥名公嘗進雕賦云雕者鷙鳥之殊特擊摶而不可當東西南北更堪論白首扁舟病獨存趙曰以答髙君東西南北之句且言其扁舟在潭也補注希日東西南北用孔子語貨殖傳乃乘扁舟孟康曰持舟也遙拱北辰纒冦盜洙曰北辰象帝居時猶為盜據未獲收復欲傾東海洗乾坤洙曰思滌去昏亂也邊塞西蕃最充斥洙曰西蕃吐蕃也充斥猶縱橫也衣冠南渡多崩奔洙曰南渡避亂也崩奔蒼黃貌趙曰晉元帝渡江而衣冠皆南渡今因借其意鼓瑟至今悲帝子洙曰湘妃堯之女也故曰帝子傳言湘靈鼓瑟也趙曰公在潭州故用潭州事以為悲焉曳裾何處覔王門洙曰鄒陽傳何王之門不可曳長裾此言愛漢中王而不見也文章曹植波瀾闊洙曰曹植陳思王也服食劉安德業尊洙曰劉安淮南王與八公著書言服食神仙事也長笛誰能洙曰一云鄰家亂愁思夢符曰右按後漢馬融傳有雒客舍逆旅吹笛融云京師逾年暫聞甚悲而樂之遂作長笛賦昭州詞翰與招魂洙曰昭州敬使君趙曰嵇康序云鄰人有吹笛者發聲寥亮追思曩昔遊晏之好感音而嘆故作賦云今公追思髙蜀州而及之蘇大侍御訪江浦賦八韻記異并序大厯四年作補注鶴曰蘇大侍御渙靜者也至亦記老夫傾倒于蘇至矣乃詩之序不當以為題合題曰蘇大侍御訪江浦賦八韻記異并序以暮秋枉裴道州手扎率爾遣興寄呈蘇渙詩考之當是大厯四年潭州作而梁權道編在嶽州詩內然前詩云定王城郭門肩輿每聫袂等句可知在潭不在嶽甚明蘇大侍御渙靜者也旅於江側不交州府之客人事多絶久矣肩輿江浦忽訪老夫舟楫已而茶酒內余請誦近詩肯吟數首才力素壯詞句動人接對明日憶其湧思雷出書篋几杖之外殷殷留金石聲賦八韻記異亦記老夫傾倒于蘇至矣龎公不浪出趙曰後漢龎德公居峴山之南未嘗入城府蘇氏今有之洙曰言亦不交州府也再聞誦新作突遇黃初詩趙曰文帝為魏太子七子從之遊皆能詩如謝靈運江文通皆擬其作黃初文帝即位年號也乾坤幾洙曰一作泊反覆揚馬宜同時洙曰司馬相如揚雄亦蜀人也師曰言世代變遷而名終不歇可與揚雄相如齊名於當是時也今晨清鏡中勝食齋房芝洙曰元封二年芝生甘泉齋房歌云齋房産草九莖連葉師曰清鏡中指江上勝食齋房芝言咀味蘇渙之詩遇于靈芝也余髮喜却變白間生洙曰一作添黑絲趙曰變白為黑以聞其詩之故昨夜舟天接洙曰一作接天湘娥簾外悲百靈未敢散洙曰言百靈聞誦詩而皆來也風破洙曰一作波寒江遲趙曰宗慤曰願乘長風破萬里浪送重表姪王砅評事使南海大厯四年作鄭曰砅理罽切水深至心曰砅今作厲補注鶴曰詩云畨禺親賢領謂李勉為廣州刺史當是大厯四年春嶽州作詳見注我之曾老姑爾之髙祖母爾祖未顯時歸為尚書婦洙曰新唐書王圭母李氏圭貞觀十年拜禮部尚書修可曰西清詩話云唐王圭微時母李氏嘗云子必貴但未見與汝遊者圭一日引房杜遇之母曰汝貴無疑所載至此質之子美是詩我之曽老姑爾之髙祖母則圭母杜氏非李氏也且一婦人識真主于側微其事甚偉史闕而不録是詩載之為悉世號詩史信不誣也隋朝大業末房杜俱交友趙曰王圭與房元齡杜如晦同學于文中子則交友可知矣長者來在門荒年自糊口洙曰陳平門多長者車轍左傳隱十一年糊其口于四方家貧無供給客位但箕帚俄頃羞頗珍寂寥人散後入怪鬢髮空吁嗟為之久自陳剪髻鬟鬻市充杯酒洙曰晉陶侃母常剪髮具酒食延賓客上云天下亂宜與英俊厚向竊窺數公經綸亦俱有趙曰王圭與元齡如晦善母李嘗曰兒必貴然未知所與逰者何如人會元齡等過其家李窺大驚曰二客公輔才汝貴無疑次問最少年虬髯十八九子等成大名皆因此人手下云風雲合龍虎一吟吼願展丈夫雄得辭兒女醜秦王時在坐真氣驚户牖趙曰秦王太宗也太宗有虬髯易曰雲從龍風從虎馬援曰乃知帝王自有真也及乎貞觀初尚書踐台斗洙曰圭貞觀中以侍中輔政夫人常肩輿上殿稱萬夀洙曰夫人以命婦預期會也六宫師柔順法則化妃后蘇曰班姬著內訓訓六宫作女針婦誡化及妃后補注鶴曰三代之制諸侯之婦曰夫人唐外命婦之制文武官一品國公母妻為國夫人三品以上妻為郡夫人王圭貞觀中為侍中唐侍中正二品則其母為郡夫人也通典云古者天子后立六宫三夫人九嬪二十七世婦八十一御妻以聽天下之內治又鄭玄云帝嚳有四妃以象后妃四星唐因隋制皇后之下有貴妃淑妃德妃賢妃至尊均嫂叔盛事傳不朽鳯雛無凡毛五色非爾曹趙曰古有鳯將雛之曲南史謝超宗作殷淑儀誄帝大嗟賞謂謝莊曰超宗殊有鳯毛往者胡作逆乾坤沸嗷嗷洙曰謂安祿山作亂也吾客左馮翊爾家同遁逃洙曰避亂也爭奪至徒步塊獨委蓬蒿逗遛熱爾腸十里却呼號自下所騎馬右持腰間刀左牽紫遊韁飛走使我髙洙曰公言避亂日輟白馬載我使走免難於危險之中昔鄴下童謡曰青青御路楊白馬紫戎韁茍活到今日寸心銘佩牢洙曰懷輟馬之恩也亂離又聚散宿昔恨滔滔水花笑白首蘇曰阮紹泛西池云白首登畫船反慮水花笑水花水芝皆蓮也趙曰公言在潭州濵于江故云春草隨青袍洙曰哀江南賦青袍如草趙曰以言王評事往南海也廷評近要津節制收英髦趙曰言南海節度使幕中要賢材也補注希曰漢宣帝地節三年初于廷尉置左右平員四人後漢光武省右平唯有左平魏晉以來直謂之廷尉評見六典注唐天寶中緣邊禦戎之地置八節度使得以專制軍事節制之名本于此故常衮節度使制云統節制之師此言廣南節度使也北驅漢陽傳南泛上瀧舠鄭曰瀧力公切又音雙舠都髙切洙曰漢陽地名傳傳車也如今之乘驛是矣舠小舟也右按嶺南人名急湍曰瀧趙曰傳郵馬之謂也自漢南而往故曰漢陽傳以有使南海之役故曰上瀧舠師曰傳有十二義漢文帝紀曰關無用傳此符傳也以木為之書符於其上又以一板封之所以為信也傳亦謂之棨或有用繻者終軍所棄是也髙祖紀曰乘傳詣洛陽此傳驛之傳也廣韻云南人名湍為瀧又州名在廣南音雙船三百斛曰舠舠短也江南所為名短而廣安而不傾危也北驅謂自北驅車而來遂從此南泛海泛海而往也補注鶴曰先君嘗官郴郴與韶連贛地相接鶴嘗自郴之桂陽之益漿問舟繇贛水之源以達于南安之上遊過所謂瀧者凡三蓋衆石束隘水自上湍瀉舟師藉羣力逆挽而下士人稱之為龍先君未之見而聞其説故有詩云溪注三瀧險山連五嶺雄案韻書瀧止收在四江內閭江切而于一東二冬皆不牧則不當如鄭云力公切趙云吕紅切也家聲肯墜地利器當秋毫洙曰肯墜地言能自振立不令委墜虞詡曰不逢錯節盤根何以知為利器也番禺親賢領洙曰縣名屬廣州也趙曰必宗室之子為節度也鄭曰番禺廣州屬縣補注鶴曰九域志廣州有番山禺山山海經云桂林八柱在賁禺東賁禺即番禺按舊史大厯三年十月以京兆尹李勉為廣州刺史充嶺南節度使五年勉猶一出兵共討臧玠則所謂親賢者蓋指勉也籌運神功操大夫出盧宋趙曰廣州節度使清白者四裴迪先李朝隱宋璟及盧奐所以比大夫于盧宋而又謂出其上也寶貝休脂膏洞主降接武趙曰謂亷潔而不汚于貨利也昔漢孔奮清潔身處膏脂而未嘗自潤降户江切廣南有溪洞蠻其長謂之洞主禮記曰堂上接武言相繼而降也海胡舶千艘夢符曰右按番禺雜編蕃商逺國運竒貨非舶不可市舶録劉向曰獨檣舶深五十餘用三木舶深五十餘肘西域以肘為度李虔通俗文曰晉曰舶趙曰舶大船也船總名曰艘猶今言幾隻也我欲就丹砂跋涉覺身勞洙曰葛洪聞交趾出丹砂求為句漏令至廣州刺史鄧洪留洪乃止羅浮山鍊丹安能陷糞土有志乘鯨鼇或驂鸞騰天聊作鶴鳴皋洙曰見李白騎鯨魚注别賦駕鶴上漢驂鸞騰天趙曰鯨莫大之魚也鼇巨鼇也師曰宗章羡王砅領此得就丹砂以錬養故有驂鸞鳴鶴之句詠懷二首大厯四年作補注鶴曰詩云飄颻桂水遊南為祝融客又云風濤上春沙逆行少吉日當是大厯四年春自嶽州上潭州時作人生貴是男洙曰莊子榮啓期三樂亦曰人之所貴者男也而豫幸得之一樂也丈夫重天機洙曰莊子天機不張注不露也未達善一身得志行所為洙曰孟子窮則獨善其身達則兼善天下嗟余竟轗軻將老逢艱危胡雛逼神器逆節同所歸河洛化為血公侯草間啼洙曰胡雛安史也逼神器言陷長安也安史亂河洛之間格鬭尤甚故云化為血公卿奔竄故啼于草間也西京復陷沒翠蓋蒙塵飛洙曰吐蕃陷京師天子幸陜故云補注希曰河洛既陷而京師亦為祿山所破故曰復陷非謂代宗時再陷于吐蕃下句云兩宫棄紫微可證若謂代宗陷陜不得謂之兩宫萬姓悲赤子兩宫棄紫微洙曰玄肅二宫也倐忽向二紀姦雄多是非本朝再樹立未及貞觀時日給在軍儲上官督有司洙曰國用尚乏屈不免上下督責也髙賢迫形勢豈暇相扶持疲薾茍懷䇿棲屑無所施洙曰言上下顧忌無所施為也先王實罪巳愁痛正為兹洙曰禹湯罪巳漢武哀痛之語皆先王之事也嵗月不我與蹉跎病於斯夜看酆城氣洙曰見紫氣衝牛斗注回首蛟龍池齒髮巳自料意深陳苦辭師曰轗軻不得志之貌紫微垣乃帝座也姦雄多是非言祿山敗思明又起也貞觀時米斗三錢行旅不齎糧今國用尚乏上下督責故云未及貞觀時髙賢迫形勢言進用者皆以勢援何暇扶持于甫哉疲薾甫自言衰老雖懷䇿略何所施設酆城獄有寶劍氣衝牛斗蛟龍得雲雨非是池中物甫自視齒髮豁凋不復若寶劒蛟龍之亨奮也邦危壞法則聖逺益愁慕師曰言祿山紊紀綱聖人巳逺不復見三代之治也飄颻桂水逰鄭曰郴州桂陽水北流入連州桂陽縣在桂水之陽悵望蒼梧暮洙曰桂水出會稽禹崩之地蒼梧舜葬之所補注鶴曰湘水出靈川之海陽行百里分南北北下曰湘南下曰灕桂州居湘灕分方之地公以湘水自桂州而來故云桂水蒼梧山在道州鄭以為桂陽水而公未嘗至郴王以出會稽而非嶽陽所經之道潛魚不銜鈎走鹿無反顧洙曰皆避難意夢符曰右按左氏傳古人有言曰鹿死不擇音鋌而走險急何能擇皎皎幽曠心拳拳異平素洙曰亂離之際不得遂其平昔幽曠之心而反拳拳然言屈身以求其全也衣食相拘閡鄭曰牛代切外間也朋知限流寓風濤上春沙十里侵江樹逆行少吉日師曰謂經厯風波之險也時節立復度井竈任塵埃舟航煩數具牽纒加老病瑣細隘俗務萬古一死生胡為足名數多憂汚桃源拙計泥銅柱鄭曰泥乃計切師曰昔秦人避亂于桃花源今我泥于銅柱山其計甚拙又且多憂得無汚辱于桃源乎未辭炎瘴毒擺落跋涉懼虎狼窺中原焉得所歷住洙曰盜賊充斥不可為久住計葛洪及許靖避世常此路賢愚誠等差自愛各馳騖師曰葛洪許靖皆避世之士其賢如彼愧吾之愚困于馳騖洙曰揚雄曰方其有事則聖賢馳騖不足羸瘠且如何魄奪針灸屢擁滯僮僕慵稽留篙師怒洙曰稽留遲滯也篙師舟人也終當挂帆席天意難告訴南為祝融客洙曰祝融峯地多神仙所居鄭曰衡山止有祝融峯勉強親杖屨結託老人星羅浮展衰步師曰祝融司南方茅君內傳曰大天之內有地中之洞天三十六所羅浮之洞周回五百里名曰朱明曜真之天羅浮山記曰羅浮者蓋總稱焉二山合體謂之羅浮在增城博羅二縣之境有神仙所居南極星中有老人星補注杜詩卷十五
