body:
  text: 補注杜詩巻六宋黄希原本黄鶴補注别贊上人乾元二年作補注鶴曰公以闗輔飢乃赴成州遂以乾元二年十月去秦州此詩云嵗暮飢餒迫野風吹征衣當是其時作百川日東流客去亦不息洙曰謝𤣥暉詩大江流日夜客心悲未央我生苦漂蕩何時有終極修可曰曹子建詩相思旡終極贊公釋門老放逐來上國師曰贊公與房琯逰從琯既待罪贊公亦被謫上國京師也還為世塵嬰洙曰陸士衡牽世嬰時網又世網嬰我身師曰贊公本脱俗人今反為世塵所累嬰累也頗帶憔悴色楊枝晨在手定功曰佛經云手把青楊枝徧洒甘露之水豆子兩巳熟蘇曰崔𤣥見習鑿齒曰豆子熟矣張亘曰豆子眼中黒精也言無邪視也趙曰今取楊枝字以見贊當春方為寺主來秦州而巳見豆子熟之際矣補注希曰梵綱經若佛子常應二時頭陀冬夏坐禪結夏安居常用楊枝而菩薩行頭陀時及逰方時行百里千里此常隨其身任淵云詩言贊公道力深妙楊枝揮洒便能致雨以熟豆田或然是身如浮雲君平曰維摩經是身如響屬諸因緣是身如浮雲須臾變滅是身如電念念不在安可限南北竦曰蔡謨初渡江曰此天所以限南北也異縣逢舊友初欣寫胷臆天長闗塞寒嵗暮飢凍逼洙曰一云長天闗塞逺嵗暮飢寒迫趙曰當作飢寒字别劉詩在十月而此云嵗暮者以見將為嵗暮之計以救飢寒也野風吹征衣欲别向曛黑洙曰鮑明逺詩野風吹秋木謝靈運詩朝逰窮曛黒馬嘶思故櫪洙曰嘶一作鳴歸鳥盡歛翼洙曰陶潛詩歸鳥趍林鳴古來聚散地蘇曰長安乃古今聚散榮辱之地崇山逺水惟與騷客作愁具宿昔長荆棘洙曰姑蘇臺詩荆棘霜露沾人衣相看俱衰年出處各努力蘇曰王導别阮彦曰宜努力為主古詩云明時各努力師曰此葢嘆兩都之地昔與贊公或聚或散扵此今經祿山之亂盡長荆棘况二人俱當衰年出處之迹可不勉乎萬丈潭乾元二年夏作洙曰同谷縣作補注鶴曰梁權道以為乾元二年自秦之同谷作然公以二年十月之同谷而此詩乃云何事炎天遇快意風雨會其年夏在秦按公有寄贊上人詩云徘徊虎穴上面勢龍泓頭兹乃云龍依積水蟠窟壓萬丈内殆是在秦州作又嘗以此詩參西枝村尋草堂地詩大概相類青溪合𡨕寞神物有顯晦龍依積水蟠窟壓洙曰一作厭萬丈内洙曰天台賦臨萬丈之絶𡨕跼步凌垠堮洙曰西京賦靈囿之中前後元有垠堮跼渠六切堮逆各切側身下煙靄前臨洪濤寛却立蒼石大山危一徑盡岸絶兩壁對削成根虛無洙曰顔延年詩踐華因削成倒影垂澹瀩洙曰一作賴天台賦序或倒影扵重溟鄭曰瀩徒對切猶澹沲也水帶沙往來貌如淳曰在日月之上反從下照故其影倒黑知一作又如灣澴底清見光炯碎孤雲倒來深飛鳥不在外髙蘿成帷洙曰一作帳幄寒木曡旌斾修可曰康協終南行楓丹杉碧疊旌立斾逺川曲通流嵌竇潛洩瀨造幽無人境洙曰天台賦卒踐無人之境發興自我輩告歸遺恨多將老斯逰最閉蔵脩鱗蟄出入巨石礙何當炎天過快意風雨會洙曰雨一作雲兩當縣呉十侍御江上宅乾元二年十月作俯曰按地理志鳯州兩當縣州西八十五里漢故道縣後魏置兩當以大散闗與嘉陵地勢險隘相當故云兩當補注鶴曰江即嘉陵江乾元二年秦州作九域志秦州西南至成州二百六十里兩當縣在鳯州城西鳯州亦西至成州二百七十里殆是公自秦西至同谷時道經兩當故作此詩乾元二年十月也圖經云古者相傳嘉陵江與朱沮水相㑹於縣界故云兩當又云東京西蜀至此三十程故名兩當本朝趙抃自成都被召還朝宿廣鄉驛有詩云被召趍都景物疏兩當中夜宿中途註云圖經云東京西蜀至此道里均焉驛在縣中寒城朝煙淡洙曰謝𤣥暉詩寒城一凝眺平楚正蒼然山谷落葉赤補注鶴曰鳯州有嘉谷即嘉陵江所出隂風千里來吹汝江上宅趙曰詳味詩意呉侍御遷謫之因為辨論良民不是姦細以此忤權貴而得罪耳首四句以秦地之時候景物言其宅在兩當縣之江上所以為之感激也兩當枕嘉陵江上鵾鷄號枉渚洙曰王徽之詩窈靄瀟湘空歘吸鵾鷄悲謝靈運詩弭楫薄枉渚楚辭朝發枉渚夕宿辰陽沈曰相如上林賦云藺𤣥鶴亂鵾鷄張楫曰鵾雞似鸖黄白色張無盡武陵圖經糾繆云武陵之東口二山一曰枉山吳均宋地居注云宋元嘉七年五月大水武陵枉山陷為枉渚大平御覽載湘州記云枉山在郡東十七里有枉焉山西溪口有小灣謂之枉渚革曰謹按兩當縣𨽻鳯州乃古雍州之地子美是詩云枉渚乃渚之斜曲而不直者非武陵湘潭之枉渚也敏功曰陸云答張士然詩曰通波激枉渚注云枉渚曲渚也亦以斜曲為義田曰鵾鷄楚地有之楚辭曰鵾鷄啁唽日色傍阡陌補注希曰漢成帝紀出入阡陌師古曰秦時商鞅所開也借問持斧翁㡬年長沙客洙曰武帝末暴勝之為直指使者衣繡衣持斧逐盜長沙長沙湖廣地名趙曰持斧御史事指言呉侍御也長沙即潭州賈誼所謫之地哀哀失木狖洙曰西都賦猿狖失木淮南子猿狖顛墜而失木矯矯避弓翮趙曰淮南子雁衘蘆而翔以避弋繳以比呉之失所也亦知故鄉樂未敢思宿昔昔在鳯翔都共通金閨籍洙曰謝𤣥暉詩既通金閨籍趙曰金閨金馬門也共通者公為左拾遺與呉共通籍也補注希曰寳應元年建夘月復以鳯翔為西都天子猶䝉塵洙曰僖二十四年傳臧文仲曰天子䝉塵于外敢不奔問官守東郊暗長㦸洙曰書秦誓東郊不開晁錯曰勁弩長㦸射疏及逺兵家忌間諜洙曰李牧為雁門謹烽火多為間諜此輩常接跡臺中領舉劾端本曰舉善劾有罪御史職也補注希曰按百官志治書侍御史掌舉劾百寮又後漢百官志侍御史十五人注掌察舉非法受公卿郡吏奏事有違失舉劾之呉既振職而忤宰相意是明年宰相裴冕苗晉卿張鎬未知忤誰君必慎剖析不忍殺無辜洙曰書與其殺不辜寧失不經所以分黑白上官權許與失意見遷斥洙曰謝靈運詩遭物悼遷斥師曰肅宗時祿山未平賊遣謀者行反間之言以中傷朝臣呉侍御作臺官正領舉劾之職毎得罪者必為之分剖曲直是非之理不忍濫殺無罪由是失宰相意遂見斥逐於兩當上官宰相也呉侍御雖有所辨明宰相雖權時從之必竟不悦以此故黜之仲尼甘旅人洙曰王弼仲尼旅人則國可知矣向子識損益修可曰後漢向長字子平潛隠於家讀易至損益卦喟然歎曰吾知富不如貧貴不如賤未知死何如生耳朝廷非不知閉口休歎息洙曰張厚曰此事巳知閉口何勞歎息余時忝諍臣趙曰時為拾遺也丹陛實咫尺洙曰僖九年傳天威不違顔咫尺相看受狼狽至死難塞責蘇曰吕産罪雖至死亦難塞責補注鶴曰肅宗即位次彭原詔御史論事勿先曰大夫宰相似有意於聴言矣而呉侍御以論良民不是姦細忤權臣而見斥杜公亦以論房琯而見疎今觀相看受狼狽之句可以覘其求言之非誠也行邁心多違洙曰詩行邁靡靡沈休文詩江海事多違出門無與適於公負明義惆悵頭更白趙曰落句見公之恨深矣師曰甫時為拾遺其去天子不逺可以諫矣坐看呉公之狼狽雖死不足責呉公之責盖甫自知扵呉公有負是以惆悵自刻責其非義也故云於公負明義惆悵頭更白補注鶴曰呉公以諫而黜杜公同在言路不能辨其屈徒作詩以自責異乎范文正公以讜直去國而余襄公上疏論救亦貶尹師魯歐陽公相繼論説又皆貶降扵此亦見本朝養成士氣可使沈黙偷安者為之愧死也發秦州乾元二年作洙曰乾元二年自秦州赴同谷縣紀行十二首補注鶴曰按九域志秦州西南至成州二百六十五里同谷乃附邑當是乾元二年赴同谷時舊註是矣我衰更懶拙生事不自謀無食問樂土洙曰詩適彼樂土師曰同谷在京之南不經殘破故云樂土無衣思南州彦輔曰楚辭嘉南州之炎徳南州氣暖故思南州漢源十月交鮑曰唐志漢源屬同谷郡大槩美同谷風土多暄利於貧士非九月十月之交去秦也補注希曰漢源同谷郡之中下縣近蜀故多暖天氣涼如秋草木未黄落蘇曰賈誼長沙十月草木尚未黄落加之蒸濕此人甚不宜風土况聞山水幽洙曰水一作東栗亭名更佳鄭曰今成州栗亭縣補注希曰九域志栗亭在成州東五十里亦縣名而唐志不言下有良田疇充腸多薯蕷洙曰永和初有採藥於衡山者道迷糧盡過息嵓下見一老公告之以飢與之食物如薯蕷後不復飢田曰陶隠居云薯蕷處處有之掘取食之以充糧圖經云胡閩中出一種根如芋而皮紫色煎煑食之俱美彼土人呼曰藷音殊山海經云景山北望沙澤多藷藇言與薯蕷同崖蜜亦易求蘇曰崖蜜乃櫻桃也陸機詩崖蜜珠蒲藍王子敬帖云山隂崖蜜珠甘嘉得多尤妙本草戴石蜜陶隠居云即崖蜜也髙山嵓石間作之色青赤味小噞食之心煩其蜂黒色似䖟劉禹錫云崖蜜則是一蜂如陶所説出南方嵓嶺間生懸崖上蜂大如䖟房著崖窟以長竿刺令蜜出承取之多至三四石入藥用勝於凡蜜鬼谷子曰百花醴蜜也崖蜜櫻桃也以子美此詩觀之十月間恐無櫻桃則崖蜜更無異議也補注希曰崖蜜則蜂扵崖石上所作之蜜成州多産此故貢以蠟燭李義山蜂詩云紅壁寂寥崖蜜盡碧簾迢逓霧巢空唐人大抵稱蜜為崖蜜也密竹復冬笋清池可方舟趙曰謝靈運登石門最髙頂詩宻竹使徑迷方舟並兩舩雖傷旅寓逺庶遂平生逰傷一作云此邦俯要衝實恐人事稠補注希曰此邦指秦州而言也應接非本性蘇曰阮嗣宗頗倦人事應接進退非吾本性趙曰王子敬過越州見潭壑澄澈清流瀉注云山川之美使人應接不暇登臨未銷憂洙曰王仲宣登樓賦登兹樓以四望聊暇日以銷憂谿谷無異石塞田始微收豈復慰老夫惘然難久留日色隠孤戍洙曰惘一作焹謝玄暉詩曰隠澗疑空烏啼滿城頭趙曰何遜詩團團頭日隠州烏啼滿城中宵驅車去飲馬寒塘流洙曰古詩飲馬長城窟磊落星月髙趙曰古詩兩頭纎纎新月生磊磊落落向曙星蒼茫雲霧浮修可曰庾信詩蒼茫雲貌同大哉乾坤内吾道長悠悠師曰言天地雖寛而吾道凋喪若無所容亦終於此而巳矣故曰吾道長悠悠赤谷乾元二年作補注鶴曰以晨發赤谷亭又前有赤谷西崦則此亭在秦州近境乾元二年作天寒霜雪繁洙曰詩正月繁霜趙曰孔子曰天寒既至霜雪既降逰子有所之洙曰李陵詩逰子暮何之豈但嵗月暮洙曰古詩淒涼嵗云暮又嵗月忽巳晩重來未有期洙曰蘇武詩相見未有期晨發赤谷亭險艱方自兹洙曰任彦昇詩晨發富春渚又云艱險方自知亂石無改轍洙曰曹子建詩中塗絶無軌改轍登髙岡我車巳載脂洙曰泉水詩載脂載轄還車言邁山深苦多風洙曰魏文帝苦戰行谿谷多風霜雪沾衣落日童稚飢洙曰苦寒行行行日巳逺人馬同時飢悄然村墟逈煙火何由追趙曰四望無煙火公詩言童稚苦飢而村墟尚逺煙火無所追求以造飯也師曰按地理志秦州隴城縣有大隴山亦曰隴首山三秦記云其坂九回上者七日乃越上有清水四注下俗歌曰隴頭流水鳴聲幽咽遥見秦川肝腸斷絶甫盖上大隴山故云云謂其坂九囘故也補注鶴曰按新舊史地理志隴城縣下不言有大隴師所注其殆本九域志而言與貧病轉零落洙曰一云飄零曹子建零落歸山􅉌謝靈運詩萬事俱零落故鄉不可思洙曰鬱鬱多愁思綿綿思故鄉魏文帝苦哉行還望故鄉鬱何壘壘常恐死道路洙曰論語寜死扵道路乎永為髙人嗤洙曰古詩但為後世嗤鐡堂峽乾元二年作補注鶴曰乾元二年三峽當是尚屬秦境詳見注山風吹逰子縹緲乗險絶逢元曰縹緲衣裳飛揚貌峽形藏堂隍立之曰山臺如堂隍峽蔵扵兩山之間補注鶴曰九域志秦州西北有上峽下峽峽口壁其此峽之分與又唐志成紀有鐵峽壁色立積鐵徑摩穹蒼蟠洙曰魏文帝修條摩蒼天常道立深谷下無底髙岩暨穹蒼趙曰徑之屈蟠而摩天以言髙也石與厚地裂脩纎無垠竹嵌空太始雪限一作垠空一作孔威遲哀壑底洙曰殷仲文詩哀壑叩虛無徒旅慘不悦洙曰謝靈運詩徒旅苦奔峭顔延年詩改服飾徒旅又𨼆閔徒御悲威遲良馬煩水寒長氷横魯曰謝靈運詩石横水分流我馬骨正折㫖熱切洙曰詩我馬瘏矣荀子折筋絶骨生涯抵弧矢盜賊殊未滅飄蓬踰三年趙曰飄蓬出商君書曰夫飛蓬遇飄風而行千里乘風之勢也古詩云轉蓬離本根飄飄畏長風迴首肝腸熱師曰弧矢言盜賊興也自盜賊竊發以來生涯抵弃不成家計抵弃也肝腸熱言憂則内熱也鹽井乾元二年作彦輔曰蜀都賦家有鹽泉之井補注鶴曰唐食貨志云唐有鹽井六百四十而黔州有井四十一成州巂州井各一果閬開通井百二十三功眉嘉州井十三梓遂綿合昌渝瀘資榮陵簡井四百六十以井指成州之井而言也雖地理志言秦州長道縣有鹽而食貨志所載鹽井則無故以為是成州之井且長道本𨽻成州又唐地理志成州有靜戎軍寳應元年徙馬邑州於鹽井城置鹵中草木白洙曰地舄鹵者生鹽修可曰許慎説文曰鹵鹽池也東方謂之斥西方謂之鹵又漢宣帝常困扵蓮勺鹵中注蓮勺縣有鹽池廣十餘里其鄉人名鹵中師古曰今在櫟陽縣青者官鹽煙蘇曰郭思瑶溪詩話作直者青鹽煙官作既有程洙曰程限也趙曰陳琳詩官作自有程煑鹽煙在川洙曰前漢呉王東煑海為鹽汲井嵗搰搰鄭曰古忽切子木名洙曰荘天地篇子貢見漢隂丈人方將為圃畦鑿隧而入井抱甕而出灌搰搰然用力甚多而見功寡出車日連連洙曰莊駢拇篇又奚連連如膠漆纒紏連結也天啟曰連連言運載不輟也自公斗三百轉致斛六千洙曰轉致言貿易也斗三百斛六千言其利相倍什補注希曰唐志云天寳至徳間鹽每斗十錢乾元元年第五琦為諸州權鹽鐵使盡摧天下鹽斗加時價百錢而出之為錢二百一十此詩作扵乾元二年何以乃云斗三百當是天下艱危因民所急而稅之劉晏之䇿行而愈昂矣君子慎止足修可曰張景陽詠史詩達人知止足小人苦喧闐我何良歎嗟物理固自然洙曰一云亦固然魯曰物有利則人爭取之此理之自然何可歎嗟乎寒峽乾元二年作魯曰寒峽雲門皆秦地名補注鶴曰乾元二年作秦成大抵多峽然秦至成之界垂二百里又七十里至成今公自十月去秦而至至此巳仲冬之交則此峽當在秦州之境行邁日悄悄洙曰詩行邁靡靡又憂心悄悄黄曰逺行曰邁山谷勢多端雲門轉絶岸積阻霾天寒洙曰爾雅釋天風而雨土為霾寒峽不可度我實一作貧衣裳單况當仲冬交師曰甫自秦至此巳十一月故云仲冬交甫於詩皆以年月紀欲後世有所考其行止也不然何以謂之詩史乎泝㳂増波瀾野人尋煙語行子旁水餐此生免荷殳鄭曰荷何佐切負也洙曰候人詩荷戈與殳蘇曰劉肅退居嵩嶺恬然自樂謂兒侄曰爾輩當勉力井春此生何望青雲致身儻免荷戈執殳其幸亦非細未敢辭路難法鏡寺乾元二年作補注鶴曰同上是乾元二年作詩云愁破崖寺古意尚在秦州也身危適他州黄曰身危謂避闗輔之飢也勉强終勞苦蘇曰陶侃勉强仕宦終亦勞心苦力但歸老田園養此疲薾可矣神傷山行深秦曰山行深謂經九曲坂頗令人傷神補注希曰荀粲妻亡不哭而神傷愁破崖寺古嬋娟碧鮮淨洙曰呉都賦檀欒嬋娟玉潤碧鮮謂竹趙曰碧鮮言竹也竹謂之嬋娟唐孟郊有三嬋娟詩曰竹嬋娟月嬋娟人嬋娟也補注希曰竹謂之嬋娟盖起扵楚辭初放云便娟之脩竹兮寄生扵江潭注便娟好貌蕭摵寒籜聚鄭曰摵子六切又所隔切洙曰謝靈運詩初篁苞綠籜盧子諒詩摵摵芳葉零回回山根水洙曰山一作石劉公榦詩回回自昏亂冉冉松上雨洩雲䝉清晨洙曰魏都賦窮岫泄雲日月恒翳顔延年詩泄雲巳漫漫多雨亦淒淒田曰洩與泄同泄猶出也初日翳復吐洙曰曹子建詩微隂翳陽景朱甍半光炯鄭曰甍謨耕切炯古迥切光也户牖粲可數色主切拄策忘前期出一作髙蘿巳亭午洙曰天台賦羲和亭午定功日廣雅日在午𡨕𡨕子規呌洙曰子規一名杜宇蜀人以為望帝魂趙曰谷説云望帝化為子規補注希曰子規春鳥也春深乃嗚今仲冬之交而其聲已聞地氣之暖使然也公去秦以赴南州之暖可見矣微徑不復取師曰甫欲少憩此寺奈聞子規聲起人思鄉况徑陌微窄難以取就一逰扵是前邁故云云青陽峽乾元二年作補注鶴曰詩謂之塞外又謂東笑蓮花卑則非秦地矣又云作憶踰隴阪當是乾元二年作塞外苦厭山南行道彌惡師曰天下山惟南最多甫自秦適同谷是自北之南也岡巒相經亘洙曰盧子諒詩岡巒挺茂樹雲水氣參錯洙曰謝靈運詩遡流觸驚急臨坼阻參錯林迥峽角來天窄一作穿壁面削磎西五里石鄭曰磎苦奚反今作溪奮怒向我落仰看日車側洙曰後漢李尤九曲歌安得力士翻日車俯恐坤軸弱蘇曰張化曰日車轉側羲和無功趙曰淮南子注曰乗車駕以六龍坤軸即地軸也此言落石之聲勢以其聲震天而日車為之側其勢可以壓地而坤軸為之弱也魑魅嘯有風魑丑知切魅明袐切洙曰天台賦始經魑魅之塗鮑明逺蕪城賦水魅山鬼野䑕城狐風嘷雨嘯昏見晨趨蘇曰何遜詩林間夕風生隔水魑魅嘯工部言亂世無正人使魑魅向風而嘯霜霰浩漠漠昨憶踰龍坂洙曰四愁詩欲往促之龍坂長趙曰漢書天水郡注有大坂名曰龍坂偶曰秦州記曰隴坂九曲不知髙㡬里髙秋視呉岳泰伯曰周禮雍州其鎮曰嶽山注云呉岳也漢志呉山在汧縣西彭曰國語謂之西呉秦都咸陽以為西岳東笑蓮花卑見蓮峰望忽開注北知崆峒薄見聊欲倚崆峒注補注希曰呉岳在隴州廣雅曰岳謂呉岳也頂五峯周禮職方氏雍州山曰岳漢書地理志呉岳在汧縣西古文謂之州秦都咸陽以為西岳此公自華之秦時所見也呉岳之髙東卑蓮峰北薄崆峒今之青陽峽猶見其突兀趂人也蓮峯在泰山崆峒在岷州超然侔壯觀古亂切洙曰景福殿雖咸池之壯觀夫何足以比讎趙曰言青陽峽山超峙而起可侔呉岳之壯觀已謂殷寥廓殷音隠洙曰天台賦太虛寥廓而無閡突兀猶趂人及兹嘆𡨕寞嘆一作欲趙曰謂至其趂人之際嘆神造之𡨕寞而不可測也龍門鎮乾元二年作補注鶴曰龍門鎮在河南縣然非秦州往成州之路詩又云沮洳棧道濕殆是成州亦有鎮與之同名又詩云防虞此何及嚴礪元和中嘉陵江二百里通漕以饋成州戍兵其在此與細泉兼輕氷沮洳棧道濕洙曰魏汾沮洳潤濕之處故為沮洳漢髙紀燒絶棧道師古曰棧即閣也今謂之閣道不辭辛苦行迫此短景急洙曰舞鶴賦急景凋年歐曰短景急言日短急扵奔程也石門雲雷一云雪雲隘一作溢古鎮峯巒集旌竿暮慘澹風水白刃澁胡馬屯成皋趙曰成皋鞏落之地意言安史之兵耳舊以囘紇非也是時乾元二年之冬回紇未反不可妄引也補注鶴曰胡馬指史思明按史乾元二年九月庚寅思明陷東京及齊汝鄭滑四州防虞此何及洙曰言已後時矣嗟爾逺戍人山寒夜中泣洙曰陸士衡詩苦哉逺征人拊心悲何如石龕乾元二年作補注鶴曰石龕在成州近境同是乾元二年作熊羆咆我東咆蒲交切虎豹號我西洙曰魏武帝苦寒行熊羆對我蹲虎豹夾路啼號胡刀切補注希曰楚辭招隠士虎豹鬭兮熊羆咆又九思將升兮髙山上有兮猿㺅將入兮深谷下有兮虺蛇左見兮鳴鵙右覩兮呼梟爾雅曰熊羆醜又羆如熊黄白文我後鬼長嘯我前狨又啼鄭曰狨而中切獸也山鬼雨嘯見前蘇曰楊大年云狨之形似䑕而大尾長作金色生川峽深山中人以藥矢射殺之取其尾為卧褥鞍被坐氊之用狨甚愛惜其尾既中毒即囓斷其尾以擲之惡其為身害也盖輕㨗善緣木猿之類趙曰四我乃公之新格劉琨扶風歌止曰鹿逰我前猿戲我側兩句而已天寒昏無日山逺道路迷蘇曰梁諤入黔中山逺林茂鳥道欹危煙霧𡨕暗咫尺路迷驅車石龕下仲冬見虹霓蘇曰惠帝時仲冬虹霓晝見三日國政頽圮節令不時諸侯㺯權師曰虹隂氣也孟冬三月虹不見今見扵仲冬謂隂勝扵陽有臣侵君之象伐竹者誰子竹一作木補注鶴曰黄庭經問誰家子在我身悲謌上一作抱雲梯趙曰雲梯字起扵墨子曰公輸班為雲梯為官采美箭五嵗供梁齊趙曰爾雅東南之美者有㑹稽之竹箭也梁謂汴州齊謂今之山東皆安史之兵所在也故采箭以供官用矣補注希曰本禹貢注箘簵美竹云可以為箭自天寳十四載至今乾元二年為五年苦云直簳盡鄭曰簳口旱切亦作笴無一作應以充提攜洙曰仲冬之月日短至則言伐木取竹箭堅成極時蘇曰郭璞秋日攜杞菊親與大鮑曰貧者無以献聊不空手充提携故也奈何漁陽騎颯颯驚蒸黎趙曰漁陽騎指言安慶緒之兵也禄山反長驅陷兩京天下震駭故云颯颯如風之疾也積草嶺乾元二年作補注鶴曰詩云卜居尚百里休駕投諸彦邑有佳主人情如已㑹面則積草嶺在同谷縣邊境公将到縣得縣令書故云連峯積長隂詠曰謂草木隂翳也白日遞隱見鄭曰遞待禮切更也見形甸切詠曰言日光映射一有一無也颼颼林響交慘慘石狀變山分積草嶺路異明水縣蘇曰劉安微時為明水縣吏旅泊吾道窮希聲曰仲尼曰吾道窮矣王弼曰仲尼旅人衰年嵗時倦卜居尚百里休駕投諸彦洙曰江淹云金閨諸彦蘇曰季尤休駕沐浴投諸英彦趙曰屈原有卜居篇諸彦出謝靈運擬鄴中詩序有云二三諸彦舊注所引在後矣邑有佳主人情如巳㑹面趙曰古詩古稱㑹面難來書語絶妙蘇曰沈約得來書詞語絶妙筆墨遒勁無一糝塵俗氣味可愛逺客驚深眷食蕨不願餘茅茨眼中見洙曰陸士衡詩彷彿眼中人趙曰左太冲詠史詩飲河期滿腹貴足不願餘補注希曰南史王彧字景文袁粲見之稱其風流或云景文比謝叔原猶為野父粲惆悵良久曰但眼中不見此人泥功山乾元二年作補注鶴曰唐去云成州寳應元年設吐蕃貞元五年於同谷縣之西境泥功山置行州自秦至成不滿三百里涉兩月乃至為詩十有二備言辛苦飢寒之狀觀其詩想其時為長太息也朝行青泥上暮在青泥中泥濘非一時濘乃定切版築勞人功不畏道路一作途逺反將一云乃將一云及此汩没同趙曰公言反同版築之人同汩没於泥中也白馬為鐵驪洙曰馬青色曰驪小兒成老翁哀猿一作猱透却墜死鹿力所窮趙曰詩野有死鹿故用之鹿之所以死以力窮扵泥中走困也寄語北來人後來莫怱怱鳯凰臺乾元二年作魯曰此詩思見太平之君子也鄭曰酈道元水經注水南逕槃頭郡東而南合鳯溪水水上乗蜀水扵廣業郡南涇鳯溪中有二石雙髙其形若闕漢時有鳯凰止其上故謂之鳯凰臺北去郡三里補注鶴曰乾元二年赴同谷時作亭亭鳯凰臺洙曰謝恵連詩亭亭映江月西京賦干雲霧以上達狀亭亭以迢迢師曰乃秦弄玉與蕭史吹簫扵此所謂鳯凰臺上憶吹簫是也端木曰亭亭髙貌北對西康州鄭曰地理志河北郡後周改曰鳯州領同谷舊曰白石置廣業郡西魏改曰同谷後周置康州大業初廢唐地理成州同谷郡武徳元年以同谷置西康州貞觀元年州廢西魏槃頭郡亦唐興州之長舉縣也西伯今寂寞鳯聲亦悠悠洙曰西伯文王也西伯時鳯鳴扵岐陽師曰文王七年受天命鳯鳴於岐岳而興王道自文王既没鳯聲亦息而不聞是詩寓意傷當世賢者不進盖鳯之為物有道則見無道則隠喻賢者出處之道山峻路絶蹤石林氣髙浮安得萬丈梯為君上上頭恐有無母鶵飢寒日啾啾我能剖心出飲啄慰孤愁心以當竹實炯然忘外求血以當醴泉豈徒比清流所重王者瑞敢辭微命休夢符曰春秋元命苞周成王時大治鳯凰來舞扵庭成王乃援琴而歌鳯凰翔兮于紫庭余何徳兮以感靈又瑞應圖曰鳯王者之嘉瑞補注希曰爾雅釋鳯郭云瑞應鳥鷄頭蛇頸燕頷龜背魚尾五彩色天老曰出扵東方君子之國翺翔四海之外見則天下大安寧坐看綵翮長舉意八極周自天銜瑞圖一云圖䜟飛下十二樓洙曰十洲記曰崑崙山有十二玉樓圖以奉一作獻至尊修可曰春秋元命苞黄帝逰元扈洛水之上注元扈石室也與大司馬容光等臨觀鳯銜圖置帝前帝冄拜受圖鳯以垂鴻猷薖曰鴻猷大道也鳯乗鴻猷所以表大道再光中興業一洗蒼生憂深衷正為此羣盜何淹留師曰此甫所以感鳯而思見賢人以致治平之效也乾元中寓居同谷縣作七首乾元二年作魯曰同州縣名補注鶴曰公乾元二年十二月至同谷以十二月入蜀寓居同谷才一月耳有客有客字子美洙曰以其寓居故自稱有客子美甫字也白頭亂髮一云短髮垂過耳嵗拾橡栗隨狙公洙曰按新史言甫居同谷縣拾梠以自給皃女有至餓殍者夢符曰右按列子宋有狙公愛狙而養之先誑之曰與若芧朝三而暮四足乎衆狙皆起而怒俄而曰與若芧朝四而暮三足乎衆狙皆伏而喜注芧栗也補注鶴曰莊子狙公賦芧曰朝三暮四衆狙皆怒疏曰芧橡子也似栗而小史謂云客秦州負薪采橡栗自給豈獨在秦然也今殆至成亦然天寒日暮山谷裏中原無書歸不得手脚凍皴皮肉死鄭曰皴七倫切皮細起也師曰甫自傷饑寒不得歸鄉悲風為生天為之與動况人乎嗚呼一歌兮歌巳哀悲風為我從天一作東來其二長鑱長鑱白木柄鄭曰鑱鋤銜切呉人云犁鐡説文鋭也我生託子以為命黄精一作黄獨無苗山雪盛蘇曰木栩貧居嘉陽常負鑱采黄獨一日雪盛不獲黄精當作黄獨往時儒者不解黄獨改作黄精魯直云以予攷之黄獨是也本草赭魁注肉白皮黄也漢人蒸食之山東人呼為土芋江西人呼為土邜蒸食之類芋魁補注希曰諸本皆作黄精一本作黄獨王内翰故云一作黄獨本草芋條下云芋魁一名黄獨山雪一本作山日芋得日㬠則其苗損而下實故公云無苗山日盛鶴曰本草云黄精久食輕身延年故河南嵗貢今公寓同谷巳是仲冬則山日無應云盛芋又巳收意只是採黄精亦猶拾橡栗也黄精是時無苗又值山雪之盛所以有子空歸來之句若芋則種有定所不勞負鑱入山矣短衣數挽不掩脛鄭曰胡定切脚脛也洙曰寗戚叩角歌曰短布單衣不及其肘此時與子空一作同歸來男呻女吟四壁靜洙曰相如家居徒四壁立嗚呼二歌兮歌始放閭一作鄰里為我色惆悵洙曰首章天哀其窮次章人亦哀其窮矣師曰閭里尚為之惆悵况親戚舊故乎其三有弟有弟在逺方一作各一方三人各瘦何人强洙曰後漢趙孝弟禮為賊所得將食之孝自縛請賊曰禮瘦不如孝肥賊感其意俱舍之生别展轉不相見洙曰樂府他鄉各異縣展轉不相見胡塵暗天道路長洙曰詩阻且長道東飛駕鵝後􅒗鶬鄭曰駕古牙切鳥名􅒗七由切鶬七剛切洙曰揚雄傳豈駕鵝之能捷􅒗鶬惡禽也鶬九頭詩有􅒗在梁補注鶴曰楚辭謬諫畜鳬駕鵝雞鶩滿堂壇兮注畜養鵝鶩親近小人滿扵堂壇又大招鵾鴻羣晨雜􅒗鶬今公云喻史思明㨿東都也安得送我置汝傍嗚呼三歌兮歌三發汝歸何處收兄骨洙曰收一作取僖三十二年殽有二陵必死是間余收爾骨非時巳窮而巳而兄弟之親亦莫知其存云其四有妹有妹在鍾離魯曰地理志濠州鍾離郡良人早殁諸孤癡長淮浪髙蛟龍怒十年不見來何時一作遲扁舟欲往箭滿眼杳杳南國多旌旗嗚呼四歌兮歌四奏林猿一作竹林為我啼清晝洙曰猿非有情者而亦為之啼則窮可知矣蘇曰舊作竹林後人改為林猿今本皆因之蔡絛云崇寧間有貢士同州來籠一禽大如雀色正青善鳴問其名此竹林鳥也少陵扵詩必紀其處以明風俗方物詔扵後人豈易改也師曰猿乃無知之物今為我啼盖哀傷之至也其五四山多風溪水急寒雨颯颯枯樹濕一云樹枝濕黄蒿古城雲不開白狐一云𤣥狐跳梁黄狐立鄭曰跳徒聊切躍也我生胡為在窮谷中夜起坐萬感集洙曰謝靈運詩千念集日夜萬感盈朝昏王康琚詩哀風中夜起補注希曰書中夜以興陸士衡中夜嘆息嗚呼五歌兮歌正長魂招不來歸故鄉洙曰招魂曰魂兮歸來師曰甫身雖寓同谷而魂夢未嘗忘故鄉可謂思鄉之甚也其六蘇曰六謌一篇為明皇作也明皇以至徳二年至自蜀居興慶宮謂之南内明年改元乾元時持盈公主往來宫中李輔國常隂候其隙間之故上元二年常遷西内南有龍兮在山湫逸曰湫龍潭也古木巃嵸枝相樛鄭曰巃盧紅切嵸子紅切洙曰劉安招隠士桂樹生叢兮山之幽偃蹇連巻兮枝相樛山氣巃嵸兮石嵳峩敏功曰樛乃枝曲下垂貌木葉黄落龍正蟄洙曰秋風辭草木黄落鴈南飛蝮蛇東來水上逰蝮芳福切洙曰招魂曰蝮蛇蓁蓁敏修曰龍蟄喻天子失勢蝮蛇東來喻祿山従山東來補注希曰南有龍喻𤣥宗在南内木葉黄落龍正蟄喻𤣥宗䝉塵蝮蛇東來謂史思明陷魏州非喻祿山従山東來是時祿山死久矣我行怪此安敢出拔劍欲斬且復休嗚呼六歌兮歌思遲思相吏切洙曰一作怨遲溪壑為我回春姿洙曰鄒衍被䜛仰天而泣五月為之降霜則士之怨憤足以感通扵造物而然矣其七男兒生不成名身已老三一作十年飢走荒山道補注希曰三年飢走謂自天寳十五載避亂至今也長安卿相多少年富貴應須致身早師曰肅宗中興所用皆後生晩進元勲舊徳如郭子儀尚見齟齬它可知也故云云山中儒生舊相識但話㝛昔傷懐抱嗚呼七歌兮悄終曲仰視皇天白日速洙曰江文通詩青春速天機素秋馳白日傷時不我留也師曰云白日速盖傷日月逝矣嵗不我與所謂富貴不來年少去是也發同谷縣乾元二年作鄭曰同州縣名師曰乾元二年甫寓同谷屬同谷饑歉又自同谷入蜀此詩以下皆㳂道紀行補注鶴曰為同谷郡治同谷公以乾元二年十一月至不盈月遂行趙許成都府詩云公嘗自注此詩云乾元二年十二月一日自隴右赴劒南不知據何本而云然水㑹渡詩云微月已没久則發扵一日或是賢有不黔突聖有不暖席洙曰文子曰墨子無黔突孔子無暖席補注希曰淮南子務脩訓曰孔子無黔席班固答賓戯曰孔席不暖墨突不黔二書雖異文而意皆聖賢之不安逸也况我饑愚人焉能尚安宅洙曰聖賢尚不免此吾豈能安宅乎始來兹山中休駕喜一作嘉地僻奈何迫物累一嵗四行役大臨曰詩父曰嗟于季行役師曰一嵗之中凡四行役夏發華州十一月離秦州故詩云漢源十月交十一月至成州故云仲冬見虹霓十二月發同谷故云云忡忡去絶境杳杳更逺適停慘一作驂龍潭雲迴首白崖石一作虎崖臨岐别數子握手淚再滴洙曰江淹詩罇酒送征人握手淚如霰雖舊情深知洙曰一云交情無舊深趙曰公扵同谷寓居未久葢多新交而惜别之情則如故舊之深逺窮老多慘戚平生懶拙意偶值棲遁跡洙曰郭景純詩京華㳺俠客山林隠遁棲去住與願違趙曰嵇康云事與願違却慙林間翮洙曰陶潛遲遲出林翮蘇曰裴嚀法注不能如願四海干戈未息出門無食仰見飛鳥顧子曰吾弗如此物羽翮飲棲出入自得長嘆久之孝祥曰林間鳥尚得林憩而甫奔走無定居反有媿扵林間之翮乎木皮嶺乾元二年作補注鶴曰嶺在成州之西境入蜀忙道經此詩云季冬攜童稚辛苦赴蜀門當是乾元二年十二月作首路栗亭西洙曰首音狩謂命車向西行也尚想鳯皇村馬曰依悒不忍去之意補注鶴曰栗亭鳯皇村皆在成州公嘗賦鳯皇臺詩云亭亭鳯皇臺北對西康州地理志云同谷縣置西康州則臺與村在成州之北而栗亭在州東也季冬攜童一作幼稚辛苦赴蜀門魯曰即劍門也南登木皮嶺艱險不易論補注鶴曰蜀在成州之南故曰南登汗流被我體洙曰喻蜀檄流汗相屬大觀曰漢史汗流洽背祁寒為之暄洙曰書冬祁寒逺岫爭輔佐千巖自崩奔洙曰雪賦瞻山則千巖俱白謝靈運詩坼岸屢崩奔始知五岳外别有一作見他山尊趙曰張昶華山碑云山莫尊扵岳仰干一作看塞大明俯入裂厚坤師曰自逺岫爭輔佐以下託意譏祿山不知君臣之義岫尚左右輔佐此山之尊千嵓為之崩奔如千官奔走以趨王事者也别有他山尊喻祿山僭稱帝號大明君道也仰干塞大明言祿山自髙大干犯國紀而掩蔽扵君俯入裂厚坤言郡縣之地為祿山所割據也再聞虎豹鬬洙曰劉安招隠士虎豹鬬兮熊羆咆蘇曰徐庶見孔明曰虎豹再鬭必有一傷先生何法以格之孔明曰使三分即無鬭矣屢跼風水昏髙有廢閣道洙曰棧道也摧折如短轅短斷云下有冬青林洙曰今之梗柟也鮑曰木名經冬不凋今所在多有之石上走長根西崖特秀發煥若靈芝繁潤聚金碧氣洙曰蜀都賦金馬馳光而絶影碧雞倐忽而曜儀連珠金碧之嵓必辱鳯舞之使清無沙土痕憶觀崑崙圖一作墟目擊𤣥圃存洙曰𤣥圃凉風在崑崙中見淮南子炎曰莊子目擊而道存南史梁簡文自扵𤣥圃講老莊補注希曰崑崙第二級名曰𤣥圃周穆王駕八駿之乗升崑崙之􅉌賓扵西王母觴扵瑶池之上又神仙傳曰崑崙一名𤣥圃一名積石瑶房一曰閬風室一曰華蓋一曰天柱又楚辭天問崑崙縣圃其尻安在注崑崙山名在西北元氣所出其巔曰縣圃縣圃乃上通於天也對此欲何適黙傷垂老魂白沙渡乾元二年作補注鶴曰渡之水逕槃頭郡東南合鳳溪水水上乗蜀水扵廣業郡者也又唐志云元和中節度使嚴礪自興州長舉縣西流嘉陵江二百里通曹以饋成州戍兵詩作扵乾元二年十二月畏途隨長江洙曰莊子畏途者十殺一人則父子兄弟相戒蒭曰釋文云險阻道可畏懼者也渡口下絶岸趙曰海賦絶岸千丈差池上舟楫差初加切杳窕入雲漢天寒荒野外日暮中流半我馬向北嘶洙曰古詩胡馬嘶北風山猿飲相喚水清石礧礧魯水切沙白灘漫漫洙曰沈休文歸海水漫漫迥一作倐然洗愁辛蘇曰王夷甫得書洗我愁辛多病一疏散蘇曰嚴助逰陸渾山歎曰多病無聊來此疏散以釋沈鬱之興髙壁抵嶔崟洙曰一作岑嶔去金切崟鋤針切洪濤越凌亂洙曰曹植泛舟越洪濤恵連清波時凌亂臨風獨囘首蘇曰王筠臨風長想英猷時復回首東望攬轡復三歎朋曰范滂攬轡慨然有澄清天下之志趙曰左傳置食三歎禮記一唱三歎師曰甫遭亂離故㤀於奔走羇旅是以有范滂澄清之志奈何時不見用亦止扵再三咨嗟傷不得其志也水會渡乾元二年作魯曰一云水回渡補注鶴曰渡名水㑹即前所謂合鳯溪也詩云微月没巳久當是乾元二年十二月初至此山行有常程中夜尚未安蘇曰冦恂中夜悲愁不得安寢微月没巳久崖傾路何難洙曰謝靈運詩崖傾光難留蘇曰程煜傾崖㫁路人馬不通如逢泥木去住多難趙曰丘希範云崖傾嶼難傍大江動我前洙曰謝𤣥暉詩大江流日夜洶若溟渤寛洙曰鮑明逺詩穿池類溟渤篙師暗理楫洙曰謝靈運詩理棹遄還期夢符曰右按左太沖呉都賦篙工檝師選自閩禺習御長風狎玩靈胥責千里於寸隂聊先期而須臾謌笑輕波瀾蘇曰謝眺新城路上詩呉兒未習水謌笑欺波瀾霜濃木石滑風急一作烈手足寒入舟巳千憂洙曰謝靈運詩入舟陽巳微陟巘仍萬盤洙曰詩陟則在巘趙曰倣陸士衡詩仰陟髙山盤迴眺一作出積水一作石外補注鶴曰常是作積石葢積石山在河州而成與岷河鳯三州不逺河州又有鳯林縣疑是鳯溪鳯州鳯皇村同得名始知衆星乾逺逰令人瘦衰疾慙加餐洙曰古詩思君令人老又努力加餐飯謝靈運衰疾當在斯揚曰曹子建沈憂令人老又吾得行逺逰逺逰欲何之飛仙閣乾元二年作補注鶴曰自此上棧道矣飛仙以言其髙乾元二年作土門山行窄土一作出微徑緣秋毫洙曰一云徑微上秋毫蘇曰張儀過太行曰微逕穿雲仰視縁雲若秋毫蟠折棧雲闌干峻梯石結構牢洙曰見新亭結構罷注萬壑欹疏林一作竹趙曰顧愷之萬壑爭流積隂帶奔濤寒日外淡泊長風中怒號洙曰莊子風作則萬竅怒號歇鞍在地底始覺所厯髙往來雜坐卧人馬同疲勞蘇曰李陵人疲馬勞一日三戰浮生有定分饑飽豈可逃蘇曰呉律飢飽榮瘁人之定分非所茍欲可得也歎息謂妻子我何隨汝曹洙曰馬援傳吾欲使汝曹聞人過失如聞父母之名五盤乾元二年作魯曰謂棧道盤曲有五重補注鶴曰在漢中郡之境乾元二年作五盤雖云險山色佳有餘洙曰陶潛詩山氣日夕佳仰凌棧道細洙曰道一作閣漢祖入漢中燒絶棧道俯映江木疏地僻無網罟蘇曰宋玉出逰見山鳥自得玉歎曰此中林幽地僻無網罟彈射宐爾盡其天年也水清反多魚趙曰楊雄云水至清則無魚公據所見而反用之也好鳥不妄飛師曰淵明云鳥倦飛而知還甫自傷奔走曽好鳥之不若也野人半巢居洙曰禮運冬居槽巢王康琚皆在太平時亦有巢居子選巢居知天寒喜見淳樸俗天啓曰莊子澆淳散樸坦然心神舒東郊尚格鬬蘇曰范曾東郊金革不息尚思格鬬戰壘滿目政散民流田畆蕪没寜不心痛巨猾何時除洙曰東京賦巨猾間亹故鄉有弟妹流落隨丘墟洙曰曹子建詩零落隨丘山成都萬事好豈若歸吾廬洙曰古詩行客雖云樂不如早旋歸李白詩錦城雖云樂不如早還家龍門閣乾元二年作補注洙曰前詩云髙有廢閣道道即棧也或云棧或云閣非樓閣也乾元二年作清江下龍門魯曰按地理志施州青江郡補注鶴曰水經云水色清照十丈故名龍門即龍門鎮所謂沮洳棧道濕兹云閣者在山巔彼所謂沮洳港水之下流葢龍門之山盤紆連亘為廣所以名列數郡絶壁無尺土趙曰謝靈運云晨策尋絶壁長風駕髙一作白浪洙曰郭景純詩吞舟浮海底髙浪駕蓬萊浩浩自太古洙曰古詩浩浩陰陽移危途中縈盤洙曰一云縈盤道仰望垂線縷滑石欹誰鑿浮梁裊相柱洙曰西京賦峙逰極於浮柱趙曰滑石自是石之滑浮梁自是梁之浮舊注所引雖傍見而其義非也目眩隕雜花頭風吹過雨洙曰一云過飛雨趙曰滑石之欹浮梁之裊皆難行之地故目生眩頭生風矣目眩出史心亂目眩目昏眩如見雜花之隕落頭風出魏太祖讀陳琳檄草頭風自愈頭或生風如過雨之吹皆言其地險絶而然也百年不敢料洙曰潘安仁詩人生天地間百年孰能要補注希曰諸葛亮死軍中人為之語死諸葛亮走生仲逹宣王曰吾便料生不料死也一隊洙曰隊與墜同乃得取飽聞一作知經瞿塘洙曰瞿塘峽名足見渡大庾洙曰大庾嶺名趙曰以龍門閣之險峻推言而比之也瞿塘峽在巫山之下大庾嶺在䖍州之前終身歴艱險恐懼從此數師曰瞿塘大庾不若此閣道為險之至甫至此恐懼若屈指數險阻之處當從此為始也石櫃閣乾元二年作補注鶴曰詩云季冬日巳長當是乾元二年十二月初澣之後也自此方入蜀故曰蜀道多草花季冬日巳長唐曰日自至節後旋長宫中以紅線量日影長至日添一線山晩半天赤何曰謂反照也蜀道多草花江間饒奇石洙曰江淹詩崦山多靈草海濱饒奇石石櫃曾波上臨虛蕩髙壁夢符曰郭璞江賦迅雖臨虛以騁巧孤玃登危而雍容清暉回羣鷗洙曰謝靈運詩山水含清暉暝色帶逺客洙曰謝靈運林壑歛暝色羇栖負幽意感歎向絶跡信甘孱懦嬰鄭曰孱鋤山切懦奴卧切弱也不獨凍餒迫優游謝康樂洙曰晋謝𤣥暉也修可曰謝𤣥暉封康樂公孫靈運襲其封與何長瑜等以文章賞會共為山澤之逰詩家稱康樂乃靈運非𤣥暉也以南史考之謝宻傳云謝渾為韻語奬勸靈運等曰康樂誕通度實有名家韻因是詩注以康樂為謝𤣥暉故詳辨之云放浪陶彭澤洙曰陶潛為彭澤令吾衰未自由謝爾性有適洙曰有一作所師曰謝陶輩優游放浪無所繫滯令甫未能自由於二子適性之樂頗有感焉桔柏渡乾元二年作鄭曰桔居屑切補注鶴曰當是蜀之衆水於此㑹而下荆南故詩云東逝不可要高通荆門路闊㑹滄海潮又峽程記云瀘合遂蜀四州皆峽之郡自巒江桔柏池導等渡至此二百八十江㑹于峽前云云則桔柏乃江之名青冥寒江渡趙曰楚辭據青溟而攄虹青青冥冥高逺之貌駕竹為長橋竿濕煙漠漠洙曰一云竹竿濕漠漠謝靈運詩生煙紛漠漠江水風蕭蕭洙曰水一作永荆軻餞易水風蕭蕭兮易水寒連笮動嫋娜鄭曰笮側柏切嫋乃了切娜奴可切洙曰連竹索而為梁謂之笮前漢卭笮之君補注鶴曰成都之窄橋即此類也征衣颯飄颻急流鴇鷁散鴇博好切鷁五歴切洙曰西都蒼鴰鷁鶂趙曰郭璞上林賦注曰似鴈旡後趾也絶岸黿鼉驕魯曰鴇鷁喻舟船也黿鼉喻橋梁也驕壯也西轅自兹異東逝不可要高通荆門路闊㑹滄海潮孤光隠顧眄逰子悵寂寥無以洗心胷前登但山椒洙曰桔柏乃文州嘉陵二江合流處也東下入渝合通荆門矣蒼舒曰右按廣韻椒山頂文選稅鑾登山椒十朋曰謝惠連詩悲猿響山椒漢武帝李夫人賦釋馬山椒廣雅曰土高四墮曰山椒謝莊月賦菊散芳於山椒劒門乾元二年作魯曰自蜀出漢中皆自是故以門名背有閣道在梓潼郡東北蜀之險㑹補注鶴曰按唐志劒門縣在劒州乾元二年作文選張孟陽劒閣銘惟蜀之門作固作鎮是曰劒閣壁立萬仞惟天有設險洙曰北有劒門天設之險蘇曰許㐮闗河阻絶乃天設險以全其封疆孝祥曰易天險不可升地險山川丘陵王公設險以守其國劒閣一作門天下壯蘇曰嚴助至蜀見劒門闗乃嘆曰天下壯險扼隘喉衿莫過此闗也連山抱西南石角皆北向洙曰劒山土石皆北向如拜伏状趙曰此言盖謂地形勢雖險而趨中原自然之勢觀劒門山雖抱西南而石角北向則有面内之義兩崖崇墉倚趙曰詩其崇如墉張協𤣥武館賦云崇墉四匝刻畫城郭狀洙曰蜀都賦金城石郭兼匝中區既麗且崇實號成都一夫怒臨闗一作門百萬未可傍洙曰蜀都賦一人守隘萬夫莫向張孟陽劒閣銘一人荷㦸萬夫趑趄傍一作仰珠玉走中原蘇曰陳陟珠玉无脛遍走中原何也岷峨氣悽愴洙曰岷青城山峨峨眉山也趙曰珠玉之於中原必著走字者或曰古之言珠玉曰无翼而飛无脛而行非謂人之所攜持若飛走也岷山在成都之西青城山是也峩山在成都之西南峩眉山是也逺人困於誅求而悽愴之氣見於岷峨以二山無情之物猶且悽愴則有情之民可知矣三皇五帝前蘇曰王子淵三皇五帝前事臣不可知盖無書可考也雞犬各相放洙曰相一云自蜀至秦方與中國通後王尚柔遠洙曰書柔遠能邇職貢道已喪田曰朱雲諸侯分權擅據割地土不復有職貢之道至今英雄人蘇曰章邯遂使英雄之輩逓相睚眦高視見霸王于况切并吞與割據洙曰李特送流人至劒門箕踞四顧太息曰劉禪有此形勢而東手於人乎遂潜謀割據極力不相譲吾將罪真宰趙曰莊子若有真宰存焉而不得其朕意欲鏟叠嶂鏟楚産切蘇曰袁盎曰諸公欲鏟連叠嶂而造物復如何恐此復偶然臨風黙惆悵趙曰末四句則公忠憤之辭矣師曰恐當肅宗中原未平之日偶復有為割據之禍者是以臨風惆悵而為國家黙為之慮也鹿頭山乾元二年作彦輔曰按地理志漢州徳陽縣有鹿頭山補注鶴曰唐志徳陽縣有鹿頭闗必以山而得名乾元二年作鹿頭何亭亭補注鶴曰九域志鹿頭闗唐高崇文陷劉闢於此寰宇記曰自綿州羅江縣界迤邐入漢州徳陽縣界古老云昔有張鹿頭於此造因以為名是日慰飢渴趙曰西都賦之言宫室曰状迢迢以亭亭陸士衡詩願保金石軀慰妾常飢渴連山西南斷俯見千里豁洙曰自秦入蜀川嶺重複極為險阻及下鹿頭闗東望成都沃野千里葱鬱之氣乃若煙霞靄然游子出京華劒門不可越洙曰京華一云咸京蒼舒曰張孟陽劒閣銘曰惟蜀之門作固作鎮是曰劒閣壁立萬仞酈道元水經注曰劒戍北去大劒三十里連山絶險飛閣相連故謂之劒閣田曰鍾㑹平蜀至綿谷語左校曰山川懸逺巳盡咫尺劒門不可開越何計入蜀公可籌度及兹阻險盡始喜原野闊殊方昔三分霸氣曾間發間居莧切師曰天昔魏吴蜀三分下劉備據此一方以建霸王之業天下今一家韓曰今肅宗中興天下已一家矣雲端失雙闕夢符曰古樂府仙人篇閶闔正嵯峨雙闕萬丈餘又天台賦雙闕雲竦以夾路趙曰雲端祖出枚乗樂府曰美人在雲端天路隔無期雙闕祖於元聖本紀曰許申欲觀帝意曰帝坐華堂靣雙闕君之榮願得矣公詩言失雙闕者以天下既一家皆為臣属故所僣擬天子之闕不復見矣悠然想楊馬繼起名硉兀鄭曰硉兀危石也洙曰左太沖蜀都賦江漢炳靈世載其英鬱若相如灂若君平王褒暉暐而秀發揚雄含章而挺生有文一作才令人傷師曰揚馬二子皆蜀人有文章皆不顯用於漢甫至此追思二子亦若已之不遭其時也何處埋爾骨紆餘脂膏地髙曰紆餘廣遠貌脂膏地言其肥沃也惨澹豪俠窟洙曰蜀都賦外負銅梁於岩渠内函要害以膏腴趙曰成都富饒之地故公指為脂膏也豪俠窟見郭璞云京華遊俠窟公變其字爾杖鉞非老臣宣風豈専逹冀公柱石姿論道邦國活斯人亦何幸公鎮踰歳月趙曰公謂僕射裴冀公冕也言裴公為尹尚有歳月之期此斯人之所以幸也此句可以見杜公初來成都非為嚴武而來也補注希曰按舊史裴日冕傳肅宗移幸鳯翔罷冕知政事遷右僕射兩京平以功封冀國公尋加御史大夫充劒南西川節度使又入為右僕射成都府乾元二年作修可曰是詩子美寓意深矣淮南子曰西垂景在樹端謂之桑榆也説曰桑榆之景理無遠照今也日薄桑榆而其光翳翳止足照我衣裳則不能遠照矣以喻明皇以太上皇居西内也初月不高出衆星尚争光而喻肅宗即位未久而史思明之徒尚在也盖肅宗立於天寳之丁酉而子美乾元庚子至成都以其時考之故知其寓意如此也鄭曰劒南西路蜀州也補注鶴曰公以乾元二年十二月至成都而𤣥宗以上元元年七月遷于西内今詩云季冬樹木蒼則是初到成都時作先明皇遷西内半年修可謂託意明皇遷西内肅宗即位未久而安史之徒尚在恐未必然翳翳桑榆日洙曰歸去來景翳翳以将入東觀記収之桑榆江淹曽是迫桑榆歳暮從所東趙曰桑榆晩日也照我征衣裳蘇曰團團江上月照我征衣裳趙曰阮嗣宗詠懷詩曰灼灼西隤日餘光照我衣我行山川異忽在天一方蘇曰曹植與陳琳疏曰昔與子西園聨鑣游泳語笑嚮今忽暌别在天一方後㑹邈然莫可得也古詩各在天一方劉云成都偏在西故云天一方但逄新人民洙曰曹子建不見舊耆老但覩新少年山川阻逺别後㑹日月長未卜見故鄉大江東流去洙曰謝𤣥暉大江流日夜遊子去日長洙曰短歌行去日苦多曽城填華屋鄭曰填陟刃切定也趙曰曽城層起之城淮南子云崑崙山上有曽城九重華屋季冬樹木蒼洙曰西都賦靈草冬榮趙曰前於發同谷縣題下公自注云乾元二年十二月一日自隴右赴劒南紀行而今詩云季冬樹木蒼則至成都乃是月也喧然名都㑹吹簫間笙簧洙曰曹子建名都多妖女京洛出少年詩吹笙鼓簧信美無與適洙曰王仲宣登樓賦雖信美而非吾土兮曽何足以少留側身望川梁洙曰四愁詩側身西望涕沾裳魏文帝詩欲濟河無梁鳥雀夜各歸中原杳茫茫趙曰觀衆鳥識巢而夜歸乃思其中原故鄉之地而不得返初月出不高衆星尚争光師曰初月喻肅宗初即位衆星喻安史之徒與天子抗衡自古有羇旅我何苦哀傷師曰此乃甫自窮之辭補注杜詩巻六
