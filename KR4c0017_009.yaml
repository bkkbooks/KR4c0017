body:
  text: 補注杜詩卷九宋黃希原本黃鶴補注冬到金華山觀因得故拾遺陳公學堂彥輔曰拾遺唐陳子昂也少讀書於金華山程曰子昂梓州射洪在州東南六十里子昂未達時在金華讀書有書堂存焉甫逰金華因得子昂書堂遂有此作補注鶴曰九域志州梓州有陳子昂墓宜其有書堂在金華詩題云冬到金華山蓋公寶應元年秋自梓歸成都迎家再至梓十一月往射洪乃是時作明年廣德元年雖亦居梓而冬巳在閬然則作於寶應元年無疑矣涪右衆山內鄭曰涪扶鳩切水出徼外南入漢補注希曰水經云涪江水東南合射江故梓州云涪右又有涪城縣金華紫崔嵬洙曰爾雅石戴士謂之崔嵬陸士衡西山何其峻層曲鬱崔嵬上有蔚藍天師曰金華神仙有三十六洞天八十一福地蔚藍天乃洞天之名金華山有觀故云云垂光抱瓊臺洙曰孫綽逰天台賦瓊臺中天而懸居趙曰蔚藍則茂蔚之藍今詩人言水曰挼藍則天之青亦可言蔚藍近世韓子蒼出汴州即事詩云水色山光盡蔚藍繫舟接絶壁杖策窮縈回洙曰陸士衡杖䇿將逺尋趙曰謝靈運晨策尋絶壁四顧俯層巔修可曰謝靈運詩築臺基層巔淡然川谷開雪嶺日色死霜鴻有餘哀焚香玉女跪霧裏仙人來洙曰曹植逺逰詩曰靈鼇戴萬丈神嶽儼嵯峨仙人翔其隅玉女戲其阿陳公讀書堂石柱仄青苔悲風為我起激烈傷雄材洙曰古詩長歌正激烈唐書陳子昂梓州射鴻人苦節讀書尤善屬文後詣闕上書自稱梓州射鴻縣草莽愚臣則天召見竒其對拜麟臺正字武后嘗問調元氣以何道而子昂勸后興明堂太學而史臣譏其以王者之事勉女主故卒為訕侮而不用也師曰子昂遭時無明聖之君故其才不得展甫雖傷之亦自傷也陳拾遺故宅寶應元年作上同補注鶴曰故宅當於書堂不逺亦在山間故詩云悠揚荒山日慘淡故園烟同上年作拾遺嘗有序送公之祖審言貶吉州司戶有云羣公愛禰衡之俊留在京師詩又云同遊英俊人者亦寓意其祖在同遊之列特不秉輔佐之權也拾遺平昔居大屋尚修椽蘇曰郤鑒曰修椽大屋貯青眉粉黛悠揚荒山日慘淡故園煙位下曷足傷所貴者聖賢洙曰按子昂勸后興明堂太學及條上利便三事莫非聖賢之先務具載新書有才繼騷雅哲匠不比肩趙曰子昂初為感遇詩三十首王適見而驚曰必為天下文宗故公此篇言江左之詩至子昂而初變蓋本乎離騷二雅也殷仲文云哲匠感蕭辰公生揚馬後名與日月懸洙曰揚雄司馬相如皆蜀人蘇曰郭沔曰男兒焉久生一死足矣若輩不見朝錯純姓名於日月懸空誰可掩蔽吾要明身後名非茍富貴之徒也陳後主壯之師曰子昂生於揚雄司馬相如之後時雖不同其名與日月爭輝固不減於二子二子亦蜀人故甫言及之同逰英俊人多秉輔佐權洙曰子昂與陸餘慶王無競房融崔泰盧藏用趙元最厚善彥昭超洙曰一作趙玉價趙曰趙彥昭以權幸進然必有才智者故以超玉價言之郭振起通泉洙曰郭元振舉進士授通泉尉後封代國公餘見後郭代公故宅到今素壁滑洙曰湛方生曰素壁流光灑翰銀鉤連洙曰索靖書勢曰婉若銀鉤飄若驚鴻補注鶴曰通泉縣在梓州東南一百三十里元振作尉其邑而彥昭與元振嘗同為太學生故宜同遊壁有題字彥昭景龍中又與公之父審言同在修文館韋讀書法墨藪云㸃欲堅重如鐡鉤欲活而有力如銀盛事㑹一時此堂豈千年終古立忠義感遇有遺編洙曰傳言子昂死有文集十卷盧藏用為之序盛行于代趙曰子昂有感遇詩等篇是也師曰時同逰之士多兼輔佐之權獨子昂官不甚顯至今素壁上尚有諸公墨迹存焉以此堂經久必壞不足以傳後代然忠義之名不朽者惟感遇詩傳于天下覽者足以觀子昂之藴矣謁文公上方寶應元年作補注鶴曰上居以言其居之可樂也佛書有上方世界翼奉傳云上方之清樂也孟康曰上方謂北與東也陽氣所萌生故為上是時當在梓州作文公未詳何所人觀詩可知其為聞士寶應元年野寺隱喬木山僧髙下居石門日色異絳氣橫扶疏洙曰江文通絳氣下縈薄注云絳氣赤霞氣也窈窕入風磴丁鄧切過曰風磴風路也石梯曰磴長蘿紛卷舒庭前猛虎卧洙曰髙僧傳僧惠永感虎來馴遂得文公廬俯視萬家邑煙塵對階除吾師雨花外洙曰髙僧傳有講經而天雨花者補注鶴曰圓覺經云天風吹痿花更雨新好者不下十年餘長者自布金洙曰給孤長者以黃金側布於祗園地禪龕只晏如大珠脫玷翳白月當空虛洙曰大珠白月言其性之圓明也故佛書有摩尼珠及水月之說又曰望已前為白月望已後為黑月見佛書云甫也南北人洙曰檀弓曰今丘也乃東西南北之人革曰甫以漂蕩無定居故云蕪漫少耘鋤師道曰謂性地荒而不修也久遭詩酒汚師曰甫嗜酒好吟每多因詩酒忤權貴故云云何事忝簮裾端本曰簮裾士大夫之服王侯與螻蟻同盡隨丘墟願聞第一義回向心地初洙曰第一義言其教無上也佛書修行有十地以歡喜為初地金箆刮眼膜師曰凡看經明達性本譬如以金箆刮去眼膜所視豁然甫欲文公以無上教開發甫性使悟無生法補注鶴曰梁武帝問達摩如何是聖諦第一義華嚴經有十回向東坡云此句感慨通達其于道必有得也庖丁以牛入輪扁以輪入子美蓋以詩入也耶豫家有石刻坡所書說此又涅槃經一目盲人為治目故造治良醫其時良醫即以金箆刮其眼目又見下治價重百車渠洙曰法華經或有行施金銀珊瑚真珠摩尼硨磲瑪瑙無生有汲引茲理儻吹噓奉贈射洪李四丈寶應元年作補注鶴曰後魏置射洪縣婁縷灘東六里有射江語訛為洪舊史縣屬梓州梁權道編在永泰元年逃亂至梓州作然詩云南京亂初定所向色枯槁逰子無根株茅齊付秋草茅齊指草堂當是寶應元年七月徐知道反公避之至梓州九月歸成都迎家居梓州十一月嘗往射洪有陳拾遺故宅等詩當是其時作丈人屋上烏人好烏亦好洙曰詩云瞻烏爰止于誰之屋注富人之屋烏所集也修可曰尚書大傳曰武王登夏臺以􅎔殷民周公旦曰愛其人者愛其屋上烏補注希曰劉向說苑乃云太史謂武王曰愛其人兼屋上之烏憎其人者惡其儲胥非周公之言人生意氣豁不在相逄早趙曰北史李延夀叙傳載閻信謂其祖李曉之言曰古人相知未必在早南京亂初定所向色枯槁趙曰南京成都府也肅宗至德二年以蜀都為南京所謂亂初定指言前年辛丑之歲四月劒南東川節度使段子璋反五月崔光逺擊斬之遊子無根株茅齊付秋草東征下月峽挂席窮海島洙曰謝靈運挂席拾海月又海賦維長綃挂長席萬里須十金朝曰漢書百金中人十家之産師古注古者一兩金直十千千金則知為百千妻孥未相保蒼茫風塵際蹭蹬騏驎老洙曰蹭蹬馬失勢貌志士懷感傷心胸巳傾倒早發射洪縣南途中作寶應元年作補注鶴曰射洪縣在梓州東南六十里今題云早發縣南當是寶應元年十一月南之通泉時作將老憂貧窶魯曰詩終窶且貧窶賤也筋力豈能及征途乃洙曰一作復侵星洙曰鮑明逺侵星赴早路得使諸病入鄙人寡道氣在困無獨立俶裝逐徒旅魯曰顔延年詩改服飭徒旅修可曰張平子思𤣥賦占既吉而無悔兮簡元辰而俶裝注俶始也達曙陵險澀洙曰潘正叔詩世故尚未夷崤函方險澀寒日出霧遲清江轉山急唐曰江為山所激補注希曰唐志雖為清江郡而公於梓州屢云清江蓋以射洪水而言如謂清江白日落欲盡之類是也僕夫行不進駑馬若維縶陟立切趙曰詩縶之維之汀洲稍踈散何曰岸行坦夷也風景開怏悒空慰所尚懷終非曩逰集衰顔偶一破勝事難屢挹茫然阮籍途更灑揚朱泣洙曰阮籍常不由徑路而行途窮且哭楊朱泣多岐師曰甫遭窮途至於東西南北了無定居安免楊朱之揮淚邪通泉驛南去通泉縣十五里山水作寶應元年魯曰地理志通泉縣在梓州東南百三十里去縣十五里有佳山水諺號沈家坑甫至此覽眺愛其山水而有是作補注鶴曰舊史通泉漢廣漢縣地隋縣也新史大厯二年屬遂州此詩作於寶應元年十一月故詩云冬溫蚊蚋集溪行衣自濕亭午氣始散洙曰天台賦羲和亭午逰氣髙褰冬溫蚊蚋集人逺鳬鴨亂髙曰行人少也登頓生曾隂洙曰江文通日落長沙渚曽隂萬里生欹傾出髙岸驛樓衰栁側縣郭輕烟畔一川何綺麗洙曰劉公幹詩綺麗不可忘魯曰所謂沈家坑也盡日窮壯觀山色逺寂寞江光夕滋漫傷時愧孔父修可曰孔子嘆鳯泣麟皆傷時也去國同王粲洙曰王粲字仲宣山陽人避地荆州嘗思歸因登樓作賦趙曰王粲漢獻帝西遷西京擾亂乃之荆州依劉表其七哀詩西京亂無家豺虎方遘患復棄中國去逺身適荆蠻師曰昔魏王粲去國來依劉表甫去杜鄠而逰蜀豈不同王粲之去國乎我生苦飄零所厯有嗟嘆過郭代公故宅寶應元年作彥輔曰郭震字元振以字顯封代國公補注鶴曰郭公魏州貴鄉人也宅在宣陽里而未嘗至魏當是指作尉通泉時所居而言寶應元年十一月自射洪之通泉時作故詩云我行得遺跡池館皆疏鑿豪雋初未遇其跡或脫略洙曰江淹賦脫略公卿跌宕文史師曰自昔豪俊之士多不拘小節故云云代公尉通泉放意何自若洙曰元振尉通泉嘗盜鑄及掠賣部口以餉遺賔客及夫登衮冕直氣森噴薄洙曰靈運吳都賦噴薄沸騰趙曰先天二年郭元振以兵部尚書復同中書門下竇懷貞等附太平公主潜謀不順𤣥宗發羽林兵睿宗聞變登承天門樓元振躬率兵侍衛奏上前奉詔誅懷貞等磊落見異人豈伊常情度洙曰新書武后與語竒之索文章上寶劒篇遂得擢用趙曰此專說譏太平公主事而舊注又雜之以武后召見竒之此豈登衮冕時耶定策神龍後宫中翕清廓洙曰按新書明皇之誅太平公主元振獨領軍扈從事定宿中書十四日以功封代國公趙曰神龍則中宗即位改元元年去先天二年凡八年而學者每疑之嘗論曰太平擅寵自中宗而末則禍胎在神龍而下也俄頃辨尊親指揮存顧託趙曰太平公主既誅則君臣之間𤣥宗得尊位父子之間𤣥宗得親儔所以感睿宗付託之意矣羣公見慙色趙曰𤣥宗之平亂也諸宰相皆走伏外省獨元振揔兵扈帝王室無削弱逈出名臣上丹青照臺閣劉曰元振封代國公畫像凌烟我行得遺迹洙曰一作址晏曰遺迹故宅也池館皆疏鑿壯公臨事斷顧步涕橫落髙詠寶劒篇定功曰元振寶劒歌云君不見昆吾鐡冶飛炎烟紅光紫氣俱赫然良工煆鍊凡幾年鑄作寶劒名龍泉龍泉顔色如霜雪良工嗟咨歎竒絶琉璃玉匣吐蓮花錯鏤金環生明月正逢天下無風塵幸得相逢君子身精光黯黯青蛇色文章片片緑龜鱗非直結交逰俠子亦曽親近英雄人何言中路遭棄捐零落飄淪古獄邉雖復埋沉無所用猶能夜夜氣衝天神交付冥漠修可曰潘安仁作夏侯湛誄曰心照神交惟我與子南史劉訏字彥度阮孝緒隱居不交當世訏一造之即顧以神交觀薛稷少保書畫壁寶應元年作補注鶴曰詩云我行梓州東遺跡涪江邉又云不知百載俊誰復來通泉當是寶應元年在通泉作少保有古風得之陜郊篇洙曰公詩曰驅車越陜郊北顧臨大河師曰周公召公分陜而治稷嘗為古風以美之惜哉功名忤但見書畫傳洙曰稷薛收之從子以詞學知名博雅尤工𨽻書自貞觀永微之際虞世南褚遂良時人宗其書跡自後罕能繼者稷鋭精模倣筆態遒麗當時無及之者又善畫博採古跡睿宗在藩留意於文學稷於是特見招引除太子少保我逰梓州東遺跡涪江邉鄭曰涪扶鳩切水出徼外南入漢補注鶴曰寰宇記云涪江在梓州郪縣西二百里梓州治郪縣而詩云梓州涪江邉則寰宇記所云不合蓋詩第以通泉在州東而言畫藏青蓮界洙曰青蓮界佛寺也書入金榜懸洙曰事見天門日射黃金榜注仰看垂露姿不崩亦不騫洙曰漢曹喜工篆𨽻變懸針垂露之法詩天保不騫不崩騫虧也鬱鬱三大字蛟龍岌相纒趙曰稷所書慧普寺碑上三字字方徑三尺許筆畫雄徑余嘗到慶寺觀之三字之傍有贔屭纒捧乃蛟龍岌相纒也又揮西方變發地扶屋椽趙曰其所畫西方變相則亡矣慘淡壁飛動到今色未填此行疊壯觀師曰甫獲觀其故宅與書畫故云疊壯觀郭薛俱才賢不知千載後誰復來通泉洙曰通泉前有郭代公後有薛少保故云郭薛通泉縣署屋壁後薛少保畫鶴寶應元年作補注鶴曰題云通泉縣署當是寶應元年十一月自梓州之通泉時作薛公十一鶴皆寫青田真洙曰晉永嘉記青田有雙鶴生子即便去孫曰地理志處州青田縣在州東南一百五十里雙鶴生子即便化去人以為異補注希曰張彥逺名畫記薛稷字嗣道善花鳥人物雜畫畫鶴知名永嘉郡記沐溪野去青田九里中有雙鶴年年生子長大便去只餘父母一雙精白可愛多云神仙所養畫色久欲盡蒼然猶出塵修可曰北史劉歊矯矯出塵如雲中白鶴低昂各有意洙曰薛公畫鶴如返啄疏翎戾天警露之類皆隨而名之磊落如長人洙曰晉嵇紹在稠人中昂然若野鳥之在雞羣佳此志氣逺豈惟粉墨新師曰鶴磊落比之賢人無塵俗氣象甫竒其有逺志豈特悅其粉墨之新麗哉萬里不以力羣遊森㑹神威遲白鳯態洙曰揚雄作甘泉賦夢吐白鳯秋胡詩行路正威遲非是倉庚鄰洙曰詩七月有鳴倉庚補注鶴曰山海經曰丹穴之山有鳥焉其狀如鶴五彩而文名曰鳯故云鳯態而加白字於其上以其如白鳯也爾雅倉庚黧黃也釋曰即上黃鳥也釋黃鳥云幽州人謂之黃鶯一名倉庚一名商庚高堂未傾覆幸得慰佳賓曝露牆壁外終嗟風雨頻赤霄有真骨恥飲汙池津師曰甫託意譏賢者羞食汚君之祿時不用賢之咎也冥冥任所往脫略誰能馴洙曰有遺支遁鶴者遁曰爾冲天之物寧為耳目之玩遂放之任所往陪王侍御同登東山最高頂宴姚通泉晚攜酒泛江寶應元年作補注鶴曰詩云三更風起寒浪湧又云無使霜露霑人衣當是寶應元年十一月公至通泉時作梁權道云廣德元年其年春初公時在梓而前所謂寒浪霜露不合又其春不曾至通泉姚公美政誰與儔不減昔時陳太丘洙曰世說陳紀字元方年十一時候袁紹袁公問曰卿家君在太丘逺近稱之何所履行元方曰老父在太丘強者安之以德弱者撫之以仁恣其所安久而益敬袁公曰孤往者嘗為鄴令正行此事不知卿家君父何師元方曰周公不師孔子孔子不師周公邑中上客有柱史多暇日陪驄馬遊洙曰老子為柱下史舊說驄馬御史補注希曰驄馬御史乃是後漢桓典為侍御史執正無所避常乘驄馬京師畏之為之語曰行行且止避驄馬御史東山髙頂羅珍羞洙曰晉謝安雖貴而東山之志不謝下顧城郭銷我憂洙曰王粲登樓賦聊暇日以銷憂清江白日落欲盡復攜美人登綵舟笛聲憤怒哀中流妙舞逶迤夜未休洙曰漢武秋風辝擕佳人兮不能忘橫中流兮揚素波簫鼓鳴兮發棹歌歡樂極兮哀情多宋曰逶迤即委蛇燈前往往大魚出聽曲低昂如有求洙曰荀子瓠巴鼓瑟游魚出聽師曰自此以上既陳宴樂之興遂於末章有警戒之意自三更風起寒浪湧以下皆警戒之辝三更風起寒浪湧取樂喧呼覺船重滿空星河光破碎四座賔客色不動請公臨深莫相違回船罷酒上馬歸人生歡㑹豈有極無使霜露霑人衣洙曰此言樂極則悲來矣修可曰此倣謝希逸月賦月既沒兮露欲晞嵗方晏兮無與歸佳期可以還微霜霑人衣春日戲題惱郝使君兄廣德元年作補注鶴曰廣德元年春在梓州作梁權道編亦同公亦有春日梓州登樓詩郝使君當是居通泉公在梓州作此以戲之使君意氣凌青霄趙曰北山移文云干青霄而直上憶昨歡娛常見招細馬時鳴金騕裊上於皎切下於了切修可曰盧照鄰詩漢家金騕裊補注希曰馬謂之金騕裊蓋因漢武帝鑄金為麟趾裊蹄詩人遂用之詳見下注佳人屢出董嬌饒洙曰嬌嬈名姫也宋子侯有董嬌饒詩東流江水西飛燕可惜春光不相見趙曰此句以興見招之後不復見其姫也故下句有願攜之請焉願攜王趙兩紅顔端本曰王趙亦通泉有色之妓再騁肌膚如素練通泉百里近梓州請公一來開我愁蘇曰王戎與公破悶開愁補注鶴曰王趙非通泉之妓當是郝使君之姫妾寶應元年十一月公至通泉時郝招公飲出二姫以侑樽明年春公在梓州因作此詩以戲之九域志通泉在梓州東南百三十里兹云百里者舉其成數而言耳舞處重看花滿面樽前還有錦纒頭洙曰唐王元寶富而無學識嘗㑹賓客明日親友謂之曰昨日必多佳論元寶曰但費錦纒頭爾田曰唐明皇宴於清元小殿自打羯鼓曲終戲謂八姨曰樂藉今日有幸約供養夫人請一纒頭八姨曰豈有大唐天子阿耶出三百萬為無錢用局耳天邉行永泰元年作補注鶴曰詩云十年骨肉無消息當是永泰元年在成都作是年五月公下忠渝此詩未下忠渝時所作詩又云洪濤滔天風拔木永泰元年三月大風故耳天邊老人歸未得蘇曰陳秀漂泊西平秋月自嘆鴻燕皆歸天邉老人尚困逆旅悽愴日暮東臨大江哭隴右河源不種田胡騎羌兵入巴蜀洙曰大厯中吐蕃三道入冦誡其衆曰吾要蜀川為東府連蹈郡邑而士庶奔亡山谷趙曰廣德元年吐蕃陷隴右而河源不種矣十二月陷松維保三州則入巴蜀矣補注鶴曰按史至德二年吐蕃侵取廓霸岷等州及河源莫門軍寶應元年陷臨洮取秦成渭等州廣德元年破西山合水城明年入大震關取蘭河鄯洮等州於是隴右地盡亡而通鑑以為是廣德元年又云吐蕃陷松維保三州及雲山新築二城西川節度使髙適不能救於是劒南西山諸州亦入於吐蕃云故作此詩隴右巴蜀俱已為胡騎羌兵所有胡騎指吐蕃羌兵指黨項羌渾奴刺之類洪濤滔天風拔木洙曰洪濤滔天言民罹昏墊也項王圍漢王大風拔木前飛秃鶖後鴻鵠趙曰鶖水鳥也師曰鶖鶬九頭鳥補注鶴曰唐五行志永泰元年三月辛亥大風拔木趙以鶖為水鳥者亦以五行志云寶厯五年有秃鶖森飛集禁苑鶖水鳥也九度附書向洛陽十年骨肉無消息師曰甫客居天邊遭兵馬之亂歸鄉不得寧不悲傷時吐蕃分為三路入寇一自隴右一自河源一自巴蜀田畝廢而不耕蜀中騷動故甫思欲附鶖鶬鴻鵠奮飛以歸鄉蓋有所不得也補注鶴曰天寶十四年乙未避賊與骨肉相離至永泰元年乙未已恰十年其時公之弟在東都骨肉殆指弟而言大麥行寶應元年作補注鶴曰詳考詩中之事當是寶應元年成都作梁權道編在廣德元年梓州詩內大麥乾枯小麥黃婦女行泣夫走藏洙曰見崆峒小麥熟注師曰古詩云小麥青青大麥枯誰當穫者婦與姑補注希曰後漢五行志童謡云小麥青青大麥枯此用其語東至集壁西梁洋問誰腰鐮胡與羌洙曰集壁梁洋皆蜀地州郡名趙曰此又言吐蕃與回紇也鮑明逺東武吟腰鐮刈葵藿師曰集壁梁洋四州名時吐蕃入冦四州之民皆奔竄山谷腰鐮穫麥惟羌與胡而巳補注鶴曰集壁梁洋四州唐並屬山南西道按新舊史通鑑寶應元年建卯月羌渾奴刺寇梁州建辰月奴刺冦洋州地理志成州以寶應元年沒吐蕃成與前四州均為山南道此詩當是指其年吐蕃羌渾奴刺而言今云大麥乾枯小麥黃正是夏初事自是年至大厯三年無歲無吐蕃黨項羌渾奴刺之亂而俱不在春夏豈無蜀兵三千人洙曰一云千人去部領辛苦江山長師曰時杜鴻漸以蜀兵三千遏賊衝突江山蹇澀士卒至有介胄生蟲而不得休息故云部領辛苦江山長安得如鳥有羽翅託身白雲還故鄉苦戰行寶應元年作補注鶴曰段子璋以上元二年又陷遂州綿州遂在涪江之南今詩云去年江南討狂賊當是寶應元年作苦戰身死馬將軍自云伏波之子孫干戈未定失壯士蘇曰牛繪戰死張先歎曰天下未安兵戈尚爾遽失壯士趙曰伏波漢馬援也吐蕃去冬陷松維保三州則干戈豈便息邪補注鶴曰按舊史馬璘年五十六大厯十二年卒新史云十一年卒於軍中則璘之死在公後六七年無容先有此詩且新舊史未嘗至蜀平子璋亂疑是為馬巴州故去嵗秋云遂州城外巴人稀公别馬巴州亦嘗云功業終歸馬伏波使我歎恨傷精魂蘇曰山濤曰嵇中散就誅使我失精神歎憤而巳去年江南討狂賊臨江把臂難再得别時孤雲今不飛時獨看雲淚橫臆鮑曰謂段子璋戰遂州時公與此事送别江上今其人已死矣故有感而作遂州在涪江少南故云江南師曰馬援為伏波將軍嘗云大丈夫當死邉野以馬革裹尸而歸唐馬璘讀漢書至此歎曰使吾祖勳業墜地乎時馬璘與吐蕃戰沒失國家壯士甫是以傷之去年江南討狂賊謂於涪江之南討段子璋之亂也時甫與馬將軍訣别把臂今傷其死甫悵望去年别處不見雲飛故思其人而淚下橫胸臆也去秋行寶應元年作魯曰時段子璋反於東川也補注鶴曰詩云去秋涪州木落時又云部曲有去皆無歸遂州城中漢節在遂州城外巴人稀當是寶應元年作去秋涪江木落時臂槍走馬誰家兒蘇曰王宏見陸遜曰彼陳前臂槍走馬往來返逐者誰家小兒得如此俊偉到今不知白骨處部曲有去皆無歸遂州城中漢節在遂州城外巴人稀包曰上元三年四月劒南節度兵馬使假子璋反陷綿州遂州刺史嗣虢王巨死之節度李奐奔于成都故云漢節在補注鶴曰子璋陷遂州意馬巴州領興㑹攻之為子璋所勝死於遂州故云漢節在又上句云部曲有去皆無歸子璋以上元二年四月反五月伏誅而此詩云去秋涪江木落時恐誤戰場寃魂每夜哭空令野營猛士悲師曰部曲行伍部有曲昔蘇武凡十九年留胸奴中常持漢節時馬璘死於吐蕃持節而死巴人屯守遂州城外吐蕃兵攻遂州巴人死盡故云稀光祿坂行寶應元年作補注鶴曰崔寧傳云寶應初蜀亂道路不通與此詩所言合當是寶應元年作公時在梓州山行落日下絶壁西望千山萬山赤洙曰山一作水謝靈運日落山照耀樹枝有鳥亂鳴洙曰一作棲時暝色無人獨歸客洙曰謝靈運林壑斂暝色馬驚不憂深谷墜草動只怕長弓射食亦切安得更似開元中洙曰一云年開元初上勵精理道天下大治安西諸國悉平為郡縣道路即今多擁隔鮑曰按崔寧傳寶應初蜀亂山賊乘險道路不通與此詩合山寺寶應元年作洙曰章留後同遊得開字補注鶴曰公在梓有陪章侍中晏南樓等詩又有别章留後詩章名彛此詩云歲宴風破肉當是寶應元年自通泉回作野寺根石壁諸龕遍崔嵬龕若含切前佛不復辨百身一莓苔洙曰天台賦踐莓苔之滑石唯有古殿存世尊多塵埃補注希曰諸經皆以佛為世尊故云髙僧傳漢文帝夢金人空飛而至集羣臣以占傅毅奉答西域有神曰佛所夢必是乎唯一本作雖如聞龍象泣足令信者哀蒼舒曰右按王筠棲頭陀寺經曰有比丘名曰龍樹龍象猶佛象也修可曰維摩經云菩薩勢力譬如龍象又傳燈録云龍象乃鱗毛類中最巨者猶麒麟之於走獸鳯凰之於飛鳥故經稱僧之出類者曰龍象非佛像也使君騎紫馬蘇曰謝靈運出守永嘉人曰騎紫馬者乃太守也永嘉今有紫馬祠尚傳乃播謝之德也捧擁從西來樹羽靜千里臨江久徘徊山僧衣藍縷告訴棟梁摧公為顧兵徒咄嗟檀施開夢符曰佛書信施檀越又王簡棲頭陀寺碑曰行不捨之檀施諸羣有吾知多羅樹却倚蓮花臺諸天必歡喜鬼物無嫌猜補注希曰兵徒一本作賔徒一本作兵從佛書心中初求最後檀越以為齊主注焚語檀波羅蜜華言布施此殆合華梵之言而云檀又云諸天歡喜又云佛昔修治歡喜海以兹撫士卒孰曰非周才窮子失淨處髙人憂禍胎洙曰福有基禍有胎趙曰漢武帝謂臨賀王曰汝包藏禍胎也嵗晏風破肉蘇曰蘇章傳邉地霜緊沙風破肉雖重裘氊帳寒色可畏荒林寒可回思量入道苦自哂同嬰孩南池廣德元年作補注鶴曰公以廣德元年秋往閬冬回梓明年春雖又自梓之閬今詩云粳稻共比屋又云高田失西成此物頗豐熟當是廣德元年秋在閬州作峥嶸巴閬間所向盡山谷洙曰巴閬蜀中二州也山多險阻故云云安知有蒼池萬頃浸坤軸余曰張華博物志地下有四柱廣十萬里地有三千六百軸互相牽也呀然閬城南昱曰呀虛加切張口貌枕洙曰一作控帶巴江腹菱荷入異縣粳稻共比屋洙曰堯比屋可封補注鶴曰字林云粳稻不黏者本草以粳米稻米為二物說文沛國謂稻為糯粇稻屬也皇天不無意美利戒止足髙田失西成此物頗豐熟清源多衆魚逺岸富喬木蘇曰郭元澤近舍溪岸有磻石可坐卧兼喬木蔽日時曵履投竿不知塵事獨歎楓香林春時好顔色南有漢王祠終朝走巫祝歌舞散靈衣洙曰潘安仁寡婦賦仰神宇之寥寥瞻靈衣之披披荒哉舊風俗髙皇亦明王魂魄猶正直不應空陂上縹眇親酒肉淫祀自古昔蘇曰左傳非所祭而祭名曰淫祀非唯一川瀆干戈浩茫茫地僻傷極目趙曰楚辭目極千里傷春心平生江海興遭亂身局促洙曰漢景帝局促如轅下駒駐馬問漁舟躊躇慰羈束蘇曰邢亢駐馬立江中借問漁舟客征戰何時停我亦卜林宅師曰鬼神非其族類不歆其祀自古淫祀媚神徼福者多矣豈特此一川瀆而已哉有道之世鬼神無所施其靈響甫傷世亂而祀典不舉固有淫邪之祭則云干戈浩茫茫地僻傷極目局促不得騁之貌甫謂平生有五湖之興今羈束亂世而不得騁是以駐馬問漁舟而少有所慰者也發閬中廣德元年作補注鶴曰公廣德元年九月自梓入閬冬晚復歸梓明年初春又至閬此詩云别家三月一得書當是元年冬晚歸梓時作九域志云閬州西至梓州二百二百二十里三月之間一往反焉其愁苦可知前有毒蛇後猛虎溪行盡日無村塢洙曰時盜賊縱橫賦役煩重而民不安居也江風蕭蕭雲拂地山木慘慘天欲雨女病妻憂歸意速秋花錦石誰復數趙曰此言歸梓州也秋花錦石可玩之物以歸意速不復數之矣别家三月一得書避地何時免愁苦洙曰賢者避地趙曰公以九月自梓往閬至十二月而復歸梓閬山歌廣德二年作補注鶴曰以後篇閬水歌云更復春從沙際歸當與此詩同是廣德二年初春之時作閬州城東靈山洙曰一作雪山白閬州城北玉臺碧洙曰靈山玉臺皆閬山景也補注希曰閬州閬中縣有靈山雖寰宇記綿州巴西郡亦有之然此明曰在閬州城東玊臺則九域志云故老相傳唐史滕王嘗於此逰憩松浮欲盡不盡雲江動將崩已一作未崩石那知根無鬼神㑹已覺氣與嵩華敵趙曰此言靈山玉臺也師曰五嶽西日華山中日嵩山凡名山大川鬼神之所扶持此山雖不與五嶽之數安知鬼神不㑹於是中原格鬬且未歸應結茅齊著青壁洙曰兩相敵曰格鬬補注鶴曰格鬪謂吐蕃犯京師中原未寧故歸意且止看青壁以閬山如壁之青也閬水歌廣德二年作補注鶴曰與閬山歌同廣德二年作嘉陵江色何所似洙曰嘉源注源出散鬬而入於閬師曰地理志閬州閬中郡城臨閬水却接連山岡補注洙曰嘉陵江止𨽻果州而閬與果為鄰故云石黛碧玊相因依正憐日破浪花出趙曰阮籍寒鳥相因依日出正照水更復春從沙際歸趙曰費昶雜詞春隨楊栁歸巴童蕩槳欹側過趙曰古歌云艇子打兩漿者扶兩楫而來也水雞銜魚來去飛師曰蓋言魚多也閬中勝事可腸斷蘇曰劉表曰故鄉勝事使人臨風對月回腸欲斷閬州城南天下稀師曰城南屏山錯麗如錦屏號為天下第一故曰天下稀本朝前輩嘗詠福唐詩云曉角吹殘十二枝春風樓閣酒旗飛杜陵未識三山好却道閬城天下稀蓋閩蜀同風故也三絶句大厯三年作補注鶴曰梁權道編在廣德二年自閩州赴成都時作徒感於舊次及鮑注以前年渝州殺刺史為假子璋陷綿遂今年開州殺刺史為徐知道反詳考詩中事當是大厯三年作見注前年渝州殺刺史今年開州殺刺史鮑曰崔寧傳所書山賊也前年渝州殺刺史謂假子璋陷綿遂今年開州殺刺史謂徐知道之反有乘亂者開去成都逺不知其故史不書失之師曰步將吳璘殺渝州刺史劉卞以反杜鴻漸討平之又部卒翟封殺開州刺史蕭崇之以叛楊子琳討平之補注鶴曰渝州唐屬劒南開州唐屬山南杜鴻漸平吳璘楊子琳平翟封在大厯元年與三年詩云今年開州殺刺史則是年作羣盜相隨劇虎狼趙曰張孟陽云賊盜如豺虎師曰虎豺喻盜賊也劇甚也食人更肯留妻子二十一家同入蜀唯殘一人出駱谷蘇曰十道志云駱谷道西南界入洋州路屬盩厔趙曰魏志姜維出駱谷圍長安即此谷道也補注希曰唐志鳯翔府盩厔縣有駱谷關九域志亦言鳯翔有古駱谷道又唐志云洋州駱谷此當是言洋州者自說二女齧臂時洙曰世說趙飛燕姊弟少貧微及飛燕見召與女弟齧臂而别回頭却向秦雲哭師曰祿山亂百姓隨𤣥宗入蜀凡二十一家後出駱谷但存一人飢困蜀亂勦盡甫聞其說自傷妻子皆幸免是以回頭望蜀而哭痛斯民之不得其所也殿前兵馬雖驍雄縱暴略與羌渾同洙曰時神䇿軍恣橫聞道殺人漢水上婦女多在官軍中師曰吐谷渾西羌之種也殿前兵馬乃王師奉辭伐罪以吊其民秋亳無撓時天子命陸璀以三千神策軍彈壓蜀中之亂奈何神䇿軍橫恣虜掠婦女其殘暴更甚於羌渾百姓怨之甫傷朝廷政治不明縱使殿前之兵搔動良民若此豈所謂王師弔民伐罪者乎莫相疑行永泰元年作補注鶴曰郭英乂帥蜀時年方三十餘此詩意是為英乂作雖嚴武年少然於公未嘗不相知豈有當靣輸心背後笑之事八哀詩中嚴武詩可見公待武初終無間應無此作當是永泰元年與英乂不合去成都時作又觀此詩弊廬遣興詩寄武云還思長者轍恐避席為門若武於公果有如詩所云則去幕府之後不應詩語猶如此也男兒生無所成趙曰李陵書男貌生無所成名頭皓白牙齒欲落真可惜憶獻三賦蓬萊宫自怪一日聲烜赫洙曰天寶中明皇朝獻太清宫饗廟及郊甫時獻三大禮賦集賢學士如堵牆觀我落筆中書堂洙曰新唐書甫獻賦帝竒之使待制集賢院命宰相試文章按開元十三年改集仙殿為集賢殿麗正殿書院為集賢殿書院院內五品以上為學士六品以上為直學士禮孔子射於矍相之圃蓋觀者如堵牆補注希曰唐百官志開元十三年改麗正殿書院為集賢殿書院置集賢院侍講學士侍讀直學士又唐制宰相四人首相為太清宮使次三相皆席館職如洪文館大學士集賢殿大學士是也公以獻賦命宰相試文章則集賢學士為宰相也往時文彩動人主此日饑寒趨路傍洙曰時擢甫為京兆兵曹㑹祿山亂後寓同谷採橡自給男女餓殍者數人趙曰至德二載公授左拾遺及房琯罷相甫上疏論琯不冝廢肅宗怒出甫為華州司功屬關輔饑亂棄官寓同谷自負薪採梠餔糒不給遂卜居成都晚將末契託年少趙曰陸機歎逝賦託术契於後生當面輸心背面笑洙曰時甫依嚴武幾為武所殺寄謝悠悠世上兒不爭好惡莫相疑師曰甫獻三大禮賦天子命宰相試文章一日聲馳乎天下如堵墻言列看之多也中書堂即宰相所坐之堂人主謂𤣥宗也年少指嚴武也甫與武父挺之素善武時尚少鎮成都甫往依焉故云晚將末契託年少甫嘗醉登武牀瞋目曰嚴挺之乃有是兒武憾其斥父名拔劒將殺之賴武母救止乃免武與甫由是有隙故甫譏其不以誠相待而有是作補注希曰古詩多謝悠悠子瞻天如戴盆遭田父泥飲美嚴中丞寶應元年作蘇曰嚴武也甫與武世舊故入蜀作之新書言甫結廬成都浣花里與田畯野老相為狎蕩補注鶴曰按舊史嚴武傳既收長安以武為京兆少尹兼御史中丞以史思明阻兵不之官出為綿州刺史兼劒南東川節度使兼御史中丞東川節度治梓州上皇詔合兩川為一道拜成都尹兼御史大夫今曰嚴中丞則是未為大夫時所作蓋公有與嚴中丞嚴大夫嚴侍郎嚴鄭公先後可辨也考公說早云今蜀自十月不雨抵建卯非雩之時則是說乃寶應元年二月上嚴公注云初中丞嚴公節制劒南此說中又云管內東西兩川各遣一使則其時但是節制兩川此詩當是寶應元年春社作所謂泥飲者非飲於泥淖之中乃其醉如泥耳不然或是上旱說後便雨梁權道編在廣德二年非況詩云拾遺能住否則是未為參謀時奏為參謀在二年冬春夏間也步屧隨春風屧先篋切禹稱日屧草屨也隨春風謂放步也村村自花栁蘇曰鮑明逺行樂篇村村花栁好田翁逼社日邀我嘗春酒趙曰宋書袁粲為丹陽尹嘗步屧白楊郊野遇士大夫便呼與酣飲酒酣誇新尹畜眼未見有回頭指大男渠是弓弩手洙曰籍丁為兵也名在飛騎籍洙曰飛騎軍名趙曰效曹子建白馬篇名編壯士籍長畨嵗時久洙曰長畨猶長在直也言無更代也補注希曰㑹要云貞觀十二年十一月三日於𤣥武門置左右屯以諸衛將軍領之其兵名曰飛騎天寶七載勑左右羽林軍飛騎請凖後加數通舊一萬五千為額六畨上下今日長畨則無上下也前日放營農洙曰放營農歸耕也辛苦救衰朽差科死則已鄭曰差楚皆切簡也誓不舉家走今年大作社洙曰社祭所以祈農事也趙曰左傳鄭子産大為社拾遺能住否呌婦開大瓶盆中為吾取感此氣揚揚須知風化首洙曰郡守縣令風化之首趙曰晏子傳其御者意氣揚揚語多雖雜亂說尹終在口朝來偶然出自卯將及酉久客惜人情如何拒鄰叟髙聲索果栗補注希曰陶詩云但覔梨與栗欲起時被肘洙曰言屢為掣肘蘇曰孔文舉就里人飲夜深而歸家人責其遲曰欲命駕數數被肘工部一世偉人造語深得要妙胸中無國子監者不可讀其詩師曰足知甫久客與鄰叟無一日不如此也指揮過無禮未覺村野醜洙曰舉止無度不可責禮法也月出遮我留仍嗔問升斗蘇曰何喜以春秋知名海內纍詔不仕嗜酒每飲不問升斗俱盡醉中猶長褒貶人皆欽服其量補注希曰晉陸納謂桓溫曰明公近云飲酒三升納正可三升今有一斗以備柸酌餘瀝補注杜詩卷九
