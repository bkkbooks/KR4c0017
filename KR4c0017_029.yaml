body:
  text: 補注杜詩巻二十九宋黄希原本黄鶴補注七月一日題終明府水樓二首大厯元年作補注鶴曰詩云楚江巫峽半風雨清簟踈簾看奕棊當是大厯元年在䕫州作意終明府是奉節宰故又云為政風流今在兹髙棟層軒已自凉秋風此日灑衣裳洙曰招䰟髙堂䆳宇檻層軒劉公幹詩涕泣灑衣裳定功曰春秋緯書髙楝深宇齊王踐從兄詩念别開層軒翛然欲下隂山雪洙曰范彦龍詩寒沙四面平飛雪千里驚風斷隂山樹霧失交河城隂山匈奴山名吐谷渾西附隂山其地四時常有冰雪雖六七月雨雹甚盛不去非無漢署香洙曰尚書郎漢置四人口含雞舌香以其奏事答對欲使氣息芬芳趙曰署指書省署也公官為工部員外郎其在省也自宜應有含香之制今以為客不去耳絶壁過雲開錦繡洙曰䕫峽路有錦繡嚴踈松隔水奏笙簧洙曰天籟是也看君宜著王喬履真賜還疑出尚方洙曰終明府功曹也兼攝奉節令故有此語佇觀奏即真也後漢方術傳王喬顯宗世為葉令喬有神術毎月朔常自縣詣臺朝帝恠其來數而不見車騎密令太史伺望之言其臨至輙有雙鳬從東南飛來於是候鳬至舉羅張之但得一雙舄焉乃詔尚方診視則四年中所賜尚書官屬履也前漢百官公卿表尚方主作禁器物師古曰尚方少府之屬官也作供御之噐物也宓子彈琴邑宰日洙曰吕氏春秋曰宓子賤治單父彈琴身不下堂而治之終軍棄繻英妙時洙曰終軍傳年十八選為博士初軍從濟南當詣博士歩入闗闗吏與軍繻軍問以此何為吏曰為復傳還當以合符軍曰文天西遊不復傳還棄繻而去後為謁者使行郡國建節東出闗闗吏識之曰此使者乃前棄繻生也承家節操尚不冺師曰潘安仁西征賦終童山東之英妙賈生洛陽之少年承家言繼終軍家風也為政風流今在兹可憐賔客盡傾蓋洙曰鄒陽傳曰古語白頭如新傾蓋如故文穎曰傾蓋猶交蓋駐車也何處老翁來賦詩洙曰公自謂也傳鄭十子賦詩魏文帝曰已成老翁但未白頭楚江巫峽半雲雨洙曰宋玉髙堂賦妾在巫山之陽髙丘之隈朝為行雲暮為行雨清簟踈簾看弈碁洙曰謝𤣥暉珍簟清夏室江淹賦夏簟清兮晝不暮魏文帝書彈碁間設終以傳弈送李八秘書赴杜相公幕新添年大厯二作補注鶴曰按舊史杜鴻漸大厯二年六月戊戌自蜀入朝而今詩云貪趨相府今晨發恐失佳期後命催又云巫峽秋濤天地迴當是大厯二年七月作青簾白舫益州來蘇曰劉濬自益州歸荆渚白舫百棹皆繡帆青簾多載妓女峽人呼為天上樓船巫峽秋濤天地迴石出倒聴楓葉下洙曰灔澦堆櫓揺背指菊花開貪趨相府今晨發恐失佳期後命催南極一星朝北斗洙曰晉天文志北極北而最尊者也天運無窮三光迭曜而星辰不移故曰居其所而衆星共之人君之象也趙曰南極以言李公在楚而徃是為南極之星北斗指長安蓋上直北斗而號北斗城也五雲多處是三台洙曰五雲五色雲也三台上台中台下台也趙曰晉天文志三台六星两两而居三公之位也指杜相補注鶴曰晉天文志又云老人一星在弧南一曰南極蓋以此星喻杜鴻漸之老也秋日䕫府詠懐奉寄鄭監審李賔客之芳一百韻一云千字作大厯元年補注鶴曰詩云飄零仍百里謂雲安至䕫百三十里今又自雲安飄零至䕫也當是大厯元年秋作絶塞烏蠻北洙曰雋州以西有蠻號烏白孤城白帝邉洙曰公孫述更魚復縣為白帝城飄零仍百里蘇曰吴靖為長沙令一日自漢曰讀五車書辛苦十年不得綴鴛鷺班髪白縱跡飄零尚為百里陶元亮復何人耶消渇已三年洙曰司馬相如有消渇病雄劔鳴開匣洙曰雷煥得雙劔於鄷城劔有雌雄羣書滿繫船洙曰一云所向皆窮轍餘生且繫船亂離心不展洙曰詩亂離莫矣不展謂心憂如結也衰謝日蕭然洙曰名跡消泯也筋力妻孥問洙曰一作覺菁華歲月遷洙曰陶徵士詩菁華隐没注菁華猶英華也登臨多物色陶冶頼詩篇洙曰登髙臨逺多有景物所以象其變態者有詩以陶成之爾陶如陶者之􅓨埴冶如冶工之鎔鑄峽束滄江起巖排石樹圓趙曰善本作古字此作石樹非拂雲霾楚氣鄭曰霾謨皆切風雨土泰伯曰此句謂霧瘴之氣拂雪天也朝海蹴吴天趙曰言江漢朝宗于海其勢蹴踏吴國之天也煮井為鹽速洙曰蜀都賦曰濵以鹽池注巴東北新井縣水出也如涌泉可煮以為鹽補注希曰唐志奉節縣有永安井鹽官雲安大昌亦俱有鹽官九域志雲安軍本雲安縣而云有章井一鹽場團雲一鹽井大寧監本大昌縣而云有泉鹽井按方輿記伏牛山左右山有鹽井州人置竈煮以充用燒畬度地偏畬詩遮切度逹各切洙曰峽土瘠確暖氣晩達故民燒地而耕謂之火耕亦謂之畬田有時驚疊嶂洙曰任彦升詩疊嶂易成響何處覔平川洙曰峽中無川也鸂䳵雙雙舞獼猴壘壘懸洙曰壘壘重疊貎碧蘿長似帶錦石小如錢蘇曰黄牛峽出錦石圓如錢上有五綵花紋隋煬帝時張异來獻帝號曰春池叢玉春草何曽歇洙曰謝靈運詩芳草亦未歇寒花亦可憐洙曰張景陽詩寒花發黄彩師曰䕫地煖春草寒花四時不㫁獵人吹戍火趙曰謂之戍火則有屯戍在白帝城也獵人至其上野店引山泉洙曰峽民依山而居故鮮水常以竹引山泉而食師曰自峽束滄江起至野店引山泉皆述䕫風景也喚起搔頭急洙曰西京雜記武帝遇李夫人就取玉簪搔頭自此後宫人搔頭皆用玉搔頭刀抓頭也何遜云金粟裹搔頭師曰喚起鳥也晨鳴之鳥喚人睡起因以得名前輩詩云喚起䆫全曙催歸日未西東坡謂喚起催歸二鳥名古人用事後世不知多作虛字解釋其失前賢之㫖逺矣扶行幾齒穿洙曰阮孚性好屐客有詣孚正見自蠟屐因自嘆曰未知一生能著幾緉屐神色自閑暢師曰扶竹杖也扶行遍歴故屐齒穿两京猶薄産四海絶隨肩洙曰公有田在韋杜絶隨肩言無故舊也幕府初交辟洙曰蔡邕薦邉讓於何進曰幕府初開博選清英郎官幸傋員洙曰公為郎傋員傋傋數而已言不事事趙曰嚴武東西川為節度使辟公為參謀故云交辟時公為尚書工部員外郎傋員公自謂也補注鶴曰申屠嘉傳為丞相傋員而已儒林傳文學掌故也補郡屬傋員師古曰傋員者示以升擢之非藉實用𤓰時猶旅寓洙曰莊八年齊侯使連稱管至父戍葵丘𤓰時而徃曰及𤓰而代萍泛若夤縁洙曰謝靈運詩蘋萍泛深沉藥餌虚狼藉洙曰謝靈運詩藥餌情所止衰疾忽在斯陸賈名聲藉甚注言狼藉甚盛秋風洒静便趙曰謝靈運詩還得静者便開襟驅瘴癘洙曰峽多嵐瘴氣候蒸濕故多瘴癘憂愁鬰結者易為所困故開襟以驅之明目掃洙曰一作拂雲烟洙曰史明目張膽延年詩城闕生雲烟蘇曰魯肅雲煙掃盡明目望逺髙宴諸侯禮趙曰赴藩侯之宴㑹佳人上客前洙曰古詩主人愛上客哀筝傷老大洙曰魏文帝書哀筝順耳華屋豔神僊洙曰曹子建箜篌引空存華屋處落落歸丘山古詩金屋羅神僊南内開元曲常時弟子傳鄭曰明皇所在補注鶴曰按唐志興慶宫在皇城東南距京城之東開元初置至十四年又増廣之謂之南内法歌聲變轉滿坐涕潺湲洙曰都督栢中丞筵聞梨園弟子季仙奴歌明皇雜録云天寶中上命宫中女子數百人為梨園弟子皆居宜春北院上素曉音律時有馬仙期李龜年賀懐志皆洞知律度安禄山自范陽入覲亦獻白玉簫管數百事皆陳於梨園自是音響殆不類人間其後李龜年流廢江南毎遇良辰勝景為人歌闋座上聞之者莫不掩泣而罷酒有梨園法曲及霓裳曲至今尚存弔影䕫州僻洙曰言獨客䕫州旁無親舊惟與影相弔而已李令伯陳情表煢煢孑立形影相弔回腸杜曲煎洙曰宋玉髙石賦口感心動且回腸氣趙曰公在長安家于杜也曲故懐杜曲而回腸煎熬即今龍廐水莫帶犬戎羶洙曰犬戎吐蕃是也謂陷京師趙曰两京龍廐門苑馬門也故憂以今龍廐門邉之水莫為犬戎所羶汚乎耿賈扶王室洙曰耿賈後漢二十八將耿弇賈復也論曰賈耿之洪烈又翼扶王運蕭曺供御筵洙曰蕭曺之功尊拱漢室趙曰思廟堂大臣有耿賈蕭曺者可以伐叛而息兵秉威㓕蜂蠆洙曰左傳公卑邾不設傋臧文仲曰蠭蠆有毒而况國乎戮力效鷹鸇洙曰左傳季文子使太史克對曰先大夫臧文仲教行父事君之禮曰見有禮於其君者事之如孝子之養父母也見無禮於其君者誅之如鷹鸇之逐鳥雀舊物森猶在洙曰哀元年傳祀夏配天不失舊物凶徒惡未悛洙曰左傳子家亦無悛志注悛改寤也國須行戰伐人憶止戈鋋洙曰言人厭兵革也光武紀道未方古亦止戈之武焉東都賦戈鋋彗雲注矛矟也奴僕何知禮恩榮錯與權洙曰公孫洪傳贊曰衛青奮於奴僕言以恩而假奴僕以權任人之失也蘇曰公孫邈比衛青曰爾奴僕庸夫也焉知禮義青神色頓挫胡星一彗孛洙曰前漢天文志昴曰旄頭胡星也張晏曰彗所以除舊布新也孛氣似彗也師曰胡星指安史亂黔首遂拘攣洙曰秦本紀更民曰黔應邵曰黔亦黎黑也漢曺褒傳寮拘攣難與圖始生拘攣猶拘束也哀痛絲綸切洙曰前漢西域傳贊武帝末年遂棄輪臺之地下哀痛之詔禮緇衣子曰王言如絲其出如綸煩苛法令蠲洙曰前漢髙祖約法三章蠲削煩苛業成陳始王洙曰詩七月陳王業也言因時而變陳王業之艱難以警時君也歐曰言肅宗成中興之業兆喜出于畋洙曰齊世家太公望吕尚以漁釣干周西伯將出獵卜之曰所獲非熊非彲非虎非羆所獲覇王之輔於是西伯獵果遇太公望於渭陽載與俱歸立為師宫禁經綸宻台階翊戴全洙曰梁竦傳宫省事宻莫有知者台階事見建都詩注熊羆載吕望鴻鴈美周宣洙曰美其能勞來還定安集側聴中興主洙曰側聴諦聴也丞民宣王任賢使能周室中興焉長吟不世賢洙曰曺子建曰不世之賢趙曰言王室中興本乎得賢而鄭與李乃所謂賢者故吟詠而思之音徽一柱數洙曰梁劉孝綽江津寄劉之遴詩經過一柱觀出入三休臺道里下牢千洙曰下牢闗在巫峽之南趙曰公自注鄭在江陵李在夷陵一柱觀在荆州渚宫故事宋臨川王於羅公淵上立觀甚大而惟一柱言江陵也下牢闗在峽州言夷陵也師曰一柱觀上牢下牢皆在䕫峽音徽一柱數言得李鄭音書之頻數也道里下牢千言鄭在江陵李在夷陵與子美相距凡千里時不絶音問也鄭李光時論文章並我先隂何尚清省梅曰言其文清新而警省於人沈宋歘聨翩趙曰以四子皆能文者比鄭李也隂則隂鏗何則何遜沈則沈佺期宋則宋之問隂何前代而二公比之彼尚清省未為富豔沈宋近代歘然追逐與之相聮翩也梅曰聮翩文疾速也律比崑崙竹洙曰前漢律歴志黄帝使伶倫去大夏之西崑崙之隂取竹之嶰谷㫁两節間而吹之以為黄鍾之宫音知燥濕絃洙曰伯牙彈琴意在山子期曰巍巍乎意在水子期曰蕩蕩乎伯牙死遂絶絃修可曰劉孝摽廣絶交論曰撫絃徽音未達燥濕變響風流俱善價洙曰王衍樂廣宅心事外見重於時天下言風流者惟王樂為首見晉書愜當乆忘筌趙曰上四句以言二公之文章也文賦誇目者尚奢愜心者貴當王弼明象猶筌者所以在魚得魚而忘筌也置驛常如此洙曰鄭當時孝景時為太子舍人每五日洗沐常置驛馬長安諸郊請謝賔客夜以繼日常恐不徧登龍蓋有焉洙曰李膺獨持風裁以聲名自髙士有被延接者名為登龍門趙曰上句言鄭監之好客下句言李賔客待士雖云隔禮數洙曰名位不同禮亦異數隔猶不同不敢墜周旋洙曰左傳奉以周旋不敢失墜髙視收人表洙曰曺子建與楊徳祖書曰足下髙視於上京趙曰任彦昇撰王文憲集序曰經師人表虛心味道𤣥洙曰老子虚其心又𤣥之又𤣥馬來皆汗血洙曰見馬詩注鶴唳必青田洙曰永嘉記青田有雙白鶴年二生子長便去鮑昭詩獨鶴方朝唳羽翼商山起洙曰見收京詩注趙曰以言李賔客者太子官也故用四皓事蓬萊漢閤連洙曰西都賦修塗飛閤自未央而連桂宫又云瀛州方壺蓬萊皆起於中央趙曰以言鄭監乃祕書監也故用蓬萊字後漢書曰學者稱東觀為老氏藏室道家蓬萊也唐祕書監掌圖書祕記即漢之東觀也管寧紗㡌浄洙曰見嚴中丞枉駕見過詩注江令錦袍鮮洙曰陳書江揔為尚書令能屬文於五言七言尤善然傷於浮艶故為後主所幸日與後主遊宴後亭當時謂之狎客東郡時題壁蘇曰南史桞惲詩云亭臯木葉下壠首秋雪飛琅邪王融見而嘆賞因題東壁惲於粉切南湖日扣舷洙曰舷船唇也扣撃也郭墣江賦云詠採菱以扣舷鄭曰南湖在夷陵逺遊臨絶境洙曰逺遊履名洛神賦云踐逺遊之文履古詩云足下雙逺遊佳句染華牋洙曰華牋蜀牋也趙曰世説孫興作天台賦以示范榮期每至佳句則曰是我輩語每欲孤飛去洙曰謝𤣥暉雪賦瞻雲鳩之孤飛徒為百慮牽洙曰江淹詩撫枕懷百慮生涯巳寥落洙曰生涯言已之生計也寥落無成也國歩尚洙曰一作乃一作巧迍邅洙曰柔桑詩國歩斯頻易屯卦迍如邅如難行不進之貎衾枕成蕪没池塘作棄捐趙曰公自注云平生多病卜築遣懐國亂離故寢處宴安之地皆蕪没棄捐也蘇曰江揔池塘荒廢筆硯棄捐别離憂怛怛當割切洙曰怛怛傷慘不安貎伏臘涕漣漣洙曰臘夏曰嘉平殷曰清祀周曰大蜡漢改為臘伏臘人所以祭祖也公在殷鄉故於伏臘多有所感史記秦徳公始為伏師曰歴忌釋曰伏者何也金氣伏藏之日也一時代謝皆以相生立春木伐水水生木立夏火伐木木生火立冬水伐金金生水立秋金伐火金畏火故至庚日必伏庚者金也隂陽書言從夏至第三庚為初伏第四庚為中伏立秋後初庚為末伏故謂之三伏髙堂隆魏臺訪議曰何以用未祖丑臘對曰按月令孟冬十月臘先祖五祀謂薦田獵所得禽獸故謂之臘左傳曰虞不臘矣聞之師曰王者各以其行之盛祖以其終臘水始於申盛於子終於辰故水行之君以子祖辰臘火始於寅盛於午終於戍故火行之君以午祖戍臘木始於亥盛於卯終於未故木行之君以卯祖未臘金始於已盛於酉終於丑故金行之君以酉祖丑臘土始於未盛於戍終於辰故土行之君以戍祖辰臘魏土徳宜以戍祖辰臘也又風俗通曰臘者獵也因獵取獸以祭先祖或曰臘接也新故交接大祭以報功也補注鶴曰漢郊祀志作伏祠孟康曰六月伏日也周時無至此乃有之師古曰伏者謂隂氣將起迫於殘陽而未得升故為藏伏因名伏日也又陳勝傳臘月莊賈殺勝張晏曰秦之臘月夏之九月臣瓚曰建丑之月也師古曰史記云十二月渉死瓚説是也又嚴延年傳母欲從延年臘師古曰建丑之月為臘祭又楊惲傳歲時伏臘露菊班豐鎬下老切洙曰秦紀豐鎬之間帝王之都秋蔬洙曰一作菰影澗瀍洙曰豐鎬在長安澗瀍在洛陽皆公生涯所在之鄉共誰論昔事蘇曰張華昔事歴歴記獨坐共誰論幾處有新阡洙曰風俗通南北曰阡富貴空回首洙曰言富貴亦外物也空回首言倐忽間爾喧争懶著鞭趙曰劉琨曰常恐祖生先吾著鞭也兵戈塵漠漠江漢月娟娟洙曰時天下亂離惟江漢可以避難趙曰選詩云娟娟新月體局促看秋鷰洙曰局促言不得自肆也秋鷰言欲歸而未得爾蕭踈聴晩蟬蘇曰張翮渭南詩云蕭索渭南客馬上聞晩蟬撩我故鄉思攪我心懸懸雕蟲蒙記憶洙曰楊子曰童子雕蟲篆刻蘇曰王武子逺蒙雕蟲知君子記憶烹鯉問沉綿洙曰古樂府詞呼兒烹鯉魚中有尺素書趙曰言二公記憶其能賦詩故致尺書以問其病體也沉綿者若乆病之謂也卜羡君平杖洙曰嚴君平卜筮於成都市以為卜筮者賤業而可以惠衆人有邪惡非正之問則依蓍龜為言利害各因勢道之以善從吾言者已過半矣裁日閲數人得百錢足自養則閉肆下簾而授老子阮修宣子常步以百錢掛杖頭至酒店便獨酣暢家無儋石之儲也偷存子敬氊洙曰見舊物森猶在注囊虚把釵釧米盡拆花鈿趙曰言皆賣易之也甘子隂凉葉茅齋八九椽陣圖沙北岸洙曰桓温傳初諸葛亮造八陣圖於魚復平沙之上市暨瀼西巔洙曰公自注市暨䕫人語也江水横通山谷處方人故謂之瀼也羈絆心嘗折洙曰江淹别賦心折骨驚棲遲病即痊趙曰毎為事物羈絆故其心嘗拆今得棲可以養而痊也紫收岷嶺芋洙曰一云紫秧岷下芋前漢貨殖傳蜀卓氏曰吾聞岷山之下沃壄千里下有蹲鴟至死不饑師古曰蹲鴟謂芋也其根可食以充糧故無饑年趙曰此以下紀草堂所有也白種陸家洙曰一作池蓮色好梨勝頰穰多栗過拳洙曰蜀都賦紫梨津潤樼栗鏬發勑厨唯一味蘇曰段干木見客供庖唯笋羮瀹笋乃曰家貧山居唯此一味客曰清竒雅味求飽或三鱣洙曰楊震傳鸛雀衘三鱣魚飛集講堂前注鱣似蛇一音善兒去看魚笱洙曰一云俗異隣蛟室詩敝笱在梁也蘇曰孫林終日溪上守魚笱獨坐吟嘯自得忘形若此人皆愛之人來坐馬韉定功曰戰國蘇秦少與張儀友秦在趙為相儀至趙使人白秦秦必激之令儀於城東門外坐以破馬韉進之麄食儀憤乃西入秦昭王善之拜為相儀嘆曰馬韉之事乃至是乎人來坐馬韉言貧無席坐也縛柴門窄窄洙曰一云柴門窄小小通竹溜涓涓洙曰縛柴縛柴為門也通竹引泉以竹也陶淵明詩泉涓涓而始流塹抵公畦稜魯鄧切洙曰京師農人指田逺近多云幾稜耒曰公畦官園也村依野廟壖而宣切洙曰晁錯傳鑿太湖廟渜垣師古曰堧者内垣之外游地也壖人縁切缺籬將棘拒倒石頼藤纒借問頻朝謁何如穩書眠趙曰言懶不出仕補注希曰南史蕭景宗詩借問霍去病何如路旁人此㳺其津誰云行不逮洙曰語古者言之不出恥躬之不逮自覺坐能堅洙曰馬援曰大丈夫窮當益堅老當益壯霧雨銀章澁洙曰前漢公卿表銀章印龜劔其文曰章謂刻其官之章也馨香粉署妍洙曰粉署郎署也趙曰公時乃工部員外郎不能詣省中徒想其官署之妍美耳省謂之蘭者以其諸郎官幄蘭含香也故云馨香又謂之畫省以粉畫之也故云粉署紫鸞無近逺黄雀任翩翾許縁切趙曰上句以譬髙才之人則不論逺近而徃下句則公自謙如黄雀之小徒任翺翔而已紫鸞者紫色之鸞也困學違從衆洙曰與俗俯仰而巳孔子拜下違衆麻冕從衆明公各勉旃洙曰楊惲傳方當盛漢之隆願勉旃無多談趙曰勉二公之為功名也聲華夾宸極洙曰言李鄭聲華足以夾輔宸極早晩到星躔洙曰郎官象列星諸侯象四七宰相法三台皆星躔早晩言非乆拔用之也懇諫留匡鼎洙曰匡衡傳諸儒為語曰無説詩匡鼎來服虔曰鼎猶言當之也言匡且來也應邵曰鼎方也張晏曰匡衡初字鼎長乃易字椎圭世傳衡與貢禹上書言衡敬報下言匡鼎白知是字也師古曰服應二説是也傳載衡言日食事甚切到鄭曰西京雜記匡衡小名鼎諸儒引服虔洙曰後漢儒林傳服䖍字子慎少以清苦建志入太學受業善著文學孝亷不逢洙曰一作過輸鯁直㑹是正陶甄宵旰憂虞軫洙曰宵衣旰食黎元疾苦駢雲臺終日畫洙曰馬援傳顯宗圖畫建武中興名臣列將於雲臺青簡為誰編洙曰青簡殺竹青為簡也春秋序小事簡牘而已青簡乃史臣所以記事者編編條也田曰文選載劉向別録治青竹作簡書謂之青簡余曰後漢吴祐傳青簡注火炙簡令汗取其青易書復不蠧謂之汗簡行路難何有洙曰古有行路離詩招尋興巳專由來具飛檝洙曰木𤣥虚海賦飛迅鼓檝暫擬控鳴弦洙曰西域傳控弦者十餘萬身許雙峯寺田曰釋氏要覧云曹溪在韶州雙峯寺下昔晋武帝曹叔良宅也門求七祖禪洙曰雙峯寺名釋書有六祖此言七祖不知其故田曰按佛書毗婆尸佛尸棄佛毗舍浮佛拘留孫佛拘那含牟尼佛迦葉佛釋迦牟尼佛謂之七祖其所説七偈乃禪原也師曰按佛書毗婆尸佛尸棄佛毗舍浮佛拘留孫佛拘那含牟尼佛迦葉佛釋迦牟尼佛謂之天笁七祖其所謂七偈乃禪源也自達磨至慧能謂之中華六祖由五祖而上蓋梁隋開元以前人六祖慧能入滅於唐睿宗先天元年而子美於是年始生六祖之道至肅宗上元初方盛故肅宗自曹溪請其衣鉢歸内供養子美於是漂泊在蜀以此考之則六祖與子美蓋同時先後人也故所求禪言七祖而不言六祖也因是詩注云不知其故乃叙其世次而辨之落帆追宿昔衣褐向真詮洙曰天台賦披毛褐之森森真詮佛法也趙曰言於披處落帆乃是宿昔之願其衣褐之身專為依向真詮也褐者布衣之謂安石名髙晋洙曰公自注云鄭髙簡得謝太傅之風昭王客赴燕洙曰公自注李宗親有燕昭之美途中非阮籍洙曰阮籍時率意獨駕不由徑路車迹所窮輒動哭而返查上似張騫洙曰因話録漢書載張騫窮河源言其奉使之逺實無天河之説唯張茂先博物志説近世有人居海上毎年八月見槎來不違時齎一年糧乘之到天河見婦人織丈夫飲牛遣問嚴君平云某年某月日客星犯牛斗即此人也後人相傳云得織女支機石時以問君平都是虚慿河之説今成都嚴真觀有一石呼為支機石皆云當時君平留之寳厯中余下第還家於京師途中逢官差遞夫兒張騫槎先在東都禁中今准詔索有司取進不知是何物也前輩詩徃徃有東君槎者相襲訛謬矣縱出雜詩亦不足據也披拂雲寧在洙曰拂一作􅀈衛瓘見樂廣曰瑩然若披雲霧覩青天淹留景不延洙曰劉安招隐士詩云援桂枝兮聊淹留風期終破浪師曰子美淹留江漢年已年矣破浪謂下峽歸故里故曰他日辭神女水怪莫飛涎洙曰孔子世家水之怪龍罔象韋昭曰龍神獸也非常見故曰怪海賦其浪則有天琛水怪鮫人之室江賦揚以掉尾憤浪飛涎趙曰言我之風期必破浪而徃告爾水怪母為孽也南史宗慤詩願乘長風破萬里浪他日辭神女洙曰宋玉有神女賦廟在巫女傷春怯杜鵑洙曰蜀都賦烏生杜鵑之魄見華陽風俗録蘇曰曹晏遊巴江聞杜鵑語友人曰吾年來傷春怯聞此聲使我心索然淡交隨聚㪚洙曰禮君子之交淡如水澤國遶迴旋洙曰言地多陂澤故曰澤國本自依迦葉洙曰王簡栖頭陀寺碑以法師景行大迦葉故以頭陀為稱首注大迦葉佛大弟子也何曽藉偓佺藉去聲偓音渥佺音詮洙曰列仙傳偓佺魏里采藥父也食松實形體生毛數寸能飛行逐走馬揚雄甘泉賦去虽方征橋與偓佺兮猶彷彿其若夢師古曰偓佺仙人名鑪峯生轉盼洙曰鑪山東南有香烟山孤峯起遊氣籠其上氛氲若香烟橘井尚髙褰洙曰神仙蘇耽種橘鑿井以救鄉里之有病者以井泉服一橘葉即已東走窮歸鶴洙曰遼東歸鶴見卜居詩注南征盡跕鳶跕的協切洙曰馬援傳云吾在浪泊西里間虜未㓕之時下潦上霧毒氣薫蒸仰視飛鳶跕跕墮水中卧念少游平生時語何可得也晩聞多妙教卒踐塞前愆塞悉則切洙曰妙教釋教也釋書云能修其教者自足以追塞前紫也顧愷丹青列洙曰晉顧愷尤善丹青圖寫特妙愷之每畫人成或不與目精人問其故曰四體妍蚩本無闕少於妙處傳神寫照正在阿堵中頭陁琬琰䥴洙曰姓氏英賢録云王簡栖作頭陁寺碑文頭陁寺者沙門釋慧宗之所立也敢寓言於雕篆庻髣髴乎衆妙琬琰䥴碑也衆香深黯黯洙曰法華經云曉燒衆名香烟天台賦衆香馥以揚師曰如戒青定香慧香解脱香之類幾地肅芊芊洙曰潘岳耤田賦蝉冕以灼灼兮碧色肅其芊芊師曰幾地謂釋氏自第一地至第十地修行言有漸也勇猛為心極洙曰經云猛勇精進清羸任軆孱洙曰孱鋤連切弱也陳書姚察居憂齊數日乆後主見察羸瘠為之動容金箆空刮眼箆邉迷切鏡象未離銓洙曰一云平等未難銓釋書湼盤經云如目肓人為治目故造詣良毉即以金箆刮其眼摸補注鶴曰法苑珠林後周張元其祖失明元讀經燃燈夢一翁以箆療之後三日果痊餘見文公上方注贈李八祕書别三十韻大厯二年作補注鶴曰台星入朝謁使節有吹嘘台星指杜鴻漸入朝當是大厯二年秋七月徃時中補右扈蹕上元初洙曰扈二從也蹕鳴蹕也天子之初鳴蹕以清道後漢輿服志蘭臺令史皆執蹕以督整專驅謂之䕶駕補注鶴曰文三王傳出稍警入言蹕師古曰警者戒肅也蹕止行人也言出入者互文耳亦有蹕漢儀注皇帝出殿則傳蹕止人清道也反氣凌行在洙曰天子所幸謂之行在反氣謂賊未破也妖星下直廬洙曰見收京師注陸機詩厭直承明廬六龍瞻魏闕洙曰易時乘六龍蕭何作漢宫闕記萬騎略姚墟洙曰蔡邕獨斷曰大駕傋千乘萬騎帝王世紀曰瞽瞍之妻曰握登生舜于姚墟故得姓氏于姚氏也𤣥朔巡洙曰一作囘天步洙曰時天歩斯頻神都憶帝車洙曰武后以東都為神都時天子尚在蜀故言憶後漢輿復志以攜龍角為帝車一戎纔汗馬洙曰書一戎衣天下大定公孫𢎞臣愚駑無汗馬之勞師古曰未嘗従事軍旅也百姓免為魚洙曰昭元年劉子曰美哉禹功明徳逺矣微禹吾其魚乎蘇曰漢中河決蕭望之塞定人曰百姓免此回為魚事見塞河碑通籍蟠螭印洙曰通籍注籍者為二尺竹牒尺其年紀名字物色懸之宫門案省相應乃得蟠螭謂印鼻紐上文也夢符曰按漢舊儀天子六壐皆玉螭虎紐也補注希曰魏相傳光夫人顯及諸女皆通籍長信宫師古曰謂禁門之中皆有名籍通出入也差肩列鳯輿事殊迎代邸洙曰髙帝崩吕産欲危劉氏周勃為丞相陳平朱虚侯劉章共誅諸吕遂奉天子法駕迎代王於代邸立為孝文皇帝喜異賞朱虛洙曰齊哀王弟章入宿衛於漢髙后封為朱虛侯以吕禄女妻之後呂禄吕産作亂章與太尉周勃丞相平等誅之章乃先斬吕産文帝益封朱虛侯二千石黄金一千斤㓂盜方歸順洙曰歸順歸降納欵乾坤欲晏如洙曰寕静也不才同補衮洙曰謂作拾遺也衮職有闕仲山甫補之奉詔許牽裾洙曰魏卒毗字佐治文帝欲徙冀州十家十萬戸實河南毗諫帝怒不答起入毗隨而引其裾帝怒良乆乃出曰佐治卿持我何太急邪毗曰今徙既失人心又已無食帝遂徙半鴛鷺叨雲閤洙曰古詩厠迹鴛鷺行謂侍從列也潘安仁髙閤連雲騏驎滯玉除洙曰一作石渠屬李秘書也補注希曰蘇武傳扶輦下除師古曰除謂門屏之間文園多病後洙曰司馬相如傳相如嘗冇消渇疾後拜為孝文園令中㪚舊交踈洙曰嵇康為中㪚飄泊哀相見平生意有餘風烟洙曰一作塵巫峽逺臺榭楚宫虚洙曰一作除觸目非論故新文尚起予洙曰語起予者商也清秋凋碧桞别浦落紅蕖消息多旗幟洙曰髙紀張旗幟於山上經過歎里閭洙曰為䘮亂多凋弊戰連脣齒國洙曰僖五年傳晉侯假道於虞以伐虢宫之竒諫曰虢虞之表也虢亡虞必從之此所謂輔車相依脣亡齒寒者其虞虢之謂軍急羽毛書洙曰魏武帝奏事曰若有急則挿羽於檄謂之羽檄幕府籌頻問洙曰李廣幕下省文書師古曰幕府者以軍幕為義山家藥正鋤洙曰秘書北卧青城山下台星入朝謁使節有吹嘘西屬災長弭南翁憤始攄對敡抗士卒洙曰敡余章切益稷曰時而颺之注颺道揚舉也畢命對揚文武之光命乹没費倉儲乹居寒切洙曰張湯傳湯始為小吏乹没與長安富賈田甲魚翁叔之属受私服䖍曰乹没謂成敗也如淳曰豫居物以待之得利為乹失利為没勢藉兵須用功無禮忽諸御鞍金騕褭洙曰漢書音義曰騕褭者神馬也赤喙黒身與飛兎同明君有德則至宫硯玉蟾蜍洙曰西京雜記晉靈公冢甚環壯四角皆以石為玃犬捧燭石人男女四十餘皆立侍棺噐無復形兆尸猶不壊孔竅中皆有金玉其餘噐物皆朽爛不可别惟有玉蟾蜍一枚大如拳腹空空五合水光潤如新玉取以盛水滴硯拜舞銀鈎落洙曰銀鈎字也猶詔書恩波錦帕舒洙曰西京雜記言秘閤圖書皆表以牙籖復以錦帕此行非不濟良友昔相於去棹依顔色㳂流想疾徐沉綿疲井臼洙曰馮衍傳兒女常自操井臼倚薄似樵漁乞去聲鄭曰云既切與人物米煩佳客鈔詩聴小胥鈔楚交切洙曰小吏也杜陵斜晩照洙曰漢書元帝紀杜陵在長安南五十里潏水帶寒淤潏以律切淤衣居切洙曰潏水名也杜陵潏水公之故里莫話青溪髪鄭曰在荆州鬼谷子學仙處蕭蕭白映梳蘇曰黄休年老多病素髪映梳燈下不辨蠅頭世事踈也寄劉峽州伯華使君四十韻大厯二年作補注鶴曰詩云林居看蟻穴野食待魚罾又云秋來尚鬰蒸當是大厯二年在瀼西作峽内多雲雨秋來尚鬱蒸洙曰髙唐賦朝為行雲暮為行雨應璩書處凉臺而有鬰蒸之煩逺山朝白帝洙曰見白帝城詩注深水謁洙曰一作出夷陵洙曰峽州有夷陵縣補注鶴曰歐陽六一公云夷陵者楚之西境昔春秋書荆以狄之而詩人亦曰蠻荆地濵大江遲暮嗟為客西南喜得朋洙曰易西南得朋哀猿更起坐趙曰聞哀猿之聲不覺起坐更音平聲落鴈失飛騰趙曰以言其身如鴈之落而失於飛騰也伏枕思瓊樹洙曰江淹賦云願一見顔色不異瓊樹枝矣趙曰李陵贈蘇武詩思得瓊樹以解長饑渇臨軒對玉繩星名洙曰謝𤣥暉詩玉繩低建章青松寒不落洙曰歲寒若青松色何敬祖詩青青陵上松亭亭髙山栢光色冬夏茂根抵無凋落趙曰以言劉使君之勁節碧海闊逾澄洙曰噐宇若碧海十洲記扶桑在碧海之中趙曰以言劉使君之寛量昔歲文為理羣公價盡増洙曰尚文之世羣公皆馳譽得時其價増饒曰言𤣥宗之世以文理天下也家聲同令聞鄭曰聞亡運切名達也以令聞為家聲時論以儒稱洙曰以儒名世趙曰此言劉使君先世家聲與公祖杜審言同休當時士論並以儒稱之歸劉杜氏太后當洙曰一作臨朝肅多才接迹昇翠虚捎魍魉捎所交切洙曰甘泉賦捎䕫魍魉扶獝狂捎殺也丹極上鯤鵬洙曰莊子鯤化為鵬趙曰太后指則天也言棄捐不才如捐魍魉賢者得君如上鵾鵬師曰翠虚言山林之間捎拂魍魉喻小人逺遁也下言賢者奮迅於丹霄也宴引春壺滿洙曰一作酒趙曰此言太后寵賜大臣如此恩分夏簟冰洙曰錫宣賜冰也江淹詩夏簟清兮晝不暮蘇曰魏明帝賜許玩黄䕨蚪紋簟玉井冰以表優恩雕章五色筆洙曰江淹夢得五色筆由是文藻日進田曰齊蕭慤秋夜賦詩云芙蓉露下落楊栁月中疎髙林以為斯文雕章間出紫殿九華燈洙曰西京雜記元日燃九革燈於南山山上照見百里謝𤣥暉紫殿肅隂隂學並盧王敏洙曰唐文苑傳盧照隣與楊烱王勃駱賔王以文詞齊名海内稱四人為四傑書偕禇薛能洙曰禇遂良薛稷也遂良之書得王逸少之軆稷外祖魏徵家多禇書稷鋭意模學時無及者老兄真不墜小子獨無承洙曰言伯華所學真不墜古人大體惟已無所承於前輩近有風流作聊從月竁徵蘇曰庾凱聞足下近有風流佳客不惜寄雲卧野人顔延年宋郊祀歌月竁來賔日際奉土注云竁窟也一作峽又作月繼非放蹄知赤驥洙曰列子周穆王有赤驥晁曰喻其才馳騁也捩翅服蒼鷹洙曰一作校此一對皆言文才俊逸蘇曰盧充曰赤驥失秣駑馬見欺放蹄始知俊逸馬融語友人曰蒼鷹捩翅百禽咸服眞儒一言羣詞俱挫晁曰服其豪邁也巻軸來何晩襟懐庻可憑㑹期吟諷數益破旅愁凝洙曰凝結也雕刻初誰料洙曰一作解揚子或問雕刻衆形匪天歟纎毫欲自矜趙曰言纎毫皆妙而可矜誇也神融躡飛動田曰列子曰心凝形釋骨都融不覺形之所寄足之所履随風東西戰勝洗侵凌田曰韓子音云子夏見曽子曰肥對曰戰勝故肥曽子曰何謂也對曰吾入見先王之義則榮之出見富貴又榮之两者戰於胷中未知勝負故臞令先王之義勝故肥也妙取筌蹄弃洙曰易得魚忘筌得兎忘蹄髙宜百萬層洙曰言格致髙逺也白頭遺恨在趙曰公之自歎也青竹幾人登洙曰青竹青簡也猶書於青簡者能幾人囘首追談笑勞歌跼寢興鄭曰跼渠六切不伸也趙曰追懐劉使君之談笑勞我之歌詠而跼蹐於寢興之間也年華紛已矣世故莽相仍洙曰嵇康書曰世故繁其慮七不堪也刺史諸侯貴洙曰翟方進奏曰古選諸侯賢者以為州伯令部刺史居牧伯之位秉一州之統請罷刺史置州牧郎官列宿應洙曰漢明帝云郎官上應列宿出宰百里非其人民受其殃潘生驂閤逺洙曰一云潘安雲閤逺又潘安仁賦髙閤連雲黄覇璽書増洙曰黄覇為頴川太守治為天下第一天子以覇治行終長者又下詔稱揚賜闗内侯黄金百斤循吏傳云二千石有治理效者輒報璽書勉勵増秩賜金乳贙號攀石洙曰乳虎也趙曰此以下公自叙也贙音畎田曰爾雅贙有力注出西海大秦國似狗多力獷惡舊注謂乳虎非也饑鼯訴落䕨鼯化胡切洙曰蕪城賦階聞麕鼯藥囊親道士趙曰以其病故求服食於道士灰劫問胡僧洙曰武帝穿昆明池悉是灰墨有外國胡道人云此是天地劫灰之餘憑乆烏皮綻洙曰烏皮几也蘇曰宋明不仕杜門注黄老書孫登惠烏羔皮裏几歲乆憑皆破綻自號守一先生簪稀白帽稜洙曰管寕嘗著白帽趙曰言髪少之故白帽白紗帽也補注希曰隋書宋齊之間帽或白紗髙屋餘見别董頲詩林居看蟻穴蘇曰焦林郊居終日看蟻穴運壤怡然自樂人莫識其意也野食待魚罾洙曰罾魚網也筋力交彫喪飄零免戰兢蘇曰髙翃致仕語弟曰昔居諫省日夕如履冰戰兢今遂飄零幸免此亦佳事也皆為百里宰趙曰言身為郎官其時自可以為百里宰正似六安丞夢符曰按後漢桓譚數言事忤旨出為六安丞忽忽不樂道病卒趙曰公言房琯無罪忤肅宗遂弃不省之正如桓譚之忤㫖也姹女縈新裏姹陟駕切洙曰姹女神女也善燒煉因而得乘烟仙去修可曰漢魏真人參同契曰河上姹女靈而最神得火則飛不染垢塵注云河上即是真永也又參同契曰丹砂木精得金乃并漢真人大丹訣曰姹女隐在丹砂中注姹女录也以二書考之則姹女非神仙人丹砂冷舊秤洙曰葛洪求為勾漏令就采丹砂而已但求椿壽永洙曰莊子曰古有太椿者以八千歲為春以八千歲為秋莫慮杞天崩洙曰杞國人憂天崩墜身無所寄鍊骨調情性洙曰文子曰太上養神其次養形張兵撓棘矜巨申切洙曰徐樂傳舊棘矜師古曰棘㦸也矜者棘之檛秦銷兵噐故但有㦸之杷耳養生終自惜伐數洙曰一作叛必全懲洙曰嵇康有養生論七發云伐性斧趙曰言養生終自惜而時之用兵伐叛必全懲之政術甘踈誕詞場愧服膺洙曰顔子拳拳服膺展懐詩誦魯洙曰魯諸侯而有頌徳者以徳可歌誦也割愛酒如澠趙曰公自注云左傳有酒如澠咄咄寧書字洙曰世説殷中軍名浩被廢在長安終日嘗畫空作字揚州吏人尋議之竊視唯作咄咄怪事四字而已𡨕𡨕欲避矰洙曰揚子鴻飛𡨕𡨕弋人何慕焉江湖多白鳥天地有青蠅洙曰詩青蠅以喻讒鮑曰與白鷗没浩蕩萬里誰能馴同意指言自適也青蠅言有讒也修可曰按白鳥有二説一説謂鷗鷺之類詩言白鳥鶴鶴是也喻賢者之潔白乃棄置江湖之間一説謂白鳥蚊蚋也以譬則小人言賢者居亂世欲隐則為蚊蚋所噆欲出則為青蠅所汚是無逃於天地之間矣王十五前閤㑹大厯元年作補注蘇曰詩云楚岸收新雨春臺引細風又云病身虚俊味當是大厯元年春作公有送王十五扶侍還黔中詩楚岸收新雨春臺引細風情人來石上趙曰鮑昭詩留釣待情人鮮鱠出江中趙曰枚乘七發云鮮鯉之鱠鄰舍煩書扎洙曰司馬相如傳扎水蘭之薄小者時未多用紙故給扎以書録肩輿强老翁趙曰以筍輿來送公也病身虚俊味趙曰以病不能食而虚其俊美之味何幸飫兒童趙曰饋食於公持之以歸燕及兒曹也寄韋有夏郎中大厯元年作補注鶴曰詩云歸楫生衣卧謂歸舟雖理而未動所以生衣當是大厯元年作省郎憂病士蘇曰潘安仁荷省郎常來慰問知有憂病士之誠書信有柴胡洙曰藥名也郭璞聞景倩病作書令童送柴胡及真茶數两飲子頻通汗懐君想報珠洙曰四愁詩何以報之明月珠蘇曰沈佺期囘波辭云姓名雖䝉齒録袍笏未復牙緋子美用飲子對懐君亦齒録牙緋之比也親知天畔少藥餌峽中無洙曰峽俗信鬼病則禱祠而不服藥故峽中藥最少歸楫生衣卧趙曰以上水更不須楫所以生衣而卧生衣者生水衣於其上也春鷗洗翅呼猶聞上急水早作取平塗萬里皇華使為僚記腐儒洙曰詩皇皇者華君遣使臣也文七年傳荀林父曰同官為僚吾常同僚敢不盡心乎漢髙祖罵酈食其曰腐儒幾敗迺公亊師曰仇池翁曰沈佺期囘波辭云姓名未䝉齒録袍笏未復牙緋子美用飲子對懐君亦齒録牙緋之比也又古今詩話云古之文章自應律度未以音韻為主自沈約増崇韻學之後詩之體製漸多始有蹉對假對雙聲疊韻之類如自狼朱邪之狼狽致赤子之流離不惟赤對朱邪對子兼狽流離乃獸名對鳥名又如厨人具雞黍稚子摘楊梅以雞對楊之類皆為假對子美以飲子對懐君及惡樹詩枸杞因吾有雞棲柰爾何殆亦所謂假對也柴胡可煎為飲子喫之通汗䕫峽間多險阻唯州稍平故子美云林中纔有地峽外更無天此言早作取平塗欲其來就此平地相見也寄常徵君大厯元年作補注鶴曰詩云開州入夏知凉冷不似雲安毒熱新蓋謂徵君永泰元年秋曽訪公雲安是時秋熱為甚今在開州故寄以詩所以於詩尾及之當是大厯元年夏白水青山空復春趙曰言徵君本在白水青山之間今以其不在所以空復春也徵君晩節旁風塵洙曰徵君以其曽為朝廷禮聘而不起故謂之徵君蘇曰顔延年陶徵君晚節彌髙肯作風塵態楚妃堂上色殊衆海鶴堦前鳴向人洙曰海鶴非堦墀之物而今鶴向人者言徵君晚節也趙曰上句言徵君如楚妃之妍有絶衆之色下句言徵君如海鶴之髙非堦墀之物而今鳴向人萬事糺紛猶絶粒洙曰賈誼賦糺錯相紛一官羈絆實藏身趙曰舊注云公自言則公已不為官不可謂之羈絆也開州入夏知凉冷不似雲安毒熱新寄岑嘉州大厯二年作魯曰州據蜀江外趙曰岑參也補注鶴曰詩云贈子雲安雙鯉魚又云不見故人十年餘按公與參嘗同省乾元元年戊戌公出華州司功方相别至大厯三年戊申十一年方應十年餘之句然公是春已出峽此詩當是大厯二年作亦可稱十年餘其曰雲安魚者在䕫皆可言也不見故人十年餘不道故人無素書洙曰古詩中有尺素書願逢顔色闗塞逺洙曰江淹詩願一見顔色豈意出守江城居洙曰顔延年一麾乃出守外江三峽且相接斗酒新詩終自踈補注鶴曰黔州有江曰内江資州簡州有江曰中江則有外江必矣而書志俱不言有外江意嘉州之汶江即外江也是時公在䕫而岑在嘉州與峽程記遂謂蜀為峽郡者相近故云且相連謝眺每篇堪諷誦蘇曰羊蓋曰謝公篇什無塵俗氣韻自可暉諷誦足有開發謝眺字𤣥馮唐已老聴吹嘘洙曰見自有願為郎詩注趙曰公自以馮唐為比而聼其有吹嘘之者泊船秋夜經春草趙曰公初至雲安是去年秋故云泊船秋夜今又見春故云經春草伏枕青楓限玉除洙曰見贈李八祕書詩注趙曰青楓乃言楚地公卧病於此限玉除謂限隔不能見君也眼前所寄選何物贈子雲安雙鯉魚洙曰古詩客從逺方來遺我雙鯉魚覧物大厯元年作洙曰一云峽中覧物補注鶴曰巫峽忽如瞻華嶽蜀江猶似見黄河當是大厯元年夏在䕫見巫峽蜀江而思華州也故詩又云憶在潼闗詩興多曽為掾吏趨三輔洙曰三輔京兆扶風馮翊也公曽為掾趙曰公曽為華州功曹故曰掾吏華為扶風憶在潼闗詩興多蘇曰王納曰吾憶在洛陽詩興甚多今老矣終日思一二字無處下筆趙曰公華州所有詩即潼闗之詩興矣補注希曰舊史志謂華州為上輔故因扶風在三輔之數云潼闗在華州華隂縣即桃林之塞也新史志革隂有潼闗又有嶽祠及黄河亦經華而東故下句又云巫峽忽如瞻華嶽蜀江猶似見黄河華胡化切師曰華嶽黄河皆子美故鄉公今客中見巫峽蜀江遂想像有感故曰忽如瞻華嶽猶似見黄河也舟中得病移衾枕趙曰言其得病在雲安舟中而移衾枕於客居屋舍之下洞口經春長薜蘿洙曰謝靈運詩想見山河人薜蘿若在眼形勝有餘風土惡幾時囘首一髙謌洙曰雖號形勝之地而風土不類中原公曽有南楚詩云南楚青春異暄寒早早分憶鄭南玼鄭曰音泚作大厯元年補注鶴曰鄭南當是華州鄭縣之南玼玉色言石之似玼故詩云石影衘珠閤泉聲帯玉琴今曰憶之當是在蜀作梁編在大厯元年鄭南伏毒寺趙曰舊本作毒守難解師民瞻本作毒守無義一本作毒寺却似有義蓋寺名伏毒而在江心故以到江心為瀟洒也瀟洒到江心石影衘珠閤泉聲帶玉琴趙曰言泉之似玉琴之聲也風杉曾曙倚雲嶠憶春臨萬里蒼茫水洙曰一作外龍蛇只自深趙曰言滄浪水徒為龍蛇之深藏不似鄭南江心之可到懐㶚上遊大厯二年作補注鶴曰㶚水在長安志所謂京城在臨㶚岸是也而詩云悵望東陵道平生㶚上遊又云春濃停野騎江漢一歸舟則是在䕫懐長安也大厯二年作悵望東陵道洙曰蕭何傳召平故秦東陵侯種𤓰長安城東世謂東陵𤓰平生㶚上遊洙曰㶚水也春濃停野騎夜宿敞雲樓離别人誰在趙曰所與同遊㶚上之人今既離别復誰在乎經過老自休眼前今古意江漢一歸舟洙曰古詩天際識歸舟雨大厯元年作補注鶴曰詩云萬木雲深隐連山雨未開又云清凉破炎毒衰意欲登臺當是大厯元年䕫州作萬木雲深隐連山雨未開風扉掩不定蘇曰吴芮山居扉不用横木遇風即開掩趙曰風扉舟中之門也水鳥過仍廻鮫館如鳴杼直吕切洙曰文選鮫人織綃於泉室趙曰以在舟中視大江云不若有鮫人之館而聴其鳴杼樵舟豈伐枚洙曰樵人於木無所取材上採薪而已清凉破炎毒衰意欲登臺晚晴大厯元年作補注鶴曰詩云峽雨落餘飛當是在䕫州作又云熊羆覺自肥謂崔旴之亂未彌當是大厯元年作返照斜初㪚浮雲薄未歸江虹明逺飲洙曰楚詞虹霓紛其朝霞兮乆滛滛而霖雨漢燕王具謀反大虹下于宫中飲井水竭峽雨落餘飛鳬鶴終髙去洙曰喻避世之士能髙舉逺引也熊羆覺自肥洙曰喻貪暴者賊民以自豐也蘇曰秦純詩麒麟鸞鳯何時見豺虎熊羆日覺肥工部當離亂之際託意此詩極工秋分客尚在竹露夕微微夜雨大厯二年作補注鶴曰詩云天寒出巫峽醉别仲宣樓當是大厯二年秋作明年正月果出峽小雨夜復密廻風吹早秋野凉侵閉戸趙曰已閉戸矣凉氣透之故云侵閉戸江滿帶維舟趙曰公言江水既添滿而有維舟在岸也任彦昇詩序維舟久之郭生方至尔通籍恨多病洙曰公通籍朝省以病不赴為郎忝薄游洙曰檢校尚書工部員外郎則已自愧其忝竊於薄薄游官矣漢卜式不願為郎天寒出巫峽醉别仲宣樓洙曰王粲字仲宣有樓在荆州更題大厯二年作補注鶴曰大厯二年秋作與前一詩俱有意於出峽况又謂之更題故自直怕巫山雨之句其曰同舍晨趨侍胡為淹此留蓋動歸朝之念只應踏初雪騎馬發荆州直怕巫山雨真傷白帝秋趙曰公在䕫州乃巫山白帝之側故指其多雨而當秋時可傷也羣公蒼玉佩洙曰晉公卿禮秩特進尚書令僕射皆珮水蒼玉蘇曰朱椿昨日見王遵緑衣佩蒼玉扵犀公中風姿尢異天子翠雲裘洙曰禮孟冬之月天子始䘮趙曰宋玉賦主人之女翳承日之華被翠雲之裘同舍晨趨侍胡為淹此留洙曰言同舍皆在侍從已何為而留此公之志嘗在朝廷而不為時之所用如此峽隘大厯二年作補注鶴曰詩云聞説江陵府雲沙静眇然又云水有逺湖樹人今何處船當是大厯二年在䕫州有意於徃荆南故作明年果至江陵聞説江陵府洙曰荆州也雲沙静眇然白魚如切玉朱橘不論錢水有逺湖樹人今何處船趙曰所謂欲徃江陵之人其船今在何處公自言也青山各在眼却望峽中天趙曰若巫之青山在眼仰望峽中之天矣意謂峽山两立才能見其天也已補注鶴曰謝靈運詩云想見山中人薜茘若在眼存殁口號二首四子皆游於藝故甫志之大厯元年作補注鶴曰每篇言詩畫者一存一亡故曰存殁口號鄭䖍以廣徳二年死而今詩云鄭公粉繪隨長夜則梁權道編在大厯元年作為是席謙不見近彈碁道士席謙吴人善彈碁後漢梁冀能彈碁注引藝經彈碁两人對局白黒碁各六枚先列碁相當更先彈也碁局以石為之古今詩話彈碁有譜一巻皆唐賢所為其局方二尺中心髙如覆盆其顛為小壺四角微起李商隐詩玉作彈碁局中心最不平謂其中尊也畢曜仍傳舊小詩玉臺集畢曜善為小詩玉局他年無限笑洙曰一作事搜神記昔有人騎入南谷山中見一小池横石橋遂驟馬過橋見二少年臨池弈碁置白玉碁局見騎馬者拍手負局而走薛曰按道藏成都地神湧出扶一玉局補注希曰張道陵修道既成老君降扵成都地涌玉局今為觀在門内白楊今日幾人悲陶潜挽歌荒草何茫茫白楊亦蕭蕭此言幾人為之悲感特有我而已鄭公粉繪隨長夜曹覇丹青巳白頭公自注髙士滎陽鄭䖍善畫山水曹覇善畫馬天下何曽有山水人間不解重驊騮言無人珍重而藏其畫也日暮大厯二年作補注鶴曰詩云牛羊下來夕各已閉柴門又云石泉流暗壁草露滴秋根當是大厯二年在瀼西作牛羊下來夕洙曰詩日之夕矣羊牛下來各巳閉柴門風月自清夜江山非故園石泉流暗壁草露滿秋根洙曰一作滴秋原沈休文詩樹頂鳴風颷草根滴露霜頭白燈明裏何須花燼繁洙曰世俗謂有喜事則燈結花今公頭白老矣何用喜為哉故不須燈燼繁華也秋日寄題鄭監湖上亭三首大厯元年作補注鶴曰鄭監即鄭審湖在峽州而公在䕫故云寄題當是大厯元年作碧草違春意洙曰别賦春草碧色沅湘萬里秋沅音元洙曰沅湘二水名池要山簡馬洙曰見習池未覺風流盡注月静庾公樓洙曰晉庾亮在武昌諸佐吏殷浩之徒乘秋夜共登南樓俄而不覺亮至諸人將起而避之亮徐曰諸君可住老子於此處興復不淺便據胡牀與浩等談詠竟夕其坦率行多此類磨㓕餘篇翰蘇曰吴湘曰一代風流磨㓕殆盡唯有餘篇遺翰氣焰焰然平生一釣舟趙曰此两句公自言也髙唐寒浪㓕髣髴識昭丘洙曰登楼賦北彌陶牧西接昭丘補注鶴曰長揚賦從者彷彿骫屬而還師古曰彷彿讀曰髣髴新作湖邉宅還聞賔客過自須開竹逕誰道避雲蘿趙曰既開竹逕則其逕顯豁豈是隐避於雲蘿之間乎官序潘生拙洙曰潘岳閑居賦拙者絶意乎寵榮之事才名賈誼多洙曰本傳言誼年少頗通諸家之書文帝召為博士每詔令議下諸老先生未能言誼盡為之對捨舟應卜地鄰接意如何趙曰公欲徃江陵故有鄰接之問暫住蓬萊閤終為江海人趙曰鄭為祕書監即漢之東觀後漢東觀書曰學者稱東觀為老氏藏室道家蓬萊山今鄭君退居斯江海之人矣揮金應物理師曰張景陽詩昔在西京時朝野多歡娱藹藹東都門羣臣祖二疏朱軒耀金城供帳臨長衢達人知止足遺榮忽如無揮金樂當年歲暮不留儲按疏廣為太傅兄子受為少傅乞骸骨歸上加賜黄金二十斤太子贈以五十斤既歸日具酒食待族人賔客相與娱樂故子美有揮金應物理句補注希曰一本作暫阻蓬萊客謝靈運憶山中行詩本為江海人陶淵明詩雖無揮金事濁醪聊可持拖玉豈吾身洙曰西征賦飛翠緌拖鳴玉以出入禁門者衆矣羮煮秋蓴滑盃迎露菊新洙曰陶淵明詩秋菊有佳色裛露掇其英泛此忘憂物逺我達世情一觴雖獨進盃盡壺復傾賦詩分氣象佳句莫頻頻謁眞諦寺禪師大厯元年作補注鶴曰詩云凍泉依細石晴雪落長松當是在䕫州作從舊次大厯元年冬作蘭若山髙處洙曰蘭若寺名烟霞障幾重凍泉依細石晴雪落長松洙曰天台賦落落之長松問法看詩妄觀身向酒慵未能割妻子卜宅近前峯趙曰如宋周顒長於佛理於鐘山西立隐舍終日長蔬雖有妻子獨處之此於卜宅近寺翁為可證也覆舟二首大厯元年作補注鶴曰詩云巫峽盤渦曉當是大厯元年秋在䕫州作巫峽盤渦曉洙曰江賦衘巫峽以迅激又盤渦谷轉黔陽貢物秋丹砂同隕石洙曰僖十六年隕石扵宋五翠羽共沉舟洙曰洛神賦或拾翠羽鄒陽書積羽沉舟羈使空斜影羈旅也趙曰此寫出押船使者船覆而无聊之意龍居悶積流洙曰龍居寳之所歸聚也篙工幸不溺俄頃逐輕鷗洙曰言其能溷爾竹宫時望拜洙曰前漢禮樂志正月上辛用事甘泉圜丘常有神光如漢星上集於祠壇天子自竹宫而望拜趙曰詳味此篇蓋因祠享而貢物也黄曰竹宫桂館事皆語諷𤣥宗好神仙補注希曰公在䕫作此詩時明皇已升遐乆矣豈是諷其好神仙趙注云因祠祀而貢物故有此句為是桂館或求仙洙曰前漢郊祀志公孫卿曰仙人可見上常處以故不見今陛下可為館如緱氏城置棗神人宜可致仙人好樓居於是長安創飛亷桂館師古曰飛亷及桂館二館名姹女凌波日姹陟駕切洙曰曹子建洛神賦凌波微步羅襪生塵相帝童謡河間姹女工數錢也神光照夜年趙曰所謂神光如流星是已此四句言祠神而神降之徒聞斬蛟劔洙曰荆佽飛得寳劔渡江中流两蛟繞舟幾没佽飛㧞劔斬蛟乃得濟無復㸑犀船洙曰温嶠㸑犀以照水怪使者隨秋色迢迢獨上天洙曰張騫也趙曰上天以言見帝也秋清大厯二年作補注鶴曰詩云十月江平稳輕舟進所如當是大厯二年謀出峽故有此作髙秋蘇肺氣白髮自能梳補注希曰商那和修録云商那和修問毱多如年幾耶答曰我年十七師曰如身十七姓耶答曰師髪已白為髪白耶心白耶師曰但髪白非心白耳藥餌憎加減洙曰謝靈運詩藥餌憎所止衰疾忽在斯門庭悶掃除洙曰陳蕃不事一室志掃除天下杖藜還客拜補注希曰莊子原憲杖藜應門愛竹遣兒書趙曰王子猷愛竹几遣兒書則題字竹上十月江平稳輕舟進所如哭王彭州掄大厯元年作補注鶴曰詩云巫峽長雲雨當是在䕫州作詩又云兵戈聞两觀寵辱事三朝蜀路江干窄彭門地里遥解龜生碧草諫獵阻清霄則王當廣徳年間為彭州而今方替罷遂死也此詩大厯元年作執友驚淪没趙曰禮記執友稱其仁也斯人已寂寥新文生沈謝洙曰沈約謝靈運也異骨降松喬洙曰王君平謂茅盈曰子有異骨可學仙漢文帝壽命非松喬得神仙赤松子王喬也北部初髙選趙曰言其初官得京畿尉也故用北部事曹操年二十除洛陽北部尉舊注謂北部太守豈有才起身便為太守乎東堂早見招洙曰晉郄詵還遷雍州刺史武帝於東堂㑹問詵曰卿自以為何如詵對曰臣學賢良對策為天下第一猶桂林之一枝崑山之片玉帝笑侍中奏免詵官帝曰吾與之戯不足爾蛟龍纒倚劔趙曰言禁從之地變化者如蛟龍纒繞其所倚之劔鸞鳯夾吹簫趙曰鸞與鳯夾其所吹之簫也秦有簫史教弄玉以吹簫而鳯凰降舊注於此句下注王子晉誤惑學者子晉乃是吹笙非簫也歴職漢庭乆洙曰職任也中年胡馬驕洙曰謂安史亂兵戈聞两觀洙曰東京賦建象魏之两觀寵辱事三朝趙曰謂明皇肅宗與當日代宗蜀路江干窄洙曰見謾勞車馬駐江干注彭門地里遥洙曰彭門地名屬彭州鄭曰即彭州两峯相對曰天彭解龜生碧草洙曰謝靈運解龜在景平謂解去所佩龜印諫獵阻青霄洙曰司馬長卿上書諫獵頃壯戎麾出叨陪幕府要趙曰言王在彭州而參成都節度軍謀矣補注希曰唐人多言戎麾如杜佑制出緫戎麾是也將軍臨氣候趙曰指言揔戍之人壯土塞風颷趙曰指言戰鬬之士井渫洙曰又作蒲深悉列切泉誰汲洙曰易井之九三井渫不食為我心惻可用汲注言㓗已不見用也烽踈火不燒趙曰凡軍旅所在必先論井泉凡有警必須烽燧今井泉不汲而烽火不燒則無事矣皆以王君參謀所致而然前籌多自暇洙曰張良借箸前籌隐几接終朝隐去聲洙曰孟子隐几而卧翠石俄雙表洙曰蔡伯喈樹碑表墓寒松竟後彫洙曰語歲寒然後知松栢之後彫也贈詩焉敢墜染翰欲無聊蘇曰晁建中僻居山林經年不識車馬養成懶㪚或答親友書亦無聊染翰誰復著書者耶再哭經過罷洙曰橋𤣥見曹植曰天下將亂安生民者其在君乎後𤣥死植經過𤣥墓輒愴悽致祭感其知巳也趙曰聞其死已哭矣靈櫬從䕫州經過則公又再哭離魂去住銷洙曰言去者有思念之心住者有思念之意故皆銷魂也之官方玉折洙曰蕭望之便道之官王褒死如玉折也寄𦵏與萍漂洙曰寄𦵏莽也趙曰追悼其才赴任而遂如玉折又傷念其寄殯若萍泛未安也曠望渥洼道洙曰渥洼水出龍馬謂王之如龍馬不可復見也霏微河漢橋洙曰烏鵲填河為橋以度牛女謂王之魂當在仙境矣趙曰言王君之䘮未能歸鄉言其所出陸馬所經之塗與夫渡橋而徃方其曠望之間霏微之眇矣天馬篇天馬徠循東道此所謂道也河漢橋如世傳織女渡河而烏鵲為橋也舊注引王之魂當在仙境非是夫人先即世令子各清標巫峽長雲雨洙曰見峽内多雲雨注秦城近斗杓洙曰斗杓斗極也鄭曰杓卑遥切柄也馮唐毛髪白歸興日蕭蕭趙曰公自嘆其留滯空老因君之䘮不即歸鄉而感傷也䕫府書懐四十韻大厯元年作補注鶴曰詩云緑林寧小㓂雲夢欲難追當是大厯元年作指崔旰之亂未已矣昔罷河西尉初興薊北師洙曰公召試集賢授河西尉不拜而安禄山反鮑明逺詩有出自薊北門不才名位晚洙曰事見詩年譜蘇曰鄭洗不才無逺見致此名位已晚誤被恩私敢恨省郎遲趙曰嚴武再為東西川節度辟公為参謀公方為尚書工部員外郎扈聖崆峒日洙曰見常思仙仗過崆峒詩注趙曰肅宗幸平凉公為左拾遺扈從乘輿矣端居灔澦時洙曰謂居䕫州也灔澦在瞿塘江中萍流仍汲引樗㪚尚恩慈洙曰萍之無根任漂流也樗㪚莊子樗櫟不才而壽者公自言蹤迹萍流仍為人汲引嚴公辟請也不才而猶䝉恩謂除京兆功曹不赴也蘇曰孔融以樗㪚不才尚頼恩慈之厚也遂阻雲臺宿洙曰一作靈臺宿直宿也趙曰公以病不得歸直也雲臺南宫臺名乃顯宗畫二十八將於南宫雲臺是也常懐湛露詩洙曰湛露天子燕諸侯詩翠華森逺矣洙曰南都賦望翠華之藏㽔趙曰翠華者天子之旗也白首䬃凄其洙曰謝靈運詩懐賢亦凄其拙被林泉滯生逢酒賦欺文園終寂寞洙曰司馬相如拜為孝文園令漢閤自磷緇洙曰揚雄自投天禄閣見但取不磷緇注病隔君臣議洙曰公以病辭召慙紆徳澤私趙曰公被召命以病不行徒荷私恩也揚鑣驚主辱洙曰漢書主辱臣死鑣馬衘也拔劔撥年衰社稷經綸地洙曰時方艱難有頼扵經綸也風雲際㑹期洙曰後漢咸能感㑹風雲血流紛在眼洙曰謂方事戰争也趙曰楊子川谷流人之血涕泗亂交頥鮑曰卞和泣玉於荆山下三日三夜淚盡繼之以血黄祖涕泗交頥仰天不能告公自喻不見用也四瀆樓船泛趙曰樓船大舟所以載兵所以運糧漢有樓船將軍中原鼓角悲洙曰人心悲憤故鼔角之聲亦悲爾賊壕連白翟洙曰左傳有長狄白狄戰瓦落丹墀洙曰後漢昆陽屋瓦皆落補注希曰梅福傳渉赤墀之塗應劭曰以丹淹泥塗殿上也先帝嚴靈寢靈一作虚趙曰指言肅宗也空虚其寢師曰言肅宗收京修寢廟也宗臣切受遺洙曰蕭何傳一代宗臣公孫𢎞傳受遺則霍光金日磾師曰言受遺詔立代宗也恒山猶突騎洙曰恒山河北補注希曰晁錯傳輕車突騎師古曰言其驍鋭可用衝突敵人也遼海競張旗洙曰遼東也田父嗟膠漆洙曰見天下朋友皆膠漆注行人避蒺䔧趙曰膠漆所以為弓誅求之多則田父以供輸為嗟也鐡蒺䔧所以禦馬所在布蒺䔧扵地而行人避之周易據扵蒺䔧揔戎存大軆洙曰揔戎元帥也時代宗為帥蘇曰王衍揔戎握符貴其持重不可輕敵使節制存其大軆降將飾卑詞楚貢何年絶洙曰左傳齊責楚曰爾貢苞茅不入王祭不供無以縮酒堯封舊俗疑蘇曰作辨孟子云堯舜之民比屋可封桀紂之民比屋可誅信如此説則堯時諸侯滿天下桀時大辟徧四海故公所以疑之長吁翻北㓂趙曰指言安史也一望卷西夷趙曰今有西夷之禍一望思欲席卷之也不必陪𤣥圃趙曰言已身以警不必在朝列也葛仙傳云崑崙一曰𤣥圃仙人所居耳超然待具茨洙曰莊子徐無鬼黄帝將見太蒐扵具茨之山至扵襄城之野七聖皆迷遇牧馬童子問塗焉在滎陽宻縣東凶兵洙曰凶一作休鑄農噐洙曰老子曰兵者凶噐講殿闢書帷洙曰東方朔傳文帝集上書囊為殿帷廟筭髙難測洙曰廟堂之籌筭也髙難測假意以譏時無善謀者天憂實在兹趙曰天子之憂毎在此耳形容真潦倒洙曰嵇康書云潦倒麄踈答效莫支持洙曰答效猶報國也使者分王命羣公各典司恐乖均賦斂不似問瘡痍洙曰䘮亂之際公私窘急所分之命所典之司必未至於均賦斂問瘡痍也瘡痍言民傷爾補注鶴曰廣徳元年考功郎中裴諝出為河東道租庸鹽鐡等使諝請入計召見便殿問諝㩁酤之利一歲出入幾何乆之不對上復問之對曰臣有所思上曰何思對曰臣自河東來其間所歴三百里見農人愁嘆穀菽未種誠謂陛下軫念先問人之疾苦而乃責臣以利孟子曰理國者仁義而已何以利為蓋是時諸侯之出咸以㩁利為先若諝之念人疾苦者鮮矣太厯元年詔云千金之費重困吾人蓋為此是年臧京兆府税萬里煩供給蘇曰張華出師萬星恐煩長安供給孤城最怨思趙曰孤城指言䕫州緑林寧小患洙曰後漢劉𤣥傳諸亡命共攻離鄉聚藏扵緑林中緑林山在今荆州當陽縣東北詠曰謂荆楚復亂也雲夢欲難追洙曰韓信傳信初之國行縣邑陳兵出入有告信欲反書聞上患之用陳平謀偽遊於雲夢者信果來朝遂擒以歸詠曰恐其難擒也即事須嘗膽洙曰越句踐既脱㑹稽之難思有以報吴出入嘗膽蒼生可察眉洙曰言時多盜賊也列子却雍能視盜察眉知之千無一遺蘇曰東方朔言蒼生憂樂見其眉事可察近世注工部詩者妄引事真可為笑議堂猶集鳯蘇曰班孟堅曰髙林論議者皆駕鳯騎鯨之士貞觀是元龜洙曰言欲求治當以貞觀為元龜也龜言有先知之靈爾處處喧飛檄洙曰左太冲詩云邉城苦鳴鏑羽檄飛京都家家急競錐洙曰江淹書競錐刀之利孝祥曰其賦歛之急如此蕭車安不定趙曰漢蕭育傳哀帝南郡多盜賊拜育為太守以育耆舊名臣乃以三公使車載育入殿中受䇿曰南郡為盜賊為害朕甚憂之以太守威信素著故委之官其民除害安元元而已舊注所引非特無義又以蕭育為望之誤矣蜀使下何之洙曰蕭望之為郡常有飛雉隨車飛翔司馬相如為郎使蜀諭巴蜀父老趙曰公之詩意乃言今日遣使在寡誅求除盗賊之事非若相如諭蜀父老也師曰言朝廷遣人安撫之猶不服畢竟將何徃言無所逃也釣瀬踈墳籍洙曰後漢嚴光披羊裘釣澤中後人名其釣處為嚴陵瀬踈墳籍言典籍所稀載也耕巖進弈碁洙曰揚子谷鄭子真不詘其志耕于巖石之下趙曰此公自叙釣瀬則以嚴子陵自比耕巖則以鄭子真自比踈墳典進奕碁乃閑曠而然地蒸餘破扇蘇曰司空達嶺南蒸濕北人乍居殊不宜風土破扇嘗不釋手冬暖更纎絺洙曰覧物詩所謂形勝有餘而風土惡此見之矣趙曰以䕫之風土多暄也豺遘哀登楚洙曰王仲宣七哀詩西京亂無象豺虎方遘患又南登㶚陵岸回首望長安趙曰乃是荆州之樓此謂登楚哀登楚者哀登楚之人也麟傷泣象尼洙曰史記魯哀公西狩獲麟孔子見之曰吾道窮矣喟然嘆曰莫我知夫公道不行扵時故悲嘆若孔子之見麟趙曰孔子之生其父母禱之扵尼丘故名丘而傳記又載孔子之首象其山故云衣冠迷適越趙曰言欲離䕫而南下且未能所以迷適越莊子曰宋人資章甫而適諸越越人㫁髪文身無所用之也藻繪憶遊睢夢符曰按陳孔璋與魏文帝書曰遊睢渙者學藻繪之綵傳云㫿渙之間出文章故其黼黻絺繡日月華虫以奉宗廟服御焉述異志曰睢渙二水波文皆若五色其人多文章故名績水又九州要記曰睢渙之間出文章天子郊廟御服出焉尚書所謂厥篚織文者也睢水在南都賞月延秋桂洙曰沈休文詩山中咸可悦賞逐四時移春光發隴首秋風生桂枝傾陽逐露葵洙曰曹子建表若葵藿之傾太陽大庭終反樸趙曰幸天下之治平反淳樸也大庭氏至徳之世也京觀且僵尸洙曰翟方進傳曰古者伐不敬取其鯨鯢築武庫封以為大戮於是乎京觀以懲滛慝補注希曰翟方進傳注師古曰京髙丘也觀謂如闕形髙枕虚眠晝哀歌欲和誰洙曰左太冲哀歌和漸離謂若傍無人南宫載勲業洙曰後漢永平中顯宗追感前世功臣乃圖畫二十八將於南宫雲臺凡百慎交綏洙曰左傳交綏而退蘇曰此两句深戒大臣及諸將欲功成圖像當以交綏為慎勿使其志之不堅而後可也師曰自釣瀬以下乃子美自述傾陽逐露葵言慕君也綏乃車綏慎交綏當以兵為可戒送李功曹之荆州充鄭侍御判官重贈大厯元年作補注鶴曰公自寶應元年後遊東川屢欲徃荆州在䕫又因詩屢及宋玉之宅此詩以李功曹之荆州故又言之是大厯元年作曽聞宋玉宅每欲到荆州洙曰韓愈為江陵法曹亦云宋玉亭邉不得見哀江南賦誅茅之宅師曰按余知古諸宫故事曰庾信因侯景之亂自建康遁歸江陵居宋玉故宅宅在城北三里故其賦云誅茅宋玉之宅穿逕臨江之府子美在䕫詠懐古跡云揺揺深知宋玉悲江山故宅空文藻又移居䕫州入宅詩云宋玉歸州宅雲通白帝城疑歸州亦有宋玉宅非止扵荆州此地生涯晩遥悲水國秋孤城一柱觀落日九江流洙曰見九江落日醒何處一柱觀頭眠幾回注使者雖光彩青楓逺自愁洙曰阮籍詩上有楓樹林逺望令人悲上卿翁請修武侯廟遺像缺落時崔卿權䕫州大厯三年作補注鶴曰公大厯元年至䕫時乃柏都督公嘗為柏作謝上表又有陪柏中丞陪宴將士二首其詩作扵冬則崔卿權州必在二年此當是二年作大賢為政即多聞趙曰言多有傳聞之善政也刺史眞符不必分尚有西郊諸葛廟卧龍無首對江濆洙曰徐庻謂先主曰諸葛孔明卧龍也孤鴈大厯元年作彦輔曰一云後飛鴈公值䘮亂覊旅南土而見於詩者嘗在於鄉井故託意於孤鴈也末章譏不知我而譊譊者補注鶴曰詩云孤鴈不飲啄飛鳴聲念羣誰云一片影相失萬里雲蓋託孤鴈以念兄弟也似是大厯元年在䕫州作梁編亦然孤鴈不飲啄飛鳴聲念羣洙曰一作聲聲飛念羣誰憐一片影相失萬重雲師曰鮑當孤鴈詩云更無聲接緒空有影相隨孤則孤矣豈若子美有不飲啄念羣之語孤之中乃有不孤之念而誰憐一片影相失萬重雲又有不盡之意乎望盡似猶見哀多如更聞野鵶無意緒鳴噪自紛紛遣愁大厯元年作補注鶴曰詩云漸惜容顔老無由弟妹來當是大厯元年在䕫州作二年弟觀至自江陵矣養拙蓬為戸茫茫何所開江通神女館洙曰見神女峯娟妙注地隔望鄉臺洙曰見日落望鄉臺注補注希曰九域志載䕫州有大仙廟即巫山神女祠望鄉臺在利州而成都亦有之故云地隔也漸惜容顔老洙曰傷時不可再也無由弟妹來洙曰以道路阻隔也兵戈與人事廻首一悲哀奉寄李十五祕書二首文嶷年大厯元作補注鶴曰詩云暫留魚復浦同過楚王臺則是公大厯元年在䕫州作按寰宇記云奉節縣北三十里有赤田城舊魚復縣基故也李時在雲安縣故寄以此詩詩云秋風早下來後公有贈別詩亦云解榻秋露懸是秋宋至白帝避暑雲安縣秋風早下來蘇曰阮瑀曰乗此秋風掛帆東下江南蓴鱸可喜暫留魚復浦洙曰巴東漢魚復縣同過楚王臺洙曰楚襄王與宋玉游雲夢之臺猿鳥千崖窄秦曰謂䕫峽之地多崖嶂而少平地也江湖萬里開竹枝歌未好畫舸莫遲回洙曰竹枝歌巴渝之遺音也惟峽人善唱趙曰竹枝歌惟䕫峽歌人之為未好則離出䕫峽聴好音也補注希曰黄魯直云竹枝歌本出三巴其流在湖湘耳行李千金贈趙曰美其行贐之多余曰左傳云行李之徃來杜預注云行李使人也衣冠八尺身飛騰知有策意度不無神班秩兼通貴趙曰唐制祕書郎從六品上謂之通貴公侯出異人趙曰左傳公侯之子孫必復其始李祕書必宗室之子矣𤣥成負文彩世業豈沉淪洙曰漢韋賢其先韋孟少子𤣥成皆以經術名家趙曰韋𤣥成少好學修父業為相七年守正持重不及父賢而文采過之即事大厯二年作洙曰一云天畔補注鶴曰詩云未聞細桞㪚金甲當是指大厯二年九月吐蕃㓂邠靈州京師戒嚴此詩當是其時作故詩又云三寸黄甘猶自青梁懐道編在元年然舊史通鑑大厯元年不云吐蕃入㓂但新史云䧟原州然原州已是廣徳元年䧟矣以此論之不是元年作甚明天畔羣山孤草亭江中風浪雨𡨕𡨕洙曰楚辭雷填填兮雨𡨕𡨕一雙白魚不受釣蘇曰魯璘隐嵩山不仕傲曠鄉有大夫不亷行惡一日見璘垂釣問曰先生今日得多少魚璘曰此池淺無巨鱗有白魚一雙長二三寸不受釣大夫者沮而歸三寸黄甘猶自青師曰甘以三寸者入貢三寸猶青以其成就其加大可知多病馬卿無日起洙曰謝靈運有疾象長卿窮途阮籍幾時醒洙曰見至今阮籍等熟醉為身謀注未聞細桞㪚金甲蘇曰周亞夫細桞營蔡文姬詩金甲耀朝日腸斷秦州流濁涇彦輔曰公有弟妹在秦州補注鶴曰公弟妹避亂在山東河南鍾離无在秦州按通鑑廣徳元年七月吐蕃入大囊闗秦州與洮渭臨等州俱䧟至是未復故有腸斷之句補注杜詩巻二十九
