body:
  text: 補注杜詩巻二十七宋黄希原本黄鶴補注去蜀新添年廣徳二作補注鶴曰詩云五載客蜀郡一年歸梓州按公乾元已亥冬至成都距廣徳二年為五載而寳應元年秋至廣徳元年秋在梓州為一年此當是廣徳二年在閬州作時嚴武未再鎮蜀所以欲下瀟湘末云安危大臣在謂吐蕃入􅪌有子儀諸公可恃也五載客蜀郡一年歸梓州如何闗塞阻轉作瀟湘遊萬事已黄髪殘生隨白鷗安危大臣在何必淚長流放船新添年永秦元作補注鶴曰詩云收帆下急水又云巳泊城樓底當是永泰元年自忠渝下雲安作收帆下急水巻幔逐回灘江市戎戎暗山雲淰淰寒荒林無徑入獨鳥恠人看已泊城樓底何曽夜色䦨哭嚴僕射歸櫬永泰元年作補注鶴曰嚴武以永泰元年四月薨公亦離成都遊嘉戎渝忠至雲安今詩云一哀三峽暮當是其年在渝忠作素幔隨流水歸舟返舊京洙曰舊京故國修可曰盧子諒詩南望舊京路老親知洙曰一作如宿昔按新史武卒母哭且曰今而後吾知免為官婢矣趙曰言嚴公之母尚健如宿昔耳舊注所引非是部曲異平生洙曰言部曲有異於存日也宋鮑昭東武吟將軍旣即世部曲亦罕存後漢光武紀注大將軍營有五部三校尉部下有曲曲有軍候一人補注希曰李廣傳廣行無部曲行陣師古曰續漢書百官志將軍領軍皆有部曲大將軍營五部部校尉一人部下有曲曲有軍候一人風送蛟龍雨洙曰見蛟龍得雲雨注師曰子美詩云蛟龍得雲雨言賢者之得勢今云風送蛟龍雨雨被風吹斷則蛟龍失勢可知天長驃騎營洙曰晉齊獻王攸迁驃騎將軍時當罷營兵士數千人戀攸恩徳不肯去一哀三峽暮遺後見君情師曰遺後者謂恩徳遺與後人使人哀思之不忘則君之情可見矣宴戎州楊使君東樓永泰元年作補注鶴曰唐志戎州本犍為郡與嘉州皆犍為地也公以永泰元年五月去成都之嘉戎此詩云輕紅擘荔枝當是其年六月作山谷在戎州有和任道食荔枝詩云六月連山柘枝紅又有廖致平送緑荔枝詩云誰能同此絶勝味唯有老杜東樓詩蓋本此詩有勝絶驚身老之句也勝絶驚身老情忘發興竒座從歌妓宻樂任主人為重碧拈洙曰一作酤春酒輕紅擘洙曰一云酌又掌荔枝洙曰曺子建七啓云春清縹酒注縹深碧色蜀都賦旁挺龍目側生荔枝蘇曰歐陽文忠公曰酤當作拈李充閩中行云擘荔枝濕輕紅酌竹葉艶深緑趙曰舊本作酤春酒非也善本作拈則元稹元日詩羞看稚子先拈酒白樂天歳假詩云歳酒先拈辭不得荔子雖有數種而膜皆帶粉紅黄魯直在戎州時王公權家荔子緑廖致平家緑荔枝詩試傾一杯重碧色快擘千顆輕紅肌補注希曰春字作筒字張君房載歴城北有使君林魏正始中鄭公慤於三伏之際率僚避暑於此取大荷葉盛酒以簮刺令與柄屈通莖輪菌如象鼻傳翕之名為碧筩歴下皆效之云酒味雜蓮氣香冷勝於它酎郡國志僰住施夷中多以荔枝為業園植萬株樹收一萬五千斛唐志戎州貢荔枝煎九域志戎州有荔枝圜此故云樓髙欲愁思横笛未休吹渝州候嚴六侍御不到先下峽永泰元年作補注鶴曰唐志渝州本漢巴郡永泰元年公去成都經嘉戎至此作聞道乗騘發立之曰漢桓典號騘馬御史指嚴侍御也沙邉待至今不知雲雨散洙曰宋王髙唐賦湫兮如風凄兮如雨風止雨霽雲無處所王粲詩風流雲散一别如雨師曰雲雨散喻别離也虚費短長吟洙曰古詩有長短吟山帶烏蠻闊洙曰嶲州西有烏白蠻江連白帝深洙曰公孫述以永安為白帝城師曰此言阻逺也船過一柱觀洙曰梁劉孝綽江津寄劉之遴詩經過一柱觀出入三休臺留洙曰一作滯眼共登臨聞髙常侍亡忠州作鮑曰髙適也本傳繼廣德元年後言召為刑部侍郎左散騎常侍補注鶴曰按舊史云適練兵於蜀臨吐蕃以牽制之師出無功而松維等州尋為蕃兵所陷以嚴武代還用為刑部侍郎轉散騎常侍永泰元年正月卒今詩云蜀使忽傳亡當是其年在成都作梁權道編在忠渝間詩内然是年公之至忠渝已是六七月不應適正月卒而今始聞歸朝不相見蜀使忽傳亡虚歴金華省洙曰班固傳王鳯薦班伯召見宴昭殿誦説有法拜為中常侍時上方嚮學鄭寛中張禹朝夕入説尚書論語於金華殿中詔伯受焉注金華殿在未央宫何殊地下郎洙曰世説顔回為地下修文郎致君丹檻折洙曰見折檻詩註哭友白雲長蘇曰山巨源哭嵇中散曰白雲央央我心悲傷揮哭望雲雲路阻長獨步詩名在洙曰適有詩名於時趙曰曹子建與楊徳祖書曰昔仲宣獨步於漢南田曰南史沈約謂王筠文章之美可謂後來獨步秪令故舊傷宴忠州使君姪宅永泰元年作補注鶴曰詩云出守吾家姪則為杜使君也忠州唐屬山南道蓋近䕫州矣永泰元年作出守吾家姪洙曰出守守土也刺史也殊方此日歡自須遊阮舍洙曰晉阮咸與叔父籍為竹林之遊居道南諸阮居道北北阮富而南阮貧也師曰既咸比姪子美自比籍乃知叔姪之相得也不是怕湖灘洙曰忠州下惡灘也樂助長歌逸洙曰作送杯饒旅思寛昔曽如意舞趙曰王戎嘗以如意起舞師曰如意者乃鐡如意石崇以鐡如意撃破珊瑚樹即此牽率强為看禹廟永㤗元年作補注鶴曰詩云禹廟空山裏秋風落日斜又云早知乘四載䟽鑿控三巴蓋䕫州本巴東郡而忠乃析巴東之臨江置又渝州有巴縣此詩當是永泰元年秋在渝忠間作禹廟空山裏秋風落日斜蘇曰楊修晩蝉噪秋風飢鴉閙斜日荒庭垂橘柚古屋畫龍蛇洙曰招䰟仰觀刻桶畫龍蛇補注希曰楚辭九歌河伯云魚鱗屋芍龍堂王逸注云河伯所居以魚鱗盖屋堂以朱畫蛟龍卿之文又天問屈原放述愁悴見楚有先王之廟及公祠堂圖畵天地山川神靈琦瑋遹休息其下俛見圖畵呵而問之雲氣生虛壁洙曰一作清虛壁江聲走白沙早知乗四載洙曰史記河渠書云夏書曰予乗四載十三年三過不入門陸行乘車水行載舟泥行蹈撬山行即橋一作輦䟽鑿洙曰一作流落控三巴洙曰郭璞江賦巴東之峽夏后䟽鑿趙曰按樂史寰宇記於渝州記云閬白二水東西流山曲如巴字是謂三巴鄭曰十道志渝州巴縣并巴東西是為三巴題忠州龍興寺所居院壁永泰元年作補注鶴曰公以永泰元年秋至忠州寓居於寺故有此作忠州三峽内洙曰蜀都賦經三峽之峥嶸注三峽巴東永安縣有髙山相對相去可二十丈左右崖甚髙人謂之峽江水過其中井邑聚雲根趙曰雲根言石也張協詩雲根臨八極小市常争米孤城早閉門空看過客淚莫覔主人恩蘇曰楚人侵鄖鄖閉門常早過客子美自稱主人指張君上篇有宴忠州張君宅補注希曰唐志忠州本臨州州有五縣而戸止六千七百則并邑聚石蕭條可知宜有争米之風主人謂使君姪而蘇注云使君是張君一字之誤容或有之而詩云出守吾家姪亦有誤乎謂之張君殊不考決非東坡之言淹泊仍愁虎深居頼獨園洙曰金剛經給孤獨園旅夜書懐永泰元年作補注鶴曰詩云名豈文章著官應老病休當是永泰元年去成都舟下渝州時作又云危檣獨夜舟細草微風岸危檣獨夜舟定功曰王仲宣詩獨夜不能寐星垂平野闊月湧大江流洙曰王仲宣詩大江流日夜名豈文章著官應老病休飄飄何所似天地洙曰一作外一沙鷗别常徵君永泰元年冬作補注鶴曰詩云兒扶猶杖策卧病一秋强又迁居䕫州郭詩云伏枕雲安縣當是永泰元年冬在雲安作故又云寒衣寛㧾長兒扶猶杖策卧病一秋强白髪少新洗寒衣寛揔長蘇曰曺子建詩廋覺衣寛長愁知酒淺淡故人憂見及革曰見及猶云訪及也此别淚相忘各逐萍流轉來書細作行十二月一日三首永泰元年作補注鶴曰公以永泰元年秋至雲安而明年春晚迁居於䕫州城今詩云今朝臘月春意動雲安縣前江可憐當是在雲安作今朝臘月春意動雲安縣前江可憐鄭曰十道志雲安在䕫州本漢朐腮縣也一聲何處送春鴈百丈誰家上瀬船蘇曰古離别曲百丈牽船上水遲鍾㑹呼挽船索為百丈今舟人皆呼之趙曰百丈者牽船篾補注希曰漢書下瀬將軍註引伍子胥有下瀬船故反用之又涖涖下瀬船師古曰瀬疾流也一本作上水未將梅蘂驚愁眼更取椒花媚逺天明光起草人所羡鄭曰長安志明光殿在東内肺病幾時朝日邉洙曰漢王商借明光殿起草作制誥也相如病肺多渇遂卧疾於茂陵趙曰晉明帝云只聞人自長安來不聞人自日邉來其後人遂以日邉為帝都寒輕市上山烟碧日滿樓前江霧黄負鹽出井此溪女補注鶴曰唐志奉節縣有永安井而九域志謂大昌縣有泉鹽井今云負鹽出井此溪女則雲安亦有之何史第云雲安有鹽官打皷發船何郡郎新亭舉目風景切茂陵著書消渇長趙曰晉王導傳洛京傾覆中州士人避亂江左每至暇日邀出新亭飲宴周顗中坐而嘆曰風景不殊舉目有江山之異皆相視流涕惟導愀然變色曰當共戮力尅復神州何至相對作楚囚泣耶衆收淚而謝茂陵著書乃相如事春花不愁不爛熳楚客唯聴棹相將即看鷰子入山扉豈有黄鶯歴翠微短短桃花臨水岸輕輕桞絮㸃人衣蘇曰張䴡華遊園有桞絮㸃衣謂後主何能㸃人衣主曰輕薄物誠卿意也趙曰十二月一日作詩而有燕子桃花之類何也此義在末句所謂他日一盃難强進者也此蓋逆道其事耳春來凖擬開懐乆老去親知見面稀他日一盃難强進重嗟筋力故山違又雪永泰元年冬作補注鶴曰題云又雪而詩又云南雪不到地峽深豺虎驕當是永泰元年冬作若曰大歴元年則史書是冬無雪豺虎指崔旰軍南雪不到地洙曰風土記云南方無雪青崖霑未消微微向日薄脉脉去人遥冬熱鴛鴦病峽深豺虎驕愁邉有江水焉得北之朝趙曰言當愁之際觀江水止是朝東安得折入北朝我乘之以歸長安而朝上乎奉漢中王手札永泰元年作補注鶴曰詩云剖符來蜀道歸蓋取荆門當是王貶蓬州刺史以路梗不得歸京今將出峽作書報公而公復以此詩詩又云主人㽞上客避暑得名園淹泊俱崖口東西異石根當是王在歸州為太守㽞度夏而公在雲安也故詩又云悲秋宋玉宅失路武陵原當是永泰元年國有乾坤大王今叔父尊洙曰王讓皇弟之子代宗之叔父也剖符來蜀道歸蓋取荆門洙曰夷陵有荆門山其狀如闕然趙曰謂之取者取道之取也峽險通舟過江長注海奔主人留上客避暑得名園趙曰主人指為郡者前後緘書報分明饌玉恩補注希曰左思吴都賦云矜其宴居則朱服玉饌古詩饌玉待鐘鳴唐駱賔王謂盛饌曰炊金饌玉天雲浮絶壁風竹在華軒趙曰言名園中如此已覺良宵永何看駭浪翻洙曰海賦驚浪雷奔駭水迸集趙曰言秋水梢定不復見駭浪入期朱邸雪洙曰唐制諸侯各置邸京師故有邸吏朱邸言邸有朱戸以冬為入期故言雪朝旁紫微垣洙曰晉志紫宫垣一曰紫微大帝之坐天子之所居也枚乘文章老洙曰西京雜記枚乗文章敏疾趙曰梁孝王時枚乗在諸文士之間年最高河間禮樂存洙曰漢景帝時河間獻王徳武帝時來朝獻雅樂對三雍宫又立博士修禮樂被服儒術悲秋宋玉宅洙曰哀江南賦誅茅宋玉之宅趙曰宋玉宅在歸州失路武陵源洙曰見如逢武陵路詩注淹薄俱崖口東西異石根夷音迷咫尺洙曰楚俗語多夷音鬼物傍洙曰一作倚黄昏洙曰蕪城賦木魅山鬼昏見晨趍犬馬誠為戀洙曰曹子建表不勝犬馬戀主之情史記丞相翟青曰不勝犬馬之心趙曰公又言其有懐君之心臣狐狸不足論洙曰張綱傳豺狼當路安問狐狸從容草奏罷宿昔奉清罇贈崔十三評事公輔補注鶴曰詩曰舅氏多人物則評事乃公之舅何以不如他詩云十三舅當有脱字詩又云且有元戎命入幕諸彦集教練羽林兒當是崔為羽林軍帥屬官梁權道編在永泰元年雲安詩内然詩云去帆隨則非雲安作飄飄西極馬洙曰漢郊祠歌云天馬來西極來自渥洼池趙曰言崔公有天馬之妙而所從來之逺也漢郊祠歌曰馬生渥洼水中颯飁定洙曰一作寒山桂師曰定山當作鄧山鄧林有桂西極馬鄧山桂比崔公之才低徊風雨枝趙曰選詩桂枝生自直不宜低徊今桂所以低徊者風雨之故也以譬崔評事之美材而困於邉徼之小官彦輔曰飁音習唐韻云颯飁大風也我聞龍正直道屈爾何為趙曰如龍之直而怪其屈在僚属且有元戎命沐曰屈道而起謂有元戎之命悲歌識者知趙曰元戎節度使也官聨辭冗長洙曰文賦固無取乎冗長鄭曰長直亮切多也師曰時王思禮為帥表請崔為幕職故云云冗長不急之務也行路洗欹危洙曰當闕公正之路脱劔主人贈趙曰主人指元戎也伍子胥觧劔贈漁父去帆春色隨隂沉鐡鳯闕洙曰陸佐公石闕銘蒼龍𤣥武之制銅爵鐡鳯之工教練羽林兒洙曰宣帝紀羽林孤兒注天有羽林星林諭若林木之盛羽有羽翼􅋧撃之意故以名武官焉百官表取從軍死事者之子養羽林官教以五兵號曰羽林孤兒補注希曰鐡鳳見大雲寺贊公房詩注武徳十二年置十三衛同州道為羽林軍埀拱元年置左右羽林軍翎羽林郎六千人乾元間左右羽林並昇同金吾四衛舊史寳應二年甲申六月以前淮西節度使安州刺史王仲昇為羽林軍大將軍知軍事仍兼御史大夫寳應二年即廣徳元年至是二年未考仲昇尚知軍事否天子朝侵早雲臺仗數移趙曰言天子多難侵早訓兵練卒故所御非一處而數移雲臺之仗矣分軍應供給百姓日支離洙曰支離言不親黠吏因封巳公才或守雌洙曰老子知其雄守其雌趙曰封厚也言貪吏乘之以封巳亷吏閔之以柔克也公正美崔公之才守雌柔之道不乘勢刻削以期於封已則其才為可尚爾燕王買駿骨洙曰燕昭王以金帛市駿骨人知好駿馬不逺千里而來渭老得熊羆洙曰見田獵舊非熊注活國名公在補注希曰文選孫楚與孫皓書曰愛民活國俗本多作治國非是南史王廣之子珍國為南譙太守髙帝手勑云愛人活國甚副吾意拜壇羣㓂疑冰壺動瑶碧洙曰鮑昭清如玉壺冰野水失蛟螭黄曰謂㓂賊將就擒也入幕諸彦集洙曰别賦捨金閨之諸彦渇賢髙選宜騫騰坐可致九萬起於斯趙曰方當渇賢而崔君宜應髙選必能騫騰如鵬飛之九萬里矣黄曰言崔奮迅自此始復進出矛㦸昭然開鼎彛洙曰銘功鼎彛㑹看之子貴歎及老夫衰豈但江曽决洙曰孟子若决江河還思霧一披洙曰衛瓘見樂廣曰若披雲霧覩青天暗塵生古鏡拂匣照西施舅氏多人物孫曰崔乃子美之舅氏其人物為世所重多重也無慙困翮垂長江二首永泰元年作補注鶴曰詩云衆水㑹涪萬瞿塘争一門朝宗人共挹盜賊爾誰尊按瞿塘在䕫州東一里而雲安在州西百三十里盗賊指崔旰則是永泰元年作是時公在雲安雲安與萬州為鄰故使君一灘占两境觀此詩朝宗人共挹萬國奉君心之句殆心乎愛君雖見水而不忘也衆水㑹涪萬洙曰涪萬峽中二郡名瞿塘争一門洙曰瞿塘為三峽之門朝宗人共挹禹貢江漢朝宗於海盜賊爾誰尊趙曰人以其朝宗所共挹取若盜賊者敢犯順為不義將欲使誰尊爾乎孤石隠如馬髙蘿垂飲猿師曰巴東有灔澦石髙二十許丈及秋至則纔如馬猿緣蘿垂而飲水歸心異波浪何事即飛飜趙曰言波浪飛飜而流去歸心飛飜不得徃所以為異浩浩終不息乃知東極臨洙曰一作深趙曰言水之必東衆流歸海意萬國奉君心色借瀟湘闊趙曰瀟湘在潭州聲驅灔澦深一作沉未辭添霧雨趙曰江海不譲衆流以為大雖霧雨之微亦可添益其流接上遇衣襟哭台州鄭司戸蘇少監廣徳二年秋作補注鶴曰蘇鄭同是廣徳二年死詳見八哀詩注考此詩有俗依綿谷異客對雪山孤瘧癘飱巴水瘡痍老蜀都蓋廣徳元年公在綿梓閬二年以嚴武鎮蜀再歸成都依之故云此詩當是廣徳二年秋作故舊誰憐我平生鄭與蘇存亡不重見䘮亂獨前途豪俊何人在文章掃地無羈遊萬里闊凶問一年俱白日中原上清秋大海隅夜臺當北斗泉路著東吴得罪台州去時危棄碩儒移官蓬閤後榖貴殁潛夫補注鶴曰廣徳二年自秋及冬米斗千錢而二公死詳見八哀蘇公詩下流慟嗟何及衘寃有是夫道消詩發興心息酒為徒許與才雖薄追隨跡未拘班揚名甚盛嵇阮逸相須㑹取君臣合寕詮品命殊賢良不必展廊廟偶然趨勝决風塵際功安造化罏補注希曰莊子以天地為大罏造化為大冶從容詢舊學慘淡閟隂符擺落嫌疑乆哀傷志力輸俗依綿谷異客對雪山孤童稚思諸子交朋列友于情乖清酒送望絶撫墳呼虐痢餐巴水瘡痍老蜀都飄零迷哭處天地日榛蕪承聞故房相公靈襯自閬州啟殯歸葬東都有作二首楷曰房琯字次律河南人永泰元年作補注鶴曰房以廣徳元年死扵閬州而權瘞于彼二年春晩公有詩别其墓今詩云孤䰟乆客間則此詩作扵永泰元年是時公在雲安故詩云逺聞又云風塵終不解蓋指其年吐蕃廻紇黨項羗軍冦邉逺聞房太守歸葬陸渾山洙曰伊落間有陸渾山昔辛有適伊川見被髪而祭者言此地當夷後為陸渾之戎所有山因而得名鄭曰十道志山在洛陽趙曰舊本作太守非善本作太尉蓋琯謫漢州刺史召拜刑部尚書道病卒贈太尉不應呼之為太守也補注鶴曰太守作太尉是此詩前公已有别房太尉墓詩不應今反稱太守若上以漢州太守死則詩又不應言安石竟崇班唐志河南府本洛州有陸渾山按舊史琯又河南人與東平吕向扵陸渾伊陽山中讀書廣徳元年八月四日卒於閬州僧舍而公有祭文乃是其年九月二十三日末云何當旅櫬得出江雲蓋當時權瘞于寺亦有墓故公又有别太尉墓詩此詩又云他日嘉陵淚仍霑楚水還嘉陵江在果州果與梓閬為鄰楚水䕫已下之江也一德興王後洙曰同徳以興王業也伊尹咸有一徳孤䰟乆客間孔明多故事洙曰蜀志陳壽上言奏故蜀丞相諸葛亮故事扶危國負阻不賔徳澤被無疆自古以來未之有倫也安石竟崇班洙曰謝安薨帝三日臨於朝堂賜東園袐器朝服贈太傅謚曰文静詔府中備凶儀及葬加殊禮依大司馬亘温故事師曰孔明多故事喻房公奏議可為朝廷典故安石竟崇班喻房公死後竟追賜褒崇之也加移縣属閬州他日嘉陵淚鄭曰嘉陵江名仍霑楚水還丹旐飛飛日洙曰丹旐銘旌也寡婦賦龍轜儼以星駕飛旐翩以啟路初傳發閬州風塵終不解趙曰時吐蕃未息也江漢忽同流師曰風塵終不解言盜賊未息而房公忽與江漢同遊故嘆惜之劔動新身匣趙曰善本作親身方有義書歸故國樓蘇曰陳惇放歸故國載書一千巻歸家起樓盡哀知有處為客恐長休雲安九日鄭十八攜酒陪諸公宴永泰元年作補注鶴曰案公永泰元年初秋至雲安故除章詩有焉能待初秋之句今詩題云雲安九日當是其年鄭十七鄭十八兄弟也故後有答鄭十七郎一絶意鄭是雲安人詩云萬國皆戎馬是年八月僕固懐恩及吐蕃回紇等入㓂寒花開已盡菊蘂獨盈枝舊摘人頻異輕香酒暫隨地偏初衣裌洙曰陶潜身逺地自偏秋興賦御裌衣山擁更登危沫曰風俗記九日登髙以􅓙災厄萬國皆戎馬酣歌淚欲垂答鄭十七郎一絶大厯元年作補注鶴曰詩云把文驚小陸即指其弟鄭十八也詩又云花殘步屐遲當是大厯元年春作公是年春晩方迁䕫雨後過畦潤花殘步屐遲蘇曰曹植花殘惜春步屐自遲把文驚小陸洙曰小陸陸雲蘇曰王融見張充文曰子文章如小陸小陸瘐而散好客見當時洙曰當時鄭莊也將曉二首永泰元年作補注鶴曰梁權道編在大厯元年雲安詩内然詩云寒沙䝉薄霧落月去清波非春月所言當是永泰元年冬作石城除撃柝鐡鎖欲開闗鼓角悲荒塞星河落曉山趙曰撃柝以言警夜静則除之補注希曰重門撃柝抱闗撃柝固不待注而古樂府木蘭女詩云朔氣傳金柝寒光照鐡衣則柝亦有金為者䕫州有石城乃地名曉一本作曙巴人常小梗洙曰謂段子璋反也蜀使動無還趙曰吐蕃未息所以蜀使輙無還垂老孤帆色飄飄犯百蠻補注鶴曰豈專指段子璋而言謂上元元年劔南東川節度兵馬使段子璋反伏誅乾元元年劔南西川兵馬使徐知道反伏誅永泰元年劔南西山兵馬使崔旰反殺成都節度使郭英乂乂曰動無還若趙云吐蕃未息蜀使無還殊不相闗飄飄一本作飄颻軍吏回官燭舟人自楚歌洙曰項籍傳聞軍中皆楚歌補注希曰髙帝紀四面皆楚歌師古曰為楚人之歌猶言吴歈越吟耳寒沙䝉薄霧落月去清波壯惜身名晩衰慙應接多歸朝日簪笏筋力定如何補注南史沈慶之詩朽老筋力盡徒步歸南國懐錦水居止二首大厯元年作補注鶴曰詩云軍旅西征僻風塵戰伐多當是大厯元年在雲安作蓋指吐蕃之亂及張獻誠柏茂林楊子林共起兵討崔旰是時蜀中大亂而人心不摇故詩又云猶聞蜀父老不廢舜謳歌軍旅西征僻風塵戰伐多趙曰永泰元年僕固懐恩誘吐蕃等㓂奉西京師大震帝召子儀屯涇陽故曰西征猶聞蜀父老洙曰猶一作獨司馬相如有難蜀父老不忘舜謳歌忘無放切洙曰孟子曰謳歌者不謳歌堯之子而謳歌舜天險終難立洙曰劔門天設之險也難立無徳不可恃趙曰易曰天險不可升也師曰子美以崔旰亂成都避亂東川然旰雖叛民心未忘唐室雖據劔門之險終難自立柴門豈重過鄭曰重再也洙曰謂思草堂未可再到朝朝巫峽水逺逗錦江波洙曰錦江水與巫峽相通萬里橋南宅百花潭北莊洙曰浣花草堂在萬里橋之南地有百花潭趙曰舊本作橋南非是蓋公詩又云萬里橋西一草堂百花潭北即滄浪層軒皆面水脩可曰宋玉招䰟髙堂䆳宇檻層軒老樹飽經霜雪嶺界天白錦城曛日黄洙曰雪嶺錦城並見上嚴中丞詩注惜哉形勝地回首一茫茫洙曰張孟陽劔閤銘曰形勝之地匪親勿居子規大厯元年作補注鶴曰詩云峽裏雲安縣又云眇眇春風見當是大厯元年作峽裏雲安縣江樓翼瓦齊两邉山木合終日子規啼洙曰子規杜䳌也眇眇春風見蕭蕭夜色凄客愁那聴此故作傍人低趙曰一本作故傍旅人低非是立春大厯元年作補注鶴曰詩云巫峽寒江那對眼又云此身未知歸定處當是大厯元年在雲安作春日春盤細生菜趙曰齊人月令曰凡立春日食生菜取迎新之意忽憶两京梅發時趙曰以紀两京當立春已有菜也盤出髙門行白玉趙曰行白玉盤也補注鶴曰汲黯傳見髙門晉灼曰三輔黄圗未央宫中有髙門殿鮑宣傳豈徒欲使臣美食大官重髙門之地哉晉灼亦曰殿名公憶為拾遺時菜傳纎手送青絲蘇曰東晉李鄂立春日命蘆菔芹芽為菜盤饋貺江淮人效之古詩云蘆菔白玉縷生菜青絲盤巫峽寒江那對眼杜陵逺客不勝悲趙曰言巫峽傍江地寒那得此菜對眼宜乎其悲也此身未知歸定處呼兒覔紙一題詩漫成一首大厯元年作補注鶴曰詩云船尾跳魚撥刺鳴當是大厯元年自雲安發船下䕫州時作江月去人只數尺趙曰梁虞騫詩目光移數尺風燈照夜欲三更沙頭宿鷺聨拳静洙曰一作起趙曰聨拳者相並相續之貎船尾跳魚撥洙曰一作跋剌鳴洙曰撥剌躍而有聲也夢符曰按張平子賦控飛狐之撥剌弓射嶓冡之封豕南楚大厯元年作補注鶴曰題云南楚又詩云正月蜂相見當是大厯元年在雲安作通典䕫州春秋魚國後属楚巫山縣乃楚置故雲安亦可言楚南楚青春異暄寒早早分無名江上草隨意嶺頭雲正月蜂相見非時鳥共聞杖藜妨躍馬洙曰蔡澤曰吾躍馬食肉四十年亦足矣不是故離羣蘇曰公自言適楚本避地而已非離羣也師曰南地與北異冬反暖春却寒故有春寒料峭之語杖藜貧賤也躍馬富貴也子美避地而作扵貧賤非故意離羣乃不得已也移居䕫州郭大厯元年作補注鶴曰公以大厯元年春晩移居䕫州城此當是其時作故詩云春知催桞别伏枕雲安縣遷居白帝城春知催桞别趙曰古有折楊桞曲多言離别也江與洙曰一作已放船清農事聞人説山光見鳥情禹功饒斷石且就土微平洙曰㳂峽皆因開鑿而成故少平土惟䕫州稍平爾船下䕫州郭宿雨濕不得上岸别王十二判官大厯元年作補注鶴曰大厯元年春晩自雲安遷居䕫州時作依沙宿舸船石瀬月姢姢洙曰謝靈運有曰谿石瀬茂林脩竹詩鮑昭翫月詩姢姢似娥眉風起春燈亂江鳴夜雨懸晨鐘雲外濕勝地石堂烟趙曰石堂䕫州佳處柔櫓輕鷗外含悽覺汝賢趙曰船櫓在輕鷗之外忽忽遂行不得如鷗之遊漾所以含情而覺鷗之勝我也入宅三首大厯二年作補注鶴曰公大厯二年移居赤甲按公赤甲詩云卜居赤甲遷居新两見巫山楚水春知此詩作扵大厯二年春故詩云春色漸多添奔峭背赤甲斷崖當白鹽洙曰謝靈運詩孤客傷逝湍徒旅苦奔峭赤甲白鹽瞿唐峽口二山趙曰赤甲本岬字按水經注南運基白帝山甚髙大其石背赤土人云如人袒脾故謂之赤岬幽白鹽髙可千餘丈人見其髙大因名之鄭曰寰宇記赤甲城公孫述所築樹木土石悉赤如人袒臂故云赤甲在縣北補注希曰十道四州記云其城大雨不可入當時人皆赤甲袒肩而築之故曰赤甲寰宇記云赤甲城是魚復縣舊基故下篇云水生魚復浦客居媿遷次洙曰次舍也遷次由移居也春色漸多添花亞欲移竹鳥窺新巻簾衰年不敢恨勝槩欲相兼亂後居難定春歸客未還水生魚復浦洙曰魚復白帝舊名鄭曰十道志䕫州古魚國漢魚復縣地雲暖麝香山定功曰後漢郡國志巴郡魚復古之庸地䕫州圗經麝香山州東南一百五十五里山有麝香故以名之補注鶴曰寰宇記云麝香山在秭歸縣東南一百一十里多麝今扵䕫州云者武徳二年前秭歸屬䕫也唐志云武徳二年析秭歸縣置歸州故後篇亦言宋玉宅半頂梳頭白過眉拄杖斑相看多使者一一問函闗洙曰時冦亂未平闗中之信未通爾宋玉歸州宅洙曰歸州有宋玉宅今亡矣雲通白帝城吾人淹老病旅食豈才名峽口風常急江流氣不平只應與兒子飄轉任浮生赤甲大厯二年作補注鶴曰詩云两見巫山楚水春知是與入宅詩同時作卜居赤甲遷居新两見巫山楚水春炙背可以獻天子趙曰列子宋國有田夫曁春東作自曝於日不知天下有綿纊狐貉顧謂其妻曰負日之暄人莫知者以獻吾君將有重賞美芹由來知野人洙曰嵇康書野人有快炙背而美芹子者欲獻之至尊雖有區區之意亦已疎矣荆州鄭薛寄書近蜀客郄岑非我鄰洙曰鄭薛郄岑皆公之故舊見於前詩注笑接郎中評事飲病從深酌道吾真師曰子美以病斷酒今郎中評事深酌勸子美道子美真性嗜此如何不飲甫亦難逆其意而云病從深酌道吾真補注鶴曰舊注云見扵前注初無鄭是江陵鄭少尹薛是石首薛明府岑是岑嘉州郄是梓州郝使君評事必崔評事公在䕫多有詩與之苐未詳郎中為何人上白帝城二首大厯元年作補注鶴曰寰宇記盛𢎞之荆州記巴東郡峽上北岸有一山孤特甚峭巴東郡據以為城注水經云白帝山北縁馬嶺接赤甲山其間平處相去八十五丈東西七十丈東傍瀼溪即以為隍後漢初公孫述據蜀自以承漢土運故曰白帝城當是大厯元年公初至䕫時作故云山歸萬古春又云兵戈猶擁蜀指崔旰之變也江城含變態一上一囘新天欲今朝雨山歸萬古春英雄餘事業洙曰白帝城公孫述所築後為劉備屯戍之地衰邁乆風塵洙曰公自言取醉他鄉客相逢故國人兵戈猶擁蜀趙曰乃大厯元年崔旰之叛戰扵梓州賦斂尚輸秦洙曰時國用不足多賦斂也補注鶴曰秦乃峙粮備吐蕃之所大厯二年吐蕃雖遣使來朝終不忘備也不是煩形勝深慙畏損神師曰秦謂闗中也時干戈用事國用不足賦斂亡藝惟以煩刑勝之民之輸賦扵闗中者非其本心也特廹扵刑政之煩苛故曰賦斂强輸秦子美慮叛亂未已秪畏奔走而耗損精神也白帝空祠廟洙曰公孫述自號白帝孤雲自徃來江山城宛轉棟宇客徘徊勇畧今何在當年亦壯哉洙曰述始為王莽導江卒正更始時起兵討宗成王岑之亂破之遂有蜀土僣立為帝號成家立十二年為光武所誅後人將酒肉洙曰凡舟人徃來皆祠之虚殿日塵埃谷鳥鳴還過林花落又開多慙病無力騎馬入青苔愁魯曰强戲為吳體大厯元年作補注鶴曰詩云十年戎馬暗南國又云巫峽泠泠非世情當是大厯元年䕫州作江草日日喚愁生巫洙曰一作春峽泠泠非世情盤渦鷺浴底心性趙曰郭璞賦盤渦谷轉獨樹花發自分明十年戎馬暗南國洙曰自安史亂後天下草草不安者十餘年異域賔客老孤城洙曰公本北人而寓南國故云異域渭水秦山得見否人今罷病虎縱横洙曰渭水泰川皆闗中風物也時方罷弊賊㓂充斥而未可歸故云得見否師曰草喚愁生言起歸心也巫峽之水泠泠不斷世情疎絶非水長流之比也盤渦乃碾碓之水鷺浴自得子美心性亦鷗鷺安閑之比也獨樹花發自分明喻子美不狥乎流俗也渭水秦山乃子美故鄉江雨有懐鄭典設大厯二年春作補注鶴曰詩云岸髙瀼滑限西東當是大厯二年春作是年公自赤甲遷瀼西春雨闇闇塞峽中早晩來自楚王宫鄭曰襄王故宫補注鶴曰寰宇記楚宫在縣西北二百步在陽䑓古城内即襄王所遊之地亂波分披巳打岸弱雲狼藉不禁風寵光蕙葉與多碧趙曰孔雀賦天雨之施惠扵蕙葉㸃注桃花舒小紅谷口子眞正憶汝見谷口但窮耕注岸髙瀼滑限西東洙曰滑一作闊䕫有澗水出扵山谷間謂之瀼居人分其左右謂之瀼東瀼西雨不絶廣徳二年作補注鶴曰詩云院裏長條風乍稀當是廣徳二年在嚴公幕中作院裏如簡院内諸公立秋日院中有作是也梁權道編在大厯元年䕫州作豈非泥行雲莫自濕仙衣之句然行雲字只是假用其字非直指巫山而言殆不考末句不得安流逆浪歸正為欲歸溪上若在䕫州作則逆浪歸何所梁亦只據舊次耳鳴雨既過漸細微映空揺颺如絲飛洙曰古詩密雨如㪚絲堦前短草泥不亂院裏長條風乍稀舞石旋應將乳子洙曰湘川記零陵有石燕雨過則飛如燕子行雲莫自濕仙衣洙曰謂髙唐神女也朝為行雲暮為行雨眼邉江舸何忽促舸嘉我切未得待作安流逆浪歸崔評事弟許相迎不到應慮老夫見泥雨怯出必愆佳期走筆戱簡大厯二年作補注鶴曰詩云浮雲不負青春約細雨何孤白帝城又云身過花間霑濕好醉扵馬上徃來輕非大厯元年初到䕫州作蓋是年春晩方遷居不應詩語如此當是大厯二年江閤要賔許馬迎午時起坐自天明浮雲不負青春色細雨何孤白帝城身過花間霑濕好醉於馬上徃來輕虚疑皓首衝泥怯實少銀鞍傍險行晝夢大厯二年作補注鶴曰梁權道編在大厯元年䕫州詩内然是年公自雲安遷居時已是春晩而今詩云二月饒睡昏昏然當是二年二月作二月饒睡昏昏然不獨夜短晝分眠桃花氣暖眼自醉蘇曰吕安行鏡湖岸上桃花爛熳謂王恂曰醺得眼醉殷紅泛眩江㧾詩曰惱殺未歸客桃花醺眼醉春渚日落夢相牽故鄉門巷荆棘底趙曰不歸之乆而生荆棘矣中原君臣豺虎邉趙曰言盜賊也王粲詩盜賊如豺狼安得務農息戰鬭普天無吏横索錢洙曰時多横賦暴歛也趙曰東乘軍須之勢又至扵暴横求索肆為可傷也熟食日示宗文宗武大厯二年作秦洙曰熟食日即寒食節也人呼寒食為熟食日言其不動烟火預辦熟食物過節也齊人呼為冷節又云禁烟補注鶴曰詩云風花白帝城當是大厯二年在䕫州作盖元年春晚方遷䕫三年正月已下峽梁權道編在元年恐非消渇游江漢羈栖尚甲兵幾年逢熟食萬里逼清明趙曰寒食日更不舉火而冷食其物故謂之寒食亦謂之熟食補注鶴曰㑹要云天寶十年二月勑禮標納火之禁語有鑽燧之文今後寒食並禁火三日以其不動烟火故先為熟食因以為名漢律厯志大梁初胃七度榖雨今曰清明中昴八度清明今日榖雨松栢卭山路風花白帝城田曰十道志曰卭山在洛陽縣北俗以寒食省墳子美先塋在卭而其身流寓於寒食不得展省故有此句鄭曰寰宇志卭州因卭來山為名水經注卭來山在漁嘉嚴道縣汝曹催我老回首淚縱横補注希曰唐制寒食文武百官有墓塋域在城外并京畿外者任往拜掃今公有隴墓在洛陽而流落逺方不得拜掃故因時感傷至於淚縱横也又示两兒大厯二年作補注鶴曰題云又示則與上篇同時作令節成吾老他時見汝心趙曰令節指寒食也浮生看物變為恨與年深長葛書難得鄭曰春秋時鄭地今縣屬許州江州涕不禁平聲團圓思弟妹蘇曰季湛中秋日登仲宣樓拊欄自語似有弔古之恨更值團圓忍不思弟妹共觀耶趙曰長葛江州必其弟妹所在行坐白頭吟趙曰卓文君作白頭吟諷相如補注杜詩巻二十七
