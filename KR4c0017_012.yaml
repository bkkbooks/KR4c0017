body:
  text: 補注杜詩卷十二宋黃希原本黃鶴補注往在大厯元年作補注鶴曰永泰元年正月下制有云勞還罪巳之念故此詩云一朝自罪已萬里車書通蓋𫐠當時之事也當是大厯元年作往在西京時胡來滿彤宫魯曰胡祿山也中宵焚九廟趙曰彤宫天子之宫也天子七廟而王莽增為九廟以其盛者言之也此篇首述明皇天寶十五載安祿山陷長安也雲漢為之紅解瓦飛十里繐帷紛曽空洙曰繐帷廟中素帷也疚心惜木主一一灰悲風洙曰㡱心心如有疾也木主神主也史記武王伐紂載木主而行補注希曰漢光武紀注神主以木為之又後志注毁廟之主藏廟外户之外四牖之中有石函曰宗祏舊史九廟神主為賊所焚至德二載十一月新成九廟神主上親告享合昏排鐵騎補注希曰魏志注曹公列鐵騎五千為十里陳清旭散錦􅐒洙曰一云幪鄭曰􅐒亡東切驢子也修可曰古樂府紫騮馬曲金鞍覆錦􅐒錦􅐒鞍帕也賊臣表逆節相賀以成功是時妃嬪戮連為糞土叢洙曰王昭君辭昔為匣中玉今為糞土英當寧陷玊座趙曰天子當寧而立謝𤣥暉銅雀臺詩玊座猶寂寞玉座帝座也時祿山及吐蕃兩陷京邑天子出奔也白間剝畫蟲定功曰何平叔景福殿賦皎皎白間離離列錢張詵注曰白間窗也以白塗之畫以錢文猶言綺疏青瑣之類師曰白間黼扆也畫蟲畫雉以飾之不知二聖處洙曰𤣥宗肅宗私泣百歲翁車駕既云還楹角歘穹崇洙曰代宗自陜還先修九廟楹角廟楹也魯丹楹刻桷趙曰此述肅宗至德二載復京師也師曰歘忽也穹崇高貌故老復涕泗祠官樹椅桐師曰守祠之官種此木將以興禮樂宏壯不如初已見帝力雄洙曰時屢臻喪亂國力凋弊雖未及未焚之前而已見帝力之雄矣前春禮郊廟祀事親聖躬趙曰此述乾元元年朝享于太廟有事于南郊也微軀沗近臣黃曰甫為拾遺諫官得以親近天子故曰近臣景從陪羣公洙曰廣德元年春享廟及郊夢符曰文選東都賦云天官景從祲威盛容補注鶴曰按舊史乾元元年夏四月辛亥九廟成備法駕迎神主入新廟甲寅上親享九廟遂有事于圓丘新史同而今云前春殆與史異是年四月癸卯朔甲寅是為十二日不應言春疑有誤王洙云廣德二年春享廟及郊而是年公在閬中無容更預陪祀登階捧玊册洙曰玊册册文也峩冕聆洙曰一作耿金鐘趙曰聆舊本作耿非也聆蓋言聆金奏也峩冕聆金鐘則奉祠者具法服也侍祠恧先露掖垣邇濯龍洙曰侍祠之官恧暴露猶假濯龍門即宗廟未至全備爾夢符曰後漢桓帝祠老子於濯龍宫趙曰得預其事者為榮其有合預侍祠而不幸先露所以慙恧矣史有先朝露以言臣之不幸也紫垣者紫掖之垣也濯龍池名也薛綜注載洛陽圖經曰濯龍池名故歌曰濯龍望如海河橋渡似雷天子惟孝孫五雲起九重洙曰韓愈賀慶雲表按沈約宋書云慶雲五色者太平之應孝經援神契曰王者德至山陵則慶雲出補注鶴曰天子指代宗自此下言宫廟遭祿山吐蕃擾踐故曰爼豆腐膻肉罘罳行角弓鏡奩換粉黛翠羽猶葱朧趙曰鏡奩乃供后廟神御之物也翠羽乃飾神御之物也出曹子建詩或拾翠羽前者厭羯胡洙曰明皇時祿山陷長安後來遭犬戎洙曰代宗時吐蕃陷長安爼豆腐洙曰一云臠羶肉罘罳行角弓蒼舒曰漢文帝紀七年夏六月未央宫東闕罘罳災崔豹古今注云罘罳屏也罘者復也罳者思也臣朝君至屏外復思所奏之事於其下顔師古注罘罳謂連闕曲閣也以覆重刻垣墉之處其形罘罳然一曰屏也又禮記云疏屏天子之廟飾也鄭注云屏謂之樹今浮思也唐蘇鶚演義稱罘罳織絲為之輕踈浮虛象羅網交文之狀蓋宫殿簷戶之間也段成式酉陽雜爼稱上林間多呼殿榱桷護雀網為罘罳余謂二說皆通以罘罳為網則結繩為之施於宫殿簷楹之間如蘇鶚之說是也以罘罳為屏則刻木為之施於城隅門闕之上如成式之言是也然就二說之中段氏之說為長補注希曰韓安國傳注師古曰以木曰弧以角曰弓安得自西極申命空山東盡驅詣闕下士庶塞關中主將曉順逆元元歸始終趙曰言令始終歸順為王之臣也一朝自罪已趙曰禹湯罪巳其興也勃焉萬里車書通余曰記中庸天下書同文車同軌後漢光武車書共遵鋒鏑供鋤犂征伐聼所從趙曰供鋤犂則以兵器為農器也征伐而聼其所從或為農或為民也冗官各復業蘇曰黃忠放冗官瑣材盡歸農業免虛耗府庫補注希曰申屠嘉傳冗官居其中師古曰冗謂散輩也如今之散官土著還力農趙曰當用兵擾攘之際有冗濫為官者各令復業土著户口前日失耕種者今還力穡以為農也君臣節儉足朝野歡呼洙曰一作娛同洙曰張景陽詩朝野多歡娛中興似國初繼體如太宗端拱納諫諍蘇曰趙襄子清穆端拱開納諫諍訐直之臣和風日冲融赤墀櫻桃枝補注希曰梅福傳涉赤墀之上應劭曰以丹淹泥塗殿上也隱映銀絲籠千春薦陵寢永永垂無窮洙曰言薦櫻桃奉宗廟無所窮極也定功曰月令仲夏之月羞以含桃先薦寢廟注櫻桃也漢惠帝出離宫叔孫通曰古者春秋嘗果方今櫻桃可獻願陛下出因取櫻桃獻宗廟京都不再火涇渭開愁容歸號故松柏老去若飄蓬歐曰使京都奠枕涇渭之民頓豁愁容得以歸號墳墓惟甫衰老若飄蓬然不獲還故鄉故自傷也雷大厯元年作補注鶴曰舊史永泰二年春旱至六月庚子始雨是年改大厯元年自雲安遷居夔州兹云南方瘴癘地又云峽中喧擊鼓當是大厯元年夔州作永泰元年春旱至四月乃雨而公是年秋方寓雲安此當是大厯元年作無疑大旱山嶽焦修可曰莊子大旱金石流土山焦密雲復無雨洙曰小畜卦密雲不雨南方瘴癘地罹此農事苦封內必舞雩峽中喧擊鼓洙曰周禮司巫若國大旱則率巫而舞雩神農求雨書曰祈而不雨則曝巫曝巫不雨則積薪擊鼓而焚神仙真龍竟寂寞土梗空俯僂洙曰土梗土龍也葉公好龍而真龍入室吁嗟公私病稅斂缺不補蘇曰何儔曰今兵革不止稅賦尚缺科斂非一家貧無物補助故老仰面啼瘡痍向誰數趙曰季布傳瘡痍未瘳暴尫或前聞鞭巫非稽古修可曰禮記穆公召縣子而問焉曰天久不雨吾欲暴尫而奚若曰天則不雨而暴人疾子虐母乃不可歟或以為尫非巫也瘠病之人其靣上向俗謂天哀其病恐雨入其鼻故為之旱故僖公欲焚之請先偃甲兵蘇曰武王問太公請先偃甲兵乃創天下長久之基也武王喜之處分聼人主萬邦但各業一物休盡取水旱其數然堯湯免親覩洙曰堯九年之水湯七年之旱其數然也上天鑠金石蘇曰武帝時夏旱張惠歎曰歊陽如是金石銷鑠何况苖稼耶請陛下修政以告上天武帝遂减膳果獲甘澍羣盜亂豺虎洙曰招魂曰十日並出流金鑠石七哀詩盜賊如豺虎二者存一端愆陽不猶愈趙曰以盜賊與旱為二也就二者之中言雖愆陽而旱不猶勝於盜賊乎補注希曰永泰大厯年崔旰首亂兩川為之騷動又連遭旱然旱猶愈於盜賊謂盜賊之禍尤慘也昨宵殷其雷殷於隱切風過齊萬弩復吹霾翳散虛覺神靈聚氣暍腸胃融汗濕衣裳汚洙曰一作腐吾衰尤拙計失望築場圃洙曰九月築場圃注春夏為圃秋冬為場火大厯元年作洙曰楚俗大旱則焚山擊鼓有合神農書補注鶴曰詩首云楚山經月火大旱則斯舉當是大厯元年在夔州作楚山經月火大旱則斯舉趙曰此燒山以求雨之詩舊俗燒蛟龍驚惶致雷雨爆嵌魑魅泣爆皮教反崩凍嵐隂昈鄭曰昈侯古切日光也又文彩趙曰言氷雪下墮其文彩明昈於嵐隂之間羅落沸百泓鄭曰烏宏切水深也根源皆萬古青林一灰燼雲氣無處所趙曰言青林既灰燼矣雲氣無所止泊也出宋玉高唐賦風止雨霽雲無處所入夜珠赫然新秋照牛女補注鶴曰永泰二年關中大旱自三月不雨至於六月今夔州以旱而舉火燒山詩乃云入夜珠赫然新秋照牛女殆是山南七月猶未雨也風吹巨熖作河棹騰煙柱勢欲焚崑崙光彌焮洲渚鄭曰焮香靳切炙也趙曰左傳火所焮燎腥至焦長蛇聲吼洙曰一云吼爭纒猛虎神物已高飛趙曰指言神龍也不見石與土爾寧要謗讟徒谷切慿此近熒侮薄關長吏憂甚昧至精主遠遷誰撲滅洙曰書若火之燎于原不可嚮邇其猶可撲滅將恐及環琽流汗卧江亭更深氣如縷七月三日亭午巳後較熱退晚加小凉穩睡有詩因論壯年樂事戲呈元二十一曹長大厯元年作補注鶴曰按史永泰二年三月不雨至六月方雨而今詩云閉目踰十旬大江不止渴退藏恨雨師健步聞旱魃當是其年作是年改大厯元年公初至䕫州故詩又云衰年旅炎方今兹商用事蘇曰應瑀秋日燕山隂序云商飈用事金帝持衡餘熱亦已末覺範曰末無也衰年旅炎方洙曰炎方南方趙曰公時在䕫為楚地故云旅炎方生意從此活亭午减汗流修可曰梁元帝纂要云在午曰亭午北鄰耐人聒晚來爽烏匼芻曰烏匼不舒貌風爽人烏匼之懷筋力蘇摧折夢符曰右按子美曰馬頭金匼匝所謂烏匼即烏巾也閉目踰十旬大江不止渴退藏恨雨師健步聞旱魃洙曰雨師行雨神也神異經曰南方有人長二三尺走行如風名曰旱魃所見之國大旱也補注希曰河東賦呵雨師於西東又大人賦召屛翳誅風伯刑雨師園蔬抱金玊無以供採掇趙曰言其貴而難得如金玊也密雲雖聚散徂暑終衰歇前聖眘焚巫眘古慎字洙曰魯僖公欲焚巫而臧文仲止之武王親救暍洙曰武王見暍人王自左擁而右扇之見世說隂陽相主客時序遞回斡洙曰隂陽相推而用事則四時斡流而為寒暑灑落唯清秋昏霾一空闊蕭蕭紫塞雁南向欲行列趙曰言清秋則昏霾一掃空矣塞雁是時有南向之行列不必以熱為念也歘思紅顔日霜露凍階闥胡馬挾雕弓鳴弦不虛發洙曰弦不虛發中必决眥趙曰此思少年乘寒射獵之事而感歎年老也長鈚逐狡兔突羽當滿月趙曰鈚音批韻書云箭也突羽又言所用箭其羽奔突而疾故曰突羽當滿月言挽弓如滿月當其挽滿之間也補注鶴曰子虛賦左烏號之雕弓又滿白羽文頴曰引弓盡箭鏑兹云滿月亦言引之使滿如月薛注既非師注亦失月下豈發矢之時突如突騎之突謂衝突也惆悵白頭吟洙曰古樂府有此吟疾人相知以新間舊不能至白首也趙曰蓋本卓文君以相如置妾之故以其不能至於白首而為此吟故公借用耳詠曰此句傷衰老也蕭條游俠窟定功曰郭景純遊仙詩京華游俠窟舊注引前漢游俠傳即非窟字出處矣臨軒望山閣縹眇安可越高人鍊丹砂天覺曰高人指元曹長也未念將朽骨少壯跡頗踈洙曰踈縱誕也歡樂曽倐忽杖藜風塵際老醜難翦拂蘇曰北史盧思道翦拂吹噓長其光賈趙曰劉孝標絶交論言翦拂使其長鳴吾子得神仙本是池中物洙曰周瑜蛟龍得雲雨非復池中物也賤夫美一睡煩促嬰詞筆洙曰張華煩促每有餘趙曰言我非若子之得神仙俱美一睡而已牽牛織女大厯元年作補注鶴曰荆楚歲時記七月乞巧䕫楚地無忘舊俗此詩當是公至夔之初年因所見而賦之梁權道亦編在大厯元年然詩云世人亦為爾祈請走兒童稱家隨豐儉白屋逹公宫則不獨楚俗然也牽牛出河西織女處其東蘇曰焦林天斗記云天河之西有星煌煌與參俱出謂之牽牛天河之東有星微微在氐之下謂之織女萬古永相望鄭曰望武方切七夕誰見同神光意洙曰一作竟難候此事終䝉朧颯然精靈合蘇曰東海記神龍交即風濤颯然精靈符合水為之渾何必秋遂通洙曰周處風土記七月七日其夜灑掃於庭露施几筵設酒脯時果散香粉於河鼓織女言此二星神當㑹少年感懷私願見天漢中有奕奕正白氣有光曜五色以此為徵見者便拜而乞願亭亭新粧立龍駕具曽空修可曰南齊謝朓七夕賦云回龍駕之容裔言織女之渡河也補注希曰天有九重故曰曽空謝靈運詩躡足循廣除瞬目矖曽穹是也世人亦為爾祈請走兒童稱家隨豐儉補注希曰禮記檀弓稱家之有無白屋逹公宫趙曰白屋貧人之屋如周公下白屋之士公宫公侯之家也出左傳有守於公宫鄭曰白屋草舍也以白茅茨覆故云膳夫翊堂殿鳴玊凄房櫳盧紅切曝衣遍天下洙曰竹林七賢傳舊俗以七月七日曝衣時南阮富所曝皆錦繡北阮貧乃立長竿標大布犢鼻於庭中曰未能免俗北阮阮咸也曳月揚微風蛛絲小人態曲綴洙曰一作掇瓜果中洙曰荆楚嵗時記七夕婦人結綵樓穿七孔針於中庭以乞巧有蟢子網於瓜上則以為得巧初筵瀼重露鄭曰瀼乙業切潤也日出甘所終嗟汝未嫁女秉心鬱忡忡防身動如律竭力機杼中洙曰姚萇婦女精力竭於機杼尚不能支持西北之費倉庫日耗减矣雖無舅姑事敢昧織作功明明君臣契咫尺或未容義無棄禮法恩始夫婦恭小大有佳期戒之在至公趙曰公以君臣比夫婦之義也君臣相契於咫尺之間臣茍有虧君或不容之矣為婦者可不慎乎蓋因織女每歲有期為不可亂則為人女為人婦者當慎守至公之戒也方圓茍齟齬鄭曰上壯所切下偶許切不相值也丈夫多英雄洙曰一云勿替丈夫雄夢符曰楚詞九辨圓鑿而方枘兮吾固知其齟齬而難入師曰詳味此詩託意牛女東西間隔必無私合之期孟子云丈夫生而願為之有室女子生而願為之有家父母之心人皆有之不待父母之命煤灼之言鑽穴隙相窺踰墻相從則父母國人皆賤之臣之事君茍不以其道而進何異於踰墻相從乎詩二之日鑿氷沖冲又士如歸妻逮氷未泮桃華於仲春以記昏姻之時未嫁之女秉心於鑿氷冲冲之月以禮防間如法律然竭力機杼無故不出外閫豈有私相㑹合耶譬如君臣相去咫尺非其義則不相從契合必以道也况夫婦之間其可弃禮法為私㑹哉始或不恭終則乖睽故云恩始夫婦恭然小大各有期㑹要在至公無私邪也丈夫英雄之氣茍非君臣道合殆若方鑿圓枘了不相入况牛女之東西乎毒熱寄簡崔評事十六弟大厯元年作補注鶴曰詩云大暑運金氣荆揚不知秋林下有塌翼水中無行舟千室但掃地閉關人事休當是大厯元年作是年春旱至六月始雨觀詩所云則夔七月猶未雨也大暑洙曰一作火運金氣洙曰五行相生以成四時夏火也秋金也金當代火而畏火故金氣伏而火盛所以熱也趙曰大暑當作大火詩曰七月流火月令孟秋之月盛德在金大火流而運金氣所以為八月矣荆揚不知秋補注希曰荆揚一本作荆州唐志夔州屬山南道古荆梁二州之域時已七月而尚不知有秋意蓋以旱甚故也漢五行志金氣病而木沴之林下有塌翼洙曰陳孔璋檄垂頭塌翼莫所憑恃蘇曰王子淵丈夫茍失志如鵰鶚損羽翮豈塌翼垂頭於林下乎趙曰鳥以熱而難飛也水中無行舟修可曰書云罔水行舟千室但掃地蘇曰李篆曰赤眉盜過千室掃地俱盡也閉關人事休老夫轉不樂旅次兼百憂蝮蛇暮偃蹇蘇曰宋純嶺南行云蝮蛇偃蹇於道周客子悲辛而躑躅空牀難暗投炎宵惡明燭况乃懷舊丘修可曰鮑照結客少年場云去鄉三十載復得還舊丘蘇曰戴深曰秋風已動歸思况更懷舊隱林丘如此一灑令人心折開襟仰內弟執熱露白頭補注鶴曰舅之子與內兄弟陸厥韓卿有答內兄顔盻希叔詩是也束帶負芒刺蘇曰葛殷昨日束帶見人卑折恭揖如負芒刺吾欲裂巾毁冠偃仰林下接居成阻修何當清霜飛㑹子臨江樓載聞大易義諷興詩家流藴藉異時輩檢身非茍求夢符曰右按前漢孔稚圭等傳論咸以儒宗居宰相位服儒衣冠傳先王語其醖藉可也又唐權德輿醖藉風流自然可慕皇皇使臣體信是德業優趙曰指崔評事必為使也補注鶴曰皇皇者華毛氏曰皇皇猶煌煌也楚材擇杞梓夢符曰右按春秋左傳楚令尹子木問聲子曰晉大夫與楚孰賢對曰晉卿不如楚其大夫則賢皆卿材也如杞梓皮革自楚往也唯楚有材晉實用之漢苑歸驊騮短章逹我心理為洙曰一云待識者籌洙曰孔融附此短章聊伸我心素趙曰驊騮所以美崔言漢苑則漢有大宛之馬蓋指崔評事也壯遊大厯元年作魯曰按新史本傳言公少貧不自振客齊趙吳越間李雍竒其才先往見之師曰此篇叙壯年經遊之迹補注鶴曰詩云鬱鬱客殊方當是在夔州公在夔詩多言殊方又云羣凶當是指崔旰輩此詩作於大厯元年往者又云往昔十四五出遊翰墨場洙曰阮籍昔年十四五志尚好書詩趙曰謝宣逺賦張子房詩粲粲翰墨場補注希曰西京賦視往者之遺館斯文崔魏徒洙曰崔鄭州尚魏豫州啓心以我似班楊洙曰班固揚雄七齡思即壯開口詠鳯凰蘇曰張華五歲能詩見畫鳯凰觀久之客命詠之隨口即成人皆歎服九齡書大字有作成一囊性豪業嗜酒嫉惡懷剛腸修可曰嵇叔夜與山巨源書剛腸嫉惡輕肆直言遇事便發脫略小時輩結交皆老蒼飲酣視八極俗物都茫茫洙曰孔文舉薦禰衡表嫉惡若讐恨賦脫略公卿跌宕文史東下姑蘇臺洙曰史吳世家越伐吳敗之姑蘇越絶書曰闔廬起姑蘇臺三年聚材五年乃成高見三百里已具浮海航到今有遺恨不得窮扶桑洙曰山海經大荒之中暘谷上有扶桑陸機詩前緩聲歌總轡扶桑枝補注鶴曰楚辭少司命照吾檻兮扶桑注云東方有扶桑之木其高萬仞日下浴於暘谷拂其扶桑爰始而登照耀四方日以扶桑為梯檻王謝風流遠洙曰王戎謝安闔廬丘墓荒洙曰吳越春秋曰吳王闔廬死葬於園西北名曰虎丘葬之三日白虎踞其上故號虎丘補注希曰闔廬冡在閶門外劒池石壁仄長洲芰荷香洙曰枚乘遺吳王書修治上林不如長洲之苑孟康曰以江水洲為苑也韋昭曰長洲在東吳吳都賦帶朝夕之濬池佩長洲之茂苑鄭曰寰宇記云蘇州長洲縣吳長洲苑也補注鶴曰按九域志蘇州有干將墓在閶門外子虛賦注張揖曰干將韓王劒師也賈誼傳注應劭曰莫邪吳大夫也作寶劒因以為名莫邪為吳大夫而干將墓又在吳宜有劒池在其郡爾雅釋菱云菱今之水中芰字林云楚人名菱曰芰可食國語屈到嗜芰是也又釋荷郭云今河東人呼荷花為芙蓉北方人便以藕為荷亦有蓮為荷也嵯峨閶門北洙曰陸士衡吳趨行吳趨自有始請從閶門起閶門何峩峩飛閣跨通波清廟映回塘洙曰文王之廟也修可曰清廟非文王之廟乃吳文帝孫和廟也和子皓改葬和號明陵又分吳郡丹陽為吳興郡置太守四時奉祠立寢堂號曰清廟補注鶴曰按吳志寶鼎元年十月永安山賊施但聚數千人劫皓庶弟永安侯謙出烏程取孫和陵上鼓吹曲蓋其置吳興所以藩衛明陵亦在其年則明陵在烏程縣故九域志湖州亦云有吳文帝廟有碑今詩乃云廟在閶門之北豈公之所指者乃和故宅以為廟每趨吳泰伯撫事淚浪浪枕戈憶勾踐渡浙想秦皇洙曰皇覽曰泰伯冡在吳縣北海里聚去城十里越王勾踐既逃㑹稽之恥反國苦身焦思出則嘗膽卧則枕戈秦始皇過丹陽至錢塘臨浙江水波惡乃從峽中渡上㑹稽祭大禹望於南海而立石刻紀秦德補注鶴曰九域志蘇州有吳泰伯廟又有勾踐廟而㑹稽亦有勾踐廟又有秦皇山乃秦始皇刻石之所吳喜志林云錢塘江口有浙山因以為名今詳詩殆是公自姑蘇過㑹稽也蒸魚聞匕首洙曰史刺客傳吳公子光之欲殺王僚也得專諸善待之後具酒請王僚使專諸置匕首魚腹中而進之以刺王僚僚已死光自立為王是為闔廬除道哂要章洙曰朱買臣吳人也常從㑹稽守邸者寄居飲食及拜為太守買臣衣故衣懷其印綬步歸郡邸值上計時㑹稽吏方相與羣飲不視買臣入室中守邸與共食食且飽少見其綬守邸輕之前引其綬視其印㑹稽太守章也守邸驚買臣遂乘傳去㑹稽聞太守且至發民除道入吳界見故妻夫妻治道買臣令後車載到太守舍給食之越女天下白蘇曰風俗記梁援曰天下之女白不如越溪之女肌晢鑑湖五月凉定功曰梁任昉述異記軒轅氏鑄鏡湖邊因得名今有軒轅磨鏡石尚存石畔常潔不生蔓草蘇曰郤詵曰憶前年五月泛鑑湖凉風吹面殊不識炎熱剡溪藴秀異鄭曰剡縣名時冉切欲罷不能忘歸帆拂天姥洙曰謝靈運登臨海嶠詩暝投剡中宿明登天姥岑田曰吳越郡國志天姥山與括蒼山相連師曰自東下姑蘇臺至此謂遊吳越之地補注鶴曰刀案道經云兩火一可以逃言剡中多名山可以避災也故漢晉以來多隱逸之士沃州天姥是其處又白居易沃州山記云東南山水越為首剡為面沃州天姥為眉目中歲貢舊鄉洙曰按新史本傳甫少貧不自振客遊吳越齊趙間舉進士不第氣劘屈賈壘劘莫婆切洙曰賈山傳贊賈山自下劘上屈原賈誼壘喻戰壘也目短曹劉墻洙曰目一作日曹子建劉公幹文章也忤下考功第洙曰武德舊令考功員外郎監試貢舉人貞觀以來乃員外郎專掌貢舉至開元中復貢舉於禮部獨辭京尹堂放蕩齊趙間裘馬頗清狂春歌叢臺上洙曰叢臺趙王之臺也在邯鄲冬獵青邱旁洙曰青邱地名鄭曰青邱千乘縣齊景公有馬千駟畋於青邱補注鶴曰博物志營與青同海東有青邱齊有營邱太康地記云東方少陽其色青其氣清歲之首事之始故以青為名高后紀趙王宫叢臺災師古曰連聚非一故名叢臺蓋本六國時趙王故臺呼鷹皂洙曰一作紫櫪林逐獸雲雪岡射飛曽縱鞚洙曰鮑昭詩幽并重騎射飛鞚越平陸引臂落鶖鶬洙曰引一云跋蘇侯據鞍喜洙曰蘇謂胄曹蘇預忽如携葛彊洙曰山簡舉鞭問葛彊何如并州兒師曰自放蕩齊趙間至此句謂遊齊趙之地快意八九年西歸到咸陽師曰按史甫客遊吳越還自舊鄉以進士舉不中第遂遊齊趙間凡八九年復歸京師許與必詞伯賞洙曰一作貴遊實賢王曳裾置醴地洙曰楚元王敬申生置醴以代酒奏賦入明光洙曰𤣥宗朝饗而甫獻大禮三賦補注希曰明光漢宫名太初四年起明光殿師古曰三輔黃圖在城中近桂宫元后傳成都侯商病欲避暑從上借明光宫師古曰明光宫在城內近桂宫天子廢食召蘇曰嚴光見光武廢食召見羣公㑹軒裳脫身無所愛洙曰帝竒其材使待詔集賢命宰相試文章擢西河尉不拜痛飲信行藏黑貂不免弊洙曰蘇季子不用於秦而黑貂裘弊斑鬢兀稱觴洙曰秋興賦班鬢彪以承辨間居賦稱萬壽以獻觴唐曰兀兀坐也杜曲晚耆舊洙曰晚一作換四郊多白楊洙曰言死者衆也何曰白楊乃墳上之草也坐深鄉黨敬何曰今復推甫為長老故云云日覺死生忙朱門任傾奪劉曰朱門權貴也傾奪爭權也赤族迭罹殃洙曰揚子解嘲客徒欲朱丹其轂不知一跌赤吾之族國馬竭粟豆蘇曰伍子胥曰國無粟攴凶年馬無豆秣越兵將至誰復勍敵官雞輸稻粱洙曰時五坊有供奉鬪雞又有鬬雞使蘇曰漢靈帝養雞數千民輸雞食舉隅見煩費洙曰舉一隅則衆費可知矣引古惜興亡洙曰言引古而辨今則足以知其興亡而可痛惜也河朔風塵起洙曰祿山起於河朔蘇曰此言河朔風塵傾洞玁狁跳梁岷山行幸長洙曰𤣥宗幸蜀兩宫各警蹕補注希曰文三王傳出稱警入稱蹕師古曰警者戒肅之䟆止行人也言出入者互文耳出亦有䟆漢儀注皇帝輦動左右侍帷幄者稱警出殿則傳䟆止人清道也兩宫謂明皇肅宗俱在外萬里遙相望洙曰肅宗即位於靈武崆峒殺氣黑少海旌旗黃禹功亦命子涿鹿親戎行洙曰以廣平王為天下兵馬元帥王肅宗之子代宗也修可曰東宫故事天子比大海太子為少海淮南子云九州之外乃有八寅東方曰少海崆峒在西少海在東河朔風塵起岷山行幸長則東西南北皆不寧也禹功亦命子啓戰於甘之野正指太子為元帥黃帝與蚩尤戰於涿鹿指肅宗親征翠華擁吳嶽洙曰翠華天子羽葆也螭虎噉豺狼噉音淡蘇曰邵平曰秦鹿既走螭蛟狼虎遞相食噉補注鶴曰隴州吳山縣有西鎮吳山祠漢書地理志吳嶽在汧縣而隴州為汧陽郡又有汧源汧陽縣詳見青陽峽詩言肅宗即位於靈武而靈與隴俱屬關內道故云螭與虎在豺狼視之為尊而今反為豺狼所噉喻祿山殺戮士夫及主將也爪牙一不中胡兵更陸梁洙曰房琯敗於陳濤賊既得志愈陸梁矣補注希曰甘泉賦飛䝉茸而走陸梁晉灼曰走者陸梁而跳也大軍載草草韓曰草草辛苦貌凋瘵滿膏肓夢符曰左傳秦使醫緩視晉侯疾曰疾在肓之上膏之下攻之不達針之不及藥不至焉不可為也韓曰謂民困疲之甚備員竊補衮洙曰譏時相也憂憤心飛揚上感九廟焚洙曰天子九廟下憫萬民瘡蘇曰漢景帝一日不悅羣臣請問其故帝曰兵戈之後朕憫萬民瘡痍未合不覺形於顔色羣臣皆惻然斯時伏青蒲洙曰史丹傳元帝欲易太子丹聞上獨寢直入卧內伏青蒲上泣諫應邵曰以青規地曰青蒲非皇后不得至此補注鶴曰史丹傳注服䖍曰以青緣蒲席也孟康曰以蒲青為席用蔽地也而王洙所注獨引應邵之說故兼存之廷諍守御牀洙曰王陵面折廷諍衛瓘託醉跪帝牀前以手撫牀曰此座可惜君辱敢愛死洙曰主憂臣辱主辱臣死檀弓申生不敢愛其死赫怒幸無傷洙曰詩王赫斯怒聖哲體仁恕師曰自此句以下復叙肅宗收復京師宇縣復小康哭廟灰燼中鼻酸朝未央洙曰時天子收復京師先素服哭廟而後受朝補注鶴曰舊史肅宗紀云九廟為賊所焚上素服哭於廟三日入居大明宫小臣議論絶蘇曰崔宏曰陛下一言及四方蔽小臣訩訩之議論老病客殊方鬱鬱苦不展蘇曰東方朔鬱鬱不得展舒志氣羽翮困低昂秋風動哀壑碧蕙捐微芳洙曰陸士衡塘上行江蘺生幽渚微芳不足宣淑氣與時殞餘芳隨風捐之推避賞從去聲洙曰介之推從晉亡賞不及亦不言後避賞入山漁父濯滄浪洙曰漁父歌曰滄浪之水清可以濯吾纓榮華敵勳業歲暮有嚴霜吾觀鴟夷子才格出尋常蘇曰鄭康成才格逈出尋常輩趙曰言榮華與勳業相敵不可妄求也然歲聿暮而嚴霜降則傷其遲暮無復勵勳業以取榮華矣所慕者若范蠡泛舟浮海變姓名號鴟夷子其高舉遠引乃出尋常之才格也羣凶逆未定側佇英俊翔阻雨不得歸瀼西甘林大厯元年作補注鶴曰詩云三伏適已過驕陽化為霖欲作歸瀼西宅阻此江浦深當是大厯元年按其年夏旱七月洛水溢河南諸州亦水他州史不書往往亦然特不為害故不書夔於是時江浦宜深矣公雖大厯二年方自赤甲遷瀼西而此詩又云客居暫封植以客居詩互考之乃是公初至䕫時嘗暫居故曰客居三伏適已過洙曰隂陽書曰夏至後第三庚為初伏第四庚為中伏立秋後初庚為末伏王彪之井賦三伏焦暑亢陽重授詠曰以金伏畏火故熱補注鶴曰漢郊祀志作伏祠孟康曰六月伏也師古曰伏者謂隂氣將起迫於殘陽而未得升故為藏伏因名伏日也立秋之後以金代火金畏於火故至庚日必伏庚金也驕陽化為霖欲歸瀼西宅阻此江浦深壞舟百板坼師曰自此句以下叙阻雨舟破恐泥不可濟故思歸也峻岸復萬尋篙工初一棄恐泥勞寸心佇立東城隅悵望高飛禽趙曰此言望瀼西而阻於渡涉恨無羽翼以飛去也草堂亂𤣥圃不隔崑崙岑昏渾衣裳外曠絶同層隂園甘長成時三寸如黃金諸侯舊上計厥貢傾千林洙曰禹貢淮海惟揚州厥包橘柚鍚貢蜀都賦户有橘柚之園漢武紀計偕注計者上計簿也補注鶴曰按唐志夔州貢柑橘諸侯謂夔守也邦人不足重所迫豪吏侵客居暫封植日夜偶瑶琴趙曰甘可用入貢以奉至尊非不貴也而邦人反不足為重者無他苦於豪吏之侵奪故耳邦人既不重之惟客居尚可封植也虛徐五株態側塞煩胸襟焉得輟兩足杖藜出嶇􅋂洙曰謝靈運云舉目晀嶇􅋂條流數翠實偃息歸碧潯拂拭烏皮几趙曰謝眺詠烏皮隱几詩曰蟠木生附枝刻削豈無施喜聞樵牧音蘇曰郤詵數日山行喜聞樵語牧唱洗盡五年塵土腸胃欣然倚驂臨水久之而去矣令兒快搔背蘇曰袁安卧負暄頽簷頗覺和暢四肢舒展令兒搔背甚快人意脫我頭上簪洙曰見憑久烏皮綻注雨三首大厯元年作趙曰此篇主用巫山之雨為意補注鶴曰前一首用巫山之雨為意其在夔州作無疑而第二首趙次公云以挂帆言之則為京南以白露言之則是大厯三年之秋今以殊俗狀巢居之言疑止可用于夔州况第三首云連檣荆州船有士荷戈㦸南防草鎮慘霑濕赴逺役豈非有如趙卿飛百艘而至者若在江陵作不應詩又云空山中宵隂當是大厯元年在夔州作然三篇非一時作後人以其同在夔作故總題曰三首峽雲行清曉煙霧相徘徊風吹蒼江樹雨灑石壁來凄凄生餘寒殷殷兼出雷白谷變氣候朱炎安在哉高鳥濕不下居人門未開楚宮久已滅幽珮為誰哀趙曰神女賦於是搖珮飾鳴玉鸞侍臣書王夢賦有冠古才冠古亂切冥冥翠龍駕多自巫山臺洙曰楚襄王夢與神女遇宋玉作高唐賦曰旦為朝雲暮為行雨朝朝暮暮陽臺之下楚詞雷填填兮雨冥冥趙曰謝朓七夕賦回龍駕之容裔青山淡無姿白露誰能數趙曰暗用佛書雨露皆有頭數之義片片水上雲蕭蕭沙中雨殊俗狀巢居曾臺俯風渚洙曰楚地靣水背山俗多架木為居以就地勢佳客適萬里蘇曰此言惟佳客感秋風適萬里夫復何日重把此一巵臨行我心傷悲沉思情延佇挂帆逺色外驚浪滿吳楚趙曰此實道其事而别無託興舊注以驚浪比永王誤矣以永王璘之叛自是至德二載此詩以挂帆言之則為荆南矣以白露言之則時乃大厯三年之秋不亦相逺乎久隂蛟螭出洙曰言世久晦而賊民者出也寇盜洙曰一云冠蓋復幾許蘇曰劉後主曰冠蓋復有幾人趙曰古詩相去復幾許空山中宵隂微冷先枕席回風起清曉萬象萋已碧洙曰古詩回風動地起落落出岫雲渾渾倚天石日假何道行洙曰天文志日有行黃道有行赤道者時久雨隂晦不知日之所行何道雨含長江白連檣荆州船洙曰江賦舳艫相屬萬里連檣有士荷戈㦸南防草鎮慘霑濕赴逺役羣盜下辟山總戎備强敵水深雲光廓鳴櫓各有適趙曰公有羡慕之辭漁艇息一云自悠悠夷歌負樵客趙曰思其上逺適之興不可則又思其次也漁人之舟自如樵客之放夷歌蓋亦足樂矣留滯一老翁書時記朝夕洙曰甫既無所施於世所書者時而已趙曰留滯于此為可傷也姑書時節記朝夕而已又上後園山腳大厯二年秋作補注鶴曰前有上後園山腳詩為大厯二年夏作則此詩乃其年秋作故詩云秋風亦已起昔我逰山東憶戲東嶽陽補注鶴曰唐志開元二十一年分山南為東西以壯遊詩考之公遊齊趙在忤下考功第之後舊史開元二十四年始以禮部侍郎掌貢舉則公下第蓋在開元二十四年之前而逰山東二十四五年間東嶽即齊地嶽在兖州也窮秋立日觀矯首望八一云北荒洙曰顔延年曰日觀臨東溟朱崖著毫髮洙曰朱崖海南州也逺望若毫髮然碧海吹衣裳洙曰碧海海也蓐收困用事𤣥冥蔚强梁洙曰蓐收秋神也𤣥冥冬神也言四時相代而用事則休者困而王者强梁矣逝水自朝宗鎮名各其方洙曰言逝者無所止而止者不易其所也平原獨憔悴農力廢耕桑非關一云北關風露凋曾是戍役傷洙曰民之貧困非天時傷於戍役而已補注鶴曰平原當是指德州唐德州為平原郡公言至趙時事按開元二十四年張守圭使祿山討奚契丹戍役為民害故平原以此而廢耕桑於時國用富足以守邊疆朝廷任猛將逺奪戎馬場洙曰于時言當時也當𤣥宗富盛之時不能節用自守而委任蕃將求功夷狄也到今事反覆故老淚萬行龜䝉不可見况乃懷故鄉洙曰龜䝉山也去東嶽近而尚不可見况故鄉乎補注鶴曰九域志云兖州有龜山而書云青州有䝉羽按詩云奄有龜䝉禹貢云䝉羽其藝者龜䝉當是二山今謂龜䝉尚且不再見則欲見長安為尤難傷開元天寶以來好求邊功而今反起吐蕃之亂而征役尢頻故末云哀彼遠征人去家死路傍肺萎屬久戰骨出熱中腸憂來杖匣劒更上林北岡瘴毒猿鳥落峽乾南日黃秋風亦已起江漢始如湯洙曰苦熱行赤阪橫西阻火山赫南威身熱頭且痛鳥隨魂來歸湯泉發雲潭焦煙起石圻登髙欲有往蕩析川無梁洙曰欲有所行而無所由也哀彼遠征人去家死路傍不及祖父塋纍纍塜相當洙曰魏懷舊賦冡纍纍以接隴華表丁令威歌何不學仙冡纍纍雨大厯二年作補注鶴曰詩云窮荒益自卑飄泊欲誰訴又云宿留洞庭秋天寒瀟湘素杖策可入舟送此齒髮暮當是大厯二年䕫州作時欲下峽入荆湘明年遂行是年吐蕃冦邠靈州京師戒嚴故云兵戈浩未息山雨不作埿江雲薄為霧晴飛半嶺鸖風亂平沙樹明滅洲景微隱見巖姿露拘悶出門遊曠絶經目趣消中日伏枕卧久塵及屨蘇曰羊充不仕隱中條山辟穀每卧即浹旬至有塵滿草㣦豈無平肩輿趙曰肩輿轎子也王子猷聞顧辟疆有名園乘平肩輿而徑入莫辨望江路兵戈浩未息蛇虺反相顧蘇曰孔融曰豺虎相食蛇虺相防悠悠邊月破蘇曰李恢秋日詞云邊月破鏡飛塞鴈斷行數鬱鬱流年度針炙阻朋曹洙曰針炙所以救療也譬良友朋也糠籺對童孺洙曰時既乏良朋所對者童孺而已糠籺言非實德也趙曰以久病故須針炙以安養故與朋友阻隔如賈島言多病人踈也此句言貧食糠籺與童孺相對而已補注希曰陳平傳亦食糠核耳孟康曰核麥糠中未破者也晉灼曰核音紇京師人謂粗屑為紇頭一命須屈色新知漸成故窮荒益自卑飄泊欲誰欣趙曰以嚴武辟公為節度參謀所謂一命也公既受命矣則當屈色以下之尫羸愁應接俄頃恐違一云危忤浮俗何萬端幽人有高步趙曰左太冲詠史高步追許由龎公竟獨往洙曰龎德公也未嘗入州府夫妻相敬如賔劉表不能屈後携妻子入鹿門山不反補注希曰淮南王莊子要略江海之士山谷之人輕天子細萬物而獨往尚子終罕遇洙曰後漢逸民傳尚長字子平隱居不仕肆意遊五嶽名山竟不知所終謝靈運詩畢聚類尚子宿留洞庭秋洙曰漢書宿留瞽言趙曰宿留音秀溜出漢書如言等候也公蓋言候秋時可以登舟而往矣補注希曰郊祀志宿留海上師古曰謂冇所須待也宿先就反留力就反天寒瀟湘素杖䇿可入舟送此齒髮暮贈李十五丈别大厯元年作補注鶴曰李十五丈即文嶷祕書也其父子俱賢故詩中用𤣥成子山事考公有寄李十五祕書詩二首云衣冠八尺身又云𤣥成負文彩而此詩亦云不聞八尺軀長受衆目憐又云𤣥成美價存於以知為文嶷也寄李之詩在大厯元年夏作則此詩乃其年秋作也詳見注峽人鳥獸居其室附層巔洙曰魏都賦蠻陬夷落譯導而通者鳥獸之岷也下臨不測江中有萬里船多病紛倚薄趙曰謝靈運詩拙疾相倚薄少留改嵗年絶域誰慰懷開顔喜名賢孤陋沗末親等級敢比肩人生意頗洙曰一作氣合相與襟袂連一日兩遣僕三日一共筵揚論展寸心壯筆過飛泉修可曰曹子建作王仲宣詩思若湧泉又李廣利拔刃刺山飛泉湧出𤣥成美價存洙曰章賢少字𤣥成復以明經歷位至丞相故鄒魯諺曰遺子黃金滿籯不如教子一經子山舊業傳洙曰庾信字子山父肩吾為梁太子中庶子掌書記徐陵及信並為抄撰學士信父子在東宫出入禁闥文並綺麗世號徐庾體不聞八尺軀常受衆目憐且為辛苦行蓋被生事牽北回白帝棹南入黔陽天鄭曰黔陽屬武陽郡今辰州三亭縣南黔陽故城即漢故符縣汧公制方隅洙曰汧李之所封定功曰汧公李勉也按舊史上元初為梁州刺史山南道防禦使李十五丈在峽中往往謁之故公作詩以别之以李之所封也補注鶴曰唐黔州黔中郡屬江南道黔中採訪使治黔州與李勉為梁州刺史山南道防禦使似不相關又大厯初勉已不在梁州意是勉為江西觀察使時治在洪州其曰南入黔陽天者謂其由黔陽以入豫章也况此詩首云峽人鳥獸居其室附層巔下臨不測江中有萬里船詩在䕫州作甚明若李勉上元初為梁州刺史李十五丈往謁之則公時在成都不應詩乃云考宰相世系宗室世系與㑹要諸書自李勉外餘無封汧國者然新史謂嶺南節度使召歸進工部尚書封汧國公而舊史謂大厯七年拜工部尚書及滑亳節度却不言封汧國若如新史云自嶺南歸封汧國勉大厯四年方入嶺南其歸在五年以後公已死矣無容言汧公疑有誤雖舊史帝紀上元二年建丑月李勉為梁州刺史然是時亦未封公又大厯二年李勉已召還京尹若李十五丈果出峽往謁之則此詩作於大厯元年秋故有解榻秋露懸之句以勉在洪州所以用陳蕃事更俟博識逈出諸侯先封內如太古時危獨蕭然清高金莖露正直朱絲絃洙曰西都賦抗仙掌以承露擢雙立之金莖鮑明遠詩清如玊壺氷直如朱絲繩黨錮傳直如絃死道邊昔在堯四嶽今之黃潁川洙曰四嶽分掌四嶽之諸侯黃霸為潁川太守有治狀此皆美李汧公也于邁恨不同所思無由宣山深水增波解榻秋露懸客遊雖云久亦思月再圓師曰李丈待甫正當秋月甫以客遊既久為辭主人更要月再圓言挽留之誠意也晨集風渚亭師曰謂李丈餞别也醉操雲嶠篇操七到反蘇曰徐陵醉中作白雲出渚嶠篇明日酒醒讀之自驚以為神助陳統見而心降師曰此句謂送之以詩也丈夫貴知已趙曰史記士伸於知已而屈於不知歡罷念歸旋師曰謂酒罷將歸惜别之意也贈鄭十八賁大厯元年作補注鶴曰詩云數杯資好事異味煩縣尹當是在雲安作賁乃鄭十七之弟公有答鄭十七郎一絶其間有把文驚小陸即其人也梁權道編在大厯元年䕫州詩內以鄭十七絶句考之當是元年雲安作溫溫士君子令我懷抱盡師曰詩云溫其如玉鄭賁有溫潤君子之德使我得展盡底藴無有遺恨靈芝冠衆芳安得闕親近趙曰芝以比鄭蓋靈芝人所喜見者故不可闕於親近也遭亂意不歸竄身跡非隱洙曰以避亂也趙曰山濤吏非吏隱非隱細人尚姑息趙曰禮記小人之愛人也以姑息吾子色愈謹高懷見物理識者安肯哂卑飛欲何待捷徑應未忍洙曰不欲枉尺而直尋也修可曰張衡應問曰捷徑邪至我不忍以投步干進求容我不忍以歙扇盧藏用傳士大夫指嵩山終南為仕途捷徑示我百篇文詩家一標準蘇曰屈平文詞乃詩家標凖也補注希曰尚書序云典謨訓誥誓命之文凡百篇羈離交屈宋洙曰屈原宋王牢落值顔閔洙曰顔淵閔子騫水陸迷畏洙曰一作長途藥餌駐修軫古人日已遠青史字不泯趙曰青史者殺青竹簡之史也江文通云啓丹青並圖青史詩云靡國不泯步趾詠唐虞追隨飯葵堇數杯資好事異味煩縣尹心雖在朝謁力與願矛盾抱病排金門衰容豈為敏師曰衰老欲排金馬門尤非本意補注希曰揚雄傳歷金門應劭曰金馬門也排字本樊噲傳所謂排闥也殿中楊監見示張旭草書圖大厯元年作補注鶴曰唐志殿中省監一人掌天子服御之事南齊有內外殿中監以後篇送楊監赴蜀見相公詩云送子清秋暮則此同是大厯元年作按賀知章傳張旭吳郡人善草書而好飲醉後號呼狂走時人號之為張顛斯人已云亡草聖祕難得趙曰漢張伯英善草書人謂之草聖及兹煩見示滿目一悽惻蘇曰孫登曰人事悽凉滿目悽惻補注希曰選賦步寒林而悽惻悲風生微綃洙曰潘安仁詩凱風揚微綃萬里起古色師曰言有古人氣象鏘鏘嗚玊動落落羣松直連山蟠其間溟漲與筆力趙曰言筆力浩汗若溟渤之漲水也師曰自鏘鏘鳴玊動至此句皆言草書之狀有練實先書臨池真盡墨洙曰張伯英善草書凡家之衣帛必先書而後練臨池學書久池水盡黑人謂之草聖俊拔為之主泰伯曰俊拔言筆力超越人也暮年思轉極未知張王後趙曰張伯英王羲之誰並百代則嗚呼東吳精洙曰張乃蘇州人也逸氣感清識趙曰張旭之逸氣感楊監之清識楊公拂篋笥安石曰謂祕藏也舒卷忘寢食蘇曰李成得王逸少帖舒卷披玩寢食俱忘示兒曰此吾傳家之寶也念昔揮毫端不得觀酒德趙曰公嘗曰張旭三杯草聖傳晉劉伶善飲而有酒德頌楊監又出畫鷹十二扇大厯元年作補注鶴曰題云又出則是與前詩同時作近時馮紹正能畫鷙鳥樣明公出此圖無乃傳其狀殊姿各獨立清絶心有向疾禁千里馬氣敵萬人將洙曰壯其快疾勇敢也夢符曰漢文帝時有獻千里馬關羽張飛萬人敵憶昔驪山宫冬移含元仗洙曰𤣥宗盛時常以冬十月幸溫泉宫時肆獵補注希曰舊史東內曰大明宫正殿曰含元驪山在昭應縣高宗已後常居東內故幸驪山則移含元之仗也天寒大羽獵此物神俱王趙曰莊子曰澤雉十步一啄百步一飲神雖王不善也當時無凡材百中皆用壯洙曰時寧王高麗赤鷹尤俊異帝獵則置之駕前號决雲兒補注希曰史記養由基善射百發百中用壯字本易大壯卦粉墨形似間識者一惆悵干戈少暇日真骨老崖嶂為君除狡㑹是翻韝上補注鶴曰此四句蓋傷人無掃除凶亂也狡指崔旰輩送殿中楊監赴蜀見相公大厯元年作趙曰相公杜鴻漸也大厯元年授劒南節度使補注鶴曰按史永泰二年二月杜鴻漸以黃門侍郎平章事帥蜀是年十二月改大厯元年明年六月入朝此詩云送子清秋暮當是元年秋作去水絶還波洙曰古詩長江無回波泄雲無定姿洙曰陸機賦有輕盈之艷狀無實體之真形人生在世間聚散亦暫時離别重相逢偶然豈定期送子清秋暮風物長年悲趙曰淮南子云木葉落長年悲豪俊貴勳業邦家頻出師相公鎮梁益軍事無孑遺補注鶴曰杜鴻漸為劒南東西川副元帥故云鎮梁益詩靡有孑遺解榻再見今洙曰陳蕃禮徐稚别置一榻去則縣之來則解用才復擇誰况子已高位為郡得固辭補注鶴曰唐百官志殿中監一人從三品則其位誠高矣為郡之語楊殆有請故云公亦微寓子之清風巳盛矣難拒供給費慎哀漁奪私洙曰言不以道取也如漁人之漁焉蘇曰張曙秉權勢漁奪貧民私帑干戈未甚息紀綱正所持泛舟巨石橫登陸草露滋山門日易久當念居者思趙曰此公自言也左傳有居者行者語師曰甫意謂已能逐姦邪茍能用之則亦軒然而奮矣補注杜詩卷十二
