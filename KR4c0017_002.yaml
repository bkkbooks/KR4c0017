body:
  text: 補注杜詩卷二宋黃希原本黃鶴補注送孔巢父謝病歸遊江東兼呈李白至德二載作洙曰孔巢父冀州人字弱翁早勤文史少與韓凖李白張叔明陶沔隱於徂徠山時號竹溪六逸永王璘赴江淮聞其賢以從事辟之巢父察其必敗側身潛遁由是知名後為潭州刺史湖南觀察使未行㑹德宗幸奉天遷給事中御史大夫興元元年使李懷光於河中巢父遇害補注鶴曰舊注以為察永王必敗而不受其辟乃謝病潛遁則當在至德二載然是時李白因永王流夜郎矣不應末云南尋禹穴見李白梁權道編在天寶十三載雖白傳云天寶初客遊㑹稽又當在十三載及非巢父不受辟之時當是巢父至德二載逃還彭澤時作其曰南尋禹穴云者非曰白在禹穴殆謂巢父去尋禹穴若見李白則道公問訊也巢父掉頭不肯住東將入海隨煙霧洙曰不肯住謂謝病歸江東也莊子鴻濛拊髀爵躍掉頭曰吾弗知也趙曰掉頭者於事不可之狀補注希曰淵明詩彭祖愛永年掉頭不可住鶴曰公嘗作雜述以為魯之張叔卿孔巢父二才士者聰明深察辨博閎大何面目黧黑常不得飽飯喫又云巢父執雌守常吾無所贈若矣使其不能守常且有飽飯之望則應為永王所留不復入海故以富貴為草頭之露詩卷長留天地間蘇曰吳璿投劉楨詩楨曰學海深淵非璿敢量將此卷長留天地間後知音者賞之釣竿欲拂珊瑚樹洙曰一云三株樹西都雜記積草池中有珊瑚樹髙一丈二尺一本三柯上有四百六十二條是南越王趙他所獻號為烽火樹至夜光景常欲然趙曰珊瑚樹生海底石上見晉書大秦國事以其在海底故以拂言之也言巢父歸江東之後遂乃入海有此興也深山大澤龍蛇逺洙曰襄二十一年傳叔向之母妬叔虎之母美而不使有子謂其子曰深山大澤實生龍蛇彼美吾懼其生龍蛇以禍女春寒野陰風景暮洙曰一云花繁草青春日暮蓬萊織女回雲車彥輔曰蓬萊三山名小雅跂彼織女終日七襄陶隱居真誥朱關內真以雲車虛轅相適指㸃虛無引歸路定功曰曺子建虛無求列仙彥輔曰相如大人賦乘虛無而上假自是君身有仙骨蘇曰栖岩老人見孫登曰君非世俗人身有神仙玉骨彥輔曰神仙傳嚴青居貧忽有人以一卷素書與青曰汝有仙骨應得長生世人那得知其故惜君只欲苦死留富貴何如草頭露洙曰一云我欲苦留君富貴何如草頭易晞露古詩薤上朝露何易晞彥輔曰李嶠詩曰富貴榮華能幾時陸機歎逝賦曰草無朝而遺露李善曰露之在草無一朝而有餘喻人之居世無一朝而能故蘇武傳曰人生如朝露師曰巢父與李白友善李白時在江東巢父欲尋之問學神仙之術遂以病辭朝廷游江東故云掉頭不肯住東將入海隨煙霧珊瑚似琉璃有五色青者可入藥為上生海底巢父善屬文吟詩今游江東以漁釣為樂故釣竿欲拂珊瑚樹惟餘詩集留人間與天地相為長久而已昔叔向之母曰深山大澤實生龍蛇彼叔虎之母美恐生龍蛇以禍其族巢父棄絶房色故云龍蛇逺風景暮為晚春執别之時巢父此行蓬萊仙人與織女各回轉雲車以迎之必將指㸃於神仙之境蓋以素有仙骨何患功不成乎草頭露言不久日出即乾巢父輕視富貴譬如草頭露也蔡侯靜者意有餘清夜置酒臨前除洙曰陸士衡擬古間夜命歡友置酒迎風館除階除也彥輔曰魏文帝詩清夜延賔客罷琴惆悵月照席幾嵗寄我空中書彥輔曰空中書未詳或曰蓋鴈書耳南尋禹穴見李白洙曰一云若逢李白騎鯨魚史自序司馬遷南遊㑹稽探禹穴張晏曰禹巡狩至㑹稽而崩因葬焉上有孔穴或云禹入此穴趙曰禹穴在㑹稽山上史記曰太史公登㑹稽探禹穴白時在㑹稽矣乃巢父欲入海之路也道甫問信今何如洙曰一本云巢父掉頭不肯住東將入海隨煙霧書卷長攜天地間釣竿欲拂珊瑚樹我擬把袂苦留君富貴何如草頭露深山大澤龍蛇逺花繁草青風景暮仙人玉女回雲車指㸃虛無引歸路若逢李白騎鯨魚道甫問信今何如師曰靜乃蔡侯名謂勤意有餘也空中書謂鴈傳書罷琴惆悵蓋惜別也因謂巢父此别幾年得有書相達今巢父遊江東尋見李白煩道甫問其安否此致意之辭也補注希曰法華經問訊如來而何如二字本禮記飲中八仙歌天寶年間作修可曰蔡絛云船字眠字天字前字各再押前字凡三押於古未見其體嘗質之叔父元度云此歌分八篇人人各異雖重押韻無異亦周詩分章之意也師曰詩家多為此歌重疊用韻天字二眠字二前字三以贈八人析為八章故不為病如李商隱作九日詩云正是龍山落帽時又云乞漿問路知何時既曰丹楓隕葉紛墮飛又曰歸心自逐霜鴻飛豈謂贈八人即殊不知李杜之作蓋有所本詩祖於風雅頌如著詩云俟我於庭乎而充耳以青乎而尚之以瓊英乎而疊韻之法起于此耳補注鶴曰蔡興宗年譜云天寶五載而梁權道編在天寶十三載按史汝陽王天寶九載巳薨賀知章天寶並三載李適之天寶五載蘇晉開元二十二年已死此詩當是天寶間追舊事而賦之未詳何年蓋李白自知不為親近所容與知章李適之汝陽王璡崔宗之蘇晉張旭焦遂為酒八仙人公所以有此作也白以寶應元年卒知章騎馬似乘船眼花落井水底眠洙曰唐文苑傳賀知章㑹稽永興人少以文詞知名陸象先薦為太常博士性放曠善謔笑當時賢達皆傾慕之晚年尤加縱誕無復規矩自號四明狂客又稱祕書外監遨遊里巷天寶三載因病上疏請為道士求還鄉上許之蘇曰阮咸醉騎馬欹傾人皆指而笑曰箇老子騎馬如乘船行波浪中王祥醉憑肩輿頭不舉歸其親戲之曰子眼花在井底身在水中睡亦不醒耶趙曰眼花出吳均詩夢中難言見終成亂眼花師曰賀知章善乘船安若騎馬故曰騎馬似乘船此到用文杜詩若此類者頗多如黃鵠髙於五尺童化為白鳬似老翁亦謂五尺之童髙於黃鵠又為老翁則似白鳬井者目井也醉人目井皆生花故曰眼花落井水底眠者謂醉卧舟中任其泛泛所之豈非水底眠乎說詩者不以文害辭不以辭害志蓋謂是也汝陽三斗始朝天蘇曰北齊王詢好飲帝一日召詢詢曰待此三斗盡方去見帝帝聞笑之道逢麴車口流涎恨不移封向酒泉洙曰本集八哀詩有贈太子太師汝陽郡王璡詩又贈特進汝陽王詩應劭漢官儀曰酒泉城下有泉味如酒故曰酒泉蘇曰郭𢎞漢帝甚寵顧一日見帝帝曰欲封卿郡邑何地好𢎞好飲對曰若封酒泉郡實出望外帝笑果封酒泉郡王趙曰汝陽王李璡也言恨不移封酒泉見麴車而口流涎戲其好飲之急曺操對叔父詐作中風狀口流涎沫師曰朝天言朝天子按唐史拾遺汝陽王璡嘗於上前醉不能下殿上遣人掖出之璡謝罪曰臣以三斗壯膽不覺至此麴車載麴車也按地理志酒泉今肅州漢福祿縣地武帝開之置酒泉郡城下有泉其味甘如酒左相日興費萬錢飲如長鯨吸百川洙曰唐書李適之傳一名昌常山王承乾之孫也雅好賔友飲酒一牛斗不亂夜則宴賞晝決公務庭無留事天寶元年代仙客為左丞相後為李林甫陰中罷知政事賦詩曰避賢初罷相樂聖且銜杯為問門前客今朝幾箇來晉何曾性奢豪日食萬錢猶曰無下筯處師曰左相李適之也唐百官志有左右僕射𤣥宗時改為左右丞相唐酒價賤每斗三百酒一石直錢三千然左相日費萬錢以斗石當其錢數而通計之則飲酒凡三石三斗有餘其視劉伶輩一飲一石五斗解酲更髙出其右矣觀其雄飲若此豈非鯨吸百川之比乎補注希曰按史適之喜賔客飲酒至斗餘不亂今公云日興費萬錢豈是専為醉己之資蓋餉客之用俱出於此若師之說謂唐酒價每斗三百以其錢數計之則適之日飲三石三斗有餘既無此理又恐賔客之奉蔑有矣銜杯樂聖稱世賢師曰酒有清有濁清者為聖人濁者為賢人樂聖言樂聖人也余曰邵氏聞見録云子美此句世賢二字殆不可曉或云世當作避字寫本誤也蓋左相李適之有直聲右相李林甫姦邪適之議論數不同自免去詩云避賢初罷相樂聖且銜杯子美正用適之詩語也宗之瀟灑美少年舉觴白眼望青天皎如玉樹臨風前洙曰李白傳侍御史崔宗之謫官金陵與白詩酒唱和晉阮籍傳能為青白眼阮籍詩朝為美少年江淹詩風吹玉階樹謝𤣥曰譬如芝蘭玉樹欲使其生於庭階耳師曰晉阮籍能為青白眼見賢士青其眼見庸士白其眼望青天言以酒笑傲青天也視造化如小兒耳皎如玉樹言姿質潔白美丈夫也蘇晉長齊繡佛前醉中往往愛逃禪洙曰蘇晉頲之子𤣥宗監國所下制命多晉藁定修可曰晉頲之子也逃禪言逃去而禪坐耳此東坡所謂蒲褐禪同夜禪者也以晉好佛故云爾師曰蘇晉學浮屠術嘗得胡僧慧澄繡彌勒佛一本晉寶之嘗曰是佛好飲米汁正與吾性合吾願事之他佛不愛也常於市中飲酒食猪首時人無識之者故甫有長齊繡佛前逃禪之句李白一斗詩百篇長安市上酒家眠天子呼來不上船蘇曰船方言曰所謂襟紐是已夢符曰右按關中呼衣襟為船詩曰何以舟之舟亦船也其來尚矣定功曰唐范傳正作白墓碑曰元宗泛白蓮池召李白作序時已被酒命髙將軍扶以登舟蜀人謂衣領為船妄也自稱臣是酒中仙洙曰唐李白字太白少有逸才酣歌縱酒天寶初與道士吳筠俱待詔翰林白既嗜酒日與飲醉於酒肆𤣥宗度曲欲造樂府新詞丞召白白已於酒肆醉矣召入宫人以水灑面即令秉筆頃之成十餘章帝頗嘉之賀知章曰此天上謫仙人也師曰不上船不即時上船以其醉也帝嘗宴白蓮池忽欲有所賦遣人召李白使者遍長安市上求索之已見白醉卧於酒家矣及至帝所醉不能登舟帝命力士扶上船故云天子呼來不上船杜贈李白曰龍舟移棹晚蓋謂此爾或以蜀人衫襟為船蜀方言並無此說張旭三杯草聖傳脫帽露頂王公前揮毫落紙如雲煙洙曰張旭善草書而好酒飲後豪呼狂走索筆變化無窮若有神助時人號為顛後漢張奐長子芝伯英尤好草書衣帛必書而後練臨池學書水為之黑為世所寶寸紙不遺韋仲將謂之草聖趙曰漢張芝善草書號草聖故以比之號旭為張顛故有脫帽露頂之句師曰聖賢或露頂飲酒號為四飲張旭善草書每飲大醉以頭濡墨就壁書及醒自以為神故有脫帽露頂之句焦遂五斗方卓然髙談雄辨驚四筵洙曰按新唐書白自知不為親近所容益驁放不修與焦遂等為酒八仙師曰唐史拾遺云遂與李白號為酒八仙口吃對客不出一言醉後酬結如注射時目為酒吃曲江三章章五句至德元載作彥輔曰元和中中書舍人李肇撰國史譜其略曰進士既捷大宴於曲江亭子謂之曲江㑹曲江大㑹在關試後亦謂之開宴天寶元年敕以太子太師蕭嵩私廟逼近曲江因上表請移他處敕二將士為嵩營造補注鶴曰以曲江蕭條秋氣髙當是至德元載陷賊中時若曰乾元元年則六月已出為華州掾矣曲江蕭條秋氣髙洙曰謝𤣥暉觀朝雨詩朔風吹飛雨蕭條江上來蘇曰顔延年曰秋髙氣爽倍增蕭索修可曰出宋玉衆芳蕭條班固原野蕭條之義補注鶴曰寰宇記曲江池漢武帝所造名為宜春苑其水曲折有似廣陵之江故名之韋述記云漢為樂遊苑於曲江池乃世祖以校文之所又一說唐明皇封張九齡於此故號曰張曲江後以秀士每年登科第賜宴於此蓋不忘校文章之義楚辭逺遊山蕭條而無獸兮菱荷枯折隨風濤游子空嗟垂二毛洙曰僖二十二年傳宋公曰君子不禽二毛注頭白有二色白石素沙亦相蕩哀鴻獨呌求其曹洙曰禰衡賦哀鴻感類劉安招隱士禽獸駭兮亡其曹趙曰方髙秋之時非特菱荷枯折而已水既瘦涸石與沙亦蕩潔而出鴻鵠失羣哀鳴而相求皆可感之事也師曰按西京雜記武帝於曲江頭大營亭館以為宴賞之地號為勝絶𤣥宗時敕移太子太師蕭嵩廟於別所以敞其臺館憲宗時每宴進士必於曲江亭當時曲江風景盛傳天下祿山之亂焚爇殆盡况秋氣蕭條菱荷枯折轉令人慘傷甫覽此風物已非昔日之盛復自傷年老兄弟間隔豈非黍離閔宗周之比乎再吟即事非今亦非古長歌激越捎林莽洙曰蘇武詩長歌正激烈鄭曰選羅千乘於林莽比屋豪華固難數洙曰堯舜之世比屋可封吾人甘作心似灰洙曰莊子南郭子綦形如槁木心如死灰弟姪何傷淚如雨趙曰公灰心久矣弟姪不必傷此而下淚也定功曰甫謂老年已灰少游之心雖屏跡寂寞無所憾恨但傷弟姪隔别是以涕淚如雨又吟自斷此生休問天修可曰楚辭天問篇其序曰天問者屈原之所作也何不言問天天尊不可問故曰天問也杜曲幸有桑麻田洙曰杜曲在長安俗云城南韋杜去天尺五言近京蘇曰第五倫曰吾杜曲有田種麻藝桑足免飢凍故將移住南山邊洙曰竇嬰傳屏居藍田南山下短衣匹馬隨李廣看射猛虎終殘年洙曰前漢李廣屏居藍田南山中射獵廣出獵見草中石以為虎而射之中石沒羽視之石也他日射之終不能入矣廣所居郡聞有虎常自射之趙曰欲移住南山則南山之景致足樂也匹馬射虎使李廣事廣正居藍田南山中此詩人因意使事也麗人行天寶十三載作曹子建洛神賦云覩一麗人於巖之畔劉向别録有麗人歌賦梁簡文帝箏賦命麗人於玉席補注鶴曰天寶十二載楊國忠與虢國夫人鄰居第往來無期或並轡入朝不施障幕道路為之掩目冬夫人從車駕幸華清宫㑹于國忠第於是作麗人行梁權道編在十四載末句云丞相者謂楊國忠按史與通鑑十一載李林甫死而國忠以十一月庚申為左相當是十三載作三月三日天氣新趙曰晉宋諸人侍宴曲水皆以三月三日為題唐開元中都人遊賞於曲江莫盛於中和上巳節此三月三日所以水邊多麗人也王右軍蘭亭曲水序曰天朗氣清惠風和暢此亦天氣清之謂秦曰詩云方秉蕳兮則知褉遊之事已起於昭王之前長安水邊多麗人鄭曰長安古雍州地漢始都此梅曰鮑昭蕪城賦曰東都妙姬南國麗人態濃意逺淑且真蘇曰太一仙妃態濃意逺乘風馭氣來往四方肌理細膩骨肉勻定功曰宋玉九辨有靡顔膩理東京賦有擘肌分理繡羅衣裳照暮春洙曰繡一作畫古詩被服羅衣裳南都賦暮春之褉元已之辰男女姣服絡繹繽紛蹙金孔雀銀麒麟頭上何所有翠微㔩葉垂鬢脣洙曰微一作為㔩一作匌身後何所見珠壓腰衱穩稱身杜曰廣韻曰㔩彩婦人髻飾花也㔩音罨爾雅曰極謂之裾郭璞云衣後裾一本㔩作匌衱作被非也就中雲幕椒房親洙曰班固西都賦云後宫則掖庭椒房后妃之室漢官儀曰皇后稱椒房取其蕃實之義也詩云椒聊之實蕃衍盈升又以椒塗宫室亦取其溫暖辟除惡氣師古曰椒房殿皇后所居侯樹謂梁冀曰將軍以椒房之重西都賦成帝設雲幄雲幕於甘泉殿世謂三雲殿曹子建美女篇頭上金雀叉腰佩翠琅玕此指言貴妃兄弟驕盛補注鶴曰車千秋傳亦云未央椒房師古以為殿名皇后所居以椒和泥塗壁取其溫而芳也楊國忠嘗謂客曰吾本家寒一旦緣椒房至此未知稅駕之所不若且極樂賜名大國虢與秦洙曰唐后妃傳𤣥宗楊貴妃有姊三人皆有才貌𤣥宗並封國夫人之號長曰大姨封虢國八姨封秦國並承恩出入宫掖勢傾天下嵗給錢千貫為脂粉之費紫駝之峯出翠釡洙曰峯一作珍漢書大月氏本行國出一封槖駝注脊上有一封髙也如封土然今俗呼為幫音峯胸奴傳師古注槖駝言能負槖囊而䭾物薛曰酉陽雜爼將軍曲良翰作駝峯炙水精之盤行素鱗蘇曰漢獻帝水精盤盛鮮膾賜近臣犀筯厭飫久未下洙曰晉何曾日食萬錢猶云無下筯處鸞刀縷切空紛綸洙曰空一作坐信南山詩執其鸞刀以啓其毛注鸞刀刀有鸞者言割中節也潘安仁西征賦饔人縷切鸞刀若飛應刃落爼靃靃霏霏黃門飛鞚不動塵洙曰前漢西域傳蒲梢龍文魚目汗血之馬充於黃門凡號黃門以其給事於黃闈之內秦漢皆有黃門侍郎按外傳虢國出入皆乘駿馬使小黃門為御薛曰右按文選鮑明逺擬古詩飛鞚越平陸補注希曰漢百官表師古曰日中黃門謂閹人居禁中在黃門之內給事者御厨絲絡洙曰一作絡繹送八珍洙曰周禮膳夫珍用八物注珍用淳熬淳毋炮豚炮牂搗珍漬熬肝膋也又食醫掌八珍之齊鮑明逺詩八珍盈雕爼薛曰右按尚膳貴嚴故以絲絡護衛之絲絡如綺疏也子美稱此以見寵豫之隆簫鼓哀吟感鬼神洙曰鼓一作管漢武秋風辭簫鼓鳴兮發棹歌詩序動天地感鬼神莫近於詩賔從雜遝實要津洙曰魏文帝與吳質書輿論徐動賔從無聲劉向傳雜遝衆賔古詩曰先據要路津後來鞍馬何逡巡當軒一作道下馬入錦茵洙曰鮑明逺詠史詩賔御紛颯沓鞍馬光照地趙曰當軒下馬言其氣勢洋洋旁若無人也師曰錦茵謂地鋪錦縟也楊花雪落覆白蘋青鳥飛去銜紅巾洙曰山海經曰三危之山有青鳥居之注青鳥主為西王母取食者引自栖息於此山也漢武故事七月七日上於承華殿齊坐中忽有青鳥從西方來集殿前東方朔曰此西王母欲來有頃王母至有二青鳥如烏夾侍王母旁趙曰青鳥應如鸚鵡之類豢養馴熟飛銜紅巾此止借西王母以青鳥為使名之紅巾蓋婦人之飾炙手可熱勢洙曰一作正絶倫慎莫近前丞相嗔洙曰勢一作世近一作向元載時委左右四人用事權傾中外人為之語曰炙手可熱卓李鄭薛言勢焰燻灼可以炙手也按新唐書楊貴妃専房兄銛錡國忠最見寵遇三姊皆美劭封韓虢秦三國恩寵聲焰震天下每命婦入班雖公主亦不敢就位臺省州縣奉請託奔走期㑹過詔敕四方獻餉結納門若市然時國忠代李林甫為相領四十餘使盛氣驕愎百僚莫敢相可否官屬悉苛督句剝相其心文便佞専徇帝嗜欲不顧天下成敗修可曰唐史遺安樂公主𤣥宗之季妹附㑹韋氏熱可炙手人咸畏之趙曰炙手可熱言勢焰薰灼也舊注引元載事在杜公之後非是丞相嗔指言國忠而終篇直指丞相之薰灼則公之不畏彊禦可見矣師曰甫有炙手可熱慎莫見嗔於丞相之句所以戒當世之士大夫無為譏切其黨以取禍害此詩以麗人名篇豈非刺貴妃之黨徒以豔麗之色寵貴乎補注希曰古樂府今日牛羊上丘壠當時近前面發紅樂遊園歌天寶年間作彥輔曰晦日賀蘭楊長史筵醉中作補注鶴曰唐志德宗時李泌請廢正月晦以二月朔為中和節乃著令與上巳九日為三令節即是前此以正月晦日為節梁權道編在十四載詳味詩句云公子華筵勢最髙等語皆未經祿山之亂前所作樂遊古園崒森爽洙曰西京記曰樂遊園漢宣帝所立唐長安中太平公主於原上置亭遊賞其地四望寬敞每三月上巳九月重陽士女戲就此祓禊登髙幄幕雲布車馬填塞虹彩映日馨香滿路朝士詞人賦詩翌日傳於京師補注希曰唐史太平公主傳云始作鄴池樂遊原既敗賜寧申岐薛四王都人嵗祓禊其地煙綿碧草萋萋長洙曰謝靈運詩萋萋春草繁江淹别賦春草碧色公子華筵勢最髙秦川對酒平如掌洙曰文選王粲家本秦川周王褒關山篇遙遙秦川水千里長如帶沈佺期長安路詩秦地平如掌補注鶴曰三秦記長安正南秦嶺根水流為秦川長生木瓢示真率更調鞍馬狂歡賞青春波浪芙蓉園洙曰魏文帝有芙蓉池作在鄴都西園芙蓉園在城南曲池坊臨水亭進芳門外即樂遊園也𤣥宗紀廣花萼樓築夾城至芙蓉園王莽傳乃西波水之北郎池之南師古曰黃圖有西波池郎池皆在石城南上林中趙曰長生木瓢則木瓢修長而生者蓋用之以酌則始為真率也白日雷霆夾城仗洙曰夾當作甲補注鶴曰夾字不當作甲蓋開元二十年嘗築夾城入芙蓉園閶闔晴開詄蕩蕩洙曰曹植平陸東行日閶闔天衢通前漢禮樂志遊閶闔觀玉臺天門開詄蕩蕩注閶闔天門蕩蕩天體堅清之狀曲江翠幕排銀榜洙曰潘安仁籍田賦翠幕默以雲布陳張正見詩即此神仙內銀榜映仙宫沈炯林屋館記崑山平圃銀榜相暉蓬閬山宫金臺幄起蘇曰姚萇張翠帟繡簾掛金篆銀榜拂水低回舞袖翻緣雲清切歌聲上夢符曰右按曹植言華閣緣雲此稱歌聲清切耳列子云薛談學謳於秦青辭歸秦餞於郊衢撫節悲歌聲振林木響遏行雲西京雜記髙帝令戚夫人歌出塞望歸之曲後宫齊唱聲入雲霄趙曰後漢王延夀魯靈光殿賦飛陛揭孽緣雲上征却憶年年人醉時只今未醉已先悲數莖白髮那拋得補注希曰南史鬱林王記齊髙帝笑曰豈有為人作曾祖而拔白髮者乎即擲鏡鑷百罰深杯亦不辭洙曰罰一作刻蘇曰桑乂在江揔席上曰推夾杯百罰吾亦不辭聖朝已知賤士醜洙曰揚子曰秦之士也賤陸機云𤣥冕無醜士一物自荷皇天慈洙曰江淹一物之微有足悲者又天羣物之祖此身飲罷無歸處獨立蒼茫自詠詩洙曰庾信詩蒼茫雲貌愁梁朱异田飲引值寒野之蒼茫梁元帝詩秋氣蒼茫結孟津趙曰蒼茫荒寂貌渼陂行天寶十三載作趙曰渼音美士大夫非西人者多讀為于亮切乃蕩漾之漾遂使鬻書一本直作漾陂行深誤學者按長安志渼陂在鄠縣西十道志云陂魚甚美因名之補注鶴曰陂在京兆鄠縣以水味美故配水以為名以岑參攜我來遊之句當是公未薦充近侍前作又以後篇云身退豈待官乃十三載未授官時作岑參兄弟皆好奇攜我逺來游渼陂師曰揚雄言司馬遷好奇蓋遷之性好周游天下今岑參兄弟攜我來游渼陂豈非若遷之好奇也補注鶴曰參至德二載試大理評事攝監察御史公同遺補薦其識度清逺議論雅正佳名早立時輩所仰充近侍天地黤慘忽異色洙曰王粲登樓賦天慘慘而無色波濤萬頃堆琉璃洙曰西域傳罽賔出琉璃師古曰魏略云大秦國出赤白黑黃青緑縹紺紅紫十種琉璃此蓋自然之物也蘇曰王筠詩曰扁舟泛西池衝波碧琉璃琉璃汗漫泛舟入洙曰張平子賦布濩汗漫梁簡文詩池水淨琉璃事殊興極憂思集鼉作鯨吞不復知蘇曰徐陵江行鯨鯢湧波鼉蛟作浪鄭曰鼉徒何切說文曰水蟲似蜥蝪而長大惡風白浪何嗟及洙曰詩中谷有蓷啜其泣矣何嗟及矣主人錦帆相為開洙曰隋煬帝以錦為帆修可曰陳陰鏗詩曰平湖錦帆張舟子喜甚無氛埃洙曰詩招招舟子郭璞江賦舟子於是溺棹趙曰沈休文詩夜靜滅氛埃鳬鷖散亂棹謳發洙曰班固西都賦鳥則鳬鷖鳩鴈朝發河海夕宿江漢沈浮往來雲集霧散又櫂女謳鼓吹震漢武秋風辭簫鼓鳴兮發棹歌補注希曰詩有鳬鷖毛氏曰鳬水鳥也孔氏曰伯鳥鸍沈鳬郭璞曰似鴨而小長尾背上有文今江東亦呼為鸍陸機疏云小如鴨卑腳短喙水鳥之謹願者鷖鳬屬倉頡解詁云鷖鷗也一名水鶚也絲管啁啾空翠來趙曰啁作包切說文啁嘐也楚辭曰鵾雞啁􅑜而悲鳴空翠來則晴矣故絲管乾而啁啾沈竿續蔓深莫測菱葉荷花靜如拭宛在中流渤澥清洙曰詩蒹葭宛在水中央揚子渤澥之島蘇曰按說文東海之別有渤澥故東與海共稱渤海補注希曰子虛賦浮渤澥師古曰海別支也下歸無極終南黑補注希曰終南山在長安毛萇云周之名山終南也半陂已南純浸山動影裊窕沖融間洙曰木𤣥虛海賦沖融滉漾船舷暝戛雲際寺洙曰宋謝靈運詩暝還雲際宿郭璞江賦詠採菱以扣舷舷脣也水面月出藍田關趙曰雲際山名在鄠縣東南有大走寺藍田關在藍田縣東南船舷之戞可聞於雲際之寺月出之所可想其當於藍田關皆以陂之廣大然也此時驪龍亦吐珠洙曰莊子列禦寇千金之珠必在九重之淵而驪龍頷下子能得珠者必遭其睡也馮夷擊鼓羣龍趨洙曰謝惠連雪賦馮夷剖蚌列明珠注馮夷河伯也曹子建洛神賦馮夷鳴鼓女媧清歌大人賦使靈媧鼓琴而舞馮夷釋文司馬云清冷傳曰馮夷華陰潼鄉隄首人也服八石得水仙是為河伯補注鶴曰海賦水夷俯浪以傲睨注水夷水仙人也一本作冰郭璞云冰夷馮夷也人面而承龍齊地記湘妃漢女出歌舞洙曰曹子建神女賦從南湘之二妃攜漢濵之游女鄭曰舜二妃堯女娥皇女英以舜南巡不反自沈湘而死漢女即漢上游女也金支翠旗光有無洙曰前漢禮樂志金支秀華庶旄翠旌臣瓚曰樂上衆飾有流遡羽葆以金為支其首敷散若草木之秀華也師古曰瓚說是司馬相如賦建翠華之旗梁元帝檄文建翠鳳之旗北齊祖孝徵詩翠旗臨寒道咫尺但愁雷雨至蒼茫不曉神靈意洙曰漢郊祀歌靈之車結𤣥雲靈之來先以雨又東風飄兮神靈雨趙曰舊注引靈之車來冗而非是少壯幾時奈老何向來哀樂何其多洙曰漢武秋風辭歡樂極少哀情多少壯幾時奈老何朋曰君子遇憂則憂遇樂則樂俯仰屈伸任運而已詩家體格其抑揚頓挫大槩若此首叙鼉作鯨吞之可憂中叙鳬鷖菱荷與夫湘妃漢女之樂末嘆哀樂相半故曰向來哀樂何其多凡遣辭命意常以此為法也渼陂西南臺天寶十三載作補注鶴曰同上年作髙臺面蒼陂六月風日冷朋曰六月此臺獨冷以水氣逼人也蒹葭離披去趙曰詩蒹葭蒼蒼其物則陂岸有之矣補注鶴曰蒹萑之未秀葭葦之未秀蒹葭至于秋成然後謂之萑葦已上見爾雅天水相與永洙曰謝靈運詩空水共澄鮮懷新目似擊洙曰謝靈運詩懷新道轉迥又莊子目擊而道存接要心已領要一作惡鄭曰要於消切仿像織鮫人洙曰搜神記南海之外有鮫人水居如魚不廢緝績其人能泣珠海賦仿像其色又其垠則有天琛水怪鮫人之室空䝉辨魚艇洙曰廣雅曰船二百斛以下曰艇趙曰空䝉出謝𤣥暉朝雨詩空濛如薄霧言若無而空若有而濛也䝉即濛字錯磨終南翠顛倒白閣影洙曰終南白閣並山名終南五經要義云終南山長安南山也一名太一潘嶽關中記曰其山一名中南言在天之中都之南毛詩亦云崷崒增光輝洙曰一作陰西都賦巖峻崷崒鄭曰崷自秋切山峻貌乘凌惜俄頃洙曰謝靈運詩恆充俄頃用勞生愧嚴鄭洙曰嚴陵鄭子真也嵇叔夜幽憤詩仰慕嚴鄭樂道間居蘇曰嵇中散曰勞生蹤跡甚愧嚴陵鄭子真耶修可曰嚴陵湛冥久幽而不改其操鄭子真不屈其志耕於巖石之下外物慕張邴洙曰張良邴原也謝靈運詩偶與張邴合趙曰張良貴極願棄人間事邴曼容免官養志自修世復輕驊騮吾甘雜蛙黽趙曰重嘆世不我知而輕驊騮之駿則欲隱居於陂上焉倪曰范蠡曰吾先君魚鱉之與處而蛙黽之與同渚公詩句之意謂此補注鶴曰穆天子傳用八駿之乘以飲干枝詩之中積石之南河天子之駿赤驥盜驪白義渠黃驊騮緑耳爾雅在水者黽陶注本草云大而青脊者俗名土鴨其形甚壯即此黽也陶又云一種小形善鳴喚名為蛙者即郭云青蛙者也知歸俗可忽取適事莫並洙曰適一作足身退豈待官洙曰謝靈運詩辭滿豈多秩謝病不待年老來苦便靜趙曰蓋言身欲求退不必待於為宮之後舊注引謝病不待年混亂之矣老子功成名遂身退天之道謝靈運詩拙疾相倚薄還得靜者便况資菱芡足鄭曰芡巨險切說文云雞頭也方言曰南楚謂之雞頭北燕謂之䓈青徐淮泗謂之芡䓈䓈營隻切補注希曰爾雅釋曰說文云䔖楚曰芰秦曰蘚茩庶結茅茨迥從此具扁舟彌年逐清景趙曰范蠡乘扁舟泛五湖戲簡鄭廣文䖍兼呈蘇司業源明天寶十四載作補注鶴曰按唐史蘇源明以太子諭德出為東平太守時濟陽太守李陵請增領二縣詔河南採訪使與五太守議不能決卒廢濟陽志云天寶十三載廢召源明為國子司業祿山陷京師源明不受僞署肅宗復兩京擢考功郎則為司業在祿山未亂之前今詩題云蘇司業當是十四載作師注謂䖍受僞署竄歸免官時源明給餉之非廣文到官舍洙曰廣文見一卷醉時歌注繫馬堂階下醉即騎馬歸趙曰山簡傳日暮倒載歸酩酊無所知時時能騎馬倒著白􅀢䍦頗遭官長罵才名三十年坐客寒無氊趙曰唐史稱鄭䖍在官貧約淡如也乃引杜甫嘗贈以詩曰才名三十年坐客寒無氊則知公之作真詩史矣補注希曰吳隱之為度支尚書以竹篷為屏風坐無氊席三十年善本云四十年近有蘇司業時時與洙曰一作乞酒錢師曰䖍始為廣文館學士性嗜酒不治事數為官長所誚怡然不以為意祿山反陷于賊受祿山僞署後竄歸坐免官故至貧窶惟蘇源明重其才時時給餉之公詩云得錢即相覔沽酒不復疑蓋謂此也夏日李公見訪天寶十四載作彥輔曰一云李家令見訪補注鶴曰以貧居類村塢僻近城南樓則是在長安城南今詩題云李公見訪一云李家令見訪按宗室世系表唯蔡王房有炎為太子家令讓皇帝房有平為太子家令嗣寧王然平原去讓皇帝五世不與公同時疑是李炎在天寶十四載作逺林暑氣薄公子過我遊蘇曰阮元瑜公子得暇可過我菊坡遊師曰公子指李白也補注鶴曰李白雖是興聖皇帝九世孫然公凡與之詩未嘗稱之為公子亦未嘗題曰李公貧居類村塢僻近城南樓趙曰貧居類村塢僻近城南樓此所謂城南韋杜也傍舍頗淳朴所願亦易求隔屋喚西家借問有酒不鄭曰不方鳩切弗也牆頭過濁醪蘇曰友人見陶侃侃家貧無以致誠其鄰人賢謂侃曰子門有長者軒車何不延之論當世事侃曰貧不能備醇餌鄰人密於牆頭度以濁酒隻雞遂成終日之樂宋朝王冀公過侃廟有詩云九重天閽夢搏翼黃雞白酒鄰舍恩名公謂其詩中題展席俯長流清風左右至夢符曰江淹詩晨飇自逺至左右芙蓉披客意已驚秋巢多衆鳥鬭葉密鳴蟬稠苦遭此物聒孰謂吾廬幽洙曰陶淵明詩衆鳥欣有託吾亦愛吾廬水花晚色靜洙曰古今注蓮花一名水旦一名水芝一名水花補注希曰本草水萍一名水花陶隱居云此是水中大萍爾非今浮萍藥録云五月有花白色即非今溝渠所生者楚王渡江所得非斯實庶足充淹留預恐樽中盡更起為君謀楊曰荷花潔靜猶清人之神思只恐樂有餘而杯不足無以延客之歡故云云奉同郭給事湯東靈湫作天寶十三載作補注鶴曰靈湫在驪山溫湯之東梁權道編在天寶十四載然是年之二月祿山反狀已著公十一月往奉先有詠詩厯言驪山遊幸之弊矣此詩未必在其年作當在十三載東山氣濛鴻宫殿居上頭趙曰東山驪山也在長安之東北望雲陽悉見山阜之形而恆若雲霧之中故云氣濛鴻補注希曰東山即驪山天寶元年改為㑹昌山六載治湯井為池環山列宫室又築羅城置百司及十宅開元中幸不専在十月天寶中未嘗不以十月幸故曰君來必十月按獵賦鴻濛沆茫碣以崇山師古曰鴻濛沆茫廣大貌鴻胡孔切濛莫孔切古樂府陌上桑東方千餘騎夫壻居上頭君來必十月樹羽臨九州洙曰湯泉溫泉山上有宫殿天寶中嘗以十月幸之樹羽立羽葆蓋也趙曰言溫湯也長安志云開元後𤣥宗每嵗十月幸溫湯嵗盡而歸詩崇牙樹羽陰火煮玉泉噴薄漲巖幽洙曰溫泉也海賦陽冰不冶陰火潛然修可曰博物志云凡水源有硫黃其泉則溫故云陰火有時浴赤日光抱空中樓洙曰山海經大荒之中暘谷上有扶桑十日所浴又曰日拂于扶桑出于暘谷浴于咸池補注希曰開元十四年十二月乙已日色赤如赭此雖泛言之因書以見日有時赤閬風入轍跡曠原一作野延冥搜洙曰大人賦登閬風而遙集莊子廣莫之野廣原崑崙東北腳名也趙曰崑崙一名閬風其義則周穆王欲車轍馬跡遍天下之意謂之欲冥搜蓋言乘輿自驪山而出若將訪崑崙而遊廣原也沸天萬乘動洙曰沸一作拂觀水百丈湫洙曰前漢郊祀志湫淵祀朝那注水清徹可愛不容穢濁龍之所居趙曰鮑明逺羌城賦歌吹沸天言其聲之多補注希曰萬乘天子之軍言𤣥宗幸湯泉時觀此龍湫幽靈新可怪洙曰幽靈一作靈湫王命官屬休初聞龍用壯洙曰大壯九三小人用壯擘石摧林丘洙曰謝惠連詩落雪灑林丘中夜窟宅改移因風雨秋趙曰天台山賦序靈仙之所窟宅倒懸瑶池影洙曰漢郊祀志谷永云登遐倒景覽觀縣圃如淳曰在日月之上反從下照故其景倒大人賦貫列缺之倒景趙曰此以狀湫之深廣險激公詩又於過驪山之下曰瑤池氣鬱律舊注引倒景以證倒懸非是屈注蒼江流味如甘露漿揮弄滑且柔翠旗淡偃蹇洙曰九歌靈旗偃蹇兮姣服枚乘七發旌旗偃蹇相如賦建翠華之旗注以翠羽為旗上葆也趙曰蒼江當作滄謝眺詩回暾滄江流揮弄出郭璞賦揮弄灑珠滑且柔取周禮柔而滑雲車紛少留薛曰楚辭乘回風兮載雲車簫鼓蕩四溟洙曰漢武帝簫鼓鳴兮發棹歌顔延年笳鼓震溟洲異香泱漭浮鄭曰泱烏朗切漭模朗切洙曰木𤣥虛海賦泱漭浮七啓入乎泱漭之野蛟人獻微一作徵綃洙曰吳都賦泉室潛織而卷綃注云鮫人織輕綃於泉室以賣之趙曰鮫人水居南海之外有之善織綃曾祝沈豪牛魯曰穆天子傳賜文山之民豪牛豪馬補注希曰祝謂祝史漢郊祀志使先聖之後能知山川敬於禮儀明神之事者以為祝師古曰祝謂主祭祀之贊辭者沈牛雖見司馬相如賦而注以為水牛當是祭龍以牛沈之於水百祥奔盛明古先莫能儔陂陀金蝦蟆魯曰相如哀二世賦登陂陀之長阪補注希曰陂陀二字先見子虛賦罷池陂陀下屬江河陂音婆師古曰音普何反出見蓋有由曾曰小說有人夜見林中光屬天上如月迹而視之有一金背蝦蟆趙曰唐五行志有載蝦蟆色如金者或云驪山上有古碑載之矣至尊顧之笑王母不遣一作肯收洙曰大人賦吾乃今日覩西王母皓然白首載勝而穴處兮亦幸有三足烏為之使復歸虛無底化作長黃虬一作龍與虬飄飄青璅郎洙曰初秦漢别給事黃門之職後漢併為一官故有給事黃門侍郎掌從左右給事中使開通中外及諸王朝見於殿上引王就座日暮入對青瑣門拜故謂之夕郎宫關簿曰青瑣門在南宫衛瓘注吳都賦曰青瑣户邊青鏤也文采珊瑚鉤洙曰西域傳罽賔國出珊瑚本草云生海底枝柯狀明潤如紅玉蘇曰相如見枚叔文謂友人曰如珊瑚之鉤璠璵之器非世間尋常所見也趙曰以明潤如玉故比人之文采也珊瑚鉤出纂典記載嵩嶽嫁女事云周穆王把酒請王母歌以珊瑚鉤擊杯而歌師曰郭給事能為文章如珊瑚之可貴浩歌緑水曲清絶聽者愁洙曰馬季長笛賦中取度於白雪緑水注二曲名嵇叔夜琴賦初涉緑水中奏清徵蘇曰元溫月下聞笛其聲清絶同舟數人倚檣聽久愁思浩然師曰緑水即伯牙髙山流水之音後世製為法曲名曰緑水言給事歌詩清雅絶倫聽者愁莫能及也終又叙給事文章收功之意夜聽許十誦詩愛而有作天寶十四載作補注鶴曰天寶十四載長安作從舊次許十當是居五臺學佛者故云業白出石壁許生五臺賔業白出石壁洙曰河北有五臺山鄭曰五臺山名今在河北其山五巒環秀巍然俗謂之五臺仙人之都也趙曰此言許生客居五臺行業精白而出也佛經以美業為白惡業為黑達磨嘗曰當勤修白業大觀曰石壁字暗使列子載趙襄子狩於中山有一人從石壁出隨煙上下補注鶴曰代州有五臺縣又有五臺山旌異記曰鴈門有五臺山山形五峙白業出楞嚴經又法華經云一切衆生作黑業者黑業相續作白業者白業不斷余亦師粲可身猶縛禪寂洙曰師粲善詩修可曰粲可乃六祖僧粲及慧可二禪師乃禪中祖師故子美師之非師粲善能詩者也趙曰粲則僧粲可則慧可傳燈云正與達磨世次相接公方與許生共學性空事故云許生已業白而出吾猶縛禪空而未脫也縛字出佛書其語曰貪著禪味是菩薩縛縛則不能解也補注希曰傳燈録志云歌律師詩律自縛何階子方便謬引為匹敵趙曰此言有何因階得子垂方便之行而以為之匹也舊注以為田子方非離索晚相逢包蒙欣有擊洙曰易九二包蒙上九擊䝉誦詩渾一作混遊衍四座皆一作俱辟易洙曰項羽傳人馬俱驚辟易數里應手看捶鉤鄭曰捶子果切又之纍之睡二切洙曰莊子知北遊大馬之捶鉤者年八十矣而不失豪芒大馬曰子巧歟曰臣有守也臣之年二十而好捶鉤於物無視也非鈎無察也是用之者假不用者也以長得其用而况乎無不用者乎物孰不資焉趙曰莊子輪扁斫輪得之於心應之於手清心聽鳴鏑洙曰前漢胸奴傳冒頓作鳴鏑出獵左右皆隨鳴鏑而射殺頭曼應劭曰髐箭也鄭曰鏑丁厯切矢鋒也精微穿溟涬鄭曰溟亡頂切涬户頂切洙曰莊子大同乎涬溟注與物無際趙曰帝系譜曰天地初起溟涬濛鴻舊注引莊子終非本出杜公不敢倒用也師曰謂詩之精微與天地之氣相貫穿飛動摧霹靂洙曰公羊注曰雷疾而甚者為震震與霆皆謂霹靂也陶謝不枝梧洙曰陶潛謝𤣥暉靈運惠連之徒項籍傳諸將讋服莫敢枝梧臣瓚曰小柱為枝斜柱為梧師曰霹靂雷霆之威謂詩思飄然飛動雖霹靂之威亦為摧沮也風騷共推激紫鸞自超詣洙曰紫鸞當作紫燕字之誤也西京雜記文帝自代還有良馬九其第五馬名紫燕翠駮誰剪剔洙曰爾雅駮如馬鋸牙食虎豹君意人莫知人間夜寥闃蘇曰羲之一日披襟立池上無語羊欣曰人莫知君意何也趙曰寥闃寂靜之義橋陵詩三十韻因呈縣內諸官天寶十三載作鮑曰開元三年六月睿宗崩十月葬橋陵公故有是詩師曰天子之墳曰山陵取其髙大之義補注鶴曰橋陵在奉先西北三十里梁權道編在天寶十四載然公以十四載十一月往奉先而此詩云廨宇容秋螢又不言祿山之事但言荒嵗兒女瘦當是十三載物價暴貴人多乏食時往見諸官而作此詩先帝昔晏駕洙曰漢天文志宫車晏駕注天子當晨起早作而方崩殞故稱晏駕者凡臣子之心猶謂宫車晚出也趙曰先帝指言睿宗也兹山朝百靈洙曰海賦竭盤石栖百靈崇岡擁象設沃野開天庭洙曰張平子西京賦廣衍沃野夢符曰右按楚詞招魂象設君室靜安間些即事壯重險洙曰易習坎重險也天台賦履重險而逾坂沈休文云即事既多矣論功超五丁洙曰蜀王本紀曰天為蜀王生五丁力士能徙山補注鶴曰寰宇記云蜀王開明下五葉有開明尚始立宗廟時天生五丁能徙山每一王死輒為立大石長三丈重千鈞為墓志今賦橋陵故云坡陀因厚地洙曰相如二世賦登陂陀之長坂却略羅峻屏修可曰孫綽詩逺山却略羅峻屏雲闕虛冉冉洙曰天台賦雙闕雲竦以夾路風松肅泠泠洙曰顔延年拜陵廟詩松風遵路急離騷士諌下泠泠而來風石門霜露白玉殿莓苔青洙曰孫綽賦踐莓苔之滑石宫女晚知曙祠官朝見星洙曰以其勤恪而䖍於從事也空梁簇畫㦸修可曰隋薛道衡空梁落燕泥陰井敲銅瓶中使日相繼補注希曰自唐以來內官謂之中使惟王心不寧豈徒恤備享尚謂求無形趙曰禮記備物之享禮云視於無形孝理敦國政神凝推道經洙曰莊子用志不分乃凝於神瑞芝産廟柱好鳥鳴一作巢巖扃修可曰曹子建詩好鳥鳴髙枝髙嶽前嵂崒洪河左瀅濴鄭曰上烏定切下于扃切小水也洙曰西都賦右界褒斜龍首之險帶以洪河涇渭之川趙曰髙嶽指嵩山也洪河指言橋陵之左是洪河所過也金城蓄峻趾洙曰班固賦建金城之萬雉乃鑿墉之趾以益其髙也修可曰金城地名漢地理志秦地西有金城武威唐以金城為蘭州郡公以金城對沙苑其為地名可知補注鶴曰金城本隋始平縣景龍四年中宗送金城公主入蕃别於此因改為金城縣屬京兆華州亦有金城宫武德二年廢顯慶三年復置與橋陵近故應指此而言如修可所注非寰宇記云沙苑交回汀補注鶴曰沙苑一名沙阜在馮翊縣南十二里即西魏文帝大統三年周太祖為相國與髙歡戰于沙苑大破之以其戰處宜六畜置沙苑監多植栁於苦泉側置羊牧唐六典沙苑監掌牧養隴右諸牧牛羊監同州馮翊朝邑兩縣界寰宇記又云沙苑古城在朝邑縣南十七里又按唐髙祖武德七年校獵沙苑永與奧區固洙曰西都賦防禦之阻則天地之奧區焉川原紛眇冥居然赤縣立洙曰張衡慮圖曰崑崙東有赤縣之州風雨有時寒暑有節史記鄒衍著書云中國名赤縣內自有九州外亦如赤縣州者有九趙曰蒲城縣本屬同州開元四年以縣之豐山建睿宗橋陵改為奉先縣仍𨽻京兆府十七年升為赤故公詩言赤縣舊注引崑崙東有赤縣非是補注希曰舊史奉先縣以管橋陵開元十七年制官員同赤縣寶應二年又置𤣥宗泰陵於縣東北按舊史上皇親拜五陵至橋陵見金粟山上有龍蟠鳳翥之勢謂侍臣曰吾千秋後當葬此地後以廣德元年二月辛酉葬廣德元年即寶應三年也是年十一月改為廣德臺榭爭岧亭洙曰江淹詩岧亭南樓期官屬果稱是聲華真可聽蘇曰二陸聲華使人可服王劉美竹潤洙曰爾雅東南之美有㑹稽之竹箭焉晉江遁竹賦有嘉生之美竹裴李春蘭馨洙曰說文蘭香草也鄭氏才振古洙曰詩振古如兹注振自也啖侯筆不停啖杜覽切洙曰王劉裴李鄭啖皆當時赤縣官也趙曰禰正平鸚鵡賦序筆不停綴遣辭必中律洙曰陸士衡文賦放言遣辭良多變矣利物常發硎鄭曰硎奚經反硎石也洙曰莊養生篇庖丁為文惠君解牛文惠君曰嘻善哉技蓋至此乎庖丁對曰臣之刀十九年而所解數千牛矣而刀刃若新發於硎綺繡相展轉琳琅愈一作逾青熒洙曰禹貢雍州厥貢球琳琅玕注皆玉名西都賦琳珉青熒側聞魯恭化洙曰後漢魯恭為中牟令専以德化為理秉德崔瑗銘洙曰後漢崔瑗髙於文辭今座右銘傳於世太史候鳬影王喬隨鶴翎見終明府水樓并昔遊詩注朝儀限霄漢趙曰此公之自述也知縣入朝矣而公不得預朝此所以自嘆耳客思回林坰洙曰謝靈運詩相送越林坰趙曰爾雅林外謂之坰轗軻辭下杜洙曰孝宣紀尤樂杜鄠之間率常在下杜師古曰下杜即今之杜城飄颻凌濁涇吕曰詩涇以渭濁補注希曰唐志關內大川涇渭公自杜陵往奉先故度涇水潘嶽賦此有清渭濁涇鶴曰涇水本濁而後人襲舛多以為涇清詩云涇以渭濁猶謂涇以渭而見其濁也初非言渭濁諸生舊短褐趙曰使貧者衣短褐也旅泛一浮萍洙曰古詩泛泛江漢萍漂蕩水無根王逸曰自比如萍隨水浮游荒嵗兒女瘦暮途涕泗零吕曰漢主父偃曰日暮途逺吾故倒行而逆施詩涕泗滂沱主人念老馬洙曰韓詩外傳曰昔者田子方出見老馬於野喟然有志問於御者曰故公家畜也罷而不為用故故出田子方曰少盡其力而老棄其身仁者之不為也束帛贖之窮士聞之知所歸心焉廨宇容秋螢流寓理豈愜趙曰謝靈運擬王粲詩序云家本秦川貴公子遭亂流寓自傷情多也窮愁醉未醒修可曰史記虞卿非窮愁亦不能著書以自見於後世何當擺俗纍浩蕩乘滄溟蘇曰蘇勛何時擺脫俗纍乘一葉泛滄溟之浩蕩偃仰視八極挹瓊漿丹砂吾志足矣沙苑行天寶十三載作補注鶴曰當是天寶十三載羣牧都使奏就羣校交㸃馬時作而梁權道編在天寶十四載其年祿山反狀已成上下交憂果如詩史云薊北反書未聞已逸身畿甸則是時豈復誇詠苑馬如是也君不見左輔白沙白如水繚以周牆百餘里洙曰前漢京兆尹左馮翊右扶風謂之三輔班固西都賦有上囿禁苑繚以周牆四百餘里其中乃有大宛之馬百官公卿表注馮輔也翊左也三輔故事曰上林連綿四百餘里補注鶴曰唐志同州馮翊郡左輔苑在馮翊故云寰宇記云一名沙阜在馮翊縣南十二里即西魏文帝大統三年周太祖為相國與髙歡戰于沙苑以其戰處宜六畜置沙苑多植栁於苦泉側置羊牧餘見上注龍媒昔是渥窪生汗血今稱獻於此洙曰前漢禮樂志天馬徠龍之媒元狩三年馬生渥窪水中作天馬歌曰霑赤汗沫流赭神異經大宛馬蹄如汗腕可握日行千里至日中汗血乘者當以綿絮纒頭苑中騋牝三千匹洙曰詩定之方中騋牝三千毛氏注馬七尺曰騋騋馬牝馬也風俗通曰馬一匹俗說相馬及君子與人相匹或曰馬夜行目明照前四丈故曰一匹或說馬死賣得一匹帛或云春秋左氏說諸侯相贈乘馬束帛帛為匹與馬之相匹耳豐草青青寒不死洙曰詩湛湛露斯在彼豐草古詩青青河畔草食之豪健西域無食音嗣趙曰寒時草當死而沙苑之地宜草雖寒而不死以之食馬則豪健雖西域出馬之地亦無此豪健也每嵗攻駒冠邊鄙洙曰攻一作牧周禮夏官廋人掌十有二間之政教以阜馬佚特教駣攻駒注攻駒乘其蹄齧者間之又校人春執駒鄭司農云執駒無令近母攻駒也二嵗曰駒三嵗曰駣月令仲夏頒馬政注云教駣攻駒之類也王有虎臣司苑門入門天廏皆雲屯洙曰矯矯虎臣西都賦披飛廉入苑門劉表傳雲屯冀馬陸機詩胡馬如雲屯補注希曰列子言北人之居望之若雲屯然驌驦一骨獨當御鄭曰上息逐切下色莊切洙曰左傳定三年唐成公如楚有兩驌驦馬春秋二時歸至尊趙曰虎臣所掌之馬雖多而其中唯驌驦一種之骨充御故一年之中春秋兩次進之舊注引周禮日中而出日中而入注春分出之秋分入之非是至尊內外馬盈億伏櫪在坰空大存洙曰開元初牧馬二十四萬匹十三年加至四十五萬匹魏武云老驥伏櫪志在千里詩魯頌駉駉牡馬在坰之野趙曰言櫪中坰外空大存之而不如驌驦之駿異也補注鶴曰唐㑹要天寶十三載隴右羣牧都使奏差張通儒鄭遵意交㸃三十三萬五千七百九十二匹內二十萬八千一匹草馬又王毛仲傳初監馬二十四萬後乃至四十三萬牛羊皆數倍從帝東封取牧馬數萬馬每色一隊相間如錦繡其曰盈億詩人夸大之辭也逸羣絶足信殊傑洙曰顔延年賦伊逸倫之妙足魏文帝與孫權馬書曰此馬善中國雖饒馬其如此絶足亦少曹毗馳馬射賦何逸羣之奇駿倜儻權奇難具論鄭曰上他厯切下他朗切不羈也洙曰禮樂志俶儻精權奇顔延年賦雄志倜儻精權奇纍纍塠阜藏奔突塠都回切往往坡陀縱超越洙曰列仙傳蘇耽騎鹿遇險絶處能超越語人曰龍也趙曰言沙苑之地其髙者塠阜則馬之奔突可藏其稍峻處陂陀則馬能超越以美馬之適性且材健也文選凌邁超越角壯翻同麋鹿遊洙曰顔延年賦分馳迥場角壯永埒前漢伍被傳見麋鹿遊姑蘇臺浮深簸蕩黿鼉窟洙曰龎公傳栖黿鼉穴於深淵之下師曰此篇甫寓意於祿山而為之若曰唐家諸將為不少𤣥宗皆以凡材視之獨以兵權委之祿山甚見寵貴故云驌驦一骨獨見御終使祿山難制奔突超越一旦反於范陽河北為之震蕩豈非簸蕩黿鼉窟乎泉出巨魚長比人丹砂作尾黃金鱗師曰甫既以馬比祿山又以魚比史思明蓋思明乃祿山將相繼而叛故甫託意焉豈知異物同精氣雖未成龍亦有神趙曰龍或魚所化或馬所為故異物同精氣也出易精氣為物舊注引原蠶事非是驄馬行天寶十四載作彥輔曰太常梁卿敕賜馬也李鄧公愛而有之命甫製詩補注鶴曰此詩乃天寶十四載作鄧公馬癖人共知洙曰晉杜預為春秋傳時王濟解相馬又甚愛之而和嶠頗聚斂預常稱濟有馬癖嶠有錢癖武帝謂預曰卿有何癖曰臣有左傳癖趙曰馬乃梁卿受賜於君不可以豫人鄧公愛而取之非是故公詩以馬癖譏之也初得花驄大宛種洙曰西域傳大宛國多善馬嶠山上有馬不可得因取五色牝馬置其下與集生駒號天馬子補注希曰太宗常所乘馬有名玉花驄者又洛中記異天寶中大宛進汗血馬其六曰桃花叱據明皇製名百花輦其此種歟夙昔傳聞思一見希聲曰南史蕭摩訶千聞不如一見牽來左右神皆竦雄姿逸態何崷崒上自秋切下昨沒切洙曰顔延年賦弭雄姿以奉引西都賦巖峻崷崒傅𤣥鷹賦雄姿邈世逸氣橫生顧影驕嘶自矜寵趙曰在人有顧影自憐者矣在馬亦宜然故使自矜寵也隅目青熒夾鏡懸洙曰顔延年賦雙瞳夾鏡兩􅀈協月又睨影髙鳴西都賦琳珉青熒趙曰張衡西京賦猛毅䯱髵隅目髙匡注云隅目謂目有角也肉駿碨礧連錢動碨烏罪切礧力罪切洙曰爾雅青驪鄰驒今連錢驄也梁帝紫騮馬詩金絡飾連錢蘇曰余在岐下見秦州進一馬騣如生項下重胡側立倒毛生肉端蕃人云此肉騣也乃知鄧公驄馬行肉駿當作肉騣朝來少試華軒下未覺千金滿髙價洙曰韓子馬似鹿者直千金又漢使壯士持千金請宛善馬江淹詩許史乘華軒補注鶴曰𢎞執恭詩馬鞚千金驄赤汗微生白雪毛洙曰東觀漢記曰武帝歌天馬霑赤汗今親見其然血從前髆上小孔中出銀鞍却覆香羅帕洙曰徐敬業詩汗馬躍銀鞍周𢎞正詩銀鞍耀紫韁卿家舊物公能取一作有之天廏真龍此其亞洙曰周禮凡馬八尺以上為龍趙曰天廏真龍乃天子所御之馬也非天子所賜不得而有之晝洗須騰涇渭深朝趨可刷幽并夜洙曰顔延年賦旦刷幽燕晝秣荆楚吾聞良驥老始成此馬數年人更驚豈有四蹄疾如鳥洙曰七命曰驚紅陽之飛燕驂唐公之驌驦馬融曰驌驦馬也不與八駿俱先鳴洙曰穆天子傳曰八駿赤驥黑驪白義渠黃驊騮騄耳時俗造次那得致雲霧晦冥方降精洙曰春秋考異記曰地生月精為馬月數十二故馬十二月而生修可曰有雲霧而降精此所以為神異瑞應圖曰龍馬者河水之精近聞下詔喧都邑肯使騏驎地上行彥輔曰肯使一作知有趙曰將下詔取之為天子之御矣希聲曰末章歸功于鄧公以此馬喻鄧公非塵世所能容只恐天詔一下騰踏帝庭矣去矣行廣德二年作鮑曰天寶十四載嵗次乙未公年四十四在率府數上賦頌不䝉采録欲辭職遂作去矣行師曰此詩為嚴武作補注鶴曰梁權道編在天寶十四載長安詩內與鮑注同豈非以明朝且入藍田山故云然味君不見鞲上鷹一飽則飛掣焉能作堂上燕銜泥附炎熱豈是在長安時語公在長安上賦投詩唯恐君相莫我知而卒無其遇豈類鞲鷹之飽未免如附炎之燕當是廣德二年在嚴武幕中作所以永泰二年正月遂歸溪上入藍田山云者止是承上餐玉之句耳非真去為藍田之人也師注為是君不見鞲上鷹鄭曰鞲古侯切射臂決也一飽即飛掣尺列切洙曰鮑明逺詩昔如鞲上鷹今似檻中猿魏志吕布因陳登求徐州牧不得布怒登喻之曰登見曹公言待將軍譬如養虎當飽其肉不則噬人公曰不如卿言譬如養鷹飢則為用飽則揚去布乃解史滑稽傳注鞲臂捍也焉能作堂上燕銜泥附炎熱洙曰古詩翩翩堂前燕又思為雙飛燕銜泥巢君室湛萬古懷春賦燕銜泥而來往附炎附勢也趙曰如鷹之飽而髙不學燕之戀而附此賢人義士不阿附於權貴之門也野人曠蕩無靦顔鄭曰靦他典切豈可久在王侯間蘇曰江淹曰野人疏散曠蕩無名利拘繫靦顔見公等趙曰野人公自謂也字出左傳野人豫之云曠蕩者以言懷抱之間曠也公無慙顔豈肯曳裾於王侯之間乎沈休文奏彈王源明月曠顔曾無愧畏未試囊中餐玉法明朝且入藍田山洙曰周禮天官玉府王齊則供食玉注玉是陽精之純者食之以禦水氣鄭司農云王齊當食玉屑前漢地理志藍田山出美玉在長安李預傳預居長安每羡古人餐玉之法乃採訪藍田躬往攻掘得若環璧雜器形者大小百餘稍得粗黑者亦篋盛以還而至家觀之皆光潤可玩預乃椎七十枚為屑日服食之自京赴奉先縣詠懷五百字天寶十四載作洙曰天寶十四載十一月初作奉先屬京兆郡緣皇家陵寢武后分置醴泉縣鄭曰唐開元四年改同州蒲城為奉先以奉睿宗橋陵師曰甫時妻子在奉先縣故甫往省家焉祿山反作此補注鶴曰吕汲公蔡興宗魯訔梁權道皆謂在天寶十四載十一月作今考詩中但言逺戍之卒及述歡娛聚斂以致亂之因而不及祿山之事豈非祿山反書未至時賦此唐史拾遺云祿山反書未聞公已潛畿甸或是杜陵有布衣老大意轉拙洙曰前漢地理志杜陵屬長安京兆尹注古杜伯國漢宣帝葬此因曰杜陵長安南五十里趙曰杜陵公所居之地許身一何愚竊比稷與契蘇曰子美自許稷契人未必許也然其詩曰舜舉十六相身尊道何髙秦時用商鞅法令如牛毛此是稷契輩口中語也居然成濩落洙曰莊子瓠落無所容猶郭落也落零落也濩胡落切白首甘契濶洙曰擊鼓詩死生契濶毛氏曰契闊勤苦也陸士衡贈弟士龍詩安得攜手俱契闊蓋棺事則已大臨曰劉毅云丈夫兒蹤迹不可尋常便混羣小中蓋棺事方定矣此志常覬豁窮年憂黎元嘆息腸一作腹內熱洙曰孟子不得於君則熱中謝靈運詩窮年迫憂患取笑同學翁浩歌彌激烈洙曰蘇武長歌正激烈中心愴以摧補注希曰楚辭少司命浩歌晃兮激烈非無江海志瀟灑送一作迭日月洙曰莊子身居江海之上心游魏闕之下生逢堯舜一作為君不忍便永訣洙曰江淹賦誰能寫永訣之情者乎當今廊廟具構夏豈云缺洙曰叔孫通傳贊廊廟之材非一木之枝潘尼詩廣厦構衆材又大厦須異材廊廟非庸器潘安詩器非廊廟姿屢出固其宜葵藿傾太陽物性固莫一作難奪洙曰曹植求通親表若葵藿之傾太陽雖不為回光然向之者誠也陸機園葵詩朝榮東北傾夕穎西南晞顧惟螻蟻輩但自求其穴胡為慕大鯨輒擬偃溟渤洙曰木𤣥虛海賦其魚則橫海之鯨突杌孤遊戛巖㟼偃髙濤趙曰韓非子千丈之堤以螻蟻之穴漬求其穴言當自安分求穴以安耳何為必欲慕學大鯨之處大海乎以兹悟生理獨恥事干謁兀兀遂至今忍為塵埃沒終愧巢與由朝曰巢父許由也未能易其節沈飲聊自遣洙曰顔延年詠劉參軍詩韜精日沈飲放歌頗愁絶嵗暮百草零疾風髙岡裂洙曰長門賦天飄飄而疾風阮籍詩寒風振山岡天衢陰崢嶸洙曰易何天之衢亨客子中夜發洙曰江淹詩客子淚已零王粲詩客子多悲傷霜嚴衣帶斷指直不得結凌晨過驪山御榻在嵽嵲洙曰西京賦託喬基於山岡直嵽霓以髙居驪山溫湯博物志凡水源有石硫黃其泉則溫漢武帝故事云驪山溫湯初秦始皇砌石起室漢武帝又加修飾唐置溫湯監𨽻司農補注鶴曰按唐志驪山在昭應縣有宫在山下咸亨二年始名溫泉天寶元年更驪山曰㑹昌山七載又更曰昭應明皇開元天寶間無嵗不幸溫泉故云御榻在嵽嵲也蚩尤塞寒空蹴踏崖谷滑鄭曰蹴七六切踏也洙曰史黃帝殺蚩尤於涿鹿後冡上常有赤氣出如匹絳帛民呼為蚩尤旗又星名趙曰蚩尤乘輿前導之旗也塞寒空而蹴踏崖谷言多也舊注引蚩尤戰又指星名非瑶池氣鬱律羽林相摩戛洙曰穆天子傳觴王母于瑶池之上漢宣帝紀羽林孤兒注天有羽林大將之星林喻若林木之盛羽若羽翼鷙擊之意張平子西京賦隱轔鬱律趙曰羽林扈駕之軍其所樹之如林故言相摩戛補注鶴曰按志京兆有蚩尤冡或謂其冡之髙至塞寒空然詩意未必指此趙以為乘輿前導之旗乃是蓋本所謂駕以蚩尤之旗也瑶池即新史所謂湯泉為池環山列宫室之築羅城置百司十宅㑹要云左右羽林軍垂拱元年五月二十七日置領羽林郎六千人至天授二年二月三十日又改為左右羽林衛君臣一云聖君留歡娛洙曰張景陽詩朝野多歡娛江淹詩太平多歡娛樂動殷膠轕修可曰當作膠葛相如子虛張樂乎膠葛之㝢曾曰甘泉賦其相膠轕蓋亂貌賜浴皆長纓洙曰江淹詩長纓皆俊乂陸機詩長纓麗且鮮與宴一作宴非短褐彤庭所分帛本自寒女出洙曰趙皇后傳庭中彤朱而殿上髹漆西都賦玉階彤庭郭泰機詩皎皎白素絲織為寒女衣寒女雖妙巧不得秉杼機趙曰彤庭天子之庭以丹飾之也鞭撻一作箠其夫家聚斂貢城闕聖人筐篚恩實一作願欲邦國活洙曰鹿鳴又實幣帛筐篚以將其厚意逸曰南史王廣之子珍國字德重為南淮太守郡境苦飢乃發粟散財以賑窮乏髙帝手敕云卿愛人活國甚副吾意臣如忽至理君豈棄此物多士盈朝廷仁者宜戰栗洙曰詩濟濟多士語使民戰栗趙曰上句皆申戒之辭謂當君王賜豫之幣帛出於寒女之夫鞭撻所貢宜戰栗而求活國之事然後為仁也况聞內金盤盡在衛霍室洙曰內金盤上方器用也衛霍室勳臣家也趙曰衛霍皆以后戚而貴蓋以比楊國忠輩矣中堂有神仙煙霧䝉玉質暖客一云暖䝉貂鼠裘洙曰魏書曰鮮卑有貂鼠子皮毛柔軟故天下為裘悲管逐清瑟勸客駝蹄羮蘇曰陳思王製駝蹄羮一甌費千金自勸陳琳劉公幹輩食後號為七寶羮霜橙壓香橘洙曰橙出穰縣者勝蜀中有給客橙似橘而非若柚而香朱門酒肉臭路有凍死骨洙曰孟子庖有肥肉廏有肥馬民有飢色野有餓莩蘇曰吳起朱門大路酒肉臭不可過焉知凍死者盈路餓而填溝壑者不忍視榮枯咫尺異惆悵難再述北轅就涇渭官渡又改轍洙曰官渡地名曹操袁紹相持之處羣水從西下極目髙崒兀疑是崆峒來恐觸天柱折洙曰列子湯問共工氏與顓頊爭為帝怒而觸不周之山折天柱絶地維故天傾西北日月星辰就焉地不滿東南故百川水潦歸焉史記黃帝西至于崆峒韋昭曰在隴右河梁幸未拆枝撐聲窸窣上息七切下蘇骨切行旅相攀援川廣不一作且可越老妻寄異縣十口隔風雪洙曰古樂府他鄉各異縣展轉不相見誰能久不顧庶往共飢渴入門聞號咷幼子飢一作餓已卒洙曰易同人先號咷後笑吾寧捨一哀里巷猶嗚咽所愧為人父無食致夭折豈知秋未一作禾登貧窶有倉卒補注希曰光武詔倉卒蕪蔞亭云云生常免租稅名不𨽻征伐撫迹猶一作獨酸辛平人固騷屑洙曰劉越石備辛酸之苦默思失業途一作徒因念逺戍卒憂端齊一作際終南澒洞不可掇澒胡孔切掇都活切趙曰淮南子曰未有天地鴻濛澒洞莫知其門師曰甫念彼逺戍之兵其積憂悶與山齊髙奈天下澒洞未可遽掇而絶之也澒洞亂貌補注希曰許慎注淮南子云澒讀如項羽之項洞讀如同遊之同今諸韻切蓋云水銀也當從許注及淮南子說說文獨孤及觀海詩澒洞吞百谷周流無四垠白水縣崔少府髙齊三十韻天寶十五載作洙曰天寶十五載五月作白水屬馮翊郡同州秦文公分清水為白水即漢彭衙鮑曰肅宗元年乃明皇天寶十五載也嵗次丙申五月公年四十有五在奉先以舅崔氏為白水縣尉故適白水有是詩鄭曰十道志同州白水漢栗邑南界臨白水魏文改為此縣補注鶴曰按舊史云白水隋縣公以天寶十五載夏自奉先來依舅氏崔十九故首曰客從南縣來况當朱夏赫此詩當在是年五月詩云知是相公軍鐵馬雲霧積指哥舒翰軍未敗而言也六月丙戌翰與祿山戰于靈寶西原敗績客從南縣來浩蕩無與適洙曰古詩客從逺方來蘇曰姚萇云四溟浩蕩困鱗無所適耳補注希曰白水在同州西北一百二十里而同州又在京兆東北二百五十里公自奉先來故以奉先為南縣旅食白日長洙曰唐書朱克融輩皆旅食長安况當朱炎赫髙齊坐林杪鄭曰亡沼切木末也信宿遊衍闃洙曰左傳再宿曰信鄭曰衍于線切闃苦激切寂靜也清晨陪躋攀傲睨俯峭壁睨五計切洙曰海賦馮夷俯浪以傲睨崇岡相枕帶曠野懷一作回咫尺洙曰嵇康賦託峻嶽之崇岡始知賢主人贈此遣愁寂危階根青冥曾冰生浙􅅹洙曰招魂層冰峩峩謝惠連雪賦霰淅􅅹而生集趙曰青冥者青雲杳冥之際楚辭據青冥而攄虹上有無心雲下有欲落石泉聲聞復息動靜隨所激蘇曰郭伋曰君不見幽谷之鐘而不自鳴人擊即聲人之動靜亦隨所擊然後應之也鳥呼藏其身有似懼彈射食亦切吏隱適一作通情性洙曰王喬梅福皆吏隱也補注希曰汝南先賢傳郭欽吏隱于蟻陂之陽兹焉其窟宅洙曰海賦瑰奇之所窟宅天台賦靈仙之所窟宅白水見舅氏洙曰左傳晉文公謂子犯曰所不與舅氏同心者有如白水投其璧於河內薛曰右按子美近體詩有白水明府舅氏宅喜雨詩即知白水者地名非晉文公所謂白水明矣諸翁乃仙伯補注希曰集仙傳大茅君傳有紫陽左公太極仙伯又神仙王知逺母夢靈鳳集因而有娠僧寶志曰生子當為神仙宗伯其後知逺謂弟子曰吾漸遊洞府仙曹除吾為少室仙伯杖藜長松陰修可曰莊子載原憲杖藜應門作尉窮谷僻洙曰梅福作尉人謂之仙尉為我炊雕胡逍遙展良覿洙曰西京雜記太液池邊皆雕胡紫籜緑節之類菰之有米者長安謂為雕胡謝靈運詩引領冀良覿趙曰菰米為飯極滑長安人謂為雕胡出宋玉諷賦曰主人之女為臣炊雕胡之飯勸臣食也補注希曰周禮天官醫師几㑹膳食之宜魚宜苽注云苽雕胡也淮南子原道訓浸潭苽蔣許氏注云浸潭之間以生苽蔣實苽者蔣實也其米曰雕胡爾雅蘧蔬注云似土菌生菰草中菰草根相結而生謂之苽葑至秋結實乃雕胡米也又楚辭招魂五穀六仞設胡粱只注苽粱蔣實謂雕胡也言楚國土地肥美堪用種植五穀又有苽粱之飯又子虛賦東牆雕胡坐久風頗怒晚來山更碧相對十丈蛟歘翻盤渦坼洙曰海賦盤渦谷轉師曰自相對十丈蛟以下寓意於祿山之叛十丈蛟喻祿山也何得空裏雷殷殷尋地脈洙曰殷於謹切詩殷其雷長門賦雷隱隱而響起煙氛藹崷一作􅀢崒魍魎森慘戚崑崙崆峒顛回首如不隔前軒頽一作推反照巉絶華嶽赤洙曰爾雅曰落光反照於東謂之反景劍閣銘云大行孟門豈云巉絶補注希曰同州西與南至華州皆不滿百里故華嶽見於前軒兵氣漲林巒川光雜鋒鏑知是相公軍鐵馬雲霧一作煙積趙曰天寶十四載祿山反帝召哥舒翰守潼關明年拜尚書左僕射故云相公軍也玉觴淡無味胡羯豈强敵長歌激屋梁淚下流衽席洙曰蘇武詩長歌正激烈曹植賦若朝日之照屋梁趙曰黃香天子頌曰獻萬年之玉觴本中曰黃庭內景經淡然無味此言至尊旰食雖御酒而無味然有相公之軍胡羯亦不足敵也晏曰屋梁出宋玉神女賦曰日朝出照屋梁舊注引曹植賦誤矣人生半哀樂天地有順逆慨彼萬國夫休明備征狄一作敵猛將紛填委廟謀洙曰光武明明廟謨蓄長䇿洙曰前漢胸奴傳制百蠻之長䇿劉公幹詩職事相填委東郊何時開洙曰書命畢公保釐東郊帶甲且未釋欲告清宴罷難拒幽明迫三嘆酒食傍何由似平昔程曰魏子曰唯食忘憂三嘆何也曰或賜二小人酒不夕食饋之始至恐其不足是以嘆中置自咎曰豈將軍食之而有不足是以再嘆及饋之畢願以小人之腹為君子之心屬饜而已獻子辭梗陽人趙曰借用閻沒女寬當饋而三嘆今公所歎歎其不若往日太平之時也三川觀水漲二十韻天寶十四載作鮑曰天寶十五載乙亥祿山陷京師公徒步避寇鄜州三川縣有是詩時七月也補注鶴曰三川唐屬鄜郡為洛交郡舊史云華池水黑水洛水之三水㑹同因名鮑注與梁權道所編皆以為天寶十五載作蔡興宗以為五月避地鄜州有此作而魯訔以為七月寓于鄜州有此作然詩云我經華原來按公天寶十四載十一月自京兆之奉先明年夏自奉先之白水賦髙齊詩已是五月又自白水之鄜州故回經華原是年史不書水并雨而今詩言水為甚考彭衙行亦云一旬半雷雨竟日數里間故此詩亦云雲雷屯不已是公去白水北行即值水亦可以補史之闕鄜州在馮翊之北而彭衙亦在馮翊白水縣之北殆是赴靈武時所經如此其曰華原者謂華原郡北至防州百八十里防北至鄜百十里耳馮翊在華原東百八十里豈非公自白水西北至華原又自華原北至防復自防北至鄜也後有玉華宫詩可知至防無疑玉華宫在防州宜君縣我經華原來不復見平陸洙曰華原屬京兆郡後魏置北雍州西魏改為宜州又置北地郡尋改為通川郡武德初復為通州罷郡補注鶴曰唐志義寧二年以華原宜君同官置宜君郡并置土門縣以𨽻之武德元年曰宜州貞觀十七年廢省宜君土門以華原同官𨽻雍州垂拱二年更華原曰永安神龍二年復以永安曰華原天祐三年李茂貞墨制以縣置耀州故九域志云京兆西至耀州百八十里則京兆至華原亦然北上惟土山連天走窮谷火雲無時出洙曰一云出無時魯曰隋盧思道納涼賦火雲赫而四舉飛電常在目自多窮岫雨行潦相豗蹙鄭曰上呼回切相擊也洙曰海賦磊匒匌而相豗蓊匌川氣黃鄭曰上音烏下口答切又音溘匝羣流㑹空曲清晨望髙浪忽謂陰崖踣蒲北切恐泥竄蛟龍泥乃計切登危聚麋鹿洙曰海賦狐玃登危而雍容枯查卷拔樹礧磈共充塞鄭曰查士街切礧洛罪切磈口罪切不平也聲吹鬼神下趙曰礧磈石也聲吹言其聲之吼勢閲人代速不有萬穴歸何以尊四瀆洙曰海賦江河既道萬穴俱流薛曰右按爾雅江河淮濟是為四瀆趙曰公詩作於離亂之中意在衆所歸往以尊王也及觀泉源漲反懼江海覆漂沙圻岸去鄭曰漂匹妙切浮也洙曰海賦飄沙礐石蕩潏島濵潄壑松柏秃洙曰海賦潄壑生角乘凌破山門回斡到地軸洙曰春秋括地象去地有三千六百軸海賦似地軸挺拔而爭回交洛赴洪河及關豈信宿應沈數州沒如聽萬室哭穢濁殊未清風濤怒猶蓄洙曰江賦乃鼓怒而作濤何時通舟車昱曰中庸舟車所至師曰南北阻隔舟車不通而云何時者厭亂願治之辭也陰氣不黲黷鄭曰上千敢切下徒卜切垢黑也趙曰何時得水落而舟車可通且陰氣開朗而不黲黷選有上慘下黷浮生有蕩汩吾道正羈束人寰難容身師曰謂當兵革擾攘吾道拘束不得騁武夫悍卒正得志之秋人寰難容身天地雖大若無所往石壁滑側足雲雷屯不已艱險路更局渠玉切促也普天無川梁欲濟願水縮洙曰魏文帝雜詩欲濟河無梁陸機詩怨彼河無梁引領望大川因悲中林士未脫衆魚腹洙曰詩肅肅兔罝施於中林王康􅀈反招隱今雖盛明世能無中林士屈原答漁父云寧赴湘流葬於江魚腹中舉頭向蒼天安得騎鴻鵠趙曰陸士衡擬西北有髙樓云思駕歸鴻羽大雲寺贊公房四首至德二載作補注鶴曰大雲寺在長安以泱泱泥汚人聽聽國多狗既未免羈絆時來憩奔走知是至德二載陷賊中時作燈影照無睡心清聞妙香修可曰維摩經曰有國名衆香佛號香積其界皆以香作樓閣其國如來無文字說但以衆香令諸天人得入律行菩薩各坐香樹下聞斯妙香即獲得藏三昧補注希曰增一經有妙香三種謂多聞香戒香施香此三香逆風順風無不聞之最勝無等夜深殿突兀風動金琅璫補注希曰琅璫二字見漢書王莽傳西域傳皆以為長瑣又後漢司徒崔烈以琅璫瑣公今所用非謂瑣自指為鈴鐸故蘇子瞻有風動琅璫月向低之句洪龜父有琅璫鳴佛屋之句要皆本公此詩天黑閉春院地清棲暗芳玉繩回斷絶洙曰玉繩星名鐵鳳森翺翔梵放時出寺鐘殘仍殷床趙曰鐵鳳舊注引陸倕石闕銘銅雀鐵鳳之工其說是蓋施雀鳳於屋脊上者梵放蓋佛事至梵音必唱而誦之故寺外可聞也殷上聲殷其雷之殷補注希曰薛綜西京賦注云圓闕上作鐵鳳凰令兩翼舉頸敷尾東坡詩云鐵鳳橫空飛絲繪又非聽風聲鳴鐵鳳其意若不同明朝在沃野洙曰沃野千里苦是塵沙黃饒曰時西郊逆賊拒官軍未已童兒汲井華慣捷瓶上手修可曰按本草井華水令人好顔色與諸水有異謂井中水平旦第一汲者霑灑不濡地掃除似無帚洙曰周禮宫人凡寢中之事掃除趙曰灑濡地則沮洳掃有帚則除塵根也明霞爛復閣洙曰明一作晨夢符曰廣韻復重也又古詩阿閣三重階補注希曰漢書髙祖從復道上如淳曰復音復上下有道故謂之復阿房宫賦亦云復道行空霽霧搴髙牖修可曰梁元帝詩能令雲霧搴側塞被徑花飄颻委墀栁洙曰九辨云臯蘭被徑兮斯路漸非艱難世事迫蘇曰陳衡曰世路艱難老夫迫於生事隱遁佳期後洙曰郭璞遊仙詩山川隱遁捷晤語契深心那能總鉗口洙曰鉗口結舌蘇曰袁紹曰諸大夫見朝錯總皆鉗口莫敢措一辭今諸侯分土公等何計奉辭還杖䇿暫别終回首洙曰曹操奉辭出征房𤣥齡杖䇿謁軍門王粲詩回首望長安趙曰奉辭相奉而辭别之舊注引奉辭出征其義非泱泱泥汚人聽聽國多狗鄭曰聽魚斤切洙曰九辨猛犬狺狺而迎吠號關梁閉而不通鮑曰天寶十五年七月賊將張通儒收録衣冠汚以僞命不從者殺之公晦迹幽隱故云泱泱泥汚人聽聽國多狗既未免羈一作寓絆洙曰晉慕容垂猶鷹也宜急其羈絆時來憩奔走趙曰於此未免羈絆則亦僅能時來憩息耳近公如白雪執熱煩何有趙曰詩誰能執熱逝不以濯心在水精域洙曰清淨境土也趙曰江總大莊嚴寺碑云光遍水精之域蓋佛寺莊嚴皆以金寶故也衣霑春雨時洞門盡徐步深院果幽期馬曰謝靈運詩平生協幽期師曰甫與贊公有期於洞門徐步以待雖春雨沾衣不為之避禮遇之誠可見矣到一作倒扉開復閉撞鐘齊及兹醍醐長發性洙曰釋經言聞正法如食醍醐然覺範曰世說云淳酪養性人無妬心則醍醐之能發性抑可知已此釋經所以取喻正法也飲食遇扶衰把臂有多日洙曰絶交論把臂之交開懷無愧辭黃鶯度結構紫鴿下罘罳余曰漢文帝紀未央宫東闕罘罳灾師古曰罘罳謂連闕曲閣也以覆重刻垣墉之處其形罘罳然罘罳屏也罘音浮愚意㑹所適花邊行自遲湯休起我病微笑索題詩洙曰沙門惠休姓湯氏善屬文趙曰僧湯惠善詩與文以比贊公也細軟青絲履光明白㲲巾鄭曰㲲達協切毛布也深藏供老宿取用及吾身洙曰以白㲲布為巾以供老宿之物而奉吾所以言其敬時可曰南史髙昌國有草實如繭中絲如細纑名為白㲲國人取織以為布自顧轉無趣交情何尚新道林才不世洙曰支遁字道林有才辨惠逺德過人洙曰髙僧惠逺有宿德雨㵼暮簷竹風吹春一作青井芹天陰對圖畫最覺潤龍鱗師曰天陰對圖畫言二人相對如畫圖中人揚子攀龍鱗潤龍鱗言攀附贊公而有所滋潤也哀江頭至德二載作補注鶴曰至德二載九月癸卯復京師十月壬子復東京而是詩云春日潛行曲江曲當是作於是年春蓋謂之潛行又謂黃昏胡騎塵滿城乃陷賊時所作明矣梁權道亦編在是年少陵野老吞聲哭洙曰野老甫自稱少陵杜陵也春日潛行曲江曲師曰西京雜記京城龍華寺南有流水屈曲謂之曲江在秦時為宜春苑漢時為樂遊苑𤣥宗開元中鑿池引水環植花木為京師勝賞之地遭祿山焚劫之後荒涼可知也江頭宫殿鎖千門細栁新蒲為誰緑洙曰康駢劇談録曲江池本秦愷州開元中疏鑿為妙境花卉周環煙木明媚都人遊玩盛於中和節江側菰蒲葱翠栁陰四合碧波紅蕖湛然可愛唐鄭注傳大和九年注言秦中有災宜興力役以禳之文宗因吟杜甫詩云江頭宫殿鎖千門細栁新蒲為誰緑始知天寶四年曲江四面多樓臺行宫乃敕公卿家住於曲江昆明二池起造亭觀詔神䇿兩軍造紫雲樓綵霞亭內出牌以賜之憶昔霓旌下南苑洙曰宋玉髙唐賦霓為旌唐曲池坊南有南苑苑中萬物生顔色昭陽殿裏第一人鄭曰昭陽漢殿名同輦隨君侍君側洙曰李白詩云漢宫誰第一飛燕在昭陽謂楊妃也輦前才一作詞人帶弓箭洙曰干寶注周禮云對舉曰輦唐制內官才人七人蘇曰晉宣帝出獵長春苑輦前才人皆乘寶馬帶畫弓白羽箭補注希曰漢成帝遊於後庭嘗欲班婕妤同輦載班辭曰云云上善其言而止之唐后妃傳唐因隋制皇后之下有九夫人九嬪及婕妤九人美人九人才人九人寶林二十七人御女二十七人𤣥宗以后下復有四妃非是乃置三妃以代三夫人又置六儀四美人七才人白馬嚼一作噍囓黃金勒翻身向天仰射雲射食亦切一箭一作笑正墜雙飛翼趙曰按明皇雜録上幸華清宫貴妃姊妹各購名馬以黃金為銜勒洙曰西都賦招白鷴下雙鵠又矢不單殺中必疊雙明眸皓齒今何在洙曰曹子建云皓齒內鮮明眸善盼血汚遊魂歸不得蘇曰北齊初大戰纍年不解王襄曰吾親知言為遊魂歸故山不得趙曰公此詩作於至德二載之春血汚遊魂則天寶十五載六月丁酉上皇車駕次馬嵬賜貴妃自盡清渭東流劒閣深去住彼此無消息人生有情淚沾臆江水一作草江花豈終極黃昏胡騎塵滿城欲往城南忘南北洙云一云望城北黃曰甫朝哀江頭暮又聞史思明連結吐蕃入寇欲往城南省家倉皇之際心曲錯亂忘南而走北也甫家居城南哀王孫至德元載作彥輔曰韓信至城下釣漂母哀之飯信信謂漂母曰吾必重報母怒曰大丈夫不能自食吾哀王孫而進食豈望報乎王深父曰安祿山驚潼關𤣥宗倉卒西幸諸嗣王及公主之在外者皆不及從其後多為祿山所屠鮮有脫者此詩記而哀之補注鶴曰詩云切聞太子已傳位當在至德元載七月作詳見注長安城頭頭白烏洙曰或謂頭字當作頸蓋烏無頭白者夜飛延秋門上呼蘇曰神堯初得天下夜有飛鵲數百皆集延秋西門呼鳴至夜分方散補注希曰通鑑云上御勤政樓下制云欲親征皆莫之信移仗北內命陳元禮整比六軍上獨與貴妃姊妹皇子妃王皇孫及親近宦官宫人出延秋門妃王皇孫之在外者皆委之而去是日百官猶有入朝者至宫門猶聞漏聲三衛立仗儼然門既啓則宫人亂出中外擾攘王公士民四出逃竄又向一作來人家啄大屋屋底達官走避胡洙曰唐書木架達官怕趙曰白烏之號不祥也天寶十五載祿山陷潼關明皇幸蜀從延秋門出烏飛號於門上暗言乘輿之出也乘輿既出矣公卿寧不逃避邪金鞭斷折九馬死骨肉不待同馳驅腰下寶玦青珊瑚玦古穴切洙曰左傳晉侯佩太子以金玦可憐王孫泣路隅問之不肯道姓名蘇曰陳遺過武功道中逢異人曰子先辱後榮遺與語答問俱有理遺怪而問姓名居住不答乃長揖下路入竹林中不知所之但道困苦乞為奴趙曰齊建安王子真被誅入牀下叩頭乞為奴贖死不從已經百日竄荆棘身上無有完肌膚髙帝子孫盡隆準龍種自與常人殊洙曰漢髙祖為人隆凖而龍顔應劭注曰隆髙也李斐曰凖鼻也趙曰隋文帝子勇勇子儼雲昭訓所生乃雲定興女文帝喜曰皇太孫何謂生不得其地定興奏曰天生龍種所以因雲而出豺狼在邑龍在野王孫善保千金軀洙曰易龍戰于野光武紀䜟曰四夷雲集龍鬬野趙曰倣陸士衡願保金石軀又沈約雜詩坐喪千金軀補注鶴曰謂安史據兩京而𤣥宗肅宗俱在外也其時王孫在長安者皆未遇害詩故不及之蓋史云天寶十五載八月癸已肅宗即位而通鑑以為七月甲子即位丁卯安祿山使孫李殺霍國長公主及王妃駙馬等己巳又殺皇孫及郡縣主二十餘人不敢長語臨交衢且為王孫立斯須洙曰周禮疏云舞交衢崔豹古今注大注交衢師曰長音仗乃剩言也交衢謂路相交錯要衝之所甫與之問答不敢私言但共立少頃恐為姦人窺伺故也昨夜東一作秦風吹血腥東來槖駝滿舊都洙曰師古曰槖駝言能負囊槖而䭾物也史思明傳祿山陷南京以駝運兩京御府珍寶於范陽不知紀極鮑曰東來槖駝謂賊自東都進也舊都謂長安也朔方健兒好身手補注希曰詩云好人服之注云好人好女手之人昔何勇鋭今何愚洙曰世說桓車騎過江時公私儉薄自使健兒鼓行劫鈔師曰哥舒翰領朔方兵守潼關為賊所敗故云云竊聞天子已傳位洙曰明皇傳位于肅宗聖德北服南單于蘇曰霍光曰聖德北服單于南化蠻貊民俗淳厚士各守職花門剺面請雪恥剺憐題切洙曰時回紇助順師曰南單于即回紇也花門乃回紇地名甫有留花門詩回紇以花門自號剺面謂披其面皮示誠悃也夢符曰後漢耿秉卒胸奴聞之舉國號泣或至梨面流血梨即剺字剺割也古通用慎勿出口他人狙師曰狙竊聽也甫欲王孫慎密其事恐為諜者所得哀者王孫慎勿疏五陵佳氣無時無洙曰漢髙帝葬長陵惠帝葬安陵景帝葬陽陵武帝葬茂陵昭帝葬平陵謂之五陵趙曰後漢王伯阿望舂陵城曰氣佳哉鬱鬱葱葱師曰𤣥宗幸蜀諸王流離不見收録安知五陵佳氣中無天子出乎故以勿疏為戒補注鶴曰五陵謂獻陵昭陵乾陵定陵橋陵舊注引漢五陵非也悲陳陶天寶十五載作鮑曰天寶十五載十月辛丑房琯及祿山戰于陳陶斜敗績癸卯琯又以南軍戰敗績公故有是詩蘇曰琯之敗唐傳作陳陶斜杜詩作陳陶未知孰是琯既敗猶欲持重有所伺而中人促戰遂大敗故後篇云焉得附書與我軍忍待明年莫倉卒補注鶴曰當是天寶十五載十月辛丑房琯陳陶戰敗後作是年十月辛巳朔辛丑乃十月二十一日梁權道編在是年賊陷中詩內蔡興宗就謂冬有悲陳陶悲青坂孟冬十郡良家子洙曰漢趙充國始為騎士以六郡良家子房琯傳十月庚子師次便橋辛丑一軍先遇賊於咸陽縣之陳陶斜接戰琯軍敗績血作陳陶澤中水補注希曰陳陶斜在咸陽縣而公詩止云陳陶蓋斜者山澤之名故又曰陳陶澤野曠一作廣天清一作晴無戰聲四萬義軍同日死洙曰為賊所傷殺者四萬餘人存者數千而已補注鶴曰王洙所注本通鑑按房琯本傳亦云殺卒四萬血丹野殘衆才數千不能軍羣胡歸來血洗箭血一作雪仍唱一作撚箭夷歌飲都市都人回面向北啼日夜更望官軍至洙曰一云前後官軍苦如此王深父序云至德元載宰相房琯以車師戰祿山之黨而陳陶敗績趙曰此言朔方安西回紇大食兵相助討賊然夷狄之性不無殘擾故都人不願胡兵討賊只望官軍至也師曰祿山焚劫暴虐都人怨之而思唐德遂有望官軍之句肅宗一舉而復兩京豈非因民謳吟思唐之心乎悲青坂天寶十五載作補注鶴曰此唐紀所謂癸卯又以南軍戰敗績南軍楊希文所將乃天寶十五載十月二十三日我軍青坂在東門天寒飲馬太白窟魯曰在岐州郿縣去長安三百里補注鶴曰陳希文將軍將南軍自宜夀入宜夀即扶風盩厔縣天寶元年更名曰宜夀太白山亦在扶風郡縣陳陶方敗一日而再戰我氣折而彼方鋭自應復敗史記胸奴傳秦築長城以備胡其下有泉窟可以飲馬征人路出於此而傷悲故釋子蘭陳琳俱有飲馬長城窟詩黃頭奚兒日向西補注希曰奚兒謂祿山所發同羅奚契丹室韋之衆如使何千年髙邈傳奚騎二十及使安志忠將精兵軍士門志忠奚人是也黃頭如所謂黃頭奴黃頭郎數騎彎弓敢馳突洙曰胸奴傳士力能彎弓盡為甲騎趙曰前篇悲陳陶則辛丑之敗也此篇悲青坂則癸卯之敗也以兩敗各散而歸所以言日向西其餘散騎猶敢馳突以言其暴掠不改也山雪河冰野蕭飋青是烽煙白人骨焉得附書與我軍忍待明年莫倉卒趙曰房琯戰於陳陶斜不利猶欲持重而牽於邢延恩所促戰故敗而公詩有忍待明年之戒所以重傷之也補注希曰西京雜記有倉卒客無倉卒主人補注杜詩卷二
