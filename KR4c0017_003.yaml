body:
  text: 補注杜詩卷三宋黃希原本黃鶴補注述懷至德二年作彥輔曰此以下自賊中竄歸鳯翔作晉阮籍嘗作咏懷詩八十餘篇為世所重補注鶴曰公以至德元載陷賊今詩云去年潼關破又云今夏得西走當是二年夏拜拾遺後作故又有涕淚受拾遺之句去年潼關破鄭曰潼徒紅切水名出漢廣上有關名潼關妻子隔絶久洙曰新𤣥宗紀天寶十五年安祿山僭號於東京賊將安慶緒犯潼關哥舒翰軍敗退翰至潼關為其帳下火拔歸仁以左右數十騎執之降賊關門不守京師駭河東華隂上洛等皆委城而走上乃謀幸蜀也補注希曰公陷賊而妻子在鄜州故云隔絶今夏草木長洙曰陶淵明詩孟夏草木長脫身得西走洙曰按新唐書天子幸蜀甫走避三川肅宗立自鄜州羸服奔行在為賊所得至德元年亡走謁帝鳯翔麻鞋見天子蘇曰焦卓見文帝麻鞋烏帽舉動詳正奏對明敏帝呼為高士衣袖露兩肘朝廷慜生還鄭曰慜眉殞切親故傷老醜涕淚受拾遺洙曰按新書言甫至德二年亡走鳯翔上謁授右拾遺補注鶴曰通典云唐武后垂拱中置左右補闕左右拾遺以掌供奉諷諫開元以來尤為清選又蒯通傳拾遺舉過又見汲黯傳流離主恩厚柴門雖得去未忍即開口趙曰不欲遽違天顔也寄書問三川不知在家否洙曰三川在鄜州按本傳甫寄家三川艱窶彌年孺弱至餓死者比聞同罹禍殺戮到雞狗蘇曰黃巾犯渭上雞犬俱殺戮盡數千里斷絶人烟補注希曰通鑑祿山始自京畿部坊至於岐隴皆附之至是西門之外率為敵壘故云山中漏茅屋誰復依户牖摧頽蒼松根地冷骨未朽蘇曰弔王褒文云西山地冷靈骨未朽秀氣矗然君既長卧復鍾後賢其碑斷裂不見完全幾人全性命盡室豈相偶嶔岑猛虎場鬱結回我首自寄一封書今已十月後趙曰十月後非冬之十月也何以明之公往問家屋乃在閏八月初吉耳此詩在閠八月之前所作也反畏消息來寸心亦何有漢運初中興生平老耽酒洙曰魏曹植賦曰若耽於觴酌流情縱佚先王所禁君子所失沈思歡㑹處恐作窮獨叟逼側行乾元元年作彥輔曰贈畢耀一云􅀈􅀈行篇中字亦作􅀈􅀈西征賦駢闐逼側補注鶴曰詩云東家蹇驢許借我泥滑不敢騎朝天當是乾元元年為拾遺在京師作逼側何逼側修可曰西京賦駢羅逼側補注希曰子虛賦逼側泌郎我居巷南子巷北可恨鄰里間十日不一見顔色洙曰江淹古别離詩願一見顏色不異瓊枝樹自從官馬送還官行路難行澀如棘洙曰古樂府有行路難我貧無乘非無足昔者相遇今不得實不是愛微軀一云慵相訪又非關足無力補注希曰遇字乃過字梁莊肅家本無實與又二字徒步翻愁官長怒此心炯炯君應識洙曰潘安仁寡婦賦目炯炯而不寢鄭曰炯户頂切光也曉來急雨春風顛睡美不聞鐘鼓傳東家蹇驢許借我定功曰七諫云駕驢而旡䇿兮又何路之能極補注希曰賈誼弔屈原賦騰駕罷牛驂蹇驢兮師古曰跂也泥滑不敢騎朝天已令請急㑹通籍洙曰令郎丁切一云已令把牒還請假元帝紀通籍注籍者為二尺竹牒記其年紀名字物色縣之宫門省禁相應乃得入也武后時太學生請急后亦省視之男兒性命絶可憐焉能終日心一作神拳拳洙曰中庸回之為人也得一善則拳拳服膺弗失之矣注拳拳奉持之貌也憶君誦詩神凛然辛夷始花亦一作又已落蘇曰韓文公感春詩辛夷花最高先開辨證云此花江南地暖正月開北地寒二月開初發如筆北人呼為木筆其花最早南人呼為迎春趙曰本草云正月二月開花既落而無子夏秋復著花言花之開落所以顯人之易老况我與子非壯年街頭酒價常苦貴師曰祿山以來京城蕭索百物踊貴何獨酒乎甫以酒貴為苦傷時之意於此可見方外酒徒稀醉眠速宜相就飲一㪷恰有三百青銅錢洙曰宋鮑昭行路難且願得志數相就牀頭恆有沽酒錢趙曰真宗問近臣唐酒價衆莫能對丁晉公獨曰每㪷三百上問何以知之丁引此詩以對補注鶴曰按唐食貨志乾元元年京師酒貴肅宗以粟食方屈原禁民沽酒斯以麥熟如初二年饑復禁酤廣德二年禁天下酤以月收稅建中元年罷之三年復禁酤置釀酒斛收值三千今以公此詩言之斛收三千非特起於建中然則丁晉公知杜詩而不知史也北征至德二年作鮑曰至德二載公自賊竄歸鳯翔謁肅宗授左拾遺時公家在鄜州所在冦多彌年囏窶孺弱至餓死者有墨制許自省視八月之吉公始北征徒步至三川迎妻子故有是詩蘇曰北征詩識君臣之大體忠義之氣與秋色爭髙可貴也補注鶴曰楚辭九懷駕𤣥螭兮北征詩述在路及到家之事當在羌村後至德二載九月作故云菊垂今秋花皇帝二載秋閠八月初吉補注希曰按唐紀是年閏月甲寅安慶緒冦好畤渭北李光進敗之詩云初吉乃是其月初一日其曰怵惕久未出殆是久得此命而未敢行也杜子將北征蒼茫問家室蘇曰胡混自金陵歸永安蒼茫下馬問里人曰家室何在趙曰皇帝言肅宗也二年言至德二年也自鳯翔歸鄜州此之謂北征也維時遭艱虞朝野少暇日顧慙恩私被詔許歸蓬蓽洙曰時房琯得罪甫上言琯罪細不宜免帝怒詔三司推問甫謝因稱琯宰相子少自樹立有大臣體帝不省録詔放甫歸鄜省家修可曰傅長虞詩歸身蓬蓽廬拜一作奉辭詣闕下一云閻門怵惕久未出補注鶴曰漢有熛闕鳯闕東闕北闕故云三輔故事云鳯闕圜又怵惕二字出禮記雖乏諫諍姿恐君有遺失炎曰言諫免琯趙曰甫不忍輕去其君恐君又有過舉而欲諫諍之君誠中興主經緯固密勿東胡反未已臣甫憤所切洙曰東胡祿山也憤其亂也揮涕戀行在炎曰天子行幸所在曰行在補注希曰漢武帝紀徵詣行在所師古曰天子或在京師或出巡狩不可豫定故言行在所道途行恍惚魯曰言心憂也乾坤含瘡痍憂虞何時畢靡靡踰阡陌補注希曰成紀出入阡陌又食貨志商君開阡陌人煙眇蕭瑟洙曰靡靡猶遲遲也詩行邁靡靡蕭瑟言人皆避亂無留居者所遇多被傷呻吟更流血回首鳯翔縣旌旗晚明滅洙曰時肅宗在鳯翔前登寒山重屢得飲馬窟洙曰古樂府有飲馬寒山窟行邠郊入地底涇水中蕩潏洙曰邠州古豳國昔公劉據豳其地開元十三年改豳州為邠周禮雍州川曰涇汭補注希曰按九域志涇水在涇州而邠州西距涇州才百五十里涇水之所通也故曰中蕩潏猛虎立我前蒼崖吼時裂菊垂今秋花石載一作帶古車轍青雲動高興幽事亦可悅山果多瑣細羅生雜橡栗鄭曰橡徐兩切櫟實也或紅如丹砂或黑如㸃漆曽曰玉白若截肪黃如蒸栗赤若丹砂黑如㸃漆雨露之所濡甘苦齊結實補注希曰雨露既濡見禮記緬思桃源內益歎身世拙洙曰桃源秦俗避亂之所補注希曰桃源山在鼎州淵明記晉太元中武陵人捕魚忘路忽逄桃林夾岸數百步無復雜果人云秦時避世至此坡陀望鄜畤上芳無切下諸市切洙曰鄜畤漢武郊祀之所春秋時白狄之地修可曰前郊祀志秦文公夢黃蛇自天而下屬地其口止於鄜衍文公問吏敦敦曰此上帝之徴君祠之於是作鄜畤用三牲郊祀白帝焉以此考之鄜畤乃文公所作非漢武也巖谷互出沒我行已水濱我僕猶木末洙曰木末言猶遠也鴟鳥一作梟鳴黃桑野鼠拱亂穴夜深經戰一作中場寒月照白骨蘇曰李隱塞上行云寒月上征壘沙與骨共白胡馬中夜嘶斷腸穹廬客潼關百萬師往者散何卒遂令半秦民殘害為異物洙曰翰以兵二十萬守潼關及其敗也火拔歸仁曰公以二十萬一日覆敗持是安歸遂執以降賊修可曰魏文帝與吳質書元瑜長逝化為異物况我墮胡塵及歸盡華髮洙曰甫先陷賊而亡歸經年至茅屋妻子衣百結蔡曰董先生衣百結慟哭松聲回悲泉共幽咽平生所驕兒顔色白勝雪見耶背靣啼垢膩腳不襪蘇曰徐貴妃幼時隱於庶人家滿身膩垢短衣腳無襪齊皇后見而竒其相以萬金易而育之修可曰沈佺期被彈詩云窮困多垢膩補注希曰南史隂子春身服垢汚腳數年一洗牀前兩小女補綻才過膝海圖坼波濤舊繡移曲折天吳及紫鳯魯曰天吳水神也修可曰木𤣥虛海賦天吳乍見而髣佛山海經云朝陽之谷有神曰天吳是為水伯虎身人面八手八足八尾青黃色丹穴山有鸑鷟鳯之屬也如鳯五色而多紫趙曰天吳圖所畫之物紫鳯所繡之物也顛倒在短一本裋褐修可曰當作裋音豎蓋傳寫之誤也方言曰關西謂襜䄖短者為短褐前漢貢禹短褐不完師古曰裋謂童豎所著之襦褐毛布也老夫情懷惡嘔泄卧數日洙曰一作數日卧嘔泄蘇曰邵平不喜聞是非名利事輒聞即甚惡數日嘔泄古詩是非添嘔泄那無一作能囊中帛救汝寒凛栗粉黛亦解苞衾綢稍羅列瘦妻面復光癡女頭自櫛學母無不為曉妝隨手抹移時施朱鉛洙曰宋玉登徒子好色賦臣東家之子著粉則太白施朱則太赤狼籍畫眉闊補注希曰史記淳于髠傳杯盤狼籍生還對童稚蘇曰郭攸吾幸生還故鄉喜對幼稚雖死心亦足矣似欲忘饑渴問事競挽鬚蘇曰林哲自回中還鄉兒童輩皆問事爭挽鬚鬢定功曰桓伊撫筝謝安挽其鬚曰使君於此不凡誰能即嗔喝翻思在賊愁甘受雜亂聒新歸且慰意生理焉得說至尊尚䝉塵洙曰僖二十四年傳臧文仲對曰天子䝉塵於外敢不奔問官守幾日休練卒仰看天色改坐覺妖氣一作氛豁蘇曰張子房曰幾日妖氣開豁天宇明靜隂風西北來慘淡隨回鶻洙曰一作胡紇唐書回鶻傳云回紇其先丐奴也元魏時號高車部或曰敕勒訛為臧勒臣于突厥至隋韋紇復叛去自稱回紇回鶻言勇鷙猶鶻然其王願助順其俗喜馳突蘇曰張騫曰西羌人俗喜馳馬鬭射送兵五千人洙曰時回紇以兵五千助順補注鶴曰㑹要至德二年正月肅宗駕在彭原四月官軍為賊將安守忠所敗於青渠北乃遣中官竇誠使於回鶻令發其兵九月回鶻使太子葉護領蕃兵四千餘人來助討賊遂收東京葉護請且歸靈夏已北取馬收范陽驅馬一萬匹此輩少為貴四方服勇决所用皆鷹騰破敵過一作如箭疾洙曰回紇至隋曰韋紇其人驍彊初無酋長逐水草轉徙善騎射喜盜鈔聖心頗虛佇時議氣欲奪趙曰言主上雖虛心以待其破賊然時議恐畢竟為害所以氣欲奪也伊洛指掌收西京不足拔官軍請深入蓄鋭伺俱發此舉開青徐旋瞻略恆碣補注希曰書太行恆山至于碣石故曰恆碣昊天積霜露正氣有肅殺禍轉亡胡歲勢成擒胡月胡命其能久洙曰史思明傳優相謂胡命盡乎皇綱未宜絶憶昨狼狽初定功曰酉陽雜爼云狼狽是兩物前足絶短每行駕兩狼失則不能動故世言乖者為狼狽事與古先别姦臣競葅醢鄭曰葅臻魚切同惡隨蕩析不聞夏殷衰中自誅褒妲洙曰褒似妲巳也此言誅楊貴妃也周漢獲再興宣光果明哲魯曰周宣王漢光武也桓桓陳將軍洙曰陳將軍𤣥禮也首謀誅貴妃楊國忠補注希曰書牧誓勗哉夫子尚桓桓注桓桓武貌爾雅桓桓威也釋曰嚴猛之貌周頌桓篇桓桓武王仗鉞奮忠烈蘇曰汲黯仗鉞宣風奮於忠烈微爾人盡非于今國猶活定功曰孫楚為石仲容與孫皓書曰愛民活國道家所尚凄凉大同殿寂寞白獸闥洙曰大同白獸皆禁中宫殿名也補注鶴曰㑹要大和三年十月勑修南內大同殿十三間漢有白虎殿唐高祖名虎故改曰獸都人望翠華洙曰司馬相如曰建翠華之旗佳氣向金闕蒼舒曰右按神異經東北大荒中有金闕高百丈上有月明珠徑三丈光照千里中有金階西北入兩闕中名天門園陵固有神洙曰園陵天子所葬之處掃灑數不缺煌煌太宗業樹立甚宏逹得舍弟消息乾元元年作補注鶴曰其弟在河南而公西去故云猶有淚成河經天復東注當是乾元元年在華州作風吹紫荆樹色與春庭暮花落辭故枝風回反無處洙曰周景式孝子傳曰古有兄弟忿欲分異出門見三荆同株接葉連隂歎曰木猶欣聚况我而殊哉又田真兄弟欲分其夜庭前三荆便枯兄弟歎之却合樹還榮茂骨肉恩義重漂泊難相遇猶有淚成河經天復東注洙曰世說人問顧長康哭桓宣武之狀如何曰鼻如廣莫風眼如懸河决聲如振雷破山淚如傾河注海徒步歸行至德二載作彥輔曰贈李特進自鳯翔赴許州途經邠州作補注鶴曰李特進意是李嗣業詳見至德二年作故有鳯翔千官且飽飯白頭拾遺徒步歸之句明公壯年值時危經濟實藉英雄姿洙曰天下英雄惟操與使君國之社稷今若是武定禍亂非公誰趙曰魏賀拔軌稱宇文泰曰宇文公文足經國武能定亂鳯翔千官且飽飯衣馬不復能輕肥曽曰語乘肥馬衣輕裘青袍朝士最困者白頭拾遺徒步歸洙曰甫謁上於鳯翔受左拾遺人生交契無老少論交何必先同調洙曰一作論心誰為古今殊異代可同調妻子山中哭向天須公櫪上追風驃修可曰崔豹古今注始皇七馬一曰追風廣韻曰馬黃白色曰驃師曰追風驃言李公有驃騎疾可追風逐電甫欲就之一借櫪馬槽也補注鶴曰按李嗣業本傳京兆高陵人因隨高仙芝平勃律加特進祿山反肅宗追之至鳯翔上謁肅宗喜曰卿至賢於數萬衆嗣業忠毅憂國不計居産有宛馬十匹玉華宫至德二載作師曰自此詩以下至羌村乃甫趨鄜路逢所經見兼述抵家情况補注鶴曰唐志貞觀二十一年建玊華宫於坊州冝君縣之鳯凰谷㑹要云二十一年七月十二日造殿曰玉華殿太宗有玉華宫銘公至德二載往鄜時作果州亦有玉華宫九域志云唐神龍中見黃雲赤霧凝然翳前後三日但聞斤斧之聲暨霧散雲斂有宫花出在果州上聞其事賜名玉華宫然非其詩所題者溪回松風長梅曰苻堅墓在此宫前有溪曰醽醁蓋取溪色如酒色之碧也溪回言回遠也惟回遠故松風不歇蒼鼠竄古瓦不知何王殿遺構絶壁下隂房鬼火青洙曰許慎云兵死之血為鬼火燐者鬼火之名補注希曰九思鬼火號熒熒壞道哀湍㵼洙曰書說築傅岩之野注傳氏之岩在虞虢之界通道所經有澗水瓌道常使胥靡刑人等護此道萬籟真笙竽秋色一作氣正蕭灑洙曰莊齊物篇子綦曰汝聞地籟而未聞天籟子游曰地籟則衆竅是巳人籟則比竹是已敢問天籟子綦曰夫吹萬不同而使其自己也美人為黃土况乃粉黛假當時侍金輿故物獨石馬梅曰潘嶽美人歸重泉列子粉白黛黑佩環雜芷若蘇曰梁隱過茂林覽遺跡了無故舊碑文考驗往事獨石馬在茂草中憂來藉草坐浩歌淚盈把冉冉征途間誰是長年者洙曰天台賦萋萋之纎草又嗟人生之短期孰長年之能執九成宫至德二載作魯曰武德元年廢麟遊郡置鄜州有九成宫即隋仁壽宫也補注鶴曰地理志隋仁壽宫義寧元年廢貞觀五年復置永徽元年曰萬年宫乾封二年復曰九成宫在鳯翔府麟遊縣當是至德二載經鄜州作故詩云天王守太白又曰我行屬時危蒼山入百里崖斷如杵臼曽宫憑風逈一作回岌嶪土囊口洙曰西京賦狀嵬峩以岌嶪也宋玉風賦夫風起於青蘋之末盛怒於土囊之口立神扶棟梁鑿翠開户牖敏修曰魯靈光神靈扶其棟宇其陽産靈芝蘇曰隋文帝終南山陽石柱上産金花芝十莖補注希曰終南在長安而九成宫在麟遊縣蘇引終南山陽産金花芝非當是産九成宫所枕山之陽其隂宿牛斗洙曰西都賦其陽則崇山隱天幽林穹谷其隂則冠以九嵕培以甘泉天台賦䕃牛宿以曜舉趙曰以言其高紛披長松倒揭􅠣怪石走􅠣魚列切趙曰洞簫賦若凱風紛披魯靈光殿賦飛陛揭􅠣緣雲上哀猿啼一聲客淚迸林藪洙曰冝都山川記曰峽中猿鳴至清諸山谷傳其響泠泠不絶行者歌三聲淚霑衣補注希曰古樂府巴東三峽巫峽長猿鳴三聲淚霑衣裳山谷謂但以柳怨之立日和為數疊惜其聲今不傳荒哉隋家帝至此今頺朽洙曰楊素為隋文帝營仁壽宫規構鴻侈文帝怒曰素為吾掊怨天下素懼封倫曰毋恐后至當自免既而果然向使國不亡焉為巨唐有雖無新增修尚置官居守補注鶴曰志云周垣千八百步并置禁苑及府庫官寺等太宗高宗嘗臨幸舊史志云九成宫㧾監一人副監一人丞一人簿一人録事一人府三人史五人巡非瑶水遠洙曰王元長曲水序夏后兩龍載驅璿臺之上穆滿八駿如舞瑶水之隂言周穆王遊於崑崙山其西王母與晏於瑶池之上跡是雕牆後洙曰五子之歌峻宇雕牆我來屬時危仰望嗟嘆久天王守太白洙曰趙充國傳今太白高深入者勝天王天子也守太白待時而進也趙曰守音狩太白山名守之為義言肅宗在鳯翔也補注希曰太白山在鳯翔府鄜縣天王謂肅宗也駐馬更回首羌村三首至德二載作補注鶴曰此詩當在至德二載秋至鄜時作崢嶸赤雲西馬曰赤雲西謂返照雲漢皆赤色補注希曰雲一作城孔靈符㑹稽記曰赤城山名色皆赤狀如雲霞今借用也日腳下平地洙曰楚辭云載赤雲而陵太清西都賦云嵓峻崷崒金石崢嶸注崢嶸高秀也柴門鳥雀噪歸客千里至洙曰歸客一云客子補注希曰陸賈新語乾鵲噪而行人至妻孥怪我在驚定還拭淚世亂遭飄蕩生還偶然遂鄰人滿牆頭感歎亦歔欷洙曰歔欷感泣也夜闌更秉燭相對如夢寐蘇曰謂更互秉燭照之恐尚是夢也作更字讀則失其意甚矣師曰相聚與夢想不知其所以此語乃天然混成了無斧鑿㾗耳晚歲迫偷生朝曰晚歲謂暮年也還家少歡趣嬌兒不離膝畏我復却去憶昔好追涼趙曰晉安王薄晚逐涼詩向夕紛暄屏追涼飛觀中補注鶴曰後漢仲長統傳濯清水追涼風故繞池邊樹蕭蕭北風徑撫事煎百慮洙曰江淹詩伏枕懷百慮賴知禾黍收洙曰禾黍一作黍秫趙曰言黍秫極是蓋黍秫所以造酒與下句相應已覺糟牀注魯曰糟牀即酒醡也如今足斟酌且用慰遲暮夢符曰離騷經恐佳人之遲暮羣雞正一作忽亂呌客至雞鬬爭洙曰一云正生驅雞上樹木始聞扣柴荆父老四五人蘇曰謝眺過鄴中貴交零落有田畯野老四五人慰眺曰道左商旅樵人問我久遠行手中各有攜傾榼濁復清洙曰徐邈曰酒清者為聖人濁者為賢人酒頌挈榼提壺苦辭酒味薄黍地無人耕兵革既未息兒童盡東征請為父老歌洙曰漢祖宴父老歌大風艱難愧深情歌罷仰天歎四坐淚縱橫師曰時𤣥宗幸蜀肅宗撫慰之道有所未盡是何父子之恩反不若鄰里之深情乎四坐淚下而仰歎深為朝廷歎惜此爾新安吏乾元二年作王深父曰乾元二年郭子儀等九節度之師圍安慶緒于鄴時不立元帥以中官魚朝恩為觀軍容宣慰使師遂潰於城下諸節度各還本鎮子儀保河陽詔留守東都此詩蓋哀出兵之役師曰從新安吏以下至無家别乃乾元元年所作肅宗以至德二年改元乾元時九節度使兵圍安慶緒于相州大敗而還朝廷調諸郡兵益急雖次丁盡行秦之謫戍無以加此補注鶴曰新安吏至無家别當是乾元二年作今以無家别五年委溝蹊之句論之祿山以天寶十四載叛至乾元二年乃五年師云乾元元年九節度敗蔡云二年九節度潰于相州按舊史二年三月壬申九節度兵潰新史云師潰于滏水梁權道編在至德二載非蔡興宗年譜却以乾元二年春公留東都有新安吏石壕吏等詩客行新安道洙曰新安地名補注鶴曰新安縣名唐屬河南府九域志云有二鄉兹其所以為小縣歟喧呼聞㸃兵洙曰古木蘭詩昨夜見軍帖可汗大㸃兵借問新安吏縣小更無丁府帖一作符昨夜一作日下次選中男行中男絶短小何以守王城肥男有母送瘦男獨伶俜洙曰潘安仁寡婦賦少伶俜而偏孤伶音零俜無成單孤貌修可曰古猛虎行少年惶且怖伶俜到他鄉白水暮東流青山猶一作聞哭聲莫自使眼枯收汝淚縱橫眼枯却見骨天地終無情我軍取一作至相州洙曰時九節度圍相州而師潰也日夕望其平豈意賊難料蘇曰吳起出兵不可輕戰賊勢難料歸軍星散營趙曰乾元初詔子儀率李光弼等九節度兵二十萬討慶緒于相州圍之慶緒求救子史思明王師不利南潰諸節度引還故公今詩云云就糧近故壘練卒依舊京補注希曰通鑑乾元二年二月郭子儀等使圍鄴城築壘再重穿塹二重壅漳水灌之城中自冬至春安慶緒堅守以待史思明人皆以為克在朝夕而諸軍無統帥官軍出即散其營諸軍人馬牛車日有所失樵採甚艱天下饑饉轉餉者為思明殺戮由是諸軍乏食人思自潰三月壬申官軍潰於南掘壕不到水牧一作看馬役亦輕洙曰此言子儀保河陽詔留守東都况乃王師順撫養甚分明送行勿泣血僕射如父兄鄭曰郭子儀也補注希曰子儀以朔方軍斷河陽橋保東京東京士民驚駭散奔山谷子儀在河陽將謀城守人又驚奔諸將繼至衆及數萬議捐東京退保蒲陜都虞侯張濟曰蒲陜荐饑不如守河陽子儀從之用濟役所部兵築南北兩城而守之子儀至德二載授尚書僕射乾元元年進中書令而此詩第云僕射何也無乃當時人熟于僕射之名故云潼關吏至德二載作王深父曰安祿山反哥舒翰以潼關擊賊翰敗祿山遂陷長安其後又復長安頓增飾餘險此詩蓋刺非其人則舉以棄之得其人雖舊險亦足以恃不必衆而持無益也補注鶴曰哥舒翰天寶十五載六月潼關失守京師遂陷今詩云修關還備胡當是至德二載收京後詩又云要我下馬行必歸京時作士卒何草草築城潼關道大城鐵不如小城萬丈餘薛曰潤洲圖經城號鐵瓮城吳孫權所築又世說曰若湯池鐵城無可攻之勢補注鶴曰潼關在華州華隂縣河水自龍門南流激華山而東故名潼關天寶十四載祿山反詔河西節度使哥舒翰為王太子前鋒兵馬元帥令率衆二十萬守潼關明年六月翰為賊所敗關門不守今復築城故云借問潼關吏修關還備胡修關一作築城要我下馬行要於宵切為我指山隅連雲列戰格飛鳥不能踰胡來但自守豈復憂西都丈人視要處窄狹容單車蘇曰李左車云井陘之道車不得方軌騎不得成列補注鶴曰李陵書曰足下昔以單車之使適萬乘之虜又後漢來歙以單車來使單車如驛騎單置一馬艱難奮長㦸千古用一夫洙曰胸奴贊厲長㦸徑弩之械劍閣銘一人荷㦸萬夫趑趄蜀都賦一夫守隘萬夫莫向哀哉桃林戰百萬化為魚洙曰武成放牛桃林之野注桃林在華山東西京賦左有崤函重險桃林之塞陸士衡詩眷言懷桑梓無乃化為魚補注希曰陜州有桃林府而此乃指潼關之戰當是華山之東者請囑防關將慎勿學哥舒洙曰唐哥舒翰突騎施首領哥舒部落之裔也蕃人多以部落稱始以為氏翰至潼關次于靈寶縣之西原與賊交戰官軍南迫險峭北臨黃河因為凶徒所乘王師自相擠排墜于河翰降於賊祿山僞署翰司空諸將光弼等皆為書罪不死節後為安祿山所殺師曰今肅宗既收復兩京儻不更選賢將事之成敗未可知也故甫有慎勿學之句石壕吏乾元二年作王深父曰驅民之丁壯盡置死地而猶急其老弱雖為閭左之戍不堪也嗚呼其時急矣哉補注鶴曰觀急應河陽役之句當是乾元二年九節度之師潰子儀斷河橋以餘衆保東京時作而梁權道編在至德二載非暮投石壕村洙曰石壕地名鄭曰澠池有二崤東壕土崤西為石崤石崤即石壕矣有吏夜捉人老翁踰牆走老婦出門看吏呼一何怒婦啼一何苦聽婦前致詞三男鄴城戍洙曰江淹飛蓋遊鄴城王粲歌舞入鄴城魏都也補注希曰按舊史武德元年以魏郡置相州天寶元年改為鄴郡乾元元年復為相州二年而為鄴城孰為舊也一男附書至一作到二男新戰死存者且偷生呂曰李陵曰陵豈偷生之士死者長已矣室中更無人所有乳下孫孫有母未去出入無完裙洙曰一作孫母未便出見吏無完裙老嫗力雖衰洙曰文頴曰幽州及漢中皆謂嫗為媪請從吏夜歸急應河陽役沈曰河陽東都也猶得偹晨炊師曰時三節度屯兵於此以禦慶緒兵敗無丁可抽故老嫗請赴河陽之役以供炊㸑而已夜久語聲絶如聞泣幽咽天明登前途獨與老翁别新婚别乾元二年作王深父曰先王之政新有婚者朞不使政出於刑名則一便衆而已此詩所怨盡其常分而能不忘禮義余是以録之補注鶴曰詩云守邊赴河陽當是乾元二年作絲附蓬麻引蔓故不長洙曰古詩與君為新婚兔絲附女蘿詩頍辨蔦與女蘿施于松柏蔦寄生也蘿兔絲松蘿也陸璣疏云今兔絲連草上生黃赤如金合藥兔絲子是也在草曰絲在木曰松蘿趙曰兔絲當附松柏而乃附蓬麻為不得其所矣補注希曰爾雅唐䝉女蘿兔絲釋曰唐也䝉也女蘿也兔絲也一物而四名本草并以唐䝉為一名吕氏春秋云或謂兔絲無根不屬地茯苓是也抱朴子曰兔絲之草下有茯兔之根內篇亦云嫁女與征夫不如棄路傍蘇曰周述生而怪異父曰不如棄置路傍母弗許後文章有名結髮為妻子洙曰蘇子卿詩結髮為夫妻恩愛兩不疑補注希曰詩衛風氓總角之宴毛傳云總角結髮也又前漢結髮翰墨結髮而戰席不暖君牀洙曰孔席不暇暖蘇曰王簡樓君牀席未暖遽䝉棄逐暮婚晨告别無乃太匆忙君行雖不逺守邊赴一作戍河陽洙曰河陽東都也妾身未分明何以拜姑嫜夢符曰前漢廣川王去為幸姬陶望卿作歌曰背尊章熛以忽顔師古曰尊章言舅姑也呂曰陳琳飲馬長城窟行云善事新姑嫜此姑嫜字所出也師古曰姑之夫曰嫜父母飬我時日夜令我藏生女有所歸洙曰婦人謂嫁曰歸雞狗一作犬亦得將君今往死地沉痛迫中腸趙曰鮑昭詩沉痛切中腸誓欲隨君去形勢反蒼黃洙曰北山移文蒼黃翻覆蘇曰韓遂形勢不可欺軍馬蒼黃擊其左右勿為新婚念努力事戎行洙曰古詩努力加餐飯婦人在軍中兵氣恐不揚蒼舒曰前漢李陵與單于戰陵曰士氣少衰而鼓不起者何也軍中豈有女子乎始軍出時關東羣盜妻徙邊者隨軍為卒妻婦大匿軍中陵按得皆劒斬之自嗟貧家女久致一作致此羅襦裳鄭曰襦人朱切短衣也羅襦不復施洙曰淳于髠云羅襦襟解對君洗紅妝仰視百鳥飛大小必雙翔人事一作生多錯忤與君永相望無方切趙曰宋玉風賦回穴錯忤注云雜錯交忤也垂老别乾元三年作王深父曰軍興之甚至於老者亦介胄則又甚於閭左之戍矣補注鶴曰乾元三年安慶緒為史思明所殺而思明自河南分為四道㑹于汴自是東京與鄭滑等州相繼陷沒而防守愈急此當是其年冬晚作梁權道編在至德二載非四郊一作方未寧靜洙曰曲禮四郊多壘卿大夫之辱也垂老不得安子孫陳亡盡蘇曰衛隆曰吾宗世業儒值此離亂子孫不慣操戈陳亡皆盡焉用身獨完投杖出門去同行為辛酸幸有牙齒存所悲骨髓一作肉乾男兒既介胄長揖别上官洙曰酈食其長揖高祖左思詩長揖歸田廬老妻卧路啼歲暮衣裳單孰知是死别且復傷其寒此去必不歸蘇曰主父偃此行斷當不復歸矣吾吐詞與物多忤還聞勸加餐洙曰古詞上言加餐食土門壁甚堅杏園度亦難洙曰史思明傳李光弼出土門收常山郡郭子儀以朔方蕃漢二萬人自土門而至常山軍威遂振趙曰時土門杏園設備以待史思明時思明已殺安慶緒自立為帝矣與天寶十五載潼關既潰之後思明為安祿山攻土門陷常山時事皆相逺補注鶴曰土門縣按舊史土門舊屬冝州貞觀十七年廢咸亨二年又割富平華原蒲城縣宜改為美原屬京兆若顔魯公乾元元年歲次戊戌十月庚申祭伯父濠州刺史云二兄杲卿任常山郡太守忠義憤發首開土門擒斬逆豎唐置鎮州常山郡獲鹿縣有土門關即舊井涇關哥舒翰至土門軍入浴遘疾及李光弼以朔方兵五千出土門東救常山皆在常山之西却非此詩所指者此與杏園俱在長安乾元元年十月郭子儀引兵自杏園濟河南是也公詩多用土門事各不同當以詩意詳之勢異鄴城下縱死時猶寬補注希曰鄴下城謂相州以土門壁堅非若九節度之師不半年而潰於相州也人生有離合豈擇衰盛一作老端憶昔少壯日遲回竟長歎洙曰鮑昭詩臨路獨遲回萬國盡征戍一云東征烽火被岡巒洙曰蜀都賦岡巒紏紛鮑昭烽火入咸陽積尸草木腥洙曰晉天文志太陵中一星曰積尸明則死人如山蘇曰衛紹纍年兵戈不解積尸遍野草木皆腥狐驕馬肥流血川原丹洙曰楊子川谷流人之血原野厭人之肉何鄉為樂土洙曰詩適彼樂土安敢尚盤桓棄絶蓬室居塌然摧肺肝洙曰曹植詩哀哉傷肺肝又顧念蓬室士蘇曰張約過金陵回首淚不能止心肝摧折師曰痛念國家急難征戍烽火何鄉不有吾豈能獨安不慮哉不敢盤桓義也塌然傷别仁也詩之意不忘仁與義此甫幾乎風雅之作矣無家别乾元二年作師曰杜詩言無家者蓋離别不成家計爾補注鶴曰梁權道編在至德二載而詩云永痛長病母五年委溝壑殆謂天寶十四載乙未祿山反時調役至乾元二年己亥為五年又曰賤子因陳敗正指九節度之師潰相州而言寂寞天寶後園廬但蒿藜洙曰喪亂園廬殘破也我里百一作萬餘家世亂各東西存者無消息死者為一作委塵泥蘇曰梁竦賢愚貴賤一死皆為塵泥造化豈有彼此之異賤子因陳敗歸來尋舊一作故蹊久行見空巷日瘦氣慘悽蘇曰王齊纍日飢腸慘悽覺瘦但對狐與狸豎毛怒我啼洙曰苦寒行熊羆對我蹲虎豹夾路啼言田里荒蕪人跡罕少惟狐狸爾四鄰何所有一二老寡妻洙曰四鄰所居之鄰近也人多死于征役所居者惟有一二寡婦爾宿鳥戀本枝安一作敢辭且窮棲洙曰人情之戀故鄉如宿鳥之戀本枝也雖窮棲且安辭矣方春獨荷鋤蘇曰潘勗見陸機曰今天下三分兵戈騷屑吾當獨荷鋤山谷采芝术飬此衰朽不復有意於世間事也日暮還灌畦縣吏知我至召令習鼓鞞洙曰張景陽詩人聞鼓鞞聲雖從本州役曽曰盧諶詩肯謂鄉曲譽謬充本州役內顧無所攜近行止一身逺去終轉迷家鄉既蕩盡蕩徒沆切劉曰謝靈運詩家鄉皆掃盡逺近理亦齊永痛長病母五年委溝溪生我不得力蘇曰陳涉人言父母生我不得力吾試憑三尺逐秦鹿使羣兒洗目看享富貴見函谷碑終身兩酸嘶人生無家别何以為蒸黎洙曰傷不得養父母夏日歎乾元二年作補注鶴曰乾元二年三月丁亥以旱降死罪流以下原之四月壬寅詔減常膳服御舊史又云四月癸亥以久旱徙市雩祀祈雨而梁權道編在至德二載在鳯翔行在授拾遺時作而史不書其年旱觀詩殆與乾元二年事合蔡興宗年譜却以乾元二年華州作夏日出東北陵天經中街洙曰中街黃道之所經也夢符云右按前漢書天文志日有中道月有九行中道者黃道一曰光道光道北至東井去北極近南至牽牛去北極逺東至角西至婁去極中夏至至於東井北近極故晷短立八尺之表而晷景長尺五寸八分冬至牽牛逺極故晷長立八尺之表而晷景長丈三尺一寸四分春秋分日至婁角去極中而晷中立八尺之表而晷景長七尺六分此日去極逺近之差晷景長短之制去極逺近難知要以晷景晷景者所以知日之南北也朱光徹厚地趙曰楚辭陽杲杲其朱光鬱蒸何由開洙曰晉天文志夏至極起而天運近北而斗去人逺日去人近南天氣至故蒸熱也漢書昴畢為天街應璩書曰處凉臺而有鬱蒸之煩張景陽詩朱光馳北陸上蒼久無雷無乃號令乖洙曰易傳當雷不雷陽德弱也郎顗傳雷者號令其德生養號令殆廢當生而殺則雷反作其時無歲趙曰言君令之不時雨降不濡物趙曰言彼相之無澤良田起黃埃蘇曰隋煬帝時大旱任安曰上蒼久不降甘雨良田黃埃勃起飛鳥苦熱死池魚涸其泥洙曰鮑昭苦熱行身熱頭且痛鳥墮魂家歸萬人尚流冗舉目唯蒿萊蘇曰鮑昭賦上古壘望蒿萊盡目力沈曰晉灼曰蒿萊荆棘舉目皆是至今大河北盡作虎與豺洙曰言大河之北民皆饑餓相吞如豺虎也浩蕩想幽薊洙曰幽州薊門祿山境也王師安在哉補注希曰按史乾元二年三月丁亥以旱降死罪原之流民給復通鑑亦云天下饑饉又九節度圍鄴城諸軍乏食自潰正與詩合對食不能餐趙曰蔡琰詩饑當食兮不能食其餘我心殊未諧眇然貞觀初難與數子偕洙曰君子以為傷今思古之詩師曰太宗貞觀初米斗三錢行旅不齎房杜王魏之徒皆當時名臣君臣之間諫行言聽遂使膏澤下於民號令一無乖繆故甫傷今思古而欲與數子偕不可得矣夏夜歎乾元二年作補注鶴曰同上年永日不可暮洙曰劉公幹詩永日行游戲炎蒸毒我一作中腸洙曰言熱自中起故毒我腸也安得萬里風飄颻吹我裳蘇曰相如夢仙引云悠悠夢到無何鄉天風飄颻吹我裳洙曰天色久隂淫雨不止潘章曰安得萬里長風掃此隂翳也趙曰陸士衡前緩聲歌云長風萬里舉也昊天出華月洙曰劉休𤣥詩芳年有華月茂林延踈光仲夏苦夜短開軒納微凉洙曰謝靈運詩不怨秋夕長恆苦熱夜短虛明見纎毫洙曰陶潛詩夜景湛虛明羽蟲亦飛揚蘇曰李靳雜感月華滿院寒飛揚羽蟲亂物情無巨細自適固其常洙曰詩熠耀宵行羽蟲也念彼荷戈士洙曰詩候人荷戈與役窮年守邊疆何由一洗濯執熱互相望無方切師曰兵革以來雨暘失序甫苦于旱熱因覩羽蟲夏夜飛揚而適其性乃念彼荷戈之士執熱而不得一濯君天下者不能推好逸惡勞之心與衆共之豈所謂為民父母也哉竟夕擊刁斗刁音雕喧聲連萬方洙曰李廣傳程不識正部曲行伍營陳擊刁斗至明軍自便孟康曰刁斗以銅作受一斗晝炊飯食夜擊持行名曰刁斗今在滎陽庫中也西域傳斥堠七百餘人五分夜擊刁斗自守青紫雖被體蘇曰韓耀雖青紫被體鐘鼎列前皆非吾所欲也但得衡山一峯嘯卧雲間吾心足矣補注鶴曰通鑑云至德二載五月子儀與王思禮合軍於潏西與安守忠戰敗後府庫無積蓄專以官爵賞功及清渠之敗專以官爵收散卒由是應募入軍者一切衣金紫不如早還鄉洙曰李白蜀道難云錦城雖云樂不如早還鄉北城悲笳發鸛鶴號且翔洙曰豳詩鸛鳴于垤補注希曰公夏在華七月之秦北城指秦而言也鸛鶴言軍士况復一作懷煩促倦激烈思時康魯曰張茂先詩煩促每有餘蘇子卿詩長歌正激烈留花門至德二載作鮑曰按唐志甘州有留花門山堡東北千里至回鶻衙帳是年廣平王為元帥以朔方吐蕃回紇諸兵討賊公逆知其害故言麥倒桑折辛曰花門既須留原野轉蕭瑟言其為農桑害也趙曰花門即回紇之别名也補注鶴曰葉護請留兵沙苑在至德二載十月此詩作于是年花門非回紇之别名唐志中有花門山堡又東北十里至回鶻牙帳故以名之北門一作方天驕子飽肉氣勇决洙曰前漢丐奴傳單于遣使遺漢書曰南有大漢北有强胡胡者天之驕子也不為小禮以自煩今欲與漢闓大關取漢女為妻歲給遺酒蘖萬石稷米五千斛雜繒萬匹它如故約則邊不相盜矣又丐奴居北邊君王以下咸食畜肉衣其皮而已秋髙馬肥健洙曰趙充國曰秋馬肥變又起矣李廣以臨古北平盛秋師古曰盛秋馬肥健恐虜為寇也挾矢射漢月自古以為患洙曰書戒蠻夷猾夏詩稱戎狄是膺春秋有道守在四夷久矣夷狄之為患也四子講德論夫丐奴者百蠻之最强者也天性蹇驕習俗桀暴業在攻伐事在獵射兒能騎羊走箭飛鏃詩人所歌自古患之如此詩人厭薄伐洙曰周懿王時王室遂衰戎狄交侵至懿王曾孫宣王興師命將以征伐之詩人美大其功曰薄伐獫狁至于太原言逐出之修德使其來羈縻固不絶洙曰語逺人不服則修文德以來之贊曰其慕義而貢獻則接之以禮讓羈縻不絶使曲在彼蓋聖王制御蠻夷之常道也應邵漢官儀曰馬曰羈牛曰縻言四夷如牛馬之受羈縻也胡為傾國至出入暗金闕中原有驅除隱忍用此物洙曰王莽贊曰聖王之驅除云爾蘇林曰王莽為光武驅除也驅逐蠲除以待聖人也公主歌黃鵠洙曰西域傳烏孫使使獻馬願得尚漢公主漢元封中遣江東王建女細君為公主以妻焉公主至其國自治宮室居嵗時再與昆莫㑹置酒飲食以幣帛賜王左右貴人昆莫年老言語不通公主悲愁自為作歌曰我家嫁我兮天一方逺托異國兮烏孫王穹廬為室兮旃為牆以肉為食酪為漿居常土思兮心內傷願為黃鵠兮歸故鄉天子聞而憐之趙曰乾元元年肅宗以幼女寧國公主嫁回紇可汗故云歌黃鵠補注希曰髙紀女子公主如淳曰天子嫁女諸侯必使諸侯同姓者主之故謂公主師古曰天子不親主婚故謂公主君王指白日洙曰詩大車謂豫不信有如皎日皎白也我言之信有如皎然之白日指白日以為誓盟約連雲屯左輔百里見積雪洙曰左輔馮翊郡也趙曰此指言回紇留左輔之為害也長㦸鳥休飛蘇曰呂布曰長㦸霜戈鳥亦不能飛渡吳人何患之有哀笳曉幽咽田家最恐懼麥倒桑枝折趙曰時殘害麥與桑故田夫懼之沙苑臨清渭洙曰沙苑馮翊郡界補注希曰沙苑在同州馮翊南十七里又唐志同州雖不言渭水而同與華鄰華隂有漕渠自苑西引渭水可下其臨渭泉香草豐潔蘇曰王臻至漾陂愛其泉香草木豐潔遂編茅讀書精通三傳渡河不用船千騎常撇烈一云滅沒胡塵踰太行洙曰太行山名雜種抵京室花門既須留原野轉蕭瑟洙曰丘希範書姬漢舊邦旡取雜種王深父留花門序云肅宗之復兩京藉回紇之師助焉雖幸成功而朝野更被其毒語曰人無逺慮必有近憂以天子之尊推誠仗順集中國之智力滅一狂賊豈有不足哉顧引勍虜入於腹心之地卒不危禍其社禝者僅耳補注鶴曰葉護奏以軍中馬少請留其兵於沙苑自歸取馬還為掃除范陽餘孽沙苑在同州同州為京師近輔故前云連雲屯左輔也塞蘆子至德二載作王深父序云徹其西備而爭利於東非所以固國者也補注鶴曰蘆子關在延州延昌縣北以備吐蕃今詩云思明割懷衛秀巖西未巳按通鑑至德二載十二月甲子史思明以所部十三郡及兵八萬來降并帥其河東節度使髙秀岩亦以所部來降則此詩作於未降之先五城何迢迢洙曰沈存中云延州今有五城說者謂舊有東西二城夾河對立髙萬典郡始展南北東三關乃知天寶中有五城謂髙始展非也鮑曰唐志延州延昌縣北有蘆子關又夏州注長慶四年節度使李祐築烏延宥州臨塞隂河陶子與塞蘆子蓋五城名也迢迢隔河水邊兵盡東征洙曰文六年知秦之不復東征城內空荆杞洙曰阮嗣宗詩堂生荆杞補注鶴曰張說嘗為朔方軍節度大使往巡五城措置兵馬說之所治靈州靈與延俱屬關內道按舊史注朔方節度使所管有定逺城西受降城中受降城東受降城及豐安軍靈距延六百里又通鑑云唐自武德以來開拓邊境連西域皆置都督府州縣開元中置朔方隴右河西安西北庭諸節度使以統之嵗發山東丁壯為戌卒繒帛為軍資開屯田供糗糧設監牧畜馬牛軍城戍邏萬里相望及祿山反邉兵精鋭者皆徵發入援謂之行營所留兵單弱胡虜猶蠶食之然則是詩之作蓋先事而慮也卒召吐蕃之禍蓋由不以此為意思明割懷衛洙曰史思明雜種胡人也天寶十四載隨安祿山反河陽懷衛盡陷於賊秀巖西未巳洙曰高秀巖哥舒翰麾下將也後為思明僞河東節度使降肅宗補注希曰髙秀巖天寶八載為哥舒翰禆將攻石堡城詳知西事故有意於西也秀巖為祿山守大同唐大同軍防禦使雲州刺史領之唐志大同川及天德為大同城故地在豐州中受降城回略大荒來洙曰山海經曰大荒之中有山名曰大荒之山日月所入是謂大荒之野崤函蓋虛爾洙曰項籍贊秦孝公據崤函之固師古曰崤謂崤山今陜縣東二崤是也函谷今桃林縣南洪溜澗是也虛言其無偹禦爾延州秦北户關防猶可倚焉得一萬人疾驅塞蘆子岐有薛大夫旁制山賊起岐一作源補注鶴曰薛大夫當是御史大夫薛景仙以檢校戶部尚書兼尹鳯翔敗安祿山近聞昆戎徒為退三百里蘇曰蕭詵與衛人戰日退三百里蘆關扼兩寇深意實在此誰能呌帝閽胡行速如鬼洙曰揚雄甘泉賦選巫咸兮呌帝閽時官兵止知東討收復河洛而不知蘆子之可塞公懼有乘隙而起者故有此作彭衙行天寶十五載作彥輔曰左文二年晉侯及秦師戰於彭衙注遏江縣西北有彭城魯曰馮翊郡合陽縣西有彭衙城補注鶴曰史記秦文公分清水為白水縣即此地漢為彭衙縣故城在白水縣東北六十里當是天寶十五載適白水後七月聞肅宗即位靈武公赴行在時作故有夜深彭衙道月照白水山句憶昔避賊初北走經險艱夜深彭衙道月照白水山補注希曰同州馮翊郡有白水縣在州之西北而鄜州亦在州北延州又在鄜之西北不滿七十里皆公所經之途也此詩殆是記初避賊時事非謂歸鄜如此也盡室久徒步逢人多厚顔洙曰書五子之歌顔厚有忸怩參差谷鳥吟一作鳴不見逰子還師曰前年秋七月避賊次年春尚不得還故有此句癡女飢咬我啼畏猛虎聞懷中掩其口蘇曰王莽五歲語尤乖父聞之急掩其口抱於懷中反側聲愈嗔小兒强解事故索苦李餐强巨兩切一旬半雷雨泥濘相攀牽濘乃定切既無禦雨一云禦濕備徑滑衣又寒有時經一作最契闊竟日數里間野果充糇糧洙曰詩擊鼓死生契闊詩公劉乃褁糇糧卑枝成屋椽早行石上水暮宿天邊烟少留同家窪烏瓜切欲出蘆子關故人有孫宰髙義薄曽雲洙曰陸士衡文髙義薄雲天同家窪蘆子關皆地名補注鶴曰關在延州延昌縣北公欲往而孫宰延之孫其山川之宰歟延客巳曛黑洙曰曛黑薄暮也謝靈運詩朝逰窮曛黑張燈啓重門暖湯濯我足剪紙招我魂洙曰宋玉為屈原招魂從此出妻孥相視涕䦨干洙曰言淚之墮也䦨干衆多貌趙曰談藪王元景使梁劉遊綽送之泣下元景無淚謝曰卿勿怪我别後䦨干䦨干淚不斷之貌補注鶴曰漢息夫躬絶命辭云涕泗流兮萑蘭臣瓚曰萑蘭涕泣䦨干也又左太冲吳都賦金溢磊砢珠琲䦨干五臣注云多也又曹子建善哉行月參橫北斗䦨干蓋星有䦨干若衆多不絶之象所以薛令詩云苜蓿長䦨干喻其如星長且多也衆雛爛熳睡師曰衆雛指諸子昆弟也喚起霑盤餐彥輔曰僖公二十二年晉公子重耳過曹曹大夫僖負羈饋盤餐置璧焉公子受餐反璧趙曰爛熳言睡之熟也誓將與夫子永結為弟昆遂空所坐堂安居奉我歡師曰惟孫宰尚義以所坐之堂而館我况復以盤餐禮之加恤故甫誓與之結為兄弟示其親愛之誠不相忘也誰肯艱難際豁逹露心肝别來嵗月周胡羯仍構患胡官切補注希曰公以天寶十五載避冦入鄜今云嵗月周即是指明年至德二載而言所謂胡羯仍構患謂史思明等引兵共十萬寇太原及安慶緒立使尹子奇歸擅及同羅奚兵十三萬趨睢陽事見通鑑云何當有翅翎飛去墮爾前趙曰胡羯之患蓋指言安慶緒蓋慶緒於正月弒父而襲僞位也公既陷賊而脫身逹行在所故寄此詩感其恩懷其人矣義鶻行乾元元年作彥輔曰感鳥獸猶見義而動也補注鶴曰詩云近經潏水湄此事樵夫傳當是乾元元年在長安作隂崖有蒼一作二鷹養子黑柏巔白蛇登其巢吞噬恣朝餐噬一作之雄飛逺求食雌者鳴辛酸力强不可制黃口無半存蘇曰定逺侯過隍中玉門燉煌氐羌掃殄殆盡黃口亦無存者趙曰隂崖出長笛賦惟鍾籠之竒生兮於終南之隂崖朝餐出楚辭胥瓊以朝餐也黃口出家語孔子見羅者所得雀皆黃口也其父從西歸一作來翻身入長烟斯須領健鶻痛憤寄所宣斗上捩孤影鄭曰捩練結切拗捩也噭哮來九天鄭曰上古弔切深聲下許交切修鱗脫逺枝巨顙折老拳時可曰石勒與李陽鄰居爭漚麻池日相毆擊及貴乃召陽與酣謔引臂笑曰孤往日厭卿老拳卿亦飽孤毒手高空得蹭蹬洙曰海賦蹭蹬波失勢貌短草辭蜿蜒折尾能一掉洙曰江賦揚鬐掉尾左傳尾大不掉飽腸巳皆穿生雖滅衆雛死亦垂千年物情有報復快意貴目前補注希曰晉同穎人生幾時但當快意兹實鷙鳥最洙曰孔融云鷙烏纍百不如一鶚補注希曰爾雅鷹醜釋曰說文隼鷙鳥也急難心炯然洙曰詩棠棣兄弟急難功成失所往用捨何其賢近經潏水湄補注鶴曰韻釋云潏水在京兆杜陵此事樵夫傳飄蕭覺素髮洙曰潘安仁班鬢彪以承辨素髮飄以垂領凛欲衝儒冠洙曰欲一作烈藺相如怒髮衝冠人生許與分亦在顧眄間聊為義鶻行永激壯士肝蘇曰陸遜時政論曰不以典刑善惡焉能激壯士之肝膽耶畫鶻行至德二年作一作畫鵰補注鶴曰肅宗還京公在扈從之列以至德二年十月入長安今云見之髙堂是其年作高堂見生一作老鶻補注希曰楚辭招魂云翡翠帷幬飾高堂些注云張之高堂以樂君颯爽動秋骨初驚無拘攣洙曰曹褒傳羣寮拘攣猶拘束也潘嶽西征賦陋吾人之拘攣何得立突兀乃知畫師妙巧刮造化窟寫此神俊姿洙曰支道林云憐其神俊趙曰李賀云筆補造化天無功蓋出於此充君眼中物烏鵲滿樛枝洙曰詩南有樛木釋文云木下曲曰樛樛下垂也趙曰謝𤣥暉詩云樛枝聳復低軒然恐其出側腦看青霄寧為衆禽沒長翮如刀劍人寰可超越唐曰舞鶴賦歸人寰之喧卑乾坤空崢嶸洙曰鮑明逺嵗崢嶸而催暮粉墨且蕭瑟緬思一作想雲沙際自有烟霧質吾今意何傷顧步獨紆鬱洙曰舞鶴賦烟交霧凝若無毛質陸士衡詩紆鬱游子情趙曰劉希夷邊城夢還詩雲沙撲地起烟霧質所以言其真質也補注杜詩卷三
