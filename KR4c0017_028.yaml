body:
  text: 補注杜詩卷二十八宋黃希原本黃鶴補注陪諸公上白帝城樓宴越公堂之上大厯元年作洙曰越公楊素也有堂在城上畫象尚存補注鶴曰詩云此堂存古制城上俯江郊蓋初見也當是大厯元年春晚作此堂存古制城上俯江郊落構垂雲雨趙曰雲頽而下雨落于空皆有垂之義荒階蔓草茅柱穿蜂溜蜜棧缺燕添巢坐接春杯氣心傷艷蘂梢蘇曰左希登西樓曰艷蘂傷客心和風吹薄袂英靈如過隙洙曰見身世白駒摧注宴衎願投膠洙曰古詩以漆投膠中趙曰指公孫就之英靈如過隙而逝亡則今日宴衎當願如以膠投漆結綢繆之好也莫問東流水生涯未即拋傷春五首廣德二年作師古曰時避冦在蜀作補注鶴曰詩云巴山春色靜又詩中備言吐蕃陷京代宗出幸之事當是廣德二年在閬州作而梁權道編在廣德元年綿州作不考代宗幸陜在元年十月而十月始還京若在元年作何由有春光日自濃之句當是二年無疑楚辭招魂目極千里兮傷春心故以為題天下兵雖滿趙曰謂廣德元年吐蕃陷京師車駕幸陜春光洙曰一作青春日自濃西京疲百戰趙曰吐蕃留京師䦘郭子儀軍至驚潰子儀復長安北闕任羣凶蘇曰除符北闕震蕩羣凶若不誅鋤恐逼洛汭趙曰指言程元振魚朝恩之徒補注鶴曰唐以鳯翔為西京蓋至德二載代宗廣德元年吐蕃入冦陷鳯翔以西故鳯翔為戰爭之地蒙塵謂代宗幸陜然幸陜乃十月丙子至十二月即還京矣此詩云乃春作是廣德二年關塞三千里趙曰公在閬中望乘輿所在有三千里關塞之隔矣煙花一萬重蒙塵清露急洙曰見至尊尚蒙塵注御宿且一作有誰供補注鶴曰通鑑上至陜百官稍有至者郭子儀引二十騎自御宿川循山而東王延昌曰六軍將士逃潰者多在商州今速往收之殷復前王道洙曰啇之中宗髙宗能復前王之道周遷舊國容洙曰平王東遷于洛邑蓬萊足雲氣應合揔從龍趙曰豈言蓬萊殿乎蓋言羣臣當盡隨駕易雲從龍也雲以比羣臣龍比天子鶯入新年語花開滿故枝天清洙曰一作青風卷幔草碧水通池牢落官軍速蕭條萬事危洙曰憂時之心切故於萬事未見其安也鬢毛元自白淚點向來垂不是無兄弟其如有别離洙曰言雖有兄弟而為喪亂阻隔不得相保爾巴山春色靜北望轉逶迤洙曰巴山蜀山也補注希曰巴與蜀自别巴指梓閬而言也楚辭逺遊載雲旗之逶迤日月還相鬬星辰屢合洙曰一云亦屢圍洙曰漢天文志五星所行合散犯守陵歷鬬食彗孛飛流日月薄蝕韋昭曰星相擊為鬬不成誅執法焉得變危機洙曰天文志南宫南四星名執法中端門趙曰廣雅曰熒惑謂之罰星或謂之執法今指熒惑而言則指程元振之熒惑人主也大角纒兵氣洙曰天文志大角者大王帝座廷其兩旁曰攝提魏都賦姦回內贔兵纒紫微趙曰京師兵又滿矣故曰纒兵氣鉤陳出帝畿洙曰西都賦周以鉤陳之位注鉤陳王者法之主行宫也煙塵昏御道洙曰黃道也耆舊把天衣洙曰一云固無牽白馬幾至著青衣蘇曰煬帝幸維陽朝廷耆艾把天衣諫不止趙曰父老不欲車駕之行皆牽挽帝衣行在諸軍闕蘇曰漢帝諸軍闕食肆掠居民趙曰言軍士稀少來朝大將稀洙曰吐蕃陷京師天子幸陜諸鎮畏程元振魚朝恩讒構莫肯奔命朝廷所恃者郭子儀一人而已趙曰言藩鎮不朝賢多隱屠釣王肯載同歸洙曰賢者避地自隱於屠釣王能為文王載吕望事否蘇曰寧元自古賢人哲士或抱關擊柝或隱迹屠釣或雜漁樵師曰日月相鬭星辰合圍言天示變異故盜賊興執法者大將之權也不命將以誅之則危機不得息大角纒兵氣言祿山陷京師天王之位尚妖氛所纒繞也釣陳者天子之仗出帝畿言帝出幸耆舊把天衣言父老皆攀車駕再有朝廷亂難知消息真近傳王在洛復道使歸洙曰一作通秦洙曰謂傳者不一也奪馬悲公主登車泣洙曰一作哭貴嬪補注希曰和政公主下嫁桞渾安祿山陷京師主奪渾馬載寧國公主身與渾徒步日百里蕭關迷北上洙曰漢武行幸雍通回中道遂北出蕭關迷北上謂東行陜故下句有欲東巡之句滄海欲東巡洙曰秦始皇東巡海上銘石勒功敢料安危體猶多老大臣豈洙曰一作得無嵇紹血霑灑屬車塵洙曰晉書忠義傳紹以天子蒙塵承詔馳詣行在所值王師敗績於蕩隂百官及侍御莫不散潰唯紹端冕以身捍衛紹被害血汚御服及事定左右欲浣衣帝曰此嵇侍中血不可去司馬相如諫獵書云犯屬車之清塵師曰吐蕃再陷京城代宗幸陜故云再亂滄海欲東巡言代宗幸陜如始皇之東巡勞民動衆也敢料安危體言朝廷老臣猶多國體未遽危也豈無嵇紹血言艱難之際衛帝者豈無忠臣義士如嵇侍中者乎補注希曰漢制大駕八十一乘師古曰屬者言其相連續不絶也屬之欲反聞説洙曰一作道初東幸孤兒却走多洙曰宣帝紀注取從軍死事者之子養羽林官教以五兵號曰羽林孤兒少壯者令從軍也趙曰此篇聞官軍逃亡之詩却走退却而走也補注鶴曰此詩五首多言出幸然皆追紀當時事如此篇云聞説初東幸孤兒却走多足驗其非當出幸時所作是時公在閬中故曰巴山殆是巴閬僻逺聞京師事常後時故廣德二年春方知元年冬事因以發其感憤之意遂名曰傷春云難分太倉粟洙曰漢大倉之粟紅腐不可食趙曰言其既走則雖有太倉之粟而難與之也競棄魯陽戈洙曰魯陽公與韓遘戰酣日暮援戈而揮之日為反三舍趙曰言戈可以麾戰而反棄之為可痛矣胡虜登前殿洙曰吐蕃陷京師也王公出御河洙曰出奔也得無洙曰一作忍為中夜舞洙曰晉春秋曰祖逖字士稚與司空劉琨雄豪著名時與琨同辟司馬州主簿情好綢繆共被而寢中夜聞雞鳴起舞曰此非惡聲誰洙曰一作宜憶大風歌洙曰漢髙帝作大風歌云大風起兮雲飛掦安得猛士國兮守四方師曰代宗出幸禁軍皆逃竄難分太倉粟言用之也競棄魯陽戈言兵敗北也英雄之士於斯時豈無覬覦如劉琨者故曰得無中夜舞誰憶大風歌言無人守四方也春色生烽燧洙曰見悲青坂詩注幽人泣薜蘿洙曰謂賢者泣於草野爾趙曰幽人公自謂也君臣重修德猶足見時和洙曰巴閬僻逺傷春罷始知春前已敗宫闕暮春題瀼西新賃草屋五首大厯二年作補注鶴曰詩云久嗟三峽客再與暮春期當是大厯二年在瀼西作是年公方自赤甲遷瀼西故詩又云旅食瀼溪雲久嗟三峽客再與暮春期修可曰樂史寰宇記渝州有三峽之名曰西峽巴峽巫峽明月峽在夔州之西即西峽也百舌欲無語趙曰反舌無聲在芒種後十日今謂之欲無語則暮春之時也師曰百舌江東人謂之信鳥逢春則效百鳥語故名百舌繁花能幾時谷虛雲氣薄波亂日華遲戰伐何由定哀傷不在兹洙曰百舌反舌也禽名此郊千樹橘不見比封君洙曰李衡種甘橘千樹號千頭木奴前漢貨殖傳蜀漢江陵千樹橘比其人皆與千戶侯等養拙干戈際全生麋鹿羣蘇曰陳遂曰幸得全生於麋鹿羣中盡老矣補注希曰潘嶽䦘中記曰卒孟年七十與麋鹿同遊世謂之鹿仙畏人江北草旅食瀼西雲蘇曰言其客路萍迹無定計也古詩云旅食如間雲趙曰畏人在於江北之草間旅食在於瀼西之雲裏公之自嘆也師曰畏人江北草言草動則驚恐盜伏其中也萬里巴渝曲洙曰前漢禮樂志巴渝鼓員三十六人師古曰巴巴人也渝渝人也當髙祖初為漢王得巴渝人與之定三秦滅楚國存其武樂也巴渝之樂因此始也巴即今巴州渝即今渝州本蜀都之地三年實飽聞趙曰自永泰元年至今大厯二年為三年矣補注鶴曰公以永泰元年五月下忠渝至夔大厯三年正月出峽今詩題曰暮春題瀼西新賃草屋而詩亦有再與暮春期之句則是大厯二年暮春涉三甲子故云三年綵雲隂復白錦樹曉來青身世雙蓬鬢趙曰言身已老而雙鬢如蓬矣乾坤一草亭趙曰言天地之間有此瀼西一草亭也哀歌時自短師曰古詩有短長吟醉舞為誰醒細雨荷鋤立蘇曰朝詠因思詩荷鋤立雨中衣濕不自覺人皆愛其苦學江猿吟翠屏洙曰見眷言終荷鋤并却略羅翠屏注黃曰陶淵明帶月荷鋤歸壯年學書劔洙曰項籍少年學書不成去學劔他日委泥沙洙曰言不見用于世趙曰公自嘆於流落也事主非無祿浮生即有涯髙齋依藥餌絶域改春華喪亂丹心破蘇曰辛毗值此喪亂兵戈未定丹心復將破矣王臣未一家趙曰詩所謂率土之濵莫非王臣也欲陳濟世策巳老尚書郎洙曰見老儒不用尚書郎詩注趙曰公官是尚書工部員外郎故云未息豺虎鬭洙曰見豺虎正縱橫注趙曰豺虎以言盜賊空慙鴛鷺行洙曰公曽任拾遺籍占朝列時危人事急風逆羽毛傷落日悲江漢中宵淚滿牀承聞河北諸道節度入朝歡喜口號絶句十二首補注鶴曰案末篇云十二年來多戰場當是大厯二年作然此詩十二首非止言一時事乃是述安史及吐蕃之亂而歸於李懷仙之能説諸節度郭子儀之能息其戰伐當逐篇以事觀之蓋河北自寶應元年史朝議未縊死前諸鎮已多降者死後無不歸順案舊史李懷仙廣德元年檢校侍中為幽州節度使子儀二年兼雲州大都督單于鎮北大都護又無朔方招撫使故能使河北諸道節度入朝如太原節度使辛雲京以是年來朝是也祿山作逆降天誅更有思明亦已無洙曰安祿山史思明補注希曰安祿山以至德二載為嚴莊所殺史思明未幾又殺安慶緒奪其位乾元二年自稱大聖燕王事見通鑑洶洶人寰猶不定時時戰鬬欲何須洙曰時尚有反者社稷蒼生計必安蠻夷雜種錯相干周宣漢武今王是洙曰周宣中興漢武雄略言除去暴亂如漢武恢復帝業如周宣也孝子忠臣後代看趙曰此篇望諸節度之忠孝如此喧喧道路多歌謡洙曰一作好童河北將軍盡入朝自是乾坤王室正却教江漢客魂銷洙曰言亦望朝廷徵用也趙曰公因喜諸節度入朝而傷其流落未可還闕朝王魂銷者所以重嘆也北洙曰又云不道諸公無表來茫然庶事遣人猜擁兵相學干戈鋭使者徒勞萬里回洙曰吐蕃之亂諸道節度無一人救援者朝廷遣使敦諭竟不至補注希曰吐蕃廣德元年入寇代宗自十月徵諸道兵不至桞伉所謂四方叛是也鳴玉鏘金盡正臣洙曰西征賦飛翠綬拖鳴玉以出禁門者衆矣趙曰鳴玉鏘金言諸節度之貴稱為正臣則公豈待之以忠義耶修文偃武不無人洙曰武成云乃偃武修文興王會靜妖氛氣聖壽宜過一萬春蒼舒曰世説晉武帝問孫皓聞南人好作爾汝歌頗能為否皓正飲酒因舉觴勸帝歌云昔與汝為鄰今與汝為臣上汝一杯酒願汝壽萬春帝悔之英雄見事若通神聖哲為心小一身洙曰不役天下以自奉燕趙休矜出佳麗洙曰古詩燕趙多佳人美者顔如玉宫闈不擬選才人洙曰唐制才人正二千石趙曰此篇喜諸節度入朝既喜其入朝却防其媚悅而獻佳麗故預以為戒才人宫中之爵號抱病江天白首郎趙曰公晚年為尚書工部員外郎也其字依傍馮唐白首為郎矣空山樓閣暮春光衣冠是日朝天子草奏何時入帝鄉澶漫山東一百州韓曰澶漫不恭貌削成如桉抱青丘鄭曰削平也青丘在青州千乘縣苞茅重入歸關內王祭還供盡海頭洙曰左傳齊桓問罪楚國曰爾苞茅不入王祭不共無以縮酒東逾遼水北滹沱洙曰遼水遼東國水也山海經云大戲之山滹沱之水出焉今在饒陽縣北星象風雲喜共和紫氣關臨天地闊趙曰紫氣關言函谷關也周時尹喜為關吏望其有紫氣云當有聖人入關黃金臺貯俊賢多洙曰燕王置千金於臺上以延天下之士謂之黃金臺漁陽突騎邯鄲兒夢符曰後漢世祖克邯鄲置酒髙會從容謂馬武曰吾得漁陽上谷突騎欲令將之酒酣並轡金鞭垂意氣即歸雙闕舞雄豪復遣五陵知洙曰漁陽突騎邯鄲遊俠其豪俊勇決古有名稱也五陵漢之五陵亦豪俠所聚之地復遣五陵知謂復遣為王臣也補注鶴曰原涉傳諸豪及長安五陵諸為氣節者皆歸慕之師古曰五陵為長陵安陵陽陵茂陵平陵也班固西都賦南望杜霸北眺五陵然則霸陵杜陵不在五陵之數也李相將軍擁薊門白頭惟有赤心存蘇曰馬授曰吾白頭老顔赤心壯志尚存趙曰李相則節度之稱相公將軍則節度之稱將軍者擁薊門乃河北諸道節度矣補注鶴曰李相將軍意是指李懷仙懷仙廣德元年為史朝義偽范陽節度使因中使駱奉仙請降又遣兵追朝義而縊之代宗授以檢校侍中幽州盧龍等軍節使事見舊史并通鑑幽州有薊縣故云自是與蔣嵩田承嗣張忠志等分河朔而帥之稱蕃臣懷仙大厯三年為其麾下所殺第未詳何以謂將軍惟有一本作雖老竟能盡説諸侯入知有從來天子尊趙曰盡喜説諸侯之入朝蓋天子從來有至尊之勢十二年來多戰場天威巳息陳堂堂洙曰孫子堂堂之陳天威天子之威神靈漢代中興主功業汾陽異姓王補注鶴曰以代宗宣帝子儀以寶應元年建邜日為河中朔方等節度使進封汾陽郡王得舍弟觀書自中都巳達江陵今兹暮春月末行李合到夔州悲喜相兼團圎可待賦詩即事情見乎詞大厯二年春作補注鶴曰題云今兹暮春月末合到夔州當是大厯二年春作蓋元年暮春方自雲安遷居夔州爾到江陵府何時到峽州亂離生有别修可曰楚詞云悲莫悲於生别離聚集病應瘳颯颯開啼眼朝朝上水樓老身須付託白骨更何憂喜觀即到復題短篇二首大厯二年作補注鶴曰詩云應論十年事又云終南萬里春則是觀自河南來也公乾元元年冬自華州之東都二年春尚留自元年至大厯二年恰十年當是大厯二年作巫峽千山暗終南萬里春洙曰終南山在長安言去家萬里也病中吾見弟書到汝為人洙曰始為亂離所隔則莫知生死也及書到方知其為人意答兒童問來經戰伐新趙曰兩句通義自戰伐中來兒童見之必有所問己意其一一答之也泊船悲喜後欵欵話一作議歸秦待爾嗔烏鵲沈曰西京雜記鵲噪則行人至拋書示鶺鴒趙曰待弟而來怒烏鵲之下實下言喜弟來故拋書示之枝間喜不去原上急曽經洙曰詩鶺鴒在原兄弟急難江閣嫌津桞洙曰嫌其隔望眼也風帆數驛亭洙曰數其驛程也應論十年事愁絶始星星蘇曰張禹對鏡悲鬢始變星星趙白也曰舊本作橪絶非是星星言鬢之喜聞盜賊蕃寇揔退口號五首大厯三年作補注鶴曰詩云大厯三年調玉燭當是其年作案舊史二年吐蕃九月冦靈州進冦邠州十月靈州奏破吐蕃二萬京師解嚴通鑑云十月路嗣恭破吐蕃於靈州城下斬首二千餘級吐蕃引去今詩云今春喜氣滿乾坤南北東西拱至尊當是蕃寇二年退而詩作於明年之春故云三年一本作二年而梁權道從而編詩於二年然元年無吐蕃之亂雖新史云九月吐蕃陷原州而舊史通鑑俱不言案志原州廣德元年已陷吐蕃詩又云蕭關隴水入官車唐志蕭關縣在武州九域志隴水縣在隴州而唐志隴州無此縣蕭關與靈州相近正是指吐蕃寇靈州而路嗣恭破之也蕭關隴水入官車趙曰蕭關在靈州之傍隴水則隴州之水鄭曰縣屬原州青海黃河卷塞雲洙曰見蕭關迷北上并州不見青海頭趙曰青海在西吐蕃之地黃河則自積石而往卷塞雲則無復戰伐而塞雲卷散也北極轉愁龍虎氣西戎休縱犬羊羣師曰蕭關隴水皆奏地北極喻君轉愁龍虎氣言中國氣盛胡人愁恐也贊普多教使入秦洙曰贊普吐蕃主帥數通和好止煙塵洙曰按新史本傳至德三年吐蕃使使來請討賊且修好朝廷忽用哥舒將殺伐虛悲公主親洙曰吐蕃先為哥舒翰所殺不敢近青海趙曰開元末吐蕃金城公主薨遣使來告又因請和明皇不許以哥舒翰節度隴石翰攻拔石堡又擒其相又破洪濟崆洞西極過崑崙趙曰崆洞在西郡之西昆崙又在崆洞西極之西詩人廣大言其從化之地逺也駝馬由來擁國門逆氣數年吹路斷蕃人聞道漸星奔趙曰劉孝摽廣絶交論靡不望影星奔勃律天西采玉河鄭曰唐西域傳大勃律西與小勃律接堅昆碧碗最來多夢符曰右按唐書於闐國距京師九千七百里有玉河國人夜視月光盛處州得美玉鄭曰堅昆國在康居西蔥嶺北趙曰碧碗出堅昆國舊隨漢使千堆寶少答胡王萬匹羅趙曰舊日以千堆寶隨漢使入貢而中國所少答者特萬匹羅師曰晉平居海為張鄴使于闐判官作行程記云其國采玉之地玉河在于闐城外其源出崑山西流一千三百里至于闐界牛頭山乃流為三河一曰白玉河在城東二曰緑玉河在城西三曰烏玉河在緑玉河西其源雖一而其玉隨地而變每歲五六月大水暴漲則玉隨流而至至秋水退乃可采人謂之撈玉堅昆亦胡也今春喜氣滿乾坤南北東西拱至尊大厯三年調玉燭趙曰爾雅曰時和為玉燭玄元皇帝聖雲孫師曰爾雅四時和為通正四氣和為玉燭邢昺疏曰四時和氣溫潤明照故曰玉燭又釋親孫之子為曽孫曽孫之子為玄孫玄孫之子為來孫來孫之子為晜孫晜孫之子為仍孫仍孫之子為雲孫注言輕逺如浮雲唐以老子為聖祖封玄元皇帝故曰聖雲孫即事大厯二年作補注鶴曰此詩當是大厯二年暮春作若謂元年則公方自雲安移居於夔其詩云春知催桞别又阻久雨已非今花氣渾如百和香之時矣暮春三月巫峽長洙曰盛𢎞之荆州記巴州三峽巫峽長皛皛行雲浮一作無日光皛胡了切趙曰陶淵明詩云皛皛川上平雷聲忽送千峰雨花氣渾如百和香和胡卧切洙曰古詩博山爐中百和香鬱金蘇和與都梁蘇曰解濟遊樂遊園云日烘花氣如百和香惹衣雅然宜數數行樂補注希曰漢武帝時月支國嘗進百和香黃鶯過水翻回去燕子􅋦泥濕不妨飛閣卷簾圖畫裏虛無只少對瀟湘趙曰雖眼前之山水如畫圖而其所虛無只欠少瀟湘為對也見螢火大厯二年作補注鶴曰詩云巫山秋夜螢火飛當是大厯二年作二年之秋在瀼西及東屯居今詩又云忽驚屋裏琴畫冷復亂簷前星宿稀是時已有定居矣巫山秋夜螢火飛簾踈巧入坐人衣趙曰言入于坐人之衣也忽驚屋裏琴書冷復亂簷前星宿稀却繞井欄添箇箇偶經花蘂弄輝輝滄江白髮愁看汝來歲如今歸未歸送十五弟侍御使蜀大厯元年作補注鶴曰數杯巫峽酒百丈內江船又云未息豺狼鬭蓋指崔旰輩相攻當是大厯元年喜弟文章進添余别興牽數杯巫峽酒百丈內江船洙曰水自消上合者謂之內江自渝由戎瀘上蜀者謂之江外未息豺狼鬬戰爭空催犬馬年洙曰以自稱其年故從卑賤晉陶侃臨終上表曰臣猶為犬馬之齒故尚可少延歸朝多便道摶擊望秋天洙曰便道間道也田曰舊唐史柏彥範舉楊嶠為御史嶠不樂摶擊之任師曰御史之擊搏姦回如鷹逢秋擊搏鳥獸暮春大厯元年作補注鶴曰詩云卧病擁塞在峽中當是大厯元年初遷夔州時作蓋公在雲安巳卧病矣卧病擁塞在峽中瀟湘洞庭虛映空趙曰言瀟湘洞庭虛在彼處映空而我卧病于此不得見之也楚天不斷四時雨蘇曰蜀卭僰山後四時常無晴日梁益稱為漏天占詩地近漏天經歲雨巫峽長吹千里風洙曰巫峽多風沙上草閣桞新暗城邉野池蓮欲紅暮春鴛鷺立洲渚挾子翻飛還一叢趙曰叢聚也言鴛鷺與子叢聚也晴二首大厯元年作補注鶴曰詩云久雨巫山暗當是大厯元年初到夔州時作公方遷居時有雨濕不得上岸又有雨不絶詩久雨巫山暗新晴錦繡文洙曰江山晴明風物鮮麗若錦繡也碧知湖外洙曰一作上草趙曰洞庭湖之外遂連青草湖也補注希曰湖外草非指青草湖而言止是見巫山之文如錦繡因以知湖草之碧耳加一知字可明其非見也紅見海東雲趙曰言日出之處紅雲也竟日鶯相和摩霄鶴數羣野花乾更落風處急紛紛啼鳥爭引子鳴鶴不歸林下食遭泥去髙飛恨久隂雨聲衝塞盡日氣射江深回首周南客洙曰太史公留滯周南驅馳魏闕心洙曰天子之門兩閣謂之象魏夢符曰吕氏春秋曰中山公子牟謂詹子曰身在江海之上心居魏闕之下奈何雨大厯元年作補注鶴曰詩云干戈盛隂氣未必自陽臺當是指崔旰拍茂林楊子琳輩相攻大厯元年作始賀天休雨還嗟地出雷洙曰雷出地奮豫補注希曰既雨而雷乃陽縱隂盛之證故干戈不息詩云蛟龍鬭不開當是張獻誠楊子琳拍茂林並起兵討崔旰驟看浮洙曰一作巫峽過密作渡江來牛馬行無色洙曰秋水篇不辨牛馬蛟龍鬬不開干戈盛隂氣蘇曰月令天地不時陽衰隂盛君弱臣強即生兵戈未必自陽臺洙曰因隂氣盛而多雨非必來於陽臺也陽臺謂暮為行雨月三首大厯二年作補注鶴曰當是大厯二年作然三首非一時而成以其俱在夔作故題曰三首梁權道編在元年然第二篇云羈棲秋裏見二十四回明蓋公自永泰元年秋至雲安及今二年秋為二十四回明也然第三首云萬里瞿瑭峽春來六上弦則是三月詩故云非一時而成斷續巫山雨天河此夜新洙曰天河銀漢若無青嶂月愁殺白頭人蘇曰李訴隱首陽山中秋夕攜酒友人曰若無明月豈不愁人也魍魎多洙曰一作移深樹洙曰月明則魍魎遁逃故多深樹蝦蟆動半輪洙曰月中有蝦蟆白兔故園當北斗洙曰北斗辰極也公家在長安趙曰説者謂長安上直北斗直想照西秦併照巫山出新窺楚水清補注希曰舊史志云巫山漢巫縣屬南郡隋加山字以巫山峽為名舊治巫子城新史志云巫山縣有巫山夔本春秋魚國後屬楚有楚宫水故謂之楚水羈栖愁見裏洙曰一作愁裏見二十四回明趙曰指言在夔歷望夜凡二十四回也必驗升沉體洙曰以其朝暮也如知進退情洙曰謂不違弦望不違銀漢落洙曰鮑明逺詩夜移衡漢落亦伴玉繩橫洙曰謝靈運詩玉繩低建章趙曰玉繩星合凡夜深則玉繩低補注希曰春秋元命苞玉衡南兩星為玉繩星萬里瞿塘峽洙曰一作月春來六上弦時時開暗室趙曰言在夔州凡六見上弦也故故滿青天爽合風襟靜髙當淚臉懸趙曰公以羈旅在外傷時感舊也南飛有烏鵲洙曰古詩月明星稀烏鵲南飛夜久落江邊園大厯二年作補注鶴曰詩云畦蔬繞茅屋自足媚盤餐當是大厯二年夏居瀼溪時作故詩又云碧溪搖艇闊仲夏多流水清晨向小園碧溪搖艇闊蘇曰何遜京口詩云碧溪水色闊搖艇煩舟子朱果爛枝繁始為江山靜終防市井喧畦蔬繞茅屋自足媚盤餐趙曰媚宜也左傳盤餐加璧歸大厯二年作補注鶴曰詩云東西却渡船當是指瀼東西而言乃大厯二年作束帶還騎馬東西却渡船林中才有地峽外絶無天洙曰夔州居山水間在峽中故號為稍平趙曰若盧同詩低頭雖有地仰面若無天虛白髙人靜洙曰莊子謂虛室生白喧卑俗纍牽洙曰喧卑囂雜貌以俗纍之牽人者如此趙曰鮑明逺舞鶴賦歸人寰之喧卑他鄉悅遲暮不敢廢詩篇諸葛廟大厯二年作補注鶴曰詩云久遊巴子國屢入武侯祠當是大厯二年而梁權道編在元年恐非久遊巴子國程曰寰宇記夔州春秋時夔子國後為楚地秦滅楚置郡即為巴郡屢入武侯祠竹日斜虛寢溪風滿薄帷君臣當共濟賢聖亦同時翊戴歸先主并吞更出師洙曰翊戴言輔翊尊戴劉氏也并吞謂出師表有并吞中國之志蟲蛇穿畫壁巫覡醉蛛絲覡研歷切夢符曰右按前漢志民之精爽不二齊肅聰明者神或降之在男曰覡在女曰巫使制神之處位為之牲器以見廟弊巫覡醉於蛛絲中也歘憶吟梁父躬耕起未遲洙曰亮耕南陽作梁父吟趙曰舊本作也未遲非豎子至大厯二年作補注鶴曰詩云豎子即阿段公嘗遣同女奴阿稽往問刈稻及有示獠奴阿段者猶今之小奚也當是大厯二年作樝梨且洙曰一作才綴碧莊加切梅杏半傳黃小子幽園至輕籠熟奈香補注希曰奈有二種潘嶽賦所謂二奈曜丹白之色也山風猶滿把野露及新嘗欹枕洙曰一作欲寄江湖客提攜日月長趙曰豎子所摘來之熟奈正欲寄逺而道路長阻費時日也師曰壺中日月長攜持日月長攜壺以將奈之舍弟觀歸藍田迎新婦送示二首大厯二年作補注鶴曰詩云汝去迎妻子髙秋念却回又云滿峽重江水開帆八月舟此時同一醉應在仲宣樓是大厯二年夏作汝去迎妻子髙秋念却回即今螢巳亂好與鴈同來東望西江水趙曰舊作水善本作永是蜀江謂之西江公欲泛舟南下以楚之上遊而西江之盡處在其東故東望其永詩江之永矣不可方思彥輔曰水當作永南遊北戶開趙曰成南遊則見北戶之開吳都賦云開北户以向日卜居期靜處會有故人杯蘇曰郭林宗曰吾當北居靜處期友人野酌放浪趙曰卜居靜處當有故人之來楚塞難為路洙曰一作别藍田莫滯留衣裳判白露鞍馬信清秋滿峽重江水開帆八月舟補注希曰重江謂江非一如北江中江大江之水皆自峽下荆州故云此時同一醉應在仲宣樓趙曰王粲字仲宣劉表時在荆州田登樓而作賦其後指荆州樓為仲宣樓季夏送鄉弟韶陪黃門從叔朝謁從才用切大厯元年補注鶴曰詩云比來相國兼安蜀當是杜鴻漸大厯元年為劔南節度二年歸朝韶陪從其歸黃門謂鴻漸以黃門侍郎同平章事鎮蜀唐志龍朔二年改黃門侍郎曰東臺侍郎乾元元年又曰黃門蓋漢有紿事黃門侍郎晉有黃門侍郎令弟尚為蒼水使趙曰吳越春秋禹登衡嶽以祭夢見赤繡衣男子稱玄夷蒼水使者曰間帝使文命于斯故來候之名家莫出杜陵人洙曰杜陵有南北杜最為名家比來相國兼安蜀洙曰鴻漸以相國入蜀平崔旰之難尋表旰為節度使還朝歸赴朝廷巳入秦捨舟策馬論兵地趙曰以同行二人所以可論兵矣拖玉腰金報主身洙曰西征賦拖鳴玉以出入禁門腰金帶也鄭曰拖託何切曵也莫度清秋吟蟋蟀洙曰潘安為黃門作秋興賦云蟋蟀鳴乎軒屏早聞黃閣畫麒麟趙曰漢武帝畫功臣於麒麟閣上也師曰時崔旰成都作亂杜鴻漸以黃門侍郎領相職入蜀平其亂遂還朝故有相國安蜀歸朝入秦之語昔潘安為黃門作秋興賦云蟋蟀鳴乎軒屏子美勉鴻漸莫空度時節淹留於蜀早歸論功畫象於麒麟閭也熱三首大厯元年作補注鶴曰詩云十年可解甲當是大厯元年在夔州作蓋祿山天寶十四載十一月反其亂方息而吐蕃又入寇至是凡十年又詩語不及瀼溪也雷霆空霹靂雲雨竟虛無炎赫衣流汗低垂氣不蘇乞為寒水玉願作冷秋菰革曰寒水玉水精也菰蒲也成於冷秋二物皆涼故願為之何似兒童歲風涼出舞雩洙曰冠者五六人童子六七人浴乎沂風乎舞雩詠而歸瘴雲終不滅師曰瘴雲乃炎瘴之雲瀘水復西來洙曰瀘龍都切孫曰瀘水出瀘州屬蜀道補注鶴曰唐志嶲州云又經菁口會川四百三十里至河子鎮城又三十里渡瀘水姚州下云自嶲州南至西瀘經陽蓬鹿谷菁口會川四百五十里至瀘州乃南渡瀘水即孔明所渡者孫謂出瀘州則非殆水經其州耳閉戶人髙卧蘇曰黃起雨中見竇朴朴家貧掩蓬門髙卧長嘯自若起歎曰袁安卧雪人俱稱賢竇夫子雨中髙卧不讓古人也歸林鳥却回趙曰人髙卧而但睡鳥不安而又飛以見其熱之甚矣峽中都似火江上只空雷想見隂宫雪風門颯踏開孝祥曰宫中暑月積雪為山取其隂涼朱李沉不冷雕胡炊屢新洙曰魏文帝書浮甘瓜於清泉浸朱李於寒水沈休文長袂屢以拂雕胡方自炊將衰骨盡痛被褐洙曰一作味空頻趙曰暍音於歇反傷暑也夏禹扇暍武王亦扇暍歘許律反翕炎蒸景飄颻征伐人十年可解甲為爾一霑巾洙曰憫其經寒暑而不得休息也蘇曰孫約征伐十年不解甲兵師曰雕胡即菰米被褐言其賤也身賤而味重併享此寧不傷征伐者十年不得解甲乎返照大厯二年作補注鶴曰詩云楚王宫北正黃昏又云不可久留豺虎亂當是大厯二年作豺虎謂楊子琳之徒攻擊未已也明年春果下峽楚王宫北正黃昏白帝城西過雨痕返照入江翻石壁歸雲擁樹失山村趙曰如鮑照詩霧失交何城衰年肺病唯髙枕絶塞愁時早閉門不可久留豺虎亂蘇曰燕寧與子祝書曰晉地豺虎正亂不可久留速鞭馬來關中甚佳南方實有未招魂趙曰公自言也客於南楚魂魄飛越實為未招也補注鶴曰公屢以諸鎮之強比豺虎是時瀘州刺史楊子琳攻崔旰未已公潛其將變故云明年果陷成都殺夔州别駕張忠因楚辭招魂云魂兮歸來南方不可以止故用其語以自喻示獠奴阿段鄭曰獠魯皎切大厯元年作補注鶴曰獠奴乃公之𨽻人也前所謂豎子阿段者公有引水詩乃大厯元年作此亦其時作也山木蒼蒼落日曛竹竿裊裊細泉分洙曰以竹引水也郡人入夜爭餘瀝趙曰以筒引水其水涸塞不通故郡人止爭餘瀝耳稚子尋源獨不聞病渴三更回白首趙曰惟阿段者獨能尋源修筒水而至焉公有渴疾賴此水為多傳聲一注濕青雲趙曰以修筒之後水來之聲自傳聞矣曽驚陶侃胡奴異怪爾常穿虎豹羣洙曰此詩全章皆引泉事惟陶侃胡奴傳記不録蘇曰侃得胡奴甚不喜語言常默坐侃一日出郊執鞭隨之胡僧見而驚禮曰此海山使者也因念墮下侃異之至夜失其所在師曰此詩乃命獠奴以竹引水以濟病渴常穿虎豹羣言入山以理水筒也簡吳郎司法大厯二年作補注鶴曰詩云有客乘舸自忠州遣騎安置瀼西頭又云風江颯颯亂帆秋蓋公大厯二年秋自瀼西遷東屯故以草堂借吳郎也當是大厯二年作有客乘舸自忠州遣騎安置瀼西頭洙曰前詩注所謂瀼東瀼西者古堂本買藉踈豁借汝遷居停宴遊趙曰借吳司法自舟中遷來以居停宴遊雲石熒熒髙葉曉洙曰一作曙風江颯颯亂帆秋却為姻婭過逢地夢符曰按爾雅婦父母壻之父母相謂為婚姻兩婚相謂為亞注詩云琑瑣姻婭今江東人呼同門為僚壻許坐曽軒數散愁又呈吳郎大厯二年作補注鶴曰詩云堂前撲棗任西鄰無食無兒一婦人當是西鄰有寡婦困窮者告吳郎使聽其竊園利也同前篇一時作堂前撲棗任西鄰夢符曰按漢王吉傳東家棗垂吉遲其妻取棗啖吉吉知去婦鄰人欲伐樹吉乃還婦里語曰東家棗完去婦復還趙曰公舊嘗見有撲棗者矣今告吳郎以任從之無食無兒一婦人不為困窮寧有此蘇曰束晢赴孝亷舉謂友人曰不為養親困窮寧有此態耶祗緣恐懼轉須親趙曰言探斯婦之情乃困窮所致又告吳郎當念其恐懼宜更親之即防洙曰一作知逺客雖多事使洙曰一作便插疏籬却甚真趙曰言雖任鄰婦取棗然吳郎以逺方來當謹籓籬以防他寇亦不害為真耳巳訴徵求貧到骨正思戎馬淚盈巾補注杜詩卷二十八
