body:
  text: 補注杜詩卷十一宋黃希原本黃鶴補注杜鵑大厯元年作洙曰華陽風俗志鳥有杜鵑者其大如鵲而羽鳴聲哀而吻有血土人云春至則鳴聞其初聲者則有離别之苦人皆惡聞之惟田家候其鳴則興農事識者謂此詩上四句非詩乃題下甫自注爾後人誤寫蘇曰或者謂前四句非詩也蓋甫於題下自記杜鵑事後人誤寫之耳或曰正古之謡語豈復以韻為限耶補注鶴曰先君嘗謂文君白頭吟詞云郭東亦有樵郭西亦有樵杜公此詩前四句或本此又舊本題注云上皇幸蜀還肅宗用李輔國謀遷之西內上皇悒悒而甫此詩感是而作舊注如此所以編在廣德年間然詩云雲安有杜鵑又云值我病經年則是大厯元年春在雲安作蓋公在雲安與䕫多病所以有老病巫山裏之句若在廣德間則公在梓閬不應言雲安意譏崔旰子琳輩西川有杜鵑東川無杜鵑涪南無杜鵑雲安有杜鵑我昔遊錦城結廬錦水邊洙曰子美結廬在浣花里有竹一頃餘喬木上參天蘇曰上林苑喬木參天松篁隂合珍禽竒獸自然駢集趙曰曹子建詩荆棘上參天杜鵑暮春至哀哀呌其間我見常再拜重是古帝魂趙曰鮑昭行路難云中有一鳥名杜鵑云是古時蜀帝魂公所用蓋出於此也至若此篇常再拜而重之不能拜而淚下則尊君之意前人所不到生子百鳥巢百鳥不敢嗔一作喧仍為餧其子洙曰世說杜鵑養子於百鳥巢百鳥共養其子而不敢犯禮若奉至尊洙曰成都記曰杜宇亦曰杜主自天而降稱望帝好稼穡教人務農治郫城亦曰望帝至今蜀人將農者必先祀杜主時荆州人鱉靈死其尸泝流而上至汶山下復生見望帝望帝因以為相號曰開明㑹巫山壅江人遭洪水開明為鑿通流有大功望帝因以其位禪焉後望帝死其魂化為鳥名曰杜鵑亦曰子規又云子規深春乃有聲曰怨鳥與北之思歸樂都不同也洛京東西多此鳥人以為子規者誠妄矣又云宇禪位于開明升西山隱焉時適三月子規鳥鳴故蜀人悲子規鳥鴻鴈及羔羊有禮太古前行飛與跪乳識序又知恩洙曰晉羊祜鴈賦鳴則相和行則接武前不絶貫後不越序春秋繁露曰凡贄卿用羔羔有角而不用如好仁者執之不鳴殺之不謗類死義者羔飲其母必跪類知禮者故羊之為言猶詳故以為贄趙曰謂成行列而飛所以謂之鴈序也聖賢吾法則付之後世傳君看禽鳥情猶解事杜鵑今忽暮春間值我病經年身病不能拜淚下如迸泉修可曰劉越石扶風歌據鞍長歎息下淚如流泉引水大厯元年作魯曰夔俗無井皆以竹引山泉而食蟠屈山腹間有至於數百丈者補注鶴曰詩云雲安沽水奴僕悲魚復移居心力省當是大厯元年至䕫州作月峽瞿塘雲作頂洙曰庾仲雍荆州記曰巴楚有明月有峽趙曰本朝樂史寰宇記於榆州載明月峽以石穴圓似之故以名亂石崢嶸俗無井洙曰楚俗山居負水而食故高者引水雲安無泉尤難得水故云補注鶴曰䕫與雲安有鹽井而罕有鑿井汲泉者故公作信行逺修水筒詩云雲端竹筒拆雲表山石碎觸熱藉子修通流與㕑㑹往來四十里荒險崖谷大使其可井安至引泉如是逺也雲安沽水奴僕悲魚復移居心力省洙曰後漢地理志魚復屬巴郡古庸國左傳文十年魚人逐楚師是也修可曰魚復即夔州矣今之倚郭奉節縣乃漢之魚復縣也補注希曰雲安唐為夔州屬縣本朝開寶中置雲安軍以縣𨽻軍通典唐志奉節縣漢魚復縣隋人復故地貞觀二十三年始更名為奉節䕫本魚國故也白帝城西萬竹蟠接筒引水喉不乾人生留滯生理難斗水何直百憂寬洙曰莊子斗升之水活我趙曰盧照鄰秋風至詩還思不動行賴此百憂寬青絲廣德二年作補注鶴曰此詩言僕固懷恩之亂當是廣德二年作按史是年八月反通鑑以為二年正月懷恩與河東都將李竭誠潛謀取太原辛雲京殺竭誠懷恩使其子㻛將兵攻之㻛敗之榆次青絲白馬誰家子粗豪且逐風塵起洙曰樂府有白馬篇梁元帝詩宛轉青絲鞚趙曰南史侯景傳初大同中童謡曰青絲白馬壽陽來及景之叛乘白馬青絲以應䜟也師曰謂祿山反補注希曰蓋以侯景之比僕固懷恩以懷恩誘吐蕃回紇入寇故曰且逐風塵起黃庭經問誰家子在我身不聞漢主放妃嬪近靜潼關掃蜂蟻洙曰誅貴妃也趙曰此公戒約粗豪子之辭師曰哥舒翰為賊所破陷兩京肅宗鳩義兵收復兩京如掃蜂蟻補注希曰肅宗復京師而乾元元年出宫女三千人今代宗歸京師而不聞有此故云通鑑云高暉率麾下三百騎東走至潼關守將李日越擒而殺之在廣德元年此詩作於廣德二年故曰近靜殿前兵馬破汝時十月即為韲粉期趙曰告以必破亡之證也蔡曰按通鑑廣德二年吐蕃入長安諸軍亡卒及鄉曲無賴相聚為盜丁已以太子賔客薛景先討之所以有殿前兵馬破汝時之句師曰殿前兵馬乃神䇿軍天子親征羣盜望風而敗補注鶴曰殿前兵馬乃神䇿軍通鑑云初肅宗以陜西節度使郭英乂領神策軍使內侍魚朝恩監其軍英乂入為僕射朝恩專將之及代宗幸陜朝恩舉在陜兵與神䇿軍迎扈悉號神䇿軍天子幸其營及京師平朝恩遂以軍歸禁中自將之然尚未得比北軍至永泰元年僕固懷恩與吐蕃回紇入冦自上六軍屯苑中朝恩以神策軍從而勢寖盛分為左右廂居北軍之右矣懷恩以永泰元年三月死于鳴沙韲粉之語驗矣未如洙曰又作知面縳歸金闕洙曰欲其歸降天子也左傳克許許子面縛銜璧萬一皇恩下玉墀洙曰時降者皆受節鎮河北之患自此起矣趙曰教以悔過歸命庶幾皇恩寬宥之也近聞永泰元年作補注鶴曰梁權道謂永泰元年雲安作觀詩云渭水逶迤白日靜隴山蕭瑟秋雲髙蓋言關隴無吐蕃之亂當時永泰元年子儀與回紇定約吐蕃聞之夜引兵遁時作近聞犬戎遠遁逃洙曰說文解字曰赤狄本犬種也故字犬字胸奴聞漢兵大出老弱奔走毆畜産逺遁逃牧馬不敢侵臨洮洙曰臨洮郡名也賈誼過秦論胡人不敢南下牧馬蘇曰班超鎮西域醜虜屈膝不敢南向牧馬趙曰今之洮州也渭水逶迤白日净隴山蕭瑟秋雲高補注鶴曰洮州雖是臨洮郡而岷州亦有臨洮皆屬隴右舊史寶應元年十二月陷臨洮通鑑云廣德元年七月入大震關盡取河西隴右之地京兆有渭南縣華州有渭津關隴山按唐志在渭州西南隴山有六盤關西北五里有吐蕃㑹盟壇今渭水逶迤與日俱靜隴山蕭瑟其雲自高則可見其無事矣崆峒五原亦無事北庭數有關中使洙曰言通和也趙曰突厥通好也或云回紇等不附吐蕃亦遣使中國其說亦是補注鶴曰崆峒山占原州岷州五原謂鹽州天寶元年更郡曰五原又五原或亦指關隴而言時吐蕃歸國故曰無事突厥在廣德二年亦嘗冦豐州今云數有關中使殆皆通和矣似聞贊普更求親舅甥和好應難棄夢符曰右按唐吐蕃傳其俗謂强雄曰贊丈夫曰普故號君長曰贊普趙曰先帝昔嘗和親以公主嫁贊普矣補注鶴曰通鑑與新舊史皆云永泰元年三月庚戌吐蕃請和詔宰臣元載杜鴻漸與蕃使同盟于興唐寺吐蕃傳亦云而皆不載請和之辭意是復來求親而史失書之漁陽廣德元年作彥輔曰時祿山平以雍王適領范陽盧龍節制而不出閣趙曰按通鑑十月以雍王適為天下兵馬元帥舊注以雍王受節制而不出閣非是補注鶴曰按史寶應元年八月乙亥魯王適徙封雍王明年廣德元年十月壬申雍王為關內兵馬元帥二年正月為皇太子舊史廣德三年二月巳已朔册天下兵馬元帥尚書令雍王適為皇太子此詩云赫赫雍王都節制當是廣德二年前作梁權道編在永泰元年是年雍王為皇太子已一年王洙以為一作前節制則可以為在永泰元年作却與猛將飄然恐後時本朝不入非高計等句不合漁陽突騎猶精鋭鮑曰光武曰吾聞漁陽上谷突騎天下精兵修可曰引漢光武謂馬武曰漁陽上谷突騎欲令將軍將之又引唐六典注蔡雍曰冀州强努幽州突騎天下之精也其說是補注希曰朝錯傳輕車突騎師古曰突騎言其驍鋭可用衝突敵人也赫赫雍王都節制洙曰都一作前猛將飄然恐後時本朝不入非高計洙曰祿山已破而朝廷不能革其積弊復以盧龍授藩鎮故李懷仙朱滔之屬得以跋扈竟不為朝廷所有也趙曰按編年通載十月雍王適大敗史朝義將以汴州降十一月薛嵩等皆以五州降是歲公在梓聞雍王之勝尚聞河北猶未有入朝者故告諭諸將等飄然而來已為後時而乃不入本朝豈高計乎舊注殊不考核乃云祿山已破而復以盧龍授藩鎮故李懷仙朱滔之屬得以跋扈非也按朱滔反乃是德宗建中三年李懷光反乃是德宗興元元年以雍王適為雍王遙李懷光為懷仙此皆疑誤學者不可不辨也蘇曰李靖西羌犯塞若不深入虜庭搗其巢穴實非高計祿山北築雄武城舊防敗走歸其營繫書請問燕耆舊今日何須十萬兵洙曰按新書言祿山計天下可取逆謀日熾遂乃築壘范陽北號强武峙兵積穀趙曰此篇上兩句舉往事以懲警之也言祿山初為走計而竟不保耳黃河二首廣德二年作鮑曰黃河北岸海西軍胡人高鼻動成羣謂吐蕃入寇舊注謂祿山非也黃河西岸是吾蜀鄭公軍也謂當狗之戰舊注謂明皇肅宗非也補注鶴曰鮑注是當在廣德二年作梁權道編在永泰元年是年與廣德二年米斗皆千錢皆可云欲須供給家無粟然永泰元年八月僕固懷恩及吐蕃回紇党項羌刺渾奴冦邊時公已在雲安意是廣德二年黃河北岸海西軍椎鼓鳴鐘天下聞鐵馬長鳴不知數胡人高鼻動成羣洙曰祿山之反皆漁陽突騎及所養同羅降奚契丹曳落河井誘置諸蕃皆胡騎也趙曰黃河之北大海之西則河北一帶之州郡也此篇言椎鼓鳴鐘體靣如此而使胡人動成羣而來斯乃罪其不能致力於禦之也李陵重報蘇武書云吟嘯成羣聼之不覺淚下黃河西岸是吾蜀欲須供給家無粟願驅衆庶戴君王混一車書棄金玊洙曰時明皇在蜀肅宗起靈武趙曰此篇憫蜀人困於供給而終之以願君王之無侈靡也如傳云不寶金玊之義自平大厯二年作補注鶴曰按舊史廣德元年十二月甲辰宦官市舶使吕太一逐廣南節度張休縱兵大掠廣州今詩云自平宫中吕太一收珠南海千餘日則詩當作於大厯二年蓋自廣德元年十二月太一方反平之必在二年至大厯二年為三年故曰千餘日也梁權道編在永泰元年與此不合自平宫中吕太一收珠南海千餘日洙曰吕太一代宗時為廣南市舶使逐刺史張休而反蘇曰自平宫中吕太一世莫曉其義而妄者以為唐有自平宫偶讀𤣥宗實録有宫中吕太一叛於廣南定功曰宫中當作中官見舊唐史帝紀師曰東坡嘗云讀杜詩不識太一之義及覽拾遺見有吕寧為太一宫使領廣南市舶逐刺史張休而叛乃曉太一非人名官號也補注鶴曰石林燕語云宫觀置使自祥符始蓋自王公旦為玉清昭應宫使也元祐間方有太一宫使而師云拾遺有吕寧為太一宫使疑唐末有此官號且史書廣州市舶使吕太一反既曰市舶使不應更以太一官號為稱又凡書反者皆以名不以官此當是名太一舊史云宦官市舶使吕太一則定功曰宫中當作中官為是又考舊史李勉傳勉除江西觀察使賊帥陳莊連陷江西州縣偏將吕太一武日升相繼背叛勉與諸道力戰悉攻平之然則為市舶使矣何為又為賊帥之偏將意是太一叛後又從賊帥為亂况武日升既以名稱則吕太一非以官稱亦明勉在江西當是廣德間隆興石幢載牧守名爵李勉在張鎬之後魏少遊之前而少游以大厯二年代去鎬以廣德二年九月卒於江西觀察等使又舊史代宗紀九月辛酉命洪州刺史李勉副知選事則勉是廣德二年九月到江西而平太一必在初到之年今詩云自平宫中吕太一收珠南海千餘日則詩殆作於大厯二年具年公在䕫近供生犀翡翠稀洙曰時太一反賦不上供也復恐征戍干戈密蠻溪豪族小動搖世封刺史非時朝洙曰時溪洞蠻酋歸順者皆世授刺史師曰廣連蠻洞守官不務懷輯則羣蠻相率而叛珠璣犀象翡翠之類所以不來貢也自平吕太一之後節制者得其人是以南海收珠凡三載矣近來供貢稀少復恐鎮守者不能懷柔妄舉兵征誅羣蠻此羣蠻不復來貢矣唐太宗之時應溪蠻來歸者皆封刺史不以時朝不比內諸侯姑務羈縻而已補注鶴曰按唐志嶺南道厥貢金銀孔翠犀象而諸州貢翠羽者歡桂交欽四州而已唯歡併犀角貢之自平吕太一之後所供近又稀少蓋以干戈復密蠻豪復搖是時桂州山獠反故也舊史大厯二年九月桂州山獠陷州城刺史李良遁去新史亦云所以有蠻溪豪族小動搖之句蓬萊殿裏諸主將才如伏波不得驕趙曰言汝輩才如馬伏波可以辦征南之事而輒不得驕悍也師曰太宗時諸將之才率類馬援故不敢驕慢悖命傷今不然昔漢馬援為伏波將軍羣蠻畏服除草大厯元年作洙曰去蕁也蘇曰蕁草蜀中謂之毛蕁毛芒可畏觸之如蜂蠆治風疹以此草㸃之一身光滑葉背紫者入藥蕁山韭也補注鶴曰詳味詩意雖曰喻小人之衆多所宜芟除亦是用除草以寫意故有疾惡信如讎之句以後篇考之當是大厯元年在䕫州作梁權道編在永泰元年雲安詩內草有害於人曽何生阻修洙曰言草之毒者不必生於阻修之處雖平夷之地亦有之也其毒甚蜂蠆蘇曰以言小人之言行甚於蜂蠆蜂蠆尚可去小人不可去故也趙曰蓋蕁之上皆芒刺觸之能螫人也其多彌道周洙曰道周道兩旁也清晨步前林江色未散憂芒刺在我眼洙曰霍光驂乘上內嚴憚之若有芒刺在背蘇曰馬援見諂佞輩如芒刺在眼中焉能待高秋霜雪一霑凝洙曰一作衣蕙葉亦難留師曰春以喻賞秋以喻罰焉能待高秋急於去小人也蘭蕙香草以比君子今與蕁草同殺喻政刑無辨善惡莫分荷鋤先童稚洙曰陶徴君詩荷鋤稚子倦劉曰先者以身率日入仍討求修可曰莊子云日入而息轉致水中央豈無雙釣舟晏曰禮剃人掌殺草有水火之化以釣舟載而致之水此水化也頑根易滋蔓洙曰左傳無使滋蔓敢使依舊邱師曰小人立黨其黨滋盛敢使依舊邱謂小人不可近也自兹藩籬曠更覺松竹幽芟夷不可闕疾惡信如讎洙曰左傳隱六年周任有言曰為國家者見惡如農夫之務去草焉芟夷蕰崇之絶其本根勿使復殖則善者信矣師曰松竹有操君子自守之象小人既去則君子道長而松竹得遂其生養之性也此篇大有含蓄詳玩之頗有味矣客居大厯元年作趙曰此雲安詩補注鶴曰詩云今又降元戎已聞動行軒謂杜鴻漸帥蜀按史大厯元年壬子杜鴻漸為山南西道劒南東西川卭南山西等道副元帥則是詩當在大厯元年春晚欲遷䕫州時作所以有舟子候利涉之句客居所居堂前江後山根下塹萬尋岸蒼濤鬱飛翻葱青衆木梢洙曰沈休文詩林薄杳葱青邪豎雜石㾗趙曰沈休文詩傾壁忽邪豎子規書夜啼壯士斂精魂趙曰阮籍詠懷精魂自漂淪峽開四千里水合數百源趙曰千字疑誤豈自渝州明月峽至䕫州西陵峽而下水路有四千里乎補注希曰按峽程記瀘合遂蜀四郡皆峽之郡自蠻江桔柏池導等江至此二百八千里㑹於峽前次荆門都四百五十灘蜀在西川而瀘在東川水有數百源則其迂回自源徂末未必無四千里也人虎相半居相傷終兩存蜀麻久不來吳鹽擁荆門洙曰蜀人以麻布貿易吳鹽也趙曰以商旅貨易吳鹽不行之故也西南失大將鮑曰謂鄭公卒也商旅自星奔洙曰時崔旰殺郭英乂也修可曰劉孝標廣絶交論靡不望影星奔補注鶴曰蜀多産麻成都尚載之貢籍吳蜀商旅每以麻鹽為貿易崔旰殺郭英乂蜀中大亂商旅以道阻為之奔散故蜀麻不出峽而吳鹽空擁於荆門也柴門詩亦云風煙渺吳蜀舟楫通鹽麻大扺蜀富於麻而荆多鹽如夔萬等州有鹽監鹽井亦荆州地也今又降元戎已聞動行軒洙曰時除杜鴻漸為成都尹舟子候利涉亦憑節制尊我在路中央生理不得論洙曰甫依嚴武武死英乂粗暴不能容旋有崔寧之亂此甫所以進退不能也趙曰公言其欲南下以歸長安到處留滯而未能今尚在半路也舊注云甫欲依嚴武武死英乂不能容大非是卧愁病腳廢徐步視小園短畦帶碧草悵望思王孫洙曰思嚴武也修可曰劉安招隱辭曰王孫遊兮不歸春草生兮萋萋鳯隨其皇去鮑曰豈鄭公之夫人亦繼亡也籬雀暮喧繁洙曰言賢者亡而小人喧競也時崔寧楊子琳柏正節更來成都蘇曰王符隱居不仕自歎曰鸞鳯思見而不可得籬雀終日喧人耳目何其繁也覽物想故國蘇曰王仲宣周覽春物緬想故國花草十年别荒村日暮歸幾翼北林空自昏趙曰上句以譬能歸者幾人下句以譬故居所在徒自昏暗而無有歸棲之翼也安能覆八溟為君洗乾坤洙曰時厭亂久矣故甫前有洗兵馬此有洗乾坤之說也稷契易為力犬戎何足吞趙曰但得稷契而用之易為力耳彼吐蕃犬戎何足吞乎儒生老無成蘇曰孔安國云儒士懦弱到老無成立矣臣子憂四籓篋中有舊筆情至時復援洙曰詩所謂以寫我憂也客堂大厯元年作補注鶴曰詩云栖泊雲安縣消中內相毒又云石暄蕨芽紫渚秀蘆笋緑當是大厯元年春在雲安作梁權道編在永泰元年殆未察是年公尚在成都也憶昨離少城洙曰成都之內城謂之少城趙曰指言成都也蜀都賦云亞以少城接乎其西注云少城小城也在大城西補注希曰圖經云秦張儀築少城李膺記在大城西故曰少城而今異楚蜀舍舟復深山窅窕一林麓蘇曰龎說愛山至牛條嘆曰欲得此窅窕林麓採薪種藥足以投老後隱中山果召不起號曰太平逸民隋文帝詔嘉之栖泊雲安縣洙曰雲安屬䕫消中內相毒舊疾甘載來衰年得無足死為殊方鬼洙曰李陵書云沒為異域之鬼頭白免短促洙曰不為夭也老馬終望雲南鴈意在北洙曰馬望雲鴈意在北以所居非故國此自喻也别家長兒女欲起慙筋力趙曰禮曰老者不以筋力為禮客堂序節改具物對羈束石暄蕨芽紫洙曰謝靈運詩野蕨漸紫苞渚秀蘆笋緑洙曰蘆竹笋也楚人謂之荻芽補注鶴曰爾雅釋蕨虌舍人曰蕨一名虌初生無葉詩召南云言采其蕨陸璣疏云蕨山菜也初生似蒜莖紫黑色又釋蘆云詩衛風碩人云葭菼揭揭陸璣云薍或謂之荻至秋堅成則謂之萑其初生三月中其心挺出其下本大如箸上鋭而細其萌為虇江東人呼蘆笋為虇巴稼洙曰一作鶯紛未稀趙曰舊本作巴鶯非是當作稼劉章云深耕穊種立苖欲疏公言紛未稀則苖猶多耳徼麥早向熟悠悠日動江漠漠春辭木臺郎選才俊趙曰謂省郎也公時為尚書工部員外郎故稱臺郎自顧亦巳極洙曰甫先授左拾遺前輩聲名人蘇曰張融前輩聲名映照今古埋沒何所得居然綰章紱趙曰謂緋魚也受性本幽獨平生憩息地必種數竿竹洙曰王子猷所居必種竹自云不可一日無此君事業只濁醪洙曰恨賦濁醪夕引修可曰李善注恨賦濁醪夕引之下引嵇康與山巨源書曰濁醪一杯彈琴一曲營葺但草屋上公有記者纍奏資薄祿洙曰嚴武奏甫授劒南參謀主憂豈濟時身逺彌曠職洙曰曠職於職事無所親也補注希曰主憂一本作生憂書云無曠庶官注曠空也位非其人為空官舊注謂於職事無所親非公之意循文廟算正洙曰循文守文也廟廟堂也算籌算也獻可天衢直洙曰左傳獻可替否易何天之衢尚想趨朝廷毫髮禆社稷形骸今若是進退委行色洙曰傷不得行其志耳石硯永泰元年作趙曰平侍御者補注鶴曰詩云奉使三峽中當是平持節出使至峽中或是指其至䕫梁權道編在永泰元年雲安詩內平公今詩伯天覺曰伯長也補注希曰張植語友人曰二陸乃今詩伯也秀發吾所羡奉使三峽中孫曰瞿塘明月巫峽也補注希曰李陵與蘇武書丁年奉使皓首而歸長嘯得石硯師曰晉劉琨長嘯却胡騎時峽中亂平侍御持節出使靖其亂長嘯從容不勞智力巨璞禹鑿餘洙曰禹開鑿以疏江河趙曰此使鑿字正言石也郭景純賦云巴東之峽夏禹疏鑿是也異狀君獨見其滑乃波濤其光或雷電聯坳各盡墨詠曰坳硯穴也聯坳謂雙穴相並各盡墨謂盡墨力所謂發墨也多水遞隱見薖曰謂溫潤出水也揮灑容數人十手可對靣比公頭上冠正質未為賤趙曰平公為侍御故云頭上冠者獬冠也獬豸一角獸而能觸邪此所以為正質當公賦佳句况得終清宴公含起草姿洙曰曹子建詩公子愛敬客終宴不知疲起草掌綸紼也補注希曰諸葛豐傳願賜清宴太宗時名儒學士時召草制勑未有名號至德後天子召集賢學士於禁中草書詔雖宸翰所揮亦資其檢討謂之視草兹云起草謂自草者不遠明光殿洙曰明光殿霍去病借以避暑修可曰漢殿名三秦記曰明光殿以金為戺玉為階元后傳成都侯商嘗病欲避暑從上借明光宫是已致于丹青地知汝隨顧眄三韻三篇永泰元年作補注鶴曰此詩當是永泰元年作蓋以代宗信任元載魚朝恩而士之易節者爭出其門二人在廣德永泰間其權特盛如華原令顧繇言載子伯和等招權受賂則繇坐流錦州如顔真卿言論事不當先白宰相而真卿坐貶峽州别駕魚朝恩勢傾朝野而劉希暹王駕鶴從而佐之以階顯擢故公此詩譏當時輕於趨附者詳味則其意自著師謂末篇指牛李用事官曹混濁恐未必然高馬勿唾面洙曰唾一作捶趙曰當作捶靣方有義長魚無損鱗辱馬馬毛焦困魚魚有神君看磊落士不肯易其身洙曰馬魚尚不可輕士有被褐而懷玊者其可輕乎師曰高馬長魚有異於乎類尚不輕况拔萃之士當晦其迹其可以被褐輕賤之蕩蕩萬斛船趙曰釋名曰船二百斛曰舠三百斛曰艇而趙石虎造萬斛之舟今取其大者以比興也影若揚白虹起檣必椎牛洙曰椎牛言祭也挂席集衆功趙曰椎牛所以享衆功至於用牛則人徒之衆可見船之大又可知舊注謂以牛祭非是自非風動天莫置大水中洙曰言才大不可小用也趙曰得大風天而後飽其帆也出鮑昭舞鶴賦箕風動烈士惡多門洙曰晉政多門小人自同調洙曰以其同而不和也趙曰字出謝靈運誰謂古今殊異代可同調名利茍可取殺身傍權要何當官曹清爾輩堪一笑洙曰譏附權勢以致名位者師曰晉政多門謂政出於不一小人自同調謂小人挾私互相黨同孔子云富而可求也雖執鞭之士吾亦為之如不可求從吾所好名利豈可茍求權要豈可茍附唐𤣥宗之時牛李用事官曹混濁祿山一武夫而求平章事儻遇英明之主澄汰闒冗則斯輩也直付之一笑耳此詩譏趨炎附勢者柴門大厯元年作補注鶴曰詩云泛舟登瀼西回首望兩崖又云東城乾旱天其氣如焚柴當是大厯元年夏末求居於瀼西時作所以又有蕭瑟灑秋色之句若云是大􅔦二年則是年無旱又自瀼西遷居東屯矣泛舟登瀼西洙曰楚俗以山谷間水可涉者為瀼其涉也謂之踏瀼秦俗以堰水為瀼皆謂之瀼趙曰䕫州惟有東瀼溪見水經注瀼東瀼西則水兩傍之名今云登瀼西則舟已泊而登其岸也舊注有踏瀼之說非也回首望兩崖革曰兩崖峽也東城乾旱天其氣如焚柴蘇曰言亢旱其熱氣過如焚柴趙曰爾雅云祭天曰燔柴積薪而焚之也補注鶴曰按唐五行志永泰二年關內大旱自三月不雨至於六月永泰二年改大厯元年東城指䕫自蜀言之䕫居東也故舊為巴東郡長影沒窈窕餘光散唅呀趙曰唅音憾哺也呀音虛加反張口也而公所用無乃谽谺乎蓋谽谺注云谷中也大江蟠嵌根嵌口銜切歸海成一家洙曰禹貢九州之水皆入于海趙曰嵌嵓之根也出莊子下衝割坤軸洙曰海賦又似地軸挺拔而爭回竦壁攢鏌鋣趙曰巫峽之竦蓋如鏌鋣之劒矣蕭瑟灑秋色氣洙曰一作氛昏霾日車洙曰日車見前注峓門自此始洙曰䕫州為夷門也鄭曰峓以脂切䕫州名最窄容浮查禹功翊造化疏鑿就欹斜趙曰江賦巴東之峽夏后疏鑿巨渠決太古蘇曰巫峽記巨渠開石决太古之積水衆水為長蛇蘇曰赴壑如長蛇蓋本於此矣風煙渺吳蜀舟楫通鹽麻洙曰鹽麻見前客居詩注我今遠遊子飄轉混泥沙趙曰江賦或混淪乎泥沙萬物附本性約身不願奢茅棟蓋一牀趙曰沈休文詩茅棟嘯蹲鴟清池有餘花濁醪與脫粟洙曰濁醪嵇康事脫粟公孫𢎞事在眼無咨嗟山荒人民少地僻日夕佳洙曰陶淵明詩山氣日夕佳貧病洙曰一作賤固其常富貴任生涯老於干戈際宅幸蓬蓽遮石亂上雲氣杉清延月華賞妍又分外理愜夫何誇洙曰漢書理得則不怨足了垂白年趙曰畢卓拍浮酒船中便足了一生後漢班超書今超年已垂白矣敢居高士差師曰差輩也敢以高士為伍書此豁平昔回首猶暮霞貽華陽柳少府大厯元年作鄭曰華胡化切補注鶴曰華陽唐蜀成都詩云俱客古信州又云南方六七月出入異中原當是大厯元年在䕫州作繫馬喬木間趙曰劉琨詩繫馬長松下問人野寺門師曰柳少府居於野寺甫尋訪之故云柳侯披衣笑蘇曰苻堅見張育育披衣出喜曰苻堅來矣欣然握手絶倒見我顔色溫並坐石堂下洙曰一云堂下石見别本俯視大江奔火雲洗月露趙曰東坡云火雲無時出未受月露洗蓋出於此絶壁上朝暾鄭曰暾他昆切日始出洙曰謝靈運詩早聞夕飇隱晚見朝日暾補注希曰山海經云大荒之中暘谷上有扶桑日始出也朝日始出謂之暾楚辭少司命暾將出兮東方注日始出東方其容暾暾而盛貌也自非曉相訪觸熱生病根洙曰觸冒也趙曰晉程曉詩可憐褦襶子觸熱到人家南方六七月出入異中原老少多暍死趙曰熱病謂之暍武王下車而扇暍蘇曰暍許葛切熱貌漢明帝徙河南人實河北老少途中無水暍熱死數百人汗踰水漿翻趙曰世說載鍾㑹鍾育見魏文育面有汗帝問曰何以汗對曰競競皇皇汗出如漿也俊才得之子筋力不辭煩趙曰俊才得柳少府所以不辭筋力之煩而往謁也指揮當世事師曰自此句以下謂柳生負經綸之志言及國家未寧慷慨悲憂其義氣上排帝閽帝閽天門也觀柳生之義概可與知已者論不可為俗人道也補注希曰指揮字見陳平傳語及戎馬存涕淚濺我裳悲氣排帝閽洙曰思𤣥賦呌帝閽使闢扉兮覿天皇于瓊宫補注希曰揚雄甘泉賦亦云選巫咸兮呌帝閽鬱陶抱長䇿洙曰書鬱陶乎豫心長䇿良䇿也有良䇿而不見用故鬱陶義仗知者論吾衰卧江漢但愧識璵璠洙曰潘正叔云寸晷惟寶豈無璵璠言已之所識止璵璠而已以美柳侯也文章一小伎於道未為尊趙曰後漢楊賜傳云造作賦說以蟲篆小伎見寵於時補注鶴曰班固幽通賦操末伎猶必然兮選任彥升作王憲集序昉嘗以筆札見知思以薄伎效德古人以文為伎多矣新史以文為藝亦由此也起豫幸班白因是託子孫趙曰起豫者商也言柳少府起發豫於班白衰老之間因此相見而有子孫可託之幸也俱客古信州洙曰蘷乃古信州也程曰春秋時魚國漢為魚復縣梁隋皆為巴東郡唐初改為信州又為潁州補注鶴曰蘷在梁已謂之信州唐武德二年避皇外祖諱改信為潁故曰古信州若止是唐初改為信州不得為古也潁州舊亦謂信州然此詩為蘷州而言結廬依毁垣相去四五里徑微山葉繁時危挹佳士况免軍旅喧醉從趙女舞歌鼓秦人盆洙曰楊惲書家本秦也能為秦聲婦趙女也雅善鼓瑟酒後耳熱仰天拊缶而呼嗚嗚李斯書隨俗雅化佳冶窈窕趙女不立於側也夫擊曰甕叩缶彈箏拊髀而歌嗚嗚快耳目者真秦之聲也趙古稱燕歌趙舞趙女出李斯傳秦人盆者又如李斯所謂擊甕而叩缶者真秦聲也盆即甕缶之變稱耳而鼓盆則莊子鼓盆而歌舊注妄引楊惲傳為雜矣子壯顧我傷我歡兼淚㾗餘生如過鳥故里今空村趙曰張景陽詩忽如鳥過目師曰柳生年少傷甫衰老甫喜悲相半故云我歡兼淚㢃餘生殘年也過鳥言其疾甫傷故鄉經兵革後唯空村而已此生蹉跎不獲一歸同元使君舂陵行并序大厯二年作補注鶴曰按史次山當代宗立授著作郎久之拜道州刺史西原蠻傳云乾元初西原環古等州殺黃乾曜以餘衆詣桂州降其種落張圍侯等復合兵內冦陷道州邢濟擊平之餘衆復道州元結固守不能下而次山陽華巖銘乃是永泰二年丙午五月作則次山是時在舂陵此詩云漂泊公孫城呼兒具紙筆當是大厯二年在䕫州作題云同元使君舂陵行無義同當作簡序所謂簡知我者簡訛而為同耳覽道州元使君結舂陵行兼賊退後示官吏作二首志之曰當天子分憂之地效漢官良吏之目今盜賊未息知民疾苦得結輩十數公落落然參錯天下為邦伯萬物吐氣天下少安可待矣不意復見比興體制微婉頓挫之詞感而有詩增諸卷軸簡知我者不必寄元遭亂髮盡洙曰一作遽白轉衰病相嬰沉綿盜賊際狼狽江漢行歎時藥力薄為客羸瘵成趙曰此言非不進藥以歎時之故憂思奪之其病雖痊而藥力减半也吾人詩家秀博采世上名粲粲元道州前聖畏後生洙曰粲粲言美之盛也史三女為粲論語後生可畏觀乎舂陵作歘見俊哲情復覽賊退篇結也實國楨賈誼昔流慟洙曰賈誼上疏可為慟哭者三匡衡常引經洙曰匡衡上疏陳便宜及朝廷有政議傳經以對道州憂黎庶詞氣浩縱橫洙曰道州元結也劉公幹君侯多壯思文雅縱橫飛兩章對秋月洙曰一作水一字偕洙曰一作皆華星趙曰魏文帝詩華星出雲間致君唐虞際洙曰見致君堯舜上注純朴憶大庭洙曰大庭氏也蘇曰崔列此方人多純朴吾大庭氏之遺民也師曰賈誼陳治安之䇿曰可為流涕慟哭者匡衡每朝廷有論義常引經以對道州指元結之守道州志在憂民嘗抗兩章詞氣激於忠義一字不虛設欲致君為堯舜之君使民風純朴如大庭氏故甫比之賈誼與匡衡也何時降璽書洙曰前漢循吏傳二千石有治效輒以璽書勉勵焉用爾為丹青趙曰莊子為丹青則藻縟王猷粉飾獄具獄訟永衰息洙曰漢禮樂志百姓素朴獄訟衰息也豈惟偃甲兵悽惻念誅求薄斂近休明補注鶴曰按史云結拜道州刺史為民營舍給田免徭役流亡歸者萬餘又按結作道州刺史㕔壁記云自至此州見井邑邱墟其民幾盡試問其故不覺涕下前政剌史或有貪猥惛弱不分是非但以衣服飲食為事數年之間蒼生䝉以私欲兼之公家驅迫非奸惡彊富殆無存者此公所謂息訟偃兵不以誅求重斂為事亦本舂陵賊退二篇憂及黎庶而云久字亦本作永乃知正人意不茍飛長纓洙曰陸士衡詩長纓麗且光趙曰長纓者冠冕之飾以歎其不茍且在冠冕之中也凉飇振南嶽洙曰南嶽衡山也之子寵若驚洙曰老子寵辱若驚色沮金印大趙曰周伯仁云今年殺諸賊奴取金印如斗大繫肘興含滄溟清洙曰溟一作浪趙曰孺子歌曰滄浪之水清兮可以濯我纓我多長卿病洙曰長卿司馬相如也病渴日夕思朝廷肺枯渴太甚漂泊公孫城洙曰白帝城公孫𫐠所據呼兒具紙筆蘇曰陸士衡有客篇有客逺方來過我漏蓬蓽瓦罍酌松醪呼兒具紙筆隱几臨軒楹作詩呻吟內墨淡字欹傾感彼危苦辭庶幾知者聽師曰司馬相如字長卿病渴甫亦有是疾公孫城乃蘷州是時甫客居於此思慕朝廷未嘗一日忘君隱几倚几也呻吟苦痛之聲乃為渴疾所苦字欹傾病中書字橫斜也危苦詞謂道州舂陵之作寄狄明府大厯二年作補注鶴曰詩云胡為漂泊岷漢間當是在䕫州作又云不見十年官濟濟當是避亂時相别自天寶戊戌至大厯丁未為十年蓋大厯二年也梁公曽孫我姨弟洙曰狄仁傑封梁國公母之姊妹之子曰姨弟不見十年官濟濟大賢之後竟陵遲浩蕩古今同一體比看伯叔四十人有才無命百寮底洙曰沉下位也今者兄弟一百人幾人卓絶秉周禮洙曰閔元年齊仲孫湫來省難及還公問魯可取乎對曰猶秉周禮未可動也言猶守先王法度也此詩言兄弟雖多能守梁公之法幾人爾在汝更用文章為長兄白眉復天啓洙曰馬良兄弟五人並有才名鄉里諺曰馬氏五常白眉最長良眉中有白毛因以是為稱汝門請從曾公說洙曰梁公也太后當朝多巧計狄公執政在末年濁河終不汚清濟洙曰言獨立於朝不移於衆邪趙曰謝𤣥暉始出尚書省詩紛紛亂朝日濁河汚清濟國嗣初將付諸武公獨廷諍守丹陛洙曰武后當朝革唐為周欲以武三思為儲二以問宰相皆莫敢對仁傑獨曰臣每觀天下未厭唐德禁中决策詔房陵洙曰房陵中宗所在前洙曰一作滿朝長老皆流涕洙曰狄仁傑傳初中宗在房陵而吉頊李昭德皆有匡復讜言則天無復辭意唯仁傑每從容奏對事無不以子母恩情為言則天亦漸省悟召還中宗太宗社稷一朝正漢官威儀重昭洗洙曰后嘗夢雙陸不勝仁傑對曰雙陸不勝無子也因進說文皇帝身陷鋒鏑而有天下以傳子孫陛下因監國掩而有之又欲以三思為後且子母與姑姪孰親若立三思廟不附姑后感悟即日迎中宗復唐社稷漢光武紀人見司𨽻僚屬皆歡喜不自勝老吏或垂泣曰不圖今日復見漢官威儀時危始識不世才蘇曰楊修謂曹適曰時危始見不世之才如孔文舉輩是也誰謂荼苦甘如薺洙曰衛風谷風詩誰謂荼苦其甘如薺汝曹又冝裂土食身使門户多旌棨洙曰裂土一作列鼎賢者之後冝有土趙曰杜田引唐制節度使就第賜旌節三品以上門立㦸後漢丐奴傳注曰有衣之㦸曰棨補注希曰裂土即武成分土之義謂裂地分國也子虛賦霓旌注羽毛染以五采綴以縷為旌韓延壽傳棨注幢棨有衣之㦸也其衣以赤黑繒為之胡為飄泊岷漢間干謁王侯頗歷詆洙曰詆訐也息夫躬歷詆漢朝公卿况乃山高水有波秋風蕭蕭露泥泥洙曰謝詩凝露方泥泥鄭曰泥奴禮切濃露也虎之饑下巉嵒蛟之橫出清泚早歸來黃土汚衣眼易眯歐曰眯莫禮切物入眼中莊子簸糠眯目師曰眯物入眼古詩云昔為掌上珠今為眼中刺補注希曰陸機所謂京洛多風塵素衣化為緇之意又元規塵汚人人一作塵士汚人眼中易眯寄韓諫議大厯元年作師曰地理志嶽州巴陵郡在嶽之陽故曰嶽陽有君山洞庭湖湘江韓注以諫議職直言陳天下事代宗不悅貶嶽陽注適意遊君山棄人間事將為長往之計甫思之故有此作補注鶴曰詩云今我不樂思嶽陽身欲奮飛病在床當是大厯元年在蘷州作公是時抱病詩多言之梁權道以詩云美人娟娟隔秋水謂是其年秋作今我不樂思嶽陽洙曰嶽陽巴陵也屬湖南身欲奮飛病在床洙曰詩靜言思之不能奮飛美人娟娟隔秋水洙曰詩人以美人比君子故詩有彼美人兮西方之人兮趙曰公時在夔而韓在嶽斯為隔秋水矣補注希曰楚辭亦多言美人云滿堂兮美人之類是也列女傳趙靈女鼓瑟而歌曰美人熒熒兮類苕之英濯足洞庭望八荒鴻飛冥冥日月白佘曰揚子鴻飛冥冥弋人何慕焉青楓葉赤天雨霜洙曰選詩曉霜楓葉丹趙曰鮑昭詩窮秋九月荷葉黃北風驅鴈天雨霜玉京羣帝集北斗洙曰玉京帝居也五方各有帝唯北極為至尊夢符曰右按晉天文志北極五星北辰最尊者也北斗七星在太微北七政之樞機隂陽之元本故運乎天中而臨制四方以建四時而均五行人君之象號令之主趙曰羣帝如諸王三公之類以言天上五方之帝三十三天之帝雖稱帝而於大帝為卑故稱羣帝也或騎麒麟翳鳯凰洙曰集仙傳天人降王妙想皆乘麒麟鳯凰龍鶴大鳥是也芙蓉旌旗煙霧樂洙曰楚詞搴芙蓉兮木末影動倒景搖瀟湘洙曰郊祀志登遐倒景注在日月之上反照故其影倒也趙曰言瀟湘言韓在嶽陽也星宫之君醉瓊漿洙曰楚詞瑶漿蜜勺實羽觴華酌既陳有瓊漿羽人稀少不在傍趙曰楚詞仰羽人於丹邱似聞昨者赤松子恐是漢代韓張良昔隨劉氏定長安帷幄未改神慘傷洙曰張良其先韓人也高祖立蕭相國良乃稱曰家世相韓今以三寸舌為帝者師封萬户位列侯此布衣之極於良足矣願棄人間事欲從赤松子游耳師古曰赤松子仙人號也神農時為雨師高祖曰運籌帷幄之中决勝千里之外吾不如子房國家成敗吾豈敢色難腥腐餐楓香洙曰鮑明逺詩何時與汝曹啄腐共吞腥趙曰神仙傳壺公留費長房於羣虎之中長房不恐又內石室中頭上有大石茅繩懸之諸蛇嚙繩欲斷長房不移公往撫之曰可教矣又命噉穢臭惡非常長房色難之公乃歎而謝遣之曰子不得仙也今以子為地主周南留滯古莫惜洙曰太史公留滯周南南極老人應壽昌洙曰春秋元命苞云老人星治平則見見則主壽美人胡為隔秋水焉得置之貢玉堂師曰欲得此美德之人貢之玉堂以輔天子不冝隱於此也補注希曰谷永傳損椒房玉堂之盛寵師古曰玉堂嬖幸之宫又揚雄傳上玉堂晉灼曰黃圖有大王堂小玉堂殿此當是用揚雄傳中字雖然玉堂本出黃庭經所謂玉堂絳宇盡𤣥宫是也課伐木并序大厯元年作補注鶴曰詩云客居課奴僕今以前篇客居詩考之當是大厯元年夏夔州作課𨽻人伯夷幸秀信行等入谷斬隂木洙曰冬官輪人為輪斬三材必以時注材在陽則以仲冬斬之在隂則以仲夏斬之此並據山虞云人日四根止維條伊枚洙曰詩終南何有有條有枚正直挺然晨征暮返委積庭內我有藩籬是缺是補載伐篠簜洙曰禹貢揚州篠簜既敷注篠竹箭簜大竹鄭曰篠先了切竹小者簜徒沆切大竹也伊杖支持則旅次于小安山有虎知禁若恃爪牙之利必昏黑搪突鄭曰搪徒郎切突陀沒切觸也夔人屋壁列洙曰一作立樹白萄鏝為墻鄭曰鏝謨官切杇也實以竹示式遏為與虎近混淪乎無良賓客憂洙曰一作齒害馬之徒洙曰莊子黃帝於襄城下見牧馬童子而問理天下童子曰為天下何異乎牧馬去其害馬者茍活為幸可默息已作詩付宗武誦長夏無所為客居課奴僕清晨飯其腹持斧入白谷青冥曾巔後趙曰張平子南都賦言木有曰攢立叢駢青冥芊眠謝靈運詩築觀基曽巔薖曰曽巔高山也十里斬隂木修可曰周禮山虞仲冬斬陽木仲夏斬隂禾鄭𤣥注陽木生南山隂木生北山蘇曰韓信廟記斬十里隂木鑿五尋巨石也人肩四根巳亭午下山麓尚聞丁丁聲洙曰天台賦羲和亭午詩伐木丁丁功課日各足蒼皮成委積素節相照燭藉汝跨小籬當仗洙曰一作當材若虛竹空荒咆熊羆乳獸待人肉蘇曰亷頗别傳曰乳虎饑怒而待人肉豈有弃於齒牙之間也不示知禁情豈唯干戈哭城中賢府主師曰嘆美夔守也處貴如白屋蘇曰戴憑富貴如歸閭里曰每食列鼎常思黃粱蕭蕭理體淨洙曰治道貴清淨蜂蠆不敢毒蘇曰葛稚川與兒出戲誤捉蜂蠆不敢毒螫其父嘉之鄉里皆推重補注鶴曰賢府主當是柏都督公嘗為柏都督作謝上表正是初到䕫時表云先之以簡易開之以業産均之以賦斂終之以敦勸嚴禁將士之暴正理淨之意也虎穴連里閭隄防舊風俗泊舟滄江岸久客慎所觸舍西崖嶠壯雷雨蔚含蓄墻宇資屢修衰年怯幽獨爾曹輕執熱蘇曰杜周兵馬輕執熱而深入已成虜功不可旌賞為我忍煩促秋光近青岑季月當泛菊報之以微寒共給酒一斛蘇曰徐邈酒一壺餅三事師曰甫泛舟自蜀來泊止於此要當戒慎無觸此禍又况舍西山嶠雄壯含蓄猛獸極多墻壁貴乎修葺是以課𨽻斬木取竹以為扞禦之備爾輩指信行等冒熱取竹木宜有以勞之泛菊伊邇給酒一斛以報其勞仍以慰餘寒爾園人送瓜趙曰此太平遣官送園中瓜也師曰時柏公守夔遣人送瓜大厯元年補注鶴曰詩云柏公鎮夔國正是公為柏都督作謝上表者大厯元年夏作江間雖炎瘴瓜熟亦不早柏公鎮夔國滯務兹一掃鄭曰柏中丞也補注鶴曰以公為夔府柏都督謝上表云察臣劒南區區恐失臣節當是柏貞節如柏茂林則大歷元年二月方為卭南防禦使八月又為邛南節度使不應在夔也滯務兹一掃言新政之敏也食新先戰士洙曰成十年傳桑田巫言晉侯不食新矣逸曰食新嘗新也共少及溪老師道曰共少分甘也溪老甫自稱傾筐蒲鴿青鴿葛合切師曰青瓜色如蒲鴿蒲鴿狸首皆瓜名也滿眼顔色好竹竿接嵌竇鄭曰嵌丘銜切嵌岩山險也師曰嵌竇岩泉也引注來鳥道師曰鳥道乃飛鳥之道高貌沉浮亂水玊洙曰魏文帝浮甘瓜於清泉赤松子服水玉沈曰亂水玉水精也補注希曰山海經云堂庭之山多水玉注水精也本草以玻璃為水玉陳藏器云是千嵗氷化為之愛惜如芝草落刃嚼氷霜開懷慰枯槁許以秋蒂除洙曰謝𤣥暉詩殘翩似秋蒂仍看小童抱洙曰一作飽東陵跡蕪絶楚漢休征討洙曰東陵邵平種瓜之地也園人非故侯種此何草草趙曰此兩押草字豈東坡所云兩耳義不同故得重用邪師曰草草辛苦貌信行遠修水筒洙曰引水筒也師曰信行乃童行也大厯元年作補注鶴曰課伐木序證之當是大厯元年在䕫作信行即前所謂𨽻人伯夷幸秀信行師曰信行乃童行然既與幸秀同謂之𨽻人兹云清淨僕夫內恐非童行姓譜自有姓信者無乃以不茹葷及清淨為童行耳汝性不茹葷清淨僕夫內秉心識本洙曰一云根源於事少滯礙雲端水筒坼林表山石碎洙曰鮑明遠詩雲端楚山見林表吳岫微觸熱藉子修通流與㕑㑹往來四十里荒險崖谷大日曛驚未餐洙曰曛黑也貌赤愧相對浮瓜供老病裂餅嘗所愛洙曰何曽傳蒸餅上不坼作十字不食之趙曰公食餅則裂而與之乃常所私愛信行者也故繼以於斯答恭謹於斯答恭謹足以殊殿最洙曰文賦考殿最於錙銖注下功曰殿上功曰最詎要方士符何假將軍蓋趙曰意是二師將軍拔刀刺山而飛泉出事但無蓋字耳行諸直如筆用意﨑嶇外定功曰直如筆言其有用而不邪曲也故後魏古弼太武嘉其直而有用賜名曰筆以其頭尖又名尖頭奴時人呼之為筆公後改曰弼槐葉冷淘大厯二年作補注鶴曰詩云新麵來近市則公是時不居城郭當是遷居瀼西時作大厯二年故詩又云願隨金騕裊走置錦屠蘇路遠思恐泥興深終不渝獻芹則小小薦藻明區區意公作冷淘以餉人併賦此侑之青青高槐葉采掇付中㕑洙曰曹子建豐膳出中㕑新麵來近市汁滓宛相俱洙曰以槐葉溲麵為冷淘取其碧鮮可愛入鼎資過熟加餐愁欲無碧鮮俱照筯香飯兼苞蘆蘇曰蜀人呼魚鮓為苞蘆經齒冷於雪勸人投比珠願隨金騕裊洙曰金騕裊馬也趙曰騕裊神馬名盧照鄰詩漢朝金騕裊補注希曰漢武帝紀更黃金為麟趾裊蹄應劭曰古有駿馬名騕裊赤喙黑身一日行萬五千里也走置錦屠蘇洙曰蜀人元日入香藥漬酒而飲謂之屠蘇修可曰屠蘇屋名或作屠蘇玊篇云屠蘇庵也通俗文屋平曰屠蘇廣韻曰屠蘇草庵又屠蘇酒元日飲之可除瘟氣則屠蘇有二義是詩走置錦屠蘇乃屋也非酒古樂府劉孝威結客少年場行插腰銅匕首障月錦屠蘇路遠思恐泥乃計切洙曰語致遠恐泥興深終不渝獻芹則小小洙曰野人有美芹而獻於君者薦藻明區區洙曰左傳蘋蘩蕰藻之菜可薦於鬼神可羞於王公補注希曰楚元王傳豈為區區之禮哉師古曰區區謂小也說文云芹楚葵也萬里露寒殿洙曰上林賦過鳷鵲望露寒露寒漢殿名開冰清玉壺洙曰鮑昭詩清如玉壺冰君王納凉晚此味亦時須行官張望補稻畦水歸大厯二年作補注鶴曰詩云東屯大江北百頃平若桉六月青稻多千畦碧泉亂當是大厯二年公未遷東屯時作是年秋公始自瀼西遷居也東屯大江北洙曰一云枕大江鄭曰屯徒渾切聚也百頃平若桉饒曰六尺為步步百為畝畝百為頃六月青稻多千畦碧泉亂插秧適云已引溜加溉灌更僕往方塘洙曰更僕以番次更代使之也劉公幹方塘含白水决渠當斷岸洙曰西都賦决渠降雨趙曰鮑明遠蕪城賦崒若斷岸公私各地著洙曰食貨志理民之道地著為本師古六謂安土也著陟略切補注希曰張騫傳亦云土著謂有城郭常居不隨畜牧移徙也浸潤無天旱主守問家臣洙曰陸韓云庶子及家臣分明見溪畔竿竿炯翠羽剡剡生銀漢趙曰曹植洛神賦云或拾翠羽廣雅云天河謂之天漢亦曰銀漢也師曰剡剡竹末削殺貌補注希曰竿竿善本作芊芊翠羽蓋喻禾之青秀鷗鳥鏡裏來關山雪邊看秋菰成黑米洙曰菰米雕胡也趙曰鏡裏雪邊皆言畦水之明潔也精鑿洙曰一作榖傳白粲夢符曰按鄭氏釋詩俾疏斯稗云米之率糲十稗九鑿八侍御十趙曰精鑿出左傳粢食不鑿音作鑿謂治米使白朝曰傳合也以菰米合白粲炊飯玊粒足晨炊紅鮮任霞散趙曰蘇秦所謂米貴如玉也終然添旅食作苦期壯觀洙曰史韓信傳晨炊蓐食楊惲田家作苦趙曰魏文帝云旅食南館遺穗及衆多我倉戒滋蔓趙曰詩云遺秉滯穗伊寡婦之利師曰利於人而嗇於已之意催宗文樹雞栅大厯元年作補注鶴曰公以大厯元年暮春自雲安遷居䕫州而此詩云吾衰怯行邁旅次展崩迫又云喧呼山腰宅課奴殺青竹當是大厯元年作山腰宅蓋客居也客居詩云客居所居堂前江後山根吾衰怯行邁耒曰遠行曰邁旅次展崩迫趙曰易旅卦有旅即次任彥升辭啓曰不任崩迫之情愈風傳烏雞洙曰本草以烏雌雞治風秋卵方漫喫趙曰春卵可以抱育而秋卵充食而已自春生成者隨母向百翮驅趂制不禁喧呼山腰宅課奴殺青竹洙曰楚人以火炙竹去其汗謂之殺青欲其耐久也終日憎赤幘洙曰赤幘雞之有冠趙曰小說載空窑有怪或居之中夜有赤幘而來問其怪類答曰老雄雞也踏藉盤案翻塞蹊使之隔墻東有隙地可以樹髙栅避熱時來歸問兒所為跡織籠曹其內令入不得擲稀間可突過觜爪還汚席我寬螻蟻遭彼免狐貉厄應宜各長幼自此均勍敵籠栅念有修近身見洙曰一作知損益洙曰言非特制雞而已於近身之事亦可知損益也明明領處分一一當剖析不昧風雨晨洙曰晦明風雨不亂其鳴也亂離減憂戚洙曰雞鳴之詩序詩者以為亂世則思君子子美之减憂戚其可見矣其流則凡鳥其氣心匪石洙曰以不改其度也倚賴窮嵗晏補注希曰剖一本作割嵗晏一本作晚歲撥煩去洙曰一作及冰釋趙曰莊子渙若冰將釋未似尸鄉翁拘留蓋阡陌洙曰祝雞翁居尸鄉山下養雞百餘輩有名字呼名則種别而至販雞及賣子見列子傳園官送菜并序大厯元年作園官送菜把本數日闕矧苦苣馬齒掩乎嘉蔬傷小人妬害君子莧不足道也比而作詩趙曰三曰比之義補注鶴曰因園官送苦苣馬齒而傷小人之害君子公蓋傷時亦以自傷也題曰園官皆指䕫州公園而言故首云常荷地主恩地主謂太守也當在大厯元年作清晨䝉菜把常荷地主恩趙曰國語越王以㑹稽三百為范蠡地曰後世有敢侵蠡之地者皇天后土四鄉地主正之守者愆實數略有其名存苦苣刺如針馬齒葉亦繁青青嘉蔬色埋沒在中園洙曰此序所以言小人害君子也趙曰公言所送止苦苣馬齒莧爾而所謂嘉蔬者未嘗摘以相遺也張載登成都白菟樓云原隰植嘉蔬師曰嘉蔬比君子苦苣馬齒比小人言小人掩君子君子不得其所園吏未足怪世事固堪論嗚呼戰伐久荆棘暗長原師曰老子曰大軍之後必有凶年荆棘生焉乃知苦苣輩傾奪蕙草根洙曰蕙草薰草也小人塞道路為態何喧喧又如馬齒盛氣擁葵荏昏洙曰葵荏嘉蔬也趙曰苦苣馬齒如小人可知葵荏正以言嘉蔬蕙草雖不可為蔬而要之君子之比師曰蕙草香有君子之象蕙草見奪於苦苣以比君子為小人所勝也小人得志則作態驕淫矜夸靡所不至故云為態何喧喧葵荏嘉蔬又為馬齒昏塞足見小人勢盛君子道消也補注希曰葵如戎葵葵楚葵蔠葵荏如荏菽桂荏皆嘉種見爾雅也㸃染不易虞師曰喻君子為小人所汚絲麻雜羅紈一經器洙曰一作氣物內永挂粗刺㾗趙曰以苦苣馬齒一經器物所盛則更久遠挂粗刺之㾗然則君子固宜慎所染矣師曰喻國家為小人所敗國者天下之大器也志士採紫芝放歌避戎軒洙曰古有紫芝歌神仙所作趙曰皇甫謐高士傳秦世坑黜儒術四皓作歌曰莫莫高山深谷逶迤曄曄紫芝可以療饑畦丁負籠至感動百慮端上後園山腳大厯二年作補注鶴曰詩云自我登隴首十年經碧岑又云朱夏熱所嬰清旦步北林當是大厯二年夏作按公以乾元二年已亥入隴右大厯二年戊申為十年然二年正月已出峽今首云朱夏則是二年夏無疑詩又云故園暗戎馬謂同華節度使周智光反其年正月郭子儀討之而去年正月吐蕃亦陷原州也朱夏熱所嬰清旦步北林小園背高岡挽葛上崎崟天覺曰崎崟山也曠望延駐目飄颻散踈襟潛鱗恨水壯洙曰水壯則非潛鱗之所居也去翼依雲深洙曰蓋避難地不可不深遠也趙曰以譬隱淪之士須幽曠深遠而後可勿謂地無疆洙曰坤厚載物德合無疆劣於山有隂洙曰山北曰隂時喪亂九州分裂孰若山隂之可以避亂也石榞遍天下田曰唐頴曰榞音原木名皮可食或云善本止是石原蓋平地曰原鄭曰榞實如甘蕉而皮可食沈曰石榞其子如芎藭其皮可以禦饑時天下荒亂小民轉溝壑水陸並載石榞以充飢水陸兼浮沈自我登隴首十年經碧岑劒門來巫峽薄倚浩至今洙曰自鳯翔赴同谷由同谷入蜀沿流下峽皆山水鄉也故園暗戎馬骨肉失追尋時危無消息老去多歸心志士惜白日趙曰古詩志士惜白日久客藉黃金洙曰古詩徒有萬里志欲行囊無金敢為蘇門嘯庶作梁父吟洙曰阮籍嘗登蘇門山有真人在焉籍對之長嘯及歸至半嶺間聞劃然有聲若數部鼓吹乃前人嘯也諸葛亮好為梁父吟師曰甫不敢以真人自居但效諸葛躬耕嘯詠而已此謙辭也驅豎子摘蒼耳趙曰蒼耳今所謂羊貟菜也在詩則謂之卷耳大厯二年作補注鶴曰豎子即獠奴阿段公以大厯二年遷居赤甲瀼西皆在奉節縣北三十里此詩云江上秋已半林中瘴猶劇又云侵星驅之去爛漫任遠適則非在城郭中語當是大厯二年秋作江上秋已分林中瘴猶劇畦丁告勞苦洙曰畦丁種田者猶今之佃民無以供朝夕蓬莠猶不焦野蔬暗泉石卷耳况療風洙曰見本草補注希曰苓耳也形似鼠耳叢生如盤陸璣疏云可煮為茹四月生子如婦人耳璫豳人謂爵耳是童兒且時摘洙曰一云童僕先時摘侵星驅之去爛漫任遠適放筐亭午際洗剝相䝉羃趙曰洗其土剝其毛登床半生熟趙曰登食床也或作生菜或作熟食下筯還小益趙曰小益謂療風也加㸃瓜薤間依稀橘奴跡洙曰李衡以橘為木奴故江湘有橘奴號亂世誅求急黎民糠籺窄夢符曰按前漢陳平傳或謂平何食而肥若是其嫂疾平不親家生産曰亦食糠核耳晉灼曰核一音紇京師人謂粗屑為紇頭飽食復何心荒哉膏梁客夢符曰按唐柳芳氏族論曰三世有三公者曰膏梁有令僕者曰華腴富家厨肉臭戰地骸骨白洙曰言天下荒亂饑饉薦仍而在位者無救恤之意寄語惡少年黃金且休擲洙曰燕太子者得荆軻與之臨池軻以瓦扺蛙太子命捧金以進軻用抵之又進軻曰非為太子愛金乃臂痛爾趙曰梁元帝古意詩中有惡少年技能專自得昔遊大厯元年冬作補注鶴曰詩云景晏楚山深當是在夔州作故公到雲安有南楚詩蓋夔在春秋為魚國後乃屬楚大厯元年冬作昔者與高李高適李白晚登單父臺洙曰宓子賤嘗為單父宰鮑曰按唐志單父屬宋州補注鶴曰單父古邑隋於縣置戴州貞觀十七年乃廢縣屬宋州本朝為單州治單父與高李同於時在開元二十五年寒蕪際碣石萬里風雲來琪曰言其地廣遠也師曰甫昔與高適李白同登是臺眺望山東之地沃野萬里遂叙其地豐富如此自祿山反於山東風俗雕弊傷今不如昔也補注希曰書太行恆山至於碣石注二山連延東北曰碣石唐志河北道其名山曰碣石與高李登單父臺時雖嚴冬宜見寒蕪之遠而不應遠見河北按齊地記渤海東有碣石謂之渤碣河北亦魏渤海地齊地渤碣者在渤海之東爾桑柘葉如雨飛藿共徘徊師曰桑柘所養蠶葉潤澤如雨藿乃葵藿人食嘉蔬以藿為賤藿生子隨風飛徘徊蓋言蔬菜厭飫有餘故也清霜大澤凍禽獸有餘哀是時倉廪實洞逹寰區洙曰一作宇開洙曰此言開元之際也時天下富庶民俗殷阜山澤河隍之賦府庫充積不可勝計猛士思滅胡洙曰時任蕃將務邉功將帥望三台洙曰時邉帥有帶平章事者安祿山以求宰相不得而遂反君王無所惜駕馭英雄才幽燕盛用武洙曰時祿山擊契丹無寧嵗供給亦勞哉吳門轉粟帛泛海陵蓬萊洙曰時韋堅於望春樓下鑿溝以通漕大置南海珍貨舟尾相銜數十里不絶因作樓觀之補注鶴曰吳門即蘇州唐運江淮租賦以給幽燕之師故泛東海以逹之蓬萊蓬萊在東海中故云泛蓬萊肉食三十萬獵射起黃埃夢符曰按春秋左傳曰肉食者鄙未能遠謀蘇曰正言虛養肉食之士三十餘萬一朝社稷災變無一夫委身為朝廷者隔河憶長眺青歲已摧頽洙曰肅宗渡河入靈武也不及少年日無復故人杯賦詩獨流涕亂世想賢才有能洙曰一作君能市駿骨莫恨少龍媒洙曰古有市駿馬骨而得駿馬者以喻尊士之似賢則必得真賢商山議得失洙曰四皓也議得失謂安漢太子也蜀主脫嫌猜洙曰蜀主劉備也為曹操嫌猜吕尚封國邑洙曰封於營丘號齊傅說已鹽梅洙曰作相也師曰以比能用賢也傷今不然景晏楚山深水鶴去低回師曰陶潛歸去來辭云鳥倦飛而知還亦此意也龎公任本性携子卧蒼苔洙曰龎德公也與妻子隱於鹿門山孟子曰窮則獨善其身逹則兼善天下上之數公皆能乘時以有為者也甫自悲不得其時則莫若效龎公之潔已爾補注杜詩卷十一
