  hash: sha256:12d8190cadcf5eac3a9a3b81ae053c873dee29480bf15c1526bdc2f7417fab40
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4c0017_WYG_000-1a, image: WYG1069/WYG1069-0001a.png}
body:
  text: 補注杜詩别集類一唐提要臣等謹案補注杜詩三十六卷宋黃希原本而其子鶴續成之者也希字夢得宜黃人登進士第官至永新令嘗作春風堂於縣治楊萬里為作記今載誠齊集中鶴字叔似著有北忩寓言集今已久佚希以杜詩舊注每多遺舛嘗為隨文補緝未竟而殁鶴因取槧本集注即遺藁為之正定又益以所見積三十餘年之力至嘉定丙子始克成編書首原題補千家集注杜工部詩史所列注家姓氏實止一百五十一人注中徵引則王洙趙次公師尹鮑彪杜修可魯訔諸家之說為多其他亦寥寥罕見而當時所稱為蘇注者乃並見採綴蓋坊行原有千家注本鶴特因而廣之故以補注為名其郭知達九家注蔡夢弼草堂詩箋視鶴本成書稍前案知逹本成于淳熙辛丑在鶴本前三十餘年夢弼成于嘉泰甲子在鶴本前十有二年而注內無一字引及殆流傳未廣偶未之見也書中凡原注各稱某曰其補注則稱希曰鶴曰以别之大㫖在于按年編詩故冠以年譜辨疑用為綱領而詩中各以所作歲月注于逐篇之下使讀者得考見其先後出處之大致其例蓋始于黃伯思後魯訔等踵加考訂至鶴父子而益推明之鈎稽辨證亦頗具苦心其間抵牾不合者如贈李白一首鶴以為開元二十四年遊齊趙時作不知甫與白初未相見至天寶三四載白自供奉被放後始相遇于東都觀甫寄白二十韻詩所云乞歸優詔許遇我宿心親者是其確證鶴說殊誤又鄭駙馬宅宴洞中一首鶴謂與重題鄭氏東亭詩皆在河南新安縣作不知長安志有蓮花洞在神禾原鄭駙馬之居即詩所云洞中並不在新安不可與東亭混而為一又髙都護驄馬行鶴以為天寶七載作考髙仙芝平小勃律後以天寶八載方入朝詩中有飄飄逺自流沙至語則當在八載而非七載又遣興詩赫赫蕭京兆句鶴以京兆為蕭至忠不知至忠未嘗官京兆尹詩中所指當是蕭炅又喜雨一首鶴謂永泰元年所作考詩末甫自注浙右多盜賊語正指寶應元年袁朝之亂詩當作于是年時甫方在梓閬間故有巴人之句鶴說非是似此者尚數十條皆為踈于考核又題與詩皆無明文不可考其年月者亦牽合其一字一句強為編排殊傷穿鑿然其考據精核者後來注杜諸家亦往往援以為證故無不攻駁其書而終不能廢棄其書焉乾隆四十六年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀補注杜詩原序居誼兒時聞先君樂道永新大夫黃公之賢至則令出拜且曰此鄉先生可師法者也居誼雖不敏心竊識之及壯讀公之文知其博覽羣書於經史子集章句訓詁靡不通究於是有感先君所以幸教小子之意欲就正焉而公則仙去矣晚嵗杜門公之子鶴過而道舊出其紀年補注詩史一編蹙然請曰鶴先人生平嗜此恨舊注舛疏補訂未竟齎志以殁不肖勉卒先業餘三十年所謂千四百篇者不敢謂盡知工部意庶幾十七八矣盍為我序之退披其編詩以年次意隨篇釋冠以譜辨視舊加詳至謂耒陽乃瘞宗文髙都護之非適呂太一之非官又皆意逆而得之往往前輩或未及不但成先志而已昔杜預注春秋左傳世以預為丘明忠臣黃氏父子用功此詩謂非忠於工部不可然春秋繫年日書甲子預以厯法推考有未合則歸之史誤工部雖號詩史凡所紀述非必如春秋書法之密後數百年而生必欲一一推見當時嵗月先後亦難矣矧詩自風雅而下惟工部為宗其淵深浩博後人莫窺涯涘有謂工部胸中凡幾國子監又謂不行一萬里不讀萬卷書不可以觀杜詩近世鋟板注以集名者毋慮二百家固宜鈎析證辨無復餘藴而補遺訂謬方來未已信知工部之詩可觀不可盡然吾於是編又得以窺黃氏家學之懿慰滿夙心云寶慶二年三月清明日郡人董居誼仁甫序補注杜詩跋山谷嘗謂老杜作詩無一字無來處第恨後人讀書少不足以知之今生乎數百載之後欲探古人之心於數百載之前凡諸家箋注之所未通者皆斷以已見自非胸中有萬卷書其敢任此責耶黃氏之於此詩蓋如班馬父子之作史凡兩世用工矣積兩世之學以研精覃思是宜援據淹該非諸家之所敢望也博洽君子以諸家舊注與此合而觀之則是非得失當有能辨之者寶慶丙戍仲夏富沙吳文跋欽定四庫全書補注杜詩宋黃希原本黃鶴補注傳序碑銘唐新書杜工部傳宋祁甫字子美少貧不自振客吳楚齊趙間李雍竒其材先往見之舉進士不中第困長安𤣥宗開元二十五年甫預京兆薦貢而考功下之天寶十三載𤣥宗朝獻太清宫饗廟及郊甫奏賦三篇帝奇之使待制集賢院命宰相試文章擢河西尉不拜改右衛率府胄曹參軍數上賦頌數色角切頻也因髙自稱道且言先臣恕預以來承儒守官十一世逮審言以文章顯中宗時臣賴緒業自七歲屬辭且四十年然衣不蓋體常寄食於人竊恐轉死溝壑伏惟天子哀憐之若令執先臣故事拔泥塗之久辱則臣之述作雖不足鼓吹六經先鳴諸子至沉鬱頓挫隨時敏給揚雄枚臯可企及也有臣如此陛下其忍棄之㑹祿山亂天子入蜀天寶十四載安祿山反於范陽明年改元至德六月祿山犯長安車駕幸劍外七月即位靈武甫避走三川三川縣屬鄜州肅宗立自鄜州羸服欲奔行在為賊所得至德二載亡走鳳翔上謁拜左拾遺與房琯為布衣交琯時敗陳濤斜又以客董廷蘭罷宰相甫上疏言罪細不宜免大臣帝怒詔三司推問宰相張鎬曰甫若抵罪絶言者路帝解甫謝且稱琯宰相子少自樹立為醇儒有大臣體時論許琯才堪公輔陛下果委而相之觀其深念主憂義形於色然性失於閒酷嗜鼓琴廷蘭托琯門下貧疾昏老依倚為非琯愛惜人情一至玷汙臣歎其功名未就志氣挫衄衄尼六切觀陛下棄細録大所以冒死稱述涉近訐激違忤聖心陛下赦臣百死再賜骸骨天下之幸非臣獨䝉然帝自是不甚省録時所在寇奪甫家寓鄜彌年艱窶孺弱至餓死因許甫自往省視從還京師出為華州司功參軍乾元元年甫自左拾遺移華州掾關輔饑輒棄官去客秦州負薪採橡栗自給流落劍南乾元二年夏甫棄官去華之秦十月發秦州十二月離同谷至劍南結廬成都西郭上元元年成都尹裴冕為甫卜築草堂於浣花溪以居召補京兆功曹參軍不至㑹嚴武節度劍南東西川往依焉廣德元年甫補京兆功曹不赴明年鄭國公嚴武復出節度劍南東西兩川武再帥劍南表為參謀檢校工部員外郎武以世舊待甫甚善親詣其家甫見之或時不巾而性褊躁傲誕嘗登武牀瞪視曰嚴挺之乃有此兒武亦暴猛外若不為忤中銜之一日欲殺甫及梓州刺史章彛集吏於門武將出冠鈎于簾三左右白其母奔救得止獨殺彛魯訔曰以甫詩考之嚴武來鎮蜀章彛已交印入覲史當失之武卒崔盰等亂甫往來梓䕫間大厯中出瞿塘下江陵泝沅湘以登衡山因客耒陽耒陽縣在衡州之東南游嶽祠大水遽至涉旬不得食縣令具舟迎之乃得還令嘗饋牛炙白酒大醉一夕卒年五十九夕或作昔元嘗考之於詩子美以大厯五年夏四月湖南兵馬使臧玠殺其團練使崔灌乃避地入衡州至耒陽逰嶽祠以大水涉旬不得食耒陽縣令聶侯具舟迎之水漲遂泊方田驛子美以詩謝之繼而㳂湘流將適漢陽暮秋歸秦有詩留別湖南幕府親友則秋已還潭暮秋北首豈以是夏而溺死耒陽乃復有此作耶蓋子美之卒當在衡湘之間秋冬之際元氏墓志略見本末唐史氏惑於劉斧托遺小說之言曰子美由蜀往耒陽以詩酒自適一日過江上洲中飲醉不能復歸宿酒家是夕江水暴漲子美為驚湍漂泛其尸不知落於何處𤣥宗還南內思子美詔求之聶令乃積空土於江上曰子美為白酒牛炙脹飫而死葬於此矣以此聞𤣥宗故唐史氏因有牛炙白酒大醉一夕卒之語信哉史氏之訛明矣甫放曠不自檢好論天下大事髙而不切少與李白齊名時號李杜嘗從白及髙適過汴州酒酣登吹臺吹赤僞切今東京城東南隅繁臺是也慷慨懷古人莫測也數嘗寇亂挺節無所汙為歌詩傷時橈弱情不忘君人憐其忠云贊曰唐興詩人承陳隋風流浮靡相矜至宋之問沈佺期等研揣聲音浮切不差而號律詩競相㳂襲逮開元間稍裁以雅正然恃華者質反好麗者壯違人得一槩皆自名所長至甫渾涵汪茫千彚萬狀兼古今而有之他人不足甫乃厭餘殘膏䞉馥沾丐後人多矣故元稹謂詩人以來未有如子美者甫又善陳時事律切精深至千言不少衰世號詩史昌黎韓愈於文章慎許可至歌詩獨推曰李杜文章在光焰萬丈長誠可信云唐杜工部墓志銘元稹撰叙曰余讀詩至杜子美而知古人之才有所總萃焉始堯舜之君臣以賡歌相和是後詩人繼作歷夏殷周千餘年仲尼緝拾選練取其干預教化之尤者三百篇其餘無聞焉騷人作而怨憤之態繁然猶去風雅日近尚相比擬秦漢已還採詩之官既廢天下俗謡民謳歌頌諷賦曲度嬉戲之詞亦隨時間作至漢武賦柏梁詩而七言之體興蘇子卿李少卿之徒尤工為五言雖句讀文律各異雅鄭之音亦雜而詞意闊逺指事言情自非有為而為為上于僞切下如字則文不妄作建安之後建安乃漢獻帝年號天下文士遭罹兵戰曹氏父子曹操曹丕鞍馬間為文往往橫槊賦詩槊音朔矛屬也故其遒文壯節抑揚怨哀悲離之作怨一作寃尤極於古晉世風槩稍存齊宋之間教失根本士子以簡慢矯飾舒徐相尚文章以風容色澤放曠精清為髙蓋吟寫性靈流連光景之文也意義格力固無取焉陵遲至於梁陳淫艷刻飾佻巧小碎之詞劇佻敕聊切偷也一無劇字又宋齊之所不取也唐興學官大振歷世之文能者互出而又沈宋之流沈佺期宋之問研練精切穩順聲勢謂之為律詩由是而後文變之體極焉然而好古者遺近務華者去實效齊梁則不逮於魏晉工樂府則力屈於五言律切則骨格不存間暇則纎穠莫備至於子美蓋所謂上薄風雅下該沈宋言奪蘇李蘇武李陵氣吞曹劉吞一作奮曹植劉楨掩顔謝之孤髙顔延年謝靈運雜徐庾之流麗徐陵庾信盡得古人之體勢而兼昔人之所獨專矣如使仲尼考鍛其㫖要尚不知圗其多乎哉圗一作貴茍以為能所不能無可無不可則詩人已來未有如子美者是時山東人李白亦以竒文取稱時人謂之李杜余觀其壯浪縱恣擺去拘束摹寫物象及樂府歌詩誠亦差肩於子美矣至若鋪陳終始排比聲韻大或千言次猶數百詞氣奮邁而風調清深奮一作豪屬對律切而脫棄凡近則李尚不能歷其藩翰况壼奧乎壼一作堂豫嘗欲條析其文體别相附與來者為之凖特病懶未就爾適遇子美之孫嗣業啓子美柩之襄祔事於偃師偃師縣屬今河南府途次于荆楚荆州江陵府也雅知余愛言其大父之為文拜余為志辭不能絶余因係其官閥而銘其卒葬云係曰晉當陽成侯姓杜氏下十世而生依藝令於鞏鞏縣屬河南府依藝生審言審言善詩官至膳部員外郎審言生間間生甫間為奉天令甫字子美天寶中獻三大禮賦明皇竒之命宰相試文文善授右衛率府胄曹屬京師亂𤣥宗天寶十四載安祿山反於范陽步謁行在拜左拾遺嵗餘以直言失官出為華州司功肅宗至德二年甫走鳯翔上謁肅宗授左拾遺乾元元年因言房琯不宜罷相遂自拾遺出掾華州尋遷京兆功曹代宗廣德元年甫補京兆功曹不赴劍南節度使嚴武廣德二年嚴武以黃門侍郎再出鎮劍南東西兩川狀為工部員外郎參謀軍事旋又棄去扁舟下荆楚間竟以寓卒旅殯嶽陽大厯五年夏甫避臧玠之亂入衡州㳂湘流將適漢陽暮秋將歸秦是嵗秋冬之交卒于衡嶽之間藳葬耒陽至元和中其孫始歸葬於河南鞏縣元微之為志今耒陽有甫墓是豈微之但為志而不克遷或已遷而故冡尚存耶享年五十有九夫人𢎞農楊氏女父曰司農少卿怡四十九年而終嗣子曰宗武病不克葬殁命其子嗣業嗣業以家貧無以給喪收什乞丐焦勞晝夜去子美殁後餘四十年然後卒先人之志亦足為難矣銘曰維元和之癸已粵某月某日之佳辰合窆我杜子美於首陽之山前按後漢書桓榮傳首陽山在今偃師縣之西北嗚呼千嵗而下曰此文先生之古墳題杜子美墳韓愈何人鑿開混沌殼二氣由來有清濁孕其清者為聖賢鍾其濁者成愚朴英豪雖沒名猶嘉不肖虛死如蓬麻榮華一旦世俗眼忠孝萬古賢人芽有唐文物盛復全名書史册俱才賢中間詩筆誰清新屈指都無四五人獨有工部稱全美當日詩人無擬倫筆追清風洗俗耳心奪造化回陽春天光晴射洞庭秋寒玉萬頃清光流我常愛慕如飢渴不見其面生間愁今春偶客耒陽路凄慘去尋江上墓召朋特地踏煙蕪路入溪村數百步招手借問騎牛兒牧兒指我祠堂路入門古屋三四間草茅緣砌生無數寒竹珊珊搖晚風野蔓層層纒庭户升堂再拜心惻然心欲䖍啓不成語一堆空土煙蕪裏虛使詩人嘆悲起怨聲千古寄西風寒骨一夜沉秋水當時處處多白酒牛肉如今家家有飲酒食肉今如此何故常人無飽死子美當日稱才賢聶侯見待誠非喜洎乎聖意再搜求姦臣以此欺天子捉月走入千丈波李白入水捉月忠諌便沉汨羅底屈原沉湘固知天意有所存三賢所歸同一水過客留詩千百人佳詞繡句虛相美墳空飫死已傳聞千古醜聲竟誰洗明時好古疾惡人應以我意知終始遺補杜子美傳李觀唐杜甫子美詩有全才當時一人而已洎失意蓬走天下由蜀往耒陽依聶侯不以禮遇之子美忽忽不怡多逰市邑村落間以詩酒自適一日過江上洲中飲既醉不能復歸宿酒家是夕江水暴漲子美為驚湍漂泛其尸不知落於何處洎𤣥宗還南內思子美詔天下求之聶侯乃積空土於江上曰子美為白酒牛炙脹飫而死葬於此矣以此事聞𤣥宗吁聶侯當以實對天子也既空為之墳又醜以酒炙脹飫之事子美有清才者也豈不知飲食多寡之分哉詩人皆憾之題子美之詞皆有感歎之意知非酒炙而死也髙顒宰耒陽有詩曰詩名天寶大骨葬耒陽空雖有感終不灼然唐賢詩曰一夜耒江雨百年工部墳獨韓文公詩事全而明白知子美之墳空土也又非因酒炙而死耳杜工部詩史舊集序王洙叙曰杜甫字子美襄陽人徙河南鞏縣曽祖依藝鞏令祖審言膳部貟外郎父間奉天令甫少不羈天寶中獻三賦召試文章授河西尉辭不行改右衛率府胄曹天寶末以家避亂鄜獨轉陷賊中至德二載竄歸鳳翔謁肅宗授左拾遺詔許至鄜迎家明年收京扈從還長安房琯罷相甫上疏言琯有才不宜廢免肅宗怒貶琯邠州刺史出甫為華州司功屬關輔饑亂弃官之秦州又居成州同谷自負薪採梠餔糒不給遂入蜀卜居成都浣花里復適東川久之召補京兆府功曹以道阻不赴欲如荆楚上元二年聞嚴武鎮成都自閬挈家往焉武歸朝廷甫浮遊左蜀諸郡往來非一武再鎮兩川奏為節度參謀檢校工部員外郎賜緋永泰元年夏武卒郭英乂代武崔旰殺英乂楊子琳柏正節戈兵攻旰蜀大亂甫逃至梓州亂定歸成都無所依乃泛江遊嘉戎次雲安移夔州大歷三年春下峽至荆南又次公安入湖南泝㳂湘流遊衡山寓居耒陽嘗至嶽廟阻暴水旬日不得食耒陽聶令知之自具舟迎還五年夏一夕醉飽卒年五十九觀甫詩與唐實録猶槩見事迹比新書列傳彼為踳駁傳云召試京兆兵曹而集有官定後戲贈詩注云初授河西尉辭改右衛率府胄曹傳云遁赴河西謁肅宗於彭原而集有喜逹行在詩注云自京竄至鳯翔傳云嚴武卒乃逰東蜀依髙適既至而適卒按適自東川入朝拜右散騎常侍乃卒又集有忠州聞髙常侍亡詩傳云扁舟下峽未維舟而江陵亂乃逰襄衡而集有居江陵及公安詩至多傳云甫永秦二年卒而集有大厯五年正月追酬髙蜀州詩及别題大厯年者數篇甫集初六十卷今祕府舊藏通人家所有稱大小集者皆亡逸之餘人自編托非當時第叙矣搜裒中外書凡九十九卷古本二卷蜀本二十卷集略十五卷樊晃序小集六卷孫光憲序二十卷鄭文寶序少陵集二十卷别題小集二卷孫僅一卷雜編三卷除其重復定取千四百有五篇凡古詩三百九十有九近體千有六起太平時終湖南所作視居行之次若嵗時為先後分十八卷又别録賦筆雜著二十九篇為二卷合二十卷意兹未可謂盡它日有得尚副益諸寶元二年十月翰林學士兵部郎中知制誥史館修撰王洙原叔記讀杜工部詩集序孫僅叙曰五常之精萬象之靈不能自文必委其精萃其靈於偉傑之人以渙發焉故文者天地真粹之氣也所以君五常母萬象也縱出橫飛疑無涯隅表乾裏坤深入隱奧非夫腹五靈精心萬象靈神合冥㑹則未始得之矣夫文各一而所以用之三謀勇正之謂也謀以始意勇以作氣正以全道茍意亂思率則謀沮矣氣萎體瘵則勇喪矣言芻辭蕪則正塞矣是三者迭相羽翼以濟乎用也備則氣淳而長剝則氣散而涸中古而下文道繁富風若周騷若楚文若西漢咸角然天出萬世之衡軸也後之學者瞽實聾正不守其根而好其枝葉由是日誕月艷蕩而莫返曹劉應楊之徒唱之曹植劉楨應璩楊修沈謝徐庾之徒和之沈休文謝靈運徐陵庾信爭柔鬬葩聨組擅繡萬鈞之重爍為錙銖真粹之氣殆將滅矣洎夫子之為也剔陳梁亂齊宋抉晉魏瀦其淫波遏其煩聲與周楚西漢相凖的其敻邈髙聳則若鑿太虛而嗷萬籟其馳驟怪駭則若仗天䇿而騎箕尾其首截峻整則若儼鉤陳而界雲漢樞機日月開闔雷電昂昂然神其謀挺其勇握其正以髙視天壤趨入作者之域所謂真粹氣中人也公之詩支而為六家孟郊得其氣焰張籍得其簡麗姚合得其清雅賈島得其竒僻杜牧薛能得其豪健陸龜䝉得其贍博皆出公之竒偏爾尚軒軒然自號一家爀世烜俗後人師擬不暇矧合之乎風騷而下唐而上一人而已是知唐之言詩公之餘波及爾於戲以公之才宜器大任而顛寇虜汩沒蠻夷者屯於時耶戾於命耶將天嗜厭代未使斯文大振耶惟道振當世而澤化後人斯不朽矣因覽公集輒泄其憤以書之杜工部詩後集序王安石序曰豫考古之詩尤愛杜甫氏作者其辭所從出一莫知窮極而病未能學也世所傳已多計尚有遺落思得其完而觀之每一篇出自然人知非人之所能為而為之者惟其甫也輒能辨豫之令鄞縣名屬明州客有授豫古之詩世所不傳者二百餘篇觀之豫知非人之所能為而為之實甫者其文與意之著也然甫之詩其完見於今者自豫得之世之學者至乎甫而後為詩不能至要之不知詩焉爾嗚呼詩其難惟有甫哉自洗兵馬下序而次之以示知甫者且用自發焉皇祐壬辰五月日臨川王安石序成都草堂詩碑序胡宗愈序曰草堂先生謂子美也草堂子美之故居因其所居而號之曰草堂先生先生自同谷入蜀遂卜成都浣花江上萬里橋之西為草堂以居焉唐之史記前後抵牾先生至成都之年月不可考其後先生寄題草堂云經營上元始斷手寶應年然則先生之來成都殆上元之初乎嚴武入朝先生送武至巴西遂如梓州蜀亂乃之閬州將逰荆楚㑹武再鎮兩川先生乃自閬州挈妻子歸草堂武辟先生為參謀武卒蜀又亂先生去之東川移居䕫州遂下荆渚泝沅湘上衡山卒於耒陽先生以詩鳴於唐凡出處去就動息勞佚悲歡憂樂忠憤感激好賢惡惡一見於詩讀之可以知其世學士大夫謂之詩史其所逰歷好事者隨處刻其詩於石及至成都則闕然先生之故居松竹荒凉略不可記今丞相吕公鎮成都復作草堂於先生之舊址繪先生之像於其上宗愈假符於此乃録先生之詩刻石置於草堂之壁間先生雖去此而其詩之意有在於是者亦附其後庶幾好事者於以考先生去來之迹云元祐庚午資政殿學士中大夫知成都軍府事胡宗愈序編次杜工部詩序魯訔騷人雅士同知祖尚少陵同欲模楷聲韻同苦其意律深嚴難讀也余謂少陵老人初不事艱澀左隱以病人其平易處有賤夫老婦所可道者至其深純宏妙千古不可追跡則序事穩實立意渾大遇物寫難狀之景紓情出不說之意借古的確感時深逺若江海浩溔溔以沼切大水貌風雲蕩汩蛟龍黿鼉出沒其間而變化莫測風澄雲霽象緯回薄錯峙偉麗細大無不可觀離而序之次其先後時危平俗媺惡山川夷險風物明晦公之所寓舒局皆可槩見如陪公杖屨而逰四方數百年間猶對面語何患於難讀耶名公巨儒譜叙注釋是不一家用意率過異說如蝟余因舊集略加編次古詩近體一其先後摘諸家之善有考於當時事實及地里嵗月與古語之的然者聊注其下若其意律乃詩之六經神㑹意得隨人所到不敢易而言之叙次既倫讀之者如親罹艱棘虎狼之慘為可驚愕目見當時氓庶被削刻轉塗炭為可憫因感公之流徙始而適中而瘁卒至為少年輩侮忽以訖死為可傷也紹興癸酉五月晦日丹丘冷齊魯訔序增修王原叔編次杜詩後記王琪近世學者爭言杜詩愛之深者至剽掠句語逮所用險字而模畫之沛然自以絶洪流而窮深源矣又人人購其亡逸多或百餘篇少或數十句藏弆矜大復自以為有得翰林王君原叔尤嗜其詩家素蓄先唐舊集及採祕府名公之室天下士人所有得者悉編次之事具於記於是杜詩無遺矣子美博聞稽古其用事非老儒博士罕知其自出然訛缺久矣後人妄改而補之者衆莫之遏也非原叔多得其真為害大矣子美之詩詞有近質者如麻鞋見天子垢膩腳不襪之句所謂轉石於千仞之山勢也學者尤效之而過甚豈逺大者難窺乎然夫子之刪詩也至於檜曹小國寺人女子之詩茍中法度或取而弦歌善言詩者豈拘於人哉原叔雖自編次余病其卷帙之多而未甚布暇日與蘇州進士何君瑑丁君修得原叔家藏及今古諸集聚于郡齊而參考之三月而後已義有兼通者亦存而不敢削閲之者固有淺深也而又吳江邑宰河東裴君煜取以覆視乃益精密遂鏤于板庶廣其傳或俾余序于篇者曰如原叔之能文稱于世止作記于後余竊慕之且余安知子美哉但本末不可闕書故槩舉以附于卷終原叔之文今遷于卷首云嘉祐四年四月望日姑蘇郡守太原王琪後記增注杜工部詩序王彥輔唐興承陳隋之遺風浮靡相矜莫崇理致開元之間去雕篆黜浮華稍裁以雅正雖絺句繪章人得一槩各爭所長如大羹元酒者則薄滋味如孤峯絶岸者則駭廊廟穠華可愛者乏風骨爛然可珍者多玷缺逮至子美之詩周情孔思千彚萬狀茹古涵今無有端涯森嚴昭煥若在武庫見戈㦸布列蕩人耳目非特意語天出尤工於用字故卓然為一代冠而厯世千百膾炙人口豫每讀其文竊苦其難曉如義鶻行巨顙折老拳之句劉夢得初亦疑之後覽石勒傳方知其所自出蓋其引物連類掎托前事往往而是韓退之謂光焰萬丈長而世號為詩史信哉豫時漁獵書部嘗妄注緝且十得五六宦遊南北因循中輟投老掛冠杜門家居日以無事行樂之暇不度蕪淺既次其韻因閲舊注惜不忍去搜考所知再加箋釋然豫不幸病目無與乎簡牘之觀遂命子澄洎孫端仁參夫討繹俾之編綴用償夙志尚愧孤陋未臻詳盡在昔聖人猶曰有所不知丘蓋闕如顧惟聞見之寡兹所不免但藏篋中以貽來裔非敢示諸博古之君子按鄭文寶少陵集張逸為之序又有蜀本十卷自王原叔內相再編定杜集二十卷後姑蘇守王君玉得原叔家藏於蘇州進士何瑑丁修處及今古諸集相與參考乃曰義有兼通者亦存而不敢削故豫之所注以蘇本為正云時洪宋八葉明天子之在御政和紀元之三祀下元日序杜少陵詩音義序鄭卬讀少陵詩如馳騖晉楚之郊以言其髙則鄧林千巖楩楠杞梓扶疏摩雲以言其深則溟波萬頃蛟龍黿鼉徜徉排空拭眥極目方且心駭神悸莫知所以若其甄别名狀實難為功韓退之推其光熖萬丈長殆謂是矣國家追復祖宗成憲學者以聲律相飭少陵矩範尤為時尚於其淹貫羣書比類賦象渾涵天成竒文險句厭人目力讀者未始不以搜尋訓切為病卬近因與二三友質問爰就隱奧處著為音義至夫人物地理古今傳志咸極討論施之新學不亦可乎時紹興改元嵗次辛亥長至後五日長樂鄭卭序跋杜子美詩并序鄭卬余讀李元賔補遺傳及韓退之題杜工部墳詩皆自托遺所載疑非二公所作然大厯元和時之相去猶未為逺不當與本集抵牾若是大抵後之好事者託而質之也嘗考子美以大厯五年四月臧玠殺崔瓘由是避地入衡州至耒陽遊嶽祠以大水涉旬不得食耒陽聶令具舟迎之水漲遂泊方田驛子美詩以謝之繼而㳂湘流將適漢陽暮秋歸秦有詩别湖南幕府親友豈以夏而溺死耒陽復有此作蓋其卒在潭嶽間秋冬之際元微之志銘亦略見本末作史者惑於托遺之說遂有牛炙白酒一宿卒之語信史之誤余不可以不辨長樂鄭卬謹跋杜子美之於詩實集衆家之長適當其時而已昔蘇武李陵之詩長於髙妙曹植劉公幹之詩長於豪逸陶潜阮籍之詩長於沖淡謝靈運鮑昭之詩長於峻潔徐陵庾信之詩長於藻麗於是子美窮髙妙之格極豪逸之氣包沖淡之趣兼峻潔之姿備藻麗之態而諸家之作所不及焉然不集諸子之長子美亦不能獨至於斯也豈非適當其時故耶孟子曰伯夷聖之清者也伊尹聖之任者也柳下惠聖之和者也孔子聖之時者也孔子之謂集大成嗚呼子美亦集詩之大成者歟讀子美詩孫何世系留唐中丘封寄耒山髙名落身後遺集出人間逸氣應天與淳風自我還鋒鋩堪定霸徽墨可繩姦進退軍三令回旋馬六間楚詞休獨步周雅合重刪李白從先逹王維亦厚顔庖刀盡餘刃羿彀肯虛彎聖域分中土天樞奪要關逍遙登禁闥偃蹇下塵寰麗思蘇幽蟄神功鑿險艱語成新體句才折好官班誰氏傳軒冕何人得珮環朱弦本疏越黃鳥浪綿蠻元白詞華窄錢郎景象慳蜀峰愁杳杳湘水浪潺潺子欲探驪頷吾思擷虎斑毛錐應穎脫燕石竟疏頑已襲蘭兼菊無嫌蒯與菅二南如有得髙躅願追攀子美畫像歐陽修風雅久寂寞吾思見其人杜君詩之豪來者孰比倫生焉一身窮死也萬世珍言茍可垂後士無羞賤貧子美畫像王安石吾觀少陵詩謂與元氣侔力能排天斡九地壯顔毅色不可求浩蕩八極中生物豈不稠醜妍巨細千萬殊竟莫見以何雕鎪惜哉命之窮顛倒不見收青衫老更斥餓走半九州瘦妻僵前子仆後攘攘盜賊森戈矛吟哦當此時不廢朝廷憂嘗願天子聖大臣各伊周寧令吾廬獨破受凍死不忍四海赤子寒颼颼傷屯悼屈止一身嗟時之人我所羞所以見公畫再拜涕泗流推公之心古亦少願起公死從之遊讀子美集張伯玉寂寞風騷主先生第一材詩魂躔斗壁筆力撼蓬萊運動天樞朽奔騰地軸摧萬蛟盤險句千馬夾雄才勢走岷峨盡辭含混沌來剖山無鵲石傾廄盡龍媒薦擢誇三賦飄零放一杯艱難行蜀道感激上燕臺日月兵前沒江湖笑裏開獨吟千載後肝膽洗塵埃觀子美畫像楊蟠文光萬丈照詞林獨步才難一代欽塵土未論今日貌篇章空憶舊時心寂寥冠劍無由作零落丹青豈復吟師法望公千載後仰風三歎感知音欽定四庫全書補注杜詩宋黃希原本黃鶴補注年譜辨疑先生姓杜氏名甫字子美本襄陽人後徙河南鞏縣按唐宰相世系表襄陽杜氏出自晉當陽侯預少子尹字世甫晉𢎞農太守二子綝弼綝字𢎞固奉朝請生襲襲生標標生冲冲生洪泰二子祖顒顒生景仲而先生作萬年縣君京兆杜氏墓志云曽祖某隋河內郡司功參軍獲嘉縣令王父依藝皇監察御史洛陽鞏縣令考審言修文館學士尚書膳部員外郎舊史杜易簡傳云易簡襄陽人周硤州刺史叔毗曽孫從祖弟審言次子間間生甫又杜甫傳云曽祖依藝終鞏令祖審言終膳部員外郎父間終奉天令元微之志云晉當陽侯下十世而生依藝然則自杜尹至先生為十三世故先生酹逺祖晉鎮南將軍文云十三葉孫又先生有示從孫濟寄從孫崇簡示姪佐因示從弟行軍司馬位詩而濟崇簡佐位皆出景仲下意叔毗與景仲為兄弟易簡審言出叔毗下獲嘉即叔毗之子是為先生髙祖睿宗先天元年壬子先生生於是年蔡興宗引元微之墓志王原叔集記魯訔引唐書列傳皆云先生年五十九嵗卒於大厯五年則當生於是年魯又引公上大禮賦表云臣生陛下淳朴之俗行四十載矣天寶十載奏賦年三十九逆數公今年生呂汲公云公生先天元年癸丑天寶十三載奏賦若果十三載奏賦則先生四十三嵗矣梁經祖集譜亦云十三載奏賦今考通鑑唐宰相表及酹逺祖文以開元二十九年為辛已祭房公文以廣德元年為癸卯則先天元年為壬子無疑如魯謂十載奏賦則是年辛卯恰四十嵗不可謂之年三十九何以表謂之行四十載案朝獻太清宫賦首云冬十一月天子納處士之議又云明年孟陬將攄大禮則是九載庚寅預獻賦故年三十九表宜云行四十載又按舊史天寶十載云是秋霖雨積旬墻屋多壞西京尤甚公作秋述云秋杜子卧病長安旅次多雨生魚青苔及榻又云我弃物也四十無位則是十載年四十其生於是年又無疑先天二年癸丑改開元元年是年八月明皇即位改元開元揚經祖集譜云先天元年壬子八月𤣥宗即位非開元二年甲寅開元三年乙卯先生在郾城觀公孫弟子舞劍行序云開元三年余尚童稚記於郾城觀公孫氏舞劍器吕譜云是年才四嵗年必有誤案先生壯遊詩云七齡思即壯開口詠鳳皇以七嵗能詩則四嵗而記事非不能矣魯譜引進鵰賦表中語為證亦是開元四年丙辰開元五年丁已開元六年戊午是年先生七嵗壯遊詩云七齡思即壯開口詠鳳皇則自是年能詩矣故進鵰賦表云臣素賴先人緒業自七嵗所綴詩筆向四十載矣約千有餘篇今所存才十一王原叔集記云千四百有五篇者多是後來所作開元七年已未開元八年庚申是年先生九嵗壯遊詩云九齡書大字有作成一囊開元九年辛酉開元十年壬戌開元十一年癸亥開元十二年甲子開元十三年乙丑是年先生十四歲壯遊詩云往昔十四五出遊翰墨場開元十四年丙寅是年先生十五嵗出遊選場崔鄭州尚魏豫州啓心稱之故壯遊詩云斯文崔魏徒以我似班揚開元十五年丁卯開元十六年戊辰開元十七年已已先生乾元元年戊戌有因許八寄江寧旻上人詩云不見旻公三十年旻江寧僧也逆數其年則遊旻越至江寧當在是年然上大禮賦表云浪跡於陛下豐草長林實自弱冠之年則十九年辛未公方二十嵗當以表為是詩特舉成數而言耳開元十八年庚午開元十九年辛未是年先生二十嵗以進大禮賦表所云則遊吳越當起於今自是下姑蘇渡㑹稽數年方歸開元二十年壬申開元二十一年癸酉開元二十二年甲戌是年先生自越歸赴鄉舉故云歸帆拂天姥中歲貢舊鄉上韋左丞詩云甫昔少年日早充觀國賔是年方二十三歲宜謂少年矣開元二十三年乙亥是年先生下第明年春以禮部侍郎掌貢舉則謂之忤下考功第當在今年蓋唐制年年貢士也案選舉志每嵗仲冬州縣館監舉其成者送之尚書省舊史云天寶初應進士不第非開元二十四年丙子案舊史是年三月乙未始移考功貢舉遣禮部侍郎掌之新史選舉志云二十四年考功員外郎李昂為舉人詆訶帝以員外郎望輕遂移貢舉於禮部以侍郎主之禮部選士自此始魯譜謂開元二十六年戊寅春徙禮部以春官侍郎主之不知何據而云壯遊詩云忤下考功第拜辭京尹堂放蕩齊趙間裘馬頗清狂則下第必在是年之前遊齊趙必在是年之後詩又云快意八九載西歸到咸陽而先生天寶五載歸京師應詔故逰齊趙當在今年後又大厯五年酬寇十侍御云往别郇瑕地于今四十年自今年至大厯五年雖方三十五年亦舉成數而言也開元二十五年丁丑先生逰齊趙案新史嘗從李白及髙適過汴州酒酣登吹臺慷慨懷古蓋白家於任城適以家貧客梁宋以求丐取給故先生與之定交遣懷詩所謂憶與髙李輩論交入酒壚兩公壯藻思得我色敷腴是也其登吹臺雖未定何年然必在是年後又云先帝正好武寰海未雕枯猛將收西域長㦸破林胡則先生登吹臺時明皇正有事於西戎考通鑑開元二十五年崔希逸自凉州南入吐蕃境二千餘里至青海西大破之二十六年春杜希望攻吐蕃新城拔之以其地為威戎軍蓋其時也開元二十六年戊寅開元二十七年已卯開元二十八年庚辰開元二十九年辛已是年先生在河南有祭逺祖晉鎮南將軍于洛之首陽又有冬日懷李白詩案李白傳云白天寶初客遊㑹稽則與先生别當在今年故詩有未因乘興去之句天寶元年壬午是年先生在河南為萬年縣君京兆杜氏作志萬年先生之姑也即范陽太君志所謂適裴榮期者案志云天寶元年六月二十九日遷殯于河南縣平樂鄉有兄子甫紀德於斯刻石於斯又有詩題云天寶初南曹小司寇於我太夫人堂下壘土為山而詩云惟南將獻夀其曰太夫人者豈非先生指祖母范陽太君盧氏而言若以為先生之母則此後不聞先生有欒棘之憂或謂先生之母微故志史不言介婦有崔氏然先生何為有與諸舅詩又皆秀而仕者京兆志又云甫昔卧病於我諸姑姑之子久病女巫至曰處楹之東南隅吉姑遂易子之地以安我我是用存而銘之為義姑蓋先生之母早亡乃育於姑而至於有成也天寶二年癸未是年先生在河南天寶三載是年正月甲申改年為載是年五月五日先生祖母范陽太君盧氏卒於陳留之私第審言前娶薛再盧氏也八月旬有六日葬于河南之郾師先生作志云某等遭內艱云云當是代叔父作而志又云薛氏所生子適曰某故朝議大夫次曰并幼卒報復父讐國史有傳次曰專歷開約尉先是不祿而不及先生之父間為奉天令何也若以為是時間猶無恙志代其作此後又不聞先生居父喪且并年十三嵗死宜無婦而志冡婦盧氏介婦鄭氏魏氏王氏則是四婦而所載子何為與并止四人則云某等遭閔凶又似指父名而言而鄭氏即先生之正母更俟博考陳子昂祭審言文在景隆二年則審言卒後四年先生始生三十七年盧氏始卒第未詳間以何年卒也天寶四載乙酉是年夏先生在齊州有陪李北海宴歷下亭詩為開元皇帝皇甫淑妃作墓碑云公主戚然謂左右曰自我之西嵗陽載紀云云於是下教有司爰度碑版案爾雅自甲至癸為嵗之陽妃以開元二十三年乙亥十月癸未朔薨其月二十七日葬于河南縣龍門之西北原故至今年乙酉為嵗陽載紀矣公主即臨晉公主下嫁滎陽鄭潜曜鄭有園亭在河南新安縣先生嘗逰之故碑云忝鄭莊之賔客遊竇主之園林又有鄭駙馬宅宴洞中詩重題鄭氏東亭詩詩當作於天寶二三年間天寶五載丙戌是年先生以天子詔天下有一藝詣轂下遂西歸應詔有行次昭陵詩云幽人拜鼎湖有今夕行云咸陽客舍無一事乃西歸時詩蔡譜云是年有飲中八仙歌徒以李適之四月罷政及先生西歸而云案史李白嘗侍帝醉使髙力士脫鞾力士素貴耻之摘其詩以激楊貴妃帝欲官白妃輒沮止白自知不為親近所容益驁放不自修與賀知章李適之汝陽王璡崔宗之蘇進張旭焦遂為酒八仙人而賀知章以天寶三載去國白亦還山凡歌所言皆天寶二三年事意是天寶六七載從汝陽王遊時為王作也壯遊詩云賞遊實賢王蓋在西歸咸陽之後天寶六載丁亥是年先生應詔退下作天狗賦序云天寶中上冬幸華清宫甫因至獸坊怪天狗院列在諸獸院又云尚恨其與凡獸近賦云吾君儻意耳尖之有長毛兮寧久被斯人終日馴狎已蓋喻已也案舊史天寶六載冬十月幸溫泉改為華清宫明年冬公又至東都故知賦在今年作十一載上鮮于京兆詩云且隨諸彥集方覬薄材伸破膽傷前政隂謀獨秉鈞微生霑忌刻萬事益酸辛正謂是年應詔李林甫忌人斥已建言草茅徒以狂言亂聖聽請付尚書試問無一中者故云魯譜謂上韋左丞詩在是年不考是年濟未拜左丞天寶七載戊子是年先生在長安有寄河南韋尹詩案舊史天寶七載韋濟為河南尹遷左丞詩云江湖漂裋褐霜雪滿飛蓬牢落乾坤大周流道術空蓋謂逰吳越齊趙多年而無所成非旅寓而寄之也及韋遷左丞則有上韋左丞二詩此在長安親上之故曰上詩云今欲東入海即將西去秦蓋應詔下復有意於逺遊明年果在東都又有髙都護驄馬行天寶八載已丑先生在河南有冬日洛城謁𤣥元皇帝廟詩詩云五聖聨龍衮蓋是年閏六月加諡髙祖及四宗大聖字故云天寶九載庚寅先生是年進三大禮賦又嘗進鵰賦案進鵰賦表云自七嵗所綴詩筆向四十載矣與進三賦表云行四十載矣語意相同故知進鵰賦在是年進三賦之先若以為在後必如進封西嶽賦表云奏賦待制於集賢委學官試文章矣魯譜云是年十一月封華嶽殊不知雖許封嶽而是年廟災及旱遂詔停封先生十三載方進封西嶽賦而請封也又有兵車行天寶十載辛卯先生在京師以奏賦明皇竒之命待制集賢院召試文章有秋述有杜位宅守嵗詩秋述云我四十也杜位守嵗云四十明朝過天寶十一載壬辰先生在京師十一月楊國忠拜相鮮于仲通除京兆尹先生有上鮮于京兆詩又有太常張卿詩鮮于詩云交合丹青地恩傾雨露辰有儒愁餓死早晚報平津張詩云吹噓人所羡騰躍事仍暌當是其年召試文章止送有司參列選序故云吕譜上韋左相詩云鳳厯軒轅紀龍飛四十春以𤣥宗即位至是為四十年故知在今年作按史天寶十五載七月明皇幸蜀以韋見素為左相今不應先云左相又案宰相表天寶十三載甲午韋見素為武部尚書同中書門下平章事知門下省事當是其時投之故詩云韋賢初相漢蔡譜謂是嵗苦雨潦閲六旬上謂宰相非其人罷陳希烈拜韋見素時明皇在位四十三年蓋詩僅略舉成數非若進賦之可據此說是吕譜又以麗人行入今年謂丞相者為楊國忠而不知國忠今年十一月方為右相當是十三載蔡譜謂次嵗以後詩為是天寶十二載癸已先生在京師有上哥舒翰詩云幾年春草歇今日暮途窮有留贈集賢院崔于二學士詩云天老書題目春官驗討論倚風遺鶂路隨水到龍門竟與蛟螭雜寧無燕雀喧又云儒術誠難起家聲庶已存故家多藥物勝槩憶桃源欲整還鄉斾長懷禁掖垣謬稱三賦在難述二公恩崔于二學士當是試文之人試後止降恩澤送𨽻有司參列選序故起故山之興天寶十三載甲午按舊史是年二月戊寅右相兼文部尚書楊國忠守司空餘如故甲申司空楊國忠受册而先生進封西嶽賦表云維嶽授陛下元弼克生司空又云頃嵗有事於郊廟幸得奏賦待制於集賢委學官試文章再降恩澤乃猥以臣名實相副送𨽻有司參列選序則進封西嶽賦當在是年蓋未授河西尉也魯譜云此賦當在未封西嶽前而紀封華嶽在九載又當考也魯蓋不考九載廟災及旱詔停封故先生進賦在今年有秋雨歎有上韋左相等詩天寶十四載乙未是年先生授河西尉不樂改授率府胄曹故官定戲贈曰不作河西尉凄凉為折腰老夫怕奔走率府且逍遙而夔府書懷云昔罷河西尉初興薊北師則改授率府胄曹當在是年之冬蓋是年十一月祿山反也詩史云薊北反書未聞已逸身畿甸為非若先已竄逸則改授無容在初興師之時矣吕與蔡譜俱云十一月初赴奉先故有赴奉先詠懷詩然詩不言祿山反狀但言歡娛聚斂以致亂又詩云豈知秋未登貧窶有倉卒當是上年秋雨艱食時作非避亂時詩甚明天寶十五載丙申是年七月明皇幸蜀七月甲子肅宗即位於靈武先生五月自奉先往白水依舅氏崔十九翁有髙齊詩三十韻六月又自白水往鄜州有三川觀水漲詩按本傳云聞肅宗立自鄜羸服奔行在為賊所得則在是年八月故有月夜九日藍田崔氏莊哀王孫悲陳陶悲青坂對雪等詩至德二年丁酉是年春先生在賊中有元日寄韋氏妹詩云不見朝正使啼痕滿面垂又有春望憶幼子一百五夜對月大雲寺贊公房等詩亦嘗至東都豈非為賊送與囚者為列故有鄭駙馬池臺喜遇鄭廣文同飲詩云燃臍郿塢敗指祿山死也又駙馬池臺在河南新安縣夏得脫賊中故述懷詩云今夏草木長脫身得西走謁肅宗于鳳翔有喜逹行在所詩六月一日有奉謝口敕放三司推問狀時結銜云宣義郎行左拾遺則拜拾遺必在五月按史帝紀宰相表是年五月丁巳房琯罷相先生上疏救琯肅宗怒詔三司推問中書侍郎同平章事張鎬救之就令鎬宣口敕宜放推問故有謝狀鎬拜同平章在琯罷之前四日也六月十二日又有同遺補薦岑參諫官狀八月放還鄜州省妻子北征詩云皇帝二載秋閏八月初吉杜子將北征蒼茫問家室又有徒步歸行當是八月得墨敕閏月初一日方行九月復京師十月丁卯肅宗至自靈武先生亦還京師有臘日及送鄭䖍貶台州等詩乾元元年戊戌是年春先生在諫省有春宿左省曲江對酒答岑補闕送賈閣老出汝州等詩夏有端午日賜衣詩六月出為華州司功有酬孟雲卿詩云明朝牽世務揮淚各西東又有出金光門與親故别望嶽等詩七月有為華州郭使君進滅殘寇形勢圗狀有策進士文元微之志云左拾遺嵗餘以直言出華州司户蓋至德二載五月為拾遺至今六月為嵗餘第不知以言何事而出有悲往事詩云移官豈至尊當是左右有不樂者是時苖晉卿為侍郎王嶼同平章而李麟崔圎張鎬皆先一月罷也冬尚留華有至日遣興寄北省舊閣老兩院故人詩云孤城此日堪腸斷是也魯與蔡譜謂弃官至東都有閿鄉姜七少府設鱠及湖城遇孟雲卿劉皓宅飲宿等詩當是冬晚至東都乾元二年已亥是春先生自東都回華州按史三月丁亥以旱降死罪流以下四月壬寅詔減常膳服御舊史亦云四月癸亥以久旱徙市雩祭祈雨先生賦夏日歎故有萬民尚流冗舉目唯蒿萊之句本傳關輔饑弃官去客秦州當在其年七月末蓋華下苦熱詩云七月六日苦炎蒸則是月初尚在華又秦州雜詩二十首多言秋時景物去秦州赴同谷縣有發秦州詩云漢源十月交天氣如秋凉指同谷十月如此則去秦亦必在十月故至寒破峽有詩云况當仲冬交泝㳂增波瀾考秦至成之界垂二百里又七十里至成今寒峽尚為秦地而已交十一月則先生去秦又可知在十月之末至同谷不及月遂入蜀有發同谷縣詩云賢有不黔突聖有不暖席趙注云公嘗自注此詩云乾元二年十二月一日自隴右赴劍南今書雖無此注而木皮嶺詩云季冬攜童稚辛苦赴蜀門水㑹渡詩云微月沒已久可知為十二月初也至成都不出此月故詩云季冬樹木蒼是時裴冀公冕牧蜀乾元三年庚子改上元元年是年先生在成都裴公為卜成都西郭浣花寺居髙適詩云聞道招提客是也二月裴歸朝以京兆尹李若幽後賜名國楨為成都尹舊史李國楨傳云為京兆尹上元初改成都尹兼御史大夫充劍南節度使而先生未嘗與之交故詩文無一語及之是年先生營草堂詩所謂經營上元初是也堂成詩云緣江路熟俯青郊又云飛來語燕定新巢則三月堂已成自是居草堂間嘗至外邑有賦青城縣出成都寄陶王二少尹上元二年辛丑是年二月李若幽入為殿中丞癸亥以崔光逺為成都尹劍南節度使四月劍南東川節度兵馬使段子璋反陷綿州髙適同崔光逺討子璋伏誅先生有贈花卿云子璋髑髏血糢糊手提擲還崔大夫是也按舊史光逺收段子璋以將士肆剽劫光逺不能禁肅宗遣監軍中使按其罪光逺憂恚成疾上元二年十月卒而紀云建子月卒舊史髙適傳又云天子怒光逺不能戢軍乃罷之以適代光逺為成都尹而紀云建丑月以嚴武為成都尹則適未嘗代光逺意光逺罷後適攝成都故先生無詩稱其為尹也若適果代光逺為尹先生近在草堂不應詩文中無一字及之是時適為蜀州刺史史謂適由太子賔客出為蜀州刺史遷彭州然先生有李司馬橋東承髙使君自成都回詩云已傳童子騎青竹總擬橋東迓使君按九域志成都在蜀州之東彭州之南以此知適為蜀州甚明自元年至今年成都更李若幽崔光逺髙適然後嚴武至而諸譜皆不載若李與崔宜與先生弗合宜無可考百憂集行云即今倐忽已五十强將笑語供主人當是為崔李而云或謂指髙適嚴武然適武俱有舊適又攝尹不久未必是指二人秋作唐興縣客館記記云中興之四年又云辛已秋分大餘二小餘二千一百八十八杜氏之老記寶應元年壬寅是年四月代宗即位先生在成都上嚴武說旱蓋建卯月也七月武歸朝公送武至綿州有送嚴侍郎到綿州同登樓及奉濟驛重送嚴公詩是時嚴武未拜黃門侍郎其曰送嚴侍郎者後來所題也先生送武去成都旋有徐知道之亂因入梓州徐知道反雖史不書平亂之人然武入朝後不聞别除成都尹按舊史髙適傳云代宗即位吐蕃寇隴右漸逼京畿適練兵於蜀臨吐蕃南境以牽制之師出無功而松維等州陷代宗以黃門侍郎嚴武代還當是崔光逺不能戢兵罷成都時適止攝節度事而武乃正除故武受命距光逺卒時才一月意今年七月武召還後適方正除西川節度故廣德元年練兵臨吐蕃南境然先生與適素厚何以送武至綿遂入梓復歸成都迎家往梓閬及嚴武再鎮成都乃始歸草堂豈非中間與適頗暌舊好故爾不然何無一詩及之又何挈家優游東川師古謂貧交行為嚴武作今疑為適作也廣德元年癸卯是年三月辛酉葬𤣥宗庚午葬肅宗嚴武為山陵橋道使先生在梓州補京兆府功曹不赴有春日登梓州城樓陪李使君泛江又陪李使君登惠義寺等詩又嘗送辛貟外暫至綿州詩云直到綿州始分首又云殘花悵望近人開當是三月秋八月與漢中王瑀同㑹于章梓州水亭蓋梓州刺史春夏是李秋冬是章彛九月壬戌是為二十三日在閬州祭房琯有警急詩魯譜云系云時髙公適領西川節度而詩注則云趙曰又非先生所系也詩云才名舊楚將謂適為楊州都督而云若果為適作亦歎其師出無功耳冬十月吐蕃陷京師十二月吐蕃陷松維州先生時在閬州故巴山詩云巴山遇中使云自陜城來盜賊還奔竄乘輿恐未回又有收京西山王命征夫等詩呂譜謂是年嚴武再鎮西川奏甫節度參謀檢校工部員外郎蓋不考武入蜀與奏參謀皆在二年是年冬晚又略至梓所以發閬州詩有别家三月一得書之句廣德二年甲辰是春先生復自梓往閬州嚴武再鎮蜀復自閬歸草堂依武與王十四侍御云猶得見殘春則歸成都在春晚嚴武奏為節度參謀檢校工部貟外郎賜緋魚袋有揚旗詩系云二年夏六月成都尹鄭公置酒觀騎士新旗幟有立秋日雨院中有作詩則入幕必在是年六月史云梓州刺史章彛舊亦武判官以微事忤武召赴行在殺之而先生有詩寄章十侍御乃云河內猶宜借寇恂又云朝覲從容問幽反勿云江漢有垂綸何也魯蔡譜云武來領蜀彛已交印史當失之然彛方是廣德元年夏至梓未應得代其曰朝覲者必是章入奏故云自是彛不見有别除而先生亦無詩及之似果為武所殺秋有和嚴公軍城早秋院中晚晴懷西郭茅舍到村宿府遣悶陪鄭公秋晚北池臨眺等詩冬有初冬詩云垂老戎衣窄蓋以是年十月嚴武攻吐蕃鹽川城故著戎衣也又有至後詩永泰元年乙已是年正月三日先生自成都院中歸溪上有詩舊史代宗紀永泰元年四月庚寅成都尹嚴武薨五月癸丑以郭英乂為成都尹先生與英乂有舊有奉送郭中丞赴隴右節度使詩蓋與英乂也然志不相合遂去草堂下忠渝有去蜀詩云五載客蜀郡宴戎州揚使君東樓詩云輕紅擘荔枝又有渝州侯嚴六侍御不到先下峽晏忠州使君宅題忠州龍興寺所居院壁等詩蓋先生以是年六月至忠州故有是作其至雲安亦是時自秋徂冬俱在雲安十二月一日三首其一云雲安縣前江可憐蓋可知也呂譜云嚴武平蜀亂甫遊東川除京兆功曹不赴不考是年四月武已死又未嘗平蜀亂其除京兆功曹亦在廣德二年也永泰二年丙午改大厯元年是年春先生在雲安故客堂詩云石暄蕨芽紫渚秀蘆笋緑移居夔州郭詩云春知催栁别則移居在春晚也有為夔州柏都督謝上表課伐木詩云城中賢府主園人送瓜詩云相公鎮夔國園官送菜詩云常荷地主恩皆指柏而云柏當是貞節也終嵗居夔州大厯二年丁未是年春先生居赤甲按詩云卜居赤甲遷居新兩見巫山楚水春則是今年春方遷赤甲暮春又遷居瀼西有題瀼西草屋詩云久嗟三峽客再與暮春期秋又移居東屯秋晚復自東屯歸瀼西各有詩大厯三年戊申是年春先生出峽案贈南卿兄瀼西果園四十畝云正月喧鶯未兹辰放鷁初當是正月去夔三月至江陵有呈江陵幕府諸公詩云白屋開花裏孤城秀麥邊又有暮春江陵赴馬大卿詩秋晚遷公安縣有移居公安縣衛大郎詩云水煙通徑草秋露接園葵又有公安送韋二少府公安懷古等詩憩此縣數月嵗暮去之嶽州有泊嶽陽城下登嶽陽樓等詩大厯四年已酉是年正月先生自嶽陽之潭有宿青草湖湘夫人祠入喬口等詩至潭未幾入衡有發潭州詩至衡畏熱復回潭有回棹詩登舟將適漢陽詩又有風疾舟中伏枕書懷呈湖南親友詩云故國悲寒望羣雲慘嵗隂鬱鬱冬炎瘴濛濛雨滯淫又云春草封歸恨桃花費獨尋又云瘞夭追潘嶽持危覔鄧林當在是年冬晚作不然即次年春作是年先生必有哭子之戚故用瘞夭事按先生在夔時宗文宗武俱無恙而元微之志止云嗣子宗武病不克葬則宗文為早世意所謂瘞夭即宗文也耒陽縣北之墳豈非瘞宗文者後世不考遂因牛酒之語從而附㑹以為葬先生于此也大厯五年庚戌是年春先生在潭州率舟居四月臧玠殺崔瓘先生避亂至衡山有題衡山縣文宣王廟新學堂呈陸宰詩入衡將如郴州依舅氏故入衡州詩云諸舅剖符近魯譜謂諸舅為崔偉前有送二十三舅録事攝郴州詩或是先生如郴因至耒陽訪聶令經方田驛阻水旬餘聶致酒肉而史云令嘗饋牛肉白酒大醉一夕卒嘗考先生謝攝令詩有云禮過宰肥羊愁當置清醥其詩至云興盡本韻又且宿留驛近山亭若果以飫死豈復更能為是長篇又復游憩山亭以詩證之其誣自可不攻况元微之志與舊史初無此說托遺謂𤣥宗還南內思子美詔天下求之聶侯乃積空土於江上曰死葬於此矣然𤣥宗至自成都時先生在諌省及升遐時先生又在成都寶應元年𤣥宗升遐距大厯五年先生之死又已十嵗其敢欺世如此韓昌黎詩力辨其非鄭卬李觀從而正之所恨不曽引詩為據秋下洞庭故有暮秋將歸秦奉留别親友詩又有洞庭湖詩云破浪南風正回竿畏日斜言南風畏日又云回竿則非四年所作甚明當是是年自衡州歸襄陽經洞庭詩也元微之志云扁舟下荆楚竟以寓卒旅殯嶽陽其後嗣業啓柩襄袝事於偃師途次于荆拜余為志辭不能絶吕汲公亦云夏還襄漢卒於嶽陽魯譜云其卒當在衡嶽之間秋冬之交衡在潭之上流與嶽不相鄰舟行必經潭然後至嶽當云在潭嶽之間蔡譜以史為是以吕為非蓋未之考耳鶴先君未第時酷嗜杜詩頗恨舊注多遺舛嘗補緝未竟而逝又欲考所作嵗月於逐篇下終不果運力未必不賫恨泉下也鶴不肖常恐無以酬先志乃取槧本集注以遺藁為之正定凡經據引者不復重出又輒益以所聞於是稍盈卷帙每詩再加考訂或因人以核其時或搜地以校其迹或摘句以辨其事或即物以求其意所謂千四百餘篇者雖不敢謂盡知其詳亦庶幾十得七八矣呂汲公年譜既失之略而蔡魯二譜亦多疏鹵遂更為一譜以繼于後先生積著誠多而不幸不偶此不足論獨嘗謂至成都未幾裴冀公還朝繼帥者李國楨崔光逺郭英乂自宜與之弗合顧與髙適定交最早相知最深其為西川節度先生何以翻然舍之而東曽不如依嚴武之為密且久蜀人師氏以貧交行為武作今疑為適而作也以此知先生賦性特剛少不如意則不能曲徇茍合故不為當時所容身後又復醜以牛酒之事曽不知果以飫溺尚能為令賦詩且事遊憩乎耒陽之墳豈非宗文早世先生所謂瘞夭者而後世附㑹滋為人惑因書于首以俟博識嘉定丙子三月望日臨川黃鶴書集注杜詩姓氏唐昌黎先生韓氏名愈字退之有詩題子美墳唐元氏名楨太原王氏名洙字原叔翰林學士兵部郎中知制誥史館修撰注子美集先古詩後近體計三十六卷建安王氏名昱字公旦建陽人度支員外郎祕閣校理臨川王氏名安石字介甫撫州臨川人拜左僕射諡文公鳳臺王氏彥輔和注子美詩四十九卷自號鳳臺子王氏名澄鳯臺子之子王氏名端仁鳯臺子之孫巨野王氏名禹稱字元之濟州巨野人翰林學士知審官院兼通進銀臺封駁司建安王氏名楷王氏名杞王氏名琪字君玉王氏逢原王氏深父王氏立之直方王氏性之永嘉王氏名十朋字龜齡集注編年詩史三十二卷建安王氏名紆眉山蘇氏名軾字子瞻眉州眉山人諡太師文忠公著釋事蘇氏養直西蜀趙氏次公字彥材著正誤西蜀趙氏夔字堯卿趙氏彥材趙氏元序西蜀師氏名古著詳說二十八卷師氏尹瞻民嘉興魯氏訔編注子美詩一十八卷廬陵歐陽氏名修字永叔吉州永豐人諡文忠公豫章黃氏庭堅魯直黃氏少度謝氏邁槃幼淮海秦氏觀游少秦氏少儀宛丘張氏耒潜文永嘉張氏器先鄄城張氏名詠字復之濮州鄄城人諡忠定公張氏天覺張氏名逸序蜀本子美詩一十卷歷陽張氏孝祥安國張氏伯玉讀子美集有詩河東薛氏蒼舒續注子美詩薛氏夢符廣注子美詩薛氏綜薛氏士昭薛氏元肅城南杜氏修可續注子美詩杜氏名田字時可著補遺杜氏定功河南尹氏名洙字師魯起居舍人直龍圗閣臨川晏氏名殊字同叔諡元獻公臨川劉氏名敞東萊徐氏字居仁編次門類詩徐氏俯川師徐氏君平徐氏持晦呂氏大防撰年譜東萊蔡氏伯世撰年譜蔡氏天啓蔡氏絛西蜀孫氏倬民瞻孫氏彥忠西蜀程氏演良季程氏天祐宋氏名祁撰唐書子美傳西蜀宋氏援輔正宋氏彥材遁齊陳氏正敏后山陳氏名師道字無已一字履常號彭城居士陳氏希仲陳氏元龍陳氏體仁陳氏德溥南豐曽氏名鞏字子固建昌南豐人擢試中書舍人曽氏公衮盱江李氏覯伯泰李氏彭老啇李氏希聲李氏名觀補遺子美傳臨安李氏堯祖唐卿李氏厚載德沈氏括中存胡氏撰子美草堂序苕溪胡氏仔胡氏銓衡邦唐氏庚西子梅氏聖俞韓氏駒蒼子馬氏存才子潘氏大臨邠老潘氏大觀仲逹孫氏名僅撰子美詩序孫氏子尚孫氏何洪氏芻父駒洪氏琰父玉洪氏朋父龜洪惠僧覺範河南邵氏博溫伯橘林石氏敏若九江夏氏名竦字子喬江州人樞密使封英國公夏氏倪父均何氏覬表人蘇州何氏泓髙氏荷勉子饒氏節操德朝氏冲之叔用朝氏補之姑蘇丁氏修永嘉丁氏鎮叔丁氏惠安縉雲鮑氏文虎著譜論蘄陽林氏敏功字子仁蘄州人贈髙隱處士林氏敏修子敬林氏子來林氏明仲林氏致明長樂鄭氏卬著釋文楊氏符祖信汪氏革民信汪氏藻章彥汪氏端本子之汪氏洋源養建安余氏葵東漢詩僧祖可正平李氏錞聲希真隱詩僧善權巽中元氏不伐曹氏夢良傅氏藻可薦鹿氏伯可任氏居實文孺吳氏憲吳氏季南吳氏明可吳氏少雲賈氏巖老崔氏肅之萬氏先之萬氏申之萬氏大年永嘉甄氏雲卿龔氏實之芮氏國器馮氏方仲圎喻氏叔竒毛氏叔度朱氏邦翰永嘉項氏用中周氏成祖上蔡謝氏良佐顯道謝氏逸逸無
