body:
  text: 補注杜詩卷十三宋黃希原本黃鶴補注秋行官張望督促東渚耗洙曰一作刈稻向畢清晨遣女奴阿鄭曰烏葛切小女本作咹稽豎子阿段往問大厯二年洙曰文十年王在渚宫注小洲曰渚補注鶴曰官猶言門官漢高帝紀有功勞行田宅師古曰行音行酒之行猶付與也今使之領田故曰行官東渚即東屯按公大厯二年秋自瀼西居東屯此詩當其年秋晚作耗稻謂蒲稗之能為禾害者當去之東渚雨今足佇聞粳稻香洙曰謝靈運詩滮池溉粳稻説文粳稻屬也稻稌也補注希曰東渚猶楚詞所謂北渚渚小涯也爾雅釋稌稻曰别一名也七月云十月穫稻説文云沛國謂稻為糯粳稻屬也字林云糯黏稻粳稻不黏者本草以粳米稻米為二物粳與粳古今字鶴曰佇聞粳稻杳則是稻未可刈耗稻不當曰一作刈故下云上天無偏頗蒲稗各自長人情見非類田家戒其荒功夫競榾榾除草至岸傍又云豐苗亦巳穊雲水照方塘有生固延蔓靜一資隄防皆是謂去耗稻也上天無偏頗蒲稗各自長洙曰胸奴傳朕聞天不頗覆地不偏載謝靈運湖中作蒲稗相因依人情見非類洙曰前漢朱虛侯章請為吕太后言耕田高后兒子畜之笑曰顧乃父知田耳若生而為王子安知田乎章曰臣知之太后曰試為我言田章曰深耕穊種立苗欲疏非其種者鋤而去之太后默然師古曰以斥諸吕也穊稠也穊種者言多生子孫也田家戒其荒洙曰前漢武帝紀野荒田苛也功夫競榾榾除草置岸傍洙曰食貨志藝除草也莊子天地篇榾榾然用力甚多榾苦骨反穀者命之本客居安可忘洙曰命之一云今土范子計然曰五穀者萬民之命國之重寶也晉書黎元以穀為命青春具所務勤墾免亂常吳牛力容易並驅動莫當洙曰驅去聲動莫當一云紛逰場世説滿奮云吳牛見月而喘齊還詩並驅從兩牡兮世説今之水牛生江淮故謂吳牛趙曰容易言牛力最多不以為難也並驅則雙駕之也場者疆場之場豐苗亦已穊鄭曰穊几利切稠也雲水照方塘洙曰劉公幹詩方塘含白水有生固蔓延靜一資隄防督領不無人提攜頗在綱洙曰攜一作挈書盤庚若綱在綱有條而不紊荆揚風土暖洙曰周禮曰揚州荆州宜稻肅肅候微霜尚恐主守疏用心未甚臧洙曰臧善也趙曰主守指行官張望清朝遣婢僕寄語踰崇岡西成聚必散洙曰書平秩西成不獨陵我倉洙曰詩我倉既盈潘安仁籍田賦我倉如陵我庾如坁也豈要仁里譽洙曰里仁為美感此亂世忙洙曰非欲賙施以安仁里之譽蓋亂世不可不蓄積以為給也北風吹蒹葭蟋蟀近中堂洙曰北風冬風也言歲向冬矣詩十月蟋蟀入我床下故近中堂荏苒百工休鬱紆遲暮傷洙曰禮月令霜降百工休謝宣逺詩履運傷荏苒陸士衡詩紆鬱遊子情謝琨詩遲暮獨如何師曰詳味此詩託意於除惡以佑善人其終篇在於聚而能散以閃亂離之困乏使甫為政其意必有見于世者惜其莫之用也覽柏中丞兼子姪數人除官制詞因述父子兄弟四美載歌絲綸大厯元年作洙曰按唐書柏氏無顯人惟柏耆傳云將軍良器之子元和中人不顯州郡甫又有詩寄柏學士林居趙曰此詩有戮力自元昆意其柏貞節也然竊有疑焉公詩又有柏學士林居柏大兄弟詩柏二别駕詩豈可指言柏貞節之家乎俟明識辨之補注鶴曰唐史唯柏耆柏良器有傳而俱未嘗有事於蜀當是柏茂林與柏貞節然公有記柏學士林居及柏大兄弟山居詩皆言其精典籍開書卷與此詩言軍功不同按六典太子中允二人正五品下職擬黃門侍郎此詩云方當節鉞用又云吾病日回首雲臺誰討論作歌挹盛事推轂期孤騫當是大厯元年到夔後作是時柏都督在夔按公有送田四弟將軍以夔州柏中丞命起居江陵衛公疑中允是中丞二字之誤耳唐職官志百官志中丞正叶四品下六典正五品上於賢臣官則尊之句頗紛然喪亂際見此忠孝門洙曰晉卞壺傳翟湯嘆曰父死於君子死於父忠孝之道萃於一門蜀中寇亦甚柏氏功彌存深誠補王室戮力見元昆洙曰魏書重以王室多故爾雅先生為昆漢髙紀戮力注并力也趙曰父子兄弟有功於行陳則詩人宜以忠孝稱之三止錦江沸獨清玉壘昏洙曰左太沖蜀都賦廓靈關而為門包玉壘而為宇注玉壘山名華陽國志錦江言蜀人織錦濯其中則鮮明故曰錦江成都記玉壘山導江縣西北三十里鶴曰傳所謂以湯止沸也寰宇記曰濯錦江係之華陽縣公自入蜀見成都之亂蓋寶應元年徐知道反永泰元年崔旴反殺郭英乂大厯三年七月楊子琳以瀘州刺史反此錦江三沸也玉壘山名今永康軍即是也補注鶴曰作此詩時楊子琳未反當是指假子璋反崔光逺攻之兵不戢因而大掠又徐知道崔旴反為錦江之三沸按九域志玉壘山在茂州而唐志云山在彭州蓋彭州西北至茂州山八十里茂州與蜀州且為鄰蜀與卭又為鄰豈非柏茂林為卭州刺史與楊子琳李昌夔同起兵討崔旴故云舊史代宗紀永泰二年二月卭州刺史柏茂林充卭南防禦使劍南西山兵馬使八月又為卭南節度使從杜鴻漸請而王注云杜鴻漸表柏貞節為卭州刺史殆止據新史鴻漸而言又茂林為防禦使時崔旴亦為茂州刺史充劍南西山防禦使當是玉壘指旴而言詩云方當節鉞用即是茂林為卭南節度使矣髙名入竹帛洙曰鄧禹曰垂功名於竹帛新渥照乾坤洙曰渥恩也子弟先卒伍芝蘭疊璵璠洙曰謝玄與從兄朗為叔父安所器重曰譬如芝蘭玉樹生於庭階同心注師律洙曰易師出以律灑血在戎軒洙曰漢書贊二十八將有來羣彥捷我戎軒梁吳均袖間血灑地補注鶴曰舊史云柏茂林而新史杜鴻漸崔寧傳俱以為柏貞節然詳味子弟先卒伍同心注師律奉公舉骨肉誅叛經寒溫等語意茂林與貞節為兄弟誅叛謂共攻崔旴也故送蜀州柏二别駕將中丞命往江陵有遷轉五州防禦使之句公為夔府柏都督謝上表其中有云察臣劒南區區恐失臣節則都督不是茂林蓋茂林大厯元年二月方授卭南防禦使八月又為卭南節度使不應又為夔府都督其都督却是柏貞節而中丞則茂林也絲綸實具載洙曰禮記緇衣子曰王言如絲其出如綸王言如綸其出如綍言出彌大者也紱冕巳殊恩洙曰文選班固西都賦紱冕所興奉公舉骨肉誅叛經寒溫金甲雪猶凍朱旗塵不翻洙曰陸佐公石闕銘朱旗萬里補注鶴曰天寶九載七月諸衛應隊仗所用緋色旗幡並改為赤其諸節度使亦準此崔旴以永泰元年十月反柏當起兵去至大厯元年三月方休兵宜其甲為雪凍上句所謂誅叛經寒溫是也每聞戰場説歘激懦氣奔聖主國多盜賢臣官則尊方當節鉞用必絶祲沴音戾根趙曰以其有功必使之膺節鉞之用必絶祲沴之根以報朝廷吾病日回首雲臺誰再論洙曰後漢馬武等傳二十八將論云永平中顯宗追感前世功臣乃圖畫二十八將於南宫雲臺上作歌挹盛事推轂期孤騫洙曰鄭當時推轂士及官屬丞吏誠有味其言也注言薦舉人如車轂之輪轉此詩注柏中允為柏耆按新舊二史所載耆上入鎮州説王承宗諭承元移鎮及使李同捷以擅殺同捷流放至賜死而詩中乃言效力於成都又云三止錦江沸即非耆矣切疑為柏貞節崔旴之殺郭英乂也貞節與瀘州揚子琳帥師以討之杜鴻漸鎮蜀表授卭州刺史二史皆於傳無所考信故未能修去闕之以俟有聞者師曰求忠臣於孝子之門戮力并力也元昆長兄也時崔旴殺郭英乂柏貞莭與楊子琳討平之然貞節父子兄弟皆盡忠孝之節率先士卒注意師律流血於兵重其英聲義氣載之絲綸天子褒以紱冕其皇恩已優渥矣故云新渥照乾坤芝蘭香草璵璠美玉芝蘭與璵璠相疊謂舉族皆賢也誅叛經寒溫謂討賊厯涉歲時金甲雪猶凍言威嚴可畏賊不寒而栗朱旗塵不翻謂靈旗所指煙旗遂息也故聞柏氏之風者懦夫亦為之激昂故曰歘激懦氣奔聖人因多難而興國家多盜而能解紛治劇此其所以為聖人故云聖王國多盜置官本以待賢士惟臣之賢始尊之以官故云賢臣官則尊梫沴不祥之氣茍朝廷用柏氏秉節鉞必能止不祥之患甫以多病甘自退縮惟回首屬望柏氏畫像雲臺再論其功故云雲臺誰再論柏氏孝忠萃於一門此亦唐家之盛事也故甫作詩以歌其事庶幾天子命之為帥推轂而遣其勢騫揚特出衆人之表故曰期孤騫也説者皆以柏耆止於入鎮説王承宗非也聽楊氏歌大厯元年作補注鶴曰詩云江城帶素月況乃清夜起老夫悲暮年壯士淚如水當是在夔州從舊次及梁權道編為大厯元年作佳人絶代歌獨立發皓齒洙曰前漢外戚傳李延年侍上起舞歌曰北方有佳人絶代而獨立以其顔色獨異當代無匹也夢符曰按楚詞朱唇皓齒嫥以姱些比德好間習以都些又古樂府雜曲從來著名惟趙子復有丹唇發皓齒一嬌一態本難逢如畫如花定相似定功曰阮籍詠懷詩南國有佳人榮華若桃李朝逰江北岸夕宿瀟湘沚時俗薄朱顔誰為發皓齒滿堂慘不樂洙曰前漢刑法志古人有言曰滿堂飲酒有一人向隅而悲泣則一堂皆為之不樂故一人不得其平為之悽愴於心響下清虛裏洙曰一作浮雲裏江城帶素月洙曰謝希逺月賦素月流天況乃清夜起淶曰曹子建中夜起長歎老夫悲暮年壯士淚如水洙曰世説王敦每酒後輒詠魏武帝樂府曰老驥伏櫪志在千里烈士暮年壯心不已以如意打玉唾壺唾壺盡闕荆軻歌於易水之上士皆淚垂如水玉杯久寂寞洙曰山海經曰犬戎國有一女子方跪進玉杯食韓子曰紂為象箸而箕子怖以為象箸必不加於土鉶必將犀玉之杯象箸玉杯必不羮菽藿則必薦豹胎金管迷宫徴洙曰世之議樂者以絲不如竹竹不如肉言肉聲勝於絲竹則金石固當有間矣孟嘉語也趙曰以玉杯之寂寞言不敢為聲以金管迷宮徴言其聲之不逮於歌皆以形容歌聲之妙勿云聽者疲愚智心盡死洙曰韓娥遇宋人辱之娥曼聲而哭長幼皆泣下宋人謝之娥乃曼聲而歌老幼皆喜躍言聲感人心之甚至于如此古來傑出士豈待一知已洙曰孟子曰豪傑之士雖無文王猶興吾聞昔秦青傾側洙曰一云倒天下耳修可曰列子曰昔薛談學謳於秦青未窮青之技自謂盡之遂辭歸青弗止餞於郊衢撫節悲歌聲振林木響遏行雲談乃謝求返終身不敢言歸趙曰傾天下之耳則非特一知巳而已荆南兵馬使太常卿趙公大食刀歌永泰元年作補注鶴曰唐志天下兵馬元帥下有前軍中軍後軍兵馬使此詩云問兵刮寇超下牢當是在夔作梁權道編在大厯元年然是年冬蜀中無事當是永泰元年冬崔旴反時蜀中大亂夔𨽻荆南節度趙公刮寇至此太常樓船聲嗷嘈洙曰漢武鑿昆明池始制樓船上建樓櫓蓋官有樓船將軍問兵刮寇超下牢洙曰下牢楚地補注鶴曰牧州本治下牢戍夷陵縣有下牢鎮與江陵相近趙曰同此而上至夔故曰超下牢當是永泰元年冬崔旴反趙自荆南來禦寇駐於白帝公是冬在雲安與之相遇故曰白帝寒城駐錦袍玄冬示我胡國刀牧出令奔飛百艘夢符曰牧州牧也令縣官也牧出令奔同赴軍事也艘船也劉備遣關羽乘船數百艘皆會於江陵猛蛟突獸紛騰逃白帝寒城駐錦袍洙曰華陽國志先主征吳於夷道還屯於巴東治魚復縣公孫述更名白帝玄冬示我胡國刀壯士短衣頭虎毛洙曰莊子説劒庶人之劒蓬頭瞏鬢垂曼胡之纓短後之衣憑軒拔鞘所交切天為髙翻風轉日木怒號平聲氷翼雲淡傷哀猱奴刀切鐫錯碧罌鸊鵜膏洙曰爾雅注鸊鵜似鳬而小膏中潤刀鋩鍔洙曰一云銛鋒已瑩虛秋濤洙曰王褒頌巧冶鑄干將之撲清水淬其鋒越砥斂其鍔注鋒創芒端秋濤言其色之澄徹如此鬼物撇捩亂坑壕撇匹蔑切捩練結切蒼水使者捫赤絛洙曰搜神記曰秦時有人夜渡河見一人丈餘手橫刀而立叱之乃曰吾蒼水使者也龍伯國人罷釣鼇洙曰列子湯問龍伯之國有大人一釣而連六鼇合負而趨歸其國焉芮公回首顔色勞洙曰芮公荆南節度使補注鶴曰唐唯有豆盧欽望豆盧寬封芮公而非在大厯間按舊史衛伯玉傳廣德元年拜江陵尹充荆南節度觀察等使大厯初丁母憂朝廷以王昴代其任伯玉潛諷將吏不受詔遂起復為節度使大厯十一年入覲卒則荆南自廣德元年至大厯十一年節度使乃衛公非芮公疑衛訛為芮然王兵馬使二角鷹詩亦云荆南芮公得將軍何也師曰是趙芮公未知何所本也分閫救世用賢豪洙曰分閫謂閫內事寡人制之閫外之事將軍制之賢豪趙公也趙公玉立髙歌起補注希曰桓溫表抗節玉立誓不辱死攬環結佩相終始萬歲持之護天子得君亂絲與君理洙曰隱四年傳衆仲曰以德和民不聞以亂猶治絲而棼之蜀江如線針如水洙曰蜀水至瞿塘則為峽所束如線焉荆岑彈丸心未巳洙曰言有以一丸泥封大散關也賊臣惡子休干紀洙曰史記亂臣賊子陸士衡誅鋤干紀魑魅魍魎徒為耳洙曰宣三年傳王孫滿曰昔夏之方有德也鑄鼎象物百物而為之備使民知神姦故民入川澤山林不逢不若魑魅魍魎莫能逢之注魑山神也獸形魅怪物魍魎水神也妖腰亂領敢欣喜用之不髙亦不痺音婢又音卑不似長劒須天倚修可曰荆楚故事曰襄王與唐勒景差宋玉等遊於雲陽之臺王謂左右曰能為大言者乎唐勒曰壯士怒兮絶天柱北斗戻兮泰山夷景差曰狡士猛毅撼搖覆載鋸牙鋸雲聲其大吐舌萬里唾一世玉曰方地為輿圓天為蓋彎弓挂扶桑長劒倚天外王曰善吁嗟光祿英雄弭大食寶刀聊可比丹青宛轉麒麟裏光芒六合無泥滓洙曰言終用此刀澄清六合畫象麒麟閣王兵馬使二角鷹永泰元年作補注鶴曰悲臺哀壑之中有萬里之長江此言夔也當是永泰元年冬王扞寇至夔時作按舊史衡王大厯初丁母憂朝廷以王昴代其任伯玉潛諷將吏不受詔遂起復再任王得非昴乎悲臺蕭瑟石巃嵸洙曰潘嶽西征賦巃嵸逼逈注巃嵸髙大貌也哀壑杈丫浩呼洶中有萬里之長江夢符曰按世説有人譏周僕射與親友言戲穢雜無檢節周曰吾若萬里長江何能千里一曲即周顒也回風滔日孤光動角鷹倒翻壯士臂將軍玉帳軒勇氣二鷹猛腦絛徐墜洙曰見黑白二鷹詩注趙曰舊本作徐侯鐩殊無理義王介甫善本作絛徐墜於理或然晉潘足苦雨行賦云始蒙瀎而徐墜目如愁胡視天地杉雞竹兔不自惜孩虎野羊俱辟易音壁易趙曰項羽傳楊喜追羽羽叱之人馬辟易師古注曰辟易謂開張而易其本處鞲上鋒稜十二翮洙曰鮑明逺昔如鞲上鷹將軍勇鋭與之敵將軍樹勳起安西崑崙虞泉入馬蹄白羽曽肉三狻猊夢符曰按楚辭囚虛元於虞淵注虞淵日所入也淵與泉同洙曰白羽箭也猊獅子也一走五百里鄭曰狻先丸切猊五兮切補注希曰即列子所謂駕八駿之乘升崑崙之丘上林賦滿白羽文穎曰引弓盡箭鏑為滿以白羽羽箭故言白羽敢決豈不與之齊荆南芮公得將軍亦如角鷹下翔一云入翔雲惡鳥飛飛啄金屋洙曰謂賊陷長安安得爾輩開其羣驅去六合梟鸞分洙曰使君子小人各得其所也師曰悲臺哀壑長江先言荆楚風景故述角鷹之所由出也巃嵸髙大貌杈丫不齊貌鷹有角亦若馬有肉駿也軒勇氣亦謂青油幕下軒昂其勇氣也杜田云軒昂氣恐理或不然王兵馬與徐侯穟皆趙芮公猛將故以二鷹猛腦況之愁胡謂思胡地辟易退却貌不自惜言不保其性命鞲以皮謂其臂也西安都護府崑崙虞泉皆在西白羽乃箭名三狻貌喻西域三部王公起于安西嘗擒西域胡酋其勇決似鷹故託以美之金屋謂天子黃金闕也惡鳥喻史思明殘黨猶陷長安故子美欲得王公驅其羣以清六合使君子小人各得其所而不雜揉故曰梟鸞分梟食母之鳥甘林大厯元年作補注鸛曰詩云捨舟越西岡必是自東屯登瀼西梁權道編在大厯元年然詩中言貨豆實送王畿以添軍旅之用蓋以大厯二年吐蕃時寇近畿子儀屯涇陽京師戒嚴故又云戎馬何稀是秋公居東也捨舟越西岡洙曰謝靈運舍舟眺逈渚入林解我衣青芻適馬性好鳥知人歸修可曰曹子建好鳥鳴髙枝晨光映逺岫洙曰陶潛晨光熹微謝玄暉窗中列逺岫夕露見日晞遲暮少寢食清曠喜荆扉洙曰荆扉柴門也經過倦俗態在野無所違試問甘藜藿洙曰莊子藜藿不糝未肯羡輕肥洙曰子路願肥馬衣輕裘喧靜不同科出處各天機洙曰莊子其嗜欲深者乃天機淺矣趙曰天機雖三出莊子而今所用則蚿曰子動吾天機主自然也舊注非勿矜朱門是洙曰郭景純朱門何足榮未若託蓬萊陋此白屋非洙曰蕭望之傳周公致白屋之士師古曰白屋謂白蓋之屋以茅覆之賤人之居也明朝步鄰里長老可以依時危賦斂數色角切脫粟為爾揮洙曰公孫𢎞身食一肉脫粟飯此言民雖因賦斂猶能致意於賔客故曰可依也相㩦行豆田秋花藹菲菲子實不得喫貨市送王畿盡添軍旅用迫此公家威洙曰言賦斂煩重而民無餘資迫此公家威在上者苛急也趙曰言豆雖結實而長老者不得喫也補注鶴曰按舊史大厯元年閏十月丁未百寮上表以軍興急於糧餉請納職田以助費十二月敕諸州科斂百姓致户口凋弊二年三月又稅青苖地田命御史府差使徴之可見賦斂之數貨豆以送王畿蓋以此徴取之苛故云迫此公家賦主人長跪問戎馬何時稀我衰易悲傷屈指數賊圍勸其死王命愼莫遠奮飛趙曰詩不能奮飛雨永泰元年作補注鶴曰公以永泰元年至雲安明年方遷居夔州郭今詩云亢陽乘秋熱百穀亦巳棄蓋言其年秋旱當是其年在雲安作詳見詩注行雲遞崇髙洙曰蓋雲行則施雨飛雨藹而至潺潺石間溜汩汩松上駛亢陽乘秋熱百穀亦已棄洙曰陽過亢則旱而無歲望矣皇天德澤降燋卷有生意趙曰應璩與岑瑜書云頃者炎早日更甚沙礫銷鑠草木燋巷也前雨傷卒暴今雨喜容易不可無雷霆間作鼓增氣補注鶴曰舊史永泰元年春大旱四月乙已始雨七月又旱以久旱遣近臣録囚是年自春無雷六月始雷佳聲達中宵所望時一致洙曰以其應期也清霜九月天髣佛見滯穗洙曰遺秉滯穗伊寡婦之利郊扉及我私洙曰郊扉一云栽耘詩遂及我私我圃日蒼翠恨無抱甕力庶減臨江費洙曰子貢過漢隂見一丈人方為圃畦鑿隧而入井抱甕而灌杜曰峽內無井取江水飲之鄭典設自施州歸宋曰秦秋時巴國界秦昭王置黔中郡梁改為施州永泰元年作補注鶴曰六典典設局典設四人從六品下掌太子湯沭灑掃鋪陳之事裴冕以附李輔國貶施州移澧州而大厯二年自澧州拜左僕射則是當時在永泰元年冬作故詩云孟冬方首路詩見後寄裴施州詩注吾憐滎陽秀冒暑初有適名賢慎出處不肯妄行役洙曰言以其義而動也師曰出處君子之大致不可妄動鄭公雖冒暑有適蓋以鄭子每乏是以南謁裴施州亦以義動不音妄行役也旅兹殊俗逺竟以屢空迫洙曰回也庶乎屢空南謁裴施州氣合無險僻攀援懸根木登頓入矢石洙曰言險阻也補注希曰叔孫通傳漢王方蒙矢石爭天下青山自一川城郭洗憂戚聽子話此邦令我心悅懌其俗則純朴不知有主客溫溫諸侯門禮亦如古昔勑厨倍常羞杯盤頗狼籍洙曰言雖幽逺而敬客之意不異於中華也史滑稽傳履舄交錯杯盤狼藉堂上燭滅主人留髠而送客時雖屬喪亂事貴賞洙曰一作當匹敵中宵愜良會裴鄭非逺戚羣書一萬卷博涉供務隙他日辱銀鈎洙曰銀鈎書也言字體交連徑曲如銀鈎森踈見矛戟夢符曰按北史李義深有當世才用而心險峭時人語曰矛戟森森李義深倒屣喜旋歸洙曰蔡雍倒屣而迎王粲趙曰倒屣不上鞋踵也畫地來所厯鄭曰畫去聲乃聞風土質又重田疇闢刺史似寇恂列郡宜競借鄭曰如字又音迹洙曰見權宜借寇怐注北風吹瘴癘羸老思散策渚拂蒹葭塞洙曰一作寒嶠穿蘿鳥羃補注鶴曰蒹葭見上注詩注蔦一名女蘿故合而言之曰蔦蘿羃如伍子胥羃面之羃此身仗兒僕髙興潛有激孟冬方首路洙曰顔延年改服飾徒侣首路局險難強飯取崖壁歎爾疲駑駘汗溝血不赤洙曰言非良馬也修可曰馬援銅馬相法曰汗溝欲深長漢書曰大宛國多善馬汗血言其先天馬子也終然備外飾駕馭何所益補注希曰選詩終然謝夭伐我有平肩輿前途猶凖的翩翩入鳥道師曰鳥道謂飛鳥之道蓋言髙險也庶脫蹉跌厄上倉何切下徒結切種萵苣并序鄭曰上鳥禾切下勤吕切大厯元年作既雨巳秋堂下理小畦隔種一兩席許萵苣向二旬矣而苣不甲坼伊人莧青青趙曰别本伊人作獨野傷時君子或晚得微祿輱軻不進因作此詩補注鶴曰序曰堂下理小畦堂即客堂也詩云枯旱於其中炎方慘如燬謂大厯元年大旱自三月不雨至于六月當是其年作隂陽一錯亂驕蹇不復理枯旱於其中炎方慘如燬趙曰詩王室如燬言隂陽乖繆而致旱也植物半蹉跎嘉生將已矣雲霞歘奔命師伯集所使洙曰以旱而物無生意也趙曰漢書嘉生之類注專指為禾狄仁傑傳風伯清塵雨師瀟道補注希曰郊祀志神降之嘉生師古曰嘉生謂衆瑞河東賦叱風伯於南北兮呵雨師於東西指麾赤白日澒洞青光起雨聲先巳風散足盡西靡趙曰謝眺詩森森散雨足端本曰澒洞雲色起貌散足言雨散作而止足也已風猶言止風風止則雨降西靡謂斜雨向西也山泉落滄海霹靂猶在耳終朝紆颯沓信宿罷蕭灑堂下可以畦呼童對經始洙曰經始言初無畦而始經構之也苣兮蔬之常隨事藝其子破塊數席間荷鋤功易止兩旬不甲坼空惜埋泥滓趙曰易云百穀草木皆甲坼選奮迅泥滓野莧迷汝來宗生實於此修可曰楊子雲蜀都賦其竹則宗生蔟攢俊茂豐美又左思吳都賦楠檣之木相思之樹宗生髙岡族茂幽阜此輩豈無秋亦蒙寒露委翻然出地速滋蔓戶庭毁因知邪干正掩抑至沒齒洙曰言苣為莧所蕪以喻賢者為小人見掩抑也賢良雖得祿守道不封巳趙曰言賢良之人得位則不恣非似邪佞得位而封已亦猶嘉疏之苣出地則不滋非似野莧之得而滋蔓也國語叔向曰引黨以封巳注曰封厚也擁塞敗芝蘭衆多盛荆杞洙曰小人衆也趙曰芝蘭所以壅塞以荆杞之衆多也非特苣耳中園陷蕭艾老圃永為恥登於白玉盤洙曰漢官儀曰封禪壇有白玉盤藉以如霞綺莧也無所施胡顔入筐篚洙曰有其文者必有其容有其容者必有其德喻小人雖有掩抑之才而終不為邦家所用師曰胡顔謂強厚顔也野莧始雖盛及萵苣生長登於白玉之盤藉以如霞之綺遂使彼無所用不猶強顔入吾筐篚之內不亦無恥乎以喻小人掩君子一旦登于玉堂則小人將何顔而居朝乎終亦不用而已矣秋風二首大厯元年作補注鶴曰詩云巫山又云上牢下牢皆是夔州所作詩又云要路何日罷長戟戰自青羌連百蠻蓋以廣德永泰吐蕃與黨項羌渾奴利入寇而言當是大厯元年秋風淅淅吹巫山上牢下牢修水關洙曰上牢下牢皆峽內地名水關關津也鄭功曰與上牢相連荆州記峽江突起最險處山復陡下名下牢關吳檣楚柂牽百丈洙曰檣柂百丈皆船上器用也夢符曰按今湖湘間行舟以竹相續為索以引上水舟謂之百丈暖向成都寒未還要路何日罷長戟戰自青羌連白蠻趙曰舊本作百蠻善本作白蠻極是蓋雋州以西有烏蠻白蠻也公於夔詠懷詩云絶塞烏蠻地補注鶴曰青羌謂吐谷渾其先居於徙河之青山又界內有青海乾封元年封青海國王白蠻在東謝蠻之南東謝蠻又在黔州之西數百里中巴不得消息好瞑傳戍鼓長雲間洙曰戍鼓戍樓鼓也秋風淅淅吹我衣東流之外西日微洙曰東流言逝而不反也日微言迫遲暮也天清小城搗練急洙曰為征戍者為寒衣也石古細路行人稀洙曰以商旅未通也不知明月為誰好早晚孤帆他夜歸會將白髮倚庭樹故園池臺今是非洙曰時經喪亂也師曰百天川東流其勢順然也喻下當效順于天子月臣道也日君道也月微乃其常日不當微西日微喻京師為賊所陷代宗出幸搗練急謂婦人送征戍之衣行人稀謂商旅不通也故園池臺今是非傷故里為寇焚蕩也久雨期王將軍不至大厯元年作補注鶴曰詩云十月荆南雷怒號當是大厯元年作詳見注及後篇寄王十將軍承後詩天洙曰一作山雨蕭蕭滯洙曰一云帶茅屋空山無以慰幽獨趙曰楚辭曰幽獨處乎山中鋭頭將軍來何遲洙曰傳言白起頭小而鋭令我心中苦不足數看黃霧亂玄雲時聽嚴風折喬木泉源泠泠雜猿狖泥濘漠漠飢鴻鵠嵗暮窮隂耿未已人生會面難再得趙曰古詩會面安可知李延年歌佳人難再得憶爾腰下鐡絲箭射殺林中雪色鹿前者坐皮因問毛知子厯險人馬勞異獸如飛星宿落鄭曰宿思救切列星也應弦不礙蒼山髙安得突騎只五千崒然眉骨皆爾曹走平亂世相催促一豁明主正鬱陶憶洙曰一云恨昔范增碎玉斗洙曰鴻門之會漢王使張良獻玉斗于范增增碎之未使吳兵著白袍趙曰南史梁人陳慶之麾下悉白袍所向披靡昏昏閶闔閉氛祲十月荆南雷怒號洙曰時賊據京師十月而雷變異也趙曰即吳之閶闔門也舊注云時賊虜京師是大厯二年京師晏然矣鄭曰梫子鳩切精氣感祥補注希曰禮樂志遊閶闔應劭曰天門此蓋京師而云永泰元年吐蕃回紇黨項羌渾如刺屢入寇京師戒嚴趙注謂大厯二年京師晏然矣按史其年九月十月却有吐蕃之擾又戒嚴唯元年無事鶴曰公嘗賦雷詩云巫峽中霄動滄江十月雷按大厯元年史書冬無雷則隂閉而陽從亦宜有雷匡侵衡得天人之際精祲有以相蕩師古曰祲謂隂陽氣相别李祕書始興寺所居大厯二年作補注鶴曰李祕書有二一李十五祕書一李八祕書此當是大厯二年在夔州别李十五丈祕書公有贈李十五丈别詩為辛苦行蓋被生事牽又云長受衆日鄰惟其坐事之薄故居於寺不見祕書心若失及見祕書失心疾鄭曰既見君子我心則降安為動主理信然我獨覺子神充實重聞西方止觀經洙曰佛西方之教其法有大觀大覺也補注希曰止觀經蓋摩訶止觀是經凡十卷昔天台僧湛然嘗為止觀輔行傳𢎞訣又述止觀科文昔天寶十四年臨安私記元年建巳月請再書勘校未周衆已潛寫屬海隅喪亂法侣星移或將入潭衡或持往吳楚寶應于浦陽重勘云云今詩作於大厯初則重聞之義亦見矣老身古寺風泠泠妻兒待米又云我且歸去他日杖藜來細聽縛雞行鄭曰縛伏約切大厯元年作補注鶴曰詩云注目寒江倚山閣當是大厯元年冬寓居夔西閣時作故又云小奴縛雞向市賣小奴縛雞向市賣雞被縛急相喧爭家中厭雞食蟲蟻不知雞賣還遭烹蟲雞於人何厚薄吾叱奴人解其縛雞蟲得失無了時注目寒江倚山閣趙曰人之得失如雞如蟲又且相仍何時而了乎至於注目寒江倚山閣則所思逺矣近世惟黃魯直達此詩之旨其書酺池寺書堂云小黠大癡螳蜋捕蟬有餘不足夔憐蚿退食歸來北窗夢一江風月趂漁船可與言詩者當自解也師曰愛蟲則害雞愛雞則害蟲利害得失要在權其輕重而為之除寇則勞民愛民則養寇其理亦猶是也與其養寇孰若勞民與其食蟲孰若存雞負薪行魯曰峽民男為商女當門戶坐肆於市㕓擔負於道路者皆是婦人也蘇曰海南亦有此風每誦此詩以喻父老然亦耒易變其習也大厯元年作補注鶴曰與下篇最能行同時作負薪行以言夔州之女最能行以言歸州之男故一以昭君一以屈原喻之當是大厯元年公初到夔見其習俗如此故作梁權道編在二年然詩云地褊衣寒困石根未必至二年冬方有作也夔州處女髮半華四十五十無夫家更遭喪亂嫁不售一生抱恨堪咨嗟土風坐男使女立趙曰陸機詩土風清且嘉應當門户女出入趙曰晉傳玄豫章行曰男兒當門户墮地自生神今公詩却云女當門户也補注鶴曰毛詩汝墳曰遵彼汝墳伐其條枚蓋君子從役於外而婦人為樵薪之事又古詩云健婦持門戶則女當門戶從事樵薪其來巳久趙何為於公此句為創見也十猶八九負薪歸賣薪得錢應供給補注希曰爾雅櫬采薪即薪釋曰郭云指解今樵薪一名櫬一名采薪一名即薪今江東閩中多女人負擔采薪也至老雙鬟只垂頸野花山葉銀叉並筯力登危集市門死生射利兼鹽井洙曰夔有鹽井靣粧首飾雜啼痕地褊衣寒困石根若道巫山女粗醜何得此一云北有昭君村師曰售賣也夔有鹽井婦人當門戶或負薪販鹽以自給其女粗醜可知蒼舒曰按歸州圖經王嬙字昭君漢紀注云南郡稱婦人待詔掖庭元帝竟寧元年胸奴呼韓邪單于來朝帝賜單于待詔掖庭王嬙為胸奴閼氏按樂府解題云帝後宫既多乃使畫工圖形按圖召幸宫人皆賂畫工多者十萬少不減五萬昭君自恃其貌獨不與乃惡塗之及後丐奴入朝選美人配之昭君當行及入辭光彩射人悚動左右天子方重失信外國悔恨不及窮按其事畫工毛延壽陳敝劉白龔寬楊杜樊青皆棄市最能行大厯元年作補注鶴曰此篇雖以歸州舟人最能操舟而作然首云峽中丈夫多在水則不獨指歸州人也與負薪行同大厯元年作峽中丈夫絶輕死少在公門多在水富豪有錢駕大舸加我切貧窮取給行艓子洙曰峽人富則為商旅貧則為人操舟以地居山水之間瘠惡無以耕也修可曰博雅曰舸舟也又楊雄方言南楚江湖湘凡船大者謂之舸艓小舟言輕如小葉也師曰艓音葉小兒學問止論語大兒結束隨商旅欹帆側柂入波濤鄭曰柂正船木􅀈旋梢濆無險阻鄭曰旋隨戀切洙曰􅀈旋梢濆皆操舟者所能也補注鶴曰毛詩汝墳孔氏曰墳謂崖岸狀如墳墓而爾雅曰汝為墳天曰汝有墳董氏曰謂大水溢出别為小水故知墳當作濆郭璞引遵彼汝墳以證爾雅晉世詩本猶為濆也水之回者曰旋曰渦郭景純江賦盤渦石轉是也峽江多渦旋能沒人舟故撇旋梢漬不以為險者歸州長年為最能梢猶泊撇猶過也朝發白帝暮江陵頃來目擊信有徴瞿塘漫天虎鬚怒洙曰鬚一作眼歸州長年與最能趙曰言行瞿塘峽與虎鬚灘甚易也補注鶴曰趙注以虎鬚為灘名甚是按峽桯記自蠻江桔柏池凡三百八十江會于峽前次荆門都四百五十灘此應是其一如狼尾灘虎牙灘是也其有瞿塘不與三峽之數此鄉之人氣量窄誤競南風疏北客洙曰左傳南風不競若道土無英俊才何得山有屈原宅洙曰屈原有宅在歸州定功曰後漢郡國志注荆州記秭歸縣北一百里有屈平故宅方七頃纍石為屋基今地名樂平寄裴施州永泰元年作補注鶴曰裴冕以附李輔國表輔國親昵術士劉烜充山陵使判官烜坐法冕坐貶施州數月移澧州復徴為左僕射以大厯四年十二月卒按舊史大厯二年二月戊寅以澧州刺史裴冕為左僕射則是詩在永泰元年冬作蓋史云刺施州止數月遂移澧州而由山陵使坐貶在廣德元年九月丙中而此詩云幾度寄書白鹽北苦寒贈我青羔裘故定為在永泰元年冬梁權道編在大厯二年殊不考也廊廟之具裴施州洙曰潘安仁器非廊廟姿宿昔一逢無此流金鐘大鏞在東序洙曰禮樂之所在也夢符曰按詩賁鼓維鏞大鐘曰鏞書曰天球河圖在東序鐘鏞以言至和所自出東陽位也水壺玉衡縣清秋洙曰氣宇之清徹也夢符曰按文選清如玉壺氷書曰在旋璣玉衡以齊七政自從相遇減多病三歲為客寬邉愁堯有四嶽明至理洙曰堯建四嶽以共治天下漢二千石真分憂洙曰宣帝曰我與共理者惟良二千石乎幾度寄書白鹽北洙曰施州在白鹽山之北也趙曰白鹽者夔州之山此裴使君寄書與公義甚明也舊注云施州在鹽山之北非矣補注鶴曰按九域志施州北至夔州三百餘里則夔州在施州之南不應云寄書白鹽北殆謂公在白鹽山之東北故自瀼西移東屯云白鹽危嶠北赤甲古城東苦寒贈我青羔洙曰一作絲裘霜雪回光避錦袖蛟龍動篋蟠銀鈎洙曰龍蛇銀鈎皆字體也言所惠之書如龍蛇銀鈎屈蟠交連趙曰今藏裴公銀鈎於其中所以龍蛇動於篋也紫衣使者辭復命再拜故人謝佳政將老巳失子孫憂後來況接才華盛趙曰言我將老而免憂子孫無他以後來之人相接有裘君諸子才華之盛美矣帥曰東序殷學也全鍾大鏞乃禮樂之器言能文之以禮樂也水壺玉衡言其清和也甫以施州比堯之四嶽漢之二千石施州在白鹽山之北甫屢得其惠書與羔裘霜雪回光避錦袖蓋言裘也龍蛇動篋蟠銀鈎蓋言書字體勢也紫衣使者辭復命言朝廷必遣使辟召之也奉贈薛十二丈判官見贈大厯二年作補注鶴曰詩云忽忽峽中睡悲風方一醒又云老夫自汲澗野水日泠泠當是大厯三年秋在東屯作時吐蕃寇邠靈州京師戒嚴故又云龍蛇尚格鬬灑血暗郊坰忽忽峽中睡悲風方一醒西來有好鳥為我下青𡨕師曰甫有渴疾故忽忽不樂至秋風稍蘇故云悲風方一醒西有崑崙山王母與漢武帝相會于此常有青鳥為使甫以薛十二有仙姿故以況之羽毛淨白雪慘淡飛雲汀趙曰晉道一道人之言雪曰先集其慘淡也既蒙主人顧舉翮唳孤亭持以比佳士及此慰揚舲趙曰劉協彌勒石像碑云似揚舲遊水髙曰揚舲行船也清文動哀玉趙曰此言佳士之文清如玉聲之哀蓋環佩之類見道發新硎洙曰莊子屠牛坦刀創若發新硎唐曰薛之善屬文復能知道故云欲學鴟夷子洙曰貨殖傳范蠡浮江湖改姓適齊為鴟夷子注顔師古曰自號鴟夷者言若盛酒之鴟夷多所容受而可卷懷與時張弛陳遵傳曰自用如此不如鴟夷也待勒燕山銘洙曰竇憲勒功燕然班固為之銘誰重斷蛇劒洙曰一云口重斬邪劒漢髙有斬蛇劒致君君未聽洙曰伊尹致君堯舜趙曰此言利器如漢朱雲所用之劒而未施有致君之術業而君未用志在麒麟閣見今代麒麟問注無心雲母屏洙曰後漢鄭𢎞為太尉時舉第五倫為司空班次在下每正朔朝見𢎞曲躬自卑上遂聽置雲母屏風分隔其間由此為故事師曰昔范蠡號鴟夷子鴟夷子乃韋囊也甫勉薛莫學鴟夷子泛湖當如竇憲立功勒銘于燕然山畫象麒麟問無徒若鄭𢎞為帝寵春賜以雲母屏隔坐而已卓氏近新寡豪家朱門扃相如才調逸銀漢會雙星洙曰司馬相如初逰臨卭臨卭之富人卓氏有女名文君新寡善琴相如因以琴心挑之遂為夫婦晏曰雙星牛郎織女也客來洗粉黛日暮拾流螢晏曰車胤聚螢讀書不是無膏火勸郎勤六經老夫自汲澗野水日泠泠我歎黑頭白君看銀印青卧病識山鬼為農知地形洙曰九章有山鬼補注希曰漢百官表凡吏人比二千石以上銀印青綬秦本紀告祖龍死事亦有山鬼字誰矜坐錦帳洙曰漢百官志郎官給錦帳苦厭食魚腥東南兩岸坼孫曰謂峽江也橫水注滄𬈑碧色忽洙曰一云苦惆悵風雷搜百靈洙曰見兹山朝百靈注空中石一云有白虎赤節引娉婷補注希曰石善本作右赤節猶綘節也自云帝里女洙曰云一云季文選我天帝之季女噀雨鳯皇翎洙曰弄玉帝女也乘鳯皇仙去師曰欒巳噀酒為雨故云噀雨襄王薄行迹莫學冷如丁洙曰丁丁令威也去家一千年始一歸也千秋一拭淚夢覺有微馨洙曰見宋玉髙唐賦云人生相感動金石兩青熒洙曰李廣射石虎沒羽揚子雲曰至誠則石金為開選賦琳珉青熒丈人但安坐休辨渭與涇洙曰無分清濁也龍蛇尚格鬬灑血暗郊坰吾聞聰明主治國用輕刑洙曰尚德也銷兵鑄農器今古歲方寧文王日儉德俊乂始盈庭洙曰詩濟濟多士文王以寧言為國當藉材也榮華貴少壯豈食楚江萍洙曰楚昭王渡江得一物大如斗色赤以問孔子孔子曰此萍實也師曰至誠則金石為開甫言薛能以至誠相感動能移此以感人主使之輕刑消兵務從節儉搜求賢俊如是則天下不期治而自治薛於此可以掇取榮華於年少之日豈但如甫客寓荆楚而食萍實也哉暇日小園散病將種秋菜督勒耕牛兼書觸目大厯元年作補注鶴曰詩云不愛入州府畏人嫌我真及乎歸茅宇傍舍未曾嗔又云江村意自放林木心所欣當是大厯二年瀼西作雖東屯瀼西俱有茅屋東屯詩所謂東屯復瀼西來皆茅屋是也然園圃在瀼西不愛入州府畏人嫌我真洙曰襄陽耆舊記龎德公在沔水上至不入襄陽城及乎歸茅宇洙曰一云及歸在茅屋旁舍未曾嗔趙曰漢髙祖適從旁舍來老病忌拘束應接喪精神趙曰使人應接不暇補注希曰揚雄解嘲但費精神於此江村意日放林木心所欣秋耕屬地濕山雨近甚勻冬菁飯之半牛力晚來新修可曰張平子南都賦春花夏笋秋韭冬菁注菁蔓菁也補注希曰坊記注葑蔓菁心陳宋之間謂之葑陸機葑蕪菁幽人或謂之芥方言云蘴蕘蕪菁也深耕種數畝未甚後四鄰嘉蔬既不一名數頗具陳荆巫非苦寒採擷接青春飛來兩白鶴暮啄泥中芹補注希曰爾雅芹楚葵釋曰郭云今水中芹按本草陶注二月三月作英時可作葅又有渣芹别本注云有兩種荻芹赤芹雄者左翮垂損傷已露筋一步再流血尚經一作驚矰繳勤三步六號叫志屈悲哀頻鸞皇不相待側頸訴髙旻杖藜俯沙渚為汝鼻酸辛趙曰宋玉賦寒心酸鼻寫懷二首大厯二年作補注鶴曰詩云鄙夫到巫峽三歲如轉燭按公永泰元年至雲安大厯元年移居夔州郭三年下峽此當是大厯二年作故云三歲詩又末云負暄候樵牧歲暮日月疾殆二年冬也勞生共乾坤何處異風俗冉冉自超競行行見羈束趙曰古樂府冉冉幕中超古詩行行重行行無貴賤不悲無富貧亦足洙曰言貴賤貧富一委順之而已所謂樂天之命者趙曰賤之所以悲者以貴形之也故無貴則賤者不悲貧之所不足者以富形之也故無富則貧者亦足萬古一骸骨洙曰坰歸於死鄰家遞歌哭鄙夫到巫峽三歲如轉燭洙曰言光景之迅速也全命甘留滯忘情任榮辱洙曰一歸之於真朝班及暮齒日給還脫粟趙曰公嘗為左拾遺今又為工部員外郎則所謂班公時年五十六矣所謂暮齒然日給還脫粟而已蓋其貧故也編蓬石城東洙曰編蓬以庇風雨采藥山北一作林谷洙曰許徴君詢詩采藥白雲偎略以肆所養許畋隱居北山采藥讀易自號太易先生漢武三召不起補注鶴曰石城在夔州城橫虎牙行云壁立石塞起又觀公孫弟子舞劒器詩云瞿塘石城草蕭瑟是也用心霜雪間不必條蔓緑非關故安排洙曰謝靈運詩居當以待終處順故安排曾是順幽獨洙曰謝靈運詩安排徒空言幽獨賴鳴琴達士如弦直小人似鈎曲曲直吾不知負暄候樵牧洙曰後漢童謠直如弦死道邉曲如鈎封公侯趙勝負暄坐睡風簷候樵牧之歸洙曰列子楊朱篇曰昔者宋國有田夫暨東作自曝於日顧謂妻曰負日之暄人莫知者以獻吾君當有重賞師曰冉冉無氣貌人超兢於物則氣喪矣凡百所行但見羈束不自由也君子當安乎富貴貧賤樂天知命而不憂甫檢校工部故云朝班暮齒乃晚年也編蓬所以禦風雨採藥所以療衰病雖不特違然能守其節操不為紛華所變故云用心霜雪間不必條蔓緑孟子曰古者以利為本人達當安時處順不用注意安排排著則是以利為本是以理之士其直如弦負暄炙背也夜深坐南軒明月照我膝驚風翻河漢梁棟已出日羣生各一宿飛動自儔匹吾亦驅其兒營營為私實洙曰一作室天寒行旅稀歲暮日月疾榮名忽洙曰一作感中人洙曰楚辭以薄寒中人世亂如飢虱定功曰顔延年曰亂世人事如蟣虱古者三皇前滿腹志願畢胡為有結繩陷此膠與漆洙曰言三皇之前民未有知結繩之後民偽日起而是非交構如膠漆然趙曰莊子曰待繩約膠漆而固者是侵其德也禍首燧人氏厲階董狐筆洙曰燧人火化而爭欲之心生董狐直董狐筆而是非之端起故以燧人為禍首以為厲階也君看燈燭張轉使飛蛾密洙曰言愈察則愈繁放神八極外俯仰俱蕭瑟趙曰莊子其疾俯仰之間再撫四海之外也補注鶴曰爾雅及漢禮樂志俱云西極而此乃云八極蓋本過秦論云并吞八荒而師古曰八荒八方荒忽極逺之地也終契如往還洙曰一云終然契真如得匪合洙曰一云金仙術師曰甫以私居口體為纍不免驅兒營治生計以為口實故也榮名忽中人謂暮年檢校工部三皇之前其風淳朴欲寡而自足結繩之後巧偽日滋如膠漆然是以燧人火化而爭欲之心起董狐直筆而是非之端生此甫所以有禍首厲階之語也有燈則有蛾有蛾則有爭要在放神俯仰無所凝滯視死生如往還可歎大厯四年作補注鶴曰詩云太守頃者在南山則詩作於李勉大厯二年入朝為京尹後當是大厯四年勉入廣時公在潭州作梁權道編在大厯元年夔州詩內不考勉是時尚未為南山守也天上浮雲如白衣斯須改變如蒼狗洙曰言雲本無衣人以為衣人以為狗而巳趙曰浮雲固變態不常之物然初為白衣變為蒼狗譬萬事之變不可名狀也補注希曰維摩經是身如浮雲須臾變滅故此用其意而變其語古往今來共一時人生萬事無不有洙曰非特雲也古今人事亦如此者旅近者抉眼去其夫洙曰一云昧河東女兒身姓栁趙曰不喜其夫如抉眼中之物而去之東北人方言不喜見者每曰抉眼補注希曰抉眼云出吳世家伍子胥事丈夫正色動引經酆城客子王季友羣書萬卷常暗誦孝經一通看在手貧窮老瘦家賣履好事就之為攜酒豫章太守髙帝孫引為賓客敬頗久洙曰宗至也趙曰惟王季友正色引經在唐文粹惟載季友詩觀公全篇所云則王佐之才矣補注鶴曰按豫章圖經唐王季友酆城人家貧賣履博極羣書李勉引為賔客正色引經勉甚敬之善為詩見元結篋中集又隆興有石幢載牧守名爵李勉在張鎬之後魏少遊之前而鎬以廣德二年九月卒勉以其年九月繼之舊史代宗紀廣德二年九月辛酉命洪州刺史李勉副知選事又舊史李勉傳大厯二年來朝拜京兆尹兼御史大夫故詩曰太守頃者在南山以京兆有南山而云然則詩當作於二年後也勉大厯四年十二月巳在廣平馮崇道朱濟之亂則其刺廣亦在其年後當德宗之初加平章公檢校左僕射可謂不負公李也疑丞曠前後之句聞道三年未曾語小心恐懼閉其口太守得之更不疑人生反覆看亦醜趙曰言人生相得氣合則勿疑若更反覆則旁人看之亦醜也明月無瑕豈容易紫氣鬱鬱猶衝斗洙曰明月之珠紫氣衝斗見張華傳時危可仗真豪俊二人得置君側否太守頃者在山南邦人思之比父母王生早曽拜顔色髙山之外皆培塿培都茍切下路茍切洙曰魏都賦培塿之與方壺修曰可曰左傳曰部婁無松柏説文曰培塿小土山方言家秦晉之間謂之培塿風俗通曰培塿者即阜之類也今齊魯之間山之小髙者曰培塿用為羲和天為成用平水土地為厚洙曰堯羲仲和仲書地平天成又禹平水土王也論道阻江湖李也疑丞曠前後洙曰三公論道經邦左輔右弼前疑後丞趙曰王也可以論道而留滯于江湖阻隔於致也身李也可為疑丞而天子前後用闕斯人死為星辰終不滅洙曰見方朔為嵗星注致君堯舜焉肯朽吾輩碌碌飽飯行風后力牧長回首洙曰風后力牧黃帝時良臣也師曰衣無情而狗有情如衣猶之可也變而為狗則甚矣古今人事變更有同浮雲河東栁氏之女疾其夫貧醜抉眼以去其夫王生然王生通經孝友之士也見愛於太守李侯而見惡於其妻亦足見人生反覆萬事變更如浮雲然兹可歎也帝王世紀云黃帝夢大風吹天下塵垢皆去復夢人執千鈞之弩驅羊數萬羣帝歎曰風天號令垢去土后在也豈有姓風名后者哉千鈞之弩畢力能逺驅羊萬羣牧民為善豈有姓力名牧者哉乃得風后於海隅力牧於大澤甫以王李二人比之風后力牧可以論道可以丞疑以輔王室故回首以眷思之觀公孫大娘弟子舞劒器行并序年大厯二作大厯二年十月十九日夔州别駕元持宅見臨潁李十二娘舞劒器壯其蔚跂問其所師曰余公孫大娘弟子也開元三載余尚童稚記於郾城觀公孫氏舞劒器渾脫瀏灕上力周切下力支切頓挫獨出冠時自髙頭宜春梨園二伎坊內人洎外供奉曉是舞者聖文神武皇帝初公孫一人而已玉貌錦衣況余白首今兹弟子亦非盛顔既辨其由來知波瀾莫二撫事慷慨聊為劒器行往者吳人張旭善草書書帖數嘗於鄴縣見公孫大娘舞西河劒器自此草書長進豪蕩感激即公孫可知矣行曰補注鶴曰大厯二年十月公雖在東屯而今序云夔州别駕元持宅見李十二娘舞劒器殆是公暫出府中也昔有佳人公孫氏一舞劒器動四方觀者如山色沮喪天地為之久低昂敏功曰言不自安也霩如羿射九日落霩音酷洙曰堯時十日並出堯令羿射中九日日烏皆死墮其羽翼矯如羣帝驂龍翔來如雷霆收震怒罷如江海凝清光洙曰皆言舞劒器回旋疾徐變態也絳脣珠袖兩寂寞洙曰蕪城賦玉貌絳脣敏功曰謂公孫已死也晚洙曰一作脫有弟子傳芬芳饒曰李十二娘傳其術臨潁美人在白帝饒曰白帝即夔州魚復縣甫於此見之妙舞此曲神揚揚與余問答既有以感時撫事增惋傷先帝侍女八千人朝曰先帝指元宋也公孫劒器初第一五十年間似反掌風塵澒洞昏王室梨園子弟散如煙女樂餘姿映寒日夢符曰按唐志元宗既知音律又酷愛法曲選坐部女子弟三百教於梨園號皇帝梨園弟子宫女數百亦為梨園弟子居宜春北院洙曰祿山之亂梨園弟子及雜伎皆流散也補注希曰開元初至大厯故曰五十年間安祿山入京師命搜捕百官宦者宫女等每獲數百人輒衛落陽自是其散如煙之不可收矣金粟堆南木已拱洙曰見金粟堆南松柏裏注左傳墓木拱矣江淹恨賦拱木斂魂趙曰金粟堆在明皇秦陵之北瞿塘石城草蕭瑟玳筵急管曲復終夢符曰按古樂府今日樂相樂行綺殿文雅遒玳筵歡趣密又曰歌朱唇動愛神舉洛陽少童邯鄲女古稱渌水今白紵催絃急管為君舞樂極哀來月東出老夫不知其所往足繭荒山轉愁疾洙曰足重繭也言奔走流落而足重繭爾趙曰公自言去留未定今徒足繭荒山足耳胝如繭也所謂重既纍繭是也補注希曰淮南子楚欲攻晉墨子聞之自晉超而十日十夜足重繭而不休息至於郢見楚王虎牙行洙曰虎牙灘名也險絶蕭銑僣江陵日屯兵于此後常為屯戍之地鮑曰虎牙山名盛𢎞之荆州記郡西泝江六十里南岸有山名荆門北岸有山名虎牙二山相對楚西塞也補注鶴曰後漢志南郡夷陵有荆門冇虎牙山荆州記曰荆門江南虎牙江北虎牙有文如虎荆門上合下開今詩云八荒十年防盜賊當是大厯二年作又云犬戎鎖甲聞丹極指吐蕃寇邠靈京師戒嚴也秋風歘吸吹南國天地慘慘無顔色洞庭揚波江漢回虎牙銅柱皆傾側洙曰虎牙銅柱並灘名言江漢之間亦未寧靜也虎牙屬南郡山名見後漢志巫峽隂岑朔漠氣峯巒窈窕溪谷黑杜鵑不來猿狖寒山鬼幽憂雪霜逼洙曰楚九歌有山鬼詩楚老長嗟憶炎瘴洙曰以慘急所以憶炎瘴也補注鶴曰瘴者山嵐水毒與草莽沴氣鬱勃薰蒸之所成炎方地脈疏而氣泄愆陽不收人為長燠所暵膚理不密又為山水草莽之氣所寇故成瘴今云巫峽隂岑常多朔漠之氣老者憶南方之瘴蓋傷兵戈連年殺氣日盛也三尺角弓兩斛力洙曰弓短而徑力不能勝也壁立石城橫塞起金錯旌竿滿雲直洙曰時多防戎也漁陽突騎獵青丘洙曰祿山之反皆漁陽突騎漁陽燕薊青丘內地屬洛陽犬戎鎖甲圍丹極洙曰犬戎吐蕃也丹極帝居也時吐蕃陷京師八荒十年防盜賊補注鶴曰此句上疑脫一句爾雅以觚竹北户西王母日下謂之四荒而賈誼始為并吞八荒之説師古言之矣見上注征戍誅求寡妻哭洙曰以征役而在外故多寡妻逺客中宵淚霑臆錦樹行大厯二年作補注鶴曰詩云荒戍之城石色古東郭老人住青丘飛書白帝營斗栗琴瑟几杖柴門幽當是大厯二年東屯作今日苦短昨日休歲云暮矣增離憂洙曰時不我與而不知老之將至也霜凋碧樹作錦樹洙曰木華經霜而紅故若錦然萬壑東逝無停留洙曰聖賢之傷時者莫不寓意於此孔子所以有川上之歎荒戍之城石色古東郭老人住青丘趙曰東郭夔州之郭也老人公自言補注荒戍之城當是指赤甲城城公孫述所築寰宇記云奉節縣北三十里與舊白帝曰青城相連青丘豈非指東屯以其在東故飛書白帝營斗粟琴瑟几杖柴門幽青草萋萋盡枯死天驥跛足隨氂牛洙曰天馬隨氂牛喻君子而隨小人趙曰草枯則無以充天馬之飼與氂牛無異矣氂牛蠻中牛也自古聖賢多薄命洙曰伯夷之飢死孔子之栖栖顔回之夭孟軻之坎軻皆薄命之聖賢也姦雄惡少封公侯洙曰漢祖之起所取侯者皆屠沾刀筆之人故國三年一消息終南渭水寒悠悠五陵豪貴反顚倒鄉里小兒狐白裘洙曰五陵漢帝五陵也言當貴者賤當賤者貴是皆傷時也夢符曰按史記秦囚孟嘗君昌説幸姫求解姫曰願得君狐白裘直千金以獻昭王有客能狗盜入秦宫藏盜得狐白裘獻之遂得歸齊矣又禮士不衣狐白生男墮地要膂力一生富貴傾邦國趙曰傳玄豫章行男兒當門戶墮地自生神生男有膂力可以用武致功則一生之間所取富貴傾動邦國與美人容貌一顧傾人城冉顧傾人國不坰莫愁父母少黃金天下風塵兒亦得洙曰天下風塵則姦邪得志師曰日短歲暮皆傷老之將至而歲不我與也飛書白帝謂有所請丐也天馬跛足隨氂牛喻君子失所而混居小人之中聖賢命薄惡少封侯五陵豪貴反顛倒鄉里小兒狐白裘皆歎亂世貴者反賤賤者反貴如小人徒有膂力動取富貴蓋以天下風塵故也赤霄行蘇曰嚴武一日欲殺甫及章彛集吏於門武出冠挂於簾者三左右白其母奔救得止獨殺彛於是有赤霄行以敘之作其事趙曰此篇乃遭侮而感嘆補注鶴曰蘇注云為嚴武作而梁權道編在大厯二年夔州詩內若梁編為是則是時武死已兩年不應方形之詩末云老翁慎莫怪少年當是指郭英又與莫相疑行同是永泰元年作故莫相疑亦有晚將末契託年少之句詳見前注孔雀未知牛有角渴飲寒泉逢抵觸洙曰以非類也非類故不相知不相知而相從則見辱矣赤霄玄圃須往來翠尾金花不辭辱趙曰玄圃在崑崙山上之别名見葛仙傳晉左九嬪孔雀賦云擢翠尾之修莖江中淘河嚇飛燕銜泥却落羞華屋趙曰淘河者鵜鴰也飛燕從江上來為淘河所疑意謂燕爭其魚而嚇之歸華屋之上負此羞恥銜泥而却落也皇孫猶曾蓮勺困洙曰孝宣帝紀帝初為皇孫髙材好學然亦喜遊俠數上下諸侯常困於蓮芍鹵中如淳曰為人所困辱也蓮芍縣有鹽池縱廣十餘里鄉人名為鹵中蓮音輦芍音灼衛莊見貶傷其足洙曰出左傳刖鮑牽而逐髙無咎齊人來招牽之弟鮑國而立之鮑國相施氏忠故齊人取以為鮑氏後仲尼曰鮑莊子之知不如葵猶能衛其足注葵傾葉向日以蔽其根言鮑牽居亂不能危行言孫衛作鮑老翁慎莫怪少年葛亮貴和書有篇趙曰老翁公自指言也少年則所見辱之子也陳夀所上諸葛亮集二十四篇而貴和第十一此公所以託言不能和則必召辱矣丈夫垂名動萬年記憶細故非髙賢洙曰言不可録小怨而棄大德也趙曰此見公胸懷之廓落無宿憾矣漢文帝與丐奴書曰朕與單于捐細故師古曰細故小事也師曰博物志孔雀尾多變色或紅或黃有如雲霞其色無定爾雅釋鳥鵜鴮鸅郭璞注今之鵜鴰也好羣飛況水食魚俗呼為淘河孔雀與牛非其類猶君子小人非其類不虞小人反為小人中傷淘河飛燕銜泥以汙華屋猶小人居朝反為汚辱皇孫鮑莊巳見內翰注語云君子坦蕩蕩此甫末章有貴和句而不記録其小怨不然何以見君子之大前苦寒行二首大厯元年作補注鶴曰詩云去年白帝雪在山今年白帝雪在地當是大厯元年正月公在雲安作詳見注漢時長安雪一丈牛馬毛寒縮如蝟修可曰西京雜記漢元封二年大雪深一丈野中烏獸皆死牛馬踡縮如蝟鄭曰蝟于貴切蟲似豪豬者楚江巫峽水入懷虎豹哀號又堪記秦城老翁荆揚客洙曰公杜陵人乃秦地也慣習炎蒸歲絺綌玄𡨕祝融氣或交手持白羽未敢釋趙曰以楚地多熱故也白羽言扇也去年白帝雪在山今年白帝雪在地補注鶴曰舊史永泰元年正月癸巳雪盈尺二年正月丁巳朔大雪平地二尺而新史不書新史務簡嚴而事物之紀多不該盡如斯之類非一觀唐史者當合新舊書並觀之永泰元年白帝之雪公雖不見殆得於所聞也凍埋蛟龍南浦縮趙曰此言水涸少也寒刮肌膚北風利楚人四時皆麻衣趙曰楚地多熱故四時寒衣以雪為訝也楚天萬里無晶輝三足之烏足恐斷羲和迭送將安歸洙曰言隂盛陽弱日不能破羣隂也趙曰淮南子曰日中有踆鳥注云踆趾也謂三足烏也羲和日御也以雪而烏斷則羲和馭日車失其所歸矣皆以形容雪深之意後苦寒行二首補注鶴曰同上年作南紀巫廬瘴不絶太古以來無尺雪洙曰世説南州謂之炎方地溫無雪補注鶴曰公有詩云巫山不見廬山逺則今云巫廬乃合二山而言然廬山居大江之南未若巫山之逼於炎瘴豈至太古以來無尺雪也且公嘗為桂州賦詩猶云雪片一冬深豈廬山之不桂若無乃詩人甚其辭耳蠻夷長老怨苦寒崑崙天關凍應折玄猿口噤不能嘯白鵠翅垂眼流血安得春泥補地裂晚來江門洙曰一云間失大木猛風中夜飛白屋白屋見甘林詩注天兵斬斷青海戎殺氣南行動坤軸補注鶴曰按史永泰元年八月吐蕃回紇黨項羌渾奴刺寇邉九月寇醴泉奉先黨項羌渾奴刺又寇同州盩屋十日吐蕃又與回紇冦邉冦奉天同州興平周智光郭子儀李回方等敗之殺伐之多故有是句蜀為坤維所以云動坤軸青海戎指吐蕃不爾苦寒何太酷洙曰疑殺戮太過也巴東之峽生凌澌彼倉回斡人得知晚晴大厯二年作補注鶴曰詩云髙唐暮冬雪壯哉當是二年冬作蓋以元年春到夔而是年史書冬無雪三年春又已下峽故知為二年詩髙唐暮冬雪壯哉舊瘴無復似塵埃洙曰峽中每嵐瘴起如塵埃翳天崖沈谷沒白皚皚江石缺裂青楓摧南天三旬苦霧開洙曰舞鶴賦嚴嚴苦霧赤日照耀從西來六龍寒急光徘徊洙曰六龍日馭也補注希曰髙后紀徘徊往來師古曰徘徊猶倣徨不進之意照我衰顔忽落地洙曰言見陽而熙也口雖吟咏心中哀未怪及時少年子揚眉結義黃金臺洙曰燕昭築黃金臺以禮郭隗鮑照詩豈伊白璧賜時起黃金臺汩乎吾生何飄零支離委絶同死灰洙曰支離言不為時所用也莊子支離既久心可使如死灰復陰大厯二年冬作補注鶴曰同是大厯二年冬作詩云昨日晚晴今日黑晚晴即前所賦之詩也方冬合沓玄陰塞昨日晚晴今日黑萬里飛蓬映天過孤城樹羽揚風直江濤簸岸黃沙走雲雪埋山蒼兕吼君不見夔子之國杜陵翁牙齒半落左耳聾洙曰夔州古夔子國也杜陵子美故里也夜歸大厯二年作補注鶴曰詩云峽口驚猿聞一箇則是在夔作又云夜來歸來衝虎過山黑家中已眠臥則是在瀼西居時作大厯二年夜半歸來衝虎過山黑家中已眠臥傍見北斗向江低仰看明星當空大洙曰明星夜半則見庭前把燭嗔兩炬峽口驚猿聞一箇白頭老罷舞復歌補注希曰後漢廉范傳交縳兩炬南史蔡興宗傳范慶宗曰老罷私門兵力頓闕杖藜不睡誰能那寄柏學士林居大厯元年作補注鶴曰詩云荆揚春冬異風土巫峽日夜多雲雨當是大厯元年夔州作又云盜賊縱橫甚密邇非指崔旰即指周智光也自胡之反持干戈天下學士亦奔波洙曰避亂奔散如波之奔歎彼幽栖載典籍蕭然暴露依山阿洙曰暴露言無所休庇也漢書衣冠暴露青山萬里靜散地白雨一洗空垂蘿亂代飄零豫到此古人成敗子如何荆揚春冬異風土洙曰風土記荆揚之間春寒而冬暖所以為異巫峽日夜多雲雨洙曰神女朝為雲暮為雨赤葉楓林百舌鳴洙曰楓木凡經霜則葉赤百舌鳥也黃泥一作花野岸天雞舞洙曰天雞鳥名謝靈運詩天雞弄和風盜賊縱橫甚密邇形神寂寞甘辛苦幾時髙議排金門各使蒼生有環堵洙曰使民各安其居也寄從孫崇簡大厯二年作補注鶴曰詩云嵯峨白帝城東西南有龍湫北虎溪則是在夔作又云與汝林居未相失似是大厯二年作時在赤甲瀼西也牧童一本作牧豎嵯峨白帝城東西南有龍湫北虎溪吾孫騎曹不記馬修可曰世説王子猷為桓沖騎曹參軍相問曰卿何署答曰不知何署時牽馬來似是馬曹乂所管幾何曰何由知數又問馬死多少曰未知生馬知死業學尸鄉多養雞洙曰見崔樹雞柵詩注龎公隱時盡室去武陵春樹他人迷洙曰龎德公攜妻子盡室入鹿山武陵春樹桃源也漁人迷路而入與汝林居未相失近身藥裏酒長㩦牧叟樵童亦無賴莫令斬斷青雲梯洙曰文選注仙者以雲而升故謂之雲梯西閣曝日大厯元年作補注鶴曰詩云凜冽倦玄冬負暄嗜飛閣當是大厯元年居西閣時作凜冽倦玄冬負暄嗜飛閣洙曰負暄以背向日也昱曰列子楊朱篇宋國有田夫暨春作自曝於日不知有綿纊狐貉顧謂妻曰負日之暄人莫知者以獻吾君將有重賞趙曰梁元帝纂要曰冬曰玄英亦曰玄冬羲和流德澤顓頊愧倚薄洙曰曹子建悲風鳴我側羲和逝不留重陰潤萬物何懼嵗不周毛髮具自和肌膚潛沃若洙曰沃若暖也如以湯沃然太陽信深仁衰氣歘有託欹傾煩注眼容易收病腳流離木杪猿翩仙山顛鶴洙曰何敬祖連翩御飛鶴謝靈運詩仰看條上猿朋知苦聚散哀樂日已作補注鶴曰朋知一本作用知非八哀詩云斷此朋知展醉為馬墜詩朋知來問腆我顔公蓋屢用此二字也即事會賦詩人生忽如昨古來遭喪亂賢聖盡蕭索洙曰自古喪亂之世聖賢不得其所故蕭索也胡為將暮年憂世心力弱師曰負暄炙背也嗜好也羲和日御也顓頊北帝也倚薄謂陰氣迫人沃若暖貌欹傾謂展轉向日病腳藉暖氣煦之則易收猿鶴喜曰和則流離布散翩仙軒舉人生貴隨時之宜不必傷今不如古昔古來聖賢遭喪亂之世亦皆蕭索失所豈獨甫乎何必憂世而至於心之弱也水閣朝霽奉簡嚴雲安大厯元年作補注鶴曰晚交嚴明府矧此數相見又首云東城抱春岑江閣鄰石面當是大厯元年春在雲安作梁權道編在大厯三年然是年正月公已出峽矣未必是朝日作朝旭東城抱春岑江閣鄰石面崔嵬晨雲白朝日射芳甸洙曰謝玄暉詩雜英滿芳甸雨檻卧花叢風牀展書卷鉤簾宿鷺起丸藥流鶯囀呼婢取酒壺續兒誦文選晚交嚴明府矧此數相見數色角切晚登瀼上堂大厯二年作補注鶴曰大厯二年三月公自赤甲移居瀼西此詩云繫馬林花動又云山田麥無隴當是其時作故躋瀼岸髙頗免崖石擁開襟野堂豁趙曰文選賦向北風而開襟繫馬林花動雉堞粉如雲鄭曰堞徒叶切城上垣也夢符曰按公羊傳五板而堵五堵而雉百雉而城堞城牆馬靣也文選鮑明逺蕪城賦以板築雉堞之盛井幹烽櫓之勤山田麥無隴春氣晚更生江流靜猶湧四序嬰我懷羣盜久相踵黎民困逆節天子渴垂拱洙曰時喪亂既久民困於賊後天子播遷未獲收復也趙曰天子皇皇於廟謨不得垂衣拱手補注鶴曰按舊史大厯二年正月戊寅勑同華二州頃因盜據民力凋殘宜給復二年一切蠲免黎民之困不獨此也詳考元年以乾元已來天下用兵議於天下地畝青苖上量配稅錢以充百官俸則其困非止於逆節矣羣盜久相踵謂崔旰周智光相繼而叛也所思注東北深峽轉修聳衰老自成病郎官未為冗凄其望吕葛洙曰以世亂思得良臣如吕望諸葛者趙曰可以有為於世而歎其衰病謝靈運詩欽聖若旦暮懷賢亦凄其不復夢周孔洙曰如周公孔子不可夢見矣又況得見之乎濟世數嚮時斯人各枯冢楚星南天黑蜀月西霧重趙曰以況風塵昏蔽道路阻隔也安得隨鳥翎迫此懼將恐師曰楚地有瀼東瀼西地髙可以登眺故云頗免崖石擁雉堞矮牆也麥無隴言麥茂熟靜猶湧言無風而波逆節指祿山之亂渴垂拱謂未收復京城所思注東北甫以東北為寇所擾不能無憂思也深峽轉修聳言困於楚峽不聞朝廷消息是以衰老自成病也郎官未為冗言不見用故思得賢俊如吕望諸葛周孔之徒出為國家整頓奈何斯人骨已朽矣楚星南天黑蜀月西霧重庶民惟星卿士惟月復歎楚蜀數昏亂是以甫欲隨鳥翅奮飛而去也敬寄族弟唐十八使君大厯三年補注鶴曰案公有巫山縣汾州唐使君十八弟宴別詩蓋公大厯三年下峽時與唐相別於巫山而此詩云春江洪濤壯谷轉頗彌旬又云登陸將首途筆札枉所申歸期局病肺敘舊思重陳當是别後唐寄書而公賦此以簡之是時猶未出峽也與君陶唐後盛族多其人聖賢冠史籍枝𣲖羅源津洙曰甫自撰萬年縣君京兆杜氏墓銘云其先系統於伊祁分姓於唐杜春秋傳云穆叔謂之世祿其在兹乎漢髙紀贊曰范宣子亦曰祖自虞以上為陶唐氏在夏為御龍氏在商為豕韋氏在周為杜氏注唐杜二國名補注鶴曰唐宰相世系表云杜氏出祁姓帝堯裔孫劉纍之後在周為唐杜氏成王滅唐以封弟帝叔虞改封唐氏子孫於杜城京兆杜陵是也然則唐與杜蓋同族也在今最磊落巧偽莫敢親介立實吾弟濟時肻殺身物白諱受玷行髙無汙真得罪永泰末放之五溪濱洙曰漢黃瓊皎皎者易為汚嶢嶢者易為缺四子講德青蠅不能穢垂棘詩白圭之玷尚可磨也語殺身以成仁馬援傳武陵五溪蠻夷注雄滿酉撫辰所謂五溪也趙曰所以明得罪之由以不受汙玷而致然鸞鳯有鎩翮鎩所戒切先儒曽抱麟洙曰顔延年詠嵇中散詩鸞翮有時鎩鎩殘也劉越石詩誰云聖達節知命故不憂宣尼悲獲麟西狩涕孔丘注孔子亦抱麟而泣雷霆劈長松骨大却生筋一失不足傷念子孰自珍泊舟楚宫岸戀闕浩酸辛除名配清江厥土巫峽鄰洙曰清江屬施州鄭曰清江溪名在施州本漢江巫縣地今夔州巫山縣補注鶴曰施州為清江郡水經云水色清照十丈故名厥土字本禹貢按九域志施與夔為鄰在夔之南三百餘里登陸將首途筆札枉所申歸朝局病肺敘舊思重陳春風洪濤壯洙曰顔延年春江壯風濤劉越石棄置勿重陳重陳令心傷谷轉頗彌旬趙曰郭景純江賦盤渦谷轉我能泛中流搪突鼉獺嗔洙曰鼉獺嗔言為小人所怒也長年已省拖洙曰省視也柂舟尾正船者長年操舟者視柂則將行矣慰此貞良臣趙曰欲春時乘船而往得一見唐公以相慰也師曰盛族之後枝𣲖蕃大故多産聖賢介立為人孤介也唐使君以介特不𧾱時輩為讒佞中傷代宗之時遂斥於五溪自古賢士困厄無代無之然長松雖遭霹靂猶有再生之期一失又何足傷也時唐公泊舟於楚岸以見甫復惠以書甫意欲乘春以視之慰其寥索故有春風洪濤壯唐突鼉獺嗔之語省柂言具船將行矣甫病渴無復還朝惟樂與朋舊敘懷故云歸朝局病肺敘舊思重陳釋悶廣德二年作補注鶴曰詩云四海十年不解兵犬戎也復臨咸京謂吐蕃以廣德元年入冦陷京師前此祿山陷京師今又為吐蕃陷之故云犬戎也復臨咸京自天寶十四載乙未祿山反時起兵至廣德元年為十年兵不解也此詩當是廣德二年作故又曰天子亦應厭奔走時在閬州故自稱江邊老翁而梁權道編在大厯三年第本舊次也四海十年不解兵犬戎也復臨咸京洙曰自祿山思明之亂方已而吐蕃復陷京城芻曰咸謂咸陽即西京也失道非關出襄野蒼舒曰按莊子黃帝將見大隗乎具茨之山至于襄城之野七聖皆迷無所問塗揚鞭忽是過胡城修可曰世説王敦作逆明帝騎巴鎮馬齎一金鞭至湖陰察軍形敦晝夢日繞其城忽然驚覺曰營中有黃鬚卑奴來何不縳取命騎追之不及也炎曰避寇者奔走迷道故有是句耳豺狼塞路人斷絶洙曰豺狼盜賊也烽火照夜尸縱橫洙曰漢制有寇則舉烽燧言寇亂未平則烽火照夜也天子亦應厭奔走洙曰時帝幸陜趙曰車駕雖歸長安而有乞遷洛巡悔之説羣公固合思升平但恐誅求不改轍朋曰譏賦斂之重也聞道嬖孽能全生洙曰指程元振也時元振用事媒蝎大臣故吐蕃入寇功臣不肯用命符曰代宗不能正其典刑江邊老翁錯料事眼暗不見風塵清補注杜詩卷十三
