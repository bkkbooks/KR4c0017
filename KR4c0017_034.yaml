body:
  text: 補注杜詩卷三十四宋黃希原本黃鶴補注多病執熱奉懷李尚書之芳大厯三年作補注鶴曰詩云大水渺茫炎海接蓋在江陵所見如此又首夏何須氣鬱蒸當是大厯三年四月作衰年正苦病侵凌首夏何須氣鬱蒸洙曰古詩首夏猶清和歊蒸鬱凌冥應璩書曰處凉臺而有鬱蒸之氣大水渺茫炎海接渺弭沼切竒峯硉兀火雲升洙曰硉郎兀切選詩夏雲多竒峯淮南子旱雲煙火趙曰選賦狀滔天以渺茫郭璞江賦巨石硉矹以前却思霑道暍黃梅雨洙曰京房傳暑有暍者漢武帝紀暍死暑中熱死也趙曰暑病曰暍思道暍之人以黃梅一雨霑之此武王扇暍之意可見公之仁心鄭曰暍於歇切敢望宫恩玉井冰洙曰後漢書琅邪有氷井厚丈餘魚豢魏晷明帝九龍殿前玉井綺欄趙曰唐志百官賜冰而公嘗為左拾遺當預賜冰之列不是尚書期不顧洙曰前漢陳遵嗜酒每飲賔客滿堂輒閉門取客車轄投井中雖有急終不得去嘗有部刺史奏事過遵值其方飲刺史大窮候遵霑醉時突入見遵母叩頭自白當對尚書有期㑹狀母乃令從後閣出去應休璉與滿公琰書曰當此之時仲孺不辭同産之服孟公不顧尚書之期山陰夜雪興難乘洙曰王徽之嘗居山陰夜雪初霽月色清朗忽憶戴逵逵時在剡便夜乘小船詣之造門不前而返曰乘興而行興盡而返何必見安道水宿遣興奉呈羣公大厯三年作補注鶴曰詩云澤國雖勤雨炎天竟淺泥小江還積浪弱纜且長堤歸路非關北行舟却向西又云異縣驚虛往同人惜解攜其曰小江異縣當是在江陵暫至外邑邑在江陵之西故云行舟却向西此詩大厯三年夏作魯鈍仍多病洙曰語參也魯蘇曰鄭𤣥魯鈍多病近稍倦書逢迎逺復迷耳聾須畫字蘇曰王笠不仕佯狂詐聾每說話即畫字後隱嵩山隋文纍詔不起髮短不勝箆澤國雖勤雨修可曰穀梁傳正月不雨言不雨者勤雨也注思雨之勤炎天竟淺泥補注鶴曰周禮澤國用龍節勤雨如修可引穀梁之說則是其時不雨何以下云炎天竟淺泥又云小江還積浪當是言得雨勤數然以炎天而泥故淺也小江還積浪弱纜且長堤歸路非關北俯曰子美北人未得歸鄉故云歸路非關北行舟却向西暮年漂泊恨今夕亂離啼童稚頻書札洙曰古詩烈士暮年又遺我一書札盤飱詎糝藜洙曰孔子陳蔡間七日不火食藜藿不糝我行何到此物理直難齊洙曰莊子齊物髙枕翻星月嚴城叠鼓鞞洙曰張景陽此郭非吾城入聞鞞鼓聲定功曰禮記鼓鞞之聲歡風號聞虎豹洙曰蕪城賦風嘷雨嘯又苦寒詩虎豹夾路啼水宿伴鳬鷖洙曰蜀都賦晨鳬且至候雁銜蘆雲飛水宿哢吭清渠異縣驚虛往洙曰古樂府它鄉復異縣同人惜解攜洙曰易出門同人蹉跎長泛鷁趙曰鷁大鳥船首畫之以驚水神俯曰泛鷁行舟也展轉屢鳴雞嶷嶷瑚璉器洙曰子貢瑚璉器夢符曰謝琨問羊孚曰何以器舉瑚璉羊曰故當以為接神之器陰陰桃李蹊洙曰李廣桃李不言下自成蹊餘波期救涸洙曰僖二十三年傳其波及晉國者君之餘也莊外篇車轍中有鮒曰吾得斗升水可以活矣費日苦輕齎杖䇿門闌邃肩輿羽翮低自傷甘賤役誰愍强幽棲蘇曰柏簡失意居九華山歎曰今日晦迹朝中故人略無愍强幽棲之心巨海能無釣洙曰任公子投竿東海浮雲亦有梯勳庸思樹立語默可端倪贈粟囷應指洙曰魯肅家富於財常散以賑窮乏結豪士時周瑜為居巢長聞之往求資糧肅有米二囷各三千斛直指一囷與瑜瑜竒之乃結僑札之交芻曰自嶷嶷瑚璉器以下叙美羣公能餽其貧故有贈粟之句登橋柱必題洙曰成都記云升仙橋司馬相如初西去題其柱曰不乘高車駟馬不過此橋後果以傳車至其處橋在望鄉臺東南一里管華陽縣丹心老未折夢符曰古樂府半溪度曲本厠偏伍卒一戰殄凶渠制賜文犀節驛報紫泥書入營陳御蓋還車乘紫車皇恩空已重丹心悵不紓渡瀘且不畏凌溪嗟有餘時訪武陵溪洙曰别賦心折骨驚武陵溪秦人避亂之處奉賀陽城郡王太夫人恩命加鄧國太夫人補注鶴曰陽城郡王乃江陵節度衛伯玉舊次及梁權道皆以為大厯三年作案新舊史大厯初伯玉丁母憂朝廷以王昴代其任諷將士云云遂起復再任今詩乃賀其母受封則非三年作甚明舊史又云廣德元年乘輿幸峽伯玉有幹略乃拜江陵尹荆南節度等使尋封陽城郡王此語蓋在大厯初丁母憂之前故此詩云郡依封土舊當是伯玉封王時母同受封而舊史帝紀又云大厯二年六月壬寅荆南節度使衛伯玉封陽城郡王與傳自異然丁母憂在大厯初為是此詩當在廣德二年後大厯元年前作若如紀言則大厯二年衛之母已死又元年柏中丞遣柏别駕將命江陵起居太夫人時已有太夫人之稱矣衛幕銜恩重夢符曰按前漢書晉灼注曰衛青征胸奴絶大幕大克獲帝就拜大將軍於幕中故曰幕府趙曰一本題下注云陽城王衛伯玉也以其姓衛則用之尤工潘輿送喜頻洙曰潘安閒居賦太夫人乃御板輿升輕軒濟時瞻上將趙曰申言郡王節度江陵為上將錫號戴慈親富貴當如此尊榮邁等倫郡依封土舊國與大名新趙曰言郡封雖仍是陽城郡而夫人之國加為鄧國是為新矣紫誥鸞回紙趙曰紫誥紫錦之誥也鸞回紙謂紙上之字有回鸞之辨也清朝燕賀人洙曰大厦成而燕雀相賀遠傳冬笋味洙曰孟宗後母好笋令宗冬月求之宗入竹林痛哭笋為之生更覺綵衣春奕葉班姑史洙曰班姑曹世叔妻班彪之女名昭字惠姬博學髙才世叔早卒有節行法度兄固著漢書其八表及天文志未及竟而卒和帝詔昭就東觀藏書閣踵而成之芬芳孟母鄰洙曰潘安仁閒居賦此里仁以為美孟母所以三徙義方兼有訓洙曰左傳愛子教之以義方詞翰兩如神蘇曰王獻之詞語秀麗筆畫雄徑兩如神江左為獨步委曲承顔體騫飛報主身可憐忠與孝雙美畫麒麟洙曰麒麟閣名也上畫忠臣像江陵望幸洙曰望車駕臨幸也時大駕在蜀廣德元年作補注鶴曰江陵以上元元年九月建都故詩云雄都元壯麗王內翰云望車駕臨幸時大駕在蜀然明皇幸蜀在至德元載是時未以江陵為都當時代宗幸陜時此詩合是廣德元年是年代宗幸陜以衛伯玉有幹略乃拜江陵尹荆南節度等使意是時代宗有意幸江陵故有此作梁權道編在大厯三年殊無義無乃循舊次耳故此詩與前篇俱不應編在大厯三年詩內雄都元壯麗洙曰漢髙紀上見宫室壯麗怒蕭何曰非壯麗不足重威望幸歘威神洙曰魯靈光殿賦景福兮帝室之威神甘泉賦配帝宫之懸圃兮象泰一之威神趙曰顔延年車駕幸京口云望幸傾五州也歘許勿反注云有所吹起也地利西通蜀天文北照秦定功曰謂長安在荆渚之北風煙含越烏洙曰謝元暉詩風煙有鳥路江漢恨無梁古詩越鳥巢南枝舟楫控吳人未枉周王駕洙曰顔延年車駕幸亰口詩虞風載帝狩夏諺頌王游春方動宸駕望幸傾五州又周御窮轍迹夏載厯山川周王駕謂穆王滿終期漢武巡洙曰漢武行幸雍幸汾陰滎陽還至洛陽瞻望河洛巡狩豫州甲兵分聖㫖蘇曰羊祜得聖㫖耒分甲兵西北防秋居守付宗臣洙曰蕭何傳漢之宗臣左傳君行則居守蘇曰趙勝大事付宗臣議論補注鶴曰宗臣指郭子儀按史雍王適為關內兵馬元帥郭子儀副之復京師以子儀為京留守早發雲臺仗恩波起涸鱗洙曰哀江南賦由有雲臺之仗涸鱗見餘波期救涸注江邊星月二首大厯三年作補注鶴曰詩云江月辭風纜江星别露船當是大厯三年秋江陵舟中作驟雨清秋夜金波耿玉繩洙曰謝元暉詩清河晨耿耿寒渚夜蒼蒼金波麗鳷鵲玉繩低建章趙曰金波言月玉繩言星天河元自白江浦向來澄映物連珠斷洙曰史五星如連珠緣空一鏡升洙曰古詩破鏡飛上天餘光憶更漏况乃露華凝洙曰謝莊詩露華識猿音江月辭風纜江星别霧船雞鳴還曙色鷺浴自晴川歷歷竟誰種洙曰謝惠連詩亭亭映江月古詩天上何所有歷歷種白榆悠悠何處圓洙曰沈休文詠月清光信悠悠謝希質月賦升清質之悠悠降澄暉之藹藹客愁殊未巳他夕始相鮮舟月對驛近寺大厯三年作補注鶴曰題云舟月又詩云月朗自明船朱樓白水邊當是大厯三年舟中作更深不假燭月朗自明船金剎青楓外洙曰西京雜記以黃金為剎朱樓白水邊趙曰馮衍顯志賦伏朱樓而四望城烏啼眇眇洙曰左傳叔向曰城上有烏齊師其遁補注希曰江陵府松滋縣有白水鎮古樂府有烏夜啼漢文紀以眇眇之身師古曰眇眇猶言細末也野鷺宿娟娟蘇曰張充月賦照娟娟之沙鷺皓首江湖客鈎簾獨未眠舟中大厯三年作補注鶴曰詩云風餐江柳下雨卧驛樓邊即前篇所謂驛近寺之驛也當是大厯三年在江陵作風餐江柳下雨卧驛樓邊蘇曰阻風餐柳下值雨坐蓬窗句法絶妙不知誰詩也恨不見全篇與魯直讀至此遂記而疏之疑子美亦法此二句而作也其詩二句在晉文類中結纜排漁網連檣並米船洙曰檣船上帆竿今朝雲細薄昨夜月清圓飄泊南庭老祇應學水仙趙曰公自謂也遣悶大厯三年作補注鶴曰詩云地濶平沙岸舟虛小洞房當是大厯三年江陵作地濶平沙岸舟虛小洞房洙曰謝元暉洞房殊未曉使塵來驛道城日避烏檣洙曰一作烏槍趙曰泊船之處近城日為城所障不照及檣故曰避烏檣暑雨留蒸濕江風借夕凉蘇曰段瑄泛舟夜聞江風清冷瑄欣然曰馮夷借我一夕之凉行雲星隱見賢遍切叠浪月光芒螢鑒緣帷徹趙曰螢光可以照物故曰螢鑒蛛絲罥鬢長罥音畎泰伯曰罥鬢猶掠鬢也哀箏猶憑几憑皮孕切鳴笛竟霑裳倚著如秦贅之芮切洙曰賈誼傳秦人家富子壯則出分家貧子壯則出贅師古曰言其不出妻家亦猶人身之有贅一說贅質也家貧無有聘則以身為質也君平曰子美寓他鄉如贅壻然過逢類楚狂洙曰楚狂接輿氣衝看劍匣洙曰任彥升劍氣凌雲又張華見劍氣衝牛斗穎脫撫錐囊洙曰平原君傳曰夫賢士之處世也譬如錐之處囊中其末立見毛遂曰使遂早得處囊中乃脫穎而出非特末見而已妖孽關東臭兵戈隴右瘡蘇曰班仲升云隴右兵戈瘡痍未艾時清疑武略世亂局文場餘力浮于海洙曰語道不行乘桴浮于海端憂問彼蒼洙曰見賦端憂多暇注詩彼蒼者天百年從萬事故國耿難忘蘇曰辛受老年百事俱廢無心繫戀唯故國舊友耿耿難忘江陵節度陽城郡王新樓成王請嚴侍御判官賦七字句同作大厯三年作補注鶴曰公以大厯三年暮春至江陵而今詩云樓上炎天氷雪生當是其年夏作也史云伯玉大厯初丁母憂則是時未再朞也雖曰起復亦不當作樓命客賦詩當時士論醜之宜哉樓上炎天冰雪生髙飛燕雀賀新成洙曰淮南子大厦成而燕雀相賀碧窗宿霧濛濛濕朱栱浮雲細細輕修可曰晉羊球登西樓賦云畫棟浮細細之輕雲朱栱濕濛濛之飛雨王逸少見之擊節愛羡竟日杖鉞褰帷瞻具美洙曰見杖鉞築疆開意㫖注賈琮為冀州刺史舊典傳車駕驂垂赤帷裳迎於州界及琮之部升車言曰刺史當逺視廣聽糾察善惡何有反設垂帷裳以自掩塞乎乃命御者褰之百城聞風自然悚震投壺散秩有餘清洙曰祭遵投壺雅歌自公多暇延參佐江漢風流萬古情洙曰庾亮鎮武昌佐吏乘月登樓不覺亮至將避之亮曰少住吾於此興不淺陶侃曰亮非獨風流兼有為政之術又作此奉衛王補注鶴曰詩云三伏炎蒸定有無則是與前篇不相逺作西北樓成雄楚都遠開山嶽散江湖二儀清濁還髙下洙曰陽清為天陰濁為地三伏炎蒸定有無補注鶴曰王坦之傳二儀以至公立德列于清輕者上為天濁重者下為地又河圗括地象兩儀未分其氣混沌清濁既分伏者為天偃者為地漢郊祀志作伏祠孟康曰六月伏日也周時無至此乃有之師古曰伏者謂隂氣將起迫於殘陽而未得升故為藏伏因名伏日也立秋之後以金代火金畏於火故至庚日必伏庚金也推轂幾年唯鎮靜洙曰推吐回切馮唐傳推轂遣將趙曰推轂以言衛王奉命為將曳裾終日盛文儒洙曰鄒陽何王之門不可曵長裾乎白頭授簡焉能賦洙曰雪賦受簡於司馬大夫漢書登髙能賦可為大夫愧似相如為大夫舟出江陵南浦奉寄鄭少尹審大厯三年作補注鶴曰鳴螿隨泛梗别燕赴秋菰當是大厯三年秋作是時公移居公安公安在江陵之南故出南浦也時鄭審為江陵少尹更欲投何處飄然去此都洙曰賈誼何必懷此都形骸元土木洙曰嵇紹土木形骸龍章鳯姿舟楫復江湖社稷纒妖氣洙曰左太冲姦回贔兵纒紫微干戈送老儒百年同棄物萬國盡窮途洙曰見今日暮途窮注雨洗平沙淨天銜濶岸紆鳴螿隨泛梗趙曰螿音將蟬也螿得梗而託之故隨泛梗而鳴蘇曰蟬屬郭林宗如寒螿隨泛梗固亦難安補注希曰爾雅釋蜆云蜆一名寒蜩又名寒螿似蟬而小青赤色者也别燕起秋菰洙曰宋玉燕翩翩其辭歸蘇曰李充云别燕背人去雙起秋蒲菰趙曰菰雕胡也棲託難髙卧洙曰孔明髙卧南陽趙曰言其方有棲託難於髙枕以自安也飢寒迫向隅洙曰前漢刑法志滿堂飲酒一夫向隅而泣寂寥相喣沫洙曰莊子與其相喣以濕相濡以沫孰若相忘於江湖浩蕩報恩珠洙曰漢武帝昆明之池去魚後銜明珠報之又隨侯見傷蛇以藥封之蛇銜明珠溟漲鯨波動洙曰謝靈運溟漲無端倪衡陽雁影徂洙曰蜀都賦云候雁銜蘆木落南翔冰泮北徂又應德璉將就衡陽棲南征問懸榻洙曰陳蕃為樂安太守郡人周璆字而不名特為置一榻去則懸之東逝想乘桴洙曰語乘桴浮于海濫竊商歌聽洙曰北山移文竊吹草堂濫巾北嶽七啓云此寧子商歌之狀時憂卞泣誅洙曰楚人卞和以玉璞三獻不遇楚王遂再刖其足經過憶鄭驛洙曰鄭莊置驛斟酌旅情孤江南逢李龜年大厯三年作補注鶴曰梁權道編在大厯三年作荆南詩內按公以是年正月出峽暮春至江陵今詩云落花時節又逢君正其時也岐王宅裏尋常見崔九堂前幾度聞洙曰公自注云即殿中監崔滌中書令湜之弟補注鶴曰按舊史岐王睿宗子始名隆範後避𤣥宗諱去二名曰範與薛王誅太平公主並封滿五千戶開元十四年薨贈太子諡惠文王好學工書無貴賤為盡禮接待讓皇帝贈云申岐王居安興坊天寶三載以惠宣太子男略陽公珍為嗣岐王公當開元十四年雖巳十五嵗有登門之理然是時未有梨園弟子當是指嗣岐王而云則公見李龜年必在天寶十載已後正是江南好風景落花時節又逢君洙曰明皇雜録云天寶中上命宫中女子數百人為梨園弟子皆居宜春北院上素曉音律時有馬仙期李龜年賀懷智皆洞知律度安祿山自范陽入覲亦獻白玉簫管數百事皆陳於梨園自是音響殆不類人間有龜年特承顧遇於東都大起第宅僣侈之制逾於公侯流廢江南每遇良辰勝景常為人歌數闋座上聞之莫不掩泣罷酒官亭夕坐戲簡顔十少府大厯三年作補注鶴曰詩云南國調寒杵西江浸日車又題云官亭夕坐及簡顔十少府顔公安慰也當是大厯三年公安作公嘗賦醉歌行有神仙中人不易得顔氏之子才孤標正其人也官亭當在公安南國調寒杵趙曰庾信夜聽搗衣詩調聲不用吟西江浸日車趙曰淮南子日乘車駕以六龍羲和為馭客愁連蟋蟀洙曰詩蟋蟀在堂亭古帶蒹葭洙曰詩蒹葭蒼蒼不返青絲鞚趙曰鞚馬勒也青絲為之虛燒夜燭花老翁須地主細細酌流霞修可曰抱朴子載項曼卿言到天上仙人以流霞杯飲之秋日荆南述懷三十韻大厯三年作補注鶴曰此詩當是大厯三年秋未移公安前作昔承推奬分愧匪挺生材遲暮宫臣忝洙曰陸機詩矯迹厠宫臣艱危袞職陪洙曰詩袞職有闕趙曰公自言當肅宗時拜拾遺掌供奉諫諍揚鑣隨日馭鄭曰鑣悲驕切馬銜也折檻出雲臺洙曰朱雲折檻顯宗畫二十八將於雲臺見致君丹檻折罪戾寬猶活干戈塞未開趙曰上欲誅甫賴張鎬救之而免言一出之後干戈日相尋也星霜𤣥鳥變洙曰古詩玉衡指孟冬衆星何歷歷白露霑野草時節忽復易秋蟬鳴樹間𤣥鳥逝安適趙曰𤣥鳥燕也星霜之中見𤣥鳥變則不一其年矣補注希曰詩天命𤣥鳥毛氏曰𤣥鳥鳦也孔氏曰釋鳥云燕燕鳦也色𤣥故又名𤣥鳥月令仲春𤣥鳥至身世白駒催洙曰莊子知北遊人生天地之間若白駒之過郤忽然而巳釋文白駒或云日也郤本作隙張良願棄人間事學道輕舉吕后强食之曰人生如白駒之過隙何自苦如此伏枕因超忽扁舟任往來九鑽巴噀火三蟄楚祠雷洙曰語鑽燧改火後漢欒巴噀酒救蜀火謂之巴噀火則欒巴所噀之火以形容其在成都及東川及夔州凡在蜀地者九遇清明鮑曰山谷簡王觀復曰子美入蜀下峽年月詩中可見其曰九鑽巴噀火三蟄楚祠雷則往來兩川九年在䕫州三年可知矣趙曰公以八月在夔在江陵是為雷之三蟄矣雷以三月而奮而以八月而蟄也謂之楚祠雷則楚人所祠之雷蓋楚人好祠祭也補注希曰公以乾元二年冬入蜀大厯三年下峽恰是九春其中在䕫三年故曰三蟄楚祠雷楚祠謂楚襄王所遊之地寰宇記謂䕫有古楚宫也趙謂楚人所祠之雷則非止謂在䕫見三冬蓋永泰元年秋至雲安而大厯三年春下峽所以為三冬望帝傳應實洙曰見杜䳌詩注昭王問不回洙曰僖四年傳齊侯遂伐楚楚子使與師言曰君處北海寡人處南海唯是風馬牛不相及不虞君之涉吾地也何故管仲對曰爾貢苞茅不入王祭不供無以縮酒寡人是徴昭王南征而不復寡人是問對曰貢之不入寡君之罪也敢不共給昭王之不復君其問諸水濵蛟螭深作橫戶孟切豺虎亂雄猜趙曰此兩句託興時有跋扈之强臣賊盜之巨猾故也素業行已矣浮名安在哉蘇曰李膺前輩浮名安在爭如一樽醇醪斷送嵗月何苦區區計較名利耶琴烏曲怨憤庭鶴舞摧頽洙曰琴烏曲烏夜啼也吳人舞白鶴於市秋水漫湘竹洙曰湘妃揮淚濺竹竹皆斑隂風過嶺梅洙曰大庾嶺多梅人號梅嶺苦搖求食尾洙曰司馬子長報任少卿書曰猛虎在深山百獸震恐及在檻穽之中搖尾而求食積威約之漸也常曝報恩腮洙曰見浩蕩報恩珠注三秦記江海集龍門魚登者化龍不登者㸃額曝腮結舌防讒柄探腸有禍胎洙曰前漢博士結舌而不談枚乘傳禍生有胎蒼茫步兵哭洙曰阮籍為步兵哭途窮展轉仲宣哀趙曰仲宣王粲也以避難流離作士哀詩飢藉家家米鄭曰籍秦昔切愁徴處處杯休為貧士嘆任受衆人咍得喪初難識榮枯劃易該差池分組冕合沓起蒿萊不必伊周地皆登一作知屈宋才洙曰伊尹周公屈原宋玉漢庭和異域洙曰前漢胸奴傳和親之論發於劉敬是時天下初定遭平城之難故從其言約結和親賂遺單于冀以求安邊境逮至孝文與通關市妻以漢女增厚其賂嵗以千金而胸奴數背約束屢被其害晉史坼中台洙曰晉中台坼而張華誅霸業尋常體宗臣忌諱災羣公紛戮力聖慮窅徘徊鄭曰窅伊鳥切深目也數見銘鍾鼎洙曰季武子作林鍾之銘銘魯公衛孔悝鼎銘真宜法斗魁洙曰隋志北斗一至四為魁五至七為杓願聞鋒鏑鑄洙曰賈誼過秦論秦收天下之兵聚之咸陽銷鋒鏑鑄以為金人十二以弱天下之兵莫使棟梁摧洙曰衛玠卒謝琨哭之曰梁棟折不覺哀趙曰晉陸玩拜司空謂賔客曰以我為三公是天下無人矣索酒著柱間祝曰當今乏才以爾為柱石之臣莫傾人梁棟磐石圭多剪洙曰漢封子弟磐石之宗成王封康叔剪桐葉為圭凶門轂少推洙曰馮唐傳曰臣聞上古王者遣將也跪而推轂修可曰唐李衛公對唐太宗曰古者命將受鉞鑿凶門而出垂旒資穆穆洙曰詩天子穆穆祝網但恢恢洙曰成湯祝網老子天網恢恢赤雀翻然至黃龍不假媒洙曰春秋孔魚圗曰鳥化為書孔子奉以告天赤雀集書上化為黃玉後漢黃龍見于譙趙曰此言祥瑞也遁甲曰赤雀不見則國無賢注赤雀主銜書陽精曰孫應圗曰黃龍者四龍之長也王者不漉池而漁則應和氣而遊于池沼賢非夢傅野洙曰髙宗夢得說于傅巖之野隱類鑿顔壞洙曰揚雄傳或鑿壞以遁莊子魯君聞顔闔賢欲以為相使者往聘因鑿後垣而亡壞壁也自古江湖客冥心若死灰趙曰莊子心可使若死灰師曰唐六典注云補闕拾遺武后垂拱中置子美肅宗時為左拾遺故云陪衮職琴録曰琴曲有烏夜啼吳兢古樂府解題云烏夜啼宋臨川王義慶造也鋒鏑鑄棟梁摧並見前注史記成王與叔虞戲削桐葉為圭曰以此封若史佚曰天子無戲言言則史書之禮成之樂歌之於是遂封叔虞于唐李衛公對唐太宗曰古者出師命將齊三日授之以銊推其轂曰進退惟時軍中但聞將軍之令不聞君命揚鑣隨日馭謂侍肅宗於靈武也折檻出雲臺謂諫房琯事見逐華州司功也火九鑽雷三蟄則知子美之客䕫巴凡九年矣望帝乃蜀帝其魂化為杜䳌父老相傳其言不虛子美居楚地託言昭王不回之事蛟螭豺虎以喻荆楚盜賊之多自亂離以來元勳舊德皆擯弃不用而武夫年少多驟遷故子美有得喪難識榮枯易該之語而下文又言差池分組冕合沓起蒿萊又云賢非夢傅野皆託諷濫進者多也漢庭和異域言回紇送兵來助唐求尚主也晉史拆中台言房琯得罪也霸易尋常體言雜用霸道也宗臣忌諱災言宗臣不敢直言也磐石圭多剪言廣封同姓也凶門轂少推言命將多非其人也子美意欲朝廷禮敬大臣寬大憲網自然朱鳯來黃龍至無使賢人隱遁則天下不約而自平也隱類鑿顔壞公自喻秋日荆南送石首薛明府辭滿告别奉薛尚書頌德叙懷斐然之作三十韻大厯三年作補注鶴曰按新唐書吐蕃傳永泰大厯間再遣使者來聘於是戶部尚書薛景仙往報此詩云聞道和親入又云跋涉體何如則薛尚書乃景仙也石首乃江陵屬邑公以大厯三年至荆南當是其年秋作南征為客久西候别君初趙曰上句言在江陵也梁張纘南征賦西候屬西之時候乃秋日也嵗滿歸鳬舄趙曰鳬舄以薛明府之為縣令即王喬之乘鳬秋來把雁書趙曰得尚書兄之書也雁書使蘇武事荆門留美化洙曰唐蕭銑屯軍荆門號荆門軍在夷陵鄭曰荆門山名十道志荆州江陵縣郢城縣東南岸有荆門山姜被就離居洙曰續漢書姜肱兄弟三人皆以孝行著名肱年長與二弟共被卧親友如此聞道和親入洙曰見肯慮白登圍注垂名報國餘連枝不日並八座幾時除洙曰見起居八座太夫人注景帝紀注凡言除者除故官就新官趙曰言尚書與薛石首不日相並如木之連理枝往者胡星孛洙曰胡星旄頭也孛星光芒短其光四出孛孛然趙曰指言祿山也恭惟漢網疏洙曰漢刑法志禁網疏濶風塵相澒洞澒胡孔切洙曰洞簫賦風澒洞而不絶趙曰凡兵之地謂之風塵淮南子曰未有天地之時鴻濛澒洞莫知其門天地一丘墟洙曰王粲詩崤函復丘墟趙曰言人民寡城郭荒也殿瓦鴛鴦坼洙曰鄴都銅雀臺皆鴛鴦瓦庾信賦昔為一雙瓦飛入魏王宫趙曰魏文帝問晉宣王曰吾夢殿屋兩瓦墜地化為鴛鴦何也宣對曰後宫當有暴死者帝曰吾詐卿耳宣曰夫夢者意耳茍以誠言便占吉凶言未卒黃門令奏宫人相殺宫簾翡翠虛洙曰西京雜記有翡翠簾鉤陳摧徼道洙曰西都賦周以鉤陳之位衛以嚴更之署又周廬千列徼道綺錯槍櫐失儲胥洙曰長楊賦木擁槍櫐以為儲胥注槍櫐作木槍相櫐為栅也儲胥館名櫐力軌切趙曰上四句以言京師之陷而宫殿之毁也文物陪巡狩趙曰指言肅宗幸鳯翔文物陪則衣冠集於此親賢病拮据趙曰詩豫手拮据注云拮据撠挶也公時呵猰㺄洙曰猰㺄摩牙而食人定功曰爾雅猰㺄類貙虎牙食人首唱却鯨魚趙曰鯨魚大魚左傳曰取其鯨鯢以為京觀呵猰㺄却鯨魚以譬却退巨賊之義勢愜宗蕭相洙曰蕭相謂蕭何也國之宗臣材非一范睢趙曰公自注蓋秦拜范睢為客卿卒聽其謀使五大夫綰伐魏拔懷其相秦也東伐韓少曲髙平拔之又以其謀縱反間于趙趙以馬服子代亷頗大破趙于長平皆范睢之謀故以比諸將尸填太行道行胡剛切血走浚儀渠洙曰大行山在河北浚儀渠汴河也滏口師仍㑹滏万矩切水名函關憤巳攄紫微臨大角洙曰隋天文志紫微大帝之座也又大角一星在攝提天王座也又名天棟趙曰言肅宗還長安也皇極洙曰皇極乘輿輿子輦屬正乘輿趙曰洪範曰建用皇極史曰乘輿反正皇極賞從頻峨冕從才用切洙曰僖二十四年傳晉侯賞從亡者殊恩再直廬洙曰公自注公舊執金吾新受羽林前後二將軍趙曰直廬則直宿殿廬也豈惟髙衛霍曾是接應徐洙曰衛青霍去病應德璉徐公幹降集翻翔鳯洙曰賈誼賦鳯凰翔于千仞兮覽德輝而下之趙曰言兄弟如鳯之翺翔也追攀絶衆狙洙曰莊子朝三暮四衆狙皆怒侍臣雙宋玉洙曰宋玉楚大夫戰䇿兩穰苴洙曰穰苴有司馬兵法趙曰以文章言之則文章如宋玉以戰䇿言之則武略如穰苴乃所以美薛之兄弟也鑒徹勞懸鏡趙曰公言蒙尚書之鑒照澄徹如鏡之懸也荒蕪巳荷鋤洙曰見眷言終荷鋤注嚮來披述作洙曰石首處見公新文一卷重此憶吹噓洙曰見只待吹噓送上天注白髮甘凋喪青雲亦卷舒經綸功不朽趙曰又言薛尚書也跋涉體何如洙曰公自注公須奉使和吐蕃見上應訝耽湖橘洙曰潭洲有橘洲常餐占野蔬十年嬰藥餌洙曰見藥餌扶吾隨所之注萬里狎樵漁揚子淹投閣洙曰見子雲識字終投閣注鄒生惜曳裾洙曰鄒陽書何王之門不可曳長裾趙曰公自况也但驚飛熠耀洙曰詩熠耀宵行不記改蟾蜍洙曰張景陽下車如昨日蟾蜍四五圎煙雨封巫峽江淮略孟諸洙曰孟諸九澤名云補注希曰禹貢孟諸在豫州之境注云張魚反又音諸左傳爾雅皆作孟諸宋藪澤也漢書八藪為囿師古曰謂宋有孟諸云云湯池雖險固洙曰金城湯池蘇曰侯本論曰金城湯池雖然險固亦不可恃遼海尚闐淤努力輸肝膽休煩獨起豫洙曰語起豫者商也趙曰時幽燕猶有不順命者前漢溝洫志填淤反壤之害師古曰填淤謂壅泥也末句所以激之師曰師古曰以木𣙜槍及櫐繩連結以為儲胥有儲蓄以待所須也薛尚書嘗奉使回紇乞兵以助討故云聞道和親入垂名報國餘文物陪巡狩言尚書昔隨𤣥宗幸蜀親賢病拮据言皇子皆流離辛苦也猰㺄喻盜賊公時唱大義以討賊豈特一范睢相秦但復魏齊之讎乎滏口師仍㑹言公督諸節度兵㑹於滏口收復京師故曰函關憤巳攄皇極正乘輿言天子還京也豈惟髙衛霍曾是接應徐德璉公幹文士也天子中興非特賞功又禮文儒而公文倍宋玉武過穰苴侍帝廟堂子美但荷鋤躬耕而巳故曰荒蕪已荷鋤遼海尚填淤言祿山未平故子美末章勉薛尚書為國立功不獨為詩以起豫也哭李尚書之芳大厯三年作補注鶴曰按宗室世系表之芳乃蔣王惲之孫又舊史云安祿山奏為范陽司馬祿山反自拔歸京師廣德二年兼御史大夫使吐蕃被留二嵗乃得歸拜禮部尚書改太子賔客於後篇云還瞻魏太子賔客减應劉舊史云廣德二年使吐蕃而通鑑云廣德元年四月遣兼御史大夫李之芳等使于吐蕃為虜所留二年乃得歸此詩云江湖涕泫然後篇云江雨濕銘旌則李之旅櫬不曾歸長安但客葬於荆州故詩又云復土昭丘逺詩作于大厯三年江陵府所以復有湖風井徑秋之句漳濵與蒿里逝水竟同年洙曰李延年分送喪歌為二等薤露送王公大人蒿里送士大夫庶人使挽柩著歌之為挽歌補注希曰武五子傳蒿里召兮郭門閲師古曰蒿里死人里欲挂留徐劍洙曰見把劍見徐君注猶回憶戴船洙曰見應尋戴安道注相知成白首洙曰潘安仁投分寄石友白首同所歸此别閒黃泉洙曰左傳不及黃泉風雨嗟何及江湖涕泫然泫胡畎切洙曰詩嗟何及矣文中子泫然流涕修文將管輅洙曰見修文地下郎注趙曰言李尚書竒才如魏之管輅奉使失張騫洙曰見查上覔張騫注史閣行人在洙曰周禮大行人小行人趙曰史閣言書名于史冊也詩家秀句傳蘇曰陸士龍題詩對南山日晚得佳句客亭鞍馬絶彭曰此言子美為客停留于此李公無復鞍馬來相尋矣旅櫬網蟲懸洙曰沈休文詩網蟲垂戶織夕鳥傍簷飛復魄昭丘逺洙曰登樓賦西接昭丘楚昭王墓歸魂素滻偏洙曰宋玉魂兮歸來鄭曰滻所簡切趙曰素滻長安之水也言李尚書乃長安人也潘安仁西征賦地有𤣥灞素滻大臨曰此二句言李葬于此樵蘇封葬地喉舌罷朝天洙曰李固云陛下之有尚書猶天之有北斗斗為天之喉舌尚書亦猶陛下之喉舌秋色凋春草王孫若箇邊洙曰招隱芳草兮萋萋王孫兮不歸大臨曰此言李即與春草為鄰矣重題補注鶴曰謂之重題又詩云湖風井徑秋與前篇秋色凋春草叶當是同時作涕灑不能收哭君餘白頭兒童相顧盡洙曰言少時相顧今盡於此矣宇宙此生浮江雨銘旌濕洙曰記曰銘明旌湖風井徑秋洙曰蕪城賦歌曰邊風急兮城上寒井徑滅兮丘隴殘還瞻魏太子賔客减應劉洙曰曹丕書曰應徐陳劉一時俱逝矣趙曰公自注云公厯禮部尚書薨于太子賔客應則應瑒劉則劉楨獨坐大厯三年作補注鶴曰詩云江斂洲渚出天虛風物清當是江陵作梁權道亦編在大厯三年荆南詩內悲秋回白首倚杖背孤城江斂洲渚出洙曰謝惠連詩蕭條洲渚祭天虛風物清滄溟服洙曰一作恨衰謝朱紱洙曰易曰朱紱方來負平生趙曰公賜緋矣負平生言無所用於時也仰羡黃昏鳥投林羽翮輕師曰黃昏鳥猶得所歸子美以久客他鄉曾歸鳥之不如乎暮歸大厯二年作補注鶴曰詩云南度桂水闕舟楫北歸秦川多鼓鞞當是大厯二年夔州作而梁權道編在三年荆南詩內按公三年正月出峽舟達江陵秋移公安有舟中出南浦詩非無舟楫又詩云霜黃碧梧白鶴棲城上擊柝復烏啼則詩乃秋末作若在大厯三年作則其年秋在公安冬移嶽陽有舟雪灑寒燈之句與闕舟楫愈不叶趙注云城上擊柝為白帝城為是是年吐蕃寇靈州邠州京師戒嚴故曰北歸多鼓鞞三年雖吐蕃亦寇邠靈州京師亦戒嚴然若作江陵作則北歸長安不由秦川霜黃碧梧白鶴棲城上擊柝復烏啼趙曰白帝城也易重門擊柝修可曰琴曲有烏夜啼宋臨川王義慶造也客子入門月皎皎洙曰詩月出皎兮誰家搗練風凄凄洙曰詩風雨凄凄南渡桂水闕舟楫師曰恨無濟川之才北歸秦洙一作洛川多鼓鞞趙曰時吐蕃之兵未息也師曰言京師尚屯兵以防守也年過半百不稱意明日看雲還杖藜移居公安敬贈衛大郎鈞大厯三年作補注鶴曰公以大厯三年秋移居公安此詩云水煙通徑草秋露接園葵乃是時作衛侯不易得余病汝知之雅量涵髙逺清襟照等夷尹曰袁粲答王儉詩老夫亦何寄之子照清襟清氣溢素襟彥輔曰夷平也謂平交也平生感意氣趙曰言意氣之感也少小愛文辭蘇曰羊欣少小愛筆研文辭名公多竒之河海由來合風雲若有期洙曰河出崑崙千里一曲九曲入海古詩風雲若遇㑹形容勞宇宙洙曰陶潛寓形宇宙復幾時趙曰言憔悴垂老于世質朴謝軒墀趙曰言無復仕於朝廷自古幽人泣洙曰易幽人貞吉流年壯士悲蘇曰文選流年苒苒壯士悲感水煙通徑草秋露接園葵洙曰陸士衡園葵詩種葵北園中零露垂鮮澤趙曰述其移居於公安之地也入邑豺狼鬬趙曰以比盜賊也傷弓鳥雀饑趙曰以比窮困之民也白頭供宴語趙曰公自謂也烏几伴棲遲趙曰烏皮几也言遷於公安唯有此物補注希曰夏侯若東方朔畫像贊棲遲下位交態遭輕薄洙曰古詩五陵輕薄貌今朝豁所思公安送韋二少府匡贊大厯三年作補注鶴曰詩云時危兵甲黃塵裏日短江湖白髮前是大厯三年秋晚作是年吐蕃入寇京師戒嚴逍遙公後世多賢洙曰韋嗣立封逍遙公所隱谷曰逍遙谷田曰北史韋敻字敬逺孝寬之兄志尚夷簡淡於榮利號曰逍遙公故世系表謂韋氏九房以敻之後為逍遙公房嗣立之後為小逍遙公師曰子美稱逍遙公乃敻非嗣立送爾維舟惜此筵念我能書洙曰一作常能數字至將詩不必萬人傳時危兵甲黃塵裏日短江湖白髮前古往今來皆涕淚斷腸分手各風煙洙曰别賦造分手而銜涕又分手易前期贈虞十五司馬上元寶應間作補注鶴曰梁權道編在大厯三年公安詩內今考詩云百年嗟已半若在是年作則公巳五十七嵗當如暮歸詩云年過半百不稱意於此云百年虛過半今不云過而云巳意是上元寶應間在浣花作故云沙岸風吹葉雲江月上軒若在公安則未嘗舍舟所謂維舟倚前浦是也遠師虞祕監世南今喜識𤣥孫形象丹青逼家聲器宇存洙曰見烜赫舊家聲注蘇曰龎統要識家聲先著器宇寬卑凄凉憐筆勢浩蕩問辭源蘇曰江總詞源浩蕩學海淵深爽氣金天豁洙曰王子猷西山朝來致有爽氣清談玉露繁洙曰董仲舒有玉杯繁露佇鳴南嶽鳯洙曰劉公幹鳯凰集南嶽徘徊孤竹根師曰衡山南嶽也欲化北溟鯤洙曰莊子北冥有魚其名為鯤化而為鳥其名為鵬交態知浮俗趙曰鄭莊傳翟公題門曰一貧一富乃知交態儒流不異門洙曰儒門流同門異戶過逢連客位洙曰沈休文詩客位紫苔生日夜倒芳樽沙岸風吹葉雲江月上軒洙曰别賦月上軒而飛光百年嗟巳半四座敢辭喧書籍終相與青山隔故園蘇曰南史王筠沈約見筠文咨嗟而嘆曰昔蔡伯喈見王仲宣稱曰王公之孫吾家書籍悉當相與僕雖不敏請附斯言師曰子美欲悉以書籍與虞庶幾傳子美之業也公安縣懷古大厯三年作魯曰吳大帝推蜀先主為左將軍荆州牧鎮油口即居此城時人號備為左公故名其城曰公安補注鶴曰詩云寒天催日短風浪與雲平當是大厯三年秋晚作野曠吕蒙營洙曰吳將吕蒙營於公安鄭曰十三州志吳大帝封吕蒙為孱陵侯居此地故曰營江深劉備城洙曰劉備初為荆州牧寒天催日短蘇曰郡平客居多事值寒天鐘鼓催簷外日短風浪與雲平灑落君臣契趙曰先主與諸葛也飛騰戰伐名維舟倚前浦長嘯一含情洙曰阮籍見孫登長嘯而返公安送李二十九弟晉肅入蜀余下沔卾補注鶴曰公以大厯三年冬發公安往嶽陽今詩云檣烏相背發蓋其時故題云余下沔卾後不果至武昌正解柴桑纜洙曰謝詩解纜候前侣柴桑屬潯陽郡鄭曰柴桑地名在江州仍看蜀道行趙曰送晉肅入蜀也檣烏相背發趙曰檣上刻為烏形塞雁一行鳴南紀連銅柱洙曰見南紀標銅柱注西江接錦城洙曰世說成都城皆種芙蓉至秋開望之若城故號錦城憑將百錢卜飄泊問君平趙曰嚴君平賣卜于成都日閲數人得百錢乃止宴王使君宅題二首大厯三年作補注鶴曰詩云江湖墮清月當是在荆南作梁權道編在公安詩內然均不出大厯三年秋王使君當是間居邑中故云漢主追韓信蒼生起謝安漢主追韓信蒼生起謝安洙曰漢王入關諸將多逃蕭何獨追韓信晉謝安髙卧東山為蒼生而起吾徒自飄泊世事各艱難逆旅招邀近他鄉意緒寬補注希曰意一本作思不才甘朽質洙曰楊惲書材行朽穢文質無所底髙卧豈泥蟠洙曰揚子龍蟠于泥趙曰所以自謙也泛愛容霜鬢留歡卜夜關洙曰一作夜闌子美父諱間諸家本辨兩處非間字此亦可知其誤補注希曰鬢一本作髮關一本作間不唯無義又是公父諱王內翰云辨兩處非間字此可知其誤又一本作夜闌為是自吟詩送老相勸酒開顔戎馬今何地洙曰古詩戎馬遍九州鄉園獨在山補注希曰在一本作舊江湖墮清月趙曰李白詩更看江月墮清波酩酊任扶還蘇曰嵇康常醉人扶還家古詩但教長酩酊任自别人扶留别公安太易沙門大厯三年作補注鶴曰沙門乃僧之通稱梁㑹稽沙門惠皎作髙僧傳云漢始有沙門唐元奘稱沙門是也詩云沙村白雪猶含凍江縣紅梅已放春當是大厯二年冬起嶽陽時作隱居欲就廬山逺麗藻初逢休上人洙曰湯休上人也數問舟航留製作長開篋笥擬心神沙村白雪仍含凍師曰相如上林賦其北則含凍裂地涉氷揭河江縣紅梅已放春先踏爐峯置蘭若徐飛錫杖出風塵洙曰爐峯香爐峯也在潯陽廬山有東西二村寺補注杜詩卷三十四
