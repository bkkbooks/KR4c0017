body:
  text: 補注杜詩巻十四宋黄希原本黄鶴補注八哀詩并序寳應廣徳至大厯初所作補注鶴曰八詩非一時所作如李光弼詩云洒涙巴東峽嚴武詩云悵望龍驤塋武以永泰元年夏薨而旐出江漢舟轉荆衡巳是數月今復葬罷而悵望其塋則二詩在䕫州作無疑如李雝詩云君臣尚論兵將帥接燕薊朗誦六公篇憂來豁䝉蔽則是史朝義未死之前正經營河北之日當在廣徳元年之前揔序云傷時盗賊未息盖自寳應廣徳至大歴初有此作故云前後存沒遂不詮次梁懐道編在大歴二年特自其成而云耳傷時盗賊未息興起王公李公歎舊懐賢終于張相國八公前後存沒遂不詮次焉洙曰王仲宣張景陽皆作七哀詩黄鳥哀三良亦其義也贈司空王公思禮彦輔曰按思禮傳加守司空上元二年以疾薨贈太尉謚曰武烈司空出東夷童稚刷勁翮端本曰謂修整其儀矩追隨燕薊兒頴鋭洙曰一作脱物不隔洙曰王思禮營州城傍髙麗人也少習戎旅隨節度使王忠嗣至河西與哥舒翰對為押衙髙麗東夷也服事哥舒翰意無流沙磧洙曰及翰為隴右節度使思禮為翰押衙無流沙磧言其輕視夷狄不以為意也補注鶴曰流沙磧自是兩地名禹貢弱水餘波入于流沙楚辭招魂西方之害流沙千里注沙流而行言西方之地厥土不毛流沙滑滑晝夜流行縱横千里西州有礌石磧北庭都䕶府有小磧開元二十八年八月乙亥磧西節度使盖嘉運敗突騎施于賀邏餘見送逺詩注未甚㧞行間犬戎大充斥敏功曰充斥言盛大也短小精悍姿屹然强㓂敵定功曰前漢嚴延年為人短小精悍敏㨗於事雖子貢冉有通於政事不能絶也趙曰按史加思禮金城太守安禄山反翰為元帥奏思禮赴軍𤣥宗曰吐蕃有釁唯倚思禮且觀𤣥宗之言則思禮在金城時能敵吐蕃可知矣補注希曰史記郭解為人短小精悍貫穿百萬衆出入由咫尺馬鞍懸將首蘇曰辛倚破匈奴常懸蕃將首於鞍前齊太祖見而賞愛倚能騎射尤妙文墨甲外控鳴鏑夣符曰右按前漢書冐頓作鳴鏑習勒其騎射應劭曰髐箭也洗劔青海水孫曰青海在山東刻銘天山石洙曰思禮以㧞石堡城功在行間除右金吾衛將軍充闗西兵馬使趙曰皆戰勝而深入也班固為寳憲刻銘燕然山敏功曰唐薛仁貴傳將軍三箭定天山補注希曰哥舒翰築神威軍於青海上吐蕃至擊破之又築城於青海中龍駒島吐蕃屏迹不敢近青海事見通鑑又唐志伊州伊吾縣有析羅漫山亦名天山又西州有天山軍自州西南有南屏安昌兩城百二十里至天山又有天山縣九曲非外蕃其王轉深壁夣符曰右按唐㑹要景龍四年賛普請昏以左衞大將軍楊矩為送金城公主使吐蕃因請河西九曲之地以為公主湯沐之邑矩遂奏與之吐蕃既得九曲其地肥良尤與唐地接近自是復叛思禮事哥舒翰以功授右衞將軍闗西兵馬使從其討九曲也飛兔不近駕晁曰馬名飛兎善走躍復能飛其駿快可知矣鷙鳥資逺擊趙曰飛兎古之神馬山海經曰鷙鳥之擊曉達兵家流飽聞春秋癖修可曰漢藝文志云兵家者流凡百八十二家也晉杜預雖為將軍而有左傳癖胷襟日沉靜肅肅自有適洙曰裴楷目夏侯𤣥云肅肅如入宗廟中俱見禮樂器師曰自短小精悍姿至此句皆美思禮之辭潼闗初潰散萬乗猶辟易饒曰辟易退却奔走之貌偏裨無所施元帥見手格洙曰禄山之反也思禮從翰守潼闗宻語翰誅國忠又欲以三千騎刼之翰不從遂至於敗思禮為偏裨而謀不見從翰遂被禽元帥翰也萬乘天子也辟易播遷也太子入朔方至尊狩梁益胡馬纒伊落中原氣甚逆蘇曰䝉將軍一日謂扶蘇曰今天色黯淡囘視中原其氣甚逆吾慮者恐不測之祸在其中後果如其言肅宗登寳位塞望勢敦廹洙曰翰既敗潼闗不守𤣥宗幸蜀太子從百姓之請遂入靈武圖興復乃即位以從人望思禮奔行在公時徒歩至請罪將厚責際㑹清河公間道傳玉册天子拜跪畢讜議果氷釋洙曰思禮至行在上責其不堅守坐纛下將斬之㑹房琯在蜀奉太上皇册命至諫上以為可収後效遂釋之蘇曰徐倜數上書明劉向事讜議諛論即日水釋翠華巻飛雪熊虎亘阡陌趙曰翠華天子之旗上林賦建翠華之萎莛巻飛雪言其時在冬周禮曰熊虎為旗所謂亘阡陌言兵旗之多也舊注引如虎如貔却是言兵旅非是屯兵鳯凰山帳殿涇渭闢洙曰天子所在以帳為殿象宫闕臺殿也趙曰庾肩吾詩囘川入帳殿鳯凰山鳯翔山名涇渭則在平凉乃渭州金城賊咽喉詔鎮雄所搤洙曰思禮既釋尋副房琯戰便橋不利更為闗内行營節度河西龍右伊西行營兵馬使守武功以控賊及廣平王収復思禮入清宫補注鶴曰𤣥宗出奔夜將半至金城縣金城即京兆府之興平𤣥宗在興平王思禮自潼闗至始知哥舒翰被擒以思禮為河西隴右節度使即令赴鎮収㪚卒以俟東討事見通鑑然蘭州亦有金城縣又有金城闗正屬隴右道節度治鄯州金城雖在蘭州而去鄯為近詩云詔鎮雄所搤盖為此不以京兆京城而言也禁暴靖無雙爽氣春淅瀝師曰和爽之氣如春風然巷有從公歌野多青青麥洙曰言賊不敢犯境土也及夫哭廟後復領太原役洙曰郭子儀収復兩京時太廟為賊所焚權移神主於大内長安殿上皇謁廟請罪及元弼鎮河陽制以思禮為太原尹北京留守河東節度使兼御史大夫貯軍糧百萬噐械精鋭尋加司空補注希曰前此積石軍麥熟吐蕃輙來穫之無能禦者邊人謂之吐蕃麥莊哥舒翰嘗伏兵於其側虜至夾擊之無一人得返者自是不敢復來今繼以王公為節度故麥尤盛舊注失之又蕭宗還京素服向廟哭三日盖是至徳二載而領太原在乾元二年七月恐懼禄位髙悵望王土窄趙曰在我之禄位則恐其髙本朝之土地則恨其窄又以美其謙忠不得見清時嗚呼就窀穸洙曰左傳唯是窀穸之事永繫五湖舟洙曰范蠡事勾踐既滅呉乘扁舟泛五湖悲甚田横客洙曰田横死賔客間之從死者五人言思禮賔客尤甚於横也千秋汾晉間事與雲水白昔觀文苑傳豈述亷藺績洙曰言思禮撫御積畜之才在汾晉之間者與雲水無晦也亷頗藺相如古之名將言有武功不必責之文徳也嗟嗟鄧大夫士卒終倒㦸洙曰鄧景山曹州人亦為太原尹北京留守至太原以鎮撫紀綱為已任檢覆軍之隠沒者衆懼有一偏將將抵罪當死諸將各請贖其罪景山不許其弟請以身代又不許其弟請納馬一匹以贖兄罪衆感怒曰我等人命輕如一馬乎軍衆憤怒遂殺景山補注鶴曰舊史云王思禮上元二年四月薨管崇嗣代為太原尹數月召景山代崇嗣及至未幾以受馬被殺亦在上元二年公因景山亦尹太原而不若思禮有統御積蓄之才故於詩尾言之亦以顯思禮之功也故司徒李公光弼司徒天寳末北収晉陽甲趙曰光弼加檢校司徒在至徳二載尋遷司空矣今止云司徒則據為司徒以前事而稱其官耳按史云安禄山反郭子儀薦其能持節河東節度副使晉陽則河東之太原也胡騎攻吾城愁寂意不愜人安若泰山薊北斷右脅朔方氣乃蘇黎首見帝業洙曰賊將史思明等四偽帥來攻城光弼麾下衆不滿萬皆烏合之人賊以太原屈指可取光弼伺其怠出擊大破之斬首十餘萬級又破思明于嘉山而河北歸順者十餘郡朔方河北也二宫泣西郊師曰二宫謂肅宗與皇后九廟起頺壓洙曰見前篇及夫哭廟後注未散河陽卒思明偽臣妾復自碣石來火焚乾坤獵補注鶴曰通鑑云史思明至徳二載以所部十三郡及兵八萬來降李光弼以思明終當叛亂明年乾元元年果分軍為三一出邢洛一出冀貝一自洹水趨魏故云偽臣妾唐志碣石出在平州石城縣又媯州懐戎縣有居庸塞東連盧龍碣石髙視笑禄山公又大獻㨗洙曰乾元二年為天下兵馬元帥與九節度兵圍安慶緒於相州㧞有日矣史思明自范陽來救屢絶糧道光弼身先士卒若戰勝之思明因殺慶緒即偽位縱兵河南賊勢甚熾光弼遂檄官吏引兵入三城賊憚光弼不敢西犯宫闕遂戰於中潭西大破逆黨趙曰髙視笑禄山言思明笑禄山而自矜也獻㨗則傳所謂獻俘太廟異王册崇勲小敵信所怯定功曰光弼以功封臨淮王非謂非劉氏不王也小敵怯謂北邙之敗也擁兵鎮河汴千里初妥帖洙曰光弼以臨淮王鎮河汴蘇曰張遜上隋文帝表云幅員暫寧千里安帖青蠅紛營營風雨秋一葉内省未入朝死涙終映睫修可曰按唐史北邙之敗魚朝恩羞其䇿謬深忌光弼功髙而程元振尤嫉之及來瑱為元振讒死光弼愈恐吐蕃㓂京師代宗詔入援光弼畏祸遷延不敢行帝遷長安因拜東都留守察其去就光弼以乆須詔不至二年疾篤薨大屋去髙棟洙曰髙棟大屋所恃而安喻光弼朝廷之所倚頼也長城掃遺堞洙曰倚光弼如長城今其死矣是掃遺堞也平生白羽扇洙曰諸葛武侯持白羽扇指麾三軍言人亡而所用之物存爾零落蛟龍匣雅望與英姿惻愴槐里接洙曰命京兆尹第五倫監䕶䘮事塟於三原詔宰臣百官祖送於延平門外前漢槐里屬右扶風武帝茂陵昭帝平陵在趙曰槐里豈葬地乎以詔百官送葬延平門外按長安志延平門乃在郭西而前漢槐里屬右扶風今之鳯翔府正在長安之西矣補注希曰潘岳闗中記三輔舊治長安城中長吏各在其縣光武東都之後扶風出治槐里馮翊出治髙陵則槐里屬扶風甚明三軍晦光彩烈士痛稠疊直筆在史臣將來洗箱篋洙曰言平生功名書在史册也吾思哭孤冢南紀阻歸楫趙曰南紀楚之分公自南紀徃歸長安則可以弔光弼之英魂今阻而不能故云扶顛永蕭條未濟失利渉洙曰時未至大治而光弼亡如濟江而失舟也疲薾竟何人鄭曰薾乃結切疲也洒涕巴東峽趙曰巴東峽指言䕫州舊注指為荆州非是贈左僕射鄭國公嚴公武鄭公瑚璉器華岳金天晶洙曰以其得山岳之孕精也趙曰武挺之之子華州華隂人爾雅曰華為西岳右有帝王之號曰金天氏補注希曰金天亦精西而言如爽氣金天豁是也豈為古有金天氏寰宇記亦云嚴挺之華州人昔在童子日已聞老成名嶷然大賢後復見秀骨清洙曰本傳武神氣雋爽敏於聞見幼有成人風開口取將相小心事友生閲書百紙洙曰一云氏盡落筆四座驚歴職匪父任嫉邪常力爭趙曰言武初離䕃補其後自致身累遷殿中侍御史所謂嫉邪者乃御史之職而嘗力爭乃武之能矣漢儀尚整肅洙曰時武為侍御史胡騎忽縱横飛傳自河隴逄人問公卿趙曰飛傳則傳遽之報也河隴西東蜀口之道有飛傳自河隴來武必詢問公卿為誰補注希曰髙帝紀乗傳詣洛陽如淳曰急者乗一乗傳師古曰傳者若古之驛古者以車後又單置馬謂之驛騎飛傳其一乗傳歟司馬相如論蜀檄建節徃馳四乗之傳又文紀除闗無用傳注張晏曰傳信也不知萬乗出雪涕風悲鳴受詞劔閣道謁帝蕭闗城洙曰河隴劔閣蕭闗城事新舊二史皆不載鄭曰渭州清原縣乃武州舊治蕭闗縣按其地即漢朝那縣在原州西一百八十里龍朔中故於白草軍城置蕭闗補注鶴曰唐志大中五年以原州蕭闗置武州按九域志鎮戎軍乃原州平髙縣地有蕭闗古城漢文帝十四年匈奴入蕭闗即此地也西北與靈州為鄰盖武赴靈武行在故云寂寞雲臺仗洙曰庾信哀江南非無北闕之兵猶有雲臺之仗飄颻沙塞旌江山少使者笳鼓凝皇情補注希曰霍光傳曰使者旁午而今云江山少使者可知其時矣淮南王安傳亦云使者道長安來壯士血相視忠臣氣不平宻論貞觀體洙曰貞觀太宗撥亂反正時揮發岐陽征洙曰時肅宗理兵鳯翔感激動四極聨翩収二京定功曰史云至徳初武赴肅宗行在房琯薦為給事中已収長安拜京兆尹則固有建議収復者矣西郊牛酒再洙曰沈休文碑牛酒日至壺漿塞陌西郊謂文王也牛酒謂擊牛釃酒享士也原廟丹青明洙曰叔孫通請立原廟注原重也先以有廟今更立之也匡汲俄寵辱洙曰匡衡汲黯趙曰以武之諫諍如匡汲也既拜京兆尹矣而坐房琯事貶巴州此則寵之所辱也衞霍竟哀榮趙曰武為東川及劔南節度則遷謫之中雖可哀而亦榮也補注希曰北史王洛兒傳論生受恩遇沒居哀榮四登㑹府地三掌華陽兵趙曰武為京兆少尹父為京兆尹為成都尹劔南節度又復節度劔南此為四登㑹府書曰華陽黒水惟梁州則東川西川皆華陽也京兆空栁色洙曰色亦云市張敞為京兆尹走馬章臺街唐詩有章臺栁是也尚書無履聲洙曰前漢哀帝擢鄭崇為尚書僕射數求見諫諍上初納用之毎見曳革上笑曰我識鄭尚書覆聲羣烏自朝夕洙曰漢成帝時御史府中列栢樹常有野烏數千棲宿其上晨去暮来號曰朝夕烏烏去不来者數月長者異之後果廢御史大夫是其徴也白馬休横行趙曰漢張湛為光禄大夫常乗白馬光武毎有異政輙曰白馬生且復諌矣諸葛蜀人愛洙曰陳壽言蜀人愛亮雖甘棠之詠召公鄭人之歌子産未足為過也文翁儒化成洙曰文翁之守蜀召下縣子弟以為學官弟子為除更繇髙者補郡吏以為孝弟力田由是大化蜀之學於京師者比齊魯公來雪山重公去雪山輕洙曰雪山西山也言輕重在公而不在山記室得何遜洙曰梁書何遜為建安王記室王愛文學之士日與逰宴又為廣陵王記室復隨府於江州韜鈐延子荆洙曰晉孫楚字子荆叅石苞驃騎軍事四郊失壁壘洙曰失壁壘言無屯戌也此美武能鎮靜也虛館開逢迎洙曰開閤以禮士也堂上指圖畫軍中吹玉笙師曰言公鎮靜蜀中惟以宴樂圖畫與衆共樂無㓂盜之憂也豈無成都酒憂國只細傾時觀錦水釣問俗終相并趙曰上句雖成都有醇酒國難不敢盛為宴飲也下句言車騎之出非専為閒逰終以問俗為事也意待犬戎滅人藏紅粟盈趙曰犬戎指吐蕃也武再節度劔南日破吐蕃七萬衆于當狗城然其意終待盡滅而人免誅求使粟至於紅腐也以兹報主願庶或洙曰一云獲裨世程炯炯一心在洙曰炯炯明貌沉沉二豎嬰洙曰晉侯疾求醫于秦秦伯使醫緩為之未至公夢疾為二豎子曰彼良醫也懼傷我焉逃之其一曰居肓之上膏之下若我何醫至曰不可為也在肓之上膏之下攻之不可達之不及藥不至焉不可為也公曰良醫也顔囘竟短折洙曰顔囘年三十二蚤死武終時年四十賈誼徒忠貞師曰公之意在於報主不幸疾化故比之囘誼謂年少而殂也飛旐出江漢趙曰武卒於蜀舟行而歸孤舟轉荆衡洙曰荆衡乃楚地也虚横馬融笛蘇曰後漢馬融精覈術數性好音律能吹笛為督郵無留事獨卧郡平陽鄔中有洛客舍逆旅吹笛融去京師踰年暫聞悲甚而樂之作長笛賦悵望龍驤塋田曰武帝以謡言拜王濬為龍鑲將軍至太康六年卒葬桓谷小大營塋城舊注以龍驤名墓非是空餘老賔客身上媿簮纓洙曰武在蜀辟甫為叅謀補注鶴曰觀此詩而謂莫相疑行貧交行赤霄行為武而作可乎空餘老賔客身上愧簮纓之句無怨恨之意也不為此其哭嚴僕射歸櫬云一云三峽暮遺後見君情又可知矣贈太子太師汝陽郡王璡鄭曰璡資辛切補注天寳九載卒贈太子太師汝陽讓帝子洙曰讓皇帝憲本名成器睿宗長子立為皇太子以𤣥宗有討平韋氏之功成器懇讓儲位封為寧王薨謚曰讓皇帝長子汝陽郡王璡也眉宇真天人虬髯似太宗洙曰書生相太宗曰龍鳯之姿天日之表又有虬髯也色映塞外春師曰謂貌和雅也徃者開元中主恩視遇頻出入獨非時禮異見羣臣師曰𤣥宗以璡父讓位于已故眷遇之恩異於諸王出入宫禁不以時也愛其謹㓗極洙曰新史採此語倍此骨肉親從容聽朝後或在風雪晨忽思格猛獸洙曰江都王力格猛獸苑囿騰清塵羽旗動若一萬馬肅駪駪洙曰三禮圖全羽為旞析羽為旌所謂注旄於竿首也詩駪駪征夫注衆多之貌詔王來射鴈拜命已挺身箭出飛鞚内洙曰言王從帝獵苑中帝詔王射鴈也上又囘翠麟洙曰又一作入翻然紫塞翮修可曰崔豹古今注曰秦所築長城土色皆紫故云紫塞下拂明月輪趙曰言鴈下而拂弓也皆言王射獵之精絶胡人雖獲多天笑不為新洙曰長楊賦上將大誇胡人以多禽獸令胡人手摶之自取其獲上親臨觀焉天笑天子之笑也夣符曰右按仙傳拾遺木公與一王女投壺設有不入者天為之嚂嘘注嚂嘘開口而笑也王毎中一物手自與金銀䄂中諫獵書扣馬乆上陳趙曰言王雖隨獵矣而有書諫獵也諌獵書暗以司馬相如比之竟無銜橜虞洙曰相如書曰且夫清道而後行中路而馳猶時有銜橜之變橜音掘聖聰矧多仁官免供給費水有在藻鱗洙曰以其諫獵而罷故官免供給之費而物亦得所趙曰非特止獵且不漁也匪唯帝老大皆是王忠勤晩年務置醴門引申白賔洙曰璡歴太僕卿賀知章禇庭誨為詩酒之交天寶初終又加特進楚元王既至楚以穆生白生申公為中大夫初元王敬禮申公等穆生不嗜酒元王毎置酒嘗為穆生設醴師古曰醴甘酒也少麯多米一宿而熟不齊之矣道大容無能永懐侍芳茵洙曰言已無能而惟王之所容侍芳茵言侍王也好學尚貞烈義形必霑巾洙曰義形於色揮翰綺綉揚篇什若有神川廣不可泝趙曰言自别之後流落於蜀欲上見王則川廣不可泝也墓乆狐兎隣洙曰張孟陽七哀詩借問誰家墳皆云漢世主狐兎窟其中蕪穢不復掃宛彼漢中郡洙曰王弟瑀早有才望偉儀表天寶十五載從𤣥宗幸蜀至漢中因封漢中王文雅見天倫補注鶴曰璡以天寳九年卒而此詩作於永泰大歴間故曰墓乆狐兎隣公廣徳元年又與漢中王瑀㑹于梓州故章梓州水亭詩有近屬淮南至之句今因懐感而及其天倫故有此句而末又云何以開我悲泛舟俱逺津也何以開我悲泛舟俱逺津温温昔風味少壯已書紳洙曰書之紳帶也語子張書諸紳舊逰易磨滅衰謝多酸辛贈祕書監江夏李公邕長嘯宇宙間髙才日陵替蘇曰王粲曰小人日覺得志髙才日覺陵替夫造物者其意於賢愚何如哉古人不可見前輩復誰繼憶昔李公存詞林有根柢洙曰唐文苑傳李邕廣陵江都人少知名在長安李嶠張廷珪並薦邕詞髙行貞堪為諫諍官蘇曰潘安仁文章塊瑋友人謂潘詞林繁茂根柢衍宻不然何妙秀發如斯聲華當健筆灑落富清製風流散金石追琢山嶽鋭洙曰邕早擅才名尤長碑頌中朝衣冠天下寺觀多出其手情窮造化理學貫天人際洙曰董仲舒言天人相與之際干謁走其門蘇曰羊叔子吾非干謁走人門碑版照四裔各滿深望還森然起凡例洙曰杜預左氏傳序發凡以言例邕雖貶黜在外人亦多齎金帛徃求其文也蕭蕭白楊路洞徹寳珠惠趙曰墳墓之路幽昏而得邕之文如寳珠之洞徹以照之所以為惠龍宫塔廟湧浩刼浮雲衞洙曰雲一作空夣符曰右按南史阿育王佛滅度後一日一夜造八萬四千塔梵言塔華言廟也仙傳拾遺昆明池龍宫有仙方三十六首趙曰浩刼無窮之刼也度人經曰唯有元始浩刼之家部制我界統乗𤣥都也龍宫之塔廟得邕之文亘厯浩刼而浮雲衛䕶之也宗儒爼豆事故吏去思計趙曰爼豆事言作修學校記文宣王廟記之屬也去思計言使者太守縣令替罷而作頌政碑之屬眄睞巳皆虚䟦涉曾不泥向來映當時豈獨勸後世洙曰自蕭蕭白楊路至此皆邕所造碑事也豐屋珊瑚鈎騏驎織成􅄢紫騮隨劔几洙曰髙紀賈人毋得衣􅄢師古曰􅄢織毛若今毼及氍毹之類鄭曰説文曰西湖毳布也義取無虛嵗趙曰豐屋大屋也珊瑚鈎屋中之簾鈎織成􅄢則􅄢上所織者麒麟也既以紫騮馬而又隨之以寳劔與憑几此數者皆冨貴家物不惜以饋邕矣義取無虗嵗則以文得財矣新史云奉金帛請其文前後所受鉅萬計分宅脱驂間感激還未濟洙曰呉志周瑜推道南大宅以舍孫䇿與䇿為友升堂拜毋有無通共史記越石父賢在縲絏中晏子出遭之塗解左驂贖之延入為上客邕之急於養士如此衆歸賙給美擺落多藏穢趙曰在衆人則歸其能賙給在邕之身則雖多藏而能擺落其穢也獨歩四十年風聽九臯唳洙曰邕知名長安中死天寳初四十年間可謂獨歩矣累獻詞賦甚稱𤣥宗㫖後因上許中使臨索其新文以文章徹天聽故有九臯涙云嗚呼江夏姿趙曰此黄香也漢人語云天下無雙江夏黄童竟掩宣尼袂洙曰孔子獲麟反袂拭面稱吾道窮補注希曰雖用漢人語亦以邕父善本江夏人故云曹憲傳同郡魏模公孫羅江夏才善相繼傳授者也徃者武后朝引用多寵嬖否臧太常議洙曰邕有批韋巨源謚議文士推重之靣折二張勢洙曰初邕為左拾遺俄而御史中丞宋璟奏侍臣張昌宗兄弟有不順之言請付法斷則天初不應邕在陛下進曰璟言事闗社稷望陛下可其奏則天色解始允宋璟既出或謂邕曰子名位尚卑若不稱㫖禍福將不測何為造次如是邕曰不顛不狂其名不彰衰俗凜生風排蕩秋旻霽忠貞負寃恨趙曰以邕忠正為人所陷宫闕深旒綴趙曰此言天子深居九重不加省察也放逐早聨翩低垂困炎癘洙曰邕始以與張柬之善貶雷州𤣥宗初又貶崖州後召還為姚宗所嫉貶栁州又為張説所惡發陳州賦事扺死㑹赦免貶欽州邕少有名累被貶逐後進不識京洛阡陌聚觀以為古人或將眉目有異衣冠望風尋訪門巷又中使臨問索其新文復為人隂中竟不得進用也日斜鵩鳥入䰟斷蒼梧帝趙曰言其悲愁如賈誼鵩鳥賦云庚子日邪鵩集余舍帝舜之狩至蒼梧而死今之梧州也榮一作䇿枯走不暇星駕無安税趙曰榮枯之不常故奔走不暇所以無安息税駕之地詩星言夙駕幾分漢庭竹洙曰漢制以竹使符分給郡守邕累為刺史故曰幾分也夙擁文侯篲洙曰魏文侯擁篲以迎朋友終悲洛陽獄事近小臣斃禍階初負謗易力何深嚌洙曰邕與栁勣馬一疋及勣下嶽吉温令勣引邕議及休咎事遂誅趙曰天寶初栁勣有罪下獄邕嘗遺勣馬故吉温使引邕嘗以休咎相語隂賂遺竟杖死北海郡伊昔臨淄亭酒酣託末契洙曰甫有陪李北海晏歴下亭詩是也補注希曰唐志齊州濟南郡本齊郡天寶元年更名臨淄然青州亦有臨淄縣此當是言齊州歴下亭也重叙東都别朝隂改軒砌朝直遥切論文倒崔蘇洙曰崔信明蘇源明二人皆以文章擅世指盡流水逝近伏盈川雄洙曰唐文苑傳楊炯為盈川令卒張説曰楊盈川文思如懸河注酌之不竭既優於盧照隣亦不減王勃未甘時進麗洙曰張説曰李嶠之文如良金美玉無施不可李嶠為時進故也是非張相國相扼一危脆趙曰指張説也邕素輕與張説相惡公詩言張説以相國勢力所能勝邕特一身危脆易於一扼耳爭名古豈然洙曰魏文帝典論云文人相輕自古而然鍵㨗歘不閉趙曰邕於闗鍵則㨗急而歘然不閉所以召禍例及吾家詩曠懐掃氛翳慷慨嗣真作咨嗟玉山桂洙曰郄詵云崑山片玉桂林一枝鐘律儼髙懸鯤鯨噴迢遰師古鍾律喻詩有法度鯤鯨喻其雄健坡陁青州血師曰坡陁髙聚貌青州血謂死所蕪沒汶陽瘞洙曰邕塟所也補注鶴曰青州是為北海郡乃邕守其郡李林甫忌之因傳以罪詔就郡杖殺之又唐志武徳二年以北海營丘下宻置濰州又置連永平壽華池汶陽等十三縣六年皆省今云汶陽者殆指舊縣地而言邕客塟於此故云瘞哀贈竟蕭條恩波延揭厲洙曰代宗時國恩例得贈秘書監子孫存如綫舊客舟凝滯趙曰存如綫傷李無後也舊客則公自傷其流落於外未能乗扁舟以徃也君臣尚論兵將帥接燕薊朗詠六公篇洙曰邕有張桓等五王泊狄相六公詩憂來豁䝉蔽趙曰嘆時之多艱當復如邕者慷慨有所陳説故詠其所作六公詩以觧憂也公自注云桓彦􅚘敬暉崔𤣥暉張柬之袁恕已也洎狄相六公六公篇詠具載邕傳故祕書少監蘇公源明武功少也孤趙曰源明京兆武功人故直以此名之徒歩客徐兖讀書東岳中十載考墳典洙曰按新史源明初名預字弱夫少孤寓居徐兖工文辭有名時下萊蕪郭忍飢浮雲巘補注鶴曰東岳萊蕪俱屬兖州萊蕪兖州屬邑名唐志云本穎淄州武徳六年省入博城長安四年以廢嬴縣復置九域志淄州有萊蕪舊城淄南去兖四百里而九域志又云萊蕪東北去兖州三百里疑不能時下然東岳唐在乾封縣亦在兖之東北岳與萊蕪為近盖自東岳時下萊蕪也負米晩為身毎食臉必泫洙曰子路為親百里負米源明養不及親負米自為而已故毎食必泫夜字照爇薪夣符曰右按文士傳侯瑾字子瑜家貧傭賃暮輙燒柴薪以讀書獨處一室如對尊賔垢衣生碧蘚庻以勤苦志報兹劬勞願洙曰以已勤苦之志報父母劬勞也學蔚醇儒姿洙曰賈山渉獵書記不能為醇儒文包舊史善師曰源明嘗私著國史後史館采其語用之故云云灑落辭幽人歸來潜京輦射䇿君東堂宗匠集精選制可題未乾乙科已大闡洙曰元明天寶中及進士第更試集賢院漢書顔師古曰射䇿者謂為難問疑義書之於䇿量其大小署為甲乙之科列而置之不使彰顕有欲射者隨其所取得而釋之以知優劣文章日自負椽吏亦累踐趙曰累遷太子諭徳晨趨閶闔内足踏宿昔趼鄭曰古典切胝也一麾出守還洙曰源明累遷太子諭徳出為東平太守故召為國子司業也夣符曰右按文選云屢薦不入官一麾乃出守黄屋朔風巻不暇陪八駿虜庭悲所遣趙曰朔風巻則明皇乗輿以禄山反而出狩源明不得扈從而留虜庭毎悲恨以遣懐耳八駿事周穆王乗八駿以出逰平生滿樽酒蘇曰阮迷愛詩好飲足不跡公卿大夫之門水邊林下放懐自若張翰相顧遇問其所欲迷曰平生滿樽酒活計一張琴翰歎㐲曰真傲逸竒士非我輩比也斷此朋知展憂憤病二秋有恨石可轉洙曰安禄山陷京師源明以病不受偽官趙曰詩曰我心匪石不可轉也其二秋憂憤則石可轉而吾心不轉焉此言源明不汙賊也肅宗復社稷得無逆順辨洙曰肅宗復兩京權考功郎中知制誥范煜顧其兒趙曰范煜坐謀反誅臨刑醉其子藹亦醉取地土及果皮以擲煜煜問曰汝瞋我耶藹曰今日何縁瞋但父子同死不能不悲李斯憶黄犬洙曰李斯傳二世二年七月具斯五刑論腰斬咸陽市顧謂其中子曰吾欲與若復牽黄犬俱出上蔡東門逐狡兎豈可得言受偽官之人如范李之顧戀也秘書茂松意洙曰源明後以祕書少監卒茂松意以不變節於艱危如松栢不為風霜所奪也載從祠壇墠前後百巻文枕藉皆禁臠趙曰禁臠言其文之美也出晉元帝始鎮建業毎得二豚以為珍膳項上一臠尤美輙以薦帝呼為禁臠篆刻揚雄流溟漲本末淺趙曰揚雄以賦為童子雕蟲篆刻然竟為長揚羽獵賦見稱於時溟漲謂其文波瀾浩汗雖溟海之漲其本末比之猶為淺青熒芙蓉劔犀兕豈獨剸洙曰呉越王允常取純鈎劔示薛燭曰光乎如屈陽之華沉沉如芙蓉始生於湖王子淵頌巧冶鑄干將之樸水斷蛟龍陸剸犀兕反為後輩褻予實苦懐緬煌煌齋房芝事絶萬手搴鄭曰搴九輦切取也洙曰漢武帝大興祠齊房生芝而作歌肅宗時宰相王璵以祈禬進勸上興祠禱事禁中稍崇淫祀源明數進時政得失垂之俟來者正始徴勸勉趙曰源明所言可以垂後世法乃正始之道也不要懸黄金胡為投亂贙修可曰按爾雅贙有力注云出西海大秦國似狗多力獷惡炙轂子載贙銘曰爰有獷獸厥形似犬飢則馴服飽則反眼出于西海名之曰畎趙曰所以美之且危之也乳贙謂乳虎也盖言安媚則黄金可惡而切直犯上之怒不啻投飢贙也贙乎犬切結交三十載洙曰任彦升哭雲僕射結懽三十載生死一交情吾與誰逰衍洙曰新史亦言源明雅善杜甫鄭䖍榮陽復冥寞罪罟巳橫􅇢洙曰上户孟反下音畎謂鄭䖍也嗚呼子逝日始泰則終蹇長安米萬錢凋䘮盡餘喘趙曰言源明未死間猶及肅宗反正之後時已向泰矣而源明死後時復屯蹇所以有米萬錢而至凋䘮也舊注所引非舊注云是時乗大盗之餘國用乏屈史思明䧟洛陽有詔幸東京源明以防早飢陳十不可以諌上嘉其直遂罷東幸補注鶴曰二注俱非不過言源明死時適值嵗歉而已舊史廣徳二年自秋及冬斗米千錢今云長安米萬錢盖以一斛言之史不言蘇與鄭死之年以此詩及長安米價論之當是其年蘇鄭相繼而死故云榮陽復冥寞後詩又云凶問一年俱戰伐何當解歸帆阻清沔尚纒漳水疾洙曰劉公幹余嬰沉痼疾竄身清漳濵趙曰公言在雲安不得沂沔以歸永負蒿里餞洙曰蒿里送士大夫庶人挽歌蘇曰徐翔之姪陵泣曰永負蒿里之哀東門相餞故著作郎貶台州司戸滎陽鄭公䖍鶢鶋至魯門不識鐘鼓饗洙曰莊子至樂篇昔者海鳥止於魯郊魯侯御而觴之于廟奏九韶以為樂具太牢以為膳鳥乃眩視憂悲不敢食一臠不敢飲一杯三日而死此以已養養鳥也非以鳥養養鳥也海鳥鶢鶋也孔子謂臧文仲不智者三而祀鶢鶋一也注鶢鶋止於魯東門文仲使國人祀之孔翠望赤霄愁思雕籠養洙曰孔翠翡翠孔雀也其志在丹霄然終不免樊籠之愁者以其質之異於衆禽也故鷦鷯賦彼鷲鴞鵾鴻孔雀翡翠或陵赤霄之際或託絶垠之外翰羽足以冲天觜距足以自衞然皆負矰纓繳羽毛入貢何者用於人者然也趙曰言鄭公如鶢鶋如孔翠非鍾鼓所能樂之雕籠所能拘之也滎陽冠衆儒早聞名公賞地崇士大夫况乃氣清爽洙曰文藝傳鄭䖍鄭州滎陽人天寳初為協律郎天然生知姿學立㳺夏上神農或闕漏黄石愧師長趙曰鄭䖍自著書外又選胡本草七巻故公所言補闕乃神農本草之所不載也張良遇黄石公為師令公言愧者愧則不敢為䖍之師長也藥纂西極名兵流指諸掌貫穿無遺恨薈蕞何技癢鄭曰薈烏外切蕞祖外切小貌痒以兩切本作癢圭臬星經奥蟲篆丹青廣洙曰按新史䖍集撰當世事著書八十餘篇有窺其藁者遂上書告䖍私撰國史䖍倉皇焚之坐謫十年名其書為㑹粹孔子作春秋游夏不能賛一辭䖍私撰國史是出其上也神農黄石藥纂兵流皆古書也言䖍無不貫穿復通㳺藝星經丹青之類趙曰圭臬言其善地理也選言陳圭置臬圭者土圭所以測日影臬者䘮臬所以度廣狹蟲篆言能書丹青又言能畫子雲窺未遍蘇曰劉薦語陳貞曰吾腹中書皆揚子雲窺未遍者方朔諧太枉趙曰言鄭䖍能知荒逺之所在也東方朔毎言其所指皆神仙之處故云諧枉猶太迂也神翰顧不一體變鍾兼兩修可曰書苑曰䖍善草頴吕揔云䖍書如風送雲収霞催月上鍾兼兩鍾繇鍾㑹也父子善𨽻書皆盡其妙或云兼兩車也漢呉恢為南海太守欲殺青冩書子祜諫曰此書若成則載之兼兩注車有兩輪故稱文傳天下口蘇曰相如片文隻字朝出而暮傳天下古詩云髙文滿天下藉藉喧萬口大字猶在牓昔獻書畫圖新詩亦俱往滄洲動玉陛寡鶴誤一響三絶自御題四方尤所仰洙曰䖍自寫其詩并畫以獻帝大書其尾曰鄭䖍三絶寡一作宣嗜酒益疎放洙曰䖍嗜酒疎放故杜甫贈詩云頼得蘇司業時時與酒錢蘇司業源明也蘇曰陶潜阮籍軰嗜酒疎放逸山野終免其禍當世莫及其髙見自全之機彈琴視天壤形骸實土木親近唯几杖趙曰言親近於天子今以言几杖則未嘗暫離之意未曽寄官曹突兀倚書幌洙曰䖍初坐謫還京師上愛其材欲置左右以不事事更為置廣文舘以䖍為博士䖍聞命不知廣文曹司何在訴宰相曰上増國學置廣文舘以居賢者令後世言廣文博士自君始不亦美乎晩就芸香閣洙曰遷著作郎魚豢典畧云芸香辟紙魚蠧故藏書臺稱芸臺胡塵昏坱莽曽曰坱莽廣貌反覆歸聖朝㸃染無滌盪趙曰䖍值禄山反為受䖍水部郎中因稱風緩求市令潜以宻草達靈武故言無一㸃所染不煩澆蕩之意老䝉台州掾泛泛浙江槳洙曰禄山反遣張通孺刼百官置東都偽授䖍水部郎中因稱風緩求攝市令潜以宻草達靈武賊平免死貶台州司户叅軍履穿四明雪飢拾楢溪橡洙曰四明楢溪皆浙江地名言䖍貧困拾橡而食之定功曰按唐史䖍以汚禄山偽官貶台州司戸四明及楢溪皆屬台州孫綽賦云登陸則有四明天台補注鶴曰楢溪雖未詳在何郡而四明山不屬天台唐云明州以境有四明山為名九域志云其山有四面各産異木不雜又孔􅁮㑹稽記曰四明山髙峯軼雲連岫蔽日今云履穿其雪亦第言經從其山耳非指在台州空聞紫芝歌不見杏壇丈洙曰莊子漁父篇孔子逰乎緇帷之林休坐乎杏壇之上弟子讀書孔子絃歌鼓琴奏曲天長眺東南秋色餘魍魎洙曰天台賦始經魍魎之塗卒踐無人之境師曰言荒僻也别離慘至今班白徒懐曩春深秦山秀葉墜清渭朗劇談王侯門野税林下鞅洙曰鮑明逺詩無田稅歸鞅操紙終夕酣時物集遐想師曰自春深泰山秀至此追憶昔時與䖍聚㑹于闗中春和秋凉之日或劇談或解鞅操紙賦詩把酒酣飲今詞場疎濶故傷之詞場竟疎濶平昔濫吹奬趙曰指言昔與鄭逰於詞翰之場而今竟疎逺間濶又憶鄭之平昔濫有推奬於已百年見存沒牢落吾安放洙曰一云倣趙曰孔子將死子貢曰泰山其頺吾將安仰梁木其壊吾將安放蕭條阮咸在出處同世網洙曰阮咸阮照子也任達不拘雖處世不交人事補注鶴曰鄭審當是與𤣥為兄弟故謂阮咸在如杜位乃公之從弟而云阿咸家是也東坡本此故與子由詩云頭上銀旛笑阿咸審雖謫江陵而有宅在䕫公嘗過其湖亭有詩又選世網纓我等此詩當是大歴元年作他日訪江樓含悽述飄蕩洙曰著作與今秘書監鄭君審篇翰齊價謫江陵故有阮咸江流之句趙曰阮藉與其姪共為竹林之逰今以阮咸比鄭審故云阮咸在故右僕射相國張公九齡相國生南紀師曰滔滔江漢南國之紀説者援是詩以江漢為南紀非也葢南紀乃分野名廣天文志云東循嶺徼達甌閩中是謂南紀所以限蠻夷也張相國曲江人曲江𨽻韶州正嶺徼甌粤之地大扺自江漢以南皆謂之南紀非特江漢而巳補注希曰史記秦莊㐮王薨太子政立尊吕不韋為相國又髙后病甚廼令梁王吕産為相國前漢百官公卿表相國丞相皆秦官張公相明皇故云金璞無留礦洙曰張九齡父為韶州别駕因家于始興今為曲江人九齡幼聰敏善屬文十三以書干廣州刺史王方慶大嗟賞之曰此子必能致逺金玉未成器曰礦言九齡成器早故不留礦也趙曰言已為金而不復留在礦以譬張曲江出而應用不復退縮也仙鶴下人間獨立霜毛整洙曰言九齡之出也如仙鶴然潔白修整矯然江海思蘇曰阮熙年來浩然起江海之思復與雲路永師曰言其志趣髙逺前桯亦不淺也寂寞想土階未遑等箕潁洙曰堯生階三尺想土階有致君堯舜之心也有致君之心故未遑於箕潁箕山也潁水也巢父許由所隠之地上君白玉堂倚君金華省洙曰由玉堂金華省言直登清華之地趙曰此言張曲江為校書郎為左拾遺為左補闕為中書舍人為集賢院學士是也補注希曰玉堂金華㫮殿名翼奉疏孝文躬行節儉其時未央宫無髙門武臺玉堂金華之殿又李尋傳久汙玉堂之署楊雄傳上玉堂又鄭寛中張禹朝夕説書於金華殿中今張公為拾遺補闕及中書舍人切近於君皆可謂之玉堂開元十三年改麗正修書院為集賢殿書院侍講學士侍讀直學士而公為學士故云倚君金華省碣石嵗崢嶸天地日蛙黽師曰碣石山在安禄山所據之方崢嶸髙大貌禄山有叛志嘗自髙大視天地間如蛙黽然全無忌憚相國料其有反意屢請于帝補注希曰此却非指齊地碣石而言葢謂安禄山在河北日自强大唐志河北名山日碣石爾雅在水者黽釋曰一名耿黽一名士鴨状似青蛙而腹大陶注本草云俗名士鴨其鳴甚壮又云一種小形善鳴喚為鼃比言禄山强恣天下之人籍籍有言如蛙黽而明皇獨不知也鶴曰楚辭謬諫云鼃黽㳺乎華池注喻讒諛弄口得志也退食吟大庭何心記榛梗洙曰大庭古至治之國也言九齡雖退食之間未嘗忘致治也榛梗言不以嫌猜為心也骨驚畏曩哲鬒變負人境洙曰鬒黒髪也變而為白以負人事而已謝𤣥暉詩誰能鬒不變趙曰上句言畏其不逮故前人下句憂其髪白而將老皆傷功名之不立也雖䝉換蟬冠右地恧多幸趙曰此乃侍中事而史不載漢官儀侍中冠武帝大冠加金璫附蟬為文貂尾為飾謂之貂蟬也下句則以九齡以尚書右丞相罷言在右也已慚恧而多幸何者有林甫之嫉仙客之憾則得此為幸矣敢忘二疏歸洙曰疏廣為漢太子太傳謂兄子受曰吾聞知足不辱知止不殆豈如父子相隨出闗歸老不亦善乎遂上疏乞骸骨上許之公卿設祖道供帳東都門外痛廹蘇耽井蘇曰神仙蘇耽種橘鑿泉以救時疫病者食橘葉飲泉即愈趙曰神仙傳蘇仙翁名耽忽辭母去毋曰使我如何存活仙翁曰明年天降疫疾庭中水簷邊橘樹可以代養紫綬映暮年荆州謝所領洙曰初九齡為相薦長安尉周子諒為監察御史至是子諒以妄陳休咎上親加詰問令於朝堂决殺之九齡坐引非其人左遷荆州大都督府長史補注希曰漢公卿表丞相金章紫綬庾公興不淺洙曰庾亮鎮武昌諸佐吏殷浩之徒乗月登南樓俄而不覺亮至將起避之亮徐曰諸君少住老子於此興不淺便據胡牀與浩等談詠其坦率如此黄霸鎮毎靜洙曰循吏傳黄霸獨用寛和為治擢為揚州刺史潁川太守治為天下第一自漢興言治民吏以霸為首賔客引調同洙曰謝靈運詩異代可同調諷詠在務屏詩罷地有餘篇終語清省一陽發隂管趙曰謂如黄鍾之律也言其詩之和而可聴耳淑氣含公鼎趙曰謂如大烹之和也言其詩之美而可味於口乃知君子心用才文章境洙曰九齡善屬文有集二十巻散帙起翠螭倚薄巫廬並趙曰言開散曲江文帙神物歘起其髙至並巫廬之山也廣雅云龍無角曰螭師曰公有集二十巻荆人刻之碑翠螭即碑頭刻螭文也倚薄巫廬並巫廬二山其才氣能與二山之氣相倚廹也綺麗𤣥暉擁洙曰謝眺字𤣥暉少有美名為文綺麗牋誄任昉騁洙曰任昉字彦升長於牋誄自我一家則未闕隻字警洙曰史記序勒成一家傳序隻字之褒千秋滄海南名繫朱鳥影趙曰韶州即滄海之南朱鳥南方之宿當時謂九齡為滄海遺珠則有名稱矣歸老守故林戀闕悄延頸趙曰九齡在荆州之久封始興縣伯請還展墓也戀闕言其心不㤀君也波濤良史筆蘇曰班孟堅信知一代良史下筆善惡瀾翻而昭著蕪絶大庾嶺洙曰恨賦終蕪絶於異域九齡自荆州請歸拜墓因遇疾卒年六十八謚曰文憲至徳初上皇在蜀思九齡先覺安禄山靣有反相乃下詔褒贈司徒趙曰意謂九齡之文如波濤之翻可充良史之筆惜乎蕪沒隔絶於大庾嶺之外也補注鶴曰無一本作蕪趙注乃爾善本作無字為是張公之文何嘗蕪絶公意謂良史之筆當紀其初終無絶於庾嶺也如先知禄山反相不與林甫同惡皆史筆所當書殆公之所望於史筆者前篇李光弼詩云直筆史臣在將來洗箱篋亦此意也南康記云漢兵擊吕嘉衆潰有神將戌是嶺以其姓庾因謂之大庾又以其上多梅而先發亦曰梅嶺按武帝元鼎四年南越相吕嘉殺漢將楊千秋函封漢使節置塞上即此嶺張公居於嶺外故云向時禮數隔制作難上請趙曰此言帝眷已衰難以制作上請於朝也冄讀徐孺碑猶思理煙艇蘇曰謝安石理五湖煙艇趙曰徐孺漢之髙士也曲江為之墓碣公之句意謂今再讀之而猶思理煙艇則以慕徐孺髙風而不㤀江漢之念醉為馬墜諸公攜酒相看大厯二年作補注鶴曰詩云騎馬忽憶少年時散蹄迸落瞿塘石當是在䕫州作而梁權道編在大厯三年按公是年出峽有贈南卿兄瀼西岸園詩曰正月喧鶯未兹辰放鷁初則公是年正月巳去䕫若是時伏枕則是月豈能發舟當是二年作甫也諸侯老賔客蘇曰卜子夏見魯大夫曰商也諸侯門下老賔客爾思以恢𢎞仲尼之道賢大夫冝如何罷酒酣歌拓金㦸騎馬忽憶少年時蘇曰許禇騎馬過新豐涙下不止客問其故禇曰憶少年時挾矢躍馬醉戯于此囘首五十年事不覺淚下散蹄迸落瞿塘石禹侢曰瞿唐峽名時甫在䕫故言及此白帝城門水雲外低身直下八千尺粉蝶電轉紫逰韁洙曰粉堞城堞也以堊土塗之故曰粉堞韁馬韁以紫絲為之故曰紫韁禹侢曰電轉言其疾也東得平岡出天壁逢原曰言山立與天齊髙也江村野堂爭入眼垂鞭嚲鞚凌紫陌逄原曰嚲鞚謂俯勤其馬也向來皓首驚萬人自倚紅顔能騎射趙曰言雖以我皓首為驚而自謂其年少時能騎射今亦尚能也安知决臆追風足洙曰决臆縱意也追風言馬足疾可以追風也趙曰追風太宗十驥之名朱汗驂驔猶噴玉趙曰朱汗即汗血也崔液上元夜逰詩驂驔始散東城曲倐忽還逢南陌頭穆天子傳王東逰于黄澤時人語曰黄之澤其馬歕玉不虞一蹶終損傷人生快意多所辱職當憂戚伏衾枕况乃遲暮加煩促趙曰張茂先云煩促毎有餘朋知來問腆我顔洙曰腆厚也杖黎强起依僮僕語盡還成開口笑提携别掃清谿曲酒肉如山又一時初筵哀絲動豪竹琪曰大管也共指西日不相貸琪曰言欲暮須痛飲不相假貸喧呼且覆杯中淥何必走馬來為問君不見嵇康養生被殺戮洙曰嵇康注養生論後以事坐誅李潮八分小篆歌大厯二年作余曰邵氏聞見錄云韓退之石鼓詩體子美八分歌也補注鶴曰巴東逢李潮當是在䕫州作盖䕫本巴東郡也梁權道編在大厯三年然是年正月公䕫詩但云逾月求我歌我今衰老才力薄潮乎潮乎柰爾何無分别語意是二年蒼頡鳥跡既茫昧字體變化如浮雲洙曰蒼頡黄帝臣也觀鳥跡而為文字自蒼頡之後字體變易如浮雲焉無定體也陳倉石鼓又已訛趙曰韓退之詩周綱陵遲四海沸宣王憤起揮天戈䥴功勒成告萬世鑿石作鼓隳嵯峨鄭曰陳倉山名在鳯翔寶雞縣大小二篆生八分洙曰周太史籕始剏大篆唐蘇載記石鼓文謂之周宣王獵碣共十鼓其文則史籕大篆漢蔡邕字伯喈為中郎將正六經于太學石壁天下摹學邕大篆入妙品小篆者秦丞相李斯删古文復篆及史籕之書也斯作蒼頡篇胡母敬作博學篇皆取史籕大篆或頗改所謂小篆師曰書苑云八分書者秦羽人上谷王次仲飾𨽻書為之鍾繇謂之章程書王愔曰王次仲始以古書方廣少破勢建中初以𨽻書作楷法字方八分始皇得次仲文簡略赴急病之用甚善之蔡姬别傳曰臣父邕言八分書割程邈𨽻字法去八法李斯小篆去二分取八分故曰八分書蔡希總曰王次仲以楷法局促更引而伸之為八分故號八分書張懐瓘云八分本謂之楷書楷者法也漸若八字分散故名八分補注鶴曰鳯翔府寶雞縣本陳倉縣寰宇記云石鼓山在縣南二十許里石形如鼓其數有十盖紀周宣王畋獵之事其文即史籕之迹秦燔詩書廢古訓而官獄多事乃令下杜人程邈作小篆唐張懐瓘書斷云蔡邕八法入神𨽻入妙又云張昶八分碑在華縣今華山所存漢碑凡四華亭一碑乃昶分書也秦有李斯漢蔡邕見上注中間作者寂不聞嶧山之碑野火焚棗木傳刻肥失真洙曰嶧山碑李斯書也為野火所焚人惜其文故以棗木傳刻按史記始皇二十八年東行郡國上鄒嶧山於是刻之于石以頌秦徳補注鶴曰嶧山碑即李斯所書秦詔者也本朝劉跂以大觀二年春訪於泰山絶頂見其巋然依叢石間其髙不踰四尺厚約二尺有竒石皆殘缺四面周圍悉有刻字總二十二行行十二字其十二行是始皇解其十行是二世詔毆陽公云今俗傳嶧山碑史記不載其字特大不類泰山存者其不傳刻爾又云江休複嘗自至泰山頂上視秦所刻石處云四面皆石無草木而野火不及故能若此之久然則在公所謂野火焚者亦聞聽之誤歟苦縣光和尚骨立定功曰苦縣屬陳國故城今在亳州趙曰野火焚謂李斯書也尚骨立謂蔡邕書也故於嶧山之碑則傷棗木之失真於苦縣之碑則喜其有骨立也師曰續漢書云桓帝夣見老子令左棺於頼鄉祠之詔陳相邊詔立祠兼刻石即蔡伯喈八分書又靈帝紀光和五年始置鴻都門生注云召能為尺牘工書鳥篆者時南陽人師冝官稱八分為最大則一字徑丈小則方寸以是考之疑苦縣蔡邕書光和師冝官書也詳觀此歌嶧山之碑謂李斯書也苦縣謂蔡邕書也然苦縣之祠立於桓帝之延熹而光和乃靈帝年號豈非祠立於延熹而碑刻於光和乎盖延熹至光和纔十年之近爾或謂光和為伯喈所書華山碑苦縣老子朱龜碑未知孰是書洙曰一作畫貴痩硬方通神蘇曰羊欣曰古將軍筆畫勁硬妙絶通神惜哉李蔡不復得吾甥李潮下筆親尚書韓擇木騎曹蔡有隣開元已來數八分潮也奄有二子成三人洙曰韓擇木昌黎人官至工部尚書散騎常侍工八分師蔡邕法風流閑媚號伯喈中興蔡有隣濟陽人官至胄曹叅軍善八分始拙弱至天寳中遂精妙相衛間多其筆跡况潮小篆逼秦相快劔長㦸森相向八分一字直百洙曰一作千金鄭曰程邈見李斯書曰此一字直千金蛟龍盤拏肉屈强鄭曰屈九勿切亦作淈洙曰言筆跡竒怪勁屈如蛟龍之盤拏也呉郡張顛誇草書草書非古空雄壯洙曰張旭呉郡人官至右率府長史時善草書言吾見公主檐夫争路而得其意後又觀公孫氏舞劔器而得其神飲醉輙草書揮筆大呌以頭濡墨水中天下呼為張顛醒後自視以為神人謂之草聖豈知吾甥不流宕鄭曰宕徒浪切過也丞相中郎丈人行洙曰丞相斯也中郎邕也丈人行尊老之稱也補注鶴曰此詩云惜哉李蔡不復得吾甥李潮下筆親則潮乃公之甥然爾雅云姑之子為甥舅之子為甥妻之昆弟為甥姊妹之夫為甥若帝館甥于貳室則壻亦可謂之甥未知潮之父母為誰丈人行乃本蘇武傳王注云尊老之稱亦本師古而云耳巴洙曰一作江東逢李潮逾月求我歌我今衰老才力薄潮乎潮乎奈汝何别蔡十四著作大厯元年作補注鶴曰憶念鳯翔都聚散俄十春按公至徳二載丁酉在鳯翔至大厯元年丙午為十春當是其年作詩又云主人薨城府扶櫬歸咸秦主人謂郭英乂為崔旰所殺蔡訪郭於成都值其死遂扶其櫬以歸公與蔡相逄於巴道巴道云者尚未至䕫意在雲安葢郭以永泰元年閏十月薨而此詩云積水駕三峽浮龍倚長津揚舲洪濤間仗子濟物身非峽中冬間事當是大厯元年春嚴武死而公有詩哭其歸櫬又有詩預八哀之一今郭英又死公寜作詩以别扶襯而無語以及郭謂少年行赤霄行莫相疑行為武作是也賈生慟哭後寥落無其人洙曰賈誼上書言時事六可為慟哭安知蔡夫子髙義邁等倫蘇曰朱雲意爭超邁等倫映絶今古獻書謁皇帝志已清風塵流涕灑丹極萬乗為酸辛天地則創痍朝廷當一云多正臣異才復間出洙曰間出猶間生也周道日惟新使蜀見知已别顔始一伸主人薨城府扶襯歸咸秦趙曰史記云士伸於知巳主人指郭英乂於永泰元年為崔旰所殺故言薨巴道此相逢洙曰巴道蜀道也相如論蜀文巴蜀之士㑹我病江濵憶念鳯翔都聚散俄十春我衰不足道但願子意陳稍令社稷安自契魚水親洙曰蜀先主得孔明猶魚之得水也我雖消渴甚敢忘帝力勤尚思未朽骨復覩耕桑民洙曰民安於耕桑則至治之世然也積水駕三峽浮龍倚長津趙曰郭景純逰仙詩髙浪駕蓬萊浮龍倚長津亦實道三峽中事揚舲洪濤間蘇曰馬藻揚舲椮檛語笑於洪濤之間仗子濟物身鞍馬下秦塞王城通北辰趙曰秦塞則出陸矣北辰言帝居也𤣥甲聚不散兵久食恐貧洙曰兵聚而食貧也趙曰班固燕山銘曰𤣥甲曜日注鐵甲也補注鶴曰霍去病傳已云發屬國𤣥甲軍師古曰𤣥甲謂甲之黒色也是時崔旰反而柏茂材等並起兵討之蜀中大亂故云窮谷無粟帛使者來相因若馮南轅吏洙曰又作南轅使書札到天垠洙曰使者徴斂之使也相因言來相繼漢書陳陳相因古詩云遺我一書札垠岸也趙曰窮谷指䕫州也來相因不斷也此言方用兵須食而頻遣使者來至窮谷如此則南轅之使可為其使而附書也别李義大厯二年作彦輔曰公自言杜與李同出於陶唐氏故此詩言余亦忝諸孫也詩云中外貴賤殊乃與義為表昆弟非李杜同出陶唐氏補注鶴曰詩云三峽春夏交江山雲霧昏正冝且聚集恨此當離樽當是在䕫州梁權道編在大厯三年然三年正月出峽不應與義聚集於三峽春夏之交當是二年三月末作神堯十八子十七王其門道國及舒國實惟親弟昆鮑曰髙祖二十二子道王元慶舒王元名衛懐王𤣥霸楚哀王智雲皆先薨太子建成巢王元吉以事誅詔除籍故止言十八太宗有天下故有十七子封王也中外貴賤殊師曰義宗姓為内甫異姓為外故云貴賤殊余亦忝諸孫趙曰詳味詩意則李義者道國之裔孫而公則舒國後裔之外裔也舊注云公自言杜與李同出於陶唐氏是何等語補注鶴曰彦輔之説是葢有中表外表故云自謂忝諸孫則公之父祖雖是舒國之外孫而於道國亦可謂之孫也丈人嗣王業趙曰丈人指言李義之父也嗣王業則繼嗣前王之業也舊注云襲封謂之嗣王其説誤矣之子白玉温趙曰稱李義也謂其温如五也道國繼徳業請從丈人論趙曰申言丈人乃道國之後其能繼其徳業者請從李義之父言之也丈人領宗卿洙曰宗正卿也肅穆古制敦馬曰肅穆欽和貌古制敦謂敦厚宗族也補注鶴曰唐宗室世系表道國之後為宗正卿者有二曰徴曰諫未詳義之父為誰又道王元慶傳云有九子先朝納諫諍馬曰先朝指太宗也直氣横乾坤子建文章壮河間經術存洙曰曹子建能文漢河間王能明於經術獻禮樂建三雝之教温克冨詩禮補注希曰温一本作爾骨清慮不喧洗然遇知己談論淮湖奔洙曰言談論鋒起若淮湖奔狂不可涯涘也蘇曰梁衡曰見王戎談論如淮湖傾注源流莫可擬此而測掩也憶昔初見時小襦洙曰一作孺繡芳蓀洙曰文選芳蓀紫綺為上􅃭􅃭袴也趙曰自經術存而下皆言李義􅃭短衣也賈誼過秦論云寒者利短褐注曰一作短小襦舊注妄添文選五言詩為七字云芳蓀紫綺為上􅃭何輒附㑹如此補注鶴曰霍光傳璧珠璣王衣師古曰漢儀注以玉為襦如鎧状連綴之以黄金為縷匈奴服傳繡袷綺衣長襦錦袍各一叙傳在於綺襦紈袴之間晉灼曰綺之襦氷紈之袴也並貴戚子弟之服觀此則襦不可以為袴又百姓歌亷范曰平生無襦今五袴則襦下於袴也楚辭湘君注蓀芳草當是繡芳蓀於襦上如繡袷也長成忽㑹面慰我久疾魂三峽春冬交江山雲霧昏正宜且聚集恨此當離樽莫怪執盃遲我衰涕唾煩洙曰王仲宣詩盃行遲解嘲涕唾流珠沫趙曰舉盃怪我獨執之遲葢以涕唾煩故也舊注引但訝盃行遲却是訢主人行盃之遲耳何干此義重問子何之西上岷江源洙曰順流為㳂逆流為泝自䕫入蜀泝流也故曰西上願子少干謁蜀都足戎軒誤失將帥意不如親故恩洙曰甫幾不能脱嚴武之暴又為郭英乂所不容有是句少年早歸來梅花巳飛翻努力慎風水洙曰言世苦風波也趙曰舟行之所當慎也豈惟數盃飱猛虎卧在岸蛟螭出無痕洙曰言所在皆害人者也此皆譏時王子自愛惜老夫困石根生别古所嗟發聲為爾吞洙曰王子稱李義也困石根言得其地也吞聲言聲出而復吞也送髙司直尋封閬州大厯二年作補注鶴曰司直大理寺官後魏永安三年髙穆奏置司直十人覆理御史檢核事唐制六人寺有疑讞則叅議之詩云萬里長江邊邂逅一相遇又云西謁巴中侯當是在䕫州作梁權道編在大厯三年然詩又云㐲枕聞别離疇能忍漂寓是年正月公出峽未嘗言病意是大厯二年觀老病山裏之詩與小園散病諸作可知也丹雀銜書來洙曰文王之時赤雀銜書集于周社暮棲何鄉樹驊騮事天子辛苦在道路洙曰丹雀異也驊騮駿也言駿異處非其位趙曰尚書中侯曰赤雀丹書入豐止于昌前昌拜稽首受之舊注模稜所引非是驊騮事列子周穆王駕八駿之乗有曰右服驊騮此言髙司置通籍事主故以丹雀之於文王驊騮之於穆王比之司直非冗官荒山甚無趣洙曰司直華選也而在荒山此所以無趣借問泛舟人胡為入雲霧與子姻婭間既親亦有故洙曰姻婭猶言姻聨也詩𤨏𤨏姻婭非特親也又有舊故萬里長江邊邂逅一相遇洙曰邂逅言不期而遇也長卿消渴冄公幹沉綿屢洙曰長卿相如也病渇劉公幹詩余嬰沉痼疾竄身清㢓濵趙曰公自言其病與相如公幹同清談慰老夫開巻得佳句時見文章士蘇曰枚叔見司馬犬子逺寄詩喜而謂室家曰不意開巻得此佳句瓊瑰南金不足貴也欣然淡情素伏枕聞别離疇能忍漂寓良㑹苦短促溪行水奔注熊羆咆空林蘇曰古詩熊羆呼林寒言小人得志自肆之意也游子慎馳騖西謁巴中侯洙曰閬為巴中趙曰巴中侯則封閬州也官艱險則髙君之不憚逺如此艱險如跬歩師曰半歩曰跬巴蜀路險難行故云如跬歩主人不世才先帝常特顧洙曰主人巴中侯也㧞為天軍佐洙曰天軍禁軍也趙曰必嘗佐禁旅之任崇大王法度師曰主人指巴中侯𤣥宗常擢之為禁軍副將持軍整肅故云崇大王法度淮海生清風南翁尚思慕趙曰言淮海則必為楊州等處官南公者南方之老人也師曰南翁甫自稱以留滯於南方也補注希曰漢天文志虛危南有羽林天軍在唐有天武健兒神武天竒亦以此為天軍耶南翁即如項羽傳所謂南公趙注南方之老人者乃服䖍云公宫造廣厦木石乃無數趙曰建廣厦於官府者也凡官府貴處謂之公宫左傳構其公宫舊注謂幕府方須才不知此乃述封閬州事非指髙司直也師曰言天子正再造王室人材雖多一柱尚未用盖言房琯見貶閬州訓練征戌之兵故甫託司直以勞問之初聞伐松栢猶卧天一柱趙曰此言廊廟之具矣非封閬州不足以當之神異經云崑崙有銅柱焉其髙入天所謂天柱也我瘦洙曰一作病書不成蘇曰郭䞇久疾書不成欹傾倒側經月自讀亦不能識何况兒童搭䢸成字讀亦誤為我問故人勞心練征戌洙曰此詩觀末章則閬州是房琯也趙曰故人指封閬州也遣懐大厯元年作補注鶴曰詩云係舟卧荆巫當是在䕫州作詩又云亂離朋友盡合㳫嵗月徂吾衰将焉託存歿再嗚呼盖此詩言昔與髙適李白同逰吹臺今二公盡去世而公獨在盖李白以寶應元年卒而髙適今又以永泰元年卒故曰存殁再嗚呼此當是大厯元年作故曰係舟卧荆巫昔我逰宋中鄭曰宋州也禹貢豫州城秦改為梁國漢文帝封子民為梁王於曜陽置宋州惟梁孝王都洙曰宋即古大梁也名今陳留亞洙曰陳留屬汴州也劇則貝魏俱洙曰貝魏州名在河西劇大也邑中九萬家髙棟照通衢舟車半天下主客多歡娯趙曰主則本處人客則浮寄者補注鶴曰唐志云宋州本梁郡天寳元年更名户十二萬四千有竒舊史云舊領縣七戸一萬一千三百天寶領縣十户一十二萬四千二百有竒而今稱邑中九萬家何九也本朝九域志作於哲宗其時主戸六萬五千四百十客戸二萬五千八百四十共亦不過九萬又云孝王有大功景帝為之廣睢陽大治宫室制度法長安自應棟宇之美主客盖指主户客戸而言未必分本處與游寄而言也白刃讐不義黄金傾有無殺人紅塵裏報答在斯湏洙曰言多豪傑也文三王傳梁孝王武始立為代王四年徙為淮陽王十二年因梁懐王揖入朝墮馬死無子國除遂徙王梁後七國反梁王城守睢陽梁最為大國居天下膏腴地北界秦山西至髙陽趙曰鮑明逺詩失意杯酒間白刃起相讐憶與髙李軰髙適李白論交入酒壚師曰甫昔與適白嘗逰此酒壚埋甖於地也相如滌器文君當壚也兩公壮藻思得我色敷腴洙曰世説王濬仲為尚書令着公服乗軺經黄公酒壚中過顧謂後車客曰吾昔與稽叔夜阮嗣宗共酣飲此壚竹林之逰亦預其末自嵇天亡阮亦亡便為時所羇紲今日視此雖近邈若山河兩公李髙也言李髙得我而後惟悦故敷腴也氣酣登吹一作文臺懐古視平蕪洙曰吹臺梁王歌臺也今謂之繁臺鄭曰在開封縣南五里蘇曰新唐本傳云甫與李白髙適過汴州酒酣登吹臺慷慨懐古人莫能測盖謂此也補注希曰唐子西平臺賦序云平臺梁王劉武作也班史稱平臺唐稱吹臺世以謝靈運嘗為雪賦則又謂之雪臺舊説在大梁城東北如淳晉灼云大梁城東二十里今在城東南葢漢距今千嵗城郭凡幾變則聞見之異宜哉九沐域志云吹臺即繁臺本師曠吹臺梁孝王増築在今州與新史所謂甫與李白髙適過沐州酒酣登吹臺合公昔逰詩云昔者髙與李晚登单父臺寒蕪際碣石萬里風雲來盖懐古而視之也芒碭雲一去鴈鶩空相呼洙曰前漢髙祖隠於芒碭山澤間吕后與人俱求常得之髙祖怪問后曰季所居上常有雲氣故從徃常得季人去乃人亡也不欲指言之爾人亡鴈鶩相呼師曰謂懐古也先帝正好武師曰先帝謂𤣥宗好事邊功也寰海未凋枯洙曰言方盛之時也猛將収西域長㦸破林胡洙曰𤣥宗之時開拓境土如安禄山王君毚張守珪王忠嗣輩皆以邊功為巳任故張説獻鬬牛以箴之而上不之改百萬攻一城獻㨗不云輸趙曰攻取豈無勝負耶但獻㨗而已未嘗言輸而不勝組練弃如泥洙曰呉人大破楚軍楚之免者惟組練三百而已組組甲練被練也尺土負一作勝百夫趙曰爭一尺之土以百夫為償則不惜人之命拓境功未巳元和辭大鑪洙曰謂政失其平和矣繼有安史之亂趙曰莊子曰吾將以天地為大鑪亂離朋友盡合㳫嵗月徂晁曰合㳫相繼貌吾衰將焉託存沒冄嗚呼蕭條益堪愧獨在天一隅洙曰一云蕭條疾益甚愧獨天一隅乗黄已去矣凡馬徒區區洙曰乗黄駿馬也喻賢者凡馬喻常才蘇曰古駿馬行飛黄汗血已去矣駑駘凡馬徒區區補注鶴曰詩正義云黄騂曰黄謂黄而騂色又唐百官志尚乗局奉御二人直長十人掌内外閑廐之馬左右六閑一曰飛乗不復有顔鮑洙曰顔延年鮑明逺常作荆州叅軍作蕪城賦以諷宋臨海王又比髙李二公繫舟卧荆巫洙曰荆州巫峽也鄭曰在白帝城及南郡臨餐吐更食常恐違撫孤趙曰盖恐違戻撫養髙李二公之孤也此其為朋友之義君不見簡蘇徯大厯元年作補注鶴曰蘇徯嘗入湖南之幕公既有詩别之又有送蘇徯兵曹適桂州詩云早作諸侯客則徯在大厯初摧頺為甚故此詩以拆桐喻之梁權道編此與後一篇同在大厯三年而别蘇徯詩乃在元年今以後篇贈蘇徯考當在元年君不見道邊廢弃池君不見前者摧折桐百年死樹中琴瑟洙曰蔡邕取㸑下桐為琴趙曰異苑載呉平在勾章州門外忽生一株桐上有謡歌之聲平惡而斫其後桐自遷立於故根上又聞歌聲曰死樹今更青呉平尋當歸桐林所以為琴瑟今言死樹猶可為之譬士終有用也舊注所引非一斛舊水蔵蛟龍洙曰積水成淵蛟龍生焉丈夫盖棺事始定洙曰古詩盖棺事乃巳言死而後已也蘇曰劉毅曰丈夫兒縱跡不可尋常便混羣小中盖棺事方定矣補注希曰韓詩外傳學而不已闔棺乃止君今幸未成老翁趙曰魏文帝與吴質書云已成老翁但未白頭耳何恨憔悴在山中深山窮谷不可處霹靂魍魎兼并困狂風蘇曰鮑休清溪賦霹靂破石狂風驚林贈蘇徯大厯元年作補注鶴曰詩云巴蜀倦剽刼幽薊已削平當是大厯元年作剽刼指崔旰之徒為亂是時河北盡平故也蘇徯自蜀赴湖南公有别蘇徯赴湖南幕詩乃同時作故此詩亦云君今下荆楊獨㠶如飛鴻梁權道編在大厯三年恐非異縣昔同逰各云厭轉蓬洙曰古詩為客若轉蓬言如蓬之隨風無所定止也别離巳五年尚在行李中洙曰左傳秦晉圉鄭燭之武夜見秦伯曰若舍鄭以為東道主行李之徃來供其困乏注行李使人戎馬日衰息乗輿安九重洙曰天子之門九重乗輿天子所乗輿時京師初復天下漸平也趙曰以車駕嘗因吐蕃䧟京師而幸陜今稍平定復還長安為九重之安矣補注鶴曰戎馬衰息非謂復京師天下漸平也且廣徳元年復京師之後無嵗無吐蕃黨項𦍑渾奴剌之禍至永泰元年僕固懐恩誘囘紇吐蕃吐谷渾黨項奴剌數十萬衆俱入㓂京城震恐十月郭子儀與囘紇再定約吐蕃引兵夜遁京師解嚴自是戎馬始少息此詩作於大歴元年故云黄庭經坐在金臺城九重後以喻天子之門亦如楚辭所謂九闗有才何棲棲將老委所窮趙曰公毎自負矣故不以言才為嫌微生畆云某何為是棲棲者歟為郎未為賤洙曰徯為宣義郎子美檢校工部員外郎非以階官也後篇云雖為尚書郎可證矣其奈疾病攻子何靣䵩黒焉得豁心胷趙曰指言蘇徯也列子云靣目䵩黒巴蜀倦剽刼下愚成土風洙曰崔旰之亂也幽薊已削平洙曰禄山所節鎮處也荒徼尚彎弓洙曰時思明未平趙曰安史之亂雖已削平而猶有盜賊也補注鶴曰王注既以巴蜀剽刼為崔旰之亂又云時思明未平何不考之甚也廣徳元年史朝義已縊死矣安得思明尚未平巴蜀之亂非一五年之間叚子璋徐如道崔旰之變相繼而盜賊隨起安得不倦於剽刼真是下愚習以為風也斯人脱身來豈非吾道東洙曰後漢鄭𤣥學於馬融辭歸融謂門人曰鄭生今去吾道東矣乾坤雖寛大所適装囊空肉食哂菜色少壯欺老翁蘇曰吕安謂嵇康曰我輩稍有菜色反為肉食輩所哂徒知其外而不知内也周澤謂諸齊郎曰若年少壯不可欺老翁翁胷中有書萬餘巻若輩未到此田地諸人皆慚悚無一語對况乃主客間古來偪側同君今下荆揚獨帆如飛鴻二州豪俠場人馬皆自雄一請甘飢寒冄請甘養䝉洙曰養䝉欲其晦迹以自全也寄薛三郎中大厯二年作補注鶴曰詩云峽中一卧病瘧癘終冬春春復加肺氣又云我未下瞿塘空念禹功勤髙秋却束帶鼔柁視清旻當是大厯二年人生無賢愚飄颻若埃塵蘇曰丁固人生無賢與愚百年之後俱成糞壤又黄玘利名聚散若風中埃塵去來不足校輕重自非得神仙誰免危其身與子俱白頭役役洙曰一云沒沒常苦辛雖為尚書郎不及村野人憶昔村野人蘇曰馬融曰我輩仕途不及村野之人雞豚社飲足以自樂我輩區區塵土豈有此况味其樂難具陳趙曰一云歡樂難具陳藹藹桑麻交公侯為等倫天未厭戎馬我輩本常貧子尚客荆州我亦滯江濵峽中一卧病瘧癘終冬春春復加肺氣此病葢有因早嵗與蘇鄭洙曰蘇鄭蘇源明鄭䖍是也痛飲情相親二公化為土嗜酒不失真洙曰蘇鄭亦皆嗜酒予今委脩短豈得恨命屯聞子心甚壯所過信席珍洙曰席珍席上之珍也上馬不用扶毎洙曰一作思扶必怒嗔賦詩賔客間揮灑動八垠乃知葢代手洙曰可葢覆當代也漢書功業葢代蘇曰李宻葢代手段不可容易施呈也才力老益神青草洞庭湖洙曰青草洞庭皆湖名也鄭曰二湖俱在巴陵東浮滄海漘君山可避暑洙曰君山在洞庭湖心况足采白蘋子豈無扁舟徃復江漢津我未下瞿塘空念禹功洙曰又作禹力勤聽説松門峽吐藥攬衣巾趙曰聞松門峽之美則方喫藥而吐之遽攬衣巾思去鄭曰松門峽巴中地名髙秋却束帶鼓枻視清旻鳯池日澄碧濟濟多士新餘病不能起健者勿逡廵趙曰健者薛璩也紹勃然曰天下健者豈惟董公上有明哲君下有行化臣洙曰行化臣謂承流宣化之大臣也大覺髙僧蘭若大厯四年作楷曰和尚去冬徃湖南若爾者切補注鶴曰詩云巫山不見廬山逺當是在湖南作而梁權道編在大厯二年䕫州詩内若在䕫州作何以言巫山不見詩又云香爐峯色隠晴湖雖廬山有香爐峰而衡岳亦有之唐志武宗即位廢浮圖法天下毁寺四千六百招提蘭若四萬然則蘭若殆小於寺者有髙僧傳續髙僧傳載僧之徳行髙者大厯四年作巫山不見廬山逺趙曰廬公惠逺也松林蘭若秋風晩洙曰蘭若寺也一云蘭蘭草也若杜若也修可曰釋氏要覽曰蘭若者梵言阿蘭若唐言無諍囘分律云空静處薩婆多論云閑静處智度論云逺離處大悲經云阿蘭若者離諸忽務故數説不同其實無諍也注以為蘭草與杜若非也一老猶鳴日暮鍾諸僧尚乞齊時飯補注希曰楞嚴經云食辨擊鼓衆集撞鍾又毗羅三昧經云佛為法惠菩薩説四食時一旦時為天食二午時為法食時佛斷六趣因令問三世佛故制日午為法食正時也僧祇律云午時日影過一髪一瞬即非時也又起因世經佛教過中不食為齊又晉書佛圖澄齋時至流水側従腹旁孔中引臟腑洗之香爐峯色隠晴湖洙曰香爐峯廬山之勝境也勢如香爐上有飛泉趙曰逺法師廬山記曰東南有香爐上孤峯秀起種杏仙家近白榆洙曰神仙董奉居廬山治病重者種杏五株輕者一株號董仙杏林趙曰近白榆言其所居之髙近乎星辰也古詩曰天上何所有歴歴種白榆飛錫去年啼邑子洙曰髙僧傳有飛錫而赴齋者定功曰要覧又云昔髙僧隠峯逰五臺出淮西擲錫飛空而徃西天比丘持錫有二十五威儀凡室中不得着地必掛於壁牙故釋子稱逰行僧為飛錫安住僧為掛錫孫綽天台賦云應真飛錫以躡虚趙曰言其去冬徃湖南也注云得真道之人執錫杖而行於虗空故云飛也邑子同邑之子也補注希曰尹翁歸傳于定國欲屬託邑子兩人獻花何日許門徒洙曰髙僧傳僧有戒行嚴㓗天女來獻花趙曰後分經載釋伽為靜慧仙人時獻五蓮花於燃燈佛此獻花之祖也其在佛僧則謂諸弟子之來從者為門徒也補注杜詩巻十四
