body:
  text: 補注杜詩巻三十宋黃希原本黃鶴補注灧澦大厯二年作補注鶴曰此詩言水漲故曰灔澦既没孤根深按舊史大厯二年河東河南江浙淮南福建等道五十五州奏水災蜀雖不預宜亦水髙當是其年作灧澦既没孤根深洙曰灧澦如馬瞿塘莫下灧澦如象瞿塘莫上此峽人以灔澦為水候也既没則尤漲不可下矣西來水多愁太隂洙曰言隂氣太盛也江天漠漠鳥雙去風雨時時龍一吟舟人漁子謌迴首洙曰海賦舟人漁子江賦蘆人漁子估客胡商淚滿襟蘇曰南海有烈婦夫戰死行哭水畔胡商賈客見之皆泣下遂投水而死今有廟焉劉非熊作記予親見灧澦寄語舟航惡年少休翻鹽井橫洙曰一作擲鄭曰横戸孟切不以理也黃金洙曰蜀都家有鹽井之泉補注希曰南史何妃傳楊郎好少年鶴曰昭帝紀發三輔及郡國惡少年屯遼東師古曰惡少年謂無賴子弟也蜀多鹽井而䕫亦有之見前注白帝大厯元年秋作補注鶴曰詩云戎馬不如歸馬逸千家今有百家存當是指崔旰之亂大厯元年秋作白帝城中雲出門趙曰謝靈運詩岩髙雲若屯舊作雲出門無義白帝城下雨翻盆洙曰雲行雨施爾翻盆言其勢之暴也髙江急峽雷霆鬬江為峽所束故波聲若雷霆也翠洙曰一作古木長藤日月昏戎洙曰一作去馬不如歸馬逸千家今有百洙曰一作十家存洙曰言殘敝也哀哀寡婦誅求盡慟哭秋原何處村洙曰時征役並興民死於役故多寡婦也暴賦横斂故多誅求也此言軍旅之際民不聊生如此黃草廣徳元年作鄭曰峽中記三峽劍側多黄草生虎豹資之故云補注鶴曰詩云聞道松州已被圍按舊史廣徳元年十二月吐蕃陷松州維州而今詩云被圍則是作於其年秋是時公在梓閬不應言錦水殆是因兵戈而思成都故云詩又云黃草峽西船不歸赤甲山下行人稀者亦是因山南之亂而言非公在䕫作也舊次非詳見注黃草峽西船不歸赤甲山下行人稀趙曰舊作少人稀惟蔡伯世本作人行稀是黃草峽在涪州峽之西則蜀中矣言水行之船不歸陸行之人稀少此所以致疑道路之梗塞也秦中驛使無消息蜀道兵戈有是非趙曰望秦中之驛使則無消息聞蜀道之兵戈或是或非未敢必料也蔡伯世曰是時蜀中多故冬日詩公自注曰傳聞官軍自圍普遂可見之矣鮑曰崔寧之亂郭英乂犯寧家室寧逐之是也以大義責之則寧以偏禆逐大將非也補注鶴曰寰宇記赤甲城在䕫州而黄草峽在涪州涪䕫皆唐山南道乾元元年來填與山南東道防禦使裴茂戰於縠水明年廣徳元年山南兵馬使梁崇義以來填誅自鄧州勒衆還襄州殺李昭薛南陽脅制衆心是時䕫涪水陸之道不通故云船不歸行人稀也秦中驛使謂使吐蕃者通鑑寳應元年建寅月吐蕃遣使請和廣徳元年四月遣御史大夫李之芳等使於吐蕃為虜所留二年乃得歸故曰無消息蜀道兵戈謂段子璋寳應元年反徐知道乾元元年反鮑注非萬里秋風吹錦水洙曰成都記濯錦江秦相張儀所作笮橋東下枕水舊錦里勝基趾由在此水濯錦即鮮明它水不得太原公濬而闢之堅其岸而疎大之澄而陽之水居者以虹橋跨水綵畫相鮮誰家别淚濕羅衣蘇曰王洎聞砧詩空閨少婦聽别淚滿羅衣莫愁劒閣終堪據蘇曰姜維曰劒閣堪據實蜀要路之處聞道松州已被圍洙曰松州在西山吐蕃之南鄙也蘇曰梁元帝解松州之圍趙曰勿謂劒閣之險可恃而欲割據雖松州在劒閣之内巳有圍之者矣此所以戒守土之臣也吹笛大厯二年作補注鶴曰詩云胡騎中宵堪北走趙注以為指史朝義按朝義之死在廣徳元年正月則梁權道不應編在大厯元年此當是指吐蕃而言按通鑑永泰元年吐蕃與迴紇入寇子儀免胄釋甲投鎗而進迴紇酋長皆下馬羅拜子儀責之云云再成和約吐蕃聞之夜引兵遁去故當在大厯元年作吹笛秋山風月清誰家巧作斷腸聲洙曰鮑明逺離聲斷客情又逰子心腸斷蘇曰阮晟聞笛曰客中月夜聞此聲韻使人腸斷風飄律吕相和切洙曰馬融笛賦律吕既和哀聲互降月傍闗山幾處明洙曰向秀月夜聞笛遂作懷舊賦胡騎中宵堪北走洙曰言笛聲怨切能動鄉思胡人聞之當北走矣師曰晉劉琨為并州刺史常為胡騎所圍琨乗月登樓清嘯賊聞之長嘆中夜吹胡笳則又有流涕嘘欷有懐土之思遂棄圍而去笳胡笛也武陵一曲想南征洙曰王徽之聞桓伊善笛一日相逢於江次謂伊曰聞君善笛請為我一弄伊已貴顯素聞徽之名便為據胡床三弄而去賓主竟不言伊為南征將軍故園楊栁今搖一作摧落何得愁中却盡生蘇曰桓伊善笛撰折楊栁尤盡巧妙後人不能盡其指訣垂白一云白首作大厯元年秋補注鶴曰詩云垂白馮唐老當是廣徳二年為工部員外郎後作又云江喧長少睡樓逈獨移時當是大厯元年秋在䕫州作盖廣徳二年秋在嚴公幕中永泰元年秋在雲安皆未甞樓居唯大厯元年在䕫州居西閣垂白馮唐老洙曰見名慙白首郎注補注希曰杜周傳老姊垂白師古曰言白髮下垂也清秋宋玉悲趙曰見宋玉九辯云悲哉秋之為氣也江喧長少睡樓逈獨移時多難乃旦切身何補無家病不辭趙曰公攜妻奴入蜀而今云無家豈専以故鄉為家者乎甘従千日醉洙曰中山有酒飲者一醉千日元石飲之千日乃醒未許七哀詩師曰曹子建等七哀詩云七哀謂痛而哀義而哀感而哀怨而哀耳目見聞而哀口嘆而哀鼻酸而哀子建謂漢末征役别離婦人哀歎故賦此詩仲宣則哀漢室之亂孟陽則前哀人事之遷變後哀王室之漸亂故其題皆曰七哀草閤大厯二年秋作補注鶴曰草閤當在瀼西東屯間故云柴扉永不闗又云泛舟慙小婦乃大厯二年秋作草閤臨無地洙曰頭陀寺碑飛閤逶迤下臨無地柴扉永不關洙曰范彦龍有客欵柴扉陶潛門雖設而常關魚龍迴夜水洙曰見水落魚龍夜注竊觀水落魚龍夜自是隴右有魚龍川也恐此魚龍非矣田曰正謬云此詩乃䕫州所作曰舊注於下云隴豈可言秦之魚龍川乎按酈道元水經魚龍以秋日為夜龍秋分而降蟄寢於淵故以秋日為夜也星月動秋山師曰子美言魚龍夜水魚龍寂寞秋江冷也漢武故事曰東方朔曰星辰動搖民勞之應久洙曰一作夕露晴洙曰一作清初濕髙雲薄未還泛舟慙小婦飄泊損紅顔江月大厯元年作補注鶴曰詩云江月光於水髙樓思殺人當是大厯元年在䕫州西閤作江月光如水髙樓思殺人思息吏切洙曰庾肩吾月詩樓上徘徊月忩中愁殺人天邊長作客老去一霑巾洙曰見月而感流落也補注思去聲與江漢思歸客同作亦當是去聲玉露團清影洙曰謝恵連團團滿葉露銀河没半輪洙曰公月詩云不隨銀漢落亦伴玉繩横誰家挑錦字洙曰别賦織錦曲兮泣已盡迴文詩兮影獨傷注織錦為迴文詩以寄逺燭滅洙曰一作滅燭翠眉嚬蘇曰鮑明逺古樂府空閨燭初滅撫懐嚬翠眉洞房大厯元年作補注鶴曰自此詩至鬭雞四篇皆因明皇升遐而感傷之案明皇以廣徳元年三月葬泰陵今詩云園陵白露中則是廣徳元年後作而鬬雞詩云仙逰終一閟女樂久無香則去葬年為逺矣梁權道編在大厯元年恐是洞房環珮冷玉殿起秋風蘇曰楊妃過温湯行云玉殿空掩扉秋風動琪樹昔日繁華事盡逐流波去介甫永叔俱稱絶題趙曰此篇思長安而懐帝闕也楚辭修容修態亘洞房補注希曰三輔黄圖有大玉堂小玉堂殿今謂玉殿其本於此秦地應新月龍池滿舊宫洙曰興慶宫明皇潛龍之地也有龍池在焉繫舟今夜逺清漏往時同洙曰漏聲依舊也萬里黃山北園陵白露中洙曰東方朔㣲行始北至池陽西至黃山晉灼曰宫名在槐里趙曰按傳云唐帝㣲行而至黄山盖右扶風槐里縣有黃山宫補注希曰漢宣帝王后傳合葬杜陵稱東園師古曰雖同塋兆而别為墳王后陵次宣帝陵東故曰東園宿昔洙曰詠天寳中事也補注鶴曰詩云落日畱王母㣲風倚少兒盖指貴妃與諸姨也宿昔青門裏逸曰青門京城東門蓬萊仗數移數色角切逸曰蓬萊殿名補注鶴曰元獨有蓬萊殿盖有蓬萊宫龍朔二年高宗置仗朝㑹之仗三衛畨上分為五仗花驕迎雜樹洙曰天寳中最重木芍藥羣花不可比其貴盛趙曰言雜樹之花則如桃李之屬沈約望春詩春風搖雜樹龍喜出平池洙曰栁芳傳信記云天寳中興慶宫小龍常游於宫垣南溝水中落日畱王母洙曰漢武帝内傳云西王母與上元夫人降帝美容貌神仙人也㣲風倚少兒趙曰王母以言楊貴妃少兒以言妃之諸姨矣少兒則衛少兒也宫中行樂袐夢符曰按前漢書周仁為人隂重不泄得幸入卧内於後宫袐戯仁常在旁終無言少有外人知能畫補注鶴曰詩云能畫毛延夀投壺郭舍人毛與郭皆漢人公托以喻明皇為技巧所移能畫毛延夀洙曰西京雜記杜陵畫工毛延夀善為人形醜好老少必得其真補注希曰毛延夀即畫王嬙者昭帝以延夀畫昭君不實遂殺之投壺郭舍人洙曰西京雜記武帝時郭舍人善投壺以竹為矢不用棘也能激矢令還一矢百餘反謂之驍言如博之竪於軰中為驍傑也每為武帝投壺輒賜金帛也每䝉天一笑修可曰太平御覽載神異傳曰東王公與玉女投壺設而不接天為之笑開口流光今電是也師曰元宗時承平日久驕逸遂生百技皆能感動帝意詩故云云復似物皆春補注希曰一本作復似物初春此二句盖接能畫投壺而言政化平如水洙曰言無偏陂也皇恩斷若神洙曰言不可測也時時用抵戱亦未雜風塵洙曰抵戯謂角抵也今兩兩相當角力量其技爾趙曰言至用抵戱而止不甚雜民俗之風塵事也補注鶴曰西域傳作巴渝漫衍海中碭極漫衍魚龍角抵之戯鬭雞鮑曰東城父老傳云明皇以乙酉生而喜鬬雞兆亂之象也補注鶴曰明皇好鬭雞又教舞四百蹄及於梨園自教法曲必盡其妙故詩言鬭雞舞馬女樂而終有寂寞驪山道清秋草木黃之句盖致感傷意也鬭雞初賜錦洙曰楊妃外傳云國忠始以鬬雞供奉趙曰明皇好鬬雞有覃昌者以善養雞䝉寵當時為之歌曰生兒不用識文字鬭雞走馬勝讀書賈家小兒年十三富貴榮華代不如惟此則賜錦可知矣舊所引國忠事皆妄舞馬既登牀洙曰既一作解明皇常令教舞四百蹄目之為某家驕其曲謂之傾盃樂奮首鼔尾無不應節又施三層木牀乗馬於上抃轉如飛命壯士舉馬舞於榻上安祿山亂馬散落人間田承嗣得之一日軍中大享馬聞樂而舞承嗣以為妖而殺之簾下宫人出樓前御栁洙曰一作曲長仙遊終一閟女樂久無香洙曰謂祿山亂天子出幸女樂流散也趙曰仙遊言明皇上昇矣宜女樂之久無香也寂寞驪山道清秋草木黃洙曰言不復行幸也定功曰傷嘆之也秋風辭曰草木黃落兮雁南飛鸚鵡大厯元年作魯曰一云翦羽注皆是禰衡賦補注鶴曰此詩句句含不遇之意公盖託以自况梁權道編在大厯元年䕫州詩内真䕫州所作也鸚鵡含愁思聰明憶别離洙曰禰衡賦性辯而能言才聰明以識機也翠衿渾短盡紅嘴謾多知洙曰紺趾丹嘴綠衣翠衿未有開籠日洙曰閉以彫籠剪其翅羽鷦鷯賦鸚鵡慧而入籠空殘宿舊枝洙曰想昆山之高峻思鄧林之故枝世人憐復損何用羽毛竒洙曰雖同族於毛羽故殊智而異心歴歴大厯元年作補注鶴曰詩云巫峽西江外又云為郎從白首卧病數秋天當是大厯元年䕫州作歴歴開元事分明在眼前洙曰開元太平之事也無端賊盜起忽已嵗時遷巫峽西江外趙曰蜀江從西來故謂之西江秦城北斗邊為郎従白首夢符曰按後漢張衡思元賦尉尨眉而郎潛兮逮三世而遘武注尉謂都尉顔駟也尨蒼雜色也遘遇也漢武故事曰上至郎署見一老郎鬂皓白問何時為郎何其老也對曰臣姓顔名駟以文帝為郎文帝好文而臣好武景帝好老而臣尚少陛下好少臣巳老是以三葉不遇也上感其言擢為㑹稽都尉趙曰懐長安也長安城謂之北斗城卧病數秋天江上大厯元年作補注鶴曰詩云江上日多雨蕭蕭荆楚秋當是大厯元年䕫州作䕫古荆州之域又後為楚地也江上日多雨蕭蕭荆楚秋髙風下木葉洙曰洞庭波兮木葉下永夜攬貂裘洙曰蘇季子不得用而貂裘敝勲業頻看鏡洙曰惜其功名未遂而身老也修可曰庾信詠懐詩云匣中取明鏡披圖自照看行藏獨倚樓趙曰所以念深矣時危思報主衰謝不能休中夜大厯二年作補注鶴曰詩云髙堂戰伐塵又云胡雛負恩澤盖謂大厯二年吐蕃入寇當於其年詳見注中夜江山静危樓望北辰長為萬里客有愧百年身洙曰鮑明逺争先萬里途各事百年身蘇曰孔融中夜不寐翻覆生計無補於世有愧百年身後之名取羞於子孫故國風雲氣洙曰顔延年故國多喬木空城凝塞雲史記風雲天之客氣者也髙堂戰伐塵胡雛負恩澤嗟爾太平人趙曰當時史朝義之亂未除而公興感亂階自祿山也洙曰明皇嘗寵祿山坐於金雞障下肅宗以為言上曰胡有異相吾厭之師曰望北辰言思君也雲從龍風從虎喻君臣㑹聚子美家京城今客萬里之逺故望風雲之氣有所感傷也補注鶴曰公作泛溪詩云落景下髙堂作南溪詩云髙堂亦明神作䕫州絶句云閬風元圃與蓬萊中有髙堂天下無則髙堂是西方之地名兹云髙堂戰伐塵者乃指吐蕃入寇胡雛當是指吐蕃也唐甞以公主和親其恩澤不為不厚而吐蕃負恩入寇故云江漢大厯二年作補注鶴曰詩云江漢思歸客又云秋風病欲蘇當是大厯二年䕫州作江漢思歸客乾坤一腐儒余曰古今詩話云楊大年不喜杜詩謂之村夫子有鄉人以杜詩强大年不服因曰公試為我續江漢思歸客一句大年亦為屬對鄉人曰乾坤一腐儒大年似少屈片雲天共逺永夜月同孤落日心猶壯秋風病欲蘇古來存老馬不必取長途洙曰田子方出見老馬於道而問焉其御曰故公家畜也子方以束帛贖之窮士歸心趙曰韓子曰管仲隰朋從威公伐孤竹迷道管仲曰老馬之智可用也乃放老馬而遂之遂得道焉公之意自比於老馬雖不能取長途而猶可以知道解惑也洛陽大厯元年作補注鶴曰此詩非言洛陽事而題曰洛陽盖其初無題第取首二字而云其前如灧澦至江漢其後如驪山至吾宗皆此類也當在䕫州作大厯元年洛陽昔陷没胡馬犯潼闗洙曰祿山先陷東都乗勝犯闗趙曰天寳十四載祿山陷東京所謂洛陽也次年遂陷潼闗天子初愁思都人慘别顔清笳去宫闕翠盖出闗山洙曰幸蜀也故老仍流涕龍髯幸再攀趙曰黄帝鼎既成垂龍胡髯而上迎羣臣從上七十餘人餘小臣不得上乃悉持龍髯補注鶴曰流涕謂二聖還京時士庶涕泣者按舊史帝紀肅宗入長安士庶涕泣拜抃曰不圖今日復見吾君又上皇至自蜀士庶舞抃路側曰不圖今日再見二聖通鑑云上入西京百姓奉迎二十里不絶有泣者驪山大厯元年作補注鶴曰此為明皇升遐追紀當時事而言同是大厯元年作驪山絶望幸洙曰謂不復行幸也花萼罷登臨洙曰明皇友愛於上都建花萼相輝之樓為諸王燕集之地地下無朝燭洙曰陶潛幽室一已閉千年不復朝劉向傳秦始皇帝𦵏於驪山之阿下錮三泉上崇山墳石槨為游宫人膏為燈燭水銀為江海黄金為鳬雁趙曰朝音朝覲之朝凡朝在早則秉燭而朝今地幽閟無朝見之燭舊注誤以朝為晨朝失公本意師曰此句言元宗已仙去矣人間有賜金趙曰言王時所賜金有留在人間也鼎湖龍去逺洙曰見先帝弓劍逺注銀海鴈飛深趙曰何遜經孫氏陵詩云銀海終無浪金鳬㑹不飛萬嵗蓬萊日趙曰句似難解盖言天子如平日平時蓬萊殿中之日懸於殿今則懸在舊羽林中耳羽林謂今守䕶陵寢者長懸舊羽林洙曰蓬萊殿名也羽林星名漢有羽林軍補注鶴曰禮樂志芬樹羽林雲景杳冥師古曰言所樹羽葆其盛若林芬然衆多今言蓬萊殿惟有羽葆而明皇不見耳若以羽林為軍不可言懸提封大厯元年作補注鶴曰時吐蕃之亂雖未甚息而海内舉皆歸心故詩云莫慮犬羊侵同是大厯元年作提封漢天下洙曰東方朔傳提封頃畝師古曰亦謂提舉四方之内搃計其數也萬國尚同心洙曰民未有離徳也借問懸車守何如儉徳臨洙曰懸車束馬言至險也言以險為守莫若守之以儉徳也此呉起對魏文以在徳不在險以此時徴俊乂入洙曰言當搜賢以自輔也草竊洙曰一作莫慮犬羊侵洙曰犬羊戎狄也願戒兵猶火恩加四海深洙曰言用兵莫若以恩也左傳衆仲曰兵猶火也弗戢將自焚蘇曰陳羣皇恩溥加海岱白露大厯二年作補注鶴曰詩云圃開連石樹船渡入江溪又舊次在䕫州詩内當是大厯二年在瀼西往東屯作白露團甘子洙曰見玉露團清影注清晨散馬蹄洙曰鮑明逺附身散馬蹄圃開連石樹船渡入江溪憑几看魚樂洙曰莊子與恵子觀魚於濠梁而羨魚之樂也逥鞭急洙曰一作至鳥棲洙曰王正長鳥思棲故枝師曰逥鞭急者以日暮鳥棲林也漸知秋實美幽徑恐多蹊孟氏大厯二年作補注鶴曰詩云孟氏好兄弟當是指孟十二倉曺與十四主簿乃大厯二年䕫州作公又有九月一日過孟倉曺主簿亦云來因孝友偏與此詩養親承顔等句合孟氏好兄弟養親唯小園洙曰為園以養親也承顔胝手足洙曰禹手足胼胝坐客强盤飱洙曰左傳盤飱寘璧負米力葵外洙曰子路負米趙曰致力以治葵也讀書秋樹根補注希曰南史史攸之言早知窮達有命恨不十年讀書今觀此詩知孟氏兄弟甘於負米力葵之窮不待十年而讀書又賢於攸之逺矣卜鄰慙近舍訓子學先門蘇曰一作誰門先門為孟母訓子擇鄰也吾宗大厯元年作衛倉曹崇簡補注鶴曰杜氏出祁姓帝堯裔孫劉累之後在周為唐杜氏成王滅唐以封弟叔虞改封唐氏子孫於杜城故稱唐使君為族弟按世系表崇簡出襄陽房為益州司馬參軍正與公同宗後有寄従孫崇簡詩而今詩又云吾宗老孫子以其非若唐使君之為同族故曰吾宗後詩在大厯二年作則今詩當是元年作吾宗老孫子質朴古人風耕鑿安時論衣冠與世同在家常早起蘇曰劉崑常早起治蔬圃自力桔槔憂國願年豐語及君臣際經書滿腹中趙曰言凡語論之間及於君臣之際必反覆議論用其腹中之書而證明之也第五弟豐獨在江左近三四載寂無消息覔便寄此二首大厯元年作補注鶴曰詩云十年朝夕淚衣袖不曽乾按公天寳十五載丙申避亂與諸弟相别至大厯元年丙午為十年當是其年在䕫州作故詩又云楚設闗城險亂後嗟吾在羈栖見汝難草黄騏驥病洙曰公以騏驥自託也蘇曰陳睃卧病梁杓過門曰霜勁草黄騏驥病矣駑駘何得快駛盖君子不得時小人自肆也少游一日來問曰細味工部詩皆拾古人句語綴補作詩平穩安帖若神施鬼設腹中幾個國子監耶予喜此談遂援筆記之沙晩鶺鴒寒趙曰詩鶺鴒在原兄弟急難楚設闗城險洙曰左傳屈桓對齊威曰君若以徳綏諸侯誰敢不服君若以力楚國方城以為城漢水以為池注言其險固也吳吞水府寛趙曰吳則江尤至吳而積水之多故云水府寛十年朝夕淚衣袖不曽乾聞汝依山寺杭州定越州趙曰趙正云五弟獨在江左不指名其州則亦傳聞而未審也風塵淹别日趙曰兵戈謂之風塵江漢失洙曰一作共清秋趙曰言我秋時在此而不見其弟為相失也影著啼猿樹趙曰公自言所在之處盧照鄰巫山髙云莫辨啼猿樹魂飄結蜃樓洙曰史海傍蜃氣象樓䑓趙曰指言弟豐所在之處故深思之也師曰陳藏器云車螯是大蛤一名蜃能吐氣為樓䑓明年下春水東盡白雲求趙曰所以成杭定越州之句巫峽敝廬奉贈侍御四舅别之澧朗大厯元年作補注鶴曰侍御舅之澧州朗州也題曰巫峽敝廬而詩云赤眉猶世亂則是在䕫州作時崔旴倡亂有乗時為盜者故云當在大厯元年作江城秋日落山鬼閉門中行李淹吾舅洙曰行李猶行使也誅茅問老翁屈原誅茅赤眉猶世亂洙曰光武平赤眉之亂青眼只途窮洙曰阮籍善為青白眼以白眼待俗客青眼待佳客傳語桃源客人今出處同師曰桃源在澧秦人避亂之所子美以今世之亂竄避荆楚亦與秦人同出處也溪上大厯二年作補注鶴曰詩云峽内淹留客溪邊四五家當是大厯二年秋在瀼西作古苕生迮地一本苕作苔峽内淹留客溪邊四五家古苕生迮洙曰一作濕鄭曰迮側格切迫也地秋竹隠疎花塞俗人無井洙曰峽俗多引泉或負水以自給山田飯有沙西江使船至時復問京華洙曰心未嘗忘王室也蘇曰王粲曰聞江西有使者船至煩問洛陽消耗樹間廣徳二年作補注鶴曰詩云岑寂雙甘樹婆娑一院香當是廣徳二年在成都府中作岑寂雙甘樹洙曰鮑明逺舞鶴賦去帝鄉之岑寂婆娑一院香補注希曰本草唐本注柚皮厚味甘不如橘皮薄味辛而苦酸者名胡甘爾雅釋凡木枝葉婆娑曰芪交柯低几杖垂實礙衣裳滿嵗如松碧趙曰言嵗寒如松也同時待菊黄幾迴霑葉露乗月坐胡床八月十五日夜月二首永泰元年作補注鶴曰按史永泰元年八月僕固懐恩及吐蕃迴紇黨項羌渾奴剌寇邊故有刁斗皆催曉之句是時公在雲安故詩又云稍近巫山峽猶銜白帝城梁權道編在大厯元年䕫州詩内然是年八月却無兵戈之擾不應詩又云張弓倚殘魄不獨漢家營後十六夜十七夜二篇非同時作滿目飛明鏡歸心折大刀洙曰古詩藳砧今何在山上復有山何當大刀頭破鏡飛上天謂殘月也趙曰延篤與李文徳書煥兮爛兮其滿目是也庾信磨鏡詩明鏡如曉月師曰唐吳兢樂府古題要解藳砧今何在砧砆也問夫何處也山上復有山重山為出字言夫出不在也何當大刀頭刀頭有環問夫何時還也破鏡飛上天言月半缺當還也歸心折大刀盖子美旅泊巫山中秋見月心念還歸耳題云八月十五夜月又言明鏡而不言破鏡即非殘月轉蓬行地逺趙曰公自謂也攀桂仰天髙趙曰言月中桂也劉安招隱士云攀桂枝兮長淹畱補注希曰選曺子建詩轉蓬離本根飄飄隨長風説苑魯哀侯棄國走齊齊侯曰君何年少棄國之早哀侯曰是猶亂蓬惡於本根而發於枝葉秋風一起根且拔矣趙以為公自謂豈非以公之困於遷逐而言乎然則公於詩中亦多用轉蓬字偶於此發公自傷之意耳水路疑霜雪林棲見羽毛此時瞻白兔直欲數秋毫洙曰月中有白兔以其明徹無所不照故可數秋毫矣蘓曰元典秋夜望月坐至中宵人問其久坐典曰仰瞻白兔直欲數其秋毫耳稍下巫山峽猶銜白帝城趙曰稍下猶銜言月也氣沈全浦暗輪側半樓明刁斗皆催曉刁丁聊切洙曰刁斗軍營中以警夜者補注鶴曰李廣傳不撃刁斗自衛孟康曰以銅作鐎晝炊飯食夜撃持行夜名曰刁斗蟾蜍且自傾洙曰張衡靈憲云夫月者衆隂之精積而成獸象蟾兔張弓倚殘魄不獨漢家營洙曰軍營有偃月名趙曰時與吐蕃交兵則張弓於夜皆倚曉月之殘魄不獨漢營為然虜營亦然也十六夜翫月大厯元年作補注鶴曰詩云巴童渾不語半夜有行舟䕫州古巴子國地公有諸葛廟詩云久逰巴子國是也然則此詩當在䕫作大厯元年舊挹金波爽洙曰前漢月穆穆以金波皆傳玉露秋闗山隨地闊秦曰謂故鄉逺也補注希曰公於月詩多用闗山字如曰闗山空自寒闗山同一照與此是也盖本樂府有闗山月又王褒詩闗山夜月明河漢近人流洙曰魏文帝仰看明月光天漢回西流秦曰謂䕫州地髙去河漢為近谷口樵歸唱孤城笛起愁巴童渾不寢半夜有行舟十七夜對月大厯二年作補注鶴曰詩云江村獨老身又云茅齋依橘柚當是大厯二年在瀼西作秋月仍圓夜江村獨老身捲簾還照客倚杖更隨人光射潛蚪動洙曰謝靈運潛蚪媚幽姿明翻宿鳥頻洙曰樂府月明星稀烏鵲南飛趙曰宿鳥字出文選言無定名舊引烏鵲南飛全不相干也茅齋依橘柚清切露華新傷秋大厯二年作補注鶴曰梁權道編在大厯元年䕫州詩内然是年無大兵戈於將軍思汗馬天子尚戎衣之句不協當是二年盖其年九月吐蕃寇靈州邠州京師戒嚴林僻來人少補注希曰林僻一本作村僻山長去鳥㣲髙秋收畫扇洙曰一云藏羽扇班姬詠扇詩常恐秋風至涼飈奪炎熱捐棄箧笥中恩情中道絶久客掩柴扉洙曰范彦龍云有客欵柴扉懶慢頭時櫛洙曰稽康書懶與慢相成艱難帶減圍洙曰謝惠連腰帶唯疇昔卜知今是非将軍思汗馬洙曰見収京詩注趙曰吐蕃未息天子尚戎衣洙曰見社稷一戎衣詩注白蔣風飈脆殷檉曉夜稀洙曰白蔣茭草也殷檉檉栁也鄭曰説文蔣菰也唐雅曰蔣菰其末謂之彫胡殷烏閒切赤黑色檉丑成切爾雅曰檉河栁補注希曰爾雅注郭云赤莖小楊陸云皮赤枝葉似松何年減豺虎似有故園歸洙曰王仲宣七哀詩西京亂無象豺虎方搆患南登㶚陵岸囬首望長安張孟陽七哀詩季葉喪亂起盜賊如豺虎秋峽大厯二年作補注鶴曰詩云江濤萬古峽肺氣久衰翁又云門巷落丹楓當是大厯二年東屯作江濤萬古峽肺氣久衰翁不寐防巴虎全生狎楚童趙曰言為客於外年老而不敢待雖童稚亦狎熟免其猜忌為害乃所以全生也衣裳垂素髮洙曰秋興賦素髮飄以垂領門巷落丹楓洙曰謝靈運曉霜楓葉丹常怪商山老兼存翊賛功洙曰四皓也見羽翼思商老注秋興八首大厯元年作補注鶴曰詩云巫山巫峽氣蕭森又云叢菊兩開他日淚孤舟一繫故園心當是大厯元年䕫州作時艤舟以俟出峽自永泰元年至雲安及今為菊兩開也玉露凋傷楓樹林洙曰李密詩金風蕩佳節玉露凋晩林巫山巫峽氣蕭森洙曰張景陽荒楚鬱蕭森江間波浪兼天湧塞上風雲接地隂叢菊兩洙曰一作重開他日淚趙曰此句涵蓄盖公於䕫州見菊花者二年矣方叢菊之兩開皆是他日感傷之淚孤舟一繫故園心寒衣處處催刀尺白帝城髙急暮砧洙曰郭泰機皎皎白素絲織為寒女衣良工秉刀尺棄我忽如遺䕫府孤城落日斜每依北斗望京華趙曰盖長安上直北斗號北斗城也舊本南斗非聽猿實下三聲淚洙曰見雨晴有猿揮淚盡注奉使虛隨八月查洙曰見查上似張騫注畫省香爐違伏枕趙曰畫省以粉畫之謂之畫省初學記載應劭漢官儀曰尚書郎入直臺廨中給女侍史二人執香爐燒薫以從入臺違伏枕則違去畫省香爐者以伏枕之故也山樓粉堞隠悲笳洙曰堞城堞也粉謂飾以堊土也胡人巻蘆葉吹之以為笳請看石上藤蘿月已映洲前蘆荻花趙曰北山移文云秋桂遺風春蘿罷月千家山郭静朝暉日日一作一日江樓坐翠㣲洙曰見熊羆守翠㣲詩注信宿漁人還汎汎趙曰詩汎汎楊舟清秋燕子故飛飛趙曰江總别詩黄鵠飛飛逺匡衡抗疏功名薄洙曰匡衡傳有日蝕地震之變上問以政事得失衡遂上疏上悦其言後愛幸寵於皇后太子衡為少傅數上疏陳便宜言多法義上以為任公卿劉向傳經心事違洙曰劉向傳漢初立穀梁春秋召更生受穀梁講論五經於石渠後更名向趙曰公其心事欲如劉向傳經於朝而乃違背不偶也同學少年多不賤五陵衣馬自輕肥夢符曰按文選范彦龍贈張徐州詩田家採樵去薄暮方來歸還聞稚子説有客欵柴扉儐從皆珠玳裘馬悉輕肥軒盖照墟落傳瑞生光輝又劍騎何翩翩長安五陵間蘇曰劉嵩謂兒童曰若曺不見我同學少年皆衣錦食肉若等不力學復何為終身之計耶趙曰西都賦北眺五陵言長陵安陵陽陵茂陵平陵高貴豪傑之家所居聞道長安似奕碁洙曰奕碁互勝負也百年世事不勝洙曰一作堪悲王侯第宅皆新主洙曰以喪亂而易主也左太冲濟濟王城内赫赫王侯居文武衣冠異昔時洙曰非故舊也直北闗山金鼓振洙曰時河北尚用兵也趙曰言䕫州之北用兵乃隴右闗輔間也舊本輒云河北尚用兵考之大厯二年豈有此事乎征西車馬羽書遲洙曰征西興於漢代以張遼為征西大將軍也一作馳趙曰西指吐蕃征西者将軍之號也魚龍寂寞秋江冷故國平居有所思秦有魚龍川修可曰草閤秋興詩乃䕫州所作豈可言秦之魚龍川乎按酈道元水經曰魚龍以秋日為夜龍秋分而降蟄寢於淵故以秋日為夜也趙曰言故國平時之事今有所思也蓬萊宫闕對南山承露金莖霄漢間洙曰漢武帝置金露盤西都賦抗仙掌以承露擢雙立之金莖軼埃􅝙之混濁鮮顥氣之清英補注希曰按地理志云髙宗以風痺厭西内湫濕龍朔三年始大興葺曰蓬萊宫南山即志所謂寜民令顔昶入南山水入京大厯元年尹黎幹自南山開漕渠抵景風延喜門以入苑盖京城前直此山也西望瑤池降王母洙曰漢武帝内傳七月七日西王母降漢武帝夜忽見天西南如有白雲起俄頃王母至趙曰周穆王觴王母於瑤池之上今云望瑤池則望其自瑤池而降也東來紫氣滿函闗洙曰老子傳注列仙傳曰闗令尹喜者周大夫也善學星宿服精華隠徳行仁時人莫知老子西逰喜先見其氣知真人當過侯物色而迹之果得老子亦知其竒為著書與老子俱之流沙之西服巨勝實莫知其所終亦著書九篇名闗令子雲移雉尾開宫扇洙曰見雲横雉尾髙注趙曰髙宗有雊雉之祥服章多用翟羽故有雉尾扇今公言天子雉扇則天子御朝用日繞龍鱗識聖顔一卧滄江驚嵗晩趙曰公自謂也幾回青瑣㸃朝班趙曰想望省中諸公之朝也青瑣者漢未央宫中門名補注希曰幾回猶言幾時歸也原涉傳至官無幾師古曰無幾言無多時也五行志其幾何師古曰言當幾時也若如舊注以為數則與上句不相屬瞿唐峽口曲江頭萬里風烟接素秋洙曰瞿唐曲江雖南北萬里相逺而秋止一色也花萼夾城通御氣芙蓉小苑入邊愁洙曰花萼樓芙蓉園皆長安宫禁故事趙曰花萼明皇樓名芙蓉苑在敦化坊本天子逰幸之地而今乃有邊愁入於其間以紀吐蕃之亂嘗陷京師故也補注鶴曰舊史云南内日興慶宫在東内之南隆慶坊自東内達南内有夾城複道西南隅有花萼相輝勤政務本之樓又開元二十年築夾城入芙蓉園珠簾繡柱圍黃鶴洙曰昭陽殿織珠為簾風至則鳴如珩珮之聲趙曰言繡窠作雙鶴圓而用萸線繡為鶴也舊解惑於黃鶴二字便以為黄鶴樓非也錦纜牙檣起白鷗迴首可憐歌舞地秦中自古帝王州洙曰謝元暉鼔吹曲云江南佳麗地金陵帝王州昆明池水漢時功武帝旌旗在眼中洙曰初武帝欲征昆明夷為有滇河乃作池以習水戰因而得名補注希曰髙宗問許敬宗漢武開昆明池實何年對曰元狩三年將伐昆明實為此池以習戰又寰宇記云宋元嘉二十三年築堤以堰水為池輿地志齊武帝理水軍於此池中號曰昆明池故沈約登覆舟山詩南瞻儲胥舘北眺昆明池織女機絲虚月夜石鯨鱗甲動秋風洙曰西京雜記昆明池刻玉石為鯨毎至雷雨鯨常鳴吼鬐尾皆動漢世祭之以祈雨往往有驗西都賦集乎豫章之宇臨乎昆明之池左牽牛織女似雲漢之無涯修可曰西都賦注武帝鑿昆明池於左右作牽牛織女以象天河波漂菰米沈雲黒洙曰西京雜記太液池邊皆是彫胡綠節之類菰之有米者長安人謂為彫胡菰之有首者謂之綠節趙曰言菰之多其望之長逺黯黯如雲之黒也露冷蓮房墜粉紅洙曰蓮房蓮花也修可曰蓮房墜粉紅謂蓮實上花葉墜也爾雅荷芙蓉蕖其華菡萏其實蓮其中的郭璞注云蓮謂房也的房中子也以此考之則蓮房非花矣唐本草圖經云菰又謂之茭白嵗久者中心生白臺如小兒臂謂之茭手其臺中有黒者謂之茭鬱至後結實乃彫胡米也沉雲黒其茭鬱乎闗塞極天唯鳥道洙曰言道路多狹所通者鳥道而已沈曰南中地志交趾郡治龍偏縣自興古鳥道四百里江湖滿地一漁翁趙曰公自謂也昆吾御宿自逶迤鄭曰晉灼曰昆吾地名有亭顔師古曰御宿苑在長安城南孟東曰諸宫别觀不許人往來上宿皆宿於此故名御宿趙曰昆吾御宿皆地名以長安志考之在萬年縣西補注鶴曰子虚賦琳珉昆吾張揖曰昆吾山名也出善金通鑑云郭子儀引三十騎自御宿川循山而東謂王延昌曰六軍將士逃潰者多在商州今速往収之并發武闗防兵數日間北出藍田以向長安吐蕃必潰則御宿川在京兆府之境甚明紫閤峯隂入渼陂洙曰一云紫閤峯隂入渼陂昆吾御宿自逶迤鄭曰渼莫彼切今本作漾如亮切非是趙曰紫閤峯終南山之峯名香稻啄餘鸚鵡粒碧梧棲老鳯凰枝洙曰古今詩話云紅飯啄餘鸚鵡粒碧梧棲老鳯凰枝此語反而意竒退之詩云舞鑑鸞窺沼行天馬度橋亦效此理佳人拾翠春相問趙曰費昶春郊望美人詩芳郊拾翠人仙侣同舟晩更移洙曰李膺郭林宗同舟而濟人望之為仙舟綵筆昔曽干氣象白頭吟望苦低垂洙曰卓文君有白頭吟趙曰公自言其昔日曽攜綵筆題詩干厯其氣象今老矣白頭吟詠而望之其頭苦於低垂社日兩篇大厯元年作補注鶴曰詩云鴛鷺迴金闕誰憐病峽中又云歡娯看絶塞涕淚落秋風當是大厯元年秋社在䕫州作九農成徳業百祀發光輝報效神如在馨香舊不違洙曰少皞氏以九扈為九農正共工氏有子曰勾龍能平水土故祀以為社語祭神如神在又左傳云所謂馨香無讒慝也補注鶴曰按天寳元年十月九日勑社為九土之尊稷乃五穀之長春祈秋報祀典是尊今秋社故云報效馨香二字本周書非起於左傳也南翁巴曲醉蘇曰晉初南隱者自號南翁人莫知來厯因社日至衆㑹上願聼巴歌乞此一日醉北鴈塞聲㣲尚想東方朔詼諧割肉歸洙曰東方朔傳伏日詔賜從官肉太官丞日晏不來朔獨拔劍割肉謂其同官曰社日當蚤歸請受賜即懐肉去太官奏之詔朔自責朔曰拔劍割肉一何壯也割之不多又何亷也歸遺細君又何仁也蘇曰此社日詩所載乃是伏日或云誤使事或云大手筆寓意而已鮑曰按十二諸侯年表秦徳公二年初作伏祠社磔狗四門則祠社用伏日此詩用伏日事何疑陳平亦分肉太史竟論功洙曰陳平傳里中社平為宰分肉甚均里父老曰善哉陳孺子之為宰平曰嗟呼使平得宰天下亦如此肉矣今日江南老他時渭北洙曰一作水童洙曰公生於渭北老於江南歡娯看絶塞涕淚落秋風趙曰公言流落於此故涕淚在秋風之中落也鴛鷺迴金闕洙曰鴛鷺公卿也趙曰金闕天子之闕言公卿之自金闕迴者誰念我也誰憐病峽中洙曰公自傷也秋野五首大厯元年作補注鶴曰詩云繫舟蠻井絡卜宅楚村墟當是大厯元年在䕫州作是時賃居瀼西秋野日蔬蕪洙曰謝元暉詩邑里向蕪蔬寒江動碧虚繫舟蠻井絡洙曰蜀都賦岷山之精上為井絡趙曰楚在春秋為蠻夷卜宅楚村墟洙曰䕫州楚附庸棗熟從人洙曰一作行打葵荒欲自洙曰一作旦鋤蘇曰左思曰鋤園葵客間其勤如此左曰去其猶草耳盤飱老夫食分減及溪魚易識浮生理難交一物違洙曰物不可違其性也水深魚極樂林茂鳥知歸洙曰見林茂鳥春歸水深魚知聚詩吾老甘貧病榮華有是非趙曰吾老矣自安於貧病而無他念於榮華非不羨也而有是與非秋風吹几杖不厭北洙曰一作此山薇洙曰夷齊隠於首陽山採薇而食之蘇曰殷竦晉宣帝兩徴不起里人勸其仕竦曰老子不厭此山蕨薇君其謂予何人皆服其量補注希曰陸機曰薇山菜也莖葉似小豆蔓生味如豆藿亦可食祭祀用之北山猶言北山有萊也禮樂攻吾短山林引興長洙曰稽康書濟類見寛不攻其過又云至為法禮之士所繩疾之如讐又云有入山林而不反之論逰山澤觀魚鳥心甚樂之也掉頭紗帽側洙曰莊子在宥篇爵躍掉頭紗㡌見管寧紗㡌静託曝背竹書光洙曰竹書古簡冊也趙曰所謂竹簡之書也暗用郝隆曬腹中書也風落収松子天寒割蜜房洙曰蜜房蜂房也趙曰班固終南頌曰蜜房溜其顛稀疎小紅翠趙曰言秋華也駐屐近㣲香逺岸秋沙白連山晩照紅洙曰海賦波如連山潜鱗輸駭浪洙曰海賦駭浪暴洒趙曰言魚以深為樂而峽水之深則輸冩駭浪歸翼㑹髙風洙曰魏文帝適與髙風㑹修可曰張翰曰如歸翼得髙風翺以投林中古詩云翩翩歸鴈翅更得髙秋風砧響家家發洙曰謝惠連櫩高砧響發楹長杵聲哀樵聲箇箇同洙曰峽中樵人常唱大昌歌以弔栁青每聲闕即呼栁青不知所為也飛霜任青女賜被隔南宫洙曰淮南子云霜神青女注云青女天神青天玉女主霜雪後漢樂崧甞直南宫家貧無被帝聞而嘉之詔大官賜尚書郎已下食并給帷被公雖為郎而在外故云隔爾身許騏驎畫洙曰見今代騏驎閤注年衰鴛鷺羣洙曰公晚方登朝籍大江秋易盛空峽夜多聞徑隠千重石㠶畱一片雲兒童解蠻語鄭曰解佳買切識也不必作參軍洙曰世説郝隆為南蠻參軍上已日作詩曰娵隅濯清池桓温問何物答曰名魚為娵隅温曰何為作蠻語隆曰千里投公始得一蠻府那得不蠻語也詠懐古跡五首大厯元年作補注鶴曰詩詠三峽五溪與宋玉之宅昭君之墓先主孔明之廟而懐其人當是大厯元年至䕫州後作支離東北風塵際洙曰莊子人間世注云形體支離不全貌蘇曰徐懿老年病體支離漂泊萬里又值西北風塵趙曰言祿山之亂時在賊也漂泊西南天地間洙曰漂泊言無定止三峽樓䑓淹日月洙曰三峽謂瞿唐巫山黄牛也趙曰䕫之上㳺則月峽下㳺則巴峽巫峽此三峽也補注鶴曰峽程記云三峽即明月峽巫山峽廣澤峽其有瞿唐灔澦燕子屏風之類皆不在三峽之數何王趙之未思也此云三峽盖指巫山為第三峽非兼明月廣澤而言下篇謂蜀主幸三峽亦此義也五溪衣服共雲山洙曰五溪蠻夷所居馬援所征之地衣服言異制也共雲山言與之雜處夢符曰按後漢武威將軍劉尚撃武陵五溪蠻夷注酈溪道元注水經云武陵有五溪謂雄溪樠溪酉溪潕溪辰悉蠻夷所居皆槃瓠之子孫也今辰州界羯胡事主終無賴洙曰祿山負恩也無賴言無所倚賴詞客哀時且未還洙曰公自言傷時也庾信平生最蕭瑟暮年詩賦動江闗洙曰周書庾信字子山雖位望通顯常有鄉闗之思乃作哀江南賦以致其意畧云壯士不還寒風蕭瑟搖落深知宋玉悲洙曰宋玉一作為主九辨云悲哉秋之為氣也蕭瑟兮草木搖落而變衰又曰竊獨悲此凛秋風流儒雅亦吾師蘇曰江總曰宋玉不惟文章亘絶風流儒雅自可為後生師範補注希曰宋玉宅在歸州歸與䕫為鄰公至䕫故有此作悵望千秋一灑淚洙曰謝靈運詩灑淚眺連崗蕭條異代不同時洙曰漢文帝見相如上林賦恨不與之同時江山故宅空文藻洙曰哀江南賦誅茅宋玉之宅雲雨荒臺豈夢思洙曰為王曽賦陽䑓事也趙曰宋玉所言朝雲暮雨託興以言夢中事最是楚宫俱冺滅舟人指㸃到今疑洙曰疑神女之事也羣山萬壑赴荆門生長明妃尚有村洙曰歸州有昭君村下有香溪俗傳因昭君而草木皆香故曰香溪一去紫臺連朔漠洙曰江淹恨賦若夫明妃去時仰天太息紫臺稍逺闗山無極摇風忽起白日西匿隴鴈少飛岱雲寡色望君王兮何期終蕪荒於異域獨留青冢向黄昏洙曰昭君墓也夢符曰按圖經昭君臺興山山南二里漢掖庭待詔王嬙字昭君南郡秭歸人舊注云邑人憫昭君不回立臺以祭今有昭君村田曰單于既死子達立昭君謂達曰將為漢將為胡曰為胡於是昭君服毒而死單于舉國𦵏之胡中多白草而此冢獨青前代詞人多作歌詩以弔之畫圖省識春風面環珮空歸月夜魂蒼舒曰漢元帝宫人頗多甞令畫工圖之有欲呼者披圖以召故宫人多行賂於畫工王昭君姿容甚麗無所茍求工遂毁其狀後匃奴求美女帝以昭君充行既召見帝悅之而名字已去遂不復留帝怒殺畫工毛延夀千載琵琶作胡語分明怨恨曲中論洙曰昭君初適匃奴在路愁怨遂於馬上彈琵琶以寄其恨至今傳之謂之昭君怨夢符曰釋名推手向前曰琵却手向後曰琶因以為名漢遣烏孫公主念其行道使知音者馬上奏琵琶以慰之蜀主窺吳幸三峽崩年亦在永安宫洙曰劉先主以孫權襲闗侯之故東征三吳為將陸訍所破於秭歸步歸魚復改為永安遂卒於永安補注鶴曰按蜀志章元三年四月癸已先主殂於永安宫年六十三䕫有其廟故作此以懐之翠華想像空洙曰一作寒山裏洙曰翠華軍盖想像猶髣髴趙曰翠華天子之旗也玉殿虚無野寺中洙曰山有卧龍寺先主祠在焉古廟杉松巢水鶴補注希曰春秋繁露曰鶴水鳥也夜半水立感其生氣則益喜而鳴故曰水鶴嵗時伏臘走村翁洙曰言民猶祭祀武侯祠屋長鄰近一體君臣祭祀同洙曰公自注云殿今為寺廟在宫東補注鶴曰漢魏丙賛君為元首臣為股肱明其一體相待而成也魏徴傳亦云君臣同心是為一體諸葛大名垂宇宙洙曰謂孔明之名垂於天下宗臣遺像肅清髙洙曰漢以蕭何為宗臣以功業為時所宗尚也言孔明勲烈見於後世者亦可擬蕭何三分割據紆籌䇿洙曰三分謂魏蜀吳當時孔明多籌䇿萬古雲霄一羽毛洙曰言聲名飛揚獨步萬古伯仲之間見伊吕趙曰言孔明在二公之間也魏文帝論傅毅之於班固伯仲之間耳指揮若定失蕭曹洙曰謂功垂成而亮薨福移漢祚難恢復洙曰天福不可復再志決身殱軍務勞洙曰孔明在軍罰二十已上皆親覽補注希曰本司馬仲達有食少事煩之嘆也送田四弟將軍將䕫州栢中丞命起居江陵節度陽城郡王衛公幕大厯元年作洙曰一云䕫府送田將軍赴江陵補注鶴曰栢中丞即公為䕫府栢都督謝上表者詳見前注當是大厯元年秋作明年卿二翁權䕫州矣離筵罷多酒起地發寒塘回首中丞座洙曰見周行獨座筞注趙曰言田公所起發之地在䕫州寒塘也辭中丞而行猶回首顧戀也御史中丞謂之獨座馳牋異姓王洙曰見八哀臨淮王詩注趙曰漢有異姓諸侯王也燕辭楓樹日趙曰楚地多楓也鴈度麥城霜空醉山翁酒遙憐似葛疆洙曰葛疆山簡愛將也襄陽童謠曰舉鞭向葛疆何如并州兒九月一日過孟十二倉曹十四主簿大厯二年作補注鶴曰詩云藜杖侵寒露蓬門啓曙烟則孟之所居不在城市按公賦孟氏詩云下隣慙近舍當是大厯二年作藜杖侵寒露蓬門啟曙烟力稀經樹歇老困撥書眠秋覺追隨盡來因孝友偏趙曰言今來孟氏家因重其兄弟孝友偏篤也清談見滋味爾輩可忘年課小豎鋤斫舍北果林枝蔓荒穢淨訖移牀三首洙曰一云秋日閒居補注鶴曰詩云背堂資僻逺在野興清深又云寒水光難近秋山響易哀當是大厯二年在瀼西作病枕依茅棟荒鉏淨果林背堂資僻逺在野興清深山雉防求敵洙曰詩雉鳴求其牡趙曰雉性强而善鬬江猿應獨吟趙曰應平聲以鉏斫果林荒穢淨其枝蔓則猿來少應有獨吟而已洩雲髙不去洙曰見洩雲䝉清寒注隠几亦無心洙曰莊子東郭子綦隠几塔然似喪其耦注言心形兩忘也衆壑生寒早長林巻霧齊青蟲懸就日朱果落封洙曰一作伐泥洙曰以泥封其接枝也薄俗防人面洙曰人一作狸蘇曰使人面獸心之義舊引左氏人心不同如其面焉止其面之不同於防字無義全身學馬蹄洙曰莊子有馬蹄篇言齕草飲水適足其身馬之真性有善治馬者出則馬失真性而不得盡其生也趙曰所謂馬蹄可以踐霜雪毛可以禦風寒齕草飲水翹足而陸此馬之真性也吟詩坐迴首隨意葛巾低籬弱門何向趙曰言籬觸處損壊門無定向也沙虚岸只洙曰一作自摧日斜魚更食客散鳥還來寒水光難定秋山響易哀天涯稍曛黑洙曰謝靈運詩朝逰窮曛黑倚杖更徘徊蘇曰陶侃每見山水佳麗之地莫不怡然倚杖徘徊至興罷而已峽口二首大厯元年作補注鶴曰題云峽口當是在䕫州作又云秋氣動衰顔蘆花留客晩當是大厯元年秋作是年栢中中丞為都督公為作謝上表栢甞送菜則賜金可知故又云諸侯數賜金峽口大江間洙曰一作闊西南控百蠻洙曰施黔五溪之蠻也城欹連粉堞鄭曰達恊切城上垣岸斷更青山開闢當一作多天險洙曰天設之險也言險因開闢而後通爾防隅一水闗洙曰峽口有闗斷以鐵鏁亂離聞鼓角秋氣動衰顔趙曰以身逢亂離聞鼓角聲所以感動衰顔也時清闗失險世亂㦸如林去矣英雄事荒哉割據心洙曰當公孫述劉備之際䕫為要衝趙曰皆以英雄而割據一隅也蘆花留客晩楓樹坐猿深疲􅒒煩親故􅒒乃結切蘇曰麻緗隠居終南山不仕常有親知見緗緗曰疲􅒒之人何煩親故往來存問諸侯數賜金數色角切洙曰言多得諸侯贈遺也蒼舒曰主人中丞頻分明俸趙曰公自注云主人栢中丞頻分明俸盖節度古諸侯也因言諸侯所貽之金得稱賜金補注希曰漢書食貨志注師古曰諸賜言黄金者皆與之金不言黄者一金與萬錢此用其字村雨廣徳二年作補注鶴曰詩云挈帶看朱紱則是公得賜緋未久時作當是廣徳二年在草堂作故又云松菊新霑洗茅齋慰逺逰雨聲傳兩夜寒事䬃髙秋挈一作攬帶看朱紱洙曰公任郎官故朱紱開箱覩黒裘洙曰蘇季不得用而貂裘敝黒世情只益睡洙曰世態凋敝不可瞻想莫若自隠於睡盜賊敢忘憂洙曰所憂者盜賊未平松菊新霑洗茅齋慰逺逰寒雨朝行視園樹大厯二年作補注鶴曰詩云散騎未知雲閤處啼猿僻在楚山隅當是在䕫州作然謂之視園樹而詩中又言桃李梔子紅椒丹橘黄柑則是瀼西之園也詩必作於大厯二年冬柴門雜樹向千株丹橘黃甘此地無趙曰江南種橘江北成枳則知甘橘惟楚地之所有耳江上今朝寒雨歇籬中秀洙曰一作邊新色畫屏舒桃蹊李徑年雖故洙曰李廣贊諺曰桃李不言下自成蹊師古曰蹊為徑道也言桃李以其華實之故非有所召呼而人争歸來往不絶其下自然成徑以喻人懐誠信之人故能潛有所感梔子紅椒艷色殊洙曰一作艷復殊鏁石藤梢元自落到天松骨見來枯林香出實垂將盡葉蔕辭枝洙曰一作柯不重蘇愛日恩光榮借貸洙曰冬日可愛補注希曰文選江淹上書呉王借以恩光而愛日則用左傳冬日可愛字也清霜殺氣得憂虞洙曰釋云霜者喪也其氣幓毒物皆喪也趙曰仲秋之月殺氣侵盛衰顔動覓藜牀坐洙曰管寧家貧坐藜牀欲穿為學不倦緩步仍須竹杖扶洙曰費長房投竹杖於葛陂化龍而去散騎未知雲閤處啼猿僻在楚山隅洙曰潘安仁秋興賦寓直於散騎之省高閤連雲偶題大厯元年作補注鶴曰詩云江峽繞蛟螭當是大厯元年在䕫州時作故又曰聖朝兼盜賊時吐蕃之亂未息也文章千古事得失寸心知趙曰言文章垂不朽之事其得其失盖吾心自知之作者皆殊列名聲豈浪垂洙曰言以文章名必有所長也騷人嗟不見洙曰世之言文章者謂文至於齊梁之間變而為風騷矣趙曰指言屈原宋玉也文章之祖起於騷嗟不見則屈宋逺矣漢道盛於斯洙曰漢文章深厚有古人之風趙曰言漢有司馬遷相如劉向王褒之屬傷今不復見古人也師曰文章惟漢為渾厚森嚴故曰漢道盛於斯心從弱嵗疲前輩飛騰入餘波綺麗為洙曰綺麗騷人之作也趙曰文章至於綺麗乃騷雅之末流故謂之餘波後賢兼舊制洙曰制一作例後之作者兼騷人之體也歴代各清規趙曰所謂逓相祖述也法自儒家有心從弱嵗疲趙曰公自謂也吾之用心自弱冠時疲苦至今也永懐江左逸洙曰江左晉元帝渡江所都也阮籍之流文多尚逸趙曰江左則嵇阮鮑謝之徒文選多采取焉故公永懐之多病洙曰一作謝鄴中竒洙曰鄴魏所都文帝好文故作者多尚竒江文通云闗西鄴下既已罕同河外江南嶺為異法補注希曰詩終其永懐騄驥皆良馬麒麟帶好兒趙曰麒麟之子仍是麒麟故云帶好兒車輪徒已斵洙曰莊子威公讀書輪扁以爲聖人之糟粕威公曰寡人讀書輪人安得議乎輪扁曰以臣之事觀之夫斵輪徐則甘而不固疾則苦而不入不徐不疾得之於手應之於心口不能言有數存焉於其間臣不能以喻臣之子臣之子亦不得受之於臣是以行年七十而老斵輪古之人與其不可傳也死矣然則君之所讀者古人之糟粕巳堂構肯仍虧洙曰書曰若考作室既底法厥子乃弗肯堂矧肯構謾作潜夫論洙曰後漢王符字節信隠居著書以譏當時失得不欲章顯其名故號曰潜夫論虚傳幼婦碑洙曰曹操與楊修讀曹娥碑隂有八字曰黄絹幼婦外孫韲臼修解得操行二十里乃悟云黄絹是色絲色絲絶字也幼婦少女少女妙字也外孫女子女子好字也韲臼之器受辛辤字也言絶妙好辤與楊合操曰有智無智校三十里縁情慰漂蕩洙曰文賦詩縁情而綺靡抱疾屢遷移經濟慙長䇿洙曰言無經濟之才飛棲假一枝洙曰鷦鷯賦巢不過一枝左太冲巢林棲一枝可謂達士模塵沙傍蜂蠆鄭曰傍滿浪切近也江峽繞蛟螭洙曰蜂蠆蛟螭皆毒物也言避患難不暇耳趙曰言棲托於䕫州之地如此非有譬托蕭瑟唐虞逺洙曰沈休文論虞夏以來遺文不覩聨翩楚漢危洙曰江文通雜體詩序夫楚謡漢風既非一體魏製晉造固亦一體趙曰傷戰主之不能安聖朝兼盜賊洙曰胡虜為中原之亂也趙曰言前有安史今有吐蕃是也異俗更喧卑洙曰公北人而在南故呼楚人為異俗喧卑囂雜貌鬱鬱星辰劍洙曰張華夜登樓望見牛斗間有異氣乃酆城寳劍也蒼蒼雲雨池洙曰周瑜傳蛟龍得雲雨恐非池中物革曰此二句子美自喻失其所也如此兩都開幕府洙曰兩都東京西京也幕府謂元帥也補注希曰衛青征匃奴絶大漠大克獲帝就拜大將軍於幕中府故曰幕府幕府之名始於此師古曰幕府者以軍幕為義古字通單用耳軍旅無常居止故以帳幕言之㢘頗李牧市租皆歸幕府非至衛青始有其號又幕訓大於義乖矣萬㝢挿軍麾洙曰謂天下用兵也南海殘銅柱洙曰馬援勒功銅柱師曰恨無人立功如馬援也東風避月支洙曰匃奴傳東胡强而月氏盛師曰言避吐蕃之亂也音書恨烏鵲洙曰西京雜記乾雀噪則行人至號怒恠熊羆洙曰苦寒行熊羆對我蹲趙曰言䕫州山居之所有也稼穡分詩興洙曰役於營生不暇吟詠也柴荆學士宜洙曰習其風俗也故山迷白閤秋水憶黄陂洙曰白閤黄陂闗中山水趙曰白閤則終南山相附之止皇陂則皇之陂也舊以為黄陂誤也不敢要佳句要伊遥切愁來賦别離雨晴大厯元年作補注鶴曰詩云雨晴山不改晴罷峽如新當是大厯元年䕫州作故又云故國愁眉外也雨晴善本作雨時雨晴山不改晴罷峽如新洙曰言隂晴在雨而不在山也天路休殊俗秋江思殺人有猿揮淚盡洙曰荆州記曰巴東三峽長猿聲中啼至三聲聞者垂淚無犬附書頻趙曰陸機有犬曰黄耳在洛中使附書歸江左也故國愁眉外長歌欲損神蘇曰蔡琰曰故國迢逓回首愁眉之外晩晴吳郎見過北舍大厯元年作補注鶴曰吳郎乃吳司法也公有簡呉郎司法詩又今詩云圃畦新雨潤當是大厯元年秋作圃畦新雨潤洙曰新一作佳愧子廢鉏來竹杖交頭拄趙曰費長房投竹杖於葛陂化龍而去柴扉隔徑開蘇曰顔延年過陳拱時秋暮拱呼童掃徑開門談論如鮫珠落盤琅琅可愛欲栖羣鳥亂未去小童催明日重陽酒相迎自醱醅洙曰開酒也解悶十二首大厯元年作補注鶴曰詩云一辭故國十經秋又云草閤柴扉星㪚居當是大厯元年䕫州作草閤柴扉星㪚居趙曰庾信寒園即事詩寒園星㪚居師曰䕫地多山少平居人傍山故星散浪飜江黒雨飛初洙曰鮑照飜浪揚白鷗山禽引子哺紅果溪友洙曰一作女得錢留白魚師曰得錢不論其價知魚賤也商胡離别下揚州憶上西洙曰一作蘭陵故驛樓為問淮南米貴賤蘇曰王褒淮南米價貴賤吾欲東下老夫乗興欲東流一辭故國十經秋每見秋瓜憶故丘洙曰一作侯長安東門瓜絶美趙曰邵平種𤓰長安東門也公長安人故有懐鄉之詩今日南湖采薇蕨何人為覔鄭瓜洙曰一作袁州洙曰公自注今鄭秘監審師曰𤓰州金陵之别號鄭審乃公故人也沈范早知何水部洙曰謂水部郎中薛據沈約范雲見能詩何水部注曺劉不待薛郎中洙曰曺子建劉幹薛璩也趙曰若薛據者恨不與曺子建劉幹同時獨當省署開文苑師曰子美以文章為已任故云兼泛滄浪學釣翁趙曰言薛前在省部今在荆南有江湖之樂斯為學釣翁李陵蘇武是吾師洙曰世之言五言詩始於蘇武李陵孟子論文更不疑蘇曰顔延年云李陵蘇武句注可師餘區區輩不足數南子端論文究理惟孟軻之書使人不疑趙曰指孟雲卿也一飯未曽留俗客蘇曰陶侃未甞延俗客數篇今見古人詩蘇曰校書郎孟雲卿復憶襄陽孟浩然清詩句句盡堪傳即今耆舊無新語蘇曰殷湛曰曹劉泯跡文章無宗師親耆舊區區於毫楮間倔竒新語何後生者敢爾為謾釣槎頭縮項洙曰一作頸鯿洙曰浩然開元時人詩云梅花殘臘月栁色半春天鳥泊隨陽雁魚藏縮頸鯿又云試垂竹竿釣果得查頭鯿鯿魚也楚人云長有粳米縮頭鯿魚為美味也趙曰言今耆舊之間不復造新語以言鯿魚但謾釣之而已習鑿齒襄陽耆舊傳云漢水中鯿魚甚美禁人捕以槎斷水因謂之槎頭鯿補注鶴曰張敬兒為刺史齊高帝取此魚敬兒作六穗舶置魚而進作書曰奉槎頭縮項鯿一千八百頭孟浩然又有王昌齡詩云領南香味有槎頭陶冶性靈存底物洙曰詩能陶冶情性修可曰梁鍾嶸評阮嗣宗詩無彫蟲之工而詠懐之作可以陶冶靈性幽思新詩改罷自長吟蘇曰謝惠連改詩既罷無知音者遇好句自吟而已熟知二謝將能事洙曰元暉靈運趙曰公言其稔熟知謝靈運謝惠連將作詩為能事頗學隂何苦用心洙曰梁術云隂鏗何遜文章傑出諸公用心太苦不見髙人王右丞鄭曰本注云相國縉藍田丘壑蔓寒藤趙曰右丞王維也有别墅在藍田所謂輞川也最傳秀句寰區滿未絶風流相國能洙曰唐書王維傳字摩詰開元中擢進士第乾元中轉尚書右丞以詩名盛於時尤長五言詩晚年得宋之問藍田别墅墅在輞口水周於舍下竹洲花塢與道友裴迪浮舟往來彈琴賦詩嘯歌終日甞聚其田園所為詩號輞川集代宗時弟縉為宰相代宗好文求維文縉編綴得四百餘篇上之先帝貴妃俱寂寞荔枝還復入長安洙曰楊貴妃傳妃嗜荔枝必欲生致之乃置騎傳送數千里味色未變至京師炎方每續朱櫻獻趙曰禮記仲夏之月天子以含桃先薦寢廟今云續朱櫻獻則亦南方之所貢也玉座應悲白露團洙曰謝元暉詩玉座猶寂寞况乃妾身輕修可曰唐史遺事云乾元初明皇幸蜀回嶺南進荔枝上感念楊妃不覺悲慟憶過瀘戎摘荔枝青楓隠映石逶迤京華應見無顔色紅顆酸甜只自知洙曰蜀無荔枝惟戎瀘最多盖荔枝常生於嵐瘴之地也師曰瀘戎二州名蜀荔枝譜云廣南及梓䕫之間所出大率早熟肌肉薄其味甘酸其精好者近比閩中之下品戎州圖載郡國志云􅈎人住西夷中多以荔枝為業園植萬株樹収百顆故戎州有荔枝園戸翠瓜碧李沈玉甃洙曰玉甃井也魏文帝書有云浮甘瓜於清泉沈朱李於寒水赤梨蒲萄寒露成可憐先不異枝蔓此物娟娟長逺生趙曰此物言荔枝也可憐先與荔枝不異枝蔓他處所有而此物長於逺地娟娟然生所以歎異之也側生野岸及江蒲不熟丹宫滿玉壺趙曰此篇山谷云亦貢荔枝之汁蜀都賦側生荔枝江蒲則自戎􅈎而下例以畝為蒲今官私契約皆然因以押韻丹宫神仙之宫以比禁苑玉壺珍貴之器以言至尊之奉惟其不熟丹宫而滿玉壺所以求之於逺也雲壑布衣鮐背死勞生洙曰謝師厚云生當作人重馬翠眉須洙曰重當作害須一作疎定功曰此一絶亦言荔枝歐陽公本勞人害馬翠眉須蜀都賦有曰笻竹緣嶺菌桂臨崖旁挺龍眼側生荔枝布緑葉之萋萋結朱實之離離按楊貴妃嗜荔枝必欲生置乃置騎曉夜傳至京師色未變馹召至於老死山谷間故曰勞人害馬也翠眉指貴妃也復愁十二首大厯二年作洙曰此詩十二首多感時事而言故無傳信者則闕之以俟有聞補注鶴曰此詩當是大厯二年在瀼溪作故詩云巫山猶錦樹又云村船逆上溪時吐蕃寇邠靈京師戒嚴所以又有萬國尚防寇之句人煙生處僻洙曰一云逺處趙曰曹子建千里無人煙虎跡過新蹄野鶻翻窺草蘇曰董卓每視漢獻帝如野鶻之窺深草盖其禽心自視無異也工部作是句深得體法村船逆上溪釣艇収緡盡昏鴉洙曰一作鷗接翅稀月生初學扇雲細不成衣洙曰初學扇謂未甚圓也不成衣言細也趙曰李義甫詞鏤月成歌扇裁雲作舞衣萬國尚防寇故園今若何蘇曰楊震故園今復如何趙曰故園指長安也昔歸相識少早已戰場多身覺省郎在趙曰公任工部員外郎故云家須農事歸年深荒草徑老恐失柴扉金絲鏤箭鏃皂尾掣旗竿一自風塵起猶嗟行路難洙曰金絲箭皂尾旗皆胡服也貞觀銅牙弩田曰南越志云龍川唐時常有銅弩牙流出水皆銀黃彫鏤取之以製弩開元錦獸張趙曰書曰若虞機張則所謂錦獸張者亦弩之物耳補注希曰本草陶隠居云即今人所用射者鶴曰申屠嘉傳以林官蹶張如淳曰材官之多力能脚踏强弩張之故曰蹶張律有蹶張士師曰今之弩以手張者曰劈張以足踏者曰蹶張花門小前洙曰一作箭好此物棄沙場師曰唐六典注釋名曰弩怒也有弩怒也其柄曰臂似人臂也鉤弦曰牙似牙齒也牙外曰郭為牙之規郭也合名之曰機如門戸樞機開闔有節也父老云盖越至弩營也錦獸張設射侯也花門乃回紇胡虜何曽盛干戈不肯休閭閻聴小子談笑覔封侯趙曰此篇公盖憤生事邀功濫冒榮寵者矣雖閭閻小人亦説取封侯也補注鶴曰按通鑑至徳專以官爵賞功諸將出征皆給空名告身自開府特進列卿大將軍下至中郎將聴臨事注名其後又聴以信牒受人官爵有至異姓王者及清渠之敗復以官爵収散卒大將軍告身一通纔易一醉應募入軍者一切衣金紫至有朝士僮僕衣金紫稱大官而給賤役者唐自恵琮矯詔令崔希逸撃吐蕃受厚賞自此吐蕃無嵗不入寇觀胡虜何曽盛干戈不肯休之句可為喜功生事妄開邊釁者之戒今日翔麟馬夢符曰按唐志翔麟廏名續通典内有飛龍翔麟鳯苑鵷鸞告良六羣等大廏先宜駕鼔車洙曰漢文帝以千里馬駕􅈜車無勞問河北諸將覺洙曰一云角榮華趙曰言此馬不勞問惟河北諸將角勝於榮華而已任轉江淮粟蘇曰董莋轉江湖淮浙粟以實河北補注鶴曰唐自天寳之後輿地半為盜區所賴江湖之地不失猶得藉以為國故史有唐得江淮財用濟中興之語髙帝紀故秦苑囿園池今民得田之師古曰養鳥獸曰苑又有垣曰囿休添苑囿兵由來貔虎士不滿鳯凰城趙曰責天下勤王而已不在京城之兵多也江上亦秋色火雲終不移趙曰餘熱猶在也巫山猶錦樹南國且黄鸝每恨陶彭澤無錢對菊花如今九日至自覺酒須賒洙曰陶潛九日無酒採菊盈把逺望有白衣人擕酒來乃王宏使人送酒至遂醉而歸病減詩仍拙吟多意有餘莫看江揔老洙曰江揔陳後主也陳破歸隨後歸老江南趙曰按江揔傳揔尤工五言律詩猶被賞時魚師曰江揔陳後主狎客也陳破歸隨後復歸江南子美以身未歸故鄉故託江揔以自比言揔雖易主得歸猶不若子美流落而有銀魚之賜子美檢校工部朱紱銀魚諸將五首永泰元年作補注鶴曰此詩雖言天寳十四載已來諸將之事而詩云滄海未全歸禹貢薊門何處盡堯封則是史朝義死後河北猶有未歸者又末篇云止憶往時嚴僕射當是武死後作武以永泰元年四月死而公亦以其時去成都故又云錦江春色逐人來巫峽清秋萬壑哀乃永泰元年秋在雲安作漢朝陵墓對南山洙曰張孟陽七哀詩北邙何壘壘髙陵有四五借問誰家墳皆云漢世主恭文遥相望原陵鬱膴膴胡虜千秋尚入闗昨日玉魚䝉葬地洙曰西京雜記長安大明宫宣政殿此殿初就每夜見數騎衣鮮麗逰往其間髙宗使巫祝劉明奴王湛然問其所由鬼云我是漢楚王戊太子死𦵏於此明奴等曰按漢書戊與七國反誅死無後焉得其子𦵏之此鬼曰我當時入朝以路逺不從坐後病死天子於此𦵏我漢書自有遺悞耳明奴因宣詔與改𦵏鬼喜曰我昔日亦是近屬豪貴今在天子宫内出入不安改卜極為幸今在殿東北入地丈餘我死時天子欱我玉魚一雙今猶未朽必以此相送勿見奪也明奴以事奏聞有敕改𦵏及發掘玉魚宛然見在棺槨之屬朽爛已盡自是遂絶早時金盌出人間洙曰孔氏怪曰盧充家西有崔少府墓一日見一府舍門進見少府與崔小女為婚三日崔曰君可歸女生男當以相還居四年三月三日臨水戯忽見崔氏并少府抱兒還充又與盌并贈詩一首充取兒盌及詩女忽不見充詣市賣盌崔女姨曰我妹之女嫁而亡贈以金盌著棺中田曰補遺云沈炯行經漢武通天䑓為表奏之其奏畧曰甲帳珠簾一朝零落茂陵玉盌遂出人間今公所言乃茂陵事但金玉異爾舊所引乃女子之事趙曰此激怒諸將也漢朝天子之陵大臣之墓對南山自有千秋之固及胡虜入闗不無侵掠也見愁汗馬西戎逼曽閃朱旗北斗殷洙曰子美父名集中兩處用皆非是謂吐蕃於河隴陷京師也趙曰前既有胡虜發掘陵墓今又有吐蕃之難諸將不知禦戎長安號北斗城多少材官守涇渭洙曰漢材官蹶張皆武臣也將軍且莫破愁顔趙曰為將軍者當以防寇為念且莫破愁顔而為樂也韓公本意築三城擬絶天驕拔漢旌夢符曰按吕温三受降城碑黙綴强暴朔方軍總管韓國公張仁愿請築三受降城奪據其地中宗詔許横議不撓於是留及𤓰之戍斬姦命之卒六城雷動三城岳立以拂雲祠為中城東西相去各四百里過朝那而北闢斥侯迭望幾二十所損費億萬減兵萬人趙曰漢匃奴傳自稱為天之驕子而回紇匃奴之種也故亦稱天驕補注希曰三受降城在唐豐州九原郡按志注景龍三年張仁愿築仁愿於河北築三受降城意欲絶虜路其後返與回紇和親資其兵同討安史公所以致諸君何以答昇平之恨豈謂盡煩回紇馬翻然逺救朔方兵洙曰言築城以備蕃寇而蕃反為唐平難也趙曰至徳元年郭子儀以朔方安西回紇等兵討安慶緒其後恃功浸擾中國此公所以嘆也胡來不覺潼闗隘洙曰謂祿山陷闗也趙曰此譏哥舒翰之敗龍起猶聞晉水清洙曰謂肅宗起於靈武也趙曰河北者晉地也肅宗龍飛而晉水復清獨使至尊憂社稷諸君何以答昇平蘇曰劉毅曰至尊獨憂社稷焦心勞思諸大夫忍食肉端然安居乎洛陽宫殿化為烽洙曰曹子建洛陽何寂寞宫殿盡燒焚休道秦闗百二重洙曰張孟陽劍閣銘秦得百二併吞山河趙曰祖出前漢田肯賀上曰陛下治秦中秦形勝之國也帶山阻河持㦸百萬秦得百二焉注秦地險固三萬人足當諸侯百萬人滄海未全歸禹貢薊門何處覔堯封洙曰言為盜賊所奄有也趙曰滄海指山東薊門言河北言為盜賊所陷也朝廷衮職雖多預天下軍儲不自供趙曰罪朝廷之臣不能補衮也下言郡國不修貢賦須上求索而後供也稍喜臨邊王相國洙曰王縉也文中子折衝樽爼不臨邊補注希曰王縉由侍中拜河南副元帥又拜盧龍節度使故此篇首云洛陽宫殿化為烽洛陽唐為河南府為安祿山史思明所破肯銷金甲事春農洙曰蔡文姬詩金甲耀日光回首扶桑銅柱標趙曰馬援南征建銅柱標以勒切冥冥氛祲未全銷越裳翡翠無消息洙曰前漢西域傳賛孝武之世覩犀布玳瑁則建朱崖七郡自是之後明珠文甲通犀翠羽之珍盈於後宫師古注云昔周公相成王越裳氏重九譯而獻白雉南海明珠久寂寥洙曰賈琮傳交趾土多珍異産明珠翠羽犀象玳瑁異香美木之屬自出殊錫曽為大司馬洙曰東晉石勒侵阜陵詔加王導大司馬假以黄鉞出討之軍次江陵帝親踐於郊揔戎皆挿侍中貂洙曰漢侍中冠武弁大冠亦曰惠文冠加璫附蟬為文師曰子美甞有自平宫中吕太一南海収珠之句盖吕太一為廣州使舉兵叛故翡翠明珠久不貢朝延説者多引此詩以解太一之事揔戎皆挿侍中貂言將師邀功皆居髙官也補注希曰侍中門下省之長時王縉李光弼諸公皆為之炎風朔雪天王地只在忠良翊聖朝洙曰言天子冒風雪於外所賴者惟忠臣而巳錦江春色逐人來趙曰此篇専言嚴武也公今至䕫初見春焉故云逐人來巫峽清秋萬壑哀洙曰殷仲文詩獨有清秋日能使髙興人又爽籟驚幽律哀之叩虚牝正賴往時嚴僕射嚴武共迎中使望鄉䑓趙曰嚴武鎮蜀辟公為參謀望鄉䑓在成都之北時公隨嚴僕射登此䑓迎中使也主恩前後三持節洙曰按武傳兩鎮蜀一刺綿州軍令分明數舉盃西蜀地形天下險安危須仗出羣材趙曰安危則安其危也公於八哀之言武公來雪山重武公去雪山輕正此意也九日五首闕一首作大厯二年補注鶴曰詩云巫峽蟠江路當是大厯二年在䕫州作按舊史是年九月吐蕃寇邠州靈州京師戒嚴故詩又云佳辰對羣盜重陽獨酌洙曰一云少飲盃中酒抱病豈一作起登江上䑓竹葉於人既無分洙曰張景陽七命乃有荆南烏程豫北竹葉浮蟻星沸飛華萍接竹葉酒名也菊花從此不須開洙曰荆楚嵗時記九日登髙飲菊花酒殊方日落𤣥猿哭洙曰後語宋玉曰子獨不見其𤣥猿乎舊國霜前白鴈來鮑曰筆談北方白雁似鴈而小秋深則來白鴈至則霜降北人謂之霜信弟妹蕭條各何往干戈衰謝兩相催洙曰干戈與衰老相逼也舊日重陽日傳杯不放杯即今蓬鬢改但愧菊花開洙曰愁見節物也北闕心長戀洙曰北闕帝都也趙曰不忘君也西江首獨迴茱萸賜朝士難得一枝來洙曰唐制九日賜宴及茱萸舊與蘇司業源明兼隨鄭廣文䖍采花香泛泛洙曰一云簇簇坐客醉紛紛野樹歌還倚秋砧醒却聞歡娯兩冥寞洙曰言蘇鄭俱亡而已又流落也顔延年詩衣冠終冥寞西北有孤雲洙曰魏文帝西北有浮雲孝祥曰唐狄仁傑授并州法曹參軍親在河陽仁傑登太行山反顧見白雲孤飛謂左右曰吾親舍其下瞻悵久之雲移乃得去故里樊川菊洙曰樊川在杜曲登髙素滻源洙曰滻所簡切滻水也補注鶴曰十道志樊川即杜陵之鄉漢將軍樊噲食邑於此故曰樊川屬京兆府公之父嘗為奉天令因家焉因自號杜陵今曰故里者以此滻水為長安大川他時一笑後今日幾人存洙曰言節物依然而人事更變也巫峽蟠江路終南對國門繫舟身萬里伏枕淚雙㾗洙曰巫峽終南相去萬里於流落之際而又伏枕則羈苦可知矣為客裁烏帽從兒具緑樽洙曰沈休文賓至下塵榻憂來命緑樽佳辰對洙曰一作帶羣盜愁絶更堪論洙曰當盜賊充斥道路阻絶於異鄉逢此佳節固多愁蹙也九日諸人集于林大厯元年作補注鶴曰詩云九日明朝是則不應題云九日當曰諸人約九日集于林也詩又云相要舊俗非老夫難早出皆相約之辭梁權道編在大厯元年九日明朝是相要舊俗非洙曰非昔日逰賞之地也老翁難早出賢客幸知歸舊采黃花賸石證切亦作剽梅曰賸有餘也新梳白髮㣲謾看年少樂忍淚已霑衣蘇曰王子敬昨過嵇公墳忍淚急趨回首不覺霑衣情動於中莫可制止也補注杜詩巻三十
