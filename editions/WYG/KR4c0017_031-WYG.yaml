body:
  text: 補注杜詩巻三十一宋黄希原本黄鶴補注宗武生日寳應元年作彦輔曰宗武小名驥子曽有詩驥子好男兒又云驥子最憐渠補注鶴曰梁權道從舊次編在大厯元年然詩云小子何時見髙秋此日生則是時宗武不在侍旁案公熟食日示宗文宗武詩云松栢卭山路風花白帝城則公在䕫時宗武未嘗不隨侍而詩乃云小子何時見殆非在䕫作甚明意是寳應元年秋在梓州作是時家在成都也明年秋晩公雖往閬而家在梓然去家未幾相距不遠亦不應形何時見之句當是寳應元年作小子何時見蘓曰王肅思男謂弟曰何時得見小子高秋此日生自從都邑語已伴老夫名洙曰禮自稱曰老夫者詩是吾家事人傳世上情趙曰既以詩擅名而世間愛之者多熟精文選理尹曰梁昭明太子賢集古人文詞詩賦為文選李善嘗受文選于曹憲後遂解註文選十六巻休覔綵衣輕洙曰列女傳曰老萊子老養二親行年七十嬰兒自娛著五色綵衣嘗因取漿水上堂跌仆因卧地為小兒啼或弄鳥鳥于親側趙曰老萊子着五綵衣戯于親側此言熟精文選理所以賁望其子而綵衣之輕使之休覔也凋瘵筵初秩洙曰小雅賔之初筵左右秩秩箋云筵席也秩秩肅敬也海賦為凋為瘵欹斜坐不成流霞分片片夢符曰按抱朴子項曼卿修道山中升天遊紫府仙人飲流霞一杯輒不饑渇涓滴就徐傾洙曰河東項曼卿好道去家三年而反曰去時有數仙人將上天離月數里而止月之旁甚寒悽愴饑欲食輒飲我流霞一盃每數月不饑隋江揔為碼碯杯賦翠羽流霞之杯庾信有示内人詩定取流霞氣將添承露杯趙曰抱朴子項曼自言至天上過紫府金牀几晃晃昱昱仙人以流霞飲之輒不饑渇王立之曰項曼舊註又誤為曼卿故表岀之又示宗武寳應元年作補注鶴曰按公至徳元載遣興詩云驥子好男兒前年學語時則宗武在至徳初方兩三嵗今詩云覔句新知律攤書解滿牀乃八九嵗時事于宗武生日詩後題云又示可知非大厯元年作亦明至徳元載至此十年宗武度方十嵗故以十五男兒志期之若如梁編在大厯元年則誠十五嵗矣才能知律攤書豈公之子也故以同上篇為寳應元年作覔句新知律攤書解滿牀蘓曰嵇紹新知覔句稍知音律王渾阿戎年小漸解滿牀攤書時問難字可喜試吟青玉案洙曰張平子四愁詩美人贈我錦繡段何以報之青玉案莫帶紫羅囊洙曰晉謝𤣥少好佩紫羅香囊叔父安患之而不欲傷其意因戯賭取焚之于此遂止暇日從時飲洙曰王仲宣登樓賦聊假日以銷憂師曰假乃休假非假借之假明年共我長蘓曰嵇康顧子紹曰阿紹明年共我長矣召甚喜爾成人應須飽經術已似愛文章十五男兒志洙曰論語吾十有五而志于學三千弟子行曽參與游夏達者得升堂洙曰孔子世家孔子以詩書禮樂教弟子盖三千焉身通六藝者七十有二人論語文學子游子夏又曰由也升堂矣夜大厯元年作洙曰一云秋夜客舎補注鶴曰詩云踈燈獨照孤帆宿新月猶懸雙杵鳴南菊再逢人卧病北書不至鴈無情當是大厯元年䕫州作盖公以永泰元年秋至雲安明年春遷居䕫州故云南菊再逄是時公􅋈舟岸下故又云孤帆宿也露下天髙秋水清洙曰江淹别賦露下地而騰文宋玉九辯泬㵳兮天髙而氣清寂寥兮收潦而水清空山獨夜旅魂驚定功曰王仲宣七哀詩獨夜不能寐踈燈自照孤帆宿新月猶懸雙杵鳴蘓曰李陵詩雙杵聲未㫁新月懸東陽南菊洙曰一作國再逢人卧病北書不至鴈無情洙曰范彦龍寄書雲間鴈為我西北飛歩蟾洙曰一作簷倚杖看牛斗趙曰當以歩簷為正上林賦云歩櫩周流李善註曰歩櫚歩廊也銀漢遙應接鳳城趙曰鳳城言長安也上白帝城大厯元年作彦輔曰華陽國志先主征吳于夷道還薨于巴東治魚復縣公孫述更名白帝章武中改曰永安先主章武元年屯白帝城遂為重鎮後主建興十五年中吳將全琮來攻不尅補注鶴曰此詩言城峻樓髙又見工而思夏因風而憶襄王當是大厯元年初至䕫時作所以又賦上白帝城二首云一上一回新城峻隨天壁師曰天壁乃西方室壁之星言城之髙與天壁相随樓髙更女牆洙曰庾信泛江詩春江下白帝畫舸向黄牛錦纜回沙磧蘭橈避荻洲濕花隨水泛空巢逐樹流岸渚多喬木山城是逈樓徐敬業登琅琊城云登陴起霞望註女墻也孝祥曰崔豹古今註女牆城上小牆也亦名睥睨言於牆上睥睨人也江流思夏后洙曰禹貢岷山導江束別為沱左傳劉子見河洛思禹功風至憶襄王洙曰宋玉風賦楚襄王遊于蘭䑓之宫宋玉景差侍有風䬃然而至王乃披襟而當之曰快哉此風老去聞悲角人扶報夕陽公孫初恃險躍馬意何長洙曰左太冲蜀都賦臨谷為塞因山為障峻阻塍埒長城豁險吞若巨防一人守隘萬夫莫向公孫躍馬而稱帝劉宗下輦而自王後漢公孫述字子陽使人詐稱漢使者假述輔漢将軍蜀郡太守述恃其地險衆附自立為蜀王都成都蜀地肥饒兵力精强遠方士庻多歸之遂立為天子號成家宿江邊閣大厯元年作補注鶴曰詩云鸛鶴追飛盡豺狼得食喧指崔旰輩羣起也當是大厯元年作故又云不眠憂戰伐無力正乾坤瞑色延山徑洙曰謝靈運詩林壑斂瞑色髙齋次水門薄雲巗際宿孤月浪中翻韓曰何遜入西塞示南府同僚詩薄雲天際出初月波中上鸛鶴追飛盡豺狼得食喧不眠憂戰伐無力正乾坤補注鶴曰鸛鶴以喻軍士豺狼以喻冦盜是時蜀有崔旰之亂河南又有周智光之亂而吐蕃回紇又相繼入冦故云别崔潩因寄薛據孟雲卿大厯元年作鄭曰潩夷記切補注鶴曰一本自注云内弟赴湖南幕職詩云荆州遇薛孟當是大厯元年在䕫州作故又云夙夜聴憂主飛騰急濟時志士惜妄動蘓曰謝安石志士之心如石豈可妄動知深難固辭趙曰志士本惜妄動而受知之深則難固辭此以言潩赴幕職于湖南也如何乆磨礪但取不磷緇洙曰語不曰堅乎磨而不磷不曰白乎涅而不緇喻君子雖在濁亂不能汙也趙曰言不可以乆磨礱淬礪便以為利所貴尚者取磨不磷涅不緇而巳夙夜聴憂主飛騰急濟時荆州遇薛孟為報欲論詩蘓曰阮瞻行程劇曰煩子寄語友人欲與子共竹林諸公論詩耳武侯廟大厯元年作彦輔曰成都記云諸葛公廟在先主廟故宅城西復立素像先主廟西院即武侯廟前有雙大栢古峭可愛内有裴令公所著碑栁僕射書相國段公古栢文補注鶴曰詩云空山草木長當是指䕫州廟後有上卿翁請修武侯廟遺像缺落時崔卿權䕫州今詩又云遺廟丹青落與上卿翁詩合舊註恐非當在大厯元年作遺廟丹青落空山草木長補注希曰孟夏草木長猶聞辭後主不復卧南陽洙曰蜀志諸葛亮傳亮躬耕隴畆好為梁父吟漢晉春秋曰亮家于南陽之鄧縣在襄陽城二十里號曰隆中徐庶謂先主曰諸葛孔明卧龍也将軍豈見之乎先主病勑後主曰汝與丞相從事事之如父建興元年封亮武鄉侯五年率諸軍北駐漢中臨發上表辭卒于軍魏将軍鍾㑹至漢川祭亮之廟令軍士不得于亮墓所左右芻牧樵採八陣圖大厯元年作彦輔曰亮推演兵法作八陣圖咸得其要桓温傳初諸葛亮造八陣圖于魚復平沙之上疊石為八行相去二丈温見之謂此常山蛇勢也文武皆莫能識之昱曰陣勢八天地風雲飛龍翔鳥虎翼蛇蟠二革二金為天三革三金為地二革三金為風三革二金為雲四革三金為龍三革四金為虎四革五金為鳥五革四金為蛇補注鶴曰寰宇記八陣圖在新都縣北三十里李膺益州記云稚子闕北五里武侯八陣圖土城四門中起六十四魁八八為行魁方一丈髙三尺又云在䕫州奉節縣西七里聚細石為之各高五尺廣十圍歴然碁布縱横相當中間相去九尺正中開南北巷悉廣五尺几六十四聚此詩當是大厯元年公初至䕫州作梁權道編亦然功蓋三分國洙曰三分謂魏吳蜀也名成八陣圖江流石不轉余曰按永嘉薛氏云武侯之圖可見者三一在沔陽之高灘平舊壘一在廣都之八陣鄉一在魚復永安宫南江水上在高平者自酈道元巳言傾禠難識在廣都者隆土為基魁以江石四門二首六十四魁八八成行兩陣俱立陣周四百七十二歩其魁百有二十在魚復者因江為勢積石憑流前蔽壁門後依却月縱横皆八魁間二丈偃月内面九六鱗差廣都舊無聞焉惟見于李膺益州記其言魁行皆八財舉其半趙抃成都記稱耆老之説之為江石兵數魁應六十四卦則知兩陣二首之意以體乾坤門戸法象之所由生也然其陣居平地束于門壁營陣之法具而竒正之道藴魚復陣于江路因水成形七八以為經九六以為緯體方於八陣形圓於却月壁門可以觀營陣之制却月可以識竒正之變故雖長江東注夏流湍駛轟雷犇馬不足以擬其勢回山巻石不足以言其怒峩峩八陣實激其衝子石奉如灘沙攸積而歴年千數未嘗回撓隐若敵國屹然長城故桓温以為常山之蛇杜甫偉其江流而不轉也遺恨失吞吳洙曰習鑿齒曰曹操暫自矜伐而天下三分蘓曰僕嘗夢見人云是杜子美謂僕世人多誤㑹吾八陣圖詩以謂先主武侯恨不能滅吳非也我意本謂吳蜀唇齒不當相圖晉所以能取蜀者以蜀有吞吳之意以此為恨耳此説甚長然子美死近四百年而猶不忘詩區區自别其意此真書生習氣也師曰劉禹錫嘉話録䕫州西市俯臨江沙石下有諸葛八陣圖聚石分布宛然尚存峽水大時三蜀雪消之際傾湧滉瀁可勝道哉大木十圍枯槎百丈隨波而下與水岸齊人奔上山則聚石為堆者㫁可知也及乎水落川平萬物皆失故態諸葛亮小石之堆標聚行列依然如是者近六百年迨今不動然天下三分如鼎足峙立蜀之所以不存者其遺恨失在吞吳而巳使不吞吳則魏豈能合并哉奉送韋中丞之晉赴湖南大厯二年作補注鶴曰舊史大厯四月二月以湖南都團練觀察使韋之晉為潭州刺史則此詩送韋為衡州刺史而作也詩云峽内憶行春韋嘗在峽内作守故云後進大夫卒于潭州故有哭韋大夫詩此詩又云王室仍多故乃指吐蕃大厯二年又入㓂京師戒嚴詩盖作于其年寵渥徴黄漸洙曰前漢循吏傳黄霸為潁川太守户口歳増治為天下第一徴守京兆尹權宜借㓂頻洙曰見河内猶宜借冦恂注湖南安背水洙曰韓信破隨反背水陣峽内憶行春洙曰後漢鄭𢎞傳太守行春任彦升詩涿令行春返冠盖溢山坻謝夷吾傳行春乘柴車王室仍多故蒼生倚大臣蘓曰晁錯云天下蒼生全倚大臣安養鼎鼐調羮手不可容易錯動還將徐孺榻處處待高人洙曰陳蕃為徐稚下榻謁先主廟大厯元年作洙曰成都記曰先主廟府南八里惠陵東七十歩齊高帝夢益州有天子鹵簿詔刺史博覃修立而卑小後至長沙王鍾改更構及四面壇屋置守墓户五百補注鶴曰先主廟雖在成都而䕫亦有之盖先主嘗為吳將所破歩歸魚復又卒于䕫州永安宫所以亦有廟此詩云錦江元過楚亦以䕫居南楚先主國于成都而廟于䕫猶錦江之過楚也竹送清溪月溪乃指豐溪永安宫在豐溪之側當是大厯元年作慘澹風雲㑹乘時各有人洙曰古詩靄靄風雲㑹佳人一何繁劉植説李軼書以龍虎之姿遭風雲之時中興二十八将論曰咸能感㑹風雲奮其智勇補注希曰世説戴道壹道人善為辭嘗途中逢雪人問其狀先集其慘澹又陸機江籬曰䝉被風雲㑹易時乘六龍以御天光武論乘時龍以御天力侔分社稷志屈偃經綸洙曰屯君子以經綸趙曰言劉葛之志屈而不得伸所以偃仆經綸之業也復漢留長策中原仗老臣洙曰復漢謂欲興劉氏也老臣孔明也蜀志建安二十五年魏文帝稱尊號改元曰本初或傳聞漢帝見害先主乃發喪制服譙周等上言曰大王襲先帝軌跡亦興于漢中又大王出自孝景皇帝中山靖王之胄宜即帝位趙曰先主欲興劉氏而稱漢其所留之長策與後主也所留長策者欲取中原仗諸葛老臣耳雜耕心未已洙曰後主建興十二年春亮悉大衆由斜谷出以流馬運據武功五丈原與司馬宣王對于渭南每患糧不繼使已志不伸是以分兵屯田為乆駐之基耕者雜于渭濱居民之間百姓安堵軍無私焉歐血事酸辛歐於口切洙曰亮與宣王相持百餘日其年八月亮疾病卒于軍時年五十四魏書亮糧盡勢窮憂恚歐血一夕燒營遁走入谷道發病卒漢晉春秋曰亮卒于郭氏塢裴松之以為亮在渭濵魏人躡跡勝負之形未可測量而云歐血盖因亮巳亡而自誇大也夫以孔明之畧豈為仲達歐血乎及至劉琨喪師與晉元帝箋亦云亮軍敗歐血此則引虗記以為言也其云入谷而卒緣蜀人入谷發喪故覇氣西南歇洙曰晉陽秋曰有星赤而芒角自東北南流投于亮營三投再還往大還小俄而亮卒譙周云西南上有黄氣趙曰譙周等初勸進曰覇氣願大王應天順民今葛亮已死中原莫圖則覇氣所以歇也雄圖歴數屯錦江元過楚劍閣復通秦洙曰言拓地至秦楚趙曰錦江劍閣蜀國之土地過楚通秦則言本可以混一而不能焉所以傷之也舊俗存祠廟空山立洙曰一作泣鬼神洙曰襄陽記曰亮死所在各求為立廟朝議以禮秩不聴百姓遂因時節私祭之于道陌上虛簷交鳥道趙曰此是䕫州先主廟廟在山中故云交鳥道鳥道則山中之險道也舊所引乃成都先主廟事地理錯亂也補注鶴曰䕫州先主廟在卧龍寺故曰空山公詠懐古跡亦有翠華想像空山裏之句若是成都廟誠不應言虛簷交鳥道矣枯木半龍鱗洙曰成都記諸葛亮廟亦在先主故宅城西復立素像先主廟西院即武侯廟廟前有雙大栢古峭可愛人云諸葛手植襄陽記曰亮卒百姓私祭于道陌上言事者或以可聴立廟于成都者後主不從歩兵校尉習隆中書郎尚充等共上表曰臣聞周人懐召伯之徳甘棠為之不伐越王思范蠡之功鑄金存其像自漢興以來小善小徳而圖形立廟者多矣况亮徳範遐邇勲盖季世興王室之不壊實斯人是頼而蒸甞止于私門廟像問而莫立使百姓巷祭戎夷野祀非所以存徳念功述追在昔者也臣愚以為宜因近其墓立之沔陽使所親屬以時賜祭凡其臣故吏欲奉祠者皆限至廟所㫁其私祭以崇正禮于是始從竹送清溪月蘓曰黄綏詩云娟娟釣絲竹幾送清溪月苔移玉座春洙曰玉座玉床也謝𤣥暉銅雀䑓詩玉座猶寂寞况乃妾身輕閭閻兒女換歌舞歳時新洙曰舊俗以四時祀十二月亦祈禱閻里中門也蘓曰葛稚川再到鄉園閭井改易兒女更換惟綠水青山少不减舊耳絶域歸舟遠荒城繫馬頻如何對搖落洙曰宋玉曰草木搖落而變衰謝𤣥暉拜中軍記室辭隨王牋臯壤搖落對之惆悵岐路東西或以鳴邑趙曰此句已下公言其身之流落因自比而感歎也况乃乆風塵洙曰晉揔記論悠悠風塵孰與闗張並洙曰闗侯張飛傳曰初劉備襲蜀丞相掾趙戩曰劉備其不濟乎拙于用兵每戰必敗奔亡不暇何以圖人蜀雖小區險固四塞獨守之國難卒用兵也徴士傳幹曰劉備寛仁冇度能得人死力諸葛達治知變正而有謀而為之相關張二將勇而有義皆萬人之敵而為之將此三人者皆人傑也以備之畧三傑佐之何為不濟諸葛傳先主與亮情好日宻闗張等不悦先主解之曰孤之有孔明猶魚之有水也願諸君勿復言關張乃止趙曰此盖言諸葛與關張二將之才噐孰與並乎言不可並矣功臨耿鄧親洙曰耿弇鄧禹後漢論云冦鄧之高勲耿賈之鴻烈修可曰公評品以為鄧禹之高勲耿賈之鴻烈可親近矣應天才不小洙曰應一作繼蜀志譙周等上言臣聞河圖洛書五經纎緯孔子所甄騐應自遠謹按洛書云云圖書云云臣聞聖王先天而天不違後天而奉天時故應際而生與神合契願大王應天順民得士契無鄰洙曰蜀志先主復領益州牧諸葛亮為股肱法正為謀主闗侯張飛馬超為爪牙許靖縻竺簡雍為賔友及董和黄權李嚴等本璋之所授用也吳壹費觀等又璋之婚親也彭羡又璋之所擯也劉巳者夙昔之所忌恨也皆處之顯任盡其噐能有志之士無不競勸遲暮堪帷幄洙曰運籌帷幄之中飄零且釣緡洙曰詩其釣維何維絲伊緍向來憂國淚寂寞洒衣巾洙曰謝靈運廬陵王墓下作洒淚眺連崗蘓曰孔煒常下憂國之淚白鹽山大厯元年作補注鶴曰山在䕫州詩云白牓千家邑清秋萬古船當是大厯元年秋作卓立羣峯外蟠根積水邉他皆任厚地爾獨近高天白牓千家邑趙曰言縣額以白為牌耳清秋萬估船詞人取佳句刻畫竟誰傳趙曰欲以佳句専詠白鹽之状雖加刻畫終難傳播所以重言于難措辭也補注希曰周顗刻畫無鹽故公因山名白鹽而謂之灔澦堆大厯元年作補注鶴曰詩云干戈連解纜行止憶􅂷堂謂去留俱危也當是大厯元年作故云江寒出水長是時崔旰之變未寧巨石水中央洙曰蒹葭遠在水中央江寒出水長沉牛答雲雨洙曰楚俗祈而獲雨必沉牛以答神貺補注鶴曰巨石一本作巨積沉牛二字雖見司馬相如傳注謂沉牛水牛也能沉没水中與此詩意不合湯東靈湫詩亦云曽祝沉豪牛與此合當如洙説如馬戒舟航洙曰世説灔澦如馬瞿塘莫下言其險絶蘓曰三巴錄灔澦如象舟船莫上灔澦如馬舟船莫下長年三老常以此候之天意存傾覆神功接混茫洙曰莊子繕性古之人在混茫之中與一世而得澹漠焉干戈連解纜行止憶􅂷堂洙曰袁盎傳千金之子坐不􅂷堂師古曰言富人之子則自愛也􅂷堂謂坐堂外邉恐墮也趙曰干戈之變解纜之危二者相連可不慎乎瞿塘懐古新添年大厯元作鄭曰寰宇記䕫州瞿塘在州束一里補注鶴曰此詩當是公初見瞿塘而作故備述其險又言白帝陽䑓之事乃大厯元年作西南萬壑注勍敵兩崖開地與山根裂江從月窟來削成當白帝本中曰蜀魚復縣公孫述更名白帝自後為重鎮空曲隠陽䑓補注鶴曰寰宇記陽雲䑓高一百二十歩宋玉賦云遊陽雲之䑓是也䟽鑿功雖美本中曰郭景純江賦巴東之峽夏后䟽鑿陶鈞力大哉白帝城樓大厯二年作補注鶴曰此詩當是大厯二年歳晏作明年正月公出峽所以有夷陵春色起漸擬放扁舟之句江度寒山閣城高絶塞樓翠屏宜晩對洙曰天台賦博壁立之翠屏蘇曰羊元居山當戸山峯竒秀每據筠牀終日笑傲或偃卧看山客至謂客曰此翠屏宜晚對爽人心目顔魯公名其隠山為翠屏今人皆傳之嘗見人題詩曰萬古漸漸立翠屏昔年不枉占佳名白谷㑹深遊急急能鳴鴈輕輕不下鷗夷陵春色起漸擬放扁舟蘓曰唐劉洞庭秋來橘柚欲熟酒賤魚肥吾漸放舟傲蕩君山湘川耳寄杜位大厯元年作魯曰頃者輿位同在故嚴尚書幕補注鶴曰峽中為客恨又云寒日經簷短當是大厯元年冬在雲安作是時吐蕃之亂未寧寒日經簷短窮猿失木悲洙曰淮南子曰猿顛蹷而失木又晉書曰窮猿奔林豈暇擇木修可曰謝鯤如失木之窮猿但自悲嘯峽中為客恨江上憶君時天地身何往風塵病敢辭封書兩行淚霑洒裛新詩冬深洙曰一云即日永泰元年作補注鶴曰詩云風濤暮不穏舎棹宿誰門當是永㤗元年在雲安作若如梁權道編在大厯元年則是時公在䕫已定居不應詩乃爾云花葉隨天意江溪共石根早霞隨類洙曰一作戾影趙曰言其變態不常隨所類之影呈現也寒水各依洙曰一作流痕易下楊朱淚洙曰楊朱泣岐路謂其可以南可以北難招楚客魂洙曰宋玉哀屈原憂愁山澤魂魄飛散其命將落故作招魂欲以復其精神延其年壽外陳四方之惡内崇楚國之美以諷于君風濤暮不息趙曰古詩風濤暮不止幾日到蕭湘薛曰公欲南下以歳暮而未成行也捨棹宿誰門不寐大厯元年作補注鶴曰詩云瞿塘夜水黑城内改更籌當是大厯元年䕫州作故又云多壘滿山谷言崔旰之亂未息也瞿塘夜水黒城内改更籌翳翳月沉霧輝輝星近樓洙曰景陽詩翳翳結繁雲氣衰甘少寐心弱恨容一作和又作多愁趙曰心既弱矣恨其知愁則恐以愁而尤弱矣多壘洙曰一作恨滿山谷洙曰曲禮四郊多壘卿大夫之辱也桃源無處求趙曰以干戈未息而多壘非若桃源可以避地而問桃源何處則以仙境難造也奉送十七舅下邵桂大厯元年作補注鶴曰公屢以䕫為殊方為絶域今詩云絶域三冬暮當是大厯元年在䕫州作故又云浮生一病身絶域三冬暮洙曰東方朔傳三冬文史足用浮生一病身感深辭舅氏洙曰渭陽詩我送舅氏別後見何人縹緲蒼梧帝洙曰謝𤣥暉詩雲去蒼梧野顔延年謁帝蒼山溪檀弓舜塟于蒼梧之野蒼梧南越趙曰虞舜死于蒼梧之野指言虞舜以述十七舅所往之處也補注鶴曰按九域志蒼梧山在道州而道與邵為鄰故云推遷孟母隣洙曰孟子序㓜被慈母三遷之教潘安仁閒居賦孟母所以三徙注孟軻母與軻少居近墓軻乃戯為墓軻母曰此非所居去居市傍軻愛戯為商賈居學館之傍遂為大儒昏昏阻雲水側望苦傷神洙曰張平子四愁詩側身東望涕霑翰蜀都賦望之天逥即之雲昏送覃二判官大厯元年作補注鶴曰詩云蹉跎病江漢不復謁承明當是大厯元年䕫州作覃是時歸長安也先皇弓劍遠小臣餘此生洙曰黄帝塟于橋山南空棺無尸唯劍舄在前漢郊祀志黄帝采首山銅鑄鼎于荆山下鼎既成有龍􅂷胡髥下迎黄帝帝上騎羣臣後宫從上龍七十餘人龍乃上去餘小臣不得上迺悉持龍髥龍髥拔墮墮黄帝之弓百姓仰望黄帝既上天乃抱其弓與龍髥號故後世因名其處曰鼎湖其弓曰烏號于是天子曰嗟乎誠得如黄帝吾視去妻子如脱敝屣耳趙曰先皇指肅宗也蹉跎病江漢不復謁承明洙曰選云鯨魚失流而蹉跎前漢嚴助傳上問所欲對曰為㑹稽太守于是拜之數年不聞問賜書曰制詔㑹稽太守君厭承明之廬張晏曰承明之廬在石渠閣外曹子建贈白馬王彪詩謁帝承明廬蘓曰謝宗出守仇池語友人曰吾此行當不復謁承明廬擇山水秀媚處吾斂翼平栖無意人間世也餞爾白頭日洙曰鄒陽白頭如新永懐丹鳳城趙曰指言長安帝城也秦穆公女弄玉吹簫鳳集其城因號丹鳳城補注希曰舊史至徳二載十一月戊午上御丹鳳門下制兹云城者門之城也遲遲戀屈宋渺渺卧荆衡洙曰屈原宋玉趙曰荆則荆渚衡則衡山魂㫁航舸失趙曰望覃判官之去航黯然作别而魂㫁也天寒沙水清肺肝若稍愈亦上赤霄行洙曰七命掛歸翮于赤霄之表趙曰亦有意于長安帝京矣夜宿西閣曉呈二十一曹長大厯二年補注鶴曰以後篇口號考之當是大厯二年冬在䕫州作城暗更籌急樓高雨雪㣲稍通綃幕霽趙曰言天幕之色薄如綃逺帶玉繩稀洙曰謝𤣥暉詩玉繩低建章門鵲晨光起洙曰一作喜檣烏宿處飛師曰謝𤣥暉詩金波麗鳷鵲鳷鵲門名也故曰門鵲檣掛帆木而烏泊其上故子美公安送李二十九詩又有檣烏相背發之句過南岳入洞庭詩亦云莫恠啼㾗數危檣逐夜烏然子美發潭州詩又云檣燕語留人則不特檣烏而巳故燕子來舟中作㫁句云暫語船檣還起去穿花落水益沾巾補注希曰檣烏非如屋上之烏真言烏也特檣上刻為烏形以占風耳晉令中駕出入相風在前相風乃是刻烏于竿上名之曰相風晉傅𤣥相風賦云棲神烏于竿首俟祥風之來征是巳門鵲既非指鵲則檣烏亦無容謂實為烏也寒江流甚細有意待人歸蘓曰蘓絲野燕溪草春風未齊應有意待遷人歸西閣口號呈元二十一大厯二年作補注鶴曰梁權道編在大厯元年按史是年冬無雪長安且無雪蜀安得有之而今詩云雪崖纔變石雖非大雪然炎方尚至于變石則長安不應云無當是大厯二年作史云十一月雨木冰可知其有雪矣山木抱雲稠寒空繞上頭雪崖纔變石風幔不依樓社稷堪流涕蘓曰陳壽思社稷事使人真堪流涕安危在運籌洙曰漢書運籌帷幄之中看君話王室感動幾銷憂有歎大厯二年作魯曰傳蜀官軍自圍普還補注鶴曰詩云天下兵常鬬江東客未還當是大厯二年冬䕫州作是年吐蕃入冦京師兩戒嚴故云江東客公自謂也壯心乆零落趙曰魏武帝樂府曰烈士暮年壯心不巳白首寄人間蘓曰梁鴻曰白首猶寄人間萍跡可厭天下兵常鬭江東客未還趙曰公有所歎也窮猿號雨雪洙曰晉書云窮猿投林老馬望闗山洙曰管子曰老馬之智可用也武徳開元際蒼生豈重攀洙曰武徳高祖年號開元明皇年號趙曰追念祖宗之盛時也補注鶴曰如趙云追念祖宗盛時則正觀何以不言公之意盖以太宗肅宗為皇太子而功高高祖明皇遂遜位與之是時徳宗以雍王為天下兵馬元帥討史朝義以功兼尚書令為太子已三年故有此句黙寓高祖明皇之事西閣雨望大厯元年作補注鶴曰詩云菊蘂凄踈放松林駐逺情當是大厯元年秋在䕫州作樓雨霑雲幔山寒着水城逕添沙面出湍減石稜生趙曰逕之所以添以水落而沙面出湍之所以減則石露而其稜自生菊蘂凄踈放松林駐逺情滂沱朱檻濕洙曰詩彼滂沱矣萬慮倚簷楹洙曰沈休文夕自傍簷楹不離西閣二首大厯元年作補注鶴曰詩云地偏應有瘴臘近已含春當是大厯元年冬作江栁非時發江花冷色頻地偏應有瘴洙曰陶潛詩心逺地自偏蘓曰吳宿曰盧南地僻蒸熱有瘴凡事自養慎醉飽臘近已含春失學從愚子無家住洙曰一作任老身傳何恤無家不知西閣意肯别定留洙曰一作何人西閣從人别人今亦故亭江雲飄素練洙曰一作葉石壁㫁空青田曰空青字詩人無敢使惟太白亦云山色倒空青滄海先迎日銀河倒列星平生耽勝事吁駭始初經送鮮于萬州遷巴州大厯元年作趙曰鮮于名炅仲通之子也廣徳中為尚書都官郎自将相公卿無不相厚皆稱交友補注鶴曰按九域志萬州至達州二百七十里而達州至巴州又二百二十里故詩云接近與名藩詩又云寒江觸石喧當是大厯元年在䕫州作京兆先時傑趙曰京兆者炅天寳末為京兆尹弟叔明乾元中亦為之長安歌曰前尹赫赫具瞻允若後尹熈熈具瞻允斯琳瑯照一門洙曰甫有贈鮮于京兆詩晉史忠孝萃一門安石曰世説有人詣王太尉遇王安豊大将軍丞相在坐别屋見季􅉙平子還語人曰今日之行觸目見琳瑯珠玉朝廷偏注意洙曰天下安注意相接近與名藩趙曰自萬遷巴故云接近祖帳維舟數洙曰䟽廣傳設祖道供帳寒江觸石喧洙曰蜀都賦觸石吐雲㸔君妙為政他日有殊恩西閣三度期大昌嚴明府同宿不到大厯元年作補注鶴曰大昌屬䕫州而詩云金吼霜鐘徹當是大厯元年冬在䕫州作問子能來宿今疑索故要趙曰言不來宿者盖疑以我尋索故要我也匣琴虛夜夜趙曰期之不來遂廢彈琴故云虛夜夜手板自朝朝夢符曰按南史庾道敏善手板世説王子猷以手板拄頰云西山朝來别有爽氣趙曰手板笏也言嚴明府自持手板以入官府於朝朝也金吼霜鐘徹花催蠟炬銷夢符曰按山海經豐山之鐘霜降自鳴豐山今在鄧州南陽縣北三十里又梁劉孝威燭詩浮光燭綺席疑滴汗􅂷花趙曰以待嚴君至也蠟字作臘耳早鳬江檻底雙影謾飄颻王喬鳬舄曉望白帝城鹽山大厯元年作補注鶴曰詩云春城見松雪當是大厯元年春在䕫州作徐歩移班杖看山仰白頭翠深開㫁壁紅洙曰一作江逺結飛樓日出清江洙曰一作塞望暄和散旅愁春城見松雪洙曰顔延年山明望松雪始擬進歸舟洙曰謝𤣥暉詩天際識歸舟西閣二首大厯元年作補注鶴曰詩云巫山小搖落碧色見松林當是大厯元年秋晚作巫山小搖落洙曰宋玉九辯草木搖落而變衰燕歌行草木搖落露為霜碧色見松林百鳥各相命夢符曰按王粲登樓賦鳥相鳴而舉翼注大戴禮夏小正之鳴也者相命也孤雲無自心洙曰陶淵明詠貧士萬旅各有託孤雲獨無依層軒俯江壁洙曰招魂高堂䆳宇檻層軒些要路亦高深洙曰選先據要路津朱紱猶紗㡌新詩近玉琴趙曰朱紱則朝朝紗㡌隠者之市功名不早立衰疾謝知音哀世非王粲終然學越吟洙曰王粲登樓賦荘舄顯而越吟懶心似江水日夜向滄州洙曰謝𤣥暉既權懐緣情復叶滄州趣不道含香賤田曰應邵漢官儀曰始桓帝時侍中刁存年老口臭上出雞舌香與含之頗辛螫不敢咀嚥疑有過賜毒藥歸舎辭决家人哀泣其故僚友取其藥騐之無不嗤笑後尚書郎含雞舌香始于此其如鑷白休鑷泥輒切田曰南史鬱林王年五嵗戲高帝傍令左右鑷白髪王問我誰耶答曰太翁帝笑謂左右曰豈有為人作曽祖而拔白髪乎即擲鏡鑷經過調碧栁趙曰公詩又曰清秋凋碧栁舊誤作調碧栁非是蕭索倚朱樓畢娶何時竟洙曰謝靈運謂子尚曰男娶女畢勑㫁家事勿復相闗消中得自由豪華看古往趙曰庾信見游春人詩云金穴盛豪華服食寄冥捜洙曰選服食求神仙古賦遠寄冥搜詩盡人間興兼須入海求卜居大厯二年作補注鶴曰詩云春耕破瀼西當是大厯二年作公是年三月自赤甲遷居瀼西歸羨遼東鶴洙曰遼東華表柱有鶴其上曰有鳥有鳥丁令威去家千年今始歸城郭如故人民非何不學仙冡纍纍吟同楚執珪洙曰淮南子宣王以執珪封子發子發辭而不得楚法得子胥爵執珪莊舄為楚執珪王仲宣賦莊舄顯而越吟未成遊碧海洙曰十洲記曰扶桑在碧海之中地去西南萬里大帝之宫太真君所治著處覔丹梯洙曰謝靈運詩躧歩陵丹梯雲嶂寛江北春耕破瀼西洙曰南瀼水管郫縣也趙曰公自赤甲而遷此江北乃瀼西之地瀼者水名音讓鄭曰瀼奴浪切水名今作灢補注希曰水經云白帝山北緣馬嶺接赤甲山東滂瀼溪即以為隍則瀼溪在白帝山之東桃紅客若至定似昔洙曰一作晉人迷洙曰見欲問桃花宿注玉腕騮大厯元年作洙曰江陵節度衛公馬也補注鶴曰按舊史衛伯玉廣徳二年為荆南節度等使尋加檢校工部尚書此詩云聞説荆南馬尚書玉腕騮又云胡虜三年入乾坤一戰收當是大厯元年在䕫州作聞説荆南馬尚書玉腕騮頓驂飄赤汗洙曰漢歌天馬下霑赤汗跼蹐顧長楸洙曰詩正月注跼曲也蹐累足也曹子建名都篇走馬長楸間胡虜三年入乾坤一戰收趙曰禄山慶緒之亂三年之際遂仍收復斯為一戰收矣衛公之馬豈止于此時得用乎舉鞭如有問欲伴習池遊洙曰襄陽記峴山南習郁大魚池山季倫每臨此池飲輒大醉而歸常曰此我高陽也城中小兒歌之曰山公去何逺來至高陽池日夕倒載歸酩酊無所知見王監兵馬使説近山有黒白二鷹羅者乆取竟未能得王以為毛骨有異它鷹恐臘後春生騫飛避暖勁翮思秋之甚眇不可見請余賦詩二首大厯元年作補注鶴曰王監兵馬使即公為賦二角鷹者也今詩云𤣥冬戎夜宿陽䑓當與二角鷹歌同是大厯元年在䕫州作正翮摶風一作玉翮雲飛玉立盡清秋趙曰此詠鷹如雲之飛如玊之立皆言其白盡清秋即序所謂臘後春生騫飛避暖者也不惜竒毛恣逺遊在野只教心力破于人何事網羅求趙曰序云羅者竟未能得也一生自獵知無敵趙曰庾信詩野鷹能自獵江鷗解獨漁百中争能恥下鞲洙曰史滑稽傳注鞲臂捍也東觀記太守相虞署趙勤為督郵貪吏自去虞歎曰善吏如使良鷹下臂命中鵬礙九天須却避趙曰孔氏志曰楚文王雅好田獵有一人獻一鷹曰非王鷹之疇俄而雲際有一物凝翔飄颻鮮白而不辨其形鷹見之于是竦翮而升矗若飛電須㬰物墮如雪血灑如雨良乆有一大鳥墜地而死度其兩翅廣數十里衆莫能知時有博物君子曰此大鵬鶵也始飛焉故為鷹所制文王乃厚賔獻者兎經三窟莫深憂洙曰馮諼曰狡兎所以免于死者有三窟今為君一窟矣黒鷹不省人間有度海疑從北極來洙曰元命苞瑗光為鷹趙曰北方之極也北方肅殺之氣故鷹多生于此正翮摶風超紫塞洙曰鴈門有紫壃城草皆紫色故曰紫塞趙曰崔豹古今注曰秦所築長城土色皆紫漢塞亦然𤣥冬幾夜宿陽䑓趙曰善本作𤣥舊作立冬非也字出梁元帝纂要冬曰𤣥冬虞羅自各虛施巧洙曰隋魏彦深鷹賦可虞者之多端運横羅以羈束春鴈同歸必見猜萬里寒空祗一日金眸玉爪不凡材鷗大厯元年作補注鶴曰詩云江浦寒鷗戯當是大厯元年䕫州作江謂大江浦謂魚復浦也江浦寒鷗戯無他亦自饒却思翻玉羽隨意㸃春苗雪暗還須落洙曰一作浴風生一任飄趙曰鷗性耐寒常以三月風至乃還舟嶼幾羣滄海上清影日蕭蕭猿大厯元年作補注鶴曰詩云艱難人不免則是在䕫州作故西閣曝日云流離木抄猿又上後園山脚云瘴毒猿鳥落梁權道編在大厯元年裊裊啼虛壁蕭蕭掛冷枝補注希曰爾雅猱一名猨善攀援樹枝郭云便攀援者故後篇亦云猿掛時相學艱難人不免隠見爾如知趙曰人生不免艱難由不知隠見之機若猿則知之常隠茂林之中慣習元從衆趙曰言便㨗之慣衆猿皆如此全生或用竒趙曰全生如博失避弓之事前林騰每及父子莫相離黄魚大厯元年作補注䳡曰詩云日見巴東峽黄魚出浪新當是大厯元年在䕫州作日見巴東峽洙曰荆州記巴東三峽巫峽長黄魚出浪新脂膏兼飼犬洙曰韓愈又犬詩飼犬騐今朝蒼舒曰按鹽鋮論江陵之人以魚飼犬逸曰王充論衡云彭蠡之濵以魚飼犬長大不容身筒筩相㳂乆洙曰筒筩捕魚器也趙曰筒筩散布水中以繫餌觀其没為騐而隨其用以取之也風雷肻為神泥沙捲涎沫回首恠龍鱗白小大厯元年作補注鶴曰詩云天然二寸魚又名之曰白小當是今所謂麫條魚者故詩又云細㣲霑水族當是大厯元年䕫州作白小羣分命洙曰物以羣分天然二寸魚細㣲霑水族風俗當園蔬入肆銀花亂傾箱雪片虛生成猶拾卵盡取義何如洙曰西京賦獲胎拾卵蚔蝝盡取麂大厯元年作補注鶴曰詩云衣冠兼盜賊饕餮用斯須盖因崔旰之亂而言當是大厯元年䕫州作永與清溪别蘓曰夷陵風俗記曰清溪山多麂鹿䝉將玉饌俱洙曰爾雅曰麂大麕花毛狗尾秦曰左太冲吳都賦競其區宇則并疆兼巷矜其晏居則珠服玉饌無才逐仙隠蘓曰九華隠翁不知何許人常驅一白麂往來人莫識其姓名年紀漢武多召不起後與麂同隠山不出不敢恨庖厨亂世輕全物㣲聲及禍樞蘓曰王元行求安路聞有物鳴林中問樵者曰何聲曰鹿也鳴即死少頃果為獵人大獲元嘆曰為爾之㣲聲已彰禍機不可免趙曰言亂世輕全生之物才聞鹿鳴之㣲聲則禍隨之矣衣冠兼盜賊饕餮用斯須洙曰文十八年傳縉雲氏有不才子天下之民以比三㓙謂之饕餮注貪財為饕貪食為餮趙曰言衣冠之人行如盜賊唯知饕餮而已故使人多害生物以充庖止在須臾之間焉雞大厯元年作補注鶴曰詩云巫峽漏司南當是大厯元年䕫州作紀徳名標五洙曰田饒曰夫雞首戴冠文也足持距武也見敵而鬬勇也得食而相呼義也鳴不失時信也雞有五徳初鳴度必三洙曰禮文王世子雞初鳴衣服至寢門蘓曰雞經未曉而必三唱古詩三唱逺村雞殊方聴有異洙曰晉祖逖與劉琨同寢中夜聞雞鳴蹴琨曰此非惡聲因起舞失次曉無慙趙曰公在䕫為殊方于殊方而聴雞鳴有異于中原它日則以雞失鳴之次天既曉矣殊無慙色此陳壽國志所謂失旦之雞者也問俗人情似充庖爾輩堪蘓曰梁繪見羣雞而語曰爾輩堪充吾席之上庖氣交亭育際趙曰梁劉孝綽啓曰一物之㣲遂留亭育巫峽漏司南别蘓徯赴湖南幕作大厯元年補注鶴曰公有贈蘓四徯詩云君今下荆揚獨帆如飛鴻而此詩云北辰為宇宙南嶽據江湖當是大厯元年作故人有遊子棄擲傍天隅洙曰李陵詩游子暮何之又各在天一涯他日憐才命居然屈壯圖趙曰他日前日也常愛憐蘓之才命以為必超騰矣而今居然猶壯圖之屈也十年猶塌翼洙曰陳琳檄忠義之徒垂頭塌翼絶倒為驚呼洙曰昔瑯琊王澄毎聞衛玠言輒嘆息絶倒故時人為之語曰衛玠談道平子絶倒消渇今如在洙曰司馬相如常有消渇病提攜愧老夫洙曰禮長者與之提攜則兩手奉長者之手註謂牽将行又自稱曰老夫豈知䑓閣舊洗沸鳳凰雛洙曰蜀龎統號鳯雛易林鸞者鳳之雛得實翻蒼竹棲枝把翠梧洙曰鳳非梧桐不棲非竹實不食北辰當宇宙南嶽據江湖國帶烟塵色趙曰時干戈未息故曰烟塵兵張虎豹符洙曰杜詩傳發兵皆以虎符補注希曰史記漢文帝初與郡守為銅虎符竹使符國家當發兵遣使者至郡合符符合乃聴受之以代古之圭墇數論封内事揮發府中趨趙曰言蘓徯為幕客則數論其湖南封内之事而能發揮之也府趨之中非一人也古樂府冉冉府中趨贈爾秦人策洙曰文十三年傳秦伯使士㑹行繞朝贈之以策曰子無謂秦無人吾謀適不用也註策馬撾臨别授之馬撾並示已所䇿所策以展情繞朝秦大夫莫鞭轅下駒洙曰灌夫傳上怒内史曰公平生數言魏其武安長短今曰廷論局促效轅下駒應劭曰駒者駕著轅下張晏曰俛頭于車轅下隨母而巳月圓大厯元年作補注鶴曰詩云孤月當樓滿寒江動夜扉當是大厯元年在䕫州西閣作孤月當樓滿寒江動夜扉委波金不定洙曰前漢郊樂歌曰月穆穆以金波蘓曰羊勝月賦金委波而不定桂照水以常搖照席綺逾依洙曰江淹詩綺席生浮埃趙曰委于波中則蕩漾而金色不定照于席上則與綺繡相依未缺空山静趙曰言月之尚圓高懸列宿稀鄭曰宿悉救切列星也故園松桂洙曰一作菊發萬里共清輝洙曰古詩千里共明月又清輝溢天門中宵大厯元年作補注鶴曰詩云西閣百尋餘中宵歩綺䟽當是大厯元年作西閣百尋餘洙曰西京賦巨獸百尋八尺曰尋中宵歩綺䟽洙曰天台賦烱晃於綺䟽又陸機詩𤣥雲拖朱閣振風薄綺䟽飛星過水白過古木切落月動沙虛擇木知幽鳥洙曰仲尼曰鳥能擇木木豈能擇鳥毛詩鳥鳴嚶嚶出自幽谷潛波想臣魚洙曰古詩潛蚪思餘波漢書巨魚縱大壑親朋滿天地兵甲少來書白帝樓大厯二年作補注鶴曰詩云臘破思端綺春歸待一金又云去年梅栁意還欲攪邉心當是大厯二年嵗晏作漠漠虛無裏洙曰陸機街巷給漠漠謝𤣥暉詩生烟紛漠漠連連睥睨侵趙曰睥睨城上女牆也師曰崔豹古今注女牆城上小牆言在大牆之上如女之于夫也一名睥睨言于城上睥睨人也補注希曰漢灌夫傳注睥睨旁視也樓光去日遠峽影入江深臘破思端綺洙曰古詩客從逺方來遺我一端綺春歸待一金蘓曰王逸少春歸待子一金濟貧兒今束縑何用也客皆掀髥逸少自若時懐祖以束縑贈故有此句趙曰所以充費且以為賞補注希曰漢書一金直錢萬師古曰一金與萬錢去年梅栁意還欲攪邉心洙曰詩祗攪我心蘓曰宗壽春日出闉閣時風物明媚顧同行曰去年梅栁俱有春意弟妹天涯何日復得相聚惆悵乆之送王十六判官大厯元年作補注鶴曰此詩當在䕫州作是時蜀客避崔旰之亂盡下荆南而王今復入故詩云客下荆南客下荆南盡君今復入舟買薪猶白帝孫曰䕫州沽水買薪鳴櫓已沙頭洙曰江陵舟船至泊于郭外沙頭衡霍生春早瀟湘共海浮荒林庾信宅為仗主人留補注希曰爾雅疏衡山一名霍山漢武帝移嶽神于天柱又名天社為霍庾信宅在江陵奉送卿二翁統節度鎮軍還江陵大厯二年作補注鶴曰卿二翁姓崔乃公舅氏嘗權䕫州故此詩云落日渭陽情當是大厯二年作火旗還錦纜洙曰龍旂九旒以象大火諸侯所建烏旟七旒以象鶉火州里所建呉甘寧以錦維舟趙曰火旗朱旗也還錦䌫則軍從舟中歸矣甘寧以錦維舟白馬出江城趙曰指言卿二翁也龎徳好騎白馬號白馬將軍嘹唳吟笳發蘓曰戴亨塞管吟笳嘹唳晩風遷客聞之心驚意啾蕭條别浦清寒空巫峽曙落日渭陽情洙曰一作明趙曰巫峽言䕫州渭陽言長安所以懷卿也留滯嗟衰疾何時見息兵蘓曰馮約曰盜賊蜂起江淮秦楚民不奠枕何時息兵歸養殘喘閣夜大厯元年作補注鶴曰詩云嵗暮隂陽催短景又云三峽星河影動搖當是在䕫州作又云野哭千家聞戰伐夷歌幾處起漁樵乃大厯元年作是時崔旰之亂未息歳暮隂陽催短景洙曰謝靈運雪賦歳將暮時既昏天涯霜雪霽寒宵五更鼓角聲悲壯洙曰顔氏家訓問一夜何故五更曰更厯也經也趙曰據西清詩話引禰衡過漁陽慘其聲悲肚三峽星河影動搖修可曰西清詩話云作詩用事要如釋語水中着鹽飲水乃知鹽味此説詩家秘藏也如子美五更鼔角聲悲壯三峽星河影動搖人徒見陵轢造化之工不知乃用故事也禰衡過漁陽慘其聲悲壯漢武故事星辰搖動東方朔謂民勞之應則善用故事豈冇跡耶余曰百斛明珠云七言之麗者杜子美此二句後寂寥無聞野哭千家聞戰伐洙曰夫子惡野哭者非其所而哭曰野哭夷歌幾洙曰一作數處起漁樵洙曰蜀都賦曰陪以白狼夷歌成章卧龍躍馬終黄土洙曰卧龍謂孔明也郭外有孔明廟躍馬謂公孫述也城上有白帝祠此二人蜀之英雄言不免歸于土人事音書漫寂寥洙曰一云人事音塵日寂寥白帝城最高樓大厯元年作補注鶴曰題曰最高樓則非前所賦白帝城樓與白帝樓也當是公大厯元年到䕫時登此樓所作故詩言其最高者為至詩云扶桑西枝封㫁石封一作對城尖徑􅉴洙曰一作翼旌斾愁獨立縹緲之飛樓洙曰海賦神仙縹緲峽坼雲霾龍虎睡江清日抱黿鼉遊扶桑西枝封斷石洙曰日出暘谷浴于咸池拂于扶桑山海經云大荒之中暘谷上有扶桑十日所浴九日居下枝一日居上枝皆戴烏弱水東影隨長流洙曰禹貢弱水既西夢符曰按淮南子弱水自窮石注窮石在張掖北其水弱不能勝羽趙曰蓬萊山下弱水也以弱水在東故言東影道書言蓬萊隔弱水三十萬里不可到是也杖藜歎世者誰子蘓曰黄晟曰子非杖藜歎世者也慮人疑子泣血迸空迴白頭覽鏡呈栢中丞大厯元年作補注鶴曰栢中丞大厯元年為䕫州都督公以是年至夔嘗為栢作謝上表詩云膽銷豺虎窟淚入犬羊天盖以吐蕃自廣徳元年至永泰元年入冦故云渭水流闗内洙曰渭水入于河故浮渭而東遷帝都終南在日邊洙曰詩終南何有毛萇曰終南周之名山趙曰西都賦帶以洪河涇渭之川又表以秦華終南之山則渭水終南者長安也日邊言帝都膽銷豺虎窟洙曰南都賦豺虎肆虐涙入犬羊天起晩堪從事趙曰凡仕有官者必早起起晩者可堪從事乎行遲更覺仙趙曰仙者身輕歩疾老而行遲矣那更覺為仙乎鏡中衰謝色萬一故人憐趙曰傷其衰老而求憐于栢中丞也西閣夜大厯元年作補注鶴曰詩云恍愡寒山暮又云盗賊爾猶存當是大厯元年作盜賊指崔旰也是時旰之亂未静恍愡寒山暮逶迤白露昏山虛風落石樓静月侵門擊柝可憐子洙曰魯擊柝聞于邾易重門擊柝無衣何處村洙曰詩無衣無褐時危闗百慮盜賊爾猶存瀼西寒望大厯元年作補注鶴曰詩云瞿塘春欲望定卜瀼西居當是大厯元年冬作明年春晚果自赤甲遷居瀼西水色含羣動洙曰陶潛詩日入羣動息朝光切太虛洙曰天台賦太虛寥廓年侵頻悵望洙曰陸機豫書行前路既已多後途隨年侵興逺一蕭踈猿挂時相學鷗行烱自如瞿塘春欲至定卜瀼西居洙曰瀼水名管郫縣江水横通山谷處市人謂之瀼趙曰先在赤甲方移瀼西也陪栢中丞觀宴將士二首大厯元年作補注鶴曰公以大厯元年至䕫而栢為都督明年崔卿權州矣則此詩作于元年詩云百戲後歌鑣極樂三軍士誰知百戰塲洙曰西都賦觀三軍之殺獲又曰俛仰極樂者也無私齊綺饌趙曰梁何遜輕薄篇曰象牀沓繡被玉盤傳綺食乆坐宻金章夢符曰按束晉初拜官相餙供饌羊曼丹陽曰客來早者得住設日晏則漸不復精隨客早晚時羊固拜臨海守竟日皆得精饌時以固之豐腆不如曼之真率趙曰此指将士之金帶耳鮑明逺建除詩左右佩金章醉客霑鸚鵡歐曰酉陽雜俎云梁宴魏使魏肈師舉酒勸陳昭儀俄而酒至鸚鵡盃徐君房飲不盡肈師曰海蠡蛇蜒尾翅皆張非以為玩亦以為罰今日直不得辭田曰鸚鵡盃名雕刻海蠡而為之像鸚鵡形昔人以之勸酒且以為罰爵佳人指鳳凰趙曰筵上或畫圖或繡帳上有之而佳人共指為言説也幾時來翠節特地引紅粧洙曰古詩娥娥紅粉粧師曰薛夢符云沈約宋書南平王鑠上赤鸚普詔羣臣為賦袁俶文冠當時又後漢黄祖之子射大㑹賔客有獻鸚鵡者射舉酒于禰衡曰今日無以娛賔願先生為之賦衡筆不停綴文無加㸃詳觀是詩首句云極樂三軍士乃饗軍詩非可使之賦鸚鵡也盖鸚鵡盃名刻海螺而為之昔人以之勸酒并為罰爵南海異物志云鸚鵡螺狀似霞杯形如烏頭向其腹視似鸚鵡故以為名佳人指鳳凰疑是如秦弄玉吹簫乘鳯凰飛去事繡段裝簷額洙曰張平子美人贈我錦繡段金花帖鼓腰趙曰上句則樂工之飾下句則工所擊之鼓一夫先舞劍洙曰子路拔劍而舞項莊舞劍為樂百戯後歌鐎洙曰李廣傳注刁斗以鐎作趙曰戯為䕫峽樵歌之音也補注鐎一本作樵江樹城孤遠雲䑓使寂寥漢朝頻選將應拜霍嫖姚洙曰霍去病為嫖姚将軍奉漢中王手札報韋侍御蕭尊師亡大厯元年補注鶴曰詩云秋日蕭韋逝淮王報峽中當是大厯元年在䕫州作盖永泰元年王已出峽秋日蕭韋逝淮王報峽中洙曰漢有淮南王賢王少年疑柱史洙曰王康琚詩老􅅨伏柱史老子傳老子百有六十餘蛓以其修道而養壽多術恠仙公趙曰淮王則漢南王安其人賢以比漢中王也柱史以言韋侍御老子為周柱下史而韋以少年為之疑其不似也仙公以言蕭尊師仙公宜有多術以延生而死故恠之也不但時人惜祗應吾道窮洙曰左傳反袂拭面稱吾道窮一哀侵疾病相識自兒童處處鄰家笛洙曰向子期思舊賦序于時日薄虞淵寒木淒然鄰人有吹笛者後發聲寥亮追想曩昔遊讌之好感音而嘆作賦飄飄客子蓬洙曰曹子建詩轉蓬離本根飄飄隨長風類此遊客子捐軀逺避戎强吟懷舊賦洙曰潘安仁作懷舊賦巳作白頭翁洙曰魏文帝巳成老翁但未白頭耳南極大厯元年作補注鶴曰詩云古城踈落木荒戍宻寒雲當是大厯元年冬作時在䕫州南極青山衆趙曰南極星名老人之南極也晉天文志南極在井栁之中正是南方之星故云于䕫州詩可用矣補注希曰南極當是用爾雅四雅中南極字言䕫州去長安為逺非取南極星也西江白谷分古城踈落木荒戍宻寒雲洙曰顔延年詩憔悴征戍勤又故國多喬木空城疑寒雲歳月蛇常見蘓曰景二年冬蛇見不蟄乃政令失時風飈虎忽聞近身皆鳥道殊俗自人羣睥睨登哀柝洙曰宣十二年傳守陴者皆哭注陴城上睥睨也趙曰睥睨城上小城也登哀柝指言白帝城上之事有屯戍故也矛弧照夕曛趙曰左傳取蝥弧以登乃鄭之旗名照夕曛則旗為日所照舊作矛弧無義補注希曰韓安國傳弧矢射獵師古曰以木曰弧又百官志教以五兵注弓矢殳矛戈㦸五行志有檿弧矛弧雖亦城戍之所有然是二物不應對睥睨趙注或是故併記之亂離多醉尉尹曰南史何敬容傳謝郁作書戒之曰君侯已得瞻望朝夕出入禁門醉翁終不敢呵灰然不無其慚愁殺李將軍洙曰李廣廢為庶人數與故潁隂侯屏居藍田南山中射獵嘗夜從一騎出從人田間至亭覇陵尉呵止廣廣騎曰故李将軍尉曰今将軍尚不得夜行何故将軍也宿廣亭下搖落大厯二年作補注鶴曰詩云烟塵多戰鼓謂大厯一年九月吐蕃冦邠州靈州京師戒嚴當是其年作故大厯二年九月三十日詩亦云年年小搖落不與故園同搖落巫山暮寒江東北流烟塵多戰鼓風浪少行舟鵞費羲之墨洙曰王羲之傳羲之性愛鵞㑹稽有孤居姥養一鵞善鳴求而未能得遂擕親友命駕就看姥聞羲之至烹以待之羲之歎息彌日又山隂有道士養好鵞羲之看焉意甚悦因求市之道士曰為冩黄庭經當舉羣相贈羲之欣然冩畢籠鵞而去甚以為樂補注希曰羲之為山隂道士冩道徳經太白乃以為冩黄庭經何耶貂餘季子裘洙曰史記蘓秦説李兑遺之黑貂裘蘓秦游秦秦不能用于是貂裘色敝趙曰戰國策蘓秦仕趙不用負貂裘黄金西説秦書十上而説不行黑貂之裘敝長懷報明主卧病復高秋季秋江村大厯二年作補注鶴曰詩云黄柑錦石皆䕫州所有以前篇考之當是大厯二年作喬木村墟古蘓曰孫陽云重到潛溪喬木蔽日村墟故老無一存者踈籬野蔓懸青洙曰一作素琴將暇日趙曰言將琴往江村當暇日也白日望霜天登俎黄柑重洙曰鷦鷯賦肉不登于俎味支牀錦石圓洙曰史龜策傳南方老人用龜支牀足遠遊雖寂寞難見此山川補注杜詩巻三十一
