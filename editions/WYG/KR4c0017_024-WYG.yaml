body:
  text: 補注杜詩巻二十四宋黄希原本黄鶴補注戲作寄上漢中王二首王新誕明珠廣德元年作補注鶴曰詩云秋風嫋嫋吹江漢當是在梓州作與翫月詩同時乃廣德元年雲裏不聞雙鴈過掌中貪見一珠新洙曰三輔決録曰孔融見韋乞將其父書曰不意雙珠生於老蚌蘇曰馬梵賀人有子曰欣得掌中之一珠秋風嫋嫋吹江漢洙曰謝靈運嫋嫋秋風過湘夫人云嫋嫋兮秋風只在他鄉何處人謝安舟楫風還起洙曰謝安嘗與孫綽等泛海風起浪湧諸人並懼安吟嘯自若舟人以安爲悅猶去不止風轉急安徐曰如此將何歸耶舟人黙然即回衆咸服其雅量梁苑池臺雪欲飛洙曰謝靈運雪賦歲將暮時既昏寒風積愁雲繁梁王不悅游於兔園俄而微霰零宻雪下杳杳東山攜漢妓洙曰謝靈運攜妓游東山趙曰戲言漢中王謝安攜妓東山之興杳杳然泠泠修竹待王歸修可曰修竹梁孝王園名也續漢書梁王兔園多植竹即所謂修竹園地志云孝王東苑方三百里苑中有鴈池修竹園投簡梓州幕府兼簡韋十郎官補注鶴曰梁權道編在寳應元年梓州作然詩云幕下郎官安穩無從來不奉一行書則不在梓州作當是在漢州以後篇知之幕下郎官安穩無趙曰出佛書問世尊曰世尊安穩否從來不奉一行書補注希曰幕下郎官謂韋十以郎官而入梓州之幕唐多以朝士入州幕如韋應物寄洪州幕府盧侍御是也應物詩亦云冰壺幕下清因知貧病人須棄能使韋郎跡也疎答楊梓州廣德元年作補注鶴曰詩云悶到房公池水頭坐逢楊子鎮東州蓋謂公在漢州遇楊也當是廣德元年再至漢州時作悶到楊洙曰一作房公池水頭坐逢楊子鎮東州洙曰梓州東州也却向青溪不相見回船應載阿戎遊洙曰阮籍謂王渾曰與卿語不若與阿戎談阿戎謂王戎也渾之子師曰楊梓州先人嘗守鑿池一百頃引水爲農田利今在梓州青溪之西號楊公池今子又再守此州故甫詩有載阿戎遊之詩補注希曰鑿池百頃爲農田利史必書之而志皆不載不知師注何所本楊公作房公爲是蓋公在漢州逢楊子去守梓州也若池爲楊公池在梓州其子又從而鎮此州詩必不爾云也贈韋贊善别寳應元年作補注鶴曰詩云扶病送君發自憐猶未歸江漢故人少音書從此稀當是寳應元年梓州作公又有贈韋贊善詩梁權道編在大厯五年潭州則韋亦流轉南州不得歸也韋乃韋見素之後詳見後注唐志東宫有一名贊善大夫各五人掌傳令諷過失贊禮儀扶病送君發自憐猶不歸秖應盡客淚復作掩荆扉江漢故人少音書從此稀往還二十載歲晚寸心違蘇曰張季鷹秋日北園詩旅途驚歲晚歸興與心違工部用語補綴尤有工巧了不見痕迹後進可爲師範送李卿煜廣德元年作補注鶴曰詩云王子思歸日長安已亂兵霑衣問行在走馬向承明當是廣德元年十二月作按宗室世系表煜大鄭王房淮安忠公琇之子終刑部侍郎王子思歸日長安巳亂兵趙曰王子指李煜時有吐蕃之亂也霑衣問行在趙曰代宗車駕出幸陜也走馬向承明趙曰承明漢殿名暮景巴蜀僻春風江漢清晉山雖自棄魏闕尚含情趙曰按宣室志載庻史有道士尹君者隠晉山不食粟嘗餌栢葉北門從事嚴綬敬事之莊子言身在江湖之上心遊魏闕之下絶句趙曰或云江邊踏青乃成都事毎以三月三日出郊言踐踏青草故謂之踏青廣德元年作補注鶴曰梁權道編在寳應元年梓州作按公是年夏送嚴武至綿州尋避亂至梓巳是秋豈踏青之時當是廣德元年春江邊踏青罷迴首見旌旗風起春城暮髙樓鼓角悲修可曰唐李綽歲時記云三月上已有錫宴羣臣於曲江傾都人物於江頭褉飲踏青補注希曰盧公範饋餉儀三月三日上踏青鞋九日登梓州城寳應元年作補注鶴曰公於寳應元年廣德元年皆在梓州今以後篇詩云去年登髙郪縣北考之則此詩在寳應元年作此詩云兵戈與闗塞此日意無窮蓋指史朝義之亂未巳而黨項羌又入宼也伊昔黄花酒如今白髮翁追歡筋力異望逺歲時同弟妹悲歌裏朝廷醉眼中蘇曰索休曰近戮子胥朝廷在吾醉眼中矣兵戈與闗塞趙曰兵戈以言戰鬬闗塞以言屯戍時吐蕃之亂既戰復守也此日意無窮九日奉寄嚴大夫趙曰時嚴武歸朝以御史中丞進爲大夫故云補注鶴曰嚴武以寳應元年夏赴召公送至綿尋入梓故有何路出巴山之句蔡興宗魯訔年譜所載同然武夏離成都而九日尚在巴嶺何其遲遲如此必是路梗九日應愁思經時冒險艱不眠持漢節趙曰謂嚴武充明皇肅宗山陵橋道使也補注希曰髙帝紀注師古曰節以毛爲之上下相重取象竹節因以爲名將命者持之以爲信趙注以爲武充橋道使故云殊非是時武未到闕尚在巴嶺也何路出巴山趙曰公自言也蓋公時方在梓久客厭倦而欲出耳小驛香醪嫩重巖細菊斑遙知簇鞍馬迴首白雲間趙曰公遥想其簇鞍馬而迴首白雲以望之北嚴武所謂杜二見憶者謂此也巴嶺答杜二見憶嚴武作卧向巴山落月時趙曰指言杜公也兩鄉千里夢相思趙曰嚴與杜各在一鄉相去千里而夢想之也可但歩兵偏愛酒洙曰阮籍聞歩兵厨多美酒營人善釀求爲校尉也知光禄最能詩洙曰謝光禄名莊字希逸所著文章四百餘首仕至光禄大夫江頭赤葉楓愁客洙曰楚辭湛湛江水兮上有楓籬外黄花菊對誰趙曰列以問杜公也使淵明採菊東籬下句跂馬望君非一度趙曰答杜前篇簇鞍馬之語冷猿秋鴈不勝悲薛曰此詩洪覺謂之滑吞蘇李體見前巻題省中院壁注懷舊趙曰懷蘇源明也公平生所最善今巳死而追悼之故曰懷舊永泰元年作補注鶴曰詩云地下蘇司業蓋指源明也源明以廣德二年死此詩當作於永㤗元年是年公在成都亦有哭蘇少監鄭司户詩梁權道編此詩於雲安作地下蘇司業親情獨有君洙曰司業即源明也新史云雅善杜甫那因喪一作衰亂後鄭曰喪息郎切便有一作作死生分老罷知明鏡悲來望白雲自從失詞伯不復更論文趙曰王充論衡文詞之伯師曰時源明巳死故云地下知明鏡言覽鏡知其衰老古有白雲篇觀蘇之篇詠則情不勝其悲所思趙曰古樂府云有所思故公倚以爲題䖍以禄山之汙貶台州司戸乾元二年作補注鶴曰鄭䖍之貶在至德二載十二月其去在乾元元年是時公在諫省而此詩云台州信所傳何也無乃議罪之時公不與間既謂之信所傳則當是乾元二年未去諌省時作鄭老身仍竄台州信洙曰一作始所傳洙曰鄭老䖍也以賊汙貶台州爲農山澗曲卧病海雲邊世已疎儒素蘇曰梁珩世方用兵戈與儒業相疎三代典謨慮後此掃地人猶乞酒錢洙曰公嘗贈䖍詩云賴得蘇司業時時與酒錢徒勞望牛斗無計斸龍泉趙曰使牛斗之間有紫氣龍泉劒名也斸之爲言掘也以劒比䖍之在台州如劒之埋於土中徒望其衝牛斗之氣無由掘顯之也師曰台州屬呉呉應牛斗之域昔雷煥掘劒於豐城獄上常有紫氣夜衝牛斗斸謂掘取之也喻䖍有衝斗氣朝廷不用故云無計斸龍泉不見魯曰近無李白消息乾元二年作補注鶴曰詩云不見李生久蓋以公自開元中與白同遊齊兖至乾元元年白流夜郎時可謂久矣此詩當是二年作故云世人皆欲殺梁權道編在寳應元年梓州作不知是年白已死矣不見李生久佯狂真可哀趙曰箕子被髮佯狂唐史載以永王璘之累流夜郎世人皆欲殺趙曰白㑹赦還潯陽坐事下獄此衆人欲殺之證也吾意獨憐才敏㨗詩千首飄零酒一杯匡山讀書處鄭曰匡廬山也頭白好歸來洙曰新史載白始隠岷山後客任城居徂徠山而不載匡山也修可曰范傳正李白新墓碑云白之先客居蜀之彰明太白生焉彰明綿之屬邑有小大匡山白讀書於大匡山有讀書臺尚存其宅在清廉鄉後廢爲僧房號隴西院蓋以太白得名所謂匡山乃彰明之大匡山非匡廬也補注鶴曰李白望廬山五老峯詩云九江秀色可攬結吾將此地鎖雲松望廬山瀑布水詩云而我遊名山對之心益閒且諧宿所好永願辭人間又南康軍圖經云李白性喜名山飄然有物外志以廬阜水石佳處遂往遊焉至五老峯愛其險峭竒勝曰天下之壯觀也卜築於此吾將老焉今峯下有書堂舊基白後北歸猶不忍去乃指廬山曰與君再㑹不敢寒盟丹崖緑壑神其鑒之故白送姪嵩遊廬山序又云慙未歸於名山指廬山而言也然則指廬山而言亦未必不是元和十二年丁酉白樂天有祭匡山文題𤣥武禪師屋壁寳應元年作補注鶴曰髙僧傳宋曇摩密多爲連眉禪師又爲大禪師蓋師之尊稱也以舊次前後篇詩觀之當是寳應元年梓州作何年顧虎頭趙曰世說載顧愷之爲虎頭將軍舊注以爲僧相誤矣滿壁畫滄洲修可曰顧愷之小字虎頭晉陵無錫人多才氣尤工丹青傳寫形勢莫不絶妙曾於瓦棺寺北殿畫維摩詰畫訖光耀月餘赤日石林氣青天江海洙曰一作水流錫飛常近鶴洙曰天台賦振金策之鈴鈴飛錫杖也田曰圖經舒州潛山最竒絶而山麓尤勝誌公與白鶴道人欲之同謀於梁武帝帝以二人悉具靈通俾各以物識其地得者居之道人云某以鶴止處爲記誌公云某以卓錫處爲記已而鶴先飛去至麓將止忽聞空中錫飛聲誌公之錫遂卓於山麓道人不懌然以前言不可食遂各以所識築室焉杯渡不驚鷗洙曰髙僧傳杯渡者不知其名姓常乗木杯渡河因名焉不修細行不甚精持飲酒食肉與俗人不殊趙曰傳燈録載劉宋時杯渡者不知姓名嘗乗木杯渡水嘗宿一家竊一金像去主人追之至孟津浮木杯渡河無假風掉輕疾如飛不驚鷗使列子海人有狎鷗之意似得廬山路真隨惠逺遊洙曰世說逺公在廬山雖老講論不輟弟子中或有墮者逺公曰桑榆之光理無逺照但願朝陽之輝時與並光明耳沈曰昔陶淵明與惠逺遊從結白蓮社甫以比之聞官軍收河南河北新添春廣徳元年作補注鶴曰按通鑑史朝義屢敗於寳應元年之冬至廣德元年田承嗣說令親往幽州發兵還頴莫州請自留守莫州朝義既去承嗣即以城降送朝義母妻子於官軍又范陽節度使李懷仙已因中使駱奉仙請降至温泉驛懷仙遣兵追之朝義窮蹙縊於林中今詩云劒外忽傳收薊北正謂此也又云青春作伴好還鄉乃廣德元年春作劒外忽傳收薊北初聞涕淚滿衣裳却看妻子愁何在漫巻詩書喜欲狂趙曰讀書之際聞巳收薊北得妻子有長聚之慶所以漫巻之而喜欲至於狂也白首放歌須縱酒青春作伴好還鄉即從巴峽穿巫峽便下襄陽向洛陽余曰田園在東京涪江泛舟送韋班歸京得山字春廣德元年作補注鶴曰涪江在梓州故有涪城縣詩云傷春一水間當是廣德元年春在梓州作追餞同舟日傷春洙曰作心一水間趙曰古詩云相望一水間飄零爲客久衰老羨君還花逺洙曰一作雜重重樹雲輕處處山趙曰一作花逺非蓋重重樹則已有逺意不可疊用也天涯故人少更益鬢毛斑春日梓州登樓二首廣德元年春作補注鶴曰詩云江水流城郭春風入鼓鞞當是廣德元年春作又云戰塲今始定蓋以史朝義巳死行路難如此登樓望欲迷身無却少壯跡有但羈栖江水流城郭春風入鼓鞞洙曰石勒聞鼔鞞之聲雙雙新燕子依舊巳銜泥洙曰古詩思爲雙飛燕銜泥巢君堂師曰甫言久客一身羈栖今日登樓所見景物如此不無所感天畔登樓眼隨春洙曰一作風入故園趙曰指洛陽也戰場今始定移柳更洙曰一作豈能存趙曰史朝義巳滅戰場雖定而故園舊所移柳更能存乎更疑辭也補注希曰李華曰此古戰場也常覆三軍今云定則不復用兵矣移柳正用陶依課諸營種柳事言既寢兵則可移柳而柳亦可存也厭蜀交遊冷蘇曰廖岸遷居人問其故曰厭此交態寒冷故有所適耳思吳勝事繁歐曰晉張翰守官於洛及秋風起忽思呉蓴菜鱸魚之興遂棄官歸甫既厭蜀欲適呉楚故有思呉之句應須理舟楫長嘯下荆門定功曰袁山松宜都山川記曰南崖有山名荆門北崖有山名虎牙二山相對有象門然遣憤永泰元年作補注鶴曰詩云聞道花門將論功未盡歸當是永泰元年子儀與回紇再盟藥葛羅帥衆追吐蕃子儀使白元光帥精騎與之俱殺吐蕃於靈臺西原萬計又破之於涇州於是回紇胡禄督等二百餘人入見前後贈賚繒帛十萬疋府藏空竭稅百官俸以給之此所以爲可憤也事見通鑑詩云蜂蠆終含毒雷霆可震威莫令鞭血地再濕漢臣衣可謂身在江湖而心存王室也聞道花門將洙曰回紇也論功未盡歸自從收帝里趙曰長安也誰復總戎機蜂蠆終懷毒洙曰左傳君無謂邾小蜂蠆有毒況國乎蘇白武黨廟記張良謂蕭何曰黥布輩如蜂蠆逐時暫親近人其懷毒之性不革雷霆可震威洙曰賈山傳人性之威非特雷霆也趙曰大意以回紇助討史朝義恐其恃功難制欲早加威以絶止之莫令鞭血地再濕漢臣衣洙曰時回紇恃功陵暴此詩之作蓋有所警也師曰禄山亂回紇以兵助討賊其後恃功桀驁故蜂蠆終懷毒欲帝震之以威無使彼再蹈禄山之陷京闕也漢書云禁中非刑人鞭血之地鞭血地指禁中也花門將即回紇之將送竇九歸成都廣德元年作補注鶴曰竇九意是檢察竇侍郎者故詩云持節廣德元年梓州作文章亦不盡竇子才縱横非爾更持節何人符大名讀書雲閣觀問絹錦官城我有浣花竹題詩須一行贈裴南部新添年廣徳元作補注鶴曰南部縣名屬閬州詩云塵滿萊蕪甑堂横單父琴是裴爲南部宰元年公至閬州時贈之塵滿萊蕪甑堂横單父琴蘇曰范丹字史雲爲萊蕪令清貧人歌曰釜中生魚范萊蕪甑中生塵范史雲宓子賤爲單父宰彈琴不下堂而治人皆知飲水公輩不偷金本中曰鄧攸爲呉郡載米之郡惟飲呉水而巳同舍郎誣直不疑偷金不疑買償之梁獄書應作去聲秦臺鏡欲臨獨醒時所嫉羣小謗能深即出黄沙在應須白髪侵使君傳舊德巳見直繩心奉送崔都水翁下峽新添年廣徳元作補注鶴曰詩云無數涪江筏當是廣德元年梓州作觀末句則知公有意於到䕫矣無數涪江筏鄭曰筏房越切海中桴鳴橈總發時鄭曰橈如招切楫也别離終不久宗族忍相遺白狗黄牛峽鄭曰十道志開州有白狗峽又有黄牛峽朝雲暮雨祠所過憑問訊過古禾切到日自題詩郪城西原送李判官兄武判官弟赴成都府鄭曰郪七稽切縣名在梓州補注鶴曰詩云野花隨處發官柳著行新當是廣德元年春作憑髙送所親久坐惜芳辰逺水非無浪趙曰以言其行路之辛苦他山自有春蘇曰阮咸歸陳留咸曰看洛中春罷去王尚曰他山春色甚可人意清泉白石清人耳目比洛中無塵土氣味野花隨處發官洙曰一作妖柳著行新行胡岡切天際傷愁别離筵何太頻師曰甫與二判官於情最親臨此送别言其此去如逺水不能無風浪他山雖有春兄弟不得同賞以至野花官柳觸目使人不能無傷感也題郪原郭三十二明府茅屋壁與前篇同時作補注鶴曰詩云雲散灌壇雨春青彭澤田當是在梓州作與前篇同時江頭且繫船爲爾獨相憐雲散灌壇雨鄭曰博物志太公爲灌壇令春青彭澤田補注希曰彭澤縣名雖在江州以郭明府爲縣令故用淵明事淵明有田種秫頻驚適小國一擬問髙天補注希曰楚辭有天問别後巴東路逢人問幾賢客夜寳應元年作補注鶴曰公寳應元年自綿至梓時家在成都秋晚方迎家再至梓今云老妻書數紙應悉未歸情當是在梓州作若如梁權道編在是年閬州詩内則家固同在也客睡何曾著秋天不肯明入簾殘月影髙枕逺江聲補注希曰葉挺嘗云客睡何曾著秋天不肯明工在不肯字入簾一本作捲簾計拙無衣食途窮仗友生洙曰見今日暮途窮注伐木詩不如友生老妻書數紙應悉未歸情陪王侍御宴通泉東山野亭寳應元年作補注鶴曰通泉縣名屬梓州當是寳應元年冬十一月公至通泉時作梁權道編在廣德元年非惟蔡興宗魯訔年譜編在寳應元年江水東流去清樽日復斜異方同宴賞何處是京華亭景臨山水村煙對浦沙狂歌遇形勝得醉即爲家蘇曰阮宣飄流往來人間居止何地曰得醉處即爲家客亭寳應元年秋作補注鶴曰與客夜詩同是寳應元年秋在梓州作秋窓猶曙色落木更天洙曰一作髙風日出寒山外江流宿霧中聖朝無棄物蘇曰王祥聖世物無大小皆料材適用無棄擲者老病巳成一作衰翁多少殘生事飄零似轉蓬行次鹽亭縣聊題四韻奉簡嚴遂州蓬州二使君諮議諸昆季廣徳元年作魯曰此詩奉簡嚴遂州兩兄弟以比蜀之名士補注鶴曰鹽亭縣屬梓州當是廣德元年公自梓州至鹽亭時作公是年春夏在梓鹽亭縣在梓州東九十里遂州與梓州爲鄰蓬州則鄰於閬州而閬與梓又爲鄰也嚴非梓州人則所領州近梓故公有此詩馬首見鹽亭髙山擁縣青雲溪花淡淡洙曰一作漠漠春郭水泠泠全蜀多名士洙曰蜀都賦近則江漢炳靈世載其英鬱若相如皭若君平王襃曄曄而秀發揚雄含章而挺生趙曰多名士指言當日之人嚴家聚德星洙曰陳仲子從諸子造荀季和德星聚太史奏賢人聚也長歌意無極好爲老夫聽倚杖洙曰鹽亭縣作趙曰鮑昭有倚杖牧雞豚之句故公倚以爲題廣德元年春作補注鶴曰詩云山縣早休市江橋春聚船當是廣德元年春作看花雖郭外倚杖即溪邊山縣早休市江橋春聚船狎洙曰一作野鷗輕白浪洙曰子列子有狎鷗翁言忘機故物亦不懼趙曰言可狎之鷗遊泳乎白浪之中歸鴈一作鳥喜青天物色兼生意凄凉憶去年泛江送魏十八倉曹還京因寄岑中允參范郎中季明廣德元年作補注鶴曰詩云帝鄉愁緒外春色淚痕邊指𤣥宗肅宗將葬當是廣德元年梓州作是年岑參自號州長史歸爲太子中允遲日深春洙曰一作江水洙曰詩春日遲遲輕舟送别筵帝鄉愁緒外春色淚痕邊見酒須相憶將詩莫浪傳補注希曰朝野僉載咸亨中謠曰莫浪傳阿婆瞋若逢岑與范爲報各衰年送路六侍御入朝廣德元年春作補注鶴曰詩云劒南春色還無賴觸忤愁人到酒邊當是廣德元年春梓州作童稚情親四十年洙曰言相得於總角中間消息兩茫然更爲後㑹知何地忽漫相逢是别筵不分桃花紅似錦蘇曰李夫人病起南園桃花盛開李不悅武帝問其故李曰不分桃花如錦惱人病眼帝感其言遂去其花爲一國笑生憎柳絮白於綿劒南春色還無賴觸忤愁人到酒邊師曰甫與路侍御相得於總角之時中間不得消息未知後㑹在何處言今春色使人愁悶不若以酒消遣之泛江送客廣德元年作補注鶴曰詩云二月頻送客東津江欲平當是廣德元年公暫遊左綿時作東津在綿州按打魚歌云綿州江水之東津二月頻送客東津江欲平煙花山際重舟楫浪前輕淚逐勸杯落愁連吹笛生洙曰馬融去京踰年有洛客逆旅吹笛暫聞之甚悲感離筵不隔日那得易爲情洙曰離筵祖席也上牛頭寺廣德元年作補注鶴曰寺在梓州當是廣德元年作牛頭山在梓州九州記云葛仙翁嘗遊於此青山意不盡衮衮上牛頭趙曰衮衮相繼不絶之義補注希曰寰宇記云牛頭山在梓州郪縣西南二里髙一里形似牛頭四面孤絶下有長樂寺樓閣煙花爲一方之勝槩無復能拘礙真成浪出遊花濃春寺靜竹細野池幽何處鶯啼切移時獨未休望牛頭寺廣德元年作補注鶴曰詩云春色浮山外而上篇云濃花春寺靜當是與之同時作牛頭見鶴林薖曰鶴林即靈仙觀也梯逕繞幽深洙曰一作秀麗一何深春色浮洙曰一作流山外天河宿洙曰一作沒殿隂詠曰言殿髙通天河也傳燈無白日洙曰釋書以燈諭法謂能破暗也六祖相傳一法故云傳燈故釋書有傳燈録趙曰此言長明燈也借傳燈字言之所以照夜而白日亦有燈故云無白日布地有黄金洙曰見長者自布地注趙曰言佛宇有黄金布地休作狂歌老回看不住心洙曰釋書有不住相趙曰佛書有住相而公用之取於無所住而生其心之義也上兠率寺兠當侯切補注鶴曰寺在梓州當是廣德元年作兠率知名寺洙曰佛書有兠率天宫故取以名寺真如㑹法堂洙曰真如禪理也趙曰佛書言真如實際江山有巴蜀趙曰江山自有巴蜀時便有之此乃羊叔子所謂自有宇宙來便有此山之義補注鶴曰此謂江山占巴郡蜀郡之地蓋劒南道古梁州之域漢巴郡蜀郡之地寺在梓州故云非謂江山自有巴蜀時便有之棟宇自齊梁庾信哀雖久何顒好不忘洙曰何顒後漢人尚氣節感友人之義與李膺善後爲宦者所陷亡匿汝南間所至皆稱其豪傑袁紹愛慕之私與往來結奔走之友趙曰庾信作哀江南賦所以哀者以金陵瓦解而身竄荒谷後漢黨事起顒私入洛陽後袁紹計議其爲求救援以濟其患蓋公言身巳流離有庾信之哀而哀愁之中不忘交好何顒者有救之之心也師曰言甫所至爲人所好詩所謂在彼無惡在此無斁是也白牛車逺近趙曰法華經云有太白牛肥壯多力以駕寳車蓋喻大乗也且欲上慈航夢符曰按清涼禪師序般若心經云般若者苦海之慈航昏衢之巨燭也望兠率寺補注鶴曰與前篇同時作樹密當山徑江深隔寺門霏霏雲氣重洙曰九章曰霰雷紛其無垠兮雲霏霏而乗宇閃閃浪花翻不復知天大空餘見佛尊時應清盥罷隨喜給孤園洙曰釋書有給孤園又有給孤長者甘園廣德元年作補注鶴曰詩云春日清江岸又云白雪避花繁橘之開花在春晚當是廣德元年作春日清江岸千甘二頃園青雲著洙曰一作羞葉密白雪避花繁洙曰郭璞柑贊花染繁霜葉鮮翠籃趙曰本言密葉如雲白花如雪而變其語云雲羞雪避乃公新竒之句結子隨邊使開筒近至尊洙曰蜀柑歲入貢蘇曰隋文帝好食柑蜀中摘董柑即以蠟汗其蔕用筠籃盛封之使不泄香氣後於桃李熟終得獻金門洙曰公自記意於章末數陪李梓州泛江有女樂在諸舫戲爲豔曲二首廣德元年春作補注鶴曰詩云競將明媚景偷眼豔陽天當是廣德元年春作上客迴空騎佳人滿近船江清歌扇底洙曰以扇自障而歌故謂之歌扇野曠舞衣前玉袖淩風並金壺隠浪偏補注希曰玉袖如霍光傳所謂玉衣子虛賦所謂玉綏蓋以玉爲飾也競將明媚色偷眼豔陽天洙曰一作年趙曰公言佳人自衒其美色偷眼瞻視春光以爭相勝之意鮑明逺詩兹辰自爲美當避豔陽天白日移歌袖青霄近笛牀翠眉縈度曲鮑曰古詩云度曲翠眉低補注鶴曰前漢元帝紀自度曲被歌聲應劭曰自隠度作新曲因持新曲以爲歌詩聲也臣瓚曰度曲謂歌終更授其次謂之度曲西京賦曰度曲未終雲起雪飛張衡舞賦亦曰度終復位次受二八師古曰應荀二說皆是雲鬢儼分行立馬千山暮迴舟一水香使君自有婦莫學野鴛鴦修可曰古樂府陌上桑羅敷行云使君謝羅敷寧可共載車羅敷前致詞使君一何愚使君自有婦羅敷自有夫李梓州泛江有女樂公用此以諷之登牛頭山亭子廣德元年作補注鶴曰詩云猶殘數行淚忍對百花叢當是廣德元年作與上牛頭寺同一時作路出雙林外亭窺萬井中洙曰市井也江城孤照日山洙曰一作春谷逺含風兵革身將老闗河信不通趙曰吐蕃猶盛也猶殘數行淚忍對百花叢陪李梓州王閬州蘇遂州李果州四使君登惠義寺廣德元年春作補注鶴曰詩云春日無人境又云鶯花隨世界當是廣德元年春在梓州作魯訔年譜亦云在是年春日無人境虛空不住天修可曰取佛書不住相意謂天運無常以成四時覺範曰不住者言無著也鶯花隨世界樓閣倚山巔洙曰倚一作寄爾雅釋名山頂曰冢亦曰巔遲暮身何得洙曰言衰老而未有所得也登臨意惘然誰能解金印趙曰所以諷四使君也瀟洒共安禪洙曰一云三軍將五馬若箇合安禪蘇曰王得至少室山寺愛其瀟洒顧弟待曰好解金印共此安禪庻免榮華之累弟笑而不答補注希曰法華經偈曰安禪合掌送何侍御歸朝彦輔曰李梓州泛舟筵上作廣德元年作補注鶴曰詩云舟楫諸侯餞又云春日垂霜鬢當是廣德元年泛江作舟楫諸侯餞趙曰言李梓州作泛舟之筵也車輿使者歸洙曰御史乃使者山花相映發水鳥自孤飛春日垂霜鬢天隅把繡衣洙曰漢御史繡衣持斧故人從此去洙曰一作逺寥落寸心違江亭送眉州辛别駕昇之得無字作廣徳元年補注鶴曰公有江亭王閬州筵餞蕭遂州則江亭在閬州當是廣德二年春公在閬州作梁權道編在梓州作恐非柳影含雲幕洙曰一作重江波近酒壺異方驚㑹面終宴惜征途趙曰曹子建詩終宴不知疲沙暖低風蝶天晴喜浴鳬别離傷老大意緒日荒蕪蘇曰孔孟傷别離情悰唯傷老大涪城縣香積寺官閣鄭曰涪城梓州縣廣德元年作補注鶴曰長安亦有香積寺代宗爲元帥率諸軍屯於香積寺是也此寺在梓州涪城縣不得不以涪城縣冠寺名之上不如牛頭寺兠率寺直以寺言涪城在梓州西北五十五里詩云寺下春江深不流亦當是廣德元年春作寺下春江深不流山腰官閣逈添愁含風翠壁孤雲細背日丹楓萬木稠小院回廊春洙曰一作青寂寂浴鳬飛鷺晚悠悠諸天合在藤蘿外昏黑應須到上頭洙曰釋書有諸天皆言勝樂事公之末章因以見志也蘇曰常琮侍煬帝遊寳山帝曰幾時到上方琮曰昏暗應須到上頭左右失笑帝曰淳古君子也戲題寄上漢中王三首寳應元年作洙曰時王在梓州初王乃斷酒不飲篇中有戲補注鶴曰按漢中王傳肅宗詔收羣臣馬助戰瑀與魏少遊持不可帝怒貶蓬州長史而舊史魏少遊傳云率羣臣馬在乾元二年十月今詩云成都老客星一别五愁螢謂公自乾元六年出華州時與王别至寳應元年爲五年則公是年在成都故曰成都老客星而趙注謂此梓州詩爲非王注謂王時在梓州亦非蓋詩云不能隨皂蓋則王尚在蓬州雖當更代而道便未得歸故詩又云羣盜無歸路今考此云不能隨皂蓋及奉漢中王手札詩云剖符來蜀道皆是太守事疑史誤且魏少遊是時以衞尉卿貶渠州長史而瑀以親王無容亦貶長史當是刺史而史誤爲長史無疑西漢親王子洙曰王讓皇帝之子汝南王璡弟也補注希曰蔡邕獨斷漢制皇子封王其實諸侯也周末諸侯或稱王漢天子稱皇帝故以王號加之總名諸侯王封德彞曰漢所封惟帝子若親昆弟其屬逺非大功不立成都老客星洙曰公自喻也趙曰嚴武與光武同宿史占客星犯帝座百年雙白鬢一别五秋洙曰一作飛螢洙曰五飛螢則歲五換矣忍斷杯中物蘇曰呉術好飲酒因醉詬權貴遂誡酒阮宣命飲術曰近斷飲宣歐其背曰看看老逼癡漢忍斷杯中物耶抑而飲之秖看座右銘洙曰崔子玉有座右銘不能隨皂蓋趙曰皂蓋指漢中王也漢二千石朱轓皂蓋補注希曰漢中王貶蓬州長史長史别駕不應稱皂蓋孔恂爲别駕别駕車有屏星如刺史車豈皂蓋亦然耶自醉逐浮萍策杖時能出王門異昔遊洙曰謂其斷酒也巳知嗟不起師曰王以酒得病遂斷飲未許醉相留蜀酒濃無敵洙曰蜀都賦觴以醥清一醉累月江魚美可求終思一酩酊淨掃鴈池頭鄭曰西京雜記梁孝王死有鴈池羣盜無歸路衰顔㑹逺方尚憐詩警策洙曰文賦立片言以居要乃一篇之警策趙曰梁鍾嶸作詩品曰陳思贈弔仲宣七哀公幹思友阮籍詠懷靈運鄴中士衡擬古陶公詠貧之製惠連搗衣之作皆五言之警策者猶憶酒顛狂魯衞彌尊重蒭曰語云魯衞之政兄弟也漢中王與兄璡俱領重鎮徐陳畧喪亡洙曰魏文帝與王粲書云徐陳應劉一時俱逝何數言之間零落畧盡趙曰言王賓客多喪空餘枚洙曰一作故叟在應念早升堂洙曰枚叟公自喻也趙曰雪賦延枚叟陪章留後侍御宴南樓得風字作廣徳元年補注鶴曰按舊史梓州刺史章彞初爲武判官及是小不副意召赴成都殺之乃在廣德二年再鎮成都時則前所謂李梓州者乃寳應元年及廣德元年之春在梓州而是年之夏至二年則章侍御守梓州也此詩云朝廷燒棧比事亦在廣德元年當是其年夏末作絶域長夏晚趙曰非吾鄉而在逺亦可用絶域矣補注鶴曰凡材茂行可使絶域漢武帝詔也當時絶域指匈奴逺國而言公今於蜀亦云者蓋蜀在漢亦夷地也兹樓清宴同朝廷燒棧北鼓角滿天東洙曰謂在大散之北也髙祖入漢張良說髙祖燒絶棧道攻破大散雅州在蜀之西地地多雨名漏天滿一作漏趙曰因宴南樓而望長安也補注鶴曰廣德元年吐蕃陷隴右諸州詔焚大散闗公在成都言之則燒棧北也是時史朝義已自殺東郡又隔年巳無事鼔角不至於滿天東舊注漏天或是猶言朝廷在燒棧之北鼓角在漏天之東雅州屬西川而梓爲東川故也又寰宇記云巂州有漏天巂亦屬西川屢食將軍第蘇曰呉罕屢乞食於將軍第宥俱蒙魚味仍騎御史驄洙曰見憲府舊乗驄注唐曰甫以避亂食章公之宅騎章公之馬敘其恩禮之厚本無丹竈術洙曰道家燒丹之事修可曰江文通别賦華隂上士服食還仙術既妙而猶學道以寂而未傳守丹竈而不顧鍊金鼎而方堅那免白頭翁洙曰言無丹竈之術以延年也宼盜狂歌外形骸痛飲中洙曰以酒自飲耳野雲低渡水簷雨細隨風出號江城里趙曰夜傳號令此節度府之事也題詩蠟炬紅趙曰言宴中明燭而題詩此身醒復醉不擬哭途窮洙曰阮籍以酒自隠故得免難出不由徑遇途窮則慟哭而反公自言取籍之自隠於酒而不倣其哭窮途也臺上得凉字補注鶴曰詩云改席臺能迥當是自南樓復宴臺上而作也改席臺能迥趙曰改席則自南樓改於臺上也留門月復光雲霄遺暑濕洙曰蒸鬱也山谷進風涼老去一杯足洙曰不如生前一杯酒誰憐屢舞長洙曰賔之初筵屢舞傞傞何須把官燭似惱鬢毛蒼送王十五判官扶侍還黔中得開字作廣徳元年補注鶴曰詩云大家東征逐子回又云青青竹笋迎船出當是王侍母於夏初歸黔中郡即黔州採訪使之所治舊次廣德元年大家東征逐子回洙曰後漢曹世叔妻者班彪之女名昭字惠姬和帝數召入宫令王后貴人師事焉號曰大家子殻爲陳留長垣縣長大家隨至官作東征賦以敘行李趙曰大家指言王判官母風生洲渚錦帆開洙曰煬帝以錦爲帆青青竹笋迎船出白白江魚入饌來修可曰楚國先賢傳孟宗至孝母好食笋冬月無之宗入林中哀號笋爲之生後漢烈女傳姜詩及妻龎氏並至孝母好飲江水嗜魚鱠又不獨食夫婦嘗力作鱠呼鄰母共之舍側忽有泉湧味如江水每日輙出雙鯉常供二母之膳王判官侍母回黔故有此句離别不堪無限意艱危深仗濟時才黔陽信使應稀少鄭曰寰宇記黔州黔陽郡莫怪頻頻勸酒杯蘇曰蕭鳳使玉門闗弟肅勸酒頻頻謂兄曰醉中庻使分袂不悲隨章留後新亭㑹送諸君新添年廣徳元作補注鶴曰諸君一本作諸軍然作君者爲是新亭在梓州當是廣德元年作新亭有髙㑹行子得良時補注希曰漢項羽傳飲酒有髙㑹行子得良時亦楚辭日吉兮良辰又歴吉日兮吾將行之義日動映江幕風鳴排檻旗絶葷終不改歡酒欲無詞巳墮峴山淚鄭曰在襄陽羊祜作鎮曰立碑記功於此因題零雨詩倦夜廣德二年作補注鶴曰詩云竹凉侵卧内野月滿庭除當是在浣花作廣德二年自閬州歸未爲參謀時詩又云萬事干戈裏蓋吐蕃之亂未巳竹凉侵卧内趙曰漢書引入卧内野月滿庭隅重露成涓滴墮也稀星乍有無洙曰明滅也暗飛螢自照蘇曰王􅀈如飛螢自照言其勢焰尋常也水宿鳥相呼洙曰蜀都賦雲飛水宿修可曰師曠禽經曰陸鳥曰棲水鳥曰宿又曰凡鳥朝鳴曰嘲夜鳴曰㖡林鳥以朝嘲水鳥以夜㖡蘇曰江湜水鳥相呼言其欲共安居也補注希曰春秋繁露曰鶴水鳥也夜半水立感其生氣則益喜而鳴萬事干戈裏空悲清夜徂師曰古詩云良馬白日足壯士中夜心甫有感詩之志而不見用於時故空悲清夜徂悲秋寳應元年作補注鶴曰詩云家逺傳書日又云羣盜尚縱横當是寳應元年秋在梓州未歸迎家時作是時史朝義與吐蕃之亂未巳凉風動萬里羣盜尚縱横家逺傳洙曰一作待書日秋來爲客情洙曰此二事皆情意之極者愁窺髙鳥過洙曰髙鳥言東西南北猶得所適老逐衆人行洙曰老者尚爲衆人亦悲時之不與也始欲投三峽何由見兩京對雨廣德元年作補注鶴曰此詩當作於廣德元年梁權道亦編在此年詩云雪嶺防秋急謂是年吐蕃入寇公將入閬州故曰不愁巴道路莽莽天涯雨江邊獨立時不愁巴道路趙曰指言梓州也恐濕漢旌旗雪嶺防秋急趙曰雪嶺在松維州之外繩橋戰勝遲洙曰見防秋却背五繩橋注趙曰以岷江湍急不可爲梁乃竹繩爲橋駕虛而渡西戎甥舅禮洙曰言父尚公主則子爲甥中國爲舅也未敢背恩私趙曰景龍一年以金賊公主妻贊普今公望其篤甥舅之禮而勿背焉師曰時回紇恃功欲入寇甫不愁飄轉道路之間恐闗中復遭汚辱也故託意言不愁巴道路恐濕漢旌旗胡人秋髙馬肥常入宼故曰防秋雪嶺繩橋皆蜀中蜀人以竹綍爲橋名曰繩橋補注鶴曰九域志云雪嶺距威州二百六十里山有九峯上有積雪春夏不消威即維州髙適傳適出西山三城置成論東西兩川當合爲一即雪嶺也唐志注唐興有羊灌田朋笮繩橋三守捉城今指繩橋蓋三城之一非謂岷江以竹繩爲橋也警急趙曰時髙適代崔光逺領西川節度使廣德元年作補注鶴曰崔光逺憂恚而死在上元二年以適代光逺在其年建丑月而松州陷於吐蕃却在廣德元年十二月趙注爲非此詩云松州㑹解圍則是在未陷時作公時在閬州才名舊楚將妙畧擁兵機趙曰以美髙適也玉壘雖傳檄松州㑹解圍洙曰傳檄言吐蕃入寇檄書相聞也趙曰廣德元年吐蕃取隴右十二月遂亡松維保三州補注鶴曰髙適至德間爲揚州大都督府長史淮安節度使故曰舊楚將玉壘山在彭州導江縣有玉壘記和親知計拙公主漫無歸洙曰見留花門注趙曰吐蕃方請和繼而又叛補注希曰和親謂以安成金城公主降吐蕃而卒不免其入寇所以爲計拙舊注云見留花門注然非回紇也青海今誰得西戎實飽飛洙曰曹公言吕布猶鷹也飽則飛去按唐書適代崔光逺爲節度吐蕃取隴右適出兵南鄙以牽制之既無功遂亡松維二州趙曰言青海爲吐蕃所有其勢如鷹之飽而飛揚不就縶紲也王命廣德元年作補注鶴曰詩云牢落新燒棧謂廣德元年燒大散闗蒼茫舊築壇謂是年吐蕃寇近幾旋命子儀禦敵子儀久閒廢才得二十騎而行詩又云巴西道路難巴西閬州也時公在閬州當是廣德元年十月作漢北豺狼滿巴西道路難趙曰漢與巴相連蓋吐蕃入寇之地血埋諸將甲骨斷使臣鞍趙曰廣德元年使李之芳崔倫往聘吐蕃留不遣虜破邠州入奉天天子幸陜使臣指李之芳崔倫矣骨斷則憂懼而骨欲斷折之義補注鶴曰諸將云者如渭北行營兵馬使吕同將將精卒二千與吐蕃戰於盩厔兵盡爲虜所擒而六軍逃潰者多在商州諸將縱兵暴掠是也御史大夫李之芳等使吐蕃爲虜留兩年不歸事並見通鑑牢落新燒棧洙曰漢髙紀張良說漢王燒絶棧道棧即閣也今謂之閣道蒼茫舊築壇洙曰漢王齊戒設壇場拜韓信爲大將軍趙曰時雍王䀨爲兵馬元帥子儀副之而禦奉天之寇委子儀則舊築壇指郭令公也深懷喻蜀意慟哭望王官洙曰司馬相如有喻巴蜀檄時段子璋反東川適與崔光逺逆戰斬之光逺不戢兵遂大掠至有斷士女腕取金者故民怨哭而欲聞王命也補注鶴曰段子璋事在上元二年與此詩相距二年所引非蓋廣德二年吐蕃陷松維保三州及雲山新築二城西川節度使髙適不能求於是劒南西山諸州亦入於吐蕃矣巴蜀之人陷新夷虜所以慟哭望王官之至巴蜀諸州既陷則血埋諸將之甲又可知矣征夫廣德元年作補注鶴曰詩云十室幾人在千山空自多時廣德元年吐蕃陷松維州髙適在蜀調征夫防守故有此作自警急至此三首皆爲髙適作所以譏其不能禦虜也首冠以才名舊楚將妙畧擁兵機之句而其下皆敗北之事則機畧可見矣十室幾人在千山空自多路衢惟見哭城市不聞歌洙曰民苦役故多怨哭漂梗無安地蘇曰宗夀已身如水上浮梗南北無安身之地趙曰此公自言爾蓋旅寓之人如梗之飄蕩於義分明銜枚有荷戈洙曰漢紀章邯夜銜枚擊項梁師古曰銜枚者止言語讙囂欲令敵人不知其來也周官有銜枚氏枚狀如蓍横銜之蘇曰呉起中夜起謂裨將曰防彼銜枚荷戈衝突吾寨官軍未通蜀吾道竟如何惠義寺園送辛員外廣德元年作補注鶴曰惠義寺在梓州當是廣德元年作朱櫻此日垂朱實郭外誰家負郭田萬里相逢貪握手髙才仰望足離筵又送廣德元年作補注鶴曰魯訔年譜云公送辛員外暫至綿今詩云直到綿州始分首則魯之說爲是廣德元年作雙峯寂寂對春臺萬竹青青照洙曰一作送客杯細草留連侵坐軟殘花悵望近人開同舟昨日何由得並馬今朝未擬迴直到綿州始分首江頭樹裏共誰來章梓州橘亭餞成都竇少尹得凉字新添補注鶴曰此詩一本作兩首自衰老應爲難離别已下題曰長流然合爲一者是當在廣德元年秋作是年九月公至閬秋日野亭千橘香玉杯錦席髙雲涼主人送客何所作音佐行酒賦詩殊未央衰老應爲難離别賢聲此去有輝光預傳籍籍新京兆青史無勞數趙張補注希曰成都前號南京公故借京尹事用前漢趙廣漢行京兆尹滿歲爲真張敞亦爲京兆尹故吏民語曰前有趙張後有三王送元二適江左廣德元年作補注鶴曰詩云風塵爲客日謂廣德元年九月吐蕃入寇此詩是時作亂後今相見秋深復逺行風塵爲客日趙曰公言其遭戰鬬之時旅泊於外江海送君情晉室丹陽尹洙曰温嶠爲丹陽尹公孫白帝城洙曰公孫據白帝城師曰丹陽尹指元二適丹陽也白帝城甫自言客居夔州也經過自愛惜取次莫論兵洙曰元嘗應孫吳科舉章梓州水亭洙曰時漢中王兼道士席謙在㑹同用荷字韻廣德元年作補注鶴曰魯訔梁權道皆以爲在廣德元年然是年春梓州是李使君夏方是章彞爲刺史詩云秋水席邊多當是其秋作城晚通雲霧亭深到芰荷吏人橋外少蘇曰尹伯吉爲丹陽令好飲語友人曰可同過橋飲彼處吏人少潘岳詩貪杯避吏人秋水席邊多近屬淮王至洙曰淮南王劉安以比漢中王髙門薊子過薊居例切洙曰家家迎薊子以比席道士也趙曰後漢薊子訓有神異之術士大夫嚮慕之今公此句以尊章梓州之能致異人也荆州愛山簡吾醉亦長歌洙曰山簡習池事以比章梓州也趙曰以山簡比章留後山簡每出嬉遊多之池上置酒輒醉時有童兒歌曰山公出何許毎至髙陽池日夕倒載歸酩酊無所知公言吾醉亦長歌則效童兒之爲歌矣送陵州路使君之任廣德元年作補注鶴曰幽燕通使者謂史朝義廣德元年正月縊死而河北盡平詩又云秋天正搖落當是廣德元年秋在梓州作陵州唐屬東川王室比多難髙官皆武臣洙曰時方急於賞功故武臣在髙位蘇曰宋鍼近世兵戈擾擾而髙爵厚禄皆武官髙牙大飾金紫煌煌駭人耳目我輩頭白作冷局官復何益哉幽燕通使者洙曰時安史之亂平而幽燕路通矣岳牧用詞人國待賢良急君當拔擢新佩刀成氣象洙曰晉書吕䖍爲刺史有佩刀相者曰以三公可服䖍乃贈别駕王祥曰茍非其人刀或爲害卿有公輔之量故相與也行蓋出風塵趙曰時方吐蕃之亂而刺史之蓋出風塵以往也戰伐乾坤破洙曰在所殘敝也瘡痍府庫貧洙曰軍用匱乏急也衆寮宜潔白萬役但平均蘇曰元興曰今世事若此諸公宜潔正廉白不可學日前貪饕又王子敬萬民徭役宜科使平均自無怨謗霄漢瞻佳士蘇曰張景陽近數佳士致身在於霄漢之上趙曰指路君自此遷擢當在霄漢泥塗任此身趙曰公自言也秋天正搖落回首大江濱簿暮廣德元年作補注鶴曰詩云髙秋心苦悲又云寒花隠亂草當是廣德元年秋在閬州作是年公九月至閬矣江水最深地洙曰此指蜀江山雲薄暮時寒花隠亂草師曰寒花巳非其時甫自比衰年也宿鳥擇洙曰一作探深枝趙曰左傳鳥則擇木木豈能擇鳥師曰鳥志在奮飛宿鳥巳有棲息之地甫自比無飛騰之志也舊國見何日髙秋心苦悲人生不再好鬢髮白洙曰一作自成絲東津送韋諷攝閬州録事新添年廣徳元作補注鶴曰東津在綿州打魚歌云綿州江水之東津是也當是廣德元年送辛員外暫至綿州時作梁權道編在寳應元年梓州詩内聞說江山好憐君吏隠兼寵行舟逺泛惜别酒頻添推薦非承乏操持必去嫌他時如按縣不得慢陶潛惠義寺送王少尹赴成都分得峯字春新添廣德元年作補注鶴曰公嘗陪李梓州四使君登惠義寺則寺在梓州今詩云騎馬行春徑當是廣德元年春作苒苒谷中寺娟娟林表峯欄干上處逺結構坐來重騎馬行春徑衣冠起暮鐘雲門青寂寞此别惜相從西山三首廣德元年作補注鶴曰詩云雨雪閉松州當是廣德元年十二月松州被圍時作夷界荒山頂蕃州積雪邊洙曰成都記西山冬夏積雪築城依洙曰一作連白帝轉粟上青天洙曰白帝城在䕫州此西山詩而言築城依白帝恐傳者誤矣趙曰兩句通義公孫述自號白帝其所築城在髙山上本曰白帝城今公言髙山上築城依倣白帝所以轉粟之難如上青天補注希曰白帝西方之帝也今築城於西山之上言其髙可依於白帝故下曰轉粟上青天非指公孫述城而言但假用其字耳䕫州白帝城在赤甲相近其山初不大髙豈西山所依倣者髙適疏謂今所界吐蕃城堡不過平戎巳西數城邈在窮山之巔垂於險絶之末運糧於束馬之路坐甲於無人之鄉故此云轉粟如上天之難也蜀將分旗鼓趙曰以吐蕃陷松維保三州勢迫近蜀故分旗鼓以禦之羌兵助洙曰一作動鎧鋋洙曰一作井泉西南背和好殺氣日相纒趙曰以吐蕃背先帝時盟好而爲寇不巳辛苦三城戍長防萬里秋洙曰明皇還蜀後復分東西兩川爲兩節度西山列防秋三戍民罷於役髙適論之不聽煙塵侵火井雨雪閉松州洙曰雪賦火井滅蜀都賦火井沉熒於幽泉髙焰飛煽於天垂趙曰火井雖在卭州大率是蜀地名言吐蕃迫蜀中也孫曰蜀志云火井在臨卭補注鶴曰唐志雖云火井在卭州有火井縣而九域志又云有火井在蓬州蓬與果巴州爲鄰而卭與雅州爲鄰雅去羈縻羅巖州不滿三百里此當指卭而言松州與維州唐屬西川自廣德元年後吐蕃復置行州以首領爲刺史司馬矣風動將軍幕洙曰一云蓋天寒使者裘漫山賊營壘迴首得無憂洙曰漫山言賊壘之多也子弟猶深入趙曰子弟言充兵之人也闗城未解圍蠶崖鐵馬瘦灌口米船稀洙曰寰宇記蠶崖闗在永康軍西北四十七里洙曰蠶崖灌口並西山隘口地名趙曰蠶崖在西山闗隘處灌口在今永康軍戰馬不足充戰而瘦米船以運多不繼而稀此爲可憂矣程曰灌口山在永康軍導江縣李膺益州記云清水路西七里灌口古所謂天彭闗補注希曰唐志云彭州導江縣有蠶崖闗寰宇記灌口山在西嶺有天彭闗又云有灌口鎮在彭州九隴縣唐志蜀州有灌口府然則蠶崖灌口皆指彭州而言也辯士安邊策元戎決勝威洙曰元戎元帥也史決勝千里今朝烏鵲喜洙曰西都雜記云乾鵲噪而行人至欲報凱歌歸補注希曰文選淮徐獻㨗河兖凱歸薄遊廣德元年作補注鶴曰詩云巴城添淚眼按唐志閬州綿州皆爲巴西郡公廣德元年皆至兩郡然至綿乃是春晚至閬乃是秋晚祭房公文乃是年九月二十三日此詩云病葉多先墜寒花只暫香當是在閬州作淅淅風生砌洙曰謝惠連淅淅振條風團團月隠牆洙曰班媫妤團團似明月遙空秋鴈滅半嶺暮雲長病葉多先墜寒花只暫香巴城添淚眼今夕復清光趙曰公以薄遊之無定見月而添淚也補注杜詩巻二十四
