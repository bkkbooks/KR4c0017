body:
  text: 補注杜詩巻三十三宋黄希原本黄鶴補注太歲日大厯三年作補注鶴曰大厯三年太歲戊申今題云太歲日則又是戊申日按舊史大厯三年春正月丙午朔則戊申乃初三日或以巫山坐復春之句為在二年然二年太歲丁未而正月朔為壬子則丁未日乃在二月下旬矣此詩云閶闔開黄道衣冠拜紫宸正以新元而言當是三年正月初三日作楚岸行將老巫山坐復春洙曰巫山䕫州楚置巫山郡秦昭三十年伐楚取黔中巫郡是也漢為巫郡今縣北有巫山修可曰陸機云吾將老而為客病多猶是客謀拙竟何人洙曰顔延年存没竟何人炯介在明淑閶闔開黄道衣冠拜紫宸洙曰丘希範侍宴樂遊苑詰旦開閶闔馳道聞鳳吹離騷吾令帝閽開關兮倚閶闔而望予曹植閶闔天衢通前漢游閶闔觀坐臺天門開軼蕩蕩大人賦排閶闔而入帝居楊炯賦閶闔開兮凉風嫋庾肩吾閶闔九門通唐韓臯為中丞常有所陳必於紫宸殿對百寮而請未嘗詣便殿下伯玉中書郎詩曰大方信包含優渥遂不巳躍鱗龍鳳池揮翰紫宸裏補注希曰冦榮傳閶闔九重注閶闔天池陽地如門也晉志黄道日之所行鶴曰唐紫宸殿者正殿名李鋭上疏紫宸殿者周之路寢漢之前殿陛下所以負黼扆正黄屋饗萬國朝諸侯人臣至敬之所榮光懸日月洙曰中候曰榮光出河休氣四塞榮光即五色也易繫曰懸象著明莫大乎日月趙曰瞻天顔也天子之容謂之日月之光賜與出金銀洙曰蜀先主傳取蜀中金銀錢賜將士愁寂鴛行斷洙曰選鴛鷺之行趙曰公嘗為左拾遺今流落於外故云鴛行斷參差虎穴鄰洙曰班超曰不入虎穴不得虎子吳志吕蒙欲從軍母止之蒙曰不探虎穴安得虎子趙曰公自謂在夔州乃與虎狼之穴相近也西江元下蜀趙曰楚人指蜀江為西江北斗故臨秦修可曰長安上直北斗謂之北斗城散地逾高枕夢符曰按王弼明爻通變例曰投戈散地則六親不能相保趙曰指言居䕫州是閑散之地也補注希曰黥布傳自戰其地為散地師古曰謂在其本地戀土懐安故易逃散又高帝紀足下高枕而王千里張良傳君安得高枕而卧生涯脫要津趙曰古詩先據要路津脫要津則不在鴛鷺之行矣天邊梅栁樹相見幾回新蘇曰謝奉容居江表佳門前梅栁幾回見新秋葉故人無音信何也元日示宗武大厯三年作補注鶴曰公以大厯三年正月出峽而今詩云不見江東弟髙歌淚數行則是其年作蓋其弟觀隔年巳迎家至江陵公巳决意出峽故以獨不見江東之弟為憂時弟豐在江東也汝啼吾手戰吾笑汝身長趙曰手戰老病也身長長大也處處逢正月迢迢滯逺方飄零還柏酒洙曰周庾信正旦䝉趙王賚酒詩柏酒隨銘至椒花逐頌來梁庾肩吾詩云聊用柏葉酒且奠五辛盤尹曰崔寔四月月令曰元日進椒花酒椒是玉衡星精服之令人身輕能走柏是仙藥進酒次第以年少者為先衰病只藜牀洙曰管寧家貧坐藜牀欲穿為學不倦訓諭青衿子洙曰鄭國風青青子衿毛註青領男子之所服鄭箋禮父母在衣純以青名慙白首郎洙曰前漢馮唐以孝亷為郎中署長事文帝帝輦過問唐曰父老何自為郎家安在具以實言王仲宣詠史詩馮公豈不偉白首不見招顔駟漢文帝時為郎至武帝輦過郎署見駟龎眉皓髪問曰叟何時為郎何其老也答曰臣文帝時為郎文帝好文而臣好武景帝好美臣貎陋陛下好壯臣巳老矣是以三朝不遇故老於郎署帝感其言擢拜㑹稽都尉賦詩猶落筆洙曰具質牋曰置酒縱飲賦詩稱觴蘇曰丘希範落筆賦詩四座失色獻夀更稱觴洙曰潘安仁稱萬夀以獻觴不見江東弟高歌淚數行洙曰弟豐在江左無消息逺懐舎弟頴觀等大厯三年作補注鶴曰詩云江漢春風起氷霜昨夜除又舊時元日㑹鄉黨羨吾廬當是大厯三年正月旦日作陽翟空知處荆南近得書洙曰陽翟屬穎川郡夏禹所受封也補注希曰按唐志陽翟初𨽻嵩州貞觀元年屬許州龍朔二年𨽻洛州㑹昌三年復屬許州此詩作於大厯三年則是時陽翟屬洛州洛即河南府公之弟穎所處荆南即江陵公之弟觀迎婦至彼所謂續得書迎就當陽居止是也積年仍逺别多難不安居蘇曰岑襄晉末兵戈王室多難雖有高堂峻宇不得安居江漢春風起氷霜昨夜除雲天猶錯莫花蕚尚蕭疎趙曰以興兄弟之離隔也師曰陽翟屬穎川郡舍弟所在子美居荆南𤣥宗篤友悌起花蕚樓取棠棣之華鄂不韡韡乃燕兄弟之詩之意對酒都疑夢吟詩正憶渠補注鶴曰渠猶言伊蓋梁陳以來語庾信詩無事教渠莫相失舊時元日㑹鄉黨羨吾廬洙曰陶潜詩吾亦愛吾廬續得觀書迎就當陽居止正月中旬定出三峽補注鶴曰當陽乃江陵屬邑詩云頌椒添諷詠當是大厯三年元日作自汝到荆府書來數喚吾頌椒添諷詠洙曰周庾信正旦詩椒花逐頌來禁火卜歡娛洙曰荆楚歲時記去冬莭一百五日即有疾風甚雨謂之寒食禁火三日琴操晉文公與介子綏俱遁子綏割腓股以啖文公文公復國子綏無所得作龍蛇之歌而隠文公求之不得乃焚左右木子綏抱木而死文公哀之令人五月五日不得舉火今陸劌鄴中䚰並云寒食㫁火起於子推琴操所云子綏即子推也又云五月五日與介有異皆因流俗所傳據左傳史記並無介子推被火焚之事按周禮司烜氏仲春以木鐸修火禁於國中註云為季春将出火也今寒食莭氣是春之末三月之極然則禁火藎周之舊制趙曰序言正月中旬定出峽於寒食必相聚矣舟楫因人動形骸用杖扶天旋䕫子峽洙曰魚腹古夔子峽也春近岳陽湖洙曰岳陽湖在巴陵蘇曰梁汶曰岳陽春近吾将鼔枻放曠澤國與簔笠盡老矣鄭曰即巴陵洞庭湖發日排南喜傷神散北吁飛鳴還接翅洙曰小宛詩題彼鶺鴒載飛載鳴行序密銜蘆洙曰春秋繁露鴈有行列王制云兄之齒鴈行淮南子鴈從風而飛以愛氣力銜蘆飛以避繒繳俗薄江山好時危草木蘇馮唐雖晩達終覬在皇都蘇曰梁詢曰如馮唐垂白尚兾晚達趙曰馮唐公以自比其白首為郎也將别巫峽贈南卿兄瀼西果園四十畝趙曰果園四十畝而公直舉以贈人此一段美事而古今未嘗揄揚公之美良可歎也補注鶴曰題云將别巫峽又詩云正月喧鶯末兹辰放鷁初當是大厯三年正月作苔竹素所好萍蓬無定居洙曰木𤣥虚海賦萍流而蓬轉逺遊長兒子幾地别林廬雜蘂紅相對他時錦不如具舟将出峽巡圃念攜鋤正月喧鶯未兹辰放鷁初洙曰司馬相如賦浮文鷁揚桂枻註鷁水鳥畫其象於舟首以厭水神淮南子曰龍舟鷁首天子之乘也雪籬梅可折風榭栁微舒託贈卿家有因歌野興疎殘生逗江漢何處狎樵漁送大理封主簿五郎親事不合却赴通州主簿前閬州賢子余與主簿平章鄭氏女子垂欲納采鄭氏伯父京書至女子已許他族親事遂停大厯三年作補注鶴曰梁權道編在大厯三年今詩云餘寒折花卉恨别滿江鄉當作是年正月未出峽前作禁臠去東牀洙曰晉謝琨初孝武帝為晉陵公主求婿謂王珣曰主婿但如劉真長王子敬便足如王處仲桓元子誠可才小富貴便豫人家事珣對曰謝琨雖不及真長不減子敬帝曰如此便足未幾帝崩袁山松欲以女妻之珣曰卿莫近禁臠初元帝始鎮建鄴公私窘罄每得一豚以為珍膳項上一臠尤美輒以薦帝羣臣未嘗敢食于時呼為禁臠故珣因為戯琨竟尚主王羲之傳太尉郄鑒使門生求女婿於王導導令就東廂徧觀子弟門生歸謂鑒曰王氏諸少並佳然聞信至咸自矜持惟一人在東牀坦腹食獨若不聞鑒曰此正佳婿也訪之乃羲之也遂以其女妻之趨庭赴北堂洙曰語陳亢問於伯魚有異聞乎對曰未也嘗獨立鯉趨而過庭曰學詩乎對曰未也不學詩無以言鯉退而學詩鄘詩伯兮焉得諼草言樹之背註背北堂也疏背者何背之義婦人所常處者堂也故知背為北堂士昏禮云婦洗在北堂註房半以北為北堂者房室所居之地總謂之堂風波空逺涉蘇曰劉琨至高安歎曰事不我濟空逺涉風波琴瑟幾虚張洙曰詩棠棣妻子好合如鼓瑟琴董仲舒琴瑟不調必解而更張之趙曰夫婦以比琴瑟也公自注云幾音洎蓋巨至切洎及也渥水出騏驥洙曰漢武元鼎四年馬生渥洼水中李斐曰南陽新野有暴利長當武帝時屯田燉煌界数於此水旁見羣野馬中有竒者與凡馬異來飲此水利長先作土人持勒靽於旁後馬翫習久之乃令人代土人持勒靽收得其馬獻之以神異此馬云從水中出師古曰渥音握崑山生鳳凰洙曰東京賦鳴女床之烏鳥舞丹穴之鳳凰兩家誠款款蘇曰索靖法帖兩家誠心款款奈凡作催何中道許蒼蒼頗謂秦晉匹洙曰襄二十七年傳趙孟曰晉楚齊秦匹也晉之不能於齊猶楚之不能於秦也又秦晉匹也何以卑我從來王謝郎洙曰晉江左以王謝為胄族嘗通婚青春動才調蘇曰禰衡青春惱客意處處動微吟白首缺輝光玉潤終孤立洙曰晉樂廣字彦輔人謂之氷鏡女婿衛玠字叔寶時號玉人故時語曰婦翁氷清女婿玉潤也珠明得闇藏洙曰漢鄒陽云明月之珠夜光之璧以闇投於道衆莫不按劍相盻矣餘寒折花卉恨别滿江鄉人日兩篇大厯三年作彦輔曰前五後七董勛問禮俗曰正月一日為雞二日為狗三日為猪四日為羊五日為牛六日為馬七日為人則正旦畫雞於門七日鏤人戸上良為此也補注鶴曰後篇云早春重引江湖興大厯三年作元日到人日修可曰西清詩話云都人劉克窮該典籍嘗與客論云元日至人日未有不隂時人知其一不知其二四百年惟子美與克㑹耳起牀就架取書與客曰此東方朔占書也嵗後八日一日為雞二日為狗三日為豕四日為羊五日為牛六日為馬七日為人八日為穀其日晴主所生之物育隂則災少陵意謂天寳離亂四方雲擾幅裂人物歲歲俱災此春秋書王正月意耶深得古人深心未有不隂時氷雪鶯難至春寒花較遲雲隨白水落風振紫山悲蓬鬢稀疎久無勞比素絲蘇曰栁博蓬首愁搔稀疎之甚羞比素絲此日此時人共得一談一笑俗相看蘇曰王遇元語弟曰一談一笑世俗酒炙之歡豈識文字真樂耶余元日在善化因書此詩二篇與楊太守樽前栢葉休隨酒洙曰見元日示宗武詩注勝裏金花巧耐寒洙曰人日造華勝相遺起於晉代見賈充李夫人曲云像瑞圖金勝之形又像西王母戴勝也嵗時記人日以七種菜為羮剪綵為花勝以相遺或鏤金薄為人勝以像瑞圖之形佩劔衝星聊暫㧞洙曰晉輿服志漢自天子至百官無不佩劔其後唯朝帶晉書斗牛之間有紫氣雷煥曰寳劔之精上徹於天匣琴流水自須彈洙曰琴有三峽流泉操趙曰伯牙志在流水鍾子期曰湯湯哉舊注所引却是流泉操也早春重引江湖興直道無憂行路難趙曰行路雞古曲名言以直道行之無徃而不可也江梅大厯二年作趙曰江邉之梅也如在嶺曰嶺梅在野曰野梅官中所種曰官梅而後之學者凡見梅便謂之江梅誤矣補注鶴曰中原土厚梅肥其花特大而江南一種花獨小或名之曰江梅蓋以別北梅也此詩云故園不可見巫岫鬱嵯峨則是未定出峽時作若是大厯三年將去夔時不應詩意不及之當是大厯二年梅蘂臘前破梅花年後多絶知春意早最奈客愁何雪樹元同色江風亦自波故園不可見巫岫鬱嵯峨洙曰陸機樂府雲山鬱嵯峨潘安仁崇岡鬱嵯峨陸又云崇山鬱嵯峨庭草大厯二年作補注鶴曰詩云步履宜輕過開筵得屢供則作詩時未有放舟出峽之意當是大厯二年楚草經寒碧庭春入眼濃舊低收葉舉趙曰言舊收斂之葉以春來而舉起也新掩捲牙重步履宜輕過開筵得屢供看花隨莭序不敢强為容大厯三年春白帝城放船出瞿塘峽久居䕫府將適江陵漂泊有詩凡四十韻補注鶴曰詩言舟行所經之地至宜都而止則此詩作於夷陵也老向巴人裏洙曰傳荘十八年巴人伐楚修可曰劉璋分三巴以夔為中巴地也今辭楚塞隅入舟飜不樂解纜獨長吁洙曰謝靈運解纜乃流潮又入舟陽巳微趙曰楚塞指白帝城不樂長吁公自傷流離也窄轉深啼狖余救切虚隨亂浴鳬石苔凌几杖空翠撲肌膚蘇曰隂亮山行謂友人曰空翠爽人肌膚泉流清人耳目乍脫塵鞅永日忘歸疊壁排霜劔奔泉濺水珠蘇曰屈平亂山横劔奔泉濺珠杳冥藤上下濃淡樹榮枯神女峯娟妙鄭曰盛𢎞之荆州記巫山有神女峯昭君宅有無鄭曰寰宇記歸州巴東有王昭君宅曲留明怨惜夢盡失歡娛洙曰怨惜一作怨别昭君宅在夔州子美負薪行云若道巫山女麄醜何得此有昭君材石季倫昭君辭曰王昭君者本為王昭君以觸晉文帝諱改之匈奴盛請婚於漢元帝以後宫良家子明君配焉昔公主嫁烏孫令琵琶馬上作樂以慰其道路之思其送明君亦爾也其造新之曲多哀怨之聲神女峯在巫山宋玉高唐賦曰昔先王遊高唐怠而晝寢夢見一婦人曰妾巫山之女也願薦枕席乂神女賦曰楚襄王夜寢夢與神女遇其状甚麗寐而夢之寤不自識擺闔盤渦沸洙曰郭璞江賦盤渦谷轉欹斜激浪輸風雷纒地脉洙曰江賦疏風蒸雷海賦驚浪雷奔蘇曰張禹曰迅雷烈風纒地脉氷雪曜天衢洙曰易何天之衢亨鹿角真走險洙曰文十七年傳鄭子家曰小國之事大國也徳則其人也不徳則其鹿也鋌而走險急何能擇狼頭如跋胡洙曰詩狼跋其胡載㚄其尾註跋躐也進則躐其胡退則跋其尾趙曰鹿角狼頭公註二灘名惡灘寧變色高卧負微軀書史全傾撓裝嚢半壓濡生涯臨臬兀洙曰困于臲卼也死地脱斯須蘇曰陶秀行次豫章歎曰生涯如臬兀胡不悲憂身世韓既昨入吳榮死地脱於斯須之間今日思之令人身寒不有平川決洙曰一作快焉知衆壑趨乾坤霾漲海定功曰言水之𣺌茫闊逺矣雨露洗春蕪蘇曰史惠曰征塵蒙蒲蕪草荷雨露沾洗鷗鳥牽絲颺趙曰羽如絲也驪龍濯錦紆落霞沉緑綺洙曰謝元暉晚望三山詩餘霞散成綺澄江淨如練殘月壊金樞洙曰木𤣥虚海賦大明鏕轡於金樞之宂註大明月也金樞西方月没之處宂窟也泥笋苞初荻沙茸出小蒲洙曰謝靈運詩新蒲含紫茸初篁苞綠籜補注希曰詩韓奕云其䔩維何維筍及蒲爾雅筍竹之初生者又爾雅葭蒹釋云詩碩人云葭菼揭揭陸機云薍或謂之荻其初生三月中其心挺出其下如箸以鋭而細揚州人謂之馬尾其萌為虇郭云今江東人呼蘆笋為虇又許慎説文云蒲水草也澤陂傳云蒲草柔滑公以大厯三年正月去夔故有正月喧鶯末兹辰放鷁初之句此詩荻笋蒲茸等物皆中春時事蓋放船在正月而作詩在二月也公以三月至江陵無怪舟中所見如此鴈兒爭水馬夢符曰按本草水馬生水中善行如馬亦謂之海馬燕子逐檣烏趙曰船檣上刻為烏形也燕如逐之絶島容煙霧環洲納曉晡洙曰謝靈運詩側徑既窈窕環洲亦玲瓏前聞辨陶牧洙曰顔延年七澤謁荆牧牧陶牧也地名蘇曰王粲登樓賦北彌陶牧註陶鄉名郊外曰牧轉眄拂宜都洙曰劉備改夷陵為宜都縣郭南畿好洙曰路入松滋縣津亭北望孤趙曰懐長安也勞心依憇息朗詠劃昭蘇趙曰劃字開豁之意意遣樂還笑衰迷賢與愚飄蕭将素髪洙曰秋興賦素髪颯以垂領汩没聽洪鑪洙曰王粲傳鼓洪鑪以燎毛髮丘壑曽忘返洙曰謝靈運詩昔余游京華未嘗廢丘壑山林之士入而不復出文章敢自誣蘇曰卜商文章繩身之規矩豈敢自誣此生遭聖代誰分哭窮途洙曰顔延年詠阮歩兵詩窮途能無慟趙曰阮籍毎行至路窮處輒慟哭而返卧疾淹為客蒙恩早厠儒廷爭酬造化洙曰王陵傳陳平謂陵曰面折廷爭臣不如君蘇曰張綱曰吾廷諍是非非欲作自已名目端酬造化有補王室而益黎民吾死亦無憾何况生焉趙曰公言為拾遺時嘗論房琯有才不宜廢是為廷諍以酬君王顧遇之恩樸直乞去既切江湖灔澦險相迫滄浪深可逾浮名尋巳巳嬾計却區區趙曰肅宗以公言房琯忤㫖出為華州司功而流落江湖迫灔澦逾滄浪而無意於浮名得遂其閑嬾矣喜近天皇寺先披古畫圖夢符曰按諸宫故事張僧繇避侯景之亂來奔湘東承制拜右将軍僧繇工畫為郡之冠常於天皇寺栢堂圖盧舍那佛像夜有竒光發自屋壁又於堂内圖孔子十哲像識者謂右軍絶筆湘東鮑潤岳謂曰釋門之内冩素王之容雖曰神異無方豈可夷夏同貫僧繇笑曰吾誠偶然安知不利於後聞者莫知其㫖及後周滅二教梁為附庸荆楚祠宇莫不毁撤唯天皇寺有宣尼像遂為國庠時人歎其先覺嘗於此寺畫龍不時㸃睛道俗請之捨錢數萬落筆之後雷雨晦冥忽失龍不知所在唐朝閻立本工畫無對立本嘗至荆州視僧繇舊跡曰定虚得名耳明日又徃觀之曰猶是近代好手明日又徃曰名下無虚坐卧觀之留宿其下十餘日而不能去應經帝子渚洙曰謝𤣥暉瀟湘帝子遊江淹王徵君詩北渚有帝子蕩瀁不可期定功曰楚詞云帝子降兮北渚帝子謂堯女娥皇娥英也同泣舜蒼梧洙曰禮舜𦵏于蒼梧之野謝𤣥暉雲去蒼梧野朝士兼戎服君王按湛盧洙曰吳越春秋越王允常歐冶子作名劍五枚秦客薛燭善相劔越王取湛盧示之曰善哉銜金鐵之英吐銀錫之精寄氣託靈有游出之神服此劔可以折衝伐敵人君有逆誅則去之他國越王乃以湛盧獻吳吳公子光殺吳王湛盧去如楚也鮑明逺天子按劔怒旄頭初俶擾洙曰始擾亂也晉天文志昴為旄頭胡星也天子出旄頭罕畢以前驅也鶉首麗泥塗洙曰晉志自東井十六度至栁八度為鶉首秦之分野屬雍州趙曰鶉首分野屬雍州麗泥塗此言廣徳元年長安陷也甲卒身雖貴書生道固殊出塵皆野鶴洙曰晉嵇紹在稠人中昂昂然若野鶴之在雞羣歴塊匪轅駒洙曰王褒云過都越國蹶如歴塊灌夫傳上怒内史曰公生平数言魏其武安長短今日廷論局促效轅中駒應劭曰駒者駕於轅下局趣䠞小之貎張晏曰俛頭於車轅下隨母而巳趙曰言遭䘮亂甲卒有貴為節度為莭度時書生亦有在中者其道殊故有鶴駒之譬伊吕終難降韓彭不易呼洙曰伊尹吕望韓信彭越五雲高太甲六月曠摶扶摶徒官切洙曰荘子鵬之徙於南溟也水擊三千里摶扶揺而上者九萬里去以六月息趙曰言賢材之不得用也沈佺期移禁司刑詩散材仍葺厦弱羽遽摶扶回首黎元病爭權将帥誅山林託疲􅒒未必免﨑嶇洙曰荘子齊物論􅒒然疲役而不知其所歸可不哀耶師曰空翠者垂空翠蔓也舟過戛人肌膚故云空翠撲肌膚薛夢符云水馬生水中善行如馬亦謂之海馬按陳藏器本草云水馬生海中頭如馬形長五六寸今所在池塘亦有之差小耳天皇寺解在前臬兀不安貌夔地險稍出江陵則平矣故曰不有平川決環洲回環而舟不進也天子有孝徳則五色雲見以太甲比代宗曠廢也子美廢斥故曰曠摶扶爭權将帥誅言崔旰楊子琳之亂巴蜀之人困於征役故云回首黎元病巫山縣汾州唐十八使君弟宴别兼諸公攜酒樂相送率題小詩留于屋壁大厯三年作補注鶴曰詩云卧病巴東久今年強作歸當是大厯三年正月作黄魯直嘗用韻戯題巫山縣所謂巴蜀深留客吾儂但憶歸是也建陽書肆近刋分門集註杜詩既以寄族弟唐十八使君詩編在外族門而此詩又却編在送别門若以宴别故入送别門而外族一門又有奉送二十四舅赴任青城奉贈侍御四舅別之郎澧奉酬十一舅惜别之作等詩皆送别也倫類不定如此者甚多不足責矣卧病巴東久洙曰郭璞江賦巴東之峽今年強作歸故人猶逺謫趙曰故人指唐使君也兹日倍多違接宴身兼杖聴歌淚滿衣諸公不相棄擁别借光輝春夜峽州田侍御長史津亭留宴得筵字作大厯三年補注鶴曰津亭在峽州即前詩所謂縣郭南畿好津亭北望孤盖在轉眄拂宜都之後也故詩又云始知雲雨峽忽盡下牢邊按唐志峽州本治下牢戍又有夷陵縣有下牢鎮當是大厯三年十月作北斗三更席西江萬里船杖藜登水榭揮翰宿春天白髮煩多酒明星惜此筵始知雲雨峽洙曰高唐賦云巫山之陽高丘之阻朝為行雲暮為行雨忽盡下牢邊洙曰下牢地名也泊松滋江亭大厯三年作補注鶴曰松滋縣名屬江陵府當是大厯三年三月作紗帽隨鷗鳥扁舟繫此亭江湖深更白松竹逺還洙曰一作微青一柱全應近洙曰劉孝綽詩經過一柱觀高唐莫再經蘇曰王允下峽嘆曰髙唐灔澦莫願再經今宵南極洙曰一云南斗外甘作老人星洙曰前漢天文志狼星北地直大星曰南極老人老人見治安不見兵起常以秋分時候之南郊晉志老人一星在弧南行次古城店泛江作不揆鄙拙奉呈江陵幕府諸公大厯三年三月作補注鶴曰詩云白屋花開裏孤城麥秀邉當是大厯三年三月公至江陵時作古城店近江陵也詩又云玉門高徳業蓋以衛伯玉為陽城郡王也老年常道路遲日復山川白屋花開裏洙曰王莽傳延士不及白屋師古曰白屋謂庶人以白茅覆屋也沈約開花巳匝樹孤城麥秀邉洙曰宋世家箕子朝周過故殷墟城毁壊生禾黍箕子傷之欲哭則不可為其近婦人乃作麥秀之詩以歌詠之其詩曰麥漸漸兮禾黍油油兮彼狡童兮不與我好兮所謂狡童者紂也殷民聞之皆為流涕向子期思舊賦歎黍離之閔周悲麥秀於殷墟濟江元自闊下水不勞牽風蝶勤依槳春鷗懶避船王門高徳業洙曰鄒陽曰何王之門不可曵長裾乎陸韓卿王門所以貴自古多俊人幕府盛材賢洙曰蔡邕薦邉讓於何進曰伏惟幕府初開博選清英行色兼多病蒼茫汎愛前洙曰孔子汎愛衆乗雨入行軍六弟宅新添年大厯三作補注鶴曰行軍六弟即杜位前詩送栢二别駕赴江陵因示從弟行軍司馬位是也分門集註杜詩以此詩入宗族門而寄杜位及杜位宅守歲詩乃編在别門亦猶編寄唐十八使君詩在外族門而他詩不預也唐志元帥府莭度使大都督府皆有行軍司馬掌弼戎政居則習莵狩有役則申戰守之法公以大厯三年春抵荆南是時衛伯玉為莭度使故位為行軍司馬此詩當是其時作故詩云春城帶雨長曙角凌雲罷春城帶雨長水花分塹弱巢燕得泥忙令弟雄軍佐凡材汙省郎蘇曰潘岳無長才廣識謾汙省郎見真儒碩人厚顔汗熱趙曰公為工部員外郎而自謙之辭也萍漂忍流涕衰颯近中堂宴胡侍御書堂大厯三年三月作洙曰李尚書之芳鄭祕監審同集歸字韻補注鶴曰胡侍御書堂必在荆南故詩云江湖春欲暮當是大厯三年三月作江湖春欲暮牆宇日猶微闇闇書籍滿輕輕花絮飛翰林名有素墨客興無違洙曰揚雄作長楊賦籍翰林以為主人子墨為客卿以諷趙曰指言李尚書鄭祕監胡侍御今夜文星動吾儕醉不歸洙曰漢荀陳徳星聚左傳吾儕小人况吾儕乎儕等也詩不醉无歸書堂飲既夜復邀李尚書下馬月下賦絶句補注鶴曰同上篇一時作湖水林風相與清殘罇下馬復同傾蘇曰阮孚居汶上嵇述徃别飲至夜分散明日述下馬叩門曰殘罇可移乎遂醉酣揮鞭而去其真率如此久􅂸野鶴如雙鬢遮莫鄰雞下五更洙曰趙典傳太儀鶴髪註白髪也五更見和賈舍人早朝大明宫註上巳日徐司錄林園宴集大厯三年作補注鶴曰上巳即修禊之日也晉宋以來皆以為莭按唐志西都東都北都鳳翔成都江陵興元興徳府有司錄参軍事二人此詩當是大厯三年在江陵作鬢毛垂領白洙曰潘安仁秋興賦斑鬢彪以承弁素髪颯以垂領花蘂亞枝紅欹倒衰年廢招尋令莭同薄衣臨積水吹面受和風有喜留攀桂洙曰劉安招隠士云攀援桂枝聊淹留無勞問轉蓬洙曰曹植詩轉蓬離本根袁陽源詩乃知古時人所以悲轉蓬奉送蘇州李二十五長史丈之任大厯三年作補注鶴曰大厯三年公在江陵㑹長史之任故送以此詩云赤壁浮春暮謂李經赤壁以徃蘇州也星坼台衡地趙曰中台星坼張華見誅而今云星坼則李二十五丈父必是台輔貴人曾為人所憐洙曰前漢五行志成帝時歌謡曰邪徑敗良田讒口亂善人桂樹花不實黄爵巢其顛故為人所羨今為人所憐公侯終必復洙曰閔元年傳畢萬筮仕於晉遇屯之比辛廖占之曰吉屯固比入吉孰大焉六體不易合而能固安而能殺公侯之卦也公侯之子孫必復其始經術竟相傳洙曰韋賢少子𤣥成復以明經歴位至丞相食徳見從事洙曰易食舊徳或從王事无成克家何妙年洙曰蒙九二子克家曹植表曰終軍以妙年使越楊仲武誄子以妙年之秀趙曰言李公自妙年克家矣一毛生鳳穴夢符曰按南史謝超宗父鳳超宗好學有文辭盛徳名譽新安王子鸞母殷淑儀卒超宗作誄奏之帝嗟貫謂謝荘曰超宗殊有鳳毛三尺獻龍泉洙曰漢高祖提三尺取天下師古注三尺劔也越絶書楚王召風胡子令之吳越見歐冶子干将使之鑄劍三枚一曰龍泉楚王問何謂龍泉對曰龍泉状如登高山臨深淵後漢肅宗賜諸尚書劍特以寳劍自為名以尚書韓稜淵深有謀故得楚龍泉赤壁浮春暮洙曰孫權将周瑜敗曹操於鳥林赤壁趙曰言赤壁以形容其所經之地補注希曰赤壁有三一在漢水之側竟陵之東一在齊安郡之步下一在江夏郡西南二百里間按魏武紀及周瑜傳操自江陵而下劉備周瑜由夏口徃逆戰則操所敗之地乃在江夏之西南今屬漢陽縣李長史自江陵徃姑蘇正經漢陽故云姑蘇落海邉洙曰越絶書曰闔廬起姑蘇臺三年聚材五年乃成髙見三百里客閒頭最白惆悵此離筵暮春江陵送馬大卿公恩命追赴闕下補注鶴曰題云暮春江陵則是大厯三年三月作自古求忠孝名家信有之洙曰後漢韋彪議曰求忠臣必於孝子之門晉卞壼拒蘇峻力疾戰死三子見父没相随赴賊同時見害徵士翟湯開之歎曰臣死於君子死於父忠孝之道萃於一門云吾賢富才術此道未磷緇洙曰論語磨而不磷湼而不緇玉府標孤映洙曰北山移文高霞孤映霜蹄去不疑趙曰荘子馬蹄可以踐霜雪激揚音韻徹趙曰文選神氣激揚又音聲悽以激揚也籍甚衆多推洙曰陸賈游漢庭名聲籍甚梁彦升云客游梁朝則聲名極甚潘陸應同調洙曰謝靈運詩誰謂古今殊異代可同調趙曰潘則潘岳陸則陸機孫吳亦異時洙曰孫武吳起北辰徴事業南紀赴恩私洙曰詩滔滔江漢南國之紀卿月昇金掌洙曰洪範卿士惟月上官儀詩班籍始燕歸金掌露初晞趙曰卿月指馬大卿也昇金掌譬近於顯要金掌者金銅仙人捧露盤之掌也王春度玉墀洙曰春秋王次春薰風行應律洙曰詩南風之薰兮禮八風從律湛露即歌詩趙曰詩湛露天子燕諸侯之詩天意高難問人情老易悲樽前江漢濶後㑹且深期暮春陪李尚書李中丞過鄭監湖亭汎舟得過字補注鶴曰鄭監湖在峽州殆是公徃江陵時過峽州故遊之遂作此詩海内文章伯洙曰唐文章三變而楊王為之伯故子美引而用之湖邊意緒多玉樽移晚興古歌辭曰上金殿酌玉樽趙曰曹子建仙人篇曰玉樽盈桂酒桂楫帶酣歌趙曰元帝烏栖曲曰沙棠作船桂為楫春日繁魚烏江天足芰荷鄭荘賔客地衰白逺來過洙曰鄭當時字荘置驛馬長安諸郊請謝賔客夜以繼日夏日楊長寧宅送崔侍御常正字入京得深字補注鶴曰唐地理志長寧縣屬鎮北大都䕶府揚當是江陵人為其縣令詩云天地西江逺公在江陵賦詩多用西江字齊集書省有正書秘書省有正字隋唐因之當是大厯三年作醉酒揚雄宅洙曰揚雄有宅一區雄家素貧嗜酒人稀至門時有好事者載酒肴從游學升堂子賤琴洙曰宓子賤治單父彈琴下堂而自治不堪垂老鬢還對欲分襟蘇曰黄歇秋天索莫愁對分襟天地西江逺星辰北斗深烏臺俯麟閤洙曰御史府中有栢樹常有野烏棲宿其上麟閤正字所居陳子昂為麟臺正字補注希曰漢圖籍藏之麒麟天禄二閤唐天授初改秘書省為麟閤長夏白頭吟洙曰古樂府白頭吟和江陵宋大少府暮春雨後同諸公及舍弟宴書齋大厯三年作補注鶴曰公至江陵巳是春晚此詩云棣華晴雨好綵服暮春宜正其時也大歴三年作渥洼汗血種洙曰漢武元鼎四年秋馬生渥洼水中作天馬之歌曰太一貺天馬下霑朱汗沫流赭註大宛馬汗血言汗從前肩髀出如血天上麒麟兒洙曰徐陵年數歲家人攜見寳誌上人誌以手摩頂曰天上石麒麟也才士得神秀洙曰孫綽賦天台山岳之神秀書齋聞爾為棣華晴雨好洙曰棠棣之華宴兄弟之詩綵服暮春宜洙曰老萊子斑衣趙曰論語暮春者春服既成朋酒日歡㑹洙曰􅃎七月朋酒斯享兩樽曰朋蘇曰荀爽朋壺助春歡㑹老夫今始知蘇曰西門卓岐路荆棘人情炎涼老夫今日始知矣夏夜李尚書筵送宇文石首赴縣聯句石首縣名補注鶴曰縣屬江陵在府東南二百里當是大厯三年公在江陵作愛客尚書重之官宅相賢子美洙曰晉魏舒少孤為外家寗氏所養寗氏起宅相者云當出貴甥外祖母以盛氏甥小而慧意謂應之舒曰當為外氏成此宅相酒香傾坐側帆影駐江邊之芳翟表郎官瑞鳬看令宰仙彧洙曰江淮之南謂雉青質五彩皆備曰翟蕭望之為郎有雉數十常度草翔飛王喬為葉令有仙術以舄為鳬東南來雨稀雲葉斷夜久燭花偏子美數語歌洙曰一作敲紗帽高文擲綵牋之芳興饒行處樂離惜醉中眠彧單父長多暇河陽實少年子美洙曰單父宓子賤所治河陽潘岳所治客居逢自出為别幾凄然之芳洙曰宇文乃外甥也故云自出宇文晁尚書之甥崔彧司業之孫尚書之子重泛鄭監審前湖補注鶴曰前詩云愛客尚書重之官宅相賢又云客居逢自出今題云宇文晁尚書之甥則詩在前篇之先作故詩云夜水春來更接連郊扉俗逺長幽寂野水春來更接連錦席淹留還出浦葛巾欹側未迴船蘇曰羊佑酒中迴船葛巾欹側樽當霞綺輕初散洙曰謝𤣥暉詩餘霞散成綺棹拂荷珠碎却圓趙曰梁元帝詩荷珠漾水銀不但習池歸酩酊洙曰見玉腕騮詩注君看鄭谷去夤縁洙曰鄭子真耕於谷口補注杜詩巻三十三
