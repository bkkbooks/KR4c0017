body:
  text: 補注杜詩巻三十五宋黄希原本黄鶴補注曉發公安數月憇息此縣大厯三年作補注鶴曰大厯三年秋公移居公安冬深入岳陽此詩作於其時詩云北城撃柝復欲罷謂九月吐蕃入㓂京城戒嚴今巳罷矣北城撃柝復欲罷洙曰易重門撃柝哀七年傳魯撃柝聞於邾東方明星亦不遲洙曰晉傳云東方大明星光影照千里詩東有啓明西有長庚註曰旦出謂明星為啟明日既入謂明星為長庚庚續也箋云啟明長庚皆有助日之名而無實光孫炎曰明星太白也出東方髙三舍而曰太白矣長庚不知是何星也或一星出在東西而異名或二者别星未能審也鄰雞野哭如昨日蘇曰張禹鄰雞哭野廐馬嘶風超坐拊髀望鄕長嘆物色生態洙曰一作生生能幾時洙曰顔延年日暮行樂歸物色桑榆時舟楫眇然自此去蘇曰鍾繇駕松舟檜楫眇然下驚波而去江湖逺適無前期洙曰沈休文别范安咸平生少年分手易前期趙曰無前期謂不知所止出門轉盼巳陳迹洙曰王羲之俛仰之間巳為陳迹藥餌扶吾隨所之洙曰謝靈運㳺南亭詩藥餌情所止衰疾忽在期泊岳陽城下大厯三年作補注鶴曰詩云舟雪洒寒燈當是大厯三年冬深作江國踰千里山城僅百層洙曰顔延年賦臨廣望坐百層岸風翻夕浪舟雪灑寒燈留滯才難盡洙曰管輅曰酒不可極盡吾欲持酒以禮持財以愚何患之有也史太史公自序太史公留滯周南艱危氣益増洙曰馬援曰大丈夫窮當益堅老當益壮趙曰史云懦夫増氣圖南未可料變化有鯤􅉇洙曰荘子北溟有魚其名為鯤鯤之大不知其幾千里也化而為鳥其名為􅉇􅉇之背不知幾千里也又云背負青天而莫之夭閼焉而後乃今将圖南也䌫船苦風戯題四韻奉簡鄭十三判官泛補注鶴曰詩云漲沙霾草樹舞雪渡江湖當是大厯三年在岳陽時作楚岸朔風疾天寒鶬鴰呼洙曰西都賦鳥則鶬鴰汎浮徃來漲沙霾草樹洙曰丘希範詩森森荒樹齊析析寒沙漲舞雪渡江湖洙曰古詩扁舟載風雪半夜渡江湖定功曰鮑照學劉公幹體云胡風吹朔雪千里渡龍山集君瑶䑓上飛舞兩楹間吹㡌時時落洙曰孟嘉傳嘉為桓温参軍既和而正温重之九月九日温逰龍山参僚畢集時佐吏並著戎服有風吹嘉帽落墮桓謂左右及賔客勿言且以觀其舉止維舟日日孤洙曰詩汎汎楊舟紼纚維之因聲置驛外趙曰題云簡鄭十三判官故使鄭荘置驛事為覔酒家壚洙曰司馬相如傳文君當壚郭璞曰壚酒壚師古曰賣酒之處累土為壚以居酒瓮四邉隆起其一面髙形如鍜壚故名壚耳登岳陽樓大厯三年作補注鶴曰唐子西云過岳陽樓觀子美詩不過四十字耳氣象閎放涵蓄深逺殆與洞庭争雄所謂富哉言乎者余謂一詩之中如呉楚東南拆乾坤日夜浮一聨尤為雄偉雖不到洞庭者讀之可使胷次豁逹當是大厯三年作昔聞洞庭水鄭曰在岳州今上岳陽樓洙曰風土記曰陽羡縣東有太湖中有包山山下有洞穴潜行地中無所不通謂洞庭地脉呉楚東南坼趙曰呉與楚地相接此實道洞庭濶逺之状乾坤日夜浮趙曰言在乾坤之内其水日夜浮也語既髙妙有力而言洞庭之光大過如此補注希曰渾天儀天如雞子地如雞子中黄孤居天内天大地小表裏有水四海之水浮於元氣之上天地各乘氣而立載水而行又水衡記天下之至多者水焉浮天而載地也親朋無一字老病有孤舟蘇曰孔伋友人見訪問先生何之伋揺溪上孤舟曰有此足以養老病復何愁焉戎馬關山北慿軒涕泗流洙曰老子戎馬出郊張景陽登䑓詩逺望涕泗流趙曰王仲宣登樓賦云慿軒檻以逺望向北風而開襟陪裴使君登岳陽樓大厯四年作補注鶴曰詩云雪岸叢梅發春泥百草生當是大厯四年初春作裴使君必岳守故用陳蕃事詩云禮加徐孺子湖濶兼雲霧樓孤屬晚晴禮加徐孺子洙曰後漢徐孺子豫章南昌人時陳蕃為太守以禮請署功曹穉不免之郡既謁而退蕃在郡不接賔客惟穉來時設一榻去則懸之後舉有道定功曰徐孺子公自比也詩接謝宣城洙曰謝𤣥暉為宣城郡太守時之宣城出新林浦向板橋有云江路西來永歸流東北騖天際識歸舟雲中辨江樹雪岸叢梅發春泥百草生敢違漁父問從此更南征洙曰史記屈原傳令尹子蘭怒屈原使上官大夫短原於楚㐮王怒而遷之原至江濵被髪行吟澤畔漁父見而問之曰子非三閭大夫歟何故至此原曰舉世混濁而我獨清衆人皆醉而我獨醒是以見放宋王作招魂辭曰獻歲發春兮汩吾南征些過南嶽入洞庭湖大厯四年作補注鶴曰題云過南嶽入洞庭湖則當是自潭州回岳陽作而詩云欹側風㠶滿㣲㝠水驛孤又云翠牙穿裛槳碧節吐寒蒲正大厯四年正月自岳陽之潭州時作殆謂自岳陽過南嶽而入洞庭也梁權道亦編在其年赴湖南詩内洪波忽争道岸轉異江湖鄂渚分雲樹衡山引舳艫洙曰屈原九章乘鄂渚而返顧漢武紀舳艫千里師古曰舳音軸艫音盧鄭曰説文云舳舟尾艫舟前也翠牙穿裛蔣碧節吐寒蒲趙曰槳字在韻書音奨云所以隐船曰槳今詳其義乃菰蒋之蒋耳盖蒲有節而蒋有牙也補注希曰淮南子原道訓篇浸潭苽蒋許氏註云浸潭之間以生苽蒋實苽者蒋實也苽讀觚哉之觚蒋讀水漿之漿今公乃作側聲用何也本草蒲有九節者為貴病渇身何去春生力更無壤童犁雨雪漁屋架泥塗欹側風㠶滿微㝠水驛孤悠悠迴赤壁趙曰赤壁在夏口之東武昌之西鄭曰盛𢎞之荆州記曰薄沂縣㳂江一百里南岸名赤壁周瑜破魏武於赤壁東西一百六十里浩浩略蒼梧趙曰蒼梧在洞庭西南之地乃永州也補注希曰九域志載蒼梧山在道州帝子留遺恨曹公屈壮圖洙曰屈平九歌湘君云帝子降兮北渚目眇眇兮愁予史記舜南巡狩崩於蒼梧之野禮記曰舜𦵏蒼梧二妃不從後漢獻帝紀建安十三年曹操自為丞相南征劉表表卒少子琮立以荆州降操以舟師伐孫權權将周瑜敗之於烏林赤壁周瑜傳曹公入荆州劉琮舉衆降權延見羣下問以計策瑜曰操雖託名漢相其實漢賊也操自送死而可迎之乎瑜請得精兵三萬人進徃夏口為将軍破之權曰老賊欲廢漢自立乆矣徒忌二袁吕布劉表與孤耳今數雄巳滅惟孤尚存與老賊勢不兩立君言當撃甚與孤合此天以授孤也遂共圖計逆曹公遇於赤壁破之聖朝光御極殘孽駐艱虞才淑隨厮養洙曰蒯通傳隨厮養之役者失萬乘之權守儋石之禄者闕卿相之位名賢隐鍜鑪鄭曰鍜鑪小冶也趙曰此言上雖復長安而吐蕃猶未息是為駐艱虞才淑之人有隨厮養者名士之賢有隐鍜鑪者嵇康初居貧與向秀共鍜於支樹之下以自贍給邵平元入漢洙曰蕭何傳陳豨反髙祖自将至邯郸而韓信謀反關中吕后用何計誅信上聞誅信使使拜何為相國益封五千戸衛諸君皆賀卲平者故秦東陵侯謂何曰禍自此始矣上暴怒於外而居守於内非被矢石之難而益君封置衛者以今者淮隂新反於中有疑君心夫置衛衛君非所以寵君願君謝封勿受悉以家財佐軍何從其計上大悦張翰後歸呉洙曰晉文苑傳張翰呉人齊王冏辟為大司馬東曹掾翰因見秋風起乃思呉中菰米蒪菜鱸魚歎曰人生貴得適志何能羈宦數千里以要名爵乎遂命駕而歸莫怪啼痕數危檣逐夜烏洙曰檣掛㠶木也趙曰檣上刻烏以候風隂鏗詩檣轉向風烏宿青草湖大厯四年作補注鶴曰青草湖在岳州與洞庭湖相連當是大厯四年赴湖南時宿此洞庭猶在目青草續為名夢符曰按岳州圖經洞庭湖在縣西南一里荆州記云巴陵南有青草湖與洞庭湖相連周迴數百里日月出沒其中鄭曰十道志在岳州荆州記因青草山為名周回八百里呉録地志巴陵有青草湖盖洞庭本指呉縣南所謂太湖是也宿槳依農事趙曰楚人於湖中種田故宿槳依之也郵籖報水程趙曰舟中所用以知時也漏籌謂之郵籖古詩雞人司漏轉更籖寒氷争倚薄雲月逓微明湖鴈雙雙起人來故北征洙曰九歌云駕飛龍兮北征邅吾道兮洞庭宿白沙驛洙曰初過湖南五里大厯四年作補注鶴曰詩云湖外草新青又云萬象皆春氣當是大厯四年春赴湖南時經此水宿仍餘照洙曰謝靈運入彭蠡湖日作客㳺倦水宿風湖難自論人烟復此亭驛邉沙舊白湖外草新青萬象皆春氣孤槎自客星洙曰博物志曰仙查犯牛斗客星於蜀郡問嚴君平隨波無限月蘇曰景差湘江辭云隨波無限月愁殺獨醒人望月莫蘭酌流泪沾衣巾的的近南溟洙曰荘子鵬鳥海運則将徙於南溟南溟天池也湘夫人祠大厯四年作洙曰屈原九歌有湘夫人韓愈黄陵廟碑云湘旁有廟曰黄陵自前古立以祠堯之二女舜二妃者庭有古碑斷裂分散在地其文剥缺考圖記言漢荆州牧劉表兄立題碑曰湘夫人今騐其文乃晉太康九年又題其額虞帝二妃之碑非劉之立者秦博士對始皇帝云湘君者堯之二女舜妃者也劉向鄭𤣥亦皆以二妃為湘君離騷九歌既有湘君又有湘夫人王逸之解以為湘君者自為水神而謂湘夫人乃二妃也從舜南征三苗不返道死沅湘之間山海經曰洞庭之山帝之二女居之郭璞疑二女者帝舜之后不當降小君為其夫人因以二女為天帝之女以余考之璞與王逸俱失也堯之長女娥皇為舜正妃故曰君其二女英自宜降曰夫人也故九歌辭謂娥皇為君謂女英為帝子各以其盛者言之也禮有小君明其正者得稱君也書曰舜陟方乃死傳謂舜升道南方以死或曰舜死葬蒼梧二妃從之不及溺沅湘之間余謂竹書紀年帝王之沒皆曰陟陟昇也謂昇天也書殷禮陟配天言以道終其德協天也書紀舜之没云陟與竹書同文也其下言陟方乃死者所以釋陟為死也地之勢東南下如言舜南巡而死宜言下方不得言陟方也以此謂舜死葬蒼梧之野於時二妃從之不及而溺者皆不可信補注鶴曰按九域志二妃廟在全州而全在唐為永州故今全有零陵郡古城又灌陽縣舊屬永公自岳之潭不應舟出此當是别有祠在洞庭之上流山海經云洞庭之山帝之二女居之宜有祠也詩云晩泊登汀樹微馨借渚蘋後篇祠南夕望云百丈牽江色孤舟汎日斜皆謂舟之所經則祠在洞庭之上長沙之下無疑故韓愈黄陵廟碑云以私錢十萬抵岳州願易廟之圯桷腐瓦於刺史王堪之此詩當是大厯四年春作肅肅湘妃廟洙曰肅肅敬也詩思齊肅肅在廟空墻碧水春蟲書玉佩蘚燕舞翠帷塵晩泊登汀樹微馨借渚蘋蒼梧恨不淺染淚在叢筠洙曰湘妃涕泣以淚揮竹染竹成斑趙曰張華博物志云舜死二妃淚下染竹即斑補注鶴曰竹紀云湘竹亦曰湘妃竹生瀟湘亦引博物志云舜南巡死於蒼梧二妃淚下染竹成斑二妃為湘神故曰湘妃祠南夕望補注鶴曰與前篇同一時作百丈牽江色洙曰海賦掲百丈所以牽船也連竹為之孤舟汎日斜興來猶杖屨目斷更雲沙山鬼迷春竹洙曰屈原九歌有山鬼祠余處幽篁兮終不見天路險厄兮獨後來湘娥倚暮花洙曰湘娥屈平所謂湘君也郭璞江賦協靈運於湘娥湖南清絶地萬古一長嗟蘇曰徐元詩萬古長安景搔頭一嘆嗟發白馬潭大厯四年作補注鶴曰詩云水生春䌫沒又云南征且未迴舊次在祠南夕望之後當是大厯四年赴湖南時作水生春䌫沒洙曰呉志孫權傳註權為牋與曹公説春水方生公宜速去日出野船開宿烏行猶去花叢笑不來人人傷白首處處接金盃莫道新知要趙曰楚詞云樂莫樂於新相知南征且未迴洙曰屈平離騷濟沅湘以南征歸鴈大厯四年作補注鶴曰詩云是物闗兵氣何時免客愁當是大厯四年春赴湖南時作時吐蕃未寕聞道今春鴈南歸自廣州見花辭漲海趙曰漲海海名也避雪到羅浮是物闗兵氣何時免客愁年年霜露隔不過五湖秋野望大厯四年作補注鶴曰詩云雲山兼五嶺風壌帶三苗野樹侵江濶春蒲長雪消當是大厯四年春作納納乾坤大行行郡國遥洙曰古樂府行行重行行補注希曰楚辭衣納納而掩露魏武帝詩行行日巳逺人馬同時飢雲山兼五嶺魯曰陸機贈頋交阯詩伐鼔五嶺表蒼舒曰按秦始皇畧定揚越調戍五方南守五嶺塞上嶺一也騎歸嶺二也都龎嶺三也畧緒嶺四也越城嶺五也自北徂南入越之道必由嶺焉黄曰裴氏廣州記曰大庾始安臨賀桂陽掲陽是五嶺何曰鄧德明南康記曰大庾嶺一桂陽甲騎嶺二九真郡龎嶺三臨賀萌緒嶺四始安越嶺五風壤帶三苗洙曰舜典竄三苗於三危註云苗國名縉雲氏之後為諸侯饕餮三危西裔昭元年説自古諸侯不用王命者虞有三苗夏有觀扈補注希曰書註三苗之國左洞庭右彭蠡此詩乃自岳之潭舟經洞庭故云謂之兼五嶺者亦以其地連臨賀始安也野樹侵江濶春蒲長雪消扁舟空老去無補聖明朝入喬口大厯四年春作魯曰長沙北界補注鶴曰唐志潭州有喬口鎮兵九域志喬口鎮在長沙縣當是大厯四年春作漠漠舊京逺洙曰陸機樂府街巷紛漠漠盧諶詩南望舊京路遲遲歸路賖殘年傍水國洙曰周禮水國用龍節顔延年詩水國周地險落日對春華樹蜜早蜂亂田曰樹蜜棋也崔豹古今註曰棋一名樹蜜一名木餳實形拳曲核在實外荆湘多此師曰樹蜜棋也或作拘髙大似白楊多枝而曲飛鳥喜巢其上所謂止椇來巢是也而説者謂蜜當作宻非也若望兠率寺詩云樹蜜當山徑江深隔寺門自當作宻補注希曰本草石蜜陶隐居云即崖蜜也又有木蜜呼為食蜜懸樹枝作之木蜜即樹蜜自不必别求况言輕鷰而及江泥言早蜂而及樹蜜皆其類也江泥輕鷰斜賈生骨巳朽悽惻近長沙洙曰前賈誼傳天子議以誼在公卿之位絳灌之屬盡害之迺毁誼曰雒陽之人年少初學專欲擅權紛亂諸事於是天子役亦踈之以誼為長沙王傅誼既謫去意不自得渡湘為賦弔屈原後梁王勝墮馬死誼自傷為傅亡状常哭泣後嵗餘亦死老子曰其人與骨巳皆朽矣銅官渚守風大厯四年春作趙曰潭州長沙有銅官山云楚鑄錢處則此渚乃以是得名乎鄭曰寰宇記銅官山在湘縣南一百一十八里與長沙分縣界補注鶴曰按寰宇記梓州銅山縣西南五十八里亦有銅官山又李膺蜀記云梓州𤣥武縣簡州金水縣競銅官坑則梓州亦自有銅官山公又嘗至梓然此詩不夜楚㠶落避風湘渚間則在潭州明矣當是大厯四年春作不夜楚㠶落避風湘渚間水耕先浸草春火更燒山補注希曰三秦記趙髙燒山山雞飛走早泊雲物晦逆行波浪慳飛來雙白鶴過去杳難攀洙曰漢武詔火耕水耨應邵曰燒草下水種稻草生髙七八寸因悉芟去復下水灌之草死獨稻長所謂水耕歐曰古樂府虞世南飛來雙白鶴奮翼逺凌煙俱棲集紫蓋一舉背青田師曰古調云飛來雙白鶴乃從西南來又古樂府載飛來雙白鶴三篇梁元帝云時從洛北渡飛向遼東來皆過去難攀之意也北風大厯四年春作洙曰新康江口信宿方行補注鶴曰詩云春生南國瘴氣待北風蘇當是大厯四年春暖喜得北風而作也回棹詩云衡岳江湖大蒸池疫癘偏盖其時也春生南國瘴氣待北風蘇向晚霾殘日洙曰詩終風且霾趙曰爾雅云風而雨土為霾實言昏曀之状也初宵鼔大鑪洙曰莊子大宗師以天地為大鑪王粲師傳鼔洪鑪以燎毛髪爽攜卑濕地洙曰賈誼傳誼既以謫居長沙卑濕誼自傷悼乃為賦聲拔洞庭湖萬里魚龍伏三更鳥獸呼趙曰魚龍懼而藏伏鳥獸驚而呼鳴滌除貪破浪趙曰南史宗慤云願乗長風破萬里浪愁絶付摧枯執熱沉沉在洙曰桑柔詩誰能執熱逝不以濯凌寒往往須且知寛病肺不敢恨危塗再宿煩舟子洙曰莊三年傳再宿為信趙曰詩招招舟子衰容問僕夫黄曰邵平衰容忘事時復問僕夫南北今晨非盛怒趙曰宋玉風賦盛怒於土囊之口便道即長驅隐几㸔㠶席洙曰海賦挂㠶席莊子南郭子綦隐几而坐隐憑也雲山湧坐隅發潭州大厯四年春作補注鶴曰詩云曉行湘水春當是大厯四年春自潭之衡時作明年雖亦嘗去潭之衡然是時巳夏故知其為今年作夜醉長沙酒洙曰謝惠連雪賦酌湘呉之醇酎曉行湘水春岸花飛送客檣燕語留人賈傅才何有洙曰賈誼為長沙王太傅褚公書絶倫洙曰按唐書禇遂良博渉文史尤工𨽻書父友歐陽詢甚重之太宗嘗謂侍中魏徴曰虞世南死後無人可論書徴曰遂良下筆遒甚得王羲之體太宗即日召令侍書太宗嘗出御府金帛購求羲之書迹天下争齎古書詣闕以獻當是莫能辨其真偽遂良備論所出一無舛誤永徽元年髙宗将廢皇后王氏立昭儀武氏為后遂良極諫以為不可致笏於殿陛曰還陛下此笏仍解巾叩頭流血帝怒令引出翌日李勣奏曰此乃陛下家事不合問外人帝乃立武昭儀為皇后左遷遂良潭州都督顯慶三年為宻中刺史桓譚以揚雄為絶倫補注鶴曰一本注云禇永徽末放此禇公置笏解巾極諌王后不宜廢髙宗若聴其言安得有武氏之禍其忠操可謂絶倫矣書特其小耳名髙前後事回首一傷神雙楓浦大厯四年作補注鶴曰大厯四年去潭州時作詩云自驚衰謝力不道棟梁材盖因楓而自傷也輟棹青楓浦雙楓舊巳摧洙曰阮籍詩云湛湛長江水下有楓樹林自驚衰謝力不道棟梁材浪足浮紗帽皮須截錦苔江邉地有主暫借上天迴趙曰此用乗槎事也迴棹大厯四年作趙曰此公厭衡山之熱憶峴山之凉欲迴棹而徃盖公本襄陽人也補注鶴曰魯謂是大厯五年作然詩不言臧玠之變當止是大厯四年至衡州畏熱欲歸襄陽而卒留於潭宿昔試安命趙曰莊子云知其不可奈何而安之若命自私猶畏天勞生繫一物趙曰人之勞生不免繫著一物若名若利皆是矣為客費多年衡岳江湖大鄭曰荆州記衡州南岳也周旋數百里髙四千一十丈蒸池疫癘偏鄭曰寰宇記衡州衡陽縣蒸水源出縣西名蒸水者其氣如蒸也山水經云蒸水出重安縣南又東北至臨蒸至湘渭之蒸口散才嬰薄俗有跡負前賢趙曰賢者每以跡為累故以絶迹為貴今有留滯之迹以為負愧於前賢矣巾拂那闗眼趙曰巾拂所以莊肅形容之物瓶罍易滿船蘓曰洪嶠解官去長沙臨行嘆曰兒女滿眼歸無負郭滿船瓶罍復何益於吾哉火雲滋垢膩洙曰淮南子曰早雲煙火涷雨裛沉洙曰一作塵綿洙曰思𤣥賦凍雨霈兮洒途注暴雨也補註鶴曰爾雅云凍雨乃夏月暴雨離騷今飄風兮先驅使凍雨兮灑塵強飯蓴添滑強其亮初洙曰蓴見張翰後歸吳注端居茗續煎夢符曰按茶録潭邵之間渠江中有茶鄉人每年採擷其色如鐵芳草異常補註希曰余嘗官郴見其土風唯尚煎茶客至繼以六七則知茗續煎者湖南多如此清思漢水上凉憶峴山巔趙曰湘潭之地最為卑濕䒱鬱之處於此豈非懐鄉之語順浪飜堪倚洙曰江賦馮夷倚浪以傲晲迴帆又省牽吾家碑不昧洙曰杜預沉碑峴山之下王氏井依然洙曰王粲宅有井几杖將衰齒茅茨寄短椽灌園曽取適遊寺可終焉遂性同漁父洙曰屈原莊子皆有漁父篇成名異魯連洙曰史記田單屠聊城歸而言魯連欲爵之魯連逃隱於海上曰吾與冨貴而詘於人寜貧賤而輕世肆志焉趙曰如滄浪之漁父不求名聞飜異魯仲連盖仲連却秦軍下燕城雖不受封猶為取名也篙師煩爾送朱夏及寒泉趙曰語篙師云煩爾送我一去猶於朱夏之際趂及寒泉之為可挹也奉送王信州崟北歸大厯四年夏作補注鶴曰詩云太史尚南留公自謂也當是在湖南作又云林熱鳥開口江渾魚掉頭大厯四年夏作朝廷防盜賊供給愍誅求下詔遷郎署傳聲典信洙曰一作能典州趙曰信州乃夔州見唐志補注鶴曰唐州固以䕫州為本信州而亦云頴州汶隂郡本信州今詩有壤歌唯海甸又用陳蕃下榻事云頴川何以酬當是王得頴蒼生今日困天子嚮時憂井屋有烟起瘡痍無血流趙曰追言天子前時以蒼生之困而選王君為守其效至於井屋有􅃄則逃亡復業矣瘡痍無血則誅求不再矣壤歌唯海甸趙曰撃壤之歌也唯海甸則時淮海無虞也畫角自山樓白髪寐常早趙曰公自言也荒榛農復秋趙曰言荒年之後又復有秋矣解龜踰卧轍謝靈運初去郡牽絲及元興解龜在景平侯霸為臨淮太守被徴百姓攀轅卧轍不許去趙曰以徐孺子自比而指王崟為陳蕃也言岑相待如陳蕃之見孺子則頴川将何以酬之乎頴川陳氏郡號也遣騎覔扁舟洙曰劉真長遣騎覔張孝亷船見晉書扁舟小舟也徐榻不知倦洙曰陳蕃為徐孺子下榻去則懸之頴川何以酬塵生洙曰一作老塵彤管筆詩彤管有煒寒膩黒貂裘洙曰蘇秦有黑貂裘髙義終焉在斯文去矣休别離同雨散洙曰曹子建風流雲散一别如雨劉孝標烟飛雨散行止各雲浮劉越石詩功業未及建夕陽忽西流時哉不我與去矣若雲浮林熱鳥開口江渾魚掉頭趙云此言離别之景尉佗雖北拜陸賈傳時中國初定尉佗平南越因王之髙祖使賈賜佗印為南越王尉佗魋髻箕倨見賈賈因説佗君王宜郊迎北面稱臣於是佗迺蹶然起坐謝賈卒拜佗南越王令稱臣奉漢約歸報髙祖大悦拜賈為太中大夫太史尚南留見周南太史公註軍旅應都息寰區要盡収九重思諫諍八極念懐柔徙倚瞻主室從容仰廟謀故人持雅論絶塞豁窮愁趙曰故人指王信州也言聞王信州之論則可以豁旅寓之愁也復見陶唐理甘為汗漫遊洙曰淮南子神仙傳盧敖見一士曰吾與汗漫期於九垓之外趙曰言既復唐堯之化則無心從官而甘為方外之士也江閣卧病走筆寄呈崔盧兩侍御大厯四年秋作補注鶴曰後有江閣對雨懐行營裴端公大厯五年平蔵玠在潭州而公巳去潭則江閣不在潭州也此詩云長夏想為情又云滑憶彫胡飯則是四年秋作意江閣在潭州之近境故四年之秋五年之初夏皆在焉客子庖厨薄江樓枕席清衰年病秪痩長夏想為情滑憶洙曰一作喜彫胡飯洙曰沈休文彫胡方自炊又㑹稽人顧翺少失父事母至孝母好食彫胡飯常躬自採擷家近太湖湖中後自生彫胡香聞錦帶􅅅夢符曰按荆湘有錦帶春末開花紅白如錦其苗亦嫩脆可食師曰王彦輔云錦帶吐綬雞也其肉脆美堪作臛錦帶花則予親見之謂吐綬雞為錦帶則傳記所不載彦輔博學而文恐其言亦有所據補注鶴曰既以錦帶花為春生而詩云長夏若為情又云滑憶彫胡飯當是秋作則非錦帶花明矣謂之吐綬雞固未知所據不然亦烏獸中物如今人稱一種禽為練帶繡帶是也下云溜匙兼暖腹則溜匙指飯暖腹指􅅅又未必是花也溜匙兼暖腹誰欲致盃􅑥潭州送韋員外牧韶州大厯四年秋作洙曰迢或云韋適補注鶴曰詩云秋天昨夜涼當是大厯四年秋作韶屬嶺南道炎海韶州牧風流漢署郎分符先令望洙曰鮑明逺将以分符竹同舍有輝光洙曰直不疑為郎為同舍郎疑取金趙曰公亦是員外郎故於韋員外可謂之同舍矣白首多年疾秋天昨夜涼洞庭無過鴈書䟽莫相忘趙曰言自洞庭而徃彼雖無過鴈以寄書去而彼中書信却不可忘也潭州留别杜員外院長韶州刺史韋迢江畔長沙澤洙曰一作驛相逢䌫客船大名詩獨歩小郡海西偏趙曰言子美獨歩曹子建與楊徳祖書曰仲宣獨歩於漢南小郡者韋君自謂韶州也地濕愁飛鵩洙曰賈誼為長沙王太傅長沙卑濕但自傷悼以為壽不得長迺為鵩賊有鵩飛入誼舍止於坐隅鵩似鴞不祥鳥天炎畏跕鳶馬援曰吾在浪泊西里聞虜未滅時下潦上霧毒氣薫蒸仰視飛鳶跕跕墮水中去留俱失意把臂共澘然蘇曰徐璿至固陵下馬把臂兩意澘然久之乃揮淚分首江閣對雨有懐行營裴二端公大厯五年作補注鶴曰端公謂裴虬即道州刺史同平臧玠之亂者當是大厯五年作按通典唐侍御史凡四員内供二員號為䑓端他人稱之曰端公虬嘗為御史故云行營正為平臧玠而言舒元輿作御史記以中丞為端長謂中丞為䑓端之長也南極一云南紀風濤壯田曰詩曰滔滔江漢南國之紀説者援是詩以江漢為南紀非也盖南紀乃分野名廣天文志云是循嶺徼逹甌閩中是謂南紀所以限蠻夷也趙曰顔延年春江壮風濤隂晴屢不分野流行地日江入度山雲層閣慿雷殷長空水面洙曰一作面水文雨來銅柱北應洗伏波軍洙曰伏波馬援也嘗征武陵蠻立銅柱以勒功趙曰銅柱在驩州洗軍字昔武王伐紂大雨太公謂之洗兵雨今因雨自銅柱而來引起馬援則遂有洗伏波軍之句早發湘潭寄杜員外院長韋迢作補注鶴曰此詩語意與前篇送韋員外牧韶州詩多同又同韻疑是韋酬杜之詩前所謂留别杜員外者當移在此覧者合以語意求之况和押一凉字北風昨夜雨江上早來涼楚岫千峯翠蘇曰景差蘭䑓春望千峯楚岫碧萬木郢城隂湘潭一葉黄故人湖外客白首尚為郎趙曰杜公晚為員外郎馮唐顔駟白首為郎相憶無南鴈何時有報章薛云按文選顔延年和謝監詩盡言非報章聊用市所懐酬韋韶州見寄大厯四年秋作補注鶴曰韋詩云江上早來涼又云湘潭一葉黄當是大厯四年秋作湘潭屬潭州舊史云後漢湘南縣地呉分湘南立衡陽屬衡陽郡隋廢郡縣屬潭州天寳八年移治於洛口因改為湘潭今韋發湘潭而公酬於潭州也養拙江湖外朝廷記憶踈深慙長者轍洙曰長者轍見陳平傳趙曰言見過之無人也重得故人書洙曰古詩客從逺方來遺我一札書又相去萬餘里故人心尚爾趙曰言書問之不至也白髪絲難理蘇曰張企素髪如絲無計料理幾煩梳鏡時起咨嗟新詩錦不如雖無南過鴈蘇曰見書成無過鴈註補注希曰衡陽有回鴈峯相傳鴈自此而回雖無此理而詩人屢用之是時公在潭故云㸔取北來魚洙曰古詩呼童烹鯉魚中有尺素書千秋節有感二首大厯四年作補注鶴曰大厯四年潭州作詳見註自罷千秋節頻傷八月來先朝常宴㑹壯觀巳塵埃洙曰唐𤣥宗紀上以降誕日讌百寮於花萼樓下百寮表請以毎年八月五日為千秋節三公以下獻鏡及承露囊補注鶴曰開元十七年八月五日左相源乾曜右相張説請以是日為千秋節羣臣因獻甘露萬歲壽酒又水泰元年獨孤及上表𤣥宗生日以飲酒宴樂布慶萬方鳯紀編生日龍池塹劫灰趙曰唐六典註興慶宫池即𤣥宗龍潜舊宅所居此宅東有舊井忽湧為小池常有雲氣或黄龍見其中至景龍中其池浸廣遂鴻洞為龍池焉饒曰漢武帝穿昆明池悉是灰墨有外國胡道人云此是天地劫灰之餘湘川新涕淚洙曰二妃涕淚灑竹成班趙曰公自言其身之所在而感泣者也舊所引謬矣秦樹逺樓䑓洙曰謝𤣥暉銅雀詩縹帷飄井幹樽酒若平生欎欎西陵樹詎聞歌吹聲井幹樓也趙曰公言去長安之逺遥望其樹與樓䑓俱不見也舊所引非是寳鏡羣臣得金吾萬國迴逸曰金吾将軍掌禁衛者補注希曰寳鏡謂王公戚里進金鏡綬帶百官表中尉更名執金吾師古曰金吾鳥名也主辟不祥故執此鳥之象因以名官衢樽不重飲白首獨餘哀蘓曰沈炯漂泊未歸搔首歎曰今天下戈兵洶洶弟妹分散唯獨哀白首餘生恐投死無地趙曰淮南子曰聖人之道其猶中衢而致樽邪今公所言則謂當時賜宴之酒羣臣皆得霑飲正如衢樽也御氣雲樓敞含風綵仗髙仙人張内樂定功曰宣室志云唐𤣥宗夢仙子十餘軰御雲而下各執樂器而奏之其度曲清越殆非人世也趙曰鄭棨開天傳紀云云𤣥宗謂髙力士曰吾昨夜夢遊月宫月宫諸仙娯予以上清之樂寥亮清越之音非人間所聞也吾歸其曲凄楚動人杳杳在耳力士請名曰紫雲曲王母獻宫桃洙曰見九重春色醉仙桃註羅韈紅蕖豔趙曰言樂人也洛神賦凌波微歩羅韈生塵又迫而察之若芙蕖出緑波金羈白雪毛洙曰曹子建白馬飾金羈連翩西北馳舞階銜壽酒洙曰舜舞干羽于兩階劉伶銜盃潄醪詩為此春酒以介眉壽補注鶴曰即是日羣臣所獻萬歲壽酒及王洙所謂羣臣獻甘露酎酒上從而讌百僚於花萼樓下也走索背秋毫洙曰西京賦跳丸劔之揮霍走止索而相逢鄭曰索昔各切繩也聖主他年貴趙曰追念明皇之昔日也邉心此日勞趙曰言今在邉逺之地而感望也桂江流向北滿眼送波濤趙曰以見公北望長安之切矣補注鶴曰明皇以寳應元年建巳月崩千秋節由是而罷是時公在成都今在潭州距罷節巳八年故首有頻傷八月來之句前篇云湘州新涕淚後篇云桂江流向北盖以湘水之源自桂州離江而下經零陵以至於潭今公在潭作此故云晩秋長沙蔡五侍御飲筵送殷六叅軍歸澧州覲省詩補注鶴曰詩云湖南冬不雪吾病得淹留當是大厯四年冬作佳士欣相識蘇曰祖逖遇梁劭曰久聞佳士聲名今日欣識風采慈顔望逺遊洙曰潘安賦壽觴舉慈顔和論語父母在不逺遊趙曰佳士指殷六也慈顔則殷之母也言望其逺遊而歸也甘從投轄飲洙曰陳遵嗜酒每大飲賔客滿座輒關門取客車轄投井中雖有急終不得去師古曰坐閣閉門又投車轄於井中也趙曰言甘從蔡五之飲也肯作致書郵洙曰殷羡洪喬為豫章太守都下士人因羡致書者百餘函行次石頭皆棄水中曰沉者自沉浮者自浮殷羡不為致書郵趙曰言殷不茍為人攜書也髙鳥黄雲暮蘇曰古樂府云黄雲暮四合髙鳥各分飛客語逺遊子月圓胡不歸寒蟬碧樹秋趙曰江淹碧樹先秋落湖南冬不雪吾病得淹留湖中送敬十使君適廣陵人厯四年秋作補注鶴曰詩云秋晚岳増翠風髙湖湧波當是大厯四年秋公在潭州作廣陵乃揚州故末有淮海莫蹉跎之句相見各頭白其如離别何幾年一㑹面今日復悲歌少壯樂難得蘇曰梁瑝在囚歎曰少壯唯難得樂事坡又云此言真可書紳歲寒心匪他氣纒霜匣滿趙曰言在匣中而氣騰矣冰置玉壺多洙曰樂府清如玊壺冰趙曰言心之清也遭亂實漂泊濟時曽琢磨形容吾校老膽力爾誰過秋晚岳增翠風髙湖湧波趙曰魏文帝浮淮賦云驚風泛湧波騫騰訪知巳淮海莫蹉􅋸長沙送李十一銜大厯五年作補注鶴曰詩云與子避地西康州洞庭相逢十二秋今計其年當是大厯五年作未幾公即世矣與子避地西康州洞庭相逢十二秋趙曰初同避地於西康州凡十二年秋而復相逢於洞庭補注鶴曰西康州乃同谷縣按志武徳元年以縣置西康州貞觀元年州廢縣屬成州咸通十三年復置公以乾元二年巳亥冬至同谷今詩云洞庭相逢十二秋當是在大厯五年秋作盖公是年夏自潭之衡復欲歸襄陽故下岳陽復次潭也逺愧尚方曾賜履趙曰公嘗為左拾遺則䝉尚方賜履矣竟非吾土倦登樓洙曰王粲登樓賦雖信美而非吾土兮曽何足以少留久存膠漆應難並趙曰言雖有膠漆之好而才器相逺為難比盖公自謙也一辱泥塗遂晚収趙曰言流落而汩沒也左傳使吾子辱在泥塗李杜齊名真忝竊洙曰後漢杜宻傳黨事既起宻免歸本郡與李膺俱坐而名行相次故時人稱李杜焉前有李固杜喬故亦言也范滂傳滂詣獄與母訣母曰汝今得與李杜齊名死亦何恨謂李膺與杜宻朔雲寒菊倍離憂補注杜詩巻三十五
