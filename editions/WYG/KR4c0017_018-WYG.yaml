body:
  text: 補注杜詩巻十八宋黄希原本黄鶴補注奉寄河南韋尹丈人天寶七載作洙曰甫故廬在偃師承韋公頻有訪問故有是詩補注鶴曰按舊史韋濟傳天寶七載為河南尹遷左丞唐地理志河南府偃師注云天寳七載尹韋濟以北坡道迂自縣東山下開新道通孝義橋則詩當作於是年詩云章甫尚西東又云江湖漂短褐霜雪滿飛蓬牢落乾坤大周流道術空可知是時公又去京師而他矣意在近畿故詩云奉寄是年韋方拜左丞公有兩詩贈之謂之贈則歸京師後投贈也有客傳河尹逢人問孔融洙曰河尹河南尹也孔融公自比也趙曰見問者河南尹也故得以孔融為比蓋李膺為河南尹而孔融造門為上客也青囊仍隠逸洙曰郭璞授業於鄭公以青囊九書與之遂開洞五行後門人竊青囊未及讀為火焚之章甫尚西東洙曰章甫儒冠也孔子生於魯冠章甫之冠鼎食為門戸洙曰列鼎而食門戸閥閲也趙曰以言河尹之貴詞場繼國風洙曰詩之國風趙曰以言河尹之能詩尊榮瞻地絶洙曰言地望崇重疎放憶途窮洙曰阮籍詩途窮能無慟濁酒尋陶令趙曰陶淵明嘗曰偶有名酒無日不傾丹砂訪葛洪趙曰祈心於遐年故訪葛洪洪嘗於帝乞為勾漏令以出丹砂而就之江湖漂短洙曰當作裋褐鄭曰裋臣庾切敝布襦褐胡葛切短衣洙曰淮南子霜雪亟集短褐不完褐毛布霜雪滿飛蓬洙曰詩首如飛蓬定功曰公此詩作於潭州適當冬時述其羈旅流落之狀上句言短褐為江湖所漂下句言飛蓬之髪為霜雪所滿補注鶴曰短褐二字見史記田文傳又貨殖傳貧者裋褐不完裋布長襦也褐偏枲衣也然唐志士服短褐庶人以白則短褐對飛蓬亦是此非謂真至江湖也第言流轉道路如此爾若曰作於潭州則是大厯四年及五年是時河南尹乃杜鴻漸及裴冕無姓韋者牢落乾坤大蘇曰余絳失意雲霄羈思牢落歸栖無巢始知乾坤之大周流道術空趙曰言天地廣大而我獨牢落雖挟道術竟於周流之際成空而無用謬慙知薊子洙曰後漢方術傳薊之訓有神異之道到京師公卿以下候之者坐上常數百人皆為設酒脯終日不匱眞怯笑揚雄洙曰揚雄解嘲曰子乃以鴟梟而笑鳳凰子徒笑我𤣥之尚白吾以笑子之病甚不遭叟跗扁鵲悲夫盤錯神明懼洙曰虞詡曰不遇盤根錯節何以知利器謳歌徳義豐趙曰如鄭歌子産漢歌岑君是也尸鄉餘土室難說洙曰一作誰話祝雞翁洙曰後漢地理志偃師有尸鄉列仙傳祝雞翁居尸鄉山下養雞百餘各有名字呼名則種别而至補注鶴曰土室謂依土山以為室如宿贊公土室詩云天寒鳥已歸月出山更靜土室延白光松門耿疎影是也諸杜廬與墓多在河南偃師故憑孟倉曹覔士婁舊莊詩平居喪亂後不到洛陽岑則喪亂之前公屢到矣宜自開元二十九年酹逺祖于洛之首陽及天寳元年為姑萬年縣君制服作銘三年為皇甫妃范陽太君盧氏作誌皆在河南也所以公死又歸袝於偃師對雨書懷走邀許主簿開元二十九年作補注鶴曰主簿即任城許主簿當是開元二十九年至兖州與許遊南池時相先後今詩云東嶽雲峯起則是在兖州甚明魯訔年譜引公酹文云二十九年在洛之首陽祭逺祖則至兖在二十九年之前梁權道編在天寶十三年非蓋是年公在長安東嶽雲峯起溶溶滿太虚震雷翻幕燕洙曰左傳季札曰夫子在此猶燕巢幕上驟雨落河魚洙曰河一作溪補注鶴曰幕燕猶檣烏門龜之類謂幕上為燕形以係飾者河魚乃水面之塵所結成者如釡生魚也公秋述懷云臥病長安旅次多雨生魚此義也座對賢人酒洙曰魏志徐邈為尚書郎時禁酒而邈私飲至於沉醉從事趙逢問以曹事邈曰中聖人逢白之太祖甚怒將軍鮮于輔進曰平日醉客謂酒清者為聖人濁者為賢人邈性修慎偶醉言耳竟坐得免刑門聽長者車洙曰陳平家廼負郭窮巷以席為門然門外多長者車轍相邀愧泥濘騎馬到堦除蘇曰沈遜見徐陵陵㑹文士騎馬至堦除下馬坐客與陵皆惡之遜自若良久揮玉麈髙談清逸闔坐傾伏師曰東岳泰山也雲起於泰山須叟徧天下雨遂作長者車以詣許主簿已上人茅齋開元二十九年間作歐陽修曰僧齊已也善吟詩知名於唐補注鶴曰梁權道編天寳十二載游山東時作然舊次與洛兖所作詩先後當是開元二十九年間已公茅屋下定功曰潘安仁秋興賦序云偃息不過茅屋茂林之下補注希曰漢外戚許皇后傳幸得免離茅屋之下可以賦新詩枕簟入林僻蘇曰王𢎞常擕竹簟石枕於林泉僻處終日偃臥長嘯茶𤓰留客遲江蓮搖白羽洙曰白羽扇也天棘夢洙曰當作蔓青絲鮑曰吕吉甫言當作天棘薪然棘不可以絲為比曽子開云恐是巴㦸天今按本草巴㦸雖名三蔓草而葉似茗又似麥門冬亦不可比絲唯天門冬注引博物志抱朴子一名巔棘圗經言春生藤蔓髙丈餘葉如絲杉而細散可以絲為比蓋合天門冬巔棘為一稱之歟近有冷齋夜話謂之栁而不著所出蘇曰天棘梵語栁也伊吾日本竺國呼栁為天棘夢疑弄字可與正文妥帖王逸少詩曰湖上春風舞天棘信栁非疑也田曰夢作蔓云天棘乃天門冬非也趙曰歐陽公善本夢作蔓字蔡伯世云此句最疑學者或以天棘為栁妄引近傳東坡事載王逸少詩湖上春風舞天棘非有與義疑非坡説以余考之本草圗經云則天棘為天門冬明矣補注希曰洪駒甫詩話云王仲至云天棘非煙非霧自一種物出異書今意夢者夢夢然也仲至弟曰異書又似不可信空沗許詢輩難酬支遁詞洙曰支遁字道林講維摩經謂無以歴難許設一難遁不能復通趙曰支遁講維摩經許詢常設問難公蓋言我空沗許詢之流而難酬對支遁所以美巳上人也補注鶴曰髙僧傳云優婆塞支謙一名越本月支人來遊漢境初漢桓靈之世有支䜟譯出衆經有支亮資學於䜟謙又受筆於亮亮學異書通六國語時人語曰支郎然則支云者其僧之通稱歟房兵曹胡馬開元二十八九年間作補注鶴曰唐志東宫王府三都都督府都䕶府皆有兵曹房兵曹未詳何人以舊次先後當在開元二十八九年間胡馬大宛名鄭曰宛於爰切洙曰漢伐大宛獲汗血馬作西極天馬之歌鋒稜瘦骨成張耒曰馬以神氣清勁為佳不在多肉故云云竹批雙耳峻趙曰後魏賈思勰載相馬經耳欲銳而小如削筒補注希曰九懷驥垂兩耳風入四蹄輕所向無空闊眞堪託死生洙曰如髙歡之的盧是可託死生鄭之小駟則異於此蘇曰齊繆叔見張儀論議之久回語子姪曰張儀忼慨真君子人雖死生堪託非有中道之意也趙曰如劉寂之為慕容垂所逼䇿馬跳五丈澗而脫也驍騰有如此洙曰顔延年赭白馬賦藝品驍騰萬里可横行蘇曰劉章曰使我得三尺快刃立止靜兩川兵四萬里亦可横行畫鷹未詳何年作補注鶴曰此詩雖未詳何年在何地賦然舊次在與李白同尋范十隠居則不得為在天寳十三年作權道失之素練風洙曰一作如霜起張孝祥曰言鷹之威猛如風霜也蒼鷹畫作殊􅑷身思狡兎鄭曰􅑷荀勇切洙曰􅑷身猶竦身也孫楚鷹賦擒狡兎於平原側目似愁胡洙曰隋魏彦深鷹賦立如植木望似愁胡琪曰鷹産於岱北出於胡地愁胡謂思胡地也絛鏇光堪擿鄭曰絛他刀切鏇徐釧切圓轆轤也趙曰所畫絆鷹之絛鏇也光而堪擿取也軒楹勢可呼庭堅曰曰可呼以獵也何當擊凡鳥毛血洒平蕪與李十二白同尋范十隠居開元二十四年後作補注鶴曰舊史云白天寳初已客遊㑹稽與呉筠隠於剡中𤣥宗詔筠赴京師筠薦之於朝召與筠俱待詔翰林久之以沉醉斥出乃浪跡江湖崔宗之謫官金陵與白詩酒唱和則天寳十三載未嘗歸兖梁編為非當是開元二十四年後公遊齊趙與髙李同至齊兖時作舊史又云白之父為任城尉因家焉任城屬兖州李侯有佳句往往似隂鏗洙曰陳書阮卓傳武威隂鏗字子堅五嵗能誦賦日千言及長博涉史傳尤善五言詩為當時所重有集三巻行於世余亦東䝉客趙曰東䝉山名公時在兖州故云洙曰語夫顓臾昔者先王以為東䝉主禹貢徐州䝉羽其藝憐君如弟兄醉眠秋共被洙曰姜肱兄弟同被而寢趙曰昔祖逖劉琨情好綢繆共被而寢攜手日同行更想幽期處還尋北郭生洙曰列子與北郭生連墻而不相通北郭生指言范十隠居也舊注所引乃南郭生非是補注鶴曰唐志䝉山在沂州新秦縣九域志云髙士傳老萊子隠䝉山之陽是也沂與兖州為隣公在兖故為東䝉客范非居兖州之北郭即居任城之北郭也入門髙興發修可曰殷仲文詩能使髙興盡侍立小童清落景聞寒杵屯雲對古城向來吟橘頌洙曰張華有橘詩郭璞有贊恵連有賦修可曰楚詞自有橘頌非橘詩贊賦也今備載之曰皇嘉樹橘徠服兮受命不遷生南國兮深固難従更壹志兮綠葉素榮紛可喜兮曽枝剡棘云云誰欲討蓴羮洙曰陸機詣侍中王濟濟指羊酪謂機曰卿呉中何以敵此答曰千里蓴羮未下鹽䜴時為名對趙曰張翰在齊王冏府因見秋風起乃思呉中菰米蓴羮鱸魚鱠曰人生貴適志何能羈宦數千里以要名爵乎遂命駕而歸舊注所引非師曰甫咀味李白之詩雖張翰蓴羮之美不足思也故云云不願論簪笏悠悠滄海情趙曰故公無復簪笏之願而欲寄情江海臨邑舎弟書至苦雨黄河泛溢隄防之患簿領所憂因寄此詩用寛其意開元二十九年作補注鶴曰唐志輿地廣記並云臨邑屬齊州在河南道按五行志開元二十九年七月伊洛及支川皆溢是秋河南河北二十四郡水齊其一也當是其年作故曰吾衰同泛梗利涉想蟠桃蟠桃在齊地二儀積風雨百谷漏波濤洙曰老子江海為百谷王聞道洪河拆遙連滄海髙職司憂悄悄洙曰謂當職司水之官郡國訴嗷嗷舎弟卑棲邑防川領簿曹洙曰隄防也尺書前日至洙曰韓信傳咫尺之書版築不時操洙曰以版夾土而築也書得傅説於版築之間難假黿鼉力趙曰紀年曰周穆王三十七年東至于九江以黿鼉為橋梁空瞻烏鵲毛洙曰淮南子云烏鵲填河成橋燕南吹畎畝濟上没蓬蒿洙曰泛濫至於燕南濟上皆漂没也螺蚌滿近郭蛟螭乗九臯洙曰泛溢故螺蚌在陸蛟螭在霄漢徐闗深水府碣石小秋毫洙曰徐闗碣石皆地名書碣石入於海張天覺曰徐闗盡成水府碣石山為水所没其細如秋毫補注鶴曰爾雅云蚌含漿釋曰說文云蜃屬郭云即蜃也老産珠者武帝紀至碣石文穎曰此石著海旁師古曰碣石特立之貌以特立者如秋毫之小則水溢可知又齊地紀云渤海東有碣石謂之渤海應是指此而言詳見上注徐闗亦指齊地而云故公送舍弟頻赴齊州亦有徐闗東海西之句白屋留孤樹青天洙曰一作雲失萬艘趙曰白屋已漂矣唯孤樹存焉下句言萬艘乗漲速去於青天長逺之間頃刻之中望之若失矣吾衰同泛梗利涉想蟠桃洙曰山海經曰東海有山名度索山有大桃屈盤三千里名曰蟠桃趙曰蟠桃正在齊地東海度索山故因水漲可以渉舟望之也倚賴洙曰一作却天涯釣猶能掣巨鼇洙曰龍伯國大人一釣六鼇趙曰列子言龍伯之國人一舉釣六鼇師曰甫意以此職司大手必能治河邑之所倚賴也故云云過宋員外之問舊莊天寳二三載作補注鶴曰按舊史宋之問虢州𢎞農人景龍中再轉考功員外郎之問之居雖在虢州而莊在首陽枉道祇従入當是開元二十九年至天寳二三年公在河南時作舊史宋之問傳中宗増置修文館學士擇朝中文學之士之問與杜審言首應其選當時榮之又之問有送審言詩有臥病人事絶嗟君萬里行之句審言死之問又有景龍二年祭文公與之有世契宜過其莊而問耆舊也宋公舊池館零落守陽阿洙曰守一作首阿山之阿師曰陽阿乃山之南時宋貟外與弟執金吾居此甫枉道過之金吾巳死補注鶴曰善本作零蕩守陽作首陽是首陽山在河南府虢與河南為鄰故宋有别墅在焉枉道祗從入吟詩許更過趙曰凡枉道而遊者猶任其入況能詩者而不許其過乎則公自負可知矣淹留問耆老寂寞向山河趙曰淹留駐迹之義欲問耆老員外平昔之事所以為之淹留貟外亡矣其莊空存對此山河徒寂寞耳更識將軍樹悲風日暮多洙曰馮異毎所止舍獨居樹下軍中呼為大樹將軍漢光武以此多之師曰將軍樹美金吾也補注鶴曰舊史之問弟之悌有勇力開元中自右羽林將軍出為益州長史劍南節度兼採訪使尋遷太原尹故云將軍初不曽為金吾也夜宴左氏莊天寳二三載作補注鶴曰公未得鄉貢之前遊呉越下第之後遊齊趙此詩云詩罷聞呉詠扁舟意不忘謂因呉音而思其地也則是在遊齊趙時作未詳左氏莊在何郡舊次在過宋之問舊莊後則左氏莊亦在河南詩是天寳二三年間作風林纎月落衣露淨琴張饒節曰月落露下言夜深也暗水流花逕春星帶草堂檢書燒燭短蘇曰韋𤣥每使子弟讀書或檢閲文字燒短燭燼則罷課夜常以此為程看劍引盃長洙曰看一作説看劍一云煎茗師曰東坡有云引盃看劍話偏長正使此句也詩罷聞呉詠蘇曰公孫滿寓秦中月夜聞人呉音棹歌浩然有歸心即日命駕歸矣扁舟意不忘趙曰惟其聞呉詠故有扁舟之興送蔡希魯都尉還隴右寄髙三十五書記洙曰時哥舒翰入奏勒蔡子先歸補注鶴曰哥舒翰天寳十四載春入朝道遇風疾留京師勒都尉蔡希魯先歸隴右故詩以送之當是其年作按舊史隋置驃騎鷹揚等府凡天下守戍兵不成軍曰牙府有上中下折衝都尉各一人左右果毅都尉各一人都尉掌領五校之屬以備宿衛以従師役摠其戎具資糧差㸃敎習之法令凡衛士三百人為一團以校尉領之蔡子勇成癖蘇曰張遼養勇銳成癖恃才業成癡彎弓西射胡鄭曰射食亦反洙曰曹子建白馬篇宿昔秉良弓楛矢何参差控弦破左的右發摧月支健洙曰一作男兒寧鬭死壯士恥為儒洙曰世説桓車騎使健兒鼓行刼鈔趙曰强健之兒也故對壯士蓋自是今日以黥面者為健兒故學者致疑耳曹子建詩名在壯士籍洙曰如項羽目樊噲曰壯士也補注希曰健兒乃軍士之名按史天寳十四載十一月於京師召募十萬衆號曰文武健兒壯士亦軍卒之稱如通鑑云思明多遣壯士竊官軍裝號是也官是先鋒得材緣挑戰須鄭曰挑徒了切洙曰先鋒謂先師衆而行也鋒取鋒銳之義挑戰挑之使戰如左氏之致師也身輕一鳥過余曰歐公詩話云初陳舍人從易偶得杜集舊本文多脫誤至送蔡都尉詩身輕一鳥其下脫一字陳公與數客各用一字補之或云疾或云落或云下莫能定後得一善本乃是過字陳公歎服以為雖一字諸君亦不能到洙曰言輕健如飛鳥也槍急萬人呼雲幕隨開府洙曰幕府以幕為府西京雜記成帝設雲幕於甘泉春城赴一作入上都趙曰此言哥舒之入奏也天寳十一載冬入朝今言春城赴上都豈由冬末而涉春乎補注鶴曰文選張景陽詩忽如鳥過目公用此字也一字亦有所本槍急謂用槍之急使萬人為驚呼也開元十三年四月勅四軍槍矟有緋綠紅碧之辨𤣥宗實錄翰為河西衙前將吐蕃大寇邊翰持半段槍當其鋒擊之此用其事寳應元年建卯月以京兆府為上郡而此詩天寳十四載作乃先言上郡何耶蓋古詩號國都多曰上都按舊史哥舒翰天寳六載充隴右節度副史其冬代王忠嗣為隴右節度度支營田副大使知節度事而兼河西却在十二載奏前封丘尉髙適為掌書記今詩題送蔡希魯還隴右寄髙三十五書記則是天寳十四載春翰入朝非指天寳十一載冬而言也馬頭金匼匝鄭曰匼口荅反匝作荅反洙曰古詩白馬黄金羈驄馬金絡頭補注希曰匝當書作帀駞背錦糢糊趙曰駞之背負物矣而以錦帕䝉之此之謂糢糊咫尺雪山路洙曰郭義恭廣志曰西域有白山通嵗有雪亦名雪山班超贊曰定逺慷慨専功西域坦步葱雪咫尺龍沙注八寸曰咫咫尺者言不以為逺也歸飛西洙曰一作青海隅趙曰謂希魯先勒還隴右也上公猶寵錫突將且前驅趙曰上公指哥舒翰猶有錫命未已固當少留則蔡子突將當往為前驅以先歸也補注鶴曰漢平帝元始元年始置太師太傅太保東漢以後常曰上公吳詔范慎為太尉曰宜登上公突將猶飛將驍將謂能馳衝亦突騎之義漢使黄河逺洙曰漢使張騫窮河源趙曰翰為河西節度使故云凉州白麥枯洙曰漢桓帝童謡曰小麥青青大麥枯誰當穫者婦與姑丈夫何在西擊胡因君問消息洙曰問髙消息好在阮元瑜洙曰王粲傳陳留阮瑀字元瑜少受學於蔡邕建安中都䕶曹共欲使管記室瑀不為屈師曰甫因問髙適消息適随哥舒翰為掌書記故比之阮元瑜在乃存問之辭春日憶李白天寳元年作補注鶴曰詩云渭北春天樹江東日暮雲何時一樽酒重與細論文則是時白在江東也按舊史云白天寳初已客遊㑹稽與呉筠隠於剡中乃其時也當是天寳元年春作白也詩無敵洙曰一作數飄然思不羣補注希曰鍾嶸評曹植超逸今古卓爾不羣又離騷鷙鳥之不羣三國志楊戱評曰楊戯商略意在不羣清新庾開府洙曰蕭楊州薦士表辭賦清新鄭曰庾信字子山為車騎將軍開府俊逸鮑叅軍洙曰鮑照字明逺為宋臨海王叅軍蘇曰鍾榮曰鮑叅軍詩如野鶻飜雲良馬走堤俊逸奔放渭北春天樹江東日暮雲洙曰江淹詩曰日暮碧雲合蘇曰王濟曰雲日暮不成霖雨空返故山此詩㣲諷讀者當識意李泰伯曰渭北甫所居江東白之所在也何時一樽酒重與細論文洙曰沈休文詩勿言一樽酒明日難重持趙曰論文而至於細始盡其妙矣非李杜莫造也亦孟浩然何時一杯酒重與李膺傾意補注希曰魏文帝典論有論文一篇李白詩自云欲向江東去定將誰舉杯此殆因白有是詩故云鶴曰孟浩然詩公用其語意而易三字意又髙矣贈陳二補闕天寳十三載作補注唐志武后垂拱元年置補闕拾遺左右各二員其後各増至六人掌供奉諷諫大事廷議小事上封事陳雖未詳其名然詩云皁鵰寒始急天馬老能行蓋老儒也天寳十三載長安作世儒多汩没夫子獨聲名獻納開東觀洙曰謝元暉詩獻納雲臺表後漢和帝幸東觀覽書林閲篇籍博選術藝之士以充其官補注希曰中庸聲名洋溢乎中國莊子以收聲名後漢圗書在東觀華嶠謝祕書監表曰馬融博通三入東觀是也君王問長卿洙曰司馬相如字長卿蜀人楊得意為都監侍上上讀子虚賦而喜之曰朕獨不得與此人同時哉得意曰臣邑人司馬相如自言為此賦上驚乃召問相如皁鵰寒始急師曰皁鵰御史以比補闕補闕諫官也天馬老能行洙曰所謂老而益壯修可曰大宛馬乃天馬之種也自到青㝠裏休看白髪生洙曰自言可致於青霄之上無以老自怠寄髙三十五書記天寳十三載作補注鶴曰髙謂髙適也唐志節度使有掌書記一人按舊史云適解褐為汴州封丘尉非其好也乃去位遊河右河西節度使哥舒翰異之表為左驍衛兵曹充翰府掌書記翰以十二載加河西節度使十三載拜太子太保明年入京而適為書記亦在十三載則詩當作於是年詩云聞君巳朱紱是時適未經賜緋何以有此句按史云𤣥宗嘉適陳潼闗敗亡之勢至成都方賜緋除諫議大夫則在至徳二載若是賜緋後寄之亦不應題曰書記蓋祿山之亂徵翰討賊拜適拾遺仍轉監察御史佐翰守潼闗矣當是十三載作詩時聞賜緋故及之而言者誤也歎息髙生老新詩日又多美名人不及佳句法如何洙曰按新唐書適五十始為詩即工以氣質自髙每吟一篇已好事者輒傳主將收才子崆峒足凱歌趙曰主將哥舒翰也翰為河西節度使以適為掌書記崆峒隴右山名足凱歌以言必勝也聞君巳朱紱蘇曰潘岳近聞朱紱猶慰老夫師曰朱紱言增爵秩也補注希曰紱古蔽膝也象冕服以韋為曹子建俯愧朱紱易朱紱方來又韋賢傳黼衣朱紱師古曰朱裳畫為亞文也亞古弗字故因謂之紱且得慰蹉􅋸送裴二虬作尉永嘉天寳十三載作補注鶴曰裴虬大厯四年為道州刺史所謂裴端公者公有暮秋枉裴道州手札詩憶子初尉永嘉去考世系表虬終於諫議大夫乃洗馬裴之後此詩云隠吏逢梅福遊山憶謝公扁舟吾已就把釣待秋風則公欲學靈運遊山以償前者不能窮扶桑之恨梁權道編在天寳十三載或是蓋枉手札詩云軍符侯印取豈遲紫燕騄耳行甚速謂七年之間自尉而至於守也是時公獻三賦俾集賢委官試文章但送𨽻有司叅列選序以為儒術難起遂欲歸故山尋勝槩觀留贈集賢崔于二學士詩可知其詩與此合孤嶼亭何處天涯水氣中故人官就此絶境與誰同趙曰故人指裴二也絶境則指孤嶼亭矣隠吏逢梅福洙曰漢梅福九江人補南昌尉王莽専政福棄妻子去九江至今傳以為仙其後見福於㑹稽更名為呉市門卒所謂隠於吏也遊山憶謝公洙曰謝安石寓居㑹稽常往臨安山中坐石室臨濬谷悠然難曰此亦伯夷何逺安雖放情邱壑然每游賞必以妓女從也趙曰謂謝靈運也為永嘉守好遊山水時號謝公舊注妄引謝安非是扁舟吾巳就洙曰一作具把釣待秋風蘇曰杜預書曰吾本麋鹿心性强拘名利欲脱不能漢水澄明鯿魚正肥待得秋風涼冷吾當把釣盡此林泉之志城西陂泛舟天寳十三載作補注鶴曰城西陂即渼陂公與源少府宴渼陂詩云為愛西陂好金錢罄一飱即此陂也梁權道編在天寳十三載長安詩内青蛾皓齒在樓船横笛短簫悲逺天春風自信牙檣動洙曰庾信賦鐵軸牙檣宋曰船檣首鋭如牙遲日徐看錦纜牽洙曰呉甘寧以錦纜牽船魚吹細浪揺歌扇燕蹴飛花落舞筵洙曰以扇自障而歌故謂之歌扇程曰歌扇所以掩口遮羞不有小舟能盪槳百壺那送酒如泉夢符曰按方言楫謂之橈或謂之櫂所以櫂謂之槳又前漢地理志酒泉郡師古曰舊俗傳云城内有金泉其味如酒贈田九判官天寳十四載作補注鶴曰詩云崆峒使節上青霄河隴降王款聖朝謂哥舒翰天寶十四載春入朝師云哥舒翰為安西都䕶辟田梁丘為判官是也河隴謂翰為隴右節度又兼河西節度也此詩當是十四載春作崆峒使節上青霄河隴降王欵聖朝趙曰此詩乃哥舒翰獻捷之事何以明之崆峒隴右之山名也翰於天寳八載為隴右節度使與吐蕃戰于石堡城敗之拔其城更號神武軍上青霄言領吐蕃降王以朝也宛馬揔肥洙曰一作飛春苜蓿洙曰大宛國漢時通人嗜蒲桃酒馬嗜苜蓿後二師至宛取善馬遂採蒲桃苜蓿種而歸師與趙曰苜蓿所以飼馬補注鶴曰按唐百官志駕部郎中員外郎掌按馬凡驛馬給地四頃蒔以苜蓿閩中名士傳薛令之詩云初日上團團照見先生盤盤中何所有苜蓿長闌干謂苜蓿之穗如闌干星之長春生而秋成今云揔肥春苜蓿謂去年所收者非食其苗也將軍只數漢洙曰一云霍嫖姚洙曰霍去病為嫖姚校尉注嫖姚皆勁疾之貌今讀音飄颻者非趙曰指言哥舒也漢霍去病為嫖姚校尉姚在漢書音作去聲而公作平聲沈存中筆談嘗論之矣以為無害於義陳留阮瑀誰爭長洙曰王粲傳始文帝為五官將及平原侯植與北海徐幹廣陵陳琳陳留阮瑀汝南應璩東平劉楨並相友善曹洪欲使瑀掌書記瑀終不為屈太祖辟為軍謀祭酒京兆田郎早見招洙曰田鳳為郎端正入奏事靈帝目送之曰堂堂乎京兆田郎麾下賴君才並入獨能無意向漁樵蘇曰阮瑀語叔曰今涉仕路者如躍駿馬於薄冰何苦戀戀獨無意向漁樵乎趙曰此言主將麾下賴田君之才與諸俊並入可獨能無意而甘心於漁樵乎贈獻納起居田舎人澄天寳十三載作洙曰一云贈田起居獻納使補注鶴曰詩云揚雄更有河東賦唯待吹嘘送上天當是天寳十三載作詳見注獻納司存雨露邊洙曰一作偏武后初置匭以受四方之言謂之理匭使𤣥宗改為獻納使趙曰唐制獻納使掌受封事以獻天子補注鶴曰舊史云天寳九載三月庚戌改匭使為獻納又㑹要云三月十八日改匭為獻納地分清切任才賢洙曰劉公幹詩拘限清切禁趙曰以田君為起居舍人從六品上𨽻中書省斯為禁近矣舎人退食收封事洙曰唐以舍人給事中知匭事補注鶴曰按舊史志起居舍人隋置貞觀二年省置起居郎二員明慶中又置始與起居郎分在左右掌起居注錄天子言動以修記事之史未嘗知匭事其知匭使自垂拱已來常以諫議大走及補闕拾遺一人充使受納訴狀毎日暮進内而晨出之也今云收封事者殆是以封事裁決其是非爾蓋中書省亦有起居舍人二員司左省起居舍人掌修記言之史錄天子制誥徳音如記事之制以紀時政之損益是時中書舍人掌百司奏議文武考課皆預裁焉起居舍人與之同省故亦得而收封事也宫女開函近洙曰一作捧御筵洙曰函為匭函也宫女開函以所投封事奏御曉漏追趨青瑣闥洙曰青瑣門也范彦龍詩攝官青瑣闥遥望鳳凰池晴忩㸃檢白雲篇揚雄更有河東賦唯待吹嘘送上天洙曰揚雄成帝時客有薦雄文有似相如還上河東賦此子美自比雄也故有唯待吹嘘之句補注鶴曰公既獻三賦又作封西岳賦欲奏上故云揚雄更有河東賦亦賦料揚雄敵意也按進賦表云惟岳授陛下元弼克生司空又云春將披圖視典冬乃展采錯事司空指楊國忠舊史天寳十三載二月戊寅右丞相兼吏部尚書楊國忠守司空甲申授冊則進賦必在是年所謂視典展采欲在十四載蔡興宗亦謂進賦在十三載冬然則是詩乃其年未進賦時投贈也或謂九載已封華岳不應公十三載又進賦按史九載正月庚戌羣臣請封西岳從之三月辛亥西岳廟災時久旱制停封西岳㑹要云天寳九載正月九日勑以今載十一月有事華山三月二十七日西岳廟災京師旱遂停封岳之禮宜公十三載又奏賦以請未幾兵戈四起卒不果行此禮也魏志鄭渾曰孔子緒能清談髙論嘘枯吹生送韋書記赴安西天寳十一載作補注鶴曰公以天寳十載獻三賦召試文章進封西嶽表云幸得奏賦待制於集賢今詩云公車留二年當是十一載作文云白頭無籍在公自謂未受官也安西都䕶府治所在龜兹國城内節度使撫寜西域是載封常清為安西副大都䕶攝御史中丞持節充安西四鎭節度經略度支營田副大使知節度事夫子歘通貴趙曰歘音許勿切有所吹起貌歘通貴忽然而貴也雲泥相望懸余曰後漢逸民傳呉倉與矯仲彦書云乗雲行泥棲宿不同白頭無籍在洙曰無籍在朝列也籍如通籍之籍朱紱有洙曰一作即哀憐趙曰韋君為書記則賜緋矣有哀憐則言朱紱之人有哀憐於我書記赴三捷洙曰一作接采薇詩豈敢定居一月三捷注捷勝也三勝謂侵伐戰補注希曰魏太祖以陳琳阮瑀為司空軍謀祭酒掌書記室宋江夏王恭取丘巨源為掌書記唐制元帥節度使有掌書記一人故韓昌黎徐濠泗三州節度掌書記㕔石記云元戎揔齊三軍之事云云凡文辭之事皆出書記公車留二年洙曰東方朔待詔公車師古曰公車今屬衛尉上書者所詣欲浮江海去此别意茫洙曰一作蒼然趙曰公自謂也公自負其才既見韋之通貴而身留公車不能無觖望故欲去而之江海矣陪鄭廣文遊何將軍山林十首天寳十二載作彦輔曰東方朔傳竇太后曰回輿枉路臨幸山林應劭曰公主園中有山謙不敢稱第故言山林補注鶴曰何將軍未詳為何人如彦輔注則是公主園何將軍乃尚主雖唐駙馬有為將軍者如周道務為古驍衛將軍程懷亮為寧逺將軍之類而諸公主列傳無下嫁何氏者又詩無言公主之意天寳九載秋七月乙亥置廣文館於國子監而鄭䖍首膺博士之命則詩當在天寳十二載作以此詩第四首及後詩第五首考之是官未定時遊此罷河西尉授率府胄曹在十四載不識南塘路今知第五橋趙曰於志在萬年縣郭外之西南師曰甫詩謂第五橋東流恨水則第五橋乃蜀中橋名補注希曰師云第五橋乃蜀中橋名然長安亦有之城中東五十四坊萬年縣領之則東南郭亦其所領後詩云東橋即此橋也公題鄭十八著作文詩云第五橋東流恨水皇陂岸側結愁亭豈是指蜀中而言師殆不考鄭貶台州司戸在至徳二載而公詩作於乾元元年是時未入蜀也名園依綠水野竹上青霄洙曰北山移文干青霄而直上谷口舊相得洙曰揚雄曰谷口鄭子真不詘其志耕乎巖石之下名震于京師趙曰谷口以鄭子眞指廣文濠梁同見招洙曰莊子惠子同遊濠梁之上平生為幽興未惜馬蹄遙蘇曰蘇博招杜預曰山家酒香雞肥君子不惜道長馬蹄遥逺可訪蓬蓽慰此拳拳耳百頃風潭上千重夏木清趙曰舊本千重無義善本作章出前漢食貨志大木曰章補注希曰潭當是廣運潭亦在萬年縣卑枝低結子接葉暗巢鸎鮮鯽銀絲鱠香芹碧澗羮洙曰謝靈運詩銅陵映碧澗趙曰碧澗皆狀物之語而薛公補遺以為地名名偶同耳非是翻疑柂樓底鄭曰柂徒可切晩飯越中行師曰越地盛有芹魚行船中多煑芹鱠魚故甫有翻疑柂樓底晚飯越中行萬里戎王子何年别月支趙曰戎王子説者以為花名義固然矣又言别月支是必月支之物師曰月支西域國名何將軍嘗征西域擒其王子歸朝傳其地花草數種補注鶴曰爾雅戎菽樊光逺舍人李巡郭氏皆以為是胡豆釋者云郭氏等以戎胡俱是夷名故以戎菽為胡豆也又戎葵郭云蜀葵釋者曰戎葵蜀葵蓋其所自也因以名之鶴謂尚書牧誓以庸蜀𦍑髳微盧彭濮八國皆蠻夷戎狄故郭亦以蜀葵為戎葵也然則戎王子其此意歟且爾雅釋唐䝉曰蒙王女郭云即唐也是又名王女觀此安知王子不知王女之為名也爾雅亦有王蒸王帚王芻之名月令又有王𤓰之名今於王子之上加以戎字以言其自戎中來正猶戎菽戎葵也異花開絶域滋蔓匝清池漢使徒空到趙曰張騫於西域止移胡桃石榴苜蓿而不移此所謂戎王子是為徒空到矣神農竟不知趙曰言此絶域異花不載於神農本草露翻兼雨打開拆漸離披趙曰宋玉云白露下衆草兮奄梧楸而離披旁舍連高竹疎籬帶晩花碾渦深没馬洙曰碾渦碾磑間水渦旋也鄭曰渦烏禾切水回也藤蔓曲藏蛇洙曰藏一作垂詞賦工無益洙曰無一作何趙曰公時為布衣故云山林跡未賖趙曰言我之蹤跡不久在山林也盡捻書籍賣趙曰王叔艾嗜酒家貧常挟祖父所蓄書籍賣酬酒價鄭曰捻正本作拈如兼切唐韻指取物也師曰何將軍雖武人家藏書籍多故甫欲依之以就其書補注希曰公以奏賦止令集賢委學官試文章再降恩澤又止送𨽻有司参列選序故云詞賦雖工而無益旅次之久安得不捻書籍賣以為山林之資來問爾東家夢符日文選陳孔璋為曹洪與魏文帝書曰怪乃輕其東家謂為倩人邴原列傳曰原遊學詣孫崧崧曰君鄉里鄭君學者之模範也君乃舍之所謂以鄭君為東家丘也原曰君以鄭君為東家丘以僕為西家愚夫耶剰水滄江破殘山碣石開趙曰禹貢地名碣石以其碣起之石矣唐書有殘膏賸馥之句賸俗作剰字師曰殘山碣石山水之雄言何將軍山水之樂分得滄江碣石之真趣綠垂風折笋紅綻雨肥梅銀甲彈箏用洙曰古詩十五學彈箏銀甲不曽卸以銀作指甲取其有聲金魚換酒來洙曰魚一作盤阮孚為常侍以金貂換酒興移無洒掃隨意坐莓苔蘇曰鄭子眞得酒以瓦盞瓷瓶随意所在藉芳草快飲趙曰此尤見野逸之興也風磴吹隂雪趙曰磴石梯之道也雲門吼瀑泉鄭曰瀑薄報切師曰雲門謂雲擁翼山門酒醒思臥簟衣冷欲裝綿洙曰欲一作得野老來看客河魚不取錢師曰野老來看客言少有人到也河魚不取錢言魚賤也只疑淳朴處自有一山川趙曰淳朴者太古之世也以其山野乃淳朴處也棘樹寒雲色茵蔯春藕香蘇曰東方朔好食蘭以醋鹽拌之同茵蔯蘭牙食之皆笑之朔自若脆添生菜美趙曰生菜非一美而得茵蔯春藕又添其美也隂益食單凉趙曰言鋪食單於棘樹之下隂益其凉也謂之益則山中已涼矣野鶴清晨出洙曰一作至山精白日藏洙曰山精鬼魅趙曰蜀帝得山精以為妻庾信云山精鏤寳刀石林蟠水府百里獨蒼蒼憶過楊栁渚鄭曰過古禾切走馬定昆池洙曰唐安樂公主作定昆池言勝昆明趙曰皆何將軍山林所經過之處補注希曰安樂公主請昆明池為私沼不得乃自鑿定昆池延袤數里言可抗衡之是無君父矣卒死於兵追貶為悖逆庶人其有由矣醉把青荷葉蘇曰李膺醉手常把青荷葉為扇障日師曰青荷葉酒杯也狂遺白接䍦洙曰接䍦衫也世説山簡為襄陽守嘗醉習家高陽池襄陽小兒歌曰山公時一醉遥造高陽池日暮倒載歸酩酊無所知復乗驄馬去到着白接䍦舉手問葛彊何如并州兒師曰白接䍦巾也刺船思郢客洙曰郢客善操舟解水乞呉兒洙曰呉兒善泅趙曰南人謂北人為傖父北人謂南人為呉兒皆常語也坐對秦山晚江湖興頗隨牀上書連屋階前樹拂雲將軍不好武稚子摠能文醒酒㣲風入聴詩靜夜分絺衣挂蘿薜鄭曰薜比激切或作壁涼月白紛紛趙曰白紛紛言其在薜蘿之間如此蘿薜者藤蘿與薜荔也幽意忽不愜蘇曰嵇彦不愜幽意忽然出山趙曰暗使世説云左太沖作三都賦初意思甚不愜歸期無奈何出門流水住師曰水住言水歸駐也回首白雲多洙曰一作雜花多自笑燈前舞誰憐醉後歌祗應與朋好風雨亦來過鄭曰過古禾切重過何氏五首天寳十三載作補注鶴曰前詩云千章夏木清又云綠垂風折笋紅綻雨肥梅皆是言夏初景物今詩云花妥鶯捎蝶溪喧獺趁魚又云春風啜茗時則是春作前既以為天寳十二載作則此當是十三載春也故第五首云相留可判年判年半年也又云何日霑微祿乃是未授官時作故十三載進封西岳賦表亦云一匹夫也若十四載則已授河西尉又改率府胄曹矣所謂昔罷河西尉初興薊北師是也問訊東橋竹將軍有報書蘇曰郝隆王將軍近日有邊報趙曰言欲重過主人所以託為問訊其竹而報許之也倒衣還命駕洙曰倒衣如詩有云顛倒衣裳髙枕乃吾廬洙曰陶潛詩吾亦愛吾廬花妥鶯捎蝶蘇曰闗中人謂落為妥溪喧獺趂魚趙曰句法則花枝安妥之際有鶯捎掠於蝶溪聲喧沸之中獺趂魚也師曰花妥言花閒靜也捎欲捎取之花無情而鶯有情溪無意而獺有意靜中有動意古人立語多如此補注希曰曲禮正義云妥下也又引庾氏云妥頽下之貌蘇氏謂闗中人謂落為妥是重來休沐地真作野人居師曰休沐言此可以休歇為湯沐之所山雨樽仍在沙沉榻未移趙曰樽與榻皆前日之所設樽在而榻未移又見將軍之好客犬迎曽宿客鵶䕶落巢兒雲薄翠微寺天青皇子陂鄭曰貞觀十二年於洛南營太和宫後改為翠微宫元和中改為翠微寺趙曰舊本作黄子義非按志所載皇子陂在萬年縣以秦葬皇子起冢陂北原上得名别無黄子之稱公又有鄭䖍詩云皇陂岸北結愁亭是也師曰山未及上曰翠微黄叔度汪汪如千頃陂翠微黄子非寺與陂名特言其義也補注鶴曰唐志既曰元和中改翠微宫為翠微寺則不應未改寺而先言之師説或是第以叔度汪汪之喻為黄子陂恐未必然向來幽興極步屧過東籬落日平臺上洙曰梁孝王築東苑廣睢陽城大治宫室為複道自宫連屬於平臺三十餘里如淳曰平臺在大梁東北離宫所在也師古曰今其城東二十里所有故臺基其處寛博世俗云平臺上趙曰平臺應是平穏之臺别無他義舊注非是春風啜茗時石欄斜㸃筆趙曰置硯於石欄之上桐葉坐題詩蘇曰黄藏好詩酒幽居得句家無紙即摘桐葉題之句法膾炙人口好事者常以毫楮遺之趙曰題詩於桐葉之上翡翠鳴衣桁鄭曰戸庚切杜作側聲用師曰下浪切蜻蜓立釣絲自今幽興熟洙曰一云自逢今日興來往亦無期蘇曰謝敦往來既相熟相見亦無定期閒暇即造門頗怪朝參懶洙曰樂於安閒故懶於朝叅朝叅謂入朝叅謁補注希曰自唐以來有朝參之名應耽野趣長雨抛金鏁甲蘇曰李廣云金鎖甲未可輕抛朝廷尚憂西北趙曰甲言金鎖以金線連鏁之也苻堅造金銀細鎧金為綫以縲之乃其類也苔臥綠沉槍夢符曰綠沉精鐵也北史隋文帝賜張奫綠沉槍甲獸文具裝武庫賦曰綠沉之槍蘇曰霍去病痛苔生槍架塵滿馬鞍無復征戰之用趙曰以綠色之物沉沬其柄也武庫賦有云綠沉之槍舊薛云以綠沉為精鐵非也田曰廣志言綠沉古弓名劉劭趙郡賦言弓弩亦有綠沉黄間之號師曰予嘗博考綠沉之義或以為漆或以為用綠設飾羲之筆經云有人以綠沉漆竹鏤管見遺藏之多年實有愛玩此以綠沉為漆廣志曰綠沉古弓名古樂府結客少年場行云綠沉明月絃此言綠沉皆謂弓也弩名黄間以黄飾之也弓謂之綠沉其亦以綠為飾乎綠沉槍疑以綠飾之三説不同故並載之補注鶴曰唐詩選楊巨源上劉侍中詩云吟詩白羽扇校獵綠沉槍以綠沉對白羽亦猶此以金鎖甲對按唐㑹要云開元十三年四月勑四軍槍矟左飛騎用綠紛右飛騎用緋紛疑紛字傳冩之誤為沉何將軍其督左飛騎歟縦是以綠飾槍矟亦無害於義甲名金鏁槍名綠沉各以其名言不妨為精對也手自移蒲栁家纔足稻梁看君用幽意白日到羲皇洙曰陶潛髙臥北忩自以為羲皇上人趙曰言白日則有雍容閑暇不盡之意到此應嘗宿相留可判年師曰判年半年也蹉跎暮容色洙曰容色衰暮也蹉跎差跌也悵望好林泉何日霑㣲祿歸山買薄田斯遊恐不遂把酒意茫然趙曰言未霑㣲祿此為布衣時也公方三十九嵗冬方獻三賦次年方召試得官故此言斯遊恐不遂其意也冬日有懷李白開元二十九年冬補注鶴曰古人和詩第和其意而不和其韻或有用其一韻者疑此詩是和李白贈公詩按段成式酉陽雜俎云李集有堯祠贈杜補闕者老杜也詩云我覺秋風逸誰言秋氣悲山將落日去水與晴相宜煙歸碧海少鴈度青天遲相失各萬里茫然空爾歸蓋用第三韻遲字李詩秋作而此冬作也白傳云天寳初客遊㑹稽殆是先與公别今詩云未因乗興去當在開元二十九年冬作按九域志青州汝州俱有堯祠其是年白去江東在堯祠賦詩寄公歟寂寞書齋裏終朝獨爾思更尋嘉樹傳不忘角弓詩洙曰昭二年傳晉侯使韓宣子來聘公享之韓子賦角弓既享宴于季氏有嘉樹韓宣子譽之武子曰宿敢不封殖此樹以無忘角弓遂賦甘棠宣子曰起不堪也無以及召公裋褐風霜入鄭曰裋臣庾切洙曰貢禹裋褐不完師古曰裋者謂僮竪所着布長襦也褐毛布也還丹日月遲洙曰道經言還丹能使人長生不死師曰還丹九轉丹也九徧循環然後成就服之可使延年故云日月遲未因乗興去洙曰王子猷乗興訪戴安道空有鹿門期趙曰公自言無因乗興如王子猷訪戴而去徒與白有效龎德公隠鹿門山之期約也杜位宅守嵗天寳十載作鮑曰天寳十載辛夘時年四十嵗在京師杜位宅守嵗是以有四十明朝過之句補注鶴曰詩云四十明朝過則是天寳十載除夜公九載預獻明年大禮三賦表云行四十嵗則十載為四十嵗無疑蔡興宗魯訔與鮑注趙注俱同獨梁權道編在天寳十三載為非世系表杜位在襄陽居為考功郎中朔州刺史後貶新州守嵗阿戎家洙曰王戎字濬仲少阮籍二十嵗而籍與之交籍與戎父渾為友戎年十五隨父渾在郎舍籍每適渾俄頃輒去過視戎良久然後出謂渾曰共卿語不如與阿戎談補注鶴曰杜位乃公之従弟有奉送栢二州别駕因示従弟行軍司馬位詩不應用父子事王註蓋不知善本作阿咸東坡與子由詩云頭上銀旛笑阿咸又和章饒二君詩欲喚阿咸來守嵗盖用公此詩也椒盤已頌花洙曰周庾信正旦詩椒花逐頌來蘇曰周處風俗記正旦楚人拜壽上五辛盤松栢頌椒花酒盍簮喧櫪馬洙曰易豫卦勿疑朋盍簮古詩老驥伏櫪列炬散林鵶四十明朝過趙曰公三十九嵗冬預獻明年三大禮賦表云甫行年四十載矣當强仕之年官猶未定宜其感歎之切故云飛騰暮景斜誰能更拘束蘇曰徐昉真是傲逸之士誰能拘束於俗禮也乃長揖而去爛醉是生涯與鄠縣源大少府宴渼陂得寒字載天寳十四作補注鶴曰鄠縣屬京兆夏之有扈國也陂在其境梁權道編在天寳十四載詩云𤓰嚼水精寒乃是夏月之作意是時方授河西尉應為西陂好金錢罄一餐蘇曰隋煬帝宫娃遊揚州見菱芡曰罄錢一餐其奢富如此飯抄雲子白洙曰雲子雨也荀子雲賦曰託地而遊宇友風而子雨時可曰漢武内傳王母謂帝曰太上之藥乃有𤣥光梨角風實雲子趙曰雲子指言菰米飯也西陂中則有菰矣宋玉云主人女吹香菰之飯惟菰米之香滑潔白足以當雲子之譬也師曰漢武帝傳王母謂帝曰太上之藥云云内翰以雲子為雨誤矣補注希曰蜀中有雲子石内翰以為雨非矣𤓰嚼水精寒無計迴船下空愁避酒難趙曰言主人苦相勸酒無計避之耳主人情爛漫持答翠琅玕師曰翠琅玕以喻投我之㤙重故以此詩荅之崔駙馬山亭宴集天寳十三載作補注鶴曰𤣥宗二十九女唯晉國公主下嫁崔惠童咸宜公主下嫁崔嵩而㑹要云髙都公主下降裴惠童雖晉國始封高都貞元元年徙封晉國而崔與裴為異此詩未辨與誰然非亂離後作梁權道編在天寳十四載今觀詩云清秋多宴㑹終日困香醪必非是年作蓋是年祿山反狀巳明七月表獻馬三千疋每疋執控夫二人遣蕃將二十二人部送上寤又輔璆琳受祿山賂事亦泄上撲殺之其時上下皆憂公豈容終日困於酒當在十三載秋作蕭史幽棲地林間踏鳯毛師曰蕭史娶秦女弄玉故言比崔駙馬踏鳯毛謂蕭史與弄玉同跨彩鸞而去也洑流何處入鄭曰洑房六切洙曰洄洑之水亂石閉門髙趙曰皆言其幽棲客醉揮金椀趙曰戴暠詩云揮金留客坐詩成得繡袍洙曰李白外傳云白對明皇撰樂府新詞得宫錦袍趙曰唐武后使東方虯宋之問賦詩詩先成者得錦袍清秋多宴㑹彦輔曰一云賞樂終日困香醪九日楊奉先㑹白水崔明府天寳十三載作補注鶴曰安祿山以天寳十四載十一月反公遣家先往奉先或謂公送家至縣故有此作然是時有自京赴奉先詠懷詩云嵗暮百草零疾風髙岡裂天衢隂崢嶸客子中夜發與此詩語與時俱不合按橋陵詩云呈縣内諸官而有荒嵗兒女瘦廨宇容秋螢時與此合荒嵗謂十三載饑也詩又云王劉美竹潤王與楊音同當有一誤時葢十三載作也崔與楊皆邑宰故云鳬舄共參差後有白水明府舅宅喜雨詩即崔也今日潘懷縣洙曰潘岳自河陽轉懷縣同時陸浚儀洙曰陸雲出補浚儀令縣居都㑹之委要為難理雲到官肅然坐開桑落酒洙曰世説桑落河多美酒蘇曰桑落河出馬乳酒羌人兼蒲萄壓之晉宣帝時來獻九日賜百僚飲焉來把菊花枝洙曰晉陶潛九月九日無酒宅邊摘菊盈把望見白衣人至乃王𢎞送酒便飲醉而歸趙曰有劉堕者善造酒熟於桑落之辰故酒得名焉庾信從蒲州史君乞酒詩曰蒲城桑落酒灞岸菊花秋舊注非天宇清霜淨洙曰言氣宇清徹也公堂宿霧披洙曰衛瓘見樂廣曰若披雲霧而覩青天宿霧披言毎登公堂如披開宿霧也晩酣留客舞鳬舄共差池洙曰王喬為鄴令旦望必入朝每至即雙鳬飛來帝令舉網獲之乃雙舄也差池言舞也昱曰詩差池其羽贈翰林張四學士天寳九載作鮑曰張垍也張説之子尚寧親公主明皇眷之即禁中置内宅公詩故云天上張公子宫中漢客星也補注鶴曰按舊史張説在中書均兄弟已掌絲綸之任説開元十九年卒垍傳云垍以主婿許禁中置内宅侍為文章嘗賜珍玩以示均均戲謂此婦翁賜女婿非天子賜學士天寳十三載貶廬溪郡司馬旋召還遷太常卿此題云贈翰林張學士則在未貶司馬前梁權道編在十四載非按詩云此生任春草垂老獨漂萍意是天寳九載自河南歸時作是時未獻賦故詩不及之翰林逼華蓋洙曰蔡邕傳擁華蓋而奉皇極逼言宻邇帝座蒼舒曰𤣥宗初置翰林待詔以張説陸堅張九齡等為之掌四方表疏批答應和文章既而又以中書務劇文書多壅滯乃選文學之士號翰林供奉與集賢學士分掌制誥書勑開元二十六年又改翰林供奉為學士别置學士院専掌内命凡拜免將相號令征伐皆用白麻其後選用益重而禮遇益親至號為内相天子私人凡充其職者無定員自諸曹尚書下至校書郎皆得與選入院一嵗則遷知制誥班矣各以其官内宴則居宰相之下一品之上補注鶴曰韋執誼翰林故事云翰林院在麟德殿西重廊之後學士院在翰林院之南别戸向東以其逼近宸居故曰逼華蓋㑹要云開元二十六年置學士院在翰林院之南别戸東向是年始改翰林供奉稱學士俾專内命於是太常少卿張垍與起居舍人劉光謙等首居之鯨力破滄溟趙曰滄溟乃游泳寛縦之地鯨力破之則如宗慤云願乗長風破萬里浪之破矣天上張公子洙曰公子公侯之子孫美張翰林也故稱天上言非人間人宫中漢客星洙曰漢光武引嚴光入論太史奏客星犯御座甚急賦詩拾翠殿蘇曰曹子建侍宴拾翠殿上命賦詩落筆即成一座驚服佐酒望雲亭趙曰拾翠殿在東内大福殿之東南望雲亭在西内景福臺之西以其應和文章且禮遇内亭紫誥仍兼綰黄麻似六經洙曰翰林學士掌制誥紫誥謂以紫泥封誥黄麻謂寫誥詞於黄麻紙上似六經言訓辭深厚如六經昱曰隴右記武都紫水有泥每貢封璽書故詔誥有紫泥之美趙曰凡拜免將相皆用白麻而馮鑑續事始貞觀十一年太宗詔用黄麻紙寫詔勅文補注鶴曰制誥本集賢學士領之今翰林學士得分掌故云兼綰韋執誼翰林故事中書用黄白二麻為綸命重輕之辨近者所出獨得用黄麻内分金帶赤恩與荔枝青洙曰翰林拜命日賜金荔枝帶趙曰楊文公談苑載自樞宰節度使賜二十五兩金帶無復隨高鳯洙曰髙鳯後漢逸民也空餘泣聚螢洙曰車𦙍以絹囊盛螢火照讀書趙曰此皆公自謂也舊注謂高鳳逸民也言翰林之貴不復與鳳為偶殊無意義豈可以人名對聚螢乎田曰謂鳳之飛鳴必在於髙詩云鳯凰鳴矣于彼髙岡言我不能隨張翰林之髙飛而止餘泣於聚螢爾此生任春草垂老獨漂萍蘇曰呉淑云此生棄擲如春江野草任車馬踐踏儻憶山陽㑹悲歌在一聽洙曰山陽嵇康所居㑹竹林之㑹向秀經康山陽舊居作聞笛賦送張二十參軍赴蜀州因呈楊五侍御天寳十三載作補注鶴曰楊侍御使蜀而張參軍往依之故作此詩張與揚未詳其為何人唐志三都大都督府諸州俱有參軍事掌出使贊導武徳初改行書佐尋又改曰參軍事以舊次考之當在十三載好去張公子通家别恨添洙曰兩家相通往來言至契熟也此别恨所以添補注希曰漢成帝嘗微行出過河陽主作樂上見飛燕而悦之先是童謠曰燕燕尾涏涏張公子時相見蓋帝每微行常與放俱而稱富平侯家故曰張公子前篇贈張垍言天上張公子今又云吕東萊謂凡詩人於姓張者得曰張公子如杜牧贈張祐亦曰誰人得似張公子兩行秦樹直補注鶴曰樹而謂之兩行者夹路所植之樹也按㑹要開元二十八年正月十三日令兩京道路並種果樹大厯八年七月勑諸道官路不得令有耕種所伐樹木其有闕處勾當補塡則在唐時道路兩旁皆植樹木今自長安入蜀道出於秦故云萬㸃蜀山尖御史新騘馬洙曰為呈楊侍御桓典拜侍御史常乗騘馬京師畏憚為語曰行行且止避騘馬御史㕘軍舊紫髯洙曰為張赴參軍郗超髯府中語曰髯參軍皇華吾善處於汝定無嫌趙曰正以言楊侍御為皇華之使乃吾所厚善之人則於張二十亦必無嫌所以薦之也陪諸貴公子丈八溝攜妓納涼晩際遇雨二首天寳十三載作補注鶴曰謂之陪諸貴公子則是在長安丈八寶溝意是天寳元年韋堅所通漕渠當是天十三載舊史大厯元年九月京兆尹奏開漕渠入苑闊八尺深一丈渠成上御安福門以觀之豈素有是溝至是又開歟落日放船好輕風生浪遲竹深留客處荷淨納涼時趙曰簡文帝晩景納涼詩荷淨月應來公子調冰水佳人雪藕絲洙曰謝𤣥暉詩秋藕折輕絲蒼舒曰右按家語魯哀公曰黍以雪桃也注云雪拭也片雲頭上黒應是雨催詩趙曰葢戲言也東坡嘗使云颯颯催詩白雨來雨來霑席上風急打船頭洙曰急一作惡越女紅裙濕燕姬翠黛愁洙曰越多美女西施越女也趙曰枚乗七發越女侍側鮑明逺舞鶴賦燕姬色沮纜侵堤栁繫趙曰蓋急雨當避進舟於岸傍故侵堤栁而繫纜也幔巻浪花浮歸路翻蕭颯陂塘五月秋趙曰必稱月也以當五月炎天而遂成秋葢公句法也白水明府舅宅喜雨得過字載天寶十三作補注鶴曰詩云精禱既不昧歡娱將謂何湯年旱頗甚今日醉弦歌則作詩前閔雨而新舊史俱不書旱豈旱不甚故不書以九日楊奉先㑹白水崔明府詩論之當在天寳十三載作白水見上注吾舅政如此洙曰喜雨之應禱故美其政古人誰復過碧山晴又濕饒曰碧山晴又濕言雨不多而於白水縣最為優渥也白水雨偏多精禱既不昧歡娯將謂何湯年旱頗甚今日醉弦歌洙曰湯有七年之旱此詩先言精禱即禱而得雨故有醉弦歌之句陪李金吾花下飲天寳十四載作補注鶴曰詩云醉歸應犯夜可怕李金吾當在長安作金吾李嗣業也詳見注天寳十四載春作勝地初相引徐行得自娯見輕吹鳥毳充芮切隨意數花鬚鄭曰數所矩切計也蘇曰王逸少居山隂日凭欄黙數花鬚或摘撚咀嗅怡然自若人莫識其意細草稱偏坐香醪懶再沽蘇曰張超曰香醪遽盡吾懶再沽煩爾輩與吾去取醉歸應犯夜可怕李金吾時可曰韋述西都新記曰京城街衢有金吾曉暝傳呼以禁夜行唯正月十五日夜勑許金吾弛禁前後各一日故蘇味道上元詩曰金吾不禁夜玉漏莫相催師曰薛夢符補遺引李廣從之田間飲歸霸陵縣尉止之今將軍尚不得夜行事誤矣補注鶴曰六典左右金吾衛大將軍各一人將軍各二人掌宫中及京城晝夜巡警之法以執禦非違李嗣業為左金吾大將軍祿山反兩京陷上在靈武詔嗣業赴行在謁見以時論之李金吾為嗣業也贈髙式顔天寳十五載作補注鶴曰詩云相逢皆老夫又云削跡共艱虞當是祿山反後天寳十五載與髙相逢於奉先白水間作昔别是何處洙曰是一作人相逢皆老夫故人還寂寞削跡共艱虞洙曰莊子孔子削跡於衛自失論文友空知賣酒壚師曰甫少與髙適李白常入酒壚論文酣詠自亂離以來相失今見式顔亦髙李之類不能無聳動故有末句平生飛動意見爾不能無趙曰言一見髙公則平生飛揚轉動之意不能自巳也贈比部蕭郎中十兄天寳五載作甫從姑之子補注鶴曰唐志比部屬刑部郎中貟外郎各一人掌勾㑹内外賦歛經費俸祿公廨勲賜等物梁編在天寳十四載長安作按詩云漂蕩雲天闊沉埋日月奔致君時巳晩懷古意空存則是未獻賦前作當是天寳五載自河南歸應詔時有美生人傑洙曰人中之豪傑以其傑出故謂之人傑漢有三傑由來積德門漢朝丞相系洙曰謂蕭相國何梁日帝王孫洙曰梁武帝姓蕭藴藉為郎久洙曰以藴藉而為郎東觀漢記桓榮温恭有藴藉文頴曰寛博有餘也魁梧秉哲尊洙曰周勃魁梧竒偉梧一音悟梧者言其可驚悟詞華傾後輩蘇曰髙鳳詞華後輩傾推宜為師範風雅藹孤騫師曰騫騰也言飛騰無與之偶故曰孤騫宅相榮姻戚洙曰晉魏舒少孤為外家甯氏所養甯氏起宅相宅者云當出貴甥舒曰當為外氏成此宅相後為公趙曰蕭兄杜家之外孫故比之為魏舒也兒童恵討論趙曰方兒童時得蕭兄恵以討論之益也林敏公曰恵聰慧也見知眞自幼洙曰潘安仁懷舊賦序云余十二而獲見於父友東武戴侯楊君始見知名遂申之以為婚姻謀拙愧諸昆洙曰子美與蕭為姑舅之昆仲漂蕩雲天闊沉埋日月奔致君時巳晩懷古意空存趙曰上句言見知於蕭兄巳自幼時而自後謀拙則每愧諸兄其謀拙者何飄蕩於外而不能仕進以致君也中散山陽鍛洙曰嵇康為中散大夫尚性絶巧而好鍜王戎自言與康居山陽二十年未嘗見喜愠之色愚公野谷村洙曰列子愚公移山而北智叟笑止之修可曰韓子昔齊威公入山問父老此為何谷答曰臣舊畜牛生犢以子買駒少年謂牛不生駒遂持而去傍鄰以臣為愚遂名為愚公谷寧紆長者轍洙曰陳平以席為門而門多長者車轍陶潜曰王公紆轍歸老任乾坤九日曲江天寶十四載作補注鶴曰梁權道編在天寳十四載詩内按是年祿山反自八月巳來屢饗士秣馬莫不共憂故有九日意兼悲揺蕩菊花期之句梁編為是綴席茱萸好洙曰風土記九月九日折茱萸房以挿頭言辟邪惡浮舟菡萏衰洙曰蓮莖為茄葉為荷花為菡萏實為蓮根為藕季秋時欲半洙曰一作百年秋已半九日意兼悲江水清源曲塡曰西京雜記以水源屈曲故謂之曲江補注鶴曰寰宇記曲江池漢武帝所造名為宜春苑其水曲折有似廣陵之江故名之荆門此路疑洙曰桓温以九日宴從事於龍山孟嘉落㡌龍山在荆門外師曰甫云此路疑疑其風景與曲江相若也晩來髙興盡摇蕩菊花期師曰摇蕩猶云飄蕩恐復飄蕩不得與菊花相期也官定後戯贈天寳十四載作鮑曰天寳十三載公年四十三在京師明皇朝獻太清宫享太廟及郊獻賦三篇帝竒之使待制集賢院令宰相陳希烈試文章為希烈刻忌權河西尉不拜改衛率府參軍補注鶴曰鮑注謂獻賦在天寳十三載非按公十載獻賦上令待詔集賢院試文章十三載再進封西嶽賦表上云一匹夫則其時未得官改衛率府參軍乃在十四載所謂昔罷河西尉初興薊北師是也此詩當作於天寳十四載方官未定時公贈崔于二學士詩云故山多藥物欲整還鄉斾而今詩云耽酒須微祿狂歌託聖朝故山歸興盡回首為風飈葢官已定也不作河西尉凄涼為折腰洙曰陶潜為彭澤令郡遣督郵至縣吏白應束帶見之潛歎曰吾不能為五斗米折腰拳拳事鄉里小兒老夫怕趨走率府且逍遥洙曰老夫自言也謂州縣有趨走之勞故怕之率府閑曹得自肆也耽酒須微祿狂歌託聖朝蘇曰崔獬狂歌痛飲託聖朝之至化故山歸興盡回首向風飈趙曰謂須微祿故無復歸山之興但臨風回首而巳承沈八丈東美除膳部員外郎阻雨未遂馳賀奉寄此詩天寳十三載作補注鶴曰膳部郎中在隋為膳部郎武德三年加中字龍朔二年為司膳大夫咸亨三年復為膳部郎中其貟外郎改復與郎中同今詩云清秋便寓直經過霖潦妨當是天寳十三載作是年九月滛雨不止梁權道編在十四載非是年祿山詐為勑書召諸將討國忠上下驚愕若果其年作不應詩不及之也今日西京掾多除南省郎洙曰府掾四人同日拜郎師曰漢制以曹官為掾言有所負荷也補注希曰兩漢有决曹掾賊曹掾又張湯以兒寛為奏讞掾明掾起於漢西京即京兆府掾者司錄功曹倉曹月曹田曹法曹兵曹士曹皆可通稱並正七品下南省郎謂禮部志云諸郎中皆從五品員外郎從六品沈自七品而升六品也通家惟沈氏謁帝似馮唐趙曰公自比也馮唐以白首而見文帝公四十嵗始以獻賦召試見明皇也師曰甫與沈家相通往來馮唐年老為郎今東美亦然故以比之詩律羣公問蘇曰王仲宣流落荆南多有名士日問詩律儒門舊史長趙曰謂之舊史則東美者史官沈既濟之胄也補注希曰宋之問傳魏建安後訖江左詩律屢變至沈約庾信以音韻相婉附屬對精宻及之問沈佺期又加靡麗回忌聲病約句凖篇如錦繡成學者宗之號為沈宋語曰蘇李居前沈宋比肩佺期嘗為修文館直學士既侍宴帝詔學士等舞回波佺期為弄辭悦帝公舉佺期作詩既濟作史以譽東美也沈約亦修宋書蘇注非清秋便寓直洙曰寓寄也晉潘岳兼虎賁中郎將寄直於散騎省中故云寓直也列宿頓輝光洙曰謂郎官上應列宿也未暇申安慰含情空激揚司存何所比膳部黙悽傷趙曰言沈丈所存之司何所比擬乎公直以比其大父也盖公之大父審言嘗為此官故因沈丈而追感矣貧賤人事略經過霖潦妨禮同諸父長洙曰父長猶父兄之行也相尊爾恩豈布衣忘天路牽騏驥雲臺引棟梁師曰甫末章有意於沈丈故云牽騏驥引棟梁也馬曰淮南子雲臺之髙髙注云髙際於雲即非漢之臺名徒懷貢公喜䬃䬃鬢毛蒼洙曰見切效貢公喜注王陽入仕貢禹彈冠補注杜詩巻十八
