body:
  text: 補注杜詩巻十七宋黄希原本黄鶴補注冬日洛城北謁𤣥元皇帝廟天寶八年作洙曰天寳元年陳王府參軍田同秀上言𤣥元皇帝降于丹鳳門之通衢告錫靈符在尹喜之故宅上遣使就函谷故闗尹宅發得之乃置𤣥元廟於天寧坊是秋改為太上𤣥元皇帝宫二年追尊大聖祖𤣥元皇帝仍於天下諸郡為紫微宫改譙郡紫㣲宫為太清宫趙曰𤣥元皇帝李老君也補注鶴曰梁權道云天寳十一年公遊東都時作按舊史天寳元年立𤣥元廟九月改太上𤣥元皇帝宫天下準此二年三月壬子親祠𤣥元廟改西京𤣥元廟為太清宫東京廟為太微宫天下為紫極宫新史却云三月壬子享于𤣥元宫改云云今謂十一年游東都作此詩何為更曰廟詩所言五聖聨龍衮又却是天寳八年閏六月事詩云翠栢深留景紅梨迥得霜風箏吹玉柱露井凍銀牀當是其年冬作葢天寳九年已歸長安進三大禮賦矣賦奏命宰相試文授河西尉不拜改率府胄曹十一年未嘗至洛陽也配極𤣥都閟洙曰配皇等極老子曰是謂配天極𤣥都觀也閟閉也神也詩閟宫有恤趙曰以廟在城之北故曰配極𤣥都丹臺仙真之所也故用𤣥都言廟舊注言𤣥都觀妄引妄注惑亂義理慿髙禁籞長洙曰前宣紀詔池籞未御幸者假與貧民注籞者禁苑前漢音義曰折竹以懸繩連之使人不得往來謂之籞守祧嚴具禮洙曰周禮分官守祧注逺廟曰祧遷主之所藏也趙曰周禮守祧掌守先王之廟祧故監廟者謂之守祧掌節鎮非常洙曰地官掌節猶信也行者所執之信掌節掌守邦節而辨其用以輔王命趙曰必有御賜之信以為鎮故得借掌節以為言碧瓦初寒外琪曰碧瓦琉璃瓦也初寒外指冬日也金莖一氣旁洙曰劉駼騊詩曰縹碧以為瓦班孟堅西都賦抗仙掌以承露擢雙立之金莖山河扶繡戸洙曰謂戸上繪畫若繡也梁沈約春風詠明珠簾於繡戸散芳塵於綺席日月近雕梁修可曰檀約陽春歌白日映雕梁相近日月言高大也仙李盤根大洙曰神仙傳老子姓李名耳字伯陽楚國苦縣屬鄉人盤根大故枝葉繁盛謂唐室以李為聖祖也猗蘭奕葉光洙曰漢武故事曰孝景王后夢日入其懷以七月七日生武帝於猗蘭殿奕葉猶累世也世家遺舊史洙曰史記有老子傳而無世家道徳付今王洙曰老子道徳經明皇御注畫手看前輩呉生逺擅場洙曰廟有呉道子畫張平子東京賦秦政利觜長距終得擅場鮑曰古人於能事中不獨求誇時輩須要於前輩中擅場森羅移地軸洙曰河圗括地象曰地有三百六十軸趙曰肇論云萬象森羅海賦又似地軸挺拔而爭迴妙絶動宫墻洙曰言筆跡巧妙冠絶也補注希曰文選孔融論盛孝章書曰今之少年喜謗前輩宫墻字出論語今以新改為𤣥元宫故云魏文帝與呉質書公幹五言詩之善妙絶時人然黄絹幼婦之碑在漢巳先有此語矣五聖聨龍衮洙曰唐書天寳八年上親謁太清宫上聖祖𤣥元皇帝尊號為聖祖大道𤣥元皇帝髙聖太宗中宗睿宗五帝皆加大聖皇帝之字禮器天子龍衮千官列鴈行洙曰丘遲書功臣名將鴈行有序謂繪五帝侍從也冕旒俱秀發洙曰禮器天子之冕朱綠藻十有二旒旌斾盡飛揚洙曰儀仗也翠栢深留景紅梨迥得霜風箏吹玉柱洙曰風箏謂掣箏掛之風際風至則鳴也江淹詩玉柱揚清曲露井凍銀牀洙曰古詩後園鑿井銀作牀金瓶素綆汲寒漿趙曰露地之井也庾丹秋閨詩空汲銀牀井身退卑周室洙曰史老子周守藏室之吏也脩道德其學自以隠無名為務居國久之見周之衰乃遂去經傳拱漢皇師曰漢文景皆崇尚黄帝老子之術故云經傳拱漢皇拱謂用其術以致無為之治故垂衣拱手也谷神如不死洙曰老子谷神不死是謂𤣥牝養拙更何鄉師曰谷所以藏物谷神猶云藏神何鄉謂無所止猶云何有之鄉行次昭陵天寳五年作彦輔曰唐太宗文皇帝之陵也補注鶴曰唐地理志醴泉縣有九嵕山昭陵在西北六十里舊史云貞觀十年置昭陵於九嵕山因析雲陽咸陽二縣置醴泉縣而新史云十一年二月丁已營九嵕山為陵十年十一月乃葬文徳皇后于昭陵殆因葬后又營陵故舊史云十年者紀始事也今詩題云行次昭陵當是天寳五年自東都歸長安時作詩云幽人拜鼎湖則是未奏賦授官前也舊俗疲庸主洙曰舊俗謂隋氏庸主煬帝疲困也羣雄問獨夫洙曰獨夫以失道而無助也書獨夫紂羣雄如李宻之流也䜟歸龍鳳質洙曰䜟書也唐太宗龍鳳之姿威定虎狼都洙曰蘇秦傳秦虎狼之國謂先定闗中也天屬尊堯典洙曰父子天屬也尊堯典謂循功典法也師曰髙祖禪位於太宗猶堯之禪位於舜故云神功協禹謨魯曰謂親定九州也趙曰謂禹成厥功而書有大禹謨也補注希曰髙祖諡神堯又遜位如堯故以其法度為堯典太宗有九功之徳可歌如禹也風雲隨絶足趙曰魏文與孫權送馬書曰中國雖饒馬其知名絶足亦時有之矣師曰時李靖之徒皆以風雲之㑹隨馬足而奮也日月繼髙衢洙曰日月謂相繼而明也謂髙祖禪位文物多師古洙曰文物典章左傳文物以紀之師古謂以古為師猶稽古也朝廷半老儒洙曰太宗之時朝廷多老儒碩學趙曰老儒謂房杜之徒直詞寧戮辱趙曰如魏鄭公王珪之諫諍賢路不﨑嶇趙曰言不艱於進用如用馬周之才也往者災猶降蒼生喘未蘇指揮安率土盪滌撫洪鑪歐陽曰謂陶成天下如洪鑪爾壯士悲陵邑洙曰陵邑陵廣也有奉邑幽人拜鼎湖洙曰鼎湖黄帝鑄鼎鼎成而仙去後世名其地為鼎湖趙曰言天變未弭而指麾安率土盪滌撫洪鑪則言太宗之意猶欲勤兵於逺也立志方如此遽爾升遐故繼之以有陵邑之悲鼎湖之拜也玉衣晨自舉洙曰上賜霍光玉衣梓宫耿秉死亦睗玉衣修可曰玉衣貴人死者珍異之衣鐵馬汗常趨薖日陸左公鐵馬千羣松栢瞻虛殿洙曰虛一作靈塵沙立暝途寂寥開國日洙曰謂太宗躬親戎馬平一天下開建國社也易開國承家流恨滿山隅師曰追想太宗開國之日今無英雄之主如太宗以安天下是以流恨也補注鶴曰古者陵廟多植松栢公之祖審言和李嗣真奉使河東詩云陵園松栢田又顔延年拜陵廟詩松風遵路急公謁先主廟枯木半龍鱗謂雙栢是也昭陵多植松柏故重經昭陵詩亦云再窺松柏路又按㑹昌三年勅諸陵植栽今後每至嵗首正二七八四箇月内擇日與百姓栽植畢日縣與安當則唐諸陵皆有栢公作此詩時明皇任用寖非其人國勢已不如開元亂萌危兆早自可見故流恨為之滿山隅也贈韋左丞丈濟天寳七年作鮑曰唐韋濟嗣立子天寳中為尚書左丞補注鶴曰舊史天寳七載韋濟為河南尹遷尚書左丞見本傳今詩云左轄頻虚位今年得舊儒即是其年作梁權道編在十一載非左轄頻虚位洙曰晉天文志轄星傳軫兩旁主王侯左轄為主者同姓右轄為異姓詩節南山尹氏太師維周之氐箋云氐作挃轄之轄修可曰唐六典左右丞掌管轄省事糾舉憲章又舊唐史劉洎上疏曰尚書萬機實為政本是以二丞方於管轄八座比於文昌故以左丞為左轄補注鶴曰舊史濟本傳云三代為省轄衣冠榮之白居易為庾丞宣尚書右丞制云昔我太宗文皇帝嘗謂尚書丞百職綱維事一失中則天下有受其弊者云云今乃命承宣操右轄然則以二丞為左右轄其殆起於公與白耶今年得舊儒趙曰皆以紀韋文也魏晉以來左丞得彈奏八座故傅咸云斯乃皇朝之司直天臺之管轄後人用左轄義起於此舊注引晉天文志以為星名非是相門韋氏在經術漢臣須洙曰漢韋賢及子𤣥成父子皆以經術為相時議歸前列天倫恨莫俱洙曰穀梁云兄弟天倫也趙曰指濟兄弟是前輩為時議所歸鴒原荒宿草洙曰常棣詩脊令在原注脊令雝渠也箋云雝渠水鳥而在原失其常處猶兄弟之於急難檀弓曽子曰朋友之墓有宿草而不哭注宿草謂陳根也趙曰惜其一亡至於宿草已荒鳳沼接亨衢洙曰晉荀朂守尚書令朂久在中書専管機事及失之甚惘然悵恨或有賀之者曰奪我鳳凰池諸君賀我耶趙曰濟由左丞可以接鳳池亨衢又美其為中書之貴師曰此句言累世為尚書也補注鶴曰濟之兄洹亦為給事中故云有客雖安命趙曰公自言也衰容豈壯夫洙曰謂以窮達而肥癯非壯夫也家人憂几杖洙曰几老者所憑杖老者所扶持謂家人憂其老也甲子混泥塗洙曰襄三十年傳晉悼夫人食輿人之城杞者絳縣人或年長矣無子而往與於食有與疑年使之年曰臣小人也不知紀年臣生之嵗正月甲子朔四百有四十五甲子矣其季於今三之一也吏走問諸朝趙孟召之而謝過焉曰武不才任君之大事以晉國之多虞不能由吾子使吾子辱在泥途久矣武之罪也敢謝不才遂仕之不謂矜餘力還來謁大巫洙曰呉志張紘傳陳琳答紘書曰小巫見於大巫神氣盡矣嵗寒仍顧遇日暮且踟蹰洙曰日暮謂暮齒也漢書日暮途逺老驥思千里洙曰魏武樂府云老驥伏櫪志在千里饑鷹待一呼洙曰魏志陳登謂吕布曰曹公言待將軍譬如養鷹然飢則為用飽則揚去蘇曰楚人云饑如鷹待此一呼事見吕氏春秋君能㣲感激亦足慰榛蕪洙曰明本一云折骨效區區趙曰此又不能無所求也師曰此詩有意於韋之薦拔故末章云君能微感激亦足慰榛蕪投贈哥舒開府二十韻天寳十二年作鄭曰名翰其先葢突厥施酋長哥舒部之裔補注鶴曰天寶六年十月帝在華清宫召哥舒翰見十一月辛卯以翰判西平太守充隴右節度使八載命攻石堡城又天寳十四載隴右河西節度使哥舒翰入朝今詩投贈稱開府按傳十一載加開府儀同三司翰凡三入朝初以六載十月次以十一年十二月又以十四年二月今詩云每惜河湟弃新兼節制通又云茅土加名數則是指十二年加河西節度進封西平後而在十四年拜太子先鋒兵馬元帥前梁權道編在天寳十一年是年翰未為河西節度及封王無容先言節制并茅土當是十二載作為十三載又拜太子太保加實封三百戸此詩不言矣今代麒麟閣何人第一功洙曰漢武帝獲麟作麒麟閣以畫功臣漢宣帝甘露三年上思股肱之美乃圖畫大將軍霍光等十二人於麒麟閣髙祖即位論功行封以蕭何功為第一師曰唐制開府儀同三司者三公也從一品官甫意哥舒翰特膺帝眷必立大功為麒麟閣第一人君王自神武駕馭必英雄洙曰漢刑法志髙祖躬神武之才摠攬英雄呉張昭曰人君能駕御英雄開府當朝傑洙曰齊職儀曰開府儀同三司秦漢無文唐制開府儀同三司從一品官趙曰翰於天寳十一年加開府儀同三司補注鶴曰漢未嘗無文按通典漢文帝元年用宋昌為衛將軍位亞三司東觀漢記章帝建初三年使車騎將軍馬防班同三司殤帝元年鄧隲為車騎將軍儀同三司魏志黄權以車騎將軍開府儀同三司晉起居注羊祐為車騎將軍開府如三司之儀論兵邁古風先鋒百勝在洙曰勝一作戰劉牢之為前鋒百戰百勝號為北府兵敵人畏之略地兩隅空洙曰漢書鄂秩曰曹叅有野戰略地之功師曰北征突厥西伐吐蕃略取也故云兩隅空青海無傳箭洙曰翰築城青海上吐蕃攻破之移築龍駒鼻吐蕃不敢近青海趙曰胡人毎起兵則傳箭為號或曰守城之法更夜傳箭以驚其睡天山早挂弓洙曰薛仁貴傳將軍三箭定天山天山即初連也匈奴謂天為祁連趙曰早挂弓則不復用補注鶴曰青海天山並見八哀王思禮詩廉頗仍走敵洙曰見㢘頗出將頻注魏絳已和戎洙曰魏絳勸晉侯和戎以為有五利公従之魏絳盟諸戎脩民事田以時既而鄭人來歸賂晉侯以師悝師觸師蠲歌鍾二肆具及鎛罄女樂二八晉侯以樂之半賜魏絳曰子教寡人和戎八年之中九合諸侯如樂之和請與子樂之於是魏絳始有金石之樂禮也每惜河湟棄新兼節制通趙曰翰十二載進封凉國公兼河西節度使葢以河湟之久棄欲得翰收復之故使之節度河西也師曰河隍乃河曲築隍以備寇王忠嗣守河隍為寇所敗翰入朝陳攻守計帝以翰領節制虚心待之出入朝廷諸公莫敢比望智謀垂睿想趙曰方謀復河隍而為帝所繫想出入冠諸公日月低秦樹乾坤繞漢宫趙曰此言收復之功也按傳云攻破吐蕃共濟收黄河九曲以其地置兆陽郡此所謂日月所臨特低秦樹乾坤所包獨繞漢宫胡人愁逐北趙曰翰之威武胡人愁其攻逐而敗北矣漢書注師敗曰北舊注引吐蕃盜麥為翰所破非是宛馬又從東鄭曰宛於爰切洙曰漢伐大宛得天馬乃作歌曰天馬來歴無草徑千里循東道言翰能振威武故蠻夷畏服宛馬復來也受命邊沙逺洙曰邊沙一作軍麾翰屢節鎮邊郡歸來御席同趙曰邊沙逺鎮言河西為逺御席同言復河隍功成而歸寵宴之盛洙曰翰嘗來朝帝命髙力士賜宴詔尚食生擊鹿取血瀹腸為熱洛河以賜之軒墀曾寵鶴洙曰左傳狄人伐衛懿公好鶴鶴有乗軒者將戰國人受甲者皆曰使鶴鶴實有祿位余焉能戰余曰邵氏聞見錄云子美軒墀曽寵鶴左傳注云軒大夫車也非軒墀之軒或以為病惟知詩者能辨之畋獵舊非熊洙曰文王將出獵卜之曰所獲非熊非羆非虎非貔乃霸王之輔也於是文王獵果遇太公於渭之陽載歸以為師趙曰言翰之貴寵已如乗軒之鶴明皇得之如文王之得吕望茅土加名數洙曰禹貢徐州厥貢惟土五色注王者封五色土為社建諸侯則各割其方色土與之使立社燾以黄土苞以白茅茅取其潔黄土取王者覆四方名數謂等其爵位輕重而為之名數也趙曰此言翰進封西平郡王也山河誓始終洙曰髙祖即位封功臣為之誓曰使黄河如帶泰山若礪國以永存爰及苖裔於是申以丹書之信重以白馬之盟策行遺戰伐契合動昭融師曰䇿行言以計用兵不暇交戰故云遺戰伐昭融言帝之哲鑒也勲業青㝠上洙曰須賈謂范睢曰不意君能自致於青雲之上蘇曰灌夫致功名勛業在青冥之上交親氣槩中蘇曰五侯門戸棨㦸森列百夫守衛出入交舊親契皆在豪英氣槩之中誰敢反目未為珠履客洙曰春申君客三千餘人其上客皆躡珠履巳見白頭翁壯節初題柱洙曰公自言壯節有題柱志也成都記昇仙橋司馬相如初西去題其柱曰不乗髙車駟馬不過此橋果以傳車至其處生涯獨轉蓬洙曰言晚節流離如蓬之轉風也曹子建詩轉蓬離本根飄颻隨長風幾年春草歇修可曰梁元帝云既看春草歇今日暮途窮洙曰主父偃云日暮途窮嵇康書曰若道盡途窮則已耳軍事留孫楚洙曰晉孫楚字子荆才藻卓絶爽邁不羣多所陵傲闕鄉曲之譽年四十餘始叅鎮東軍事後復參石苞驃騎將軍楚既負其材氣頗侮易於苞初至長揖曰天子命我參卿軍事因此而嫌隙遂構劾參軍不敬府主楚既輕苞遂制施敬於是楚始也行間識吕䝉洙曰呉志吕䝉字子明年十六幼隨妹夫鄧當嘗擊賊時當職吏以䝉年小輕之曰彼豎子何能為此以肉餧虎耳他日與䝉㑹又嗤辱之䝉大怒拔刀殺吏出俄因校尉袁雄自首於是袁雄得以因間言䝉於孫䇿䇿竒之召至左右一云鄉曲輕周處將軍拔吕䝉防身一長劒將欲倚崆峒洙曰一作防身有長劍聊亦倚崆峒宋玉賦長劍耿介倚天師曰崆峒山在西正當吐蕃所入之道將倚劍崆峒従翰守節鎮也上韋左相二十韻天寳十三載作彦輔曰按韋見素傳見素嘗為左丞相子倜鄂位至給事中孫顗為尚書左丞也鮑曰韋見素襲父爵彭城郡公十三載拜武部尚書従帝入蜀詔兼左相補注鶴曰按史天寳十五載七月明皇幸蜀次巴西郡以韋見素為左相是時天下危亂不應詩云八荒開壽域一氣轉洪鈞當是天寳十三載見素同中書門下平章事時投之故詩曰韋賢初相漢今題曰左相乃後來編寫之誤梁權道編在十一載是年見素未同平章况天寳十五載見素為左相時公旋陷賊營無容再投以詩如廟堂知至理風俗盡還淳又豈軍興人主播遷時語鳳厯軒轅紀洙曰昭十七年傳郯子曰我髙祖少皡摯之立也鳳鳥適至故紀於鳥為鳥師而鳥名鳳鳥氏厯正也注鳳鳥知天時故以名厯正之官史記曰黄帝名軒轅龍飛四十春洙曰自𤣥宗即位至天寳十一載四十年十三載見素為武部尚書同中書門下平章事龍飛𤣥宗即位也八荒開壽域洙曰荒大也八方也敺民庶於仁壽之域昱曰列子逺在八荒之外前漢王吉疏敺一世之民躋之仁壽之域一氣轉洪鈞洙曰張茂先答何劭詩洪鈞陶萬類霖雨思賢佐洙曰髙宗命傅説曰若嵗大旱用汝作霖雨丹青憶老臣洙曰趙充國以功徳與霍光等列畫未央宫成帝時西羌嘗有警上思將帥之臣追美充國迺召揚雄即充國圗像而頌之後漢胡廣傳靈帝思感舊臣乃圗畫廣及太尉黄瓊於省内詔議郎蔡邕為其頌云應圖求駿馬洙曰梅福傳欲以三代之法取當世之士猶以伯樂之圗求騏驥於市而不可得亦已明矣趙曰此言見素以才見用也魏曹植獻文帝馬表曰臣於先帝世得大宛紫騂一疋形法應圗舊注引梅福傳非干此也驚代得麒麟洙曰張揖注相如賦雄曰麒雌曰麟其狀䴢身牛尾狼蹄一角沙汰江河濁洙曰言為吏部日也北史新雄為尚書郎㑹沙汰郎官雄與羊琛等八人俱見留調和鼎鼐新鄭曰鼐乃代切洙曰言為相也説命若作和羮用汝為鹽梅釋器云鼎絶大者謂之鼐韋賢初相漢洙曰韋賢字長孺授昭帝詩宣帝本始三年代蔡義為丞相范叔已歸秦洙曰史記范雎字叔更名姓曰張祿王稽載入秦昭王大説拜睢為客卿封應侯相秦盛業今如此傳經固絶倫洙曰韋賢兼通禮尚書少子𤣥成復以明經仕至丞相故鄒魯諺曰遺子黄金滿籯不如一經豫樟深出地滄海闊無津洙曰豫樟木良材也滄海百谷之所歸其淵不可津涯北斗司喉舌洙曰李固傳陛下之有尚書猶天之有北斗也北斗為天之喉舌尚書亦為陛下喉舌斗斟酌元氣運平四時尚書出納王命東方領搢紳洙曰郊祀志搢紳者弗道李竒曰搢紳挿笏於紳紳大帶也臣瓚曰縉赤白也紳大帶也師古曰李云搢紳是也縉本作搢挿笏於大帶之間與革之間耳非挿於大帶也或作薦紳者亦謂薦笏於紳帶之間其義同師曰東方朔為縉紳領袖或云康王之誥太保率西方諸侯入應門左畢公率東方諸侯入應門右時公為相率百官故云領搢紳持衡畱藻鑒師曰見素天寳五年為吏部侍郎銓序平允故云持衡畱藻鑒聴履上星辰洙曰見素時兼兵部尚書故云聴履上星辰鄭崇哀帝時為尚書僕射數求見誎爭上納用之每見曳革履上笑曰我識鄭尚書履聲趙曰見素為吏部侍郎平判皆誦於口銓選平允人多德之上星辰以言其親帝之旁猶言上青霄也獨歩才超古昱曰王粲字仲宣曹植曰仲宣獨歩於漢南餘波徳照隣洙曰一云餘隂照北隣余曰左傳僖三十三年波及晉國君之餘也聰明過管輅洙曰魏方伎傳管輅字公明喜仰視星辰明天文地理變化之數徐州號為神童師曰天寳十五年八月肅宗立改元至徳十月丙申有星犯昴見素言於肅宗曰昴者胡也祿山將死帝曰日月可知乎見素曰福應在徳禍應在刑昴金忌火行當火位昴之昏乃其時也及祿山死日月皆不差管輅善天文地理今見素所言如此故曰聰明過管輅尺牘倒陳遵洙曰前漢陳遵贍於文辭惟善書與人尺牘主皆藏弆以為榮豈是池中物洙曰呉周瑜傳晉劉元海傳並云蛟龍得雲雨非復池中物由來席上珍無已曰記儒行儒有席上之珍以待聘廟堂知至理風俗盡還淳魯曰此言宰相之能事畢矣才傑俱登用愚䝉但隠淪趙曰公自謂也長卿多病久洙曰司馬相如字長卿常有消渇病稱疾間居不慕官爵子夏索居貧趙曰公以二人自比也相如常有消渇病子夏離羣索居索居蕭條也回首驅流俗生涯似衆人巫咸不可問洙曰列子有神巫自齊來命曰季咸知人生死存亡禍福壽夭鄒魯莫容身洙曰莊子盜跖篇孔子再逐於魯削跡於衛窮於齊圍於陳蔡不容身於天下者豈足貴耶感激時將晩蒼茫興有神師曰時將晩傷衰老也蒼茫曠逺貌言興之超逺為公歌此曲涕淚在衣巾奉贈太常張卿均二十韻天寳十一載作彦輔曰按唐書均張説之長子也九載為大理卿後出為建安太守嵗中召還再遷太常卿祿山亂後偽命特免死長流合浦補注鶴曰按史均未嘗為太常卿舊史帝紀天寳十三載三月均由憲部尚書貶建安太守還為大理卿均之弟垍却以太常卿貶盧溪郡司馬嵗中召還再遷為太常卿兄弟貶皆在十三載今詩當是與垍垍尚主多留禁中所以冀其援引詩殆作於十一載舊注非作是詩時公方進賦後方丈三韓外洙曰前漢郊祀志自齊威宣燕昭使人入海求蓬萊方丈瀛洲三神山者其傳在渤海中魏志三韓在帶方之南東西以海為限有三種一曰馬韓二曰辰韓三曰棄韓故曰三韓補注鶴曰王洙注前漢郊祀志云威宣燕昭事葢先見史記封禪書又魏志三韓按通典則云馬韓後漢時通焉有三種一曰馬韓二曰辰韓三曰弁辰與魏志三曰棄韓不同崑崙萬國西洙曰禹貢注崑崙在荒服之外流沙之内羌髣髴之属皆西戎也建標天地闊洙曰天台賦赤城霞起以建標詣絶古今迷氣得神仙迥恩承雨露低洙曰按唐書均弟垍以主婿𤣥宗特深恩寵許於禁中置内宅侍為文章賞賜珍玩不可勝數時均亦供奉翰林垍嘗以所賜示均均戲謂垍曰此婦翁與女壻非是天子與學士也趙曰上四句以譬禁掖之清切乃神仙之地唯有仙風道骨者始能遊且承恩寵也此指言張均父子補注希曰詩蓼蕭注雨露者天所潤萬物喻王者恩澤不為逺不及也相門清議衆趙曰張均父説相門之子故曰相門儒術大名齊魯曰均張説之子其名與父齊等也軒冕羅天闕洙曰均垍俱能文説在中書兄弟皆掌綸翰之任琳琅識介珪洙曰禹貢厥貢球琳琅玕注球琳皆玉名琅玕石而似珠詩崧髙錫爾介珪以作爾寳箋云長尺二寸謂之介非諸侯之圭故以為寳美均為介珪也伶官詩必誦洙曰邶詩簡兮序仕於伶官注伶官樂官也伶氏世掌樂官而善焉故後世號樂官為伶官也䕫樂典猶稽洙曰書后䕫典樂趙曰此贈太常張卿復用樂事太常卿掌樂者也健筆凌鸚鵡洙曰後漢禰衡字正平有才辯在黄祖座上為鸚鵡賦筆不停綴文不加㸃凌過也銛鋒瑩鸊鵜洙曰鸊鵜水鳥也膏中瑩刀修可曰戴暠度闗山詩云劍瑩鸊鵜膏補注希曰爾雅鵜鳹注云膏堪瑩劍本草鸊鵜條刀劍令不綉以膏塗之水鳥也友于皆挺拔洙曰友于言兄弟也趙曰言均垍兄弟之貴且有勲業也公望各端倪洙曰公望各有所歸也余曰莊子大宗師篇反覆終始不知端倪疏云端緒也倪畔也通籍踰青瑣洙曰元帝紀令從官給事官司馬中者得為大父母父母兄弟通籍應劭曰籍者為二尺竹牒記其年紀名字物色縣之宫門案省相應乃得入也謝元暉詩既通金閨籍漢給事曰暮入對青瑣門拜謂之夕郎貴瑣以青戸邊鏤中天子制也刻為青瑣文而青塗也補注希曰元后傳赤墀青瑣孟康曰以畫戸邊鏤中天子制也如淳曰門楣格再重如人衣領再重裹者青名曰青瑣天子門制也亨衢照紫泥洙曰亨衢亨塗也後漢志漢舊儀曰天子信璽六璽皆以武都紫泥封青囊曰素裏兩端無縫尺一板中約署皇帝余曰易火畜卦何天之衢亨靈虬傳夕箭洙曰梁陸倕新漏刻銘云靈虬承龍言漏刻之體以龍承之也趙曰箭浮水之物鄭曰虬居幽切無角龍歸馬散霜蹄昱曰莊子馬蹄可以踐霜雪能事聞重譯洙曰前漢平帝紀越裳重譯獻雉師古曰譯謂傳言也道路絶逺風俗殊隔故累譯而後乃通趙曰言所能之事聞播於重譯之蠻夷矣嘉謨及逺黎余曰楊子或問忠言嘉謨曰謨合皋陶之謂嘉弼諧方一展洙曰臯陶謨曰謨明弼諧班序更何躋洙曰左傳朝以正班爵之義帥長幼之序適越空顚躓洙曰莊子逍遙篇宋人資章甫而適諸越越人斷髪文身無所用顛躓危困也游梁竟慘悽洙曰鄒陽齊人知呉王不可説是時梁孝王待士於是陽與枚乗嚴忌等皆去之陽從孝王游羊勝公孫詭等疾陽惡之孝王孝王怒將殺之陽從獄中上書而得免趙曰公初落魄嘗適越矣傳所謂客呉越是也公又嘗遊梁矣贈李白詩所謂亦有梁宋遊是也謬知終畫虎洙曰馬援傳初兄子嚴敦並喜譏議援在交趾還書戒之曰效杜季良不得陷為天下輕薄子所謂畫虎不成終類狗也微分是醯雞洙曰莊子田子方篇孔子見老聃出以見顔回曰丘之道也其猶醯雞歟微夫子之發吾覆也吾不知天地之大全也注醯雞者瓮中之蠛蠓也醯許西反萍泛無休日趙曰公自譬其無定也桃陰想舊蹊洙曰李廣賛曰桃李不言下自成蹊趙曰公言其想舊蹊之桃陰乃懷念舊日見知之人也吹嘘人所羨騰躍事仍暌碧海眞難渉洙曰十洲記扶桑在碧海之中也一面萬里太常之宫太眞東主君所治之也青雲不可梯安石曰郭璞游仙詩靈谿可潛盤安事登雲梯曽曰謝靈運詩共登青雲梯補注希曰史記范睢傳賈不意君能自致青雲之上顧深慙鍛鍊洙曰韋彪傳鍛鍊之吏注言深文之吏入人之罪猶工冶陶鑄鍛鍊使之成熟也田曰張景陽七命曰楚之陽劍歐冶所營乃鍊乃鑠萬辟千灌注云鍛鍊刻苦成材之義此言張卿恩顧我雖深而自慙鍛鍊之未至耳舊注所引乃刑罰鍜鍊之義非是才小辱提擕趙曰公自言才能之小辱張卿之提携也檻束哀猿呌洙曰呌一作巧淮南子置猿檻中巧捷無所肆其能枝驚夜鵲棲洙曰魏武帝樂府云月明星稀烏鵲南飛繞樹三匝何枝可依幾時陪羽獵應指釣璜歸趙曰孝成帝時羽獵而揚雄從焉幾時陪羽獵有羨慕其得近清光之意鄭曰璜戸光切十道志櫟陽有釣漢浦乃吕望所釣璜溪也師曰太公老年見用今甫亦有意于暮年故云云敬贈鄭諫議十韻天寶十一載作補注鶴曰諫議大夫其名起於後漢韋彪上疏曰諫議之職應用公直之士是也續通典武后龍朔二年改為正諫大夫開元以來復凡四人屬門下此詩云旅食嵗崢嶸又云使者求顔闔諸公厭禰衡當是天寶十載奏賦後作謂天子雖召試而莫有従而薦送之者梁權道編在十一載為是諫官非不達詩義早知名趙曰為天子諫官非不謂之顯達而於作詩之義又早嵗已有名此專美之也下句正言其詩可以知名者破的由來事洙曰言詩句中理如射之破的也庾翼謂謝尚曰卿若破的當以鼓吹相賞尚應聲中之翼即以其副鼓吹給之先鋒孰敢爭趙曰破的如射之中先鋒如戰之勇王濟與王愷發射一發射破的思飄雲物外洙曰外一作動言詩思逺到也趙曰如文賦言神游萬仞情騖八極舊注引飄飄有凌雲之氣非是律中鬼神驚修可曰詩律既中可驚鬼神如李白詩内云詩成泣鬼神舊注謂如律吕和諧誤矣毫髪無遺恨趙曰公言作詩中有一字一句不佳雖如毫髮之小則心自慊慊有遺恨矣波瀾獨老成洙曰曲盡物理故無遺恨才思浩瀚故如波瀾野人寧得所趙曰自此以下皆公自敘也野人公自稱耳天意薄浮生多病休儒服晏曰莊子田子方篇哀公曰舉魯國而儒服㝠搜信客旌趙曰欲搜幽㝠之地信客旌所指耳築居仙縹緲洙曰木𤣥虚海賦神仙縹緲食玉清涯旅食嵗崢嶸鄭曰鮑明逺舞鶴賦嵗崢嶸而催暮使者求顔闔洙曰莊子讓王篇魯君聞顔闔得道之人也使人以幣先焉顔闔守陋閭苴布之衣而自飯牛終逃魯君之使諸公厭禰衡洙曰禰衡有才辯氣剛傲好矯時慢物曹操怒之送與劉表表恥不能容以江夏太守黄祖性急故送衡與之後竟為祖所殺將期一諾重洙曰辯士曹丘生謂季布曰楚諺曰得黄金百斤不如得季布一諾足下何以得此聲於梁楚之間哉歘使寸心傾洙曰謂傾嚮於鄭也徐庶指心曰以此方寸之地鄭曰歘許勿切暴起也君見途窮哭宜憂阮歩兵洙曰阮籍為步兵校尉率意命駕不由徑路車迹所窮輒慟哭而反奉贈鮮于京兆二十韻天寶十一載作鮑曰鮮于仲通也紀十載書劍南節度使鮮于仲通及雲蠻戰于西洱河敗績不見其為京兆豈先為京兆也豈以節度為京兆耶唐開元以來在位無鮮于姓者詩有鮮于萬州乃其子也鄭曰鮮于相然切漢複姓也補注鶴曰按通鑑天寳十二載正月京兆尹鮮于仲通諷選人請為國忠刻頌立於省門制仲通撰其詞則仲通為京兆尹在十一載十一月國忠為相後也詩云獻納紆皇眷中間謁紫宸當是公獻文待詔集賢院後作梁權道編在十一載然王鉷得罪勅國忠鞫之仍兼京兆尹葢在十一載四月而五月又加京畿闗内採訪使凡鉷所綰使務悉歸國忠十一月庚申為右相意國忠為相後仲通方為京兆尹則此詩在十一載十二月作王國稱多士洙曰文王詩思皇多士生此王國賢良復幾人異才應間出爽氣必殊倫洙曰氣宇清爽有殊於衆人趙曰以言鮮于京兆也始見張京兆宜居漢近臣洙曰張敞守京兆尹其治京兆略循趙廣漢之迹為久任職漢制出為二千石有治狀者入為公卿故曰近臣驊騮開道路蘇曰淮陰侯韓信語蒯通曰觀子與諸郎談論辨析是非落落可聽如駑駘駕車使驊騮開路非容易追逐也使人心服可喜可喜見國語别集鵰鶚離風塵洙曰猶駿異得路者然也趙曰驊騮鵰鶚言其俊也侯伯知何算洙曰一作等文章實致身趙曰此言侯伯之人多矣至於無算而鮮于之致身則實以文章也奮飛超等級容易失沉淪師曰言京兆乃輦轂之下不可驕易而失身此戒之之辭脫略蟠溪釣洙曰吕望釣於蟠溪操持郢匠斤洙曰莊子郢人堊漫其鼻端若蠅翼使匠石斵之匠石運斤成風聴而斵之盡堊而鼻不傷郢人立不失容雲霄今已逼台衮更誰親趙曰上公應天上三台衮則衮服三公一命衮故得稱衮也師曰言近天子必見擢為公相也鳳宂雛皆好洙曰此言鮮于諸子也陸雲幼時閔鴻見而竒之曰此兒若非龍駒當是鳳雛龍門客又新洙曰後漢李膺性簡亢無所交接唯以同郡荀淑陳寔為師友被容接者名為登龍門師曰言門下客皆賢士也義聲紛感激洙曰劉越石詩鄧生何感激敗績自逡巡洙曰左傳巳敵大崩曰敗績趙曰皆公自謂也言鮮于之義聲雖紛然感激之多而我之敗績則自逡巡不進耳途逺欲何向洙曰逺一作永主父偃曰日暮途逺天髙難重陳鄭曰重儲用切再也洙曰劉越石棄置勿重陳曹植云天髙聴逺學詩猶孺子洙曰一云子夏論語小子何莫學夫詩又子曰起予者商也始可與言詩已矣鄉賦念嘉賓洙曰鄉賦猶鄉舉也鹿鳴燕嘉賓不得同晁錯洙曰公傳言公舉進士不第晁錯舉賢良對策髙第吁嗟後郄詵洙曰郄詵曰臣舉賢良對策為天下第一猶桂林一枝也補注鶴曰舊史云舉進士不第故不得如晁錯郄詵之擢第考公壯遊詩云中嵗貢舊鄉贈韋左丞云早充觀國賔盖嘗得鄉舉故云鄉賦念嘉賓計疎疑翰墨時過憶松筠趙曰言時已過矣則思隠於山林獻納紆皇眷中間謁紫宸洙曰殿名且隨諸彦集洙曰江淹别賦金閨諸彦方覬薄才伸洙曰公獻三賦召試集賢殿破膽遭前政洙曰劉陶傳闗東破膽隂謀獨秉鈞趙曰子美對詔意本望髙選而為林甫所沮故有破膽隂謀之語師曰甫以上疏雪房琯為當權者所疾遂見斥逐故云微生霑忌刻萬事益酸辛交合丹青地恩傾雨露辰洙曰交契在華顯之地又當沛澤下流之辰而愁餓死者以時所不容也趙曰丹青地指言公卿之地也鹽鐵論曰公卿者神化之丹青有儒愁餓死早晩報平津洙曰東方朔傳臣朔飢欲死平津侯公孫𢎞開閤延賢人與叅謀議報平津喻報鮮于也趙曰公以獨餓死為愁所賴者在鮮于京兆如公孫𢎞故人賓客仰給衣食焉平津侯公孫𢎞也贈特進汝陽王二十韻天寶五載作彦輔曰舊注王名僎天寳中封為王祕書監同正員父棣王琰琰𤣥宗第四子也琰妃韋氏少師之女也新注按唐史譲皇帝長子璡封汝陽位特進僎位祕書監此詩乃贈璡非僎也璡已見八哀詩云鮑曰璡讓皇帝子新史書贈太子太師不書特進失之舊史言小特進贈太子太師與公詩合趙曰公八哀詩太子太師汝陽王璡曰汝陽讓帝子而舊注又以此為棣王琰之子何自眩惑也此詩在八哀詩所贈之先葢其特進時耳特進正二品而太子太師正一品也補注鶴曰舊史云天寳初終父喪加特進九載卒新史不言加特進而梁權道編在十一載非葢讓皇帝憲以開元二十九年十一月薨天寶三載璡喪服方終必其年二月封琳為嗣憲王時併加璡特進此詩當在天寶五六載間公壯遊詩是開元二十四年下考功第去遊齊趙八九年則歸長安在天寶四五載間詩云賞遊實賢王則從汝陽之遊葢在天寶五六載間此詩作於其時特進羣公表洙曰漢官儀曰諸侯功德優盛朝廷所敬異者賜位特進在三公下特進漢官也二漢魏晉以加官表儀表也補注希曰宣帝用太子外祖許廣漢為平恩侯位特進後漢皇后兄弟率為特進侯唐為文散官皆崇官盛德罷劇就閑居之見通典天人夙德升洙曰邯鄲淳見曹植才辨歸對其所知歎植之才謂之天人夙早也霜蹄千里駿洙曰武帝謂劉德為千里駒師古曰其所言若駿馬可致千里也風翮九霄鵬洙曰莊子鵬怒而飛其翼若垂天之雲摶扶搖而上者九萬里服禮求毫髪趙曰言於禮無纎毫違背推忠忘寢興聖情常有眷朝退若無憑洙曰不挟貴也仙醴求浮蟻洙曰醴一作醖師古曰醴甘酒也少麴多米一宿而熟不齊之漢書楚元王敬禮申公穆生不嗜酒王每置酒嘗為穆生設醴曹子建七唘云浮蟻鼎沸酷烈馨香竒毛或賜鷹蘇曰隋文帝賜楊素白花角鷹清闗塵不雜洙曰㑹稽典錄丁寛門無雜賓中使日相乗洙曰呉志朱然傳中使日食之物相望於道晩節嬉遊簡平居孝義稱自多親棣萼洙曰友愛兄弟也補注鶴曰舊史讓皇帝傳𤣥宗於興慶宫西南置樓四面題曰花萼相輝之樓諸王遊踐之所中使相望或近郊從禽或别墅追賞讓皇帝薨葬于橋陵號為恵陵璡上表懇辭新史四方所獻酒酪異饌皆分餉之此詩雖述𤣥宗眷待其父之事然璡傳亦云帝愛之誰敢問山陵洙曰後漢東平王蒼傳帝欲為原陵顯節陵起縣邑蒼聞之遽上疏諫帝從而止學業醇儒富洙曰賈山涉獵書記不能為醇儒辭華哲匠能秦曰殷仲文詩哲匠感蕭辰筆飛鸞聳立章罷鳳騫騰洙曰羨其書翰也精理通談笑洙曰雖談笑皆精於理忘形向友朋洙曰不驕也寸腸堪繾綣昱曰板詩以謹繾綣注反覆也一諾豈驕矜洙曰一諾見鄭諫議詩注巳沗歸曹植洙曰見天人夙德升注何知對李膺洙曰後漢杜宻傳黨錮事起宻與李膺俱坐而名行相次故時人亦稱李杜前有李固杜喬故言亦也范滂母曰汝得與李杜齊名死亦何恨謂膺宻也子美對汝陽謙辭也招要恩屢至鄭曰要伊消切崇重力難勝洙曰子美自言雖䝉招要之恩而禮意崇重非力所能勝也披霧初歡夕洙曰衛瓘見樂廣曰見此人瑩然若披雲霧而覩青天也高秋爽氣澄樽罍臨極浦鳬鴈宿張燈花月窮遊宴炎天避鬱蒸石曰猶河朔避暑之㑹硯寒金井水洙曰荆州記益陽有金井數百故老傳金人以杖撞地輒成井簷動玉壺冰洙曰鮑明逺詩清如玉壺冰瓢飲唯三逕洙曰顔回一瓢蔣詡三逕巖栖異一塍洙曰謝靈運詩栖巖挹飛泉謬持蠡測海洙曰東方朔論以蠡測海張晏曰蠡瓠瓢也師古曰蠡音來戈反師曰今辱宴㑹酒量非公敵故云況挹酒如澠鄭曰澠食陵切洙曰左昭十二年晉侯與齊侯宴中行穆子相投壺晉侯先穆子曰有酒如淮有肉如坻寡君中此為諸侯師中之齊侯舉矢曰有酒如澠有肉如陵寡人中此與君代興亦中之昱曰澠水出齊國臨淄縣北入時水鴻寶寧全秘洙曰劉向傳上覆興神仙方術之事而淮南有枕中鴻寶苑秘書師古曰鴻寳苑秘書並道術篇名藏在枕中存錄之不漏泄也丹梯庶可陵洙曰謝𤣥暉敬亭山詩要欲追竒趣即此陵丹梯淮王門有客洙曰有一作下淮南王劉安善屬文天下方術之士多往歸焉於是遂與蘇飛李向左昊田由雷被晋昌時八人及諸儒大山小山之徒共講論道徳摠統仁義而著鴻烈解也終不愧孫登洙曰晉隠逸孫登傳初楊駿徵高士孫登遺以布被登截被於門大呼曰斫斫刺刺後果如其言黎余幽憤詩曰昔慚栁下今愧孫登師曰楊駿無徳而登諷之璡無愧於甫故云云重經昭陵天寳九載作補注鶴曰前經昭陵詩是天寳四載此詩當是在九載作是年髙祖與四宗皆加大聖字五后皆加順聖字故詩云宗祀日光輝還見五雲飛以言天子之孝也天寳五載遊齊趙歸應詔退下復至東都有八年謁𤣥元皇帝廟詩九載歸長安重經陵下作此草昧英雄起洙曰屯難之時也師曰草而不齊昧而不明言隋末之亂也謳歌厯數歸洙曰孟子謳歌者不謳歌堯之子而謳歌舜論語天之厯數在汝躬言其天命之所在也風塵三尺劍洙曰髙祖曰吾以布衣提三尺取天下師古曰三尺劍也社稷一戎衣洙曰武成一戎衣天下大定衣服也一著戎服而滅紂言衆心同也翼亮貞文徳丕承戢武威洙曰書丕顯哉文王謨丕承哉武王烈師曰置文館以招學士故云云聖圗天廣大洙曰無不覆燾也宗祀日光輝洙曰奕葉隆盛也陵寢盤空曲熊羆守翠微洙曰陵山陵也寢寢廟也古詩陵寢暮煙青再窺松栢路還見五雲飛洙曰天子有孝感則五雲見俯曰五雲五色雲也補注鶴曰唐志注長安縣有翠㣲宫後改為翠㣲寺昭陵雖在醴泉而翠㣲尚可想其臨幸之盛熊羆指言居守之兵也爾雅疏未及頂上在旁坡陀之處名翠㣲亦是鄭駙馬宅宴洞中潜曜載天寶四作補注鶴曰按史臨晉公主皇甫淑妃所生下嫁鄭潜曜又按公所撰皇甫淑妃碑鄭潜曜尚臨晉公主乃代國長公主之子官曰光祿卿爵曰駙馬都尉又云甫沗鄭莊之賔客遊竇主之山林觀此詩與東亭詩亦可知矣碑云開元二十三年葬於河南縣而公主戚然謂左右曰自我之西嵗陽再紀乃以斯文見託則是碑作於天寳四載而詩在其先後也主家隂洞細煙霧洙曰公主家也陰洞幽洞也留客夏簟青琅玕洙曰江淹賦夏簟清兮晝不寐琅玕竹也補注希曰本草唐注云琅玕乃有數種色是琉璃之類且琅玕五色其以青者為勝今出巂州自蠻中及于闐國此言簟似之春酒盃濃琥珀薄洙曰本草琥珀是千年茯苓所化言酒色如琥珀也冰漿椀碧碼碯寒洙曰陸機苦寒行渇飲堅氷漿鄭曰碼音馬碯乃老切石次玉夢符曰古樂府湘東王曰幄中清酒碼碯鍾悞疑茅堂過江麓洙曰堂一作屋巳入風磴霾雲端洙曰陸士衡詩飛陛躡雲端自是秦樓壓鄭谷洙曰秦樓以秦女弄玉吹簫於樓上得仙故曰秦樓鄭谷以鄭子真耕於谷口故曰鄭谷時聞雜佩聲珊珊洙曰孔子入見衛靈公夫人南子自絺帷中再拜環佩玉聲璆然師曰山海經曰崑崙山有琅玕樹其子似珠以珠為簟如琅玕色琥珀出罽賓國初似桃膠凝乃成焉魏文帝碼碯賦序曰碼碯玉屬也出自西域文理交錯有似碼碯因以名之甫有渇疾故喜飲氷漿風磴乃風路也駙馬富貴非谷口貧賤之比雜佩珊珊指公主之環佩也李監宅天寳初作補注鶴曰梁權道編在天寳十三年東都作未詳李監何所人如梁編在東都作則在天寳初作尚覺王孫貴洙曰王孫王者之後亦相尊敬之稱韓信傳哀王孫豪家意頗濃洙曰豪貴之家也屏開金孔雀洙曰隋長孫晟貴盛嘗畫二孔雀於屏間以擇壻褥隠繡芙蓉洙曰刺繡文為芙蓉也師曰隠如隠几之隠倚也且食雙魚美誰看異味重門闌多喜色女婿近乗龍夢符曰按楚國先賢傳孫雋李元禮俱娶太尉桓𤣥女時人謂桓叔元兩女婿俱乗龍言得婿如龍也補注希曰光武紀郡國異味不得有所獻異味二字出左傳子公謂食指動應嘗異味蕭史善吹簫秦穆公以女弄玉妻焉遂教弄玉吹簫作鳳鳴鳳凰來止其屋公為作鳳臺一日弄玉乗鳳蕭史乗龍升天而去重題鄭氏東亭洙曰在新安縣鮑曰即駙馬鄭潜曜天寳三載作補注鶴曰新安縣在河南府當是公天寳三年在東都作前篇宴洞中是夏作此詩乃秋作故詩云秋日亂清暉天寶八九載雖又嘗至東都若是後來作必題云再遊鄭氏東亭不曰重題也謂之重題則紹前一篇故曰同是載作華亭入翠微洙曰爾雅釋名山水及上曰翠㣲薛曰按爾雅釋山疏曰未及頂上在旁坡陀之處名翠微一説山氣青縹色故曰翠微秋日亂清輝洙曰江文通詩秋日懸輝清光謝靈運山水含清崩石欹山樹清漣曳水衣薛曰詩河水清且漣漪水成文曰漣紫鱗衝岸躍紫鱗魚也蒼隼䕶巢歸向晩尋征路殘雲傍馬飛題張氏隠居二首開元二十四年後作補注鶴曰舊史李白傳云少與魯中諸生張叔明等隠於徂徠山號為竹溪六逸又公作雜述亦云魯有張叔卿聰明深察是何面目黧黒不得飽飯喫意叔明叔卿止是一人卿與明有一誤耳不然亦兄弟也今日張隠居豈非其人歟詩云不貪逺害與李傳雜述頗合梁權道編在天寶十二載東都作然十二載公在長安有投哥舒翰詩及十一載十二月有投鮮于京兆詩此詩當是開元二十四年後與髙李遊齊趙時作蓋詩云石門斜日到林丘而輿地廣記云石門屬齊州公嘗與劉九法曹鄭瑕丘宴集于石門也春山無伴獨相求伐木丁丁山更幽洙曰詩伐木丁丁伐木聲也澗道餘寒歴氷雪洙曰一云澗道陸機苦寒行凝冰結重澗積雪被長巒石門斜日到林丘洙曰謝靈運詩落雪洒林丘不貪夜識金銀氣洙曰史天官書敗軍破國之墟下積金寶上皆有氣不可不察以不貪故夜識氣象也遠害朝看麋鹿遊洙曰伍被諫淮南王曰昔子胥諫呉王不用乃曰臣今見麋鹿遊姑蘇之臺今臣亦將見宫中生荆棘露霑衣也乗興杳然迷出處洙曰言不以出處介意也對君疑是泛虚舟洙曰莊子山木篇方舟而濟於河有虚船来觸舟雖有褊心之人不怒人能虚己以遊世孰能害之師曰歴冰雪言甫破雪訪張氏斜日到林丘言所居幽逺也張全身逺害於此與鹿豕遊説者以麋鹿遊姑蘇之臺則誤矣虚舟以喻虚己以遊世之子時相見邀人晚興留補注希曰漢武帝將微行出過陽河渚作樂上見趙飛燕而悦之先是童謡曰燕燕尾涎涎張公子時相見濟洙曰一作霽潭鱣發發洙曰碩人詩鱣鮪發發釋文鱣大魚口在頷下長二三丈江南呼為黄魚與鯉全異發發盛貌春草鹿呦呦洙曰詩呦呦鹿鳴食野之苹註鹿得草呦呦然鳴而相呼也蘇子卿詩云鹿鳴思野草可以喻嘉賓杜酒偏勞勸洙曰魏武帝樂府何以解憂唯有杜康杜康造酒者張梨不外求洙曰潘安仁閒居賦張公大谷之梨前村山路險歸醉每無愁師曰之子指張氏鹿食苹則呦呦而求其類喻張氏之相招也張梨不外求言宴飲惟園果而已意勤不必豐美其物盜賊之險可慮路險宜無愁天寶初南曹小司寇舅於我太夫人堂下累土為山一匱盈尺以代彼朽木承諸焚香瓷甌甌甚安矣旁植慈竹蓋兹數峯嶔岑嬋娟宛有塵外致乃不知興之所至而作是詩天寳元年作補注鶴曰此亦詩之序也不當為題合題曰假山唐志吏部貟外郎二人從六品上一人判南曹兵部貟外郎二人一人掌貢舉雜請一人判南曹皆為尚書侍郎之貳按六典南曹在選曹之南故謂之南曹今題曰南曹小司寇則小司寇為刑部侍郎而唐未聞以侍郎判南曹豈郎亦得稱為小司寇耶謂之天寳初專指為元年故吕汲公魯訔俱編此詩在元年不然則太夫人指公之祖母盧氏盧以天寳三載卒公作誌無姓崔者今從吕魯譜為天寳元年作一匱功盈尺洙曰論語子曰譬如為山未成一匱註匱土籠也三峯意出羣趙曰華山記有云其三峯直上晴霽可睹望中疑在野幽處欲生雲慈竹春隂覆師曰陸機本草疏云南方生子母竹今慈竹是也又謂之孝竹章帝三年子母竹生白虎殿前時謂之孝竹羣臣作孝竹頌補注鶴曰竹紀云慈竹呉蜀皆有之其竹藂生每年笋出不離藂内夏月經雨滴㕔下地生薦似鹿角色白堪食食之已痢本朝國初樂史有慈竹詩以喻兄弟香爐曉勢分洙曰廬山有香爐峯惟南將獻壽洙曰詩如南山之夀佳氣日氛氲龍門魯曰在洛陽之南逺望雙闕對峙如門然鄭曰河南志龍門驛在河南縣南十八里天寶元年作補注鶴曰詳見遊龍門奉先寺注龍門一山連跨數郡今詩云氣色皇居近蓋指東京而言按公天寳元年在東京為姑萬年縣君制服又為墓誌四載又為皇甫妃范陽太君盧氏作墓誌此詩當是其時作故詩又云往來時屢改龍門横野斷驛樹出城來曽鞏曰驛樹言驛道兩畔之樹也氣色皇居近洙曰東都也曽曰言近洛邑也金銀佛寺開洙曰山有佛寺洪覺範曰此蓋謂山有奉先寺佛地有金世界銀世界往來時屢改川陸日悠哉相閲征途上生涯盡幾回趙曰在龍門閲視征行之人盡此生涯能幾回贈李白開元十八年作補注鶴曰按公昔遊詩云昔與髙李輩晚登單父臺史又云甫與李白髙適酒酣登汴州吹䑓則公遊齊趙時多與白俱今詩云痛飲狂歌空度日飛揚跋扈為誰雄指林甫祿山俱跋扈也當是開元十八年在東都作蓋天寳初白已客㑹稽矣秋來相顧尚飄蓬洙曰潘安仁詩譬如野田蓬斡流隨風馭未就丹砂愧葛洪趙曰葛洪以交趾出丹砂求為句漏令痛飲狂歌空度日飛揚跋扈為誰雄洙曰跋扈强梁也質帝以梁冀横當朝羣臣目冀曰此跋扈公趙曰北齊髙祖謂世子曰侯景專制河南十四年常有跋扈飛揚之心補注希曰漢志景星歌雅聲逺佻註云佻僄佻言飛揚也史記孟嘗君勢不兩立為雄陳子昻詩可憐驄馬使白手為誰雄又漢志董卓雖跋扈終竄逃與任城許主簿遊南池天寳元年作鮑曰任城屬兖州補注鶴曰唐志任城為兖州𦂳縣此詩公遊齊趙至兖時所作以後篇登兖州城樓詩論之當是天寳元年末改為魯郡之前作詳見後註秋水通溝洫城隅進小船晩涼看洗馬森木亂鳴蟬菱熟經時雨蒲荒八月天晨朝降白露遙憶舊青氊洙曰王獻之夜臥齋中而有偷人入室盜物都盡獻之徐曰偷兒青氊我家舊物可特置之偷驚走師曰甫悲秋而思故鄉故有是句登兖州城樓開元二十九年前作補注鶴曰輿地廣記隋大業二年改兖州為魯郡唐武徳克徐圓朗復曰兖州天寶元年曰魯郡舊史上元年復為兖州今公以開元二十四年前下第後遊齊趙至此故曰兖州詩當作於開元二十九年之前東郡趨庭日洙曰兖州漢之東郡南樓縱目初浮雲連海岱平野入青徐洙曰禹貢海岱惟青州又海岱及淮惟徐州王禹偁曰海岱青徐皆與兖相接孤嶂秦碑在洙曰秦本紀始皇東行郡縣上鄒嶧山與諸生刻石頌徳李斯作文荒城魯殿餘洙曰王文考魯靈光殿賦序云恭王餘之所立遭漢中微未央及建章之殿悉皆見隳壞而靈光巋然獨存從來多古意臨眺獨躊躇師曰甫感時亂文風不振是以懷古臨眺之際躊躇而不能去矣劉九法曹鄭瑕丘石門宴集開元二十四年巳後作補注鶴曰瑕丘本魯負瑕邑漢屬山陽郡隋開皇十三年復置為魯郡唐復為兖州而瑕丘為兖上縣石門屬齊州此當是開元二十四年已後作兖與齊為鄰至兖則至齊也秋水清無底蕭然淨客心掾曹乗逸興洙曰漢制以曹官為掾如室之掾也言其有所負荷趙曰題是與劉法曹故云掾曹鞍馬去相尋洙曰一云到荒林能吏逢聨璧洙曰潘岳夏侯湛每同行人以為聨璧華筵直一金張詠曰文帝惜百金罷露臺師古曰以為金一兩直十千則百金者一千緡乃中人十家之産也晩來横吹好沈括曰後漢班超假鼓吹註古今樂錄曰横吹胡樂也張騫自西域傳其法於長安唯得摩訶兠勒一曲李延年因之更造新聲二十八解乗興以為武樂後漢以給邉將泓下亦龍吟洙曰馬融長笛賦近世雙笛從羌起羌人伐竹未及已龍鳴水中不見已截竹吹之聲相似暫如臨邑至㟙山湖奉懷李員外率爾成興鄭曰㟙當作厝資昔切縣在臨卬今云如臨邑至㟙山故知當作厝天寳四載作補注鶴曰臨邑唐屬齊州按李邕有登歴下古城貟外新亭詩而公和之自註亭對鵲湖而今題云至㟙山湖奉懷李貟外則㟙山湖即鵲湖也疑㟙與鵲有一誤李貟外皆以李之芳為駕部員外郎而云然李邕唐隆元年𤣥宗清内難召拜殿中侍御史改戸部貟外郎貶崖州舍城丞開元三年擢為戸部郎中自是左遷括州司馬陳州刺史又貶為欽州遵化縣連轉括淄滑三州太守天寳初為汲郡北海二太守六載正月即就郡故殺之則邕亦可稱貟外北海郡為青州今詩云暫遊阻詞伯却望懷青闗蓋公嘗與邕宴歴下亭而却未嘗與之芳至此也當是天寶四載作在邕五載事發之前是年公西歸咸陽野亭逼湖水歇馬髙林間鼉吼風奔浪洙曰鼉吼則風起魚跳日映山洙曰日暖魚跳躍暫遊阻詞伯却望懷青闗趙曰詞伯指李貟外也王兖論衡文詞之伯也李應在青闗故有回望之句藹藹生雲霧唯應促駕還洙曰促駕猶速駕師曰詞伯詞人之長也指李貟外青闗地名李之所居生雲霧謂天將雨故曽車馬速歸也補注杜詩巻十七
