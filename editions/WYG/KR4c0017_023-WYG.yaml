body:
  text: 補注杜詩巻二十三宋黄希原本黄鶴補注奉和嚴中丞西城晩眺十韻寳應元年作補注鶴曰題云嚴中丞則是寳應元年作同年有說旱公初中丞嚴公莭制劒南日奉此說今詩云廉頗岀将頻謂武屢為蜀郡守帥矣又云政簡移風速層城臨媚景絶域望餘春史謂上元二年建丑月以武為成都尹而此詩作於寳應元年之春故云魯訔年譜亦云是年武至成都和此詩汲黯匡君切洙曰前漢汲黯以數切諌不得久留内遷於東海太守武帝曰古有社稷之臣如汲黯近之矣廉頗出将頻洙曰史記廉頗趙之良将頻為趙将兵破齊魏直詞才不世雄略動如神洙曰取汲黯之直言廉頗之雄畧以美嚴公也政簡移風速洙曰史記世家太公至國修政因其俗簡其禮故五月而報政成周公曰政不簡不易民不有近詩清立意新余曰吕氏童蒙訓老杜詩云詩清立意新最是作詩用力處葢不可循習陳言只規摹舊作也層城臨媚洙曰一作暇景絶域望餘春洙曰層城髙城也絶域逺域也言蜀與京畿逺絶旗尾蛟龍㑹樓頭鷰雀馴洙曰禮蛟龍為旗師曰公之德及烏獸也補注希曰燕雀且馴在民可知此政簡移風速之證古者信及豚魚化行蝗虎不過如此地平江動蜀天濶樹浮秦趙曰此兩句張大城上所望之逺也帝念深分閫洙曰馮唐曰上古王者之遣将也跪而推轂曰閫以内者寡人制之閫以外者将軍制之軍須逺算緡洙曰軍須師旅之費也漢武帝元狩四年初算緡錢李旻曰緡絲也以貫錢出算二十也師古曰謂有儲積錢者其緡貫而稅之花羅封蛺蝶瑞錦送麒麟洙曰蛺蝶麒麟羅錦上絲繡也蘇曰漢武時西域獻蛺蝶羅日本國貢麒麟錦十端金花眩人眼目趙曰言嚴公入貢不忘朝廷也辭第輸高義洙曰霍去病傳上為治第令視之對曰匈奴未滅無以家為由此上益重愛之觀圖憶古人洙曰馬援傳顯宗圖畫建武名臣列将於雲臺以椒房故不及馬援東平王蒼觀圖言於帝曰何故不畫伏波将軍像帝哭而不言征南多興緒事業闇相親晉杜預作征南将軍興緒公自為緒以預為祖嚴中丞枉駕見過寳應元年作洙曰嚴自東川除西川勑令兩川都節制一本云嚴黄門枉駕見過補注鶴曰按史廣德二年正月令劒南東西川合為一道以黄門侍郎嚴武為節度此詩既曰川合東西而題云嚴中丞何也趙曰公自注云嚴自東川除西川勑令都節制則是未合為一道時故得稱為中丞葢廣德元年十月武方拜黄門侍郎當是寳應元年權令兩川都節制時作若以一本作嚴黄門為是則廣德二年武再尹成都時公已入其幕府不應詩云扁舟不獨如張翰白帽兼應似管寧元戎小隊出郊坰洙曰詩六月元戎十乗以先啟行注元大也夏后曰鈎車先正也殷曰寅車先疾也周曰元戎先良也爾雅曰邑外謂之郊林外謂之坰補注希曰董賢傳統辟元戎師古曰元戎大衆也今觀詩意以武為元戎則詩注為大者乃公所本問栁尋花到野亭川合東西瞻使節洙曰元宗在蜀合東西兩川為一道以武為尹地分南北任流洙曰一作孤萍趙曰公自言也自蜀望長安則長安為北而蜀為南也扁舟不獨如張翰洙曰晉文苑傳張翰字季鷹㑹稽賀循赴命入洛經吳閶門於船中彈琴翰初不相識乃就循言談便相欽悅翰曰吾亦有事北京便同載即去而不告家人後為齊王曹囧曹掾因見秋風起思蓴鱸遂命駕南歸白帽應兼似管寧洙曰魏青龍中徴命管寧不至居海上常著白帽布襦袴而巳補注希曰貨殖傳乃乗扁舟孟康曰特舟也白帽見别董頲詩注寂寞洙曰一作今日江天雲霧裏何人道有少微星洙曰隋天文志少微四星在太微西士大夫之位也一名處士明黄則賢士舉江畔獨歩尋花七絶句寳應元年作補注鶴曰江畔一本作江上詩云東望少城花滿烟當是在浣花作從舊次為寶應元年江上被花惱不徹無處告訴只顛狂走覔南鄰愛酒伴經旬出飲獨空牀洙曰斛斯融吾酒徒補注希曰公有南鄰詩又有過南鄰朱山人水亭詩而舊注以為斛斯融融即斛斯六官也公有聞斛斯六官未歸詩云歸來省酒眠則又似是酒徒稠花亂蘂畏一作裹江濵行步欹危實怕春詩酒尚堪驅使在未須料理白頭人江深竹静兩三家多事紅花映白花報答春光知有處應須美酒送生涯東望少城花滿煙洙曰梁益記云少城張儀城蒼舒曰按左太冲蜀都賊亞以少城接乎其西市㕓所舎商賈之淵注少城小城也在城西市在其中百花高樓更可憐補注希曰百花樓百花潭上之樓也誰能載酒開金盞洙曰盞一作鎖揚雄家素貧耆酒人希至其門有好事者載酒從學喚取佳人舞繡筵黄師塔前江水東春光懶困倚微風桃花一簇開無主可愛深紅愛一作映淺紅黄四娘家花滿蹊千朶萬朶壓枝低留連戱蝶時時舞自在嬌鶯恰恰啼蘇曰齊魯大臣史失其名黄四娘者獨何人哉因託是詩而不朽不是愛花即欲死只恐花盡老相催繁枝容易紛紛落嫩葉一作蘂商量細細開春水生二絶上元二年作補注鶴曰詩云門前小灘渾欲平當是在浣花作梁權道編在寳應元年然是年春旱自十月不雨至建夘月而旱年說所由作也當是上元二二月六夜春水生洙曰孫權傳春水方生門前小灘一作籬渾欲平鸕鷀鸂䳵莫漫喜吾與汝曹俱眼明趙曰二禽見水生而喜公語之以與汝曹俱眼明則公可謂與物委蛇而同其波矣一夜水高二尺强數日不可更禁當南市津頭有船賣無錢即買繫籬傍春夜喜雨上元二年作補注鶴曰詩云花重錦官城則是成都詩梁權道亦編在寳應元年然是年春旱當是上元二年作好雨知時節洙曰洪範休應則時若當春乃發生一作及隨風潛入夜潤物細無聲如膏也野徑雲俱黑江船火獨明曉看經一作紅濕處花重錦官城洙曰蜀城人以江山明媚錯雜如繡故多呼錦官城江頭五詠彦輔曰王筠有才名沈約重之約於郊居作齋閭請筠作草木十詠書之於壁皆直寫之並不加篇題約曰此詩指物呈形無假題署補注鶴曰江頭即前所謂江畔獨歩尋花處以是日所見入詠從舊次為寳應元年作五篇皆有意寓當熟味之丁香丁香體柔弱亂結枝猶墊鄭曰都念切下也細葉帶浮毛踈花披素艶深栽小齋後庶近幽人占晩墮蘭麝中休懐粉身念洙曰言丁香結實則墮於蘭麝間而有粉身之患也補注鶴曰此篇言公見棄逺方漁樵為伍不復更懐末路之榮自貽粉身之患麗春補注鶴曰此篇言競進者多而公獨流轉逺僻少有知巳者百草競春華麗春應最勝少須好顔色多漫枝條剰紛紛桃李枝處處總能移如何貴此種洙曰一作稀如可貴重却怕有人知梔子魯曰漢書曰梔茜園注梔支子也本草曰支子一名木丹晉宫閤名曰華林囿者梔子五株名山志曰樓石山多梔子齊謝眺有牆花梔子樹詩梁簡文帝有詠梔子花詩補注鶴曰此篇言公飽歴風霜雨露而獨見遺於外也佛書為薝蔔花佛說譬如入薝蔔林中惟􅀈薝蔔不聞餘香禪月詩云白薝蔔花露滴滴山谷云染梔子花六出雖香不濃郁山梔子花八出一株可香一園梔子比衆木人間誠未多於身色有用洙曰蜀人取梔子色以染帛與道氣傷和梔性絶冷紅取風霜實洙曰實經霜則紅青看雨露柯無情移得汝貴在映江波鸂䳵彦輔曰臨海異物志鸂䳵水鳥毛有五色食短狐其在溪中無毒氣補注鶴曰此篇言公失位於外無心孤進雖有留滯之嘆而無搏撃之虞故使籠寛織須知動損毛看雲莫悵望失水任呼號六翮曽經剪夢符曰按韓詩外傳曰鴻飛千里特六翮耳孤飛卒未高且無鷹隼慮留滯莫辭勞洙曰謝惠連鸂䳵賦㩁羽翮於翩翻又云宛羈畜於籠樊花鴨補注鶴曰此篇言公以直言受妬而出居於外雖有一飽之適猶以先鳴為戒花鴨無泥滓堦前一作中庭每緩行羽毛知獨立黑白太分明洙曰諸葛謂張温其人於清濁太明善惡不分不覺羣心妬休牽衆眼驚稻粱霑一作知汝在作意莫先鳴野望寳應元年作補注鶴曰詩首云西山白雪三城戍南浦清江萬里橋當是在成都作公以寳應元年四月送嚴武至綿州遂入梓州秋歸挈家往梓此詩未去綿時作西山白雪三城戍洙曰按新史髙適傳上皇還京復分劒南為兩節度百姓弊於調度而西山三城列戍適上疏論之不納蘇曰西山雪嶺松州蕃界也趙曰舊本作三年非南浦清江萬里橋鄭曰成都第三橋趙曰公草堂在萬里橋西海内風塵諸弟隔天涯涕淚一身遙洙曰冦亂諸弟離散獨公一人入蜀唯将遲暮供多病未有涓埃答聖朝跨馬出郊時極目不堪人事日蕭條官池春鴈寳應元年作補注鶴曰漢州城西池乃房琯所鑿今曰官池即城西池也公送嚴武至綿道出漢故至官池按九域志成都北至漢不滿百里而漢東北至綿不滿二百里葢漢在成都綿州之間當是寳應元年五月而今詩云青春欲盡何也自古稻粱多不足至今鸂䳵亂為羣且休悵望看春水更恐歸飛隔暮雲師曰鴈有序喻兄弟冦亂諸弟離散有阻隔故云歸飛隔暮雲青春欲盡急還鄉紫塞寧論尚有霜洙曰蕪城賦北走紫塞鴈門翅在雲天終不逺力微繒繳絶須防夢符曰按文選班固兩都賦撫鴻罿御繒繳師曰繒繳言以繩繫矢而射之水檻遣興二首寳應元年作補注鶴曰公有水檻在草堂前嘗試水檻詩云茅軒駕巨浪是也此詩云去郭軒楹敞無村眺望賖又云蜀天常夜雨江檻已朝晴又云澄江平少岸則作是詩時方雨而霽當在寳應元年建巳月得雨後前乎此旱也去郭軒楹敞無村眺望賖澄江平少岸幽樹晩多花細雨魚兒出微風鷰子斜城中十萬户此地兩三家補注希曰唐志成都户十六萬九百五十此云城中十萬户雖未必及此數亦誇其盛耳蜀天常夜雨尹曰蜀雅州常多隂雨號曰漏天江檻巳朝晴葉潤林塘密衣乾枕席清不堪秪老病何得尚浮名淺把涓涓酒深憑送此生屏跡二首用拙存吾道幽居近物情桑麻深雨露燕雀半生成村鼓時時急漁舟箇箇輕杖藜從白首趙曰荘子原憲杖藜而應門心迹喜雙清蘇曰阮瑀白首杖藜來往亦鄉里中風流事謝靈運齋中讀書詩曰昔余逰京華未嘗廢坵壑矧乃歸山川心迹雙寂寞梅曰心迹雙清無塵俗氣也曉起家何事無營地轉幽竹光團野色舎一作山影漾江流失學從兒懶長貧任婦愁百年渾得醉一月不梳頭寄題杜二錦江野亭成都尹嚴武作漫向江頭把釣竿懶眠沙草愛風湍莫倚善題鸚鵡賦洙曰襧衡為黄祖作鸚鵡賦筆不停綴文不加㸃何須不著鵕䴊冠洙曰佞幸傳孝惠時皆冠鵕䴊冠貝帶傳脂粉化閎籍之屬也鵕䴊鳥名也以羽飾於冠趙曰以子美之才如禰衡而剛直不肯為侍中冠鵕䴊厠佞臣之側補注希曰師古云鵕䴊鷩鳥也似山鷄而小冠背毛黄腹下赤項緑色其尾毛紅赤光悉鮮明今俗呼為山雞其實非也腹中書籍幽時曬洙曰郝隆七月七日曬腹於庭中人問之曰我曬腹中書肘復醫方静處看洙曰葛供傳洪抄金匱藥方一百巻肘後要急方四巻興發㑹能馳駿馬終須直到使君灘洙曰駿一作五補注希曰九域志使君灘在萬州而雲安亦有之奉酬嚴公寄題野亭之作寳應元年作補注鶴曰稱公而不曰鄭公未封鄭也為中丞大夫時作如後篇云中丞嚴公是也詩云枉沐旌麾出城守即前所謂嚴中丞枉駕見過當在寳應元年拾遺曽奏數行書洙曰公曽任左拾遺懶性從來水竹居奉引濫騎沙苑馬洙曰赭白馬賦弭雄姿以奉引公有沙苑馬詩趙曰拾遺掌供奉則騎馬以奉引幽棲真釣錦江魚謝安不倦登臨費洙曰以謝安比嚴公也安寓居㑹稽與王羲之髙陽許詢桑門支遁逰處出則漁弋山水每往臨安山中坐石室臨濟谷放情坵壑然每逰賞處必以妓女從之阮籍焉知禮法踈洙曰阮籍性踈懶至為禮法之士疾之如讎焉師曰唐於沙苑置坊監養馬甫為拾遺侍肅宗收復京師奉引者導駕也武數過子美草堂攜酒餽遺頗厚故云謝安不倦登臨費阮籍焉知禮法踈公自釋不著鵕䴊冠之罪也枉沐洙曰一作今日旌麾出城府草茅無洙曰一作荒逕欲教鋤洙曰卜居賦寧誅鋤草茅以力耕乎中丞嚴公雨中垂寄見憶一絶奉答二絶補注鶴曰詩云雨映行宫辱贈詩當是寳應元年建己月得雨時作行宫謂明皇嘗幸成都故云雨映行宫辱贈詩元戎肯赴野人期洙曰一云元戎欲動野人知江邊老病雖無力强擬晴天理釣絲何日雨晴雲出溪白沙青石光洙曰一云洗無泥只須伐竹開荒徑拄杖穿花聽馬嘶洙曰一作鳥啼趙曰側聽嚴公之馬嘶也謝嚴中丞送青城山道士乳酒一瓶寳應元年作補注鶴曰題云嚴中丞則是寳應元年山瓶乳酒下青雲氣味濃香幸見分鳴鞭走送憐漁父趙曰謝靈運詩鳴鞭適太阿漁父公自謂也洗盞開嘗對馬軍洙曰軍州謂馬軍葢以騎兵送酒趙曰公自注軍州謂驅使騎為馬軍以漁父對馬字為工矣師曰遣馬軍走送乳酒補注希曰錦屏山題名有記河南府使馬軍送新酒者漁父亦以避世隐身而言嚴公仲夏枉駕草堂攜酒饌寳應元年作魯曰得寒字一云鄭公枉駕擕饌訪水亭補注鶴曰既題云嚴公則是寳應元年嚴未赴召時作按舊史記元年四月庚戌朔十八日丁夘肅宗崩於長生殿是月二十日巳已代宗即位史云代宗即位召武者非即位之日也故五月猶能枉駕草堂若以一云鄭公枉駕擕饌訪水亭為是則此詩不在廣德二年五月即在永泰元年五月作然鄭公廣德二年春再鎮蜀而公以是年春晩歸草堂有猶得見殘春之句而所謂水檻者巳為水損水檻詩云逰子久在外門户無人持髙岸尚為谷何傷浮柱欹則非其年亦明永泰五月嚴公已薨當在寳應元年五月作竹裏行厨洗玉盤花邉立馬簇金鞍蒼舒曰古樂府對酒行金樽清俊滯玉盤亟來親又白馬行白馬黄金鞍蹀躞栁城前又輕薄篇象牀沓繡被玉盤傳騎食非關使者徴求急趙曰荘子載顔閤守陋閭魯君之使者至閤對曰恐聽者謬而遺使者罪不若審之使者還反審之復求之不得矣自識将軍禮數寛洙曰稽唐書云阮籍為禮法之士所繩頼大将軍保持之百年地闢柴門逈五月江深草閤寒看弄漁舟移白日老農何有罄交歡趙曰老農公自言也嚴公㕔宴同詠蜀道畫圖得空字作寳應元年補注鶴曰題云嚴公㕔則是寳應元年作日臨公館静畫列地圖雄劒閤星橋北洙曰華陽記李冰造七星橋上應七星松州雪嶺東洙曰西山有松州當吐蕃要衝也趙曰雪嶺在令威州之外冬夏常雪華夷山不斷吳蜀水相通興與煙霞㑹清樽幸不空奉送嚴公入朝十韻寳應元年夏作補注鶴曰詩云鼎湖瞻望逺象闕憲章新正謂肅宗晏駕代宗即位又云宫鶯罷囀春乃寳應元年夏作鼎湖瞻望逺趙曰前漢郊祀志黄帝采首山銅鑄鼎於荆山下鼎成龍有垂胡鬚下迎後世因名其處曰鼎湖象闕憲章新洙曰陸公佐石闕銘以為象闕之制其來巳逺春秋設舊章之教經禮垂布憲之文四海猶多難中原憶舊臣與時安反側自昔有經綸感激張天歩洙曰劉越石詩鄧生何感激千里來相求從容静塞塵南圖回羽翮洙曰荘子夫鵬九萬里而圖南趙曰言嚴公入朝如鵬之圖南也北極捧星辰漏鼓還思晝宫鶯罷囀春空留玊帳術趙曰唐藝文志有玉帳經一巻葢兵書也愁殺錦城人趙曰人思戀之也閤道通丹地洙曰禁中謂之彤庭言丹地也張正已艶歌執㦸趨丹地江潭隱白蘋洙曰栁渾詩汀洲採白蘋趙曰公自言也爾雅曰萍之大者曰蘋也此生那老蜀不死㑹歸秦公若登臺輔臨危莫愛身洙曰言當殺身成仁酬别杜二新添作嚴武獨逢堯典日再覩漢官時未效風霜勁空慙雨露私夜鍾清萬户曙漏拂千旗並向殊庭謁俱承别館追斗城憐舊路渦水惜歸期峰樹還相伴江雲更對垂試回滄海棹莫妬敬亭詩秪是書應寄無忘酒共持但令心事在未肯鬢毛衰最悵巴山裏清猿惱夣思與嚴二歸奉禮别新添年廣徳元作補注鶴曰詩云遥聞盛禮新又云山東羣盗散闕下受降頻當是廣德元年在閬州作故詩又云巴俗自為鄰舊次在嚴公入朝詩後而梁權道從而編在寳應元年非詳見注唐志太常寺奉禮二人掌朝㑹祭祀君臣之版位漢大鴻臚有治禮郎後齊為奉禮後周為理禮隋又為奉禮唐因之别君誰暖眼将老病纒身出涕同斜日臨風看去塵商歌還入夜巴俗自為隣尚愧微軀在遙聞盛禮新山東羣盗散闕下受降頻補注鶴曰山東羣盜謂來瑱自襄陽朝京師分諸将戍福昌南陽瑱誅戍者潰是時薛嵩以四州降張忠志以五州降張獻誠以汴州降李懐仙以幽州降田承嗣以魏州降故云受降頻其降在寳應元年冬廣德元年春諸将歸應盡題書報旅人送嚴侍郎到綿州同登杜使君江樓宴得心字補注鶴曰嚴公寳應元年赴召時未為黄門侍郎其再以黄門侍郎尹成都又薨於官乃題之者誤此詩寳應元年五六月作野興每難盡江樓延賞心歸朝送使節落景惜登臨稍稍煙集渚微微風動襟重船依淺瀬輕鳥度層隂檻峻背幽谷窗虛交茂林燈光散逺近月彩静髙深城擁朝來客師曰言滿城擁送侍郎之來天横醉後參師曰參西方之宿蜀在西以江樓之髙逼於參星窮途衰謝意苦調短長吟此㑹共能幾諸孫賢至今師曰杜使君乃宗人不勞朱戸閉自待白河沈趙曰白河謂銀河也師曰白河沈言天曙不現不勞閉户坐待白河沈也奉濟驛重送嚴公四韻寳應元年作補注鶴曰奉濟驛在綿州同是寳應元年作逺送從此别青山空復情補注希曰謝元暉詩嬋娟空復情幾時盃重把昨夜月同行列郡謳謌惜三朝出入榮洙曰三朝武仕明皇肅代也江村獨歸處一作去寂寞養殘生巴西驛亭觀江漲呈竇使君廣德元年春作補注鶴曰綿州號巴西郡詩云萬井逼舂容則非寳應元年夏作當是廣德元年春自梓州送辛員外暫至綿州時作後有又呈竇使君詩亦云日兼春有暮梁權道以又呈詩為廣德元年作却以此詩并又一首為寳應元年作何不考也宿雨南江漲波濤亂逺峰補注希曰按志蜀有中江北二江而不言南江巴西為綿州今云巴西驛亭觀江漲則所謂南江其岷江歟岷山出茂州而茂與綿為隣孤亭凌噴薄洙曰見直氣森噴薄汪萬井逼舂容趙曰記注舂容謂重撃鍾也霄漢愁髙鳥黄曰鳥愁言不得其食泥沙困老龍蘇曰吳漢老龍失勢暫困泥沙天邊同客舎攜我豁心胷又一首補注鶴曰與前篇同時作轉驚波作怒即恐岸隨流賴有杯中物還同海上鷗黄曰列子海上人好鷗鳥其父欲取玩之明日之海上鷗鳥舞而不下關心小剡縣傍眼見揚州補注希曰剡溪漢置屬㑹稽郡而揚州在淮南公觀江漲於巴西驛亭而及此者葢借以喻水之大也為接情人飲朝來減片愁又呈竇使君廣德元年春作補注鶴曰詩云向晩波微緑又云日兼春有暮皆是言春當是廣德元年春作向晩波微緑連空㟁脚青日兼春有暮愁與醉無醒漂泊猶盃酒踟蹰此驛亭相看萬里别同是一浮萍遣憂新添年廣徳元作補注鶴曰詩云亂離知又甚又云隋氏留宫室焚燒何太頻當是廣德元年吐蕃陷京師時作代宗惟不受諌故程元載輩又從而召亂太常博士栁伉上䟽其詞切直豈虛言哉公至是亦有受諌無今日之句可謂憂國之言也亂離知又甚消息苦難真受諫無今日臨危憶古人紛紛乗白馬攘攘著黄巾隋氏留宫室焚燒何太頻早花新添年廣徳元作補注鶴曰詩云西京安穩未又云臘月巴江曲當是廣德元年十二月閬州作西京安穩未不見一人來補注鶴曰西京謂長安志云天寳六年曰西京至德二年曰中京上元二年復曰西京肅宗元年曰上都按紀上元二年曰上都志誤此云西京安穏未又云臘月巴江曲為廣徳二年十月吐蕃陥京師代宗幸陜十二月至自陜不曰上都而曰西京者循其舊名也臘月巴江曲山花已自開盈盈當雪杏豔豔待香梅直苦風塵暗誰憂客鬢催巴山新添年廣徳元作補注鶴曰此詩廣德元年十一月公在閬州作閬居巴子國之中故曰巴山前詩所謂臘月巴江曲是也代宗以是年十二月還京而此云乗輿恐未回故知其為十一月作梁權道編在寳應元年非巴山遇中使云自陜城來盜賊還奔突乗輿恐未回天寒邵伯樹地濶望仙臺狼狽風塵裏羣臣安在哉收京新添二廣徳二年十月作補注鶴曰既題為收京又詩云衣冠却扈從車馬巳還宫則是廣德二年十二月作也復道收京邑兼聞殺犬戎衣冠却扈從車馬巳還宫尅復誠如此扶持在數公莫令回首地慟哭起悲風巴西聞收京送班司馬入京新添年廣徳二作補注鶴曰巴西指綿州當是廣德二年春公在綿州作故詩云劒外春天逺巴西勑使稀與後篇當合為一隋志上州置司煬帝罷置贊務唐上中下州皆有司馬梁權道編在廣德元年收京後是不攷劒外春天逺之句也聞道收宗廟鳴鑾自陜歸傾都看黄屋正殿引朱衣本中曰黄屋車葢也劒外春天逺巴西勑使稀念君經世亂疋馬向王畿送司馬入京新添年廣徳二作補注鶴曰與前篇同作後人妄分為二當合為一題曰送班司馬入京二首班司馬意是班宏按舊史云為髙適劒南判官累拜大理司直攝監察御史疑誤以司直為司馬也羣盗至今日先朝忝從臣歎君能戀主久客羡歸秦黄閤長司諌丹墀有故人向來論社稷為話涕霑巾花底新添春廣徳元年作補注鶴曰當在遣憂之前廣德元年春同栁邉在梓州作紫萼扶千蘂黄鬚照萬花忽疑行暮雨何事入朝霞恐是潘安縣堪留衛玠車蘇曰潘岳為河陽令植桃李花人號曰河陽一縣花衛玠在羣伍中有異所至看者如堵號為璧人常乗白羊車深知好顔色莫作委泥沙栁邊新添春廣徳元年作補注鶴曰詩云漢南應老盡當是在梓州作廣德元年春只道梅花發那知栁亦新枝枝總到地葉葉自開春紫燕時翻翼黄鸝不露身漢南應老盡灞上逺愁人城上廣德元年作補注鶴曰詩云八駿隨天子羣臣從武皇當是廣德元年十二月閬州作而梁權道編在是年春綿州作徒惑於草滿巴西緑之句而不知代宗未出幸也要之綿閬皆可為巴西詳見注草滿巴西緑空城白日長風吹花片片春動水茫茫八駿隨天子洙曰王子年拾遺記周穆王巡行天下馭八龍之駿名曰絶地翻羽奔宵超影踰輝超光騰霧挾翼穆王神智逺謀使車轍跡周於四海羣臣從武皇趙曰漢武帝初幸汾隂至洛陽寝尋於泰山其所巡幸周萬八千里遥聞出巡守早晩遍遐荒趙曰不敢言天子蒙塵姑以巡守微言之師曰禄山亂元宗出幸蜀蜀在巴之西昔周穆王漢武帝皆出巡守以比元宗之西幸也天子諱言出奔特云巡守亦若春秋書天王出狩於河陽是也補注鶴曰明皇以天寳十五載六月幸蜀是時公在畿縣無由言草滿巴西緑師注為非至於引春秋以比唐君之出奔正是此詩當是言代宗廣德元年幸陜代宗還京在十二月甲午時已逼歲公未之知也故云春動巴西地暖而草已緑滿亦其當然梁權道以此遽謂是元年春作殊失之翫月呈漢中王寳應元年作補注鶴曰漢中令興元府漢中王名瑀讓皇帝之子乾元二年使回紇回以東率百官馬得罪貶蓬州長史寳應元年公在章梓州水亭與之同㑹有近屬淮王至之句此詩當同時在梓州作故云江月滿江城也詩又云歸舟應獨行乃瑀自是出峽梁權道亦編在寳應元年夜深露氣清江月滿江城浮洙曰一作游客轉危坐歸舟應獨行關山同一照鳥鵲自多驚欲得淮王術風吹暈巳生洙曰古詩千里共明月樂府月明星稀鳥鵲南飛淮南子月隨灰而暈闕注云以蘆灰環月缺其一面暈亦隨而闕鄭曰日月傍氣田曰樂府關山月云天寒光轉白風生暈欲生補注希曰照或作㸃嘗見善本如此故東坡有一㸃明月之詞如淳曰暈讀曰運孟康曰日傍氣圎覺經雲駚月暈陪王漢州留杜綿州泛房公西湖廣德元年作補注鶴曰西湖在漢州即前所謂城西池也當是公廣德元年再至漢州故有此作若以為寳應元年夏到漢時作則詩不應云春池賞不稀又其年杜綿州未去巴西公與嚴武嘗同登樓今至漢州意是受代而之成都故公又有巴西驛亭觀江漲呈竇使君詩及又呈竇使君詩巴西邑即在綿州皆春作也舊相恩追後春池賞不稀洙曰房琯相肅宗以事謫官後為漢州刺史湖琯所鑿也闕庭分未到舟檝有光輝䜴化蓴絲熟洙曰世說王武子前有羊酪指示陸雲雲曰千里蓴羮但未下鹽䜴師曰唐吳筠隱不仕帝賜以湖為扁舟之樂甫雖未䝉朝廷之賜然舟檝亦有光輝矣本草云蓴生水中葉似鳬葵採莖堪啖花黄白子紫色三月至八月莖細如釵股通名為絲蓴刀鳴鱠縷飛趙曰潘安仁西征賦云饔人切縷鑾刀若飛使君雙皂葢灘淺正相依洙曰漢二千石皂葢朱幡舟前小鵝兒洙曰漢州城西北角宫池作補注鶴曰以舊注當是寳應元年作鵝兒黄似酒對酒愛新鵝引頸嗔船逼無行亂鴈多補注希曰爾雅注引聘禮云私覿愉愉焉出如舒鴈鄭注云威儀自然而有行列也鵝一名舒鴈羲之愛其宛頸而今乃引頸所以見其嗔也翅開遭宿雨力小困滄波客散層城暮狐狸奈若何得房公池鵝廣德元年作補注鶴曰房琯上元元年八月為漢州刺史鑿城西池寳應二年四月拜特進刑部尚書在路遇疾八月薨於閬州公有祭文是年改廣德此詩當作於其年拜特進時故有鳯凰池上應回首葢期之再入也房相西池鵝一羣眠沙泛浦白於雲鳯凰池上應迴首洙曰見鳯沼接亨衢注為報籠隨王右軍師曰王羲之性愛鵝道士常以鵝易其字補注杜詩巻二十三
