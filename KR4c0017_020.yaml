body:
  text: 補注杜詩卷二十宋黃希原本黃鶴補注秦州雜詩二十首乾元二年作鄭曰寰宇記魏初中分隴右為秦州師曰甫論房琯事貶華州司功屬關輔飢棄官去客秦州遂有此作補注鶴曰公以乾元二年夏之秦史云貧采橡栗自給此詩當是其年秋作滿目悲生事因人作逺遊師曰因琯有此逰也遲回度隴怯浩蕩及一作又關愁水落魚龍夜山空鳥鼠秋洙曰秦有魚龍川鳥鼠谷名禹貢所謂鳥鼠同穴者蘇曰倦逰録隴州地名魚隴出石魚掘地破石得之多鰍鯽之形鱗鬛俱備狀如描畫魚龍古之陂澤也豈非魚生其中山頽塞久而土凝為石遂留形迹此詩正謂隴川沈曰太平御覽載水經注有一水出天水縣西山人謂之小隴山其水出五色魚俗以為龍而莫敢捕謂是水為魚龍水鄭曰鳥鼠共為雌雄同穴而處補注希曰舊史太宗紀貞觀四年十月幸隴州十三日校獵於魚龍川自是隴州地名書終南惇物至於鳥鼠注三山名言相望又西傾朱圉鳥鼠注云渭水所出在隴西之西爾雅釋鳥鼠同穴山在隴西首陽縣隴西唐為渭州唐志髙宗上元二年更渭源為首陽儀鳳三年省首陽入渭陽有鳥鼠同穴山一名青雀山西征問烽火心折此淹留洙曰别賦心折骨驚趙曰時有吐蕃之亂蘇曰王戎非吾願在此淹留每想故園風物客心將折秦州山一作城北寺勝迹一云傳是隗囂宫洙曰後漢隗囂據隴西天水郡寺即隗囂故居苔蘚山門古一作故丹青野殿空月眀垂葉露雲逐度溪風蘇曰李隱尋友人不見謂童曰何往童不答又曰主人何往童曰白雲無心逐風度溪耳李驚異久之清渭無情極愁時獨向東師曰言東望燕薊之亂故愁也州圖領同谷驛道出流沙洙曰同谷縣名流沙地名鄭曰寰宇記成州禹貢梁州之域古西南夷地天寶元年改為同谷郡流沙西域地名補注鶴曰秦州天寶元年改為天水郡依舊都督府督天水隴西同谷三郡故云領同谷非謂領同谷縣也圖乃圖志之謂流沙即書所謂西被於流沙也唐使者使吐蕃過鄯州之西赤嶺分界牌即經莫離那録驛又至衆龍驛劉驛婆驛之類其名非一近贊普牙帳勃勃令驛故曰驛道降虜兼千帳居人有萬家馬驕珠汗落趙曰傅元乘輿馬賦流汗如珠胡舞白蹄斜蹄一作題夢符曰按南史裴子野傳時西北逺邉有白題入貢莫知所出子野曰漢頴隂侯斬白題一人服虔曰白題胡名也年少臨洮子洙曰子一作至臨洮郡名西來亦自誇師曰臨洮通羌胡其人驍勇善戰願隨王師擊賊故云補注鶴曰臨洮人勇徑可備戎如通鑑載大厯二年李抱玉使右軍都將臨洮李晟擊吐蕃晟將千人出大震關至臨洮屠定秦堡是也鼓角緣邊郡川原欲夜時秋聽殷地發風散入雲悲趙曰此詠鼓角也當秋而聞則可悲矣抱葉寒蟬靜歸山獨鳥遲蘇曰古詩有夕鳥背山遲又歸林孤鳥遲逸曰獨鳥失羣之鳥公自喻也萬方一作年聲一槩趙曰時東有安史之亂西有吐蕃之擾故曰聲一槩吾道竟何之洙曰戎馬之際天下皆有鼓角聲人方以武事為急吾道何所施趙曰孔子云吾道非耶莊子茫乎何之南使宜天馬由來萬匹強趙曰此篇專賦天馬也出漢書初天子發易卜之曰神馬當從西北來得烏孫馬號曰天馬補注鶴曰此篇雖専賦天馬然豈無因而賦蓋秦州有馬池源出嶓冢山開山圖云隴西神馬山有泉池龍馬所生故云浮雲連陳沒秋草遍山長洙曰遍一作滿聞説真龍種仍殘老驌驦洙曰天馬徠龍種也仍殘一云空餘趙曰左傳唐成公如楚有兩驌驦唐人語以餘為殘蓋言所餘驌驦遺而不用於戰故哀鳴思戰鬬也豈非公自况耶補注希曰一本注云真龍種喻元帥代宗也老驌驦喻巳不見用哀鳴思戰鬬逈立向蒼蒼師曰言巳雖有千里之才奈老而不用何城上胡笳奏山邊漢節歸趙曰言用兵以禦吐畨也使蘇武持漢節事言通使於吐畨爾防河赴滄海奉詔發金徽蒼舒曰按續唐通典羈縻州有金徽𨽻振武軍也趙曰防河之士自金徽而發也鄭曰金徽隴右地名補注鶴曰唐會要單于都護府永徽元年九月左衛中郎髙􅀈置單于瀚海二都督府瀚海領金徽新黎等七都督府仙蕚賀蘭等八州舊注謂金徽𨽻振武軍按舊唐志朔方莭度使統經略安北都護振武等七軍府注云振武軍在單于東都護府又元和七年正月振府界黃河溢毁東受降城兹河患所以當防也滄海本號渤海郡去海為近又九域志濵州有秦臺郡國志云秦始皇東逰築此臺以望東海當是河水東入海防其泛溢者雖非一處而大槩河之上流狹隘尤宜隄防故於金徽為急也士苦形骸黑趙曰士卒勞苦之故旌一作林踈鳥獸稀那堪往來戍恨解鄴城圍洙曰鄴城史思明所據恨解圍者言士苦於征戍而恨賊之未平也莽莽萬重山孤城山一作石谷間無風雲出塞不夜月臨關趙曰今秦州有無風塞不夜城後人因杜詩而為之名也田曰齊地記曰齊地有不夜城蓋古者有月夜中照於東境故菜子立此城以不夜為名師曰云不夜蓋取月明如晝也屬國歸何晚洙曰蘇武歸漢為典屬國樓蘭斬未還洙曰傅介子傳先是龜兹樓蘭嘗殺漢使者介子持節使誅斬樓蘭王安歸首懸之北闕以直報怨不煩師衆詔封介子為義陽侯煙塵一一作獨長望衰颯正摧一作催顔聞道尋源使從天此路回洙曰張騫尋河源趙曰時遣使吐畨云尋源使借張騫以為官牽牛去幾許洙曰博物志昔有人乘查泛河忽忽不知晝夜至一處多見織女有一丈夫牽牛渚次飲之歸問嚴君平曰某日客星犯牛女宛馬至今來逸曰宛馬每入貢置牧監於兹一望幽燕隔何時郡國開洙曰時幽燕在賊境郡國未安寧東征健兒盡羌笛暮吹哀洙曰士多死亡哀憤氣形於羌笛補注鶴曰天寶十四載十一月於京師召募十萬號天武健兒時祿山反兵籍少旋募之也今日明人眼臨池好驛亭叢篁低地碧髙柳半天青洙曰叢篁低地碧桞半天是亦傷君子沉下位也師曰竹有節喻君子柳質柔脆望秋先零喻小人稠疊多幽事洙曰稠疊猶重疊喧呼閲使星洙曰時亂民喜見使者故喧呼晉志流星天使趙曰往來使吐畨者老夫如有此不異在郊坰雲氣接崑崙涔涔塞雨繁羌童看渭水使客向河源蘇曰黃河記云雲氣浩漫逺接崑崙趙曰言吐畨之兵窺覷渭水洙曰張騫奉使西域尋黃河源師曰此句甫自比也補注鶴曰山海經曰崑崙山有琅玕樹爾雅云海內西經云帝之下都崑崙之墟方八百里髙萬仞渭水在關內道唐志云其大川涇渭華州有渭津關有漕渠自苑西引渭水因石渠會灞滻經廣運潭至縣入渭按書注渭水自于鳥鼠故曰𨗳渭自鳥鼠同穴河源所自古今所不能知故書但言𨗳河積石以紀其始功之地然爾雅云河出崑崙墟釋云崑崙山名墟山下基也言河源出於崑崙山下之基按唐志儀鳳三年鄯州置鄯城縣有上樓山有河源軍西六十里有臨畨城唐遣使入吐畨必經此故云煙火軍中幕牛羊嶺上村所居秋草靜正閉小蓬門蕭蕭古塞冷漠漠秋風一作雲低黃鵠翅垂雨蒼舒曰按文選黃鵠一逺别千里顧徘徊蒼鷹飢啄泥洙曰公自傷也補注希曰古者鵠與鶴字通用爾雅鷹鶆鳩釋曰春秋曰爽鳩氏司寇鷹鷙故云司寇郭云鶆當云鷞昭十七年鷞鳩氏司冦注爽鳩鷹也薊門誰自北漢將獨征西趙曰薊門指安史言收復燕薊者誰也征西則指言討吐畨漢有征西將軍不意書生耳薛曰南史沈慶之曰耕當問奴織當問婢今欲伐國而與白靣書生輩謀事何由濟臨衰厭一作見鼓鞞山頭南一作東郭寺水號北流泉師曰水萬折必東其勢順也今而北流其逆如此叛臣之謂乎泰曰彪池北流蓋亦惡其逆耳老樹空庭得清渠一邑傳補注鶴曰九域志云郡有清水本秦中所封為附庸之地故有清水縣渠亦因此而名故至德二載五月子儀乃慶緒將安守忠戰於清渠敗績清渠在京城之西詩非引此秋花危石底師曰秋花非元物况危於石底公之命意自傷類如此晚景卧鐘邊一作前俯仰悲身世溪風為颯一作肅然傳道東柯谷鄭曰秦地名深藏數十家對門藤蓋瓦映竹水穿沙瘦地翻宜粟陽坡可種瓜田曰毛文錫茶譜云宣州宣城縣有塢如山其東為朝日所燭號曰陽坡船人近相報但恐失桃花彥輔曰桃花水也萬古仇池穴鄭曰在成州潛通小有天洙曰世説仇池有地穴通小有洞中出神魚食之者仙蘇曰趙德麟曰仇池小有洞天之附庸也王仲至謂余曰吾嘗奉使過仇池有九十九泉石萬山環之可以避世如桃源鮑曰按唐志成州同谷縣有仇池與秦城接壤修可曰引茅君傳大天之內有元中洞三十六所第一王屋之之洞周回萬里名曰小有清虛之天補注鶴曰秦州記仇池山本名維山形如覆囊上廣百頃壁立萬仭漢書氐人所居也方百頃四靣斗絶其山下石上玉形如覆壺在今成州上祿縣水經云鞏縣士社津有山臨河其間有穴潛通淮浦有渚謂之鮪渚亦潛通之義也神魚久不見福地語真傳洙曰仙經有福地鎮地皆以名山或洞府為之夢符曰按道書有三十六洞天七十二福地真誥曰金陵者洞墟之膏腴句曲之福地履之者萬萬知之者無一內經福地志曰伏龍之地在栁谷之西金壇之右可以髙灑金陵之福地近接西南境長懷十九泉師曰公有卜居之意何時一茅屋送老白雲邉未暇泛滄海悠悠兵馬間塞門風落木洙曰一云塞風寒落木客舍雨連山阮籍行多興龎公隱不還東柯遂一作放踈懶休鑷鬢毛班師曰南史鬱林王年五嵗戲髙帝傍帝令左右鑷白髮問王我誰耶答曰太翁帝笑謂左右曰豈有為人作曽祖而拔白髮乎即擲鏡鑷子曰道不行乘桴浮於海東柯好崖谷不與衆峯羣落日邀雙鳥覺範曰落日喻暮年邀雙鳥言欲與妻子隱居於此晴天卷片雲補注鶴曰辨命論云丹雲不卷野人吟險絶水竹會平分採藥吾將老童兒未遣聞邊秋隂易夕不復辨晨光洙曰鮑昭詩晨光復泱漭簷雨亂淋幔山雲低度牆蘇曰公宙過友人舍問其牆低友人曰使山雲易度耳鸕鷀窺淺井蚯蚓上深堂鄭曰水鳥不卵生口吐其雛正作鷀喻細民飢而無食洙曰深一作髙鸕鷀窺淺井無食也蚯蚓上深堂言至空也蘇曰譏小人得志也補注希曰爾雅鷀鷧釋曰别二名也字林似鶂而黑郭云即鸕鷀也井深則有魚矣未可測井淺而窺徒勞車馬何蕭索門前百草長趙曰張仲蔚所居蓬蒿滿門寂無車馬地僻秋將盡山髙夜未歸塞雲多斷續邊日少光輝警急烽常報傳聞檄屢飛薛曰按前漢書長安胸奴大入烽火通於甘泉洙曰鮑明逺詩羽檄起邊亭烽火入咸陽師曰説文曰檄以木簡為書長尺二以徴軍也魏武奏事曰若有急則插以雞羽謂之羽檄補注鶴曰賈誼傳斥侯望烽燧文頴曰邊方備胡冦作髙土櫓櫓上作桔橰桔橰頭兜零以薪草置其中常低之有寇即火然舉之以相告曰烽師古曰夜則舉烽陳琳為魏祖草檄韓愈送侯參謀詩亦云檄筆無與謀則檄亦有文也西戎外甥國為尚主也蒼舒曰按唐書景龍四年以金城公主下嫁吐畨乾元元年肅宗以幼女寧國公主下降回紇爾雅曰妻之父為外舅郭璞曰謂我舅者謂之甥然則亦呼壻為甥唐書贊普遣名悉躐奉表言甥先帝舅顯親也何得近天威近一作忤洙曰天子之威也左傳齊侯曰天威不違顔咫尺鳳林戈未息魚海路常難魯曰鳳林魚海皆地名補注鶴曰河州有鳳林縣北有鳳林闕見唐志戈未息言吐畨入寇也候火雲峯峻洙曰烽候之火夏雲多竒峯懸軍幕井乾洙曰懸軍謂路險阻懸之使下也鄧艾伐蜀懸軍深入幕一作暮夢符曰按周官挈壺氏掌挈壺以令軍井凡軍事縣壺以序聚柝趙曰易井收勿幕注井口曰收勿幕則勿遮幕之風連西極動月過北庭寒故老思飛將彥輔曰李廣飛將何時議築壇師曰漢祖築壇拜將甫思得如信者出焉唐堯真自聖趙曰謂肅宗也逸曰君自聖則忠讜不聞用微言以託諷也野老復何知趙曰公自謂也曬藥能無婦應門亦有兒洙曰李令伯表內無應門五尺之童世説荀淑使叔明應門兹明行酒師曰應音因當門户幸有兒子藏書聞禹穴洙曰司馬遷年十嵗誦古文二十四而南遊江淮上會稽探禹穴窺九疑趙曰言禹穴藏書也讀記憶仇池憶一作悟蘇曰許靖過仇池樹下有碑靖駐馬一覽無遺人皆稱賞為報鴛行舊趙曰指言平日同禁省之人鷦鷯在一枝趙曰莊子鷦鷯巢林不過一枝韓曰甫之執友皆在鴛行想其子必有所託故云云月夜憶舍弟乾元二年作補注鶴曰詩云戍鼓斷人行秋邊鴈一聲當是乾元二年秦州作是年九月史思明陷東京及齊汝鄭滑四州宜戍鼓之未作二弟在許一在齊皆在河南故憶之戍鼓斷人行洙曰戍樓鼓也秋邊一鴈聲洙曰言孤也露從今夜白月是故鄉明有弟皆分散洙曰一云羇旅趙曰公之二弟方賊亂時一在齊州一在陽翟無家問死生寄書長不逹况乃未休兵一雁聲言其兄弟隔絶遂孤也當亂離流落故曰無家也宿贊公房彥輔曰贊大雲寺主謫此安置乾元二年作補注鶴曰詩云隴月向人圓又言菊荒蓮倒當是乾元二年晚秋在秦州作杖錫何來此秋風巳颯然雨荒深院菊霜倒半池蓮師曰昔慧逺禪師與陶淵明結白蓮社甫平昔與贊公逰從亦其比也今之霜倒半池蓮言蓮社冷落也補注希曰此特言宿贊公房時景物如此爾豈為蓮社冷落而言若以蓮喻蓮社冷落則菊將安喻放逐寧違性洙曰性安窮達不以放逐而違爾虗空不離禪洙曰釋經以禪宗為空門相逢成夜宿隴月向人圓補注希曰晉劉惔傳卿今日作此靣向人耶東樓乾元二年作補注鶴曰傳聲看驛使蓋使吐畨者經此當是乾元二年秦州作萬里流一作行沙道征西過此門洙曰流沙地名老子西涉流沙而不返晉漢有征西將軍官趙曰泛言西行之人出此西門耳一本作西征過北門義非補注鶴曰流沙在西之極吐番所居之域中國使吐畨者道出於此漢書有西征三字師古以為以日為喻故言西征然此云征西猶言往西耳往西則過此門趙注是但添新戰骨蘇曰袁耽數年相持邊疆沙場但添新戰骨耳不返舊征魂洙曰一云但添征戰骨不返死生魂樓角凌風逈城隂帶水昏傳聲看驛使送莭向河源趙曰時遣使與吐畨和借使張騫奉使尋河源事雨晴洙曰一作秋霧乾元元年作補注鶴曰詩云塞栁行踈翠又云胡笳樓上彂當是乾元元年秦州作天際一作外秋雲薄從西萬里風今朝好晴景久雨不妨農洙曰以得時也蘇曰元狩年中雖久雨不妨農事塞一作岸桞行踈翠山梨結小紅胡笳樓上發一鴈入髙空修可曰張祐詩萬人齊指處一鴈落寒空同此寓目趙曰左傳楚子玉之語曰得臣與寓目焉補注鶴曰詩云關雲塞水羌女胡兒當是在秦州作乾元二年詩又云一縣葡萄熟指隴西所出而言也一縣葡萄熟沈曰永徽圖經曰葡萄生隴西五原煌山谷今處處有之秋山苜蓿多洙曰西域人好飲葡萄酒馬食苜蓿二師伐宛將種歸中國沈曰神農本草云苜蓿味苦平無毒主安中利人可久食關雲常帶雨塞水不成河羌女輕一作搖烽燧趙曰然火曰烽舉炬曰燧胡兒制一作摯駱駝自傷遲暮恨喪亂飽經過山寺乾元二年作補注鶴曰范成大嶺海志云鸚鵡出炎方稍北中冷則發瘴噤秦地寒宜無鸚鵡而梁權道編此詩在秦州作按鸚鵡賦云命虞人於隴抵閉以雕籠剪其羽翅秦隴右州也故有之公賀薛璩畢曜遷官詩在秦州亦曰隴俗輕鸚鵡則此詩正在秦州作乾元二年野寺殘僧少山園細路髙麝香眠石竹鸚鵡啄金桃洙曰麝鹿也蘇曰麝香鳥名石竹野花麝香之鳥其骨極小石竹之花微弱叢生而纎短麝香所以能眠釋者以為麝鹿也豈能眠於石竹或以為釋者是師曰天厨禁臠云麝香小鳥也與蘇注同補注希曰爾雅麝父麕足釋曰字林云小鹿有香其足似麞故云麕足郭云腳似麕有香文嵇叔夜養生論麝食柏而香本草云麝香形似麞嘗食柏五葉得香又夏自食蛇多至寒香滿入春懷急痛以腳剔去置矢溺中覆之時有常處漢異域志能言鳥注云鸚鵡説文鶯母能言鳥也貞觀間唐國獻黃桃大如鵝卵其色如金亦呼為金桃兹云者亦其類歟鶴曰崇仁饒焯景仲與余言嘗見武林有金桃色如杏七八月熟因知東都事略所記外國進金桃銀桃種命植之御苑即此也亂水通人過定功曰詩涉渭為亂懸崖置屋牢蘇曰姚崇梵僧居麥積山下以巖造成屋今自為石巖寺上方重閣晚百里見纎毫即事乾元二年作補注鶴曰詩曰人憐漢公主生得渡河歸謂寧國公主乾元二年八月丙辰自回紇歸當是其年作聞道花門破和親事却非人憐漢公主生得渡河歸趙曰回紇助討祿山有功乾元元年請婚肅宗以歸寧國公主下嫁眀年可汗死公主以無子得補注鶴曰花門破謂回紇乾元元年和親後嘗使王子骨啜勒宰相帝里等率騎討賊明年回紇與九節度攻相州王師潰帝德奔京師帝厚賜遣還俄而可汗死公主歸故云秋思拋雲髻一作鬢腰支賸一作勝寶衣羣凶猶索戰蘇曰王世充羣凶兵猶索戰但持重吾軍然後大事可成回首意多違遣懷乾元二年作補注鶴曰詩云寒城塞日皆是指秦州而言乾元二年作愁眼看霜露寒城菊自花蘇曰古出塞雲寒城菊自花曠野木脫盡子美全用深有包蓄木脫盡言無嵗寒之志交情薄也菊自花不似澆培乃君子以道自營也天風隨斷桞客淚墮清笳水淨城隂直山昏塞日斜夜來歸鳥盡啼殺後棲鴉趙曰以其無枝可棲故啼之多爾天河乾元二年作補注鶴曰公為小人所間自拾遺出為華州司功故託天河以自喻而有縱被微雲掩終能永夜清之句此詩當是乾元二年七月在秦州作所以又有伴月落邉城之句常時任顯晦秋至最分明洙曰天河至秋則顯見人自謂銀河縱被微雲掩終能一作當永夜清魯曰賢人雖為羣小所掩然終不害其明含星動雙闕伴月落邉城補注希曰雙闕當是指龍門按韋述東都記龍門號雙闕牛女年年渡趙曰齊諧記曰桂陽武丁忽謂其家曰牛女渡河諸仙悉還宫吾向巳被召不得停明日失丁所在何曽風浪生浪曰世説牽牛織女二星七夕渡河相會初月至德二載作補注鶴曰師古謂肅宗乾元初子美在秦州避亂作而梁權道編在乾元二年按至德二載十月還京子美扈從當在是年秋作蓋詩意屬肅宗即位於靈武詩曰影斜輪未安喻其未正位於京師也成都府詩云初月出未髙衆星尚爭光亦此意餘見注光細洙曰一云常時弦欲上影斜輪未安魯曰魄未圓滿也微升古塞外巳隱暮雲端洙曰言易落也蒼舒曰魏秦云夏鄭公評杜公初月詩曰微升古塞外已隱暮雲端以謂意屬肅宗鄭公善評詩者也秦觀云退之詩煌煌東方星奈此衆客醉其順宗時乎東方謂憲宗在東宫也此論與此詩合補注希曰鄧通傳徼外注師古曰徼猶塞也東北謂之塞西南謂之徼塞者以障塞為名肅宗即位於靈武於國為北故云河漢不改色趙曰言月出便隱惟河漢不以月之隱而改色也補注鶴曰亦喻肅宗即位河漢之地雖不至於改色而關山之地尚多擾擾其與影斜輪未安皆喻肅宗未還京而天下尚未安寧也關山空自寒庭前有白露暗滿菊花圑歸燕乾元二年作彥輔曰此詩公託意以自喻也補注鶴曰公見歸燕而傷巳之未歸故有故巢儻未毁會傍主人飛之句舊次在乾元二年秦州詩內梁編亦然不獨避霜雪其如儔侣稀四時無失序八月自知歸洙曰言四時迭運自得其序而以炎涼往來者乃燕之自知爾春色豈相訪衆雛還識機故巢儻未毁會傍主人飛傍去聲師曰此詩公託意以自况也避霜雪言避亂也四時迭運自有炎涼公之去就非若俗態之奔競也故巢喻故鄉促織乾元二年作補注鶴曰促織趨織也詳見注自此至除架五詩皆託以喻人當是乾元二年秦州作促織甚微細洙曰促織秋蟲也補注希曰爾雅釋曰蟋蟀一名蛬今促織也亦名青􅖹唐風云蟋蟀在堂陸機云似蝗而小正黑有光澤一名蛬一名蜻蛚楚人謂之王孫豳人謂之趍織里語云趍織鳴懶婦驚是也今詩曰故妻難及晨本此詩也七月云十月蟋蟀入我牀下又古今注促織一名梭機莎雞一名絡緯哀音何動人草根吟不穩牀下夜相親趙曰人多置牀下也久客得無淚故妻難及晨悲絲一作絃與急管感激異天真師曰促織常夜鳴甚哀切搗衣乾元二年作補注鶴曰詩云亦知戍不返又云一寄塞垣深是時安史之亂既未息又備吐畨也乾元二年作亦知戍不返趙曰婦人知其去戍邉而不返秋至拭清砧巳近苦一作暮寒月况經一作驚長别心洙曰言征戍之苦不保其生死寧辭搗衣倦一寄塞垣深洙曰垣城牆也用盡閨中力君聽空外音洙曰砧聲也師曰此詩言征戍之苦秋至拭砧作寒衣送至塞垣邉城也盡云閨中之力搗衣其砧聲音聞於空外使人不忍聽也故螢火補注鶴曰爾雅云螢火一名即照夲草一名夜光一名熠耀傳曰螢載火而寒一名挾火一名夜火一名宵燭今詩云幸因腐草出敢近太陽飛蓋指李輔國輩以宦者近君而撓政也乾元二年秦州作師云喻小人起於微賤而侵凌大德之士幸因腐草出洙曰月令腐草化為螢敢近太陽飛洙曰太陽之光固非螢火之可近喻小有才而侵侮大德者未足臨書卷時能點客衣隨風隔幔小帶雨傍林微補注鶴曰爾雅釋云腐草得暑濕之氣為螢至秋而天沉隂數雨螢火夜飛之時也詩東山云熠耀宵行兹云敢近太陽飛又云帶雨傍林微蓋本於此十月清霜重飄零何處歸師曰螢出於腐草喻小人起於微賤而侵凌大德之士一旦時清必蒙擯斥故云飄零何處歸蒹葭乾元二年作補注鶴曰爾雅釋葭一名葦即今之蘆也葦之未成者一名蒹郭云似萑而細髙數尺江東呼為蒹適秦風云蒹葭蒼蒼從舊次乾元二年作摧折不自守洙曰生質衰脆不能自守秋風吹若何暫時花載雪幾處葉沉波洙曰言非嵗寒之質體弱春苗早叢長夜露多江湖後搖落亦一作只恐嵗蹉跎苦竹乾元二年作補注鶴曰戴凱之竹譜云亦有紫苦竹處處有之又梧州思安縣有黃苦竹白苦竹之名東越謂之髙苦竹同上年作青冥亦自守軟弱強扶持強其兩切洙曰猶強自振立也味苦夏蟲避叢卑春鳥疑軒墀曽不重剪伐欲一作亦無辭幸近幽人屋蘇曰崔浩菜賦種近幽人之屋藏當野客之窗霜根結在兹師曰言此竹質雖疲軟然得其所託亦足以保其生矣除架洙曰瓜架也乾元二年作補注鶴曰詩云束薪巳零落瓠葉轉蕭踈又云寒事今牢落人生亦有初當是秋冬之交公將赴同谷以秦人待我不如始至也同上年作束薪巳零落瓠葉轉蕭踈幸結白花了寧辭青蔓除秋蟲聲不去暮雀意何如洙曰架除而鳥失栖也寒事今牢落人生亦有初洙曰言瓜未生之初則作架以承之才結花則有將實之望而其意稍怠矣故架壞則除去而不修也亦猶人事鋭始而怠終趙曰人生未嘗無初公初在太平之時文采動上聲譽烜赫本不如是牢落也夕烽乾元二年作補注鶴曰詩云照秦過隴則是在秦州當乾元二年九月史思明陷東京反齊攻鄭滑四州之後十月李光弼與思明戰於河陽之時思明敗故此詩云每日報平安當在其年作師古曰畫則然燧夜則舉烽故題曰夕烽夕烽來不近每日報平安趙曰有警急之報則舉烽火以相應補注鶴曰烽有報平安火如哥舒翰潼關之敗翰麾下來告急上遣李福等將監牧兵赴潼及暮平安火不至上始懼是也塞上傳光小雲邉落點殘照秦通警急過隴自艱難趙曰言安史之兵猶出沒隴上也聞道蓬萊殿鄭曰長安志殿在東內紫宸殿北千門立馬看秋笛乾元二年作補注鶴曰詩云他日傷心極征人白骨歸蓋秦當攻守吐畨之俗今聞笛聲之悲故有此作乾元二年秋清商欲盡奏奏苦血沾衣趙曰五音惟商最悲今欲盡奏以全其曲則聞者必揮涕而繼之以血也他日傷心極征人白骨歸趙曰他日士有死於戰以白骨歸聞此聲尤傷心也相逢恐恨過故作發聲微不見秋雲動悲風稍稍飛洙曰言笛聲哀切風雲亦為之悽慘送逺乾元二年作補注鶴曰乾元二年冬去秦而此詩云帶甲滿天地當是指其年史思明之亂方殷而李光弼等平之又詩云草木嵗月晚關河霜雪清則作詩時公將去秦也帶甲滿天地洙曰盜賊充斥時方用兵胡為君逺行親朋盡一哭洙曰楚辭悲莫悲於生别離鞍馬去孤城草木嵗月晚關河霜雪清别離巳昨日因見古人情蘇曰張翰命駕歸吳一世髙其節阮攸嘆曰讀陳留范蠡遺史因此知季世見古人情矣觀兵乾元二年作補注鶴曰詩云北庭送壯士按北庭即鎮西北庭莭度之兵元帥謂李嗣業乾元元年九月嗣業會九莭度攻鄴是時公有觀安西兵赴關中待命詩今詩云莫守鄴城下斬鯨遼海波乃鄴師未潰之前作公意欲且平吐畨也當是乾元二年春作非秦州詩北庭送壯士洙曰燕太子送荆軻於易水上軻歌曰壯士一去不復還貔虎數尤多洙曰書如虎如貔師曰時回紇送兵三千助討賊故云云精鋭舊無敵洙曰精鋭猶勇敢也邊隅今若何趙曰此望其必勝而憂之之辭妖氛擁白馬元帥待雕戈趙曰妖氛指言吐畨之兵待雕戈則待北庭之賜也古鼎銘曰王命虎臣賜爾和鸞黼黻雕戈莫守鄴城下斬鯨遼海波師曰元帥代宗也時九莭度兵圍賊將慶緒於相州欲誅其渠魁故云云趙曰思明據城宋下公謂可以緩圖且於遼海斬鯨則以吐畨為急也補注鶴曰吐畨自至德元載陷威戎神威等軍石堡石谷等城二載又陷西平乾元元年又陷河源其侵陵之氣方張公所以欲其先斬遼海之鯨也廢畦乾元二年作補注鶴曰詩云秋蔬擁霜露當是秋晚作從舊次則乾元二年作時公巳有去秦之意矣秋蔬擁霜露豈敢惜凋殘暮景數枝葉天風吹汝寒緑霑泥滓盡香與嵗時闌生意春如昨悲君白玉盤不歸乾元二年作補注鶴曰詩云河間尚征伐按唐志瀛州為河間郡屬河北當是祿山自范陽反河北諸郡望風反解時公之從弟死於城中天寶十四載十一月至乾元元年為三年今云面上三年土春風草自生則是經三春當是乾元二年春公是時在東都而梁權道編在秦州作非河間尚征伐宋曰河間郡名此詩甫從弟經亂離未歸也汝骨在空城趙曰此言公之從弟有死而寄骨於其處從弟人皆有終身恨不平數金憐俊邁師曰謂初時知錢數也總角愛聰明靣上三年土春風草又生師曰言三年飄蕩風埃之中今春草又生也天末懷李白趙曰白於至德二載坐永王璘而謫夜郎故公在秦州懷之而作補注鶴曰趙注乾元二年春秦州作今考詩云應共寃魂語投詩贈汨羅謂白有捉月之事當在寶應元年後涼風起天末君子意如何洙曰月賦雲斂天末補注希曰陸士衡詩借問欲何為涼風起天末白亦自有詩云滄波渺川汜白日隱天末鴻鴈幾時到江湖秋水多文章憎命達魑魅喜人過趙曰譬小人害君子之意師曰自古文章之士命運多蹇魑魅言貶所窮僻應共寃魂語投詩贈汨羅琪曰指屈原也馬曰若原不遇投汨羅江死故甫有是句獨立乾元二年作補注鶴曰詩云空外二鷙鳥河間雙白鷗又云云天機與人事獨立萬端憂鷙鳥喻得時則可以擊物白鷗喻失時則可以遂性公為拾遺為小人所間遂遲回於秦華間因覩草露蛛絲而知天機之與人事於是不能無憂其憂也豈為巳而巳詩在乾元二年秦華間作空外一鷙鳥河間雙白鷗師曰皆得其勢也飄颻搏擊便容易往來逰趙曰摶擊謂鷙鳥也往來逰言白鷗也白鷗往來不知鷙之將搏擊此可為寒心矣草露亦多濕蛛絲仍未收師曰詩云豈不夙夜謂行多露露犯之則濡蛛絲易染惹人甫官拾遺宜若鷙鳥獨立遇事則誅擊姦回時抗疏論房琯反為小人沾惹以朋黨至於斥逐故有草露多濕蛛絲未收之句天機近人事獨立萬端憂蘇曰蘇筠獨立西樓俯仰身世憂患萬端日暮乾元二年作補注鶴曰詩如前篇言羌婦胡兒當亦在秦州作乾元二年日落風亦起城頭烏尾訛修可曰按後漢五行志桓帝時京師童謠云城上烏尾畢逋蓋言處髙利獨食不與下共謂人主多聚斂也師道曰訛以言驚動也黃雲髙未動白水巳揚波羌婦語還哭胡兒行且歌將軍别上馬夜出擁雕戈蘇曰馬援夜出擊五蠻陳換馬自備遂橫戈而出空囊乾元二年作補注鶴曰詩云翠柏苦猶食晨霞朝可飱正史謂在秦州拾橡栗以自給之意當是乾元二年作翠柏苦猶食修可曰楚詞云山中人兮採杜若飲泉石兮飯松柏又列仙傳仙人偓佺食松柏之實晨霞朝可餐田曰楚詞云餐六氣而飲沆瀣潄正陽而餐朝霞注陵陽子明經曰春食朝霞者日始出赤氣也華陽真妃曰日者霞之實霞者日之精君惟聞服日之法未聞餐霞之法也師曰甫欲飱霞食柏髙遁於世世人共鹵莽吾道屬艱難不㸑井晨凍洙曰樵蘇不㸑清談而巳趙曰以不㸑不及井而井晨凍矣無衣牀夜寒洙曰七月詩無衣無褐何以卒嵗囊空恐羞澀留得一錢看蘇曰晉阮孚山野自放嗜酒日持一皂囊逰會稽客門囊中何物但一錢看囊庶免其羞澀趙曰趙一之文章雖滿腹不如一囊錢也師曰甫嘗云語言少味無阿堵物少味者羞澀之謂也補注希曰梁武帝詩書云羊欣書似婢作夫人不堪位置而舉止羞澀終不似真蘇注巳盡似不必更注此第蘇注多引小説又或以為非蘇所注故又筆之於後病馬乾元二年作補注鶴曰詩云天寒關塞深當是在秦州作乾元二年乘爾亦巳久天寒關塞深塵中老盡力嵗晚病傷心趙曰田子方出野見病馬問御者對曰此故公家畜也罷而不能為用故出放之曰少盡其力老棄其身仁者不為也命束帛贖之毛骨豈殊衆馴良猶至今物微意不淺感動一沉吟師曰此詩託意人君始用其才終乎捐棄而失之寡恩也蕃劎乾元二年作補注鶴曰詩云風塵苦未息持汝奉明王又舊次與梁編皆在乾元二年秦州詩內則風塵云者指思明雖敗於李光弼而未息也致此自僻逺又非珠玉裝如何有竒怪每夜吐光芒趙曰斗牛之間有紫氣虎氣必騰上龍身寧久藏趙曰孔章臨亡戒其子以劍自隨後其子為建安從事劍忽耀出見二龍相隨焉風塵苦未息持汝奉明王銅瓶補注此詩當與蕃劍同時作乾元二年作亂後碧井廢時清瑶殿深師曰銅瓶所以汲水以濟人者也喻賢者宣君之恩以及衆世亂則棄捐於寒勞時清可收用於瑤殿補注希曰漢禮樂志眺瑤堂師古曰以瑤飾堂此云瑤殿亦其義銅瓶未失水百丈有哀音側想美人意應悲寒甃沉蛟龍半缺落猶得折黃金觀安西兵過赴關中待命二首乾元元年作補注鶴曰按安西節度至德元載更名鎮西故乾元二年九節度圍鄴之師潰後李光弼退守河陽時周摯逼中灘遣荔元禮擊之摯遁去以功知鎮西北庭行營節度使則安西之兵元年巳赴關中是時節度蓋李嗣業也嗣業以乾元二年正月卒通鑑所謂九月庚寅命朔方節度郭子儀淮西魯炅鎮西北庭李嗣業七節度將步騎二十萬討安慶緒李光弼王思助之是也此詩當是乾元元年華州作不曰鎮西而曰安西循舊名也梁權道編在二年作非四鎮富精鋭摧鋒皆絶倫洙曰言勇鋭能摧鋒陷陳也唐職官志四鎮通於柔逺通典鎮西將軍後漢末魏武帝為之鎮南將軍劉表為之魏張魯晉杜元凱並為之鎮西將軍後漢劉表魏鍾離鄧艾為之鎮北將軍南魏明帝太和中置劉靖許允並為之各一人宋時四鎮與中軍通為雜號後魏加大次尚書令夢符曰按唐武后時右鷹揚衛將軍王孝傑擊吐畨大破其衆復取四鎮更置安西都護府於龜兹以兵鎮守又唐志四鎮都督府謂龜兹於闐焉耆疏勒也補注鶴曰舊史地里志安西莭度撫寧西域統龜兹於闐焉耆疏勒四國故謂之四鎮注云都護府治所在龜兹國城內管戎兵二萬四千人馬二千七百匹新史云初治西州後徙治龜兹至德元載更名鎮西後復還聞獻士卒足以靜風塵老馬夜知道洙曰齊桓公失道管仲使隨老馬而得出老馬多知也師曰老馬喻哥舒翰老將補注鶴曰哥舒翰天寶十五載巳降安祿山此豈是喻舒翰師注非若以老馬喻主將則謂李嗣業蒼鷹飢著人著且略切洙曰晉載記言慕容垂猶鷹也飢則附人飽則髙飛師曰鷹飢喻祿山未髙也臨危經久戰用意始知神洙曰精􅍄戰陳用意如神師曰當此時正好使之立功以充其志願故云云竒兵不在衆洙曰史兵以正合以竒勝傳云留侯用竒兵不必衆多雖多不精鋭而無益萬馬救中原洙曰蔡琰謂曹公曰明公廄有萬馬談笑無河北洙曰言談笑可以却敵趙曰祿山之叛河北一帶已陷沒今言安西兵之精鋭主將於談笑之間可以蔑無河北矣心肝奉至尊洙曰言至誠也孤雲隨殺氣飛鳥避轅門蒼舒曰項羽傳將入轅門是也石曰轅門以車為軍門兵屯嚴肅雖飛鳥不敢過竟日留歡樂歡一作觀城池未覺喧送人從軍乾元二年作補注鶴曰王仲宣詩從軍有苦樂借問所從誰詩云弱水陽關在甘州汝州皆屬隴右道當是乾元二年在秦州作弱水應無地陽關巳近天今君渡沙磧纍日斷人煙洙曰弱水水也以其力不能載物故謂之弱水陽關地名趙曰無地言水多也近天言山髙也余曰唐王維詩勸君更盡一杯酒西出陽關無故人後人為陽關曲唱之補注鶴曰禹貢導弱水至於合黎而唐志合黎山在甘州張掖縣弱水栁子厚所謂西海之山有水散渙無力不能負芥者陽關唐志云在沙州夀昌縣西二地乃備吐畨之所按唐志西州西南有南平安昌兩城百二十里至天山西南入谷經礌石磧二十里至銀山磧又北庭大都護府有小磧又云伊麗河西行千里至碎葉城水皆北流入磧今曰沙磧則沙乃流沙之類自是兩名八哀詩首篇贈司空王思禮詩云意無流沙磧是也又自中國往髙昌從武威西北有捷徑度沙磧千餘里四靣茫然無有蹊徑唯以人畜及駝糞為驗餘見王思禮詩注好武寧論命洙曰志於功名封侯不計年洙曰有功即封趙曰言其從軍好緣好武於是用命之秋故不論命有功封侯漢制也不計年所以激發之馬寒防失道師曰李廣征胸奴失道當斬贖為庶人此戒之之辭雪沒錦鞍韉送靈州李判官新添年乾元二作補注鶴曰詩云近賀中興主神兵動朔方謂至德二載史思明降後河北悉為唐有後思明再叛郭子儀還東都經營河北李光弼乾元二年又為幽州大都督府長史兼河北節度故稱神兵詩又云將軍專䇿略當是指王思禮是年七月為關內路府節度兼太原尹北京留守故亦可謂神兵動朔方也此詩當是乾元二年在秦州作羯胡腥四海回首一茫茫血戰乾坤赤氛迷日月黃將軍專策略幕府盛才良近賀中興主神兵動朔方野望乾元二年作補注鶴曰詩云獨鶴歸何晚昏鴉巳滿林公以鶴自喻以鴉喻小人謂巳之所以未歸者由小人衆多而詩又云逺水兼天淨孤城隱霧深則是秦州作同上年清秋望不極迢遞起層隂趙曰晉陸仲詩層巒起層隂逺水兼天淨孤城隱霧深葉稀風更落山逈日初沉獨鶴歸何晚昏鴉巳滿林洙曰譏小人衆多也趙曰何遜詩昏鴉接翅歸示姪佐魯曰佐草堂在東柯谷乾元二年作補注鶴曰一本題下注云佐草堂在東阿谷東柯在秦州公秦州雜詩有云聞道東柯谷深藏數十家是也今以詩云多病秋風落定為乾元二年九月作蓋十月公巳入同谷世系表佐是襄陽房殿中侍御史暐之子多病秋風落師曰七月秋風起八月風髙九月風落君來慰眼前自聞茅屋趣只想竹林眠師曰甫欲得佐共住故云滿谷山雲起侵籬澗水懸嗣一作阮宗諸子姪早覺仲容賢洙曰阮咸字仲容籍之姪也任達不拘與叔父籍為竹林之逰佐還山後寄三首補注鶴曰還山謂還東柯谷也同上年作山晚黃雲合歸時恐路迷澗寒人欲到村黑鳥應栖野客茅茨小田家樹木低舊諳踈懶叔須汝故相攜趙曰嵇康性復踈懶白露黃粱熟分張素有期巳應舂得細頗覺寄來遲味豈同金菊香宜配緑葵趙曰潘安仁賦有緑葵含露老人他日愛正想滑流匙幾道泉澆圃交橫落幔坡葳蕤秋葉小洙曰小一本作少隱映野雲多隔沼連香芰通林帶女蘿甚聞霜薤白重惠意如何分引泉水以灌圉故交橫而落也幔坡言青翠如幔葳蕤衰貌秋葉言黃落之葉女蘿乃松蘿也從人覔小胡孫許寄乾元二年作補注鶴曰詩云人説南州路則詩在西北作當是寓秦州時梁權道編在大厯二年夔州詩內人説南州路山猿樹樹懸舉家聞若咳又作挽一云共愛為寄小如拳預哂愁胡靣趙曰晉傳元鷹賦狀如愁胡初調見馬鞭許求聰慧者童稚捧應癲秋日阮隱居致薤三十束鄭曰葷菜葉似韭乾元二年作補注鶴曰公以乾元二年夏至秦州有貽阮隱居詩云塞上得阮生則阮乃秦州人此詩同是其年作薤至秋江南人巳不食而阮當秋日乃致於公又公作詩寄佐姪亦有甚聞霜薤白重惠意如何之句豈秦地寒故尚堪食耶隱者柴一作荆門內畦蔬繞舍秋盈筐承露薤洙曰詩卷耳不盈頃筐挽歌薤上露不待致書求束比青芻色魯曰詩云生芻一束圓齊玉筋頭衰年關鬲冷味暖併一作腹無憂唐曰薤清暖益老人故云關莭也鬲胸也秦州見勑一作除目薛三璩授司議郎畢四曜除監察與二子有故逺喜遷官兼述索居三十韻乾元二年作補注鶴曰唐百官志司議郎二人掌侍從規諌駁正啓奏凡皇太子可傳於史册者録為記注貞觀十八年方置以比給事中監察御史十五人掌分察百寮巡按州縣云云六典云八人武德初方置貞觀二十二人加二人今詩云秋風動關塞當是乾元二年春作大雅何寥闊斯人尚典刑洙曰詩雖無老成人尚有典型交期余潦倒材力爾精靈洙曰嵇康書足下舊知吾潦倒粗踈不切事情精靈猶精明也二子升同日諸生困一經文章開突奧洙曰突又作陵東北隅也一云窟也突奧深邃貌荀子突奧之內枕簟之上鄭曰突拖沒切爾雅傳謂之突奧方到切室之西南隅曰奧遷擢潤朝廷趙曰潤如德潤身之潤舊好何由展新詩更憶聽别來頭併白秦曰古詩有云相看俱白頭相見眼終青洙曰阮籍善為青白眼見佳客則為青眼見俗客即為白眼伊昔貧皆甚同憂心一作嵗不寧栖遑分半菽浩蕩逐流萍洙曰劉孝標絶交論莫肯廢其半菽罕有落其一毛流萍喻流落如萍之在水也趙曰祖出漢書項羽嵗飢人貧卒食半菽俗態猶猜忌一云猜忍妖氛忽杳冥獨慙投漢閣洙曰見子雲識字終投閣注俱議哭秦庭洙曰吳入郢申包胥求救於秦秦兵未出包胥哭於秦庭者七日勺水不入於口還蜀祗無益囚梁亦固扄洙曰司馬相如還蜀梁孝王怒鄒陽下獄吏將殺之陽從獄中上書王立出之華夷相混合宇宙一羶腥洙曰言胡兵亂華也帝力收三統夢符曰按前漢書三統謂天統地統人統為夏商周之三正也趙曰周得天統商得地統夏得人統言天地人皆歸之也天威總四溟天威見秦州雜詩注舊都俄望幸清廟肅惟馨洙曰顔延年車駕幸京口詩春方動震駕望幸傾五州張平子南都賦頌曰真人南巡覩舊里焉詩清廟注清廟謂有清明之德者之宫也天有清明之德而文王象之故以名詩書明德惟馨趙曰舊都指言長安望幸言車駕還而再見宗廟也補注鶴曰文帝紀上幸甘泉如淳曰蔡雍云天子車駕所至民臣以為僥幸故曰幸至德二載九月復京師左僕射裴冕告太清宫郊廟十一月作九廟神主告享於長樂殿乾元元年四月辛亥祔神主於太廟甲寅朝享於太廟有事於南郊故云雜種雖一作難髙壘洙曰漢書羌胡雜種類不一也髙壘言壁壘尚髙深也長驅甚建瓴洙曰髙祖紀若髙屋之上建瓴水言其勢順而易為力也焚香淑景殿鄭曰長安志殿在西內絳綵院西漲水望雲亭法駕初還日羣公若會星洙曰言帝初收復還宫日百官之輳於朝者若聚星焉補注希曰梅福傳當户牖之法坐師古曰正坐也猶言法宫法駕西都賦亦云乘鸞輿備法駕律厯志注孟康曰太初上元甲子夜半朔日冬至時七曜皆會聚斗牽牛分度宫臣仍點染洙曰宫臣謂薛受司議也屬東宫趙曰點染零文字也柱史正零丁洙曰畢受御史老𣆀為柱下史點染零貌丁言未盡其才也趙曰零丁介獨宫忝趨栖鳳朝回歎一作欲聚螢車胤聚螢喚人看騕裊不嫁惜娉婷洙曰張易之出塞行騕裊青緑騎娉婷紅粉粧趙曰言二公初不自炫鬻以駿馬佳人為喻師曰凡此皆甫自喻不見用於世也掘劍知埋獄提刀見發硎洙曰劍埋於豐城獄張華夜見其氣在斗牛間使人掘之庖丁解牛十九年而刀刃若新發硎鄭曰硎音刑砥石梅曰此二句喻薛畢二子幾年埋沒今始奮發始見遇事剸裁也侏儒應共飽洙曰東方朔傳方待詔公車俸祿薄未得省見久之朔紿侏儒曰上以若曹無益於縣官欲盡殺若曺侏儒大恐啼泣朔教曰上即過叩頭請罪居有頃聞上過侏儒皆號泣頓首上問何為對曰東方朔言上欲盡誅臣等上知朔多端召問朔何恐侏儒為對曰臣朔生亦言死亦言侏儒長三尺餘俸一囊粟錢二百四十臣朔長九尺餘亦俸一囊粟錢二百四十侏儒飽欲死臣朔飢欲死臣言可用幸異其禮不用罷之無令但索長安米上大笑因使待詔金馬門遂稍稍得進用焉趙曰以言二公猶未甚顯拔與侏儒共飽耳漁父忌偏醒洙曰屈原既放行吟澤畔顔色憔悴漁父問曰子非三閭大夫耶何故至此屈原曰衆人皆醉惟我獨醒漁父曰何不哺其糟而啜其醨趙曰公自比屈原之放逐以漁父忌其獨醒也旅泊窮清渭長吟望濁涇趙曰公在秦州而憶長安故也羽書還似急洙曰以鳥羽插檄書上馳告四方故云羽書髙祖曰吾以羽檄徴天下兵烽火未全停洙曰烽燧也未全停尚有餘烽也師老資殘寇戎生及近坰忠臣辭憤激烈士涕飄零上將盈邉鄙元勳溢鼎銘洙曰銘功鍾鼎也仰思調玉燭誰定握青萍洙曰爾雅曰四時調謂之玉燭玉燭調猶燮理也青萍劍名也陳孔章答東阿王箋君侯體髙俗之才秉青萍干將之器拂鍾無聲應機立斷隴俗輕鸚鵡洙曰鸚鵡賦命虞人於壠坻閉以雕籠剪其羽翅趙曰公自况也原情類鶺鴒洙曰詩鶺鴒在原兄弟急難趙曰指與二公如兄弟之急難也秋風動關塞髙卧想儀形寄彭州髙三十五使君適虢州岑二十七長史參三十韻乾元二年作補注鶴曰新舊史皆以適由太子少詹事出為蜀州刺史遷彭州而考公前後詩則有不然者以適如史云先刺蜀而移彭則何為乾元二年公在秦而州有此詩題云寄髙彭州又有彭門劔閣外之句適贈杜拾遺詩云傳道招提客又具官云蜀州刺史髙適又有追酬髙蜀州人日見寄詩而適詩云人日題詩寄草堂蓋招提客指公上元元年方到成都時居浣花寺而是年人日未有草堂當是二年寄之以此三詩論則是先刺彭而後移蜀然公有因崔五侍御寄髙彭州詩又云百年巳過半則公上元二年後五十一嵗所作也何為適又却在彭是可疑者嘗考二史適以至德二載二月永王敗後為李輔國數短於上前左授少詹事則下除當在是年之夏而公有寄髙詹事詩云安穩髙詹事干戈久索居謂其索居之久則詩是乾元二年作是時未出為刺史也史又云乾元二年五月貶李峴為蜀州刺史而此詩亦是年秋作既題云寄髙彭州又中不言刺蜀苐云諸侯非棄擲則是初得刺彭無疑栁芳厯亦云適乾元初刺彭州蓋史誤其先後耳當以詩為是其寄髙彭州一絶云秋至轉飢寒與此詩云今我獨凄涼意亦同又俱是秋作殆與此詩作時相去不逺正不必以百年過半為在上元二年後疑之凡近五十者皆可謂百年過半也如乾元元年作立秋後題詩是時公年方四十七亦云惆悵年半百故一作古人何寂寞今我獨凄涼老去才難盡秋來興甚長洙曰潘安仁有秋興賦補注希曰晉鍾育歎魏舒曰吾之不足以盡卿才云云又江淹任昉人皆謂之才盡物情尤可見師曰目有所見則心有所感故云云詞客未能忘洙曰詞客謂髙岑也俱以詩名世海內知名士雲端各異方洙曰彭在蜀虢在山南髙岑殊緩步沈鮑得同行洙曰沈休文鮑明逺言髙岑可與沈謝並驅也意愜關飛動篇終接混茫趙曰以言二子之詩其妙如此沈佺期祭文思合飛動才冠卿雲舉天悲富駱洙曰富嘉謨為文皆以經典為本時人欽慕文體為之一變駱賔王嘗作帝京篇當時以為絶唱近代惜盧王洙曰盧照鄰王勃也照鄰為鄧王典籖王重其文待以相如勃六嵗能文與兄勔助才相類人謂之王氏三珠樹悲惜各以才不容於世故也似爾官仍貴前賢命可傷傷上四人諸侯非棄擲半刺巳翺翔洙曰刺史古之諸侯庾亮與郭遊書曰别駕與刺史同流王化於萬里任居刺史之半安可非其人趙曰諸侯以言髙適為刺史半刺以言參為長史詩好幾時見書成無使將趙曰言公在秦州欲寄書於二公也男兒行處是客子鬬身強羇旅推賢聖洙曰孔孟皆羇旅趙曰公自言孔孟皆如此不獨我也沉綿抵咎殃三年猶瘧疾一鬼不銷亡趙曰公言其病之沉綿也世言瘧鬼故云隔日搜脂髓增寒抱雪霜洙曰此言瘧之狀也徒然濳隙地有靦屢鮮粧洙曰俗言辟瘧鬼必伏於幽隙之地不爾即盡易容貌鄭曰靦説文面見也何太龍鍾極蒼舒曰抱廣韻龍鍾竹名世言龍鍾取此義謂其年老如竹之枝葉搖曳不能自禁持也於今出處妨趙曰言病而妨出入無錢居帝里盡室在邉疆洙曰寓同谷也劉表雖遺恨龎公至死藏趙曰後漢龐公居峴山之南未嘗入城府荆州刺史劉表數延請不能屈竟隱於鹿門山不反心微傍魚鳥魯曰嵇康遊山觀魚鳥而心甚樂之肉瘦怯豺狼洙曰豺狼類貪暴者隴草蕭蕭白洮雲片片黃彭門劔閣外洙曰劍閣劔關也在蜀定功曰後漢郡國志湔氏道注蜀王本紀曰縣前有兩石對如關號曰關門虢略鼎湖傍洙曰虢有朔城乃鼎湖也夢符曰按史記黃帝採首山之銅鑄鼎於荆山下鼎成乘龍而升天號鼎湖此近虢略未知孰是荆玉簮頭冷趙曰荆山之玉也為岑君而言巴箋染翰光洙曰荆玉出虢巴箋蜀箋也趙曰為髙君而言烏麻蒸續曬丹橘露應嘗豈異神仙宅俱兼山水鄉竹齋燒藥竈花嶼讀書牀更得清新否遙知對屬忙洙曰言吟詩也趙曰言二子才思清新也舊官寧改漢淳俗本歸唐師曰虢本晉地詩晉國風曰此晉也而謂之唐本其風俗憂思深逺乃有堯之遺風焉故云云濟世宜公等補注希曰房元齡傳太宗曰守文之難與公等成之安貧亦士常趙曰安貧公自言也蚩尤終戮辱胡羯漫猖狂洙曰史記蚩尤最為暴黃帝能伐之胡羯安史也會待祅氛靜論文暫裹糧師曰甫欲寇平裹糧就髙岑共論文章也故有末句寄嶽州賈司馬六丈巴州嚴八使君兩閣老五十韻乾元二年作補注鶴曰詩云隴外翻投迹當是乾元二年秦州作按史賈至由中書舍人出慰安蒲州坐小法貶嶽州司馬寶應初召復故官然乾元二年九莭度師潰時至自汝州奔襄鄧公又有送賈閣老出汝州詩則是由中舍出汝州史赴失書當是自汝貶嶽州司馬也嚴武至德初肅宗行在房琯薦為給事中收長安拜京兆少尹坐琯事貶巴州刺史則乾元初在巴州矣衡嶽啼猿裏巴州鳥道邉洙曰言州居山之險絶處也李白云西當太白有鳥道道徑微窄只能容鳥過而已趙曰南中八志曰交趾郡治龍編縣自古興馬道四百里以其險絶獸猶無蹊人所莫由特上有飛鳥之道耳故人俱不利一作别謫宦兩悠然開闢乾坤正趙曰言收復二京矣榮枯雨露偏洙曰言澤不均也趙曰言二子不得受聖恩而謫去也長沙才子逺釣瀨客星懸洙曰漢賈誼洛陽才子也黜為長沙王傳嚴子陵釣瀨光武徴之太史奏客星犯於帝座謂嚴使君也憶昨趨行殿洙曰天子行幸所止曰行殿補注希曰漢文帝紀應劭舊典天子行幸所至必先遣靜室令先遣按行清靜殿中殷憂捧御筵彥輔曰言自賊中赴鳳翔討胡愁李廣奉使待張騫趙曰討強胡未捷則愁李廣使之未還則待張騫無復雲臺仗虛修水戰船洙曰漢武作昆明池以習水戰中有戈船樓船百艘上建樓櫓趙曰言行宫草創不復嚴整法仗也便言哀江南賦猶有雲臺之仗蒼茫城七十洙曰酈食其憑軾下齊七十餘城流落劒三千洙曰莊子説劒昔趙文王喜劒劍士來門而客三千餘人日夜相擊於前畫角吹一作歌秦晉洙曰一作塞春秋時秦晉通煙又為敵國旄頭俯澗瀍洙曰澗瀍二水也在伊洛間趙曰此言安史前漢天文志昴為旄頭胡星也小儒輕董卓洙曰董卓廢立凶暴無道忍性矯情擢用羣士以尚書韓馥等為刺史馥等到官與袁紹之徒十餘人各興義兵同盟討卓有識笑苻堅洙曰苻堅違衆伐晉遂至破敗撫畜鮮卑苻融諌之不聽後為鮮卑所亡故為有識者所笑趙曰小儒有識公自謂也董卓苻堅指安史也浪作禽填海洙曰山海經曰發鳩之山有鳥名精衛本赤帝之女嬉逰於東海溺而死不返化為精衛常取西山木石以填東海江淹詩精衛銜木石誰能測幽微那將血射天洙曰商本紀帝乙無道為偶人謂之天神與之博令人為行天神不勝乃僇辱之為革囊盛血仰而射之命曰射天趙曰皆言安史之不知量也萬方思助順助順助天子也一鼓氣無前晏曰言得衆助故所向必破左傳曹劌曰夫戰勇氣也一鼓作氣再而衰三而竭隂𣪚陳倉北晴熏太白巔洙曰陳倉郡陳寶雞在焉北近長安池太白山名亂麻尸積衛洙曰武五子贊秦始王即位三十九年內平六國外攘四夷死人如亂麻衛地河北湘衛之間也破竹勢臨燕洙曰杜預傳今兵威巳震勢如破竹數莭之後迎刃而解燕地范陽祿山巢穴也法駕還雙闕洙曰天子還京也西都賦乘鸞輿備法駕王師下八川見八水𣪚風濤注此時霑奉引趙曰公為拾遺掌供奉故云佳氣拂周旋洙曰光武紀論曰氣佳哉鬱鬱蔥蔥貔虎開金匣洙曰書如虎如貔麒麟受玉鞭洙曰京州記咸寧二年發張駿陵得鞭飾以珊瑚趙曰麒麟以言御馬按蘇梟杜陽編代宗嘗賜郭子儀九花虬馬并紫玉鞭轡侍臣諳入仗廄馬解登仙趙曰法仗復備皆侍臣所舊諳入者矣時可曰淮南子乘黃獸名龍翼馬身黃帝乘之而仙花動朱樓雪城凝碧樹煙洙曰江淹詩碧樹露阡阡生煙紛漠漠顔延年詩空城凝寒雲衣冠心慘愴故老淚潺湲洙曰九辨倚結軫太息涕潺湲沾軾九歌橫流淚兮潺湲哭廟悲風急見及夫哭廟後注朝正霽景鮮朝正元日朝會月分梁漢米洙曰梁漢間所出者米月分廪給也春得水衡錢洙曰宣帝本始二年春以水衡為平陵徙民起第宅應劭曰水衡與少府皆天子私藏耳縣官公作當仰給司農今出水衡錢言宣帝即位為異政也晉灼曰食貨志初大司農管鹽鐡官布多故置水衡欲以主鹽鐵及楊可告緡上林則物衆乃令水衡主上林上林三官主鐵錢也內蕊繁於纈魯曰內蕊宫花也鄭曰纈文繒也宫花軟勝綿恩榮同拜手出入一作處最隨肩洙曰書臯陶曰拜手稽首禮五年以長則肩隨之晚著華堂醉寒重繡被眠轡齊兼秉燭趙曰言並轡而行也書枉滿懷箋趙曰言在禁掖時往來書尺也每覺升元輔深期列大賢趙曰言二公之才器可為宰輔也秉鈞方咫尺洙曰詩莭南山秉國之鈞左傳不違顔咫尺鎩翮再聨翩洙曰顔延年鸞翮有時鎩注鎩殘也謝靈運聨翩何窮也趙曰言為宰執不逺而乃謫去如鳥之聨翩也無巳曰淮南子飛鳥鎩羽許慎注鎩殘羽禁掖朋從改一作換微班性命全青蒲甘受一作就戮洙曰漢元帝疾史丹以親密侍疾候上寢直入卧內頓首伏青蒲誅趙曰公以拾遺為職故使青蒲事白髮竟誰憐洙曰左太沖馮唐豈不偉白首不見招弟子貧原憲諸生老服虔趙曰公自比原憲服虔也公本傳云入太學受業有雅才以其入學之故故云諸生老服虔爾師資謙未達鄉黨敬何先舊好腸堪斷洙曰謝靈運楚人心昔絶越客腸今斷鮑明逺行子心腸斷新愁眼欲穿逸曰穿破也趙曰公懷二公也翠乾危棧竹鄭曰棧棚也紅膩小湖一作池蓮賈筆論孤憤洙曰屬賈司馬嚴君賦幾篇逸曰屬嚴使君定知深意苦莫使衆人傳貝錦無停織洙曰詩萋兮菲兮成是貝錦趙曰貝錦以喻讒也朱絲有斷絃洙曰鮑昭直如朱絲繩趙曰歎二子無知音而戒之也浦鷗防碎首霜鶻不空拳趙曰兩句通意謂二子如浦鷗言官如霜鶻既不空拳期於必中則鷗當有碎首之防矣其戒之至也地僻昏炎瘴趙曰言嶽州近南為有瘴山稠隘石泉言巴山在亂山間也且將棊度日應用酒為年典郡終微眇嚴使君也治中實棄捐洙曰賈司馬也晉職官志州置别駕治中從事趙曰治平聲二公在禁掖而出斯為微眇棄捐矣安排求傲吏洙曰謝靈運居常以待終處順故安排定功曰莊子嘗為漆園吏楚威王聘之欲以為丞相謂使者曰亟去無汚我故曰傲吏比興展歸田洙曰陶淵明田園將蕪胡不歸去去才難得洙曰語才難不其然乎趙曰古詩去去復去去蒼蒼理又玄洙曰蒼蒼天也言天理元妙莊子天之蒼蒼其正色耶趙曰謂天理難喻也老子曰玄之又玄古人稱逝矣洙曰漢髙紀吾亦從此逝矣吾道卜終焉洙曰終窮也吾道窮於此乎隴外翻投迹漁陽復控弦趙曰言安慶緒復熾也笑為妻子纍甘與嵗時遷親故行稀少洙曰時亂而離𣪚故親故稀少兵戈動接聨洙曰接迹聨屬也充斥也他鄉饒夢寐失侣自迍邅多病加淹泊長吟阻靜便如公盡雄俊志在必騰騫洙曰一云公如盡憂患何事有陶甄趙曰言二公不久將復用也寄張十二山人彪三十韻乾元二年作補注鶴曰詩云流轉依邉徼逢迎念席珍當是乾元二年秦州作唐隱居者多稱山人如稱李泌曰衣白者山人是也自後如稱南山人水北山人少室山人之類皆是獨卧嵩陽一作雲客三違潁水春艱難隨老母慘淡向時人師曰時彪避祿山隱居嵩陽凡三年矣故云三違違别也補注鶴曰嵩陽為河南屬邑彪蓋邑人也以祿山天寶十四載陷東京故攜母避亂所以有艱難隨老母慘淡向時人之句自天寶十五載春至乾元二年秋為三違春矣河南大川曰汝曰潁故云潁水謝氏尋山屐洙曰宋謝靈運好登山陟嶺必造幽峻常著木屐上山去前齒下山則去後齒陶公漉酒巾洙曰陶潛在家酒熟取頭上葛巾漉酒畢還復著之羣凶彌宇宙此物在風塵黃曰此物指彪也歷下辭薑被趙曰後漢薑肱有兄弟四人居貧作一布被而共之關西得孟鄰洙曰見荒蕪孟母鄰注早通交契密晚接道流新靜者心多妙先生藝絶倫草書何太古一云應甚苦詩興不無神洙曰公詩云下筆如有神曹植休前輩洙曰曹植能詩休言為張所掩張芝更後身洙曰言山人草書若張芝再生數篇吟可老一字買堪貧將恐曽防寇深潛託所親寧聞倚門夕洙曰薛包事母至孝凡出入必有時未嘗違也至期母必倚門望之包必至矣盡力潔餐晨洙曰東廣微補亡南陔詩馨爾夕膳潔爾晨餐踈懶為名誤彥輔曰嵇康書信復疏懶筋駑肉緩驅馳喪我真索居猶寂寞洙曰禮離羣索居猶一作尤相遇益愁辛洙曰江淹嵇中𣪚詩鐘鼓或愁辛流轉依邉徼洙曰邉徼邉境也逢迎念席珍洙曰儒行席上之珍以待聘時來故舊少亂後別離頻世祖修髙廟洙曰後漢祭祀志光武建武二年正月立髙廟於洛陽四時祫祀髙帝為太祖一嵗五祀文公賞從臣洙曰僖二十四年晉侯賞從亡者介之推不言祿祿亦弗及商山猶入楚洙曰見羽翼懷商老注渭水不離一作知秦洙曰見欲問桃花宿注趙曰源本指言桃源也存想青龍祕洙曰青龍道家存想之術騎行白鹿馴洙曰周義真入龍矯山見羡門子乘白鹿而行耕巖非谷口洙曰揚子谷口鄭子真耕於巖石之下結草即河濵洙曰河上公不知姓結草河濵讀老子漢景帝親問道以素書授帝云云肘後符應驗洙曰葛洪有肘後方數卷囊中藥未陳旅懷殊不愜良覿眇無因洙曰謝靈運詩引領冀長覿自古皆悲恨浮生有屈伸此邦今一作全尚武洙曰方以武濟於時何處且依仁洙曰語依於仁鼓角凌天籟洙曰莊子女不聞天籟乎關山倚月輪洙曰古今注有月重輪官場羅鎮磧賊火近洮岷趙曰言官之戰場也言四鎮皆置官場收賦斂以供軍也洙曰洮岷地名屬隴右孫曰言吐畨入寇乎此補注鶴曰磧巳詳見上注鎮如北庭大都護府有神山鎮又有大漢小磧安西大都護府有胡弩固城等鎮是也洮岷謂洮州岷州皆去秦不逺蕭瑟論兵地蒼茫鬬將辰大軍多處所餘孽尚紛綸髙興知籠鳥彥輔曰潘嶽秋興賦猶池魚籠鳥而有江湖山藪之思斯文起一作豈獲麟洙曰孔子西狩獲麟師曰張之髙興視如籠鳥之局促其文不遇如孔子傷麟出非其時也窮秋正搖落回首望松一作湘筠洙曰松筠有嵗寒之操寄李十二白二十韻乾元二年作補注鶴曰按白至德元載坐繫潯陽獄至德二載以宋若思將兵赴河南道過潯陽釋囚辟為參謀乾元元年長流夜郎而此詩云五嶺炎蒸地三危放逐臣則是在長流之後從舊次當在乾元二年秦州作昔年有狂客號爾謫仙人筆落驚風雨詩成泣鬼神洙曰賀知章會嵇人自號四明狂客見白文章乃歎曰子謫仙人也驚一作聞驚風雨言敏速泣感鬼神蘇曰李白墓銘云公在長安時祕書賀知章吟公烏栖曲云此詩可以哭鬼神補注希曰李白憶賀監詩序曰太子賔客賀分於紫極宫一見呼余為謫仙人因解金龜換酒為樂蒼頡作字鬼神夜哭聲名從此大汩沒一朝伸洙曰按史言知章言白玄宗召見金鑾殿奏頌一篇賜食帝為調羮名供奉翰林文彩承殊渥流傳必絶倫洙曰帝嘗召白為樂白巳醉援筆成文婉麗精巧無留思帝愛其才數宴見龍舟移棹晚趙曰玄宗泛白蓮池觀既合召白作字時白被酒命髙力士扶登舟獸錦奪袍新洙曰白外傳云白作樂章賜錦袍白日來深殿青雲滿後塵乞歸優詔許洙曰白為髙力士所譛自知不為親近所容懇求還山帝賜金放還遇我宿一作夙心親趙曰公詩集中屢與白詩交情可見矣未負一作遂幽棲志兼全寵辱身劇談憐野逸嗜酒見天真洙曰嗜好也揚雄家貧嗜酒醉舞梁園夜行歌泗水春才髙心不展道屈善無鄰處士禰衡俊洙曰平原處士禰衡字正平見諸公厭禰衡注趙曰黃祖太子射賔客大會有獻鸚鵡者舉酒於衡前曰禰處士今日無用娛賔願先生賦之諸生原憲貧洙曰見難甘原憲貧注稻粱求未足洙曰廣絶交論分鴻鶩之稻粱薏苡謗何頻洙曰馬援征交趾載薏苡種還人謗之以為明珠大貝喻白之遇讒也五嶺炎蒸地三危放逐臣洙曰見雲山分五嶺風壤帝三苗注補注希曰張耳傳南有五嶺之戍師古曰西自衡山之南東窮於海一山之限耳而別標名則有五裴氏黃州記云大庾始安臨賀持陽揭陽是為五嶺書注三危西裔白坐為永王璘府僚長流夜郎五嶺三危與夜郎接境故云幾年遭鵩鳥洙曰賈誼作長沙王傅不得志有鵩集於舍隅遂作鵩鳥賦獨泣向麒麟洙曰王翰古峨眉怨朝晡泣對麒麟樹樹下蒼苔日漸班趙曰孔子見麟而泣曰出非其時吾道窮矣蘇武先還漢趙曰蘇武在胸奴十九年而還白比武則先還也黃公豈事秦趙曰黃公四晧之一避秦居商山以比白之不從永王璘也楚筵辭醴日趙曰言白在永王璘如申公見楚王待之不設醴而辭行也梁獄上書辰洙曰坐事下潯陽獄鄒陽於梁孝王獄中上書即出之巳用當時法誰將此義陳趙曰蓋言永璘王本待白之薄而白豈與謀哉當時不知察而施之以法也誰將以此義陳之老吟秋月下病起暮江濵莫怪恩波隔乘槎與問津洙曰博物志有居海者八月乘查而上天犯牽牛星孔子使子路問津焉趙曰言如白之才器當蒙上知而恩波頓隔欲上天與問之也補注杜詩卷二十
