body:
  text: 補注杜詩卷五宋黃希原本黃鶴補注貽阮隱居昉乾元元年作補注鶴曰以塞上得阮生當是公自華之秦作乾元元年秋冬間詩云褰裳踏寒雨是也陳留風俗衰人物世不數所矩切洙曰晉書阮籍字嗣宗陳留尉氏人也父􅱫魏丞相掾子渾姪咸咸子瞻弟孚咸從子修孚族弟放放弟裕皆陳留人補注鶴曰陳留郡乃汴州塞上謂秦隴乃阮之所隱而陳留即其父祖之所出也塞上得阮生逈繼先父祖貧知靜者性白益毛髮古修可曰謝靈運過始寧墅詩云還得靜者便車馬入鄰家蓬蒿翳環琽洙曰江文通詩顧念張仲蔚蓬蒿滿中園莊子庚桑楚篇鑿垣墻而殖蓬蒿記儒行儒有一畝之宫環堵之室張景陽詩環堵自摧毁清詩近道要趙曰傅咸贈崔伏詩人之好我贈我清詩識字用心苦洙曰劉棻嘗從揚雄學作竒字劉歆觀之泣曰空自苦宋曰昉善篆𨽻故云云尋我草徑微褰裳踏寒雨更議居逺村避喧甘猛虎魯曰沈休文詩避世非避喧補注希曰晉郭文少愛山水逰名山歷華隂之崖又闢山中窮谷無人之地倚木於樹箬覆於上而居焉無壁障時猛獸為暴入室害人而文獨宿十餘年卒無患害足明箕潁客榮貴如糞土洙曰陸士衡云徐翰少無宦情有箕潁之心晉語玉帛猶糞土也愛惜糞土以毁五常無乃不可乎箕山名潁水名許由巢父隱處也師曰識字用心苦時昉踏雨尋訪甫議欲逺引深遁謝絶當世不接喧囂雖餧猛虎所甘心也甫謂其真有箕山潁水之節視榮貴如糞土然遣興三首乾元二年作補注鶴曰塞上指秦州以鄴中事反覆死人積如邱豐年孰云遲甘澤不在早當是乾元二年秦州作下馬古戰場四顧但茫然洙曰蘇子卿行役在戰場蘇曰徐昕過洛汭無復見當日五侯第宅馳馬四顧茫然嘆息風悲浮雲去黃葉墜我前朽骨穴螻蟻洙曰老子其人巳死其骨巳朽陸機挽歌豐肌饗螻蟻修可曰莊子在上為烏鳶食在下為螻蟻食舊注引陸士衡詩蓋出於此又為蔓草纒洙曰江淹恨賦試望平原蔓草縈骨拱木斂魂故老行嘆息今人尚開邊洙曰嚴助傳武帝時征伐四夷開置邊郡蘇曰秦彭過五原見白骨蔽野駐馬嗟嘆久之曰今人不能艾民瘡痍尚思興師開邊豈不憫黎民之性命乎漢虜互勝負封疆不常全洙曰霍去病云漢胸奴相紛拏殺傷失當秦曰孫子一勝一負兵家常事安得亷恥一作頗將三軍同晏眠師曰肅宗巳平祿山思明猶據鄴甫意欲專事鄴城奈何肉食者謀不臧尚與吐蕃再戰故甫欲得亷頗不邀功之將唯務安邊與三軍晏眠不生事可矣高秋登塞一作寒山南望馬邑州洙曰前漢地理志馬邑屬雁門郡晉太康地記秦時建此城輒崩不成有馬周旋馳走反覆父老異之因依以築城遂名為馬邑韓安國傳胸奴來請和親大行王恢議擊上以恢議隂使馬邑豪聶翁一為間亡入胸奴謂單于曰云云於是單于穿塞將十萬騎入武州塞當是時漢伏兵三十餘萬匿馬邑旁谷中單于覺之還去補注鶴曰舊注謂馬邑州屬代州蓋引前漢志而唐志代州雁門郡却不言而於成州謂有靜戎軍寶應元年徙馬邑州於鹽井城置代屬河東而成屬隴右而徙置如此何也又唐地理志羈縻州內有馬邑州屬𨽻秦州開元十七年置在秦成二州山谷間寶應元年徙於成之鹽井故城此詩作於乾元二年則在秦成間降虜東擊胡壯健盡不留洙曰時回紇助順收復京師遂進收東都蘇曰胸奴冦邊韓安國悉師向北少年拒敵惟老弱留守城邑穹廬莽牢落洙曰胸奴傳胸奴父子同穹廬卧師古曰穹廬遊帳也其形穹隆故曰穹廬上有行雲愁老弱哭道路願聞甲兵休洙曰賈捐之傳朱崖反發兵擊之諸縣更叛連年不定上與有司議大發軍捐之建議以為不可曰當此之時冦賊並起軍旅數發父戰死于前子鬭傷于後女子乘亭障孤兒號道路老母寡婦塗泣巷哭上以問丞相于定國對以關東困乏民難搖動捐之議是上遂從之鄴中事反覆死人積如丘洙曰事反覆一云何蕭條憶昔詩云鄴城反覆不足怪蘇曰馬良曰連年兵火尸積如丘趙曰兩京雖復平矣而賊猶保相州既圍復解則士卒傷死可知矣鄴中乃相州也補注鶴曰通鑑乾元元年安慶緒北走其王􅀈字文寬皆殺其使者來降慶緒使其將蔡希德安太清拔之生擒咼于鄴市凡有謀歸者皆誅及種族乃至部曲連坐死者甚衆又慶緒走子儀等追之至鄴慶緒又敗前後斬首三萬級慶緒入城固守求救於史思明思明乘崔光逺初至魏州引兵大下陷魏所殺三萬人故云諸將已茅土載驅誰與謀洙曰李陵與蘇武書陵為足下當享茅土之荐䇿文鍚君玄土首以白茅師曰鄴中叛服不常人死如丘山万一有變諸將已冨貴各顧私家誰與國家謀事哉此甫為朝廷憂也補注希曰已茅土不謂李郭皆封王如封朔方大將軍孫守亮等九人為異姓王李商臣等十三人為同姓王是也豐年孰云遲甘澤不在早洙曰陸機雲賦甘澤雱霈曹子建詩良田無晚嵗膏澤多豐年耕田秋雨足補注鶴曰按史乾元二年春旱故云甘澤不在早是年秋雨足而禾黍茂故因以喻當時衡州之士此詩當是其年秋晚作禾黍已映道蘇曰趙益云桑麻蔽天禾黍映壟春苖九月交顔色同日老勸汝衡門士時可曰詩衡門之下可以棲遲注橫木為門蓋貧者之居也勿悲尚枯稿洙曰莊子枯稿之士時來展材力先後無醜好師曰此喻衡茅之士久困一旦遇時立功以取富貴安問其先後之不同邪甫意勉久困之士譏驟進立功者不足為貴但訝鹿皮翁忘機對芳草洙曰列仙傳鹿皮翁者災川人也少為府小吏機巧舉手能成器械岑山上有神衆人不能至也小吏白府君請木工斧斤三十人作轉輪懸閣意思叢生數十日梯道四門成上其巔作茅舍自止其傍昔遊乾元二年作補注鶴曰此詩殆是記昔時遊齊宋中之事中云胡為客關塞道意久衰薄當在乾元二年秦州作雖云在秦州作意是紀昨遊王屋語也昔謁華蓋君緑袍崑玉腳人棺已上天白日亦寂寞洙曰後漢方術傳王喬為葉令後天下玉棺于堂前吏人推排終不搖動喬曰天帝獨召我邪乃沭浴服飾寢其中蓋便立覆宿昔葬于城西其夕縣車牛皆流汗喘乏而人旡知者百姓乃為立廟號葉君祠暮升艮岑頂洙曰艮岑東北之岑也巾兒猶未却弟子四五人入來淚俱落余時遊名山發軔在遠壑洙曰離騷朝發軔于蒼梧又朝發軔于天津良覿違夙願洙曰謝靈運詩引領冀良覿含淒向寥廓林昏罷幽磬竟夜伏石閣王喬下天壇微月映皓鶴洙曰嵇康琴賦王喬披雲而下墜天台賦王喬控鶴以沖天王喬傳或云即古仙人王子喬也劉向列仙傳王子喬周靈王太子晉也好吹笙作鳯鳴逰伊洛間道士浮丘公接上山三十餘年後來於山上告柏梁曰告我家七月七日待我緱氏山頭果乘白鶴駐山頭望之不得到舉手謝時人而去補注鶴曰天壇山名在河南府晨溪嚮虛駃鄭曰苦夬切駃馬日行千里歸徑行已昨豈辭青鞋胝趙曰青鞋山行之具胝足病也莊子手足胼胝悵望金七藥東蒙赴舊隱洙曰束蒙山名昔者先王以為東蒙主補注希曰蒙山在沂州髙士傳老萊子隱居于蒙山之陽禹貢蒙羽其藝是也瀕東海故曰東蒙尚憶同志樂伏事董先生洙曰董先生董京威也行吟常宿白社之中時乞市肆得碎繒結以自覆於今獨蕭索胡為客關塞道意久衰薄蘇曰吳持道意久不怡神氣覺衰歇妻子亦何人丹砂負前諾洙曰晉葛洪求勾漏令以錬丹砂雖悲髮鬒變洙曰一云鬢髮變謝玄暉詩有情知望卿誰能鬒不變詩鬒髮如雲趙曰髮之黑者曰鬒鬒髮變言變而為白也未憂筋力弱杖藜望清秋有興入廬霍洙曰杖一作扶一云衡謝靈運詩遊當遊羅浮行必息廬霍江淹擬靈運詩平明登雲峯杳與廬霍絶補注希曰廬山在九江霍山在衡陽爾雅霍山為南嶽釋曰南方在霍霍之義護也言太陽用事護養萬物也又云衡山一名霍言萬物霍然大也衡之與霍一山而有二名幽人乾元二年作洙曰易履卦履道坦坦幽人貞吉又陸士衡詩幽人在浚谷補注鶴曰以五湖復浩蕩嵗事有餘悲意是大歷三年出峽嵗晚至嶽陽作舊編在秦州詩內公在秦止數月以乾元二年十月復秦州入同谷嵗暮入蜀若在秦作不應有嵗暮有餘悲之句孤雲亦羣遊神物有所歸洙曰有一作識陶淵明詠貧士詩萬族各有託孤雲獨先依麟鳯在赤霄何當一來儀洙曰書鳯凰來儀漢書麟鳯在郊藪張協七命挂歸翮于赤霄之表趙曰張茂先鷦鷯賦序彼鷲鶚鵾鴻或凌赤霄之際則鳯言赤霄宜矣然麟亦謂之在赤霄學者多疑之殊不知徐陵之生寶志曰此兒天上石麒麟自天而降亦宜在赤霄矣往與惠詢輩中年滄洲期歐曰惠詢輩謂惠逺許詢也修可曰海中十洲其一曰滄洲補注希曰歐注以為惠遠許詢為惠詢師注以惠昭詢珏為惠詢雖未能辨然詩言蓬萊池扶桑日與夫把東皇衣皆是言東遊時恐惠逺許詢之説非天髙無消息棄我忽若遺洙曰詩谷風將安將樂棄豫如遺郭泰機衣工秉刀尺棄我忽若遺內懼非道流幽人見瑕疵洙曰僖七年傳不汝瑕疵洪濤隱語笑洙曰曺植泛舟越洪濤晉王凝之風賦驅東極之洪濤鼓枻蓬萊池洙曰孫楚賦舟人鼓枻而揚波史漁父鼓枻而去蘇曰方鰥曰吾將吞咽日月光華鼓枻遊蓬萊酌天醴玄漿還源仄腦為世外人青衫木版非吾所好也補注希曰子虛賦楊旌枻張楫曰枻柁也師古曰枻音曵崔嵬扶桑日洙曰山海經曰日出暘谷浴于咸池拂于扶桑照耀珊瑚枝洙曰梁元帝馬詩照耀珊瑚鞭趙曰珊瑚出于海底石上有五色故曰所以照耀風帆倚翠蓋暮把東皇衣洙曰屈平九歌有東皇大一張平子東京賦翠羽之髙蓋咽漱元和津洙曰天台賦漱以華池之泉孝祥曰黃庭經曰口為玉池太和官漱咽靈液災不于注云口中液水為玉津又中皇經曰但服元和除五榖必獲寥天得其籙注云服元和謂咽津液所思煙霞微知名未足稱局促商山芝定功曰皇甫謐髙士傳四皓作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢修可曰漢武帝曰局促效轅下駒五湖復浩蕩嵗暮有餘悲洙曰張景陽詩嵗暮懷百憂師曰幽人乃幽隱之士按唐史拾遺惠昭荀珏與甫友善常以詩相唱酬甫此詩思之故以二子自為幽人取易幽人貞吉之義神物龍也龍翔而雲從喻聖人出而賢人應之鳯之為物有道則見今雲未遇神龍鳯不遇有道之世雲則無所歸鳯則不來儀是以賢人幽隱此其時也海上有十洲乃神仙所居滄洲是其一也甫往與二子約中年功名成遂為滄洲之逰自别以來悄無消息殆恐二子以豫信道不篤見疵於豫是以棄我若遺而無所思也自洪濤隱語笑以下皆敘滄洲之興甫意謂若與惠詢輩遊滄洲則必鼓枻以拂扶桑之日映照珊瑚之枝順風挂帆輕倚翠蓋挹東皇漱元氣隱於煙霞之表雖功名赫赫未足為稱雖四皓歌紫芝猶為局促奈何言不相副今復飄泛五湖尚為羈旅况年以衰暮將與物化豈不為之悲傷乎佳人乾元二年作師曰詩簡兮刺不用賢云彼美人兮西方之人兮蓋言賢者有佳美之德此詩亦以佳人喻賢者若用新進少年至於踈棄舊臣甫寓意有此作非獨為佳人之什讀者可以意會補注鶴曰此詩乾元二年在秦州作甫自謂也亦以傷關中亂後老臣凋喪也絶代有佳人洙曰李延年歌曰北方有佳人絶代而特立幽居在空一作山谷洙曰詩皎皎白駒在彼空谷自云良家子洙曰趙充國傳六郡良家子零落依草木補注希曰阮嗣宗詩零落從此始魏文帝書曰數年之間零落殆盡關中昔喪敗一云喪亂兄弟遭殺戮官髙何足論不得收骨肉蘇曰崔𢎞磔於市骨肉不得收葬補注希曰前漢韓延壽傳民有骨肉爭訟南史王懿傳北土重同姓謂之骨肉有遠來相投者莫不竭力營贍續漢書冬十月骨肉合飲食於祖廟世情惡衰歇萬事隨轉燭蘇曰徐邈萬事興衰轉燭相似何必計較夫壻輕薄兒洙曰沈休文詩長安輕薄貌新人美如玉洙曰一云已如玉古詩燕趙多佳人美者顔如玉合昏尚知時定功曰本草云合歡即夜合也人家多植庭除間一名合昏陳藏器曰其葉至昏即合故曰合昏趙曰佳人自怨之辭言物之有合有偶而人之不若也天覺曰周處風土記云合昏槿也孝祥曰陸倕刻漏銘曰合昏暮捲蓂莢朝開鴛鴦不獨宿洙曰詩鴛鴦于飛鄭氏婚禮謁文贊曰鴛鴦鳥雌雄相類飛止相隨趙曰崔豹古今注曰鴛鴦鳬類也雌雄未嘗相離人得其一一思而死故謂之匹鳥但見新人笑那聞舊人哭趙曰李白亦云新人如花雖可寵人似玉猶來重在山泉水清出山泉水濁趙曰此佳人怨夫之辭逸曰晉孫綽蘭亭詩序曰古人以水喻性有旨哉斯談非以澄之則清混之則濁耶情因所習而遷移物因所遇而感興侍婢賣珠回洙曰東方朔傳董偃母以賣珠為事牽蘿補茅屋蘇曰陶宏景山居賦采芝菌為盤蔬牽藤蘿補嵓屋景差山齋云牽蘿遮壞籬挽葛補漏茅摘花不插髮修可曰一作髻以言其不事妝飾也采柏動盈掬洙曰詩終朝采緑不盈一掬蘇曰胡彛隱居衡山采柏子食年踰百嵗面類如兒童少壯追奔不及天寒翠袖薄日暮倚修竹趙曰上句言天色已寒而翠袖尚薄下句則所思逺矣師曰柏與竹嵗寒不改其操亦猶君子見逐于君而吾操守終無改易此所以為忠臣貞婦也赤谷西崦人家乾元二年作崦衣檢切師曰按地理志秦州有崦嵫山在赤谷之西曺操與劉備戰于此谷川水為之丹因號曰赤谷甫乾元元年貶華州司功屬關輔飢亂乾元二年遂棄官之秦州宿于赤谷西崦人家因有此作補注鶴曰按伊州納職縣亦有赤谷雖非此謾記隴有二赤谷乾元二年在秦州作躋險不自安洙曰安一作喧謝靈運詩濟險築幽居出郊已清目溪回日氣暖徑轉山田熟鳥雀依茅茨師曰言其靜也藩籬帶松菊師曰言其幽也如行武陵暮欲問桃源宿洙曰一本作桃花陶潛桃源記曰晉太康中武陵人捕魚為業緣溪行忽逢桃林夾岸數百步無雜木芳華鮮美落英繽紛漁人異之前行窮林盡見山有小口髣佛有光便捨舟步入初極狹行四五十步忽然開朗邑屋連接雞犬相聞男女披髮怡然自樂見漁父大驚問所從來要還為設酒食云先世避秦難率妻子來此遂與外隔絶西枝村尋置草堂地夜宿贊公土室二首補注鶴曰贊公謫居秦州公乾元二年七月自華之秦意欲居此故尋置草堂地西枝村在秦近郭有岩竇之勝杉黍之利贊嘗稱之公卒以關輔飢棄之同谷當是其年秋晚作故詩有天寒日短之句出郭眄細岑眄莫甸切劉曰眄斜視也披榛得微路洙曰趙景貞書涉澤求蹊披榛覔路溪行一流水曲折方屢渡贊公湯休徒洙曰惠休上人姓湯好靜心迹素晏曰素謂質素也昨枉霞上作盛論巖中趣洙曰後漢旌車之招相望於岩中怡然共攜手恣意同逺步捫蘿澀先登洙曰天台賦攬樛木之長蘿謝靈運詩蔓弱豈可捫陟巘眩反顧要求陽岡暖洙曰顔延年詩陽岡團精氣隂谷曳煙寒若涉隂嶺沍洙曰左太沖詩白雲亭隂岡丹葩曜陽林師曰山南曰陽山北曰隂山南向陽故暖山北背隂故沍寒惆悵老大藤沉吟屈蟠樹卜居意未展杖䇿回且暮洙曰左太沖詩杖䇿招隱士層巔一作天餘落日洙曰謝靈運詩築觀基層巔草蔓已多露洙曰盧子諒詩凝露霑蔓草天寒鳥已歸蘇曰鮑照詩天寒日已久出鳥自知歸又云天寒幽鳥歸月出山更靜洙曰山一作人更一作已土室延白光松門耿踈影洙曰謝靈運詩牽葉入松門躋攀倦日短語樂寄夜永洙曰天台賦恣語樂以終日趙曰天寒則時在冬故用日短夜永明燃林中薪暗汲石底一作泉井大師京國舊德業天機秉補注鶴曰贊公京中大雲寺主謫秦州安置故云從來支許逰洙曰支遁字道林講維摩經遁為法師許詢為都講遁衆謂無以歷難詢設一難以調遁不能復通興趣江湖逈數竒謫關塞洙曰李廣數竒孟康曰竒隻不偶也如淳曰數為丐奴所敗為竒不偶師古曰言廣命隻不耦合孟説是矣數所角反竒居冝反黃曰師古以數竒為命隻不耦合則數乃命數之數非疏數之數也而音所角反蓋傳印之誤也道廣存箕潁洙曰太丘道廣廣則難周謝靈運云徐幹有箕㯋之心何如戎馬間復接塵事屏必郢切幽尋豈一路逺色有諸嶺修可曰郭璞詩色上逺野嶺沉吟立夕陽晨光稍曚曨洙曰陶淵明恨晨光之熹微更越西南頂寄贊上人乾元二年作補注鶴曰摩訶般若經何名上人佛言若菩薩一心行阿耨菩提心不散亂是名上人增一經云處世有過能改者為上人當是乾元二年在秦州作一昨陪鍚杖洙曰天台賦振金䇿之鈴鈴金䇿鍚杖也補注希曰梵云阿若羅此云鍚杖經云又名智杖又名德杖顯智信功德本卜鄰南山幽洙曰左傳唯鄰是卜年侵腰腳衰未便隂崖秋趙曰晉潘嶽西征賦云眺華嶽之隂崖重岡北面起竟日陽光留茅屋買兼土買一作置斯焉心所求近聞西枝西有谷杉黍一作漆稠亭午頗和暖洙曰天台賦羲和亭午孝祥曰御覽載日初出曰旭曰昕曰晞在午曰亭午在未曰昧石田又足收夢符曰按春秋左傳吳將伐齊子胥曰夫得志於齊猶獲石田也無所用之越不為沼吳其泯矣今云石田足收則雖無用之田猶可獲而種也當期塞一作寒雨乾宿昔齒疾瘳徘徊虎穴上逸曰班超云不探虎穴焉得虎子面勢龍泓頭柴荆具茶茗徑路通林丘與子成二老來往亦風流洙曰謝靈運促裝反柴荆孫綽風流為一時冠師曰二老言太公伯夷避紂之亂故隱居東海北海之濵今甫亦避亂而卜隱居于此也太平寺泉眼乾元二年作補注鶴曰太平寺在秦州而詩云北風起寒文當是乾元二年秋冬之交作招提慿髙岡洙曰見已從招提遊注趙曰招提佛寺也西天謂寺為招提踈散連草莽洙曰景帝紀廣薦草莽草稠曰薦深曰莽出泉枯桞根汲引嵗月古石間一作門見海眼趙曰成都記云石笋之下是海眼孫曰成都府城西門外道傍有石笋蜀人言天以鎮海眼此泉從石中而出亦如海眼天畔縈水府歐曰小説潤州為中原水府修可曰張贊南征賦曽潭水府廣深丈尺間宴息敢輕侮青白二小蛇幽姿可時覩如絲氣或上爛熳為雲雨洙曰公羊傳曰觸石而出膚寸而合不崇朝而遍天下者太山之雲也山頭到山下鑿井不盡土取供十方僧香美勝牛乳北風起寒文弱藻舒翠縷舒一作勝明涵客衣淨細蕩林影趣何當宅下流餘潤通藥圃三春濕黃精一食生毛羽洙曰嵇康書又聞道士遺言餌术黃精令人久夀意甚信之黃曰神農本草黃精久服輕身延年趙曰鑿井自山頭至山下皆石而已不能窮盡至于土處也鑿井之難如此而得泉眼為可美佛經每以牛乳供僧夢李白二首大歷二年作補注鶴曰梁權道因舊次編在乾元二年秦州詩內按白乾元元年戊戌流夜郎寶應元年壬寅卒則此詩不應在乾元二年當是大歷二年故公嘗有詩大歷二年調玉燭玄元皇帝聖雲孫死别已吞聲洙曰鮑昭行路難吞聲躑躅不敢言生别常惻惻洙曰歐陽建惻惻心中酸楚辭悲莫悲兮生别離蘇曰馬融不忍生别我心惻惻江南瘴癘地洙曰劉孝標流離大海之南寄命瘴癘之地趙曰白坐永王璘之纍當誅郭子儀請解官贖罪詔長流夜郎會赦還潯陽坐事下獄潯陽今之江州也屬江南東路故云補注鶴曰夜郎雖在榮州在長安視之則江南矣其囚潯陽則江南郡也逐客無消息魯曰李斯為秦逐客故人入我夢明我長相憶洙曰樂府云夢見已在傍忽覺在他鄉上有加餐食下有長相憶恐非平生魂路逺不可測補注希曰韓非子曰六國時張敏與髙惠二人為友每相憶不能得見敏便於夢中往尋但行至半道即迷不知路遂回故沈約詩夢中不識路何以慰相思又文選樂府道逺不可思宿昔夢見之魂來楓林青洙曰阮籍詩湛湛長江水上有楓樹林魂返關塞黑今君在羅網蘇曰魏夀云婦人女子一旦陷君在羅網何以有羽翼洙曰時白為永王事放逐落月滿屋梁洙曰宋玉神女賦若白月初出照屋梁猶疑照顔色彥輔曰西清詩話云太白歷見司馬子微謝自然賀知章或以為可與神遊八極之表或以為謫仙人其風神超邁英爽可知後世詞人狀其風貌者多矣亦間於丹青見之俱不若少陵云落月滿屋梁猶疑照顔色熟味之百世之下想見風采此與李太白傳神詩水深波浪濶蘇曰宋玉海水深浩波浪廣闊非萬斛舟不可泛無使蛟龍得洙曰續齊諧記屈原五月投汨羅而死楚人哀之每至此日祭之漢建武中長沙人歐回見一人自稱三閭大夫曰吾嘗見祭甚善然為蛟龍所苦今若有惠可以棟葉塞之縳以五色絲此二物蛟龍所畏也師曰蓋言南海波濤之險恐其罹淪溺之患補注鶴曰舊傳太白溺於采石而新舊史俱不及此觀此詩乃是死後作故曰死别已吞聲而終云水深波浪濶無使蛟龍得殆誠有捉月之事舊史云竟以飲酒過度醉死於宣城雖隱而彰矣後篇云江湖多風波舟楫恐失墜然則誠有是事也浮雲終日行師曰楚詞云日暮碧雲合言君昏暗為羣小所蔽也遊子久不至洙曰古詩浮雲蔽白日遊子不顧反三夜頻夢君情親見君意告歸常局促苦道來不易江湖多風波一云秋風多舟楫恐失墜出門搔白首蘇曰諸葛松出門無往還時復搔白首若負平生志蘇曰李常一囊粟俸拘束塵埃中負平生山林之志冠蓋滿京華斯人獨憔悴上昨焦下秦醉切洙曰左太沖詩濟濟京城內赫赫王侯居冠蓋隂四術朱輪竟長衢寂寂揚子宅門無卿相輿孰云網恢恢洙曰老子天網恢恢踈而不漏將老身反纍蘇曰稽昴曰吾將老矣反為牛尾纍身千秋萬歲名寂寞身後事洙曰張翰曰使我有身後名不如即時一杯酒阮籍詩千秋百嵗榮名安所之補注希曰此蓋傷白身後惟有二孫女欲終老於青山而僅葬東麓而已若曰江湖多風波舟楫恐失墜殆真溺矣有懷台州鄭十八司户乾元二年作洙曰虔時坐汙賊貶台州司户補注鶴曰虔以至德二載貶台州是時公在諫省明年即有春深逐客一浮萍之詩矣此詩首云天台隔三江末云相望無所成當是乾元二年秦華間作天台洙曰天台山名隔三江洙曰一云江海師曰天台山在台州三江一錢塘二楊子三吳松補注希曰山海經云岷山大江所出崍山中江所出崌山北江所出東注大江公時在秦故言天台隔三江也風浪無晨暮鄭公縱得歸老病不識路洙曰沈休文夢中不識路何以慰相思趙曰韓非子中事六國時張敏與髙惠為友每相思不能得見敏便於夢中往尋但行至半道即迷不知路昔如水上鷗趙曰何遜詩曰可憐雙白鷗朝夕水上遊今如罝中洙曰詩肅肅罝蘇曰王瑀與弟書曰我若罝中毚雖能跳躑恐未免死補注希曰鮑昭詩昔如韝上鷹今如檻中猿公蓋用其律性命由他人悲辛但狂顧蘇曰周烋悲辛眩旋時復狂顧山鬼獨一腳洙曰一足曰夔魍魎也夢符曰右按楚詞屈原九歌章句有山鬼蝮蛇長如樹洙曰招魂蝮蛇蓁蓁雄虺九首呼號旁孤城歲月誰與度從來遇魑魅多為才名誤洙曰傳文十八年舜流四凶投諸四裔以禦魑魅山林異氣所生為人害者趙曰指言鄭公謫為台州司户夫子嵇阮流更被時俗惡洙曰嵇康書云阮嗣宗為禮法之士所繩故疾之為讎蘇曰傅休奕不才耿介多被時俗嫌惡海隅微小吏趙曰言鄭公反謫為小吏也補注希曰台州至海近三百里故云海隅眼暗髮垂素洙曰潘安仁秋興賦素髮颯以垂領黃帽映青袍洙曰一云鳩杖近青袍師曰黃帽乃竹籜冠補注希曰雋不疑傳著黃冒師古曰冒所以覆其首非供折腰具洙曰陶潛焉能折腰於閭里小兒趙曰黃帽非是當作鳩杖平生一杯酒洙曰沈休文詩平生少年日分手易前期勿言一樽酒明日難重持見我故人遇洙曰古詩瀟湘逢故人相望無所成乾坤莽回互洙曰言天地雖大胡為其身若無所容乎遣興三首乾元元年作補注鶴曰梁權道編在乾元二年秦州作以客子念故宅三年門巷空當是乾元元年在華州作蓋公以天寶十四載攜家避亂至乾元元年為三年是時公之弟在東都故第二篇言弟末篇言洛陽後果暫至東都蓬生非無根漂蕩隨髙風天寒落萬里不復歸本叢客子念故宅三年門巷空洙曰曹子建轉蓬離本根飄飄隨長風何意回飈舉吹我入雲中髙髙上旡極天路安可窮顧此遊客子捐軀逺從戎魏文帝詩客子常畏人補注鶴曰公以天寶十四載乙未十一月避賊往白水至乾元二年戊戌為三周年詳見題注悵望但烽火洙曰丐奴傳烽火通甘泉宫戎車滿關東洙曰詩戎車既戒生涯能幾何常在羈旅中我今日夜憂諸弟各異方不知死與生何况道路長洙曰蘇武詩良友逺别離各在天一方山海隔中州相去悠且長古詩相去萬餘里各在天一涯道路阻且長會面安可知避冦一分散飢寒永相望豈無柴門歸欲出畏虎狼仰看雲中雁禽鳥亦有行洙曰傅休奕仰觀鴈南翔昔在洛陽時親友相追攀送客東郊道遨遊宿南山洙曰張景陽詠史詩昔在西京時朝野多歡娛蕩蕩東都門羣公祖二踈曺子建鬬雞東郊道又驅上彼南山補注希曰東郊指洛陽之東遨遊二字出馬援傳煙塵阻長河樹羽成臯間洙曰有瞽崇牙樹羽羽旗也成臯在鞏洛間補注希曰唐志河南府有成臯府回首載酒地豈無一日還洙曰前漢揚雄傳好事者載酒過之陶潛親朋好事或載酒肴而往丈夫貴壯健慘戚非朱顔遣興五首乾元元年作補注鶴曰此詩當在乾元元年作祿山前一年死蓋公以元年六月出為華州司功而是詩有九月猶絺綌當是其年秋作梁權道編在乾元二年秦州詩內朔風飄胡鴈師曰祿山胡人故以胡鴈比之慘淡帶沙礫鄭曰浪狄切小石也洙曰鮑明逺詩朔風充塞起沙礫自飛揚補注希曰世説戴道一道人善為辭當途中逢雪人問其狀曰先集其慘淡長林何蕭蕭立之曰喻大材當亂世蕭條不見用也秋草萋更碧洙曰古詩秋草萋已緑立之曰草喻小人草逢秋宜凋瘁今乃萋萋而更碧北里富薰天洙曰左太沖北里吹笙竽大臨曰言武夫悍卒當祿山亂而能立功取冨貴是以冨貴之勢薰炙天地髙樓夜吹笛焉知南鄰客九月猶絺綌洙曰精曰絺粗曰綌君平曰隋袁充少時父黨過門方冬充尚衣葛戲充曰絺兮綌兮凄其以風充曰惟絺惟綌服之旡斁南鄰之客非服絺綌而旡斁也蓋貧而無禦寒之服故耳公詩乂曰花時甘縕袍暮春者春服既成花時而縕袍豈非無春服歟長陵鋭頭兒出獵待明發洙曰秦武安君頭小而鋭趙曰詩明發不寐補注希曰按史漢髙祖葬長陵在長安四十里騂弓金爪鏑白馬蹴微雪未知所馳逐但見暮光滅歸來懸兩狼洙曰詩並驅從兩狼兮師曰此詩諷國忠以貴妃之兄位宰相帶劍南節度未知所馳逐正詩不狩不獵之意歸來懸兩狼正詩有懸狟之意也門户有旌節洙曰楊國忠以劍南旌節導駕趙曰旌節貴人所建而羅列於門也漆有用而割膏以明自煎蘭摧白露下桂折秋風前洙曰莊子人間世山木自冦也膏火自煎也桂可食故伐之漆可用故割之兩龔死時有父老來弔哭甚哀既而曰嗟呼薰以香自燒膏以明自消阮籍詩膏火自煎燒大臨曰膏漆蘭桂皆有用之物喻賢人君子所以煎割摧折者以為小人所中傷也府中羅舊尹沙道尚依然洙曰故事凡拜相之後禮絶班行府縣載沙填路自私第至于城東街名沙堤赫赫蕭京尹今為時所憐洙曰前五行志成帝時童謡云云故為人所羡今為人所憐蕭望之嘗為左馮翊後飲鴆自殺蘇曰明皇雖誅蕭至忠常懷之故子美哀之云云趙曰蕭至忠參太平公主逆謀被誅雖已誅矣然明皇賢其為人心愛不忘髙力士曰彼不嘗負陛下乎帝曰至忠誠國器但晚謬爾其始豈不賢哉舊注引蕭望之飲鴆自殺非是補注鶴曰蕭至忠以參太平公主逆謀至先天二年主敗至忠遁入南山捕誅之猛虎慿其威蘇曰郭韞李鷹如猛虎慿威下視犬羊往往遭急縛洙曰曹操謂吕布縛虎不得不急補注希曰祿山以至德二載為李豬兒所殺故云雷吼徒咆哮枝撑已在腳忽看皮寢處洙曰子將食其肉寢處其皮立之曰左襄二十八年子雅子尾怒盧蒲蔽曰譬之禽獸吾寢處之矣注曰能殺而席其皮無復睛閃爍人有甚於斯足以勸元惡師曰祿山之猛可畏不啻於虎而終蒙葅醢亦足以為元惡之戒矣朝逢富家葬前後皆輝光共指親戚大緦麻百夫行送者各有死不須羡其強君看束縛去亦得歸山岡洙曰吳人殺諸葛瑾以籧篨裹尸束縛以篾棄之於石子岡十朋曰此詩譏貴妃於夙昔之日勢焰薰炙當世及祿山亂死于馬嵬山瘞于道傍豈非束縛之比耶遣興五首乾元二年作補注鶴曰乾元二年秦州作蟄龍三冬卧洙曰昜龍蛇之蟄以存身老鶴萬里心洙曰舞鶴賦結長悲於萬里昔時賢俊人未遇猶視今洙曰後之視今猶今之視昔也嵇康不得死洙曰一云且不死孔明有知音魯曰徐庶薦孔明又如壠底松用舍在所尋大哉霜雪幹歲久為枯林洙曰傷有材而不見用師曰龍雖蟄於冬至春則賴以沛霖雨喻孔明得徐庶之薦終則見用鶴雖心在萬里奈已老何喻嵇康日暮途窮左右無一言之援是以終死獄中嵇康孔明皆賢士也一則得君一則失勢豈非幸不幸耶昔者一作在龎德公未曽入州府襄陽耆舊間處士節獨苦洙曰後漢逸民傳龎德公者南郡襄陽人也未嘗入城府夫妻相敬如賔豈無濟時䇿一作術終竟畏羅罟彥輔曰一作終歲畏罪苦林茂鳥有歸水深魚知聚舉家隱鹿門劉表焉得取洙曰荆州刺史劉表數屈請不能屈乃就候之謂曰夫保全一身孰若保全天下乎龎公笑曰鴻鵠巢於髙林之上暮而得所棲黿鼉穴於深淵之下久而得所宿夫趨舍行止亦人之所巢穴也且各得其棲宿而已天下非所保也因釋耕于壠上而妻子耘于前表詣而問曰先生苦居畎畝而不肯官祿後世何以遺子孫乎龎公曰世人皆遺之以危今獨遺之以安雖所遺不同未為無所遺也表嘆息而去後遂攜其妻子登鹿門山採藥不反秦曰襄陽記云鹿門山舊名蘇嶺山襄陽侯習郁立神祠於山刻二石鹿夾道口俗因以廟名山陶潛避俗翁未必能達道蘇曰墨子未必達吾道觀其著詩集頗亦恨枯稿趙曰因陶潛而有所悟故於此詩非直詆陶也陶集中如飲酒詩雖留身後名一生亦枯稿其他皆類是豈不謂之頗恨枯稿乎達生豈是足默識蓋不早有子賢與愚何其挂懷抱立之曰山谷書淵明文有與五子疏又命子詩曰夙興夜寐願爾斯才才之不才亦已焉哉又責子曰雖有五男兒揔不好紙筆俗人便謂淵明諸子皆不肖而淵明愁嘆見於詩所謂癡兒前不得説夢也黃曰子美困於三蜀蓋不知者詬病以拙於生事又往往譏議宗文宗武失學故聊寄此詩於淵明以解嘲耳賀公雅吳語洙曰賀知章也蘇曰陸機雅能吳語吳兒聞之皆起歸思孝祥曰語林曰真長云丞相何竒止能作吳語及細唾也在位常清狂洙曰武五子傳清狂不惠凡狂者隂陽脈盡濁今此又不狂似狂者故言清狂也或曰色理清徐而心不惠曰清狂清狂如今白癡補注鶴曰舊史云知章性放橫善談論當時賢達皆傾慕之晚年尤加縱誕無復規檢自號四明狂客上疏乞骸骨蘇曰賈亮疏乞骸骨三上不答乃棄官隱中條黃冠歸故鄉蒼舒曰禮記郊特牲曰野服黃冠黃冠草服也爽氣不可致洙曰王徽之以手板拄頰云西山朝來致有爽氣耳斯人今則亡魯曰顔淵今也則亡補注鶴曰天寶三載知章因病恍惚乃上疏請度為道士求還鄉里上許之至鄉無幾壽終山隂一茅宇江海日凄涼洙曰知章事明皇為祕書監自號四明狂客及祕書外監晚節尤誕放請為道士歸鄉里以宅為千秋觀表求周官湖數頃為放生池有詔賜鏡湖一曲吾憐孟浩然短褐即長夜修可曰短當作裋見北征詩注王仲宣長夜何冥冥趙曰南史范曄在獄中為士題扇曰即長夜之悠悠賦詩何必多往往凌鮑謝魯曰鮑照謝眺蘇曰冮揔詞氣凌鮑謝筆迹踵二王史柄云足下新詩往往氣凌鮑謝趙曰往往者忽忽如此也應璩百一詩用等稱才學往往見歎譽也補注鶴曰舊史孟浩然隱鹿門山以詩自適年四十遊京師應進士不第張九齡鎮荆州署為從事與之唱和不達而卒浩然嘗曰賦詩何必多往往凌鮑謝此詩蓋公全用其兩句也清江空舊魚趙曰浩然嘗有詩曰試垂竹竿鋭果見查頭鯿今言清江之內空有舊魚而人不見春雨餘甘蔗每望東南雲蘇曰梁瑄不歸弟璟每見東南白雲即立望慘然久之令人幾悲吒陟駕切正作吒修可曰郭璞遊仙詩􅎔川哀年邁撫心獨悲吒趙曰浩然襄陽人襄陽在秦州之東南公思而不見故望雲而空悲吒耳前出塞九首乾元二年作補注鶴曰晉劉疇傳有出塞曲今謂之出塞當是乾元二年至秦州思天寶間事而為之戚戚去故里悠悠赴交河洙曰陸士衡悠悠行邁逺戚戚憂思深蘇曰古詩轉戰交河道修可曰按唐西州交河在伊州西七百里河水分流繞城下因以名之漢侯應上書云車師前國王治交河補注鶴曰西州交河郡在唐隴右道郡亦有交河縣自縣三百七十里至北庭都護府城備土畨之處也此言調丁屯守之害公家有程期洙曰程限期會也亡命嬰禍羅劉曰漢寶榮亡命山林趙曰畏公家之期程而逃亡其命則必有收捕禍所及矣君已富土境蘇曰徐越吾君土境逺方物富備而又取炎瘴之地恐後為中國患開邉一何多師曰此句譏祿山國忠之徒為國生事於夷狄也棄絶父母恩吞聲行負戈泰伯曰李奎被掠毁冠裂冕吞聲負戈出門日巳遠不受徒旅欺師曰此言離家日久已習戰鬬之事故徒旅不能欺也骨肉恩豈斷竦曰蘇武詩骨肉枝葉男兒死無時走馬脫轡頭梅曰木蘭曲云南市買轡頭手中挑青絲洙曰梁簡文帝紫騮馬詩青絲懸玉鐙趙曰宛轉青絲鞚絲馬鞚也捷下萬仞岡俯身試搴旗洙曰曺子建仰手接飛猿俯身散馬蹄左太沖振衣千仞岡又斬將搴旗磨刀嗚咽水嗚一作呼水赤刃傷手欲輕腸斷聲心緒亂已久洙曰鮑昭詩行子心腸斷修可曰辛氏三秦記隴山肝天水大坂也俗歌云隴頭流水嗚聲幽咽遙望秦川腸斷絶故曰嗚咽水丈夫誓許國憤惋復何有鄭曰惋烏樌切驚歎也功名圖騏驎蘇曰羊引基曰丈夫兒功名立于少壯時期圖于騏驎何苦苦守筆硯度日而已鄭曰騏驎漢閣名圖畫功臣於此戰骨當速朽洙曰孔子曰死不如速朽師曰丈夫以身許國此勸以義之意送徒既有長丁丈切洙曰髙祖以亭長為縣送徒驪山逺戍亦有身生死向前去不勞吏怒嗔師曰足見其強驅人于戰豈所謂悅以犯難民忘其死者乎路逢相識人附書與六親哀哉兩決絶不復同苦辛洙曰國宗領劒南募使遣戍瀘南餉路險乏舉無還者人人思亂此詩所以作也迢迢萬餘里領我赴三軍軍中異苦樂主將寧盡聞洙曰王仲宣從軍詩從軍有苦樂但問所從誰師曰為將之道甘苦與衆同之今將樂而士苦苦樂之異如此豈善撫循士卒者乎隔河見胡騎倐忽數百羣我始為奴僕幾時樹功勳禹稱曰漢衛青奮于奴僕挽弓當挽強蘇曰張諒少壯氣鋭好挽強弓明帝用為校尉補注希曰周勃傳注服虔曰引強弓弩官也孟康曰如此挽強司馬也用箭當用長洙曰朝錯云弩不可以及逺與短兵同射不能中與亡矢同中不能入與亡鏃同射人先射馬擒賊先擒王洙曰前丐奴傳月氏欲殺冒頓冒頓奔歸頭曼頭曼令將萬騎冒頓乃作鳴鏑習勒其騎射令曰鳴鏑所射而不悉射者斬後冒頓以鳴鏑射單于善馬左右悉射之冒頓知其可用遂以鳴鏑射頭曼左右皆隨之遂殺頭曼而自立師曰甫謂射馬擒王不欲多殺傷也殺人亦有限立國自有疆蘇曰左思曰列國分王自有疆界茍能制侵陵豈在多殺傷趙曰孟子曰定于一孰能一之不嗜殺人者能一之而喜開邊者乃好大喜功之士則公之詩豈不益於教化乎驅馬天雨雪軍行入髙山徑危抱寒石指落曽冰間洙曰陸士衡驅馬涉隂山山隂馬不前仰慿積雪巖俯涉堅氷淵修可曰前胸奴傳胸奴攻太原髙帝自將兵擊之會冬雨雪士卒墮指者十二三已去漢月逺何時築城還浮雲暮南征可望不可攀師曰暮望歸雲南征不得與之還是故嘆云云單于寇我壘百里風塵昏朝曰王僧逹詩千里暮沙昏雄劒四五動彼軍為我奔夢符曰按吳越春秋吳王闔閭使干將造劍二枚一干將二鏌鎁陽曰干將而作龜文隂曰鏌鎁而作漫理雄猶陽也修可曰烈士傳眉間尺楚人干將鏌鎁之子楚王夫人常於夏納涼而抱鐡柱心有所感遂懷孕後産一鐡楚王命鏌鎁鑄為雙劍一雌一雄鏌鎁乃留雄而以雌進楚王劍在匣中常悲鳴楚王問羣臣對曰劍有雌雄鳴者雌憶其雄也王大怒收鏌鎁殺之眉間尺乃為其父殺楚王虜其名王歸修可曰前丐奴傳霍去病衛青操兵歸瀚海虜名王貴人以百數繫頸授轅門洙曰曹子建求自試表昔賈誼弱冠求試屬國請繫單于之頸而制其命終軍使越欲得長纓繫其王羈致北闕唐曰宣帝紀單于遣其名王奉獻師古注名王謂有大名以别諸小王也韓曰轅門出周禮掌舍掌王之會同之舍設車宮轅門潛身備行列蘇曰盧綏潛身屈志暫備行列一勝何足論蘇曰孫子曰一勝一負兵家常事不足論也從軍十年餘能無分寸功衆人貴茍得欲語羞雷同洙曰曲禮毋雷同注雷之發聲物無不同時應者中原有鬬爭况在狄與戎洙曰書蠻夷猾夏詩戎狄是膺丈夫四方志洙曰禮射義桑弧蓬矢以射天地四方示男子之有志也安可辭固窮琪曰語君子固窮梅曰甫於斯時寧可固窮不敢為國生事雖無分寸之功其忠於君可見矣後出塞五首乾元二年作鮑曰天寶十四年乙未三月壬午安祿山及契丹戰於漢水敗之故有後出塞五首為出兵赴漁陽也補注鶴曰同是乾元二年作男兒生世間及壯當封侯洙曰後漢班超常投筆歎曰無他志略猶當效傅介子張騫立功異域封侯安能事筆硯乎梁竦大丈夫生當封侯戰伐有功業焉能守舊丘趙曰鮑明逺云去鄉三十載復得還舊丘召募赴薊門洙曰鮑明逺始隨張校尉召募到河源呂曰召募字出吳志中郎將周祗乞於鄱陽召募蓋召謂自隱度而應募為召募也軍動不可留千金買馬鞍百金裝刀頭洙曰唐刺史見觀察使皆抹首靴足握刀頭候路左閭里送我行親戚擁道周趙曰有杕之杜生于道周班白居上列洙曰班白者不負戴於道路矣酒酣進庶羞趙曰周禮庖人供喪紀之庶羞少年别有贈含笑看吳鈎洙曰鮑明逺詩錦帶佩吳鈎薛曰歷按吳越春秋吳王分聘歐治子作名劍五一曰純鈎二曰湛盧三曰豪曹四曰魚腸五曰巨闕秦客薛燭善相劍吳王取純鈎示之薛燭曰光乎如屈陽之華沉沉如芙蓉始生於湖觀其文如列星之行觀其光如水溢於塘此純鈎也修可曰吳王闔閭命國中作金鈎令曰善者賞之百金有貪王之重賞者殺其二子以血釁金遂成二鈎獻而求貪王曰為鈎者衆子獨求賞何以異作鈎者曰吾之作鈎也殺二子釁成二鈎於是向鈎而呼二子之名曰我在此王不知汝之神也聲絶於口兩鈎俱飛著父之胸王大驚曰寡人誠負於子乃賞百金遂服而不離身見吳越春秋朝進東門營洙曰夏官大司馬師以門名疏古者軍將蓋為營治於國門魯有東門襄仲宋有桐門右師皆上卿為將軍者暮上河陽橋洙曰李陵詩攜手上河梁遊子暮何之鄭曰河陽洛邑也落日照大旗馬鳴風蕭蕭洙曰車攻蕭蕭馬鳴荆軻歌風蕭蕭兮易水寒平沙列萬幕部伍各見招洙曰李廣幕府注幕府者以軍幕為義軍旅無常居止故以帳幕言之程不識正部曲行伍營陳擊刁斗趙曰士卒之多則將各有一幕故一部伍之人各相招認以居幕也中天懸明月洙曰子虛賦曵明月之珠旗令嚴夜寂寥趙曰但見月懸中天正照此夜而人不囂譁則令嚴可知悲笳數聲動洙曰李陵書胡笳互發牧馬悲鳴沈曰笳居牙切塞上卷蘆葉以吹壯士慘不驕借問大將誰恐是霍嫖姚鄭曰嫖頻妙切洙曰霍去病為嫖姚校尉服虔曰嫖姚徑直之貌荀悅漢紀作票字霍去病後為票騎將軍尚取嫖姚之字耳今讀者音票遙不當其義十朋曰衛霍皆椒房之親以致顯貴故比之國忠然國忠以寵幸進驕暴不恤士卒士卒皆疾之故云恐是霍嫖姚補注希曰服虔曰嫖頻召反姚羊召反今詩乃平聲古人重守邉今人重髙勳洙曰重守邉保其疆埸而巳重髙勳則邀功而生事此後世所以有窮兵黷武之君也補注鶴曰楊國忠雖當國常領劍南召募使遣戍瀘南餉路險乏舉無還者舊勳户免行所以寵戰功國忠令當行者先取勳家豈知英雄主出師亘長雲鄭曰亘居鄧反極也六合巳一家四夷且孤軍洙曰髙祖曰天下同姓一家慎毋反以六合為一家遂使貔虎士奮身勇所聞洙曰牧誓如虎如貔拔劍擊大荒洙曰見回略大荒來注髙祖紀拔劍擊柱日收胡馬羣洙曰古詩胡馬嘶北風誓開玄冥北趙曰玄冥北方之神也玄冥北則玄冥所主之北地也持以奉吾君洙曰或擊大荒或開玄冥之北為國生事持此功以獻捷於君雖受髙爵重祿不亦厚顔乎此詩諷國忠之徒獻凱日繼踵洙曰周禮注凱獻功之樂兩蕃靜無虞蘇曰段容曰西北安靜二蕃旡虞年榖屢豐符瑞荐至正陛下修文養士之際趙曰西北兩蕃已寧矣漁陽豪俠地洙曰漁陽北地也朱叔元書奈何以區區漁陽結怨天子擊鼓吹笙竽洙曰左太沖南鄰擊鐘磬北里吹笙竽趙曰燕薊巳復而民樂也雲帆轉遼海洙曰遼海遼東郡蘇曰吾欲張片帆泛日本轉遼海採訪海外奇異非區區守一别駕折腰於子輩耶粳稻來東吳越羅與楚練照耀輿臺軀洙曰昭七年傳皂臣輿僕臣臺曹子建下逮輿臺主將位益崇氣驕凌上都邊人不敢議議者死通衢洙曰時好邊功李林甫任蕃將也師曰主將祿山也祿山兵還賞賚無資玄宗御承天門率百官迎迓祿山恃功髙氣凌公卿誰復敢議其事哉補注希曰兩蕃謂吐蕃與奚契丹祿山討之又楊國忠嘗遣劍南留後李宓率兵十餘萬擊閣羅鳯敗死西洱河國忠矯為捷書上聞自再興師傾中國驍騎二十萬騎屢舉無遺天下寃之主將當指安與楊而言以其皆生邊患又矯為捷書以罔上也我本良家子洙曰石季倫詩我本漢家子趙充國傳六郡良家子出師亦多門蘇曰田穰苴戰伐出師多門余曰左成十六年晉政多門將驕益愁思身貴不足論躍馬二十年恐辜明主恩洙曰蔡澤曰躍馬疾驅四十三年足矣薛曰右按古樂府以死報君恩誰能辜恩眄坐見幽州騎長驅河洛昏洙曰時祿山自幽州陷河洛曹子建幽并逰俠兒長驅陷胸奴中夜間道歸端本曰藺相如使人奉璧間道馳歸趙補注希曰髙祖紀從間道走歸師古曰間空也投空隙而行不公顯也故里但空村洙曰顔延年去國還故里幽門蔚蓬藜師曰言國忠聞祿山有變已陷兩都遂脫身自微路歸恐為姦盜所獲故里但空村言居民盡避胡也惡名幸脫免蘇曰岑永幸脫此惡名當洗耳浣心老采笋蕨窮老無兒孫蘇曰詳味此詩蓋祿山反時其將有脫身歸國而祿山盡殺其妻子者不出姓名亦可恨也補注杜詩卷五
