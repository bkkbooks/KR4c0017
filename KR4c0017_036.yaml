body:
  text: 補注杜詩巻三十六宋黄希原本黄鶴補注重送劉十弟判官大厯四年秋作補注鶴曰詩云他日臨江待長沙舊驛樓當是大厯四年秋在潭州作故詩又云别浦鴈賔秋分源豕韋𣲖洙曰韋賢傳詩曰肅肅我祖國自豕韋應劭曰在商為豕韋氏趙曰言劉與杜同出也漢高祖紀贊曰春秋晉史蔡墨有言陶唐氏既衰其後有劉累學擾龍事孔甲范氏其後也而大夫范宣子亦曰祖自虞以上為陶唐氏在夏為御龍氏在商為豕韋氏在周為唐杜氏晉主夏盟為范氏别浦鴈賓秋洙曰月令秋月鴻雁來賔蘇曰張衡云賔雁别浦蘆葦將秋年事推兄忝洙曰張釋之兄事袁盎趙曰劉孝標答郭峙書云頃年事道容髮衰謝年事蓋言年歲之事也舊引張釋之兄事袁盎非是人才覺弟優經過辨豐劔洙曰晉書曰斗牛之間有紫氣雷煥曰寳劔之精上徹於天耳在豫章豐城令掘獄屋基入地四丈得石函中有雙劔一曰龍泉一曰太阿意氣逐吳鉤修可曰吳鈎見出塞詩含笑㸔吳鈎註趙曰舊引鮑明逺詩錦帶佩吳鈎而不講其物沈存中云吳鈎者刀名也刀彎今南蠻用之謂之葛黨刀也垂翅徒衰老洙曰馮異傳始雖垂翅回谿終能奮翼澠池可謂失之東隅收之桑榆先鞭不滯留趙曰劉琨與親舅書曰某枕戈待旦志梟逆虜常恐祖生先吾著鞭耳本枝凌歲晚高義豁窮愁他日臨江待長沙舊驛樓奉贈盧五丈參謀琚大厯四年作鄭曰琚斤於切洙曰丈人使自江陵在長沙待恩㫖先支率錢米補注鶴曰唐志元帥副元帥府有行軍叅謀關豫軍中機宻開元十二年罷尋復置詩云恭惟同自出蓋公之祖母盧氏即所誌范陽太君者叅謀其族之長故云後有送盧十四弟詩亦其族子也大厯四年潭州作恭惟同自出洙曰左傳我之所自出謂我甥也補注希曰竇融傳孝景皇帝出自竇氏注云出生也爾雅曰男子謂姊妹之子曰出妙選異高標入幕知孫楚洙曰孫楚字子荆石苞都督揚州事孫楚為叅軍披襟得鄭僑趙曰左傳季札聘於鄭見子産如舊相識丈人藉才地趙曰丈人指言盧五叅謀門閥冠雲霄老矣蓬迎拙相於契托饒趙曰言雖寰老拙於逢迎而與盧所以契託饒縱也賜錢傾府待爭米駐船遥趙曰題注所謂支率錢米也補注希曰待一本作侍謂江陵府也鄰好艱難薄氓心杼軸焦夢符曰按揚雄方言土作謂之抒木作謂之軸大東小東杼軸其空又後漢劉騊駼書曰抒軸空於公私之求趙曰盧之使江陵也當艱難之際杼軸空而民心焦敖不可多斂以為鄰好之奉也客星空伴使洙曰見釣瀬客星懸注趙曰客星公自謂也伴使以言伴盧之為使星也舊注引嚴陵事雖有客星兩字而惑亂其義矣寒水不成潮素髪乾垂領乾居寒切洙曰秋興賦素髪颯以垂領銀章破在腰蘇曰張嵩清儉守莭為邑西令官滿駕柴車載書數百巻腰垂破銀章辭邑人而去邑人惜其去懇留於隋文帝即日擢為巴西太守有徳政遺愛碑尚在余為兒童時聞先予對客談此説詩能累夜醉酒或連朝洙曰中山有酒一醉千日趙曰公自言也藻翰為牽率洙曰左傳牽率老夫湖山合動揺蘇曰王逸少清氣壯莭揺湖山時清非造次興盡却蕭條天子多恩澤蒼生轉寂寥休傳鹿是馬洙曰趙高指鹿為馬莫信鵩如鴞洙曰見地濕愁飛鵩注未解依依袂還斟汎汎瓢流年疲蟋蟀洙曰詩蟋蟀在堂歲聿云暮古詩四時更變化嵗暮一何速晨風懐苦心蟋蟀傷局促體物幸鷦鷯洙曰莊子鷦鷯巢林不過瀏一枝陸機文賦賦體物而亮張茂先作鷦鷯賦辜負滄洲願洙曰謝𤣥暉詩復叶滄洲趣蘇曰嵇紹云年來名利汩没未遂休閒深負滄洲願心誰云晚見招趙曰此公感激之言揚雄檄虚賦曰世有黄公者起於滄洲精神養性與道漂游太沖詩曰馮公豈不偉白首不見招李陵云陵雖孤恩漢亦負徳孤負本只是孤獨之孤舊注辜負流傳之誤師曰前漢朱博傳齎閥閲詣府師古注曰伐功勞也閲所經歴也車千秋傳曰千秋無伐閲勞注伐積功也閲所經也唐六典以上通用烏頭大門又曰表揭又曰閥閲義謝云表揭閥閱是也俗呼為櫺星門是詩所謂閥閲冠雲霄者藎言盧氏積日樍月立功而致表揭高於雲霄賜錢傾府待爭米駐船遥謂盧氏待㤙㫖未到先支錢米以民心焦勞也寒水不成潮言水淺也峽人以春水生乃行船自素髪以下乃子美自述休傳鹿是馬言天子聰明也莫信鵩如鴞言莫愁遷謫也滄洲神仙所居之地也登舟將適漢陽大厯四年秋作補注鶴曰詩云春宅棄汝去秋帆催客歸公以大厯四年至潭州因居焉故名春宅則詩當在四年秋作其後不果歸漢陽是年十一月吐蕃㓂靈州盖自大厯元年以來無歲無其禍故又云中原戎馬盛春宅棄汝去趙曰公二月到潭州因居焉則自春所有之宅名之曰春宅秋帆催客歸趙曰将歸秦也庭蔬尚在眼浦浪巳吹衣蘇曰江淹云浦浪輕花泛沙風吹客衣生理飄蕩拙蘇曰吳産飄蕩牢落拙治生計幾為人笑吾愧於朋友何日反故山采杞菊枕石漱泉遂此麋鹿之性有心遲暮違趙曰遲暮晚年也楚詞傷美人之遲暮中原戎馬盛逺道素書稀修可曰古詩呼兒烹鯉魚中有尺素書塞鴈與時集檣鳥終歲飛趙曰帆檣之上刻為鳥形敢以為占風鹿門自此徃趙曰龎徳公攜妻子隠於鹿門永息漢隂機洙曰見煑井復猾二注暮秋將歸秦留别湖南幕府親友大厯五年作補注鶴曰大厯五年秋公欲北首而卒故誌云竟以寓卒殯於岳陽雖與史異然當以詩為定若以此詩為四年秋作則前篇題云将適漢陽此題又云将歸秦不應一時所鄊不同故知為大厯五年作水闊蒼梧野洙曰謝𤣥暉詩雲去蒼梧野水還江漢流天高白帝秋途窮那免哭洙曰顔延年途窮能無慟身老不禁愁蘇曰孔伸年老失意不禁愁恨大府才能㑹諸公徳業優北歸衝雨雪誰憫敝貂裘洙曰一云俱愍敝貂裘見季子貂裘敝注趙曰公以蘇秦自比也送盧十四弟侍御䕶韋尚書靈櫬歸上都二十四韻大厯四年冬作補注鶴曰詩云清霜洞庭葉故就别時飛當是大厯四年冬作蓋公又有舟中懐盧十四侍御弟云朔風吹桂水則是其冬在潭州作盧侍御乃公之祖母盧氏姪孫故呼為弟韋尚書即後篇哭韋大夫之晉素幕渡江逺朱幡登陸微洙曰漢二千石朱轓兩輪趙曰朱幡丹旐也舊引漢二千石朱兩轓誤矣轓字從車幡字從巾義不同也補注鶴曰素幕既渡江而朱幡乃登陸則又非丹旐矣若是丹旐則與之俱渡江矣當是軍校送之者衛青傳傳校䕶王師古注校者營壘之稱故謂軍之一部為一校或曰幡旗之名非也每軍一校則别為幡耳悲鳴駟馬顧趙曰有戀生之意失涕萬人揮洙曰陸士衡揮淚廣川隂又得與故人揮參佐哭辭畢門闌誰送歸補注希曰叅佐謂佐史叅軍也類要所謂叅佐使局舊有用此二字者劉三復亦云叅佐賔筵從公伏事久之子俊才稀長路更執紼此心猶倒衣洙曰詩自公召之顛倒裳衣感恩義不小蘇曰夏侯勝感恩戀徳義實不小懐舊禮無違墓待龍驤詔修可曰唐史遺事武后幸洛陽至閿郷縣東騎不進召巫問之巫曰晉龍驤將軍王濬云臣墓在道南每為樵採所苦聞大駕至故哀求后遂詔去墓百歩不得樵採子美八哀詩亦云虚無馬融笛悵望龍驤塋趙曰晉王濬為龍驤将軍卒葬柏谷中大營塋域待龍驤詔則言盧尚書之墓如王濬者也臺迎獬豸威趙曰獬豸侍御史冠也獬豸獸名知人曲直而觸不直者此言韋尚書靈櫬至上都而送之者盧侍御也深衷見士則雅論在兵機趙曰世説鄧艾年十二至潁川讀陳大丘碑文曰言為世範行為士則遂自名範字士則補注希曰衷一本作哀戎狄乗妖氣塵沙落禁闈趙曰禁闈天子之内也此言吐蕃陷京師也徃年朝謁㫁修可曰言去上都之久而斷朝謁也他日掃除非但促銅壺箭洙曰漏刻銘筮筩方圓之制注金謂壺又云銅史司刻金徒抱箭休添玉帳旂趙曰玉帳将軍之帳也補注希曰抱朴子外篇軍在太一玉帳之中不可攻也動詢黄閣老洙曰見扈聖登黄閣注肯慮白登圍洙曰前漢匈奴傳高帝至平城步兵未盡到冒頓縱精兵三十萬圍於白登七日漢兵中外不得相救高帝乃使間厚遺閼氏迺謂冒頓曰兩主不相困今得漢地單于終不能居之取閼氏之言迺為開一角於是高帝從解角直出與大軍合而冒頓遂引兵罷使劉敬結和親之約趙曰言天子雖屢詢大臣而莫知以白登之圍為慮者此豈勸親征之徒歟朱忠曰三公黄閣鄭曰白登地名在平城東南十餘里萬姓瘡痍合蘇曰邢元云萬姓瘡痍始合兵甲尚未全息恐西北乗勢再為患也趙曰言其困於誅求役使也羣兇洙曰一云雄嗜慾肥趙曰言将帥乘此為驕也刺規多諫諍趙曰所望於盧侍御也端拱自光輝儉約前王體風流後代希趙曰言盧侍御之登對所論之事如此對敭期特逹敭與揚同衰朽再芳菲趙曰言對敭天子之前當在特達而勿委靡則衰朽之人再獲芳菲言同受其樂也空裏愁書字洙曰見咄咄正書空注山中疾採薇洙曰伯夷傳登彼西山兮采其薇兮撥盃要忽罷抱被宿何依蘇曰聶授抱被隨王肅棺宿趙曰撥盃者揮盃也既别矣撥盃之相要忽罷平昔抱被就宿今又何依也眼冷看征蓋兒扶立釣磯清霜洞庭葉故就别時飛洙曰楚辭湘夫人洞庭波兮木葉下哭李常侍嶧二首大厯三年作鄭曰嶧夷益切補注鶴曰唐志左右散騎常侍隷門下中書省掌規諷過失侍從顧問左為左貂右為右貂故詩云猶想映貂金詩又云江漢哭君時當是大厯三年在荆南作而梁權道編在四年潭州詩内潭不應言江漢也考詩當是李死於嶺南而歸𦵏長安公逢於江漢間而哭之一代風流盡蘇曰曹桴曰子建没陳劉俱逝一代風流從此盡矣後世誰氏可繼高名趙曰南史張緒死其從弟融於緒靈前酌飲慟哭曰阿兄風流頓盡修文地下深洙曰見修文地下郎注顔淵為地下修文郎斯人不重見蘇曰山巨源哭嵇康曰中散死埋玉重泉沉珠滄海不重見斯人矣趙曰孔子言伯牛之疾曰斯人也而有斯疾也蓋嗟其人之賢也將老失知音洙曰伯牙以鍾子期為知音子期死而牙絶絃蘇曰鮑叔云将老矣遽失知音趙曰指李常侍如子期也曹丕與吳季質書曰昔伯牙絶絃於鍾子期仲尼覆醢於子路痛知音之難遇傷門人之莫逮也短日行梅嶺寒山洙曰一作江落桂林趙曰言李常侍之櫬自廣南來也大庾嶺多梅故謂之梅嶺廣志曰桂生於高山之嶺其類自為林補注希曰史記東越傳令諸校屯豫章梅嶺山海經云桂林八樹在番隅東番隅即畨禺也若以桂州為梅林則梅嶺非桂林所經之路長安若箇畔猶想映貂金洙曰侍中冠貂蟬阮脩以貂蟬換酒其二青瑣陪雙入銅梁阻一辭洙曰見通籍踰青瑣注蜀有銅梁縣補注希曰表記一辭而退風塵逢我地江漢哭君時次第尋書札呼兒檢贈詩洙曰古詩遺我一書札义呼兒烹鯉魚文選有贈答詩發揮王子表不愧史臣詞定功曰常侍者宗室之子也故用王子表字前漢書有王子侯表哭韋大夫之晉大厯四年夏作補注鶴曰公有送韋中丞赴湖南詩兹云韋大夫則韋在湖南升大夫矣詩云誰㫁方隅理朝難将相權當是韋鎮湖南死於鎮所大厯四年夏作故詩又云城府深朱夏悽愴郇瑕邑洙曰左傳晉謀去故綘諸大夫曰必居郇瑕氏之地鄭曰郇須倫切國名差池弱冠年洙曰曲禮上二十曰弱冠士人叨禮數補注希曰士人一本作丈人一本作大人文律早周旋洙曰左傳與君周旋臺閣黄圖裏洙曰三輔黄圖又漢宫闕詔簪裾紫盖邉洙曰沈休文碑陪龍駕於伊洛待紫葢於咸陽尊榮真不忝端雅獨翛然貢喜音容間洙曰見切效貢公喜注馮招疾病纒洙曰左太沖馮公豈不偉白首不見招鄭曰馮唐南過駭倉卒上采莽切下七没切北思悄聯緜洙曰洞簫賦吟氣遺徃聫緜飄徹又云翩緜聨以牢落鵩鳥長沙諱洙曰見地濕愁飛鵩注犀牛蜀郡憐洙曰見石犀牛行素車猶慟哭寳劔欲高懸洙曰見把劔覔徐君注漢道中興盛韋經亞相傳洙曰建武永平未盡中興之美韋賢不如教子一經沖融標世業磊落映時賢城府深朱夏江湖眇霽天倚樓關樹頂洙曰古詩西北有高樓交疏結綺窗飛旐泛堂前洙曰寡婦賦飛旐翩以啓路帟幕旋風燕洙曰帟幕霄懸笳簫急暮蟬興殘虚白室洙曰荘子虚室生白跡㫁孝亷船洙曰世説張憑舉孝亷負其才自謂必叅時彦初欲詣劉真長鄉里及同舉者共笑之張遂徃詣真長延之上座清言彌日因留宿至曉張退劉曰卿且前去當取卿共詣撫軍張還船同旅問何處宿張笑而不答湏㬰真長遣傳教覔張孝亷船同旅驚愕即同載詣撫軍至門劉進曰下官今日與公得一太常博士撫軍與之言咨嗟稱善即用為太常博士童孺交遊盡喧卑俗事牽老來多涕淚情在強詩篇誰繼方隅理朝難將帥權春秋褒貶例名器重雙全師曰郇瑕晉地韋大夫靈櫬歸晉故子美悽愴以傷之子美少與公結交故云差池弱冠年王陽在位貢禹喜而彈冠子美上韋左丞詩云竊效貢公喜今巳死故曰貢喜音容間子美擬效馮公之招隠奈為疾病所纒而巳鵩鳥長沙諱子美自言斥逐困於此地也犀牛蜀郡憐言蜀人畏韋之徳也綺樓關樹頂言奠樓之高也帟幕旋風燕言子美之失韋無所棲托如燕之巢於風幕也惟名與器不可以假人韋之化去朝廷慎難不輕以帥權授人故云誰繼方隅理舟中夜雪有懐盧十四侍御弟大厯四年冬作補注鶴曰此詩當是盧送韋大夫歸柩公對雪而懐之也故有暗度南樓月之句南樓在武昌庾亮諸佐吏共登者必盧過鄂故云在大厯四年冬作朔風吹桂水大雪夜紛紛暗度南樓月寒深北渚雲洙曰北渚有帝子燭斜初近見舟重竟無聞不識山隂道聽雞更憶君蘇曰郭璞寄宋平詩云夜夢江山逺聞難更憶君趙曰語林曰王子猷居山隂大雪夜開室命酌四望皎然因懐招隠詩忽憶戴安道對雪北雪犯長沙胡雲冷萬家晏注曰北地多雪長沙南郡偶有此故云補注希曰唐張謂長沙風土碑曰遁甲所謂沙土之地雲陽之墟可以長徃可以隠居者焉隨風且間一作開葉趙曰當作開言雪随風灑於葉上而開也帶雨不成花金錯囊從罄洙曰張平子云美人贈我金錯刀趙宣云不如一囊錢杜云此専言錢也漢王莽鑄大錢又造錯刀以金錯其文此錢形之如刀而金錯之之證蘇曰科文云共君莫惜醉罄此金錯囊銀壺酒易賖補注希曰後漢劉盆子傳吕母釀醇酒年少來酤者皆賖與之义高祖紀貰酒注賖酒也無人竭浮蟻趙曰浮蟻酒也祖出釋名曰酒有泛齊浮蟻在上有待至昏鴉洙曰公自注何遜詩城隂度塹黒昏鴉接翅歸王立之評曰昏鴉亦常語何必引遜句後作絶句却云釣艇收緡盡昏鴉接翅稀補注希曰公作絶句在此詩之前而公於此方引遜句何也豈不以昏鴉常用之字猶有所本故再用之乃引遜為證欲人不輕用字也冬晚送長卿漸舍人歸州大厯三年冬作補注鶴曰此詩梁權道編在大厯四年而詩云西戎鄠杜傍却是年京師無吐蕃之禍按史三年八月吐蕃冦靈州邠州京師戒嚴九月又入冦京師戒嚴邠去京師不滿四百里所以言在鄠杜之傍若四年雖冦靈州而京師未嘗戒嚴殆與詩句不叶又詩云南客潇湘外盖是時公在岳陽故云四年公在潭正在瀟湘間自不言外矣當是三年冬晚作無疑參卿休坐幄蕩子不歸鄉洙曰古詩蕩子行不歸蘇曰顔延年古樂府嫁得遊蕩子一去未還鄉秋夜不肯明教妾卧幽房趙曰公自言也所公為劔南莭度使叅謀謂之叅卿公前為之而今罷此謂休坐幄列子曰人有去鄉土遊於四方而不歸者世謂為狂蕩之人也補注希曰以運籌帷幄故用坐幄字以明其罷叅謀古詩今為蕩子婦蕩子不知歸注婦人比夫為蕩子言夫從征役也臣之事君亦猶女之事夫故比而言之南客瀟湘外趙曰公北人也而在湘潭是為南客西戎鄠杜傍洙曰宣帝尤樂杜鄠之間杜屬京兆鄠屬扶風蘇曰漢明帝曰今西戎猖獗若不禦備恐犯鄠杜鄠縣杜陵俱屬京兆趙曰吐蕃之兵未息也師曰參卿言長卿坐於帷幄為參謀也蕩子子美自稱鄠杜乃京城吐蕃陷之故云西戎鄠杜傍衰年傾葢晚洙曰鄒陽傾葢如故費日繫舟長趙曰言舟留滯而未行也㑹面思來札洙曰古詩㑹面安可知又客従逺方來遺我一札書銷魂逐去檣洙曰别賦黯然銷魂雲晴鷗更舞風逆鴈無行趙曰列子云鷗鳥舞而不下詩云兩驂鴈行匣裏雌雄劔吹毛任選將暮冬送蘇四郎徯兵曹適桂州大厯四年冬作補注鶴曰通典漢司隷屬官有兵曹從事史蓋有軍事則置唐三都督府上中下州皆有之詩云盧綰須征日樓蘭要斬時蓋指大厯四年十二月桂州人朱濟反容管經略王翃敗之此當是其時作飄飄蘇季子六印佩何遲洙曰蘇季子言吾若有雒陽負郭三頃田安能佩六國相印乎早作諸侯客兼工古體詩洙曰見諸侯老賔客注陸士衡有擬古詩爾賢埋照久洙曰阮步兵詩沉醉似埋照余病長年悲盧綰須征日洙曰盧綰傳上使召綰稱病不行上怒曰綰果反使樊噲撃綰高祖崩綰遂将其衆亡入匈奴以為東胡盧王為蠻夷所侵奪居歲餘死樓蘭要斬時洙曰見樓蘭斬未還注歲陽初盛動趙曰十二月二陽生矣王化久磷緇洙曰見此道未磷緇注為入蒼梧廟看雲哭九疑師曰山海經云九疑山帝舜所𦵏在長沙零陵界又云南方蒼梧之淵舜之所葬湘中記曰九疑山在營道縣九山相似行者疑惑荆州記曰九疑山盤基數郡之界連峯接岫競逺爭高含霞巻霧分隔天日郡國志曰九疑山有九峯曰丹朱曰石城曰樓溪形如樓曰娥皇下有舜如曰舜源曰女英舜墓在此峯下曰肅韻曰紀峯曰紀林有九十補注希曰武帝紀望祀虞舜于九疑師古曰其山九峯形勢相似故曰九疑又列仙傳舜游南有王城瑶闕曰九疑之都桂與全相鄰全復鄰於道蘇溪適桂道所從出故云風疾舟中伏枕書懐呈湖南親友三十六韻補注鶴曰題云呈湖南親友而詩云故國悲寒望羣雲惨嵗隂鬱鬱冬炎瘴濛濛雨滯淫當是大厯四年冬作故詩又云書信中原闊干戈北斗深指是年吐蕃冦靈州時而云軒轅休製律洙曰甫自注云伏羲造瑟神農作琴舜彈五絃舉歌南風之篇矣史記黄帝名曰軒轅前漢律厯志黄帝使伶倫自大夏之西崑崙之隂取竹之嶰谷生而竅厚均者㫁兩莭間而吹之以為黄鍾之宫制十二筩以聽鳳鳴其雄鳴為六雌鳴亦六此黄鍾之宮而皆可以生之是為律本虞舜罷彈琴洙曰樂記舜作五絃之琴以歌南風尚錯雄鳴管趙曰前所謂十二筩以聽鳳之鳴其雄鳴六也猶傷半死心洙曰枚乗七發云龍門之桐高百尺而無枝其根半死半生冬則風雪之所激聖賢名古邈羇旅病年侵洙曰范蔚宗聞道雖已積年力互頽侵陸士衡詩前路既巳多後塗隨年侵趙曰言造琴律之聖賢其名已古逺矣舟泊常依震洙曰震東方也有震澤湖平早見參洙曰早一作半参曉星也鮑昭詩曉星正参落如聞馬融笛洙曰馬融好吹笛有長笛賦序云性好音律能鼓琴吹笛若倚仲宣襟洙曰王粲登樓賦云憑軒檻以遙望兮向北風而開襟故國悲寒望洙曰顔延年息徒顧将夕極望梁陳分故國多喬木空城凝寒雲趙曰故國長安也悲當寒望之中羣雲惨歲隂洙曰謝惠連雪賦嵗将暮時既昏寒風積愁雲繁水鄉霾白蜃楓岸疊青岑蘇曰顧穆洞庭楓岸逺幾疊青岑高趙曰江水湛湛兮上有楓楚岸多楓故曰楓岸鬱鬱冬炎瘴洙曰張平子鬱鬱不得志濛濛雨滯淫洙曰東山零雨其濛勃海方淫滯鼓迎方祭鬼趙曰楚俗好巫祀彈落似鴞禽洙曰賈誼鵩賦鵩鳥似鴞鮑曰荘子見彈而求鴞炙興盡纔無悶洙曰王子猷興盡而返易遯世而無悶愁來遽不禁生涯相汩没時物自蕭森洙曰自一作正張景陽溪壑無人跡荒林鬱蕭森疑惑尊中弩修可曰抱朴子曰予祖彬為汲令注風俗通作汲令應彬以夏至日請主簿杜宣飲酒北壁上有懸赤弩照於杯中如蛇宣惡之及飲得病後彬知之延宣於舊處置酒其見如初因謂宣曰此弩影耳宣疾遂瘳此與樂廣傳蛇影事大相類特弓與弩異耳淹留冠上簪洙曰移文借聞披簮逸海岸趙曰冠簮卿大夫之禮也淹留冠上簮公猶未留遂棄冠冕也牽裾驚魏帝洙曰辛毗諫帝帝怒起引帝裾趙曰言為左拾遺時諌房琯之材不宜廢而肅宗怒之也投閣為劉歆趙曰揚子雲校書天禄閣上以劉歆嘗問竒字而歆以言祥得罪有司誤以連子雲子雲為投閣今云為劉歆則是言琯既貶邠州刺史而公出為華州司功也狂走終奚適蘇曰王修曰吾狂坐走諸侯門終身必意奚適乃束書隠三茒山微才謝所欽洙曰陸士衡寤寐靡安豫願言思所欽吾安藜不糁洙曰孔子藜羮不糁汝貴玉為琛趙曰言湖南親友也貴玉為琛琛者寳也詩云來獻其琛烏几重重縛鶉衣寸寸針趙曰鶉衣即衣如懸鶉之謂哀傷同庾信庾信作哀江南述作異陳琳趙曰陳琳健於章奏曹公見其檄而頭風愈今公自謙以為述作不能似之十暑岷山葛洙曰蜀葛布也十暑不易言其貧也三霜楚户砧洙曰三霜居楚三易星霜叨陪錦帳坐洙曰郎官有錦帳見漢百官志趙曰公為尚書工部貟外郎故也郎官賜錦帳緌被久放白頭吟趙曰公以老而吟詠耳白頭吟本是卓文君以相如晚年置妾而作今公借用之也反樸時難過洙曰老子還淳反樸忘機陸易沉趙曰史記東方朔坐席中酒酣據地歌曰陸沉於俗文選道勝貴陸沉注無水而沉謂之陸沉應過數粒食洙曰鷦鷯賦巢林不過一枝毎食不過數粒得近四知金洙曰漢書王宻懐金遺楊震曰夜無知者震曰天知地知子知我知是四知遂不受宻慙而退春草封歸恨洙曰劉安招隠王孫遊兮不歸春草生兮萋萋源花費獨尋洙曰見欲問桃花宿注轉蓬憂悄悄洙曰見生涯獨轉蓬注柏舟詩憂心悄悄行藥病涔涔洙曰鮑明逺有行藥至城東橋詩注謂招有疾服藥行以宣導之漢霍光夫人顯謀毒許后后免身取附子并合大醫大丸飲之有頃曰我頭涔涔也藥中得無毒乎對曰無遂加煩懣而崩瘞夭追潘岳趙曰公必有喪子之禍但無所考矣潘岳西征賦曰夭赤子於新安坎洛側而瘞之補注希曰瘞或作痊或作疾非鶴曰潘岳傷弱子序曰三月壬寅弱子生五月之長安次于新安之千秋亭甲辰而弱子夭乙巳瘞于亭東趙云公必有喪子之禍而不明其為喪宗文師能引序語而乃以為悼嚴武之亡按武死于永泰元年四月去大厯四年作詩時巳五年又不應用瘞夭事元微之誌嗣子宗武不克𦵏則宗文為早世甚明盖大厯二年有熟食日示宗文宗武詩又有示兩兒詩明年出䕫二子尚無恙今詩云瘞夭又大厯五年卒時唯存宗武故誌云宗武不克𦵏則宗文誠夭矣意是四年自潭之衡時喪宗文以與聶令有舊故瘞于耒陽而公死不果徙也不然何以下句又用渴死事持危覔鄧林洙曰山海經云夸父死棄其杖而為鄧林列子云夸父不量力欲返日影逐之於嵎谷之際渴欲得飲赴飲河渭不足將走北飲大澤未至道渴而死棄其杖尸膏肉所浸生鄧林彌廣數千里焉蹉跎翻學歩洙曰阮籍娛樂未終極白日忽蹉跎夀陵餘子學歩於邯鄲失其故歩匍匐而返趙曰公自傷随流俗也感激在知音趙曰公自傷其無識之者子期死伯牙絶絃終身不復鼓却假蘇張舌洙曰蘇秦張儀也高誇周宋鐔洙曰荘子説劍王曰天子之劍何如曰天子之劔以燕石為鋒齊岱為鍔晉魏為脊周宋為鐔韓魏為鋏矣納流迷浩汗蘇曰孔融子不見東海納萬流浩汗不溢不驚君子之量當亦如此峻址得嶔崟城府開清旭蘇曰言諸公在幕府也松筠起碧潯趙曰公自言其舟之所在潯韻書云旁深也披顔爭倩倩趙曰言徃披承諸公之顔爭為倩倩以相待詩云巧笑倩兮主在乎言笑也逸足競駸駸洙曰詩載驟駸駸趙曰以駸馬比諸公也朗鑒存愚直趙曰愚直公自謂也朗鑒則所以望諸公也皇天實照臨洙曰左傳皇天后土實聞此言公孫仍恃險洙曰後漢公孫述恃其地險衆附有異志蜀都賦長城結險吞若巨防一夫守隘萬夫莫向公孫躍馬而稱帝劉宗下輦而自王侯景侯景陷臺城者未生擒書信中原闊干戈北斗深畏人千里井趙曰蘇氏演義小説載金陵記曰南計吏止於傳舍間及將就路以馬殘草㵼於井中而去謂無再過之期不久復由此飲於此井遂為昔時剉節刺喉而死故後人戒之曰千里井不㵼剉問俗九州箴洙曰揚雄傳贊曰箴莫善於虞箴作州箴晉灼曰九州之箴戰血流依舊洙曰見邊城流血成海水注軍聲動至今葛洪尸定解洙曰後漢方術傳注尸解者言將登仙假託為尸以解化也葛洪傳卒年八十一視其顔色如生體亦柔軟舉尸入棺甚輕如空衣也以為尸解得仙許靖力還任洙曰蜀志曰許靖字木少與從弟劭俱知名並有人倫臧否之稱而私情不協排靖不得齒叙也趙曰王朗與靖書曰足下周游江湖以暨南海可謂徧矣如靖之力還可勝任此公言南征而避難家事丹砂訣洙曰葛洪為勾漏令求丹砂無成涕作霖洙曰甫注云伏羲造瑟神農氏作琴舜彈五絃舉歌南風之篇有矣師曰莊子載孔子之言也方且與世違而心不屑與之俱是陸沉者也其市南宜僚耶律所以調八風舜琴亦歌南風阜財解愠今風疾足見時律不調故曰尚錯雄鳴管如聞馬融笛言嚴武死也若倚仲宣襟言子美無所依也鼓迎非祭鬼巴蜀多淫祀如事鳥鬼之類昔賈誼困於長沙忌鵩鳥今子美亦然故云彈落似鴞禽疑惑尊中弩言久病也淹留冠上簪言不用也牽裾驚魏帝諌房琯事也子美為房琯得罪亦若子雲投閣為劉棻故也劉棻嘗從雄學作竒字既而棻得罪事逮雄使者收雄雄遂投閣今作劉歆未知所以謝所欽言諸公禮待也十暑岷山葛言十年在蜀三霜楚户砧言三年在楚反樸時難遇言不見治平也文選詩道勝貴陸沉注無水而沉謂之陸沉史記武帝時齊人東方朔坐席中酒酣據地歌曰陸沉於俗避世金馬應過數粒食得近四知金言諸公餽食賜金也春草封歸恨言不得歸郷也源花費獨尋言尚避亂也瘞夭追潘岳悼嚴武之亡也持危覔鄧林言武之死朝廷失大材也子美亦失其故步而感激在於諸公之知巳葛洪尸定解以喻武之化去武以金石得病而殂故云奉贈蕭二十使君大厯五年作補注鶴曰詩云迴鴈五湖春當是大厯五年潭州作詩曰昔在嚴公幕俱為蜀使臣艱危叅大府前後間清塵玉鳬聊暫出蕭雉只相馴蓋蕭自嚴公幕去而宰縣公有蕭明府晏處覔桃栽詩乃其人也昔在嚴公幕俱為蜀使臣艱危參大府前後間清塵洙曰嚴再鎮成都今復参幕公自注嚴再領成都余復参幕府趙曰蕭於嚴公初鎮時入幕而公在其再來時遂為間也起草鳴先路趙曰言蕭自嚴幕而徃為舍人矣唐制舍人凡詔㫖制勅璽冊命皆起草也乗槎動要津洙曰見虛乗八月槎注古詩先據要路津趙曰以言其貴也王鳬聊暫出洙曰見逺愧尚方曾賜履注蕭雉只相馴洙曰蕭望之為郎有雉隨車魯恭為中牟令翟雉馴於桑下趙曰蕭廣濟孝子傳蕭芝至孝除尚書郎鳴有雉數十頭飲啄宿止當上直送至岐路下直入門飛車側舊注引蕭望之惑後學矣終始任安義洙曰前漢任安字少卿為益州刺史與司馬遷書責以古賢臣之義也修可曰前漢衛青為大将軍霍去病為驃騎將軍禄秩與大将軍等自是青日衰而去病日益貴故人門下多去青事去病輒得官爵惟任安不肯去子美詩首云昔在嚴公幕俱為蜀使臣及有塤篪金石之語元注云嚴公既没老母在堂使君温凊之問若巳之閨庭焉及太夫人傾逝又撫孤之情不減骨肉以是攷之足以見蕭使君如任安之事衛青有終始之義注引司馬遷責以古賢臣之義非是荒蕪孟母鄰聯翩匍匐禮洙曰詩凡民有喪匍匐救之意氣死生親洙曰公自注云嚴公没後老母在堂使君温凊之問甘脆之禮名數若巳之庭關焉太夫人傾逝喪事又首諸孫主典撫孤之情所謂一死生不減骨肉則膠漆之契可以見矣張老存家事趙曰禮記檀弓晉獻文子成室晉大夫發焉張老曰美哉輪焉美哉奐焉歌於斯哭於斯聚國族於斯今公以張老比蕭使君言能存嚴公之家令諸孫奉太夫人喪事哭於斯聚國族於斯不失其家也嵇康有故人洙曰康臨死謂子曰山公在汝不孤矣食恩慙鹵莽趙曰言蕭使君之心舊食嚴公之恩尚慙報之鹵莽鏤骨抱酸辛趙曰言蕭使君銜嚴公之㤙銘鏤肌骨常抱酸辛阮嗣宗詩悽愴抱酸辛巢許山林志趙曰公以巢父許由自比也䕫龍廊廟珍洙曰巢父許由䕫與龍也趙曰言蕭使君也䕫則典樂之䕫龍則納言之龍如二人之材當在廟堂也師曰子美自謂隠晦而以䕫龍期蕭使君鵬圖仍矯翼洙曰見泊岳陽樓詩注熊軾且移輪趙曰言蕭使君如大鵬之圖南仍矯奮其翼固當遂晉擢矣而且為太守故憑熊車以移輪也磊落衣冠地蒼茫土木身洙曰嵇康土木形骸塤篪鳴自合洙曰絶交論道恊膠漆志婉變於塤篪金石瑩逾新洙曰文賦被金石而徳廣流管絃而日新重憶羅江外鄭曰寰宇記本涪城縣地天寳元年為羅江縣同遊錦水濵趙曰羅江屬綿州錦水則成都也結歡隨過隙蘇曰王陽與子結歡眼隨過隙之駒趙曰莊子曰人生一世如白駒過隙懐舊益霑巾洙曰潘安仁懐舊賦涕泣流而霑巾曠絶含香舍趙曰後漢尚書郎口含雞舌香以其奏事欲使氣芬芳也公自為員外郎而不得坐省所以為之曠絶稽留伏枕辰洙曰張茂先詩伏枕終遥昔寤言莫予應趙曰詩展轉伏枕停驂雙闕早洙曰謝元暉詩停驂我悵望迴鴈五湖春洙曰沈休文旋雁每迴翔趙曰張勃吳録五湖者太湖之别名不達長卿病趙曰長卿有消渴之疾而公亦有之從來原憲貧洙曰見寧甘原憲貧注監河受貸粟一起轍中鱗洙曰見莊子轍魚事奉送二十三舅録事之攝郴州崔偉作補注鶴曰衰老悲人世驅馳厭甲兵又云氣春江上別當是大厯五年作時臧玠為亂賢良歸盛族趙曰周禮友行以尊賢良賢則行之傑良則才之美吾舅盡知名徐庶高交友趙曰以言崔舅徐庶字元直其所與逰者諸葛亮龎士元司馬徳操之流而巳劉牢出外甥洙曰桓𤣥曰何無忌劉牢之外甥酷似其舅今舉大事孰謂無成趙曰公以無忌自比也泥塗豈珠玉趙曰言崔舅為明珠白王之質豈宜辱在泥塗環堵但柴荆衰老悲人世驅馳厭甲兵氣春江上别洙曰謝𤣥暉江上徒離憂淚血渭陽情洙曰詩我送舅氏曰至渭陽舟鷁排風影林烏反哺聲洙曰束晢𥙷亡詩嗷嗷林烏受哺于子趙曰言崔舅侍太夫人以行也李善注文選有曰純黒而反哺者烏子永嘉多北至洙曰永嘉之亂元帝渡江衣冠多自北至鄭曰永嘉晉年號趙曰言崔舅自北而來句漏且南征洙曰葛洪求為勾漏令以有丹砂也楚詞汩吾南征鄭曰勾漏邑名屬交趾必見公侯復洙曰左傳公侯必復其始趙曰此句可以見崔舅貴人子孫也終聞盗賊平郴州頗涼冷橘井尚凄清趙曰橘井在郴州神仙蘇耽於山下鑿井種橘救鄉里之疾病者補注希曰橘井在郴州城東蘇耽之故宅宅今為觀井之水每酌則有金星云丹影如此予官郴嘗目覩其實從役何蠻貊居官志在行洙曰論語言忠信行篤敬雖蠻貊之邦行矣左傳當官而行何强之有送魏二十四司直充嶺南掌選崔郎中判官兼韋韶州大厯五年春作補注鶴曰詩云故人湖外少春日嶺南長為報韶州牧新詩昨寄将韋韶州即韋迢迢有早發潭州寄杜員外詩云湘潭一葉黄蓋大厯四年秋矣則此詩當是五年春作時臧玠未為亂公尚在潭州選曹分五嶺洙曰見雲山兼五嶺注趙曰言崔郎中充嶺南掌選也使者歴三湘洙曰顔延年三湘謂洞庭七澤藹荆牧注江湘沅水皆㑹巴陵洞庭陂號為三湘趙曰言崔郎中出使厯三湘也按寰宇記云湘潭湘鄉湘源才美膺推薦趙曰言魏為人所薦而為判官也君行佐紀綱洙曰左傳紀綱之僕趙曰言魏君之行崔佐君之紀綱也佳聲期洙曰一作斯共逺趙曰崔魏皆著佳聲而共逺矣雅莭在周防明白山濤鑒洙曰山濤典選吏部並得其才再居十餘年一官間輒啓數人甄抜人物各為題目稱為山公啓事趙曰戒魏君之佐選事當以公也嫌疑陸賈裝洙曰陸賈説尉佗佗賈槖中装直千金佗送羽千金趙曰又戒魏司直以亷也故人湖外少春日嶺南長蘇曰謝孚竄嶺外春日語客曰昔年洛下狂歌痛飲唯嫌日短今窮居嶺南偏覺日長要黑不能吾其奈何子因有感書示翟夫子憑報韶州牧新詩昨寄一作夜將送趙十七明府之縣大厯五年春作補注鶴曰詩云江花報邑人又云卧疾却愁春當是大厯五年春潭州作連城為寳重洙曰虞子京連城既偽徃荆玉得真還茂宰得才新蘇曰謝𤣥暉和伏武昌登孫權故城詩雄圖悵若兹茂宰深遐睠太白贈義興宰亦云天子思茂宰天枝得英材山雉迎舟楫江花報邑人洙曰語山梁雌雉趙曰上句則禽鳥知所馴下句則草木知所喜皆美言之補注希曰正言魯恭馴雉及潘岳一縣之花事雖隠而顯論交飜恨晚趙曰公與趙君晚方論交也臥病却愁春惠愛南翁悦餘波及老身趙曰言施惠愛而南人喜悦公自謂老身亦霑餘波燕子來舟中作大厯五年作補注鶴曰詩云湖南為客動經春燕子啣泥兩度新當是大厯五年潭州作湖南為客動經春燕子啣泥兩度新洙曰見啣泥附炎熱注舊入故園嘗識主如今社日逺㸔人可憐處處巢居洙曰一作君室洙曰古詩思為雙飛燕啣泥巢君室何異飄飄託此身暫語船檣還起去穿花落水益霑巾同豆盧峯貽主客李員外賢子棐知字韻補注鶴曰按唐宰相表豆盧本姓慕容氏北人謂歸義為豆盧因賜以為氏居昌黎棘城又唐百官志主客郎中貟外郎各一人掌二王後諸藩朝見之事屬禮部從舊次在大厯五年潭州作練金歐冶子噴玉大宛兒洙曰張景陽七命楚之賜劍歐冶所營鄭曰吳越春秋干將與歐冶子作劔採五山之精合六金之英煉而為劔定功曰穆天子東遊黄澤使宫樂謡曰黄之澤其馬歕玉皇人夀榖又賈復顧兒謂弟曰此吾宗大宛兒也一日千里亦可歕噴同趙曰此兩句以美李員外補注希曰㑹稽郡有君邪溪即歐冶子鑄劔之處西域傳馬汗血言其先天馬子注孟康曰言大宛國有高山其上有馬不可得因取五色母馬置其上與集生駒皆汗血因號曰天馬子練字當作煉符彩高無敵田曰曹子建七啓曰符彩照燭魏文帝車渠椀賦發符采而揚榮趙曰傅𤣥乘輿馬賦曰符采横發大率言符光雜穆也聰明達所為夢蘭他日應洙曰左傳鄭文公賤妾燕姞夢天使與巳蘭曰以為是爾子詩蘭有國香人服媚之既而文公與之蘭而御之辭曰妾幸而有子将不信敢徴蘭乎穆公名曰蘭也折桂早年知洙曰見禮闈新折桂注爛熳通經術光芒刷羽儀洙曰沈休文湖中鴈詩刷羽同摇漾易鴻漸于陸其羽可用為儀謝庭瞻不逺洙曰晉史謝太傅諸子若芝蘭玉樹生於庭階潘省㑹於斯趙曰潘安仁云寓直于散騎之省今公乃工部貟外郎李乃主客貟外郎盧亦必官是是省郎之人相㑹於斯唱和將雛曲田翁號鹿皮洙曰見歎世鹿皮翁注歸鴈二首大厯五年春作補注鶴曰詩云萬里衡陽雁今年又北歸又云塞北春隂暮江南日色曛當是大厯五年春潭州作萬里衡陽鴈今年又北歸洙曰應徳璉詩朝雁鳴雲中音響一何哀問子遊何郷戢翼正徘徊言我塞門來將就衡陽棲徃春翔北土今冬客南淮雙雙瞻客上一一背人飛補注希曰公在南而雁北飛故曰背人雲裏相呼疾沙邊自宿稀繫書元浪語洙曰見雖無南過鴈注蘇曰孔琛憑雁繫書真浪語耳其迷過於刻劔守株者愁寂故山薇再吟補注鶴曰詩云却過清渭影高起洞庭羣傷弓流落羽行斷不堪聞公以自喻也欲雪違胡地洙曰謝靈運詩季秋邊朔苦旅鴈違霜雪先花别楚雲洙曰月令雁北鄉管子曰雁春北秋南言其避寒也楚南也故曰先花别楚雲却過清渭影高起洞庭羣塞北春隂暮江南日色曛傷弓流落羽洙曰史盈引虚弓而雁落人問之曰此雁傷弓也行㫁不堪聞洙曰嚴僅囚於上蔡自歎曰縲絏憂羇不忍聞㫁行旅鴈愴然久之獄吏惻然小寒食舟中作大厯五年作補注鶴曰公在潭率舟居此當是大厯五年作小寒食如小至之類前寒食一日也詩云看雲直北至長安一本作是長安佳辰強飲食猶寒隱於靳切几蕭條帶鶡冠洙曰漢輿服志號賁武騎皆鶡冠南郭子綦隠几卧趙曰鶡冠者隠人之冠也袁淑真隠傳鶡冠子舊注引虎賁武騎之冠誤矣春水船如天上坐趙曰魯直言前人詩有水面船如天上坐杜公改一春字而精神烱然可謂㸃鐵成金余曰卲氏聞見録云少陵此句本沈雲卿船如天上坐人似鏡中行船如天上去魚似鏡中懸也或以此論少陵之妙予謂少陵所以獨立千載之上者不但有所本也三百篇之中果何本哉老年花似霧中看尹曰張歜至秦歎曰老年看花眼眩如隔霧縠謂於燭下數牛毛也娟娟戯蝶過閒幔片片輕鷗下急湍雲白山青萬餘里愁看直北是長安洙曰鮑明逺㶚陵望長安徐敬業登陴起遐目回首見長安蘇曰何遜古道難云直北長安道愁看别離人清明二首大厯四年作補注鶴曰詩云不見定王城舊處長懐賈傅井依然當是大厯四年初到潭州時作故詩又云湖色春光淨客船朝來新火起新煙洙曰周禮司烜氏仲春以木鐸修火禁於國中趙曰唐制清明日賜百官新火賈島詩曰晴風吹栁絮新火起厨煙湖色春光淨客船繡羽衝花他自得射雉賦有綺翼縭頭衮背補注希曰衝花一本作銜花自又作白然衝勝銜自勝白今本為是紅顔騎竹我無縁洙曰郭伋傳小兒騎竹馬胡童結束還難有楚女腰肢亦可憐不見定王城舊處洙曰長沙定王鄭曰寰宇記潭州長沙縣定王廟在縣東一里廟連岡高七丈俗謂之定王岡長懐賈傅井依然洙曰今長沙賈太傅誼廟有井存焉韓愈井詩亦云賈誼宅中今始見葛洪墓上亦曾窺修可曰盛𢎞之荆州記曰湘州南寺之東賈誼宅有井小而深上斂下大状如壺即誼所穿井誼宅今為陶侃廟種栢猶有存者鄭曰寰宇記誼廟在長沙縣南六十里廟即誼宅中有井上圓下方虚霑周舉為寒食洙曰事見桓譚新論後漢周舉博學遷并州刺史太原一郡舊俗以介子推焚骸有龍忌之禁至其亡月咸言神靈禁舉火由是士民毎冬中徹一月寒食莫敢煙爨老小不堪歲多死者舉既到州乃作弔書以置子推之廟言盛冬去火殘損民命非賢者之意以宣示愚民使還預温食由是衆惑稍解風俗頗革新序曰晉文公反國介子推無爵遂去而之綿上文公求之不得乃焚其山推遂不出而死實藉君平賣卜錢洙曰見上憑傳百錢卜注鐘鼎山林各天性濁醪麤飯任吾年夢符曰按酒經曰醪汁滓酒也世本曰儀狄始作酒醪變五味蘇曰梁勰告友人曰五斗粟非所欲也洛中有薄田桑柘蔬園老夫率兒女輩操耒耜絍織與隣里徃來濁醪麄飯任此天年庶免風波岐路易飜覆耳趙曰撃鐘而食列鼎而烹富貴人之事也山林則隠逸之人處貧賤而甘之與好富貴者各天性耳既無盛饌姑且濁醪麄飯而巳此身飄泊苦西東右臂偏枯半耳聾趙曰出素問黄帝言風曰或為偏枯寂寂繫舟雙下淚洙曰賈誼傳不繫之舟悠悠伏枕左書空洙曰見稽留伏枕及咄咄正書空注師曰右臂既偏枯書空者唯左而巳十年蹴踘將雛逺洙曰劉向别錄蹴踘黄帝所造本兵勢也或云起於戰國按踘與毬同古人踘蹴以為戱趙曰成公綏嘯賦似鴻雁之將雛師曰十年蹴踘言軍興也將雛逺謂挈子逺遊補注希曰漢藝文志蹴踘二十五篇師古曰鞠以韋為之實以物蹵蹋之以為戱也萬里鞦韆習俗同洙曰古今藝術曰鞦韆北方戯以習輕矯旅鴈上雲歸紫塞孝祥曰崔豹古今注秦所築長城土皆紫色漢塞亦然故稱紫塞子美宮池春雁詩又有青春欲盡急還鄊紫塞寧論上有霜之句家人鑽火用青楓洙曰鑽燧改火春取榆栁之火以順陽行火氣秦城樓閣煙洙曰一作鶯花裏漢主山河錦繡中補注希曰舊本注云荆州劉備所自起故子美言漢主山河今本不載然詳詩意此蓋指長安而云公思故鄉也所以接云風水春來洞庭闊白蘋愁殺白頭翁風水春來洞庭闊白蘋愁殺白頭翁洙曰風水一作春去趙曰四句懐長安而歎其在湘潭也贈韋七贊善大厯五年作補注鶴曰唐東宫官有左右贊善大夫各五人掌傳令諷過失贊禮儀韋贊善必韋見素之後見素位至宰相贈司空故詩云爾家最近魁三象見素與公皆京兆人故又云鄉里衣冠不乏賢若韋思謙父子乃鄭州人詩又云洞庭春色悲公子當是在潭州作大厯五年鄉里衣冠不乏賢杜陵韋曲未央前洙曰未央殿基在長安杜陵韋曲地名也蘇曰袁粲幼孤祖哀之名之曰愍孫少好學有清才叔父淑雅重之語子弟曰我門不乏賢愍孫必當復三公古雍曲引云杜陵茂樹韋曲紫花照未央之宫前當昆明之池左風物富秀爾家最近魁三象注曰公自注云斗魁下兩兩相比曰三台時論同歸洙曰一作因侵尺五天洙曰公自注俚語曰城南韋杜去天尺五北走關山洙曰一作河開雨雪洙曰蕪城賦南馳蒼梧漲海北走紫塞雁門南遊花栁塞雲煙塞悉則切洙曰雲一作風洞庭春色悲公子鰕菜忘歸范蠡船洙曰句踐既滅吳范蠡乗扁舟泛五湖蘇曰郭林宗蝦菜菰米足以度歳使人忘歸奉酬㓂十侍御錫見寄四韻復寄㓂大厯五年作補注鶴曰詩云故泊洞庭船又云春深把臂前當是大厯五年潭州去年春深公入衡矣徃别郇瑕地洙曰見上悽愴郇瑕邑注于今四十年來簪御史筆洙曰魏略曰殿中侍御史簮白筆側階而直上問曰此何官也辛毗對曰御史簮筆書過以記不依法補注希曰御史所居之署漢謂之御史府故泊洞庭船詩憶傷心處洙曰楚詞目極千里傷心處春深把臂前洙曰廣絶交論自昔把臂之英金蘭之友趙曰言在郇瑕相别之時南瞻按百越黄帽待君偏趙曰前漢鄧通以櫂船為黄頭郎顔師古注曰櫂船能授櫂行船也土勝水其色黄故刺船之郎皆著黄帽因號曰黄頭郎也今冦君既按百越則所在處常艤舟以待故其帽偏也師曰郇瑕晉地子美與冦别於晉地迨今凡四十年頭簮御史筆來客荆衡間故云泊洞庭船此子美自述也公為拾遺故簮白筆黄帽乃竹籜為冠按百越言冦按察楚越之郡酬郭十五判官大厯四年作補注鶴曰郭詩云衡陽紙價頓能高而此詩云喬口橘洲風浪促繫帆何惜片時程當是公在衡郭在潭大厯四年也喬口橘洲並在潭州詳見上注才微歲老尚虚名卧病江湖春復生藥裹關心詩總廢花枝照眼句還成只同燕石能星隕洙曰左傳隕石于宋五隕星也又星隕如雨自得隋珠覺夜明洙曰隋侯之珠夜光之璧喬口橘洲風浪促驚帆何惜片時程洙曰橘洲見橘洲田土仍膏腴注師曰宋之愚人得燕石于梧臺之側藏之以為大寳周客聞而觀焉主人齋七日端冕𤣥服以發寳革櫃十重客見俛而掩口胡盧而笑曰此燕石也其與瓦甓不殊主人大怒曰肓瞽之言藏愈固守愈謹藥裹關心言治病也無暇於詩篇隋珠喻郭判官詩喬口橘洲乃荆衡之地驚帆何惜片時程欲郭來訪已也衡州送李大夫七丈勉赴廣州大厯四年作補注鶴曰按史勉自江西觀察使入為京兆尹兼御史大夫今隆興有石幢載牧守名爵勉在張鎬之後魏少游之前而少游以大厯二年代去鎬以廣徳二年九月死則勉為江西觀察使當是其年九月後其為京兆尹當在大厯元年又四年十二月廣州人馮崇道反桂州人朱濟時反殘亂十餘州勉遣將李觀率容州刺史王翃討平之則勉是四年秋冬之交赴廣州故此詩有北風隨爽氣之句公是年在衡以畏熱歸潭終歲舟居明年又自潭之衡今題曰衡州蓋誤也當作潭州斧鉞下青冥洙曰禮賜斧鉞然後殺蘇曰何敬祖将軍新持斧鉞總握虎符自青冥來鎮岷隴樓船過洞庭洙曰漢武征南越作樓船北風隨爽氣洙曰登樓賦向北風而開襟王子猷西山致有爽氣南斗避文星日月籠中鳥洙曰潘安池魚籠鳥乾坤水上萍王孫丈人行洙曰匈奴云漢天子我丈人行垂老見飄零師曰諸侯賜斧鉞然後誅殺青冥天也言天子賜李以節鉞樓船船上有樓櫓過洞庭迤邐之廣州北風隨爽氣言自北而南帶爽氣而來南斗避文星北斗以南公一人而巳籠中鳥局促不得騁子美客居局促如籠鳥飄泛如水萍豈意垂老之年尚見飄零失所乎行音項儔也過洞庭湖鮑曰洪玉甫云有人得之江中石刻直方詩話亦云大厯五年作補注鶴曰詩云破浪南風正回檣畏日斜既曰回檣又曰南風畏日則非大厯四年春自岳之潭經洞庭時作當是大厯五年自湖南歸襄陽時之作鮫室圍青草龍堆隠本中曰一作擁白沙䕶堤本中曰一作江盤古木迎棹舞神鵶破浪南風正回檣本中曰一作歸舟畏日斜湖光與天逺直欲泛仙槎本中曰一作雲山千萬疊底處上星槎聞惠子過東溪新添蘇曰右一篇劉斯立得於管城人家大厯二年作補注鶴曰詩云崖蜜松花熟山杯竹葉春非湖南作意東溪指瀼東而言也大厯二年作洪駒甫詩話云劉路左車為余言嘗收得唐人也雜編時人詩冊有老杜送惠二歸故居詩即此惠子白驢瘦歸溪唯病身補注希曰白驢一本作白駒皇天無老眼空谷滯斯人崖一作巖蜜松花熟一作古定功曰本草蜜一名白蜜一名崖蜜在高山巖石之間圖經云近宣州有黄連蜜色味黄小苦雍洛間有棃花蜜如凝脂亳州太清宫有檜花蜜色小赤並以蜂採其花作之而性之温良亦相近崖蜜松花熟亦蜂採松花而成蜜也山杯本中曰一作村醪竹葉春修可曰吳地志曰吳興烏程酒有名張華輕薄篇曰蒼梧竹葉青宜城九醖酒故張景陽七命云弗南烏程豫北竹葉田曰陳隂鏗竹詩葉醖宜城酒柴門了生事黄本中曰一作園綺未稱臣補注杜詩巻三十六
