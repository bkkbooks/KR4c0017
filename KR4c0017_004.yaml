body:
  text: 補注杜詩卷四宋黃希原本黃鶴補注瘦馬行至德二年作補注鶴曰為房琯作當琯敗在至德元年十月今云去歲奔波逐餘寇則是二年作明矣是年琯罷相東郊瘦馬使我傷骨骼硉兀如堵牆骼一作骸洙曰郭璞江賦巨石硉矻以前却禮觀者如堵牆鄭曰硉郎兀切危石也沈曰骨高貌絆之欲動轉欹側此豈有意仍騰驤洙曰西京賦仍奮翅而騰驤細看六印帶官字洙曰唐令諸掌牧馬以小官字印印右膊以年辰印印右髀以監名依左右廂印印尾側至二歲起春量強弱漸以飛字印左廂髀膊細馬俱以龍形印印項左官馬賜人者以賜字印配諸軍及充傳送驛者以出字印並印右頰衆道三軍遺路傍皮乾剝落雜泥滓毛暗蕭條連雪霜去歲奔波逐餘寇驊騮不慣不得將士卒多騎內廄馬惆悵恐是病乘黃洙曰乘黃古之神馬亦名飛黃皆有角日行萬里淮南子云天下有道飛黃伏皂一云神黃獸名龍翼馬身黃帝乘而登仙當時歷塊誤一蹶音厥芻曰王褒聖主得賢臣頌過都越國蹶如歷塊委棄非汝能周防見人慘淡若哀訴失主錯莫無晶光補注希曰鮑昭行路難云今日見我顔色老眼花錯莫與先異天寒逺放鴈為伴一作侶日暮不一作末收一作衣烏啄瘡誰家且養願終惠洙曰顔延年頳白馬賦願終惠養隂本枝兮更試明年春草長師曰按唐史房琯有宰相器其才亦長於戰時帝命琯將兵與賊戰陳濤斜琯儒者不知兵用春秋車戰法為賊所敗帝怒斥琯為邠州刺史甫此詩寓意於琯之見棄而朝廷寡恩莫之終惠甫欲再試用之以盡其所長斯可矣故末章有誰家且飬願終惠更試明年春草長之句送率府程録事還鄉乾元元年作洙曰程攜酒饌相就取别補注鶴曰按唐六典太子左右衛率府有録事參軍二人掌監印發付勾稽以為隋置唐因之今詩云丗梗悲路澀東風吹春氷當是乾元元年在諫省時作鄙夫行衰謝洙曰鄙賤也自稱故曰鄙夫抱病昏妄集常時往還人記一不識十程侯晚相遇與語才傑立洙曰徐稚角立傑出薰然耳目開頗覺聰明入千載得鮑叔末契有所及洙曰管仲與鮑叔為友意鍾一作中老柏青義動修蛇蟄師曰言程公辭官歸鄉如龍蛇之蟄以藏身故其髙義可以聳動於人若人可數見饒曰語君子哉若人尚德哉若人慰我垂白泣趙曰杜欽傳紀陽侯與欽子業書曰誠哀老姊垂白師古曰垂白者言白髮下垂也生别無淹晷百憂復相襲內愧突不黔洙曰揚雄曰孔席不暖墨突不黔庶羞一云明似以賙給素絲挈長魚碧酒隨玉粒蒼舒曰戰國策粒米如玉修可曰碧筒酒以蓮莖得名此言碧酒乃酒之色非碧筒也酒譜曰安期先生與神女會於圜丘酣玄碧之酒途窮見交態洙曰阮籍詩途窮能無慟鄭當時一貧一富乃知交態蘇曰潘遜至漢中見侄英曰今日窮途失適舉目添愁其丗態交情可見楊朱之悲使然也丗梗悲路澀洙曰潘正叔詩丗故尚未夷崤函方險澀東風吹春氷泱漭后土濕洙曰謝玄暉詩晨光復泱漭師曰祿山反范陽在東故云東風吹春氷氷有兵革之象泱漭后土濕言率土之民皆陷於塗泥也念君惜羽翮既飽更思戢莫作翻雲鶻聞呼向禽急晦日尋崔戢李封乾元元年作補注鶴曰晦日謂正月晦日當是乾元元年歸京師時作詳見注朝光入甕牖洙曰賈誼過秦論陳涉甕牖繩樞之子尸一作方寢驚敝裘洙曰論語鄉黨寢不尸起行視天宇黃曰陶淵明詩昭昭天宇闊春氣漸和柔興來一云得興不暇懶今晨梳我頭出門無所待徒一作徙步覺自由杖藜復恣意蘇曰林鳯恣意攜杖藜看竹過南溪免值公與侯晚定崔李交會心真罕儔田曰是時蓋言與崔李定交相會以心不以迹也每過得酒傾一作契鄭曰過古禾切二宅可淹留喜結仁里歡趙曰張平子思玄賦匪仁里其焉宅况因令節求鶴曰唐以正月朔日為令節至正元五年正月十一日敕自今以後以二月一日為中和節先敕三令節集會今冝以中和節代晦日李生園欲荒舊一作有竹頗修修引客看掃除隨時成獻酬崔侯初筵色巳畏空樽愁洙曰孔融曰樽中酒不空未知天下士至一作志性有此不草芽既青出蜂聲亦暖逰思見農器陳何當甲兵休上古葛天氏不貽黃屋憂洙曰屋一作綺上林賦聽葛天氏之歌范蔚宗詩黃屋非堯心師古曰黃屋車上之蓋也皆天子之儀補注希曰漢制副車黃屋左纛如金根之制行則從後至今阮籍等熟醉為身謀洙曰籍傳云籍本有濟丗志屬魏晉之際天下多故名士少有全者籍由是不與丗事遂酣飲為常鍾會數以時事問之欲因其可否而致之罪以酣醉獲免威鳯髙其翔一云自髙翔時天下大亂賢者退處若威鳯然髙其翔而不下全身逺害也宣帝紀威鳯為寶晉灼曰鳯之有威儀者也長鯨吞九州洙曰謂盜賊縱橫如長鯨之吞並九州也地軸為之翻洙曰海賦又似地軸拔而爭回百川皆亂流當歌欲一放淚下恐莫收濁醪有妙理蘇曰王商見于存飲濁酒商笑曰君子何苦好此物耶存曰自有妙理非公所知庶用慰沉浮師曰自古賢者不得志多適意於酒况濁醪之有妙理乎雨過蘇端至德二年作洙曰端置酒補注鶴曰詩云妻孥隔軍壘當是至德二年作雞鳴風雨交洙曰鄭國風風雨凄凄雞鳴喈喈師曰雞鳴思君子之詩寓意思憶蘇端故乘雨而過之久旱雨亦好補注鶴曰按舊史至德二年三月癸亥大雨甲戌方止故云杖藜入春泥無食起我早蘇曰夏侯無食不寐使我早起諸家憶所歷一飯一作飽迹更掃洙曰言交態之薄也蘇曰邵平曰交態浮薄吾甘自養或有親知家得一飯即掃迹不復再扣門矣丗態由此見也蘇侯得數過數色角切歡喜每傾倒也復可憐人呼兒具梨棗濁醪必在眼盡醉攄懷抱紅稠屋角花碧委牆隅草親賔絶談謔喧閙慰衰老况蒙霈澤垂糧粒或自保妻孥隔軍壘撥棄不擬道趙曰阮籍詠懷一身不自保何説戀妻子今於糧粒或自保之下言妻子隔軍壘亦使此矣撥棄不擬道亦自淵明撥置且莫念之變也師曰天寶十五年甫攜家三川是詩末章云妻孥隔軍壘則知此詩之作在至德二年也補注希曰詩樂爾妻孥注云孥子也喜晴至德二年作補注鶴曰以前篇雨過蘇端詩考之當是至德二年此詩作於是年三月甲戌雨止之後梁權道亦編在是年皇天久不雨既雨晴亦佳出郭眺西郊蕭蕭春增華青熒陵陂麥洙曰西都賦琳珉青熒莊子外物篇青青之麥生於陵陂窈窕桃李一作杏花洙曰曹子建詩容華若桃李詩窈窕淑女春夏各有實我飢豈無涯干戈雖橫放鄭曰橫户孟切慘淡鬭龍蛇甘澤不猶愈且耕今未賖丈夫則帶甲婦女終在家力難及黍稷得種菜與麻千載商山芝洙曰前漢王貢兩龔傳漢興有園公綺里季夏黃公角里先生此四人者當秦之丗避而入商雒深山以待天下之定也自髙祖聞而召之不至往者東門瓜洙曰蕭何傳邵平者乃故秦東陵侯秦破為布衣貧種瓜長安城東瓜美故丗謂東陵瓜從邵平始也阮詩昔聞東陵瓜近在青門外趙曰以四皓採芝邵平種瓜皆避秦之亂其道為不可貶也其人骨已朽洙曰朽一作滅史記老子曰子所言者其人與骨皆朽也此道誰疵瑕洙曰左傳不汝疵瑕英賢遇轗軻洙曰古詩坎軻長辛苦楚詞轗軻不遇坎與轗同逺引蟠泥沙洙曰賈誼傳鳯縹縹而髙逝固自引而逺去揚子龍蟠於泥顧慙昧所適回首白日斜師曰甫自愧昧於所適不能脫身晦迹回首自顧恨年已老矣故云漢隂有鹿門洙曰後漢逸民傳漢隂老父桓帝幸竟陵過雲夢臨沔水百姓莫不觀者老父獨耕不輟又龎公襄陽人也居峴山之南未嘗入城府後攜其妻子登鹿門采藥不反襄陽記鹿門山舊名蘇嶺山補注希曰漢隂郡為金州而鹿門在襄陽今云漢隂有鹿門何也公第以鹿門在漢水之隂非指漢隂郡而言也蒼海有雲查音槎趙曰按張華博物志載舊説天河與海通丗有人居海渚者年年八月浮槎去來不失斯人多齎糧乘槎而去奄至一處遙望宮中多織婦見一丈夫牽牛渚次飲之驚問曰何由至此人問此是何處答曰君還至蜀訪嚴君平則知之後至蜀問君平曰某年月日有客星犯牛宿計年月日正是人到天河時也焉能學衆口蘇曰吳芮曰吾焉能學衆兒女口嗜棗栗瓜果耶咄咄空一作同咨嗟洙曰丗説殷中軍被廢在信安終日恆書空作字楊州吏人尋議之竊視唯作咄咄怪事范雲至殿門不得入但云咄咄而已中軍殷浩也蘇端薛復筵簡薛華醉歌天寶十五年作補注鶴曰梁權道云至德二年賊中作然詩中無陷賊之意似是天寶十五年正月朔日是時方討祿山所以只云惡聞戰鼓悲若京師巳陷身在城中不應詩中無一語及之豈能快意於酒復簡薛華之詩而自詩歌咏如此詩曰願吹野水添金杯在城南故云文章有神交有道端復得之名譽早愛客滿堂盡豪傑開筵上日一作月思芳草趙曰尚書正月上日孔安國注上日朔日也故玉燭寶典以正月一日為上日安得健步移逺梅師曰此詩末章言氣酣日落西風來則知此上日為日出時開筵思芳草嘆無花可賞也故有移逺梅之句補注希曰健步即抗步宣紀選伉健善騎射者亂插繁花向晴昊千里猶殘舊冰雪百壺且試開懷抱垂老惡聞戰鼓悲急觴為緩憂心搗洙曰小辨詩我心憂傷惄焉如搗趙曰謝靈運詩急觴蕩幽默少年努力縱談笑洙曰樂府少壯不努力老大徒傷悲補注希曰光武紀老父指曰努力又崔方進傳努力謂諸生學問看我形容已枯稿洙曰漁父篇顔色憔悴形容枯稿座中薛華善醉歌歌辭自作風格老蘇曰盧蒙見江揔文歎曰格老詞麗非後生輩所作近來海內為長句汝與山東李白好何劉沈謝力未工洙曰梁何遜八嵗能詩賦文章與劉孝綽並見重於丗丗謂之何劉丗祖著編論之云詩多而能者沈約少而能者謝眺何遜又劉孝綽七嵗能屬文每作一篇朝成暮遍好事咸誦諷傳寫流聞絶域又沈約傳謝玄暉善為詩任彥升工於文章約兼而有之然不過也才兼鮑昭愁絶倒洙曰晉衛玠談道平子絶倒修可曰宋景公筆録曰今人多誤鮑照為鮑昭李商隱詩有肥烹鮑照葵之句昔金陵人得地中石刻作鮑照蓋武后名昭唐人讀昭為照爾鮑昭作鮑明逺諸生頗盡新知樂洙曰少司命云樂莫樂兮新相知萬事終傷不自保氣酣日落西風來願吹野水添金杯蘇曰阮籍與人野飲酒盡興未盡籍曰焉得東風吹野水添此壺使金杯不空耶如澠之酒常快意洙曰左傳有酒如澠亦知窮愁安在哉忽憶雨時秋井塌古人白骨生青苔如何不飲令心哀韓曰陳歈曰古人白骨遍野雨生莓苔在生胡不飲酒病後過王倚飲贈歌天寶十三年作補注鶴曰梁權道雖編在至德二年自行在還長安時作然詩中略不及遭亂而病之意終云但使殘年飽喫飯只願無事長相見蓋傷為時輩所忽按公秋述詩云秋杜子卧病長安旅况多雨當時車馬之客雨不來又云四十無位當是天寶十三年與素知賤子甘貧賤酷見凍餒不足恥之句合耳麟角鳯觜丗莫識韓曰喻王倚生非其時丗人莫識之煎膠續絃竒自見蒼舒曰右按東方朔十洲記仙家煮鳯啄麟角金煎作膠名之續絃膠一名連金泥此物能連屬弓弩斷絃又斷折之金以膠連使力折繫他處乃斷續處不復斷也尚看王生抱此懷在於甫也何由羡且遇王生慰疇昔素知賤子甘貧賤酷見凍餒不足恥蘇曰王子淵曰吾守道處凍餒亦不足為恥補注希曰檀弓疇昔之夜左太沖詩疇昔覽穰苴多病沉年苦無健王生怪我顔色惡答云伏枕艱難遍瘧癘三秋孰可忍希曰周禮疾醫皆有癘疾又云秋時有瘧疾語是可忍也孰不可忍也寒熱百日相交戰頭白眼暗坐有􅀈鄭曰丁尼反皮厚也肉黃皮皺命如線與線同惟生哀我未平復為我力致美肴膳遣人向市賖香粳喚婦出房親自饌長安冬葅酸且緑金城土酥靜如練蘇曰土酥即今之蘆蔔也其種蘭臯金城尤佳魏夫人帖云膾土酥如練秦人呼為地酥能解麵毒補注鶴曰金城乃京兆府屬按唐志景龍二年中宗送金城公主降吐蕃至此改始平為金城至德二年更名興平又蘭州為金城郡五泉縣舊屬金城有金城關土酥雖秦地所出而必是病中所須當從蘇注為是兼求畜豪洙曰一作畜豪一作畜豕且割鮮洙曰西都賦割鮮野食趙曰金城秦地也有駝金城自能為酥其名土酥老杜身在秦州而食長安之冬葅金城之土酥且求畜豕而割鮮焉非肴饌也魯曰畜豕作畜豪非密沽斗酒諧終宴師曰言禮意無盡也故人情味晚誰似令我手腳輕欲旋老馬為駒揔不虛洙曰詩角弓老馬反為駒不顧其後注已老矣而孩童慢之箋云此喻幽王見人反侮慢之遇之如幼稚不自顧念後至年老人之遇已亦將然也當時得意况深眷但使殘年飽喫飯只願無事常相見師曰甫傷年老時輩所忽慨交態刻薄末章遂美王生無事與長相見也奉先劉少府新書山水障歌天寶十四年作補注鶴曰梁權道編在至德二年還京時作公扈從肅宗歸京師時正紛擾劉少府豈應畫山水為障當是先赴奉先日作畫在祿山未反前是天寶十四年故終曰吾獨胡為在泥滓青鞋布襪從兹始不曾言避亂與為拾遺也堂上不合生楓樹怪底江山起煙霧聞君掃却赤縣圖洙曰史記孟子傳中國名曰赤縣神州趙曰京邑屬縣有赤有畿其浩穰者為赤奉先乃今之蒲城縣也劉少府善畫杜公聞其掃赤縣圖乘興更遣作滄洲之幽趣也補注希曰按唐地理志注奉先次赤故蒲城縣開元四年更名𨽻京兆劉為奉先尉以其邑之山水為障故曰掃却赤縣圖乘興遣畫滄洲趣洙曰謝玄暉詩既歡懷祿情復協滄洲趣畫師亦無數好手不可遇蘇曰戴逵云丗之畫者比比皆是但好手者亦難遇對此融心神知君重毫素趙曰左太沖招隱前有寒泉井聊可瑩心神又賦云唯毫素之所凝豈但祁嶽與鄭虔洙曰祁嶽鄭虔當丗善畫者筆迹逺過楊契丹得非玄圃裂洙曰離騷朝發軔於蒼梧夕余至乎玄圃圃在崑崙山所以有仙人居焉無乃瀟湘翻洙曰王徴君詩窈藹瀟湘空悄然坐我天姥下耳邊已似聞清猿洙曰天姥山名也謝靈運登臨嶠詩哀猿響南巒又明登天姥岑黃曰吳越郡國志天姥山與括蒼山相連石壁上有字髙不可識春月則聞鐘鼓之聲反思前夜風雨急乃是滿城鬼神入元氣淋漓障猶濕真宰上訴天應泣趙曰本朝錢希白洞微志云無雲而雨謂之天泣野亭春還雜花逺洙曰丘希範書雜花生樹漁翁暝踏孤舟立滄浪水深青溟闊欹岸側島秋毫末不見湘妃鼓瑟時至今斑竹臨江活夢符曰右按楚詞逺逰草云使湘靈鼓瑟兮令海若舞馮夷張華博物志舜死二妃淚下染竹即斑死為湘水神故曰湘妃劉侯天機精愛畫入骨髓十朋曰徐邈云吾見王貴畫入骨髓愛恨吾學不到竒妙處自有兩兒郎揮灑亦莫比大兒聰明到能添老樹巔崖裏小兒心孔開貌得山僧及童子趙曰禰衡曰大兒孔文舉小兒楊德祖若耶溪洙曰越溪也雲門寺十朋曰南史何胤字子季隱居不仕會稽山多靈異往遊焉居若耶山雲門寺補注希曰何胤蓋在為民曹尚書而後辭官隱於此也吾獨胡為在泥滓青鞋布襪從此始蘇曰謝玄暉曰胡為翰墨場屋中沒會稽山水竒秀布襪青鞋鶡冠竹杖吾志從此始矣湖城東遇孟雲卿復歸劉皓宅宿宴飲散因為醉歌乾元元年作補注鶴曰湖城屬虢州詩首句云疾風吹塵暗河縣指河南也當是乾元元年自華遊東都作梁權道以為至德二年歸長安時作非魯訔知之故年譜云冬出潼關東征洛陽道史不載明年春末方歸華疾風吹塵暗河縣洙曰楊給事誄軼我河縣趙曰長門賦天漂漂而疾風行子隔手不相見洙曰管子道途揚塵十步不相見也湖城城南一開眼駐馬偶識雲卿面補注希曰湖城縣唐屬虢州唐志云義寧六年至乾元三年更名天平大歷四年復舊九域志云至河南餘四百里而為鄰郡公乾元元年冬自華東征洛陽故云疾風吹塵暗河縣是年兩京已復故下又云驅車復同軌况非劉皓為地主趙曰左傳地主致餼言人為地之主也懶回鞭轡成髙宴蘇曰宋宗昨見王齊遂成髙臺之宴清談如玉屑落金盤使人懶回鞭轡繼燭飛玉觥劉侯歎我攜客來置酒張燈促華饌且將款曲終今夕休語艱難尚酣戰趙曰淮南子曰魯陽公與韓戰戰酣日暮援戈而麾之日為之反三舍照室紅爐促曙光縈窗素月垂文練天開地裂長安陌寒盡春生洛陽殿洙曰時盜賊充斥而肅宗理兵議收復也趙曰句法使謝惠連云春生鳷鵲樓豈知驅車復同軌洙曰書同文車同軌可惜刻漏隨更箭洙曰陸佐公新漏刻銘銅史司刻金徒抱箭人生會合不可常庭樹雞鳴淚如線洙曰張衡古别離曲云雞鳴庭樹枝客子振衣起別淚落如線相顧不能止趙曰傳所謂中國不絶如線閿鄉薑七少府設鱠戲贈長歌乾元元年作閿音聞補注鶴曰閿鄉屬虢州即潼關在其邑公乾元元年冬自華州至東都故有東歸貪路自覺難當是其年作而師云言東之三川取妻子梁權道又編在至德二年長安作俱非唯魯訔年譜知之薑侯設鱠當嚴冬昨日今日皆天風趙曰漢髙皇言八年太尉入未央宮擊呂産天風大起河凍鮇漁不易得一作黃河水漁鑿冰恐侵河伯宮饔人受魚鮫人手洙曰周禮天官內饔饔和也熟食曰饔割烹煎和之稱潘安仁西征賦饔人縷切鑾刀若飛應刃落爼靃靃霏霏洗魚磨刀魚眼紅補注希曰史記樊噲曰人為刀爼我為魚肉續丗説周玄豹有袁許見王都形若鯉魚難免機刀無聲細下飛碎一作素雪有骨已刴觜春蔥洙曰七啓云纍如疊縠離若散雪輕隨風飛刃不轉切七命云范公之鱗出自九溪頳尾丹腮紫翼青鬐命支離飛霜鍔紅肌綺散素膚雪落觜平聲偏勸腹腴愧年少蒼舒曰按禮記冬右腴鄭氏曰腴腹下也漢書九州膏腴師古曰腹之下肥曰腴補注希曰禮記冬右腴説者謂冬時陽氣下在魚腹凡陽氣所在之處肥美故云腴公其取此又黃魯直云魚腹下肥處燕人膾腥方寸切其腴以獻貴者蓋古風也南史何妃傳楊郎好年少又漢趙堯夫傳軟炊香飯一作粳緣老翁落砧何曽白紙濕砧音砧放筯未覺金盤空新歡便飽薑侯德洙曰詩既飽以德青觴異味情屢極大臨曰左傳云必嘗異味東歸貪一作貧路自覺難欲别上馬身無力可憐為人好心事於我見子真顔色師曰言薑侯禮貌非偽為也不恨我衰子貴時悵望且為今相憶戲贈閿鄉秦少府短歌乾元元年作鮑曰唐志閿鄉屬陕郡補注鶴曰詩云去年行宮當太白當是乾元元年歸京師時作去年行宮當太白鮑曰謂肅宗駐鳯翔也唐志鳯翔府郿縣有太白也朝回君是同舍客師曰至德二年甫為拾遺故云朝回同心不減骨肉親每語見許文章伯洙曰唐文三變王楊為之伯趙曰王充論衡有云文辭之伯魏陳琳與吳張綋書云此間率少於文章易為雄伯今日時清兩京道洙曰乾元元年肅宗收復兩京相逢苦覺人情好昨夜邀歡樂更無多才依舊能潦倒洙曰嵇康書知吾潦倒粗踈不切事情晏曰潦倒衰老之貌李鄠縣丈人胡馬行乾元元年作鄭曰鄠扶古切扶風縣名補注鶴曰此詩云前年避胡過金牛又云洛道時再清當是乾元元年作丈人駿馬名胡騮前年避胡過金牛洙曰金牛地名余曰昔秦欲伐蜀無路通遣人告蜀王曰秦有金牛其糞成金使蜀迎之蜀王命五丁力士開山取金牛路才通秦伐蜀取其國因號所開之山曰金牛補注希曰言避胡於金牛回見天子於靈州當時天寶十五年又按唐志武德三年以興元府西縣置褒州析利州之綿谷置金牛縣而九域志乃以三泉縣有金牛鎮余注乃揚雄蜀土本記所云三泉本屬興化府回鞭却走見天子朝飲漢水暮靈州洙曰漢水漢江水也在楚地方域靈州靈武郡唐理回樂縣屬秦北地郡趙曰肅宗即位靈武故回鞭見天子則自漢水而來靈州補注希曰興元府為漢中郡漢水在嘉州自矜胡騮竒絶代乘出千人萬人愛一聞説盡急難材趙曰急難材如劉備之的盧一躍三丈過檀溪以免劉表之追劉牢之馬跳五丈澗以脫慕容垂之逼也轉益愁向駑駘輩頭上鋭耳批秋竹腳下髙蹄削寒玉梅曰黃伯仁龍馬頌耳如剡筒目象明星始知神龍别有種不比俗馬空多肉洛陽大道時再清趙曰已收復東京矣纍日喜得俱東行鳯臆龍鬐一作麟鬐鄭曰渠伊切馬鬛也未易識沈曰伯樂相馬經云鳯臆龍鬐言馬胸如鳯馬鬛如龍真良馬也側身注目長風生師曰言馬有精神也送長孫九侍御赴武威判官至德二年作補注鶴曰京州武威郡唐屬隴右乃河南莭度之所治詩云奪我同官良乃至德二年公為拾遺時驄馬新鑿蹄師曰後漢桓典為御史常乘驄馬時人語曰行行且止避驄馬御史銀鞍被來好洙曰徐敬業汗馬濯銀鞍繡衣黃白郎洙曰漢侍御史有繡衣直指持斧捕盜騎向交河道洙曰漢侯應上書車師前國王治交河城河水分流繞城下故號交河唐安西去交河郡七百里補注希曰西州為交河郡有交河縣注自縣北八十里有龍泉館又北入谷百三十里經柳谷渡瑩沙嶺百六十里經石會漢戍至北庭都護府城問君適萬里取别何草草天子憂涼州嚴程到須早蘇曰嚴顔為左校曰久不得江左信息爾宜嚴程勉力早到甚妙去秋羣胡反不得無電掃馬曰風激電掃補注希曰去秋當是指至德元年通鑑吐蕃陷威戎神武定戎宣威制勝金天天成等軍石堡城百答城雕窠城在鄯廓河等州并陷兩涼州為莭度之所治不可使失故天子憂之正後詩所謂須存武陵威郡之之意也此行牧遺氓風俗方再造族父領元戎洙曰元戎元帥也補注鶴曰董賢傳統辟元戎師古曰元戎大衆也族父謂杜鴻漸按本傳至德二年為遷河西莭度使在平兩京前今作詩却在已平兩京後故下止云東郊尚烽火名聲閣中老奪我同官良飄飄按城堡使我不能餐令我惡懷抱若人才思闊饒曰若人羡長孫侍御也溟漲漫絶島樽前失詩流蘇曰房炳見嵇康歸山隂曰今日樽前失我詩流塞上得一作多國寶皇天悲送逺洙曰九辨皇天平分四時竊獨悲此凛秋雲雨白浩浩東郊尚烽火朝野色枯稿西極柱亦傾如何正穹昊洙曰列湯問篇折天柱又云常怒流於西極蘇曰徐貞曰憑君寄語數執事方今天柱傾反穹昊何計以正送樊二十三侍御赴漢中判官至德二年作補注鶴曰當是至德二載肅宗在鳯翔故詩云天子從北來頓兵岐梁下時未復京師又有兩京陷未收之句漢中唐興元府本梁州梁蓋山南西道採訪使之所治威弧不能弦蘇曰司馬遷刳木為弧以威四方然弧不能安弦自發其威安弦者人君子有道不能自彰使彰名者亦人也揚雄河東賦玃天狼之威弧自爾無寧嵗洙曰易弦木為弧剡木為矢弧矢之利以威天下蓋取諸睽國語薑氏告於公子曰自子之行晉無寧嵗師曰玄宗開元初天下富實自謂四方無虞荒縱酒色武備皆弛是不能以弧矢威天下也祿山一旦乘隙而叛自此紛亂略無寧嵗川谷血橫流洙曰揚子川谷流人之血豺狼沸相噬蘇曰崔甫曰干戈未止狼虎相噬天子從北來黃曰言肅宗即位於靈武長驅振凋敝頓兵岐梁下洙曰肅宗理兵鳯翔却跨沙漠裔師曰沙漠裔指漢中郡謂跨歷楚漢諸州並皆整兵從帝東討二京陷未收四極我得制修可曰爾雅釋地東至於秦逺西至於邠國南至於濮沿北至於祝栗謂之四極注此四方逺極之國名歐陽曰肅宗以太子稱尊號雖云偏據一方而四極之廣皆為總制何命而不從乎補注希曰漢禮樂志四極爰轃師古曰四方極逺之處也爾雅東至秦逺西至邠國南至濮沿北至祝栗謂之四極蕭索一作瑟漢水清緬通淮湖稅使者紛星散洙曰古詩星使日夜馳王綱尚旒綴洙曰長發詩為下國綴旒又公羊傳君若贅旒然泰伯曰言其危而欲絶也南伯從事賢君行立談際趙曰南伯指言漢中主將也從事指言樊為判官也言南伯與從事俱賢相投在立談間耳生知七曜歷洙曰月令命太史司天歷候日月星辰七曜為經二十八宿為紀修可曰北史劉焯博學洽聞如九章算術周髀十曜書莫不核其本根窮其祕要手畫三軍勢洙曰馬援於帝前聚米為山谷指畫形勢開示衆軍所從道徑往來曲折昭然可曉帝曰虜在吾目中矣定功曰張安丗子千秋與霍光子禹俱擊烏桓還詔大將軍光問千秋鬭戰方略山川形勢口對兵事畫成地圖無所忘失師曰漢中係荆湖南路南伯言南方諸侯之長從事乃幕府屬內官也南伯從事賢謂樊侍御之賢為漢中荆判官謀事有成功只在立談之間可收其功生知七曜手畫三軍蓋知天文與地理也氷雪淨聰明雷霆走精鋭幕府輟諫官朝廷無此例至尊方旰食洙曰左傳伍奢曰楚君大夫其旰食乎旰晏也仗爾布嘉惠補闕暮徴入柱史晨征憩注曰老聃為柱下史補注鶴曰謂樊以侍御史為判官同御史在殿柱之間亦謂之柱下史秦改為侍御史張蒼自秦時為御史主柱下方書即其任也正當艱難時洙曰天步艱難蘇曰吳起正當艱難之際舉兵深入唯慮糧不繼陷彼逆計更宜度而行之實籍長久一作大計回風吹獨樹趙曰周王褒送葬詩平原看獨樹皇亭望列亭又庾信詩回風即送師白日照執袂慟哭蒼煙根山門萬重閉居人莽牢落逰子方迢遰音弟徘徊悲生離洙曰九章悲莫悲兮生别離局促老一世洙曰古詩螅蟀相局促夢符曰前漢灌夫傳上怒內史曰公平生數言魏其武安長短今日廷論局促效轅下駒陶唐歌遺民洙曰左傳吳季札聞唐之歌曰思深哉其有陶唐氏之遺民乎後漢更列一作别帝恨無匡復姿一作資聊欲從此逝洙曰吾亦從此逝矣師曰唐繼堯後故云有陶唐之遺民亦若孟子云其故家遺俗流風善政猶有存者漢承文景之餘澤遭王莽篡奪不失其天下光武因民謳吟思漢遂建中興之業肅宗亦然故云後漢列帝甫自恨當艱難日無匡復之才以佐天子但從此長往山林因勉樊生當努力以贊中興云送從弟亞赴安西判官至德二年作洙曰一云河西鮑曰亞字次公肅宗在靈武上書論當丗事擢校書郎杜鴻漸莭度河西奏署幕府故云舍弟草中來蒼然請論事補注鶴曰詩有須存武威郡之句當是河西判官梁權道編在至德二年鳯翔作按詩云宗廟尚成灰是時京師猶未復也南風作秋聲蘇曰王澄曉來南風漸作秋聲故山杞菊苗吾當從事於斯矣師曰南風生養之風今作秋聲殺氣盛也時祿山反河北二十四郡皆陷沒於賊安得隂陽調和南風作秋聲蓋有田也殺氣薄炎熾洙曰南風作秋聲言當生育而有肅殺聲盛夏鷹隼擊洙曰月令立秋之日鷹隼乃擊時危異人至令弟草中來蒼然請論事詔書引上殿奮舌動天意洙曰動天意言君意為之回動也蘇曰李斯奮三寸舌取富貴兵法五十家爾腹為篋笥洙曰兵法見漢藝文志邉韶腹便便五經笥蘇曰張敞聽郝焜説書從容語左右曰萬卷書郝腹為篋笥收貯乎應對如轉丸洙曰漢祖從諫若轉圜修可曰開元遺事張九齡每與賔客議論滔滔不竭如下坂走丸人服其俊辨踈通略文字經綸皆新語洙曰如屯卦君子以經綸陸賈造新語足以正神器蘇曰李斯扶正神器四海歡心宗廟尚為灰君臣俱一作皆下淚洙曰九廟為賊所焚也崆洞地無軸補注鶴曰崆洞隴右山名清海即哥舒翰築應龍城處皆河西莭度統之説見後注清海天軒輊洙曰言天地未安也鄭曰輊乍利切車後傾曰軒前傾曰輊夢符曰後馬援夫居前不能令人輊居後不能令人軒注軒輊輕車也西極最瘡痍趙曰季布傳瘡痍未瘳連山暗烽燧彥輔曰唐六典云唐鎮戍烽候所至大約相去三十里其逼邊者築城以致之其放煙一炬二炬三炬四炬者每日初夜舉一炬謂之平安火餘則隨賊多少而為差程曰光武紀修烽炬注云前書音義曰邊方捕警急作土臺臺上作桔橰頭上兜笭以薪草置其中常低之有寇即然火舉之以相告曰烽又多積薪寇至即燔之望其煙曰燧晝則燔燧夜則舉烽帝曰大布衣魯曰左傳衛文公大布之衣藉卿佐元帥坐看清流沙洙曰書曰被於流沙所以子奉使歸當再前席洙曰文帝前席賈生適逺非厯試洙曰舜歷試諸艱須存武威郡為書長久利孤峯石戴驛快馬金纒轡黃羊飫不羶蘆酒多還醉踴躍常人情慘淡苦士志安邊敵何有反正計始遂洙曰唐書天子反正補注希曰漢髙祖紀羣臣曰帝起微細撥亂丗反之正師古注反還也還之正道吾聞駕鼓車洙曰漢文以千里馬駕鼓車修可曰後漢循吏傳建武十三年異國有獻名馬日行千里詔以馬駕鼓車孝文止卻千里馬無駕鼓車之説不合用騏驥龍吟回其頭夾輔待所致洙曰左傳夾輔周室送韋十六評事充同谷防禦判官至德二年作洙日安祿山大亂甫與韋宙同陷賊後皆遁歸行在鮑曰注以為宙宙乃舟之子仕宣宗時非此所送人也補注鶴曰至德二年作故詩云今歸行在所又云鑾輿駐鳯翔也昔沒賊中時潛與子同遊今歸行在所洙曰天子行幸所在曰行在王事有去留洙曰詩王事靡盬逼側兵馬間洙曰逼側見上鄭曰逼彼側切迫也亦作逼主憂急良籌洙曰史范睢云主憂臣辱子雖軀幹小趙曰劉曜詩陳安于壠城安死人謡曰壠城健兒有陳安軀幹雖小腹中寬老一作志氣橫九州補注希曰北山移文霜氣橫秋挺身艱難際張目視冦讎修可曰摘用孟子曰視君如冦讎朝廷壯其節奉詔令參謀鑾輿駐鳯翔同谷為咽喉洙曰西都賦乘鑾輿鳯翔府扶風郡同谷郡今成州西扼弱水道洙曰禹貢弱水既西孝祥曰十州記云鳯麟洲在西海之中四靣有弱水繞之南鎮枹罕陬洙曰一作氐羌陬唐安鄉郡河州理枹罕縣枹罕故羌侯邑枹音孚本枹鼓字也補注希曰唐志云安昌郡本枹罕郡又有枹罕縣在隴右道與弱水同道所謂大川河洮弱羌休屠之澤也此邦承平日剽劫吏所羞洙曰漢地理志推剽掘冡師古曰推殺人而剽劫之也况乃胡未滅控帶莽悠悠府中韋使君道足示懷柔令姪才俊茂二美又何求受詞太白腳洙曰太白山在武功縣南去長安三百里十朋曰録異記金星之精墜於終南號為太白其精化為白石狀如美玉常有紫氣覆之泰伯曰地圖記曰太白山甚髙上常積雪無草木半山有雲如瀑布則澍雨人常候驗如離畢焉走馬仇池頭洙曰成州上祿縣有仇池也晉永嘉末為氐羌文茂所據歐陽曰三秦記曰仇池山上廣百頃平如砥其南北有山路東西懸絶百仭一夫守道萬夫莫向山勢自然有樓櫓却敵之狀上有岡阜泉源史記謂秦得百二之固也馬曰南史武興國本仇池楊難當自立為秦王本朝同州河地乃故地也補注希曰後漢書云氐人所居也方百頃四面斗絶其山下石上玉形如覆壺在今成州上祿縣古色沙土裂洙曰色一作邑前書音義曰沙土曰漠即今磧也積隂霜雪稠洙曰一作積雪隂雲稠羌父豪豬靴羌兒青兕裘趙曰宋玉招魂君王親發兮憚青兕吹角向月窟洙曰顔延年歌月毳來賔毳窟也月窟西極長楊賦西壓月窟泰伯曰樂録曰蚩尤率魑魅與黃帝戰於涿鹿帝乃命吹角為龍鳴以禦之蒼山旌斾愁鳥驚出死樹趙曰吳平為句章州門前忽生一枝青桐樹上有歌謡之聲平惡而斫之平隨軍北虜首尾三年死樹歘自還立於故根上樹巔空中歌曰死樹今更青吳平尋當歸故公詩又曰百年死樹中琴瑟龍怒拔老湫洙曰湫水在涇州界興雲雨土俗亢旱每於此求之相傳云龍之所代也天下山川隈曲有之古來無人境今代橫戈矛修可曰孫興公天台賦序卒踐無人之境蘇曰范蠡今日橫戈簇矛相持之場皆古來無人之境傷哉文儒士憤激馳林丘中原正格鬭洙曰相抱而殺之曰格蘇曰宋玉見襄王曰方今強秦恣橫六邦鼎沸韓魏蜂起中原格鬭不息願王練兵訓士待其不虞王善之趙曰陳林飲馬長城窟行云男兒寧當格鬭死後會何緣由百年賦命定豈料沉與浮且復戀良友握手步道周魯曰詩有杖之杜生於道周釋文周曲也韓詩石也師曰道周即道邊也論兵逺壑淨亦可縱冥搜師曰冥搜即搜吟也題詩得秀句蘇曰陸士龍題詩對南山日晚得秀色札翰時相投送李校書二十六韻乾元元年作鮑曰李舟也國史補言舟好事與妹書曰釋迦生中國設教如周孔周孔生西方設教如釋迦天堂無則巳有則君子生地獄無則巳有則小人入則其人可知公固極稱道補注鶴曰按唐宰相丗系表李舟字公受為虔州刺史隴西縣男今詩云乾元元年春萬姓始安宅當是其年在諫省時作代北有豪鷹師曰大鷹也生子毛盡赤趙曰譬李舟也渥窪騏驥兒一作種趙曰東方朔曰騏驥緑耳天下良馬也尤異是龍脊一作虎趙曰爾雅曰騮馬黃脊李舟名父子清峻流輩伯人間好妙年不必須白晳趙曰左昭二十六年冉豎曰有君子白晳鬚十五富文史十八足賔客十九授校書二十聲輝一作燀赫衆中每一見使我潛動魄自恐二男兒辛勤養無益秦曰二子一曰宗文一曰宗武甫既羡李舟自愧子不若故云乾元元一作二年春萬姓始安宅洙曰乾元肅宗年號收復京師民始安居蘇曰張湯萬姓蘇息始安厥宅補注鶴曰肅宗以至德二年十月癸亥至靈武乾元元年安慶緒將元皓且降免陷賊州三嵗稅天下非租庸無輒役使萬姓安宅當止是元年舟也衣綵衣趙曰列女傳老萊子孝養二親著五色綵衣卧地為小兒啼告我欲逺適倚門固有望斂衽就行役洙曰詩父曰嗟豫子行役趙曰戰國策齊王孫賈之母謂賈曰汝朝出而晚來則吾倚門而望汝暮出而不還則吾倚閭而望馬曰陶淵明勸農四言云敢不斂衽南登吟白華洙曰白華孝子之潔白也巳見楚山碧蘇曰景差至蒲騷見宋玉曰不意重見故人慰此去國戀王之心昨到夢澤喜見楚山之碧眼力頓明今又會故人閉目心足矣藹藹咸陽都冠蓋日雲積洙曰張景陽藹藹言氣象咸陽古雍郡也冠蓋士大夫也雲積言其多也何時太夫人洙曰文帝紀列侯妻稱夫人列侯死子復為列侯乃得稱太夫人堂上會親戚洙曰潘安仁間居賦太夫人在也汝翁草明光洙曰漢武帝紀太初四年秋起明光宮凡掌制誥文字謂之視草趙曰後漢尚書郎直宿於建禮門奏事明光殿下筆為詔誥出語為誥令在唐則中書舍人也朝曰凡掌制誥必有草故為之起草補注鶴曰按丗系表則汝翁當是名岑終水部郎中眉州刺史天子正前席歸期豈爛熳别意終感激顧我蓬屋姿洙曰曹子建顧念蓬室士謬通金門籍洙曰謝玄暉出尚書省詩既通金門籍師曰甫為拾遺故云云小來習性懶晚節一作嵗慵轉劇每愁悔吝作如覺天地窄羡君齒髮新行巳能夕惕洙曰易乾卦夕惕若厲臨岐意頗切對酒不能喫修可曰李陵詩對酒不能酬回身視緑野慘淡如荒澤老鴈忍春飢哀號待枯麥趙曰漢時謡大麥青青小麥枯時哉髙飛燕絢練新羽翮洙曰老鴈甫自喻也時燕喻李校書趙曰頳白馬賦云别輩超羣絢練􅗥絶注絢練疾也長雲濕褒斜洙曰西都賦右界褒斜隴首之險修可曰後漢順帝罷子午道通褒斜路褒斜谷名南谷名褒北谷名斜首尾七百里鄭子真所耕在此谷口斜余遮切漢水饒巨石補注希曰魏石門銘云皇魏正始元年漢中獻褒斜地三秦記云褒斜漢中谷禹貢注漢水出於漾漾水東南流為沔水至漢中東流為漢兹同褒斜言之殆是舟往山南云無令軒車遲洙曰古詩思君令人老軒車來何遲衰疾悲宿昔師曰甫與舟有宿昔之歡况當老而有此别儻或來遲無以慰衰疾寧免悲思之乎洗兵馬乾元二年作洙曰收京後作補注鶴曰此詩當是乾元二年春作末云田家望望惜雨乾蓋二年春無雨也梁權道編在元年恐非中興諸將收山東趙曰山東河北也安祿山反先陷河北諸郡至二京已復慶緒奔於河北之後史思明等降而諸郡盡復故曰中興捷書夜報清晝同河廣傳聞一葦過洙曰衛詩誰謂河廣一葦杭之胡危命在破竹中洙曰晉杜預傳今兵威巳振譬如破竹數莭之後迎刃而解無復著手處也秪殘鄴城不日得補注希曰河廣指衛州謂子儀破賊十萬於衛州獲安慶緒弟慶和進攻衛州崔光逺拔魏州是時相州未復所以有不日得之句獨任朔方無限功趙曰指言郭子儀也素為朔方莭度使時專任子儀京師皆騎汗血馬趙曰汗血馬出大宛蓋胡馬也皆騎汗血馬以言回紇騎胡馬之多回紇餧肉蒲萄宮沈曰餧肉出張耳傳如以肉餧虎何益則視回紇為虎以言強暴為患也孝祥曰蒲萄宮見景龍文館記云中宮召近臣晏東蒲萄園奏以宮樂謂此園耳補注希曰大宛馬皆汗血其先天馬子也又前漢禮樂志天馬歌云霑赤汗又北史遮逸國獻汗血馬又回紇謂至德初葉護太子率兵四千助國討賊葉護入見宴賜加等按唐志注華原縣有蒲萄園宮巳喜皇恩清海岱洙曰禹貢海岱惟青州常思仙仗過崆洞洙曰王元長策崆洞有順風之請廣成子在崆洞山黃帝順下風膝行進而問道三年笛裏關山月黃曰臨風對月足快人意關山者家鄉所在也萬國兵前草木風修可曰周王褒燕歌行云無復漢地關山月唯有漠北薊城雲蘇曰趙肅萬國兵革振動如雄風之偃草木其悲聲非一成王功大心轉小鮑曰乾元元年徙封俶為成王郭相謀深古來少洙曰郭子儀也司徒清鑒懸明鏡洙曰言李光弼尚書氣與秋天杳洙曰指言僕固懷恩蘇曰晏子歸謂諸大夫曰司徒氣論杳若秋天明月誰可量其逺近髙下趙曰尚書指言王思禮思禮收東京戰數有功遷兵部尚書江子之以為房琯非是劉曰按至德二年琯罷相卒貶邠州刺史舊注作懷恩非是秦曰據本傳復兩京懷恩雖有功止詔加鴻臚卿其後乾元二年方召入為工部尚書今公詩是收復兩京後豈即是懷恩耶二三豪俊為時出整頓乾坤濟時了東走無復憶鱸魚彥輔曰張翰見秋風起乃思吳中蓴羮鱸魚遂命駕東歸南飛覺有安巢鳥洙曰古詩云越鳥巢南枝趙曰曹孟德詩云烏鵲南飛青春復隨冠冕入紫禁正耐煙花繞趙曰乾元元年正月上皇授皇帝以傳國璽此時衣冠併入而定矣故公今詩云紫禁紫宮之禁也蓋以紫微帝座得名鶴駕通宵鳯輦備蒼舒曰右按漢宮闕疏白鶴太子之所居凡人不得輒入魯曰劉向列仙傳云王子喬周靈王太子晉也好吹笙作鳯鳴七月七日於緱氏山頭乘白鶴舉手謝時人而去故後世稱太子之駕曰鶴駕宮曰白鶴禁曰鶴禁雞鳴問寢龍樓曉趙曰文王為世子雞初鳴至寢門外問內竪之御者曰今日安否何如無已曰文選王融字元長曲水詩序曰儲后睿哲在躬出龍樓而問竪入虎闈而齒胄注龍樓太子之門名也補注希曰成紀出龍樓門張晏曰門樓上有銅龍若白鶴飛亷之為名也攀龍附鳯勢莫當天下盡化為侯王洙曰楊子攀龍鱗附鳯翼時攀附而立功者皆有恩汝等豈知蒙帝力洙曰莊子曰帝力何有於我哉時來不得誇身強關中既留蕭丞相洙曰蕭何餉餽糧道不絶幕下復用張子房洙曰髙祖曰運籌帷幄之中吾不如子房張公一生江海客身長九尺鬚眉蒼蘇曰謂張鎬也蕭嵩薦之曰用則帝王師不用則窮谷一叟耳徴起適遇風雲會洙曰二十八將論咸能感會風雲補注希曰陸機江籬曰蒙被風雲會扶顛始知籌䇿良洙曰語顛而不扶青袍白馬更何有定功曰庾信哀江南賦青袍如草白馬如練後漢今周喜再昌寸地尺天皆入貢補注鶴曰法黃庭經寸田尺宅可治生語竒祥異瑞爭來送不知何國致白環洙曰丘希範書白環西獻楛矢東來丗本曰舜時西王母獻白環及珮復道諸山得銀甕洙曰禮運山出器車注器車謂若銀甕用甑隱士休歌紫芝曲安石曰皇甫謐髙士傳秦世道滅德消坑黜儒術四皓於是退而作歌曰莫莫髙山深谷逶迤曄曄紫芝可以療飢唐虞世逺吾將何歸駟馬髙蓋其憂甚大富貴之畏人兮不如貧賤之肆志乃共入商洛隱地肺山詞人解撰河清頌歐陽曰鮑昭元嘉中河濟俱清當時以為美瑞昭為河清頌趙曰是嵗既收京而於七月黃河三十里清如氷蓋收京之實事也田家望望惜雨乾補注希曰按史乾元二年春旱乃作此詩云耳布榖處處催春種洙曰布榖鳴鳩也淇上健兒歸莫懶朝曰時思明餘黨未殄故衛相等州尚留兵屯故有淇上健兒之句城南思婦愁多夢洙曰東山詩婦嘆於室安得壯士挽天河洙曰梁沈約詩安得壯士馳奔波蘇曰蜀相劉文靜曰方今鼎足宇宙鑊居黎氓烏得五丁壯士挽回天河洗滌天下之甲兵車書一同凶器長不用皇天后土豈不知區區之誠哉孔明賢之淨洗甲兵長不用洙曰武王伐紂大雨洗兵早秋苦熱堆案相仍乾元元年作補注鶴曰嵇康與山濤書人間多事堆案盈几按公乾元元年從左拾遺移華州掾故文集有乾元元年華州試進士䇿問又有乾元元年七月為華州郭使君進滅殘寇形勢圖狀則公秋初在華州明矣而師注魯訔年譜以是詩為二年作梁權道以為元年作詳夜中自足蝎秋後轉多蠅之句殆是指當時譖訴之人必是元年初到華州時作七月六日苦炎蒸師曰至德二載甫自賊竄歸謁帝帝授左拾遺房琯兵敗陳濤斜帝怒甫上疏論其罪帝貶甫為華州司功即乾元元年也是年七月任華州西北地早寒於七月六日猶苦熱故甫託意以譏羣臣是時賀蘭進明譛琯於帝併及甫甫被逐對食暫餐還不能趙曰蔡琰詩曰飢當食兮不能餐每愁一云常愁夜中一作來自足一作皆是蝎許竭切趙曰蝎者螫蟲中原有之南中無有韓退之謫南方及其歸也有詩云照壁喜見蝎則每以得歸為念故喜况乃秋後轉多蠅束帶發狂欲大呌簿書何急來相仍洙曰唐書切於簿書期會南望青松架短壑趙曰江文通郊遊詩風散松架險安得赤腳踏層氷蘇曰馬融夏夜直館是夕蒸燠倍常如坐甑中謂同舍曰安得披襟赤腳踏隂山之層氷洗滌塵熱也立秋後題乾元二年作補注鶴曰以罷官亦由人知是乾元二年欲棄官時作日月不相饒蘇曰王獻之覽鏡見髮顧兒童曰日月不相饒村野之人二毛俱催矣汝等何不汲汲為學寸隂過而不可復得也節敘昨夜隔玄蟬無停號秋燕巳如客蘇曰張衡旅寓洛納生計無聊有命駕之心顧梁上燕曰秋風已至想如客興斯難久留也平生獨往願惆悵年半百補注鶴曰乾元元年公年四十七今云半百舉成數而言也罷官亦由人何事拘形役洙曰陶淵明歸去來既自以身為形役奚惆悵而獨悲師曰甫此二篇詩作於乾元元年至二年果棄官之秦州補注杜詩卷四
