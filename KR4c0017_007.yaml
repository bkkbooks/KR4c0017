body:
  text: 補注杜詩卷七宋黃希原本黃鶴補注石笋行上元元年作彥輔曰成都記石笋及林亭池石之地雨過必有小珠或青黃如粟者亦有細孔可以貫絲田曰杜光庭石笋記云成都子城西曰興義門金容坊有通衢幾百五十步有石二株挺然聳峭髙丈餘圍八九尺耆舊傳云其名有六曰石笋曰蜀妃闕曰沈犀石曰魚鳬仙壇曰西海之眼曰五丁石門皆非也圖經云石笋街乃秦寺之遺址殿宇樓臺咸以金寶飾之為一代之勝概又云蜀之城壘方隅不正以景測之石笋于南北為定無所偏邪今按石笋在衙西門外僅百五十步二株雙蹲一南一北北笋長一丈六尺圍極于九尺五寸南笋長一丈三尺圍極于一丈二尺南笋蓋公孫述時折故長不逮北笋趙曰此篇作于上元元年是時李國輔日離間二宫擅權之跡甚彰故因賦石笋而指譏李輔國也師曰甫意謂此石必是古者卿相墓前表識後世妄加緣飾謂為海眼以䝉蔽愚俗蓋譏祿山國忠以微賤小臣䝉蔽𤣥宗致天寶末年之禍然誣辭謬語君子當致察補注鶴曰此詩趙注以為作于上元元年為李輔國離間二宫而作按通鑒上元元年七月輔國矯稱上語迎上皇逰西內此詩云䝉蔽媚悅其事隱而彰終云安得壯士擲天外使人不疑見本根蓋恨去輔國輩之不速卒為盜殺猶不顯誅之可惜君不見益州城西門陌上石笋雙髙蹲徂尊切洙曰成都記石笋城西門百餘步亦呼為石笋隅落相隅西南數步不對各折為五六段相續以立人云五丁擔亦曰蜀王妃墓表益州城郭皆不直此蓋正東西也陌一作街古來一云老相傳是海眼苔蘚食盡波濤痕田曰成都記距石笋二三尺每夏月大雨往往陷作土穴泓水湛然以竹測之深不可及以繩繫石而投其下愈投而愈無窮凡三五日忽然不見嘉祐春牛車碾地忽陷亦測而不能達父老甚異故有海眼之說趙曰華陽風俗記蜀人曰我州之西有石笋焉天地植之以鎮海眼動則洪濤大濫雨多往往得瑟瑟洙曰每雨過人多得瑟瑟蒼舒曰按博雅瑟瑟碧珠也杜陽雜編有瑟瑟幕其色經明靈薄無與為比此事恍惚難明論恐是昔時卿相墓立石為表今仍存洙曰揚雄蜀王本紀云武都丈夫化為女子蜀王納以為妃無幾物故乃葬于成都郭中以石作鏡一梔表其墓華陽國志曰王哀念之遣五丁之武都擔土為妃作冢立石今俗名為石笋補注希曰寰宇記望帝禪位于鱉令號開明下五華有開明尚始立宗廟時天生五丁力士能徙山蜀王負力不為戰備每一王死輒為立大石長三丈重萬鈞以為墓識今石笋是也晏曰笋里惜哉俗態好䝉蔽亦如小臣媚至尊政化錯忤失大體蘇曰趙充國近見大臣全失燮理政化錯忤隂陽不時多失大體坐看傾危受厚恩洙曰時林甫國忠傾覆王室嗟爾石笋擅虛名後生未識猶駿奔洙曰詩駿奔走在廟安得壯士擲天外洙曰梁沈約詩安得壯士駐奔羲使人不疑見本根洙曰華陽風俗録云蜀人曰我川之西有石笋焉天植之以鎮海眼動則江濤大濫四方之人有來觀者則奇而怪之贊皇公曰夫笋之為狀也亭亭揭峭髙然若削圭芒天成神矣今小大相因叠至八九節東以鐵鼓出于人力又何神乎遂命抽去鐵鼓寂然而神怪不作趙曰此八句正以專指李輔國坐看傾危受厚恩言輔國之寵幸也舊注却云是時林甫國忠用事而公譏之大非是石犀行上元二年秋作魯曰成都記石犀在李太白廟內補注鶴曰李氷作石犀以厭水災而上元二年秋八月灌口捐户口故作是詩然意亦有所寓也君不見秦時蜀太守刻石立作三犀牛洙曰華陽國志秦孝文王以李氷為蜀守氷作石犀五頭以厭水精穿石犀於江南命曰犀牛里後轉為耕牛二頭一在府市橋門今所謂石牛門一在淵中又自前堰上分穿羊摩江灌口西于玉女房下自涉郵作三石人立水中與江神要水竭不至足盛不沒肩成都記亦云石犀五今云三犀牛未詳自古雖有厭勝法洙曰胸奴傳上以太嵗厭勝所在師古注漢髙紀云蕭何初立未央宫以厭勝之術天生江水向一云須東流洙曰莫愁歌河中之水向東流蜀人矜誇一千載泛溢不近張儀樓洙曰按圖經秦張儀築少城在大城西又周地圖云張儀築城樓壞不能立忽有一龜周旋巫依龜行巡築遂得立今有龜化橋成都記云張儀樓在子城南髙一百尺初築此城雖曰附龜蓋以順江山之勢正即為耕矣乃作此樓而定南北焉今年灌口損户口此事或恐為神羞洙曰武成以濟兆民無作神羞左襄十八年茍捷有功無作神羞補注鶴曰寰宇記云灌口山在西嶺有天彭闕尺云灌口鎮在彭州九隴縣鎮城西有玉女神祠祠之西有蜀守李冰祠今年水損户口所以為李冰之羞按舊史帝紀上元二年七月霖雨至八月方止墻宇多壞漉魚道中今年乃是上元二年秋故下云終藉隄防出衆力高擁木石當清秋終藉隄防出衆力高擁木石當清秋先王作法皆正道詭怪何得參人謀趙曰厭勝者詭怪之事為不足憑故水終有時而為害隄防者正道故終藉人力以為隄防也嗟爾三犀不經濟缺訛只與長川逝趙曰此公之寓意於三犀指廟堂無經濟之人乾元二年乃吕諲李現李揆第五琦同平章事未幾以罪去但見元氣常調和自免洪濤恣凋瘵洙曰曹子建詩泛舟越洪濤趙曰謂元氣之調特在乎得人蓋宰相以燮理隂陽為事也安得壯士提天綱再平水土犀奔茫洙曰陳蕃傳志清天綱舜典咨禹汝平水土定功曰沈約云安得壯士駐奔羲師曰𤣥宗時用李林甫楊國忠為政致有滔天之禍其亦實犀之擅虛名者乎甫托意黜之杜鵑行上元元年作補注鶴曰觀其詩意乃感明皇失位而作當是上元元年遷西內後太平寰宇記言望帝以德不如鱉令因禪位于鱉令號開明遂自亡去化為杜鵑鳥故蜀人聞杜鵑鳴曰是我望帝也君不見昔日蜀天子化為杜鵑似老烏趙曰按蜀記昔有姓杜名宇號望帝宇死俗傳化為子規鳥一名鵑蜀人聞子規鳥皆曰望帝遂於鵑字加杜姓謂之杜鵑又直謂之杜宇寄巢生子不自啄羣鳥至今為哺雛雖同君臣有舊禮骨肉滿眼身羇孤業工竄伏深樹裏四月五月偏號呼補注鶴曰通鑑上元元年七月丁未李輔國矯稱上語迎上皇遊西內至睿武門輔國將期射生五百騎露刃遮道曰皇帝以興慶宫湫隘迎上皇遷居大內上皇驚幾墜力士曰李輔國何得無禮叱下馬云云陳𤣥禮高力士及舊宫人皆不得留左右丙辰高力士流巫州王承恩流幡州魏悅流溱州陳𤣥禮勒致仕置如仙媛於歸州玉真宫主出居玉真觀上皇以不懌因不茹葷辟榖浸以成疾詩云雖同君臣有舊禮骨肉滿眼身羈孤又云業工竄伏深樹裏蓋謂此也其聲哀痛口流血所訴何事常區區爾豈摧殘始發憤羞帶羽翮傷形愚蒼天變化誰料得萬事反覆何所無豈憶當殿羣臣趨趙曰鮑昭行路難云中有一鳥名杜鵑言是古者蜀帝魂聲音哀苦鳴不息云云豈憶往日天子尊今公所謂哀痛口流血及末句憶羣臣趨蓋出於此也師曰時祿山反陷兩京明皇西走幸蜀既失帝位奈何又棄骨肉而孤寓他邦云云肅宗即位靈武不能即遣迎還明皇而使之羇孤在蜀明皇由是悒怏不得意至於化去其亦不免於怨傷乎甫之言頗有深意補注希曰師注謂明皇幸蜀失位肅宗即位靈武不能迎還使之羇孤悒怏化去則非蓋此詩専譏肅宗為李輔國所間故曰萬事反覆何所無豈憶當殿羣臣趨戲作花卿歌上元二年作彥輔曰高適傳梓州副使假子璋反以兵攻東川節度李奐適率州兵與西川節度使崔光逺攻子璋斬之西川牙將花敬定者恃勇既誅子璋大掠東蜀天子怒之師曰甫為花卿痛惜之補注鶴曰按史上元二年四月壬午假子璋反此詩當是其年成都作舊史俱作花驚定成都猛將有花卿魯曰花卿家在丹稜東館鎮至今血食其鄉本朝封為忠應公學語小兒知姓名用如快鶻風火生蒼舒曰南史曹景宗謂所親曰我昔在鄉里騎快馬如龍覺耳後生風鼻尖出火此樂使人忘死不知老之將至余曰易家人卦巽上離下為風自火出風生于火自內而出也象曰風自火出家人見賊唯多身始輕洙曰漢光武見大敵則勇綿州副使著柘黃洙曰綿州副使段子璋也著柘黃僭乘輿服色趙曰公詩云綿州則梓州字誤傳為綿州乎柘黃天子之服也補注鶴曰史云劍南東川節度兵馬使段子璋反陷綿州遂州按舊史東川節度治梓州管梓州綿劍普陵榮遂合渝瀘等則不當云綿州副使然是時治綿州趙未之考也我卿掃除即日平子璋髑髏血糢糊手提擲還崔大夫洙曰子璋即段子璋也崔大夫崔光逺也李侯重有此節度洙曰李侯東川節度使李奐也趙曰段子璋既攻東川則李奐必失節度矣以花卿斬之則李侯復保有節度焉人道我卿絶世一作代無既稱絶世無天子何不喚取守京都洙曰譏其掠奪也黃曰子美作花卿歌雄壯激昂讀之想見其人也補注希曰舊史崔光逺傳上元二年兼成都尹充劒南節度營田觀察處置使仍兼御史大夫及段子璋反東川節度使李奐敗走投光逺卒將花驚定討平之將士肆其剽取婦女有金銀釧兵士皆斷腕以取之數千人光逺不能禁肅宗遣監軍中使按其罪光逺憂恚疾卒然則花卿豈容獨免乎天子何不喚取守京都之句雖譏之亦傷之也贈蜀僧閭丘師兄上元元年作彥輔曰太常博士均之孫補注鶴曰詩云我住錦官城當是上元元年秋冬作故詩云粳稻卧不翻大師銅梁秀洙曰左思蜀都賦於東則左綿巴中百濮所充外負銅梁於嚴渠田曰太平御覽載張孟蜀都賦注云銅梁山名也按其山有桃枝竹東而連亘三十餘里山履之上平整逺望諸山此獨秀也山在合州界銅梁縣浦注鶴曰按唐志山南道古荆梁二州之域其名山嶓冢熊耳銅梁巫荆峴十道志云銅梁山在涪江之南七里然梓州合州俱有之益部舊傳云昔楚襄滅巴子封庶子于漢江之南號銅梁侯髙僧傳晉惠亮大師小師籍籍名家孫安石曰籍籍名聲之盛也嗚呼先博士炳靈精氣奔洙曰蜀都賦近則江漢炳靈世再其英鬱若相如爝若君平王褒暐曄而秀發揚子含章而挺生師曰炳靈言英靈顯赫也惟昔武皇后臨軒御乾坤多士盡儒冠墨客藹雲屯洙曰揚子雲上長楊賦故籍翰林以為主人子墨為客卿以諷當時上紫殿不獨卿相尊洙曰謝𤣥暉值中書省紫殿肅隂隂補注希曰成紀行幸甘泉郊太畤神光降及紫殿世傳閭邱筆師曰閭􅉌文筆號為大手峻極逾崑崙洙曰禹本紀崑崙髙三千五百里日月所相避隱為光明也鳯藏丹霄暮一作穴龍去白水渾洙曰東京賦世祖龍飛白水青熒雪嶺東洙曰西都賦琳珉青熒沈曰雪嶺在蜀一名太白山補注希曰雪嶺在維州之南二百六十里碑碣舊製存田曰東蜀牛頭山下有閭􅉌均撰瑞堊寺磨崖碑嚴政書寺今改為天寧羅漢禪院斯文散都邑髙價越璵璠洙曰均以文名當時四方碑碣多出其手晚看作者意趙曰郤生見王導詩嘆曰晚見作者妙意梅曰作者指均也妙絶與誰論洙曰陸韓卿賦歌能妙絶吾祖詩冠古同年䝉主恩補注鶴曰吾祖謂杜審言按本傳武后召審言將用之問卿歡喜否審言蹈舞謝后令賦歡喜詩歎重其文授著作郎遷膳部員外郎時與均同朝神龍初坐交適張易之流峯州入為國子監主簿修文館直學士卒其卒在景龍二年宋之問有祭文云云豫章夾日月嵗久空深根洙曰見豫章深出地注小子思疏闊豈能達詞門蘇曰宗戩讀淵明詩撫卷歎曰小子疏略焉能逹文詞之門閫使人有愧赧之心信乎一世之真儒窮愁一揮淚洙曰愁一作秋陸士衡詩揮淚歎流離相遇即諸昆我住錦官城洙曰成都記錦城以江山明麗錯雜如錦兄居祗樹園鄭曰祗翹移切洙曰金剛經佛在舍衛國祗樹給孤獨國田曰楞嚴經云祇洹精舍注云祗洹林樹名咀云祗陀洹或云逝多此云戰勝即太子名林王是彼故云勝林精舍地近慰旅愁往來當􅉌樊天涯歌滯雨粳􅀈卧不翻漂然薄逰倦始與道旅敦旅一作侣景晏步修廊而無車馬喧洙曰陶淵明結廬在人境而無車馬喧夜闌接軟語落月如金盆洙曰法華經又以軟語一云言詞柔軟補注希曰維摩經云大富梵行所言誠諦當以軟語漠漠世界黑一作空驅驅爭奪繁唯有摩尼珠可照濁水源洙曰言性照圓明如摩尼珠然雖識濁水而不為汚濁所纍也田曰圓覺經譬如清淨摩尼寶珠映于五色隨方各現宣室志云馮翊嚴生家漢南峴山得一珠如彈丸色胡人曰此西國清水珠也若至濁水冷然洞徹矣以三十萬易之而去師曰摩尼珠以喻法性圓明清淨不染塵垢甫奔走盜賊間健羡閭􅉌不為汚濁所纍故云云泛溪上元元年作補注鶴曰溪謂浣花溪也當是上元元年秋晚作是時公巳居溪上落景下髙堂進舟泛回溪洙曰謝靈運對嶺臨回溪誰謂築居小洙曰謝靈運躡險築幽居未盡喬木西逺郊信荒僻秋色有餘淒練練峯上雪馬曰練練白貌纎纎雲表霓童戲左右岸洙曰岸一云峯一云兒童戲左右趙曰江淹麗色賦色練練而欲奪吳筠詩練練波中月皆取白之義師曰童戲甫之子宗文宗武也罟弋畢提攜翻倒荷芰亂指揮徑路迷趙曰莊子曰畢弋多鳥亂于上網罟多魚亂于下網罟以取魚畢弋以取鳥今謂畢提㩦者乃是畢盡之畢言兒戲至盡攜網罟畢弋以取魚鳥師曰恐小兒之迷道故指揮之得魚巳割鱗採藕不洗泥人情逐鮮美物賤事巳一作迹睽趙曰公因目前實事起意以雖小兒猶知好新而厭故也師曰開元中物賤今兵火以來百物踊貴與向者巳睽異矣吾村靄瞑姿程曰言日已黑矣異舍雞亦棲蕭條欲何適洙曰沈文休蕭條何所欲出處庶可齊衣上見新月霜中登故畦濁醪自初熟東城多鼓鼙蘇曰應璩過溫泉見孟嘉問曰何適嘉曰欲歸東城濁酒狂歌度此疲耳璩曰今虎狼滿野鼓鼙聲多我輩無措手足矣古詩云暮出城東路鼓鼙愁殺人師曰東城多鼓鼙言祿山亂范陽也補注希曰東城謂史思明上元元年入東京通鑑云六月田神功破史思明之兵於鄭州又史思明遣其將田承嗣王同芝敬江薛鄂徇淮西陳許兖鄆曹州是也題壁上韋偃畫馬歌上元元年作鮑曰朱景𤣥畫斷韋偃伯父工龍馬父鑾工山水松石偃又工仙僧老松異石人知其善畫馬不知松石更工補注鶴曰以後韋偃為雙松圖歌考之偃時在成都此當是上元元年成都作韋侯别我有所適鄭曰韋侯韋偃也知我憐君一作渠畫無敵戲拈彥輔曰一云試拈秃筆掃驊騮歘見騏驎出東壁洙曰顔延年白馬賦歘聲躍以鴻驚驊騮良馬也騏驎瑞獸也一匹齕草一匹嘶齕下沒切坐看千里當霜蹄當丁浪切時危安得真致此與人同生亦同死洙曰莊子馬蹄可以踐霜雪齕草飲水趙曰末章寓意遭時艱危安得此真馬以濟患艱免使甫困躓道路故云與人同生亦同死戲題王宰畫山水圖歌上元元年作彥輔曰王宰畫筆丹青絶倫補注鶴曰畫斷王宰畫山水樹木出于象外梁權道謂上元元年成都作若如泰伯之說云公託意言永王璘反吳松江為之阻絶時李光弼在并州欲得李來平之至德二年與舊次不同按史上元元年劉展反陷潤州升州蘇州乃吳松江或者公託意以此十日畫一水五日畫一石能事不受相促迫王宰始肯留真跡壯哉崑崙方壺一作丈圖洙曰列湯問渤海之東注世傳大海與天海通其中有五山一曰岱嶼二曰圓嶠三曰方壺四曰瀛洲五曰蓬萊又周穆王宿於崑崙之阿云云挂君髙堂之素壁巴陵洞庭日本東洙曰巴陵嶽陽也洞庭在其左海東有日本國赤岸水與銀河通本中曰南兖州記曰瓜步山東五里江有赤岸山南臨江中郭景純江賦鼓洪濤於赤岸趙曰巴陵郡嶽州也洞庭在焉赤岸在真州中有雲氣隨飛龍洙曰莊子姑射山有神人乘雲氣御飛龍而逰乎四海之外舟人漁子入浦溆山水盡亞一作帶洪濤風洙曰江賦舟子涉人又蘆人漁子海賦舟人漁子徂南極東尤工逺勢古莫比咫尺應須論一作千萬里夢符曰南史竟陵王子良傳賁宇文煥能書善畫于扇上圖山水咫尺之內便同萬里為遙矜慎不傳自娛而巳補注希曰世說袁彥伯為謝安司馬諸人送瀨卿歎曰江山寥落居然有萬里之勢又湘東王蕭澤讀畫品蕭育常畫扇上為山咫尺之內而為萬里之遙焉得并州快剪刀蘇曰索靖見顧愷之畫欣然曰恨不帶并州快剪刀來欲剪松江半幅紋練歸去古詩曰借君快剪刀輕綃剪波去剪取吳松半江水趙曰吳松言吳地之松江也泰伯曰甫託意言永王璘反漢中吳松江為之阻絶不通時李光弼守并州所攻必下喻以快剪刀言其斷也意欲得光弼之將平漢中以通吳松故云云題李尊師松樹障子歌乾元元年作補注鶴曰梁權道從舊編謂上元元年成都作然𤣥都壇在長安今云時危慘淡來悲風當在乾元元年諌省作老夫清晨梳白頭𤣥都道士來相訪補注鶴曰按公玄都壇歌云故人今居子午谷獨在隂崖結茒屋前太古𤣥都壇則𤣥都壇在長安又㑹要云長安京城朱雀街有𤣥都觀隋開皇二年移置之握髮呼兒延入戶彥輔曰周公一沐三握髮手提新畫青松障障子松林靜杳𡨕慿軒忽若無丹青隂崖却承霜雪一作露幹洙曰馬季長長笛賦生於終南之隂崖偃蓋反走虬龍形老夫平生好奇古對此興與精靈聚已知仙客意相親更覺良工心獨苦邁曰韓宏曰良工用心何苦刻如斯松下丈人巾屨同偶坐似一作自是商山翁洙曰商一云南四皓隱于商山避秦氏之亂補注鶴曰晉王羲之傳似是馬曹悵望一云惆悵聊歌紫芝曲洙曰四皓歌曰曄曄紫芝可以療飢時危慘淡來悲風師曰𤣥都壇名道士受籙皆于此壇障子松林靜杳𡨕言畫松無聲也巳知仙客意相親言有嵗寒之操也昔四皓遭秦亂隱于商山歌紫芝甫傷時盜賊擾攘悵望四皓而想其髙躅故云時危慘淡來悲風古柏行大厯元年作洙曰傷其有才而不得用也補注鶴曰此詩雖指成都孔明廟而言而詩云憶昨路繞錦亭東則不在成都作豈非大厯元年至夔見先主武侯廟遂追憶錦亭所見而成舊編并梁權道俱以為上元元年殆未詳詩中語也惟趙注云此乃追言成都先主廟之柏蓋公近自離成都而來夔故止可言憶昨孔明廟前有老柏彥輔曰成都記云諸葛公廟在先主廟故宅城西復立素像先主廟西院即武侯廟前有雙大柏古峭可愛補注希曰成都記先主廟在府南八里惠陵東七十步又云諸葛公廟在先主廟故宅城西內有相國段公古柏文故此詩云憶昨路繞錦亭東先主武侯同閟宫柯如青銅根如石霜皮溜雨四十圍黛色參天二千尺趙曰孔明為蜀相成都則先主廟而武侯祠堂附焉夔州則先主廟武侯廟各别今詠柏專是孔明廟而已豈非夔州柏乎公詩集中其在夔也屢有孔明廟詩於夔州十絶云武侯祠堂不可忘中有松柏參天長以絶句證之則此乃夔州之詩明矣正敏曰沈內翰譏子美此句以謂四十圍配二千尺為太細長不知子美之意但言其色而已猶言其翠色蒼然仰視髙逺有至于二千尺而幾于參天也若如此求其疵則二千尺固未足以參天而詩謂峻極于天者更為妄語善論詩者正不應爾君臣巳與時際會樹木猶為人愛惜洙曰宣九年思其人猶愛其樹况用其道而不惜其乎人乎劉歆曰思其人猶愛其樹况宗其道而燬其廟雲來氣接巫峽長洙曰宜都山川記曰巴東三峽巫峽長月出寒通雪山白趙曰巫峽在夔之下巫峽之雲來而柏之氣與接雪山在夔之西雪山之月出而柏之寒與通皆言其髙大者也憶昨路繞錦亭東先主武侯同閟宫洙曰詩閟宫有侐趙曰此乃追言成都先主廟之柏蓋杜公近方離成都而來夔故言憶昨也崔嵬枝幹郊原古窈窕丹青户牖空落落盤踞雖得地𡨕𡨕孤髙多烈風趙曰杜篤首陽山賦曰長松落落沈約髙松賦曰鬱彼髙松栖根得地扶持自是神明力夢符曰右按孫興公天台賦嗟台嶽之所異挺實神明之所扶持蘇曰劉禪自是神明扶持非人力能致正直元因造化工大厦如傾要梁棟尹曰耿恭謂岑彭曰方今漢基頽圮英雄寒飢如大厦傾求天下之義士要為梁棟子何如此飢寒不乘時取萬户侯復俟何時耶補注希曰合注以和嶠千丈松事萬牛回首丘山重去聲不露文章世巳驚未辭翦伐誰能送洙曰甘棠勿翦勿伐苦心豈免容螻蟻香葉終經宿鸞鳯趙曰謝靈運後漢書方儲遭母憂種松柏鸞棲其上志士幽人莫怨嗟古來材大難為用洙曰莊子吾有大樹人謂之樗其大本臃腫而不中繩墨立之塗匠者不顧今子之言大而無用衆所同去蘇曰張華志士蓄怨幽人含嗟朝廷雖下哀詔誰肯出松蘿嵓穴戲韋偃為雙松圖歌上元元年作補注鶴曰詩云我有一匹好東絹指東川梓州鵝溪絹而言則此詩作于成都從舊次在上元元年天下幾人畫古松一作樹畢宏已老韋偃少洙曰畢宏亦畫工也鄭曰宏大厯二年為給事中絶筆長風起纎末洙曰長笛賦其應清風也纎末奮䈾滿堂動色嗟神妙蘇曰蕭紼春晏時金甌七發七中滿堂賓客動容嗟服神妙兩株慘裂苔蘚皮屈鐵交錯回髙枝白摧朽骨龍虎死黑入太隂雷雨垂松根胡僧憩寂寞龎睂皓首無住著偏袒右肩露雙腳洙曰金剛經偏袒右肩右膝著地修可曰楞嚴經云名無住行名無著行公取而合用之也葉裏松子僧前落韋侯韋侯數相見我有一匹好東一作素絹重之不減錦繡段洙曰四愁詩美人贈我錦繡段補注希曰我有出毛詩三國志李衡州里有千樹木奴不責汝衣食嵗止一匹絹亦可用矣又鵝溪地名在梓州鹽亭縣出絹甚良時人謂之鵝溪絹即東絹也巳令拂拭光凌亂洙曰謝惠連清波時凌亂請公放筆為直幹師曰畢宏韋偃皆唐之善畫者也白摧朽骨龍虎死謂松枝也黑入太隂雷雨垂謂暗碧之色也偏袒右肩露雙腳言胡僧之狀也東絹謂山東大練也喜雨永泰元年作補注鶴曰按史永泰元年四月巳已自春不雨至是而雨當是永泰元年而梁權道編在上元二年而史不言是年有旱兼滄江是指夔州雲安春旱天地昏日色赤如血趙曰公極言旱日之可畏舊注引前漢河平元年日色赤如血按成帝本紀及天文志皆無之乃晉光熙元年五月壬辰癸巳日光四散赤如血流照地皆赤甲午又如之舊注妄引有誤後學農事都巳休兵戈况騷屑巴人困軍須慟哭厚土熱希曰唐為巴東郡夔州本信州巴東郡武德二年更名又有巴州及壁州亦有巴東縣巴人當是三巴之人其困軍須者謂嚴武雖隔年敗吐蕃于當狗城又克吐蕃鹽川城而未撤其備也滄江夜來雨真宰罪一雪補注希曰滄江指夔州雲安而言按公有雷詩云巫峽中宵動滄江十月雷又云霹靂楚王臺于以知滄江之為夔州雲安即夔之境穀根小蘇息沴氣終不滅何由見寧嵗洙曰國語自子之行晉無寧嵗趙曰沴氣隂陽錯謬之氣也沴音戾莊子曰陰陽之氣有沴解我憂思結崢嶸羣山雲交會未斷絶修可曰周禮隂陽之所交風雨之所會安得鞭雷公滂沱洗吳越蘇曰阮立曰吳楚久旱塵氛翳日昨夜一雨滂沱洗滌俱盡苗稼稍覺蘇息師曰天地昏言煙塵四起騷屑不安貌時永王璘反漢中吳越之間盜賊乘之而起巴峽間困於醜挽怨氣上感農月為之大旱故甫意欲鞭雷公滂沱下雨一洗吳越之亂吳越平則人獲安居天時自得何憂旱乾哉補注鶴曰舊注以吳越為永王璘之亂按史永王璘至德元年冬反而公是時在賊營不應及巴人當是永泰元年作此史云四月巳已有春不雨至是而雨故詩云春旱及七月又以久旱遣近臣録囚則是年自春至秋多旱洗吳越者謂表黽自台州反陷信明等州方伏誅而歙州人又殺其刺史是年春公在嚴武幕中秋寓夔州雲安縣太子張舍人遺織成縟段廣德二年作補注鶴曰梁權道編在上元二年成都作然詩有云來瑱賜自盡而瑱伏誅在廣德元年正月當是廣德二年在成都作公自謂田舍翁則再歸草堂時也客從西北來遺我翠織成洙曰古詩客從逺方來遺我一端綺開緘風濤湧蘇曰吳翰開緘詞采璀璨筆勢若風動濤湧中有掉尾鯨洙曰江賦揚鬐掉尾又介鯨乘濤以出入逶迤羅水族瑣細不足名師曰自開緘風濤湧至此句皆敘織段之紋客云充君褥承君終晏榮修可曰曹植詩終晏不知疲安石曰晏榮乃安榮也空堂魑魅走師曰言堂上無所有鬼神驚駭此物也髙枕形神清梅曰謂爽人神思也領客珍重意顧我非公卿留之懼不祥施之濕柴荆服飾定尊卑大哉萬古程洙曰左傳服之不衷身之災蘇曰王剪留之懼不祥生其間去之可也韓曰程謂法度補注希曰古者服用各有程式故經制定則卑不敢踰尊此公所以不留鯨錦也舊注引車服以庸非今我一賤老短褐更無營趙曰短褐者蓋短窄之褐也煌煌珠宫物寢處禍所嬰蘇曰段植有送九華戰袍甗玉腰帶植曰珠宫貴物非武人所服之章趙曰珠宫指言龍宫也楚辭云員闕號珠宫歎息當路子干戈尚縱橫掌握有權柄衣馬自肥輕洙曰語乘肥馬衣輕裘李鼎死岐陽實以驕貴盈來瑱賜自盡鄭曰瑱陟刃切襄州節度使氣豪直阻兵洙曰上元三年肅宗追瑱入京裴茂稱瑱屈強難制宜早除之代宗潛令裴茂圖之瑱擒茂妻子於江漢瑱入朝謝罪肅宗含怒寶應二年貶瑱播州縣尉翌日賜死於鄠縣藉沒其家補注希曰按舊史李鼎上元元年嘗代崔光逺為鳯翔尹充本府及秦隴觀察使新史廣德元年正月壬寅來瑱削在身官爵長流播州尋賜死於路昔聞黃金多洙曰蘇季子位髙多金坐見悔吝生奈何田舍翁洙曰漢祖起田舍翁受此厚貺情錦鯨卷還客始覺心和平振我粗席塵蘇曰胡誼家貧讀書不憚寒暑所卧牀上唯粗席布衾木枕而巳愧客茹藜羮洙曰王子淵頌羮藜含糗者不足論太牢之滋味趙曰莊子藜羹不糝舊注所引字倒矣師曰甫傷兵革之際生民有不得其食不得其居處者我何忍獨安于此又自卷以還客始覺心和平足知甫之所養于中者宏深雖伯夷何以加此丈人山上元元年作洙曰青城山記云此山為五嶽之長故名丈人山有丈人觀補注鶴曰考公有赴新城縣暫如新津詩當是上元元年而梁權道編在二年成都又青城山記昔寧封先生栖于此岩之上黃帝築壇拜為五嶽丈人晉代置觀自為青城客沈曰𤣥中記蜀郡青城山有洞穴為三道西北通崑崙茅居傳青城十洞天之一也補注希曰青城山在漢中郡有斗開山經云斗山五穴通崑崙唐志蜀州有青城縣縣有青城山蜀州本析益州置公至成都故曰青城客不唾青城地趙曰唾地者有所惡而唾也不唾其地所以敬之也為愛丈人山丹梯近幽意洙曰謝𤣥暉敬亭山詩要欲返奇趣即此陵丹梯丈人祠西佳氣濃洙曰陶濳山氣日夕佳後漢鬱鬱葱葱氣佳哉緣雲擬住最髙峯洙曰靈光殿賦飛升揭孽緣雲上征掃除白髮黃精在洙曰世說黃精久服反老為少君看他時氷雪容洙曰姑射神人䏎膚若氷雪百憂集行上元二年作補注鶴曰詩云即今倐忽巳五十當是上元二年辛丑作公生于壬子至是年恰五十按公以乾元二年十二月至成都是時裴冀公為尹上元元年三月以京兆尹李若幽尹成都若幽後賜名國禎二年三月以崔光逺尹成都與髙適共討段子璋史云花驚定既誅子璋大掠東蜀天子怒以髙適代光逺然光逺是年建子月卒而建丑月又除嚴武尹成都則適代光逺在成都才一二月爾意正是攝尹也公至成都兩年間更四尹髙適與公為舊友然為尹時公獨無詩與之何也集中所與詩止是守彭蜀時與入為常侍時與之頗疑在成都合蓋寶應六年嚴武歸朝後適為尹時公全在東川及武再領成都方歸也憶年十五心尚孩洙曰魯昭公十九年猶有童心趙曰孩者可提之童也十五乃至學之時心未免于孩故云尚孩健如黃犢走復來庭前八月梨棗熟一日上樹能千回即今倐忽已五十蘇曰舊本作即今年才五六十魯直云此語似方六七十如五六十師曰此詩作于上元元年辛丑是年在蜀年四十九嵗詩云已五十舉大數然坐卧只多少行立强將笑語供主人師曰主人指郭英乂英乂鎮成都甫客從之悲見生涯百憂集補注鶴曰公生于壬子上元二年辛丑恰五十嵗然是年英乂未鎮成都是年李若幽崔光逺與指回髙適為西川節度時公素與適善豈强供笑語觀史云若幽後賜名國禎為政急性躁辨光逺無學任氣宜與公不合然國禎二月已去成都光逺十一月卒當是為光逺作王筠行路難云百憂俱集斷人腸入門依舊四壁空洙曰相如家居徒四壁立老妻覩我顔色同癡兒未知父子禮呌怒索飯啼門東蘇曰班超幼年每索飯稍遲即呌怒父曰此子異日當為萬户侯後果然投簡成華兩縣諸子天寶十年作補注鶴曰梁權道編在上元二年成都作是以成華為成都華陽兩縣此二縣唐志故云次赤然詩云長安苦寒誰獨愁又言南山之豆東門之瓜皆長安京兆事當是天寶間在長安作今以鄉里兒童項領成朝廷故舊禮數絶自然棄擲與時異之句意是十年召試後送𨽻有司參選時作擬是與咸陽華源二縣咸誤作成也赤縣官曹擁材傑洙曰十洲記神州赤縣軟裘快馬當氷雪長安苦寒誰獨悲杜陵野老骨欲折洙曰杜陵屬京兆南山豆苗早荒穢洙曰楊惲傳詩曰田彼南山荒穢不治種一頃豆落而為萁人生行樂耳須富貴何時青門瓜地新凍裂洙曰見往者東門瓜注補注鶴曰南山青門俱在縣境內南山即志所謂引南山水入京城又謂尹黎幹自南山開漕渠抵景風延喜門入苑以漕炭薪青門即城東門三輔黃圖曰長安城東第一門曰青門或曰霸城門鄉里兒童項領成洙曰節南山詩四牡項領朝廷故舊禮數絶自然棄擲與時異况乃疏頑臨事拙饑卧動即向一旬洙曰劉公幹詩彌廣十餘旬弊裘何啻聨百結洙曰見女子衣百結注君不見空牆日色晚此老無聲淚垂血徐卿二子歌上元二年作補注鶴曰公至成都時徐知道為西川兵馬使上元二年七月反徐卿或者為知道如荆南兵馬使太常趙卿是也從舊以為上元二年作君不見徐卿二子生絶奇感應吉夢相追隨洙曰詩吉夢維何維熊維羆孔子釋氏親抱送並是天上騏驎兒洙曰徐陵年數嵗家人攜見寶志上人志以手摩頂曰天上石麒麟也大兒九齡色清徹洙曰揚子吾家之童烏九齡而與我𤣥文趙曰禰衡有云大兒孔文舉小兒楊德祖故公屢用也秋水為神玉為骨蘇曰司馬太子見王嶽謂客曰此兒神如秋水而清徹骨如皓玉之美秀小兒五嵗氣食牛洙曰尸子虎豹之駒雖未成人已有食牛之氣滿堂賓客皆回頭洙曰謝希逸月賦滿堂賓客回皇如失吾知徐公百不憂積善衮衮生公侯洙曰易積善之家趙曰言其生不絶也衮衮乃不絶之義丈夫生兒有如此二雛者名位豈肯卑微休趙曰王充論衡位雖卑微行茍離俗必與之友補注希曰風俗通禮云十尺為丈成人長也里語八尺男子夫者膚也言其知能膚敏𢎞毅也病柏大厯元年作補注鶴曰此詩以郭英乂為崔旰所殺而作按史詠泰元年閏月辛亥崔旰反冦成都郭英乂奔靈池韓池殺之當是大厯元年作梁權道編在上元二年成都詩內有柏生崇岡洙曰琴賦惟倚吾之所生兮託峻嶽之崇岡童童狀車蓋洙曰車一云青十朋曰蜀志先主舍東南角籬上有桑樹髙丈餘遙望童童如車蓋往來者皆怪此樹非凡謂當出貴人先主與諸兒於樹下戲言吾當乘此羽葆車蓋又齊書太祖宅南有桑樹狀如車蓋上從兄敬宗謂曰此樹為汝生也偃蹇龍虎姿主當風雲會洙曰乘風雲之會神明依正直故老多再拜蘇曰王褒歸蜀過寶稽父老遮路再拜餉以糊漿豈知千年根中路顔色壞出非不得地蟠據亦髙大嵗寒忽無慿洙曰嵗寒然後知松柏之後凋日夜柯葉改洙曰禮器如松柏之有心貫四時不改柯易葉趙曰本有嵗寒之姿今柏病之故云日夜顔色改也丹鳯領九雛哀鳴翔其外洙曰建康實録鳯將九雛再見於豐城衆鳥從之蘇曰東海何承天除著作年巳邁諸佐郎並年少荀伯呼為嬭母承天云卿當言鳯凰將九子嬭母何言耶鴟梟志意滿養子穿穴內客從何鄉來趙曰倣古詩客從何方來竚立久吁怪靜求元精理浩蕩難倚賴洙曰穿一作窟元精一作無根趙曰字出後漢元精所生王佐之臣師曰此詩寓意傷郭英乂也英乂鎮成都為人端直蜀人重之不幸為崔旰所殺其諸孤哀泣若無所訴故有哀鳴翔其外之句鴟梟惡鳥喻崔旰崔旰既害英乂竊據成都故有養子穿穴內之句補注杜詩卷七
