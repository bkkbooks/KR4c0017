body:
  text: 補注杜詩巻八宋黄希原本黄鶴補注病橘上元二年作洙曰此詩傷物失所而至於困悴也補注鶴曰十道志言蜀云家冇鹽泉之井有橘神之園在成都因病橘而思物之失所故作在上元二年羣橘少生意洙曰羣一作伊補注希曰晉書殷仲文傳顧大司馬府中老槐嘆曰此樹婆娑無復生意雖多亦奚為惜哉結實小洙曰一作少酸澁如棠梨補注鶴曰爾雅釋棠曰陸機疏云赤與白棠同但子有赤白美惡白色為白棠少酸滑美赤棠子澁而酸無味俗語云澁如杜是也剖洙曰一作割之盡蠧蟲采掇爽其宜洙曰其一作所詩芣苢薄言采之薄言掇之紛然不適口洙曰莊子柤梨橘柚皆可於口豈止存其皮蕭蕭半死葉洙曰七發其根半生半死未忍別故枝𤣥冬霜雪積蘇曰劉公幹詩自夏涉𤣥冬况乃迴風吹嘗聞蓬萊殿蘇曰唐太宗蓬萊殿九月九日宴羣臣酒行遍賜湖南新橘宰相以下皆有詩謝羅列瀟湘姿洙曰瀟湘有橘田橘州此物嵗不稔玉食失光輝洙曰失一作少天子玉食周禮共食玉謂入貢王府也補注希曰古詩云此物何須用尚書云惟辟玉食張晏注漢書云玉食珍食也韋昭云諸侯備珍異之食漢陳咸傳泰侈玉食師古云玉食美食如玉也寇盜尚憑陵當君減膳時洙曰天子徹樂減膳汝病是天意師曰甫謂史思明未平天子嘗膽每遇凶年禍亂則必減食徹樂示自刻責今橘病不貢無乃天意使吾君減徹乎吾諗罪有司洙曰諗一云愁憶昔南海使奔騰獻荔枝百馬死山谷到今耆舊悲洙曰唐書楊貴妃嗜荔枝必欲生致之乃置騎傳送走數千里其味未變已至於京師也田曰漢和帝紀舊南海獻龍眼荔枝十里一置五里一堠奔騰險阻死者繼路修可曰公借其事以譏楊妃舊注引唐書其説非唐所貢乃涪州荔枝由子午道而往非南海也補注希曰南海獻荔枝事見東觀漢紀蜀賦云旁挺龍目側生荔枝荔枝之品閩中第一蜀川次之嶺南為下枯㯶上元二年作洙曰此詩傷民困於重斂也補注鶴曰詩云傷時苦軍乏當是上元二年時蜀有段子璋之變蜀門多㯶櫚洙曰㯶一作栟南都賦其木則栟櫚結根竦本垂條嬋媛鄭曰櫚力居切栟櫚木名有葉無枝高者十八九其皮割剝甚雖衆亦易朽徒布如雲葉青青嵗寒後交横集斧斤凋喪先蒲栁洙曰布一作有説文云楊栁即蒲也夢符曰北史韋世康與子弟書曰耄雖未及壯年已謝霜早楸梧風先蒲栁又顧悦之髪早白帝問其故對曰松柏之枝經霜猶茂蒲栁之質望秋先零補注希曰爾雅楊栁蒲釋曰楊一名蒲栁生澤中可為箭笴夫㯶櫚竦本囷敷葉嵗寒不凋而今乃先蒲栁易零之物而喪則其他賦斂可知矣傷時苦軍乏一物官盡取鄭曰此茍切嗟爾江漢人生成復何有有同枯㯶木使我沉歎久死者即已休生者何洙曰一作能自守趙曰猶㯶之未剥者終復遭剥也啾啾黄雀啅鄭曰竹角切又作啄側見寒蓬走念爾形影乾摧殘沒藜莠洙曰蜀人取㯶皮以充用惟軍興誅求尤急師曰蒲栁之為物望秋先零㯶其皮可用軍興之際割剥殆盡譬若江漢之民困於重斂然掊刻之吏刮削苦毒何異斧斤交集而民不得保其生耶黄雀啅盖傷其無所託也蓬逐風飛喻甫為客飄蕩甫既痛嗟割剥之虐復自悼飄蕩如飛蓬恐亦埋沒隨藜莠而已枯柟上元二年作洙曰此詩傷抱材者老死丘壑而不材者見用也鄭曰柟那含切葉似桑子似杏而酸俗作楠補注鶴曰此詩託柟以傷大材不用故詩云猶含棟梁具無復霄漢志良工古昔少識者出涕淚當是為房琯作琯乾元間貶邠州刺史上元元年遷漢州刺史是時公在成都此詩二年作楩柟枯峥嶸洙曰蜀都賦楩柟幽藹於谷底劉曰峥嶸高貌鄉黨皆莫記不知幾百嵗慘慘無生意上枝摩皇天洙曰魏文帝詩脩榦摩蒼天下根蟠厚地洙曰易坤厚載物巨圍雷霆折萬孔蟲蟻萃凍雨落流膠衝風奪佳氣趙曰郭璞曰今江東夏分暴雨呼為凍楚雨引楚辭使凍雨兮洒塵衝風隧風也辭大司命曰衝風至兮水揚波白鵠遂不來天雞為愁思洙曰謝靈運天雞弄和風七發獨鵠晨號乎其上唐書天雞雉也補注鶴曰爾雅曰鶾一名天雞赤羽之鳥也注逸周書曰文鶾若彩雞成王時蜀人獻之釋云按汲冢周書王㑹篇云蜀人以文鶾文鶾者若翬雉孔晁注云鳥入文彩若是也猶含棟梁具無復霄漢志良工古昔少識者出涕淚種榆水中央補注希曰爾雅榆白枌釋曰榆之皮色白者名枌郭云枌榆先生葉却著莢皮色白詩陳風東門之枌毛氏注枌白榆也成長何容易截承金露盤裊裊不自畏洙曰西都賦抗仙掌以承露擢雙立之金莖師曰喻君子負大材不遭明聖之君而至於困頓失所小人以柔脆猥瑣之姿反俾之居廟堂以承重任其不傾危不可得矣昔漢武帝為金人承露植以脩莖喻柔脆之木賤而易長今用以承露盤裊裊而危可不寒心乎憶昔二首廣徳二年作補注鶴曰詩云犬戎直來坐御床百官跣足隨天王謂廣徳二年吐蕃陷京師代宗幸陜當是作於廣徳二年故有願見北地傅介子之句而梁權道編在寶應元年梓州作恐非憶昔先皇巡朔方千乘萬騎入咸陽洙曰後漢靈帝末京都童謡曰侯非侯王非王千乘萬騎上北邙趙曰先皇言肅宗也肅宗即位靈武而朔方在靈州之隣則車駕所巡矣隂山驕子汗血馬洙曰史胡者天之驕子大宛有汗血馬隂山在遼東外西千餘里趙曰驕子指言回紇也至徳二載廣平王俶為兵馬元帥郭子儀副之以朔方安西回紇南蠻大食兵討安慶緒時回紇兵最有功也長驅東胡胡走藏趙曰東胡指安慶緒時廣平王之兵戰於溰水而慶緒敗走鄴城反覆不足怪趙曰慶緒奔河北明年蔡希徳等復會慶緒賊復振以相州為成安府鄴城即相州也闗中小兒壊紀綱張后不樂上為忙蘇曰梁到曰壊劉氏紀綱者數小兒也今用權勢者乃匹夫耳趙曰東坡先生詩話有曰闗中小兒亂紀綱謂李輔國也張后不樂上為忙謂肅宗張皇后也按張后能牢籠干預政事後與李輔國謀徙上皇又屢欲危太子皆張后之惡也至令今上猶撥亂勞心焦思補四方洙曰今上代宗也自為太子授天下兵馬元帥及即位内平張后越王之難外經營河朔我昔近侍叨奉引洙曰往在詩云我昔忝近侍時代宗享郊廟也此詩亦言代宗時事然二史皆不載故不知所任官也趙曰奉引供奉之事也田曰引唐六典補闕拾遺武后置二人以掌供奉諷諌補注鶴曰垂拱二年二月二十九日置左右拾遺二人従八品上掌供奉諷諌故大和三年左拾遺舒元褒等奏右補闕李虞與御史中丞温造街中相逢造怒虞不迴避事云按國朝故事供奉官行除宗相無迴避又云拾遺補闕官秩雖卑乃陛下侍臣也出兵洙曰一云兵出整肅不可當為留猛士守未央蘇曰謂郭子儀奪兵權入宿衛也致使岐雍防西羌補注希曰禄山之亂盡發邉兵入討賊所以吐蕃乗虛而來岐雍當西蜀河北之地犬戎直來坐御牀百官跣足隨天王洙曰吐蕃陷長安天子奔陜趙曰守未央東坡以為郭子儀按史程元振以子儀有天下功醜為詆譛肅宗不納其語然猶留守京師明年吐蕃入冦陷長安願見北地傅介子洙曰傅介子北地人也持節使誅斬棲蘭王安歸懸首之北闕封介子為義陽侯老儒不用尚書郎洙曰木蘭行云欲與木蘭賞不用尚書郎師曰甫嘗為工部尚書郎中犬戎之難甫欲得將如傅介子以討平之也憶昔開元全盛日修可曰鮑明逺蕪城賦曰當昔全盛之時小邑猶藏萬家室稻米流脂粟米白公私倉廪俱豐實洙曰開元間承平日久四郊無虞居人滿野桑麻如織雞犬之音相聞蘇曰段希曰倉廩豐盈民亦富畜公私通客宜舉大事九州道路無豺虎洙曰時開逺門外西行亘地萬里餘路不拾遺行者不囊糧丁壯之人不識兵器蘇曰王融詩澄清九州牧道路無豺虎逺行不勞吉日出洙曰言道路無阻隔所至皆通逹不必擇日而後出也齊紈魯縞車班班洙曰齊紈魯縞世稱竒偉強弩之末不能穿魯縞桓帝初京師童謡曰車班班入河間言上將崩乘輿班班入河間迎靈帝夢符曰前漢志齊織作冰紈綺繡純麗之物師古曰紈素也饒曰山東出厚繒商販不絶也男耕女桑不相失梅曰言民不失其業也宫中聖人奏雲門洙曰禮大司樂歌大呂舞雲門以祀天神天下朋友皆膠漆洙曰後漢陳重雷義為友語曰膠漆自謂堅不如雷與陳歐曰以信義相交接也百餘年間未災變叔孫禮樂蕭何律師曰百餘年間未災變謂祿山未反叔孫通為高祖制禮蕭何定律令當是時禮樂律令修明開元之治幾於三代豈聞一絹直萬錢蘇曰河平元年絹每端直八千至開元子美言萬錢其凶荒不言可知補注希曰絹直萬錢非指開元而言也盖自天寳以來物價暴貴公所以傷不如開元之盛也有田種榖今流血洛陽宫殿燒焚盡洙曰安史之亂民困於役不得耕桑長安宫殿九廟焚燒畧盡宗廟新除狐兔穴洙曰張孟陽七哀詩園寢化為墟周墉無遺堵狐兔窟其中蕪穢不復掃蘇曰郭佐近除宫苑荆棘狐狸窟穴尚未得平傷心不忍問耆舊蘇曰劉幾重過故之井邑遷移田園荒廢駐馬傷心之久不復更問耆舊復恐初従亂離説小臣魯鈍無所能洙曰劉公幹詩小臣信頑魯僶俛安能返朝廷記識䝉祿秩周宣中興望我皇灑血江漢長衰疾洙曰長一作身宣王承厲王之亂復修文武之業周道復興師曰𤣥宗承富貴之餘業物價極賤兵興以來一絹直萬錢前日種榖之地今鞠而為戰場東都宫殿盡為煨燼宗廟失守狐兔成羣令人傷心痛首不忍道及亂離時事甫自顧魯鈍無能叨䝉工部祿秩足認朝廷不即棄捐唯以周宣中興之功仰望其君洒淚江漢之上惓惓朝廷無復一預朝㑹但衰疾日長老死而後已冬狩行廣徳元年作魯曰時梓州刺史章彝兼侍御史留後東川補注鶴曰詩云天子不在咸陽宫盖指代宗幸陜當是廣徳元年作按公是年九月至閬州祭房相國冬回梓州有此及別章使君栁字韻諸詩梁權道編在寳應元年非君不見東川節度兵馬雄補注鶴曰舊史地里志劍南東川節度使治梓州管梓綿普陵樂遂合瀘渝等州嚴武傳云上皇詔以劍南兩川合為一道嚴武成都尹兼御史大夫則此詩作於廣徳元年不應更云東川節度按㑹要云上元二年二月分為兩川廣徳二年正月八日復合為一道則廣徳元年冬宜有東川節度也校獵亦似觀成功修可曰上林賦天子校獵李竒注云以五校兵出獵夜發猛士三千人清晨合圍步驟同洙曰禮天子不合圍禽獸巳斃十七八洙曰西京賦僵禽斃獸爛若磧礫白石未及移晷巳獮其十七八殺聲落日迴蒼穹幕前生致九青兕沈曰爾雅曰似牛郭璞曰角青色重千斤馲駝􅐑峞垂𤣥熊鄭曰馲駝有肉鞍行百里負千斤而知水行􅐑落猥切峞五毁切高貌東西南北百里間髣髴蹴踏寒山空洙曰羽獵賦羨漫泮散蕭條千里之外東西南北騁嗜奔欲拖蒼豨跋犀㹈蹶浮麋斮巨狿摶𤣥猿南都賦排揵陷扃蹴踏咸陽有鳥名鸜鵒力不能高飛逐走蓬肉味不足登鼎爼洙曰鸚鵡賦亦何勞於鼎俎鷦鷯賦毛弗施於噐用肉不登於鼎俎言非薦羞之物也劉曰左傳有鸜鵒來巢童謡曰鸜鵒鸜鵒往歌來哭胡為見羇虞羅中㴱曰陳子昻詩豈不在遐逺虞羅忽見尋春蒐冬狩侯得同趙曰周禮春蒐夏苗秋獮冬狩本天子之事也而諸侯同之故公詩曰侯得同使君五馬一馬驄洙曰章彞兼侍御史故云一馬騘况今攝行大將權號令頗有前賢風蘇曰孫㞯昨見耿將軍行師號令嚴明頗有前賢威風飄然時危一老翁十年厭見旌旗紅蘇曰甪里先生語薪者曰子十年厭見干戈旌旗只非今日耶喜君士卒甚整肅為我回轡擒西戎草中狐兔盡何益蘇曰韓擒虎出獵門人諫曰將軍驅旌斾獵原野逐獸馳躍以為樂雖盡得章棘窟穴狐兔不復有益於君子宜掃奠塵坌勒功彞鼎非細事韓大喜天子不在咸陽宫洙曰時天子避狄趙曰此篇盖廣徳二年十月已後作也八月吐蕃入寇十月陷邠州及奉天車駕幸陜故云不在咸陽宫也補注鶴曰老翁公自謂也西戎指吐蕃按史廣徳元年吐蕃陷隴右諸州又陷邠州十月丙子如陜此詩當作於是年十一月趙注為是且是年嵗次癸夘遡至天寳十四載乙未巳九年故云十年厭見旌旗紅天寳九載五月諸衛與諸節度所用緋色旗旛並改為赤所以諸將詩亦云曾閃朱旗北斗闌也朝廷雖無幽王禍洙曰史申侯與西夷犬戎攻幽王於驪山得不哀痛塵再䝉趙曰明皇以祿山之禍䝉塵於蜀矣今天子又以吐蕃之故䝉塵於外嗚呼得不哀痛塵再䝉洙曰時代宗在陜詔徴天下兵而程元振用事媒孽大臣皆疑忌不進天下無一人應召者故此詩末章大有感激也韋諷錄事宅觀曹將軍畫馬圗引廣徳二年作補注鶴曰詩云君不見金粟堆前松柏裏龍媒去盡鳥呼風當是葬明皇後作梁權道編在寳應元年梓州詩内恐非當在廣徳二年公再到成都時作韋諷為閬州錄事諷之居在成都詳見後篇注國初巳來畫鞍馬神妙獨數江都王鄭曰名畫記江都王緒霍王元軌之子補注鶴曰按史緒為江都王有名譽為金州刺史不言其能畫舊史却云緒最有才藝上元中封王謂有才藝則畫在其間矣將軍得名三十載人間又見真乘黄黄曰詩曰叔于田乘乘黄趙曰江都王宗室也將軍即曹將軍霸也明皇雜錄云陳義曹霸等善繪畫時稱神妙乗黄神馬也曾貎先帝照夜白鄭曰貎莫角切下屢貎同洙曰明皇馬名别傳云上乗照夜白龍池十日飛霹靂蒼舒曰右按唐㑹要明皇在藩邸宅居興慶里宅有龍池湧出日以浸廣至開元中為興慶宫趙曰以勑所畫神妙而照夜者乃真龍耳盖真龍在圖感動龍池中龍如此内府殷紅馬腦盤鄭曰殷鳥閑切婕妤傳詔才人索洙曰唐制以婕妤才人代世婦鄭曰婦官也補注希曰裴行儉平都支遮匍獲碼碯盤廣二尺文采粲然外戚傳武帝制婕妤娙娥傛華充依各有爵位師古曰婕言接幸於上妤美稱也婕音接妤音予字或作倢伃然則婕妤非唐制始有此名唐制婕妤九人美人九人才人九人寳林二十七人御女二十七人盌賜將軍拜舞歸鄭曰盌烏管切或作椀輕紈細綺相追飛趙曰盌別本作盤盖專賜瑪瑙盤故拜舞歸其従者輕紈細綺也貴戚權門得筆跡始覺屏障生光輝昔日太宗拳毛騧鄭曰古華切太宗所乗駿名拳毛騧乃平劉闥時所乗近時郭家師子花洙曰郭子儀收復京師代宗以花虬賜之一名師子聮今之新圗有二馬洙曰新一作畫復令識者乆嘆嗟此皆騎戰一敵萬縞素漠漠開風沙師曰雖畫縞素之上而有開拓沙蹟之態其餘七匹亦殊絶迥若寒空動煙雪霜蹄蹴踏長楸間洙曰曹子建名都篇走馬長楸間定功曰莊子馬蹄可以踐霜雪維摩經龍象蹴踏非驢所堪馬官厮養森成列可憐九馬争神駿洙曰漢武帝有九逸支遁曰憐其神駿耳顧視清高氣深穏借問苦心愛者誰鄭曰借資昔切後有韋諷前支遁洙曰支遁字道林憶昔巡幸新豐宫洙曰新豐宫驪山也補注希曰文紀上幸甘泉如淳曰蔡邕云天子車駕所至臣民以為僥倖故曰幸巡者本書巡守時巡地里志新豐秦曰驪邑應邵曰太上思東歸於是高祖改築城寺街里以象豐故曰新豐今云憶昔巡幸新豐宫盖驪山有温泉宫後改曰華清宫在新豐縣後改為昭應縣翠華拂天來向東洙曰南都賦望翠華之葳㽔東都賦旌旗拂天騰驤磊落三萬匹皆與此圗筋骨同洙曰明皇幸驪山王毛仲以廏馬數萬従每色為一隊相間若錦繡自従獻寶朝河宗趙曰穆天子傳天子西征至陽紆之山河北無夷都是為河宗觀春山之寳所謂朝河宗者河宗朝而獻寶也無復射蛟江水中洙曰元封五年漢武帝自潯陽浮江親射蛟江中獲之君不見金粟堆前松柏裏龍媒去盡鳥呼風洙曰漢武歌曰天馬騋龍之媒金粟堆在𤣥宗泰陵南趙曰唐舊史云𤣥宗至睿宗橋陵見金粟岡有龍盤鳳翥之勢謂侍臣曰吾千秋萬嵗後宜葬此暨升遐羣臣遵先旨葬焉師曰自禄山反馬政荒廢天子猶不偏車騎良馬戰沒殆盡甫傷之故云送韋諷上閬州錄事參軍廣徳元年作補注鶴曰詩云十載供軍食當是廣徳元年然是年春公在閬春晩自閬再歸成都云詩當在成都作不應在閬更送諷上閬州錄參也意諷居於成都故前篇云韋諷宅觀曹將軍畫國歩猶艱難洙曰詩天步艱難兵革未衰息萬方哀嗷嗷修可曰鴻雁詩哀鳴嗷嗷哀一作尚十載供軍食饒曰自天寶十四載至廣徳間凡十載載一作年庶官務割剥不暇憂反側誅求何多門晁曰謂斂取非一端也賢者貴為徳洙曰一云賢俊愧為力韋生富春秋洙曰高五王傳皇帝春秋富師古曰言年㓜也比之於財方未匱竭故謂之富洞徹有清識操持紀綱地喜見朱絲直洙曰鮑照白頭吟直如朱絲繩補注希曰漢韓信傳曰公小人為徳不卒史記李斯傳趙高説二世見陛下富春秋喬琳厯四州刺史嘗謂録事參軍任紹業曰子綱紀一郡能劾刺史乎故六帖亦謂之綱紀掾當今豪奪吏趙曰管子曰凡輕重散斂以時平準故大賈富家不得豪奪吾人也自此無顔色必若救瘡痍先應去蝥賊洙曰詩去其螟螣及其蝥賊蘇曰吳起曰善治田者先去蝥賊然後獲實善治國者先屏奸佞然後進賢覺範曰爾雅釋虫食心曰蝥何曰喻害民之吏揮淚臨大江高天意悽惻行行樹佳政馬曰樹立也慰我深相憶洙曰此詩欲韋抑暴斂也陪章留後惠義寺餞嘉州崔都督赴州同上補注鶴曰按唐節度有留後長慶四年留後始改為知院官又唐志嘉州在唐為劍南中郡不與巂黎稚戎松列都督而九域志云嘉州唐中都督與此詩題合當是志誤公寶應元年雖至梓州而在秋冬間此詩云永願坐長夜畢景遺炎蒸當是廣徳元年作盖公自寶應元年秋歸成都迎家于梓至次年秋方往閬祭房相國魯訔年譜亦以為在今年獨梁權道編在寶應元年中軍待上客洙曰晉以郤穀將中軍孔融謂李膺為登龍之上客趙曰中軍指章留後上客指崔都督也令肅事有恒前驅入寶地洙曰縣令負弩前驅祖帳飄金繩洙曰法華經國名離垢琉璃為地有八交道黄金為繩趙曰前漢疏廣故人邑子為名祖道供帳盖摘用之耳言佛寺佛居以七寶為地南陌洙曰一云伯既留歡補注希曰食貨志注師古曰阡陌田間之道南北曰阡東西曰陌陌音莫白反兹山亦深登清聞樹杪磬逺謁雲端僧洙曰鮑明逺雲端楚山見迴策匪新岸所攀仍舊藤耳激洞門飈目存寒谷冰出塵閟軌躅畢景遺炎蒸洙曰鮑明逺詩侵星赴早路畢景逐前儔永願坐長夏將衰棲大乘洙曰法華經決定説大乗文佛自住大乘羇旅傷宴㑹艱難懐友朋蘇曰曹修客南都見劉須曰艱難之際頗懐朋友何時相與抵掌一笑滌我塵冗勞生共幾何蘇曰魏武帝短歌行對酒當歌人生㡬何離恨兼相仍蘇曰鮑照詩何慙宿昔意猜恨坐相仍師曰章彞權東川節度故云中軍中軍大將也上客指崔都督言章彞持軍令嚴今待上客禮樂無所不用其周至寶地寺也祖餞也祖餞之地陳設帳幕故云祖帳兹山即寺也回策回鞭也新岸即新修路以備章使君車馬也甫既送崔都督回復従舊路攀援藤蘿盖樂山水之興也居山間蹤跡幽閟盡夏景欵留此寺遺却炎蒸之氣故下文有永願坐長夏之句釋氏有大乘有小乘如來謂之大乘教羅漢果謂之小乘教甫以衰老之年欲棲心於大乘惜宴㑹謂惜别也閬州東樓筵奉送十一舅往青城縣得昏字廣徳元年作補注鶴曰青城縣屬蜀州青城山記云青城山有八大洞當是廣徳元年初至閬時作故詩云是時秋冬交節往顔色昏蔡興宗亦以為詩在此年作曾城有高樓制古丹艧存洙曰梓材既勤樸斷惟其塗丹艧注塗以漆丹以朱而後成趙曰淮南子崑崙之山有曾城九重迢迢百餘尺洙曰西京賦狀迢迢以亭亭古詩雙闕百餘尺豁達開四門雖有洙曰一作㑹車馬客而無人世喧洙曰陶淵明結廬在人境而無車馬喧遊目俯大江列筵慰別魂洙曰謝靈運得以慰別魂是時秋冬交節往顔色昏天寒鳥獸伏洙曰登樓賦風蕭瑟而並興天慘慘而無色獸狂顧以求羣鳥相鳴而舉翼霜露在草根令我送舅氏洙曰沈休文詩草根積霜露詩渭陽我送舅氏萬感集清罇洙曰謝靈運詩萬感盈朝昏豈伊山川間迴首盜賊繁高賢意不暇王命久崩奔洙曰謝靈運詩折岸屢崩奔臨風欲慟哭洙曰賈誼傳聲出巳復呑師曰此樓多是送客於此雖有車馬往來而去塵市稍逺故云而無塵世喧顔色昏謂離別之際慘淡無顔色也天寒鳥獸休鳥獸尚得休息而人行役故傷之也霜露在草根此乃萬物歸根之時而舅氏未能室處尚往青城是以使我對酒不能無感懐也將適呉楚留別章使君留後兼幕府諸公得栁字韻廣徳元年作補注鶴曰詩云重見衣冠走黄屋今安否當是廣徳元年十一月代宗未還京時作梁權道編在寶應元年恐非我來入蜀門洙曰我一作甫嵗月亦已久洙曰古詩嵗月忽巳晩豈惟長兒童自覺成老醜洙曰阮籍詩朝為美少年夕暮成老醜常恐性坦率失身為杯酒洙曰古詩失意杯酒間近辭痛飲徒折節萬夫洙曰一作人後洙曰前漢郭解年長更折節為儉以徳報怨蘇曰邢充胷襟恢廓豈折其高節挫其鋭志従萬夫之後為參御之徒歟趙曰此言喪失其身特以愛酒而已舊注引失意非是昔如縦壑魚洙曰王子淵頌如巨魚之縦大壑今如喪家狗洙曰孔子纍纍然若喪家之狗既無遊方戀趙曰禮記所遊必有方言父母在不逺遊公巳無父母故無此戀矣行止復何有相逢半新故取別隨薄厚不意青草湖洙曰青草湖在湖南扁舟落吾手蘇曰張翰曰不意吴江扁舟落吾手中眷眷章梓州開筵俯高栁樓前出騎馬帳下羅賔友健兒簸紅旗此樂幾洙曰一作或難朽日車隠崑崙洙曰莊子徐無鬼若乘日之車鳥雀噪戸牖蘇曰徐騏養索曠蕩居少室山鳥雀朝夕噪宿戸牖坐隅之間波濤未足畏三峽徒雷吼洙曰七發將以八月之望觀濤乎武陵之曲江又云雷聞百里江水逆流海水上潮波湧而滀起混混庉庉聲如雷吼所憂盜賊多重見衣冠走中原消息㫁黄屋今安否洙曰黄屋斥天子也趙曰吐蕃陷京師代宗出狩而地逺所未知也終作適荆蠻洙曰王仲宣七哀詩西京亂無象豺虎方遘患捐棄中國去逺身適荆蠻荆蠻非我鄉何為久滯安排用莊叟洙曰謝靈運居常以待終處順故安排隨雲拜東皇挂席上南斗洙曰靈運詩揚帆采石華挂席拾海月趙曰屈原九歌有東皇太一東皇所以言楚春秋説題云南斗吴地也東皇之廟隨雲而拜之南斗之地挂席而上之非適呉楚而然乎有使即寄書無使長回首蘇曰韓斐送李定出上東門握斐手曰因風示信慰我跂仰定曰有使即寄書以通安好㯶拂子廣徳元年作補注鶴曰梁權道編在寶應元年梓州詩内按公是年至梓巳是九月今詩云家貧卧炎蒸賴爾甘服膺雖曰因物以託意亦可以考其為夏作當是廣徳元年夏末間作㯶拂且薄陋豈知身效能不堪代白羽蘇曰諸葛亮嘗持白羽扇以指麾又顧榮伐陳敏以白羽扇麾之有足除蒼蠅洙曰詩營營青蠅補注希曰比丘患草蟲佛聴作拂子故詩亦云有足除蒼蠅熒熒金錯刀洙曰四愁詩美人贈我金錯刀尹曰李善文選注金錯刀云續漢書曰佩刀諸侯王黄金錯環謝承注漢書曰詔賜應奉金錯把刀前漢食貨志曰錢新室更造契刀錯刀契刀其環如大錢身形如刀長二寸文曰契刀刀直五百錯刀以黄金錯其文一刀直五千熒熒金錯刀乃佩刀之屬也如對雪詩云金錯囊徒罄乃是錢刀而以金錯之也虎牙行金錯旌竿直盖以黄金而錯縷旌竿也大抵古人之於器物以黄金錯之皆謂之金錯不可以名同不究其實焉擢擢朱絲繩洙曰鮑照詩直如朱絲繩非獨顔色好亦用顧盼稱趙曰金錯朱繩二物者非特以其金朱之好顔色耳皆係乎人之顧盼也吾老抱疾病家貧卧炎蒸咂膚倦撲滅洙曰蠅蚋咂膚賴爾甘服膺洙曰顔子得一善則拳拳服膺物微世競棄義在誰肯徴三嵗清秋至未敢闕緘縢師曰按唐史𤣥宗以李林甫代張九齡相九齡既不見用因作白羽扇賦以自見其志㯶拂其質薄雖不堪代白羽猶足以驅除蒼蠅時林甫以瑣陋之材而代九齡其材能全無用於朝廷曾㯶拂之不若也㯶拂為物雖微有理義在盖可用之除蠅奈何世人不肯徵信其義而競棄之甫傷清秋廢置不用不敢怠於緘藏冀其他時之復用也丹青引廣徳二年作魯曰贈曹將軍霸補注鶴曰丹青以言曹將軍之能畫也謝恵連詩丹青暫彫換李善注引張綱集曰圖形丹青西漢丹青祈畫何以過子卿此詩云漂泊干戈際當是霸遭闕内之亂而入蜀梁權道云寶應元年梓州作然公有韋諷宅觀曹將軍畫馬詩在廣徳二年成都作若寳應元年先有此詩與霸則後詩必及之意其亦廣徳二年作將軍魏武之子孫趙曰魏武曹公操也於今為庶為清門洙曰左昭三十二年三后之姓於今為庶主所知也英雄割據雖已矣文彩風流今尚存蘇曰晉羊祐至蜀愛其山川風物明媚謂御驂者曰揚雄王褒君平相如雖去數百年覽其遺跡想風流文彩宛然如在宜其典刑不泯範法猶存遂追賦四先生詩學書初學衛夫人洙曰晉李夫人名衛善書但恨無過王右軍洙曰王羲之善𨽻書為古今之冠初羲之為老嫗書紙扇謂曰但言是王右軍書以求百錢丹青不知老將至富貴於我如浮雲洙曰語不知老之將至又曰不義而富且貴於我如浮雲開元之中常引見承恩數上南薰殿鄭曰數色角切又如字凌烟功臣少顔色洙曰唐貞觀中畫李靖等二十四人于凌煙間將軍下筆開生面趙曰凌煙畫像顔色已暗而曹將軍重為之畫故云開生面用字盖因左氏傳狄人歸先軫之元而面如生也良相頭上進賢冠洙曰後漢志進賢冠古緇布冠也文儒者之服也猛將腰間大羽箭洙曰太宗嘗自製長弓大羽箭皆倍常制褒公鄂公毛髪動洙曰鄂公尉遲敬徳褒公段志𤣥英姿颯爽來酣戰趙曰淮南子曰魯陽公與韓戰戰酣日暮援戈而揮之先帝天馬玉花騘補注鶴曰明皇別錄上乘照夜白玉花騘畫公如山貎不同是日牽來丹墀下洙曰劉孝標運命論時在赤墀之下迥立閶闔生長風趙曰天門也李善文選注有紫微宫門名曰閶闔言馬之上而生風以其神駿詔謂將軍拂絹素意匠慘淡經營中補注希曰古樂府不知理何事淺立經營中畫品謂畫有六法五曰經營置位斯須九重真龍出一洗萬古凡馬空玉花却在御榻上趙曰玉花先帝之馬也畫手精妙盡得其真榻上庭前屹相向至尊含笑催賜金圉人太僕皆惆悵弟子韓幹早入室洙曰言得其真跡也故云入室亦能畫馬窮殊相幹惟畫肉不畫骨蘇曰韓幹善畫馬大梁人右丞王維見其畫遂推奬之官至太府寺丞尤工鞍馬初師曹霸於後則獨善子美子美徒以幹畫馬肥大遂有畫肉之誚補注希曰張彦逺畫記亦云如此忍使驊騮氣凋喪將軍畫善盖有神必逢佳士亦寫真夢符曰顧愷之善丹青每畫人成或數年不㸃目睛人問其故荅曰四體妍媸本無闕少於妙處傳神寫照正在阿堵中趙曰梁簡文帝詠美人看畫詩云可令俱是畫誰能辨寫真即今漂泊干戈際屢貎尋常行路人途窮反遭俗眼白洙曰言識者盖寡耳世上未有如公貧但看古來盛名下洙曰唐房琯贊曰盛名之下為難名矣終日坎壈纒其身桃竹杖引廣徳元年作洙曰贈章留後蘇曰栁子厚詩云盛時一失貴反賤桃笙葵扇安可常不知桃笙為何物偶閲方言簟宋魏之間謂笙方悟桃笙以桃竹為簟也梁簡文湘南王獻書云五離九折出桃枝之翠笋乃謂桃枝竹簟也桃竹出巴渝間補注鶴曰梁權道編在寳應元年梓州詩内今考詩云老夫復欲東南征又云滅跡於君山湖上之青峯則是其時欲下荆岳廣徳元年公在梓州亦有詩云應須理舟楫長嘯下荆門後雖不果然是年秋入閬州明年以嚴武再鎮蜀復歸成都此詩當在廣徳元年作盖寳應元年處梓不滿月雖歸成都迎家再往梓又多在外邑詩又云忽去雙杖吾將曷従盖喻嚴武章彝也是時武已召還而公又欲舍彝下東南故云失雙杖若梁編在寶應元年則是年章彝未刺梓州江心蟠石生桃竹趙曰爾雅謂桃皮山海經謂桃枝竹也補注鶴曰戴凱之竹譜桃枝堪為簟縻也竹記云桃枝竹皮滑可為蓆又云以四寸為節按南越志出海南縣沿海而生掩映懸翠又云生蜀地其實如木甚堅唐志合州貢桃竹箸合與梓並屬東川故宜梓橦使君以贈公按爾雅桃枝四寸有節注今桃枝節間相去多四寸尚書顧命敷重蔑席孔安國云篾桃枝竹周禮眷官司几筵云加次席黼純注次席桃枝席有次列成文是也文選左太冲賦桃笙象簟李善引劉淵林注云桃笙桃枝簟也蘇子瞻贈蒲澗長老詩已従子美得桃竹自注云此山有桃竹可作杖而士人不知予始錄子美詩遺之蒲澗寺在廣州殆不知渝合澗有此竹蒼波噴浸尺度足斬根削皮如紫玉江妃水仙惜不得洙曰江賦馮夷倚浪以傲睨江妃含嚬而瞟眇注馮夷水仙也梓潼使君開一束補注鶴曰梓州為梓潼郡以東倚梓林西枕潼水故名時章彞為梓刺史故王内翰云此詩贈章留後滿堂賔客皆歎息憐我老病贈兩莖出入爪甲鏗有聲老夫復欲東南征乘濤鼓枻餘制切洙曰一作棹白帝城洙曰白帝城在魚腹有公孫述像也路幽必為鬼神奪杖洙曰一作拔劍或與蛟龍争重為告曰杖兮杖兮爾之生也甚正直慎勿見水踴躍學變化為龍趙曰神仙傳壺公遣費長房歸以一竹杖與之騎長房騎杖忽然如眠便到家以竹杖投葛陂顧之乃青龍也石曰杖為物既禀正直之姿當以正直輔吾無為化龍而去使我不得爾之扶持滅跡於君山湖上之青峯洙曰君山在洞庭胡心也趙曰謝靈運滅跡入靈峯噫風塵澒洞兮豺虎咬人鄭曰澒胡孔切咬古爻切洙曰時盜賊害人如豺虎忽失雙杖兮吾將曷従師曰甫意若曰天下未平尚賴此杖扶持衰老流寓逺鄉茍失雙杖吾將曷従寄題江外草堂廣徳元年作魯曰梓州作寄成都故居泰伯曰甫従同谷入蜀卜居成都亂遂走梓州今作梓州懐思草堂遂作是詩寄題焉補注鶴曰寶應元年公避徐知道之亂至梓州今詩云顧惟魯鈍姿豈識悔吝先獨攜老妻去慘淡凌風煙盖謂不能前知徐知道之反也詩云經營上元始㫁手寶應年則此詩當是廣徳元年我生性放誕洙曰唐賀知章晚節尤誕放蘇曰嵇肅生平放誕性僻泉石焉能王公大人門下心緒卑屈雅欲逃自然覺範曰自然道也釋氏謂之逃禪儒者謂之逃自然嗜酒愛風洙曰一作脩竹蘇曰呉謨嗜酒每醉愛觀風竹怡然自樂人或曰陶𢎞景愛聴松風王子猷愛竹先生愛風竹其清氣可相敵矣呉笑而不荅卜居此洙曰一作必林泉遭亂到蜀江俯曰遭亂謂祿山反卧疴遣所便趙曰謝靈運詩卧疴對空牀誅茅初一畆洙曰屈原卜居誅鋤草茅以力耕儒行儒有一畝之宫廣地方連延經營上元始㫁手寶應年趙曰公以乾元元年十二月未至成都明年即上元元年乃公建草堂之始又二年即寶應元年乃公成草堂之日也唐高祖勅云使至知𤣥堂已成不知諸作早晚得㫁手凡營造了當言㫁手者矣敢謀土木麗彭曰堂名以草者取其草創豈求土木之華麗乎自覺面勢堅洙曰東京賦審曲面勢臺亭隨高下敞豁當清川惟有㑹心侣蒼舒曰古樂府短歌不羨一囊錢惟重心襟㑹數能同釣船干戈未偃息安得酣歌眠蛟龍無定窟黄鵠摩蒼天洙曰魏文帝詩脩條摩蒼天古來賢達士洙曰一云達士志補注希曰晉羊祐登峴山由來賢達勝士登此眺望寧受外物牽顧惟魯鈍姿豈識悔吝先偶㩦老妻去慘澹陵風煙事迹無固必洙曰語子絶四毋固毋必幽貞愧雙全尚念四小松趙曰易幽人之貞吉蔓草易拘纏霜骨不甚長永為隣里憐師曰以四小松為念憫其有剛姿勁節而為蔓草所戕不獲遂其生長之性故云云英乂見殺四子遇害甫託意傷之述古三首寶應元年作彦輔曰此詩傷賢者不得志也補注鶴曰詩云經綸中興業何代無良才當是寶應元年代宗即位後作公時在梓州詩意主於任賢耳赤驥頓長纓洙曰列子周穆王右驂赤驥左白藥非無萬里姿趙曰王褒聖主得賢頌周流八極萬里一息悲鳴淚至地為問馭者誰鳯凰従天來何意復高飛竹花不結實念子忍朝飢洙曰劉公幹詩鳯凰集南岳徘徊孤竹根於心不肯厭奮翅凌紫氛趙曰鵷雛非練實不食郭象注練實竹實也古時君臣合可以物理推賢人識定分進退固其宜洙曰大臣以道事君可則進否則奉身以退退一作用師曰昔良驥困於鹽車遇伯樂悲鳴若有所訴鳯非竹實不食驥有萬里之姿御非其人則必困頓於長纓鳯有應世之瑞竹花不實則必困於飢餒譬君子不逢賢聖之君不食其祿古來君臣遇合可以物理知之是以賢人進以禮退以義知分命之所在不茍於貪冐寵榮豈非驥鳯甘於困頓飢餒之比乎市人日中集洙曰易日中為市於利競錐刀洙曰江文通云競錐刀之利置膏烈火上蘇曰左濟如致脂膏於烈火之上轉増焰熾今王㑹諸侯亦然趙曰市人之爭利如膏火之自煎爾莊子曰膏以明自煎哀哀自煎熬洙曰膏火自煎農人望嵗稔相率除蓬蒿蘇曰王陵母冢每春蕃蓬蒿生居人相率手除薙之所務榖為本邪贏無乃勞趙曰張衡西京賦云商賈禆販何必昏於作勞邪贏優而足恃注邪偽也欺偽之事自餘贏豐饒足恃也舜舉十六相身尊道何高洙曰文十八年傳昔高陽氏有才子八人天下之人謂之八愷高辛氏有才子八人天下之人謂之八元此十六族也堯不能舉而舜舉之天下如一同心戴舜以為天子以其舉十六相故也秦時任商鞍法令如牛毛洙曰商君名鞅相秦十六年天資刻薄少恩變秦法令宗室貴戚多怨望者後滅商君之家也蘇曰秦法如牛毛沛公盡革去師曰古者敦本而抑末市人競錐刀之利如置膏火上自取煎熬𤣥宗之時利孔百出聚斂之臣削民膏血是知以利為政未有不為亂也禹稷躬稼而冇天下則務農重榖為國之本舜舉十六相惟急親賢賢人用則民安其業民安其業身尊而道高終享無為之治彼始皇任商鞅壊井田之制頭㑹箕斂民不堪命雖法令之宻如牛毛然果安能禁人之不為亂乎甫意欲敦本輕徭薄賦此天下可得而治也漢光得天下祚永固有開洙曰記有開必先豈惟高祖聖功自蕭曹來經綸中興業何代無良才補注希曰肅宗中興以任李輔國而為其昏蔽故於父子之倫且有所虧則代宗之立正宜任賢相與經綸中興之業所以舉漢光武以為喻吾慕冦鄧勲濟時信良哉耿賈亦宗臣羽翼共徘徊休運終四百洙曰范蔚宗獻帝賛曰終我四百永作虞賔圖畫在雲臺洙曰雲臺圖功臣像蘇曰崔融曰君不見耿賈輩扶顛起仆漢道中興圗形雲臺照耀萬世師曰肅宗中興是亦光武之倫奈何諸將邀功養冦以自封其與冦鄧耿賈輩逺矣甫意傷肅宗無駕御英豪之策而作是詩也補注杜詩巻八
