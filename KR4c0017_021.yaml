body:
  text: 補注杜詩卷二十一宋黃希原本黃鶴補注蜀相上元元年作補注鶴曰蜀相謂諸葛武侯當是上元元年作公雖以乾元二年歲暮至成都而此詩言映階碧草隔葉黃鸝當是次年春日也丞相祠堂何處尋錦官城外柏森森洙曰蜀諸葛亮傳先主建安二十六年即帝位册亮為丞相録尚書事祠堂孔明廟也成都記府城亦呼為錦官城以江山明麗錯雜如錦也廟有古柏武侯手植之補注鶴曰華陽國志成都夷里橋南岸道西有城故錦官也諸葛公在先主廟故宅城西前有雙大柏映階碧草自春色洙曰江文通别賦春草碧色隔葉黃鸝空一作多好音洙曰王僧達詩楊園流好音三顧頻煩天下計洙曰本傳徐庶謂先主曰諸葛孔明卧龍也將軍宜枉駕顧之先主凡三往乃見又亮上疏曰先主不以臣卑鄙猥自枉屈三顧於草廬之中言先主之自見亮亮為先主而仕皆為天下大計補注鶴曰王莽傳鄭重頻煩也三國志費禕以奉使稱能頻煩至矣兩朝開濟老臣心洙曰先主於永安病篤召見屬以後事謂亮曰君才十倍曹丕必能安國定大事若嗣子可輔輔之如其不才君可自取亮泣曰臣敢竭股肱之力效貞信之節繼之以死又亮表云興漢室還於舊都此臣所以報先帝而忠陛下之職分也兩朝謂先主及禪也出師未捷洙曰一云未戰又未用身先死長使英雄淚滿襟洙曰閔其志不遂也本傳云十二年春亮率大衆由斜谷出以流馬運據武功五丈原與司馬宣王對於渭南相持百餘日其年八月亮疾卒於軍軍退司馬宣王案行其營壘處所曰天下之竒才師曰亮欲合一天下未及出師一戰而死使亮未死則吳魏豈能保其土地哉卜居上元元年作洙曰屈原作卜居一首原往太卜鄭詹尹家卜已宜何所居因述其詞成都記草堂寺府西七里浣花亭三里寺極宏麗有名僧履空居其中杜員外居處逼近常恣游焉鮑曰上元元年歲次庚子公年四十九在成都劒南節度使裴冕為卜成都西郭浣花溪作草堂居焉所謂主人為卜林塘幽是也前注以主人為嚴武非趙曰緣楚辭屈原有卜居一篇故得倚以名詩公又有卜居一篇則在夔州也補注鶴曰公有寄題草堂詩云經營上元始斷於寶應年則此云卜居當是上元元年作浣花流水一作之水水西頭主人為卜林塘幽洙曰浣花溪名主人嚴武也鄭曰在成都趙曰主人謂地主或所館置之人不可指為嚴武也補注鶴曰寰宇記浣花溪在成都西郭外地屬犀浦縣公至成都時裴冕為節度已為卜居浣花溪上寺今云主人指裴冕也浣花與百花潭相接已知出郭少塵事洙曰梁張纘啓常願卜居幽僻屏避喧塵更有澄江銷客愁洙曰謝𤣥暉詩澄江靜如練無數蜻蜓齊上下一雙鸂鶒對沈浮東行萬里堪乘興須向山隂上一作入小舟洙曰蜀有萬里橋在浣花之東昔孔明送吳使至此曰萬里之行從此始矣因此得名乘興欲效王子猷月夜泛舟謁戴安道也山隂王子猷所居之地一室上元元年作補注鶴曰一室即草堂也當是上元元年一室他鄉逺洙曰逺一作老後漢陳蕃曰大丈夫處世當掃除天下安事一室乎空林暮景懸洙曰江文通詩秋日懸清光趙曰張景陽雜詩鳴鶴聒空林正愁聞塞笛獨立見江船巴蜀來多病洙曰成都記其西即隴之南首故曰隴蜀以與巴接復曰巴蜀荆蠻去幾年洙曰荆蠻楚也詩謂之蠻荆太史公得漢古文春秋乃知中國之虞與荆蠻勾吳兄弟也應同王粲宅留井峴山前洙曰峴山荆楚也今屬襄陽有井焉人呼為仲宣井云王粲故宅也補注鶴曰魏志王粲字仲宣山陽人以西京擾亂乃之荆州依劉表公以此喻入蜀依裴公梅雨上元元年作彥輔曰梅熟而雨曰梅雨江東呼為黃梅雨趙曰周處風土記云夏至前雨名黃梅雨沾衣服皆敗黦補注鶴曰裨雅云江湘二浙四五月間梅欲黃落則水潤土溽柱礎皆汗蒸鬱成雨謂之梅雨沾衣敗汚故自江以南三月雨謂之迎梅四月雨謂之送梅然則蜀亦不異江南也此詩在成都作第未詳何年今以詩云茅茨踈易濕意是上元元年草堂初成時南京犀浦道洙曰𤣥宗幸蜀改成都置尹視二京號為南京鮑曰至德二載十二月戊午大赦以蜀郡為南京舊注以𤣥宗所改非師曰原叔以為𤣥宗所改誤矣補注希曰按舊史肅宗至德二載十二月戊午改蜀郡為南京為成都府郡有犀浦縣熙寧間方省為鎮入郫又蜀江有伏犀灘水有黃牛從𤏡溪出上此崖化為石又蜀郡有石犀李氷以壓水怪犀浦之名往往本此四月熟黃梅湛湛長江去洙曰阮籍詩湛湛長江水上有楓樹林冥冥細雨來洙曰隋煬帝江都夏詩梅黃雨細麥秋橫楓樹蕭蕭江水平補注希曰楚辭靁填填兮雨冥冥又湛江水兮上有楓茅茨踈易濕洙曰茅茨以茅覆屋也庾信小園賦穿漏兮茅茨雲霧密難開竟日蛟龍喜盤渦與岸回洙曰瓠子歌曰蛟龍騁兮方逺逰郭璞江賦盤渦谷轉凌濤山頽師曰水之蟠聚而洄洑者故與岸回旋蛟龍喜以水漲故也為農上元元年作補注鶴曰公嘗有南京久客耕南畝之句今又為此詩當是上元元年營草堂後作錦里煙塵外江村八九家洙曰華陽國志錦江織錦濯其中則鮮明濯他江必不好故命曰錦里公居在近郊無塵埃故云煙塵外補注希曰寰宇記載華陽志云夷里橋南岸道西有城故錦官也命曰錦里公居在錦里之外故云圓荷浮小葉細麥落一作墜輕花卜宅從兹老為農去國賖洙曰顔延年詩去國還故里幽門樹蓬藜逺慚勾漏令鄭曰交趾也不得問丹砂洙曰晉葛洪字稚川從祖元吳時學道得仙號曰葛仙翁其鍊丹祕術悉得真法以年老欲鍊丹砂以期遐夀聞交趾出丹求為勾漏令帝以洪資髙不許洪曰非欲為榮以有丹砂帝從之補注希曰寰宇記勾漏山在容州云是葛元鍊丹之處九域志容州有古勾漏縣城又云勾漏山即洞天之一而唐志交州交趾郡無邑名勾漏何也有客上元元年作補注鶴曰詩云幽棲地僻經過少又云莫嫌野外無供給當是上元元年在草堂作莫嫌一作不嫌幽棲地僻經過少洙曰謝叔原遊西池詩逍遙越城肆願言屢經過謝靈運詩恣此永幽棲豈伊年歲别老病人扶再拜難豈有文章驚海內謾勞車馬駐江干洙曰詩置之河之干兮注干涯也梁范雲詩江干逺樹雲竟日淹留佳客坐百年粗糲腐儒餐洙曰粗糲粗衣糲食也腐儒見題省中壁詩注莫嫌野外無供給乘興還來看藥欄狂夫上元元年作補注鶴曰詩言風含翠篠雨裛紅蕖當是上元元年夏作萬里橋西一一作新草堂百花潭水即滄浪洙曰公築居浣花里在萬里橋之西萬里橋事見卜居詩注其注云蜀有萬里橋在浣花之東昔孔明送吳使至此曰萬里之行從此始矣因得名成都記杜員外别業在百花潭臺猶在補注鶴曰萬里橋在成都門外非在浣花之近寰宇記云杜甫宅接浣花溪地名百花潭圖經云本冀國任夫人居夫人幼時有僧過其家遍身瘡穢夫人事之甚謹一日令浣衣皆膿血夫人不生嫌惡遂就溪濯之蓮花隨手出於潭中後貴因名楚地雖有滄浪水之名而二字大率言水之貌選詩云垂影釣滄浪今詩意以潭水似滄浪之水而言風含翠篠娟娟靜雨裛紅蕖冉冉香洙曰謝靈運詩緑篠媚清漣趙曰選詩云柔條紛冉冉厚祿故人書斷絶洙曰言交態薄也杜元凱曰僻居林下謝絶人事厚祿故交音書斷絶晚進小子不足與言他其如豫何補注希曰後漢陳遵為河南太守至官召吏十人作私書謝京師故人恆飢稚子色凄凉欲填溝壑唯踈放自笑狂夫老更狂洙曰公以狂自隱爾舊史言公於成都浣花里結廬枕江與田畯野老相狂蕩嚴武過之有時不冠其傲誕如此賔至上元元年作補注鶴曰詩云臨江卜宅新當是上元元年草堂作患氣經時久師曰甫有肺疾故云臨江卜宅新洙曰舊史所謂結廬枕江也喧卑方避俗踈快頗宜人有客過茅宇呼兒正葛巾洙曰諸葛亮葛巾手扇指麾三軍司馬宣王聞之歎曰名士也自鋤稀菜甲小摘為情親師曰物雖薄出於力之所致王十五司馬弟出郭相訪遺營草堂資補注鶴曰題謂遺營草堂資又詩云憂我營茅棟攜錢過野橋當是上元元年初營草堂時作客裏何遷次江邊正寂寥修可曰陳樂昌公主詩今日何遷次新官對舊官肯來尋一老趙曰詩不愸遺一老愁破是今朝蘇曰阮籍久寓西山一日友人攜酒炙雞往見阮大笑曰今朝愁腸破矣其曠放如此憂我營茅棟攜錢過野橋他鄉唯表弟還往莫辭遙師曰漢初應曜隱於淮陽山中與四皓俱徴曜獨不至時人語曰南山四皓不如淮陽一老曜即應劭八代祖次乃次舍遷次謂遷卜此居愁破言客來破吾之愁也堂成上元元年作補注鶴曰公之初至成都居於浣花溪寺久之公乃營草堂於寺側今方堂成故作此詩而詩云頻來語燕定新巢當是上元元年三月作背郭堂成䕃白茅洙曰以白茅覆也緣江路熟俯青郊榿林礙日吟風葉洙曰榿木名不材可充薪而已惟蜀地最宜種籠竹和煙滴露梢洙曰竹有籠筀名趙曰榿木籠竹正川中之物鄭曰籠力鍾切蜀有以鍾籠竹暫止一作下飛烏將數子頻來語燕定新巢旁人錯比揚雄宅懶惰一作慢無心作解嘲洙曰揚雄傳有田一㕓有宅一區世世以農桑為業哀帝時丁傳董賢用事雄方草太𤣥或嘲雄以𤣥尚白而雄解之號曰解嘲左太冲詠史詩寂寂揚雄宅門無卿相輿田舍上元元年作補注鶴曰詩云田舍清江曲柴門古道傍又云櫸栁枝枝弱枇杷樹樹香當是上元元年初夏作田舍清江曲亦作上柴門古道傍草深迷市井地僻懶衣裳蘇曰穆政林居地僻見客衣裳亦懶著吾雖放曠如此不識客意如何櫸栁枝枝弱鄭曰櫸居許切正作櫃枇杷樹樹香鸕鷀西日照曬翅滿魚梁洙曰鸕鷀水鳥也蜀人以之捕魚趙曰陶侃母責其為漁吏而寄鮓進艇上元二年作補注鶴曰詩云南京久客耕南畝又云並蒂芙蓉本自雙謂之久客則當是上元二年作南京久客耕南畝洙曰明皇幸蜀號成都為南京置尹比兩都北望傷神卧北窗晝引老妻乘小艇晴看稚子浴清江俱飛蛺蝶元相逐並蒂芙蓉本自雙茗飲蔗漿攜所有瓷罌無謝玉為缸洙曰鄒陽酒賦醪釀既成緑瓷既啓宋玉招魂云濡鱉炮羔有蔗漿些西郊上元元年作補注鶴曰詩云西郊向草堂又云江路野梅香當是上元元年冬作時出碧雞坊洙曰漢郊祀志宣帝時或言益州有金馬碧雞之神可醮祭而致遣王褒持節而求之故成都有碧雞坊鄭曰梁益記成都之坊一事有二第四曰碧雞坊西郊向草堂洙曰成都記草堂寺府西七里市橋官栁細洙曰成都記市橋水中有石犀蓋吳漢為賊將延岑所破之處鄭曰酈元水經注益州西南石牛門曰市橋趙曰按樂史寰宇記云於成都府載市橋在州西補注希曰公孫述傳市橋即七星橋之一橋李膺益州記中星橋市橋也在今成都縣西南四里寰宇記常璩云石牛門曰市橋華陽國志市橋星橋之五陶侃課諸營種栁都尉夏施盜栁種之于已門江路野梅香趙曰市橋江路皆草堂所經之地傍架齊書帙看題减一作檢藥囊無人競洙曰一云與一作覺來往踈懶意何長趙曰荆公本作覺來往甚善余嘗讀梁徐姚婦題甘蕉示人曰夕泣已非踈夢啼真太數惟當夜枕知過此無人覺舊本作競又作執誤矣所思上元二年作補注鶴曰詩云故憑錦水將雙淚當是在成都作上元二年苦憶荆州醉司馬崔吏部猗謫官一作居樽爼一作酒定常開九江日落醒何處洙曰禹貢九江孔殷地里志九江在今廬江潯陽縣南皆東合為大江然則江以南水以大小俗呼為江應劭謂江自潯陽合為九道潯陽記有九江之名一曰烏江二曰蚌江三曰烏白江四曰嘉靡江五曰畎江六曰源江七曰廩江八曰提江九曰箘江補注洙曰江賦流九𣲖於潯陽又潯陽記九江在潯陽郡北五里名曰烏江逺則百餘里是大禹所疏桑落洲上三百餘里合流又太康地記曰九江劉歆以為湖漢九水入彭蠡也荆州之水亦合於潯陽荆州又距九江不大逺故云一柱觀頭眠幾回洙曰荆州路畔有一柱觀在山上士人呼為木履觀梁劉孝綽江津寄劉之遘詩經過一柱觀出入二休臺可憐懷抱向人盡欲問平安無使來故憑錦水將雙淚好過瞿塘灔澦堆洙曰瞿塘峽名灧澦石名也在水中荆州記云灧澦如馬瞿塘莫下灧澦如象瞿塘莫上蓋人以為水則也江村上元元年作補注鶴曰詩云長夏江村事事幽當是上元元年夏作清江一曲抱村流趙曰此言浣花溪之澄清也舊注以為清江縣却是施州矣長夏江村事事幽洙曰沈佺期詩坐看長夏曉自去自來一作歸堂上燕相親相近水中鷗老妻畫紙為一作成碁局稚子敲針作釣鈎師曰妻比臣夫比君碁局直道也針本全直而敲曲之言老臣以直道成帝業而幼君壞其法稚子比幼君也此天厨禁臠之說也或說老妻以比楊妃稚子以比祿山蓋祿山為妃養子碁局天下之喻也妃欲以天下私祿山故祿山得以邪曲包藏禍心此說為得之雖然甫之意亦不如此老妻稚子乃甫之妻子其肯以已妻子而託意於淫婦逆臣哉理必不然皆村居與妻子適情以自樂耳補注希曰楚辭以直針而勾耶又何魚之能得蓋傷直道之難行稚子蓋指小人邪曲以干世也多病所須唯藥物微軀此外更何求何一作無江漲上元元年作補注鶴曰詩云江漲柴門外當是上元元年在草堂作江漲柴門外兒童報急流蘇曰李栩居淫水上讀書謝絶賔客一日滻漲兒童報曰急流至栩怡然自若整卷几上書徐徐而出人皆服其量下牀髙數尺倚杖沒中洲趙曰鮑明逺詩倚杖牧雞豚細動迎風燕輕搖逐浪鷗漁人縈小楫容易拔洙曰又云伖一作捩船頭野老上元元年作補注鶴曰詩云城闕秋生畫角哀又云片雲何事傍琴臺當是上元元年初秋作詩又云王師未報收東郡蓋以乾元二年九月史思明陷東京及濟汝鄭滑四州通鑑云上元元年六月田神功破思明之兵於鄭州然東京與諸郡猶未復故云野老籬前江岸回柴門不正逐江開漁人網集澄潭下趙曰謂百花潭也賈客船隨返照來鄭曰賈公土切行曰商坐曰賈長路關心悲劒閣洙曰劒門也閣棧道也片雲何意洙曰一作事又云行雲幾處趙曰事字一作意不若事之快傍琴臺鄭曰十道志成都有琴臺即相如與文君貰酒處今海安寺補注希曰寰宇記相如宅在州西四里益都耆舊傳云在少城中笮橋下有百餘步又有琴臺今為金花等寺王師未報收東郡馬曰滑州城闕秋生畫角哀趙曰成都改為南京故公自注得稱城闕雲山上元元年作補注鶴曰詩云神交作賦客力盡望鄉臺當是在成都作上元元年是年羌渾黨項冦涇隴史思明入東京故詩云京洛雲山外音書靜不來京洛雲山外音書靜不來神交作賦客洙曰神交作賦客謂宋玉也山濤阮籍為神交喻不涉形跡似神交而已趙曰京洛言長安與洛陽也賦客指班張也望長安洛陽之音書而不來故神交於賦客而巳非謂宋玉也力盡望鄉臺洙曰成都記望鄉臺隋蜀王秀所築鄭曰益州記升仙亭夾路有二臺一曰望鄉臺衰疾江邊卧親朋日暮回白鷗元水宿何事有餘哀遣興乾元二年作補注鶴曰詩云地卑荒野大天逺暮江遲不當是成都詩當是乾元二年秦州作而舊次與梁權道俱編在成都詩內干戈猶未定弟妹各何之洙曰言避亂奔散不知其所適拭淚霑襟血梳頭滿靣絲趙曰以思憶而痛悼之極地卑荒野大天逺暮江遲衰疾那能久應無見汝期一作時蘇曰鄧廩送子南遷執手悵恨久之語曰汝去萬里吾殘喘如桑榆末景應無再見汝時宜自勉力北鄰上元元年作補注鶴曰此與下篇皆指草堂之鄰故云時來訪老疾當是上元元年公詩多以縣令為明府此詩云明府者其王明府與王與公游公亦有詩以與之明府豈辭滿洙曰後漢張湛傳明府注郡所居曰府明府者尊髙之稱前漢韓延夀為東郡太守門卒謂之明府亦其義也藏身方告勞洙曰詩不敢告勞青錢買野竹白幘岸江臯洙曰劉隗岸幘大言意氣自若趙曰青錢蜀人語謂見錢也補注鶴曰後漢光武紀注漢官儀曰幘者古之卑賤不冠者之所服方言覆髻謂之幘或謂之承露又謝奕為桓溫司馬岸幘嘯咏青錢如謂青銅錢是也未必用蜀人語蓋白幘正是言幘之白者愛酒晉山簡趙曰山簡每出嬉游多之池上置酒輒醉名之曰髙陽池能詩何水曹洙曰梁書何遜字仲言八歲能賦詩沈約愛其文嘗謂遜曰吾每讀卿詩一日三復猶不能已其為名流所稱如此為安武王參軍兼水部郎時來訪老疾步屧到蓬蒿洙曰三輔决録注張仲蔚隱身不仕所居蓬蒿沒人屧悉協切履薦也南鄰上元元年作修可曰左太冲詩云南鄰擊鐘磬有此南鄰字故公取以為題補注鶴曰詩云錦里先生烏角巾又云相送柴門月色新正是草堂之鄰先生其所謂南鄰朱山人者乎上元元年作錦里先生烏角巾洙曰巾之有角者郭林宗遇雨而角折人皆折角以效之園收芋栗一作粟不全貧洙曰史記卓氏曰吾聞汶山之下沃野下有蹲鴟注大芋也成都風俗曰大飢不飢蜀有蹲鴟言有所濟爾蘇曰舊本作粟甫以其園只取芋栗故謂之貧然猶有芋栗可收所以不為全貧若更收粟則不可為貧矣補注希曰莊子疏芋橡子也似栗而小蹲鴟猶可使人不飢若有之亦不可為貧慣看賔客洙曰又作朋友一本作門戶兒童喜趙曰慣看賔客則常喜即與魏野詩云兒童不慣見車馬走入蘆花深處藏異矣得食階除鳥雀馴蘇曰黃湛養鳥雀數百就掌中取食俱無疑忌自號林泉逸老補注希曰長安志云興善寺素和尚齊時鳥雀就掌中取食况於階除乎秋水才一作雖深四五尺野航一作艇恰受兩三人趙曰世多疑此謂之航豈止恰受兩三人乎余觀詩云誰謂河廣一葦杭之如今之一葉舟也杭即航也則野航不必名其大矣補注鶴曰詩云誰謂河廣一葦杭之毛氏曰杭度也非舟航之航雖野航不當以大小論要不必引此為證蕭何世家多者兩三人白沙翠竹江村暮相送一作對柴門一作籬門月色新赴青城縣出成都寄陶王二少尹上元元年作補注鶴曰唐志成都府有少尹二人從四品下掌二府州之事歲終則更次入計此當是上元元年作青城乃蜀州外邑在成都之世故公嘗暫至焉魯訔年譜亦以為在是年老被樊籠役洙曰一云老恥妻孥笑貧嗟出入勞客情投異縣詩態憶吾一作君曹東郭滄江一作浪合洙曰蜀城之東二水合流而南下土人謂之合水西山白雪髙洙曰西山近接維松上有積雪經夏不消文章差底病趙曰差病校也蓋公尚投異縣以干戈雖有文章可差得病乎回首興滔滔因崔五侍御寄髙彭州適一絶上元二年作補注鶴曰髙適為彭州詳見上注今詩云百年已過半當是寶應元年公年五十一歲作而適上元二年已代崔光逺為劒南節度當是上元二年作雖其年方五十不應言已過半恐已字誤彭州至成都不滿百里百年已過半秋至轉飢寒蘇曰黃旦秋至人皆實其倉箱吾見飢寒相逼為問彭州牧何時救急難師曰此一絶詩兄弟急難故云野望因過常少仙補注鶴曰少仙當是常徴君公有寄常徴君詩云徴君晚節旁風塵當是晚年却出仕此詩當是上元元年在青城作野橋齊度馬孫曰蜀多以竹為橋參差不齊今云野橋齊可度馬秋望轉悠哉竹覆青城合江從灌口來洙曰青城山名灌口地名昔秦守李氷疏鑿離堆以灌蜀土因而得名補注鶴曰青城山在興元府而蜀州有青城縣縣亦有青城山其州又有灌口府寰宇記灌口山在西嶺又云在彭州九隴縣鎮城西李膺益州記清水路西七里灌口此云江從灌口來則不指益州灌口府矣入村樵徑引嘗果栗皺開落盡髙天日幽人未遣回出郭上元元年作補注鶴曰詩云逺煙鹽井上斜景雪峯西當是在成都作又云故國猶兵馬他鄉亦鼓鼙謂上元元年羌渾党項冦涇隴史思明陷東京而段子璋反陷綿州劉展反陷升潤州西原巒又冦邉當是上元元年在成都作霜露晚凄凄髙天逐望低逺煙鹽井上洙曰蜀都賦家有鹽井立之曰逺煙蓋煮鹽也斜景雪峯西洙曰雪山也立之曰斜景落日也故國猶兵馬洙曰公長安人也他鄉亦鼓鼙江城今夜客還與舊烏啼過南鄰朱山人水亭廣德二年作趙曰此篇公歸草堂所作也所謂南鄰豈前者錦里先生乎補注鶴曰詩云歸客村非逺當是廣德二年自閬州歸草堂時作也梁權道編在上元元年恐於歸客不合相近竹參差相過人不知幽花欹滿樹小水細通池歸客村非逺趙曰公自言也殘樽席更移看君多道氣從此數追隨趙曰曹子建公宴詩飛蓋相追隨恨别乾元二年作補注鶴曰詩云聞道河陽近乘勝當是乾元二年冬成都作故又云草木變衰行劒外洛城一别四一作三千里胡騎長驅五六年洙曰一云六七年公因避亂入蜀補注鶴曰天寶十四載祿山反至乾元二年為五年而其勢未艾將涉明年故云五六年是年十月乙已李光弼敗史思明於河陽草木變衰行劒外洙曰宋玉九辨草木搖落兮變衰兵戈阻絶老江邉洙曰道路梗阻未可歸也思家步月清宵立憶弟看雲白日眠聞道河陽近乘勝司徒急為破幽燕洙曰幽燕安史巢穴司徒李光弼也新破賊於河南三橋故也趙曰乾元二年司徒李光弼敗史思明於河陽幽燕思明窟穴也寄賀蘭銛廣德元年作鄭曰銛息廉切補注鶴曰詩云朝野歡誤後乾坤震蕩中謂廣德元年收京後吐畨之亂未息考公贈别賀蘭銛詩亦云國步初反正乾坤尚風塵與此詩合當在廣德元年作是時公在閬州而梁權道編在上元元年恐非詳見贈别詩注朝野歡娛後洙曰張景陽詠史詩昔在西京時朝野多歡娛乾坤震蕩中相隨萬里日揔作白頭翁洙曰曹丕書已成老翁但未白頭耳歲晚仍分袂江邊更轉蓬勿云俱異域洙曰古詩與君俱異域飢啄幾回同寄楊五桂州上元元年作鮑曰名談因州參軍段子之任即廣州段功曹也楊五長史蓋自桂徙廣段子從之補注鶴曰桂州唐屬嶺南道中都督府詩云江邊送孫楚指段子為功曹而云當是上元元年在成都作五嶺皆炎熱宜人獨桂林梅花萬里外雪片一冬深洙曰五嶺有梅嶺因以得名補注鶴曰山海經云桂林有八桂在畨禺東且桂州雖居嶺外然治古始安𨽻荆州之零陵非秦漢時桂林故白樂天亦云桂林無瘴氣兹所以宜人也嶺南無雪獨桂林有之范成大云靈川興安之間兩山蹲踞中容一馬謂之嚴關朔雪至關輒止大盛則度關至桂州城下不復南矣北城舊有樓曰雪觀所以夸南州也聞此寬相憶為邦復好音江邊送孫楚逺附白頭吟洙曰晋孫楚字子荆嘗參石苞嘌隨軍事逢唐興劉主簿弟上元二年作補注鶴曰莫州有唐興縣神龍元年二月四日改武昌縣為唐興台州有唐興上元二年六月改始豐為唐興又道州有唐興貞觀八年改梁興為唐興天寶元年八月二十四日復為延唐遂州有唐興亦是與道州唐興同日改為蓬溪蓋莫台道遂四州皆有唐興此詩云劒外官人冷當是指遂州而言然唐志云天寶元年更唐興為蓬溪而唐㑹要又云天寶元年八月二十四日改為蓬溪而公上元二年為邑宰王潜作唐興縣客館記及此詩俱題云唐興劉主簿何也無乃因舊名而云耳此詩當是上元二年與簡王明府詩同時作分手開元末連年絶尺書洙曰古詩中有尺素書江山且相見戎馬未安居洙曰戎馬之際方奔走避亂未安所止劒外官人冷洙曰蜀在劒外關中驛騎疏輕舟下吳㑹洙曰都㑹之㑹謂當全吳都㑹之地主簿意何如趙曰公欲往兩浙而問主簿之意如何補注希曰地里志吳亦江東之一都㑹也公初到蜀已有東下之意陳書髙祖謂蔡凝曰卿意何如和裴迪登新津寺寄王侍郎上元元年作王時為蜀牧補注鶴曰成都雖有新津橋而蜀州有新津縣又有下篇和裴迪蜀州東亭送客逢梅見寄詩則寺亦在蜀州當是上元元年作蜀州至成都才百里宜可以唱和詩云老夫貪佛日隨意宿僧房或是公暫如新津時與裴同至寺故有此作案宰相世系表裴迪出洗馬裴天常之後何限一作恨倚山木吟詩秋葉黃蟬聲集古寺鳥影度寒塘風物悲遊子蘇曰江淹過灞陵秋深葉脫嘆曰何限風物寥落袛悲遊子故園之思登臨憶侍郎補注希曰登臨二字本出宋玉賦登山臨水送將歸又謝靈運有登臨海嶠詩老夫貪佛日隨意宿僧房田曰金光明經云佛日大悲滅一切暗敬簡王明府上元二年作補注鶴曰明府當是遂州唐興縣宰王潜也公上元二年辛丑歲嘗為王作唐興客館記前有逢唐興劉主簿詩此殆因劉而簡之詩云鷹秋怕苦籠上元二年秋作葉縣郎官宰洙曰後漢方術傳王喬為葉令有神術即古仙人王子喬也明帝云郎官上應列宿出宰百里鄭曰葉失涉切唐韻縣名在汝州周南太史公洙曰司馬遷傳是歲天子始建漢室之圭而太史公留滯周南不得從事發憤且卒淳如曰周南洛陽也張晏曰自陕以東皆周南之地也神仙才有數流落意無窮驥病思偏秣鷹秋怕苦籠看君用髙義恥與萬人同重簡王明府上元二年作補注鶴曰詩云甲子西南異冬來只薄寒當是上元二年冬作甲子西南異洙曰言西南寒者有異中土冬來只薄寒江雲何夜靜一作盡蜀雨幾時乾洙曰楚詞泥汚后土兮何時乾行李須相問洙曰襄八年傳知武子使行人子員對曰君有楚命亦不使一介行李告於寡君注行李行人也窮愁豈有一作自寬君聽鴻鴈響恐致稻粱難建都十二韻寶應元年作彥輔曰建都以蜀為南京也置尹比二京鮑曰寶應元年歲次壬寅公年五十一歲在成都建卯月辛亥建五都以京兆府為上都河南府為東都鳳翔府為西都江陵府為南都太原府為北都故有是詩補注鶴曰詩云建都分魏闕下詔闢荆門則建都當是指江陵為南都案舊史上元元年九月甲午以荆州為南都州曰江陵府官吏制置同京兆而鮑以為寶應元年建都則非蓋上元元年初建二年停四京及南都之號寶應元年復建五都荆門正指江陵而魏闕分為北都也此詩寶應元年作以詩云窮冬客江劒乃避成都之亂入梓州時梓劒相鄰是年復建五都故有此作江陵望幸詩所以有雄都元壯麗之句蒼生未蘇息胡馬半乾坤洙曰半天下也議在雲臺上洙曰後漢議功於雲臺誰扶黃屋尊洙曰黃屋天子車蓋此指言誰為安王室者建都分魏闕下詔闢荆門恐失東人望其如西極存洙曰東人謂關中父老也時明皇在蜀故云西極時危當雪恥洙曰洗雪也恥國恥也計大豈輕論雖倚三階正洙曰東方傳云願陳泰階六符應劭曰泰階天之三階也上階為天子中階為諸侯公卿大夫下階為士庶人三階平則天下大安是為太平終愁萬國翻牽裾恨不死洙曰魏文帝欲遷冀州士以實河南辛毗諌帝不答而起毗引其裾漏網辱殊恩洙曰漢刑法志漏網吞舟之魚永負漢庭哭洙曰賈誼傳可為痛哭遙憐湘水魂洙曰屈原沉湘窮冬客江劒隨事有田園風斷青蒲節霜埋翠竹根衣冠空穰穰洙曰史記貨殖傳天下穰穰皆為利往關輔久一作逺昏昏願枉一作唯駐長安日光輝照北原嵗暮廣德元年作補注鶴曰詩云邊隅還用兵煙塵犯雪嶺當是是指吐畨廣德元年陷松維保三州雪嶺引維州也九域志云南至雪嶺二百六十里梁權道編在上元元年成都詩內然考史及通鑑是年與二年及寶應元年雪嶺無警雖吐畨寶應元年十二月冦成秦渭三州然無關於雪嶺歲暮逺為客邊隅還用兵煙塵犯雪嶺趙曰此篇全言吐畨之亂也西山近接維松上有積雪經夏不消人謂之雪山也鼓角動江城天地日流血洙曰謂多戰鬬朝廷誰請纓洙曰終軍願請長纓以繫狂虜濟時敢愛死寂寞壯心驚趙曰公自悼其有濟時之志而壯心已消故也和裴迪登蜀州東亭送客逢早梅相憶見寄上元元年冬作補注鶴曰此詩當是與和裴迪登新津寺詩同年作然此詩題云逢梅相憶見寄則是上元元年冬在成都作也迪與王維善維與迪游輞川賦詩相酬為樂東閣官梅動詩興還如何遜在揚州蘇曰梁何遜作揚州法曹廨舍有梅花一株花盛開遜吟詠其下後居洛思梅花再請其往從之抵揚州花方盛遜對花倣徨終日此時對雪遙相憶送客逢春一作花可自由幸不折來傷歲暮若為看去亂鄉一作春愁江邊一樹垂垂發蘇曰吳防雪梅賦照寒溪之豔豔帶冷雪之垂垂想子美雪中見梅作也今梅花中用垂垂字但可雪中梅花即用之朝夕催人自白頭寄贈王十將軍承俊大厯元年春作補注鶴曰詩云纒結青驄馬出入錦城中則王將軍在成都而公作詩寄之則不得云公在成都作而梁權道編在上元二年則是年公在成都也以期王將軍不至考之當是在永泰間在成都欲至夔所以公大厯元年冬以期之不至而作詩此當在大厯元年春作將軍膽氣雄趙曰孫子曰并敵一向奪其膽氣臂懸兩角弓蘇曰趙括每出乘髙馬左右懸二白角弓纒結青驄馬出入錦城中時危未受鉞趙曰受鉞則為大將矣勢屈難為功賔客滿堂上何人髙義同遊修覺寺上元元年作補注鶴曰詩云吾得及春遊蓋公以乾元二年季冬至成都及春遊之所以有是句當在上元元年野寺江天豁山扉花竹幽詩應有神助修可曰謝靈運嘗於永嘉西堂思詩竟日不就忽夢見惠連即得池塘生春草大以為工常云此語有神助非吾語也吾得及春遊徑石相一作深縈帶川雲自一作免去留禪枝宿衆鳥趙曰庾信安昌寺碑云禪枝四靜公於佛寺每用佛家書斯為當體漂轉暮歸愁師曰言衆僧得所棲託傷已漂轉曾衆僧之不若也後遊上元元年作補注鶴曰當是一春兩遊之故詩云江山如有待花栁更無私同上年作寺憶曾遊處橋憐再渡時江山如有待花栁更無私趙曰言遊者皆得見之無所私也野潤煙光薄沙暄日色遲客愁全為减捨此復何之題新津北橋樓得郊字上元元年作補注鶴曰新津縣在蜀州上元元年公嘗暫如新津此詩殆其年作也又云池水觀為政當是與仕於蜀州者同登故分韻得郊字望極春城上開筵近鳥巢白花簷外朵青栁檻前梢池水觀為政洙曰澄清而不撓厨煙覺逺庖洙曰言觀厨煙知其不親庖厨西川供客眼一作逺唯有此江郊蘇曰向兆曰唯有此江郊可喜故挂冠援老率兒童操舟回奉酬李都督表文早春作上元元年作補注鶴曰蜀之都督府獨多未詳李為何人然詩云力疾坐清曉當是上元元年作蓋公初至蜀有一室詩云巴蜀來多病有客詩云老病人扶再拜難賔至詩云患氣經時久雲山詩云衰病江邊卧詩言疾者甚多力疾坐清曉趙曰晉載記姚戈仲求見石虎虎力疾見之師曰力疾言雖病猶力起坐也來詩悲早春轉添愁伴客蘇曰王當避地江表徒步唯有愁恨伴遂無情悰作文字後醉作放步行更覺老隨人紅入桃花嫩青歸栁葉新望鄉應未已四海尚風塵登樓廣德二年作趙曰此聞代宗車駕還長安之作補注鶴曰案史崔旰以永泰元年閏月辛亥冦成都郭英乂死於靈池是時公已在雲安闕年大厯元年春尚在雲安今此詩云錦江春色來天地玉壘浮雲變古今若以西山冦盜為崔旰則是大厯元年作公在雲安不應言錦江春色來天地王注師注為非意是廣德二年作指吐畨廣德元年十二月陷松維州而言西山近維州故也廣德二年春晚公避亂還成都故贈王侍御有猶得見殘春之句故此詩亦言錦江春色詩又云北極朝廷終不改者亦謂吐畨陷京師立廣武郡王承宏為皇帝將欲改命而旋為郭子儀克復代宗還京終不為吐畨所廢趙注為是花近髙樓傷客心萬方多難此登臨錦江春色來洙曰一作水流天地玉壘浮雲變古今洙曰左太冲蜀都賦云夫蜀都者擴雲關以為門包玉壘而為宇玉壘山名也湔水出焉在成都西北岷山界蜀有銅梁玉壘補注希曰笮橋江水亦名濯錦江俗云以此濯錦鮮明唐志玉壘山在彭州導江縣又華陽國志玉壘山出璧玉漢志玉壘山湔水所出北極朝廷終不改西山冦盜莫相侵洙曰時崔旰起兵於西山師曰此二句諷崔旰反成都不能為朝廷之害可憐後主還祠廟日暮聊為梁父吟師曰諸葛亮佐先主圖收復功未就而亮卒及後主即位祠祭亮廟嘆無人為之助亮未達時作梁父吟故甫因旰之亂傷朝廷無諸葛之才補注鶴曰公正以代宗還京而李光弼死故以比後主之失孔明也春歸廣德二年作趙曰此言歸當春時非言春色之歸也補注鶴曰詩云别來頻甲子歸到忽春華當是廣德二年避亂歸成都時作梁權道編在上元二年恐於别來頻甲子之句不合苔徑臨江竹茅簷覆地花别來頻甲子歸到忽春華師曰甫避崔旰亂適東川後復以春時歸草堂見江竹無恙唯落花覆地故下文云别來頻甲子甲子記時節也如甲子混泥塗皆言歷時之久及歸草堂倐匆又春華也內翰不明春歸草堂謂春色歸去遂以忽為輕忽誤矣倚杖看孤石蘇曰謝安所居有石一株安常倚杖相對吟嘯終日忘歸北齊謝洙名之為玉笋峯唐栁公權榜其亭曰獨秀峯傾壺就淺沙逺鷗浮水靜輕燕受風斜世事雖多梗吾生亦有涯洙曰莊子曰吾生也有涯此身洙曰一作且應醒復醉乘興即歸家歸鴈廣德二年作補注鶴曰詩云春來萬里客亂定幾年歸當是同前篇在廣德二年作春洙曰一作東來萬里客亂定幾年歸腸斷江城鴈髙髙向洙曰一作正北飛師曰甫客居萬里外覩鴈北飛傷已未有歸期曾鴈之不若也三絶句寶應元年作彥輔曰此三絶皆愍交道凋敝風俗衰薄也初章言新合之情不能久則莫若不見之也次章言疏數之無常也三章言莫若以歲寒自守也公當亂離之際奔走流落而無上下之交故見於詩者率皆如此補注鶴曰詩云無數春笋滿林生柴門密掩斷人行固當在成都時作梁權道編在上元二年然公經營草堂方植竹乃在上元元年一年之間笋生未應至無數當在寶應元手斷手之歲楸樹馨香倚釣磯鄭曰楸此由切洙曰楸一作春補注希曰爾雅釋椅梓郭云即楸陸機疏云梓者楸之類理白色而生子者斬新花蘂未應飛不如醉裏春風盡可洙曰一作何忍醒時雨打稀師曰此詩譏後進暴貴雖可為一時榮觀奈何思重才薄眼見其零落不若未受恩眷之時雨比天恩以雨多故致花易壞也門外鸕鷀久不來沙頭忽見眼相猜自今已後知人意一日須來一百回蘇曰齊騄見童癡且鄙鞭撲不時妻曰但以財使之果善事人笑謂妻曰一日一百回亦須來往矣工部造法宜體之師曰此詩言貪利小人畏君子之譏其短也然君子以䝉養正瑜瑾匿瑕山藪藏疾不發其隱而小人來革靣諂諛不能愧恥也無數春笋滿林生柴門密掩斷人行㑹須上畨看成竹趙曰上畨乃川語上畨則成竹故謂上筤竹客至從嗔不出迎師曰前篇言花始雖斬新終為風吹雨打以至零落此詩言笋初生終乎成竹而有客至從嗔不出迎之語蓋言唯君子守道為歲寒異夫小人之暴貴易壞也客至上元二年作魯曰喜崔明府相過補注鶴曰詩云舍南舍北皆春水又云盤飱市逺無兼味當在浣花作然詩花已成徑酒有舊醅皆非上元元年經營時事當在二年作若云在寶應元年作則其年秋旱無春水如此舍南舍北皆春水但見一作有羣鷗日日來花徑不曾緣客掃蘇曰王武仲隱居羊欣相訪武仲曰君子宜去吾不可啓關恐踏碎滿徑落花欣嗟賞久之而歸蓬門今始為君開盤飱市逺無兼味趙曰潘嶽作夏侯湛誄有云重珍兼味樽酒家貧只舊醅肯與鄰翁相對飲隔籬呼取盡餘杯遣意二首上元二年作補注鶴曰詩云孤村春水生又云細雨夜移橙當同是上元二年作囀枝黃鳥近泛渚白鷗輕一徑野花落孤村春水生衰年催釀黍蒼舒曰春秋緯曰凡黍為酒陽據隂乃能動故以麥釀黍為酒細雨夜移橙洙曰橙香橙也柑屬補注希曰上林賦黃柑橙榛漸喜交游絶幽居不用名洙曰陶淵明歸去來兮請息交以絶游程曰息交絶游不好聲名故爾簷影微微落宋曰微微落簷月斜故簷影落水而斜津流脉脉斜野船明細火宿鴈聚圓一作寒沙雲掩初弦月趙曰庾肩吾七夕詩初弦值早秋香傳小樹花鄰人有美酒稚子夜一作也能賖蘇曰馬舉好飲夜聞鄰家有酒使兒童去賖鄰家以雙瓶贈之舉欣然曰非老好飲喜稚子能賖補注杜詩卷二十一
