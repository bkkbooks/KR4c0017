body:
  text: 補注杜詩卷十六宋黃希原本黃鶴補注送顧八分文學適洪吉州大厯三年作補注鶴曰公在公安嘗使顧書醉歌行於尉廨之壁則是公與顧相遇於公安今顧又適江西故送以此詩詩云逺作辛苦行舟楫無根蒂又云崩騰戎馬際所在移長吏當是大厯三年在公安作是年吐蕃寇邠靈州商州兵馬使劉洽殺刺史殷仲卿幽州兵馬使朱希彩殺節度使李懷仙皆是其年也梁權道編在大厯四年嶽州詩內中郎石經後八分蓋憔悴洙曰蔡雍熹平中表求正定六經文字靈帝許之雍乃自書冊于碑使工刻立於太學門外兩京記云貞觀中得雍石經數段雍能八分書補注鶴曰臨漢石經與今文不同者殊多石刻在洛陽本在洛宫前御史臺中年久摧散洛人時時得之黃長睿東觀餘論云得其石本論語之末題云書與博士臣左立郎中臣書上臣下皆缺當是著書者姓名或云此即蔡雍書又有一版公羊其末云溪典諫議大夫臣馬日磾臣趙䧕臣劉𢎞郎中臣張文臣蘇陵臣傅楨雜下溪上缺溪上當是堂謂堂溪典也此蓋鴻都一字石經然經各異手書不皆蔡雍書歐公集古録云興唐寺石經藏讚皆其作者自書而八分者數家惟蔡有鄰著其姓氏有鄰名重當世杜甫嘗稱之於詩其為阮咸所書小字與三代器銘何異此詩言中郎石經初亦未嘗言雍盡書之雖一字亦可以石經名也漢禮樂志纎微憔瘁之音作師古曰憔瘁謂減縮也公之意亦謂自雍之後八分不多見也顧侯運爐錘鄭曰錘之瑞切煆也洙曰運爐錘言能鍛鍊以成一家之書夢符曰右按莊子曰無莊之失其美據梁之失其力黃帝之亡其智皆在爐錘之間耳筆力破餘地蘇曰黃刋見蔡雍八分書曰筆力尚可破餘地昔在開元中韓蔡同贔屭鄭曰上平祕切下虛器切洙曰開元中韓擇木蔡有鄰二人善八分事見李潮八分歌注修可曰張平子西京賦綴以二華巨靈贔屭注贔屭作力之貌𤣥宗妙其書是以數子至御札早流傳揄揚非造次洙曰明皇師韓擇木嘗於彩箋上八分書賜張說三人並入直洙曰韓蔡顧三人也恩澤各不二顧於韓蔡內辨眼工小字分日示諸王鉤深法更祕洙曰顧文學八分外尤能小字也文學與我遊蕭疏外聲利追隨二十載浩蕩長安醉高歌卿相宅文翰飛省寺視我揚馬間洙曰視公如揚雄司馬相如白首不相弃驊騮入窮巷蘇曰顔倚訪原憲憲曰驊騮亦肯入窮巷必脫黃金轡趙曰顧君騎驊騮相訪脫黃金轡言其富貴也一論朋友難遲莫敢失墜古來事反覆相見橫涕泗嚮者玉珂人誰是青雲器洙曰此事之反覆也言貴者未必賢才盡傷形體洙曰一作骸病渴汙官位洙曰司馬病渴李尋曰久汙玉堂之署故舊獨依然時危話顛躓鄭曰躓音致我甘多病老子負憂世志胡為困衣食顔色少稱遂逺作辛苦行順從衆多意舟楫無根蒂蛟鼉好為祟況兼水賊繁特戒風飊駛師曰駛音山吏切疾也崩騰戎馬際往往殺長吏子于東諸侯勤勉防縱恣補注鶴曰洪吉在唐皆𨽻江南道自長安言之則為東故曰東諸侯洪乃西道採訪使所治故又曰請哀瘡痍深告訴皇華使邦以民為本魚饑費香餌趙曰言當厚施豫以恤民為本也請哀瘡痍深告訴皇華使使臣精所擇進德知厯試惻隱誅求情洙曰當勤恤民困也固應賢愚異洙曰不可一槩為苛急當存賢愚之用心爾烈士惡茍得俊傑思自致趙曰皆以指言顧文學所以責望之深也贈子猛虎行出郊載酸鼻洙曰陸士衡樂府猛虎行渴不飲盜泉水熱不息惡木隂惡木豈無枝志士多苦心此皆勉其自振立也師曰書苑云唐明皇好圗畫工八分章草豐茂英特初張說為麗正殿學士獻詩明皇自於彩箋上八分書讃曰德重和鼎功逾濟川詞林秀發翰苑光鮮所謂御札流傳者此也辨眼言于字中最號明眼者也神農本草云珂貝類大如鰒皮黃黑而骨白以為馬飾生南海勒謂之珂晉阮咸字仲容顔延年五君詠曰仲容青雲器青雲言器之高逺也按齊書江淹夢得五色筆由是文章日新後夢有人稱郭璞取之後為詩絶無美句時人謂之才盡甫謙言巳才巳盡况又病渴豈可汚辱官位是以下文有我甘之語上水遣懷大厯四年作補注鶴曰詩云一紀出西蜀于今向南斗當是大厯四年入潭州時作故曰上水按公以天寶十四載冬避亂離長安自關隴入蜀至大厯三年春出峽故曰一紀非謂在蜀一紀而始出也趙注以為公自乾元二年入蜀至大厯五年離蜀而在楚地恰十二年大非蓋公不是大厯五年出蜀魯訔年譜却以為四年自嶽入潭時作我衰太平時身病戎馬後蹭蹬多拙為洙曰蹭蹬失勢貌趙曰潘耀老夫蹭蹬任意拙於主事安得不皓首驅馳四海內童稚日糊口洙曰左傳糊其口於四方注糊鬻也但遇新少年少逢舊親友低顔下邑地故人知善誘後生血氣豪舉動見老醜洙曰言少年不相知但以老醜見欺而巳李固曰一日朝㑹見諸侍中並皆年少更無一宿儒大人可顧問曰誠可歎息也補注希曰阮籍詩胡為美少年夕暮成老醜窮迫挫曩懷常如中風走鄭曰中陟仲切洙曰傷世態之薄也朱叔元與彭寵書伯通獨中風狂走自捐盛時一紀出西蜀于今向南斗趙曰公自乾元二年入蜀至大厯五年離蜀而在楚地乃南斗之分恰十二年矣孤舟亂春華暮齒依蒲栁洙曰暮齒暮年也顧況曰蒲栁之姿望秋先零言其易衰也冥冥九疑葬聖者骨已朽蹉跎陶唐人鞭撻日月久洙曰陶唐帝堯氏也山海經曰蒼梧之山其中有九疑山舜所葬之處九山相似行者疑惑故名曰九疑中間屈賈輩讒毁竟自取鬱悒二悲魂蕭條猶在否修可曰屈原汨羅之沉賈誼長沙之謫皆眼前楚地之可弔者也􅍶崒清湘石逆行雜林藪篙工密逞巧洙曰操舟者矜其能也氣若酣杯酒歌謳互激越回斡明受授善知應觸類各藉頴脫手洙曰穎脫喻敏捷也古來經濟才何事獨罕有趙曰回斡轉其船也相呼相命以求水脈謂之受授善知此者應能觸類以推凡事皆藉鋒穎脫見之手乃能妙絶也欲求經濟天下如操舟之妙何獨罕有乎蒼蒼衆色晚熊挂𤣥蛇吼黃羆在樹顚正為羣虎守趙曰詩疏曰熊能攀緣上高樹見人則顚倒投地而下也栁子厚作熊說云鹿畏貙貙畏虎虎畏羆觀公詩意以羆在樹而守虎明矣羸骸將何適履險顔益厚庶與達者論吞聲混瑕垢遣遇大厯四年作補注鶴曰詩云開帆駕洪濤見其為上水而作當是大厯四年春自嶽之潭作故又曰春水滿南國若自潭遡流入衡則時皆不合四年五年公雖皆入衡然皆是夏初磬折辭主人開帆駕洪濤洙曰莊子漁父篇夫子曲腰磬折言其恭也饒曰腰曲如磬之折春水滿南國朱崖雲日高洙曰朱崖南海地名漢賈捐之罷擊朱崖鄭曰即潭州之丹崖舟子廢寢食飄風爭所操洙曰乘風而行也我行匪利涉謝爾從者勞石間采蕨女鬻菜洙曰一作市輸官曹丈夫死百役暮返空村號洙曰譏役斂煩重也聞見事略同刻剝及錐刀趙曰所聞所見皆似此應官曹之誅求也左傳云錐刀之未刻剝及錐刀則非特取其大者雖錐刀之瑣末猶及之也貴人豈不仁視汝如莠嵩索錢多門戶洙曰誅求不一也喪亂紛嗷嗷奈何黠吏徒漁奪成逋逃洙曰姦黠吏也漁如漁獵然不以法也逋逃走竄也自喜遂生理花時貰緼袍洙曰語衣敝緼袍師曰甫覩百姓困於賦役又自喜遂其生理雖遇花時而衣緼絮所甘心不辭也解憂大厯四年作補注鶴曰此詩當是大厯四年自嶽入潭時作詩云向來雲濤盤衆力亦不細乃舟行有所阻礙藉衆力牽挽而過若是順流自不勞衆力梁權道亦編在其時減米散同舟路難思共濟向來雲濤盤洙曰雲濤盤灘名極為險阻衆力亦不細趙曰此言雲濤之間盤轉未出乃方言謂之盤灘散米與同舟之人所以謝其用力也舊注言險阻非是呀坑洙曰一作帆瞥眼過鄭曰呀虛加切趙曰呀坈者淤坈如口之呀開也飛櫓本無蒂得失瞬息間致逺宜恐泥百慮視安危分明曩賢計兹理庶可廣拳拳期勿替師曰雲濤盤至險之灘實藉衆力操舟故得利涉譬患難之際賴衆力扶持故得國安甫之減米亦為國者憂以天下之意也呀坈乃灘口飛櫓無根蒂言至危也宿鑿石浦大厯四年作補注鶴曰詩云仲春江山麗正是大厯四年自嶽入潭時宿此遂賦詩蔡興宗年譜云春初發嶽陽泛洞庭往潭州尚有春日嶽麓山道林二寺行今宿此而云仲春則浦在洞庭之上近於潭矣早宿賓從勞仲春江山麗飄風過無時舟楫不敢繫趙曰莊子曰泛乎若不繫之舟風而不繫則流蕩矣回塘淡暮色日沒衆星嘒缺月殊未生洙曰缺殘也青燈死分翳洙曰青言無光也窮途多俊異亂世少恩惠趙曰俊異之士在窮途則膏澤不下於民而亂世少䝉其恩惠即非是亂世少恩惠以致俊異之窮舊注非鄙夫亦放蕩草草頻卒嵗斯文憂患餘聖哲垂彖繫洙曰聖人作易與民同憂患也其言象皆示於彖繫趙曰易曰作易者其有憂患乎師曰言彖繫之作在仲尼不遇之日自古文士多因憂患中而作文甫是詩之作蓋亦憤悶而有所激耳早行大厯四年作補注鶴曰詩云髙帆終日征當是泝流赴湖南時詩又云干戈未揖讓蓋謂隔年九月吐蕃入寇白元光破吐蕃二萬於靈武靈武又奏破六萬也大厯四年作歌哭俱在曉行邁有期程孤舟似昨日聞見同一聲飛鳥數求食潜魚亦獨驚前王作網罟設法害生成趙曰鳥數出求食所以自飽魚既潜而猶驚所以求活而小民利之網羅其鳥罟罩其魚害物之生成此公反傷前王之設法也易曰作結繩而為網罟以佃以漁碧藻非不茂高帆終日征干戈未揖讓崩迫開其情洙曰以干戈未寧故崩迫而情僞日開也趙曰開放此情懷於終日征行之間也師曰網罟先王所以養民後世反以此而害物賦斂所以平民後世反以此而肆暴碧藻非不茂也征帆終日凌轢所以不能遂性微物尚然況百姓乎過津口大厯四年作補注鶴曰詩云南嶽自兹近湘流東逝深當同是大厯四年春作南嶽自兹近湘流東逝深洙曰南嶽衡山也湘流湘江也和風引桂楫趙曰梁元帝烏栖曲云沙棠作船桂為楫春日漲雲岑回道過津口而多楓樹林趙曰阮籍詩湛湛長江水上有楓樹林白魚困密網黃鳥喧嘉音物微限通塞惻隱仁者心趙曰物之通塞雖微不足道而仁者於物每惻隱其困塞師曰鳥喧嘉音魚困密網或塞或通亦猶人有幸有不幸此所以惻隱仁者之心也瓮餘不盡酒膝有無聲琴聖賢兩寂寞眇眇獨開襟洙曰傷時無君子故獨開襟而巳次空靈岸大厯四年作鄭曰空靈當作空舲酈道元水經湘水縣有空舲峽十道四畨志云湘水空舲灘補注鶴曰雖寰宇記云空舲峽在秭歸縣東百二十五里然後篇云午辭空舲岑夕得花石戍則無容午在歸州而夕至潭州也況首句云沄沄逆素浪則是自嶽遡潭甚明若是自䕫下峽則為順流矣當是大厯四年春作潭州自有空靈灘也況詩與題俱為空靈與空舲自不同沄沄逆素浪鄭曰沄音雲落落展清眺幸有舟楫遲得盡所歷妙空靈霞石峻補注希曰湘中記云湘水而綱雖深五六丈見底了了石子如樗蒲矢五色鮮明白沙如霜雪赤岸如朝霞此云霞石蓋亦指岸石如朝霞也楓栝洙曰一作枯鄭曰古活切木名隱奔峭趙曰謝靈運詩徒旅若奔峭李善注云淮南子曰岸峭者必陀許慎曰陀落也然奔亦落之義青春猶無私白日亦偏照洙曰為山嶺障閡故偏照也蘇曰陳嬪妃白日昭然亦有偏照之處可使營吾居終焉託長嘯師曰逆素浪言遡流也展清眺言去高峽之阻漸入寬平之鄉栝乃栝柏也奔謂奔流峭謂峯峭白日亦偏照言岡巒互為日所出沒甫至此喜其景物佳欲託居焉故曰終焉託長嘯毒瘴未足憂兵戈滿邊徼嚮者留遺恨恥為達人誚回帆覬賞延佳處領其要宿花石戍大厯四年作鄭曰鄧慎思云在峽州鳯臺子以謂此詩在潭衡之間作謂在巴峽非也十道志潭州湘潭縣北二十里有錦石區疑花石即錦石補注鶴曰按唐地里志潭州有淥口花石二戍又詩云地蒸南風盛春熱西曰暮當是大厯四年春入潭州作無疑詩云誰能扣君門下令減租賦謂其年二月遣御史稅商錢又云山東殘逆氣謂楊子琳反殺䕫州别駕張忠午辭空靈岑夕得花石戍洙曰空靈在歸州花石唐屬陕州鮑曰唐志潭州長沙有花石戍舊注云陜州妄也夢符曰右按歸州圖經空舲峽東西十四里在峽州夷陵縣界水經云江水歷峽東徑宜昌縣之插竈下酈道元曰江之左岸絶崖壁立數百丈飛鳥所不能過棲有一火燼插在崖間望見長數尺父老傳言昔洪水時人泊船岸側以餘燼插之至今在焉岸疏開闢水洙曰一作山自白狗峽至空靈山花石皆開闢之峽木雜今古樹地蒸南風盛春熱西日暮四序本平分氣候何回互茫茫天造間理亂豈恆數繫舟盤藤輪杖策古樵路罷人不在村鄭曰罷音疲洙曰罷人言民困於征役而罷敝不在村謂其不安居也野圃泉自注柴扉雖蕪沒農器尚牢固山東殘逆氣吳楚守王度洙曰安史之亂王命之所及者吳楚蜀而已夢符曰右按左傳左史倚相誦祈招之詩曰祈招之愔愔式昭德音思我王度式如玉式如金誰能扣君門下令減征賦洙曰憫下情不上達也師曰下令減征賦言無人以重斂請於君薄賦以恤民也早發大厯四年作補注鶴曰詩云早行篙師怠席掛風不正亦以船上水而言當同是大厯四年作有求常百慮斯文亦吾病以兹朋故多窮老驅馳併趙曰以斯文自任衆所共知而故舊之多自是驅馳頻併友早行篙師怠席挂風不正洙曰席張席以為帆也風不正不順也昔人戒垂堂洙曰謂千金之子坐不垂堂今則奚奔命修可曰傳云一嵗七奔命濤翻黑蛟躍日出黃霧映洙曰鮑明逺詩騰沙鬱黃霧翻浪揚白鷗煩促瘴豈侵頽倚睡未醒洙曰未一作還鄭曰醒新佞切僕夫問盥櫛暮顔洙曰一作朱靦青鏡鄭曰靦他典切洙曰暮衰也靦愧也言暮顔衰醜有愧於對鏡也隨意簪葛巾仰慙林花盛側聞夜來寇幸喜囊中淨艱危作遠客干請傷直性洙曰謂有求於人也薇蕨餓首陽洙曰史記伯夷叔齊不食周粟隱於首陽山下采薇蕨而食之遂至餓死也粟馬資歷聘洙曰六國以粟馬資儀秦使之歷聘賤子欲適從疑誤此二柄洙曰謂采薇及歷聘也師曰昔夷齊不食周粟餓于首陽蘇秦張儀資六國以歷聘此二柄者一出一處使人疑誤今甫欲適從其一故云賤子欲適從適音的主也次晚洲大厯四年作補注鶴曰詩云棹經垂猿把身在度鳥上當是大厯四年入潭時春漲如此故詩首云坡陀風濤壯又云中原未解兵謂吐蕃去年入寇參錯雲石稠洙曰參錯雲石相互雜然也坡陀風濤壯洙曰坡陀泛濫貌風濤風浪也趙曰顔延年詩春江壯風濤晚洲適知名梅曰晚洲非素有名因子美而名彰也秀色固異狀棹經垂猿把身在度鳥上洙曰水漲而船所經者高也張所論曰白猿𤣥豹藏於檽檻何以知其接垂條於千仞則可謂之垂猿矣梁虞騫詩澄潭寫度鳥擺浪散帙妨危沙折花當師曰花當乃花根也羈離暫愈恱羸老反惆悵洙曰暫愈恱次晚洲也反惆悵歎行役也中原未解兵吾得終疏放洙曰兵未解而得疏放以不見用於世也望嶽大厯四年作補注鶴曰詩云南嶽配朱鳥又云行邁越瀟湘當是大厯四年初至潭望見遂賦此南嶽配朱鳥秩禮自百王洙曰五月南巡狩至于南嶽衡山釋山又云霍山為南嶽衡之與霍皆一山有兩名南嶽本自以兩山為名而學者多以霍山不得為南嶽又云漢武帝始名之斯不然矣衡山一名霍山言萬物霍而大也趙曰荆州記衡山者五嶽之南嶽秩則尚書咸秩無文之秩秩等也所謂五嶽視三公補注希曰大宗伯鄭注五嶽南曰衡又漢武帝嘗移嶽神於天柱山今土人皆呼天柱山為南嶽然此専以衡而言秩禮正舜典所謂望秩於山川何必更引周書注如其秩次望祭之歘吸領地靈洙曰地之百靈顔延年詩邑社總地靈趙曰江文通雜擬詩歘吸鵾雞悲注云猶俄頃也鴻洞半炎方邦家用祀典趙曰王褒四子講德論洪洞朗天言天地之神光若有相通明朗於天也在德惟馨香補注希曰正用書黍稷非馨明德惟馨之語巡守何寂寥有虞今則亡洙曰自戰國縱橫而巡守之禮亡矣有虞舜也謂五年一巡守洎吾隘世網行邁越瀟湘趙曰公之所以行邁者以世網隘窄故欲曠懷於江湖之上也渴日絶壁出趙曰難逢日霽以望其峯於日如渴也蓋如渴雨之渴漾舟清光旁祝融五峯尊峯峯次低昻紫蓋獨不朝爭長嶫相望洙曰祝融峰名也朱陵祝融紫蓋石菌芙蓉所謂五峯也爭長言相峙而立有如爭之也趙曰考衡山記有芙蓉峰紫蓋峰石門峰而韓退之詩曰紫蓋連延接天柱石廪騰擲堆祝融則又有天柱峰祝融峰為五峰舊注以朱陵補之非也恭聞魏夫人羣仙夾翺翔洙曰魏夫人神仙也田曰夫人諱華存字賢安晉司徒寄之女也幼純讀書喜神仙其後四仙人降車從鮮盛夫人既與仙者遊盡傳其祕術咸和八年終壽八十二舊說以謂夫人實不死以杖代尸而升天扶桑大帝君授夫人青瓊之板用籙之文治南嶽有時五峰氣散風如飛霜牽迫限修途未暇杖崇岡洙曰言為行邁拘限未暇策杖而登崇岡也歸來覬命駕沐浴休玉堂三歎問府主曷以贊我皇牲璧忍衰俗神其思降祥洙曰吳都賦玉堂對霤石室相距注皆仙人所居又云玉堂府主所居也故有三歎之問謂世亂俗蓐祀典闕不舉欲贊之於是帝崇牲璧則神必降祥於此矣師曰衰亂之俗廢祀典而不舉今甫欲以牲璧禮神庶使嶽神贊翊吾君而降福祥矣湘江宴餞裴二端公赴道州大厯四年作補注鶴曰裴虬大厯五年四月已出軍共平臧玠之亂而公亦去潭之衡當是四年夏作白日照舟師朱旗散廣川趙曰楚詞云青春受謝白日照羣公餞南伯肅肅秩初筵洙曰餞謂羣公祖餞也南伯謂道州南邦也詩賓之初筵左右秩秩亦整肅貌補注希曰王制云二百一十國為州州有伯商之州長曰伯虞夏及周皆曰牧一州牧二伯佐之雖非後來郡守之制然公以道為南州之州因曰南伯遂及之鄙人奉末眷佩服自早年洙曰謂於裴有親也早年少年也自少已佩服其德矣義均骨肉地懷抱罄所宣盛名富事業無取愧高賢不以喪亂嬰保愛金石堅洙曰言宜以功業著盛名使無愧於高賢無嬰於喪亂以變名節宜保之若金石之固此子美以骨肉之義故其所言及此趙曰髙賢指裴端公也保愛謂保身之意舊注非計拙百竂下氣蘇君子前㑹合苦洙曰又作共不久哀樂本相纒交遊颯向盡宿昔浩茫然促觴激百慮掩抑淚潺湲洙曰重别有所感也熱雲集曛黑闕月未生天洙曰九歌橫流涕兮潺湲謝靈運詩朝遊窮曛黑古詩三五明月滿四五蟾兔闕白團為我破華燭蟠長煙夢符曰右按梁元帝燭賦長袖留賓侍華燭燼落燭華明花抽珠漸落珠懸花更生又古樂府三婦豔詩大婦留芳縟中婦對華燭鴰鶡催明星鄭曰鴰古活切鶡何葛切蘇曰魏文帝早起戒途至新林聞鴰鶡催天明明星落林表今江湖水邊有之補注鶴曰按韻書鴰古活切麋鴰鳥名也鶡何葛切似雉釋云似雞爾雅釋曰字林云鶷鶡似伯勞而小解袂從此旋上請減兵甲下請安井田永念病渴老附書逺山巔師曰道州南邦也州長曰伯肅肅敬也鄙人甫自稱於裴有末親是以欲其盡懷抱以告之自盛名富事業以下皆戒之之辭宜以功業著盛名使無愧於高賢無以喪亂嬰懷抱保全節操如金石之堅甫之自為計則拙其為道州謀則氣義宏矣故云氣蘇君子前㑹合苦不久言欲别去樂極而哀繼之也颯衰颯也交遊之侣衰替向盡平昔契舊回首茫然况今促觴行遽寧不感激萬慮而淚落潺湲乎别筵夜熱團扇為之搖破鴰鶡催曙之鳥夜已闌矣始分袂旋歸故甫又以兵甲井田為戒古人謂贈人以言者此也題衡山縣文宣王廟新學堂呈陸宰大厯五年作補注鶴曰衡山唐初隸潭州神龍三年始屬衡州公以大厯五年至衡山當是其年作按禮樂志貞觀四年詔州縣學皆作孔子廟開元二十七年諡文宣王旄頭彗紫微無復俎豆事洙曰旄頭胡星也彗彗星也紫微帝宫也喻祿山亂中原陷長安也世亂俎豆之事不講故云無復也趙曰按晉天文志昴七星天之耳也又為旄頭胡星彗紫微言其犯帝座彗孛在天文志俱為妖星補注希曰漢文帝紀注文頴曰孛彗長三星其占略同云云彗星光芒長參參如掃彗大法孛彗多為除舊布新之災金甲相排蕩青襟一憔悴洙曰蓋民狃於戰爭不遑學校也嗚呼巳十年儒服敝于地洙曰不振也征夫不遑息學者淪素志我行洞庭野歘得文翁肆侁侁胄子行鄭曰侁疏臻切行貌若舞風雩至洙曰文翁為蜀郡守興建學校以教蜀人故風俗大變可比齊魯侁侁整肅貌胄子謂元子以下至卿大夫子弟從學者若舞風雩而至也語曰風乎舞雩趙曰語疏雩者祈雨之祭名使童男女舞之因謂其處為舞雩周室宜中興孔門未應弃是以資雅才渙然立新意洙曰周室借周以喻唐也言唐所以宜中興則孔門豈可弃乎雅才陸宰也新學資之而成爾衡山雖小邑首唱恢大義洙曰世亂而衡山能首建學校也因見縣尹心根源舊宫閟洙曰詩閟宫頌僖公能復周公之宇也講堂非曩構大屋加塗塈鄭曰塈巨至切仰塗也補注鶴曰尚書既勤墉垣惟其塗塈茨注許氣反說文云仰塗也廣雅云塗也馬云堊色一音故愛反下可容百人墻隅亦深邃何必三千徒始壓戎馬氣洙曰言文德足以服逺也林木在庭戶密幹疊蒼翠有井朱夏時轆轤凍階戺鄭曰轆盧谷切轤落胡切圓轉水戺鋤里切砌也耳聞讀書聲殺伐災髣佛佛芳未切趙曰聞讀書而樂被殺伐之災在此特覺其髣佛而巳補注鶴曰長楊賦從者倣佛骫屬而還師古曰讀曰髣佛則佛未嘗作芳未切故國延歸望衰顔減愁思南紀收波瀾洙曰言能以文德易暴亂也趙曰洗波瀾之氛妖西河共風味洙曰史記子夏居西河教授為魏文侯師共風味者言人樂其教也采詩倦跋涉載筆尚可記趙曰言采詩之官倦跋山涉水之勞而不來采之則史官載筆尚可記陸宰之美也髙歌激宇宙凡百慎失墜洙曰尚可記一云記竒異師曰青襟謂學士以青緣領也文翁肆指縣學後漢髙彪有雅才而訥於言雅才指陸宰塈塗壁也昔僖公修泮宫而服淮夷今陸宰為是學文德自足以懷逺何必三千之徒始壓戎兵氣乎殺伐災髣佛言此邦絃誦之樂兵革之患少也南紀吹波瀾言變其荆楚輕剽之風而恩波廣被也昔子夏居西河教授今陸宰與之同其風使人咀味其教也太師采詩以觀民風今采詩之官倦於跋涉使陸宰德政不聞於上甫尚得以是篇而記其事以備國史之失墜也入衡州大厯五年作補注鶴曰大厯五年公在潭以臧玠之亂遂入衡州故作此詩詩所以云元惡迷是似聚謀泄康莊竟流帳下血大降湖南殃按舊史大厯五年四月湖南都團練使崔瓘為兵馬使臧玠所殺據潭州為亂灃州刺史楊子琳道州刺史裴虬衡州刺史楊濟各出軍討之公以四年春自嶽陽至潭如衡畏熱復歸潭今以兵亂再入衡州又有逺歸兒侍側久客幸脫免等句兵革自久逺興衰看帝王趙曰兵革不息徒自嵗月之久而興起其衰微自看帝王之舉耳漢儀甚照耀胡馬何猖狂趙曰光武為司隸校尉父老見之曰今日復見漢官威儀今言唐法度未改故以比之胡馬追言安史之亂老將一失律清邊生戰場洙曰失律失法律也易曰失律凶君臣忍瑕垢河嶽空金湯洙曰言避亂出行城池不守也左傳國君含垢瑾瑜匿瑕言有所容也金謂金城湯謂湯池趙曰傳曰國君含垢言君相初含容姦逆不即誅戮故使河嶽之地雖是金城湯池而失守如空之也重鎮如割據洙曰安史亂後天下裂為藩鎮賦不上供如割據焉輕權絶紀綱軍州體不一洙曰各自為政也寬猛性所將嗟彼苦節士素於圓鑿方洙曰九辨云圓鑿而方枘兮吾固知其鉏鋙而難入趙曰苦節指崔瓘也按唐史以士行修謹聞大厯中為湖南觀察使將吏寬弛不奉法少以禮法繩之寡妻從為郡兀者安短墻趙曰言寡妻平日遭擾自從崔太守為郡之後如兀足者安於堵墻之下不復驚動也凋弊惜邦本洙曰惜民之凋弊也哀矜存事常趙曰言不妄刑罰哀矜其人旌麾非其任洙曰言非其人也府庫實過防恕已獨在此多憂增內傷偏禆限酒肉卒伍單衣裳洙曰厚自奉養而不恤軍旅也趙曰瓘之修謹既如上所云然於是委以旌麾之任則悉其人防於府庫之費而吝於賜豫又以禆將卒伍衣食之不繼則遂以召亂如下文所云也元惡迷是似聚謀泄康莊夢符曰右按爾雅曰五達謂之康六達謂之莊趙曰元惡指臧玠也以兵殺崔瓘遂據潭州竟流帳下血大降湖南殃洙曰代宗時湖南兵馬使臧玠殺其帥崔瓘王國良因之而反烈火發中夜髙煙燋上蒼至今分粟帛殺氣吹沅湘鄭曰沅湘二水名沅在象郡湘即湘江福善理顛倒明徵天莽茫洙曰九歌令沅湘兮無波趙曰書天道福善禍淫又明徵定保銷魂避飛鏑纍足穿豺狼隱忍枳棘刺遷延胝胼瘡洙曰言避亂奔走危窘如穿豺狼間行也心痛悼喪亂如忍棘刺手足胝胼而成瘡逺歸兒侍側猶乳女在旁久客幸脫免暮年慙激昻洙曰幸於免患也蕭條向水陸汩沒隨漁商報主身已老入朝病見妨悠悠委薄俗鬱鬱回剛腸洙曰老而不可報主病不可入朝故不免委身薄俗鬱鬱回剛腸而已參錯走洲渚洙曰謝靈運詩臨圻阻參錯舂容轉林篁片帆在郴岸鄭曰郴丑林切桂陽縣通郭前衡陽華表雲鳥埤埤賓彌切名園花草香旗亭壯邑屋烽櫓蟠城隍趙曰三代世表㑹旗亭下注市樓也立旗於上故名旗亭選賦抗旗亭之嶢嶭烽櫓者設烽燧於櫓也櫓者城上守禦望樓城隍者城下之壕也中有古刺史洙曰言其愛民蒞事如古刺史盛才冠巖廊趙曰武帝制曰舜游巖廊之上文穎注殿下小屋也扶顛待柱石獨坐飛風霜趙曰言刺史乃柱石之臣獨坐御史也風霜則御史之任補注希曰霍光傳將軍為國柱石師古曰柱者梁下之柱石承柱之礎言大臣負國重任如屋之柱及其石也光武改御史長史復為中丞與尚書令司隸校尉朝㑹皆專席而坐京師號三獨坐言其專也故孫樵記室新書亦云內榮獨坐公指衡州刺史陽濟道州刺史裴虬而云故公詩稱虬為裴端公稱濟為陽中丞昨者間瓊樹高談隨羽觴洙曰公自言得侍刺史如間瓊樹然陸士衡詩羽觴不可算注羽觴謂其置鳥羽於觴以急飲也余曰晉束晳傳羽觴隨波蓋言觴輕如鳥羽之飛也原叔謂急飲恐非無論再繾綣已是安蒼黃劇孟七國畏洙曰前漢游俠傳劇孟以俠顯吳楚反時條侯為太尉乘傳東討至河南得劇孟喜曰吳楚舉大事而不求劇孟吾知其無能巳天下騷動大將軍得之若為一敵國云馬卿四賦良洙曰司馬相如字長卿有子虛上林賦哀二世賦大人賦門闌蘇生在洙曰蘇生侍御渙勇鋭白起强問罪富形勢凱歌懸否臧趙曰劇孟馬卿以比刺史白起以比蘇渙公自注蘇生侍御渙則渙在崔公潩之幕而其人勇鋭故用白起以比其為將氛埃期必掃蚊蚋焉能當趙曰氛埃蚊蚋以比臧玠橘井舊地宅仙山引舟航趙曰橘井在郴州神仙傳蘇耽將仙謂其母曰以庭前橘葉神使病者以井水服病即愈仙山則指言蘇耽所仙之山公謀欲往郴故云引舟航也此行厭暑雨厥土聞清涼洙曰言親刺史之德而亡炎暑趙曰此指言郴州矣公詩意曰郴州頗涼冷橘井尚凄清舊注所引却是衡州又無比德之意諸舅剖符近趙曰公詩每以崔姓為舅豈剖符為刺史乃崔侍御潩者乎開緘書札光蘋蘩命屢及磊落字百行江總外家養洙曰陳書江總字總持七嵗而孤依於外氏聰敏有至性舅吳平光侯蕭勵名重當時多所鍾愛謝安乘興長洙曰謝安寓居㑹稽出則漁弋山水入則言詠屬文無處世意又與孫綽等泛海吟嘯自若放情丘壑每遊賞必以妓女從也下流匪珠玉擇木羞鸞凰洙曰下流自言也言已非珍異然得所託也趙曰公自謙其為人特下流耳非是珠玉之珍也傳曰窮猿投林豈暇擇木公之意自謙其不暇擇木非若鸞鳯非梧桐不棲故羞鸞鳳也我師稽叔夜趙曰公自言其放曠懶散如稽康世賢張子房趙曰公自有注以美張勸也柴荆寄樂土趙曰言郴州也鵬路觀翺翔洙曰寄居樂土當觀刺史為朝廷拔用也趙曰觀則所以指衡州刺史鵬路莊子九萬里者也風雨看舟前落花戲為新句大厯五年作趙曰此全篇言落花補注鶴曰公在潭只船居蘇大渙肩輿江浦訪老夫舟楫之語可驗今看舟前落花乃是在潭大厯五年作江上人家桃李枝春寒細雨出疏籬影遭碧水潜勾引趙曰古樂府薄命篇云艷花勾引落風妬紅花却倒吹吹花困癲傍舟楫水光風力俱相怯赤憎輕薄遮人懷趙曰赤憎方言也遮之為言輒也如遮莫鄰雞下五更之遮珍重分明不來接洙曰一作折蘇曰劉公幹居鄴下一日桃花爛漫值諸公子進賞久之遂去公幹問僕曰損花乎僕曰無但愛賞而已公幹曰珍重輕薄子不來損折使老夫酒興不空也遂飲花下作放歌行補注鶴曰公嘗有生憎栁絮白於綿之句赤憎猶生憎殆皆方言也薛宣傳得為公分明之師古曰分明謂考問使知清白也濕久飛遲半欲高縈沙惹草細於毛蜜蜂蝴蝶生情住偷眼蜻蜓避百勞師曰是時甫在舟中覩江上佳景春風細雨碧水紅花相映帶不勝喜樂因戲為新句以歌詠之雖眼前之事皆可樂然猶有輕薄可憎者但惟珍重謝之分明不來相接以至微物猶能縈涉惹草蜂蝶尚生情性況人而不能無動情乎蜻蜓避百勞百勞惡鳥恐為所害言人豈不如蜻蜓尚能全身逺害乎補注鶴曰爾雅云鵙伯勞也釋曰李巡云伯勞一名鵙陳思王惡鳥論云伯勞以五月鳴應陰氣之動陽氣為仁養陰為殘賊殺伯勞蓋殘害之鳥也其聲鵙鵙故以其音名云月令仲夏之月鵙始鳴是也又云春秋傳曰少皡氏以鳥名官伯趙司至伯趙鵙也以夏至來冬至去杜注云伯趙伯勞也此二句亦喻細民側目於賊民之長吏也清明大厯五年作補注鶴曰詩云長沙千人萬人出又云此都好遊湘西寺諸將亦自軍中至當是大厯五年作是時臧玠未亂諸將所以亦事遊賞魯訔年譜亦編在是年著處繁華矜是洙曰又云務足日長沙千人萬人出渡頭翠栁豔明睂爭道朱蹄驕囓膝洙曰朱達平善相馬魏文帝將出取馬入達平曰此馬今日死矣及將乘馬惡香囓帝膝帝使殺之趙曰以朱飾其蹄耳舊注非公蓋使王褒聖主得賢臣頌曰駕囓膝驂乘旦張晏注皆良馬名補注希曰孟康云良馬低頭口至膝故曰囓膝亦一說此都好遊湘西寺諸將亦自軍中至馬援征行在眼前洙曰伏波將軍馬援征交趾女子徵側復又擊武陵五溪蠻夷葛强親近同心事洙曰葛强山簡愛將也金鐙下山紅粉洙曰一作日晚牙檣捩柂青樓逺夢符曰右按廣韻鐙與燈同又魏鯨魚燈賦寫載其形記于金燈又郭景純江賦舳艫相屬萬里連檣埤蒼曰檣帆柱也又相如子虛賦浮文鷁揚旌枻張楫曰枻柂也古樂府劉生詩大路起青樓又古曲青樓臨大道游俠盡淹留趙曰捩柂轉船也青樓則所祓禊之處岸上有之也出古樂府劉生詩紅粉義非當作紅日古時喪亂皆可知人世悲歡暫相遣弟姪雖存不得書干戈未息苦離居逢迎少壯非吾道況乃今朝更祓除洙曰祓除上巳也束晳曰周公城洛邑因流水以泛觴後人相緣因為盛集趙曰周禮女巫掌嵗時祓除盥浴鄭注如今三月三日上已往水上之類唐氣朔大厯五年三月三日清明以清明值上已則祓除之義尤明師曰務足誇多也所謂鬬草者正此意也馬援以比衡州刺史葛强乃山簡愛將以比刺史之部將也張正見採桑詩倡妾不勝愁結束下青樓柂所以正船搖柂曰捩檣尾鋭如牙故曰牙檣苦難居謂無定居也甫老大干謁侯門俯仰於人非其本性故曰逢迎少壯非吾道補注鶴曰武衛后傳帝祓灞上孟康曰祓除也於灞水上自祓除今三月上巳祓禊也又見後漢志明帝永平二年三月上巳日官民皆潔於東流水上曰洗濯祓除去宿垢灾為大潔潔者言陽氣布暢萬物訖出始潔之矣蔡興宗年譜亦以唐史氣朔考之與趙注同嶽麓山道林二寺行大厯五年作補注鶴曰詩云潭府邑中甚純古太守庭中不喧呼今幸樂國養微軀皆以為是大厯四年公初到潭時遊之蔡興宗年譜亦編在是年詳考詩又云暮年且喜經行近春日兼䝉暄暖扶飄然班白身奚適旁此煙霞茅可誅若是四年遊之則必不便如衡矣及其如衡則畏熱還潭當思松道清涼寒生五月當遂誅茅之願何為不復再來意是五月春題此方幸樂國可以養軀而臧玠之亂故不償此意也玉泉之南麓山殊洙曰玉泉地名山足曰麓道林林壑爭盤紆修可曰荆州記長沙西岸有麓山其下有精舍宗淵麓山記云足曰麓蓋衡山之足趙曰張平子南都賦溪壑錯謬而盤紆補注鶴曰嶽麓寺在湘山之西自潭而往必渡湘水公賦清明詩云渡頭翠栁豔明眉蓋謂此也九域志云寺有陶太尉井髙唐賦亦云水淡淡而盤紆寺門髙開洞庭野殿腳插入赤沙湖洙曰洞庭赤沙皆湖名五月寒風冷佛骨六時天樂朝香爐地靈步步雪山草趙曰楞嚴經云雪山大力白牛食其山中肥膩香草僧寶人人滄海珠洙曰言性圖明而無瑕纇也塔劫宫墻壯麗敵香厨松道清涼俱夢符曰右按梁劉孝威謝東宫賜聖僧餘饌唘曰乳糜香飯素榛糗漿氣馥上天薰流下界蓮花洙曰一作池交響共命鳥洙曰釋書有共命鳥二首一身金榜雙回三足烏洙曰三足烏言寺額金榜有回鸞反鵲之勢也趙曰阿彌陀經極樂國常有迦陵頻迦共命之鳥金榜出神異經西方有宫五色黃門有金榜而銀鏤淮南子日中有踆烏注三足烏也方丈涉海費時節𤣥圃尋河知有無洙曰天台賦涉海則方丈蓬萊𤣥圃乃崑崙也張騫贊曰禹本紀言河出崑崙騫窮河源惡覩所謂崑崙者乎暮年且喜經行近春日兼䝉暄暖扶飄然班白身奚適旁此煙霞茅可誅洙曰楚詞誅鉏草茅以全生乎言當暮年欲誅鉏草茅旁此而居也桃源人家易制度洙曰桃源秦人避難之地易制度言世更變也趙曰桃源在今鼎州易制度言其宫室朴略所以制度易為也舊注非橘洲田土仍膏腴洙曰橘洲在長沙夢符曰右按襄陽記李衡於武陵龍陽洲上種橘千樹曰千頭木奴師曰武陵圗經云橘洲在龍縣東北五十里二百步周回三十里補注鶴曰夢符與師古引武陵橘洲何關於長沙事按張舜民南遷録記長沙事云橘洲在湘江南北與州城相等又圗經云橘洲在長沙縣周回五里漢地理志為九州膏腴師古曰腹之下肥曰腴故取喻云田蚡傳田園極膏腴師古曰膏腴謂極厚肥之處谷永傳云食膏腴之都潭府邑中甚淳古太守庭內不喧呼昔遭衰世皆晦跡今幸樂國養微軀依止老宿亦未晚洙曰老宿僧之年臘高者富貴功名焉足圖久為野客尋幽慣細學何顒免興孤洙曰見何顒興未忘注一重一掩吾肺腑山鳥山花吾友于洙曰一重一掩山也有如吾肺腑然夢符曰衛青曰吾幸得以肺腑待罪行間南史劉湛傳云友于素駕補注希曰劉向傳亦云臣幸得託肺腑師古曰若解謂肺腑相附著猶言心膂一說肺謂斫木之肺札自言於帝室猶肺札附於大木也王莽傳亦云伏自惟念得託肺腑友于二字自見書君陳及論語何必又引南史黃魯直改此句曰山鳥山花共友于易一吾字便覺不逮洪駒甫云謂兄弟為友于者歇後語也杜亦未能免俗何耶魯直其舅亦不免俗也宋公放逐曽題壁物色分留與洙曰作待老夫師曰昔宋之問貶經此留題在壁甫至此復得吟詠景物故曰物色分留與老夫舟中苦熱遣懷奉呈陽中丞通簡臺省諸公大厯五年作補注鶴曰詩云愧為湖外客看此戎馬亂中夜混黎氓脫身亦奔竄又詩中備述陽中丞與裴道州諸公共討臧玠甚詳當是大厯五年自潭避亂之衡州時作臺省諸公謂裴虬與李勉皆端公也愧為湖外客看此戎馬亂中夜混黎氓脫身亦奔竄趙曰湖外言洞庭湖之外衡州是也戎馬亂指言臧玠之亂平生方寸心反掌帳下難洙曰謂崔瓘見殺也嗚呼殺賢良洙曰按新史瓘為治不煩苛人便安之居澧州二年增戶數萬詔特進五階以寵異政也不叱白刃散趙曰舊本反掌蔡伯世本作反當其說是公自言平生有經世之心而反當帳下有上至於賊殺賢良乃不能一叱白刃使散蓋自以為愧矣帳下指臧玠賢良指崔瓘也吾非丈夫特沒齒埋冰炭夢符曰論語管仲奪伯氏駢邑三百飯疏食沒齒無怨言韓子曰冰炭不同器恥以風病辭胡然泊湘岸入舟雖苦熱垢膩可溉灌痛彼道邊人形骸改昏旦洙曰痛彼遇亂而死者中丞連帥職洙曰詩有方伯連帥之職趙曰中丞陽公也舊唐書云衡州刺史陽濟各出兵討臧玠謂連帥乃古之諸侯也封內權得按身當問罪先縣實諸侯半洙曰謂陽中丞也封邑半於古諸侯士卒既輯睦夢符曰左傳隨武子曰昔嵗入陳今兹入鄭民不罷勞居無怨讟而卒乘輯睦事不奸矣唘行促精悍師曰言督促精鋭强悍之兵以討玠似聞上游兵夢符曰項藉傳古之王者地方千里必居上游注文穎曰居水之上流也游或作流師古曰游即流也稍逼長沙館鄰好彼克修天機自明斷趙曰公自注云陽中丞琳問罪將士皆自澧上達長沙也補注鶴曰舊史云臧玠據潭州為亂澧州刺史陽子琳道州刺史裴虬衡州刺史陽濟各出兵討之道州居湘水之上流故曰上游兵澧州屬山南道潭屬淮南道故曰修鄰好趙謂公自注者豈公之自注後人假公以文其說耳南圖卷雲水北拱戴霄漢美名光史臣長策何壯觀田曰南圗蓋莊子鵬飛萬里而圗南事而北極奉星辰舊注謂畫湖南非是趙曰南之所圖謀欲卷盡雲水也北拱所以尊君上也驅馳數公子咸願同伐叛聲節哀有餘夫何激衰懦師曰數公子指澧州刺史楊子琳道州刺史裴虬衡州刺史陽濟共出兵伐玠其英聲節義足以振激衰懦偏裨表三上鹵莽同一貫夢符曰前漢馮奉世傳上曰大將軍出必有偏將又何疑焉師曰偏裨副將也表三上謂上章陳臧玠之無罪言崔瓘之減尅軍士率皆鹵莽不明始謀誰其間回首增憤惋趙曰裨將上表而敷陳不明同一貫耳所以問在其間而為始謀者誰徒令我回首憤惋也宗英李端公洙曰宗室之英秀也田曰吕溫河間元王孝桀贊堂堂河間為唐宗英趙曰端公李勉也勉為御史中丞大厯中出為廣州刺史亦以兵討玠李肇國史補曰御史相呼為端公守職甚昭煥變通迫脅地謀畫焉得算王室不肯微凶徒略無憚此流須卒斬神器資强幹夢符曰右按道德經天下神器不可為也為者敗之執者失之又西都賦州郡之豪傑五都之貨殖三選七選充奉陵邑蓋以强幹弱枝隆上都而觀萬國也扣寂豁煩襟皇天照嗟嘆師曰言李公不肯令王室之微必斬臧玠以斡正神器亦使凶徒少有憚畏扣寂言以詩發寂默而豁煩悶之懷冀皇天有以知之也聶耒陽以僕阻水書致酒肉療饑荒江詩得代懷興盡本韻至縣呈聶令陸路去方田驛四十里舟行一日時屬江漲泊于方田鄭曰耒陽衡州屬縣補注鶴曰耒陽在衡州東南百三十五里公自衡往耒陽阻水泊于方田驛今序云陸路去方田四十里謂去耒陽也又云舟行一日蓋以泝流也聶令致酒肉或以為致牛肉白酒公因飫死為水所漂從而為空墳以欺人主雖史不能辨其非唯韓退之一詩能分明之李觀作補遺傳亦因韓退之有是詩而成耳鶴詳考公此詩其云禮過宰肥羊愁當置清醥則聶所致者未必誠牛肉白酒也詩終云崔師乞巳至澧卒用矜少問罪消息真開顔憩亭沼則是時方且喜討叛之詩已集而憩於亭沼蓋知凶渠之亡可待序云至縣呈聶令者存至耒陽以與之後人往往以此遂信其為死於耒陽殊不知此後尚有過南嶽入洞庭湖詩與登舟適漢陽詩可考也二詩斷不可謂是四年作且聶致酒肉已在五年五月間蓋藏玠以四月庚子反公奔竄至衡又至方田且半旬沮水矣是時肉非可久留無容醉飽在作詩之後若詩前嘗痛飲詩中亦必及之如願以野水添金杯如澠之酒常快意喧呼且盡杯中緣但覺髙歌有鬼神等句初未嘗以醉為諱也溫公詩話云元和中其孫始改葬於鞏縣元微之為志今志乃云祔於偃師鞏與偃師又異矣後世安知又不以為惑耒陽馳尺素見訪荒江眇義士烈女家風流吾賢紹洙曰尺素書也史刺客傳聶政殺韓相自死其姊嫈伏尸哭極哀死政之旁晉楚齊衛聞之皆曰非獨政能也乃其姊亦烈女也昨見狄相孫許公人倫表師曰狄相孫指兼謨也南史孔休源為晉安王長史武帝語王曰孔休源人倫儀表當師事之兼謨善人倫風鑒許聶宰以人倫之表言聶才宜在翰林而反屈跡小縣前期翰林後屈跡縣邑小洙曰言聶之才宜在翰苑而反屈跡縣邑趙曰蔡伯世本前期作前朝其說是豈聶之父或祖嘗任翰林之職乎知我礙湍濤師曰以甫阻水也半旬獲浩溔趙曰溔以沼切大水貌謝靈運山居賦吐泉之浩溔麾下殺元戎湖邊有飛旐趙曰即臧玠殺崔瓘也潘安仁賦飛旐翻以唘路孤舟增鬱鬱僻路殊悄悄側驚猿猱捷仰羡鸛鶴矯禮過宰肥羊愁當置清醥洙曰張平子詩鬱鬱不得志詩憂心悄悄蜀都賦猿􅀈騰希而競捷又置酒髙堂觴以醥清曺子建詩烹羊宰肥牛言聶以肥羊清醥乃見於禮也鄭曰醥普沼切酒清曰醥修可曰曺子建七唘云乃有春醥酒康狄所營揚雄酒賦云其味有宜城醪醴蒼梧縹清酒也杜詩一本作清縹故兩載之人非西喻蜀洙曰唐䝉通夜郎徴發巴蜀吏卒因軍興法誅其渠帥巴蜀大驚上聞之使相如作檄以責唐䝉因喻巴蜀人非上本意之事也興在北坑趙洙曰秦將白起破趙四十餘萬軍遂降秦起悉坑之方行郴岸靜未話長沙擾洙曰時臧玠殺崔瓘長沙擾亂也補注鶴曰郴州與耒陽皆衡州之東南衡至郴四百餘里郴水入衡公避臧玠之亂初欲往郴依舅氏卒不遂其至方田也蓋泝郴水而上故曰郴岸崔師乞已至澧卒用矜少鄭曰澧里第切荆州湖名問罪消息真開顔憩亭沼洙曰聞崔侍御潩乞師于洪府師已至袁州北楊中丞琳問罪將士皆自澧上達長沙師曰郴岸靜謂衡州無恙長沙擾指玠之亂崔潩乞師于洪府師已至袁州北楊子琳將士又自澧州達長沙故甫得以開顔而喜叛徒見擒也補注杜詩卷十六
