body:
  text: 補注杜詩巻三十二宋黄希原本黄鶴補注季秋蘇五弟纓江樓夜宴崔十三評事韋少府姪三首大厯二年作補註鶴曰詩云峡險江驚急樓髙月逈明又云星落黄姑渚秋辭白帝城當是在䕫州作大􅍓二年峡險江驚急樓髙月逈明一時今夕㑹萬里故鄉情蘇曰梁里起故園萬里之情星落黄姑渚蘇曰蜀記黄恵女下巫峡聞兒亡乃悲泣累日而止於水湄世號其地曰黄姑渚秋辭白帝城老人因酒病堅坐㸔君傾明月生長好浮雲薄漸遮悠悠照逺塞洙曰月賦升素質之悠悠悄悄憶京華蘇曰陸雲春来客思酷憶京華世事悄悄可憂也清動盃中物洙曰陶淵明詩天運茍如此且盡杯中物晉樂廣傳嘗有親客久閉不復来廣問其故答曰前在坐䝉賜酒方欲飲見杯中有蛇意甚惡之旣飲而疾於時河南㕔事壁上有漆弓畫作蛇廣意盃中蛇即角影乃復置酒於前謂客曰酒中復有所見否答曰所見如初廣乃告其所以客醒然意解沉疴頓愈髙随海上查洙曰事見查上覔張騫註不眠瞻白兎洙曰劉孝綽月詩攅柯半玉蟾植叢映玉兎拾遺記𤣥州之南以水精為月瑤為兎刻百過落烏紗洙曰烏紗帽也對月那無酒登樓况有江聽歌驚白鬢笑舞拓秋忩樽蟻添相續洙曰子建七啟盛以翠樽酌以雕觴浮蟻鼎沸酷烈馨香沙鷗竝一雙盡憐君醉倒更覺片洙曰作我一心降洙曰詩我心則降送孟十二倉曹赴東京選大厯二年作補註鶴曰唐志太宗時以嵗旱榖貴東人選者集於洛州謂之東選洛即東京也殆是自此為例故至大厯年間猶然通典兩漢有倉曹吏主倉庫唐京兆河南太原三府置倉曹叅軍事各二人餘各一人公大厯元年至䕫嘗與孟倉曹兄弟往還賦孟氏好兄弟是也此當在二年作君行别老親此去苦家貧藻鏡留連客夢符曰按晉太康四年制曰藻鏡銓衡尹曰藻鏡猶藻鑒也故子美上韋左相詩又有持衡留藻鑒之句又唐舊史許子儒長夀中為天官侍郎子儒居選部不以藻鏡為意委令史句直以心腹注官之次子儒髙枕而卧時云句直平配道路以為口實江山憔悴人蘇曰張湛長江逺山供愁眼具兄解作憔悴與解人秋風楚竹冷夜雪鞏梅春補註希曰䕫屬楚地東都河南府有鞏縣故云朝夕髙堂念應宜綵服新慿孟倉曹將書覔土婁舊莊大厯二年作補註鶴曰公有先墓在河南喪又有莊墅土婁河南地名也詩云平居亂後不到洛陽岑又云十載江湖客茫茫遲暮心案公以乾元戊戌冬往洛陽明年春晚歸華州至大厯二年丁未為十年是年作平居喪亂後不到洛陽岑為厯雲山問無辭荆棘深北風黄葉下南浦白頭吟洙曰文君作白頭吟夢符曰按楚詞予交手兮東行送美人兮南浦波滔滔兮來迎魚鱗鱗兮媵予十載江湖客茫茫遲暮心耳聾大厯二年作補註鶴曰詩云黄落驚山樹呼兒問朔風當是大厯二年秋晚作生年鶡冠子黄曰袁淑真隠傳曰鶡冠子者楚人隠居深山中衣敝履穿以鶡為冠莫測其名因服成號著書言道家事馮諼甞師之後顯於趙鶡冠子懼其薦巳遂與之絶鶡者勇雉也歎世鹿皮翁洙曰見遣興但訝鹿皮翁註眼復㡬時暗耳從前月聾猿鳴秋淚缺雀噪晩愁空黄落驚山樹呼兒問朔風師曰鶡冠子隠人也常居深山耳聾謂妻子曰吾免為巢由洗清溪耳鶡者勇雉也其鬬無已一死乃止故趙武靈王為冠以表武士是詩所謂鶡冠非武士所冠盖名異實同爾小園大厯二年作補註鶴曰園即瀼西果園詩云秋庭風落果瀼岸雨頽沙當是大厯二年在瀼西作由來巫峽水本自楚人家客病留因藥春深買為花秋庭風落果瀼岸雨頺沙問俗營寒事將詩待物華自瀼西荆扉且移居東屯茅屋四首大厯二年補註鶴曰公以大厯二年秋移居東屯當是其年魯訔年譜亦云白鹽危嶠北赤甲古城東平地一川穏髙山四面同烟霜凄野日秔稻熟天風人事傷蓬轉吾将守桂叢洙曰劉安招隠桂樹叢生兮山之幽東屯復瀼西一種住青溪來往兼茅屋淹留為稻畦市喧宜近利洙曰西居近市易巽近利市三倍林僻此無蹊洙曰曺子建欲還絶無蹊若訪衰翁語須令賸客迷道北馮都使髙齋見一川子能渠細石吾亦沼清泉枕帶一作席還相似柴荆即有焉斫畬應費日夢符曰按荆楚多畬田先縦火熂爐候經雨下種厯三嵗土脉竭不可復樹藝但生草木復熂旁山唐劉禹錫適連州畬田行云何處好畬田團團縵山腹鑚龜得雨卦上山燒卧木又云下種暖灰中乗陽坼牙蘖蒼蒼一雨後苕穎如雲發爾雅一嵗曰菑二嵗曰新三嵗曰畬易曰不菑畬皆音餘畬田凡三嵗不可復種盖取畬之義也熂音餼燹火燎草也爐音盧火燒山界也補註希曰太𤣥經文首曰雕韯之文徒費日也解纜不知年牢落西江外參差北户間久逰巴子宅鄭曰寰宇記䕫子國後為楚所滅至秦分為巴郡卧病楚人山幽獨移佳境清深隔逺闗寒空見鴛鷺迴首想朝班洙曰謝靈運安排徒空言幽獨賴鳴琴思𤣥賦幽獨守此側陋題栢大兄弟山居屋壁二首大厯二年作補註鶴曰詩云叔父朱門貴郎君玉樹髙則栢大乃貞節之猶子栢之子姪除官者多而柏大兄弟方且精典籍於山居則其尤賢也當是大厯二年作叔父朱門貴洙曰郭景純朱門何足榮郎君玉樹髙補註希曰古稱貴人之子及身嘗事其父者曰郎君故藩鎮之子曰郎君又續仙傳韋子威師事丁約一日辭去謂子威曰郎君得道尚隔二塵山居精典籍文雅渉風騷江漢終吾老雲林得爾曹哀絃繞白雪夢符曰按宋玉對楚襄王問曰客有歌郢中者其始下里巴人國中屬和數千人其為陽春白雪國中屬而和者數十人而巳又文選鮑昭蜀琴抽白雪郢曲繞陽春尹曰哀絃琴也記曰絲聲哀哀以立廉廉以立志君子聽琴瑟之聲則思忠義之臣琴錄曰琴曲有幽蘭白雪風入松烏夜啼俗人非知音者故未可與之撡未與俗人操野屋流寒水山籬帶白雲静應連虎穴喧已去人羣筆架霑忩雨書籖映隙曛籖子亷切蕭蕭千里馬洙曰詩蕭蕭馬鳴漢文却千里馬箇箇五花文暝大厯二年作補註鶴曰詩云日下四山隂山庭嵐氣侵又云牛羊歸徑險鳥雀聚枝深當是大厯二年在瀼西作日下四山隂山庭嵐氣侵洙曰謝靈運夕曛嵐氣侵牛羊歸徑險洙曰詩牛羊下來北征賦日晻晻其将暮覩牛羊之下來鳥雀聚枝深正枕當星劒收書動玉琴半扉開燭影欲掩見清砧洙曰星劒劒上有星文也玉琴以玉為琴徽也茅堂檢校收稻二首大厯二年作補註鶴曰公在䕫事種稻故耕於東屯瀼西俱有茅屋故移居東屯茅屋云東屯復瀼西一種住青溪來往兼茅屋淹留為稻畦今云香稻三秋末當是大厯二年瀼西作盖是年秋末又自東屯反瀼西也香稻三秋末平田百頃間喜無多屋宇幸不礙雲山御裌侵寒氣洙曰秋興賦藉莞蒻御裌衣鄭曰裌古洽切複衣嘗新破旅顔紅鮮終日有玉粒未吾慳夢符曰按文選尺爐重尋桂紅粒貴瑤瓊李善云戰國䇿曰蘓秦之楚三月乃得見王談卒辭行楚王曰先生不逺千里而臨寡人寡人曽弗肯臨願聞其説對曰楚國食貴於玉薪貴於桂謁者難見於鬼王難見於帝今臣食玉炊桂因鬼見帝其可得乎稻米炊能白秋葵煮復新誰云滑易飽老藉軟俱勻種幸房州熟苖同伊闕春補註希曰房州唐屬山南道與䕫州同一道所種稻之種盖自房州如禾譜所載洪州早及太平州稻禾名品是也伊闕縣屬河南府公有莊墅在河南故云苖同伊闕無勞映渠盌自有色如銀黄曰魏文車渠椀賦車渠玉屬也多纎理縟文生於西國其俗寳之推二儀之普育何萬物之殊形料珍恠之上美無兹椀之獨靈苞華文之光麗發浮彩而揚榮理交錯以連屬似将離而復并又梁陸倕蠡盃銘曰用邁羽杯珍逾渠椀實同蠡側形均樸滿廣雅云車渠石次玉朝二首大厯元年作補註鶴曰詩云清旭楚宫南又云巫山冬可恠昨夜有奔雷當是大厯元年䕫州作公有雷詩云巫峡中宵動滄江十月雷盖其時也清旭楚宫南趙曰清旭清朝也江賦視雰祲於清旭楚宫則楚王之宫也霜空萬嶺含野人時獨往雲木曉相參㑓鶻無聲過饑烏下食貪蘓曰晁錯仰看飛鳥無聲而過者㑓鶻乾噪而下者饑烏病身終不動蘇曰西方妙華尊者國王三召不來使人又召曰如不來王當斬爾尊者曰斬即斬吾身終不動王聞而異之加禮焉搖落任江潭帆浦晨初發郊扉冷未開趙曰善本作浦帆帆音去聲今韻書亦收矣言方晨朝之際想江浦之中其帆起發而郊居之家以寒冷而未開其扉也村踈黄葉墜野静白鷗來礎潤休全濕洙曰江淹山雲潤柱礎夢符曰按淮南子山雲蒸柱礎潤雲晴欲半迴巫山終可怪昨夜有奔雷晚大厯元年作補註鶴曰詩云杖藜尋晚巷炙背近牆暄又云朝廷問府主耕稼學山村當是大厯元年䕫州作杖藜尋晚巷炙背近牆暄洙曰嵇康書野人有快炙背而美芹子者欲獻之至尊雖有區區之意亦已踈矣人見幽居僻吾知拙養尊朝廷問府主耕稼學山村歸翼飛棲定寒燈亦閉門洙曰曺子建歸鳥赴喬林翩翩厲羽翼陸士衡願假歸鴻翼翻飛㳺江汜夜二首大厯元年作補註鶴曰詩云號山無定鹿又云甲兵年數久賦斂夜深歸當是大厯二年䕫州作白夜月休弦燈花半委眠號山無定鹿落樹有驚蟬暫憶江東鱠洙曰張翰憶鱸魚兼懷雪下船洙曰王子猷乗舟訪戴逵蠻歌犯星起重洙曰一作空覺在天邉城郭悲笳暮村墟過翼稀甲兵年數久賦斂夜深歸暗樹依巗落明河繞塞微斗斜人更望月細鵲休飛洙曰樂府月明星稀烏雀南飛東屯月夜大厯二年作補註鶴曰大厯二年秋公自瀼西移居東屯當是其年作抱疾漂萍老防邊舊榖屯春農親異俗嵗月在衡門青女霜楓重黄牛峽水喧洙曰曉霜楓葉丹青女霜神名補註希曰公在羈旅之中猶能屯榖以防邊可見憂國之深矣韋元成傳使得自安衡門之下師古曰衡門謂横一木於門上貧者之所居也峽州夷陵有黄牛峽南岸髙崖間有色如人牽牛人黒牛黄北岩旣髙加以江湍紆回行者謠曰朝發黄牛暮宿黄牛三朝三暮黄牛如故泥畱虎鬭跡月挂客愁村喬木澄稀影輕雲倚細根數驚聞雀噪暫睡想猿蹲日轉東方白風來北斗昏蘓曰漢元帝七月有塵埃大風自北來北斗為之昏天寒不成寐無夢寄歸魂東屯北崦於騐切大厯二年作補註鶴曰公以大厯二年秋移居東屯今詩云看松霜滴身正其時作也又云戰地有黄塵盖是年吐蕃冦邠州靈州靈州奏破吐蕃二萬盜賊浮生困誅求異俗貧空村唯見鳥落日未洙曰一作不逢人洙曰登樓賦白日忽其西匿鳥相鳴而舉翼原野閴其无人征夫行而未息歩壑風吹靣看松露滴身逺山迴白首戰地有黄塵雲大厯二年作補註鶴曰詩云収穫辭霜渚分明在夕岑當是大厯二年東屯作龍以洙曰一作自瞿唐㑹江依白帝深終年常起峽每夜必通林收穫辭霜渚分明在夕岑髙齋非一處秀氣豁煩襟月大厯二年作補註鶴曰詩云四更山吐月殘夜水明樓當是在䕫州作而梁權道編在大厯二年四更山吐月趙曰費昶省中聞𢷬衣詩丹墀吐明月殘夜水明樓沈曰詩第二句側入謂之正格如此句謂之偏格唐名輩詩多用正格杜詩用偏格者十無二三余曰王直方詩話云子美此二句才力富健塵匣元開鏡趙曰庾信鏡詩玉匣聊開鏡信用之於鏡而公則以比月為二矣風簾自上鈎洙曰月詩纎纎似玉鈎娟娟若娥眉謝𤣥暉詩風簾入雙燕趙曰陳蕭詮詩珠簾半上珊瑚釣補註鶴曰公以鏡比月非特此如縁空一鏡升滿目飛明鏡是也然今施之殘月則非故曰元開鏡隔簾見月如簾有鈎曽不因人故曰自上觀元與自二字見公體切用字之妙兎應疑鶴髮蟾亦戀貂裘趙曰上句公自言其老下自言其貧鶴髮老者之狀庾信竹杖賦子老矣鶴髪雞皮又蘇季子黒貂裘斟酌姮娥寡天寒奈九秋洙曰見九秋驚雁字尹曰後漢天文志註張昭載靈憲之言曰月隂精之宗積而成獸象免隂之類其數耦其後有慿焉者羿請不死之藥於西王母其妻姮娥竊之以犇月将徃枚筮之於有黄占之曰吉翻翻歸妹獨将西行逢大晦茫母驚母恐後且大昌姮娥託身於月是名蟾蜍春秋元命包云陽氣成於三故一時三月陽氣終於九故三月一時凡九十日九秋以九十言獨坐二首大厯二年作補註鶴曰詩云白狗斜臨北黄牛更在東當是䕫州詩又云水花寒落岸山鳥暮過庭必在東屯作竟日雨冥冥雙崖洗更青補註希曰雙崖謂瞿塘兩崖也公有詩云雙崖壮此門是水花寒落㟁山鳥暮過庭煖老須燕玉洙曰唐寧王有煖玉盃以為飲器不煖而自熱趙曰燕玉婦人也古詩云燕趙多佳人美者顔如玉待燕玉而煖則孟子所謂七十非人不煖也充饑憶楚萍洙曰家語楚昭王渡江有一物大如斗圓而赤取之以問孔子曰此何物也可剖而食吾昔過陳聞童謠曰楚王渡江得萍實大如斗赤如日剖而食之甜如蜜胡笳在樓上哀怨不堪聽洙曰晉劉疇避亂為賈胡欲害疇援笳而吹之作出塞之聲以動其歸思羣胡皆啼哭而走白狗斜臨北田曰水經註秭歸白狗峡蜀江中流兩面如削絶壁之際隠出白石如狗形状具足故以名焉黄牛更在東洙曰黄牛山在縣北四十五里周回五十里髙三十一里盛𢎞之荆州記曰黄牛山有重嶺疊起其最大髙崖間有石色如人負刀牽牛人黒牛黄其状分明此崖如之江湍迃回行經信宿猶尚望見行者歌曰朝發黄牛暮宿黄牛一朝一暮黄牛如故今黄牛峽山下有廟曰洛川王土人云黄牛神也張無盡天角讃曰壮哉黄牛有大神力輦聚巨石百千萬億劍㦸牙齒磥硊江側壅激波濤險不可測威脅舟人駭怖失色刲牲釃酒千載廟食峽雲常照夜江日㑹兼風曬藥安垂老應門試小童夢符曰按荘子子貢往見原憲憲華冠縦履杖藜而應門亦知行不逮苦恨耳多聾雨四首大厯二年作補註鶴曰詩云髙軒當灔澦又云神女花鈿落雖是䕫州詩今以柴扉臨野碓半濕搗香秔朔風鳴浙浙物色嵗将宴等句當是大厯二年冬瀼西作微雨不滑道斷雲踈復行紫崕奔處黒白鳥去邊明秋日新霑影趙曰以雨之故日影朦朧為霑影矣寒江舊落聲柴扉臨野碓鄭曰都内切舂也半濕搗香秔洙曰搗一作我趙曰音庚稻也江雨舊無時天晴忽散絲趙曰古詩宻雨如散絲暮秋霑物冷今日過雲遲上馬迴休出㸔鷗坐不辭髙洙曰一作層軒當灔澦鄭曰寰宇記灔澦堆在䕫州西南二百歩蜀江中心瞿塘峡口冬水淺屹然露二百餘尺夏水漲沒水中十丈其状如馬舟人不敢進潤色静書帷物色嵗将晏天隅人未歸朔風鳴淅淅洙曰謝𤣥暉淅淅就衰材謝恵連淅淅振條風寒雨下霏霏補註鶴曰楚辭渉江雲霏霏而承宇文選廣絶交論曰烟霏雨散李善註引陸機賦云騰烟霧之霏霏多病久加飯趙曰古詩上膳加飡飯衰容新授衣時危覺凋喪一云喪亂故舊短書稀楚雨石苔滋京華消息遲山寒青兕呌江晚白鷗饑神女花鈿落洙曰宋玉有神女賦夢符曰按唐志命婦之服兩博鬢飾以寳鈿金花也趙曰神女廟在巫山山中花即神女所以為鈿者被雨而落鮫人織杼悲洙曰江賦鮫人搆館於懸流吳都賦云泉客潜織而巻綃注泉客鮫人也織輕綃於泉室出於市間賣之繁憂不自整終日灑如絲戯寄崔評事表姪蘇五表弟韋大少府諸姪大厯元年補註鶴曰詩云泥多仍徑曲心醉阻賢羣又云髙樓憶踈豁秋興坐氤氲當是大厯元年居西閤時作隠豹深愁雨洙曰謝𤣥暉雖無𤣥豹姿終隠南山霧定功曰劉向列女傳陶荅妻謂其夫曰妾聞南山有𤣥豹霧七日不下食何也欲以澤其衣毛而成文章故蔵以逺􅊣也潜龍故起雲洙曰易潜龍无用又雲從龍泥多仍徑曲心醉阻賢羣洙曰中説心醉六經忍待江山麗趙曰言忍以待春景也還披鮑謝文洙曰鮑昭謝𤣥暉髙樓憶踈豁秋興坐氤氲有感五首廣徳元年補註鶴曰此詩五首其一言将帥俱受賞而使吐蕃者乃不歸其二言河北未盡服而討吐蕃者猶不巳其三言河南雖平而盜賊不可不慮其四言藩鎮為􅊣而封建不可不守其五言胡滅之後諸将多疑皆廣徳初亊而梁權道編在大厯二年然是時吐蕃未嘗留使不應有乗槎消息斷之句此殆是指李之芳廣徳元年使吐蕃為虜所留二年乃得歸也詩又云受鉞親賢往卑宫制詔遥亦指雍王适廣徳元年為元帥而言第五首云胡滅人還亂兵殘将自疑雖指史朝義滅後僕固懐恩以疑貳而叛亦是廣徳中亊而未云願聞哀痛詔端拱問瘡痍意是廣徳元年巳後逐時有感而作非止成於一時將帥䝉恩澤兵戈有嵗年至今勞聖主何以報皇天白骨新交戰雲臺舊拓邊乗槎斷消息無處覔張騫趙曰言新戰之兵方横白骨将軍必有意於柘邉而功未立其在雲臺畫像議功者則是舊拓邊之功也遣使吐蕃未還所以用張騫乗槎為喩補註鶴曰舊史廣徳元年七月吐蕃大冦河隴陥我秦成渭三州入大震闗䧟廓河鄯洮岷等州盜有隴右之地通鑑亦云廣徳元年七月吐蕃入大震闗䧟廓河鄯洮等州盡有隴右之地唐自武徳以來開拓邉境地連西域皆置府州縣禄山反後鳯翔以西邠州以北皆為左袵當時戰争之地宜多白骨向來拓邉之人以功畫像雲臺而今乃開其釁端連城入冦追咎旣往誰當任責故有雲臺舊拓邉之句乃所以深致其感也通鑑又云廣徳元年遣御史大夫李之芳等使吐蕃為虜所留二年乃得歸是詩必作於元年或二年之春故云乗槎消息斷幽薊餘蛇豕洙曰為史思明未平也趙曰左傳曰吳為封豕長蛇荐食上國餘蛇豕於幽薊則今嵗廣徳元年正月史朝義雖滅而未有臣服者乾坤尚虎狼洙曰盜賊充斥也諸侯春不貢洙曰藩鎮擅命基兆於此使者日相望洙曰董仲舒傳漢家使者冠盖相望慎勿吞青海洙曰見君不見青海頭注趙曰戒之以無事於西羌無勞問越裳洙曰見越裳翡翠無消息注趙曰戒之以無事於東夷大君先息戰歸馬華山陽洙曰書武成歸馬於華山之陽示天下弗復用也洛下舟車入天中貢賦均洙曰周禮天官惟王建國註周公營邑於土中使居洛邑治天下謂之地中天地之所告也四時之所交也風雨之所㑹也隂陽之所和也然則百物阜安乃建王國焉趙曰言史朝義既滅道路亦不阻絶故舟車入而貢賦均此指言長安特用洛陽為天地之中而貢賦均焉為譬也日聞紅粟腐洙曰文帝太倉之粟紅腐而不可食寒待翠華春洙曰翠華天子車葢趙曰言賜予幣帛之厚實翠華之春和氣所及也上林賦曰建翠華之旗盖天子之旗也莫取金湯固洙曰賈誼金城湯池帝王萬世之業王元長䇿金湯非粟不守長令宇宙新趙曰荘子䟽云掲天地以趨新負山岳以捨故宇宙新則一洗乾坤而其命維新矣不過行儉徳盜賊本王臣蘓曰邵輝曰今盜賊蜂起皆吾王之臣修徳不臻之所致丹桂風霜急青梧日夜彫由來强榦地洙曰西都賦强榦弱枝隆上都而觀萬國未有不臣朝趙曰丹桂耐風霜之物青梧易彫之物此引下句譬榦之强壮則枝無勝榦之理猶主强而臣自歸服也受鉞親賢往卑宫制詔遙洙曰分茅列土親賢並建親賢同姓也時代宗為帥趙曰兵鉞者授之以節而使之受所以為元帥也寳應元年代宗既即位五月以雍王适為天下兵馬元帥舊註謂代宗為帥却是肅宗時矣補註鶴曰按舊史代宗紀寳應元年四月奉節郡王适為天下兵馬元帥五月進封魯王廣徳元年改封雍王而徳宗紀云代宗即位之年五月為天下兵馬元帥改封魯王八月改封雍王自為異同通鑑又以為寳應元年十月為元帥卑宫之詔盖以諸将侈其居第嘗下詔禁止之故云終依古封建洙曰封爵建國豈獨聽簫韶洙曰書簫韶九成趙曰勸朝廷非特任元帥而巳終當以封建之制待夫親賢而為天子者豈獨聴簫韶之樂宴樂而巳乎胡洙曰一作盜滅人還亂兵殘将自疑洙曰此詩言安史既平而僕固懐恩反側也登壇名絶假洙曰漢髙祖設壇拜韓信為大将軍髙祖曰大丈夫定諸侯即為真王耳何以假為趙曰髙祖以韓信為大將登壇而拜之名絶假則真拜之非特假節而已言諸将䝉寵如此故責以下句之報主也舊注引韓信欲為假王非其義報主洙曰一作執玉爾何遲領郡輒無色之官皆有詞願聞哀痛詔洙曰見忽聞哀痛詔注端拱問瘡痍洙曰時縉紳皆重内官而不樂外任故子美有無色有詞之譏也夜大厯二年作補註鶴曰詩云嶺猿霜外宿江鳥夜深飛又云烟塵繞閶闔盖大厯二年在䕫州作以是年九月甲寅吐蕃冦靈州乙夘冦邠州子儀屯於洷陽京師戒嚴故云絶岸風威動洙曰蕪城賦菊䓶風威寒房燭影微嶺猿霜外宿江鳥夜深飛蘓曰王詠云深夜飛江鳥言鳥夜深飛無安栖處子美逢亂世漂轉因用此語獨坐親雄劒哀歌嘆短衣洙曰哀歌嘆短衣事見寗戚不及骭之嘆也以為朝服則非烟塵繞閶闔白首壮心違逺逰大厯三年作補註鶴曰詩云塵沙連越嶲風雨暗荆蠻當是大厯三年在荆南作是年吐蕃兩入冦梁權道編在二年䕫州詩内若在䕫州不應首句云江濶浮髙棟雲長出斷山又云鴈矯銜蘆内江濶浮髙棟雲長出斷山塵沙連越嶲夢符曰按唐地理志劍南道盖古梁州之域蜀郡廣漢犍為越嶲益州牂柯巴郡之地㧾為鶉首趙曰以吐蕃之兵未息也補註晞唐志巂州越巂郡至徳二載已後及大厯二年七月九日吐蕃兩宼靈州故云風雨暗荆蠻鴈矯銜蘆内洙曰淮南子曰鴈從風而飛以愛氣力銜蘆而飛以避矰繳張華賦又矯翼而増逝徒銜蘆以避繳終為戮於此世猿啼失木間洙曰見哀哀失木猿注敝裘蘇季子厯國未知還洙曰見貂餘季子裘注從驛次草堂復至東屯二首大厯二年作補註鶴曰題云復至則是大厯二年自東屯歸瀼西後也公自東屯歸瀼西嘗有詩云東屯復瀼西一種住青溪來往兼茅屋淹留為稻畦而此詩云山險風煙合天寒橘柚垂當是其年冬作峡裏歸田客洙曰恨賦欲通抵見罷歸田里江邉借馬騎洙曰語有馬者借人乗之非尋戴安道洙曰見山隂詩似向習家池洙曰見玉琬騮詩注山險風煙合天寒橘柚垂洙曰蜀都賦户有橘柚之逺築場看斂積洙曰豳詩十月築場圃一學楚人為短景難髙卧洙曰秋興賦何微物之短晷謝𤣥暉詩髙卧猶在兹衰年强此身山家蒸栗暖野飯射麋新洙曰玉色如蒸栗趙曰左傳射左麋鹿鼉鼉者麋背之髙處也世路知交薄門庭畏客頻蘇曰陸抗家貧畏客過門牧童斯在眼田父實為隣蘇曰黄起云編帙作友田夫為隣全勝薄宦泊沒於市㕓塵土間暫往白帝復還東屯大厯二年作補註鶴曰公以大厯二年秋居東屯此詩當作於其時復作歸田去洙曰見峡裏歸田客注猶殘穫稻功築場憐穴蟻洙曰詩十月穫稻又九月築場圃拾穂許村童趙曰以見公之不殘不吝拾穂詩遺秉滯穂伊寡婦之利落杵光輝白除芒子粒紅加飡可扶老趙曰古詩上言加飡飯扶老扶吾身之老也補註希曰淵明歸去來辭䇿扶老以流憩倉廪慰飄蓬晨雨大厯二年作補註鶴曰詩云麝香山一半亭午未全分當是在䕫州作梁權道編在大厯二年小雨晨光内初來葉上聞霧交纔灑地風逆旋随雲暫起柴荆色輕霑鳥獸羣洙曰語鳥獸不可與同羣麝香山一半鄭曰寰宇記云麝香山在縣南一百一十里亭午未全分洙曰天台賦義和亭午天池大厯二年作補註鶴曰詩云直對巫山出則池在䕫州又云九秋驚雁序萬里狎漁翁更是無人處誅勞任薄躬當是大厯二年在瀼西作天池馬不到洙曰天池山上池也嵐壁鳥纔通蘓曰宋玉望岳詩嵐壁立萬仞鳥逕人莫通百頃青雲抄曽波白石中洙曰楚辭眇視目層波詩白石磷磷鬱紆騰秀氣洙曰陸士衡紆鬱㳺子情蕭瑟浸寒空直對巫山出洙曰一作峡兼疑夏禹功魚龍開闢有菱芡古今同洙曰一作豐聞道奔雷黒趙曰選賦電檄雷奔初看浴日紅洙曰日出於暘谷浴於咸池飄零神女雨洙曰髙唐賦暮為行雨斷續楚王風洙曰宋玉賦楚㐮王㳺於雲臺之宫有風颯然而至王乃披襟當之欲問支機石如臨獻寳宫洙曰見自徒獻寳朝何宗九秋驚鴈序洙曰曺子建丹唇含九秋南都結九秋之増傷萬里狎漁翁洙曰一作樵童蘓曰黄霸休官求隠人問其故霸曰吾欲挐輕舟適浩蕩狎漁翁與鷗爾更是無人處誅勞任薄躬反照大厯二年作補註鶴曰詩云反照開巫峡又云牛羊識童僕既夕應傳呼當是大厯二年在瀼西作反照開巫峡寒空半有無已低魚復暗洙曰魚復縣名補註鶴曰魚復浦與白鹽山皆在夔州夔古魚國魚復之名本此舊史云奉節縣漢魚復縣屬巴郡今縣北三里赤甲城是也不盡白鹽孤洙曰白鹽山名荻岸如秋水松門洙曰地名似畫圖蘓曰稽山景物竒秀王逸少云過松門如在畫圖中牛羊識童僕既夕應傳呼向夕大厯二年作補註鶴曰詩云畎畝孤城外江村亂水中當是大厯二年在瀼西作畎畝孤城外江村亂水中深山催短景喬木易髙風洙曰嘯賦清颷振乎喬木蘓曰喬木易得髙風余曰古今詩話云如此二句了無瑕纇含蓄深美殆不可模倣鶴下雲汀近雞栖草屋同琴書散明燭長夜始堪終曉望大厯二年作補註鶴曰詩云荆扉對麋鹿應共爾為羣又云髙峯寒上日當是大厯二年在東屯作白帝更聲盡陽臺曙色分趙曰白帝者白帝城也陽臺則宋玉為陽臺也髙峰寒上日疊嶺宿霾雲蘓曰仇輝疊嶺霾雲長江激浪地坼江帆隠蘓曰樂廣曰地坼山摧國有大恐天清木葉聞荆柴對麋鹿應共爾為羣覃山人隠居大厯二年作補註鶴曰公嘗作南極青山衆盖指夔州而言今因覃山人在夔州居故詩云南極老人自有星亦因其在南之極而言大厯二年作南極老人自有星趙曰老人星一名南極在井栁之中乃南方之星今覃山人隐居此地自是南極老人星也北山移文誰勒銘洙曰齊書孔稚圭周彦倫隠鍾山後應詔出稚圭作北山移文其文云馳驛烟路勒移山庭徴君巳去獨松菊洙曰陶潜為徴君歸去來云松菊猶存補註鶴曰徵君之名起於漢矣黄憲郭林宗黔婁庾乗等傳皆云魏胡昭隠管寧傳亦云豈獨見於陶潜也哀壑無光留户庭洙曰殷仲文哀壑叩虛予見亂離不得已蘇曰蘓嶷謂嵇康子與登肥遯宜其時也予兒女滿眼又值亂離不得已而返車塵埃中非吾素所願也子知出處必須經髙車駟馬帯傾覆洙曰揚䧺解嘲云客徒欲朱丹吾轂不知一跌赤吾之族悵望秋天虛翠屏洙曰天台賦聳壁立之翠屏柏學士茅屋大厯二年作補註鶴曰唐有𢎞文集賢翰林學士此稱學士者雖未詳為何人意必前所謂栢大兄弟也雖然以學士而居茅屋又且讀書萬巻亦可知其賢矣従舊次為大厯二年作碧山學士焚銀魚蘇曰張襃梁天監中不供學士職御史欲弹劾襃曰碧山不負吾乃焚章長嘯而去白馬却走身巗居尹曰光武臨朝或有惰容張湛輒陳諫其失湛常乗白馬帝毎見曰白馬生且復諫古人已用三冬足洙曰東方朔三冬文史足用年少今開萬巻餘洙曰今一作曽見讀書破萬巻註晴雲滿户團傾盖洙曰鄒陽傾盖如故冠盖若浮雲秋水浮堦溜決渠洙曰張景陽堦下伏泉通階上水衣生陸士衡豐注溢修霤黄潦侵堦除雲隂結不解通衢化為渠冨貴必從勤苦得蘇曰徐陵見弟姪讀書陵指其書語人曰人之冨貴必從此勤苦而得男兒須讀五車書洙曰荘子天下篇恵施多方其書五車大厯二年九月三十日補註鶴曰詩云年年小搖落不與故園同盖在東屯也為客無時了悲秋向夕終瘴餘䕫子國洙曰魚復古夔子國霜薄楚王宫洙曰楚王逰蘭䑓之宫草敵虚嵐翠花禁冷葉紅年年小搖落不與故園同蘓曰同素塞上行云八月嚴霜邉岸白風霜豈與故園同隂鏗云秦川風物異不與故園同十月一日大厯二年作補註鶴曰詩云夜郎溪日暖白帝峡風寒當是大厯二年在東屯作有瘴非全歇為冬亦不難趙曰時已十月矣而瘴尚未全歇所以為冬候之難也夜郎溪日暖洙曰夜郎西南夷也犍為有夜郎溪白帝峡風寒蒸裹如千室洙曰後漢賛峡俗以蒸裹為節物補註希曰道家有北斗經本出於蜀經云裹蒸則是物盖蜀之土風所尚公特拘聲律遂轉一字耳今江南亦有名裹蒸者信微物皆有所從燋糟洙曰一作糖幸一柈夢符曰按元微之詩雜蓴多剥膳和羮半蒸菰此與蒸裹無異燒糟皆荆楚所同者柈與盤同趙曰以糖為正蒸裹燋糖皆十月一日之事如此兹辰南國重舊俗自相歡戯作俳諧體遣悶二首鄭曰俳音排大厯元年作補註鶴曰俳諧謂俳優詼諧也詩云西厯青羌坂南留白帝城盖大厯元年公初至䕫州時作恠其習俗之異而記之故首云異俗吁可恠異俗吁可恠斯人難並居家家養烏鬼鄭曰養去聲薛曰按沈存中筆談峡中人謂鸕鷀為烏鬼以䋲繫其頸使之捕魚此説非也楚人信巫以為烏鬼耳田曰元楨詩曰病賽烏稱鬼巫占瓦代龜註南人染病競賽烏鬼楚巫列市悉賣瓦卜此在元楨長慶小集所謂註則楨有註也蘓曰䕫州圖經稱峡中人謂鸕鷀為烏鬼蜀人臨水居者皆養鸕鷀繫其頸使之捕魚得魚則倒提出之至今如此或言居人相率十百為曺設牲酒於田家衆操兵杖羣噪而祭烏蠻鬼言烏蠻戰死者多與人為厲嵗以此禳之余曰冷齋夜話云川峡路民多供事烏蠻鬼以臨江故頓頓食黄魚耳俗人不解便作養畜字讀遂使沈存中自差以烏鬼為鸕鷀也師曰按沈存中筆談峡中人謂鸕鷀為烏鬼以䋲繫其頸使之捕魚此説非也楚人信巫以烏為鬼耳元楨詩曰病賽烏稱鬼巫占瓦代龜註南人染病競賽烏鬼楚巫列肆悉賣瓦卜夢符之說是養當讀為供養之養補註鶴曰魯靈光殿賦吁可畏也其駭人乎此用其語烏鬼有四説曰鸕鷀曰豬曰老烏曰烏蠻鬼耳沈存中筆談黄朝英緗素雜記胡元受叢話曰鸕鷀馬永卿懶直錄漫叟詩話曰豬蔡夫詩話程泰之演繁露吳虎臣漫錄曰老烏神洪覺範冷齋夜話邵公濟聞見錄嚴敦常藝苑雌黄曰烏蠻鬼余嘗評之若是養鸕鷀與豬則未為異俗可恠當是飬鬼無疑杜田與師註引元楨之説在可取頓頓食黄魚鮑曰按爾雅註鱣大魚似鱏而短口在頷下邪行無鱗内黄大者長二三丈江東呼為黄魚故公詩云脂膏兼飼犬長大不容身豈有如此大魚可以鸕鷀為捕者則知烏鬼乃烏蠻鬼耳舊識難為態新知巳暗踈洙曰楚辭樂莫樂兮新相知治生且耕鑿只有不闗渠洙曰峡俗養烏頭鬼祭之似人趙曰交態之態也難與之態則其薄矣楚辭曰樂莫樂於新相知而至於已暗踈則其樂又可知故欲耕鑿耳不與薄俗相闗西厯青羌坂鄭曰水經註江水遙巫峡過青𦍑山坂南留白帝城於莵侵客恨鄭曰莵同都切虎名洙曰於一作榖宣四年初若敖娶於䢵生闘伯比若敖卒從其母畜於䢵滛於䢵子之女生子文焉䢵夫人使棄諸夢中虎乳之䢵子田見之懼而歸夫人以告遂使之楚人謂乳榖謂虎於莵故命之曰闘榖於莵其女妻伯比實為令尹子文粔籹作人情蒼舒曰宋玉招䰟云粔籹蜜餌有餦餭粔籹以蜜和米煎作之蘓曰張黔送友人粔籹錫糍粔籹今糖餅蜀人呼粔籹鄭曰粔其吕切籹尼吕切瓦卜傳神語洙曰巫俗撃瓦觀其文理分析以定吉㐫謂之瓦卜夢符曰按元微之詩病賽烏稱鬼巫占瓦代龜畬田費火聲洙曰一作耕史記食貨傳火耕水耨田曰楚俗燒榛種田曰畬先以刀芟治林木白斫畬其刀以木為柄刃向曲謂之畬刀劉禹錫畬田行何處好畬田子美夔府詠懐又云燒畬度地偏是非何處定髙枕笑浮生趙曰風俗不同是非焉有定但付之一睡而已刈稻了詠懐大厯二年作補註鶴曰詩云稻穫空雲水川平對石門寒風踈草木旭日散雞豚當是大厯二年初冬作是年九月十月吐蕃入冦故又云野哭初聞戰稻穫空雲水川平對石門洙曰南都賦縁以創閣阻以石門趙曰此乃夔州詩而言石門乃下篇雙崖壮此門也舊引蜀都賦阻以石門舊註云石門在漢中之西豈於䕫州事哉非是寒風踈草木旭日散雞豚洙曰孟子雞豚狗彘野哭初聞戰樵歌稍出村無家問消息作客信乾坤瞿塘兩崖大厯二年作補註鶴曰詩云羲和冬馭近愁畏日車飜當是大厯二年秋晚作三峡傳何處雙崖壯此門補註希曰公作長江云瞿塘争一門又作瞿塘懐古詩云勍敵兩崖開盖瞿塘乃三峡之門又兩崖對峙中貫一江望之如門也入天猶石色趙曰兩靣壁立而髙挿天穿水忽雲根趙曰雲根亦以言石猱玃鬚髯古鄭曰玃許縳切摶也補註希曰爾雅猱蝯善援釋曰猱一名蝯又玃父善顧釋曰大猨也能玃持人善顧眄郭云貑貜也似獮猴而大色蒼黑蛟龍窟宅尊洙曰江賦瑰竒之所窟宅羲和冬馭洙曰一作驂近洙曰天台賦羲和亭午愁畏日車飜趙曰淮南子註日乗車駕以立龍羲和為之馭公以山之髙故日去之近李尤歌曰安得壮士飜日車栁司馬至大厯二年作洙曰此詩言中原用兵民未安居也補註鶴曰詩云有使歸三峡相過問兩京函闗猶出将渭水更屯兵當是大厯二年作是年九月十日京師以吐蕃入冦兩戒嚴故云有使歸三峽相過問兩京洙曰兩京雍洛函闗猶出将洙曰尹喜見老子於函闗渭水更屯兵洙曰文王得吕望於渭濱設備邯鄲道洙曰漢文帝謂慎夫人曰此北走邯郸道和親邏些洙曰一作逤城鄭曰邏力优切逤西箇切夢符曰按邏逤作邏些薛仁貴為邏逤道行軍揔管城在吐蕃中修可曰邏些吐蕃都城名也唐舊史吐蕃本南京秃髪之後語訛謂之吐蕃其國都城號為邏些城屋皆平頭貴人處於大氊帳為佛廬新唐史云吐蕃號君長曰賛普春跋布川或邏娑川姑蘓及蜀本杜詩作邏逤惟歐陽文忠公本作邏些當是舊史為正趙曰出将屯兵與夫設備和親皆因吐蕃而然也幽燕惟鳥去趙曰北地猶不通豈以安史雖滅而蕃鎮相繼跋扈也商洛少人行衰謝身何補蕭條病轉嬰洙曰劉公榦余嬰沉疴疾霜天到宫闕戀主寸心明孟冬大厯元年作補註鶴曰此詩當是大厯元年作是年秋多雨七月洛水溢今故有暫喜息蛟螭之句是冬史書無雪所以又云寒薄而瘴随梁權道編在二年殊俗還多事趙曰公中原人而流落巴夔故指為殊俗方冬變所為破甘霜落爪嘗稻雪翻匙巫岫寒都薄趙曰楚地煖故也烏蠻洙曰一作黔溪瘴逺随鄭曰梁益記嶲州嶲山其地接諸蠻部有烏蠻秋蠻終然減灘瀨暫喜息蛟螭洙曰南都賦惮夔龍兮布蛟螭趙曰水盛滿則蛟螭横既冬則水日落可以暫息蛟螭之憂悶大厯元年作補註鶴曰詩云瘴癘浮三蜀當是大厯元年作是年冬無雪瘴癘所宜浮也瘴癘浮三蜀風雲暗百蠻趙曰此䕫州詩而言三蜀百蠻盖夔在三蜀之下百蠻之北巻簾唯白水隠去聲几亦青山猿㨗長難見洙曰淮南子置猿檻中非不巧㨗鷗輕故不還洙曰南越志勃海中有鷗随潮上下無錢從滯客有鏡巧催顔雷大厯元年作補註鶴曰此詩當是大厯元年作是冬無雪愆陽常燠故十月而雷龍蛇不蟄巫峡中宵動滄江十月雷洙曰陸士衡迅雷中宵激驚電光夜舒龍蛇不成蟄洙曰易乾龍蛇之蟄以存信也天地劃争迴劃呼麥切却碾空山過深蟠絶壁來何須妬雲雨霹靂楚王臺趙曰宋玉髙唐賦言神女云朝為行雲暮為行雨朝朝暮暮陽臺之下而今也雷之不時若妬神女而霹靂以震之也冬至大厯二年作補註鶴曰詩云江上形容吾獨老又云杖藜雪後臨丹壑當是作於大厯二年時在瀼西年年至日長為客忽忽窮愁泥殺人泥乃計切江上形容吾獨老洙曰屈原放於澤畔形容枯槁天涯洙曰一作天邉風俗自相親洙曰陸士龍修路無窮迹并邑自相循百城各異俗千里是良隣歡舊難假合風土豈虚親杖藜雪後臨丹壑鳴玉朝來散紫宸洙曰西征賦飛翠綏拖鳴玉以出入禁門者衆矣心折此時無一寸洙曰别賦使人意奮神駭心折骨驚路迷何處見洙曰一作是三秦洙曰項羽立三秦王小至大厯元年作補註鶴曰詩云岸容待臘将舒栁山意衝寒欲放梅當是大厯元年作是年冬暖故云天時人事日相催冬至陽生春又來夢符曰按玉燭寳典禮夏至小正十有一月王狩又沈約宋書曰魏晉冬至日受萬國及百寮稱賀因小㑹其儀亞於嵗朝甫稱小至當謂是也或曰陽為大隂為小冬至隂極故曰小至孝經援神契曰冬至陽氣萌刺繡五紋添弱線吹葭六琯動浮灰洙曰續漢書以葭莩灰實律之端按厯者候之氣至則灰飛而通以六律也鄭曰刺七迹切補註希曰史記刺繡紋不如倚市門紋上添五字以對六琯亦由線有五色故云岸容待臘將舒栁山意衝寒欲放梅雲物不殊鄉國異洙曰左傳分至啟閉以書雲物教兒且覆掌中杯舍弟觀赴藍田取妻子到江陵喜寄三首補註鶴曰詩云朱紱即當随綵鷁青雲不假報黄牛又云巡簷索共梅花笑冷蘂踈枝半不禁當是大厯二年冬作明年正月果出峡汝迎妻子達荆州消息真傳解我憂鴻鴈影來連峡内洙曰古詩弟兄鴻鴈序鶺鴒飛急到沙頭洙曰詩鶺鴒在原載飛載鳴補註希曰江陵乃古荆州唐志云本荆州南郡沙頭地名亦在江陵今為要市燒闗險路今虗逺修可曰燒闗當作嶢闗音堯在峡右漢書曹參從髙祖西攻嶢闗住在洛北藍田武闗之西以觀赴藍田故云尹曰嶢闗在上洛北藍田南武闗之西漢髙祖紀秦王子嬰誅趙髙遣将将兵據嶢闗禹鑿寒江正穏流洙曰江漢巴東之峡夏后䟽鑿朱紱即當随綵鷁青春不假報黄牛馬度洙曰一作瘦秦山雲正深北來肌骨苦寒侵他鄉就我生春色故國移居見客心歡劇提攜如意舞洙曰一云王戎好作如意舞諸葛亮出軍常以鐡如意指麾喜多行坐白頭吟洙曰文君作白頭吟巡簷索共梅花笑冷蘂踈枝半不禁庾信羅含俱有宅黄曰庾信因侯景之亂自建康遁歸江陵居宋玉故宅宅在城北三里羅含為桓温别駕以廨舍喧擾於江陵城西三里小洲上立茅屋而居布衣蔬食晏如也師曰庾信宅即宋玉故宅見送李功曹之荆州詩注余知古諸宫政事羅含為桓温别駕以廨舍喧擾於江陵城西三里小洲上立茅屋伐木為牀織葦為席而居布衣蔬食晏如也後安成王在鎮以其宅借錄事劉朗之見一丈夫衣冠甚偉水矜而立朗之驚問忽然失之人謂含有神補註鶴曰以廨舍喧擾至晏如也自是晉書本傳語唐地理志江陵有府一曰羅含因羅含居江陵因以名府也九域志亦云宋玉宅庾信所居春來秋去作誰家短墻若在從殘草喬木如存可假花卜築應同蔣詡徑洙曰三輔決錄蔣詡舍下竹下惟開三徑羊仲求仲從與之㳺為園須似邵平瓜洙曰邵平種瓜美故世謂之邵平瓜比年洙曰一作因病酒開涓滴弟勸兄酬何怨嗟䕫州歌十絶句大厯二年作補註鶴曰此詩言䕫州景物而及瀼西東屯當是大厯二年夏作故詩云雲日如火炎天凉中巴之東巴東山趙曰水經劉漳分三巴有中巴有巴西有巴東補註鶴曰唐志䕫州為巴東郡故云猶言巴東郡在中江之東也江水開闢流其間白帝髙為三峽鎮䕫州險過百牢闗洙曰三峡瞿塘巫山黄牛也蘇曰辛毗曰夔州百牢闗兵馬不可越宋曰十道志梁州有百牢闗師曰說者以子美上牢下牢修水闗之句謂瞿塘之險百倍於上牢下牢之闗此説非也圖經云百牢闗孔明所建故基在今興元西縣泥口化檢玉觀山下傍臨白馬河東自梁洋北自武興西入金牛三泉皆渉北河以濟河之西兩壁山相對六十里不斷蟠䝉漢江水流其間與白馬河合縁江乃入金牛益昌路也雖不甚險而為入川之溢口補註希曰䕫州境内有三峡山謂西峡巫也白帝即白帝城山亦在䕫州今云鎮者正如周禮職方氏所謂河南曰豫州其山鎮曰華山之類辛毗雖云夔州百牢闗兵馬不可入然此云䕫州險過百牢闗則闗不在䕫矣當是如宋引十道志師引圖經在興元府也白帝䕫州各異城洙曰公孫述自稱白帝故䕫有白帝城蘓曰風俗記曰白帝城據有牢至夔州十里補註鶴曰九域志夔州有白帝城山水經云白帝山北縁馬嶺接赤甲山其間平處南北相去八十五丈東西七十丈東傍瀼西即以為隍後漢初公孫述據蜀自以承漢土運故曰白帝城今云各異域者當是白帝故城與今夔州城為異蘓註非蜀江楚峽混殊名英䧺割據非天意蘓曰武侯曰英䧺鼎立割據土疆誠非天意霸主并吞在物情羣䧺競起向前朝趙曰指言巳前之代也王者無外見今朝洙曰公羊傳曰天王出居於鄭王者無外此其言出何不能於母弟也東都賦子徒識函谷之可閉不知王者之無外比訝漁陽結怨恨洙曰漁陽禄山舊鎮趙曰禄山以怨恨起兵於漁陽元聽舜日舊簫韶趙曰此明皇時太平為虞舜之時時明皇寵幸禄山每與之宴未嘗不奏霓裳之曲此句含蓄美中有刺如此赤甲白鹽俱刺天刺七迹切洙曰南都賦森尊二而刺天蘓曰裴宗曰白鹽挣空赤甲刺天峡浪洶湧鳥道盤紆補註鶴曰寰宇記奉節縣三十里有赤甲城是舊魚復縣基又云赤甲城公孫述築不生樹木土石悉赤如人袒臂故曰赤甲與舊白帝城相連白鹽山見前註九域秦州至夔州有白鹽山赤甲城刺天言其髙也閭閻繚繞接山巔楓林橘樹丹青合洙曰蜀都賦家有鹽泉之井户有橘柚之園西京雜記中南山有樹直上百丈無枝上結叢條如車盖葉一青一赤望之班駁如錦繡長安謂之丹青樹蘓曰阮季行南埭上曰紅楓綠橘如丹青相合補註希曰唐志夔州户有橘故橘樹之多可以入詠髙帝紀從複道上如淳曰複音復上下有道故謂之複複道重樓錦繡懸趙曰言其華麗也瀼東瀼西一萬家孫曰瀼奴朗切夔有澗水出於山谷之間謂之瀼溪人居其左右謂之瀼東瀼西江北江南春冬花背飛鶴子遺瓊蘂趙曰魏王粲白鶴賦食靈岳之瓊蘂相趂鳬雛入蔣牙洙曰其草則蒋蒲葭又云其沃瀛則有攅蒋叢蒲東屯稻畦一百頃北有澗水通青苖修可曰夔有平田號青苖陂晴浴狎鷗分處處洙曰孫綽詩物我俱㤀懐可以狎鷗鳥雨随神女下朝朝洙曰髙唐賦朝朝暮暮陽臺之下蜀麻吴鹽自古通萬斛之舟行若風長年三老長謌裏洙曰峡人謂操舟人為長年三老師曰峡人以船頭把篙相水道者曰長年正稍曰三老白晝攤錢髙浪中田曰梁冀傳能意錢之戯註何承天纂文曰詭憶一日射意一日射數即攤錢也趙曰蜀人賭錢名補註鶴曰江鄰㡬雜志引此詩作白馬灘前髙浪中公詩有白馬江之句又有登白馬潭詩又刮州有白馬山巴州有白馬穴如鄰幾所引當是夔有此灘名憶昔咸陽都市合趙曰指長安也山水之圖張賣時蘓曰郭秀過巫峡愛十二峯立馬乆之嘆曰吾昔年貢山水圖疑其妄粧景色今日親見勝彼圖十八九矣巫峡曽經寳屏見楚宫猶對碧峯疑閬風𤣥圃與蓬壺鄭曰酈元水經註崑崙之山三級二曰閬風一曰𤣥圃中有高堂天下無洙曰南都賦崑崙無以侈閬風不能踰趙曰其上臺觀皆金玉故曰天下無借問䕫州壓何處峡門江腹擁城隅武侯祠堂洙曰一作生祠不可忘中有松柏參天長洙曰見丞相祠堂何處尋錦官城外柏森森孔明廟前有老柏黛色参天二千尺詩干戈滿地客愁破雲日如火炎天凉雨大厯元年作補註鶴曰按舊史大厯元年正月丁已六則是初八日為甲子史又云自春旱至月庚子始雨却與唐諺合公是時在雲安其年十一月甲子日長至方改為大厯元年若大厯二年甲子在正月十三日而立春巳在元年十二月二十六七無容謂甲子雨已度立春時也新史差一年冥冥甲子雨洙曰楚辭雷填填兮雨冥冥已度立春時趙曰兩句憂之之辭也唐諺云春雨甲子赤地千里補註鶴曰或云春甲子雨乗船入市則與唐諺為異然此詩之意正以唐諺而憂也故接以輕箑纎絺之句輕箑煩相向洙曰秋興賦於時乃屏輕箑註所甲反扇也蘇曰和用夏夜蚊雷足煩輕箑呉人俗呼扇為箑纎絺恐自疑洙曰秋興賦釋纎絺註絺葛也公言扇可相向則纎絺疑其可著矣烟添纔有色風引更如絲洙曰張景陽騰雲似湧烟宻雨如散絲直覺巫山暮洙曰髙唐賦妾在巫山之陽暮為行雨兼催宋玉悲洙曰宋玉悲秋奉送蜀州柏二别駕將中丞命赴江陵起居衛尚書太夫人因示從弟行軍司馬位補註鶴曰梁權道編在大厯二年䕫州作然詩云楚宫臘送荆門水白帝雲偷碧海春當是元年嵗晚作二年柏已去夔乃崔卿攝郡矣中丞當是柏貞節詳見前註中丞問俗畫熊頻洙曰漢制刺史車畫熊於軾愛弟傳書綵鷁新洙曰見朱紱随綵鷁註遷轉五州防禦使起居八座太夫人洙曰後漢制六曹尚書并令僕二人謂之八座魏以五曹尚書二僕射合為八座宋與魏同隋以六尚書左右二僕射合為八座唐與同漢文紀註列侯妻稱夫人列侯死子復為列侯乃得稱太夫人子不為列侯則否補註洙曰舊史地理志夔州貞觀十四年為都督府督歸夔忠萬涪渝南七州天寳元年改為雲安郡至徳元載於雲安置七州防禦使乾元元年復為夔州二年刺史唐論請升為都督府故公初至䕫有代柏都督謝上表又有陪柏中丞宴將士詩送田四舍弟将夔州柏中丞命起居江陵節度衛公詩則中丞即都督五州當是七州傳有訛舛也後漢岑彭傳大長秋以朔望問太夫人起居衛伯玉廣徳元年拜江陵羣牧防禦節度使尋加檢校工部尚書封陽城王其母加鄧國太夫人以其檢校尚書故也柏二别駕乃中丞之弟故云愛弟傳書楚宫臘送荆門水白帝雲偷碧海春與報恵連詩不惜洙曰謝恵連乃靈運之弟知吾斑鬢揔如銀洙曰秋興賦斑鬢彪以承弁素髪䬃以垂領補注杜詩巻三十二
