body:
  text: 補注杜詩卷二十六宋黃希原本黃鶴補注寄董卿嘉榮十韻廣德二年作補注鶴曰詩云犬羊曾爛熳宫闕尚蕭條當是廣德二年作公時在成都蓋是年春自閬歸草堂而今詩云秋天憶射鵰聞道君牙帳防秋近赤霄洙曰曹子建關中詩髙牙乃建牙大旗也兵家書牙旗將軍之旗立於元帥帳前故謂之牙旗補注鶴曰唐志佛堂一百八十里至勃令驛鴻臚館至贊普牙帳赤霄言三城之髙也髙適謂邈在窮山之巔是也下臨千雪嶺洙曰西山記曰上有積雪經夏不消却背五繩橋洙曰岷江湍急不可為梁乃以竹橋駕虛而渡鄭曰即岷江笮橋海內久戎服洙曰用兵日久京師今晏朝洙曰漢明帝論日晏坐朝幽枉必達趙曰以前日用兵之久而今日罷兵則可以晏朝也犬羊曾爛熳洙曰應劭曰鮮卑隔在漠北犬羊為羣宫闕尚蕭條洙曰孫子荆書四海蕭條非復漢有趙曰以吐蕃為患之久故前日嘗陷京師今尚蕭條猛將宜嘗膽洙曰李陵書猛將如雲越王勾踐反國苦身勞思置膽於坐坐卧即仰膽飲食亦嘗膽曰汝忘㑹稽之恥耶趙曰猛將指董嘉榮也龍泉必在腰洙曰見三尺獻龍泉詩注黃圖遭汚辱洙曰天子圖籍也趙曰有三輔黃圖之書言宫殿名號與京畿地理也月窟可焚燒洙曰長楊賦西壓月窟又言月窟雖髙猶可燒之也蘇曰吳術曰大丈夫按劒橫行沙塞取月支之首焚其竁窟章炳壯其言薦為游擊將軍趙曰指言吐蕃巢穴也㑹取干戈利趙曰此戒董卿之辭干戈利取書敿乃干穀乃戈之義無令斥候驕洙曰西域傳斥候百人五分之夜擊刁斗自衛趙曰無令其驕則號令嚴肅也斥候兵家探候也居然雙捕虜洙曰後漢世祖建武四年拜馬武捕虜將軍顯宗初西羌寇隴西覆軍殺將朝廷患之復拜武捕虜將軍自是一嫖姚洙曰霍去病為嫖姚校尉落日思輕騎蘇曰何斌輕騎數百轉戰至日暮斬馘擒酋首秋天憶射鵰修可曰北史斛律金子光見一大禽射之正中其頸形如車輪而下乃鵰也邢豫髙嘆曰此射鵰手也人號為落鵰都督雲臺畫形像洙曰見雲臺終日畫注皆為掃氛妖洙曰掃氛妖言能靖患亂也趙曰所以激昂董卿也漢雲臺畫二十八將之像以其有功掃氛妖也寄司馬山人十二韻廣德二年作補注鶴曰詩云關內昔分袂天邊今轉蓬當是廣德二年未歸成都作關內昔分袂洙曰謝惠連詩飲餞野亭館分袂澄湖隂天邊今轉蓬洙曰曹子建詩轉蓬離本根驅馳不可說蘇曰劉韻曰年來驅馳不可與子細說恐子心折談笑偶然同道術曾留意先生早擊蒙洙曰蒙卦家家迎薊子洙曰後漢方術傳葪子訓有神異之道到京師公卿巳下候之者坐上常數百人皆為設酒酺終日不匱後因遁去遂不知所止處處識壺公洙曰費長房傳市中有老翁懸一壺於肆頭及市罷輒跳入壺中市人莫之見長房於樓上覩之異焉因往再拜長嘯峨嵋北潛行玉壘東洙曰江賦峨嵋為泉陽之揭玉壘作東别之標曾曰潛行言晦迹也補注希曰壺公詳見真人謝元三洞神仙記峨嵋山有嘉州今曰嘯其北則山人嘗至眉雅玉壘山在茂州今曰行其東則山人嘗至彭綿有時騎猛虎虛室使仙童髮少何勞白梅曰此以下甫自嘆也顔衰肯更紅望雲悲轗軻洙曰陶潛詩望雲慙飛鳥臨水愧遊魚畢景羡冲融洙曰謝希逸賦餘景就畢洙曰言司馬養和氣如陽春也喪亂形仍役蘇曰徐邈喪亂之際形役心勞趙曰陶淵明云既自以心為形役淒涼信不通懸旌要路口趙曰史記云搖搖懸旌無所終薄倚劒短亭中修可曰宋玉賦云倚長劒兮天外康曰懸旌倚劒言屯戍之兵以防寇盜永作殊方客殘生一老翁相哀骨可換亦遣馭清風洙曰莊子云列子御風而行冷然善也寄李十四員外布十二韻廣德二年作洙曰新除司議郎兼萬州别駕雖尚伏枕已聞理裝補注鶴曰詩云正是炎天闊當是廣德二年夏在草堂作故又云悶能過小徑自為摘嘉蔬名參漢望苑洙曰漢博望苑武帝為戾太子置之使通賓客從其所好職述景題輿洙曰周景為豫州刺史辟陳蕃為别駕蕃不就景題别駕輿曰陳仲舉坐也巫峽將之郡荆門好附書趙曰預囑其不相忘也逺行無自苦蘇曰王粲逺行異域無勞自苦事事慎重內熱比何如洙曰內熱言熱中也莊子我其內熱歟正是炎天闊那堪野館疏黃牛平駕浪洙曰黃牛峽名郭景純髙浪駕蓬萊畫鷁上淩虛修可曰張平子西京賦鷁首注云船頭畫鷁鳥厭水神試待盤渦歇洙曰郭璞江賦盤渦谷轉淩濤山頽趙曰水漲則有盤渦今勸其且休行故曰待盤渦歇方期解纜初洙曰江淹解纜候前侣還望方鬱陶悶能過小徑自洙曰一作日為摘嘉蔬洙曰陶淵明歡言酌春酒摘我園中蔬趙曰自此以下約李員外訪其居也渚柳元幽僻村花不掃除宿隂繁素㮏洙曰潘安仁間居賦素㮏丹白之色過雨亂紅蕖洙曰紅蕖蓮花寂寂夏先晚泠泠風有餘江清心可瑩洙曰郭景純詩前有寒泉井聊可瑩心神竹冷髮堪梳堪一作宜直作移巾几秋帆發敝廬夢符曰按春秋左氏張躍謂太叔曰自子之歸也小人糞除先人之敝廬師曰黃牛峽浪髙與峽齊故云平駕浪畫鷁船也上淩虛謂船逆水而上如淩虛空盤渦言水洄洑如碾碓然甫意欲待峽水稍平穩即解纜訪李故末章又云直作移巾几秋帆發弊廬歸來廣德二年作補注鶴曰詩云門開野鼠走帙散壁魚乾當是廣德二年初歸草堂時作客裏有所過洙曰一作適歸來知路難趙曰此篇敘其久往東劉而歸也門開野鼠走帙散壁魚乾洙曰謝𤣥暉詩陵澗尋我屋散帙問所知定功曰壁魚白魚也俗傳壁魚入道經函中因蠧食神仙字則身有五色人得而吞之可致神仙沈曰郭璞注衣書中蟲今人謂之壁魚洗杓開洙曰一作斟新醖低頭拭小盤洙曰一云著小冠憑誰給麴糵洙曰書若作酒醴爾惟麴糵細酌老江干洙曰干涯也趙曰司空飲酒詩開君一壺酒細酌對春風王録事許修草堂資不到聊小詰寶應元年作補注鶴曰此詩梁權道編在閬州歸後作今觀詩云昨屬愁春雨能忘欲漏時而公廣德二年暮春方歸不應詩乃云爾當是寶應元年未歸綿州時作為嗔王録事不寄草堂資昨屬愁春雨能忘欲漏時寄卭州崔録事廣德二年作補注鶴曰詩云應愁江樹逺怯見野亭荒當是廣德二年歸在草堂作又云聞在果園坊坊在成都城中公為徐卿覔桃栽亦云崔時在府中卭州崔録事聞在果園坊洙曰坊名在成都久待無消息終朝有底忙應愁江樹逺洙曰謝𤣥暉詩中流辨江樹怯見野亭荒洙曰謝惠連詩飲餞野亭館浩蕩風煙外誰知酒熟香過故斛斯校書莊二首老儒艱難病於庸蜀嘆其沒後方受一官補注鶴曰斛斯即斛斯六乃草堂之鄰公所謂酒伴者詩云此老已云歿鄰人嗟未休廣德二年作此老巳云沒鄰人嗟未休竟無宣室召洙曰文帝召賈誼於宣室徒有茂陵求洙曰謝𤣥暉詩廣平聽方籍茂陵將見求司馬相如病免家居茂陵天子曰司馬相如病甚可往從悉取其書所忠往而相如巳死無遺書問妻對曰長卿未嘗有書也時時著書人又取去長卿未死時為一卷書曰有使來求書奏之其遺札言封禪事天子異之妻子寄他食園林非昔遊空餘繐帷在洙曰謝𤣥暉詩繐帷飄井幹儀禮鄭注凡布細而踈者謂之繐趙曰繐帷靈帳也淅淅野風秋燕入非傍舍趙曰燕仍入其舍鷗歸秪故池斷橋無復板卧柳自生枝洙曰池館依舊而人不見也趙曰梁孝威詩卧柳尚還生遂有山陽作洙曰見贈王侍御契詩注多慙鮑叔知洙曰鮑叔與管仲交貧則知其困而容之達則知其賢而舉之管仲曰生我者父母知我者鮑叔素交零落盡洙曰劉孝標絶交論斯賢達之素交歷萬古而一遇素交盡利交興謝靈運萬事俱零落白首淚雙垂立秋雨院中有作李泰伯曰此詩在嚴武書院中作補注鶴曰題曰院中又詩云暮齒借前籌當是嚴公奏為參謀在幕中作按公有院中晚晴懷西郭茅舍詩又有正月三日歸溪上簡院內諸公則當時指帥屬公廨為院故院中晚晴云院中一作使院李泰伯指為嚴武書院恐非山雲行絶塞大火復西流洙曰張景陽詩大火流坤維夢符曰按左傳哀十二年冬十二月螽仲尼曰丘聞之火復而後蟄者畢今火猶西流司歷過也又爾雅云大火謂之大辰注大火心也飛雨動華屋蕭蕭梁棟秋洙曰謝𤣥暉詩朔風吹飛雨蕭條江上來既灑百常觀復集九城臺窮途愧知巳趙曰指嚴鄭公也暮齒借前籌洙曰張良願借前箸以籌之趙曰言其晚年而得嚴府參謀也巳費清晨謁希聲曰甫言日過武㕔謀府事那成長者謀趙曰又自謀之辭解衣開北戶髙枕對南樓樹濕風涼進江喧水氣浮禮寬心有適趙曰言嚴公待以寬禮節爽病微瘳趙曰時節清爽公素有肺疾惟氣爽則少蘇也主將歸調鼎吾還訪舊丘洙曰主將謂嚴公也言公還朝秉政日吾當遂歸計也鮑明逺詩去鄉三十載復得還舊丘補注希曰鼎鉉三公之任侯霸為司徒嚴子陵遺之書曰君房位至鼎足是也公期嚴武歸處公相之任而巳遂託以歸鄉也公京兆人所以云舊丘軍城早秋嚴武作昨夜秋風入漢關朔雲邊雪滿西山更催飛將追驕虜洙曰漢胸奴號李廣為飛將莫放沙場匹馬還洙曰吐蕃常入積石軍取麥哥舒翰殺之隻馬無還修可曰春秋僖公公羊云匹馬隻輪無返者奉和廣德二年作補注鶴曰嚴武以廣德二年九月敗吐蕃於當狗城十月克吐蕃鹽川城此詩和其軍城早秋則是其年七月作秋風嫋嫋動髙旌洙曰九歌嫋嫋兮秋風髙旌旌旗也玉帳分弓射虜營蘇曰賀若弼征可汗夜分徑弓射虜營皆破繼而追殺大捷趙曰帳大將軍之帳補注希曰抱朴外篇軍在太乙玉帳之中不可攻也巳收滴博雲間戍趙曰滴博城名雲間戍以言其髙也欲奪蓬婆雪外城洙曰滴博蓬婆皆西山地名趙曰蓬婆吐蕃城名以其逺在雪山之外補注鶴曰滴博西山城名雲間以言其髙也公所謂轉粟上青天而髙適所謂窮山之巔是也蓬婆乃吐蕃城名故云欲奪按唐書吐蕃傳蕭升杜希望王昱分道碎赤嶺碑昱以劒南兵入攻安戎城築二少壘左右之兵次蓬婆嶺輸劒南粟餉軍院中晚晴懷西郭茅舍廣德二年作院中一云使院補注鶴曰詩云幕府秋風日夜清當是廣德二年秋作又云浣花溪裏花饒笑肯信吾兼吏隱名明年果歸溪上幕府秋風日夜清洙曰武帝拜霍去病大將軍於幕府中故號幕府也淡雲疏雨過髙城葉心朱實堪時落洙曰劉越石朱實隕徑風繁英落素秋階面青苔先自生洙曰沈休文詩賔除緑錢滿客位紫苔生復有樓臺銜暮景不勞鐘鼓報新晴浣花溪裏花饒笑肯信吾兼洙曰一作今吏隱名洙曰公嘗為嚴公參謀故云吏隱趙曰汝南先賢傳鄭欽吏隱於蟻陂之陽到村廣德二年作補注鶴曰詩云老去參戎幕當是廣德二年秋作碧澗雖多雨洙曰謝𤣥暉詩銅陵映碧澗石磴瀉紅泉補注希曰碧澗紅泉乃靈運題華子岡詩非𤣥暉今在建昌軍麻源第三谷秋沙先洙曰又云亦鄭曰先先見切後也少泥蛟龍引子過荷芰逐花低老去參戎幕趙曰為劒南節度參謀也歸來散馬蹄洙曰曹子建詩俯身散馬蹄稻梁須就列洙曰為貧而仕也榛草即相迷趙曰言離草堂而入使院則榛草反相迷也蓄積思江漢洙曰蓄積猶鬱以瀉其鬱結爾頑疏惑町畦洙曰嵇康云匪降自天實由頑疏町畦隴畝也蒼舒曰南華真經人間世篇曰彼且為無町畦亦與之無町畦趙曰思歸也暫酬知巳分還入故林栖洙曰王正長人情舊鄉客鳥栖思故林蘇曰鹿岑曰山野性豈能拘祿仕旦夕即還故林單栖一枝私心足矣趙曰知巳謂嚴武言既酬報知已之分乃遂歸故林宿府廣德二年作補注鶴曰詩云清秋幕府井梧寒當是廣德二年秋在府中作清秋幕府井梧寒洙曰梧桐也趙曰魏明帝詩雙梧生枯井獨有江城蠟炬殘永夜角聲悲自語中天月色好誰看蘇曰李固邊角風急永夜無寐時唯自語鄭當時中天月色皎潔故人流落千里不知渠與誰看也風塵荏苒音書絶關塞蕭條行路難已忍伶俜十年事洙曰伶俜猶零丁也流落貌強移栖息一枝安洙曰莊子言鵬鷃事而云鷦鷯巢於深林不過一枝以其性各有極茍足其極則不知其所以然矣遣悶奉呈嚴公二十韻廣德二年作蘇曰嚴武在蜀對客多聘筆札甫醉曰不謂嚴挺之有此兒武怒甫徐曰我乃杜審言孫擬捋虎鬚爾合坐大笑彌縫之武曰與公等言何至上及祖考乎深銜之甫歸草堂遂有此詩補注鶴曰公歸溪上在永泰元年正月三日而此詩云清秋鶴髮翁則是入幕未久便有此作若武果銜之不應復留許久考公入幕後詩多不樂處幕中然此後與嚴武同賦詩尚多武死公猶惓惓益知注第因史有是言云耳豈真東坡之言哉此詩作於廣德二年秋白水魚竿客清秋鶴髮翁洙曰鶴髮言老也趙曰庾信作賦子老矣鶴髮雞皮胡為來幕下秖合在舟中洙曰言體性疏散止可與漁樵為偶不當為幕客也黃卷真如律大臨曰言詩書以禮法繩人青袍也自公洙曰詩自公退食大臨曰言不卑小官也老妻憂坐痺卑利切幼女問頭風平地專欹倒分曹失異同趙曰言其散秩在府中所坐之曹不專其事而分之不知為異為同也補注希曰漢食貨志乃分遣御史廷尉正監分曹師古曰曹輩分輩而出為吏也鶴曰此句承上坐痺頭風也言疾作則有時欹倒不辨異同也禮甘衰力就義忝上官通洙曰謂能容之於散秩也趙曰公得預府幕上官指嚴武疇昔論詩早洙曰公與嚴公先以文才相知光輝仗鉞雄洙曰仗鉞言嚴公作鎮也寬容存性拙洙曰公嘗斥嚴公父名公不以為忤翦拂念途窮洙曰謂嚴武奏請為簽謀也劉孝標絶交論顧盻增其倍價翦拂使其長鳴露裛思藤架洙曰詩厭浥行露烟霏想桂叢洙曰言身雖在幕中而嘗有山林之志信然龜觸網洙曰龜策傳預且觸網去直作鳥窺籠洙曰秋興賦池魚籠鳥而有江湖山藪之思趙曰言身雖在幕府而有懷草堂故如龜之在網鳥之在籠西嶺紆村北師曰自此句以下乃公述草堂之興而有歸休之意故末章云㑹希全物色時放倚梧桐物色言形體衰老冀保其天年遂其真性倚梧桐以自樂也南江繞舍東補注希曰舊史云於浣花里結廬枕江南江即大江山海經岷山大江所出峽山中江所出崌山北江所出今九域志資州有中江竹皮寒舊翠椒實雨新紅浪簸船應拆杯乾甕即空蘇曰蘇定戲友人曰薪盡火滅杯乾甕空藩籬生野徑斤斧任樵童洙曰自西嶺至此皆志在草堂束縛酬知巳蹉跎效小忠洙曰言性雖疏散當束縛以酬知巳年雖蹉跎不足以負任責亦當效小忠也周防期稍稍太簡遂匆匆曉入朱扉啓昏歸畫角終不成尋别業大觀曰别業指草堂也未敢息微躬烏鵲愁銀漢洙曰為填河也炎曰烏鵲填河以渡牛女甫意謂雖參幕府無以補濟故曰愁銀漢駑駘怕錦幪洙曰非其飾也㑹希全物色時放倚梧桐趙曰言如烏鵲之微力不任於填河駑駘之騫不足以被錦幪之飾所望於故人者幸全其物色而放令倚於梧桐也送舍弟頻赴齊州三首廣德二年作補注鶴曰詩云岷嶺南蠻北徐關東海西此行何日到送汝萬行啼是頻自成都赴齊州廣德二年作岷嶺孫曰岷峨也在蜀南蠻北洙曰南詔蠻也徐關東海西洙曰徐關齊地此行何日到送汝萬行啼絶域惟髙枕趙曰絶域言異方也清風獨仗藜危時暫相見衰白意都迷補注希曰列子云穆王意迷心荒風塵暗不開汝去幾時來兄弟分離苦形容老病催江通一柱觀鄭曰荆州有一柱觀土人呼為木履觀日落望鄉臺洙曰成都記隋蜀王秀所創客意長東北齊州安在哉諸姑今海畔兩弟亦山東趙曰齊州近海則是山東矣補注鶴按公作范陽太君盧氏墓志審言之女薛氏所出者適魏上瑜裴榮期盧正均皆前卒盧氏所出者適京兆王佑㑹稽賀撝㑹稽瀕於海也去旁干戈覔來看道路通短衣防戰地洙曰趙武靈王好胡服士皆短服趙曰時吐蕃未息故戎服以在防戰之地匹馬逐秋風莫作俱流落長瞻碣石鴻洙曰絶交論附麒麟於旄端軼歸鴻於碣石注海畔山也嚴鄭公階下新松得霑字作廣德二年補注鶴曰詩云移根方爾瞻細聲聞玉帳又題曰嚴鄭公當是廣德二年蓋是年正月武到成都方載詩云未見紫烟集虛蒙清露霑蓋自喻也弱質豈自負移根方爾瞻洙曰詩民具爾瞻細聲聞洙曰一作侵玉帳疏翠近珠簾未見紫烟集虛蒙清露霑何當一百丈欹蓋擁髙簷蘇曰阮瑀松賦擁髙簷碧似欹蓋嚴鄭公宅同詠竹得香字補注鶴曰當是廣德二年夏作詩云但令無剪伐㑹見拂雲長蓋諷武也明年武果死緑竹半含籜洙曰謝靈運詩初篁包緑籜新梢才出牆色侵書帙晚隂過酒樽涼雨洗涓涓靜風吹細細香但令無翦伐㑹見拂雲長洙曰此二詩公之措意極為深逺以意逆志觀者當自知矣奉觀嚴鄭公㕔事岷山沱江畫圖十韻得忘字補注鶴曰題曰嚴鄭公㕔事則是廣德二年作沱水臨中座鄭曰寰宇記在成都府新繁縣岷山赴洙曰一作對此堂洙曰江賦惟岷之導江水所出也書岷山導江今蜀縣花丘及漢中沔陽皆有沱水白波吹粉壁青嶂插雕梁直訝杉松冷兼疑菱荇香雪雲虛㸃綴沙草得微茫嶺鴈隨毫末川霓飲練光霏紅洲蘂亂拂黛石蘿長暗谷非關雨丹楓不為霜洙曰曉霜楓葉丹趙曰暗谷處非真是雨而暗丹楓非真是遭霜而丹皆以言畫也秋成洙曰一作城𤣥圃外洙曰崑崙山有𤣥圃蒼舒曰楚辭曰朝發軔於蒼梧兮夕余至乎𤣥圃注𤣥圃神山也淮南子曰崑崙𤣥圃惟絶通天景物洞庭傍洙曰洞庭湖名趙曰皆以形容其畫乃其景也繪事功殊絶幽襟興激昂從來謝太傅丘壑道難忘洙曰太傳謝安也安雖貴而東山之志不忘師曰顧長康畫鯤在石巖裏人問其故顧曰謝𤣥一丘一壑自謂過之此子宜置丘壑中又謝安寓居㑹稽與羲之支遁遊出則漁山水每往臨安山中坐石室放情丘壑及薨贈太傅晚秋陪嚴鄭公摩訶池泛舟得溪字作廣德二年魯曰池在使府內蕭摩訶所開因是得名鄭曰摩訶池即汙池也在錦城西補注鶴曰當是廣德二年作前此武尹成都未嘗涉秋也凡言秋者皆是年作湍駃風醒酒洙曰謝靈運浩浩夕流駃鄭曰駃苦夬切馬曰駃疾貌船行霧起隄髙城秋自落雜樹晚相迷坐觸鴛鴦起巢傾翡翠低莫須驚白鷺為伴宿青溪趙曰公指浣花溪陪鄭公秋晚北池臨眺新添年廣德二作補注鶴曰詩云何補參軍乏歡娛到薄躬公時在幕中也當是廣德二年作自遣悶奉呈嚴公後與之詠竹泛舟觀岷池圖及陪北池臨眺皆分韻賦詩武若銜之豈復情分還密如此不知史何所本而云北池雲水閣華館闢秋風獨鶴元依渚衰荷且映空采菱寒刺上踏藕野泥中素楫分曹往金盤小徑通萋萋露草碧片片晚旗紅杯酒霑津吏衣裳與釣翁異方初豔菊故里亦髙桐搖落關山思淹留戰伐功嚴城殊未掩清宴巳知終何補參軍乏本中曰一作事歡娛到薄躬初冬廣德二年作補注鶴曰詩云垂老戎衣窄為廣德二年十月嚴武攻吐蕃鹽川城克之公時在幕府故亦衣戎衣也是時作垂老戎衣窄洙曰垂老臨老也戎衣窄為作簽軍謀歸休寒色深趙曰時方戍防吐蕃漁舟上急水獵火著髙林日有習池醉趙曰山簡在襄陽習氏有佳園池簡日醉焉愁來梁甫吟趙曰公以諸葛自比也師曰甫云此句其志厭唐室之亂可知干戈未偃息出處遂何心正月三日歸溪上有作簡院內諸公永泰元年作補注鶴曰溪上指浣花溪也詩云白頭趨幕府深覺負平生於是不復入幕當是永泰元年野外堂依竹籬邊水向城蟻浮仍臘味洙曰酒也周庾信謝賜酒詩浮蟻對春開鷗泛巳春聲洙曰南越志鷗水鳥也在漲海中隨潮上十三月風至乃去蘇曰耿異曰門前池水巳有春色客曰如何異曰今日鷺浴鷗泛漣漪􅗷􅗷藥許鄰人斸趙曰公之不吝如此書從稚子擎趙曰言文書多任稚子也師曰子美詩有天寒斸茯苓之句言以鐵椎斸地而得之補注鶴曰種藥本以濟世故許鄰人斸收書本以教人故從稚子擎公之志趣如此與隔形骸而分爾汝者異矣白頭趨幕府深覺負平生趙曰公嘆老而猶仕耳敝廬遣興奉寄嚴公寶應元年作補注鶴曰題云敝廬遣興而詩云清依節制尊則是寶應元年武節制兩府時作也若廣德二年永泰元年春武雖俱在成都而是時正合東西川為節度使矣不應云節制梁權道不考此而編在永泰元年歸溪上後作詩又云還思長者轍恐避席為門蓋寶應元年武曾過浣花故曰還思公是時有小隊尋花到野亭之句也此詩題不曰鄭公而曰嚴公則可知矣野水平橋路春沙映竹村風輕粉蝶喜花暖蜜蜂喧把酒宜深酌題詩好細論府中瞻暇日江上憶詞源趙曰隋文藝傳云筆有餘力詞無竭源跡沗朝廷舊洙曰公仕三朝情依節制尊洙曰公之入蜀惟依嚴公節制持節專制也還思長者轍恐避席為門洙曰見寧紆長者轍注趙曰欲枉嚴公之駕故用陳平事以激之春日江村五首永泰元年作補注鶴曰詩云迢遞來三蜀蹉跎又六年又云扶病垂朱紱歸休步紫苔又云郊扉存晚計幕府愧羣才當是永泰元年歸溪上後作農務村村急洙曰農務田事春流岸岸深乾坤萬里眼時序百年心茅屋還堪賦洙曰秋興賦偃息不過茅屋茂林之下桃源自可尋艱難昧洙曰一作賤生理飄泊到如今迢遞來三蜀趙曰蜀郡廣漢郡犍為郡為三郡也蹉跎又六年洙曰又一作有趙曰公自乾元二年冬到蜀至今乾元七年凡六年矣補注鶴曰公以乾元冬入蜀至永泰元年乃六年趙注云至今乾元七年凡六年乾元安得有七年客身逢故舊洙曰得嚴公薦舉也發興自林泉過懶從衣結洙曰黃京威衣百結衣頻遊任履穿洙曰東郭先生履穿行雪中著地處皆足迹藩籬頗無限恣意向洙曰一作買江天師曰言江天恣意賞眺不費錢買也種竹交加翠栽桃爛熳紅經心石鏡月到面雪山風洙曰石鏡雪山皆蜀中故事巳見前注赤管隨王命洙曰漢官儀尚書令僕丞郎月給赤管大筆一雙公為檢校尚書工部故云赤管也銀章付老翁趙曰銀章方賜朱朱服也故次篇有垂紱之句補注鶴曰或謂上元二年冬嚴武鎮成都奏公為節度參謀檢校工部員外郎賜緋魚故有赤管銀章之句然廣德元年方以京兆功曹而不赴又上元二年已後詩未嘗言朱銀事則是廣德二年奏除即賜緋為明漢百官表凡吏秩比二千石以上皆銀印青綬師古曰漢舊儀云銀印背紐其文曰章謂刻曰某官之章唐雖無賜印者而公謂銀章因其有隨身魚而言耳豈知牙齒落蘇曰李笴有子在江南久不至語其妻曰阿陳豈知我牙齒豁落如桑榆倒景何與子相見耶名玷薦賢中扶病垂朱紱歸休步紫苔洙曰紱古蔽膝也象冕服以韋為之曹子建俯伏朱紱休沐也漢制五日一下休沐沈休文詩客位紫苔生補注希曰韋賢傳黼衣朱紱師古曰朱紱為朱裳畫為亞文也亞古弗字故因謂之紱又作黻按歐公集古録載周武王錫毛伯敦銘乃命汝赤芾同冕髙紀髙祖嘗告歸之田李斐曰休謁之名孟康曰古者名吏休假曰告今日歸休謂歸溪上郊扉存晚計洙曰顔延年側同幽人居郊扉常晝間幕府愧羣材趙曰衛青傳云開幕府蓋設幕以為府也燕外晴絲捲鷗邊水葉開蘇曰阮籍詩浴鷗開水葉戲蝶避風絲鄰家送魚鱉問我數能來羣盜哀王粲通曰王粲避亂客荆州中年召賈生趙曰文帝召賈誼至宣室補注希曰子元帝懷舊志序中年承之又謝安傳有云登樓初有作洙曰王粲在荆州思歸作登樓賦前席竟為榮洙曰賈生對文帝於宣室言鬼神事帝不覺前席宅入先賢傳洙曰先賢傳載王粲宅斗髙處士名異時懷二子春日復含情洙曰二子謂王粲賈誼也師曰昔王粲依劉表于荆州思歸作登樓賦子美在蜀依嚴武故以比之然子美以晚年得嚴武薦檢校工部比之賈生文帝前席之也補注希曰食貨志異時算軺車師古曰異時言往時也絶句六首廣德二年作補注鶴曰詩云舍下笋穿壁當是草堂作公上元元年種竹則元年與寶應二年笋未能穿壁當是廣德二年春晚自閬州歸草堂時作日出籬東水雲生舍北泥竹髙鳴翡翠沙僻舞鵾雞洙曰九辨鵾雞嘲􅑜而悲鳴趙曰公孫月賦鵾雞舞於蘭渚藹藹花蘂亂飛飛蜂蝶多趙曰江總詩黃鵠飛飛逺幽棲身懶動客至欲如何急雨梢溪足斜暉轉樹腰隔巢黃鳥並翻藻白魚跳洙曰藻水草也鑿井交棕葉開渠斷竹根扁舟輕裊纜小徑曲通村舍下笋穿壁蘇曰顧榮苦志讀書村居疏漏笋穿壁生曰惟一盂粥而手不釋卷庭中藤刺洙曰一作到刺七亦切簷地晴絲冉冉江白草纎纎江動月移石溪虛雲傍花鳥棲知故道帆過宿誰家蘇曰宋選送弟入洛登舟挂席東下選凝竚久之語經君曰帆過南浦今夜清風明月宿水涘誰家絶句四首寶應元年作補注鶴曰詩云門泊東吳萬里船以公别詩參考則泊船乃上元寶應間事又詩云因驚四月雨聲寒當是寶應元年四月作若永泰元年春公亦在草堂而四月嚴武卒公行出蜀恐非此年作蓋以笋長而别開門則未有去草堂之意也堂西長笋别開門塹北行椒却背村趙曰行椒蓋成行者梅熟許同朱老喫松髙擬對阮生論洙曰朱阮劒外相知補注希曰陸機云椒樹似茱萸葉堅而滑澤蜀人作茶吳人作茗皆合煮以為香今成臯諸山間有椒謂之竹葉椒朱老當是南鄰朱山人阮生豈阮隱居歟阮居秦州故云擬對之而論松之髙也欲作魚梁雲覆湍洙曰覆一作復鄭曰魚梁地名因驚四月雨聲寒青溪先有蛟龍窟竹石如山不敢安趙曰魚梁劈竹積石橫截中流以為聚魚之區也以溪下有蛟龍時興雲雨雖以魚梁人之所利也而公不敢犯害以就利異乎出入徑行直前惟利是謀矣兩箇黃鸝鳴翠柳補注希曰伐木詩鳥鳴嚶嚶郭云嚶嚶兩鳥鳴也一行白鷺上青天窗含西嶺千秋雪洙曰西山白雪四時不消門泊東吳萬里船趙曰公之志每欲南下其所泊於門外之船乃欲往東吳萬里之船也藥條藥洙曰一作草甲潤青青色過棕亭入草亭苗滿空山慙取譽趙曰公自喻也藥者如本草所載各以其土地知名於世根居隙地怯成形趙曰今所種之藥在空隙之地欲成似物之形而怯於人之所易見也陪李七司馬皂江上觀造竹橋即日成往來之人免冬寒入水聊題短作簡李公二首補注鶴曰梁權道編此詩在寶應元年成都作然後有詩題云李司馬橋了承髙使君自成都回則橋不在成都詩亦不在成都作甚明當是上元二年冬在蜀州作詳見後篇注伐木為橋結構同褰裳不涉往來通洙曰孫炎曰揭衣褰裳曹顔逺褰裳不足難天寒白鶴歸華表趙曰橋前二柱曰華表柱昔有白鶴集於柱上有云有鳥有鳥丁令威三千年吾其歸日落青龍見水中洙曰橋影落水中如青龍顧我老非題柱客洙曰見登橋必題柱注知君才是濟川功洙曰說命若濟巨川用汝作舟楫合歡却笑千年事驅石何時到海東洙曰秦始皇作石塘欲過海看日出處有神人能驅石下海石去不速神輒鞭之石皆流血趙曰言與賔客落橋之成而歡飲因笑往事之勞徒驅石也把燭橋成夜回舟客坐時天髙雲去盡江迥月來遲衰謝多扶病招邀屢有期洙曰謝惠連詩輟策共駢筵並坐相招邀異方乘此興樂罷不無悲趙曰公流落旅寓而不能歸所以有悲也李司馬橋了承髙使君自成都回上元二年作補注鶴曰髙適上元二年與成都尹崔光逺同平段子璋光逺以不能戢將士大掠天子怒以適代光逺故適在成都今詩云巳傳童子騎青竹總擬橋東待使君按九域志蜀州東至成都一百里則是時適守蜀為甚明矣若謂在彭州則成都在彭州之南也九域志謂南至成都九十二里此詩同上篇為上元二年作向來江上手紛紛三日成功事出羣巳傳童子騎青竹總擬橋東待使君洙曰并州小兒騎竹馬以迎郭伋使君江上值水如海勢聊短述值一作置作寶應元年補注鶴曰梁權道編在永泰元年成都詩內今考詩云新添水檻供垂釣則是初作水檻時作按公廣德二年作水檻詩云遊子久在外門戶無人持髙岸尚為谷何傷浮柱欹是公自閬州歸水檻已欹損矣今云新添當在寶應元年春作為人性僻耽佳句語不驚人死不休老去詩篇渾漫與春來花鳥莫深愁趙曰耽佳句而語驚人言其平昔如此今老矣所為詩則漫與而巳無復著意於驚人也故寄語花鳥無用深愁耳新添水檻供垂釣故著浮槎替入舟焉得思如陶謝手今渠述作與同遊見陶謝不枝梧注寄杜位洙曰位京中宅近西曲江詩尾有述上元二年作補注鶴曰詩云玉壘題書心緒亂當是上元二年自成都赴青城時作詩云悲君巳是十年流蓋自天寶十一載至今為十年近開寬法離新州想見歸懷尚百憂逐客雖皆萬里去洙曰秦議逐客李斯在逐客中上書秦王留斯為客卿趙曰謂之皆萬里則所逐非止杜耳悲君已是十年流洙曰流竄也干戈況復塵洙曰一作行隨眼鬢髮還應雪洙曰一作白滿頭玉壘題書心緒亂何時更得曲江游洙曰玉壘蜀之坊名也趙曰玉壘在青城縣也此詩公在青城縣因書寄之曲江在唐其游最盛題桃樹趙曰此非止因桃而題其所懷蓋含仁民愛物之心與夫遏亂喜治之意具詳於逐句下補注鶴曰梁權道謂永泰元年亂定後還成都作然蔡興宗魯訔年譜皆云是年四月嚴武卒五月公下渝忠未嘗再至成都則權道所編為非當是廣德二年自閬州歸成都時作故詩云天下車書正一家謂吐蕃與朝義之亂巳息小徑升堂舊不斜五株桃樹亦從遮髙秋總餧貧人實來歲還舒滿眼花趙曰言其至秋時書熟皆以分餧貧者以其不害來歲之花仍是滿眼則望復結實此其為仁民之心乎簾戶每宜通乳燕洙曰乳燕燕之雛也謝𤣥暉詩花叢亂數蝶風簾入雙燕兒童莫信打慈鴉洙曰鴉有慈孝之名以其授哺反哺也寡妻羣盜非今日天下車書正一家洙曰中庸天下車同軌書同文趙曰告羣盜以天下一家矣無妄動也非遏亂喜治之意乎後漢劉盆子天鳳元年琅邪海曲有吕母者子為縣吏宰以小罪殺之吕母怨宰傾家資密與客以報仇合衆至數千吕母自稱將軍執宰斬之羣盜之起由於吕母舍弟占歸草堂檢校聊示此詩廣德元年作補注鶴曰詩云頻為草堂回當是廣德元年避亂在梓閬時作梁權道以為永泰元年亂定後還成都時作然詩云東林竹影薄臘月更須栽若如梁權道編則其年冬公已在雲安無容更令臘月栽竹矣久客應吾道趙曰家語載孔孟陳蔡之厄曰吾道其非耶相隨獨爾來孰知江路近頻為草堂回鵝鴨宜長數柴荆莫浪開東林竹影薄臘月更須栽暮登四安寺鐘樓寄裴十四一作日補注鶴曰詩云暮倚南樓對雪峯又云近市浮烟翠且重當是永泰元年在溪上作暮倚南樓對雪峯僧來不語自鳴鐘孤城返照紅將斂洙曰夕陽謂之返照近市浮烟翠且重多病獨愁常閴寂趙曰易曰窺其戶閴其無人王弼注閴寂也故人相見未從容洙曰從容欵曲也天台賦任緩步之從容知君苦思緣詩瘦蘇曰崔浩愛吟詠一日病起友人戲之曰非子病如此乃子苦吟詩瘦也後為口實太向交游萬事慵洙曰李白有戲贈公詩云借問年來何瘦生只為從前作詩苦趙曰緣苦詩之故其在交游也萬事皆慵廢矣觀李固請司馬弟山水圖三首一云李七補注鶴曰詩云寒天留逺客碧海掛新圖意是廣德二年冬作簡易髙人意洙曰一作體敏功曰平易也楊子以簡以易匡牀竹火爐蘇曰張扶隱居太白山茅庵石鼎匡牀竹火爐藥壺而巳趙曰莊子騎姬與晉公同匡牀而食寒天留逺客碧海掛新圖雖對連山好貪看絶島孤羣仙不愁思冉冉下蓬壺洙曰蓬壺山名神仙所宅之地方丈渾連水天台總映雲洙曰方丈天台二仙山人間長見畫老去恨空聞范蠡舟偏小洙曰范蠡為越破吳功成名遂乃乘扁舟泛江湖變姓名適齊為鴟夷子王喬鶴不羣趙曰其圖必畫舟與鶴王喬事見昔游詩注此生隨萬物何處出塵氛洙曰莊子所謂與物轉徙也髙浪垂翻屋洙曰郭景純詩髙浪過蓬萊崩崖欲壓牀野橋洙曰一作樓分子細沙岸繞微茫紅浸珊瑚短青懸薜荔長浮查並坐得仙老暫相將散愁二首乾元二年作補注鶴曰此詩言及李光弼王思禮又云蜀星隂見少當是乾元二年初入蜀時作詩云聞道并州鎮尚書訓士齊蓋思禮以元年鎮太原上元元年加司空二年薨梁權道編在上元二年成都作若如梁編當云司空不但言尚書也詳見注久客宜旋斾蘇曰郭規久客塞上宜旋歸斾故園桃李想自成蹊鄉親時復入夢興王未息戈蜀星隂見少趙曰星以隂而見少江雨夜聞多百萬傳深入寰區望匪他司徒下燕趙收取舊山河趙曰望光弼之深也弼為檢校司空補注希曰百萬言師徒之衆如所謂號百萬與百萬之師者深入用孔明表中語光弼以乾元二年七月為朔方節度使兵馬元帥八月為幽州長吏河北節度以敗賊將留希德及收清夷橫野等軍加檢校司徒史又云光弼急攻趙一日拔之聞道并州鎮尚書訓士齊洙曰并州太原也時王思禮為帥補注鶴曰思禮以收東京戰數有功遷兵部尚書而舊史云遷戶部尚書乾元元年與子儀圍城相州軍潰惟李光弼思禮軍獨完尋破思明别將萬餘衆於直千嶺光弼徙河陽代為河東節度治太原持法嚴整士不敢犯幾時通薊北洙曰范陽盧龍等也皆安史巢穴當日報關西洙曰長安以西皆謂之關西戀闕丹心破蘇曰辛毗值此喪亂兵戈未定丹心復將破矣霑衣皓首啼老魂招不得歸路恐長迷至後廣德二年作補注鶴曰詩云逺在劒南思洛陽又云青袍白馬有何意當是廣德二年冬在嚴武幕中作冬至至後日初長洙曰周禮冬至日在牽牛影長一丈三尺趙曰漢時宫中繡工以線量日影冬至後添一線也逺在劒南思洛陽青袍白馬有何意洙曰公止服九品服爾金谷銅駝非故鄉洙曰金谷園銅駝陌皆蜀中故事鄭曰皆在漁陽師曰金谷園銅駝街皆不及故鄉之樂梅花欲開不自覺棣萼一别永相望洙曰棣萼言兄弟也愁極本憑詩遣興詩成吟詠轉淒涼蘇曰庾子山云本託詩遣興詩成反使旅思淒涼撥悶彥輔云一云贈嚴二别駕永泰元年作補注鶴曰梁權道謂在永泰元年亂定後還成都作然乘舟取雲安之酒以供醉辦錢防三老之直以下峽非成都所當用語當是永泰元年在忠渝作聞道雲安麴米春蘇曰退之詩且可勤買拋青春國史補酒有郢之富水鳥程之若下滎陽之土窟春富平之石凍春劒南之燒春子美聞道雲安麴米春裴鉶傳竒亦有酒名松醪春乃知唐名酒多以春才傾一酌即醺人乘舟取醉非難事下峽銷愁定幾巡長年三老洙曰舟師名遙憐汝師曰俗謂之翁蓋把柂者捩柂開頭洙曰一作鳴橈捷有神洙曰初行船曰開頭已辦青錢防雇直當令美味入吾脣一作身登髙新添年廣德元作補注鶴曰寶應元年廣德元年九月公皆在梓州以後篇論之此詩當是廣德元年作風急天髙猿嘯哀洙曰宋玉云天髙而氣清潘安仁徑風凄急渚清沙白鳥飛回無邊落木蕭蕭下洙曰江賦尋之無邊楚辭洞庭波兮木葉下又風颯颯兮木蕭蕭不盡長江衮衮來洙曰謂不舍晝夜也萬里悲秋常作客洙曰宋玉悲秋百年多病獨登臺洙曰相如多病卧於茂陵艱難苦恨繁霜鬢潦倒新亭濁酒杯洙曰嵇康曰酒一杯潦倒粗疏九日廣德元年作補注鶴曰詩云去年登髙郪縣北當是廣德元年作去年登髙郪縣北洙曰東蜀有郪縣今日重在涪江濵趙曰射洪之江也鄭曰寰宇記江龍在縣西二百里沈曰蜀有涪州以涪江得名補注鶴曰梓州治郪縣水經涪江水東南合射江射江在梓州而九域志以涪江𨽻合州然公未嘗至合州當是指涪水合於射江而言故梓亦有涪城縣苦遭白髮不相放羞見黃花無數新世亂鬱鬱久為客路難悠悠常傍人酒闌却憶十年事腸斷驪山清路塵洙曰憶明皇太平之時也不敢明指故致意驪山也蒼舒曰子美傷時憂憤發為辭章指陳得失莫不切至而此注謂其不敢明指嗚呼謬哉趙曰驪山在臨潼縣即明皇之華清宫也孫曰驪山明皇遊幸之地秋盡寶應元年作補注鶴曰詩云秋盡東行且未回謂寶應元年秋自梓歸迎家再往梓故云茅齊寄在少城隈當是其年作秋盡東行且未回茅齊寄在少城隈洙曰蜀之張儀城也趙曰公將往於東蜀矣姑寄草堂於成都也少城城內小城也補注鶴曰少城在成都張儀築李膺記云在大城西故曰少城籬邊老却陶潛菊洙曰陶潛詩采菊東籬下江上徒逢袁紹杯洙曰典略曰劉松袁紹於河朔三伏之際晝夜飲酒以避一時之暑故河朔間有避暑之飲雪嶺獨看西日落趙曰西山謂之雪嶺劒門猶阻洙曰一作斷北人來洙曰言京信尚阻補注鶴曰劒川有劒門縣是時吐蕃入寇正殷未幾陷京師而松維保川亦陷故云不辭萬里長為客懷抱何時得好開野望寶應元年作補注鶴曰詩云金華山北涪水西仲冬風日始淒淒山與水皆在射洪縣又云仲冬當是寶應元年十一月往射洪作同時有往射洪縣南途中有作南之通泉縣等詩金華山北洙曰一作南涪水西趙曰金華山涪水皆射洪縣也仲冬風日始淒淒山連越巂蟠三蜀水散巴渝下五溪鄭曰巂悉委切唐韻郡名十州志漢置越巂郡以𨽻三蜀洙曰東西兩川及梁謂之三蜀田曰左太冲賦注三蜀蜀郡廣漢犍為也洙曰越巂郡名也當南蠻之要李德裕置蜀日置屯以制蠻寇五溪蜀交址馬援征五溪蠻鄭曰巴渝二州十州記太清四年武陵王於巴陵置楚州隋改為渝州補注希曰舊史越巂漢郡名武帝置縣屬郡有越水巂水蜀郡本一漢髙帝置廣漢郡武帝又分置犍為郡故後人并蜀都謂之三蜀通典黔中謂之五溪注謂酉辰巫武沅等溪也獨鶴不知何事舞饑烏似欲向人啼射洪春酒寒仍緑目極傷神誰為攜老病大厯元年作補注鶴曰詩云老病巫山裏當是大厯元年䕫州作蓋是年春晚方自雲安遷䕫州今云巫山裏則尚在雲安也老病巫山裏稽留楚客中藥殘他日裹花發去年叢夜足霑沙雨春多逆水風合分雙賜筆趙曰漢官儀尚書令漢丞郎月給赤管大筆一雙公為尚書工部郎故感而有是句猶作一飄蓬洙曰見前注補注杜詩卷二十六
